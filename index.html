<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои тесты для повторения</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 10px 0 4px; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .card {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
    text-decoration: none; color: var(--text);
  }
  .card:active { transform: scale(0.99); }
  .card h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .card .meta { font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .progress-mini { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .progress-mini > div { height: 100%; background: var(--accent); }
  .progress-mini.done > div { background: var(--good); }
  /* Группы по статусу: длинный список не листать целиком, пройденные свёрнуты */
  details.group { margin-bottom: 14px; }
  details.group > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px; font-weight: 600; font-size: .95rem; color: var(--muted);
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: "▸"; margin-right: 8px; transition: transform .15s; }
  details.group[open] > summary::before { transform: rotate(90deg); }
  details.group > summary .title { flex: 1; color: var(--text); }
  details.group > summary .count {
    font-weight: 500; font-size: .8rem; border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px;
  }
  /* курс внутри группы: TSI DSP 1..8 — одна строка, раскрывается касанием */
  details.course { margin: 0 0 12px; border: 1px dashed var(--border); border-radius: 14px; padding: 0 10px; }
  details.course > summary { font-size: .9rem; padding: 12px 4px; }
  details.course[open] { padding-bottom: 2px; }
  .card.continue { border-color: var(--accent); }
  .card .kicker { font-size: .78rem; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .syncline { font-size: .82rem; color: var(--muted); margin: -12px 0 16px; cursor: pointer; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  button.btn {
    width: 100%; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600; margin-top: 10px;
  }
  button.btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .5; pointer-events: none; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80; --border: #e3e5ee; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Мои тесты для повторения</h1>
    <button class="iconbtn" id="syncBtn">☁️ Синхронизировать всё</button>
  </div>
  <div class="subtitle" id="subtitle">50 вопросов в каждом тесте · прогресс сохраняется на устройстве</div>
  <div class="syncline" id="syncLine"></div>
  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncMergeBtn">🔄 Синхронизировать (свежее побеждает)</button>
    <button class="btn secondary" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="config.js"></script>
<script src="progress.js"></script>
<script src="sync.js"></script>
<script>
  const TESTS = [
    ["probability_statistics", "Вероятность и статистика"],
    ["linear_algebra", "Линейная алгебра (матрицы, SVD)"],
    ["calculus", "Математический анализ"],
    ["computer_vision", "Основы Computer Vision"],
    ["world_models", "Теория World Models"],
    ["diffusers", "Библиотека diffusers"],
    ["python_numpy_matplotlib", "Python: NumPy и Matplotlib"],
    ["physical_chemistry", "Физическая химия"],
    ["electronics", "Основы электроники"],
    ["facial_emotion_recognition", "Распознавание эмоций по лицу"],
    ["first_impression", "Техники первого впечатления"],
    ["photography_exposure", "Выдержка в фотографии"],
    ["network_drivers", "Сетевые драйверы"],
    ["low_level_cpp", "Низкоуровневый C++"],
    ["assembly", "Ассемблер"],
    ["performance_optimization", "Оптимизация производительности"],
    ["iso_standards", "ISO стандарты"],
    ["tiktok_algorithm", "TikTok: алгоритмы рекомендаций"],
    ["visual_math", "Визуальная математика"],
    ["cpu_pipeline", "Конвейер команд и параллелизм (ILP)"],
    ["wifi7_rdkb", "Wi-Fi 7 в RDK-B: MLD, hostapd и драйвер"],
    ["yocto_bitbake_devtool", "Yocto, BitBake и devtool: рецепты и патчи"],
    ["linux_device_access", "Доступ к устройству: ssh, scp, tftp, tio"],
    ["dmcli_rdkb", "dmcli и TR-181: radio, SSID, BSSID"],
    ["wifi7_mlo", "MLO в Wi-Fi 7: линки, STR, EMLSR"],
    ["git_patches", "Git и патчи: format-patch, am, rebase"],
    ["mac_ip_bridges", "MAC, IP, интерфейсы и мосты: tcpdump и tshark"],
    ["rtlog_firmware", "RT-Logger и логи прошивки: сбор и декодирование"],
    ["shell_best_practices", "Shell best practices: POSIX sh, BitBake, ревью"],
    ["rdkb_yocto_arch", "Архитектура RDK-B: Yocto, слои, SDK, вендор"],
    ["is1_introduction", "TSI IS1: Введение в ИИ"],
    ["is1_machine_learning", "TSI IS1: Машинное обучение и метрики"],
    ["is1_neural_networks", "TSI IS1: Нейронные сети"],
    ["is1_evolutionary_algorithms", "TSI IS1: Эволюционные алгоритмы"],
    ["is1_artificial_agents", "TSI IS1: Искусственные агенты"],
    ["is1_responsible_ai", "TSI IS1: Responsible AI"],
    ["dsp_phase_types_and_tf_identification", "TSI DSP 1: Фаза и идентификация ЛДС"],
    ["dsp_generalised_correlation_method", "TSI DSP 2: Корреляционный метод"],
    ["dsp_inverse_tf_and_equalisation", "TSI DSP 3: Инверсия и эквализация"],
    ["dsp_identification_to_design_specification", "TSI DSP 4: От модели к спецификации"],
    ["dsp_fir_arbitrary_magnitude_approximation", "TSI DSP 5: FIR-аппроксимация АЧХ"],
    ["dsp_iir_prony_and_parametric_equalisers", "TSI DSP 6: IIR, Прони, эквалайзеры"],
    ["dsp_fir_phase_correctors_and_hilbert", "TSI DSP 7: FIR-корректоры и Гильберт"],
    ["dsp_iir_allpass_correctors_and_synthesis", "TSI DSP 8: All-pass и синтез ЛДС"],
    ["eye_in_hand_calibration", "Eye-in-hand калибровка сканера"],
    ["mda_matrices_determinants_transformations", "TSI Math 1: Матрицы и определители"],
    ["mda_slae_gauss_rank_flow_networks", "TSI Math 2: СЛАУ, Гаусс, сети потоков"],
    ["mda_linear_spaces_rank_matrix_decompositions", "TSI Math 3: Пространства и разложения"],
    ["mda_probability_events_combinatorics", "TSI Math 4: События и комбинаторика"],
    ["mda_conditional_probability_total_bayes", "TSI Math 5: Условная вероятность и Байес"],
    ["mda_discrete_random_variables_binomial_poisson", "TSI Math 6: Дискретные СВ, Бернулли, Пуассон"],
    ["mda_normal_distribution_de_moivre_laplace", "TSI Math 7: Нормальное распределение"],
    ["mda_derivatives_integrals_extrema", "TSI Math 8: Производные и интегралы"],
    ["mda_functions_several_variables_optimization", "TSI Math 9: Функции нескольких переменных"],
    ["rcf_control_basics_modelling_block_diagrams", "TSI RCF 1: Основы ТАУ и моделирование"],
    ["rcf_time_response_standard_links_frequency", "TSI RCF 2: Звенья и частотные характеристики"],
    ["rcf_stability_routh_nyquist_bode_root_locus", "TSI RCF 3: Устойчивость"],
    ["rcf_control_quality_steady_state_robustness", "TSI RCF 4: Качество и точность"],
    ["rcf_pid_control_tuning_advanced_structures", "TSI RCF 5: PID и настройка"],
    ["rcf_digital_control_sampling_z_domain", "TSI RCF 6: Цифровое управление"],
    ["rcf_sensors_signal_conditioning_control_paradigms", "TSI RCF 7: Датчики и парадигмы управления"],
    ["robotics_modelling_kinematics_dynamics_trajectories", "TSI RMO: Моделирование роботов"],
    ["trends_challenges_critical_reading_and_research_gaps", "TSI TRC: Тренды и research gap"]
  ];

  const list = document.getElementById("list");
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  document.getElementById("subtitle").textContent =
    TESTS.length + " " + plural(TESTS.length, "тест", "теста", "тестов") +
    " · 50 вопросов в каждом · прогресс сохраняется на устройстве";

  const SIMS = [
    ["assembly", "Ассемблер: визуализатор регистров и стека"],
    ["calculus", "Матанализ: лаборатория производной"],
    ["computer_vision", "Computer Vision: лаборатория свёртки"],
    ["diffusers", "Diffusers: лаборатория диффузии"],
    ["electronics", "Электроника: лаборатория цепи"],
    ["facial_emotion_recognition", "Эмоции: детектив мимики"],
    ["first_impression", "Первое впечатление: интервью-квест"],
    ["iso_standards", "ISO: симулятор сертификации"],
    ["linear_algebra", "Линейная алгебра: лаборатория преобразований"],
    ["low_level_cpp", "C++: визуализатор стека и кучи"],
    ["network_drivers", "Сетевые драйверы: кольцевой буфер"],
    ["performance_optimization", "Оптимизация: визуализатор профиля"],
    ["photography_exposure", "Фотография: лаборатория экспозиции"],
    ["physical_chemistry", "Физическая химия: лаборатория реакции"],
    ["probability_statistics", "Вероятность: доска Гальтона"],
    ["python_numpy_matplotlib", "NumPy: лаборатория broadcasting"],
    ["tiktok_algorithm", "TikTok: симулятор автора"],
    ["visual_math", "Визуальная математика: градиентный спуск"],
    ["world_models", "World Models: лаборатория прогноза"],
    ["yocto_bitbake_devtool", "devtool: рецепт, патчи и исходники"]
  ];

  // Группы сверху вниз. open(b) — раскрыта ли по умолчанию; раскрыл или свернул
  // вручную — запоминается и дальше главнее умолчания.
  const GROUPS = [
    { key: "review", title: "Пора повторить", open: () => true },
    { key: "progress", title: "В процессе", open: () => true },
    { key: "mistakes", title: "Работа над ошибками", open: () => false },
    // сама открыта, только когда больше нечем заняться, иначе это снова лента
    { key: "todo", title: "Не начаты", open: (b) => !b.progress.length && !b.review.length },
    { key: "done", title: "Выполнены", open: () => false },
    { key: "labs", title: "Лаборатории", open: () => false },
  ];
  // Не "learntest_": sync.js отправляет в Drive каждый ключ с этим префиксом как тест.
  const OPEN_KEY = "ltindex_open";
  function loadOpen() {
    try { return JSON.parse(localStorage.getItem(OPEN_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveOpen(key, isOpen) {
    const open = loadOpen();
    open[key] = isOpen;
    try { localStorage.setItem(OPEN_KEY, JSON.stringify(open)); } catch (e) {}
  }
  function loadTest(slug) {
    try { return JSON.parse(localStorage.getItem("learntest_" + slug)); } catch (e) { return null; }
  }
  function fmtDate(ms) {
    return new Date(ms).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  }

  function testCard(slug, title, state, kind) {
    const total = LTProgress.TOTAL;
    const current = state ? (state.current || 0) : 0;
    const done = LTProgress.isDone(state);
    const pct = done ? 100 : Math.round((Math.min(current, total) / total) * 100);
    let href = "tests/" + slug + ".html";
    let label;
    if (kind === "review") {
      href += "?mode=review";
      const due = LTProgress.reviewDue(state);
      label = "Повторить " + LTProgress.REVIEW_SIZE + " вопросов · " + (due === 0 ? "дата прохождения неизвестна" : "срок был " + fmtDate(due));
    } else if (kind === "mistakes") {
      href += "?mode=mistakes";
      label = "Ошибок к исправлению: " + LTProgress.mistakes(state).length;
    } else if (done) {
      label = "Завершено: " + LTProgress.correctCount(state) + "/" + total;
    } else {
      label = LTProgress.answeredCount(state) > 0 ? ("Пройдено " + current + "/" + total) : "Не начато";
    }
    const a = document.createElement("a");
    a.className = "card";
    a.href = href;
    a.innerHTML =
      '<h2>' + title + '</h2>' +
      '<div class="meta"><span>' + label + '</span><span>' + (kind === "mistakes" || kind === "review" ? "" : pct + '%') + '</span></div>' +
      (kind === "mistakes" || kind === "review" ? "" :
        '<div class="progress-mini' + (done ? ' done' : '') + '"><div style="width:' + pct + '%"></div></div>');
    return a;
  }

  function simCard(slug, title) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "sims/" + slug + ".html";
    a.innerHTML = '<h2>🔬 ' + title + '</h2>';
    return a;
  }

  function section(key, title, nodes, defaultOpen, cls) {
    const remembered = loadOpen();
    const details = document.createElement("details");
    details.className = cls;
    details.dataset.group = key;
    details.open = key in remembered ? !!remembered[key] : defaultOpen;
    const summary = document.createElement("summary");
    summary.innerHTML = '<span class="title">' + title + '</span><span class="count">' + nodes.length + '</span>';
    details.appendChild(summary);
    nodes.forEach(n => details.appendChild(n));
    details.addEventListener("toggle", () => saveOpen(key, details.open));
    return details;
  }

  // Курсы TSI из двух и больше тестов в одной группе сворачиваются в одну строку.
  function withCourses(groupKey, items) {
    const byCourse = {};
    items.forEach(it => {
      const c = LTProgress.courseOf(it.title);
      if (c) (byCourse[c] = byCourse[c] || []).push(it);
    });
    const out = [], placed = {};
    items.forEach(it => {
      const c = LTProgress.courseOf(it.title);
      if (!c || byCourse[c].length < 2) { out.push(it.el); return; }
      if (placed[c]) return;
      placed[c] = true;
      out.push(section(groupKey + ":" + c, c, byCourse[c].map(x => x.el), false, "course"));
    });
    return out;
  }

  // «Продолжить»: последний открытый тест, если он не пройден; иначе самый
  // свежий из начатых. Тест сам открывается на state.current — нужном вопросе.
  function continueCard() {
    const titles = {};
    TESTS.forEach(([slug, title]) => { titles[slug] = title; });
    let last = null;
    try { last = JSON.parse(localStorage.getItem("ltindex_last")); } catch (e) {}
    let pick = null;
    if (last && titles[last.slug] && LTProgress.status(loadTest(last.slug)) === "progress") pick = last.slug;
    if (!pick) {
      let best = -1;
      TESTS.forEach(([slug]) => {
        const s = loadTest(slug);
        if (LTProgress.status(s) === "progress" && (s.updatedAt || 0) > best) { best = s.updatedAt || 0; pick = slug; }
      });
    }
    if (!pick) return null;
    const s = loadTest(pick);
    const a = document.createElement("a");
    a.className = "card continue";
    a.href = "tests/" + pick + ".html";
    a.innerHTML = '<div class="kicker">▶ Продолжить</div><h2>' + titles[pick] + '</h2>' +
      '<div class="meta"><span>Вопрос ' + Math.min((s.current || 0) + 1, LTProgress.TOTAL) + ' из ' + LTProgress.TOTAL + '</span></div>';
    return a;
  }

  function renderList() {
    list.innerHTML = "";
    const now = Date.now();
    const buckets = { review: [], progress: [], mistakes: [], todo: [], done: [], labs: [] };
    TESTS.forEach(([slug, title]) => {
      const state = loadTest(slug);
      const st = LTProgress.status(state);
      // Пройденный, которому пора на повторение, стоит только в «Пора повторить».
      if (st === "done" && LTProgress.isReviewDue(state, now)) buckets.review.push({ title, el: testCard(slug, title, state, "review") });
      else buckets[st].push({ title, el: testCard(slug, title, state, st) });
      if (LTProgress.mistakes(state).length) buckets.mistakes.push({ title, el: testCard(slug, title, state, "mistakes") });
    });
    SIMS.forEach(([slug, title]) => buckets.labs.push({ title, el: simCard(slug, title) }));

    const cont = continueCard();
    if (cont) list.appendChild(cont);
    GROUPS.forEach(group => {
      const items = buckets[group.key];
      if (!items.length) return;
      const details = section(group.key, group.title, withCourses(group.key, items), group.open(buckets), "group");
      // счётчик группы — тесты, а не строки курсов
      details.querySelector(".count").textContent = items.length;
      list.appendChild(details);
    });
  }
  renderList();

  // ---- Синхронизация всех тестов ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }
  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy;
    downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  // ---- Синхронизация без кнопок ----
  // Пока Google-токен жив (~час после любого входа), главная сливает прогресс сама
  // при открытии, а страницы тестов тихо отправляют ответы. Истёк — строка под
  // заголовком становится одним касанием: окно входа без касания браузер блокирует.
  const syncLine = document.getElementById("syncLine");
  function syncReport(s) {
    const t = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    syncLine.textContent = "☁️ Синхронизировано в " + t +
      (s.pulled || s.pushed ? " · получено " + s.pulled + ", отправлено " + s.pushed : " · всё совпадает") +
      (s.failed ? " · ошибок " + s.failed : "");
  }
  function runSync(interactive) {
    syncLine.textContent = "☁️ Синхронизация…";
    LTSync.syncAll({
      interactive: interactive,
      onDone: (s) => { syncReport(s); if (s.pulled) renderList(); },
      onError: (msg) => {
        syncLine.textContent = msg === "no-token"
          ? "☁️ Синхронизация выключена — коснись, чтобы включить на час"
          : "☁️ " + msg + " — коснись, чтобы повторить";
      }
    });
  }
  if (window.LTSync && LTSync.configured()) {
    syncLine.addEventListener("click", () => runSync(true));
    runSync(false);
  }

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        renderList();
        syncReport(s);
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncStatus.textContent = "Готово.";
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        renderList();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncStatus.textContent = "Готово.";
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
</script>
</body>
</html>
