<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="30" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">Один биквад — две структуры</text><text x="120" y="78" font-size="18" fill="#2f6fde" text-anchor="middle" font-weight="600">форма I</text><rect x="16" y="95" width="208" height="110" rx="10" fill="#ffffff" stroke="#8a90a2" stroke-width="2" stroke-dasharray="6 5"/><text x="120" y="156.5" font-size="18" fill="#1f2430" text-anchor="middle"></text><text x="120" y="160" font-size="22" fill="#8a90a2" text-anchor="middle">z⁻¹  ?</text><text x="360" y="78" font-size="18" fill="#e0782b" text-anchor="middle" font-weight="600">форма II</text><rect x="256" y="95" width="208" height="110" rx="10" fill="#ffffff" stroke="#8a90a2" stroke-width="2" stroke-dasharray="6 5"/><text x="360" y="156.5" font-size="18" fill="#1f2430" text-anchor="middle"></text><text x="360" y="160" font-size="22" fill="#8a90a2" text-anchor="middle">z⁻¹  ?</text><text x="240" y="245" font-size="16" fill="#1f2430" text-anchor="middle">x[n] → … → y[n]</text><text x="240" y="276" font-size="16" fill="#8a90a2" text-anchor="middle">память: сколько линий задержки?</text><circle r="6" fill="#e0782b"><animateMotion dur="2.5s" begin="0.0s" repeatCount="indefinite" path="M30,150 L200,150"/></circle><circle r="6" fill="#e0782b"><animateMotion dur="2.5s" begin="0.5s" repeatCount="indefinite" path="M270,150 L450,150"/></circle></g></svg>
