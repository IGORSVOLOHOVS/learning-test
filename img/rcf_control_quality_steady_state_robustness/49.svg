<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect x="16" y="50" width="14" height="150" rx="2" fill="#cfd4e4" stroke="#1f2430" stroke-width="2"/><rect x="250" y="70" width="110" height="80" rx="6" fill="#eef1f8" stroke="#1f2430" stroke-width="3"/><text x="305" y="118" font-size="24" fill="#1f2430" text-anchor="middle" font-weight="bold">J</text><path d="M30,92 L54,92 L64.8,78 L86.2,106 L107.8,78 L129.2,106 L150.8,78 L172.2,106 L193.8,78 L215.2,106 L226,92 L250,92" fill="none" stroke="#2f6fde" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="64" font-size="22" fill="#2f6fde" text-anchor="middle" font-weight="bold">K</text><line x1="30" y1="130" x2="120" y2="130" stroke="#e0782b" stroke-width="3" stroke-linecap="round"/><rect x="120" y="118" width="60" height="24" rx="2" fill="#ffffff" stroke="#e0782b" stroke-width="3"/><line x1="150" y1="130" x2="250" y2="130" stroke="#e0782b" stroke-width="3" stroke-linecap="round"/><text x="150" y="166" font-size="22" fill="#e0782b" text-anchor="middle" font-weight="bold">B</text><rect x="20" y="218" width="220" height="40" rx="10" fill="#eef1f8"/><text x="130" y="244.5" font-size="18" fill="#1f2430" text-anchor="middle">J·s² + B·s + K = 0</text><rect x="256" y="218" width="210" height="40" rx="10" fill="#eef1f8"/><text x="361" y="244.5" font-size="18" fill="#1f2430" text-anchor="middle">J = 2 → 4 кг·м²</text><text x="240" y="284" font-size="16" fill="#8a90a2" text-anchor="middle">B = 8,  K = 32 — не меняются</text><text x="372" y="118" font-size="18" fill="#d64545">J ×2?</text></g></svg>
