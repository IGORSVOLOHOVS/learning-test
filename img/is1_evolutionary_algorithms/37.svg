<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="28" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">Символьная регрессия, цель x² + x + 1</text><rect x="40" y="50" width="220" height="36" rx="4" fill="#2f6fde" stroke="#ffffff" stroke-width="2"/><text x="150" y="74" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">особь, поколение 0</text><rect x="260" y="50" width="180" height="36" rx="4" fill="#2f6fde" stroke="#ffffff" stroke-width="2"/><text x="350" y="74" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">сумма |ошибок|</text><rect x="40" y="88" width="220" height="38" rx="0" fill="#eef1f8" stroke="#8a90a2" stroke-width="2"/><text x="150" y="114" font-size="18" fill="#1f2430" text-anchor="middle">x + 1</text><rect x="260" y="88" width="180" height="38" rx="0" fill="#eef1f8" stroke="#8a90a2" stroke-width="2"/><text x="350" y="114" font-size="18" fill="#1f2430" text-anchor="middle">0.67</text><rect x="40" y="126" width="220" height="38" rx="0" fill="#ffffff" stroke="#8a90a2" stroke-width="2"/><text x="150" y="152" font-size="18" fill="#1f2430" text-anchor="middle">x² + 1</text><rect x="260" y="126" width="180" height="38" rx="0" fill="#ffffff" stroke="#8a90a2" stroke-width="2"/><text x="350" y="152" font-size="18" fill="#1f2430" text-anchor="middle">1.00</text><rect x="40" y="164" width="220" height="38" rx="0" fill="#eef1f8" stroke="#8a90a2" stroke-width="2"/><text x="150" y="190" font-size="18" fill="#1f2430" text-anchor="middle">2</text><rect x="260" y="164" width="180" height="38" rx="0" fill="#eef1f8" stroke="#8a90a2" stroke-width="2"/><text x="350" y="190" font-size="18" fill="#1f2430" text-anchor="middle">1.70</text><rect x="40" y="202" width="220" height="38" rx="0" fill="#ffffff" stroke="#8a90a2" stroke-width="2"/><text x="150" y="228" font-size="18" fill="#1f2430" text-anchor="middle">x</text><rect x="260" y="202" width="180" height="38" rx="0" fill="#ffffff" stroke="#8a90a2" stroke-width="2"/><text x="350" y="228" font-size="18" fill="#1f2430" text-anchor="middle">2.67</text><text x="240" y="258" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">останов при ошибке &lt; 0.1</text><text x="240" y="286" font-size="18" fill="#e0782b" text-anchor="middle" font-weight="700">что дальше?</text></g></svg>
