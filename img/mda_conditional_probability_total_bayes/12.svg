<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="30" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">P(A) &gt; 0 и P(B) &gt; 0</text><circle cx="70" cy="140" r="44" fill="#eef1f8" stroke="#2f6fde" stroke-width="2.5"/><circle cx="410" cy="140" r="44" fill="#eef1f8" stroke="#e0782b" stroke-width="2.5"/><text x="70" y="148" font-size="24" fill="#2f6fde" text-anchor="middle" font-weight="700">A</text><text x="410" y="148" font-size="24" fill="#e0782b" text-anchor="middle" font-weight="700">B</text><text x="240" y="124" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">независимы</text><text x="240" y="152" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">и несовместны</text><text x="240" y="186" font-size="18" fill="#1f2430" text-anchor="middle">одновременно?</text><text x="240" y="262" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">может ли так быть?</text></g></svg>
