<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#2f6fde"/></marker></defs><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="40" font-size="18" fill="#8a90a2" text-anchor="middle">Параллельная форма</text><rect x="30" y="52" width="420" height="54" rx="10" fill="#eef1f8" stroke="#1f2430" stroke-width="2.5"/><text x="240" y="87" font-size="22" fill="#1f2430" text-anchor="middle">C(s) = Kp + Ki/s + Kd·s</text><line x1="240" y1="116" x2="240" y2="160" stroke="#2f6fde" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mb)"/><text x="256" y="145" font-size="18" fill="#2f6fde">ISA-запись</text><rect x="30" y="172" width="420" height="54" rx="10" fill="#eef1f8" stroke="#1f2430" stroke-width="2.5"/><text x="240" y="207" font-size="22" fill="#1f2430" text-anchor="middle">C(s) = Kp (1 + 1/(? · s) + ? · s)</text><text x="240" y="262" font-size="16" fill="#8a90a2" text-anchor="middle">Ki и Kd заменяются двумя другими параметрами</text></g></svg>
