<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="28" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">Характеристический полином</text><text x="240" y="70" font-size="22" fill="#1f2430" text-anchor="middle">a<tspan dy="5" font-size="16">n</tspan>sⁿ + … + a<tspan dy="5" font-size="16">1</tspan>s + a<tspan dy="5" font-size="16">0</tspan> = 0</text><circle cx="240" cy="180" r="82" fill="#eef1f8" stroke="#2f6fde" stroke-width="3"/><circle cx="240" cy="205" r="38" fill="#fbe8d8" stroke="#e0782b" stroke-width="3"/><text x="240" y="133" font-size="18" fill="#2f6fde" text-anchor="middle" font-weight="600">условие ?</text><text x="240" y="203" font-size="16" fill="#1f2430" text-anchor="middle">система</text><text x="240" y="222" font-size="16" fill="#1f2430" text-anchor="middle">устойчива</text><text x="240" y="289" font-size="16" fill="#8a90a2" text-anchor="middle">необходимое, но не достаточное</text></g></svg>
