<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#1f2430"/></marker></defs><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="28" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="600">Плоскость полюсов s = σ + jω</text><rect x="40" y="54" width="200" height="196" rx="0" fill="#eef1f8"/><rect x="240" y="54" width="200" height="196" rx="0" fill="#f7f8fc"/><line x1="40" y1="152" x2="440" y2="152" stroke="#1f2430" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mk)"/><line x1="240" y1="250" x2="240" y2="54" stroke="#1f2430" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mk)"/><text x="438" y="174" font-size="16" fill="#1f2430" text-anchor="end">σ</text><text x="248" y="62" font-size="16" fill="#1f2430">jω</text><text x="140" y="238" font-size="16" fill="#8a90a2" text-anchor="middle">левая</text><text x="340" y="238" font-size="16" fill="#8a90a2" text-anchor="middle">правая</text><text x="140" y="122" font-size="16" fill="#8a90a2" text-anchor="middle">Re s &lt; 0</text><text x="340" y="122" font-size="16" fill="#8a90a2" text-anchor="middle">Re s &gt; 0</text><circle cx="240" cy="152" r="3.5" fill="#1f2430"/><text x="232" y="172" font-size="16" fill="#1f2430" text-anchor="end">0</text><text x="254" y="94" font-size="34" fill="#e0782b" font-weight="700">?</text><text x="240" y="285" font-size="16" fill="#8a90a2" text-anchor="middle">Где должны лежать полюсы замкнутой системы?</text></g></svg>
