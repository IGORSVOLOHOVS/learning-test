<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="30" font-size="18" fill="#8a90a2" text-anchor="middle">характеристическое уравнение 2×2</text><text x="78" y="97.9" font-size="22" fill="#1f2430" text-anchor="middle">a</text><text x="122" y="97.9" font-size="22" fill="#1f2430" text-anchor="middle">b</text><text x="78" y="127.9" font-size="22" fill="#1f2430" text-anchor="middle">c</text><text x="122" y="127.9" font-size="22" fill="#1f2430" text-anchor="middle">d</text><path d="M61,77 H52 V133 H61" fill="none" stroke="#1f2430" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M139,77 H148 V133 H139" fill="none" stroke="#1f2430" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="98" font-size="20" fill="#1f2430">tr A = a + d</text><text x="215" y="135" font-size="20" fill="#1f2430">det A = ad − bc</text><rect x="30" y="190" width="420" height="70" rx="12" fill="#eef1f8"/><text x="240" y="234" font-size="22" fill="#1f2430" text-anchor="middle">λ² <tspan fill="#e0782b" font-weight="700">?</tspan> tr(A)·λ <tspan fill="#e0782b" font-weight="700">?</tspan> det(A) = 0</text><rect x="205" y="76" width="170" height="30" rx="8" fill="#e0782b" opacity="0"><animate attributeName="opacity" values="0;0.3;0.3;0;0" keyTimes="0;0.06;0.22;0.3;1" dur="6.0s" begin="0.4s" repeatCount="indefinite"/></rect><rect x="205" y="113" width="210" height="30" rx="8" fill="#e0782b" opacity="0"><animate attributeName="opacity" values="0;0.3;0.3;0;0" keyTimes="0;0.06;0.22;0.3;1" dur="6.0s" begin="1.8s" repeatCount="indefinite"/></rect><rect x="30" y="190" width="420" height="70" rx="12" fill="#e0782b" opacity="0"><animate attributeName="opacity" values="0;0.3;0.3;0;0" keyTimes="0;0.06;0.22;0.3;1" dur="6.0s" begin="3.2s" repeatCount="indefinite"/></rect></g></svg>
