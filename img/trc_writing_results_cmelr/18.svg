<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="28" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Числа в тексте обзора</text><rect x="20" y="50" width="440" height="96" rx="12" fill="#eef1f8"/><text x="240" y="78" font-size="18" fill="#1f2430" text-anchor="middle">… studies reported power, but only</text><text x="240" y="110" font-size="18" fill="#1f2430" text-anchor="middle">… measured it on the board.</text><rect x="40" y="170" width="120" height="100" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="2.5"/><text x="100" y="218" font-size="34" fill="#2f6fde" text-anchor="middle" font-weight="bold">18</text><text x="100" y="252" font-size="17" fill="#8a90a2" text-anchor="middle">сообщили</text><rect x="182" y="170" width="120" height="100" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="2.5"/><text x="242" y="218" font-size="34" fill="#2f6fde" text-anchor="middle" font-weight="bold">56</text><text x="242" y="252" font-size="17" fill="#8a90a2" text-anchor="middle">всего</text><rect x="324" y="170" width="120" height="100" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="2.5"/><text x="384" y="218" font-size="34" fill="#2f6fde" text-anchor="middle" font-weight="bold">2</text><text x="384" y="252" font-size="17" fill="#8a90a2" text-anchor="middle">измерили</text></g></svg>
