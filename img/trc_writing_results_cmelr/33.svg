<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#1f2430"/></marker></defs><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="240" y="28" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="bold">Gou2023, с. 17</text><rect x="20" y="44" width="440" height="128" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="2.5"/><text x="36" y="72" font-size="16" fill="#8a90a2">цитата:</text><text x="240" y="98" font-size="17" fill="#1f2430" text-anchor="middle">«… just meets the 'real-time' requirement,</text><text x="240" y="124" font-size="17" fill="#1f2430" text-anchor="middle">i.e., a frame rate of 30 Hz … impossible</text><text x="240" y="150" font-size="17" fill="#1f2430" text-anchor="middle">to … perform … path planning»</text><line x1="240" y1="176" x2="240" y2="212" stroke="#1f2430" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mk)"/><rect x="90" y="218" width="300" height="56" rx="10" fill="#fdeede" stroke="#e0782b" stroke-width="2" stroke-dasharray="6 4"/><text x="240" y="252.1" font-size="17" fill="#e0782b" text-anchor="middle" font-weight="bold">пересказ (paraphrase): какой?</text></g></svg>
