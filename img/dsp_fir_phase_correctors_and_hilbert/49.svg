<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#1f2430"/></marker></defs><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><text x="150" y="36" font-size="16" fill="#8a90a2" text-anchor="middle">схема обозначений, значения условные</text><line x1="30" y1="100" x2="280" y2="100" stroke="#1f2430" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mk)"/><line x1="44" y1="220" x2="44" y2="60" stroke="#1f2430" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#mk)"/><text x="280" y="124" font-size="16" fill="#1f2430" text-anchor="end">ω</text><line x1="44" y1="100" x2="262" y2="208" stroke="#e0782b" stroke-width="3.5" stroke-linecap="round"/><text x="130" y="172" font-size="18" fill="#e0782b">θ(ω) = −α·ω</text><text x="52" y="76" font-size="18" fill="#1f2430">θ</text><rect x="300" y="66" width="172" height="140" rx="8" fill="#ffffff" stroke="#8a90a2" stroke-width="2" stroke-dasharray="5 4"/><text x="310" y="88" font-size="16" fill="#8a90a2">дано</text><text x="310" y="114" font-size="16" fill="#1f2430">N = 41 отвод</text><text x="310" y="138" font-size="16" fill="#1f2430">α = (N−1)/2</text><text x="310" y="162" font-size="16" fill="#1f2430">fs = 20 000 Гц</text><text x="310" y="192" font-size="18" fill="#1f2430" font-weight="bold">τ = ? мс</text><text x="240" y="270" font-size="16" fill="#8a90a2" text-anchor="middle">линейно-фазовый FIR-корректор</text></g></svg>
