<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect x="20" y="28" width="280" height="160" rx="12" fill="#f6f8fc" stroke="#8a90a2" stroke-width="2"/><text x="32" y="57.6" font-size="16" fill="#1f2430" font-family="Consolas, ui-monospace, Menlo, monospace">def Ry(t):</text><text x="32" y="84.6" font-size="16" fill="#1f2430" font-family="Consolas, ui-monospace, Menlo, monospace">  c, s = cos(t), sin(t)</text><text x="32" y="111.6" font-size="16" fill="#1f2430" font-family="Consolas, ui-monospace, Menlo, monospace">  return [[ c, 0,-s],</text><text x="32" y="138.6" font-size="16" fill="#1f2430" font-family="Consolas, ui-monospace, Menlo, monospace">          [ 0, 1, 0],</text><text x="32" y="165.6" font-size="16" fill="#1f2430" font-family="Consolas, ui-monospace, Menlo, monospace">          [ s, 0, c]]</text><text x="385" y="56.3" font-size="18" fill="#8a90a2" text-anchor="middle">тесты</text><rect x="315" y="70" width="150" height="42" rx="10" fill="#e8f6ee" stroke="#2a9d63" stroke-width="2"/><text x="390" y="97" font-size="17" fill="#1f2430" text-anchor="middle">det = +1  ✓</text><rect x="315" y="122" width="150" height="42" rx="10" fill="#e8f6ee" stroke="#2a9d63" stroke-width="2"/><text x="390" y="148.9" font-size="17" fill="#1f2430" text-anchor="middle">RᵀR = I  ✓</text><rect x="60" y="215" width="360" height="60" rx="12" fill="#fff7ef" stroke="#e0782b" stroke-width="2"/><text x="240" y="243.3" font-size="18" fill="#1f2430" text-anchor="middle">ошибка уцелела — почему?</text><text x="240" y="268.3" font-size="18" fill="#e0782b" text-anchor="middle">как её поймать?</text></g></svg>
