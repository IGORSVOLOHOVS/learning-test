<!DOCTYPE html>

<head>

<title>MLO в Wi-Fi 7: линки, STR, EMLSR</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {

    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }

  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;

  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }

    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
  }
</style>
</head>

е, описывающего соседние линки", "Он получает адреса линков от контроллера сети оператора", "Он запрашивает список линков после установления ассоциации", "Он последовательно сканирует все диапазоны и сопоставляет имена"], "correct": 0, "explain": "Маяк на одном канале описывает линки на других, включая их канал и адрес. Без этого клиенту пришлось бы сканировать 6 ГГц целиком, а это долго.", "usage": {"code": true, "without": "Клиент сканирует весь диапазон 6 ГГц и подключается медленно.", "with": "# Reduced Neighbor Report в маяке 5 ГГц указывает на линк 6 ГГц", "benefit": "Подключение к 6 ГГц происходит быстро и адресно."}}, {"q": "Что произойдёт с сессией, если один из линков MLD полностью пропадёт?", "options": ["Ассоциация сохранится, трафик пойдёт по оставшимся линкам", "Клиент автоматически перейдёт к другой точке доступа рядом", "Трафик приостановится до восстановления пропавшего линка", "Ассоциация разорвётся и клиент переподключится заново"], "correct": 0, "explain": "Ассоциация принадлежит MLD, а не линку. Потеря одного линка — это потеря части полосы, но не потеря соединения, и приложение этого не замечает.", "usage": {"code": true, "without": "Помеха на одном канале обрывает соединение целиком.", "with": "# линк 6 ГГц пропал -> трафик идёт по 5 ГГц, сессия жива", "benefit": "Отказ одного канала не виден пользователю."}}, {"q": "Что означает режим STR в многолинковой работе?", "options": ["Устройство синхронизирует передачу по линкам общим тактом", "Устройство выбирает один линк и держит остальные в резерве", "Устройство передаёт по всем линкам строго последовательно", "Устройство передаёт и принимает по разным линкам одновременно"], "correct": 3, "explain": "Simultaneous Transmit and Receive — полноценная одновременность. Требует хорошей развязки между радиомодулями, поэтому встречается там, где диапазоны разнесены.", "usage": {"code": true, "without": "Второй радиомодуль простаивает, пока работает первый.", "with": "# STR: передача на 5 ГГц и приём на 6 ГГц одновременно", "benefit": "Оба линка работают параллельно и полоса складывается."}}, {"q": "Почему режим NSTR накладывает ограничения на одновременную работу?", "options": ["Стандарт запрещает одновременную работу в соседних диапазонах", "Передача на одном линке зашумляет приём на другом внутри устройства", "Клиент экономит энергию и намеренно отключает второй линк", "Точка доступа не успевает обслуживать два линка одновременно"], "correct": 1, "explain": "Проблема физическая: антенны рядом, и собственный передатчик глушит собственный приёмник. Поэтому в NSTR операции по линкам приходится согласовывать по времени.", "usage": {"code": true, "without": "От устройства ждут сложения полос, а оно работает по очереди.", "with": "# NSTR: 5 ГГц и 6 ГГц слишком близко, нужна синхронизация", "benefit": "Ожидания по скорости соответствуют режиму работы."}}, {"q": "В какой паре диапазонов режим NSTR встречается чаще всего?", "options": ["Режим не зависит от диапазонов и определяется только антеннами", "В паре 2,4 и 6 ГГц, из-за кратности их несущих частот", "В паре 2,4 и 5 ГГц, потому что они дальше всего разнесены", "В паре 5 и 6 ГГц, потому что они соседствуют по частоте"], "correct": 3, "explain": "Чем ближе частоты, тем труднее развязать приём и передачу. 5 и 6 ГГц соседствуют, поэтому именно эта пара чаще оказывается ограниченной.", "usage": {"code": true, "without": "Планируют сложение полос там, где физика этого не позволяет.", "with": "# 2.4 + 6 ГГц: разнесены, обычно STR\n# 5 + 6 ГГц: рядом, часто NSTR", "benefit": "Пара диапазонов выбирается с учётом развязки."}}, {"q": "Что такое EMLSR в контексте многолинковости?", "options": ["Режим, в котором клиент передаёт по всем линкам одновременно", "Режим, в котором клиент слушает несколько линков, а передаёт по одному", "Режим сжатия заголовков кадров для экономии эфирного времени", "Режим быстрого перехода между точками доступа без разрыва"], "correct": 1, "explain": "Компромисс для клиентов с одним полноценным радиотрактом: слушать дёшево, передавать дорого. Устройство ловит начало обмена на любом линке и разворачивает передачу именно там.", "usage": {"code": true, "without": "Клиент с одним трактом вынужден выбрать один линк заранее.", "with": "# слушает 5 и 6 ГГц, передаёт по тому, где начался обмен", "benefit": "Выигрыш по задержке без второго полного радиотракта."}}, {"q": "Какую задачу решает EMLSR для телефона с ограниченным питанием?", "options": ["Увеличивает пиковую скорость вдвое при том же потреблении", "Позволяет полностью отключить один из радиомодулей навсегда", "Даёт выигрыш по задержке без содержания двух полных трактов", "Снижает мощность передатчика за счёт выбора ближнего линка"], "correct": 2, "explain": "Пиковую скорость EMLSR не удваивает: передача всё равно идёт по одному линку. Выигрыш в том, что не нужно ждать освобождения конкретного канала.", "usage": {"code": true, "without": "Ради низкой задержки телефон держит два тракта и греется.", "with": "# EMLSR: выигрыш по задержке, а не по пиковой скорости", "benefit": "Задержка падает без роста потребления."}}, {"q": "Что задаёт механизм TID-to-Link Mapping?", "options": ["Приоритет клиентов при конкуренции за эфирное время точки", "Порядок применения ключей шифрования к разным линкам", "Правила перехода клиента между соседними точками доступа", "Соответствие классов трафика конкретным линкам устройства"], "correct": 3, "explain": "Позволяет развести трафик: голос и игры на быстрый и чистый линк, загрузки на другой. Без этого распределение остаётся на усмотрение реализации.", "usage": {"code": true, "without": "Крупная загрузка и видеозвонок конкурируют за один канал.", "with": "# TID 6 (голос) -> линк 6 ГГц\n# TID 0 (фон)   -> линк 5 ГГц", "benefit": "Чувствительный к задержке трафик изолирован от фонового."}}, {"q": "Что произойдёт, если весь чувствительный трафик привязать к одному линку?", "options": ["Точка доступа автоматически продублирует трафик на второй линк", "Трафик равномерно распределится, привязка носит рекомендательный характер", "Помеха на этом линке ударит по трафику, а запаса не останется", "Задержка станет минимальной при любых условиях в эфире"], "correct": 2, "explain": "Жёсткая привязка отдаёт устойчивость ради предсказуемости. Смысл MLO как раз в наличии запасного пути, и привязка этот запас отключает.", "usage": {"code": true, "without": "Настраивают привязку и теряют главное преимущество MLO.", "with": "# оставить голосу два линка вместо жёсткой привязки к одному", "benefit": "Запас по надёжности сохраняется вместе с приоритетом."}}, {"q": "Зачем в многолинковой работе нужен механизм согласования включения линков?", "options": ["Чтобы синхронизировать часы на точке доступа и на клиенте", "Чтобы согласовать общий номер канала для всех линков устройства", "Чтобы точка доступа знала, какие линки клиент готов использовать", "Чтобы распределить мощность передатчика между всеми линками"], "correct": 2, "explain": "Клиент может держать часть линков спящими ради экономии. Точка должна знать, какие из них сейчас слушают, иначе кадры уйдут в пустоту.", "usage": {"code": true, "without": "Точка шлёт кадры на спящий линк и трафик теряется.", "with": "# клиент сообщает, какие линки активны прямо сейчас", "benefit": "Кадры уходят только на слушающие линки."}}, {"q": "Как многолинковость влияет на энергопотребление клиента?", "options": ["Потребление падает, так как передача завершается быстрее", "Потребление всегда растёт пропорционально числу линков", "Потребление не меняется, поскольку передача идёт по одному линку", "Потребление зависит от режима: спящие линки почти ничего не тратят"], "correct": 3, "explain": "Два активных тракта действительно едят больше. Но линк можно усыпить, а быстрое завершение обмена возвращает радио в сон раньше, и в сумме выигрыш возможен.", "usage": {"code": true, "without": "От многолинковости отказываются, считая её всегда прожорливой.", "with": "# активный линк дорог, спящий почти бесплатен", "benefit": "Решение принимается по режиму, а не по числу линков."}}, {"q": "Почему MLO не всегда даёт удвоение реальной скорости?", "options": ["Узкое место может быть не в эфире, а в проводе или сервере", "Клиент не умеет собирать данные из двух линков в один поток", "Второй линк используется только для служебного трафика", "Стандарт ограничивает суммарную скорость по всем линкам"], "correct": 0, "explain": "Складывать полосу можно только до ближайшего узкого места. Если провод даёт гигабит, второй радиолинк добавит устойчивости, но не скорости.", "usage": {"code": true, "without": "Покупают устройство ради удвоения и не видят разницы в скорости.", "with": "# эфир: 2400 Мбит, провод: 1000 Мбит -> потолок 1000", "benefit": "Ожидания строятся по самому узкому месту цепочки."}}, {"q": "Что даёт расширение полосы до 320 мегагерц?", "options": ["Удвоение дальности связи по сравнению с полосой 160 мегагерц", "Примерно двукратный рост пиковой скорости относительно 160", "Снижение задержки за счёт более короткого символа передачи", "Возможность обслуживать вдвое больше клиентов одновременно"], "correct": 1, "explain": "Скорость растёт примерно пропорционально ширине. Дальность при этом падает: та же мощность размазывается по вдвое более широкой полосе.", "usage": {"code": true, "without": "Ставят максимальную ширину и теряют покрытие на краю квартиры.", "with": "# 160 МГц -> 320 МГц: скорость примерно вдвое, радиус меньше", "benefit": "Ширина выбирается под задачу, а не по максимуму."}}, {"q": "В каком диапазоне реально доступна полоса 320 мегагерц?", "options": ["В диапазоне 2,4 ГГц, где меньше всего занятых каналов", "В любом из диапазонов при условии поддержки со стороны клиента", "В диапазоне 5 ГГц, где для этого достаточно свободного спектра", "В диапазоне 6 ГГц, где хватает непрерывного спектра"], "correct": 3, "explain": "Непрерывный кусок такой ширины есть только в 6 ГГц. Это и есть главная причина, по которой Wi-Fi 7 практически означает работу в новом диапазоне.", "usage": {"code": true, "without": "Ждут максимальной скорости на устройстве без поддержки 6 ГГц.", "with": "# 320 МГц требует 6 ГГц", "benefit": "Понятно, какое железо нужно для заявленных скоростей."}}, {"q": "Что означает модуляция 4096-QAM в 802.11be?", "options": ["Передача ведётся на 4096 поднесущих в пределах канала", "Один символ несёт 12 бит вместо 10 в предыдущем поколении", "Сигнал повторяется 4096 раз для повышения устойчивости", "Один символ несёт 4096 бит информации при передаче данных"], "correct": 1, "explain": "Логарифм по основанию два от 4096 равен 12. Прирост относительно 1024-QAM составляет около 20 процентов и требует очень чистого сигнала.", "usage": {"code": true, "without": "Ждут прироста скорости на слабом сигнале и не получают его.", "with": "# log2(4096) = 12 бит на символ\n# log2(1024) = 10 бит на символ", "benefit": "Понятно, при каких условиях прирост вообще возможен."}}, {"q": "При каких условиях 4096-QAM даёт реальный выигрыш?", "options": ["При высоком отношении сигнала к шуму, то есть близко к точке", "При использовании полосы не более 40 мегагерц", "При большом удалении клиента, где важна каждая доля скорости", "При высокой загруженности канала соседними сетями"], "correct": 0, "explain": "Плотные созвездия крайне чувствительны к шуму. На краю покрытия устройство само опустится до более простой модуляции, и выигрыша не будет.", "usage": {"code": true, "without": "Ждут максимальных скоростей в дальней комнате.", "with": "# высокий SNR -> 4096-QAM\n# низкий SNR -> устройство снижает модуляцию", "benefit": "Ожидания по скорости привязаны к качеству сигнала."}}, {"q": "Что такое preamble puncturing в 802.11be?", "options": ["Сокращение преамбулы кадра для экономии эфирного времени", "Использование широкой полосы с исключением занятых участков", "Отключение части поднесущих для снижения потребления энергии", "Разделение полосы между несколькими клиентами одновременно"], "correct": 1, "explain": "Раньше занятый кусок внутри полосы заставлял опуститься на меньшую ширину целиком. Теперь мешающий участок вырезается, а остальная полоса работает.", "usage": {"code": true, "without": "Одна соседняя сеть внутри полосы обрушивает ширину вдвое.", "with": "# 320 МГц с вырезанным занятым куском в 20 МГц", "benefit": "Широкая полоса остаётся рабочей в занятом эфире."}}, {"q": "Что такое MRU в контексте распределения ресурсов?", "options": ["Максимальное число клиентов, обслуживаемых точкой одновременно", "Максимальный размер кадра, передаваемого без фрагментации", "Единица измерения задержки при передаче кадра по эфиру", "Набор из нескольких блоков поднесущих, выданный одному клиенту"], "correct": 3, "explain": "Multiple Resource Unit позволяет собрать клиенту неcмежные куски спектра. Это то, что делает вырезание занятых участков практичным.", "usage": {"code": true, "without": "Свободные куски спектра простаивают из-за занятой середины.", "with": "# клиенту выдаются блоки в обход занятого участка", "benefit": "Спектр используется целиком, а не до первой помехи."}}, {"q": "Как MLO взаимодействует с механизмом OFDMA?", "options": ["MLO работает между линками, OFDMA делит полосу внутри линка", "MLO заменяет OFDMA, делая распределение ресурсов ненужным", "OFDMA работает только на одном линке, остальные его не используют", "MLO и OFDMA взаимно исключают друг друга в пределах устройства"], "correct": 0, "explain": "Это разные уровни: OFDMA делит один канал между клиентами, MLO даёт устройству несколько каналов. Они работают вместе и не мешают друг другу.", "usage": {"code": true, "without": "Считают их конкурирующими и отключают одно ради другого.", "with": "# OFDMA: внутри линка\n# MLO: между линками", "benefit": "Оба механизма работают одновременно."}}, {"q": "Почему в диапазоне 6 ГГц обязателен режим защиты WPA3?", "options": ["В этом диапазоне работают только устройства нового поколения", "Стандарт запрещает открытые сети в новых диапазонах вообще", "Новый диапазон вводился уже с современными требованиями к защите", "Более старые режимы не поддерживают широкие полосы канала"], "correct": 2, "explain": "Диапазон открывался без груза совместимости, и это позволило сразу потребовать современную защиту. Побочный эффект — старые клиенты в него не попадают вовсе.", "usage": {"code": true, "without": "Ждут подключения старого ноутбука к сети на 6 ГГц.", "with": "# 6 ГГц: только WPA3, переходных режимов нет", "benefit": "Понятно, почему старый клиент не видит новую сеть."}}, {"q": "Что даёт клиенту работа в диапазоне 6 ГГц помимо ширины полосы?", "options": ["Автоматическое шифрование трафика на физическом уровне", "Отсутствие устройств предыдущих поколений и потому чистый эфир", "Большую дальность связи при той же мощности передатчика", "Полную независимость от регуляторных ограничений по мощности"], "correct": 1, "explain": "В диапазоне нет ни старых точек, ни бытовых источников помех. Обратная сторона — высокая частота хуже проходит сквозь стены, поэтому покрытие меньше.", "usage": {"code": true, "without": "Ждут от нового диапазона и скорости, и дальности разом.", "with": "# 6 ГГц: чистый эфир, но меньше радиус", "benefit": "Диапазон выбирается под расположение клиента."}}, {"q": "Почему точка доступа обычно продолжает вещать и на 2,4 ГГц?", "options": ["Он дальше добивает и нужен старым устройствам без новых диапазонов", "Этот диапазон обязателен по требованиям стандарта 802.11be", "Он даёт наибольшую скорость при работе в широкой полосе", "Он используется как служебный канал для согласования линков"], "correct": 0, "explain": "Умные розетки и датчики живут только на 2,4 ГГц. Диапазон остаётся ради совместимости и покрытия, а не ради скорости.", "usage": {"code": true, "without": "Отключают старый диапазон и теряют связь с бытовыми устройствами.", "with": "# 2.4 ГГц: совместимость и радиус, а не скорость", "benefit": "Старые устройства продолжают работать."}}, {"q": "Клиент подключился к точке MLD, но использует только один линк. Где искать причину?", "options": ["В настройках безопасности точки доступ ": "# линк 6 ГГц зашумлён -> трафик на 5 ГГц, звонок продолжается", "benefit": "Помеха на одном канале не доходит до пользователя."}}, {"q": "Что означает, если клиент показывает высокую скорость соединения, но низкую реальную?", "options": ["Скорость соединения отражает возможности, а не фактический поток", "Точка доступа искусственно ограничивает скорость этого клиента", "Клиент неверно измеряет скорость и требует обновления прошивки", "Разница объясняется исключительно накладными расходами протокола"], "correct": 0, "explain": "Показанная скорость — это верхняя граница при идеальных условиях. Реальная зависит от занятости эфира, качества сигнала и того, что находится за точкой доступа.", "usage": {"code": true, "without": "По цифре в интерфейсе судят о качестве связи и ошибаются.", "with": "# показано 2400 Мбит -> это потолок, а не факт", "benefit": "Оценка идёт по измерению, а не по заявленной цифре."}}, {"q": "Зачем при разборе жалобы смотреть качество каждого линка отдельно?", "options": ["Чтобы определить, какой линк был поднят первым при подключении", "Чтобы вычислить среднее качество и сравнить его с нормативом", "Общая картина скрывает, что один линк работает на пределе", "Чтобы выяснить, какой диапазон предпочитает данный производитель"], "correct": 2, "explain": "Усреднение прячет проблему: два хороших линка вытянут среднее, а третий будет постоянно терять кадры и заставлять переупорядочивать поток.", "usage": {"code": true, "without": "Среднее выглядит нормальным, а пользователь жалуется.", "with": "# смотреть сигнал и потери по каждому линку отдельно", "benefit": "Проблемный линк находится, а не растворяется в среднем."}}, {"q": "Почему устройство может отказаться поднимать линк на 6 ГГц?", "options": ["Клиент не поддерживает диапазон или режим защиты не тот", "Диапазон занят соседней точкой доступа и потому недоступен", "Мощность передатчика на этом диапазоне слишком мала для связи", "Линк на 6 ГГц поднимается только после линка на 2,4 ГГц"], "correct": 0, "explain": "Две частые причины: железо клиента старше диапазона, либо на точке задан режим защиты, недопустимый в 6 ГГц. Обе видны при проверке настроек и возможностей.", "usage": {"code": true, "without": "Диагностируют радио, хотя дело в возможностях клиента.", "with": "# проверить поддержку 6 ГГц и режим WPA3 на точке", "benefit": "Причина находится проверкой, а не перебором настроек."}}, {"q": "Что даёт разнесение трафика по линкам в квартире с толстыми стенами?", "options": ["Увеличение мощности передатчика в направлении дальней комнаты", "Устойчивость: дальний линк подхватывает, когда ближний слабеет", "Автоматическое переключение на проводное соединение при потере", "Полное покрытие всех комнат за счёт сложения зон линков"], "correct": 1, "explain": "Диапазоны имеют разную проникающую способность. 6 ГГц даёт скорость рядом с точкой, 2,4 ГГц добивает через стены, и вместе они закрывают разные зоны.", "usage": {"code": true, "without": "В дальней комнате связь пропадает, хотя рядом с точкой всё быстро.", "with": "# 6 ГГц рядом, 2.4 ГГц через стены, MLO переключает незаметно", "benefit": "Переход между зонами покрытия не рвёт соединение."}}, {"q": "Линк на 6 ГГц даёт 2400 Мбит в секунду, линк на 5 ГГц даёт 1200. Режим STR, провод за точкой на 1 Гбит. Какую скорость увидит клиент при загрузке из интернета?", "options": ["Около 2400 Мбит, берётся скорость наиболее быстрого линка", "Около 3600 Мбит, скорости линков складываются полностью", "Около 1000 Мбит, ограничение накладывает провод за точкой", "Около 1800 Мбит, среднее между скоростями двух линков"], "correct": 2, "explain": "Шаг 1: в режиме STR эфирные скорости действительно складываются, это 3600. Шаг 2: но данные идут из интернета через провод. Шаг 3: провод даёт 1000, он и есть потолок.", "usage": {"code": true, "without": "Обновляют точку доступа, не трогая гигабитный провод.", "with": "эфир: 2400 + 1200 = 3600 Мбит\nпровод: 1000 Мбит -> потолок 1000", "benefit": "Вложение идёт в то звено, которое ограничивает."}}, {"q": "Клиент в режиме NSTR имеет линки на 5 и 6 ГГц по 1200 Мбит каждый. Какую суммарную скорость ожидать?", "options": ["Около 1200 Мбит, одновременная работа линков ограничена", "Около 600 Мбит, режим уменьшает скорость каждого линка вдвое", "Около 2400 Мбит, режим на суммарную скорость не влияет", "Около 1800 Мбит, часть времени линки всё же работают вместе"], "correct": 0, "explain": "Шаг 1: NSTR означает невозможность одновременно передавать и принимать по этим линкам. Шаг 2: операции разносятся по времени. Шаг 3: сложения полос не происходит, выигрыш идёт по задержке и устойчивости.", "usage": {"code": true, "without": "Ждут удвоения скорости от пары соседних диапазонов.", "with": "# NSTR: выигрыш в задержке, но не в сумме полос", "benefit": "Ожидания соответствуют физике режима."}}, {"q": "Полоса 160 МГц даёт 1200 Мбит. Сколько примерно даст 320 МГц при прочих равных, и что случится с радиусом?", "options": ["Около 2400 Мбит, радиус останется прежним при той же мощности", "Около 1200 Мбит, ширина на скорость почти не влияет", "Около 2400 Мбит, радиус при этом заметно уменьшится", "Около 4800 Мбит, скорость растёт быстрее ширины полосы"], "correct": 2, "explain": "Шаг 1: скорость примерно пропорциональна ширине, 1200 умножить на 2 даёт 2400. Шаг 2: мощность распределяется по вдвое более широкой полосе. Шаг 3: плотность мощности падает, значит радиус уменьшается.", "usage": {"code": true, "without": "Включают максимальную ширину и жалуются на дальние комнаты.", "with": "1200 * (320/160) = 2400 Мбит\n# плотность мощности вдвое ниже -> радиус меньше", "benefit": "Ширина выбирается с учётом расположения клиентов."}}, {"q": "Переход с 1024-QAM на 4096-QAM при прочих равных даёт какой прирост скорости?", "options": ["Около 20 процентов, с 10 до 12 бит на символ", "Вчетверо, поскольку число точек созвездия выросло вчетверо", "Около 50 процентов, за счёт роста плотности созвездия", "Вдвое, поскольку удвоилось число бит на символ передачи"], "correct": 0, "explain": "Шаг 1: log2 от 1024 равен 10 бит. Шаг 2: log2 от 4096 равен 12 бит. Шаг 3: 12 разделить на 10 даёт 1,2, то есть примерно 20 процентов.", "usage": {"code": true, "without": "Ждут кратного роста от смены модуляции и разочаровываются.", "with": "log2(1024) = 10\nlog2(4096) = 12\n12/10 = 1.2", "benefit": "Ожидаемый прирост считается, а не берётся из рекламы."}}, {"q": "Клиент MLD подключён по трём линкам. Линк 6 ГГц теряет 30 процентов кадров, два других чистые. Пользователь жалуется на рывки видео. Что сделать?", "options": ["Убрать проблемный линк из отображения для чувствительного трафика", "Перезапустить точку доступа для пересогласования линков", "Отключить многолинковость и оставить один чистый линк", "Увеличить мощность на всех линках для компенсации потерь"], "correct": 0, "explain": "Шаг 1: два линка работают нормально, значит отключать MLO целиком не нужно. Шаг 2: рывки дают потери и переупорядочивание на третьем линке. Шаг 3: достаточно увести чувствительный трафик с проблемного линка.", "usage": {"code": true, "without": "Отключают MLO целиком и теряют полосу вместе с проблемой.", "with": "# TID видео -> линки 5 ГГц и 2.4 ГГц, минуя проблемный 6 ГГц", "benefit": "Проблема решается без потери преимуществ MLO."}}, {"q": "Точка доступа предлагает линки на 2,4, 5 и 6 ГГц. Клиент поддерживает два линка. Какую пару выбрать для максимальной скорости?", "options": ["2,4 и 6 ГГц, эта пара разнесена и почти наверняка даст STR", "2,4 и 5 ГГц, они лучше проходят через препятствия", "5 и 6 ГГц, но при соседстве возможен режим без одновременности", "Любую пару, режим работы от выбора диапазонов не зависит"], "correct": 2, "explain": "Шаг 1: наибольшие скорости у 5 и 6 ГГц. Шаг 2: но они соседствуют, и развязать их трудно. Шаг 3: возможен NSTR, и тогда сложения полос не будет, что нужно проверить измерением.", "usage": {"code": true, "without": "Пару диапазонов выбирают по цифрам, не проверив режим.", "with": "# 5+6: максимум по цифрам, риск NSTR\n# 2.4+6: скромнее, но чаще STR", "benefit": "Пара выбирается по измеренному результату."}}, {"q": "Видеозвонок идёт по линку 6 ГГц. Пользователь уходит в дальнюю комнату, сигнал 6 ГГц пропадает. Звонок не прервался. Почему?", "options": ["Клиент успел переподключиться к точке за время паузы в передаче", "Устройство временно перешло на проводное соединение в комнате", "Точка доступа продублировала поток на все линки заранее", "Ассоциация принадлежит MLD, и трафик ушёл на оставшийся линк"], "correct": 3, "explain": "Шаг 1: ассоциация одна на MLD, а не на линк. Шаг 2: потеря линка не разрывает ассоциацию. Шаг 3: трафик уходит на линк, который добивает через стены, обычно 2,4 ГГц.", "usage": {"code": true, "without": "Ожидают обрыва при уходе из зоны быстрого диапазона.", "with": "# 6 ГГц пропал -> 2.4 ГГц подхватил, сессия жива", "benefit": "Перемещение по квартире не рвёт соединение."}}, {"q": "В полосе 320 МГц соседняя сеть занимает участок 20 МГц посередине. Без вырезания устройство упало бы до 160 МГц. Сколько полосы сохранит вырезание?", "options": ["Ровно 320 МГц, занятый участок используется одновременно", "Ровно 160 МГц, вырезание на итоговую ширину не влияет", "Около 300 МГц, теряется только занятый участок", "Около 240 МГц, вырезание требует запаса по краям участка"], "correct": 2, "explain": "Шаг 1: без вырезания пришлось бы уйти на 160 МГц, потеряв половину. Шаг 2: вырезание убирает только занятые 20 МГц. Шаг 3: 320 минус 20 даёт около 300 МГц вместо 160.", "usage": {"code": true, "without": "Одна соседняя сеть обрушивает полосу вдвое.", "with": "320 - 20 = 300 МГц против 160 без вырезания", "benefit": "Соседняя сеть перестаёт стоить половины полосы."}}, {"q": "Статистика показывает 30 клиентов, но администратор насчитал 12 устройств в помещении. Все они Wi-Fi 7. В чём вероятная причина?", "options": ["Часть устройств подключается дважды из-за ошибки настройки", "Соседние устройства из другого помещения попали в статистику", "Учёт ведётся по линкам, а не по MLD, и устройства считаются трижды", "Клиенты переподключаются, а старые записи не удаляются вовремя"], "correct": 2, "explain": "Шаг 1: 12 устройств по три линка дают 36, что близко к 30. Шаг 2: значит счёт идёт по линкам. Шаг 3: правильный учёт ведётся по MLD, иначе один телефон считается тремя клиентами.", "usage": {"code": true, "without": "Планируют ёмкость сети по завышенному втрое числу клиентов.", "with": "12 устройств * 2-3 линка ≈ 30 записей", "benefit": "Ёмкость сети планируется по реальному числу устройств."}}, {"q": "Клиент показывает 5760 Мбит скорости соединения, но файл с локального сервера копируется на 900 Мбит. Сервер подключён гигабитным проводом. Где потеря?", "options": ["В точке доступа: она ограничивает скорость отдельного клиента", "В эфире: заявленная скорость недостижима на практике никогда", "В проводе сервера: гигабит и есть фактический потолок передачи", "В клиенте: он не умеет принимать данные на заявленной скорости"], "correct": 2, "explain": "Шаг 1: 5760 это эфирный потолок при идеальных условиях. Шаг 2: сервер отдаёт через гигабитный провод. Шаг 3: 900 Мбит близко к практическому пределу гигабита, узкое место найдено и оно не в радио.", "usage": {"code": true, "without": "Улучшают радиочасть, хотя ограничивает провод сервера.", "with": "эфир: 5760 Мбит\nпровод сервера: 1000 Мбит -> факт около 900", "benefit": "Улучшается то звено, где действительно потеря."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q.q) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
