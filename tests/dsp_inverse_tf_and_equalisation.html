<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSP 3: Обратная передаточная функция и выравнивание АЧХ</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>

    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>

        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>

</div>

    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>

</div>

<script>
(function () {
  const TEST_ID = "dsp_inverse_tf_and_equalisation";
  const QUESTIONS = [{"q": "Что называют обратной системой G(z)=1/H(z) по отношению к ЛДС с передаточной функцией H(z)?", "options": ["Система, амплитудно-частотная характеристика которой равна квадрату модуля H от e в степени jω и потому удваивает избирательность фильтра", "Система, импульсная характеристика которой равна исходной h[n], записанной в обратном порядке во времени от последнего отсчёта к первому", "Система, каскадное соединение которой с исходной H даёт передаточную функцию, равную единице, и восстанавливает исходный вход x[n]", "Система, коэффициенты передаточной функции которой являются обратными числами 1 к h[n] для каждого отсчёта импульсной характеристики h[n]"], "correct": 2, "explain": "G(z)=1/H(z) определена так, что H(z)·G(z)=1: применённая после H(z), она отменяет действие канала и восстанавливает x[n] из y[n]. Обращение порядка отсчётов h[n] — это time-reversal, совсем другая операция, а поэлементное обращение 1/h[n] или возведение АЧХ в квадрат не даёт передаточной функции, обратной H(z) (Oppenheim & Schafer, гл. 5.5).", "usage": {"code": false, "without": "Инженер пытается восстановить сигнал на входе датчика, обращая по отдельности каждый отсчёт его импульсной характеристики, и получает бессмысленный шум.", "with": "Он строит G(z)=1/H(z) как единую передаточную функцию и, пропустив через неё выход, получает исходный вход.", "benefit": "Восстановление входа через одну корректно построенную обратную передаточную функцию."}}, {"q": "Пусть H(z) — рациональная передаточная функция с нулями в точках z0 и полюсами в точках p0. Где расположены нули и полюсы обратной системы G(z)=1/H(z)?", "options": ["У обратной системы G нули стоят там же, где у исходной H были полюсы p0, а полюсы — там же, где были нули z0", "У G нули смещаются в начало координат, а полюсы остаются в тех же точках p0, что и у исходной системы H", "У G нули и полюсы совпадают с нулями и полюсами H, меняются местами лишь их кратности, а расположение остаётся прежним", "У G нули и полюсы зеркально отражаются относительно мнимой оси z-плоскости по сравнению с нулями и полюсами H"], "correct": 0, "explain": "Если H(z)=B(z)/A(z), то G(z)=1/H(z)=A(z)/B(z): корни числителя и знаменателя меняются ролями, поэтому нули H становятся полюсами G, а полюсы H — нулями G, в тех же точках z-плоскости. Отражение относительно мнимой оси или смещение в начало координат к обращению передаточной функции отношения не имеют (Proakis & Manolakis, гл. 5).", "usage": {"code": false, "without": "Студент ищет полюсы обратного фильтра там же, где были полюсы исходного канала, и не понимает, почему модель неустойчива.", "with": "Он помещает полюсы G именно в нули H и сразу видит, что часть из них лежит вне единичной окружности.", "benefit": "Верное построение обратной системы через перестановку нулей и полюсов."}}, {"q": "Устойчивая причинная ЛДС H(z) имеет нуль z0. При каком расположении z0 причинная обратная система G(z)=1/H(z) тоже устойчива, а при каком устойчивой причинной G вовсе не существует?", "options": ["Устойчива при любом расположении z0, кроме начала координат, поскольку устойчивость G определяется только полюсами H", "Устойчива при z0 точно на единичной окружности; внутри или вне окружности G всегда оказывается неустойчивой", "Устойчива при z0 строго вне единичной окружности; при z0 точно на окружности G становится причинной и устойчивой одновременно", "Устойчива при z0 строго внутри единичной окружности; при z0 точно на окружности устойчивой причинной G не существует"], "correct": 3, "explain": "Нуль H(z) становится полюсом G(z): чтобы причинная G была устойчивой, этот полюс обязан лежать строго внутри единичной окружности, то есть исходный нуль тоже строго внутри. Полюс ровно на окружности даёт незатухающую или расходящуюся импульсную характеристику G, и устойчивой причинной обратной системы не существует; нуль вне окружности лишь ухудшает дело ещё больше (Oppenheim & Schafer, гл. 5.5).", "usage": {"code": false, "without": "Инженер видит, что канал силового датчика устойчив, и без проверки нулей сразу строит его причинную инверсию для компенсации.", "with": "Он находит, что один нуль лежит точно на единичной окружности, и сразу знает: точной причинной устойчивой инверсии не построить.", "benefit": "Заранее известно, когда точная инверсия канала в принципе невозможна."}}, {"q": "Канал имеет нуль вне единичной окружности, поэтому точной причинной устойчивой обратной системы у него нет. Что на практике называют задержанной или приближённой обратной системой в такой ситуации?", "options": ["Фильтр, обнуляющий все отсчёты выхода после момента появления нуля вне окружности, чтобы избежать накопления ошибки", "Причинный фильтр конечной длины, подобранный так, чтобы свёртка с h дала импульс на сдвиге D с наименьшей ошибкой", "Некаузальную систему, использующую будущие отсчёты выхода, которую применяют только при офлайн-обработке уже записанного сигнала", "Копию исходного канала H, включённую последовательно ещё раз, чтобы удвоенное усиление скомпенсировало провал АЧХ на частоте нуля"], "correct": 1, "explain": "Раз точного 1/H нет, ищут причинный G конечной длины, для которого G*h ближе всего в смысле МНК к δ[n−D] при некоторой задержке D — компромисс между точностью и реализуемостью, задержанная или приближённая инверсия. Некаузальная обработка задним числом — отдельный приём zero-phase фильтрации, а не задержанная инверсия; повторение канала или обнуление после нуля вход не восстанавливают (project.txt, Option F).", "usage": {"code": false, "without": "Инженер обнаруживает нуль вне окружности у канала актуатора и объявляет задачу коррекции нерешаемой в принципе.", "with": "Он строит МНК-инверсию с задержкой в несколько отсчётов и получает устойчивый причинный корректор с приемлемой ошибкой.", "benefit": "Работающий корректор там, где точная инверсия невозможна в принципе."}}, {"q": "При построении корректора Heq=1/H для канала, чья АЧХ имеет глубокий провал на некоторой частоте, применяют регуляризацию. В чём состоит эта мера?", "options": ["Полосу вокруг провала полностью вырезают идеальным режекторным фильтром, оставляя корректор неопределённым на этом участке", "Порядок корректора значительно увеличивают, чтобы точнее воспроизвести саму форму и глубину провала АЧХ канала", "В знаменатель добавляют малую константу или ограничивают усиление корректора, жертвуя точностью инверсии ради шума", "Из записи предварительно вычитают среднее значение сигнала, чтобы провал АЧХ не совпадал с постоянной составляющей спектра"], "correct": 2, "explain": "Точный корректор 1/H на частоте провала даёт огромное усиление и выносит туда весь шум измерения; регуляризация — компромисс вида Heq=H*/(|H|²+ε) или явный потолок усиления, ограничивающий рост шума ценой неполной компенсации провала. Вычитание среднего или вырезание полосы задачу компенсации не решают, а увеличение порядка лишь точнее воспроизводит тот же взрывной провал (project.txt, Option C).", "usage": {"code": false, "without": "Инженер строит точный обратный фильтр для микрофонного тракта, и на выходе шумовой пол взлетает на 40 дБ ровно на частоте провала АЧХ.", "with": "Он ограничивает максимальное усиление корректора, провал компенсируется частично, но шум остаётся в разумных пределах.", "benefit": "Управляемый компромисс между точностью коррекции и уровнем шума."}}, {"q": "Как формулируется задача выравнивания АЧХ, то есть equalisation, корректором Heq применительно к каналу H, если фаза не нормируется отдельно?", "options": ["Подобрать Heq так, чтобы модуль |Heq| на каждой частоте был равен единице, делённой на модуль |H| исходного канала", "Подобрать Heq так, чтобы групповая задержка корректора на каждой частоте была равна групповой задержке канала H", "Подобрать Heq так, чтобы фаза Heq на каждой частоте была равна фазе H исходного канала, взятой с обратным знаком", "Подобрать Heq так, чтобы импульсная характеристика корректора совпадала с импульсной характеристикой канала H с точностью до масштаба"], "correct": 0, "explain": "Выравнивание АЧХ — задача только по модулю: |Heq(e^jω)|=1/|H(e^jω)|, а фазу корректора при этом можно выбирать свободно, например ради минимальной фазы или минимального порядка. Требование к фазе, к импульсной характеристике или к групповой задержке — это уже другие, более сильные задачи, а не equalisation в узком смысле (Wanhammar & Saramaki, гл. по коррекции АЧХ).", "usage": {"code": false, "without": "Студент проектирует корректор, требуя совпадения и АЧХ, и ФЧХ с обратными характеристиками канала, и не находит решения приемлемого порядка.", "with": "Он формулирует задачу только по модулю |Heq|=1/|H| и получает корректор вдвое меньшего порядка с той же плоской АЧХ.", "benefit": "Более простой корректор за счёт отказа от лишнего требования к фазе."}}, {"q": "Что в цифровой обработке сигналов называют деконволюцией?", "options": ["Разложение импульсной характеристики канала на сумму минимально-фазовой и всепропускающей составляющих для отдельной коррекции", "Удаление постоянной составляющей и линейного тренда из записанного сигнала перед вычислением его автокорреляции", "Вычисление свёртки двух конечных последовательностей через их поточечное произведение в частотной области без обратного ДПФ", "Восстановление одного из сомножителей свёртки, входного сигнала или импульсной характеристики, по известному выходу"], "correct": 3, "explain": "Деконволюция — операция, обратная свёртке: зная y=h*x и один из сомножителей, восстанавливают другой, например вход x по y и оценённой h. Вычисление самой свёртки через частотную область — это не деконволюция, а обычная свёртка; разложение на минимально-фазовую и all-pass части и удаление тренда — отдельные операции (Proakis & Manolakis, гл. 13).", "usage": {"code": false, "without": "Инженер называет деконволюцией саму процедуру измерения импульсной характеристики канала и путается в терминах с коллегами.", "with": "Он использует термин точно: деконволюция — это восстановление входа или h по известному выходу.", "benefit": "Однозначная терминология при обсуждении обработки канала."}}, {"q": "Чем оптимальный по критерию среднеквадратичной ошибки фильтр Винера как инверсия канала H принципиально отличается от точного обратного фильтра 1/H при наличии шума на выходе?", "options": ["Он определён только для минимально-фазовых каналов и вовсе не существует, если у H есть хотя бы один нуль вне окружности", "Он учитывает соотношение мощности сигнала и шума и на частотах с низким этим соотношением снижает усиление", "Он полностью игнорирует спектр шума и совпадает с 1/H на всех частотах, зато требует вдвое меньшего порядка реализации", "Он заменяет деление на H умножением на H, что превращает инверсию в дополнительное сглаживающее звено того же канала"], "correct": 1, "explain": "Винеровский корректор пропорционален H*·Sxx, делённому на |H|²·Sxx+Snn: там, где сигнал доминирует над шумом, он приближается к 1/H, а там, где шум велик или |H| мало, усиление осознанно снижается, а не растёт неограниченно, как у точного 1/H. Он определён при любом фазовом типе H и не сводится к умножению на H (Oppenheim & Schafer, гл. 4).", "usage": {"code": false, "without": "Инженер применяет точный обратный фильтр к зашумлённой записи акустического тракта и получает выход, тонущий в усиленном шуме.", "with": "Он строит фильтр Винера с оценёнными спектрами сигнала и шума, и усиление автоматически падает там, где доверять данным нельзя.", "benefit": "Инверсия, которая сама снижает усиление там, где шум перевешивает сигнал."}}, {"q": "Почему оценка канала или его инверсии делением одного спектра на другой даёт большую ошибку именно на частотах, где делитель близок к нулю?", "options": ["Потому что ДПФ конечной длины не определено в точках, где истинный спектр обращается в ноль, и деление даёт неопределённость", "Потому что деление спектров вообще законно только на частотах, кратных частоте дискретизации, а между ними нужна интерполяция", "Потому что даже малый шум измерений в делителе умножается там на очень большой коэффициент, и ошибка оценки резко возрастает", "Потому что на этих частотах фаза делимого и делителя перестаёт быть определённой, и результат деления становится комплексным"], "correct": 2, "explain": "Деление A на B при малом |B| эквивалентно умножению на большой коэффициент 1/B, и любая аддитивная погрешность измерения A или B на этой частоте усиливается пропорционально этому коэффициенту, давая выброс ошибки именно там. Фаза при этом остаётся определена, ДПФ конечной длины вычисляется во всех бинах, а ограничение частотами, кратными fs, с этим эффектом не связано (Proakis & Manolakis, гл. 13).", "usage": {"code": false, "without": "Инженер видит на графике |H| резкий выброс на одной частоте и подозревает неисправность датчика.", "with": "Он проверяет, что именно на этой частоте знаменатель оценки был близок к нулю, и объясняет выброс усилением шума при делении.", "benefit": "Верное объяснение выбросов оценки без ложной тревоги о неисправности."}}, {"q": "Как гомоморфная обработка через комплексный кепстр строит минимально-фазовую систему Hmin с той же АЧХ, что и заданная H?", "options": ["Берут логарифм спектра H, переходят к кепстру, обнуляют антипричинную часть и удваивают причинную часть кепстра", "Заменяют полюсы H на нули в тех же точках z-плоскости, сохраняя нули H без изменений, и заново нормируют усиление на DC", "Берут модуль спектра H, обращают его во времени и заново вычисляют фазу через преобразование Гильберта от логарифма модуля", "Отражают все нули H, лежащие внутри единичной окружности, наружу, оставляя нули вне окружности на прежних местах без изменений"], "correct": 0, "explain": "Комплексный кепстр логарифма спектра при обнулении антипричинной части и удвоении причинной даёт кепстр минимально-фазовой системы с тем же модулем спектра, что у H; обратное преобразование и экспонента восстанавливают Hmin. Отражение уже внутренних нулей наружу или замена полюсов нулями меняют саму АЧХ, а не только фазу, что противоречит условию «та же АЧХ» (Oppenheim & Schafer, гл. 13).", "usage": {"code": false, "without": "Инженер пытается получить минимально-фазовый эквивалент канала, отражая уже внутренние нули H наружу, и меняет тем самым саму АЧХ.", "with": "Он строит комплексный кепстр, сворачивает его в причинную часть и получает Hmin с исходной АЧХ и минимальной фазой.", "benefit": "Минимально-фазовый эквивалент канала без искажения его амплитудной характеристики."}}, {"q": "Систему H(z) считаем причинной и устойчивой сама по себе. Какое дополнительное условие нужно, чтобы обратная система 1/H(z) тоже была причинной и устойчивой?", "options": ["Все нули H лежат строго вне единичной окружности", "Все нули H лежат строго внутри единичной окружности", "Все полюсы H лежат строго на единичной окружности", "Все полюсы H лежат строго внутри единичной окружности"], "correct": 1, "explain": "Полюсы 1/H(z) совпадают с нулями H(z), поэтому для причинной устойчивой инверсии нули H(z) должны лежать строго внутри окружности — это и есть определение минимальной фазы. Условие на полюсы H(z) уже выполнено по условию задачи и обеспечивает устойчивость самой H(z), а не её инверсии (Proakis & Manolakis, гл. 5; exam_guide.txt, Q1).", "usage": {"code": false, "without": "Инженер синтезирует обратный фильтр для канала актуатора, проверив только устойчивость самого канала, и получает расходящийся корректор.", "with": "Он отдельно смотрит на расположение нулей H(z) и убеждается, что канал минимально-фазовый, прежде чем инвертировать его.", "benefit": "Заранее известно, реализуем ли обратный фильтр."}}, {"q": "Канал силового датчика оказался неминимально-фазовым: один нуль H(z) лежит вне единичной окружности. Что верно про точную инверсию 1/H(z) в этом случае?", "options": ["Она теряет устойчивость навсегда, и обратный фильтр для этого канала не существует ни в каком виде и ни при каких условиях", "Она становится причинной и устойчивой сама собой при переходе к каскадной реализации из звеньев второго порядка", "Она не бывает сразу причинной и устойчивой; берут устойчивую нереализуемую форму или причинное приближение", "Она остаётся причинной и устойчивой без изменений, только порядок обратного фильтра удваивается для запаса"], "correct": 2, "explain": "Для неминимально-фазовой H(z) полюс обратной системы, соответствующий нулю вне окружности, лежит вне единичной окружности: причинная реализация 1/H(z) неустойчива, а устойчивая реализация требует антипричинной, двусторонней импульсной характеристики. На практике берут либо такую двустороннюю форму, либо причинное FIR-приближение с задержкой; обратный фильтр не исчезает, он просто не может быть точным, причинным и устойчивым одновременно (project.txt, Option F; Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Инженер инвертирует канал силового датчика напрямую и получает расходящийся во времени обратный фильтр.", "with": "Он распознаёт неминимально-фазовый нуль и берёт причинное приближение инверсии с задержкой вместо точной формулы.", "benefit": "Реализуемый корректор вместо теоретически точного, но нефизичного фильтра."}}, {"q": "У канала телеметрии H(z) есть нуль ровно на единичной окружности на одной из рабочих частот. Что происходит с прямой инверсией 1/H(z) на этой частоте и почему регуляризация обязательна?", "options": ["Знаменатель 1/H обращается в ноль на этой частоте, и коэффициент передачи инверсии становится бесконечным", "Числитель 1/H обращается в ноль на этой частоте, и коэффициент передачи инверсии становится равным нулю", "Полюс инверсии сам собой смещается внутрь окружности, и коэффициент передачи остаётся конечным без всякой регуляризации", "Нуль на окружности никак не влияет на инверсию, и коэффициент передачи там равен единице по определению системы"], "correct": 0, "explain": "На частоте, где H(e^{jω})=0, обратная АЧХ 1/H(e^{jω}) формально равна бесконечности: полюс инверсии садится точно на окружность, и усиление шума на этой частоте ничем не ограничено. Поэтому прямое деление на H запрещено и нужна регуляризация — например, ограничение усиления или замена на винеровскую форму (Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Инженер строит эквалайзер для телеметрийного канала прямым делением на H и получает выброс шума на частоте нуля.", "with": "Он ограничивает усиление корректора вблизи этой частоты, прежде чем ставить фильтр в тракт.", "benefit": "Шум на частоте нуля не разрывает динамический диапазон приёмника."}}, {"q": "Для неминимально-фазового канала строят причинный FIR, приближающий 1/H(z) с фиксированной задержкой D отсчётов. Зачем нужна именно задержка, а не немедленный обратный отклик?", "options": ["Задержка нужна только для синхронизации с частотой дискретизации АЦП и к точности инверсии отношения не имеет", "Задержка устраняет полюс, лежащий на единичной окружности, заменяя его нулём такого же радиуса и знака", "Задержка компенсирует групповую задержку самого канала H, поэтому её выбирают равной удвоенному порядку H", "Задержка даёт приближению время учесть антипричинную часть точной инверсии, а не только её причинный хвост"], "correct": 3, "explain": "Точная инверсия неминимально-фазового канала содержит устойчивую, но двустороннюю, антипричинную составляющую; причинное FIR-приближение может лишь сдвинуть отклик во времени на D отсчётов, чтобы захватить значимую часть этой антипричинной истории до момента D, а не воспроизвести её мгновенно. Без задержки приближение обрубает именно ту часть, которая при неминимальной фазе несёт основную энергию (project.txt, Option F; Proakis & Manolakis, гл. 5).", "usage": {"code": false, "without": "Инженер требует от FIR-приближения инверсии нулевую задержку и получает большую ошибку аппроксимации на низких частотах.", "with": "Он закладывает разумную задержку D и получает приближение, которое укладывается в допуск по всей полосе.", "benefit": "Управляемый компромисс между задержкой и точностью инверсии."}}, {"q": "Вместо Heq(z)=1/H(z) на практике часто берут Heq(z)=H*(z)/(|H(z)|^2+ε) с малой положительной ε. Как эта замена меняет поведение эквалайзера вблизи нуля АЧХ?", "options": ["Усиление вблизи нуля растёт быстрее, чем без ε, потому что знаменатель становится комплексным", "Усиление вблизи нуля перестаёт уходить в бесконечность и ограничивается конечной величиной, которая растёт при уменьшении ε", "Усиление вблизи нуля обнуляется полностью и навсегда, потому что ε замещает собой сам нуль передаточной функции", "Усиление вблизи нуля не меняется, потому что ε влияет только на фазу корректора, а не на его модуль"], "correct": 1, "explain": "Вблизи частоты, где |H|→0, простая инверсия 1/H даёт бесконечное усиление; слагаемое ε в знаменателе |H|^2+ε не даёт ему обнулиться, поэтому итоговое усиление остаётся конечным и растёт при уменьшении ε, но никогда не уходит в бесконечность (точный максимум x/(x^2+ε) достигается не в самой точке нуля, а рядом с ней и по порядку величины ведёт себя как 1/√ε, а не как 1/ε). Полной компенсации на этой частоте всё равно нет — остаётся компромисс между точностью выравнивания и уровнем шума (Oppenheim & Schafer, гл. 5; Proakis & Manolakis, гл. 13).", "usage": {"code": false, "without": "Инженер ставит точный обратный фильтр на канал микрофона и получает пронзительный шум на частоте провала АЧХ.", "with": "Он вводит регуляризацию ε и ограничивает усиление корректора разумным потолком на этой частоте.", "benefit": "Компромисс между точностью выравнивания и уровнем шума."}}, {"q": "Задачу выравнивания АЧХ формулируют как |Heq(e^{jω})|=1/|H(e^{jω})|, а не как Heq(z)=1/H(z) целиком. Чем эти две формулировки отличаются по требованиям к фазе?", "options": ["Первая требует строго линейной фазы корректора, вторая допускает любую фазу совсем без ограничений", "Первая жёстко фиксирует фазу корректора равной фазе самой H, вторая оставляет фазу полностью произвольной", "Первая оставляет фазу корректора свободной, вторая жёстко фиксирует и модуль, и фазу равными обратным величинам H", "Обе формулировки полностью эквивалентны, потому что модуль и фаза передаточной функции однозначно связаны для любой H"], "correct": 2, "explain": "Спецификация только по модулю задаёт лишь |Heq|, оставляя разработчику свободу выбрать фазу корректора — например, линейную, нулевую или минимальную, смотря что важнее для задачи; полная инверсия Heq=1/H обязана воспроизвести и обратную фазу H, что для неминимально-фазовой H даёт неустойчивую причинную реализацию. Модуль и фаза связаны однозначно только для минимально-фазовых систем, а не для произвольной H (project.txt, Option C; Proakis & Manolakis, гл. 5).", "usage": {"code": false, "without": "Инженер настаивает на точной инверсии фазы канала микрофона и упирается в неустойчивый корректор.", "with": "Он требует только выравнивания модуля и выбирает для корректора удобную линейную фазу.", "benefit": "Реализуемый эквалайзер вместо неустойчивой точной инверсии."}}, {"q": "Деконволюцию и эквализацию иногда путают, хотя это разные задачи. В чём их ключевое отличие по постановке?", "options": ["Деконволюция восстанавливает вход по конкретной записи выхода, эквализация проектирует фильтр для любых входов", "Деконволюция требует известного заранее шума, а эквализация всегда предполагает канал без всякого шума", "Деконволюция меняет частоту дискретизации сигнала, а эквализация всегда оставляет её полностью неизменной", "Деконволюция работает только с FIR-каналами, а эквализация — только с IIR-каналами и не пересекается с ними"], "correct": 0, "explain": "Деконволюция — разовая операция над конкретной записью: по известной или оценённой H и наблюдаемому выходу восстанавливают именно этот вход. Эквализация — синтез одного фиксированного корректора Heq, который затем в реальном времени применяют к любому сигналу, проходящему через тот же канал. Тип реализации канала и наличие шума с этим разделением напрямую не связаны (Proakis & Manolakis, гл. 5; Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Команда один раз обрабатывает архивную запись гидрофона и называет получившийся скрипт эквалайзером канала.", "with": "Она отдельно оформляет разовую деконволюцию архива и отдельно постоянный корректор для новых записей.", "benefit": "Понятно, что можно переиспользовать, а что было решением для одной записи."}}, {"q": "Фильтр Винера для оценки входа через зашумлённый выход имеет вид Hw(f)=H*(f)Sxx(f)/(|H(f)|^2 Sxx(f)+Snn(f)). Чем его поведение на частоте нуля |H| отличается от поведения простого 1/H?", "options": ["Hw стремится к бесконечности так же, как 1/H, потому что числитель и знаменатель растут одинаково", "Hw вовсе не зависит от частоты, а простая инверсия 1/H сохраняет всю зависимость от самой H", "Hw обнуляет весь спектр входа целиком, а простая инверсия 1/H восстанавливает его без каких-либо изменений", "Hw стремится к нулю по мере роста доли шума, тогда как 1/H формально уходит в бесконечность"], "correct": 3, "explain": "При |H|→0 числитель H*Sxx тоже стремится к нулю, а знаменатель остаётся ограниченным снизу спектром шума Snn, поэтому Hw→0: фильтр Винера учитывает, что на этой частоте полезный сигнал неотличим от шума, и не пытается его восстанавливать. Наивная инверсия 1/H такой информации о шуме не использует и формально уходит в бесконечность (Proakis & Manolakis, гл. 13).", "usage": {"code": false, "without": "Инженер применяет простую инверсию 1/H к зашумлённой записи актуатора и получает оценку, полностью забитую усиленным шумом.", "with": "Он берёт фильтр Винера с оценённым Snn и получает подавление на частотах, где сигнал слабее шума.", "benefit": "Оценка входа не взрывается шумом там, где сигнала фактически нет."}}, {"q": "При оценке передаточной функции по записи Ĥ(f)=Y(f)/X(f) и при вычислении корректора Heq=1/Ĥ ошибка от деления спектров возникает по разным причинам. В чём разница этих двух источников ошибки?", "options": ["В первом случае виноват порядок выбранной модели канала, во втором — длина записи того же тестового сигнала", "В первом случае виноват провал спектра тестового сигнала X, во втором — провал самой АЧХ канала H", "В обоих случаях виноват один и тот же провал спектра тестового сигнала X, других причин нет", "В первом случае виноват шум измерения выхода Y, во втором — шум измерения самого сигнала X"], "correct": 1, "explain": "При оценке Ĥ=Y/X ошибка растёт там, где мало энергии в самом тестовом сигнале X — это устраняется выбором сигнала с ровным широкополосным спектром, канал тут ни при чём. При инверсии уже полученной оценки Heq=1/Ĥ ошибка растёт там, где мала сама |H| — это свойство канала, и никакой выбор тестового сигнала его не убирает, нужна регуляризация корректора (Proakis & Manolakis, гл. 14; project.txt, этапы 2-3).", "usage": {"code": false, "without": "Инженер винит канал в шумной оценке H и пытается регуляризировать корректор, хотя причина в бедном спектре тестового сигнала.", "with": "Он сначала проверяет спектр возбуждения на провалы и только потом смотрит на собственные нули канала.", "benefit": "Устранение ошибки в её реальном источнике, а не там, где привычнее искать."}}, {"q": "По измеренной АЧХ |H(e^{jω})| без данных о фазе нужно построить минимально-фазовую систему с той же АЧХ. Какой шаг гомоморфной обработки для этого ключевой?", "options": ["Кепстр логарифма самого модуля усредняют по всем временам и затем обнуляют при положительных", "Импульсную характеристику канала дважды дифференцируют по времени, чтобы получить его фазу", "Кепстр логарифма модуля обнуляют при отрицательных временах и удваивают при положительных", "Спектр модуля свёртывают с окном Ханна, после чего фаза восстанавливается сама собой"], "correct": 2, "explain": "Реальный кепструм log|H| раскладывается на чётную и нечётную по времени части; у минимально-фазовой системы вся информация уже содержится в чётной части, поэтому обнуление отсчётов при n<0 и удвоение при n>0, с сохранением n=0, даёт комплексный кепструм именно минимально-фазового решения с той же |H|. Дифференцирование и сглаживание окном к восстановлению фазы отношения не имеют (Oppenheim & Schafer, гл. 13).", "usage": {"code": false, "without": "Инженер пытается угадать фазу канала акустического датчика по одной лишь измеренной АЧХ без метода.", "with": "Он строит минимально-фазовую модель через кепструм и получает согласованную фазу для дальнейшей инверсии.", "benefit": "Обоснованная реконструкция фазы там, где измерить её напрямую нельзя."}}, {"q": "Вы разрабатываете эквалайзер АЧХ для гидрофонного канала (курсовой проект, вариант C). Идентификация показала, что канал минимально-фазовый, но в его АЧХ есть узкий провал около 60 Гц с ослаблением 40 дБ, при этом ни один нуль H(z) не лежит точно на единичной окружности или вне её. Что произойдёт при прямой реализации причинного корректора 1/H(z) и как поступить?", "options": ["Причинный корректор неустойчив, поскольку провал АЧХ создаёт полюс вне единичной окружности, поэтому нужна антипричинная реализация", "Причинный корректор устойчив и безопасен по всей полосе, поэтому ограничивать усиление корректора возле провала не требуется", "Причинный корректор устойчив, но подавляет сигнал ещё сильнее возле провала, поэтому усиление там нужно обнулить полностью", "Причинный корректор устойчив, но поднимает уровень шума в провале на десятки дБ, поэтому усиление возле провала нужно ограничить регуляризацией"], "correct": 3, "explain": "Раз ни один нуль H(z) не лежит на окружности или вне её, канал остаётся минимально-фазовым и причинный обратный фильтр устойчив, но там, где |H| мало, 1/|H| велико, и корректор резко поднимает шум измерения - именно ловушка, описанная для варианта C. Решение - ограничить максимальное усиление корректора регуляризацией, а не убирать его совсем и не менять реализацию на антипричинную (project.txt, вариант C; Proakis, гл. 5).", "usage": {"code": false, "without": "Студент собирает 1/H буквально по формуле, на бенче эквалайзер идеально выравнивает провал, но шумовой пол в этой полосе взлетает на 30 дБ и портит весь сигнал.", "with": "Он заранее ограничивает усиление корректора возле провала, теряет немного точности выравнивания там же, но получает рабочий эквалайзер без взрыва шума.", "benefit": "Работающий эквалайзер без взрыва шумового пола в провале."}}, {"q": "В рамках варианта F курсового проекта вы идентифицировали канал актуатора корреляционным методом и нашли нуль передаточной функции в точке z=1.6, то есть вне единичной окружности. Нужен корректор, выравнивающий АЧХ канала для работы в реальном времени. Как построить устойчивый корректор?", "options": ["Построить точный причинный корректор 1/H без изменений, поскольку полюс в 1.6 не влияет на устойчивость обратной системы", "Построить причинную LS-аппроксимацию 1/H с задержкой, поскольку точный причинный обратный фильтр здесь неустойчив", "Построить точный антипричинный корректор 1/H и применить его в реальном времени без буферизации записи", "Построить точный причинный корректор 1/H, заменив нуль 1.6 нулём в начале координат z равным нулю"], "correct": 1, "explain": "Причинный обратный фильтр имеет полюс в каждом нуле H(z); нуль 1.6 вне окружности даёт полюс вне окружности и расходящуюся импульсную характеристику. Точный устойчивый обратный фильтр здесь причинным быть не может, поэтому вместо него строят причинную аппроксимацию 1/H с задержкой методом наименьших квадратов - именно об этом предупреждает вариант F курсового проекта; антипричинная реализация была бы устойчива, но требует буфера будущих отсчётов и непригодна для реального времени (project.txt, вариант F; Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Инженер программирует 1/H по коэффициентам канала как есть, корректор на стенде уходит в насыщение через десятки отсчётов, и он списывает это на плохой АЦП.", "with": "Он видит нуль 1.6 вне окружности, строит причинную LS-аппроксимацию инверсии с небольшой задержкой и получает устойчивый работающий в реальном времени корректор.", "benefit": "Устойчивый корректор, пригодный для работы в реальном времени."}}, {"q": "Идентификация акустического тракта показала точный нуль H(z) на единичной окружности ровно на частоте резонансного провала - АЧХ канала на этой частоте равна нулю. Требуется корректор, выравнивающий АЧХ. Что происходит при попытке точной инверсии на этой частоте и как поступить?", "options": ["Точная инверсия даёт полюс внутри окружности на этой частоте, поэтому корректор можно строить без каких-либо ограничений усиления", "Точная инверсия даёт полюс вне окружности на этой частоте, поэтому корректор нужно реализовать как антипричинный фильтр", "Точная инверсия требует бесконечного усиления на этой частоте, поэтому корректор нужно строить с ограниченным максимальным усилением около неё", "Точная инверсия невозможна из-за нелинейности канала на этой частоте, поэтому корректор нужно строить методом наименьших квадратов по всей полосе"], "correct": 2, "explain": "Нуль ровно на единичной окружности даёт H=0 точно на этой частоте, а обратной величины у нуля не существует, поэтому точная инверсия там требует бесконечного усиления, а не просто полюса внутри или вне окружности. Единственный выход - строить корректор с ограниченным максимальным усилением вблизи этой частоты, приняв, что полная компенсация там невозможна; нелинейность канала здесь ни при чём, вопрос чисто в положении нуля (Proakis, гл. 5).", "usage": {"code": false, "without": "Студент пишет формулу 1/H буквально, коэффициенты корректора на этой частоте улетают в машинную бесконечность, и программа синтеза виснет или выдаёт NaN.", "with": "Он заранее знает про точный нуль на окружности, ограничивает пиковое усиление корректора и получает конечные, реализуемые коэффициенты.", "benefit": "Реализуемый корректор без бесконечных коэффициентов у точного нуля."}}, {"q": "Для эквалайзера канала техническое задание требует только |Heq(e^jω)| = 1/|H(e^jω)|, конкретная форма ФЧХ корректора не задана. Сам канал H смешанно-фазовый. Как использовать эту свободу при синтезе корректора?", "options": ["Синтезировать корректор как отдельную минимально-фазовую систему с нужной АЧХ, не воспроизводя фазу точного обратного фильтра", "Скопировать фазу точного алгебраического обратного фильтра 1/H, поскольку только так АЧХ корректора совпадёт с заданием", "Задать корректору нулевую фазу на всех частотах, поскольку задание вообще не требует фазовой характеристики", "Скопировать фазу исходного канала H без изменения знака, чтобы каскад H и корректора получил удвоенную фазу"], "correct": 0, "explain": "Раз задание фиксирует только модуль, а не фазу корректора, разработчик волен выбрать любую реализуемую фазу и синтезировать корректор как отдельную минимально-фазовую систему с той же АЧХ - причинную, устойчивую и с наименьшей задержкой среди систем с этим модулем. Копирование фазы точного 1/H навязывает задержку смешанно-фазового канала без нужды, нулевая фаза для причинной системы в общем случае нереализуема, а копирование фазы самого H только удваивает искажение (Wanhammar & Saramaki, гл. 4).", "usage": {"code": false, "without": "Инженер честно копирует фазу точного обратного фильтра, получает корректор с огромной групповой задержкой и удивляется, почему звук стал заметно запаздывать.", "with": "Он синтезирует отдельную минимально-фазовую систему под ту же АЧХ и получает эквалайзер с той же коррекцией, но с наименьшей возможной задержкой.", "benefit": "Та же АЧХ корректора при минимально возможной задержке."}}, {"q": "Записанный сигнал датчика силы моделируется как y = h*x + шум с известным уровнем. Нужно восстановить x по y и оценённой H. Прямое деление Y(f)/H(f) даёт оценку x̂, но она бесполезна на частотах, где H мала, а шум велик. Какой метод восстановления выбрать вместо прямого деления?", "options": ["Прямое деление с предварительным усилением сигнала y перед делением на H одинаково на всех частотах", "Прямое деление, но с заменой H на её модуль без учёта фазы на всех частотах спектра", "Фильтр Винера, но только на частотах, где H максимальна, а на остальных - прямое деление", "Фильтр Винера: усиление автоматически падает там, где шум относительно сигнала велик"], "correct": 3, "explain": "Фильтр Винера G(f) = H*(f)Sx(f) / (|H(f)|²Sx(f) + Sv(f)) плавно снижает усиление там, где шум/сигнал велик, и приближается к 1/H там, где шум мал, без резких переключений между двумя режимами. Простое усиление сигнала перед делением не меняет соотношение шум/сигнал, а отбрасывание фазы H исказило бы восстановленный x даже там, где |H| велика (Proakis, гл. 13).", "usage": {"code": false, "without": "Инженер делит спектр отклика на H по всей полосе, восстановленный сигнал силы покрыт всплесками ровно там, где канал слабо пропускает частоту.", "with": "Он ставит фильтр Винера с известным уровнем шума, и восстановленный сигнал остаётся гладким даже на слабо пропускаемых частотах.", "benefit": "Восстановленный сигнал без шумовых всплесков на слабых частотах канала."}}, {"q": "У канала актуатора отношение шум/сигнал сильно растёт на высоких частотах, а на низких частотах шум пренебрежимо мал. Вы выбираете, как задать регуляризацию корректора 1/H по частоте. Какой вариант параметра регуляризации правильный?", "options": ["Одна и та же малая константа регуляризации на всех частотах, подобранная по среднему уровню шума в полосе", "Регуляризация, растущая вместе с шум/сигнал: малая на низких частотах, большая на высоких", "Регуляризация, убывающая с частотой, большая на низких частотах и близкая к нулю на высоких", "Регуляризация, зависящая только от амплитуды H, без учёта распределения шума по частоте"], "correct": 1, "explain": "Регуляризация корректора должна отслеживать отношение шум/сигнал: там, где оно велико, усиление нужно сильнее подавлять, чтобы не поднимать шум, а там, где сигнал чистый, корректор может почти точно повторять 1/H. Здесь шум растёт с частотой, значит и регуляризация должна расти с частотой; постоянная константа или зависимость только от |H| без учёта шума - грубое приближение, а обратный по частоте профиль подавлял бы корректор именно там, где он нужнее всего (Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Инженер берёт одну константу регуляризации для всей полосы, на низких частотах корректор недокомпенсирует канал, а на высоких всё равно поднимает шум.", "with": "Он задаёт регуляризацию, растущую вместе с шум/сигнал, и получает почти точную коррекцию там, где сигнал чистый, и безопасное подавление там, где шумно.", "benefit": "Коррекция АЧХ, согласованная с реальным распределением шума по частоте."}}, {"q": "При идентификации микрофонного канала вы уверенно измерили только модуль |H(e^jω)|, а фазовая оценка получилась зашумлённой и ненадёжной. Для устойчивой и корректно обратимой модели канала нужна минимально-фазовая система с той же АЧХ. Каким методом её построить?", "options": ["Взять измеренный модуль и присвоить ему фазу, равную нулю на всех частотах, получив минимально-фазовую систему", "Взять измеренный модуль и обратить знак его логарифма, получив минимально-фазовую систему напрямую", "Взять измеренный модуль и по его кепстру гомоморфно восстановить минимально-фазовую фазу", "Взять измеренный модуль и продолжить его чётным образом во времени, получив минимально-фазовую систему"], "correct": 2, "explain": "Стандартный путь от измеренного модуля к минимально-фазовой системе - гомоморфная обработка: по логарифму модуля строится вещественный кепстр, каузальное окно на кепстре обнуляет отрицательное время и удваивает положительное, после чего обратное преобразование даёт минимально-фазовую фазу с тем же модулем. Нулевая фаза даёт не минимально-фазовую, а зеркально-симметричную систему, смена знака логарифма не имеет физического смысла фазы, а чётное продолжение просто воспроизводит исходный вещественный модуль (Oppenheim & Schafer, гл. 12).", "usage": {"code": false, "without": "Инженер берёт измеренный модуль, ставит фазу в ноль и получает нереализуемый нечётный по времени фильтр, который нельзя устойчиво инвертировать.", "with": "Он вычисляет вещественный кепстр модуля, восстанавливает минимально-фазовую фазу и получает причинную устойчиво обратимую модель канала.", "benefit": "Причинная, устойчиво обратимая модель канала по одному лишь модулю."}}, {"q": "Оценённая по измерениям АЧХ канала имеет узкий провал в один бин частотной сетки, а в повторных измерениях того же канала этот провал сдвигается по частоте и меняет глубину. У модели канала физических оснований для нуля на этой частоте нет. Как правильно поступить при построении корректора?", "options": ["Считать провал артефактом оценки и улучшить идентификацию усреднением и более богатым тестовым сигналом", "Считать провал точным нулём H и регуляризовать усиление корректора именно в этом бине по правилам работы с нулями", "Считать провал полюсом H вне окружности и строить приближённый причинный корректор с задержкой в этом месте", "Игнорировать провал и построить точный алгебраический корректор 1/H по всей полосе без каких-либо изменений"], "correct": 0, "explain": "Провал, который смещается и меняет глубину от измерения к измерению и не имеет физического объяснения, - это шум оценки, а не свойство канала; правильный ответ - улучшить саму оценку H усреднением по записям и более широкополосным тестовым сигналом, а не применять к нему технику регуляризации, придуманную для настоящих спектральных нулей. Считать его нулём или полюсом канала значило бы строить корректор под артефакт измерения, а игнорировать его при точной инверсии 1/H всё равно даст выброс усиления именно в этом бине (Ljung, гл. 13; Proakis, гл. 5).", "usage": {"code": false, "without": "Инженер видит провал в одной записи, регуляризует корректор вокруг него, а в следующей записи провал оказывается на другой частоте и корректор оставляет исходный дефект нескомпенсированным.", "with": "Он повторяет измерение с более богатым тестовым сигналом и усреднением, провал исчезает как артефакт, и корректор строится по надёжной оценке H.", "benefit": "Корректор, построенный по надёжной оценке канала, а не по шуму измерения."}}, {"q": "При корреляционной оценке импульсной характеристики канала актуатора вы взяли окно анализа 200 отсчётов. На конце оценённого h[n] энергия ещё не спала до уровня шума. Что это означает и что сделать перед вычислением H(e^jω) через ДПФ?", "options": ["Окно анализа длиннее, чем нужно для этого канала, поэтому лишние отсчёты стоит отбросить перед оценкой H", "Длина окна не влияет на оценку H, поскольку ДПФ само компенсирует обрезание импульсной характеристики", "Энергия на конце окна означает только шум измерения, поэтому нужно просто обнулить последние отсчёты h[n] перед ДПФ", "Окно анализа короче, чем реальная длительность отклика канала, поэтому нужно удлинить запись и окно до оценки H"], "correct": 3, "explain": "Неспавшая к уровню шума энергия на конце окна означает, что реальная длительность импульсной характеристики канала больше выбранного окна анализа; обрезание отбрасывает часть настоящего отклика и даёт смещённую оценку H(e^jω). Правильный шаг - удлинить запись и окно анализа, пока хвост h[n] не уйдёт в шум, а не укорачивать окно, не полагаться на то, что ДПФ само всё исправит, и не обнулять хвост принудительно, ведь там ещё есть сигнал канала, а не только шум (project.txt, этап 2; Ljung, гл. 13).", "usage": {"code": false, "without": "Студент берёт первое попавшееся окно в 200 отсчётов, оценка H получается заниженной на низких частотах, и он списывает это на плохой датчик.", "with": "Он видит невспавший хвост h[n], удлиняет запись вдвое, хвост уходит в шум, и оценка H(e^jω) перестаёт быть смещённой.", "benefit": "Несмещённая оценка частотной характеристики канала."}}, {"q": "Вы спроектировали корректор АЧХ и в среде проектирования получили впечатляющее улучшение SNR на тестовом сигнале. По требованию Reality-Check из курсового проекта нужно подтвердить это независимо перед тем, как заносить цифру в отчёт. Что сделать?", "options": ["Повторить тот же расчёт SNR в той же программе проектирования на том же сигнале ещё раз для подтверждения", "Пересчитать АЧХ по реализованным коэффициентам независимо через freqz и проверить SNR на отложенном сигнале", "Доверять цифре SNR, поскольку она получена стандартной функцией проектирования, и перейти к следующему этапу", "Округлить цифру SNR в отчёте до целого числа децибел, чтобы не завышать точность результата"], "correct": 1, "explain": "Reality-Check требует пересчитать частотную характеристику независимо по реализованным коэффициентам, например через freqz, и проверить итоговый выигрыш SNR на отложенных данных, которые не использовались при настройке корректора, а также подтвердить устойчивость по реализованным коэффициентам напрямую. Повтор того же расчёта в том же инструменте на том же сигнале, слепое доверие встроенной функции или простое округление цифры независимой проверкой не являются (project.txt, Reality-Check requirement).", "usage": {"code": false, "without": "Студент переносит цифру SNR прямо из окна программы проектирования в отчёт, а на защите не может объяснить, откуда взялось число и держится ли оно на новых данных.", "with": "Он пересчитывает АЧХ из коэффициентов независимо и проверяет SNR на отложенном сигнале, поэтому на защите уверенно воспроизводит цифру по требованию.", "benefit": "Цифра SNR в отчёте, которую можно защитить и воспроизвести."}}, {"q": "В тракте от энкодера скорости до контроллера идентифицировали H(z) со смешанной фазой: один ноль передаточной функции лежит вне единичной окружности. Инженер построил точный причинный обратный фильтр 1/H(z) в виде БИХ-структуры, и при прогоне сигнал на выходе начал экспоненциально нарастать. Как правильно исправить синтез эквалайзера в этом случае?", "options": ["Заменить точную инверсию задержанной или МНК-аппроксимацией на конечном окне", "Увеличить порядок причинного инверсного фильтра, сохранив прежний метод синтеза", "Укоротить окно оценки импульсной характеристики канала перед синтезом инверсии", "Реализовать точный причинный инверсный фильтр, не проверяя расположение его полюсов"], "correct": 0, "explain": "Ноль вне единичной окружности при инверсии превращается в полю неровского подхода от прямого деления спектров?", "options": ["Он требует канал строго минимально-фазового типа, иначе решение не существует", "Он повышает коэффициент коррекции там, где шум велик, для полного его подавления", "Он игнорирует статистику шума и работает только с оценкой самого канала", "Он снижает коэффициент коррекции там, где шум велик, минимизируя ошибку"], "correct": 3, "explain": "Винеровский фильтр учитывает спектральную плотность шума и намеренно снижает коэффициент коррекции там, где шум велик, минимизируя среднеквадратичную ошибку оценки; прямое деление спектров слепо восстанавливает форму 1/H(z) и усиливает шум на тех же частотах. (Proakis & Manolakis, гл. 4)", "usage": {"code": false, "without": "Используя прямую деконволюцию не глядя на уровень шума, инженер получает восстановленный сигнал усилия с выбросами именно там, где шум датчика силён.", "with": "Применив винеровский фильтр с учётом шума, он получает более гладкую и достоверную оценку истинного сигнала усилия.", "benefit": "Снижает ложные выбросы восстановленного сигнала на шумных участках спектра."}}, {"q": "Дана ЛДС первого порядка с передаточной функцией H(z) = 2 − z^-1. Требуется построить причинную обратную систему 1/H(z). Где расположен ноль H(z) относительно единичной окружности и будет ли причинная инверсия устойчивой?", "options": ["Ноль лежит в точке 0.5, полюс инверсии вне окружности, причинная инверсия неустойчива", "Ноль лежит в точке 2, полюс инверсии внутри окружности, причинная инверсия устойчива", "Ноль лежит в точке 0.5, полюс инверсии тоже внутри окружности, причинная инверсия устойчива", "Ноль лежит в точке 2, полюс инверсии вне окружности, причинная инверсия неустойчива"], "correct": 2, "explain": "Шаг 1: ноль находится из уравнения 2 − z0^-1 = 0, откуда z0 = 0.5. Шаг 2: полюс обратной системы 1/H(z) лежит там же, в точке 0.5, то есть внутри единичной окружности. Шаг 3: для причинной системы область сходимости |z| больше 0.5 включает единичную окружность, значит ие сравнивается с ограничением Gmax = 25. Шаг 3: поскольку 50 больше 25, регуляризация обрезает усиление до предельного значения 25, не давая корректору чрезмерно поднимать шум около провала АЧХ (Proakis & Manolakis, гл. 4, деконволюция и регуляризация).", "usage": {"code": false, "without": "Без ограничения усиления корректор около глубокого провала АЧХ поднимает шум в 50 раз и забивает полезный сигнал.", "with": "Ограничив усиление корректора значением 25, инженер получает приемлемое выравнивание АЧХ без чрезмерного роста шума.", "benefit": "Защищает корректор от неконтролируемого усиления шума на провалах спектра."}}, {"q": "Для регуляризованной инверсии используется формула Heq(f) = H(f) делить на |H(f)| в квадрате плюс эпсилон, где H(f) в данной точке вещественна и положительна. На частоте f1 модуль H(f1) = 0.1, параметр регуляризации эпсилон = 0.01. Чему равны наивная инверсия 1/H(f1) и регуляризованное значение Heq(f1), и во сколько раз регуляризация снизила усиление?", "options": ["Наивная инверсия равна 5, регуляризованное значение равно 10, усиление увеличено в 2 раза", "Наивная инверсия равна 10, регуляризованное значение равно 2, усиление снижено в 5 раз", "Наивная инверсия равна 10, регуляризованное значение равно 5, усиление снижено в 2 раза", "Наивная инверсия равна 10, регуляризованное значение равно 8, усиление снижено в 1.25 раза"], "correct": 2, "explain": "Шаг 1: наивная инверсия равна 1 делить на 0.1, то есть 10. Шаг 2: регуляризованное значение равно 0.1 делить на сумму 0.01 плюс 0.01, то есть 0.1 делить на 0.02, что даёт 5. Шаг 3: отношение 10 к 5 показывает, что регуляризация снизила усиление ровно в 2 раза (Proakis & Manolakis, гл. 4, фильтр Винера как регуляризованная инверсия).", "usage": {"code": false, "without": "Прямое деление спектров у слабого H(f1) даёт корректору излишне большое усиление и он раскачивает шум измерения.", "with": "Добавив в знаменатель параметр эпсилон, инженер получает более мягкое усиление 5 вместо 10 и стабильную оценку.", "benefit": "Позволяет управляемо балансировать точность коррекции и уровень шума."}}, {"q": "Канал имеет провал АЧХ до |H(f0)| = 0.25 на частоте f0, корректор должен восстановить плоскую АЧХ, то есть |Heq(f0)| = 1/|H(f0)|. Чему равно требуемое линейное усиление корректора и сколько это в децибелах?", "options": ["Линейное усиление равно 4, что соответствует примерно 12 дБ", "Линейное усиление равно 0.25, что соответствует примерно минус 12 дБ", "Линейное усиление равно 2, что соответствует примерно 6 дБ", "Линейное усиление равно 4, что соответствует примерно 6 дБ"], "correct": 0, "explain": "Шаг 1: линейное усиление равно 1 делить на 0.25, то есть 4. Шаг 2: перевод в децибелы делается по формуле 20 умножить на логарифм по основанию 10 от усиления. Шаг 3: 20 умножить на логарифм от 4 даёт примерно 12 дБ, а не 6 дБ, которое получилось бы при ошибочном использовании множителя 10 вместо 20 (Proakis & Manolakis, гл. 4, синтез корректора АЧХ).", "usage": {"code": false, "without": "Инженер по привычке считает децибелы через 10 умножить на логарифм и занижает требуемое усиление корректора вдвое.", "with": "Применив правильную формулу 20 умножить на логарифм для амплитудного усиления, инженер закладывает в корректор верные 12 дБ.", "benefit": "Исключает типовую ошибку смешения формул дБ для мощности и для амплитуды."}}, {"q": "Корректор реализован каскадом из двух одинаковых звеньев, каждое даёт усиление 6 дБ на частоте f0. Чему равно суммарное усиление каскада в децибелах и чему оно соответствует в линейном масштабе?", "options": ["Суммарное усиление равно 36 дБ, что соответствует линейному коэффициенту около 4", "Суммарное усиление равно 6 дБ, что соответствует линейному коэффициенту около 2", "Суммарное усиление равно 12 дБ, что соответствует линейному коэффициенту около 2", "Суммарное усиление равно 12 дБ, что соответствует линейному коэффициенту около 4"], "correct": 3, "explain": "Шаг 1: усиления каскадных звеньев складываются в децибелах, поэтому суммарное усиление равно 6 плюс 6, то есть 12 дБ. Шаг 2: перевод в линейный масштаб делается по формуле 10 в степени отношения дБ к 20. Шаг 3: 10 в степени 12 делить на 20, то есть 10 в степени 0.6, даёт значение около 4, а не 2, которое получилось бы при ошибочном удвоении линейного коэффициента вместо сложения децибел (Proakis & Manolakis, гл. 4, синтез корректора АЧХ).", "usage": {"code": false, "without": "Студент складывает линейные коэффициенты звеньев вместо децибел и получает заниженную оценку суммарного усиления каскада.", "with": "Сложив вклад звеньев в децибелах и переведя результат обратно, студент верно получает суммарное усиление около 4 раз.", "benefit": "Даёт быстрый и правильный способ считать усиление многозвенных корректоров."}}, {"q": "Дана система с нулём вне единичной окружности H(z) = 1 − 3z^-1. Нужно методом гомоморфной кепстральной обработки построить минимально-фазовую систему Hmin(z) с той же АЧХ, отразив ноль внутрь окружности. Как выглядит Hmin(z) и где теперь расположен её ноль?", "options": ["Hmin = 1/3 − z^-1, новый ноль лежит в точке 3 вне окружности", "Hmin = 3 − z^-1, ноль теперь в точке 1/3 внутри окружности", "Hmin = 1 − 3z^-1, ноль остаётся в точке 3 вне окружности", "Hmin = 3 − z^-1, ноль остаётся в точке 3 вне окружности"], "correct": 1, "explain": "Шаг 1: исходный ноль находится в точке z0 = 3, что вне единичной окружности. Шаг 2: зеркальное отражение относительно окружности даёт точку 1/z0, то есть 1/3, а для сохранения той же АЧХ результат умножается на |z0| = 3, что даёт Hmin(z) = 3 − z^-1. Шаг 3: проверка показывает, что новый ноль этой системы лежит в точке 1/3, то есть внутри окружности, при этом АЧХ осталась прежней (Oppenheim & Schafer, раздел о гомоморфной обработке и минимальной фазе).", "usage": {"code": false, "without": "Зная только измеренную АЧХ, инженер берёт первую попавшуюся передаточную функцию и получает максимально-фазовый, плохо обратимый фильтр.", "with": "Через кепстр инженер восстанавливает именно минимально-фазовый вариант Hmin(z) с той же АЧХ, который затем безопасно обращается.", "benefit": "Даёт единственный вариант передаточной функции, который можно устойчиво инвертировать."}}, {"q": "На вход ЛДС подали единичный скачок и записали отклик s[n]: s[0] = 2, s[1] = 5, s[2] = 5, s[3] = 5, дальше сигнал не меняется. Оцените импульсную характеристику h[n] по правилу h[0] = s[0] и h[n] = s[n] − s[n−1] для n от 1 и выше, и определите тип и длину фильтра.", "options": ["h[0] равно 5, h[1] равно 3, дальше нули, фильтр является КИХ длиной 2 отсчёта", "h[0] равно 2, h[1] равно 3, значения продолжают расти, фильтр является БИХ", "h[0] равно 2, h[1] равно 3, дальше нули, фильтр является КИХ длиной 2 отсчёта", "h[0] равно 2, h[1] равно 5, дальше нули, фильтр всё равно является КИХ длиной 2 отсчёта"], "correct": 2, "explain": "Шаг 1: h[0] равно s[0], то есть 2. Шаг 2: h[1] равно s[1] минус s[0], то есть 5 минус 2, что даёт 3. Шаг 3: h[2] и h[3] равны s[2] минус s[1] и s[3] минус s[2] соответственно, то есть 5 минус 5, что даёт 0 в обоих случаях, значит перед нами КИХ-фильтр длиной 2 отсчёта (Proakis & Manolakis, гл. 4, связь ступенчатого и импульсного откликов).", "usage": {"code": false, "without": "Не различая ступенчатый и импульсный отклик, студент принимает значения s[n] прямо за h[n] и получает неверную модель фильтра.", "with": "Продифференцировав измеренный ступенчатый отклик, студент правильно восстанавливает короткую импульсную характеристику из двух отсчётов.", "benefit": "Позволяет получить h[n] из легко воспроизводимого на стенде ступенчатого воздействия."}}, {"q": "Импульсную характеристику двухотводного КИХ-фильтра h[0], h[1] нужно оценить по входу x[0] = 1, x[1] = 1, остальные отсчёты нулевые, и измеренному выходу y[0] = 2, y[1] = 5, y[2] = 3. Чему равны h[0] и h[1], и подтверждается ли оценка проверкой по y[1]?", "options": ["h[0] равно 2, h[1] равно 3, проверка по y[1] выполняется, оценка непротиворечива", "h[0] равно 3, h[1] равно 2, проверка по y[1] выполняется, оценка непротиворечива", "h[0] равно 5, h[1] равно 3, проверка по y[1] не выполняется, есть противоречие в данных", "h[0] равно 2, h[1] равно 3, проверка по y[1] не выполняется, есть противоречие в данных"], "correct": 0, "explain": "Шаг 1: y[0] равно h[0] умножить на x[0], откуда h[0] равно 2. Шаг 2: y[2] равно h[1] умножить на x[1], откуда h[1] равно 3. Шаг 3: подстановка в уравнение y[1] равно h[0] плюс h[1] даёт 2 плюс 3, то есть 5, что совпадает с измеренным y[1], значит оценка непротиворечива (Proakis & Manolakis, гл. 4, идентификация ЛДС по входу и выходу).", "usage": {"code": false, "without": "Оценив только два уравнения из трёх, студент пропускает проверку и не замечает, что данные могли быть противоречивыми.", "with": "Подставив найденные h[0] и h[1] в оставшееся уравнение для y[1], студент убеждается, что модель согласуется со всеми измерениями.", "benefit": "Даёт простой способ проверить оценку импульсной характеристики на согласованность."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
