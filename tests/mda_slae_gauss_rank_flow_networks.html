<style>

  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }

  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }

  }

  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }

  .usage .u-with { border-left-color: var(--good); }

  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }

  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }

  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;

</style>

нтирует, что модель сети физически корректно описывает сохранение потока."}}, {"q": "При составлении СЛАУ для дорожной сети из четырёх узлов методом Гаусса получили ранг системы меньше числа неизвестных потоков на рёбрах. Как правильно поступить дальше?", "options": ["Считать построенную сеть неверной моделью и убрать часть уравнений баланса узлов", "Выбрать недостающее число потоков свободными и выразить остальные через них", "Приравнять все потоки друг другу, чтобы избавиться от свободных переменных", "Добавить в сеть новый узел, чтобы ранг сравнялся с числом неизвестных"], "correct": 1, "explain": "Ранг меньше числа неизвестных означает n минус r степеней свободы: часть потоков выбирают свободными параметрами, а остальные выражают через них с помощью уравнений баланса узлов (capelli_rouche_theorem.txt; decomposition_presentation.txt о свободных переменных через ранг).", "usage": {"code": false, "without": "Студент считает недоопределённую систему сети ошибкой и пытается исправить саму модель вместо интерпретации результата.", "with": "Студент понимает, что свободные переменные — нормальное следствие структуры сети, и выражает зависимые потоки через них.", "benefit": "Позволяет корректно параметризовать все допустимые распределения потоков в сети."}}, {"q": "В городской дорожной сети три улицы сходятся в одном перекрёстке: по двум въезжают потоки 300 и 150 машин в час, по третьей улице поток x выезжает из перекрёстка. Какое условие должно выполняться для потока x согласно балансу узла?", "options": ["Поток x равен сумме въезжающих потоков, то есть 450 машин в час", "Поток x равен наибольшему из въезжающих потоков, то есть 300 машин в час", "Поток x равен разности въезжающих потоков, то есть 150 машин в час", "Поток x равен среднему въезжающих потоков, то есть 225 машин в час"], "correct": 0, "explain": "Баланс узла требует, чтобы сумма входящих потоков равнялась сумме исходящих: 300+150=450, значит x=450. Это прямое применение закона сохранения потока в узле, а не  узлов, умноженному на два", "Ранг матрицы коэффициентов не зависит от числа уравнений сети"], "correct": 1, "explain": "Если одно из уравнений сети линейно выражается через остальные — здесь их сумма даёт 0=0 — строки матрицы коэффициентов линейно зависимы, и ранг оказывается меньше числа уравнений, то есть не более трёх. Это типичная ситуация для замкнутых сетей потоков. (capelli_rouche_theorem.txt)", "usage": {"code": false, "without": "Не зная этого, аналитик ищет единственное решение там, где система по построению недоопределена.", "with": "Понимая природу зависимости уравнений, он сразу ожидает свободные параметры в решении.", "benefit": "Верная интерпретация решения сети потоков вместо ошибочного вывода о единственности."}}, {"q": "Инженер сети предполагал, что участок дороги C независим от участков A и B, но новые данные показывают, что поток на C всегда равен сумме потоков A и B. Как это открытие меняет число свободных параметров в общем решении СЛАУ для сети, если число неизвестных потоков осталось прежним?", "options": ["Число свободных параметров остаётся прежним", "Число свободных параметров становится равным нулю", "Число свободных параметров увеличивается на единицу", "Число свободных параметров уменьшается на единицу"], "correct": 2, "explain": "Число свободных переменных равно n−r, где r — ранг матрицы. Если уравнение для C оказывается линейной комбинацией уравнений для A и B, ранг r уменьшается на единицу, а значит n−r, то есть число свободных параметров, увеличивается на единицу. (capelli_rouche_theorem.txt)", "usage": {"code": false, "without": "Без учёта зависимости уравнений аналитик считает решение более определённым, чем оно есть на самом деле.", "with": "Обнаружив зависимость, он корректно указывает дополнительную степень свободы в распределении потоков.", "benefit": "Точная оценка неопределённости модели сети."}}, {"q": "После приведения расширенной матрицы СЛАУ дорожной сети к ступенчатому виду методом Гаусса в последней строке получилась запись 0 0 0 | 12. Что это означает для измеренных потоков сети?", "options": ["Система несовместна: измеренные потоки в сети противоречат друг другу", "Система имеет бесконечно много решений с одним свободным параметром", "Система имеет единственное решение, при котором все потоки равны двенадцати", "Система имеет решение, где один поток равен двенадцати, а остальные однозначны"], "correct": 0, "explain": "Строка 0 0 0 | 12 означает уравнение 0=12 — противоречие. По теореме Руше-Капелли это значит rank(A) меньше rank(A|b), и система несовместна: измеренные потоки в сети физически противоречивы, например из-за ошибки датчика. (capelli_rouche_theorem.txt)", "usage": {"code": false, "without": "Не распознав противоречивую строку, аналитик пытается найти несуществующее решение сети.", "with": "Он сразу видит несовместность и ищет ошибку в измерениях, а не в вычислениях.", "benefit": "Быстрая локализация ошибки в исходных данных сети, а не в методе решения."}}, {"q": "Студент решал СЛАУ дорожной сети методом Гаусса и в ступенчатом виде получил строку 0 0 0 | 0, после чего сделал вывод, что система не имеет решений. В чём заключается его ошибка?", "options": ["Строка 0 0 0 | 0 означает единственное решение с нулевыми значениями потоков", "Строка 0 0 0 | 0 означает ошибку в исходных данных, а не свойство системы", "Строка 0 0 0 | 0 означает необходимость поменять местами две строки матрицы", "Строка 0 0 0 | 0 означает не отсутствие решений, а наличие свободного параметра"], "correct": 3, "explain": "Нулевая строка в ступенчатом виде — это тождество 0=0, оно не противоречиво и означает, что одно уравнение было линейно зависимо от остальных. Ранг матрицы оказывается меньше числа неизвестных, поэтому решений бесконечно много и появляется свободный параметр, а не отсутствие решений. (capelli_rouche_theorem.txt)", "usage": {"code": false, "without": "Ошибочный вывод об отсутствии решения заставляет заново пересчитывать всю модель сети.", "with": "Верное понимание нулевой строки сразу даёт корректную структуру решения с параметром.", "benefit": "Экономия времени за счёт правильной диагностики результата Гаусса."}}, {"q": "При решении СЛАУ для сети из трёх перекрёстков на очередном шаге элиминации ведущий элемент оказался равен нулю, но студент продолжил вычисления без перестановки строк и разделил следующую строку на этот нулевой элемент. Что стало прямым следствием этой ошибки?", "options": ["Число свободных переменных уменьшается без изменения системы", "Ступенчатый вид становится некорректным из-за деления на ноль", "Ранг итоговой матрицы оказывается завышен на единицу", "Определитель матрицы меняет знак без изменения строк"], "correct": 1, "explain": "Деление строки на нулевой ведущий элемент математически не определено: без предварительной перестановки строк с ненулевым элементом ниже элиминация ломается, и любой дальнейший ступенчатый вид, ранг или решение оказываются некорректными. (presentation_Gauss.txt)", "usage": {"code": false, "without": "Пропуск перестановки строк даёт студенту вычисления, которые выглядят правдоподобно, но неверны.", "with": "Проверка ведущего элемента перед делением сразу выявляет необходимость перестановки строк.", "benefit": "Надёжный алгоритм Гаусса без скрытых вычислительных ошибок."}}, {"q": "Для дорожной сети число неизвестных потоков на рёбрах равно четырём, а независимых уравнений баланса узлов — только трём, так как одно уравнение линейно зависимо от остальных. Почему правило Крамера здесь напрямую неприменимо, а метод Гаусса остаётся рабочим инструментом?", "options": ["Правило Крамера требует положительные коэффициенты матрицы", "Правило Крамера требует целочисленные значения решений", "Правило Крамера требует квадратную невырожденную матрицу", "Правило Крамера требует симметричную матрицу коэффициентов"], "correct": 2, "explain": "Метод Крамера применим только к квадратным системам с ненулевым определителем матрицы коэффициентов. Когда независимых уравнений меньше, чем неизвестных, матрица не квадратная и определитель не определён, тогда как метод Гаусса работает для любых систем и сразу показывает ранг и свободные параметры. (presentation_Gauss.txt)", "usage": {"code": false, "without": "Попытка применить правило Крамера к недоопределённой сети приводит в тупик уже на первом шаге.", "with": "Выбор метода Гаусса сразу даёт рабочий алгоритм для системы с меньшим числом уравнений, чем неизвестных.", "benefit": "Правильный выбор метода решения экономит время при анализе сети."}}, {"q": "В существующей дорожной сети между двумя ранее не связанными перекрёстками построили новую улицу. В СЛАУ добавилась одна новая неизвестная величина потока, а число независимых уравнений баланса узлов осталось тем же. Что произойдёт с рангом матрицы коэффициентов системы?", "options": ["Ранг матрицы коэффициентов не может увеличиться сверх числа уравнений сети", "Ранг матрицы коэффициентов обязательно станет равным нулю после добавления улицы", "Ранг матрицы коэффициентов уменьшится, так как добавилась новая переменная", "Ранг матрицы коэффициентов обязательно увеличится на единицу вместе с числом неизвестных"], "correct": 0, "explain": "Ранг матрицы не может превышать число строк, то есть число независимых уравнений. Если число уравнений не изменилось, ранг остаётся ограниченным тем же числом, даже если неизвестных стало больше — просто вырастет число свободных параметров n−r. (capelli_rouche_theorem.txt)", "usage": {"code": false, "without": "Ошибочно предполагая рост ранга, аналитик неверно оценивает определённость решения.", "with": "Зная предел ранга по числу уравнений, он сразу пересчитывает число свободных параметров.", "benefit": "Верная оценка того, насколько сеть остаётся недоопределённой после расширения."}}, {"q": "Проверяя, вырождена ли матрица коэффициентов сети, студент в процессе элиминации переставил две строки, но забыл сменить знак определителя, как того требует правило Гаусса. Как эта забытая деталь сказалась на итоговом выводе о ранге матрицы?", "options": ["Ранг матрицы оказался занижен на единицу из-за пропущенной смены знака", "Ранг матрицы оказался завышен на единицу из-за пропущенной смены знака", "Ранг матрицы стало невозможно определить без учёта знака определителя", "Ранг матрицы не изменился, так как перестановка строк не меняет ранг"], "correct": 3, "explain": "Перестановка строк — одна из элементарных операций метода Гаусса, она не влияет на ранг матрицы, а меняет только знак определителя. Пропущенная смена знака исказит вычисленное значение определителя, но вывод о ранге, основанный на числе ненулевых строк ступенчатого вида, останется верным. (presentation_Gauss.txt)", "usage": {"code": false, "without": "Путая влияние перестановки строк на определитель и на ранг, студент делает лишний ошибочный вывод.", "with": "Различая эти два эффекта, он корректно исправляет только знак определителя, не трогая ранг.", "benefit": "Точная локализация того, какая именно характеристика матрицы пострадала от ошибки."}}, {"q": "Дана система линейных уравнений: 2x + 3y = 7; x − y = 1. Решите систему методом Крамера и найдите x и y.", "options": ["x=-2, y=-1", "x=2, y=-1", "x=2, y=1", "x=1, y=2"], "correct": 2, "explain": "Шаг 1: главный определитель D = 2·(−1) − 3·1 = −5. Шаг 2: Dx заменяет первый столбец на свободные члены: Dx = 7·(−1) − 3·1 = −10, откуда x = Dx/D = 2. Шаг 3: Dy = 2·1 − 7·1 = −5, откуда y = Dy/D = 1. Второй вариант получается, если перепутать x и y при подстановке в определители (trial_test1_premasters_UWE_2025.txt).", "usage": {"code": false, "without": "Аналитик решает систему уравнений подбором и тратит время на проверку разных комбинаций чисел, рискуя пропустить единственное точное решение.", "with": "Аналитик применяет правило Крамера и за три определителя сразу получает точные значения x и y без перебора.", "benefit": "Быстрый и надёжный расчёт точного решения системы без метода проб и ошибок."}}, {"q": "Дана система: x + y + z = 6; 2x − y + z = 3; x + 2y − z = 2. Решите систему методом Крамера и найдите x, y, z.", "options": ["x=1, y=2, z=3", "x=2, y=1, z=3", "x=1, y=-2, z=3", "x=1, y=2, z=-3"], "correct": 0, "explain": "Шаг 1: определитель матрицы коэффициентов D = 7. Шаг 2: заменив столбец y на свободные члены, получаем Dy = 14, откуда y = Dy/D = 2. Шаг 3: аналогично Dx = 7 даёт x = 1, а Dz = 21 даёт z = 3. Первый вариант — результат ошибки в знаке при вычислении Dz (trial_test1_premasters_UWE_2025.txt).", "usage": {"code": false, "without": "При ручном переборе трёхмерной системы легко перепутать переменные и получить решение, не удовлетворяющее всем трём уравнениям.", "with": "Правило Крамера через определители даёт каждую переменную независимо и позволяет сразу проверить результат подстановкой.", "benefit": "Контролируемый расчёт каждой переменной системы без накопления ошибок между шагами."}}, {"q": "Дана система: 4x + y = 9; x + y = 3. Решите систему методом обратной матрицы и найдите x и y.", "options": ["x=13, y=4", "x=6, y=3", "x=4, y=7", "x=2, y=1"], "correct": 3, "explain": "Шаг 1: определитель матрицы A равен 4·1 − 1·1 = 3. Шаг 2: обратная матрица A⁻¹ = 1/3, умноженная на присоединённую матрицу с элементами 1, −1, −1, 4. Шаг 3: умножив A⁻¹ на вектор свободных членов 9 и 3, получаем x = (9−3)/3 = 2, y = (−9+12)/3 = 1. Первый вариант получается, если забыть разделить на определитель (trial_test1_premasters_UWE_2025.txt).", "usage": {"code": false, "without": "Аналитик каждый раз решает похожую систему заново, не замечая, что коэффициенты не меняются между запусками модели.", "with": "Аналитик один раз находит обратную матрицу и затем быстро получает решение для любого нового вектора свободных членов.", "benefit": "Однократный расчёт обратной матрицы ускоряет повторные решения похожих систем."}}, {"q": "Дана система: x + z = 4; x + y = 5; y + z = 5. Решите систему методом обратной матрицы и найдите x, y, z.", "options": ["x=1, y=3, z=2", "x=2, y=3, z=2", "x=4, y=6, z=4", "x=3, y=2, z=3"], "correct": 1, "explain": "Шаг 1: определитель матрицы коэффициентов равен 2. Шаг 2: присоединённая матрица, делённая на 2, даёт обратную матрицу с элементами 0.5, 0.5, −0.5 в первой строке и аналогичными в остальных. Шаг 3: умножив обратную матрицу на вектор свободных членов 4, 5, 5, получаем x=2, y=3, z=2. Первый вариант получается, если забыть разделить произведение на определитель (practice_4_premasters_2025.txt).", "usage": {"code": false, "without": "Инженер данных пересчитывает систему балансовых уравнений вручную при каждом изменении входных данных, теряя время на повторную элиминацию.", "with": "Инженер данных один раз строит обратную матрицу коэффициентов и подставляет в неё любые новые значения правой части.", "benefit": "Обратная матрица превращает решение системы в одно умножение вместо полного пересчёта."}}, {"q": "Дана система: 4x + 3y = 18; 2x − 3y = 0. Решите систему методом Гаусса и найдите x и y.", "options": ["x=2, y=3", "x=3, y=-2", "x=3, y=2", "x=4.5, y=3"], "correct": 2, "explain": "Шаг 1: складываем уравнения, чтобы исключить y: 6x = 18, откуда x = 3. Шаг 2: подставляем x = 3 во второе уравнение 2x − 3y = 0 и получаем 6 − 3y = 0. Шаг 3: отсюда y = 2. Первый вариант появляется при ошибке знака во время подстановки (list_of_problems_gauss.txt).", "usage": {"code": false, "without": "Аналитик решает пару линейных ограничений подбором значений и рискует принять неверную точку пересечения за решение.", "with": "Аналитик последовательно исключает переменные методом Гаусса и получает единственную точку пересечения за два шага.", "benefit": "Метод Гаусса даёт точное решение системы без визуального угадывания графиков."}}, {"q": "Дана система: x + 2y + z = 9; 2x + y − z = 3; 3x − y + 2z = 10. Решите систему методом Гаусса и найдите x, y, z.", "options": ["x=2, y=2, z=3", "x=-1, y=3, z=2", "x=2, y=3, z=2", "x=4, y=1, z=3"], "correct": 0, "explain": "Шаг 1: вычитаем удвоенную и утроенную первую строку из второй и третьей, получая систему для y и z. Шаг 2: комбинируя новые строки, находим y = 2. Шаг 3: обратным ходо i_rouche_theorem.txt).", "usage": {"code": false, "without": "Аналитик путает rank матрицы с числом столбцов и ожидает четыре независимых направления там, где реально работают только два.", "with": "Аналитик приводит матрицу к ступенчатому виду методом Гаусса и получает точное число независимых строк.", "benefit": "Rank матрицы, а не число столбцов, показывает истинную размерность данных."}}, {"q": "Дана система с параметром a: x + y + z = 1; x + 2y + z = 2; x + y + a·z = a. По теореме Rouché–Capelli определите, при каком условии на a система имеет единственное решение, а при каком — бесконечно много решений.", "options": ["При a не равно 1 система имеет единственное решение, при a равно 1 система является несовместной", "При a не равно 1 система имеет бесконечно много решений, при a равно 1 система имеет единственное решение", "При a не равно 1 система имеет единственное решение, при a равно 1 система имеет бесконечно много решений", "При a не равно 1 система является несовместной, при a равно 1 система имеет единственное решение"], "correct": 2, "explain": "Шаг 1: определитель матрицы коэффициентов равен a − 1, значит при a не равно 1 rank матрицы коэффициентов равен 3 и решение единственно. Шаг 2: при a = 1 третья строка коэффициентов совпадает с первой, и rank падает до 2. Шаг 3: при a = 1 третья строка расширенной матрицы тоже совпадает с первой, поэтому rank расширенной матрицы также равен 2, система остаётся совместной с бесконечным числом решений (capelli_rouche_theorem.txt).", "usage": {"code": false, "without": "Аналитик решает систему с настраиваемым параметром модели один раз для конкретного числа и не замечает, что при особом значении параметра решение перестаёт быть единственным.", "with": "Аналитик через теорему Rouché–Capelli заранее находит критическое значение параметра и знает, при каком условии решение единственно.", "benefit": "Теорема Rouché–Capelli заранее предсказывает поведение решения при критическом значении параметра модели."}}, {"q": "Дан базис пространства: e1 = 1, 0, 0; e2 = 1, 1, 0; e3 = 1, 1, 1. Разложите вектор v = 4, 3, 2 по этому базису и найдите коэффициенты c1, c2, c3.", "options": ["c1=1, c2=1, c3=2", "c1=1, c2=2, c3=1", "c1=4, c2=3, c3=2", "c1=-2, c2=1, c3=1"], "correct": 0, "explain": "Шаг 1: третья координата вектора v равна только c3, поэтому c3 = 2. Шаг 2: вторая координата равна c2 + c3 = 3, откуда c2 = 1. Шаг 3: первая координата равна c1 + c2 + c3 = 4, откуда c1 = 1. Последний вариант получается, если по ошибке принять координаты вектора за сами коэффициенты разложения (decomposition_presentation.txt).", "usage": {"code": false, "without": "Аналитик описывает наблюдение сразу через сырые координаты и теряет связь с содержательными направлениями базиса.", "with": "Аналитик раскладывает вектор наблюдения по базису и получает содержательные коэффициенты вдоль каждого направления.", "benefit": "Разложение по базису переводит сырые координаты в интерпретируемые веса вдоль выбранных направлений."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
