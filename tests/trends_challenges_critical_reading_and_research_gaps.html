<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRC: Тренды и вызовы: критическое чтение, состояние области, research gap</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>TRC: Тренды и вызовы: критическое чтение, состояние области, research gap</h1>

</div>

    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncMergeBtn">🔄 Синхронизировать (свежее побеждает)</button>
    <button class="btn secondary" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "trends_challenges_critical_reading_and_research_gaps";
  const QUESTIONS = [{"q": "Курс различает тему, пробел и исследовательский вопрос. В чём различие между ними?", "options": ["Тема — чего область не сделала, пробел — что вам интересно, вопрос — с чего вы начнёте работу", "Тема — что вам интересно, пробел — чего область не сделала, вопрос — что вы можете с этим сделать", "Тема это название домена, пробел это список непрочитанных статей, вопрос это заголовок отчёта", "Тема и пробел это синонимы, а исследовательский вопрос это их формулировка в вопросительной форме"], "correct": 1, "explain": "Три разные сущности: тема это ваш интерес, пробел это свойство литературы, вопрос это ваше действие, и весь курс есть расстояние между этими тремя фразами. Самый частый провал в отчёте как раз третий вариант — считать тему и пробел одним и тем же: тогда вопрос получается переформулированной темой, в нём нет утверждения об области, и защищать на панели нечего. Пробел всегда утверждение о том, чего в литературе нет, и его надо доказывать. Лекция 1, раздел воронки.", "usage": {"code": false, "without": "В отчёте заявлена тема коллаборативной робототехники, названная пробелом, и панель спрашивает, какая именно работа отсутствует, а ответа нет.", "with": "Пробел сформулирован как отсутствие испытаний на реальном контроллере, и вопрос спрашивает ровно про это.", "benefit": "Пробел становится проверяемым утверждением, а не заголовком."}}, {"q": "Какие три домена курс называет своим предметным пространством в первом блоке?", "options": ["Компьютерное зрение, цифровая обработка сигналов, управление техническими системами", "IoT и умные встраиваемые системы, коллаборативная робототехника, прикладной ИИ и автономные системы", "Умное производство, умное здравоохранение и точное земледелие как три крупнейшие тематические группы корпуса", "IoT и умные встраиваемые системы, промышленная автоматизация, блокчейн для цепочек поставок"], "correct": 1, "explain": "Программа организует предметное пространство в три домена, и они сходятся в стеке умной ячейки: кобот с встраиваемыми датчиками, edge-ИИ для восприятия и цифровой двойник. Самый коварный вариант это умное производство, здравоохранение и земледелие: это реальные названия, но не доменов, а тематических групп корпуса, и смешение домена с темой корпуса ломает аргумент о центральности. Блокчейн для цепочек поставок в корпусе присутствует, но курс прямо называет его периферийной темой. Лекция 1, раздел 01.", "usage": {"code": false, "without": "Домен выбран как блокчейн для цепочек поставок, и на защите выясняется, что это не метод систем или робототехники.", "with": "Домен выбран внутри трёх названных, и каждая статья корпуса ложится либо в его ядро, либо на шов с соседним.", "benefit": "Выбор домена не придётся менять в середине курса."}}, {"q": "В какой клетке сетки зрелость подхода на открытость задачи живёт диссертационный вопрос?", "options": ["Подход только формируется, задача по сути решена, остались инженерные детали", "Подход только формируется, задача остаётся нерешённой", "Подход устоялся, задача решена: здесь результаты воспроизводимы и легко публикуются", "Подход устоялся, задача остаётся нерешённой, а бенчмарки уже стабильны"], "correct": 1, "explain": "Вопрос живёт там, где пересекаются важность и нерешённость: подход ещё формируется, авторы по-настоящему расходятся в выборе, а задача остаётся открытой. Соблазнительный второй вариант описывает консолидацию: устоявшийся подход и стабильные бенчмарки означают, что спорить уже не о чем, и работа превращается в инженерное усилие. Клетка с решённой задачей и воспроизводимыми результатами соблазнительна для отчёта, но из неё не выйдет диссертация. Лекция 1, раздел 02.", "usage": {"code": false, "without": "Вопросом выбрано сравнение двух устоявшихся планировщиков на стандартном бенчмарке, и панель спрашивает, что в этом открытого.", "with": "Вопрос нацелен на край, где подходы расходятся, и у панели есть что обсуждать по существу.", "benefit": "Вопрос остаётся обсуждаемым, а не очевидным."}}, {"q": "Правило одного домена: зачем курс требует выбрать домен в первой сессии и нести его до защиты?", "options": ["Чтобы отчёт на 2000-2500 слов уложился в объём: два домена туда физически не поместятся", "Чтобы первый обзор был критическим чтением, а не изучением словаря незнакомой области", "Чтобы корпус из 74 статей делился между студентами по доменам без пересечений", "Чтобы руководитель мог назначить домен за студента и сравнивать работы между собой"], "correct": 1, "explain": "Широта допускается только в первой сессии, дальше идёт глубина, и домен советуют привязать к уже прослушанному курсу: иначе первые недели уходят на освоение терминологии, а не на критический разбор. Вариант про деление корпуса звучит организационно убедительно и прямо противоречит устройству курса: корпус общий для всего потока, его никто не делит, и именно поэтому преимущество даёт глубина чтения. Объём отчёта тут не причина, а следствие. Лекция 1 и слайды сессии 1.", "usage": {"code": false, "without": "Домен выбран из незнакомой области, и первые четыре недели уходят на разбор базовых понятий вместо критики статей.", "with": "Домен привязан к уже прослушанному курсу по робототехнике, и чтение сразу идёт на уровне метода.", "benefit": "Недели курса тратятся на критику, а не на словарь."}}, {"q": "Какова последовательность семи полос воронки курса?", "options": ["Вопрос, ландшафт, корпус, аппрейзал, синтез, пробел, значимость", "Корпус, ландшафт, синтез, пробел, аппрейзал, значимость, вопрос", "Ландшафт, корпус, синтез, аппрейзал, вопрос, пробел, значимость", "Ландшафт, корпус, аппрейзал, синтез, пробел, значимость, вопрос"], "correct": 3, "explain": "Воронка сужается от области к одному вопросу: сначала ландшафт, затем корпус, критическая оценка каждой работы, синтез в сравнительную матрицу, пробел, его значимость и только в конце вопрос. Самый притягательный неверный порядок начинается с вопроса: так работает большинство новичков, и дальше поиск превращается в сбор подтверждений уже выбранной идеи, а пробел подгоняется под вопрос вместо обратного. Аппрейзал обязан идти до синтеза, иначе сравниваются работы разной надёжности. Лекция 1, раздел воронки.", "usage": {"code": false, "without": "Работа начинается с понравившегося вопроса, корпус читается в поисках подтверждений, и панель находит статью, которая вопрос закрывает.", "with": "Вопрос появляется последним, после синтеза и проверки пробела, и выдерживает поиск контрпримеров.", "benefit": "Вопрос опирается на обзор, а не обзор на вопрос."}}, {"q": "Почему поиск в режиме набрать пару слов в Google Scholar и прочитать первую страницу курс называет провалом новичка?", "options": ["Он требует подписки, тогда как Scopus и IEEE Xplore доступны студентам бесплатно", "Он выдаёт слишком много результатов, из которых невозможно отобрать 74 статьи за отведённое время", "Google Scholar индексирует только препринты, поэтому рецензируемых статей в выдаче не окажется", "Он невоспроизводим, смешивает площадки и пропускает и семинальные, и самые новые работы"], "correct": 3, "explain": "Выдача меняется день ко дню, протокола нет, рядом лежат статьи Q1, препринты и блоги, а семинальные работы тонут под цитированиями, тогда как самые свежие ещё не поднялись. Пробел, найденный так, это пробел в вашем чтении, и панель вскрывает его за десять секунд. Утверждение, что Scholar индексирует только препринты, просто неверно: он индексирует всё, включая списки литературы, и именно поэтому его выдача не доказывает существование статьи. Лекция 1, раздел 03.", "usage": {"code": false, "without": "Пробел найден по первой странице выдачи, и на защите показывают статью Q1 2024 года, которая его закрывает.", "with": "Поиск идёт по логированной булевой строке в IEEE Xplore и Scopus, и перечень исключений приложен к отчёту.", "benefit": "Пробел защищается протоколом, а не памятью о выдаче."}}, {"q": "Как строится булева строка систематического поиска?", "options": ["Синонимы внутри концептуального блока через AND, а блоки между собой через OR", "Синонимы внутри концептуального блока через OR, а блоки между собой через AND", "Все термины соединяют через OR, чтобы ни одна релевантная статья не выпала из выдачи", "Все термины соединяют через AND, чтобы каждый результат содержал весь список целиком"], "correct": 1, "explain": "Тему разбивают на концептуальные блоки, каждый результат обязан затронуть все блоки, поэтому между блоками стоит AND; внутри блока перечисляют синонимы через OR, чтобы не потерять статью, которая назвала то же другим словом. Перестановка операторов, то есть второй вариант, это самая частая ошибка: AND внутри блока требует, чтобы в статье встретились сразу cobot и human-robot collaboration, и выдача рушится до единиц. Лекция 1, раздел 03, пример по collision detection.", "usage": {"code": false, "without": "Синонимы соединены через AND, выдача по безопасности коботов даёт девять статей, и область объявляется неисследованной.", "with": "Строка из трёх блоков с синонимами через OR даёт около 280 результатов, из которых после скрининга остаётся 40.", "benefit": "Размер выдачи отражает область, а не синтаксис запроса."}}, {"q": "Весь поток получил один и тот же корпус из 74 статей. Что в этих условиях отличает сильный обзор от слабого?", "options": ["Глубина и качество собственного чтения: выбор ядра, замеченные противоречия и ограничения", "Доступ к дополнительным статьям, найденным вне общего корпуса по собственной булевой строке поиска", "Скорость сдачи: чем раньше сдан отчёт, тем подробнее обратная связь от руководителя", "Число процитированных из корпуса статей: чем ближе к 74, тем полнее охват области"], "correct": 0, "explain": "Доступ у всех одинаковый, поэтому преимущество может дать только чтение: какое ядро вы выбрали, какие натяжения между работами заметили, какие ограничения вытащили из текста. Вариант про число процитированных статей выглядит как показатель трудолюбия и работает против вас: двенадцать прочитанных вглубь статей сильнее семидесяти пролистанных, а ется на отсутствие статей в выдаче Google Scholar по точной формулировке пробела и по его синонимам"], "correct": 0, "explain": "Верхняя полоса требует трёх вещей: конкретности, типа пробела и доказательства открытости, причём молчание литературы нужно не объявить, а показать и затем самому попробовать его опрокинуть. Опора на чужой future work особенно соблазнительна, потому что выглядит как цитируемое основание: это зацепка, а не доказательство, ведь статья года могла уже закрыть то, что статья трёхлетней давности назвала открытым. Широкая формулировка снижает оценку за конкретность. Рубрика отчёта, критерий подлинности.", "usage": {"code": false, "without": "Пробел обоснован фразой из future work статьи 2021 года, и панель показывает работу 2024 года, его закрывающую.", "with": "Молчание показано поиском по трём базам, попытка опрокинуть пробел проведена самим автором и описана.", "benefit": "Пробел выдерживает первый же вопрос панели."}}, {"q": "Почему утверждение этого никто не делал само по себе не делает пробел исследовательским?", "options": ["Не сделанное может быть неважным или уже закрытым: нужны и признак важности, и доказательство открытости", "Нужно, чтобы этого не делали именно в журналах Q1, а в остальных площадках это допустимо", "Важность на этом курсе не оценивается, она появляется только на этапе Research Methodology", "Не сделанное всегда уже закрыто в препринтах, которые корпус исключил правилом EX-2 при скрининге"], "correct": 0, "explain": "Вопрос живёт на пересечении важного и нерешённого, поэтому одного отсутствия мало: не делали в том числе потому, что никому не нужно, и не делали в вашей выдаче, а не в литературе. Четвёртый вариант выглядит как аккуратное применение протокола и переворачивает его смысл: корпус ограничен Q1 ради надёжности доказательств, но пробел, закрытый работой на ICRA, закрыт по факту, и панель её приведёт. Значимость курс оценивает прямо, отдельным критерием рубрики. Лекция 1, раздел 02 и рубрика отчёта.", "usage": {"code": false, "without": "Пробел обоснован тем, что в Q1 таких работ нет, и панель приводит статью ICRA, закрывающую его полностью.", "with": "Открытость показана по всем площадкам, а важность аргументирована отдельно, на двух ступенях.", "benefit": "Пробел закрывает оба требования, а не одно."}}, {"q": "Как по рубрике аргументируют значимость пробела на отличную оценку?", "options": ["На двух и более ступенях, научной, инженерной и RIS3, с названными выгодоприобретателями", "Через цитируемость статей, в которых пробел упомянут: она измеряет интерес области к нему", "На одной ступени, но максимально подробно: несколько ступеней размывают основной аргумент", "Через объём рынка выбранного домена и прогноз его роста до 2030 года по отчётам аналитиков"], "correct": 0, "explain": "Верхняя полоса требует значимости на двух и более ступенях — научной, инженерной, стратегии RIS3 — и чтобы выгодоприобретатель был назван, а не подразумевался. Вариант об одной ступени подробно соответствует середине рубрики, то есть набирает проходной балл и не более: он звучит как профессиональная сдержанность, но рубрика платит именно за несколько независимых оснований. Рыночные прогнозы к ступеням не относятся. Рубрика отчёта, критерий значимости.", "usage": {"code": false, "without": "Значимость обоснована интересом области, выгодоприобретатель не назван, и критерий уходит в среднюю полосу.", "with": "Значимость аргументирована научной и инженерной ступенями с указанием на интеграторов коботов и приоритет мехатроники в RIS3.", "benefit": "Значимость получает названных адресатов."}}, {"q": "Что отличает исследовательский вопрос верхней полосы от просто ясного и отвечаемого?", "options": ["Он состоятелен по FINER, называет свою метрику, разбивается на подвопросы и реалистичен по ресурсам", "Он сформулирован настолько широко, что любой результат эксперимента окажется на него ответом", "Он содержит гипотезу и ожидаемый численный результат, заявленный заранее, до эксперимента", "Он совпадает с формулировкой future work той статьи, из которой выведен заявленный пробел"], "correct": 0, "explain": "Средняя полоса это ясный и отвечаемый вопрос; верхняя добавляет состоятельность по FINER, названную метрику, декомпозицию на подвопросы и выполнимость в доступных ресурсах. Последний вариант выглядит строго научным и смешивает вопрос с предсказанием: заявленный заранее численный результат это гипотеза, и подменяя им вопрос, вы заранее фиксируете ответ, а метрику при этом всё равно не называете. Рубрика отчёта, критерий вопроса.", "usage": {"code": false, "without": "Вопрос сформулирован как повышает ли глубокое обучение безопасность коботов, метрики нет, и эксперимент невозможно спроектировать.", "with": "Вопрос называет платформу, порог задержки и допустимую долю ложных срабатываний, и из него сразу видно, что измерять.", "benefit": "Из вопроса выводится план эксперимента."}}, {"q": "Два варианта вопроса. A: доедет ли UR5e до обученной декартовой позы. B: обнаружит ли TinyML-классификатор столкновение быстрее 50 мс на собственном Cortex-M7 кобота при изменении полезной нагрузки. Что из них диссертационное?", "options": ["Оба: A даёт базовую линию, B её расширяет, поэтому вместе они образуют пару вопросов", "A: его проще проверить экспериментально, а для B нужно оборудование, которого нет", "B: вопрос конкретен, важен для безопасности и не решён на реальном контроллере", "B: в нём больше технических терминов и прямо названа модель микроконтроллера"], "correct": 2, "explain": "A это обратная кинематика серийного кобота, то есть готовая функция контроллера: инженерное усилие, а не исследование. B конкретен, безопасностно значим, и доказательством его открытости служит отсутствие испытаний на собственном контроллере при меняющейся нагрузке. Третий вариант отбраковывается специально: насыщенность терминами и названная модель микроконтроллера это признак конкретности формулировки, а не признак того, что задача открыта, и путать их легко. Лекция 1, worked judgement.", "usage": {"code": false, "without": "В вопрос выносится достижимость обученной позы, и панель отвечает, что это делает штатная функция контроллера.", "with": "Вопрос нацелен на задержку обнаружения на собственном MCU, и отсутствие таких испытаний в корпусе показано.", "benefit": "Вопрос не закрывается ссылкой на документацию производителя."}}, {"q": "Где по курсу живут самые богатые пробелы в стеке умной ячейки?", "options": ["В цифровом двойнике: RoboDK и OPC-UA в статьях общего корпуса пока вообще не описаны", "На швах: уместить полезную модель в MCU контроллера или сертифицировать обученное поведение безопасности", "В центре каждого домена: там накоплено больше данных и стабильных бенчмарков для честного сравнения подходов", "В задачах, где три домена не пересекаются, поэтому конкуренция за публикации там ниже"], "correct": 1, "explain": "Три домена сходятся в стеке промышленной ячейки с коботом, встраиваемым сенсорикой, edge-ИИ и цифровым двойником, и именно на стыках остаются вопросы: уместить полезную модель в контроллер, доказать безопасность обученного поведения. Вариант про центр домена звучит разумно и ведёт в консолидацию: там как раз стабильные бенчмарки и выход результатов на плато. Утверждение, что двойника нет в корпусе, проверяется и не подтверждается. Слайды сессии 1, часть 1.", "usage": {"code": false, "without": "Пробел ищут в центре домена, где устоявшихся бенчмарков больше всего, и он оказывается закрытым.", "with": "Пробел найден на шве между edge-ИИ и контроллером кобота, и его открытость подтверждается отсутствием испытаний на оборудовании.", "benefit": "Пробел ищется там, где области ещё не договорились."}}, {"q": "Что даёт знание площадок вроде T-RO, RA-L, IoT-J, ICRA и IROS?", "options": ["Готовый список статей для ядра: достаточно взять последние выпуски этих площадок", "Критерий Q1: все перечисленные площадки по определению относятся к первому квартилю", "Оценку значимости пробела: публикация в T-RO сама по себе доказывает, что пробел открыт", "Понимание, где оседает серьёзная работа, и куда направлять систематический поиск"], "correct": 3, "explain": "Знание площадок это половина знания области: оно говорит, куда направить строку поиска и где искать и семинальные, и свежие работы. Последний вариант самый коварный: ICRA и IROS это конференции, и протокол корпуса снял конференционные работы правилом EX-2 независимо от их престижа, поэтому площадка не равна квартилю. Публикация в сильном журнале говорит о качестве работы, а не об открытости пробела. Лекция 1, раздел 01.", "usage": {"code": false, "without": "Строку поиска запускают без привязки к площадкам, выдача смешивает журналы и блоги, и отбор приходится начинать заново.", "with": "Поиск нацелен на профильные площадки, а статус каждой проверяется по квартилю отдельно.", "benefit": "Поиск идёт туда, где лежит релевантная работа."}}, {"q": "Для чего в отчёте используют стратегию RIS3 Латвии и роудмэп IEEE RAS?", "options": ["Чтобы аргументировать значимость пробела и локально, и на мировом фронте", "Чтобы доказать открытость пробела: отсутствие темы в роудмэпе показывает молчание области", "Чтобы выбрать метрику исследовательского вопроса из перечня приоритетов стратегии", "Чтобы заменить систематический поиск: роудмэп уже обобщает состояние области за вас"], "correct": 0, "explain": "Роудмэпы и RIS3 это документы о приоритетах: они дают ступени значимости, локальную и глобальную, и называют, кому результат нужен. Второй вариант это самое частое злоупотребление: роудмэп не индекс литературы, отсутствие темы в нём не означает отсутствия статей, и наоборот. Заменить ими систематический поиск нельзя по той же причине, а метрика вопроса берётся из измеримой постановки задачи, а не из стратегического документа. Лекция 1, раздел 01 и рубрика значимости.", "usage": {"code": false, "without": "Открытость пробела обоснована тем, что темы нет в роудмэпе, и аудитор отмечает утверждение как неподтверждённое источником.", "with": "Роудмэп и RIS3 обслуживают значимость, а открытость доказывается поиском по базам.", "benefit": "Каждый источник используется по назначению."}}, {"q": "ИИ вернул гладкий обзор литературы с четырьмя ссылками, одна из которых выглядит безупречно, но не находится ни в IEEE Xplore, ни в Scopus, ни в Crossref. Что из этого следует для работы с ИИ?", "options": ["Ссылка существует, но не проиндексирована: отсутствие в индексе не означает отсутствия статьи", "Нужно сменить модель на более новую: современные модели ссылки уже не выдумывают", "Нужно убрать только эту ссылку, а остальные три можно цитировать без дополнительной проверки по индексам", "Сводка ИИ это зацепка для проверки, а не доказательство: доверять нельзя тому, что не проверили сами"], "correct": 3, "explain": "Парадокс верификации в том, что проверить сводку способен только тот, кто мог бы написать её сам: правдоподобный журнал, правдоподобные авторы и диапазон страниц не значат ничего, а решает резолвящийся DOI или запись в индексе. Последний вариант самый соблазнительный практически: он выглядит как разумная экономия, но аудит проверяет каждое ключевое утверждение, и одна выдуманная ссылка рядом с тремя непроверенными означает, что непроверенных по-прежнему три. Vibe Lab сессии 1.", "usage": {"code": false, "without": "Из четырёх ссылок убирают одну выдуманную, остальные идут в отчёт как есть, и аудит находит ещё две с переатрибуцией.", "with": "Все четыре ссылки разрешены по DOI, две оказались переатрибутированными, и формулировки исправлены до сдачи.", "benefit": "Аудит цитирования проходит без потери сорока процентов отчёта."}}, {"q": "Почему вставить общий корпус в ИИ и попросить его расставить вердикты просева опасно именно на этом курсе?", "options": ["Корпус общий, и такой просев сойдётся: у всех выйдет одно и то же ядро и защищать будет нечего", "ИИ занижает оценку свежести, поскольку не знает статей, вышедших после обучения модели", "ИИ выдаст слишком большое ядро, и бюджет глубокого чтения в 21 час будет превышен втрое", "Корпус один для потока, и это нарушит регламент курса: загрузка PDF в модель прямо запрещена правилами"], "correct": 0, "explain": "На общем корпусе ИИ-просев сходится: он поднимает самые цитируемые, то есть самые старые работы, схлопывает корпус в один кластер и отбрасывает свежие статьи, на которых держится пробел, причём одинаково у всех. Ваше чтение обязано расходиться с чужим, иначе на панели нет собственной доказательной базы. Запрета на использование модели нет — она допускается как консультант, и именно поэтому ссылка на регламент мимо: ограничение содержательное, а не формальное. Лекция 2, раздел 05.", "usage": {"code": false, "without": "Вердикты просева расставил ИИ, ядро совпало с ядром соседа, и на панели нечего сказать своего.", "with": "Вердикты расставлены самостоятельно, ИИ использован для проверки ярлыка кластера, и ядро получилось своим.", "benefit": "На защите есть собственная доказательная база."}}, {"q": "Аудит нашёл, что статья говорит в симуляции, а отчёт цитирует её как подтверждение работы на реальном оборудовании. Какой вердикт и чего это стоит?", "options": ["Accurate: ссылка ведёт на реальную статью, а степень подтверждения аудит не оценивает", "Cannot Verify: статья существует, но проверить её содержание по одной аннотации невозможно", "Partially Accurate из-за переатрибуции, и это бьёт по самому весомому критерию отчёта", "Needs Correction применяется только к сфабрикованным ссылкам, переатрибуцию оформляют примечанием"], "correct": 2, "explain": "Аудит ставит один из четырёх вердиктов, и утверждение, которое источник поддерживает частично или в других условиях, получает Partially Accurate: процитировано не значит подтверждено. Второй вариант ровно та установка, против которой рубрика и построена: аудит проверяет не существование ссылки, а то, держит ли источник сказанное. Поскольку целостность цитирования это 40 пунктов из 100, цена ошибки максимальная. Рубрика отчёта и Audit Log.", "usage": {"code": false, "without": "Результат симуляции цитируется как результат на оборудовании, и критерий в 40 пунктов уходит в нижнюю полосу.", "with": "Условие названо прямо, и то же утверждение остаётся в отчёте с вердиктом Accurate.", "benefit": "Самый дорогой критерий отчёта сохраняется."}}, {"q": "Панель на защите показывает статью 2025 года, которая частично закрывает ваш пробел. Какой ответ соответствует верхней полосе рубрики?", "options": ["Отстоять исходную формулировку: пробел был зафиксирован до выхода этой статьи", "Признать перекрытие, назвать, что именно в вашем пробеле остаётся открытым, и сузить вопрос", "Согласиться, что пробел закрыт, и предложить панели выбрать новое направление работы", "Сослаться на то, что статья не входит в общий корпус из 74 и потому не учитывается"], "correct": 1, "explain": "Обработка критики весит 35% оценки защиты, и верхняя полоса описана прямо: отвечать доказательствами, уступать изящно и превращать критику в более точную позицию. Полное согласие с тем, что пробел закрыт, выглядит как интеллектуальная честность и на деле уступает лишнее: статья закрывает пробел частично, и задача в том, чтобы назвать остаток и сузить вопрос. Ссылка на состав корпуса это защита формальностью, которая панель только раззадорит. Рубрика защиты.", "usage": {"code": false, "without": "Автор отстаивает исходную формулировку, спор идёт по кругу, и критерий обработки критики уходит в нижнюю полосу.", "with": "Перекрытие признано, остаток назван как отсутствие испытаний под переменной нагрузкой, и вопрос сужен на месте.", "benefit": "Критика превращается в более точный вопрос."}}, {"q": "Как по рубрике построена презентация верхней полосы?", "options": ["Дуга вопрос, пробел, область, задача, чтобы слушатель с первой минуты знал вывод", "Обзор всех прочитанных статей по годам, затем пробел и вопрос в последней минуте доклада", "Пятнадцать минут на обзор корпуса и десять на вопросы, а пробел идёт в разделе выводов", "Дуга задача, область, пробел, вопрос, заканчивается на вопросе, а аргумент несут рисунки"], "correct": 3, "explain": "Рубрика требует тугой дуги от задачи к области, от неё к пробелу и к вопросу, причём доклад заканчивается именно вопросом, а слайды несут аргумент рисунками, а не текстом. Вариант с перевёрнутой дугой соблазнителен, потому что в инженерных докладах действительно принято начинать с вывода: здесь оценивается не вывод, а путь к нему, и без области с пробелом вопрос нечем обосновать. Последний вариант описывает формат времени, а не структуру. Рубрика защиты.", "usage": {"code": false, "without": "Доклад построен как перечень прочитанных статей по годам, вопрос звучит на последней минуте, и структура уходит в среднюю полосу.", "with": "Доклад идёт от задачи ячейки к области, пробелу и вопросу, и заканчивается вопросом на слайде с рисунком.", "benefit": "Структура доклада работает на вопрос."}}, {"q": "Как при глубоком чтении отличить результат бенчмарка от заявления статьи?", "options": ["Заявление это одна проверяемая фраза из аннотации, а результат это таблица с базовыми линиями и условиями", "Заявление это вклад из введения, результат это число из заключения, а таблицы читают выборочно", "Результат это самое крупное улучшение в процентах, а заявление это его округление для аннотации и введения", "Заявление и результат совпадают: аннотация журнала Q1 обязана точно отражать таблицы статьи"], "correct": 0, "explain": "Линза заявления требует свести утверждение статьи к одной falsifiable фразе, а линза доказательств читает таблицы и спрашивает, держат ли они это утверждение: честные ли базовые линии, те ли условия, из того ли сценария взят заголовочный процент. Третий вариант звучит как рабочая практика и проваливает проверку: число из заключения это то же заявление, просто повторённое, а выборочное чтение таблиц ровно и позволяет заголовочному проценту проехать без проверки. Лекция 2, раздел 03.", "usage": {"code": false, "without": "Заголовочные 40% улучшения переносят в обзор из аннотации, и аудит отмечает утверждение как частично подтверждённое.", "with": "Таблица прочитана, видно, что 40% относятся к одному из трёх наборов данных, и условие указано в обзоре.", "benefit": "В обзор попадает результат, а не реклама."}}, {"q": "Статья 2017 года собрала 96 ссылок, статья 2024 года 33. Посчитайте CPY по формуле курса для 2026 года: какая горячее и насколько?", "options": ["Статья 2017 года: CPY 9,6 против 11,0, и сырой счёт 96 против 33 это подтверждает", "Статья 2017 года: CPY 9,6 против 11,0, но разница в 15% лежит ниже порога значимости", "Статья 2024 года: CPY 16,5 против 10,7, примерно на 55% выше", "Статья 2024 года: CPY 11,0 против 9,6, примерно на 15% выше"], "correct": 3, "explain": "Шаг 1: знаменатель для 2017 года равен 2026 − 2017 + 1 = 10, для 2024 года равен 3. Шаг 2: CPY составляет 96/10 = 9,6 и 33/3 = 11,0. Шаг 3: свежая статья горячее примерно на 15%, хотя по сырому счёту проигрывает почти втрое. Вариант с 16,5 и 10,7 получается при знаменателе без единицы: он не только меняет цифры, но и обнуляет знаменатель для статей 2026 года. Последний вариант называет верные CPY и делает из них вывод в пользу старой статьи, ссылаясь на несуществующий порог значимости. Слайды сессии 1, часть 5.", "usage": {"code": false, "without": "Ядро глубокого чтения отбирают по сырым ссылкам, и статья 2024 года с 33 ссылками в него не попадает.", "with": "CPY посчитан, статья 2024 года входит в ядро как более горячая, и фронтир в обзоре опирается на неё.", "benefit": "Отбор в ядро не зависит от возраста статьи."}}, {"q": "Ваш поиск дал 760 записей в Scopus и 430 в IEEE Xplore, 18 из них дублируются. Скрининг оставил 96, полный текст прочитан у 64, включено 61. Какая доля включения и от какого числа её считают?", "options": ["5,1% от 1190 найденных записей", "63,5% от 96 записей, прошедших скрининг", "5,2% от 1172 уникальных записей", "95,3% от 64 записей, прочитанных полностью"], "correct": 2, "explain": "Шаг 1: сырой итог 760 + 430 = 1190 записей. Шаг 2: дедупликация снимает 18, остаётся 1172 уникальных, и именно это число становится знаменателем. Шаг 3: 61/1172 = 5,2%, что близко к 5% корпуса курса. Самый опасный дистрактор это 5,1% от 1190: разница выглядит косметической, но она означает, что 18 статей посчитаны дважды, а дисциплина единственного учёта и есть смысл дедупликации. Доли от 96 и от 64 это проходимость отдельных шагов, а не доля включения. Слайды сессии 1, часть 4.", "usage": {"code": false, "without": "Доля включения посчитана от сырых 1190, и в блок-схеме 18 работ учтены в двух базах сразу.", "with": "Знаменателем взяты 1172 уникальных записи, и каждая цифра воронки опирается на единственный учёт.", "benefit": "Блок-схема воронки проходит аудит."}}, {"q": "Карточка просева: релевантность 2 из 3, центральность 4 из 5, свежесть 2 из 2. Это единственный кандидат из кластера граничных вычислений. Какой вердикт?", "options": ["Балл 8, полоса DEEP, поскольку порог глубокого чтения начинается с восьми", "Балл 16, полоса DEEP, так как баллы по трём признакам перемножают", "Балл 8, полоса SKIM, и охват на вердикт влияния не оказывает", "Балл 8, полоса SKIM, но потребность в охвате кластера переводит карточку в DEEP"], "correct": 3, "explain": "Шаг 1: сумма 2 + 4 + 2 = 8. Шаг 2: полоса DEEP начинается с 9, значит по рубрике это SKIM. Шаг 3: полоса провизорна, а карточка единственная закрывает кластер граничных вычислений, то есть срабатывает правило охвата, и вердикт меняется на DEEP. Вариант балл 8, полоса SKIM без влияния охвата самый близкий: он верно считает и останавливается на полпути, забыв, что ядро собирают по охвату, а не по баллу. Произведение баллов рубрика не использует. Лекция 2, разделы 02 и 04.", "usage": {"code": false, "without": "Карточка остаётся в SKIM по баллу, кластер граничных вычислений в ядре не представлен, и синтез не захватывает edge-слой.", "with": "Правило охвата переводит карточку в DEEP, и в ядре есть работа по каждому крупному кластеру.", "benefit": "Ядро покрывает все кластеры синтеза."}}, {"q": "74 статьи, просев 10 минут, глубокое чтение 50 минут. Посчитайте часы для плана с ядром из 13 статей и для чтения всех 74 вглубь.", "options": ["Около 21 ч против примерно 62 ч, разница почти в три раза", "Около 21 ч против примерно 12 ч: многоуровневый план выходит дороже", "Около 11 ч против примерно 62 ч, разница почти в шесть раз", "Около 62 ч в обоих случаях: просев тех же статей времени не экономит"], "correct": 0, "explain": "Шаг 1: ядро 13 × 50 = 650 минут. Шаг 2: остальные 61 статья по 10 минут дают 610 минут, итого 1260 минут, то есть 21 час. Шаг 3: все 74 вглубь это 74 × 50 = 3700 минут, около 62 часов, то есть примерно втрое больше. Дистрактор 11 часов получается, если забыть просеять остальные 61 статью: тогда план кажется вдвое дешевле, но корпус остаётся некартированным, и ядро не выбрать по охвату. Лекция 2, раздел 01.", "usage": {"code": false, "without": "План чтения строят без просева остальных статей, 11 часов выглядят достаточными, и к выбору ядра приходится возвращаться.", "with": "Все 74 просеяны и 13 прочитаны вглубь за 21 час, и обе задачи закрыты в срок.", "benefit": "Бюджет чтения считается до начала, а не после срыва срока."}}, {"q": "Из 1070 записей, снятых на скрининге, EX-2 убрало 878, EX-3 146, EX-5 34, EX-1 12. Какую долю отсечения даёт правило о площадке и что из этого следует?", "options": ["95,7%: правило о площадке делает почти всю работу по качеству корпуса", "82,1%: к площадке относится только EX-2, остальные правила к ней отношения не имеют", "4,3%: к площадке относятся EX-1 и EX-5, а остальное снял тематический скрининг", "95,7%: правило о площадке даёт основной объём отсечения, а рычаг качества это язык и тип документа"], "correct": 0, "explain": "Шаг 1: EX-2 и EX-3 это оба зуба правила IN-2 о площадке, значит 878 + 146 = 1024. Шаг 2: 1024/1070 = 95,7%. Шаг 3: отсюда вывод, что рычаг качества корпуса это именно требование журнала Q1, тогда как основной объём отсечения в целом даёт этап скрининга 1360 на 114. Третий вариант содержит ту же верную цифру и ошибочный вывод, называя рычагом качества язык и тип документа: 34 и 12 записей несопоставимы с 1024, и решение прямо помечает эту подмену как ошибку части d. Решение части d сессии 1.", "usage": {"code": false, "without": "В отчёте рычагом качества назван языковой фильтр, и 34 записи против 1024 обнаруживают, что утверждение не подкреплено.", "with": "Доля 95,7% посчитана по обоим правилам площадки, и вывод о качестве корпуса опирается на цифры.", "benefit": "Вывод о качестве корпуса подтверждается счётчиками."}}, {"q": "Вы заявили пробел: обнаружение столкновений кобота обучением не исследовано. Проверка на прочность находит три статьи Q1, которые делают это в симуляции, и ни одной на реальном контроллере. Что делать с формулировкой?", "options": ["Сузить домен до другого производителя кобота, где эти три статьи формально неприменимы", "Перетипизировать пробел: метод исследован в симуляции, открыта валидация на реальном контроллере", "Оставить формулировку: три статьи это слишком мало, чтобы считать направление исследованным", "Снять пробел: три статьи Q1 закрывают его, и нужно искать другую тему в своём домене"], "correct": 1, "explain": "Шаг 1: найденные работы опровергают исходный тип пробела, метод существует. Шаг 2: но ни одна не измеряет задержку на собственном контроллере под переменной нагрузкой, значит отсутствует не метод, а доказательство на оборудовании. Шаг 3: пробел переписывается в этом типе и становится конкретным и проверяемым. Третий вариант это типичная защитная реакция: он сохраняет опровергнутую формулировку, и панель открывает обсуждение именно с неё. Смена производителя даёт видимость новизны без изменения сути. Рубрика подлинности пробела.", "usage": {"code": false, "without": "Исходная формулировка остаётся, панель приводит три статьи, и критерий подлинности пробела уходит в нижнюю полосу.", "with": "Пробел перетипизирован в отсутствие валидации на оборудовании, и три найденные статьи работают на вас как доказательство.", "benefit": "Проверка на прочность усиливает пробел вместо того, чтобы его снести."}}, {"q": "Черновой вопрос: можно ли применить ИИ для повышения безопасности коботов. Какая переработка соответствует верхней полосе рубрики?", "options": ["Как искусственный интеллект меняет безопасность коллаборативной робототехники в условиях Индустрии 5.0 и что этому мешает", "Даёт ли классификатор на Cortex-M7 кобота задержку ниже 50 мс при доле ложных срабатываний до 2% и нагрузке 0-3 кг", "Можно ли обучить нейросеть обнаруживать столкновения кобота лучше, чем это делают существующие промышленные подходы", "Повышает ли применение глубокого обучения безопасность коботов по сравнению с классическими методами обнаружения"], "correct": 1, "explain": "Шаг 1: верхняя полоса требует названной метрики, то есть измеримой величины с порогом. Шаг 2: нужны платформа и условия, иначе ответ не воспроизводим. Шаг 3: только первый вариант называет задержку, порог, допустимую долю ложных срабатываний и диапазон нагрузки, из него прямо выводится план эксперимента. Третий и четвёртый варианты выглядят собранными, но их метрика скрыта в словах лучше и по сравнению с классическими: такой вопрос нельзя закрыть ни одним измерением. Второй шире исходного черновика. Рубрика вопроса.", "usage": {"code": false, "without": "Вопрос остаётся на уровне лучше ли глубокое обучение, и спроектировать эксперимент по нему невозможно.", "with": "Вопрос называет 50 мс, 2% и диапазон нагрузки, и из него сразу виден стенд и протокол измерения.", "benefit": "Из вопроса выводится проверяемый эксперимент."}}, {"q": "Ссылка выглядит безупречно: реальный журнал, правдоподобные авторы, диапазон страниц. Какая последовательность проверки предписана курсом?", "options": ["Поискать название в Google Scholar: совпадение в выдаче подтверждает существование статьи", "Запросить у ИИ подтверждение ссылки и источник, из которого она взята, и приложить его ответ к журналу работы", "Проверить, что журнал относится к Q1 и что годы выпуска тома совпадают с указанным в ссылке", "Разрешить DOI, затем найти по точному названию в IEEE Xplore, Scopus или Crossref: не нашлось — статьи нет"], "correct": 3, "explain": "Шаг 1: резолвится ли DOI, это самая дешёвая и однозначная проверка. Шаг 2: если DOI нет, статья ищется по точному названию в индексе издателя или в Crossref. Шаг 3: отсутствие записи означает, что работы не существует, насколько бы авторитетно ссылка ни читалась. Поиск в Google Scholar кажется равноценной проверкой и ею не является: Scholar подхватывает записи из списков литературы, поэтому выдумка, однажды попавшая в чей-то текст, там находится. Проверка квартиля и годов тома говорит о площадке, а не о существовании статьи. Vibe Lab сессии 1.", "usage": {"code": false, "without": "Ссылку подтверждают совпадением в Google Scholar, она уходит в отчёт, и аудит помечает её как непроверяемую.", "with": "DOI не резолвится, записи в Crossref нет, и ссылка удаляется до сдачи вместе с опирающимся на неё утверждением.", "benefit": "Выдуманная ссылка не доживает до аудита."}}, {"q": "В отчёте фраза: подход снижает задержку на 40%. Статья приводит 40% только для одного набора данных из трёх, в остальных выигрыш 6% и 9%. Какой вердикт аудита и как исправить?", "options": ["Accurate: цифра 40% в статье действительно есть, и процитирована она без искажения", "Partially Accurate: назвать условие, при котором получены 40%, и привести остальные две цифры", "Cannot Verify: без доступа к самим наборам данных проверить эту цифру невозможно", "Needs Correction: цифру 40% нужно убрать и заменить средним значением по всем трём наборам данных"], "correct": 1, "explain": "Шаг 1: цифра в источнике есть, значит это не фабрикация. Шаг 2: но она взята из лучшего случая и подана как общий результат, то есть утверждение вырвано из условий — аудит ставит Partially Accurate. Шаг 3: исправление состоит в том, чтобы назвать условие и привести разброс 6-40%. Четвёртый вариант выглядит добросовестной починкой и вносит новую проблему: среднее по трём наборам в источнике не приводится, и подставив его, вы процитируете статью числом, которого в ней нет. Рубрика целостности цитирования.", "usage": {"code": false, "without": "Заголовочные 40% остаются без условия, аудит ставит Partially Accurate, и самый весомый критерий отчёта теряет пункты.", "with": "Условие названо, приведён разброс 6-40%, и то же утверждение проходит аудит как точное.", "benefit": "Утверждение остаётся сильным и при этом подтверждённым."}}, {"q": "Значимость пробела обоснована одной фразой: эта задача интересна и активно обсуждается. Что добавить, чтобы попасть в верхнюю полосу?", "options": ["Цитату из роудмэпа IEEE RAS, подтверждающую, что эта задача в литературе пока никем не решена", "Ещё две статьи, в которых та же задача названа интересной и активно обсуждаемой", "Инженерную ступень с названным выгодоприобретателем и ступень RIS3 с приоритетом мехатроники", "Прогноз рынка коллаборативной робототехники и оценку числа внедрений к 2030 году"], "correct": 2, "explain": "Шаг 1: интересна и обсуждается это не ступень, а оценочное суждение, оно не набирает даже средней полосы. Шаг 2: рубрика требует двух и более независимых ступеней и названного выгодоприобретателя. Шаг 3: инженерная ступень с указанием на интеграторов коботов плюс приоритет мехатроники в RIS3 закрывают требование. Четвёртый вариант подменяет значимость открытостью и делает это через роудмэп, который о состоянии литературы вообще не свидетельствует. Рыночные прогнозы к ступеням рубрики не относятся. Рубрика значимости.", "usage": {"code": false, "without": "Значимость подкрепляют ещё двумя цитатами о том, что тема интересна, и критерий остаётся в нижней полосе.", "with": "Названы интеграторы коботов как выгодоприобретатели и приоритет мехатроники в RIS3, и значимость закрыта на двух ступенях.", "benefit": "Значимость держится на независимых основаниях."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    if (!state.doneAt && LTProgress.isDone(state)) state.doneAt = now;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: повторение пройденного
    // теста не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  // Карточка вопроса: варианты, объяснение, пример. Общая для теста и для
  // «Работы над ошибками» / «Повторения», чтобы они не разошлись видом.
  function cardHtml(q, answered) {
    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    const due = LTProgress.reviewDue(state);
    if (due) {
      html += '<div style="color:var(--muted); font-size:.88rem; margin-top:12px; text-align:center;">Следующее повторение: ' +
        (due <= Date.now() ? 'уже пора' : new Date(due).toLocaleDateString("ru-RU", { day: "numeric", month: "long" })) + '</div>';
    }
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="drillReviewBtn">🧠 Повторить ' + LTProgress.REVIEW_SIZE + ' вопросов</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillReviewBtn").addEventListener("click", () => startDrill("review"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» и «Повторение» ----
  // Отдельный проход поверх пройденного теста. Счёт теста (state.answers) он не
  // трогает: исправленная ошибка пишется в state.fixed, итог повторения — в
  // state.review, и следующий срок повторения считает progress.js.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = kind === "mistakes"
      ? LTProgress.mistakes(state)
      : shuffle(QUESTIONS.map((_, i) => i)).slice(0, LTProgress.REVIEW_SIZE);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast(kind === "mistakes" ? "Ошибок не осталось — всё исправлено" : "Нечего повторять");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = (drill.kind === "mistakes" ? "Работа над ошибками" : "Повторение") + " · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        state.fixed = state.fixed || {};
        if (drill.kind === "mistakes" && ok) { state.fixed[idx] = Date.now(); saveState(); }
        // Исправленная раньше ошибка, снова неверная на повторении, возвращается в работу.
        if (drill.kind === "review" && !ok && state.fixed[idx]) { delete state.fixed[idx]; saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    if (drill.kind === "mistakes") {
      const left = LTProgress.mistakes(state).length;
      blockLabel.textContent = "Работа над ошибками · итог";
      html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
      html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
      if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    } else {
      const now = Date.now();
      state.review = LTProgress.nextReview(state, drill.right, total, now);
      saveState();
      blockLabel.textContent = "Повторение · итог";
      html += '<div style="color:var(--muted); margin-top:6px;">правильных на повторении</div>';
      html += '<div style="margin-top:14px;">Следующее повторение: ' +
        new Date(state.review.dueAt).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + '</div></div>';
    }
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes" || mode === "review") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
