(function () {
  const TEST_ID = "rmo_axis_angle_quaternions_slerp";
  const QUESTIONS = [{"q": "Что утверждает теорема Эйлера о поворотах (Euler's rotation theorem, 1775)?", "options": ["Любую смену ориентации можно сделать двумя четвертьоборотами вокруг осей базы", "Порядок поворотов не важен: два поворота дают одну позу в любом порядке", "Любую смену ориентации тела можно сделать одним поворотом вокруг одной оси на один угол", "Одним поворотом можно, но только если ось совпадает с одной из осей базы"], "correct": 2, "explain": "Эйлер доказал: сколько бы поворотов ни сделали, итог — это ОДИН поворот вокруг одной линии (axis, ось) на один угол (angle). На кубике: четвертьоборот вокруг \\(x_0\\), потом вокруг \\(z_0\\) — то же, что \\(120^\\circ\\) вокруг линии через углы 1-2-3. «Двумя четвертьоборотами» можно далеко не всё — угол бывает любым. Порядок поворотов как раз важен (\\(R_zR_x\\ne R_xR_z\\)). А ось у одного поворота почти никогда не совпадает с осью базы — у кубика это диагональ. Интуиция: ось — это то, что остаётся на месте.", "usage": {"code": false, "without": "Ты описываешь переориентацию захвата UR10e как «повернуть на 90° вокруг вертикали, потом наклонить на 30°» и не знаешь, сколько реально повернётся запястье.", "with": "По Эйлеру это один поворот: \\(93.84^\\circ\\) вокруг почти вертикальной оси. Одно число — угол — сразу говорит, насколько большой ход у запястья.", "benefit": "Любую переориентацию можно оценить одним углом и одной осью"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/01.svg", "alt": "Тело в двух разных ориентациях: поза 1 и поза 2, между ними вопрос «как перейти?»"}}, {"q": "Кубик поворачивают на \\(120^\\circ\\) вокруг линии через противоположные углы (corner line). Какие точки кубика остаются на месте?", "options": ["Центры граней 1, 2 и 3 — они лишь меняются местами друг с другом", "Точки на самой оси — в том числе два угла, за которые кубик зажат пальцами", "Ни одна: при повороте на \\(120^\\circ\\) смещаются все точки тела", "Только центр верхней грани; углы (и оба зажатых) двигаются"], "correct": 1, "explain": "Ось поворота (axis) — это именно множество неподвижных точек: в лекции это два «pinch points», зажатые пальцами углы, и вся линия между ними через центр кубика. Центры граней 1, 2, 3 переезжают: 1 сверху уходит вперёд, 2 — вправо, 3 — наверх; «меняются местами» значит как раз двигаются. «Ни одна» неверно — точки на оси при любом угле стоят. Центр верхней грани на оси не лежит, поэтому он смещается. Интуиция: зажми кубик за два угла и крути — пальцы не двигаются.", "usage": {"code": false, "without": "Ты калибруешь поворотный стол позиционера WAAM и не понимаешь, почему метка на столе «уплывает» при повороте.", "with": "Ты ищешь неподвижные точки: они лежат на оси вращения стола — так находишь ось и проверяешь, что метка на ней не стоит.", "benefit": "Ось находится как то, что при повороте не двигается"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/02.svg", "alt": "Кубик с гранями 1, 2, 3, линия через противоположные углы и дуга поворота на 120°"}}, {"q": "Как по правилу правой руки (right-hand rule) определить положительное направление поворота вокруг оси \\(\\hat k\\)?", "options": ["Большой палец — против \\(\\hat k\\); согнутые пальцы показывают положительное направление", "Большой палец — вдоль \\(\\hat k\\); согнутые пальцы показывают положительное направление", "Положительный — по часовой стрелке, если смотреть с конца \\(\\hat k\\) к началу", "Указательный палец — вдоль \\(\\hat k\\), а большой показывает, куда поворачивать"], "correct": 1, "explain": "Правая рука: большой палец по оси \\(\\hat k\\), пальцы сгибаются в положительную сторону. Если смотреть с конца \\(\\hat k\\) на начало, это ПРОТИВ часовой стрелки — отсюда ошибка второго дистрактора. Палец «против \\(\\hat k\\)» даёт отрицательное направление: поворот на \\(+\\theta\\) вокруг \\(-\\hat k\\) — это \\(-\\theta\\) вокруг \\(\\hat k\\). Указательный палец в правиле не участвует. Интуиция: закрутка правого винта — палец показывает, куда винт идёт.", "usage": {"code": false, "without": "В скрипте для UR ты задаёшь \\(+30^\\circ\\) вокруг \\(z\\) инструмента и ждёшь поворот по часовой — горелка уходит в другую сторону и задевает оснастку.", "with": "Ты ставишь большой палец по оси \\(z\\) инструмента и видишь направление заранее; знак угла выбираешь до запуска.", "benefit": "Знак угла понятен до того, как робот двинется"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/03.svg", "alt": "Ось k и два кольца вокруг неё с противоположными стрелками, направление поворота отмечено «?»"}}, {"q": "Что записано в столбце 2 матрицы поворота \\(R\\) (rotation matrix) по правилу лекции 1?", "options": ["Куда смотрела вторая стрелка тела до поворота — в координатах самого тела", "На сколько тело повернулось вокруг оси \\(y_0\\) — угол в радианах", "Проекции всех трёх стрелок тела на ось \\(y_0\\) базы после поворота", "Куда после поворота смотрит вторая стрелка тела — зелёная \\(\\hat y\\) — в координатах базы"], "correct": 3, "explain": "Правило лекции 1: каждый столбец — куда указывает одна стрелка тела после поворота, тремя числами базы (к тебе, вправо, вверх). Столбец 1 — красная \\(\\hat x\\), столбец 2 — зелёная \\(\\hat y\\), столбец 3 — синяя \\(\\hat z\\). «Проекции всех трёх стрелок на \\(y_0\\)» — это СТРОКА 2, частая путаница строк и столбцов. До поворота в своих координатах стрелка всегда \\((0,\\ 1,\\ 0)\\) — в этом нет информации. Углов в матрице нет вовсе — только направляющие косинусы.", "usage": {"code": false, "without": "В RoboDK ты читаешь матрицу позы TCP по строкам и решаешь, что ось подхода \\(z\\) инструмента — это нижняя строка; захват едет боком.", "with": "Ты берёшь столбец 3: \\((0.5,\\ 0,\\ -0.866)\\) — подход наклонён на \\(30^\\circ\\) от вертикали вниз, как и задумано.", "benefit": "Направление каждой оси инструмента читается сразу из столбца"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/04.svg", "alt": "Базовая система координат, система тела и матрица R с выделенным столбцом 2"}}, {"q": "Кубик: 1 сверху, 2 к тебе, 3 справа. Четвертьоборот вокруг \\(x_0\\), потом вокруг \\(z_0\\) дают то же, что один поворот вокруг corner line через углы 1-2-3. Почему угол именно \\(120^\\circ\\)?", "options": ["Два поворота по \\(90^\\circ\\) дают в сумме \\(180^\\circ\\), а наклон оси убирает \\(60^\\circ\\)", "Это средний угол: \\((90^\\circ+90^\\circ+180^\\circ)/3=120^\\circ\\)", "Угол между осью и каждой из граней кубика равен \\(120^\\circ\\)", "Три грани вокруг угла сменяют друг друга по кругу, каждая — на треть: \\(360^\\circ/3\\)"], "correct": 3, "explain": "Вокруг corner line грани 1, 2, 3 гоняются друг за другом: 1 сверху → к тебе, 2 к тебе → вправо, 3 справа → наверх. Три грани делят один круг, значит шаг — треть оборота: \\(360^\\circ/3=120^\\circ\\). Проверка: три таких поворота возвращают кубик домой. Углы поворотов вокруг РАЗНЫХ осей не складываются арифметически — ни «\\(90+90\\) минус что-то», ни среднее не имеют смысла. Угол между осью-диагональю и гранью — около \\(54.7^\\circ\\)/\\(35.3^\\circ\\), а не \\(120^\\circ\\).", "usage": {"code": false, "without": "Тебе кажется, что два поворота запястья по \\(90^\\circ\\) — это ход \\(180^\\circ\\), и ты закладываешь в цикл лишнее время.", "with": "Ты считаешь один поворот (Recipe 1) и видишь \\(120^\\circ\\) — запястье проходит меньше, чем сумма двух шагов.", "benefit": "Оценка хода запястья без ложного сложения углов"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/05.svg", "alt": "Кубик: 1 сверху, 2 к зрителю, 3 справа; анимация двух четвертьоборотов вокруг x₀ и затем z₀"}}, {"q": "Пульт Universal Robots задаёт ориентацию тремя числами \\(R_x,\\ R_y,\\ R_z\\) — вектор поворота (rotation vector). Как в них упакованы ось и угол?", "options": ["Это три угла поворота вокруг \\(x_0,\\ y_0,\\ z_0\\) по очереди, в радианах", "Направление — ось \\(\\hat k\\), длина — угол в градусах: \\(\\theta^\\circ\\hat k\\)", "Направление вектора — ось \\(\\hat k\\), длина — угол в радианах: \\(\\theta\\hat k\\)", "Ось \\(\\hat k\\) единичной длины, а угол контроллер хранит отдельно"], "correct": 2, "explain": "Трёх чисел хватает на ось и угол сразу: стрелку кладут вдоль оси и растягивают до длины, равной углу в радианах. Чтение обратно: длина \\(\\|\\mathbf r\\|=\\theta\\), ось \\(=\\mathbf r/\\|\\mathbf r\\|\\). Три последовательных угла — это roll-pitch-yaw (у KUKA — A, B, C в градусах), не UR. Градусы — классическая ошибка: \\(90\\) в поле UR — это 90 радиан. Если бы длина всегда была 1, угол негде было бы хранить. Интуиция: короткая стрелка — маленький поворот, длинная — большой.", "usage": {"code": false, "without": "Ты копируешь ориентацию из лога UR и думаешь, что \\((0,\\ 0,\\ 1.5708)\\) — это углы roll-pitch-yaw, а ось ищешь где-то ещё.", "with": "Ты считаешь длину: \\(1.5708\\) рад \\(=90^\\circ\\), направление \\((0,\\ 0,\\ 1)\\) — четвертьоборот вокруг \\(z_0\\).", "benefit": "Ось и угол читаются из трёх чисел одной проверкой длины"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/06.svg", "alt": "Ось k и угол θ упаковываются в три поля пульта UR: Rx, Ry, Rz"}}, {"q": "Кватернион поворота (quaternion) строят по половине угла \\(\\theta/2\\). Зачем нужна именно половина?", "options": ["Вектор поворачивают как \\(q\\,\\mathbf v\\,q^*\\): \\(q\\) действует дважды, по \\(\\theta/2\\) за раз", "Чтобы все числа были меньше 1: при полном угле \\(\\sin\\theta\\) бывает больше 1", "Так принято только у ABB; в ROS кватернион строят по полному углу \\(\\theta\\)", "Половина нужна лишь затем, чтобы отличать короткий путь от длинного"], "correct": 0, "explain": "Лекция говорит: половина угла позволяет компьютеру комбинировать повороты умножением кватернионов. Стандартное объяснение: вектор поворачивают «сэндвичем» \\(\\mathbf v'=q\\,\\mathbf v\\,q^*\\) — \\(q\\) входит дважды, и каждый множитель добавляет \\(\\theta/2\\), в сумме \\(\\theta\\). \\(|\\sin\\theta|\\le1\\) при любом угле — довод про «больше 1» ложный. ROS и ABB строят кватернион одинаково, отличается лишь порядок чисел. Короткий и длинный путь различаются знаком, но половина угла нужна не ради этого. На «метре» (the meter) лекции: проходишь по окружности половину поворота.", "usage": {"code": false, "without": "Ты пишешь драйвер IMU и кладёшь в кватернион \\(\\cos\\theta\\) и \\(\\sin\\theta\\) полного угла — фильтр показывает повороты вдвое больше реальных.", "with": "Ты строишь \\(q=(\\cos\\frac{\\theta}{2},\\ \\sin\\frac{\\theta}{2}\\hat k)\\) и проверяешь: \\(2\\arccos w\\) возвращает исходный угол.", "benefit": "Кватернион с правильным углом с первого раза"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/07.svg", "alt": "Поворот на угол θ вокруг оси k и кватернион q, который строят по половине угла θ/2"}}, {"q": "Почему у кватерниона поворота сумма квадратов четырёх чисел всегда равна 1 (unit quaternion)?", "options": ["Четыре числа — это косинусы углов между осью и осями базы", "\\(\\cos^2\\frac{\\theta}{2}+\\sin^2\\frac{\\theta}{2}\\,|\\hat k|^2=1\\), так как ось единичной длины", "Это требование формата ROS, а математически сумма может быть любой", "\\(\\cos^2\\theta+\\sin^2\\theta=1\\) по полному углу, а ось бывает любой длины"], "correct": 1, "explain": "\\(q=(\\cos\\frac{\\theta}{2},\\ \\sin\\frac{\\theta}{2}\\hat k)\\), и \\(|\\hat k|=1\\). Сумма квадратов: \\(\\cos^2\\frac{\\theta}{2}+\\sin^2\\frac{\\theta}{2}(k_x^2+k_y^2+k_z^2)=1\\). Это «squares check» лекции: если сумма не 1 — число набрано с ошибкой. Косинусов осей у направления три, а не четыре. ROS тут ни при чём: требование — следствие построения. Полный угол — ошибка построения, и при неединичной оси сумма не была бы 1.", "usage": {"code": false, "without": "Ты вручную вбиваешь ориентацию TCP в YAML-конфиг ROS и опечатываешься в одной цифре — робот встаёт в непонятную позу.", "with": "До запуска считаешь сумму квадратов: \\(1.11\\ne1\\) — опечатка найдена без робота.", "benefit": "Опечатки ловятся арифметикой ещё на столе"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/08.svg", "alt": "Поворот (ось и угол) записан кватернионом из четырёх чисел w, x, y, z; про сумму квадратов вопрос"}}, {"q": "Кватернионы \\(q\\) и \\(-q\\) отличаются знаками всех четырёх чисел. Какие ориентации они задают (двойное покрытие, double cover)?", "options": ["Одну и ту же: это поворот на \\(\\theta\\) и на \\(360^\\circ-\\theta\\) в другую сторону", "Взаимно обратные: \\(-q\\) возвращает тело в исходное положение", "Зеркальные: \\(-q\\) отражает тело относительно плоскости, перпендикулярной оси", "Разные: \\(-q\\) — поворот на тот же угол \\(\\theta\\) вокруг оси \\(-\\hat k\\)"], "correct": 0, "explain": "\\(-q=(-\\cos\\frac{\\theta}{2},\\ -\\sin\\frac{\\theta}{2}\\hat k)=(\\cos\\frac{360^\\circ-\\theta}{2},\\ \\sin\\frac{360^\\circ-\\theta}{2}\\cdot(-\\hat k))\\) — поворот на \\(360^\\circ-\\theta\\) в обратную сторону. Конечная поза та же, поэтому каждой ориентации соответствуют ДВА кватерниона. Обратный поворот — это сопряжённый \\(q^*=(w,\\ -\\mathbf v)\\), он же «\\(\\theta\\) вокруг \\(-\\hat k\\)» — это два ложных варианта об одном и том же. Отражений поворот не делает. На кубике: \\(120^\\circ\\) в одну сторону и \\(240^\\circ\\) в другую — одна поза.", "usage": {"code": false, "without": "Камера отдаёт позу детали то с \\(q\\), то с \\(-q\\); ты решаешь, что поза «скачет», и ставишь фильтр, который сглаживает в никуда.", "with": "Ты знаешь, что \\(q\\) и \\(-q\\) — одна поза, и перед фильтрацией приводишь знак к предыдущему отсчёту.", "benefit": "Нет ложных «скачков» ориентации в данных"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/09.svg", "alt": "Два кватерниона q и −q с противоположными знаками чисел и вопрос о том, какие ориентации они задают"}}, {"q": "Что такое SLERP (spherical linear interpolation) при переходе от одной ориентации к другой?", "options": ["Линейное смешивание девяти чисел матрицы от начальной позы к конечной", "Линейное смешивание трёх углов roll, pitch, yaw от начала к концу", "Поворот вокруг одной неизменной оси, угол которого растёт равномерно во времени", "Поворот, у которого сама ось равномерно поворачивается от начала к концу"], "correct": 2, "explain": "Лекция называет это «smooth rule»: same line all the way, the angle grows evenly — одна ось, угол растёт равномерно. SLERP — то же правило, посчитанное кватернионами: точка на «метре» идёт по окружности с постоянной скоростью. Смешивание девяти чисел матрицы — планировщик A: посередине захват «сжимается» (стрелки длиной \\(0.7071\\)). Смешивание углов — планировщик B: \\(426^\\circ\\) вращения вместо \\(93.84^\\circ\\). Ось при SLERP не вращается — она одна на весь ход.", "usage": {"code": false, "without": "Ты интерполируешь ориентацию горелки WAAM между двумя точками по углам Эйлера — на стыке горелка неожиданно делает лишний разворот.", "with": "Ты считаешь одну ось и угол между позами и ведёшь угол равномерно (SLERP) — горелка поворачивается ровно и кратчайшим путём.", "benefit": "Плавный и кратчайший поворот инструмента"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/10.svg", "alt": "Начальная и конечная ориентации тела и вопрос «что такое SLERP» на пути между ними"}}, {"q": "Recipe 1 лекции: как найти угол поворота \\(\\theta\\) по матрице \\(R\\) (rotation angle from the trace)?", "options": ["\\(\\theta=\\arccos\\frac{r_{11}+r_{22}+r_{33}}{3}\\)", "\\(\\theta=\\arccos\\frac{r_{11}+r_{22}+r_{33}-1}{2}\\)", "\\(\\theta=2\\arccos\\frac{r_{11}+r_{22}+r_{33}-1}{2}\\)", "\\(\\theta=\\arccos(r_{11}\\,r_{22}\\,r_{33})\\)"], "correct": 1, "explain": "Сумма диагонали (след, trace) любого поворота: \\(\\operatorname{tr}R=1+2\\cos\\theta\\) — стрелка на оси даёт 1, две другие по \\(\\cos\\theta\\). Отсюда «сложи, вычти 1, раздели пополам, нажми acos». Проверка на кубике: \\(0+0+0\\to(0-1)/2=-0.5\\to120^\\circ\\). Деление на 3 — «среднее косинусов» — неверно: у стрелки на оси косинус всегда 1. Удвоение — привычка от кватерниона (\\(2\\arccos w\\)), к матрице оно не относится. Произведение диагонали смысла не имеет.", "usage": {"code": false, "without": "Ты оцениваешь ошибку ориентации TCP как разность углов Эйлера и получаешь «\\(358^\\circ\\)» при почти совпадающих позах.", "with": "Ты берёшь \\(R_{\\text{err}}=R_{\\text{цель}}R^{\\mathsf T}\\) и Recipe 1: ошибка \\(2^\\circ\\) — одно честное число.", "benefit": "Ошибка ориентации — одно число без скачков через \\(360^\\circ\\)"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/11.svg", "alt": "Матрица R с выделенной диагональю r11, r22, r33 и неизвестный угол θ"}}, {"q": "Recipe 2 лекции: как по матрице \\(R\\) найти ось \\(\\hat k\\) при \\(0^\\circ<\\theta<180^\\circ\\)?", "options": ["Пары \\(\\left(r_{23}-r_{32},\\ r_{31}-r_{13},\\ r_{12}-r_{21}\\right)\\), делённые на свою длину", "Пары \\(\\left(r_{32}-r_{23},\\ r_{13}-r_{31},\\ r_{21}-r_{12}\\right)\\), делённые на свою длину", "Диагональ \\(\\left(r_{11},\\ r_{22},\\ r_{33}\\right)\\), делённая на свою длину", "Суммы \\(\\left(r_{32}+r_{23},\\ r_{13}+r_{31},\\ r_{21}+r_{12}\\right)\\), делённые на длину"], "correct": 1, "explain": "Пары (pairs) — числа, зеркальные относительно диагонали. Из формулы Родрига их разность равна \\(2\\sin\\theta\\cdot k_i\\): красная пара \\(r_{32}-r_{23}\\) — вращение вокруг \\(x_0\\), зелёная \\(r_{13}-r_{31}\\) — вокруг \\(y_0\\), синяя \\(r_{21}-r_{12}\\) — вокруг \\(z_0\\). Вычитание в обратном порядке даёт \\(-\\hat k\\) — та же ошибка, что левая рука вместо правой. Диагональ хранит угол, а не ось. Суммы пар убирают как раз нужную часть \\(\\sin\\theta[\\hat k]_\\times\\). На \\(R_z(90^\\circ)\\): \\((0,\\ 0,\\ 1-(-1))=(0,\\ 0,\\ 2)\\to z_0\\).", "usage": {"code": false, "without": "Ты извлекаешь ось из матрицы позы, вычитая пары «как удобнее», — ось получается развёрнутой, и робот крутится в обратную сторону.", "with": "Ты считаешь пары строго «нижний минус верхний» по Recipe 2 и проверяешь на \\(R_z(90^\\circ)\\): выходит \\(z_0\\).", "benefit": "Ось из матрицы с правильным знаком"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/12.svg", "alt": "Матрица R с элементами r_ij, по ним нужно найти ось k при 0° < θ < 180°"}}, {"q": "Формула Родрига (Rodrigues' formula; в лекции — «the way back», три матрицы): чему равна \\(R\\) для оси \\(\\hat k\\) и угла \\(\\theta\\)?", "options": ["\\(R=\\cos\\theta\\,I+\\sin\\theta\\,\\hat k\\hat k^{\\mathsf T}+(1-\\cos\\theta)\\,[\\hat k]_\\times\\)", "\\(R=(1-\\cos\\theta)\\,I+\\cos\\theta\\,\\hat k\\hat k^{\\mathsf T}+\\sin\\theta\\,[\\hat k]_\\times\\)", "\\(R=\\cos\\theta\\,I+(1-\\cos\\theta)\\,\\hat k\\hat k^{\\mathsf T}+\\sin\\theta\\,[\\hat k]_\\times\\)", "\\(R=\\cos\\theta\\,I+(1-\\cos\\theta)\\,[\\hat k]_\\times+\\sin\\theta\\,\\hat k\\hat k^{\\mathsf T}\\)"], "correct": 2, "explain": "Лекция выводит её, следя за красной стрелкой: часть вдоль оси (along) стоит на месте, часть поперёк (across) идёт по кругу: \\(\\cos\\) от себя плюс \\(\\sin\\) от своего четвертьоборота. Собранное по трём столбцам: «no turn» \\(I\\) с весом \\(\\cos\\theta\\), «line times itself» \\(\\hat k\\hat k^{\\mathsf T}\\) с весом \\(1-\\cos\\theta\\), «line in the pairs» \\([\\hat k]_\\times\\) с весом \\(\\sin\\theta\\). Проверка: при \\(\\theta=0\\) должно выйти \\(I\\) — у второго дистрактора выходит \\(\\hat k\\hat k^{\\mathsf T}\\). Первый и третий при \\(\\theta=0\\) дают \\(I\\), но при \\(\\theta=180^\\circ\\) — \\(-I+2[\\hat k]_\\times\\), не ортогональную матрицу; верный полуоборот — \\(-I+2\\hat k\\hat k^{\\mathsf T}\\).", "usage": {"code": false, "without": "Ты строишь матрицу поворота стола позиционера вокруг наклонной оси через три последовательных Эйлеровых поворота и путаешься в порядке.", "with": "Ты подставляешь ось стола и угол в формулу Родрига — одна строка кода, без выбора порядка углов.", "benefit": "Матрица поворота вокруг любой оси одной формулой"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/13.svg", "alt": "Формула Родрига: R из трёх матриц I, k kᵀ, [k]× с неизвестными коэффициентами; ось k и угол θ"}}, {"q": "Матрица \\([\\hat k]_\\times\\) (skew-symmetric matrix; в лекции — «the line in the pairs») для \\(\\hat k=(k_x,\\ k_y,\\ k_z)\\) — какая?", "options": ["\\(\\begin{bmatrix}0&-k_z&k_y\\\\k_z&0&-k_x\\\\-k_y&k_x&0\\end{bmatrix}\\)", "\\(\\begin{bmatrix}0&k_z&-k_y\\\\-k_z&0&k_x\\\\k_y&-k_x&0\\end{bmatrix}\\)", "\\(\\begin{bmatrix}k_x&0&0\\\\0&k_y&0\\\\0&0&k_z\\end{bmatrix}\\)", "\\(\\begin{bmatrix}0&-k_z&-k_y\\\\k_z&0&-k_x\\\\k_y&k_x&0\\end{bmatrix}\\)"], "correct": 0, "explain": "\\([\\hat k]_\\times\\mathbf v=\\hat k\\times\\mathbf v\\) — векторное произведение, записанное матрицей. Правило лекции: «числа линии в парах: \\(+\\) первый, \\(-\\) второй» — в красной паре \\(r_{32}=+k_x\\), \\(r_{23}=-k_x\\), в синей \\(r_{21}=+k_z\\), \\(r_{12}=-k_z\\). Транспонированная матрица (первый дистрактор) — это \\(-[\\hat k]_\\times\\), она крутит в обратную сторону. Диагональная — вообще не векторное произведение. В последней перевёрнут знак у \\(k_y\\): это \\([\\cdot]_\\times\\) для вектора \\((k_x,\\ -k_y,\\ k_z)\\), то есть для другой оси.", "usage": {"code": false, "without": "В прошивке ты пишешь матрицу векторного произведения по памяти и меняешь знаки — гироскопическая поправка в фильтре поворачивает не туда.", "with": "Ты проверяешь \\([\\hat k]_\\times\\mathbf v=\\hat k\\times\\mathbf v\\) на \\(\\hat k=z_0\\), \\(\\mathbf v=x_0\\): должно выйти \\(y_0\\).", "benefit": "Матрица векторного произведения без ошибки знака"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/14.svg", "alt": "Векторы k, v и k×v в пространстве и пустая матрица 3×3 для [k]×"}}, {"q": "Как построить единичный кватернион (unit quaternion) по оси \\(\\hat k\\) и углу \\(\\theta\\) в порядке ABB — скаляр первым?", "options": ["\\(q=\\left(\\cos\\frac{\\theta}{2},\\ \\hat k\\sin\\frac{\\theta}{2}\\right)\\)", "\\(q=\\left(\\cos\\theta,\\ \\hat k\\sin\\theta\\right)\\)", "\\(q=\\left(\\sin\\frac{\\theta}{2},\\ \\hat k\\cos\\frac{\\theta}{2}\\right)\\)", "\\(q=\\left(\\cos\\frac{\\theta}{2},\\ \\hat k\\,\\frac{\\theta}{2}\\right)\\)"], "correct": 0, "explain": "Рецепт «метра» лекции: пройди по окружности радиуса 1 ПОЛОВИНУ поворота; across (по горизонтали) \\(=\\cos\\frac{\\theta}{2}\\) — первое число, up (вверх) \\(=\\sin\\frac{\\theta}{2}\\), умноженное на ось, — остальные три. Пример: \\(90^\\circ\\) вокруг \\(z_0\\) → \\((0.7071,\\ 0,\\ 0,\\ 0.7071)\\). Полный угол — самая частая ошибка (поворот получится вдвое больше). Перестановка \\(\\cos\\)/\\(\\sin\\) даёт при \\(\\theta=0\\) кватернион \\((0,\\ \\hat k)\\) — это полуоборот, а не «нет поворота». \\(\\hat k\\theta/2\\) — это половина вектора поворота UR, а не кватернион: сумма квадратов не 1.", "usage": {"code": false, "without": "Ты переносишь ориентацию из пульта UR в контроллер ABB и подставляешь в кватернион вектор поворота как есть — робот встаёт в чужую позу.", "with": "Ты делишь вектор UR на длину (ось), длину берёшь как угол и строишь \\((\\cos\\frac{\\theta}{2},\\ \\hat k\\sin\\frac{\\theta}{2})\\).", "benefit": "Перевод UR → ABB без ошибки в позе"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/15.svg", "alt": "Ось k и угол θ превращаются в четыре числа кватерниона; скаляр w стоит первым"}}, {"q": "Дан кватернион \\(q=(w,\\ x,\\ y,\\ z)\\) в порядке ABB, \\(0<w<1\\). Как прочитать угол и ось (reading a quaternion)?", "options": ["\\(\\theta=\\arccos w\\), ось \\(=(x,\\ y,\\ z)/\\sin\\theta\\)", "\\(\\theta=2\\arccos w\\), ось \\(=(x,\\ y,\\ z)/\\cos\\frac{\\theta}{2}\\)", "\\(\\theta=2\\arcsin w\\), ось \\(=(x,\\ y,\\ z)/w\\)", "\\(\\theta=2\\arccos w\\), ось \\(=(x,\\ y,\\ z)/\\sin\\frac{\\theta}{2}\\)"], "correct": 3, "explain": "Обратный ход по «метру»: первое число — across \\(=\\cos\\frac{\\theta}{2}\\), значит \\(\\frac{\\theta}{2}=\\arccos w\\), и угол — удвоенный (find the point, double the angle). Векторная часть — это \\(\\sin\\frac{\\theta}{2}\\hat k\\), поэтому делить её надо на up \\(=\\sin\\frac{\\theta}{2}\\). Без удвоения угол выходит вдвое меньше (\\(0.7071\\to45^\\circ\\) вместо \\(90^\\circ\\)). Деление на \\(\\cos\\frac{\\theta}{2}=w\\) даёт ось неединичной длины. \\(\\arcsin w\\) путает across и up.", "usage": {"code": false, "without": "ROS-нода логирует ориентацию кватернионом, и ты оцениваешь поворот «на глаз» по числам — ошибаешься вдвое.", "with": "Ты берёшь \\(2\\arccos w\\): \\(w=0.683\\to93.84^\\circ\\), ось — вектор, делённый на \\(\\sin46.92^\\circ\\).", "benefit": "Кватернион из лога читается как ось и угол за минуту"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/16.svg", "alt": "Кватернион (w, x, y, z) с 0 < w < 1 и вопрос: чему равны угол θ и ось k"}}, {"q": "Произведение кватернионов (Hamilton product) \\(q_1q_2\\) при \\(q_i=(w_i,\\ \\mathbf v_i)\\) — по стандартному правилу (в лекции не выводится):", "options": ["\\(\\left(w_1w_2+\\mathbf v_1\\cdot\\mathbf v_2,\\ \\ w_1\\mathbf v_2+w_2\\mathbf v_1+\\mathbf v_1\\times\\mathbf v_2\\right)\\)", "\\(\\left(w_1w_2-\\mathbf v_1\\cdot\\mathbf v_2,\\ \\ w_1\\mathbf v_2+w_2\\mathbf v_1\\right)\\)", "\\(\\left(w_1w_2-\\mathbf v_1\\cdot\\mathbf v_2,\\ \\ w_1\\mathbf v_1+w_2\\mathbf v_2+\\mathbf v_2\\times\\mathbf v_1\\right)\\)", "\\(\\left(w_1w_2-\\mathbf v_1\\cdot\\mathbf v_2,\\ \\ w_1\\mathbf v_2+w_2\\mathbf v_1+\\mathbf v_1\\times\\mathbf v_2\\right)\\)"], "correct": 3, "explain": "Правило Гамильтона следует из \\(i^2=j^2=k^2=ijk=-1\\): скалярная часть \\(w_1w_2-\\mathbf v_1\\cdot\\mathbf v_2\\) (минус — от \\(i^2=-1\\)), векторная \\(w_1\\mathbf v_2+w_2\\mathbf v_1+\\mathbf v_1\\times\\mathbf v_2\\). Именно векторное произведение делает умножение некоммутативным — как у матриц поворота. Без него (второй дистрактор) \\(q_1q_2=q_2q_1\\), чего у поворотов не бывает. Плюс в скалярной части ломает единичность. В последнем \\(\\mathbf v_2\\times\\mathbf v_1\\) и перепутанные веса — это не тот поворот. Лекция лишь упоминает: «компьютер комбинирует повороты, перемножая кватернионы».", "usage": {"code": false, "without": "Ты складываешь ориентацию фланца и инструмента в прошивке поэлементно — инструмент «плывёт».", "with": "Ты перемножаешь кватернионы по Гамильтону и сверяешь с \\(R_1R_2\\) на одном примере.", "benefit": "Композиция поворотов на кватернионах без перехода в матрицы"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/17.svg", "alt": "Два кватерниона q1 = (w1, v1) и q2 = (w2, v2) и их произведение q1 q2 с неизвестными частями"}}, {"q": "Сопряжённый кватернион (conjugate) \\(q^*\\) единичного \\(q=(w,\\ \\mathbf v)\\) — что это и что он делает?", "options": ["\\(q^*=(-w,\\ -\\mathbf v)\\): обратный поворот, \\(q\\,q^*=(1,\\ \\mathbf 0)\\)", "\\(q^*=(-w,\\ \\mathbf v)\\): тот же поворот, но длинным путём", "\\(q^*=(w,\\ -\\mathbf v)\\): тот же поворот, записанный в порядке ROS", "\\(q^*=(w,\\ -\\mathbf v)\\): обратный поворот, \\(q\\,q^*=(1,\\ \\mathbf 0)\\)"], "correct": 3, "explain": "У сопряжённого меняется знак только векторной части: \\((\\cos\\frac{\\theta}{2},\\ -\\sin\\frac{\\theta}{2}\\hat k)\\) — поворот на \\(\\theta\\) вокруг \\(-\\hat k\\), то есть обратный. Для единичного \\(q\\) он же обратный: \\(q\\,q^*=(w^2+|\\mathbf v|^2,\\ \\mathbf 0)=(1,\\ \\mathbf 0)\\). Смена всех четырёх знаков — это \\(-q\\): ТА ЖЕ поза, а вовсе не обратная: \\(q\\,(-q)^*=(-1,\\ \\mathbf 0)\\), то есть «полный оборот», а не «нет поворота». Смена знака только \\(w\\) — это \\(-q^*\\), то есть обратный поворот длинным путём, а не тот же. Порядок ROS — перестановка чисел, а не смена знаков. Аналог у матриц: \\(q^*\\leftrightarrow R^{\\mathsf T}\\).", "usage": {"code": false, "without": "Нужно перевести позу камеры в систему робота, и ты «обращаешь» кватернион сменой всех знаков — поза не меняется, деталь мимо.", "with": "Ты берёшь \\(q^*=(w,\\ -\\mathbf v)\\), как \\(R^{\\mathsf T}\\) у матрицы, и проверяешь \\(q\\,q^*=(1,\\ \\mathbf 0)\\).", "benefit": "Обратное преобразование без ошибки"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/18.svg", "alt": "Кватернион q = (w, v), его сопряжённый q* с неизвестным видом и вопрос про q·q*"}}, {"q": "Как повернуть вектор \\(\\mathbf v\\) единичным кватернионом \\(q\\) (стандартная формула; вектор записывают как \\((0,\\ \\mathbf v)\\))?", "options": ["\\(\\mathbf v'\\) — векторная часть \\(q\\,(0,\\ \\mathbf v)\\,q^*\\)", "\\(\\mathbf v'\\) — векторная часть \\(q\\,(0,\\ \\mathbf v)\\,q\\)", "\\(\\mathbf v'\\) — векторная часть \\(q^*\\,(0,\\ \\mathbf v)\\,q\\)", "\\(\\mathbf v'\\) — векторная часть \\(q\\,(0,\\ \\mathbf v)\\)"], "correct": 0, "explain": "«Сэндвич» \\(q\\,\\mathbf v\\,q^*\\) поворачивает \\(\\mathbf v\\) на \\(\\theta\\) вокруг \\(\\hat k\\) — это то же, что \\(R\\mathbf v\\). Каждый множитель даёт \\(\\theta/2\\), отсюда половина угла в \\(q\\). Порядок \\(q^*\\,\\mathbf v\\,q\\) даёт ОБРАТНЫЙ поворот (\\(R^{\\mathsf T}\\mathbf v\\)). Без сопряжения (\\(q\\mathbf v q\\)) или одним множителем (\\(q\\mathbf v\\)) результат даже не чистый вектор и не той длины. Проверка: \\(q=(0.7071,\\ 0,\\ 0,\\ 0.7071)\\), \\(\\mathbf v=x_0\\) → \\(y_0\\).", "usage": {"code": false, "without": "Ты поворачиваешь вектор нормали шва кватернионом ориентации датчика и пишешь \\(q^*vq\\) — нормаль уходит в зеркальную сторону.", "with": "Ты пишешь \\(qvq^*\\) и проверяешь на четвертьобороте вокруг \\(z_0\\): \\(x_0\\) переходит в \\(y_0\\).", "benefit": "Векторы поворачиваются в нужную сторону"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/19.svg", "alt": "Вектор v вокруг оси k переходит в повёрнутый вектор, найти его формулой с кватернионом q"}}, {"q": "Как связаны след матрицы \\(\\operatorname{tr}R=r_{11}+r_{22}+r_{33}\\) и первое число \\(w\\) кватерниона того же поворота (quaternion ↔ matrix)?", "options": ["\\(\\operatorname{tr}R=1+2w\\)", "\\(\\operatorname{tr}R=3w^2\\)", "\\(\\operatorname{tr}R=4w^2-1\\)", "\\(\\operatorname{tr}R=2w^2+1\\)"], "correct": 2, "explain": "Две цепочки: \\(\\operatorname{tr}R=1+2\\cos\\theta\\) (Recipe 1) и \\(w=\\cos\\frac{\\theta}{2}\\). Формула двойного угла \\(\\cos\\theta=2w^2-1\\) даёт \\(\\operatorname{tr}R=1+2(2w^2-1)=4w^2-1\\). Отсюда прямой переход матрица → кватернион: \\(w=\\frac12\\sqrt{1+\\operatorname{tr}R}\\). Проверка: \\(I\\): \\(3=4\\cdot1-1\\); кубик: \\(0=4\\cdot0.25-1\\). «\\(1+2w\\)» путает \\(w\\) с \\(\\cos\\theta\\) (забыта половина угла). Все три дистрактора проходят проверку на \\(I\\), но не на кубике: там след 0, а они дают 2, 0.75 и 1.5.", "usage": {"code": false, "without": "Ты конвертируешь матрицу позы в кватернион через ось и угол, и около \\(\\theta=0\\) деление на \\(\\sin\\) даёт мусор.", "with": "Ты берёшь \\(w=\\frac12\\sqrt{1+\\operatorname{tr}R}\\) напрямую и только потом векторную часть.", "benefit": "Устойчивый переход матрица → кватернион"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/20.svg", "alt": "Матрица с выделенным следом tr R и кватернион с выделенным числом w; нужна связь между ними"}}, {"q": "Четвертьоборот вокруг \\(z_0\\) (quarter turn, \\(90^\\circ\\)). Какой у него кватернион в порядке ABB \\((w,\\ x,\\ y,\\ z)\\)?", "options": ["\\((0,\\ 0,\\ 0,\\ 1)\\)", "\\((0,\\ 0,\\ 0.7071,\\ 0.7071)\\)", "\\((0.7071,\\ 0,\\ 0,\\ 0.7071)\\)", "\\((0.7071,\\ 0.7071,\\ 0,\\ 0)\\)"], "correct": 2, "explain": "Половина от \\(90^\\circ\\) — \\(45^\\circ\\): across \\(=\\cos45^\\circ=0.7071\\), up \\(=\\sin45^\\circ=0.7071\\), умноженное на ось \\((0,\\ 0,\\ 1)\\). Итого \\((0.7071,\\ 0,\\ 0,\\ 0.7071)\\); квадраты: \\(0.5+0.5=1\\). \\((0,\\ 0,\\ 0,\\ 1)\\) — полный угол \\(90^\\circ\\) на «метре»: это полуоборот \\(180^\\circ\\). \\((0,\\ 0,\\ 0.7071,\\ 0.7071)\\) — то же сообщение в порядке ROS, прочитанное как ABB. \\((0.7071,\\ 0.7071,\\ 0,\\ 0)\\) — поворот вокруг \\(x_0\\).", "usage": {"code": false, "without": "Тебе нужно повернуть деталь на столе на \\(90^\\circ\\), и ты вписываешь в ROS-сообщение \\((0,\\ 0,\\ 0,\\ 1)\\) «по памяти» — деталь разворачивается на \\(180^\\circ\\).", "with": "Ты проходишь половину угла: \\(\\cos45^\\circ,\\ \\sin45^\\circ\\) — и вписываешь правильный кватернион, учитывая порядок ROS.", "b {(r_{ii}+1)/2}\\) даёт \\((0,\\ 1,\\ 0)\\); \\(q=(0,\\ 0,\\ 1,\\ 0)\\)", "Ось \\(z_0\\), раз захват смотрит вниз; \\(q=(0,\\ 0,\\ 0,\\ 1)\\)"], "correct": 2, "explain": "При \\(180^\\circ\\) \\(\\sin\\theta=0\\), поэтому все пары нулевые — ничего не «закрутилось» в одну сторону сильнее, чем в другую. Трюк лекции для полуоборота: прибавь 1 к числу диагонали, раздели пополам, извлеки корень — это модуль компоненты оси: \\((0,\\ 1,\\ 0)\\), полуоборот вокруг \\(y_0\\). Кватернион: половина \\(180^\\circ\\) — \\(90^\\circ\\), across 0, up 1 по \\(y_0\\): \\((0,\\ 0,\\ 1,\\ 0)\\) — именно его лекция берёт как pick в проверке знака. «Нет поворота» противоречит Recipe 1 (\\(180^\\circ\\)). Диагональ — не ось. Вокруг \\(z_0\\) полуоборот дал бы диагональ \\((-1,\\ -1,\\ 1)\\).", "usage": {"code": false, "without": "Твой код Recipe 2 делит пары на их длину и на позе «захват вниз» падает с делением на ноль.", "with": "Ты ловишь случай \\(\\theta\\approx180^\\circ\\) отдельно и берёшь ось из диагонали: \\(\\sqrt{(r_{ii}+1)/2}\\).", "benefit": "Код не падает на самой частой позе захвата"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/23.svg", "alt": "Захват смотрит вниз над деталью, рядом дана матрица R_pick; нужны ось и кватернион"}}, {"q": "Поворота нет: \\(R=I\\). Что дают Recipe 1, вектор поворота UR (rotation vector) и кватернион?", "options": ["\\(\\theta=0^\\circ\\), ось \\((1,\\ 1,\\ 1)/\\sqrt3\\); UR \\((0,\\ 0,\\ 0)\\); \\(q=(0,\\ 0,\\ 0,\\ 0)\\)", "\\(\\theta=360^\\circ\\), ось любая; UR \\((0,\\ 0,\\ 6.2832)\\); \\(q=(0,\\ 0,\\ 0,\\ 1)\\)", "\\(\\theta=0^\\circ\\), ось \\(z_0\\); UR \\((0,\\ 0,\\ 1)\\); \\(q=(1,\\ 0,\\ 0,\\ 1)\\)", "\\(\\theta=0^\\circ\\), ось любая; UR \\((0,\\ 0,\\ 0)\\); \\(q=(1,\\ 0,\\ 0,\\ 0)\\)"], "correct": 3, "explain": "Сумма диагонали 3: \\((3-1)/2=1\\), \\(\\arccos1=0^\\circ\\). Пары нулевые, и ось действительно любая — при нулевом угле она ничего не значит. Вектор UR — ось, растянутая до \\(0\\) — нулевой. Кватернион: across \\(\\cos0=1\\), up \\(0\\): \\((1,\\ 0,\\ 0,\\ 0)\\) — «identity quaternion». \\((0,\\ 0,\\ 0,\\ 0)\\) не единичный. \\(360^\\circ\\) даёт ту же позу, но \\(\\cos180^\\circ=-1\\): кватернион был бы \\((-1,\\ 0,\\ 0,\\ 0)\\), а не \\((0,0,0,1)\\). Единичная ось \\((0,\\ 0,\\ 1)\\) в поле UR — это уже поворот на 1 радиан.", "usage": {"code": false, "without": "Инициализируешь ориентацию в ROS-сообщении нулями \\((0,\\ 0,\\ 0,\\ 0)\\) — tf2 ругается на ненормированный кватернион.", "with": "Ты пишешь identity: \\(x=y=z=0,\\ w=1\\) — ориентация «как у базы».", "benefit": "Корректное «нет поворота» в любом формате"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/24.svg", "alt": "Тело в той же ориентации, что и база: R = I, и вопрос: угол, ось, вектор UR, кватернион"}}, {"q": "Четвертьоборот вокруг \\(z_0\\). Что покажет пульт Universal Robots в полях \\(R_x,\\ R_y,\\ R_z\\) (rotation vector)?", "options": ["\\((0,\\ 0,\\ 90)\\)", "\\((0,\\ 0,\\ 1.5708)\\)", "\\((0,\\ 0,\\ 0.7854)\\)", "\\((0,\\ 0,\\ 0.7071)\\)"], "correct": 1, "explain": "Три шага лекции: ось \\((0,\\ 0,\\ 1)\\), угол в радианах \\(90\\cdot3.14159/180=1.5708\\), растянуть: \\((0,\\ 0,\\ 1.5708)\\). Длина стрелки — угол. \\(90\\) — градусы вместо радиан (а это 90 радиан, другой поворот). \\(0.7854=\\pi/4\\) — половина угла, это из кватерниона, а у вектора UR половины нет. \\(0.7071\\) — up-число кватерниона \\(\\sin45^\\circ\\), а не вектор поворота.", "usage": {"code": false, "without": "Ты пишешь в URScript \\(p[x,\\ y,\\ z,\\ 0,\\ 0,\\ 90]\\), чтобы повернуть инструмент на четверть, — запястье уходит совсем в другую позу.", "with": "Ты пишешь \\(p[x,\\ y,\\ z,\\ 0,\\ 0,\\ 1.5708]\\) — ровно \\(90^\\circ\\) вокруг \\(z\\) базы.", "benefit": "Поворот на пульте совпадает с задуманным"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/25.svg", "alt": "Система координат поворачивается на 90° вокруг z₀ (анимация); поля Rx, Ry, Rz пульта UR неизвестны"}}, {"q": "ROS прислал ориентацию в своём порядке  проходит внутри неё. После нормировки — \\((0.7071,\\ 0,\\ 0,\\ 0.7071)\\), \\(90^\\circ\\): середина по симметрии верна, но в другие моменты нормированная хорда идёт быстрее в середине и медленнее у краёв. SLERP идёт по дуге с постоянной угловой скоростью. Читать угол по ненормированному числу (\\(120^\\circ\\)) нельзя. Проверка знака: \\(q_0\\cdot q_1=0\\ge0\\) — флип не нужен. Разность даёт \\(-90^\\circ\\) — другая сторона.", "usage": {"code": false, "without": "Ты интерполируешь кватернионы линейно без нормировки в контроллере камеры-гимбала — на середине хода изображение «дёргается».", "with": "Ты используешь SLERP (или хотя бы нормируешь и знаешь про неравномерность) — поворот ровный.", "benefit": "Ровная угловая скорость инструмента"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/38.svg", "alt": "Срез w–z единичной окружности кватернионов с точками q₀ = (1, 0, 0, 0) и q₁ = (0, 0, 0, 1), середина неизвестна"}}, {"q": "Какое представление ориентации где уместнее (choosing a representation)?", "options": ["Углы Эйлера — интерполировать; матрица — хранить, 9 чисел надёжнее; кватернион — показывать оператору", "Матрица — умножать позы и поворачивать векторы; вектор UR — ввод на пульте; кватернион — хранить и интерполировать", "Вектор UR — интерполировать покомпонентно; кватернион — вводить на пульте; матрица — для логов", "Кватернион — для всего: матрица и вектор UR устарели и в ROS не используются"], "correct": 1, "explain": "Матрица (9 чисел) — прямое умножение поз и поворот векторов \\(R\\mathbf v\\), но избыточна и плохо смешивается (планировщик A). Вектор поворота — 3 числа, ось и угол видны: удобен для пульта UR и малых поворотов. Кватернион — 4 числа, без блокировки, легко нормировать, проверять квадратами и интерполировать SLERP; ABB и ROS хранят его. Углы Эйлера — для человека (KUKA A, B, C), но интерполировать их плохо (\\(426^\\circ\\) у B). Покомпонентная интерполяция вектора поворота не даёт постоянной оси. ROS широко использует и матрицы (t круг \\((0.2506,\\ -0.2506,\\ -0.9351)\\)"], "correct": 0, "explain": "Шаг 1: \\(R_{\\text{pick}}^{\\mathsf T}=R_{\\text{pick}}\\); умножение справа меняет знак столбцов 1 и 3: \\(R=\\begin{bmatrix}0&-0.866&-0.5\\\\1&0&0\\\\0&-0.5&0.866\\end{bmatrix}\\). Шаг 2: след \\(0.866\\), \\((0.866-1)/2=-0.067\\), \\(\\arccos(-0.067)\\approx93.84^\\circ\\). Шаг 3: пары \\((-0.5,\\ -0.5,\\ 1.866)\\), длина \\(\\approx1.9955\\), ось \\((-0.2506,\\ -0.2506,\\ 0.9351)\\) — почти вертикальная, наклон \\(20.8^\\circ\\). Ошибки: пары «верх минус низ» → \\(-\\hat k\\); потерянный знак у \\(-0.067\\) → \\(86.16^\\circ\\); порядок \\(R_{\\text{pick}}^{\\mathsf T}R_{\\text{place}}\\) даёт тот же угол, но ось в системе инструмента \\((0.2506,\\ -0.2506,\\ -0.9351)\\), а не базы.", "usage": {"code": false, "without": "Ты считаешь «на сколько повернётся запястье» как разность RPY двух поз — получаешь сотни градусов и закладываешь лишнее время цикла.", "with": "Ты берёшь \\(R_{\\text{place}}R_{\\text{pick}}^{\\mathsf T}\\) и Recipe 1: \\(93.84^\\circ\\) — честный ход запястья.", "benefit": "Реальный ход переориентации из двух поз"}, "img": {"src": "img/rmo_axis_angle_quaternions_slerp/42.svg", "alt": "Две матрицы R_pick и R_place; нужно найти R = R_place · R_pickᵀ, его угол и ось"}}, {"q": "Задача (E3a). Поворот \\(90^\\circ\\) вокруг corner line \\((0.5774,\\ 0.5774,\\ 0.5774)\\). По формуле Родрига (три матрицы) найди первую строку \\(R\\), с двумя знаками.", "options": ["\\((0.33,\\ -0.24,\\ 0.91)\\)", "\\((0.33,\\ 0.91,\\ -0.24)\\)", "\\((0,\\ -0.58,\\ 0.58)\\)", "\\((0.33,\\ 0.33,\\ 0.33)\\)"], "correct": 0, "explain": "Шаг 1, веса: \\(\\cos90^\\circ=0\\), \\(1-\\cos=1\\), \\(\\sin=1\\) — «no turn» выпадает. Шаг 2: \\(\\hat k\\hat k^{\\mathsf T}\\) — все числа \\(0.5774^2\\approx0.333\\); \\([\\hat k]_\\times\\), строка 1: \\((0,\\ -k_z,\\ k_y)=(0,\\ -0.5774,\\ 0.5774)\\). Шаг 3: сумма \\((0.333,\\ 0.333-0.577,\\ 0.333+0.577)\\approx(0.33,\\ -0.24,\\ 0.91)\\). Ошибки: знаки \\([\\hat k   const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: работа над ошибками
    // не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  // Карточка вопроса: варианты, объяснение, пример. Общая для теста и для
  // «Работы над ошибками» / «Повторения», чтобы они не разошлись видом.
  function cardHtml(q, answered) {
    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += imageHtml(q.img);
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» ----
  // Отдельный проход только по вопросам с неисправленной ошибкой. Счёт теста
  // (state.answers) он не трогает: исправленная ошибка пишется в state.fixed.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = LTProgress.mistakes(state);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast("Ошибок не осталось — всё исправлено");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = "Работа над ошибками · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        if (ok) { state.fixed = state.fixed || {}; state.fixed[idx] = Date.now(); saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    const left = LTProgress.mistakes(state).length;
    blockLabel.textContent = "Работа над ошибками · итог";
    html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
    html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
    if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  // Картинка к вопросу (поле img из content/<slug>.json, путь от корня сайта).
  // Касание открывает её целиком: на телефоне так её можно увеличить.
  function imageHtml(img) {
    if (!img || !img.src) return "";
    const src = "../" + escapeAttr(img.src);
    let html = '<figure class="qimg"><a href="' + src + '" target="_blank" rel="noopener">';
    html += '<img src="' + src + '" alt="' + escapeAttr(img.alt) + '" loading="lazy"></a>';
    if (img.credit) html += '<figcaption>' + escapeHtml(img.credit) + '</figcaption>';
    return html + '</figure>';
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ")
      .replace(/\\[()\[\]]/g, " ").replace(/\\([a-zA-Z]+)/g, "$1").replace(/\s+/g, " ").trim();
  }

  // Формулы в тексте: \( ... \) в строке, \[ ... \] отдельной строкой (KaTeX,
  // файлы в vendor/katex). Знак $ разделителем не служит: в тестах по
  // ассемблеру и shell он означает константу и переменную. Код в <pre> и
  // <code> не трогается. Без KaTeX текст остаётся как есть.
  function typeset(el) {
    if (!el || typeof renderMathInElement !== "function") return;
    renderMathInElement(el, {
      delimiters: [
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false
    });
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
