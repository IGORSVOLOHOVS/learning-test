<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSP 5: Аппроксимация произвольной АЧХ FIR-системами</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>DSP 5: Аппроксимация произвольной АЧХ FIR-системами</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "dsp_fir_arbitrary_magnitude_approximation";
  const QUESTIONS = [{"q": "Проектируя FIR-фильтр методом оконного взвешивания под произвольную желаемую АЧХ, что в первую очередь вычисляет разработчик?", "options": ["Корни знаменателя передаточной функции, задающие расположение полюсов будущего фильтра", "Коэффициенты ряда Чебышева, приближающие желаемую АЧХ полиномом заданной степени", "Обратное преобразование Фурье желаемой частотной характеристики, дающее импульсную характеристику", "Прямое преобразование Фурье измеренного отклика готового фильтра, дающее оценку АЧХ"], "correct": 2, "explain": "Оконный метод стартует с обратного преобразования Фурье желаемой АЧХ — это даёт бесконечную идеальную импульсную характеристику, которую затем усекают окном конечной длины. Вариант с прямым преобразованием Фурье описывает анализ уже существующего сигнала, а не синтез фильтра (Proakis, гл. 8).", "usage": {"code": false, "without": "Без этого шага студент пытается сразу подобрать коэффициенты фильтра перебором и тратит часы на бесплодные итерации.", "with": "Зная порядок действий, он сразу берёт обратное преобразование Фурье желаемой АЧХ и переходит к выбору окна.", "benefit": "Экономит время проектирования и избегает случайных структур фильтра."}}, {"q": "В методе частотной выборки для синтеза FIR-фильтра с произвольной желаемой АЧХ импульсную характеристику получают как?", "options": ["Обратное дискретное преобразование Фурье от отсчётов желаемой АЧХ, заданных на равномерной сетке частот", "Разложение желаемой фазовой характеристики в ряд Тейлора вблизи центральной частоты полосы", "Прямое дискретное преобразование Фурье от отсчётов измеренного во времени сигнала на выходе фильтра", "Решение системы линейных уравнений Прони по отсчётам импульсной характеристики эталонного фильтра"], "correct": 0, "explain": "Метод частотной выборки задаёт желаемую АЧХ конечным числом отсчётов на равномерной сетке частот и берёт от них обратное ДПФ, получая импульсную характеристику длины N. Уравнения Прони относятся к параметрической оценке уже существующего сигнала, а не к синтезу фильтра (Oppenheim, гл. 7).", "usage": {"code": false, "without": "Без понимания метода студент путает частотную выборку с обычным окном и не может объяснить происхождение отсчётов ДПФ.", "with": "Он видит, что достаточно задать N значений желаемой АЧХ и взять обратное ДПФ.", "benefit": "Позволяет быстро прикинуть импульсную характеристику по спецификации в частотной области."}}, {"q": "Алгоритм Паркса-Маклеллана при проектировании FIR-фильтра с произвольной АЧХ ищет коэффициенты по какому критерию?", "options": ["Минимизирует групповую задержку фильтра ценой увеличения неравномерности амплитуды в полосе", "Минимизирует число ненулевых коэффициентов импульсной характеристики при фиксированном порядке фильтра", "Минимизирует сумму квадратов отклонения фактической АЧХ от желаемой по всей полосе частот", "Минимизирует наибольшее отклонение АЧХ от желаемой, выравнивая пульсации по величине"], "correct": 3, "explain": "Алгоритм Ремеза, лежащий в основе метода Паркса-Маклеллана, ищет минимаксное решение: наибольшее по модулю отклонение от желаемой АЧХ делается как можно меньше, из-за чего ошибка колеблется с почти равными пиками. Критерий наименьших квадратов минимизирует не пиковую, а среднюю ошибку (Wanhammar, гл. 5).", "usage": {"code": false, "without": "Без этого различия студент считает equiripple-фильтр просто ещё одним окном и не понимает, почему у него более узкая переходная полоса при том же порядке.", "with": "Он знает, что минимакс специально выравнивает пульсации, и выбирает метод под жёсткую спецификацию по пульсациям.", "benefit": "Даёт наименьший порядок фильтра при заданных допусках на пульсации."}}, {"q": "Чем критерий минимакс отличается от критерия наименьших квадратов при аппроксимации желаемой АЧХ FIR-фильтром?", "options": ["Минимакс всегда даёт более короткий фильтр при одинаковой ширине переходной полосы", "Минимакс выравнивает наибольшее отклонение по полосе, а наименьшие квадраты — среднюю энергию ошибки", "Минимакс требует нечётного порядка фильтра, а наименьшие квадраты — только чётного", "Минимакс применим лишь к фильтрам нижних частот, а наименьшие квадраты — к любым типам, поскольку только для нижних частот выполняется условие теоремы Чебышева о равноволновом приближении"], "correct": 1, "explain": "Минимакс ограничивает пиковое отклонение и стремится сделать все локальные максимумы ошибки равными, тогда как критерий наименьших квадратов минимизирует интеграл квадрата ошибки, допуская отдельные большие выбросы. Связь с чётностью порядка или типом фильтра тут ни при чём (Wanhammar, гл. 5).", "usage": {"code": false, "without": "Без этого разработчик выбирает критерий наугад и потом удивляется, почему least-squares фильтр не проходит по пиковой пульсации из ТЗ.", "with": "Он сознательно берёт минимакс, когда спецификация задаёт именно предельную пульсацию.", "benefit": "Гарантирует соответствие фильтра формальному допуску на пульсации, а не только средней ошибке."}}, {"q": "Резкое усечение идеальной бесконечной импульсной характеристики прямоугольным окном при проектировании FIR-фильтра вызывает какой эффект вблизи разрыва желаемой АЧХ?", "options": ["Плавное и монотонное смещение центральной частоты полосы пропускания в сторону заметно более низких частот", "Появление на комплексной плоскости лишних полюсов передаточной функции вне единичной окружности", "Пульсации Гиббса: колебания фактической АЧХ вблизи разрыва с почти неизменной амплитудой выброса независимо от длины окна", "Полное и необратимое подавление боковых лепестков спектра без каких-либо остаточных колебаний вблизи разрыва"], "correct": 2, "explain": "Эффект Гиббса — известное следствие усечения ряда Фурье: у разрыва желаемой АЧХ возникает выброс, амплитуда которого практически не уменьшается при увеличении длины окна, меняется только его ширина. Увеличение окна не убирает пульсации, оно лишь сужает область их проявления (Oppenheim, гл. 7).", "usage": {"code": false, "without": "Без знания эффекта студент пытается убрать выброс, просто удлиняя прямоугольное окно, и не понимает, почему пульсация не уменьшается.", "with": "Он знает, что нужно сменить форму окна, а не увеличивать его длину.", "benefit": "Экономит время на бесполезных попытках и ведёт сразу к сглаживающим окнам."}}, {"q": "Окно Кайзера в оконном методе проектирования FIR-фильтра отличается от окон Хэмминга и Ханна прежде всего чем?", "options": ["Оно единственное имеет настраиваемый параметр бета для компромисса между лепестками спектра", "Оно единственное из перечисленных не вызывает эффекта Гиббса на границе полосы", "Оно единственное из перечисленных обеспечивает строго линейную фазовую характеристику фильтра", "Оно единственное применимо к фильтрам с произвольной, а не только низкочастотной АЧХ"], "correct": 0, "explain": "Ключевая особенность окна Кайзера — параметр бета: увеличивая его, разработчик сужает боковые лепестки ценой расширения главного лепестка, то есть напрямую управляет компромиссом пульсации-переходная полоса одним числом. Линейность фазы обеспечивают все симметричные окна, а не только окно Кайзера (Proakis, гл. 8).", "usage": {"code": false, "without": "Без этого параметра студент перебирает готовые окна одно за другим, пока случайно не попадёт в допуск по пульсации.", "with": "Он подбирает одно число бета и сразу попадает в нужный компромисс.", "benefit": "Заменяет перебор окон одной плавной настройкой."}}, {"q": "FIR-фильтр называют линейно-фазовым, если его импульсная характеристика удовлетворяет какому условию?", "options": ["Она принимает только целочисленные значения после квантования всех коэффициентов фильтра", "Она равна нулю на всех отсчётах, кроме самого первого и самого последнего значения по времени", "Она монотонно убывает по величине от первого отсчёта до самого последнего, нигде не повторяя своих значений", "Она симметрична или антисимметрична относительно своей центральной точки по времени"], "correct": 3, "explain": "Линейная фаза FIR-фильтра достигается ровно тогда, когда импульсная характеристика симметрична либо антисимметрична относительно центра — тогда фазовая характеристика линейна по частоте и групповая задержка постоянна. Монотонность или квантование коэффициентов с этим свойством не связаны (Oppenheim, гл. 7).", "usage": {"code": false, "without": "Без этого критерия студент проверяет линейность фазы построением графика для каждого нового фильтра.", "with": "Он сразу смотрит на симметрию коэффициентов и делает вывод о фазе без построения графиков.", "benefit": "Позволяет проверить линейность фазы по коэффициентам за секунды."}}, {"q": "Деление линейно-фазовых FIR-фильтров на четыре типа основано на каких двух признаках импульсной характеристики?", "options": ["На положении полюсов передаточной функции и на устойчивости фильтра", "На симметричности или антисимметричности характеристики и на чётности длины", "На знаке первого коэффициента и на количестве нулевых коэффициентов подряд", "На порядке фильтра по формуле Кайзера и на ширине переходной полосы"], "correct": 1, "explain": "Четыре типа линейно-фазовых FIR-фильтров различают по двум независимым признакам: симметрична характеристика или антисимметрична, и имеет она чётную или нечётную длину. Комбинация этих признаков определяет, например, почему один из типов не может реализовать высокочастотный фильтр (Wanhammar, гл. 4).", "usage": {"code": false, "without": "Без этой классификации студент не понимает, почему заданный тип FIR не подходит под высокочастотную спецификацию, и тратит время на неверный выбор.", "with": "Он сразу проверяет симметрию и длину характеристики и отбрасывает непригодные типы.", "benefit": "Исключает выбор структурно неподходящего типа фильтра ещё до расчёта коэффициентов."}}, {"q": "В спецификации FIR-фильтра переходная полоса — это что именно?", "options": ["Диапазон частот, в котором коэффициенты импульсной характеристики принимают только отрицательные значения", "Диапазон частот выше половины частоты дискретизации, где спектр окна инженер не может отдельно ужесточить одну из нескольких полос и получает избыточный запас в остальных.", "with": "Через Remez или взвешенный МНК инженер задаёт разные веса для каждой полосы и получает нужный результат за один расчёт.", "benefit": "Гибкая многополосная спецификация без итеративного подбора окна."}}, {"q": "Идеальная импульсная характеристика фильтра нижних частот бесконечна и усекается окном Rectangular для получения реализуемого FIR-фильтра. Что произойдёт с АЧХ вблизи границы полосы пропускания и как это устранить?", "options": ["АЧХ станет идеально плоской без каких-либо искажений у границы", "АЧХ получит дополнительный ноль передаточной функции точно на границе", "АЧХ практически не изменится при переходе на окно Hamming", "АЧХ получит пульсации Гиббса, устраняемые заменой окна на Hamming"], "correct": 3, "explain": "Резкое усечение идеальной характеристики порождает явление Гиббса — устойчивые пульсации у разрыва АЧХ; применение сглаживающего окна вроде Hamming снижает уровень пульсаций ценой расширения переходной полосы. (Oppenheim, гл. 7)", "usage": {"code": false, "without": "С окном Rectangular инженер получает фильтр с заметным выбросом АЧХ у среза, который не проходит контроль качества.", "with": "Заменив окно на Hamming, инженер убирает основную часть пульсаций Гиббса ценой немного более широкого перехода.", "benefit": "Соответствие спецификации по пульсациям без смены метода синтеза."}}, {"q": "После расчёта FIR-фильтра методом Паркса-Маклеллана нужно проверить, что найденное решение действительно оптимально по критерию Чебышёва. На что в первую очередь опирается такая проверка согласно теореме альтернанса?", "options": ["На равенство всех коэффициентов импульсной характеристики между собой", "На число экстремумов ошибки аппроксимации, чередующих знак по частоте", "На отсутствие полюсов передаточной функции внутри единичной окружности", "На совпадение групповой задержки фильтра с задержкой окна Kaiser"], "correct": 1, "explain": "Теорема альтернанса утверждает, что оптимальный равноволновый фильтр заданного порядка должен иметь минимально необходимое число экстремумов ошибки, чередующихся по знаку на частотной оси; именно подсчёт таких экстремумов подтверждает оптимальность решения Remez. (Proakis, гл. 8)", "usage": {"code": false, "without": "Не проверяя число экстремумов, инженер может принять неоптимальный результат итераций Remez за окончательный.", "with": "Подсчитав чередующиеся экстремумы ошибки, инженер убеждается, что алгоритм Remez сошёлся к истинному оптимуму.", "benefit": "Гарантия минимального порядка при заданных допусках."}}, {"q": "Инкрементальный энкодер мобильного робота даёт сигнал скорости с чёткими всплесками ошибки на нескольких известных частотах, кратных числу штрихов на оборот, а остальной спектр в целом чистый. Нужен FIR-фильтр, желаемая АЧХ которого - глубокие узкие провалы именно на этих частотах и почти без изменений всюду ещё. Какой метод синтеза FIR по произвольной АЧХ лучше всего подходит для точного попадания в заданные отдельные частотные точки?", "options": ["Метод частотной выборки с провалами точно в нужных узлах частотной сетки ДПФ", "Метод наименьших квадратов с одинаковым весом по всей рабочей полосе частот", "Оконное сглаживание импульсной характеристики идеального ФНЧ окном", "Равноволновый алгоритм Ремеза с одной широкой полосой заграждения по спектру"], "correct": 0, "explain": "Метод частотной выборки прямо задаёт требуемые значения АЧХ в дискретных узлах, поэтому провалы можно поставить точно на частоты гармоник, а между узлами форма определяется обратным ДПФ (Proakis, гл. 10).", "usage": {"code": false, "without": "Без знания метода частотной выборки инженер поставил бы Ремез с одной широкой полосой заграждения и без нужды подавил бы полезный сигнал между гармониками.", "with": "Зная метод, инженер задаёт нули АЧХ ровно в узлах гармоник и сохраняет соседние частоты почти нетронутыми.", "benefit": "Точечное подавление помех без потери полезного сигнала рядом."}}, {"q": "Для инерциального модуля робота проектируют FIR-фильтр методом наименьших квадратов: в рабочей полосе движения нужна ровная АЧХ, в соседней полосе вибраций - быстрый спад, а весовая функция ошибки задаётся отдельно для каждой полосы. Что произойдёт, если вес в полосе вибраций сделать значительно больше веса в рабочей полосе, а порядок фильтра оставить прежним?", "options": ["Порядок фильтра снизится без изменения точности аппроксимации", "Алгоритм перестанет сходиться и вернёт импульсную характеристику ФНЧ", "Фильтр станет линейно-фазовым независимо от симметрии характеристики", "Ошибка в полосе вибраций упадёт, а в рабочей полосе наоборот вырастет"], "correct": 3, "explain": "При фиксированном порядке взвешенный МНК распределяет суммарную ошибку обратно пропорционально весам, поэтому усиление веса в одной полосе снижает там ошибку ценой роста ошибки в остальных полосах (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Не понимая распределения ошибки по весам, инженер поднимает вес всюду сразу и не получает выигрыша ни в одной полосе.", "with": "Понимая компромисс, инженер целенаправленно поднимает вес именно в полосе вибраций, где критична точность.", "benefit": "Управляемое перераспределение ошибки под приоритеты задачи."}}, {"q": "Для датчика тока в приводе робота нужен FIR-фильтр, подавляющий частоту переключения силового ключа, спроектированный алгоритмом Ремеза с равноволновой аппроксимацией. Что произойдёт с ошибкой аппроксимации, если увеличить порядок этого фильтра, сохранив прежние границы полос и веса?", "options": ["Равноволновость нарушится, и ошибка станет монотонно убывающей к центру каждой полосы", "Число экстремумов ошибки возрастёт, а максимальная ошибка в полосе уменьшится", "Максимальная ошибка останется прежней, изменится только фазовая характеристика фильтра", "Число независимо задаваемых полос АЧХ уменьшится вдвое относительно исходного проекта"], "correct": 1, "explain": "По теореме об альтернации для алгоритма Ремеза с ростом порядка растёт число точек чередования знака ошибки, а минимаксная величина ошибки в каждой полосе убывает, равноволновый характер сохраняется (Proakis, гл. 10; exam_guide.txt).", "usage": {"code": false, "without": "Не зная этой закономерности, инженер поднимает порядок наугад и не может объяснить заказчику, зачем нужен именно такой запас по вычислениям.", "with": "Зная связь порядка и ошибки, инженер обосновывает минимально достаточный порядок фильтра под требуемый уровень подавления помехи.", "benefit": "Обоснованный выбор порядка вместо подбора наугад."}}, {"q": "Для коррекции АЧХ демодулированного сигнала резольвера инженер спроектировал FIR-фильтр методом частотной выборки, задав требуемые значения только в полосе пропускания и полосе заграждения, оставив узлы переходной полосы без отдельной оптимизации. На выходе появился заметный выброс АЧХ и медленно затухающие пульсации у границы полос. В чём причина?", "options": ["Весовая функция метода наименьших квадратов была ошибочно задана отрицательной", "Вместо частотной выборки по ошибке применили алгоритм Ремеза без учёта полос", "Резкий скачок требуемой АЧХ между узлами создаёт эффект Гиббса в переходе", "Число отводов фильтра оказалось нечётным, что запрещено для метода частотной выборки"], "correct": 2, "explain": "Незаданные или неоптимизированные отсчёты в переходной полосе оставляют резкий скачок требуемой АЧХ между узлами, что после обратного ДПФ проявляется как выброс и медленно затухающие пульсации - аналог эффекта Гиббса (Proakis, гл. 10).", "usage": {"code": false, "without": "Не зная причины, инженер увеличивает порядок фильтра вслепую и получает лишь незначительное улучшение.", "with": "Понимая причину, инженер добавляет и оптимизирует один-два переходных отсчёта и убирает выброс без роста порядка.", "benefit": "Устранение выброса АЧХ без лишнего усложнения фильтра."}}, {"q": "При синтезе FIR-фильтра для той же коррекции резольвера методом частотной выборки инженер добавляет один-два дополнительных отсчёта в переходную полосу и подбирает их значения так, чтобы минимизировать максимальный выброс АЧХ. Что произойдёт с пульсациями в полосе пропускания и полосе заграждения по сравнению с исходным вариантом без оптимизации переходных отсчётов?", "options": ["Пульсации в рабочих полосах уменьшатся ценой расширения переходной полосы", "Пульсации возрастут, поскольку добавляются новые точки разрыва производной АЧХ", "Порядок фильтра обязательно удвоится, а фазовая характеристика станет нелинейной", "Метод частотной выборки перестанет быть применим при нецелом числе отсчётов"], "correct": 0, "explain": "Оптимизация нескольких переходных отсчётов методом частотной выборки - известный приём, снижающий выбросы и пульсации АЧХ вблизи полосы пропускания и заграждения ценой некоторого расширения переходной зоны (Proakis, гл. 10).", "usage": {"code": false, "without": "Без этого приёма инженер мирится с заметным выбросом или без нужды повышает порядок фильтра.", "with": "Зная приём, инженер добавляет пару оптимизируемых отсчётов и получает заметно меньшие пульсации при том же порядке.", "benefit": "Меньшие пульсации без увеличения вычислительных затрат."}}, {"q": "Для датчика тока в силовом приводе важно, чтобы затухание на частоте переключения ключа никогда не опускалось ниже жёсткого порога - превышение этого порога в отдельной точке недопустимо, даже если средняя ошибка по всей полосе заграждения мала. Какой метод синтеза FIR по произвольной АЧХ лучше подходит под это требование?", "options": ["Метод частотной выборки без оптимизации отсчётов переходной полосы", "Метод наименьших квадратов с равномерным весом по всей полосе заграждения", "Оконное сглаживание идеальной импульсной характеристики окном Хэмминга", "Равноволновый алгоритм Ремеза, минимизирующий максимальную ошибку по полосе"], "correct": 3, "explain": "Алгоритм Ремеза решает минимаксную задачу и гарантирует ограничение именно максимальной ошибки в каждой полосе, тогда как метод наименьших квадратов контролирует только среднеквадратичную ошибку и допускает локальные выбросы (Proakis, гл. 10).", "usage": {"code": false, "without": "Выбрав метод наименьших квадратов, инженер рискует пропустить точку с недостаточным затуханием ровно на частоте переключения.", "with": "Выбрав Ремеза, инженер получает гарантированный потолок ошибки в каждой точке полосы заграждения.", "benefit": "Гарантия жёсткого порога затухания вместо контроля лишь в среднем."}}, {"q": "В фильтре для инерциального модуля есть три критичные полосы: рабочая полоса движения, узкая полоса вибрации подвески и полоса шума самого датчика, причём для заказчика важнее всего именно подавление вибрации подвески. Синтез ведётся алгоритмом Ремеза с весовой функцией, заданной отдельно для каждой полосы. Как добиться того, чтобы именно в полосе вибрации подвески итоговая пульсация АЧХ была меньше, чем в остальных двух полосах?", "options": ["Увеличить порядок фильтра, оставив веса всех трёх полос одинаковыми", "Задать вес полосы вибрации подвески заметно больше весов остальных полос", "Сузить полосу вибрации подвески до одной частотной точки без веса", "Заменить алгоритм Ремеза на оконное сглаживание с окном Кайзера"], "correct": 1, "explain": "В равноволновом алгоритме Ремеза относительная величина пульсации в каждой полосе обратно пропорциональна заданному в ней весу, поэтому больший вес в полосе вибрации подвески даёт там меньшую итоговую пульсацию (Proakis, гл. 10).", "usage": {"code": false, "without": "При равных весах инженер получает одинаковые по величине пульсации во всех трёх полосах и не может выделить приоритетную.", "with": "Задав больший вес нужной полосе, инженер целенаправленно снижает пульсацию именно там, где это важно заказчику.", "benefit": "Управление распределением точности между полосами без смены метода."}}, {"q": "Инженер проектирует FIR-фильтр методом частотной выборки, чтобы подавить два близко расположенных по частоте гармонических всплеска от энкодера, но выбрал слишком короткий фильтр, из-за чего соседние узлы частотной сетки ДПФ оказались реже, чем расстояние между гармониками. К чему это приведёт на практике?", "options": ["К автоматическому переходу метода частотной выборки в режим Ремеза", "К потере линейности фазовой характеристики готового фильтра", "К невозможности задать оба провала раздельно между узлами сетки", "К улучшению равноволновости итоговой АЧХ во всех полосах фильтра"], "correct": 2, "explain": "Шаг сетки частотной выборки равен частоте дискретизации, делённой на длину фильтра, поэтому при недостаточной длине два близких провала попадают между одними и теми же узлами и не могут быть заданы раздельно (Proakis, гл. 10).", "usage": {"code": false, "without": "Не понимая связь длины фильтра с шагом сетки, инженер удивляется, почему один провал получился вместо двух.", "with": "Понимая связь, инженер заранее увеличивает длину фильтра так, чтобы шаг сетки был меньше расстояния между гармониками.", "benefit": "Раздельное подавление близких по частоте помех."}}, {"q": "Для коррекции АЧХ канала резольвера важно не исказить фазу сигнала, поскольку по фазе демодулированного сигнала вычисляется угол поворота вала. Почему для такой коррекции с произвольной формой требуемой АЧХ обычно выбирают FIR-фильтр с симметричной импульсной характеристикой, а не IIR-фильтр той же произвольной формы?", "options": ["FIR с симметричной характеристикой даёт линейную фазу при любой форме АЧХ", "FIR-фильтры всегда требуют меньшего порядка, чем IIR, при одинаковой форме АЧХ", "IIR-фильтры в принципе не могут иметь произвольную форму амплитудной характеристики", "FIR-фильтры не вносят задержки сигнала независимо от длины импульсной характеристики"], "correct": 0, "explain": "Симметричная или антисимметричная импульсная характеристика FIR-фильтра гарантирует линейную фазу и постоянную групповую задержку при произвольной форме АЧХ, тогда как типичный IIR-фильтр с той же АЧХ вносит нелинейный фазовый сдвиг (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Выбрав IIR ради экономии порядка, инженер получает нелинейные искажения фазы и ошибку в вычисленном угле поворота.", "with": "Выбрав FIR с симметричной импульсной характеристикой, инженер сохраняет линейность фазы ценой большего порядка фильтра.", "benefit": "Точность измерения угла без фазовых искажений."}}, {"q": "При проектировании FIR-фильтра для датчика тока алгоритмом Ремеза инженер сужает переходную полосу между полосой пропускания и полосой заграждения, не меняя при этом порядок фильтра и веса полос. Что произойдёт с итоговыми пульсациями АЧХ в рабочих полосах?", "options": ["Пульсации исчезнут полностью за счёт автоматического роста порядка фильтра", "Пульсации не изменятся, так как переходная полоса не входит в критерий оптимизации", "Пульсации уменьшатся, поскольку задача аппроксимации станет проще для алгоритма", "Пульсации возрастут, поскольку задача аппроксимации станет более жёсткой для алгоритма"], "correct": 3, "explain": "При фиксированном порядке сужение переходной полосы усложняет минимаксную задачу алгоритма Ремеза, поэтому для сохранения равноволнового решения возрастает величина пульсаций в полосе пропускания и полосе заграждения (Proakis, гл. 10).", "usage": {"code": false, "without": "Не зная этого компромисса, инженер сужает переходную полосу и не понимает, почему выросли пульсации в рабочей полосе.", "with": "Зная компромисс, инженер либо расширяет переходную полосу, либо повышает порядок, чтобы удержать пульсации в допуске.", "benefit": "Осознанный выбор между шириной перехода, порядком и пульсацией."}}, {"q": "При проектировании ФНЧ методом окна Кайзера задано требуемое затухание в полосе задерживания As = 60 дБ. Шаг 1: определите, какая ветвь кусочной формулы Кайзера применяется для этого значения As. Шаг 2: вычислите параметр формы окна β. Чему равен β?", "options": ["β ≈ 6.61", "β ≈ 0.00", "β ≈ 5.65", "β ≈ 5.61"], "correct": 2, "explain": "Шаг 1: при A > 50 дБ используется ветвь β = 0.1102·(A − 8.7). Шаг 2: β = 0.1102·(60 − 8.7) = 0.1102·51.3 ≈ 5.65. Частые ошибки — забыть вычесть 8.7 (даёт 6.61), взять ветвь для 21 ≤ A ≤ 50 (Proakis, гл. 10).", "usage": {"code": false, "without": "Без правильной ветви формулы Кайзера инженер занижает β, окно даёт слабое подавление боковых лепестков, и в стоп-полосе фильтра для датчика тока остаются паразитные компоненты.", "with": "Определив ветвь по значению As, инженер сразу получает корректный β и окно с нужным подавлением боковых лепестков.", "benefit": "Гарантирует соответствие фильтра требованиям по подавлению помех с первой попытки."}}, {"q": "ФНЧ проектируется методом окна Кайзера: fs = 10000 Гц, граница полосы пропускания fp = 1500 Гц, граница полосы задерживания fst = 1800 Гц, требуемое затухание A = 50 дБ. Шаг 1: найдите нормированную ширину переходной полосы Δf = (fst − fp)/fs. Шаг 2: переведите её в Δω = 2πΔf. Шаг 3: вычислите минимальный порядок N = (A − 8)/(2.285·Δω), округлив вверх. Чему равен N?", "options": ["N ≈ 98", "N ≈ 97", "N ≈ 117", "N ≈ 613"], "correct": 0, "explain": "Шаг 1: Δf = 300/10000 = 0.03. Шаг 2: Δω = 2π·0.03 ≈ 0.1885 рад. Шаг 3: N = (50−8)/(2.285·0.1885) = 42/0.4307 ≈ 97.5 → округляем вверх до 98. Частые ошибки: забыть множитель 2π при переходе от Δf к Δω и получить 613, то есть завысить N в 2π ≈ 6.3 раза; не вычесть 8 из A и получить 117; округлить 97.5 вниз до 97 (Proakis, гл. 10; формула Кайзера M = (A−8)/(2.285·Δω), Oppenheim, гл. 7).", "usage": {"code": false, "without": "Без формулы Кайзера порядок фильтра антиалиасинга перед АЦП энкодера выбирают наугад с запасом, перегружая контроллер лишними умножениями на каждый такт.", "with": "Формула Кайзера сразу даёт минимальный порядок под заданную переходную полосу и затухание, без перебора вариантов.", "benefit": "Снижает вычислительную нагрузку встраиваемого контроллера при сохранении требуемых характеристик."}}, {"q": "Для прямоугольного окна приближённая оценка ширины переходной полосы в долях частоты дискретизации равна Δf ≈ 0.9/N, где N — длина окна в отсчётах. Задано: N = 101 отсчёт, fs = 20000 Гц. Шаг 1: вычислите нормированную Δf. Шаг 2: переведите её в герцы. Чему равна ширина переходной полосы?", "options": ["≈653 Гц", "≈198 Гц", "≈180 Гц", "≈178 Гц"], "correct": 3, "explain": "Шаг 1: Δf = 0.9/101 ≈ 0.00891 в долях fs. Шаг 2: в Гц — 0.00891·20000 ≈ 178 Гц. Частые ошибки: подставить N−1 = 100 вместо N и получить 180; взять константу окна Хэмминга 3.3 вместо 0.9 и получить 653; спутать формулу с шагом частотной сетки fs/N и получить 198 (Tan & Jiang, гл. 7, таблица нормированных переходных полос окон: 0.9/N прямоугольное, 3.1/N Ханна, 3.3/N Хэмминга, 5.5/N Блэкмана).", "usage": {"code": false, "without": "Без оценки переходной полосы окна инженер не знает, уложится ли фильтр антиалиасинга канала IMU в отведённую полосу частот, и обнаруживает нехватку подавления только на стенде.", "with": "Зная приближённую формулу для прямоугольного окна, инженер заранее оценивает переходную полосу и корректирует длину фильтра до реализации.", "benefit": "Экономит итерации макетирования фильтра антиалиасинга."}}, {"q": "Для окна Хэмминга приближённая ширина главного лепестка по нулям в частотной области составляет 8π/N рад/отсчёт, где N — длина окна в отсчётах. Задано: N = 61, fs = 16000 Гц. Шаг 1: переведите 8π/N в герцы через f = (ω/2π)·fs. Шаг 2: вычислите итоговое значение. Чему равна ширина главного лепестка в Гц?", "options": ["≈6592 Гц", "≈1049 Гц", "≈1067 Гц", "≈525 Гц"], "correct": 1, "explain": "Шаг 1: f = (8π/N)/(2π)·fs = (4/N)·fs. Шаг 2: f = 4·16000/61 ≈ 1049 Гц. Частые ошибки: подставить порядок N−1 = 60 вместо заданной длины N и получить 1067; взять формулу прямоугольного окна 4π/N, вдвое меньшую, и получить 525; забыть разделить на 2π при переводе радиан в герцы и получить 6592 (Proakis, гл. 10, табл. 10.2: ширина главного лепестка 8π/M при M — длине окна).", "usage": {"code": false, "without": "Не зная ширины главного лепестка окна Хэмминга, разработчик закладывает длину фильтра наугад и получает либо избыточную задержку, либо смазанные границы полос.", "with": "Переведя ширину главного лепестка в герцы, инженер точно соотносит длину окна с требуемой резкостью среза фильтра.", "benefit": "Позволяет подобрать минимально достаточную длину фильтра под конкретную полосу частот."}}, {"q": "Идеальная импульсная характеристика ФНЧ с частотой среза ωc задаётся как h[n] = sin(ωc(n−n0))/(π(n−n0)), а в центре n = n0 берётся её предельное значение. Задано: ωc = 0.3π, длина окна N = 41, отсюда n0 = (N−1)/2 = 20. Чему равно h[n0]?", "options": ["≈0.258", "≈0.150", "≈0.300", "≈0.942"], "correct": 2, "explain": "Шаг 1: при n → n0 предел sin(ωc(n−n0))/(π(n−n0)) равен ωc/π. Шаг 2: h[20] = 0.3π/π = 0.300. Частые ошибки: не поделить на π и получить ωc = 0.942; вместо предела подставить sin(ωc)/π и получить 0.258; разделить ωc на 2π вместо π и получить 0.150 (Oppenheim, гл. 7).", "usage": {"code": false, "without": "Без предельного значения h[n0] при табулировании идеальной импульсной характеристики программа получает неверный центральный отсчёт.", "with": "Зная, что h[n0] = ωc/π, инженер корректно инициализирует центральный отсчёт при генерации коэффициентов ФНЧ.", "benefit": "Исключает ошибку в центральном коэффициенте на этапе синтеза фильтра."}}, {"q": "Идеальная импульсная характеристика ФНЧ: ωc = 0.25π, n0 = (N−1)/2 = 15 при N = 31. Найдите h[n] при n = 17 по формуле h[n] = sin(ωc(n−n0))/(π(n−n0)).", "options": ["≈0.159", "≈0.225", "≈0.500", "≈0.196"], "correct": 0, "explain": "Шаг 1: n−n0 = 2, аргумент синуса ωc·2 = 0.5π, sin(0.5π) = 1. Шаг 2: h[17] = 1/(π·2) ≈ 0.159. Частые ошибки: забыть π в знаменателе, вынести sin(ωc) и умножить на 2 отдельно от аргумента синуса, либо взять n0 = N/2 = 15.5 вместо (N−1)/2 (Oppenheim, гл. 7).", "usage": {"code": false, "without": "Без формулы sinc для произвольного n программист вручную табулирует неверные коэффициенты вдали от центра и искажает АЧХ результирующего фильтра.", "with": "Применяя формулу sinc для конкретного n, инженер получает точные коэффициенты идеальной характеристики до умножения на окно.", "benefit": "Гарантирует точность коэффициентов на этапе синтеза, до применения окна."}}, {"q": "ФНЧ проектируется методом частотной выборки: число отсчётов АЧХ по кругу частот N = 64, fs = 8000 Гц, граница полосы пропускания fp = 1000 Гц, граница полосы задерживания fst = 1500 Гц. Шаг 1: найдите шаг сетки Δf = fs/N. Шаг 2: определите номера отсчётов на границах полос. Шаг 3: сколько отсчётов лежит строго между границами и считается переходными?", "options": ["1 отсчёт", "5 отсчётов", "4 отсчёта", "3 отсчёта"], "correct": 3, "explain": "Шаг 1: Δf = 8000/64 = 125 Гц. Шаг 2: kp = 1000/125 = 8, kst = 1500/125 = 12. Шаг 3: переходные отсчёты — k = 9,10,11, то есть 3 отсчёта. Частые ошибки: не вычесть единицу и получить kst−kp = 4, взять вдвое более редкую сетку fs/(N/2) и получить 1, либо включить обе граничные точки и насчитать 5 (Proakis, гл. 10).", "usage": {"code": false, "without": "Без расчёта числа переходных отсчётов инженер оставляет резкий скачок в задаваемой АЧХ, и синтезированный частотной выборкой фильтр даёт большие боковые лепестки.", "with": "Определив число переходных отсчётов, инженер плавно задаёт промежуточные значения АЧХ и снижает уровень боковых лепестков.", "benefit": "Уменьшает пульсации итогового фильтра без увеличения его порядка."}}, {"q": "Методом частотной выборки нужно обеспечить шаг сетки АЧХ не хуже Δf = 140 Гц при fs = 12000 Гц. Число отсчётов N = fs/Δf, округлённое вверх до целого. Чему равно минимальное N?", "options": ["N ≈ 140", "N ≈ 86", "N ≈ 85", "N ≈ 43"], "correct": 1, "explain": "Шаг 1: N = 12000/140 ≈ 85.71. Шаг 2: округляем вверх, так как более грубый шаг требованию не удовлетворяет — N = 86. Частые ошибки: округлить вниз до 85, перепутать формулу с fs/(2Δf) и получить 43, либо принять сам шаг Δf за число отсчётов (Proakis, гл. 10).", "usage": {"code": false, "without": "Без расчёта нужного числа отсчётов частотной сетки инженер берёт число наугад и получает шаг АЧХ грубее требуемого разрешения по частоте.", "with": "Рассчитав минимальное N из требуемого шага сетки, инженер сразу задаёт частотную характеристику с нужным разрешением.", "benefit": "Обеспечивает соответствие частотного разрешения синтеза требованиям задачи."}}, {"q": "Синтезируется равноволновый ФНЧ Паркса-Маклеллана линейной фазы типа I чётного порядка N = 48, длина фильтра N+1. Амплитудная характеристика — косинусный полином степени L = N/2. По теореме об альтернансе минимальное число экстремумов ошибки аппроксимации равно L+2. Чему оно равно?", "options": ["25 экстремумов", "27 экстремумов", "26 экстремумов", "24 экстремума"], "correct": 2, "explain": "Шаг 1: L = 48/2 = 24. Шаг 2: минимум экстремумов = L+2 = 26. Частые ошибки: остановиться на L=24, взять число степеней свободы L+1=25, либо перепутать минимум с максимально возможным числом экстремумов L+3=27 (Oppenheim, гл. 7).", "usage": {"code": false, "without": "Не зная теоретического минимума экстремумов, инженер не может проверить, действительно ли алгоритм Ремеза сошёлся к оптимальному равноволновому решению.", "with": "Зная формулу L+2, инженер проверяет число экстремумов итогового фильтра и убеждается в оптимальности синтеза.", "benefit": "Даёт объективный критерий проверки сходимости алгоритма Паркса-Маклеллана."}}, {"q": "Линейно-фазовый FIR-фильтр имеет длину N = 201 отсчёт при fs = 48000 Гц. Групповая задержка фильтра равна (N−1)/2 отсчётов. Шаг 1: найдите задержку в отсчётах. Шаг 2: переведите её в миллисекунды. Чему равна задержка?", "options": ["≈2.08 мс", "≈2083 мс", "≈4.17 мс", "≈2.09 мс"], "correct": 0, "explain": "Шаг 1: (201−1)/2 = 100 отсчётов. Шаг 2: 100/48000 с = 100/48 мс ≈ 2.08 мс. Частые ошибки: не поделить на 2 и взять все 200 отсчётов, использовать N/2=100.5 вместо (N−1)/2, либо ошибиться в переводе секунд в миллисекунды на три порядка (Proakis, гл. 10).", "usage": {"code": false, "without": "Без пересчёта задержки в миллисекунды инженер не может сопоставить фильтрацию сигнала энкодера с требованиями контура управления по времени реакции.", "with": "Переведя групповую задержку FIR-фильтра в миллисекунды, инженер закладывает её в бюджет времени контура управления роботом.", "benefit": "Позволяет учесть задержку фильтра при настройке регулятора без превышения допустимого времени реакции."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
