<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IS1: Искусственные нейронные сети</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>IS1: Искусственные нейронные сети</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../sync.js"></script>
<script>
(function () {
  const TEST_ID = "is1_neural_networks";
  const QUESTIONS = [{"q": "По общему определению Саймона Хайкина, в каких двух отношениях искусственная нейросеть напоминает мозг?", "options": ["Биологическая точность модели нейрона и параллельная передача импульсов", "Знание кодируется в структуре слоёв и извлекается по адресу ячейки памяти", "Знание приобретается из среды обучением и хранится в силах связей", "Скорость обработки сигналов и наличие центрального управляющего узла"], "correct": 2, "explain": "Хайкин называет ровно два сходства с мозгом: знание приобретается сетью из среды через процесс обучения, а хранится оно в силах межнейронных связей - синаптических весах. Центрального управляющего узла в определении нет: сеть описана как massively parallel distributed processor из простых единиц (Lecture_6, слайд 6).", "usage": {"code": false, "without": "Студент на вопросе Moodle про определение Хайкина выбирает «сходство в скорости и параллельности» и теряет балл.", "with": "Студент сразу вспоминает пару «обучение из среды + синаптические веса» и отвечает без раздумий.", "benefit": "Точное знание канонического определения ANN, которое проверяют первым."}}, {"q": "Какое событие таймлайна истории ANN в лекции датировано 1943 годом?", "options": ["Модель нервной клетки от Warren McCulloch и Walter Pitts", "Первый нейрокомпьютер Mark, построенный на перцептронах", "Идеи Donald Hebb о связях нейронов в мозге и их взаимодействии", "Принципы функционирования перцептрона от Rosenblatt"], "correct": 0, "explain": "Таймлайн лекции начинается с 1943 года: Warren McCulloch и Walter Pitts создали упрощённую модель нервной клетки - нейрона. Идеи Хебба относятся к 1949 году, принципы перцептрона Розенблатта - к 1958, нейрокомпьютер Mark - к 1960 (Lecture_6, слайды 14-18).", "usage": {"code": false, "without": "Студент приписывает модель нейрона Хеббу, а перцептрон Маккалоку и Питтсу, и ошибается в вопросе на сопоставление год-автор.", "with": "Студент восстанавливает цепочку 1943 McCulloch-Pitts, 1949 Hebb, 1958 Rosenblatt, 1960 Mark и отвечает верно.", "benefit": "Надёжная хронология раннего периода ANN для вопросов на даты и имена."}}, {"q": "Какое утверждение о событиях 1982-1988 годов соответствует таймлайну истории ANN в лекции?", "options": ["В 1982-1983 годах Hopfield предложил свёрточные NN для распознавания образов", "В 1988 году Yann LeCun опубликовал работы о коллективном взаимодействии нейронов", "В 1986 году Donald Hebb предложил идеи о связях нейронов в мозге и их взаимодействии", "В 1986 году Rumelhart предложил первый алгоритм обучения многослойных NN"], "correct": 3, "explain": "По таймлайну в 1986 году именно Rumelhart предложил первый алгоритм обучения многослойных NN. Работы Hopfield 1982-1983 годов посвящены коллективному взаимодействию нейронов, а не свёрточным сетям; свёрточные NN связаны с Yann LeCun и 1988 годом; идеи Хебба о связях нейронов датированы 1949 годом, а не 1986 (Lecture_6, слайды 19-21).", "usage": {"code": false, "without": "Студент приписывает первый алгоритм обучения многослойных сетей Хопфилду, свёрточные сети - Хопфилду, а Хебба переносит в 80-е, и путает роли трёх учёных.", "with": "Студент разводит Hopfield 1982-1983 (коллективное взаимодействие), Rumelhart 1986 (обучение многослойных NN) и LeCun 1988 (свёрточные NN) и уверенно выбирает верный вариант.", "benefit": "Чёткое знание второго периода истории ANN и авторов ключевых идей."}}, {"q": "Как в модели перцептрона на слайде взвешенная сумма Z с bias b сводится к единой сумме и как задаются веса до начала обучения?", "options": ["Сумма от i=1 до n при фиктивном входе x0=0, веса вначале все равны единице", "Сумма от i=0 до n при фиктивном входе x0=1, веса вначале генерируются случайно", "Сумма от i=0 до n при фиктивном входе x0=b, веса вначале все равны нулю", "Сумма от i=1 до n без фиктивного входа, веса вначале задаются равными 1/n"], "correct": 1, "explain": "На слайде записано Z = Σ от i=1 до n w_i x_i + b = Σ от i=0 до n w_i x_i: bias b становится весом w_0 при фиктивном входе x_0, который всегда равен 1. Подпись к весам гласит initially should be randomly generated, поэтому варианты с нулями, единицами и 1/n неверны, а вариант с x0=b путает вход и вес (Lecture_6, слайд 26; слайд 37).", "usage": {"code": false, "without": "Студент не понимает, откуда в формуле сумма от нуля, и считает, что веса перед обучением можно обнулить или выставить одинаковыми.", "with": "Студент видит в Σ от i=0 скрытый bias через x0=1 и помнит про случайную инициализацию весов.", "benefit": "Понимание записи перцептрона, на которой строятся все дальнейшие формулы обучения."}}, {"q": "Чему равны выход пороговой функции threshold при Z = 0 и выход функции ReLU при Z = -2 по формулам из лекции?", "options": ["threshold даёт 0, ReLU даёт 0", "threshold даёт 1, ReLU даёт -2", "threshold даёт 1, ReLU даёт 0", "threshold даёт 0, ReLU даёт -2"], "correct": 2, "explain": "Пороговая функция на слайде задана как y = 1 при Z ≥ 0 и y = 0 при Z < 0, поэтому при Z = 0 выход равен 1. ReLU задана как y = max(Z, 0), и при Z = -2 она возвращает 0, а не отрицательное число (Lecture_6, слайды 29-30).", "usage": {"code": false, "without": "Студент считает, что порог при Z = 0 даёт 0, и что ReLU пропускает отрицательные значения, и ошибается в двух вопросах подряд.", "with": "Студент помнит нестрогое неравенство Z ≥ 0 и формулу max(Z, 0) и считает выход мгновенно.", "benefit": "Безошибочный расчёт простейших активаций в тестовых задачах."}}, {"q": "В каких диапазонах лежат значения логистической и тангенциальной функций активации, и за что отвечает параметр α в логистической функции?", "options": ["Логистическая от 0 до 1, тангенциальная от -1 до 1, α задаёт крутизну кривой", "Логистическая от -1 до 1, тангенциальная от 0 до 1, α задаёт скорость обучения", "Логистическая от 0 до 1, тангенциальная от 0 до 1, α задаёт сдвиг кривой по оси Z", "Логистическая от 0 до 1, тангенциальная от -1 до 1, α задаёт learning rate"], "correct": 0, "explain": "На слайде 32 логистическая функция y = 1/(1+exp(-αZ)) принадлежит интервалу (0; 1), а рядом показан график threshold function при разных α от 0.01 до 1: чем больше α, тем круче кривая, то есть α задаёт крутизну. На слайде 33 тангенциальная функция y = (1-exp(-2Z))/(1+exp(-2Z)) принадлежит интервалу (-1; 1). Той же буквой α на слайдах 78-79 обозначен learning rate в формуле ΔW = -α(y-t)f'x, но это другой параметр: внутри формулы логистической функции α - множитель при Z, а не скорость обучения (Lecture_6, слайды 32-33).", "usage": {"code": false, "without": "Студент путает диапазоны сигмоиды и tanh и принимает α в формуле за скорость обучения.", "with": "Студент сразу называет (0;1) и (-1;1) и объясняет, что α управляет крутизной сигмоиды.", "benefit": "Правильный выбор функции активации под тип целевой переменной."}}, {"q": "Чему всегда равен вход фиктивного признака 0 в однослойной ANN на слайде и какую роль он выполняет?", "options": ["Равен 1 и нормализует вектор входов так, чтобы модуль вектора X был равен 1", "Равен 0 и обнуляет вклад смещения в каждом из k выходных нейронов", "Равен среднему значению признаков и центрирует входные данные", "Равен 1 и через веса w01..w0k задаёт bias каждого выходного нейрона"], "correct": 3, "explain": "На схеме однослойной сети подписано input value of fictive feature 0 (always is 1): вход X0 всегда равен 1, а его веса w01..w0k идут к каждому из k выходов; в матрице X на слайде 38 это первый столбец из единиц, а в W - первая строка w01..w0k. Что эти веса и есть bias, видно из формулы перцептрона на слайде 34: Z = Σ w_i x_i + b записана как Σ от i=0 до n w_i x_i, то есть b = w0·x0 при x0 = 1. К нормализации входов X0 отношения не имеет (Lecture_6, слайды 34, 37-38).", "usage": {"code": false, "without": "Студент не понимает, зачем в матрице X первый столбец из единиц, и считает X0 нормировочным членом.", "with": "Студент объясняет, что столбец единиц даёт bias через w0 и позволяет записать Z = X·W одной матричной операцией.", "benefit": "Понимание матричной записи сети, нужное для вопросов про X, W и Z."}}, {"q": "Как называется вторая фаза работы нейросети, следующая за фазой обучения, и какие три вида обучения относятся к первой фазе?", "options": ["Backpropagation phase; supervised, unsupervised и reinforcement learning", "Evaluation phase или recall; supervised, unsupervised и reinforcement learning", "Evaluation phase или recall; supervised, competitive и transfer learning", "Backpropagation phase; supervised, competitive и transfer learning"], "correct": 1, "explain": "Слайд выделяет две фазы работы NN: learning (training) phase - адаптация внутренних параметров с тремя видами обучения supervised, unsupervised и reinforcement - и evaluation phase (recall), то есть использование выученного. Backpropagation - это алгоритм внутри фазы обучения, а не отдельная фаза; competitive learning упоминается позже только как механизм SOM, а не как один из трёх видов (Lecture_6, слайд 74).", "usage": {"code": false, "without": "Студент называет второй фазой backpropagation и не может перечислить три вида обучения.", "with": "Студент разделяет training и recall и перечисляет supervised, unsupervised, reinforcement.", "benefit": "Базовая терминология фаз и видов обучения для всех последующих тем."}}, {"q": "Как записывается функция потерь J(W) при обучении нейросети и по какой переменной ведётся её минимизация?", "options": ["J равна сумме квадратов разностей y_j и t_j по j от 1 до m, минимизация по выходам Y", "J равна сумме модулей разностей x_j и t_j по j от 1 до m, минимизация по весам W", "J равна сумме квадратов разностей y_j и t_j по j от 1 до m, минимизация по весам W", "J равна сумме модулей разностей y_j и t_j по j от 1 до m, минимизация по входам X"], "correct": 2, "explain": "На слайдах J(W) = Σ от j=1 до m (y_j - t_j)², где y - выход сети, а t - target из обучающей выборки; цель обучения - найти комбинацию весов, при которой min по W J(W) → 0. Подстраиваются именно веса: входы X и целевые t заданы выборкой, а выходы Y лишь следствие весов; суммируются квадраты, а не модули (Lecture_6, слайды 76-78).", "usage": {"code": false, "without": "Студент пишет в J модули вместо квадратов и думает, что подстраиваются входы или выходы, а не веса.", "with": "Студент записывает сумму квадратов ошибок и объясняет, почему обучение - это оптимизация по W.", "benefit": "Понимание цели обучения как задачи минимизации по весам."}}, {"q": "Пять алгоритмов обучения ANN сравнивают по требуемой памяти и скорости. Какой из них требует меньше всего памяти и самый медленный, а какой требует больше всего памяти и самый быстрый?", "options": ["Gradient descent и Levenberg-Marquardt", "Conjugate gradient и Quasi-Newton method", "Gradient descent и Quasi-Newton method", "Conjugate gradient и Levenberg-Marquardt"], "correct": 0, "explain": "На диаграмме Training Algorithms Comparison пять алгоритмов выстроены по диагонали от левого нижнего угла к правому верхнему: gradient descent требует минимум памяти и самый медленный, далее идут conjugate gradient, Newton's method и quasi-Newton, а Levenberg-Marquardt требует больше всего памяти и самый быстрый. Conjugate gradient и quasi-Newton занимают промежуточные позиции и крайними быть не могут (Lecture_6, слайды 90-91).", "usage": {"code": false, "without": "Студент не может расставить пять алгоритмов обучения по памяти и скорости и путает крайние позиции.", "with": "Студент называет пять алгоритмов и объясняет, что Levenberg-Marquardt самый быстрый, но самый прожорливый по памяти, а gradient descent - наоборот.", "benefit": "Осознанный выбор алгоритма обучения под ограничения памяти и времени."}}, {"q": "Перцептрон с двумя входами вычисляет Z = w0 + x1·w1 + x2·w2 и выдаёт y = 1 при Z ≥ 0, иначе 0. Какое геометрическое место точек на плоскости x1, x2 задаёт условие Z = 0 и как относительно него лежат классы X с d=1 и O с d=0?", "options": ["Парабола x2 = w0 + w1·x1², класс X с d=1 выше её ветвей, класс O под ними", "Прямая x2 = b + k·x1, класс X лежит там, где Z > 0, класс O там, где Z < 0", "Окружность с центром в точке w1, w2, класс X внутри неё, класс O снаружи", "Прямая x2 = b + k·x1, но её наклон задаётся активационной функцией, а не весами"], "correct": 1, "explain": "Приравняв Z к нулю и выразив x2, получаем x2 = b + k·x1 - уравнение прямой, наклон и сдвиг которой определяются только весами; для точек класса X сумма Z положительна, для O отрицательна, поэтому перцептрон - линейная модель: прямая, плоскость или гиперплоскость при n входах. Активационная функция лишь переводит знак Z в 0/1 и на положение границы не влияет. (Lecture_6, слайд 27)", "usage": {"code": false, "without": "Студент пытается обучить одиночный перцептрон на данных, где один класс окружён другим, и часами крутит скорость обучения, не понимая, почему ошибка не падает.", "with": "Зная, что граница перцептрона - всегда прямая или гиперплоскость, он сразу проверяет линейную разделимость данных и при её отсутствии переходит к многослойной сети.", "benefit": "Экономит часы настройки заведомо непригодной модели."}}, {"q": "Лекция связывает диапазон желаемого значения d с выбором активационной функции перцептрона. Какое соответствие она даёт для бинарного d = 0 или 1, биполярного d = -1 или 1 и вещественного d из всей числовой оси?", "options": ["Для 0 или 1 - пороговая или логистическая, для -1 или 1 - ReLU, для вещественного - гиперболический тангенс", "Для 0 или 1 - гиперболический тангенс, для -1 или 1 - логистическая, для вещественного - линейная", "Для 0 или 1 - пороговая или логистическая, для -1 или 1 - гиперболический тангенс, для вещественного - линейная", "Для 0 или 1 - линейная, для -1 или 1 - пороговая или логистическая, для вещественного - гиперболический тангенс"], "correct": 2, "explain": "Диапазон выхода функции должен совпадать с диапазоном целевой переменной: пороговая и логистическая дают значения в 0..1, гиперболический тангенс - в -1..1, линейная y = Z не ограничена и подходит для вещественного d. Гиперболический тангенс для d = 0 или 1 и логистическая для вещественных значений не покрывают нужный диапазон, а ReLU для биполярной цели вообще не выдаёт отрицательных значений. (Lecture_6, слайд 34)", "usage": {"code": false, "without": "Для регрессии цены дома ставят сигмоиду на выходе и удивляются, что сеть никогда не выдаёт значения больше единицы.", "with": "Сразу выбирают линейный выход для вещественной цели и гиперболический тангенс, если метки закодированы как -1 и 1.", "benefit": "Правильный диапазон выхода с первой попытки, без переделки архитектуры."}}, {"q": "В матричной записи двухслойной ANN X - матрица обучающей выборки размера N×(n+1) с единичным первым столбцом, W1 и W2 - матрицы весов первого и второго слоя, f - активационная функция, Z2 - взвешенная сумма второго слоя. Как лекция записывает Z2?", "options": ["Z2 = Y1·W2, где Y1 = f от X·W1, активированный выход первого слоя умножается на W2", "Z2 = Y1 + W2, где Y1 = f от X·W1, выход первого слоя складывается с весами второго", "Z2 = X·W1·W2, активация f применяется один раз к итоговому выходу Y сети, а не между слоями", "Z2 = W2·Y1, где Y1 = f от W1·X, матрица весов каждого слоя стоит слева от данных"], "correct": 0, "explain": "Сначала Z(1) = X·W(1), затем к нему применяется f, и уже активированный выход скрытого слоя умножается справа на W(2): Z(2) = f(X·W(1))·W(2), Y = f(Z(2)). Вариант X·W1·W2 пропускает нелинейность и сводит два слоя к одному линейному, а порядок W·X не согласуется с размерностями X размера N×(n+1) и W(1) размера (n+1)×k. (Lecture_6, слайд 41)", "usage": {"code": false, "without": "Пишут прямой проход как перемножение всех матриц весов подряд и получают сеть, которая не может выучить XOR, что бы ни делали.", "with": "Реализуют слой как f(X·W) и передают результат следующему слою, получая настоящую нелинейную модель.", "benefit": "Корректный прямой проход и совпадающие размерности матриц без отладки."}}, {"q": "Лекция ставит вопрос 'why MULTILAYER NN?' и даёт на него два ответа. Какие две причины перехода от однослойной к многослойной сети она называет?", "options": ["Ускорение обучения благодаря параллельным слоям и снижение общего числа весов в сети", "Классификация ровно двух линейно разделимых классов и кластеризация данных без учителя", "Уменьшение переобучения за счёт добавления скрытых слоёв и регрессия, например цена дома по 4 признакам", "Классификация при более чем 2 классах или линейно неразделимых классах и регрессия, например цена дома"], "correct": 3, "explain": "Answer N1 - задача классификации, когда классов больше двух или они не разделимы одной прямой и нужны скрытые слои для нелинейной границы; Answer N2 - регрессионная сеть, например цена дома по признакам Area, Bedrooms, Distance to city, Age. Скрытые слои не уменьшают число весов и не защищают от переобучения - наоборот, добавляют параметры. (Lecture_6, слайды 44-56)", "usage": {"code": false, "without": "На вопрос преподавателя, зачем нужны скрытые слои, отвечают 'чтобы быстрее обучалось' и теряют балл.", "with": "Называют две причины из лекции: более 2 классов или нелинейная граница и регрессия вещественной величины.", "benefit": "Уверенное обоснование выбора архитектуры на экзамене и в проекте."}}, {"q": "Для задачи классификации на три класса лекция показывает две схемы кодирования выходного слоя. Сколько выходных нейронов и какие коды классов d использует каждая из них?", "options": ["Два нейрона с кодами 10, 01, 11 или три нейрона с кодами 001, 011, 111, где активно от одного до трёх нейронов", "Два нейрона с кодами 11, 01, 00 или три нейрона с кодами 100, 010, 001, где активен один нейрон", "Три нейрона с кодами 110, 011, 101 или четыре нейрона с кодами 1000, 0100, 0010, где активен один нейрон", "Один нейрон с кодами 0, 1, 2 или два нейрона с кодами 11, 10, 01, где активен хотя бы один нейрон"], "correct": 1, "explain": "Первая схема: два выхода Y1, Y2 из {0,1} дают до 4 комбинаций, и трём классам присвоены коды 11, 01, 00; вторая: три выхода и правило 'active only one of neurons' - коды 100, 010, 001. Схемы с двумя активными нейронами, с четырьмя выходами для трёх классов или с одним нейроном, выдающим 0, 1, 2, в лекции не рассматриваются. (Lecture_6, слайды 47-48)", "usage": {"code": false, "without": "Для 5 классов ставят один выходной нейрон и пытаются обучить его выдавать 0, 1, 2, 3, 4 - сеть путает соседние классы.", "with": "Кодируют классы двоичным кодом на 3 выходах или one-hot на 5 выходах, как показано в лекции для трёх классов.", "benefit": "Выходной слой, размер которого обоснован числом классов."}}, {"q": "В методе градиентного спуска для однослойной ANN с функцией потерь J(W) = Σ_j (f(Σ_i w_i·x_ij) - t_j)² веса обновляются по правилу W = W + ΔW. Обозначим ошибку выхода e = y - t, производную активации f', вход x. Чему по лекции равно ΔW?", "options": ["ΔW = α·e·x, знак шага положительный и производная активации f' в формуле не нужна", "ΔW = -α·J, шаг пропорционален самому значению функции потерь J на итерации", "ΔW = -α·e·f'·x, шаг пропорционален ошибке, производной активации и входу", "ΔW = -α·e, шаг зависит только от ошибки выхода и скорости обучения, без f' и входа x"], "correct": 2, "explain": "Производная dJ/dW = -2α(y - t)·f'·x, и лекция задаёт ΔW = -α(y - t)·f'·x: веса меняются на величину, пропорциональную градиенту, с минусом, чтобы скользить вниз по поверхности ошибки. Без f' и без x это уже не градиент, а шаг -α·J вообще не несёт направления. (Lecture_6, слайд 78)", "usage": {"code": false, "without": "Реализуют обновление весов как 'вес плюс ошибка' и наблюдают, как loss растёт с каждой эпохой.", "with": "Считают ΔW = -α(y - t)f'x, и loss монотонно снижается до приемлемого уровня.", "benefit": "Обучение сходится, а не расходится."}}, {"q": "Почему для градиентного обучения нельзя взять ступенчатую функцию step или знаковую sign в качестве активации и как производная сигмоиды выражается через её собственное значение y?", "options": ["У step и sign нет производной, которая нужна правилу обновления, а производная сигмоиды равна произведению y и 1 - y", "У step и sign выход принимает только два значения, а правилу нужен непрерывный выход, производная сигмоиды равна квадрату y", "У step и sign выход не ограничен сверху, а правилу нужен ограниченный выход, производная сигмоиды равна сумме 1 + y", "У step и sign производная везде равна единице, поэтому шаг никак не масштабируется, а производная сигмоиды равна разности 1 - y"], "correct": 0, "explain": "Правила обновления весов содержат множитель g' - производную активации, а у ступенчатой и знаковой функций полезной производной нет: она равна нулю везде, кроме точки разрыва, и градиент обнуляется; поэтому backprop-сети используют сигмоиду, у которой y' = y(1 - y) и производная считается почти бесплатно из уже вычисленного выхода. Производная step не равна единице, а дискретность или ограниченность выхода сами по себе не причина. (AIMA гл. 19, стр. 583; Lecture_6, слайд 79)", "usage": {"code": false, "without": "Ставят пороговую активацию в скрытый слой, и все градиенты обнуляются - сеть не учится, а причина неясна.", "with": "Берут сигмоиду и переиспользуют выход y для производной y(1 - y), экономя вычисления.", "benefit": "Рабочий backprop и дешёвый расчёт производной."}}, {"q": "В лекции рассмотрено градиентное обучение с моментом momentum. Чем в нём формула изменения весов ΔW(n) отличается от обычного градиентного шага -α·(y - t)·f'·x и что обозначает n?", "options": ["Добавляется предыдущее значение самого веса W с итерации n-1, а n - номер нейрона в слое", "Умножается на изменение веса ΔW с прошлой итерации n-1, а n - номер итерации обучения", "Уменьшается скорость обучения α на каждом шаге в n раз, а n - номер обучающего примера", "Добавляется изменение веса ΔW с прошлой итерации n-1, а n - номер итерации обучения"], "correct": 3, "explain": "Момент - это дополнительное слагаемое ΔW(n-1): изменение весов на предыдущей итерации прибавляется к текущему градиентному шагу, ΔW(n) = -α(y - t)f'x + ΔW(n-1), а W(n) = W(n) + ΔW(n); n на слайде подписан как number of training iteration. Прибавление самого веса W(n-1), умножение на прошлое ΔW или деление α на n в формуле не фигурируют. (Lecture_6, слайд 80)", "usage": {"code": false, "without": "Градиентный спуск застревает в пологой ложбине поверхности ошибки, и студент просто увеличивает α, получая расходимость.", "with": "Добавляет к шагу прошлое ΔW(n-1), и накопленная инерция проводит веса через плато.", "benefit": "Быстрее сходимость без риска разгонять α."}}, {"q": "При обратном распространении ошибки в двухслойной ANN уже известны ошибки δ_i выходных нейронов и веса второго слоя w_ji от скрытого нейрона j к выходу i. Как вычисляется ошибка δ_in_j скрытого нейрона j?", "options": ["Как разность y_j - t_j, которую считают ещё до прямого прохода по целевому значению t_j", "Как сумма δ_i·w_ji по всем выходам i, то есть ошибки выходов, взвешенные весами связей", "Как среднее арифметическое ошибок δ_i всех выходных нейронов без учёта весов связей с ними", "Как ошибка δ_i того выходного нейрона, с которым нейрон j связан наибольшим весом w_ji"], "correct": 1, "explain": "Шаг 4 лекции: δ_in_j = Σ_{i=1..k} δ_i(2)·w_ji(2), затем δ(1) = δ_in·f'(XW(1)) и ΔW(1) = α·δ(1)·x; по AIMA 'вина' за ошибку делится между скрытыми узлами пропорционально силе их связи с выходом. Среднее без весов или ошибка одного самого сильного выхода теряют вклад остальных связей, а до прямого прохода ошибок ещё нет. (Lecture_6, слайд 86; AIMA гл. 19, стр. 580)", "usage": {"code": false, "without": "Пишут backprop, передавая в скрытый слой одну и ту же ошибку выхода всем нейронам, и сеть не учится ничему сложнее линейной границы.", "with": "Считают взвешенную сумму δ выходов по весам связей, и каждый скрытый нейрон получает свою долю вины.", "benefit": "Корректные градиенты для скрытого слоя."}}, {"q": "Среди методов обучения ANN, рассмотренных в лекции, какой строит приближение обратной матрицы Гессе по одним лишь первым производным loss, а какой создан специально для loss в виде суммы квадратов ошибок и работает с матрицей Якоби?", "options": ["Первое - Levenberg-Marquardt по формулам DFP и BFGS, второе - quasi-Newton через Якобиан", "Первое - Newton по формулам DFP и BFGS, второе - conjugate gradient через Якобиан", "Первое - quasi-Newton по формулам DFP и BFGS, второе - Levenberg-Marquardt через Якобиан", "Первое - conjugate gradient по формулам DFP и BFGS, второе - Newton через Якобиан"], "correct": 2, "explain": "Quasi-Newton, он же variable metric, заменяет вычисление и обращение Гессиана матрицей G, построенной только по первым производным по формулам DFP или BFGS; Levenberg-Marquardt, он же damped least-squares, создан для loss в виде суммы квадратов ошибок и вместо точного Гессиана работает с градиентом и матрицей Якоби, приближая Гессиан как 2·JᵀJ и демпфируя шаг слагаемым λI. Newton использует точный Гессиан, а conjugate gradient ищет по сопряжённым направлениям и Якобиан не строит. (Lecture_6, слайды 92-95)", "usage": {"code": false, "without": "Выбирают Newton для сети с миллионом весов и ждут, пока обратится Гессиан размером миллион на миллион.", "with": "Берут quasi-Newton BFGS, а для MSE-регрессии небольшой сети - Levenberg-Marquardt.", "benefit": "Метод второго порядка, который реально досчитывается."}}, {"q": "Четыре компактных кластера точек на плоскости признаков x1, x2 нужно разделить сетью, метки кодируются one-hot, то есть в ответе активен ровно один нейрон. Сколько выходных нейронов нужно сети по правилу лекции?", "options": ["Восемь выходных нейронов, по два на каждый класс", "Один выходной нейрон, выдающий номер кластера от 1 до 4", "Два выходных нейрона, дающих до четырёх комбинаций 0 и 1", "Четыре выходных нейрона, по одному на каждый класс"], "correct": 3, "explain": "По слайду 48 при one-hot кодировании каждому классу отвечает свой выходной нейрон и активен только один из них, поэтому для четырёх кластеров нужны четыре выхода, как в архитектуре D в Quiz 2. Два выхода дают четыре комбинации 0 и 1, но это двоичный код со слайда 47, а не one-hot. (Lecture_6, слайды 48, 60)", "usage": {"code": false, "without": "Студент ставит два выхода, потому что 2 в квадрате равно 4, и получает сеть, где класс приходится расшифровывать по паре битов, а one-hot метки с ней не сходятся.", "with": "Он сразу ставит по нейрону на класс, кодирует метки как 1000, 0100, 0010, 0001 и читает ответ по единственному активному нейрону.", "benefit": "Число выходов выбирается за секунду и совпадает с кодировкой меток."}}, {"q": "Регрессионная сеть предсказывает изменение курса валюты за день, ответ может быть как положительным, так и отрицательным. Какую функцию активации выходного узла выбрать по лекции?", "options": ["Сигмоида, так как её выход может быть отрицательным", "Линейная функция, так как её диапазон не ограничен по знаку", "Пороговая функция, так как она выдаёт любое вещественное число", "ReLU, так как её диапазон от минус до плюс бесконечности"], "correct": 1, "explain": "На слайде 64 линейная функция f(z) = az имеет диапазон от минус до плюс бесконечности и даёт 'a numerical value which we require', это ответ D в Quiz 3. ReLU ограничена диапазоном от 0 до плюс бесконечности и обнулит отрицательные изменения курса, а сигмоида даёт значения только в (0; 1). (Lecture_6, слайды 64, 66)", "usage": {"code": false, "without": "Сеть с ReLU на выходе предсказывает падение курса как ноль, и трейдер видит 'нет изменений' там, где был минус.", "with": "Выходной нейрон линейный, сеть выдаёт и минус 0.8, и плюс 1.3, и прогноз сравнивается с фактом без искажений.", "benefit": "Знак и масштаб прогноза не теряются на выходе сети."}}, {"q": "Сеть для классификации обучается на метках, где желаемое значение bivariate, то есть d равно минус 1 или 1. Какую функцию активации выходного узла выбрать по лекции?", "options": ["Пороговая функция, потому что она выдаёт ровно два значения 0 и 1", "Сигмоида, потому что её диапазон от 0 до 1 покрывает оба класса", "Гиперболический тангенс, потому что его диапазон от минус 1 до 1", "ReLU, потому что её диапазон от 0 до бесконечности шире нужного"], "correct": 2, "explain": "По слайду 34 для bivariate желаемого значения d = -1 или 1 выбирается tangent function со слайда 33, то есть гиперболический тангенс tanh с диапазоном от -1 до 1; это ответ C в Quiz 4. Сигмоида даёт только значения от 0 до 1, поэтому для класса -1 выход никогда не дойдёт до цели и квадрат ошибки останется не меньше 1; пороговая функция и ReLU тоже не выдают отрицательных значений. (Lecture_6, слайды 33, 34, 67)", "usage": {"code": false, "without": "Инженер ставит сигмоиду на метки -1 и 1, ошибка по классу -1 не опускается ниже единицы, и он ищет баг в данных.", "with": "Он выбирает гиперболический тангенс, выход достигает и -1, и 1, и ошибка на обоих классах уходит к нулю.", "benefit": "Диапазон выхода совпадает с диапазоном меток с первого запуска."}}, {"q": "На вход сети подаются категориальный признак 'тип клиента' с тремя значениями и цветное изображение 10 на 10 пикселей. Как по лекции закодировать эти входы?", "options": ["Категорию превратить в dummy-переменные 1 и минус 1, а пиксель в три значения R, G, B", "Категорию записать числами 1, 2, 3, а каждый пиксель одним числом яркости от 0 до 255", "Категорию превратить в dummy-переменные 1 и 0, а всё изображение в один усреднённый цвет", "Категорию записать одним числом от 0 до 1, а каждый пиксель парой значений 1 и минус 1"], "correct": 0, "explain": "Слайд 69: номинальные признаки переводятся в dummy-переменные 0/1, причём 0 обычно заменяют на -1, а у цветной картинки каждый пиксель задаётся тремя значениями R, G, B, то есть 10·10·3 = 300 входов. Запись категории числами 1, 2, 3 и сжатие пикселя до одного числа лекция не предусматривает; значения 1 и -1 на пиксель это кодировка монохромного изображения. (Lecture_6, слайд 69)", "usage": {"code": false, "without": "Аналитик подаёт 'тип клиента' как 1, 2, 3 и цветную картинку как 100 чисел яркости, сеть путает классы и теряет цвет.", "with": "Он раскладывает категорию на dummy-входы 1 и -1 и подаёт 300 значений R, G, B, входной слой сразу нужного размера.", "benefit": "Входной слой проектируется без переделок после первого запуска."}}, {"q": "Два класса точек на плоскости расположены так, что ни одна прямая не отделяет один класс от другого, как в таблице истинности XOR. Что по AIMA и лекции нужно изменить в однослойном перцептроне, чтобы он решил задачу?", "options": ["Добавить смещение X0 к единственному выходному нейрону", "Увеличить скорость обучения α и число эпох обучения вдвое", "Заменить пороговую функцию одного нейрона на сигмоиду", "Добавить скрытый слой нейронов между входами и выходом"], "correct": 3, "explain": "AIMA: перцептрон представляет функцию только если существует прямая, отделяющая точки с выходом 1 от точек с 0, поэтому AND и OR представимы, а XOR нет. По слайдам 49-52 для классов, которые 'not lineary devided', нужна многослойная сеть со скрытым слоем. Смещение X0 у перцептрона уже есть, а замена активации или рост α не меняют линейную границу. (AIMA гл. 19, стр. 574-575; Lecture_6, слайд 52)", "usage": {"code": false, "without": "Разработчик неделю крутит learning rate однослойного перцептрона на данных типа XOR, а точность застревает около 50%.", "with": "Он видит, что классы не разделяются прямой, добавляет скрытый слой и получает изогнутую границу.", "benefit": "Архитектура выбирается по форме данных, а не подбором наугад."}}, {"q": "Выходной слой сети для 5 классов задан функцией softmax, метки заданы one-hot векторами. Какую функцию потерь выбрать по лекции и чему равна её производная по y_in_j?", "options": ["Squared Loss L2, производная равна минус разности y_j и ŷ_j, умноженной на ŷ_j'", "Cross-entropy loss, производная равна softmax от y_in_j минус метка y_j", "Cross-entropy loss, производная равна произведению ŷ_j на y_j со знаком минус", "Hinge loss, производная равна разности ŷ_j и y_j, делённой на число классов K"], "correct": 1, "explain": "Слайд 83: если выход задан softmax, а y - one-hot вектор ожидаемых ответов, то используется cross-entropy loss L = -Σ y_j log ŷ_j, и её производная по y_in_j равна softmax(y_in_j) - y_j. Squared Loss L2 со слайда 82 предназначена для выхода с ReLU или линейной функцией, то есть для регрессии, произведение ŷ_j на y_j производной не является, а hinge loss в лекции не рассматривается. (Lecture_6, слайды 82, 83)", "usage": {"code": false, "without": "Инженер ставит L2 на softmax-выход и вручную выводит громоздкий градиент, ошибаясь в знаках.", "with": "Он берёт cross-entropy и в backprop подставляет готовую разность softmax минус y_j.", "benefit": "Градиент выходного слоя записывается одной строкой без ошибок."}}, {"q": "Инженер обучает сеть ровно 100 эпох и жалуется, что точность недостаточна. Какой критерий остановки обучения порекомендовать по лекции?", "options": ["Остановиться, когда ошибка на обучающей выборке станет строго нулевой", "Остановиться, когда learning rate α за эпоху уменьшится до нуля", "Остановиться, когда RMSE на тестовой выборке станет меньше порога γ", "Увеличить число эпох до 1000 и остановиться строго по счётчику эпох"], "correct": 2, "explain": "Слайд 87: остановка по числу эпох легко реализуется, но точное число нужных эпох неизвестно; остановка по RMSE < γ так же проста и гарантирует обучение до нужной точности, минусов у неё лекция не называет. В блок-схемах слайдов 79 и 86 RMSE считается на тестовой выборке после прохода по всем обучающим парам. (Lecture_6, слайды 79, 86, 87)", "usage": {"code": false, "without": "Инженер наугад ставит 100, потом 500 эпох и каждый раз получает то недоученную, то переученную сеть.", "with": "Он задаёт порог γ, сеть учится, пока RMSE на тестовой выборке не упадёт ниже него, и останавливается сама.", "benefit": "Обучение заканчивается ровно при достижении нужной точности."}}, {"q": "Сеть 1-20-1 аппроксимирует гладкую зависимость по 30 зашумлённым точкам и выдаёт изломанную кривую, повторяющую шум. Что изменить по рекомендации лекции, не прибегая к early stopping?", "options": ["Уменьшить число скрытых нейронов до минимально достаточного", "Добавить второй скрытый слой из 20 нейронов для гладкости", "Увеличить learning rate α, чтобы веса скорее дали плавную кривую", "Убрать смещение X0, чтобы сеть не подстраивалась под шум"], "correct": 0, "explain": "Слайд 88: сеть 1-20-1 на зашумлённой синусоиде запоминает шум, поэтому лекция советует использовать сеть 'just large enough to provide an adequate fit': достаточно малая сеть не имеет мощности для переобучения. Второй скрытый слой только увеличивает сложность создаваемых функций и усиливает проблему; early stopping это отдельный, второй способ борьбы с overfitting. (Lecture_6, слайд 88; AIMA гл. 19, стр. 572)", "usage": {"code": false, "without": "Аналитик добавляет слои, и кривая ещё точнее повторяет выбросы, а на новых точках ошибка растёт.", "with": "Он сокращает скрытый слой до нескольких нейронов, кривая сглаживается и на новых данных ошибка падает.", "benefit": "Переобучение убирается изменением одного числа в архитектуре."}}, {"q": "При обучении с early stopping ошибка на training падает каждую эпоху, ошибка на validation падает до 40-й эпохи и растёт начиная с 41-й; порог остановки равен 5 итерациям роста. На какой эпохе остановиться и какие веса вернуть?", "options": ["Остановиться на 41-й эпохе и вернуть веса 41-й эпохи", "Остановиться на последней эпохе и вернуть веса с минимумом train", "Остановиться на 45-й эпохе и вернуть веса 45-й эпохи", "Остановиться на 45-й эпохе и вернуть веса 40-й эпохи"], "correct": 3, "explain": "Слайд 89: обучение останавливается, когда validation error растёт заданное число итераций, и возвращаются веса и смещения, соответствующие минимуму validation error. Рост с 41-й по 45-ю эпоху это пять итераций, поэтому остановка на 45-й, а минимум validation был на 40-й, и возвращаются её веса; веса последней эпохи уже переобучены. (Lecture_6, слайд 89)", "usage": {"code": false, "without": "Скрипт сохраняет веса последней эпохи, и в продакшн уходит сеть, которая пять эпох подряд ухудшалась на validation.", "with": "Скрипт хранит лучшие по validation веса и после пяти эпох роста ошибки откатывается к ним.", "benefit": "В продакшн попадает сеть с минимальной ошибкой на новых данных."}}, {"q": "Небольшая регрессионная сеть обучается с функцией потерь в виде суммы квадратов ошибок; требуется максимальная скорость сходимости, память не ограничена. Какой алгоритм обучения выбрать по лекции?", "options": ["Newton's method, так как он обходится без вычисления матрицы Гессе", "Levenberg-Marquardt, так как он быстрее всех и создан для суммы квадратов", "Conjugate gradient, так как он обгоняет по скорости и Newton, и quasi-Newton", "Gradient descent, так как он быстрее всех и требует меньше всего памяти"], "correct": 1, "explain": "Слайд 95: Levenberg-Marquardt создан для функций потерь в виде суммы квадратов ошибок и работает с градиентом и Якобианом, не вычисляя точный Гессиан; на диаграмме слайда 91 он самый быстрый и самый требовательный к памяти. Gradient descent стоит в противоположном углу диаграммы, а Newton как раз требует вычисления и обращения Гессиана. Conjugate gradient на диаграмме медленнее и Newton, и quasi-Newton. (Lecture_6, слайды 91, 92, 94, 95)", "usage": {"code": false, "without": "Инженер учит маленькую регрессионную сеть градиентным спуском часами, хотя память сервера пустует.", "with": "Он выбирает Levenberg-Marquardt для задачи с суммой квадратов и получает сходимость за минуты.", "benefit": "Алгоритм обучения подбирается под ресурсы и вид loss, а не по привычке."}}, {"q": "NETtalk после 50 проходов по 1024-словному тексту даёт 95% точности на обучающих данных и 78% на тестовых. Что демонстрирует этот разрыв и почему даже на обучающем тексте нет 100%?", "options": ["Разрыв показывает слабое обобщение; 100% нет, так как ограниченное окно не различает слова вроде lead с контекстным произношением", "Разрыв показывает недостаток эпох; 100% нет, так как 50 проходов слишком мало для 80 скрытых единиц и нужно не менее 500 проходов", "Разрыв показывает шум в разметке; 100% нет, так как 29 входных единиц соответствуют лишь 29 словам из 1024 в обучающем тексте", "Разрыв показывает сбой speech generator; 100% нет, так как для второй буквы двухбуквенного звука сеть обязана выдать фонему дважды"], "correct": 0, "explain": "AIMA: на тестовых данных точность NETtalk падает до 78% - 'somewhat disappointing' generalization performance, хотя речь остаётся intelligible; на train 100% недостижимо, потому что программа, смотрящая только на ограниченное окно из 7 символов, ошибается на словах вроде lead, которые читаются по-разному в зависимости от контекста. 29 входных единиц кодируют один символ - 26 букв плюс пробел, точка и пунктуация, а не 29 слов; для второй буквы одного звука верный выход - ничего. (AIMA гл. 19, стр. 585)", "usage": {"code": false, "without": "Студент видит 95% на train, обещает заказчику 95% в проде и не понимает, откуда взялись 78%.", "with": "Он отчитывается по тестовой точности, а разрыв объясняет ограниченным окном контекста и предлагает его расширить.", "benefit": "Обещанная точность совпадает с той, что увидит пользователь."}}, {"q": "Сеть 10-200-1 обучили на 500 примерах: RMSE на обучающем множестве упал до 0.01, а на 100 новых примерах RMSE = 0.9. Какой диагноз ставит лекция и какие два средства она предлагает?", "options": ["Затухание градиента: 200 скрытых нейронов слишком много для sigmoid, нужно заменить её на ReLU и заново инициализировать веса", "Недообучение: сеть слишком мала для задачи, нужно добавить второй скрытый слой на 200 нейронов и удвоить число эпох обучения", "Взрыв градиента из-за большого learning rate: нужно уменьшить шаг в десять раз и убрать validation set, чтобы больше данных шло на обучение", "Переобучение: сеть запомнила примеры вместо обобщения, нужна сеть just large enough и early stopping по validation-подмножеству"], "correct": 3, "explain": "Малая ошибка на train при большой ошибке на новых данных - это определение overfitting из лекции: сеть запомнила обучающие примеры, а не научилась обобщать; средства - сеть 'just large enough to provide an adequate fit' и early stopping с разбиением данных на training и validation subsets. Недообучение выглядело бы как большая ошибка уже на обучающем множестве, а увеличение сети лишь усилит переобучение. (Lecture_6, слайды 88-89)", "usage": {"code": false, "without": "Инженер видит RMSE 0.01 на train, считает модель готовой, выкатывает её и получает жалобы: на реальных данных прогноз никуда не годится.", "with": "Он сравнивает ошибку на train и на отложенных данных, ставит диагноз overfitting, уменьшает сеть и включает early stopping по validation set.", "benefit": "Проблема обобщения ловится до выпуска модели, а не по жалобам пользователей."}}, {"q": "В WTA-сеть подают две записи клиентов с одинаковым направлением: x_a = (100, 200) и x_b = (1, 2). Что произойдёт, если подать их без нормализации, и что с ними нужно сделать по лекции?", "options": ["u = w^T x не изменится, так как WTA сравнивает только знаки компонент входа; входы надо бинаризовать порогом 0.5 перед каждой подачей в сеть", "u = w^T x для x_a выйдет в 100 раз больше при том же направлении, u = cos φ уже не выполняется; оба входа надо разделить на их норму", "u = w^T x будет одинаковым для обоих, так как cos угла не зависит от длины; нормализация нужна только для весов W, а не для входов", "u = w^T x для x_a окажется меньше, так как большие компоненты гасятся при суммировании; входы надо центрировать вычитанием среднего"], "correct": 1, "explain": "По слайду 99 u_i = w^T x = |w|·|x|·cos φ_i, поэтому u равно косинусу угла между w и x только при |W| = 1 и |X| = 1; слайд 98 требует 'Input vector should be normalized' по формуле x_j / sqrt(x_1^2 + ... + x_N^2), а веса - 'randomly initiated and normalized'. Без нормализации u для (100, 200) в сто раз больше, чем для (1, 2), хотя направление одно и то же, и мера сходства по направлению перестаёт работать. После деления на норму оба входа превращаются в (0.447, 0.894) и обрабатываются одинаково. Утверждение 'u одинаково, так как cos не зависит от длины' неверно: cos φ от длины не зависит, но u = cos φ только при единичных нормах. (Lecture_6, слайды 98-99)", "usage": {"code": false, "without": "Аналитик подаёт в WTA сырые суммы покупок в евро и в центах вперемешку, и значение u определяется масштабом чисел, а не профилем клиента.", "with": "Он нормализует каждый входной вектор и веса до единичной длины, и u становится косинусом угла, то есть мерой близости по структуре покупок.", "benefit": "Кластеры WTA отражают профиль клиента, а не масштаб его чисел."}}, {"q": "Студент собрал сеть 4-10-1 для аппроксимации нелинейной зависимости цены от площади, но во всех слоях поставил линейную активацию: выход каждой единицы равен c умножить на взвешенную сумму. Что получится и где по лекции должна стоять нелинейность?", "options": ["Сеть станет нелинейной, если добавить второй линейный скрытый слой; нелинейность возникает из произведения двух матриц весов", "Сеть выдаст нелинейную функцию только при sigmoid на выходном нейроне; в скрытом слое активация должна оставаться линейной", "Сеть эквивалентна сети без скрытых единиц, то есть линейной регрессии; нелинейность ReLU, Sigmoid или Tanh нужна в скрытом слое", "Сеть аппроксимирует любую гладкую функцию, так как 10 скрытых нейронов дают 10 линейных кусков; нелинейность добавлять не требуется"], "correct": 2, "explain": "По упражнению 19.3 AIMA при линейных активациях выход сети с любым числом скрытых слоёв записывается как функция W и I без упоминания скрытого слоя, и существует сеть без скрытых единиц с той же функцией; 'the whole network represents a complex nonlinear function' только потому, что активации g нелинейны. На слайде regression NN нелинейность ReLU стоит в скрытом слое, а выход - линейная функция y = z = Σ y(2) w(2); ещё один линейный слой ничего не добавляет, композиция линейных отображений линейна. (AIMA гл. 19, стр. 571, 596-597; Lecture_6, слайд 63)", "usage": {"code": false, "without": "Разработчик наращивает сеть до пяти линейных слоёв, удивляется, что качество не лучше линейной регрессии, и винит оптимизатор.", "with": "Он ставит ReLU в скрытые слои и оставляет линейный выход, и сеть начинает ловить изгибы зависимости с первой попытки.", "benefit": "Глубина сети тратится на реальную нелинейность, а не на бесполезное перемножение матриц."}}, {"q": "Обучение backprop остановилось: RMSE = 0.4 при пороге γ = 0.05, градиент практически нулевой, сеть выдаёт один и тот же класс 'yes' для всех примеров, а 'yes' - самый частый класс в выборке. Что произошло и что предлагают источники?", "options": ["Сеть застряла в локальном минимуме error surface, выдавая самый частый класс; simulated annealing ценой вычислений ведёт к глобальному оптимуму", "Сеть переобучилась: постоянный ответ говорит о запоминании примеров, нужно уменьшить число скрытых нейронов и включить early stopping", "Сеть недообучена из-за малого learning rate: градиент нулевой, потому что шаг слишком мал, нужно увеличить α в десять раз и продолжить", "Достигнут глобальный минимум: нулевой градиент означает, что лучших весов не существует, и порог γ нужно просто поднять до 0.4"], "correct": 0, "explain": "Лекция противопоставляет 'idealistic view' с одной ямой и 'realistic curve' функции loss с множеством локальных минимумов; AIMA прямо пишет, что local minima в error surface - проблема backprop, сети часто сходятся к постоянному 'yes' или 'no', самому частому в обучающей выборке, а simulated annealing ценой дополнительных вычислений обеспечивает сходимость к глобальному оптимуму. Нулевой градиент при RMSE 0.4 не доказывает глобальности минимума, а переобучение проявилось бы малой ошибкой на train, а не постоянным ответом. (Lecture_6, слайд 77; AIMA гл. 19, стр. 583-584)", "usage": {"code": false, "without": "Инженер видит нулевой градиент, объявляет обучение завершённым и сдаёт классификатор, который на всё отвечает 'yes'.", "with": "Он распознаёт застревание в локальном минимуме по постоянному ответу, перезапускает обучение с другой инициализацией или подключает simulated annealing.", "benefit": "Нулевой градиент перестаёт путаться с хорошим решением."}}, {"q": "Сеть имеет 1 000 000 весов. Коллега предлагает обучать её методом Newton, потому что на рисунке в лекции он доходит до минимума за меньшее число шагов, чем gradient descent. Что случится и какой компромисс из лекции выбрать?", "options": ["Newton сойдётся быстрее по времени: Гессиан 10^6 на 10^6 считается один раз перед обучением, и каждый шаг дешевле шага gradient descent", "Newton не применим, так как требует только первых производных; вместо него взять gradient descent, который использует Гессиан для направления", "Newton потребует Jacobian 10^6 на 10^6; разумнее Levenberg-Marquardt, который работает без градиента и требует меньше памяти, чем gradient descent", "Newton потребует Гессиан 10^6 на 10^6, который нужно вычислять и обращать на каждом шаге; разумнее conjugate gradient или quasi-Newton"], "correct": 3, "explain": "Слайд 94: применение метода Newton 'computationally expensive', так как требует много операций для вычисления Гессиана и его обратной матрицы, а слайд 91 ставит Newton выше gradient descent по памяти; conjugate gradient избегает вычисления, хранения и обращения Гессиана, а quasi-Newton заменяет обратный Гессиан приближением G по первым производным. Меньшее число шагов не означает меньшее время - каждый шаг Newton дорог, а Гессиан зависит от текущих весов и не считается один раз; Levenberg-Marquardt работает с градиентом и Jacobian и требует больше памяти, чем gradient descent. (Lecture_6, слайды 91-95)", "usage": {"code": false, "without": "Инженер запускает Newton на большой сети, обучение падает по памяти на первой же итерации, и он возвращается к медленному gradient descent.", "with": "Он сразу берёт conjugate gradient или quasi-Newton BFGS, получая быструю сходимость без хранения и обращения Гессиана.", "benefit": "Выбор оптимизатора делается по размеру сети, а не по картинке с числом шагов."}}, {"q": "Цена дома зависит от возраста немонотонно: сначала падает, а для исторических зданий снова растёт. Признаки: Area, Bedrooms, Distance to city, Age. Почему линейная регрессия не справится и какие функции по слоям использует regression NN из лекции?", "options": ["Линейная регрессия требует бинарных входов, а Age числовой; regression NN ставит линейные функции во всех слоях, а изгиб получает за счёт числа скрытых нейронов", "Линейная регрессия даёт один коэффициент при Age, то есть монотонную зависимость; regression NN ставит ReLU в скрытом слое и линейную функцию на выходе", "Линейная регрессия не сходится при большом разбросе значений Age; regression NN ставит sigmoid на выходной нейрон, а скрытый слой оставляет линейным", "Линейная регрессия не различает Area и Age из-за общей единицы измерения; regression NN отказывается от скрытого слоя и ставит tanh на выходной нейрон"], "correct": 1, "explain": "Линейная модель со слайда f(x, b) = b0 + b1x1 + … + bkxk даёт при Age единственный коэффициент, и зависимость цены от возраста может только монотонно расти или падать; числовые входы ей не мешают, а решение находится без итераций. На слайде 'Linear regression model vs Regression NN' скрытый слой имеет ReLU function, а выход - Linear function y = z = Σ y(2) w(2), и именно нелинейный скрытый слой строит изгиб. Линейные функции во всех слоях дают снова линейную модель, а sigmoid или tanh на выходе без нелинейного скрытого слоя зажимают цену в узкий диапазон и не соответствуют регрессионной NN из лекции, где для выхода регрессии выбирают Linear. (Lecture_6, слайды 54, 62-64)", "usage": {"code": false, "without": "Аналитик гонит линейную регрессию, получает 'чем старше, тем дешевле' и оценивает особняк 1890 года как сарай.", "with": "Он строит regression NN с ReLU в скрытом слое и линейным выходом, и модель сама выучивает провал с последующим ростом цены по возрасту.", "benefit": "Немонотонные зависимости ловятся без ручного придумывания признаков."}}, {"q": "SOM 10 на 10 обучили на признаках клиентов без меток. Клиенты A и B попали в соседние узлы, клиент C - в противоположный угол карты. Что можно заключить и нужны ли для этого метки классов?", "options": ["A и B попали рядом случайно, положение узла не связано с похожестью; метки нужны, чтобы SOM выдала вероятность класса для C", "A и B относятся к одному классу с вероятностью 0.9, C - к другому; метки нужны, SOM обучается с учителем по расстоянию до целевого узла", "A и B близки в пространстве признаков, C существенно отличается; метки не нужны, SOM обучается без учителя и сохраняет топологию", "A и B имеют одинаковую сумму признаков, C - другую; метки не нужны, так как SOM раскладывает клиентов по норме входного вектора"], "correct": 2, "explain": "Слайд 104: входные векторы, близкие в многомерном пространстве, отображаются в соседние узлы 2D-сетки, а всё обучение идёт without supervision; итог по слайду 107 - похожие узлы группируются в одной области, непохожие разделены. SOM не выдаёт вероятность класса и не обучается с учителем: BMU выбирается по минимальному евклидову расстоянию между входом и весами узла, без целевого узла и без меток. (Lecture_6, слайды 104-107)", "usage": {"code": false, "without": "Маркетолог требует размеченную базу 'сегмент клиента' перед запуском SOM и откладывает сегментацию на полгода.", "with": "Он обучает SOM на сырых признаках, читает карту как соседство похожих клиентов и выделяет сегменты без единой метки.", "benefit": "Структура клиентской базы видна на карте без разметки."}}, {"q": "В SOM σ(t) = σ0 exp(−t/λ), α(t) = α0 exp(−t/λ), β_ij = exp(−d²/2σ²(t)). Что произойдёт, если задать λ очень большим, и что - если очень малым?", "options": ["При большом λ σ и α почти не убывают, карта не стабилизируется и продолжает крупные сдвиги; при малом λ радиус и шаг схлопываются сразу, топология не складывается", "При большом λ σ и α растут с каждым шагом обучения, и β_ij превышает единицу; при малом λ β_ij становится отрицательным, и узлы уходят от входа вместо приближения к нему", "При большом λ σ влияет только на BMU, соседи не обновляются вовсе; при малом λ радиус охватывает всю карту, и каждый узел сдвигается на полный шаг α0", "При большом λ α должна расти, чтобы компенсировать падение σ; при малом λ β_ij перестаёт зависеть от расстояния d, и все соседи получают одинаковый вес"], "correct": 0, "explain": "λ стоит в знаменателе показателя экспоненты: большое λ даёт exp(−t/λ) ≈ 1, σ и α почти не уменьшаются, соседи на том же d сохраняют большой β_ij, и узлы продолжают крупные сдвиги до предела итераций t = n; малое λ обнуляет σ и α за несколько итераций, колокол β_ij сужается, и корректируется практически только BMU малыми шагами, прежде чем карта успела развернуться к данным. β_ij = exp(−d²/2σ²) всегда лежит между 0 и 1, не бывает отрицательным и не превышает единицу. (Lecture_6, слайды 108-109)", "usage": {"code": false, "without": "Студент ставит λ наугад, получает то дрожащую карту без устойчивых кластеров, то карту, где обновился только десяток узлов, и винит данные.", "with": "Он подбирает λ под число итераций так, чтобы радиус и шаг плавно сжимались к концу обучения, и карта разворачивается, а затем стабилизируется.", "benefit": "Поведение карты предсказывается по формулам, а не по перебору запусков."}}, {"q": "Нужно восстанавливать полную фотографию по повреждённому фрагменту, не храня базу образцов отдельно. Какая сеть из AIMA подходит и сколько образов она надёжно хранит при N = 200 единиц?", "options": ["Feed-forward перцептрон без скрытых единиц: хранит до 200 образов, по одному на единицу, а фрагмент подаётся на входные единицы", "Boltzmann machine с несимметричными весами: хранит до 0.5N = 100 образов, каждый образ записан в отдельной скрытой единице", "Hopfield network с sigmoid-активацией и уровнями от 0 до 1: хранит N² = 40 000 образов, по одному на каждую пару весов W_ij", "Hopfield network с симметричными весами W_ij = W_ji и активацией sign: хранит до 0.138N, то есть около 27 образов"], "correct": 3, "explain": "AIMA: Hopfield network - двунаправленные связи с симметричными весами W_ij = W_ji, активация sign, уровни только ±1; она работает как associative memory - по фрагменту сеть приходит к паттерну, наиболее похожему на обучающий пример, причём фотографии не хранятся отдельно, каждый вес частично кодирует все; надёжно хранится до 0.138N примеров, при N = 200 это около 27. Boltzmann machines тоже используют симметричные веса, но добавляют скрытые единицы и стохастическую активацию, а не 'несимметричные' веса. (AIMA гл. 19, стр. 571)", "usage": {"code": false, "without": "Разработчик пытается обучить перцептрон 'угадывать' недостающую половину кадра и держит рядом базу всех эталонов для сравнения.", "with": "Он берёт Hopfield network, подаёт фрагмент, сеть сама сходится к ближайшему запомненному образу, а число образов он ограничивает 0.138N.", "benefit": "Восстановление по фрагменту без внешней базы и с понятным пределом ёмкости."}}, {"q": "Перцептрон с пороговой функцией активации имеет веса w0 = -1 (bias при x0 = 1), w1 = 2, w2 = 1. На вход подают две точки: первая x1 = 0.2, x2 = 0.5; вторая x1 = 0.4, x2 = 0.5. Какие выходы y даст перцептрон для первой и второй точки?", "options": ["y = 1 для первой точки и y = 1 для второй", "y = 1 для первой точки и y = 0 для второй", "y = 0 для первой точки и y = 1 для второй", "y = 0 для первой точки и y = 0 для второй"], "correct": 2, "explain": "Шаг 1: Z = w0 + w1·x1 + w2·x2 = -1 + 0.4 + 0.5 = -0.1 для первой точки. Шаг 2: пороговая функция даёт y = 1 при Z ≥ 0 и y = 0 при Z < 0, поэтому y = 0; сама сумма -0.1 - это ещё не выход нейрона. Шаг 3: для второй точки Z = -1 + 0.8 + 0.5 = 0.3 ≥ 0, значит y = 1. Вариант «1 и 1» получается, если забыть bias w0 (тогда Z = 0.9 и 1.3), «0 и 0» - если перепутать знак w1 (Z = -0.9 и -1.3), а «1 и 0» - если перевернуть правило порога и ставить единицу при Z < 0 (Lecture_6, слайды 26-27, 29).", "usage": {"code": false, "without": "Студент складывает произведения весов на входы, получает -0.1 и записывает это как ответ нейрона, не применив пороговую функцию и забыв про bias.", "with": "Он считает Z вместе с w0, сравнивает результат с нулём и выдаёт чистые 0 или 1 - ровно то, что ждёт задача про перцептрон.", "benefit": "Безошибочный ручной расчёт выхода перцептрона на экзамене."}}, {"q": "У перцептрона с пороговой функцией веса w0 = 2, w1 = -1, w2 = 2. Приравняв Z = w0 + w1·x1 + w2·x2 к нулю, выразите разделяющую прямую в виде x2 = b + k·x1 и определите классы точки A (x1 = 2, x2 = 1) и точки B (x1 = 0, x2 = -2), если класс X отвечает Z > 0, а класс O - Z < 0.", "options": ["прямая x2 = -1 + 0.5·x1, точка A в классе X, точка B в классе O", "прямая x2 = -1 - 0.5·x1, точка A в классе X, точка B в классе O", "прямая x2 = 1 + 0.5·x1, точка A в классе O, точка B в классе O", "прямая x2 = -1 + 0.5·x1, точка A в классе O, точка B в классе X"], "correct": 0, "explain": "Шаг 1: из 2 - x1 + 2·x2 = 0 получаем x2 = -w0/w2 - (w1/w2)·x1 = -1 + 0.5·x1, то есть b = -1, k = 0.5. Шаг 2: для A имеем Z = 2 - 2 + 2 = 2 > 0 - класс X с d = 1. Шаг 3: для B имеем Z = 2 - 0 - 4 = -2 < 0 - класс O с d = 0. Вариант с k = -0.5 - ошибка знака при переносе w1·x1 в правую часть, вариант с b = +1 - ошибка знака при делении w0 на w2, а вариант с той же прямой и перепутанными классами игнорирует правило «Z > 0 - класс X» (Lecture_6, слайды 27, 44).", "usage": {"code": false, "without": "Студент рисует прямую наугад и относит точку к классу «по картинке», путая, какая сторона прямой соответствует Z > 0.", "with": "Он выводит прямую из Z = 0, а класс точки проверяет подстановкой в Z - знак суммы сразу говорит, X это или O.", "benefit": "Быстрая и проверяемая классификация точек линейным перцептроном."}}, {"q": "Сигмоидный нейрон y = 1/(1 + exp(-α·Z)) с несколькими входами при α = 1 получил на очередном примере взвешенную сумму Z = ln 4, целевое значение t = 1. Один из его весов w = 0.3 стоит при входе x = 1, скорость обучения η = 0.5. По правилу ΔW = -η·(y - t)·f'·x, где для сигмоиды f' = y·(1 - y), вычислите новое значение этого веса после одного шага коррекции.", "options": ["w = 0.400", "w = 0.364", "w = 0.284", "w = 0.316"], "correct": 3, "explain": "Шаг 1: exp(-ln 4) = 1/4, поэтому y = 1/(1 + 0.25) = 0.8. Шаг 2: f' = y·(1 - y) = 0.8·0.2 = 0.16. Шаг 3: ΔW = -0.5·(0.8 - 1)·0.16·1 = +0.016, откуда w = 0.3 + 0.016 = 0.316. Ответ 0.284 - перепутан знак ΔW (при y < t вес должен расти), 0.400 - забыта производная f', 0.364 - производная взята как y² = 0.64 вместо y·(1 - y). На слайде скорость обучения обозначена той же буквой α, что и крутизна сигмоиды; в задаче она названа η, чтобы не смешивать два разных параметра (Lecture_6, слайды 32, 78-79).", "usage": {"code": false, "without": "Студент двигает вес «в сторону цели» на глаз, забывая производную сигмоиды, и получает шаг в шесть раз больше нужного.", "with": "Он считает y, затем y·(1 - y), затем ΔW по формуле - и каждый шаг можно проверить на бумаге.", "benefit": "Уверенный ручной шаг градиентного спуска для сигмоидного нейрона."}}, {"q": "Линейный нейрон y = Z обучается градиентным спуском: вход x0 = 1, x1 = 1, x2 = 2, веса w0 = 0.1, w1 = 0.5, w2 = -0.25, цель t = 1, α = 0.1. По формуле ΔW_i = -α·(y - t)·f'·x_i, где для линейной активации f' = 1, найдите все три веса после одного шага.", "options": ["w0 = 0.19, w1 = 0.59, w2 = -0.16", "w0 = 0.19, w1 = 0.59, w2 = -0.07", "w0 = 0.01, w1 = 0.41, w2 = -0.43", "w0 = 0.10, w1 = 0.59, w2 = -0.16"], "correct": 1, "explain": "Шаг 1: Z = 0.1·1 + 0.5·1 + (-0.25)·2 = 0.1, для линейной активации y = Z = 0.1, ошибка y - t = -0.9, J = 0.81. Шаг 2: ΔW_i = -0.1·(-0.9)·1·x_i = 0.09·x_i, то есть 0.09, 0.09 и 0.18. Шаг 3: W = W + ΔW = 0.19, 0.59, -0.07; проверка: новый y = 0.19 + 0.59 - 0.14 = 0.64, J = 0.13 < 0.81. Вариант 0.01/0.41/-0.43 - перепутан знак ΔW; 0.19/0.59/-0.16 - поправка для w2 не умножена на x2 = 2; 0.10/0.59/-0.16 - та же ошибка плюс не обновлён bias w0 при x0 = 1 (Lecture_6, слайды 31, 78-79).", "usage": {"code": false, "without": "Студент корректирует только «настоящие» веса одной и той же поправкой, оставляя bias и забывая множитель x_i, и удивляется, что ошибка после шага почти не падает.", "with": "Он обновляет весь вектор W, включая w0 при x0 = 1, умножает поправку на свой вход x_i и проверяет, что J действительно уменьшилась.", "benefit": "Полный и проверяемый шаг градиентного спуска по всем весам."}}, {"q": "Обучение с моментом идёт по правилу ΔW(n) = -α·(y - t)·f'·x + ΔW(n-1), W(n+1) = W(n) + ΔW(n). На итерации n градиентное слагаемое -α·(y - t)·f'·x равно 0.05, предыдущая поправка ΔW(n-1) = 0.02, а W(n) = 0.30. На итерации n+1 градиентное слагаемое снова равно 0.05. Чему равен вес после итерации n и после итерации n+1?", "options": ["W = 0.37 после итерации n и 0.47 после итерации n+1", "W = 0.35 после итерации n и 0.40 после итерации n+1", "W = 0.37 после итерации n и 0.49 после итерации n+1", "W = 0.37 после итерации n и 0.44 после итерации n+1"], "correct": 2, "explain": "Шаг 1: ΔW(n) = 0.05 + 0.02 = 0.07, W = 0.30 + 0.07 = 0.37. Шаг 2: на следующей итерации к градиенту прибавляется уже новая полная поправка: ΔW(n+1) = 0.05 + 0.07 = 0.12, W = 0.37 + 0.12 = 0.49. Ответ 0.35/0.40 - обучение без момента, 0.37/0.44 - на второй итерации момент взят старым 0.02 вместо 0.07, а 0.37/0.47 - в момент подставлено только предыдущее градиентное слагаемое 0.05, а не вся предыдущая поправка ΔW(n) = 0.07 (Lecture_6, слайд 80).", "usage": {"code": false, "without": "Студент считает шаг с моментом как обычный градиентный шаг и не видит, почему веса «разгоняются» от итерации к итерации.", "with": "Он тянет всю предыдущую поправку ΔW в следующую и видит, как момент накапливает скорость на ровном градиенте.", "benefit": "Понимание, за счёт чего momentum ускоряет обучение."}}, {"q": "Двухслойная сеть: n = 4 входных признака, k = 3 нейрона в первом слое, m = 2 выхода, обучающая выборка из N = 100 примеров. Матрица X содержит столбец  комбинаций; 2 выхода - 4 < 6, 3 выхода - 8 ≥ 6, значит нужно 3 нейрона. Шаг 2: при схеме «активен только один нейрон» число выходов равно числу классов - 6 нейронов с кодами 100000 … 000001. Шаг 3, проверка на примере лекции: для 3 классов это 2 и 3 нейрона соответственно. Ответ «2 и 3» - это пример лекции для трёх классов, перенесённый на шесть без пересчёта; «2 и 6» недооценивает бинарный код - 4 комбинаций на 6 классов не хватит; «3 и 3» невозможен: три нейрона с одной единицей дают лишь три кода (Lecture_6, слайды 47-48).", "usage": {"code": false, "without": "Студент переносит пример лекции для трёх классов на шесть без пересчёта, ставит два бинарных нейрона на шесть классов или три нейрона с одной единицей на шесть кодов.", "with": "Он считает 2^K для бинарного кода и число классов для схемы с одним активным нейроном и выбирает размер выходного слоя осознанно.", "benefit": "Правильный размер выходного слоя под число классов."}}, {"q": "Сеть WTA с тремя нейронами и нормированными весами w1 = (1, 0), w2 = (0.8, 0.6), w3 = (0, 1) получает вход x = (3, 4); α = 0.5. Нормируйте вход, найдите победителя по u_i = Σ w_ij·x_j и примените правило w_ij(t+1) = w_ij(t) + α·y_i·(x_j - w_ij(t)), где y = 1 у победителя и 0 у остальных. Что получится после этого шага?", "options": ["нейрон 2 победил, w2 = 0.7; 0.7, а w1 и w3 тоже сдвигаются к x", "нейрон 2 победил, w2 = 0.7; 0.7, а w1 и w3 не меняются", "нейрон 3 победил, w3 = 0.3; 0.9, а w1 и w2 тоже сдвигаются к x", "нейрон 2 победил, w2 = 0.9; 0.5, а w1 и w3 не меняются"], "correct": 1, "explain": "Шаг 1: |x| = sqrt(9 + 16) = 5, нормированный вход x = 0.6; 0.8. Шаг 2: u1 = 0.6, u2 = 0.8·0.6 + 0.6·0.8 = 0.96, u3 = 0.8 - максимум у нейрона 2, у него y = 1, у остальных y = 0. Шаг 3: w2 = (0.8 + 0.5·(0.6 - 0.8); 0.6 + 0.5·(0.8 - 0.6)) = 0.7; 0.7, а w1 и w3 не меняются, потому что множитель y = 0 обнуляет поправку. Ответ с нейроном 3 - взята лишь большая координата входа вместо скалярного произведения, 0.9; 0.5 - перепутан знак 5. Он связан с двумя выходными нейронами весами w_j1(2) = 0.5 и w_j2(2) = 0.4, ошибки выходных нейронов δ1(2) = 0.2 и δ2(2) = -0.1. Вход x_i = 2, α = 1. По формулам δ_in_j = Σ δ_i(2)·w_ji(2), δ_j(1) = δ_in_j·f'(Z_j), ΔW_ij(1) = α·δ_j(1)·x_i вычислите поправку веса ΔW_ij(1).", "options": ["ΔW = 0.03", "ΔW = 0.12", "ΔW = 0.28", "ΔW = 0.015"], "correct": 0, "explain": "Шаг 1: δ_in_j = 0.2·0.5 + (-0.1)·0.4 = 0.10 - 0.04 = 0.06. Шаг 2: для сигмоиды f' = y·(1 - y) = 0.5·0.5 = 0.25, поэтому δ_j(1) = 0.06·0.25 = 0.015. Шаг 3: ΔW_ij(1) = 1·0.015·2 = 0.03. Ответ 0.12 - забыта производная f', 0.28 - слагаемые δ·w сложены по модулю (0.14·2), 0.015 - не умножено на вход x_i (Lecture_6, слайды 79, 86).", "usage": {"code": false, "without": "Студент передаёт ошибку назад «как есть», без производной активации и без веса связи, и получает поправку в разы больше нужной.", "with": "Он взвешивает ошибки выходов по связям, умножает на y·(1 - y) скрытого нейрона и на вход - и получает точное ΔW первого слоя.", "benefit": "Уверенный ручной расчёт обратного распространения ошибки."}}];
