(function () {
  const TEST_ID = "dsp_fourier_transform_properties";
  const QUESTIONS = [{"q": "Что такое спектральная плотность \\(\\dot S(\\omega)\\) одиночного импульса (spectral density)?", "options": ["Комплексная амплитуда гармоник в расчёте на единицу полосы частот", "Амплитуда одной-единственной гармоники импульса на частоте \\(\\omega\\)", "Средняя мощность импульса, делённая на ширину его спектра", "Энергия импульса, приходящаяся на единицу его длительности \\(\\tau\\)"], "correct": 0, "explain": "Одиночный импульс тоже раскладывается на гармоники, но они идут сплошь, без промежутков, и у каждой отдельной амплитуда бесконечно мала. Конечна только амплитуда, приходящаяся на полосу: на \\(d\\omega\\) приходится \\(\\dot S(\\omega)\\,d\\omega/2\\pi\\), а весь сигнал — их сумма: \\(s(t)=\\frac{1}{2\\pi}\\int\\dot S(\\omega)e^{j\\omega t}d\\omega\\). Отсюда слово «плотность» — как кг/м³ у вещества. «Амплитуда одной гармоники» — ошибка: одна гармоника у импульса нулевая. Мощность и энергия — квадратичные величины, а \\(\\dot S\\) линейна по сигналу. Интуиция: спектр — рецепт сигнала, плотность говорит, сколько каждой частоты нужно на единицу ширины полосы.", "usage": {"code": false, "without": "Инженер ищет «амплитуду гармоники 40 кГц» в одиночном ультразвуковом импульсе дальномера, получает ноль на любой частоте и решает, что посчитал неверно.", "with": "Он смотрит на |Ṡ(ω)| как на плотность: видит, что импульс сосредоточен в полосе около 40 кГц шириной ~2/τ, и подбирает полосу приёмного фильтра.", "benefit": "Понятно, что именно показывает спектр одиночного импульса и как с ним работать"}, "img": {"src": "img/dsp_fourier_transform_properties/01.svg", "alt": "Одиночный импульс во времени и его сплошная спектральная функция S(ω)"}}, {"q": "Периодическую последовательность импульсов превращают в одиночный импульс, устремляя период \\(T\\to\\infty\\). Что происходит со спектром?", "options": ["Шаг между линиями \\(\\omega_1=2\\pi T\\) растёт, и в пределе остаётся одна линия на нулевой частоте", "Линии остаются на прежних частотах, а их высоты растут пропорционально периоду \\(T\\)", "Шаг между линиями \\(\\omega_1=2\\pi/T\\) стремится к нулю, и линейчатый спектр становится сплошным", "Спектр не меняется: форма импульса та же, значит, и линии стоят на тех же местах"], "correct": 2, "explain": "Линии ряда Фурье стоят на частотах \\(n\\omega_1\\), где \\(\\omega_1=2\\pi/T\\) (fundamental frequency). Растёт \\(T\\) — шаг уменьшается, линии сближаются; при \\(T\\to\\infty\\) шаг превращается в \\(d\\omega\\), сумма — в интеграл, линейчатый спектр (line spectrum) — в сплошной. Ошибка «\\(\\omega_1=2\\pi T\\)» — перевёрнутая формула частоты. Высоты линий при этом не растут, а падают как \\(1/T\\): \\(\\dot C_n/2=\\dot S(n\\omega_1)/T\\). Форма та же, но пауз между импульсами стало больше, и это меняет густоту линий. Интуиция: чем реже повторяется сигнал, тем гуще его спектральные линии.", "usage": {"code": false, "without": "Инженер ожидает увидеть у одиночного импульса датчика отдельные линии, как у меандра ШИМ, и не понимает, почему анализатор рисует сплошную кривую.", "with": "Он помнит, что одиночный импульс — предел периодического при T→∞: линии слились, и сплошная кривая — их огибающая.", "benefit": "Связь ряда Фурье и преобразования Фурье становится наглядной"}, "img": {"src": "img/dsp_fourier_transform_properties/02.svg", "alt": "Периодическая последовательность импульсов с линейчатым спектром; при T→∞ — одиночный импульс и вопрос о спектре"}}, {"q": "Одиночный импульс \\(s(t)\\) со спектральной плотностью \\(\\dot S(\\omega)\\) повторили с периодом \\(T\\). Как связаны с ней коэффициенты экспоненциального ряда \\(\\dot C_n/2\\)?", "options": ["\\(\\dfrac{\\dot C_n}{2}=\\dfrac{1}{T}\\,\\dot S(n\\omega_1)\\)", "\\(\\dfrac{\\dot C_n}{2}=T\\,\\dot S(n\\omega_1)\\)", "\\(\\dfrac{\\dot C_n}{2}=\\dfrac{1}{2\\pi}\\,\\dot S(n\\omega_1)\\)", "\\(\\dfrac{\\dot C_n}{2}=\\dfrac{1}{T}\\,\\dot S(\\omega_1/n)\\)"], "correct": 0, "explain": "Сравни формулы. Коэффициент ряда: \\(\\frac{\\dot C_n}{2}=\\frac1T\\int_T s(t)e^{-jn\\omega_1t}dt\\). Спектральная плотность: \\(\\dot S(\\omega)=\\int s(t)e^{-j\\omega t}dt\\). Интеграл тот же, только вместо \\(\\omega\\) стоит \\(n\\omega_1\\) и есть множитель \\(1/T\\). Значит, линии периодического сигнала — это отсчёты огибающей \\(\\dot S(\\omega)\\) в точках \\(n\\omega_1\\), делённые на \\(T\\). Умножать на \\(T\\) — перепутать направление; \\(1/2\\pi\\) стоит в обратном преобразовании, а не здесь; \\(\\omega_1/n\\) — не та частота: \\(n\\)-я гармоника выше основной в \\(n\\) раз. Интуиция: огибающая линий периодического сигнала — это спектр одного периода.", "usage": {"code": false, "without": "Инженер считает спектр ШИМ-сигнала мотора по ряду Фурье заново для каждой скважности, интегрируя по периоду.", "with": "Он один раз находит Ṡ(ω) одного импульса и получает все линии как Ṡ(nω₁)/T — для любого периода сразу.", "benefit": "Один расчёт спектра импульса даёт линии для любого периода повторения"}, "img": {"src": "img/dsp_fourier_transform_properties/03.svg", "alt": "Периодическая последовательность с периодом T, один импульс выделен; линии спектра на частотах nω1 и огибающая S(ω)"}}, {"q": "Сигнал \\(s(t)\\) измеряется в вольтах. В каких единицах его спектральная плотность \\(\\dot S(\\omega)=\\int s(t)e^{-j\\omega t}dt\\)?", "options": ["В, как у самого сигнала: преобразование Фурье единиц не меняет", "В²·с, как у энергии сигнала на сопротивлении 1 Ом", "В/с, потому что интеграл по времени делит сигнал на секунды", "В·с, то есть вольт на герц — амплитуда на единицу частоты"], "correct": 3, "explain": "Под интегралом вольты, \\(e^{-j\\omega t}\\) безразмерна, а \\(dt\\) — секунды. Итог: В·с. Так как 1 с = 1/Гц, это то же, что В/Гц — вольты на единицу частоты, ровно как и положено плотности. «В» — забыли про \\(dt\\). «В²·с» — единица энергии \\(\\int s^2dt\\) (energy), её даёт \\(|\\dot S|^2\\), а не \\(\\dot S\\). «В/с» — интеграл не делит на время, а умножает. Интуиция: размерность плотности — «величина на ширину полосы».", "usage": {"code": false, "without": "Инженер сравнивает спектр импульса IMU в В·с с амплитудой синусоиды в вольтах и делает вывод, что вибрация в 1000 раз слабее шума.", "with": "Он видит разные единицы: плотность нужно умножить на ширину полосы, прежде чем сравнивать с амплитудой.", "benefit": "Не сравниваются несравнимые величины"}, "img": {"src": "img/dsp_fourier_transform_properties/04.svg", "alt": "Импульс в вольтах и его спектральная плотность с неизвестными единицами"}}, {"q": "Чему равно значение спектральной плотности на нулевой частоте \\(\\dot S(0)\\)?", "options": ["Площади под импульсом \\(\\int s(t)\\,dt\\)", "Энергии импульса \\(\\int s^2(t)\\,dt\\)", "Пиковому значению импульса \\(S_m\\)", "Среднему значению импульса на его длительности"], "correct": 0, "explain": "Подставь \\(\\omega=0\\): \\(e^{-j0t}=1\\), и \\(\\dot S(0)=\\int s(t)\\,dt\\) — площадь (area). Это лучшая проверка любой формулы спектра: у прямоугольника \\(S_m\\tau\\), у треугольника \\(S_m\\tau/2\\). Энергия — интеграл квадрата, её даёт \\(|\\dot S|^2\\). Пик \\(S_m\\) — только высота, без длительности. Среднее на длительности — это площадь, делённая на \\(\\tau\\), а не сама площадь. Интуиция: на нулевой частоте гармоника — константа, и импульс «весит» столько, сколько его площадь.", "usage": {"code": false, "without": "Инженер выводит формулу спектра импульса энкодера и не замечает, что потерял множитель 2: формула выглядит правдоподобно.", "with": "Он подставляет ω = 0 и сравнивает с площадью импульса — ошибка видна за секунду.", "benefit": "Быстрая самопроверка любой формулы спектра"}, "img": {"src": "img/dsp_fourier_transform_properties/05.svg", "alt": "Импульс и его спектральная плотность с отмеченной точкой на нулевой частоте"}}, {"q": "Какая формула — обратное преобразование Фурье (inverse transform) при \\(\\dot S(\\omega)=\\int s(t)e^{-j\\omega t}dt\\)?", "options": ["\\(s(t)=\\displaystyle\\int_{-\\infty}^{\\infty}\\dot S(\\omega)\\,e^{j\\omega t}\\,d\\omega\\)", "\\(s(t)=\\dfrac{1}{2\\pi}\\displaystyle\\int_{-\\infty}^{\\infty}\\dot S(\\omega)\\,e^{j\\omega t}\\,d\\omega\\)", "\\(s(t)=\\dfrac{1}{2\\pi}\\displaystyle\\int_{-\\infty}^{\\infty}\\dot S(\\omega)\\,e^{-j\\omega t}\\,d\\omega\\)", "\\(s(t)=2\\pi\\displaystyle\\int_{-\\infty}^{\\infty}\\dot S(\\omega)\\,e^{j\\omega t}\\,d\\omega\\)"], "correct": 1, "explain": "Пара прямое/обратное отличается двумя вещами: знаком в экспоненте (прямое \\(-j\\), обратное \\(+j\\)) и множителем \\(1/2\\pi\\) у обратного — он появляется, потому что мы интегрируем по \\(\\omega\\), а \\(d\\omega=2\\pi\\,df\\). Так записано и в домашке: \\(dA=\\dot S(\\omega)d\\omega\\), \\(s(t)=\\sum dA=\\frac{1}{2\\pi}\\int\\dot S e^{j\\omega t}d\\omega\\). Без \\(1/2\\pi\\) сигнал выйдет в \\(2\\pi\\) раз больше; знак минус даст сигнал, отражённый во времени \\(s(-t)\\); множитель \\(2\\pi\\) — перевёрнутая поправка. Интуиция: «туда» с минусом, «обратно» с плюсом и делением на \\(2\\pi\\).", "usage": {"code": false, "without": "Студент собирает импульс датчика из спектра без 1/2π и получает амплитуду 6,28 В вместо 1 В.", "with": "Он помнит пару формул целиком и восстанавливает исходный сигнал в правильном масштабе.", "benefit": "Сигнал из спектра восстанавливается без потерь масштаба и знака"}, "img": {"src": "img/dsp_fourier_transform_properties/06.svg", "alt": "Прямое преобразование Фурье от s(t) к S(ω) и обратное преобразование со знаком вопроса"}}, {"q": "Почему для периодического сигнала считают среднюю мощность (average power), а для одиночного импульса — энергию (energy)?", "options": ["Энергия периодического сигнала бесконечна, а у импульса конечна при нулевой средней мощности", "Периодический сигнал не переносит энергию, потому что повторяется и не затухает", "Это лишь традиция: обе величины всегда конечны и отличаются множителем \\(T\\)", "Для импульса мощность нельзя посчитать, потому что у него нет периода \\(T\\)"], "correct": 0, "explain": "Энергия \\(E=\\int_{-\\infty}^{\\infty}s^2dt\\). У периодического сигнала каждый период добавляет одно и то же, и сумма по бесконечному числу периодов бесконечна — поэтому берут среднее за период: \\(P=\\frac1T\\int_T s^2dt\\) (у пилы из домашки 11.10 \\(P=S_m^2/3\\)). У импульса наоборот: энергия конечна (у прямоугольника \\(S_m^2\\Delta t\\)), а средняя мощность — эта энергия, делённая на бесконечное время, — ноль. «Не переносит энергию» неверно: переносит, и бесконечно много. «Мощность нельзя посчитать» — можно, она просто равна нулю, поэтому бесполезна. Интуиция: бесконечный сигнал меряют «в секунду», короткий — «целиком».", "usage": {"code": false, "without": "Инженер считает «энергию» ШИМ-сигнала на мотор за всё время и получает число, которое растёт с длиной записи.", "with": "Он берёт среднюю мощность за период — число, не зависящее от длины записи, — и сравнивает его с допустимой мощностью драйвера.", "benefit": "Для каждого типа сигнала выбирается величина, которая конечна и осмысленна"}, "img": {"src": "img/dsp_fourier_transform_properties/07.svg", "alt": "Периодический сигнал (бесконечный) и одиночный импульс: что считать — мощность или энергию"}}, {"q": "Что показывает \\(|\\dot S(\\omega)|^2\\) — энергетический спектр (energy spectral density)?", "options": ["Мгновенную мощность сигнала на частоте \\(\\omega\\) в каждый момент времени", "Как энергия импульса распределена по частотам — сколько её на полосе \\(d\\omega\\)", "Квадрат фазы — насколько сильно сдвинута по времени каждая гармоника", "Амплитуду гармоники, умноженную на её частоту \\(\\omega\\)"], "correct": 1, "explain": "По теореме Рэлея (Rayleigh/Parseval) \\(E=\\int s^2dt=\\frac{1}{2\\pi}\\int|\\dot S(\\omega)|^2d\\omega\\). Значит, \\(|\\dot S|^2\\,d\\omega/2\\pi\\) — порция энергии в полосе \\(d\\omega\\), а \\(|\\dot S|^2\\) — плотность энергии по частоте. «Мгновенная мощность» — величина во времени, а спектр время уже проинтегрировал. Модуль \\(|\\dot S|\\) фазу не содержит, так что «квадрат фазы» мимо. Умножение на частоту даёт спектр производной \\(j\\omega\\dot S\\), а не энергию. Интуиция: \\(|\\dot S|^2\\) отвечает на вопрос «на каких частотах лежит энергия».", "usage": {"code": false, "without": "Инженер ставит фильтр датчика удара по пику |Ṡ(ω)| и отрезает полосу, где на самом деле лежит половина энергии сигнала.", "with": "Он интегрирует |Ṡ(ω)|² по полосе фильтра и видит, какую долю энергии фильтр пропускает.", "benefit": "Полоса фильтра выбирается по доле сохранённой энергии"}, "img": {"src": "img/dsp_fourier_transform_properties/08.svg", "alt": "Импульс и график |S(ω)|² — что он показывает"}}, {"q": "Почему у одиночного импульса говорят о спектральной плотности, а не об амплитудах гармоник, как в ряду Фурье?", "options": ["При \\(T\\to\\infty\\) амплитуда каждой линии стремится к нулю, конечна лишь амплитуда на единицу частоты", "При \\(T\\to\\infty\\) амплитуды становятся бесконечными, и их делят на \\(T\\), чтобы вышло конечное число", "У одиночного импульса вообще нет гармоник, поэтому вместо них берут плотность его энергии", "Это одно и то же: спектральная плотность — другое название амплитуды \\(C_n\\) ряда"], "correct": 0, "explain": "Из \\(\\dot C_n/2=\\dot S(n\\omega_1)/T\\): при \\(T\\to\\infty\\) каждая линия падает как \\(1/T\\) и исчезает. Но и шаг \\(\\omega_1=2\\pi/T\\) падает так же, поэтому отношение «амплитуда / шаг» \\(=\\dot S(n\\omega_1)/2\\pi\\) остаётся конечным — это и есть плотность. Амплитуды не растут, а убывают. Гармоники у импульса есть, их бесконечно много и они бесконечно малы. И это не синонимы: \\(C_n\\) измеряется в вольтах, а \\(\\dot S\\) — в В·с. Интуиция: как у песка — масса одной песчинки ноль, но плотность (кг/м³) конечна.", "usage": {"code": false, "without": "Студент пытается по графику |Ṡ(ω)| прочитать «амплитуду гармоники 50 Гц» в вольтах у одиночного импульса и путается.", "with": "Он понимает, что у импульса амплитуда приходится на полосу, и считает её как |Ṡ|·Δω/π для узкой полосы Δω.", "benefit": "Чтение спектров одиночных сигналов без путаницы единиц"}, "img": {"src": "img/dsp_fourier_transform_properties/09.svg", "alt": "Линейчатый спектр с амплитудами Cn и сплошная спектральная плотность при T→∞"}}, {"q": "Сигнал \\(s(t)\\) вещественный, \\(\\dot S(\\omega)=|\\dot S(\\omega)|\\,e^{j\\varphi(\\omega)}\\). Какая симметрия у амплитудного (amplitude spectrum) и фазового (phase spectrum) спектров?", "options": ["Модуль \\(|\\dot S(\\omega)|\\) — нечётная функция, фаза \\(\\varphi(\\omega)\\) — чётная", "Модуль \\(|\\dot S(\\omega)|\\) — чётная функция, фаза \\(\\varphi(\\omega)\\) — нечётная", "И модуль \\(|\\dot S(\\omega)|\\), и фаза \\(\\varphi(\\omega)\\) — чётные функции", "И модуль \\(|\\dot S(\\omega)|\\), и фаза \\(\\varphi(\\omega)\\) — нечётные функции"], "correct": 1, "explain": "У вещественного сигнала \\(\\dot S(-\\omega)=\\dot S^*(\\omega)\\) — комплексно сопряжённое. У сопряжённого тот же модуль и фаза с обратным знаком: \\(|\\dot S(-\\omega)|=|\\dot S(\\omega)|\\), \\(\\varphi(-\\omega)=-\\varphi(\\omega)\\). То же было в домашке 04.11: двусторонний амплитудный спектр симметричен, фазовый — антисимметричен (\\(\\dot C_{-n}=\\dot C_n^*\\)). Модуль не может быть нечётным: он неотрицателен, а нечётная функция меняет знак. Чётная фаза означала бы комплексный сигнал. Интуиция: отрицательные частоты — зеркальная копия, которую рисуют для удобства, новой информации в ней нет.", "usage": {"code": false, "without": "Инженер хранит спектр вибрации на положительных и отрицательных частотах и тратит на это вдвое больше памяти микроконтроллера.", "with": "Он хранит только ω ≥ 0: для вещественного сигнала отрицательная половина восстанавливается сопряжением.", "benefit": "Половина памяти и вычислений экономится без потерь"}, "img": {"src": "img/dsp_fourier_transform_properties/10.svg", "alt": "Вещественный сигнал и пустые графики амплитудного и фазового спектров на оси частот"}}, {"q": "Свойство линейности (linearity): чему равна спектральная плотность сигнала \\(a\\,s_1(t)+b\\,s_2(t)\\)?", "options": ["\\(\\dot S_1(a\\omega)+\\dot S_2(b\\omega)\\)", "\\(ab\\,\\dot S_1(\\omega)\\,\\dot S_2(\\omega)\\)", "\\(a\\,\\dot S_1(\\omega)+b\\,\\dot S_2(\\omega)\\)", "\\(a^2\\dot S_1(\\omega)+b^2\\dot S_2(\\omega)\\)"], "correct": 2, "explain": "Интеграл суммы — сумма интегралов, константу выносим: \\(\\int(as_1+bs_2)e^{-j\\omega t}dt=a\\dot S_1+b\\dot S_2\\). Это пункт a) домашки 20.09. \\(\\dot S_1(a\\omega)\\) — путаница со свойством масштаба: коэффициент умножает сигнал, а не время. Произведение спектров — путаница со свёрткой. Квадраты \\(a^2,b^2\\) появляются в энергии, а не в спектре. Интуиция: сколько каждого сигнала положил — столько каждого спектра и получил.", "usage": {"code": false, "without": "Инженер считает спектр суммы двух сигналов датчиков численно по сырым отсчётам каждый раз заново.", "with": "Он берёт готовые спектры каждого сигнала и складывает их с весами.", "benefit": "Спектр суммы получается без нового интегрирования"}, "img": {"src": "img/dsp_fourier_transform_properties/11.svg", "alt": "Два сигнала s1, s2 и их взвешенная сумма a·s1+b·s2 (анимация: коэффициенты меняются)"}}, {"q": "Сигнал задержали: \\(s(t-\\Delta t)\\). Как изменится спектральная плотность (time shift property)?", "options": ["\\(\\dot S(\\omega-\\Delta t)\\): весь спектр сдвинется по оси частот на \\(\\Delta t\\)", "\\(\\dot S(\\omega)\\,e^{-\\omega\\Delta t}\\): модуль затухнет на высоких частотах", "\\(\\dot S(\\omega)\\,e^{-j\\omega\\Delta t}\\): модуль тот же, к фазе добавится \\(-\\omega\\Delta t\\)", "\\(\\dot S(\\omega)-\\dot S(\\Delta t)\\): из спектра вычтется значение в точке \\(\\Delta t\\)"], "correct": 2, "explain": "Замена \\(t'=t-\\Delta t\\) в интеграле: \\(\\int s(t-\\Delta t)e^{-j\\omega t}dt=e^{-j\\omega\\Delta t}\\int s(t')e^{-j\\omega t'}dt'\\). Модуль \\(|e^{-j\\omega\\Delta t}|=1\\), поэтому амплитудный спектр не меняется, а фаза получает линейный наклон \\(-\\omega\\Delta t\\). Сдвиг по частоте — это другое свойство (модуляция). Без \\(j\\) экспонента стала бы вещественной и меняла бы модуль — так не бывает: задержка энергию не меняет. Вычитание \\(\\dot S(\\Delta t)\\) — та самая зачёркнутая попытка из домашки: \\(s(t-\\Delta t)\\ne s(t)-s(\\Delta t)\\). Интуиция: задержка не меняет «из чего» сигнал состоит, только «когда».", "usage": {"code": false, "without": "Инженер видит, что импульс лидара пришёл позже, и ищет изменения в амплитудном спектре — их нет.", "with": "Он знает, что задержка видна только в фазе: наклон фазы −ωΔt даёт время пролёта, а значит, дальность.", "benefit": "Время задержки читается из фазы спектра"}, "img": {"src": "img/dsp_fourier_transform_properties/12.svg", "alt": "Треугольный импульс сдвигается вправо на Δt (анимация), спектр — вопрос"}}, {"q": "Спектральная плотность сжатого или растянутого сигнала \\(s(at)\\), \\(a>0\\) (time scaling)?", "options": ["\\(\\dfrac{1}{a}\\,\\dot S\\!\\left(\\dfrac{\\omega}{a}\\right)\\)", "\\(a\\,\\dot S(a\\omega)\\)", "\\(\\dfrac{1}{a}\\,\\dot S(a\\omega)\\)", "\\(a\\,\\dot S\\!\\left(\\dfrac{\\omega}{a}\\right)\\)"], "correct": 0, "explain": "Замена \\(t'=at\\), \\(dt=dt'/a\\): \\(\\int s(at)e^{-j\\omega t}dt=\\frac1a\\int s(t')e^{-j(\\omega/a)t'}dt'=\\frac1a\\dot S(\\omega/a)\\); при любом знаке \\(a\\) — \\(\\frac{1}{|a|}\\dot S(\\omega/a)\\). При \\(a=2\\) сигнал вдвое короче: спектр растягивается по частоте (\\(\\omega/a\\)) и вдвое ниже (\\(1/a\\)) — площадь импульса упала вдвое. \\(\\dot S(a\\omega)\\) сжал бы спектр, то есть сделал бы его уже — противоположно правде. Множитель \\(a\\) вместо \\(1/a\\) противоречит проверке \\(\\dot S(0)=\\) площадь. Интуиция: короче во времени — шире по частоте и ниже.", "usage": {"code": false, "without": "Инженер ускоряет сканирование датчика вдвое и не расширяет полосу АЦП-фильтра — фронты импульсов размываются.", "with": "Он знает, что s(2t) имеет вдвое более широкий спектр, и удваивает полосу тракта.", "benefit": "Полоса тракта подбирается под скорость сигнала"}, "img": {"src": "img/dsp_fourier_transform_properties/13.svg", "alt": "Треугольный импульс s(t) и масштабированный s(at) (анимация сжатия/растяжения во времени)"}}, {"q": "Спектральная плотность произведения \\(s_1(t)\\,s_2(t)\\) при \\(\\dot S(\\omega)=\\int s\\,e^{-j\\omega t}dt\\)? Звёздочка \\(*\\) — свёртка.", "options": ["\\(\\dot S_1(\\omega)\\,\\dot S_2(\\omega)\\)", "\\(\\dot S_1(\\omega)*\\dot S_2(\\omega)\\)", "\\(\\dfrac{1}{2\\pi}\\,\\dot S_1(\\omega)\\,\\dot S_2(\\omega)\\)", "\\(\\dfrac{1}{2\\pi}\\,\\dot S_1(\\omega)*\\dot S_2(\\omega)\\)"], "correct": 3, "explain": "Произведению во времени отвечает свёртка (convolution) спектров: \\(\\frac{1}{2\\pi}\\int\\dot S_1(u)\\dot S_2(\\omega-u)du\\) — пункт d) домашки 20.09. Множитель \\(1/2\\pi\\) приходит из обратного преобразования, потому что мы работаем в \\(\\omega\\) (в герцах \\(f\\) его нет — отсюда соблазн его потерять). Просто произведение спектров отвечает свёртке во времени — это другая половина пары; добавленный к нему \\(1/2\\pi\\) дела не меняет. Интуиция: умножил сигнал на синус — спектр «размазался» вокруг частоты синуса, а размазывание и есть свёртка.", "usage": {"code": false, "without": "Инженер умножает сигнал датчика на окно Ханна и думает, что спектр просто умножится на спектр окна.", "with": "Он знает, что спектр сигнала свернётся со спектром окна, и ждёт расплывания пиков на ширину главного лепестка окна.", "benefit": "Эффект окна на спектр понятен заранее"}, "img": {"src": "img/dsp_fourier_transform_properties/14.svg", "alt": "Сигналы s1, s2 и их произведение; операция над спектрами — вопрос"}}, {"q": "Сигнал прошёл через линейную систему: \\(y(t)=s_1(t)*s_2(t)\\) — свёртка во времени. Чему равна \\(\\dot Y(\\omega)\\)?", "options": ["\\(\\dfrac{1}{2\\pi}\\,\\dot S_1(\\omega)*\\dot S_2(\\omega)\\)", "\\(\\dot S_1(\\omega)+\\dot S_2(\\omega)\\)", "\\(\\dot S_1(\\omega)\\,/\\,\\dot S_2(\\omega)\\)", "\\(\\dot S_1(\\omega)\\,\\dot S_2(\\omega)\\)"], "correct": 3, "explain": "Свёртке во времени отвечает произведение спектров: \\(\\int\\!\\!\\int s_1(u)s_2(t-u)du\\,e^{-j\\omega t}dt=\\dot S_1(\\omega)\\dot S_2(\\omega)\\) — без множителей. Это «зеркало» прошлого свойства: там произведение во времени давало свёртку спектров. Сумма спектров — это линейность для суммы сигналов. Деление — обращение системы (деконволюция), а не прохождение. Интуиция: система умножает каждую частоту входа на свой коэффициент передачи.", "usage": {"code": false, "without": "Инженер считает выход фильтра датчика свёрткой по тысячам отсчётов и упирается в скорость микроконтроллера.", "with": "Он умножает спектр сигнала на частотную характеристику фильтра (через БПФ) и возвращается во время.", "benefit": "Длинные свёртки считаются быстро через произведение спектров"}, "img": {"src": "img/dsp_fourier_transform_properties/15.svg", "alt": "Линейная система и анимация скольжения прямоугольника при свёртке s1 и s2"}}, {"q": "Спектральная плотность производной \\(\\dfrac{ds(t)}{dt}\\)?", "options": ["\\(\\dot S(\\omega)\\,/\\,(j\\omega)\\)", "\\(-j\\omega\\,\\dot S(\\omega)\\)", "\\(\\omega\\,\\dot S(\\omega)\\)", "\\(j\\omega\\,\\dot S(\\omega)\\)"], "correct": 3, "explain": "Продифференцируй обратное преобразование: \\(\\frac{d}{dt}\\frac{1}{2\\pi}\\int\\dot S e^{j\\omega t}d\\omega=\\frac{1}{2\\pi}\\int j\\omega\\dot S e^{j\\omega t}d\\omega\\). Каждая гармоника \\(e^{j\\omega t}\\) при дифференцировании умножается на \\(j\\omega\\). Деление на \\(j\\omega\\) — это интегрирование. Минус перепутан со знаком прямого преобразования. Без \\(j\\) пропал бы сдвиг фазы на 90°: производная синуса — косинус. Интуиция: производная усиливает высокие частоты пропорционально \\(\\omega\\) — поэтому дифференцирование шумного сигнала так шумит.", "usage": {"code": false, "without": "Инженер дифференцирует сигнал энкодера, чтобы получить скорость, и удивляется, что высокочастотный шум вырос в десятки раз.", "with": "Он знает, что производная умножает спектр на jω, и ставит перед ней фильтр нижних частот.", "benefit": "Шум дифференциатора предсказуем и подавляется заранее"}, "img": {"src": "img/dsp_fourier_transform_properties/16.svg", "alt": "Сигнал с движущейся касательной — производная ds/dt (анимация)"}}, {"q": "Спектральная плотность интеграла \\(\\int_{-\\infty}^{t}s(t')\\,dt'\\) при условии \\(\\dot S(0)=0\\)?", "options": ["\\(j\\omega\\,\\dot S(\\omega)\\)", "\\(\\dot S(\\omega)\\,/\\,\\omega^2\\)", "\\(\\dot S(\\omega)\\,/\\,(j\\omega)\\)", "\\(-\\dot S(\\omega)\\,/\\,(j\\omega)\\)"], "correct": 2, "explain": "Интегрирование — обратная операция к дифференцированию, поэтому множитель обратный: \\(1/(j\\omega)\\). Проверка: продифференцируй результат — получишь \\(j\\omega\\cdot\\dot S/(j\\omega)=\\dot S\\). Условие \\(\\dot S(0)=0\\) (нулевая площадь) нужно, чтобы интеграл снова затухал; иначе добавляется \\(\\pi\\dot S(0)\\delta(\\omega)\\). \\(j\\omega\\dot S\\) — производная. \\(1/\\omega^2\\) — это двойное интегрирование \\(1/(j\\omega)^2=-1/\\omega^2\\), да ещё с потерянным знаком. Минус — потерянный знак. Интуиция: интегратор — фильтр нижних частот, высокие частоты ослабляет как \\(1/\\omega\\).", "usage": {"code": false, "without": "Инженер интегрирует ускорение акселерометра в скорость и не понимает, откуда медленный дрейф.", "with": "Он знает, что интегратор усиливает низкие частоты как 1/ω, и убирает постоянную составляющую до интегрирования.", "benefit": "Дрейф интегрирования объясним и устраним"}, "img": {"src": "img/dsp_fourier_transform_properties/17.svg", "alt": "Сигнал нулевой площади и его накопленный интеграл, строящийся во времени (анимация)"}}, {"q": "Модуляция (modulation): спектральная плотность сигнала \\(s(t)\\cos\\omega_0t\\)?", "options": ["\\(\\tfrac12\\left[\\dot S(\\omega-\\omega_0)+\\dot S(\\omega+\\omega_0)\\right]\\)", "\\(\\dot S(\\omega-\\omega_0)+\\dot S(\\omega+\\omega_0)\\)", "\\(\\tfrac12\\left[\\dot S(\\omega-\\omega_0)-\\dot S(\\omega+\\omega_0)\\right]\\)", "\\(\\dot S(\\omega)\\cdot\\pi\\left[\\delta(\\omega-\\omega_0)+\\delta(\\omega+\\omega_0)\\right]\\)"], "correct": 0, "explain": "Распиши \\(\\cos\\omega_0t=\\frac12(e^{j\\omega_0t}+e^{-j\\omega_0t})\\). Умножение на \\(e^{j\\omega_0t}\\) сдвигает спектр на \\(+\\omega_0\\) (frequency shift), на \\(e^{-j\\omega_0t}\\) — на \\(-\\omega_0\\). Итог: две копии исходного спектра на \\(\\pm\\omega_0\\), каждая вдвое ниже. Без \\(\\frac12\\) — потерян множитель Эйлера. Разность копий — это спектр для \\(\\sin\\), и там ещё нужен \\(1/j\\). Произведение со спектром косинуса неверно: произведению во времени отвечает свёртка спектров, а не произведение. Интуиция: модуляция переносит спектр огибающей на несущую, поровну вверх и вниз.", "usage": {"code": false, "without": "Инженер ищет отражённый ультразвуковой импульс около нуля частот и не находит его — фильтр нижних частот отрезал всё.", "with": "Он знает, что спектр огибающей перенесён на ±40 кГц, и ставит полосовой фильтр вокруг несущей.", "benefit": "Фильтр приёмника стоит там, где сигнал на самом деле есть"}, "img": {"src": "img/dsp_fourier_transform_properties/18.svg", "alt": "Огибающая s(t), несущая cos ω0t и их произведение (анимация сдвига несущей)"}}, {"q": "Теорема Рэлея, или Парсеваля (Rayleigh/Parseval energy theorem), для одиночного импульса:", "options": ["\\(\\displaystyle\\int s^2(t)\\,dt=\\dfrac{1}{2\\pi}\\int|\\dot S(\\omega)|^2\\,d\\omega\\)", "\\(\\displaystyle\\int s^2(t)\\,dt=\\int|\\dot S(\\omega)|^2\\,d\\omega\\)", "\\(\\displaystyle\\int s^2(t)\\,dt=\\dfrac{1}{2\\pi}\\int\\dot S(\\omega)\\,d\\omega\\)", "\\(\\displaystyle\\int s(t)\\,dt=\\dfrac{1}{2\\pi}\\int|\\dot S(\\omega)|^2\\,d\\omega\\)"], "correct": 0, "explain": "Энергия, посчитанная во времени, равна энергии, посчитанной по спектру. Множитель \\(1/2\\pi\\) — тот же, что в обратном преобразовании (мы интегрируем по \\(\\omega\\)). Без него результат в \\(2\\pi\\) раз больше. Интеграл от \\(\\dot S\\) без квадрата — это \\(2\\pi s(0)\\), значение сигнала в нуле, а не энергия. Слева без квадрата стоит площадь, а она равна \\(\\dot S(0)\\). Для периодических сигналов то же равенство было в домашке 04.11: \\(P=(a_0/2)^2+\\sum C_n^2/2\\). Интуиция: энергия не зависит от того, в какой области её считать.", "usage": {"code": false, "without": "Инженер оценивает энергию шума датчика по спектру и ошибается в 6,28 раза, потеряв 1/2π.", "with": "Он считает энергию двумя путями — во времени и по спектру — и видит совпадение.", "benefit": "Энергия по спектру совпадает с энергией во времени"}, "img": {"src": "img/dsp_fourier_transform_properties/19.svg", "alt": "Площадь под s²(t) и площадь под |S(ω)|², между ними знак равенства с неизвестным множителем"}}, {"q": "Сдвиг по частоте: спектральная плотность сигнала \\(s(t)\\,e^{j\\omega_0t}\\)?", "options": ["\\(\\dot S(\\omega+\\omega_0)\\)", "\\(\\dot S(\\omega-\\omega_0)\\)", "\\(\\dot S(\\omega)\\,e^{j\\omega_0t}\\)", "\\(\\omega_0\\,\\dot S(\\omega)\\)"], "correct": 1, "explain": "\\(\\int s(t)e^{j\\omega_0t}e^{-j\\omega t}dt=\\int s(t)e^{-j(\\omega-\\omega_0)t}dt=\\dot S(\\omega-\\omega_0)\\): спектр сдвинулся вправо, на \\(+\\omega_0\\). Это зеркало свойства задержки: там множитель во времени давал сдвиг фазы, здесь множитель-экспонента во времени даёт сдвиг по частоте. \\(\\omega+\\omega_0\\) — сдвиг в другую сторону (так было бы для \\(e^{-j\\omega_0t}\\)). Ответ с \\(t\\) смешивает области: в спектре времени быть не может. Умножение на \\(\\omega_0\\) — не сдвиг. Интуиция: \\(\\dot S(\\omega-\\omega_0)\\) достигает в точке \\(\\omega_0\\) того, что было в нуле.", "usage": {"code": false, "without": "Инженер переносит сигнал IQ-приёмника и ошибается в знаке частоты: спектр уезжает в зеркальную сторону.", "with": "Он помнит: множитель e^(+jω₀t) сдвигает спектр на +ω₀, и выбирает знак гетеродина правильно.", "benefit": "Перенос спектра без зеркальных ошибок"}, "img": {"src": "img/dsp_fourier_transform_properties/20.svg", "alt": "Спектр S(ω) у нуля и отметка ω0 на оси частот: куда сместится спектр — вопрос"}}, {"q": "Прямоугольный импульс высотой \\(S_m\\) и длительностью \\(\\tau\\), от \\(-\\tau/2\\) до \\(\\tau/2\\). Его спектральная плотность (\\(\\mathrm{sinc}\\,x=\\sin x/x\\)):", "options": ["\\(S_m\\tau\\,\\mathrm{sinc}\\,\\omega\\tau\\)", "\\(S_m\\tau\\,\\mathrm{sinc}\\dfrac{\\omega\\tau}{2}\\)", "\\(S_m\\,\\mathrm{sinc}\\dfrac{\\omega\\tau}{2}\\)", "\\(S_m\\tau\\,\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}\\)"], "correct": 1, "explain": "\\(\\int_{-\\tau/2}^{\\tau/2}S_me^{-j\\omega t}dt=S_m\\frac{e^{j\\omega\\tau/2}-e^{-j\\omega\\tau/2}}{j\\omega}=\\frac{2S_m}{\\omega}\\sin\\frac{\\omega\\tau}{2}=S_m\\tau\\,\\frac{\\sin(\\omega\\tau/2)}{\\omega\\tau/2}\\). Проверка: \\(\\dot S(0)=S_m\\tau\\) — площадь. В варианте \\(\\mathrm{sinc}\\,\\omega\\tau\\) потеряна половина в аргументе: нули вышли бы вдвое чаще. Без \\(\\tau\\) не сходятся единицы (В вместо В·с) и площадь. \\(\\mathrm{sinc}^2\\) — спектр треугольника. Интуиция: прямоугольник во времени — «колокол с лепестками» по частоте.", "usage": {"code": false, "without": "Инженер выбирает полосу приёмника для прямоугольного импульса сонара наугад и теряет половину энергии.", "with": "Он знает, что |Ṡ| = S_mτ|sinc(ωτ/2)| с первым нулём на 2π/τ, и берёт полосу не уже главного лепестка.", "benefit": "Полоса приёмника подобрана под длительность импульса"}, "img": {"src": "img/dsp_fourier_transform_properties/21.svg", "alt": "Прямоугольный импульс от −τ/2 до τ/2 высотой Sm и график sinc x"}}, {"q": "Ширину спектра прямоугольного импульса длительностью \\(\\tau\\) считают до первого нуля \\(\\mathrm{sinc}\\): \\(\\Delta\\omega\\). Что верно (принцип неопределённости, uncertainty)?", "options": ["\\(\\Delta\\omega\\cdot\\tau=2\\pi\\): укоротишь импульс — спектр станет во столько же раз уже", "\\(\\Delta\\omega\\cdot\\tau=2\\pi\\): укоротишь импульс — спектр станет во столько же раз шире", "\\(\\Delta\\omega\\cdot\\tau=\\pi\\): укоротишь импульс — спектр станет во столько же раз шире", "\\(\\Delta\\omega=2\\pi\\tau\\): удлинишь импульс — спектр станет во столько же раз шире"], "correct": 1, "explain": "\\(\\mathrm{sinc}(\\omega\\tau/2)=0\\), когда \\(\\omega\\tau/2=\\pi\\), то есть \\(\\Delta\\omega=2\\pi/\\tau\\) и \\(\\Delta\\omega\\cdot\\tau=2\\pi\\) — постоянная. Значит, ширина спектра обратно пропорциональна длительности: «узкий импульс — широкий спектр», как записано на полях домашки. \\(\\pi\\) получается, если забыть двойку в аргументе \\(\\omega\\tau/2\\). \\(\\Delta\\omega=2\\pi\\tau\\) — перевёрнутая зависимость. Интуиция: чтобы собрать резкий короткий импульс, нужно много высоких частот.", "usage": {"code": false, "without": "Инженер укорачивает импульс лидара, чтобы точнее мерить дальность, и оставляет прежнюю полосу приёмника — импульс расплывается.", "with": "Он знает Δω·τ ≈ const и расширяет полосу во столько же раз, во сколько укоротил импульс.", "benefit": "Разрешение по дальности растёт без искажения импульса"}, "img": {"src": "img/dsp_fourier_transform_properties/22.svg", "alt": "Прямоугольный импульс длительностью τ и главный лепесток спектра с шириной Δω до первого нуля"}}, {"q": "Почему спектр треугольного импульса выражается через \\(\\mathrm{sinc}^2\\), а прямоугольного — через \\(\\mathrm{sinc}\\)?", "options": ["Треугольник — произведение двух прямоугольников длительностью \\(\\tau\\), а произведению отвечает произведение спектров", "У треугольника энергия \\(S_m^2\\tau/3\\), поэтому его спектральную плотность берут в квадрате", "Треугольник — свёртка двух прямоугольников длительностью \\(\\tau/2\\), а свёртке отвечает произведение спектров", "Треугольник — производная прямоугольника, а производной отвечает квадрат спектральной плотности"], "correct": 2, "explain": "Если свернуть прямоугольник длительностью \\(\\tau/2\\) сам с собой, получится треугольник длительностью \\(\\tau\\). Свёртке во времени отвечает произведение спектров, то есть \\(\\mathrm{sinc}\\cdot\\mathrm{sinc}=\\mathrm{sinc}^2\\), и аргумент \\(\\omega(\\tau/2)/2=\\omega\\tau/4\\). Произведение двух одинаковых прямоугольников — снова прямоугольник, не треугольник. Энергия к форме спектра не относится. Производная треугольника — два прямоугольника разных знаков, а не наоборот. Интуиция: каждая свёртка «сглаживает» сигнал и делает спектр быстрее спадающим.", "usage": {"code": false, "without": "Инженер считает спектр треугольного профиля движения привода интегралом по двум наклонным участкам и путается в знаках.", "with": "Он видит треугольник как свёртку двух прямоугольников и сразу пишет sinc² с аргументом ωτ/4.", "benefit": "Спектр сложного импульса получается из простых без интегрирования"}, "img": {"src": "img/dsp_fourier_transform_properties/23.svg", "alt": "Треугольный и прямоугольный импульсы со спектрами sinc² и sinc"}}, {"q": "Треугольный импульс высотой \\(S_m\\), от \\(-\\tau/2\\) до \\(\\tau/2\\): \\(\\tau\\) — полная длительность, как на рисунке в домашке 20.09. Какая формула верна?", "options": ["\\(\\dot S(\\omega)=\\dfrac{S_m\\tau}{2}\\,\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}\\)", "\\(\\dot S(\\omega)=S_m\\tau\\,\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}\\)", "\\(\\dot S(\\omega)=\\dfrac{S_m\\tau}{2}\\,\\mathrm{sinc}\\dfrac{\\omega\\tau}{4}\\)", "\\(\\dot S(\\omega)=\\dfrac{S_m\\tau}{2}\\,\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{2}\\)"], "correct": 0, "explain": "Проверка по \\(\\omega=0\\): \\(\\dot S(0)\\) — площадь треугольника \\(\\frac12\\cdot S_m\\cdot\\tau=S_m\\tau/2\\). В домашке 20.09 записано \\(S_m\\tau\\,\\mathrm{sinc}^2(\\omega\\tau/4)\\) — при \\(\\omega=0\\) это \\(S_m\\tau\\), вдвое больше площади: множитель \\(\\frac12\\) потерян (если бы \\(\\tau\\) была полудлительностью, было бы \\(S_m\\tau\\,\\mathrm{sinc}^2(\\omega\\tau/2)\\)). Здесь и дальше в тесте \\(\\tau\\) — полная длительность и формула с \\(\\frac12\\), как у Баскакова. Без квадрата — это прямоугольник. Аргумент \\(\\omega\\tau/2\\) отвечает треугольнику вдвое длиннее. Интуиция: треугольник — половина прямоугольника той же длительности по площади.", "usage": {"code": false, "without": "Инженер переписывает формулу спектра из конспекта и получает энергию треугольного импульса в 4 раза больше реальной.", "with": "Он проверяет формулу по Ṡ(0) = площадь и находит пропущенный множитель ½ до того, как тот попал в расчёт.", "benefit": "Ошибки конспекта ловятся одной подстановкой ω = 0"}, "img": {"src": "img/dsp_fourier_transform_properties/24.svg", "alt": "Треугольный импульс высотой Sm, полная длительность τ"}}, {"q": "Прямоугольный и треугольный импульсы одной полной длительности \\(\\tau\\). Чем отличаются их амплитудные спектры?", "options": ["У треугольника первый нуль при \\(4\\pi/\\tau\\), вдвое дальше, а лепестки спадают как \\(1/\\omega^2\\)", "У треугольника первый нуль при \\(\\pi/\\tau\\), вдвое ближе, а лепестки спадают как \\(1/\\omega^2\\)", "У треугольника первый нуль при \\(4\\pi/\\tau\\), вдвое дальше, а лепестки спадают как \\(1/\\omega\\)", "Нули у них одни и те же, \\(2\\pi k/\\tau\\), а различаются только высоты \\(\\dot S(0)\\)"], "correct": 0, "explain": "Прямоугольник: \\(\\mathrm{sinc}(\\omega\\tau/2)=0\\) при \\(\\omega=2\\pi/\\tau\\), лепестки \\(\\sim1/\\omega\\). Треугольник: \\(\\mathrm{sinc}^2(\\omega\\tau/4)=0\\) при \\(\\omega\\tau/4=\\pi\\), то есть \\(\\omega=4\\pi/\\tau\\), вдвое дальше; квадрат даёт спад \\(1/\\omega^2\\). Причина: у треугольника нет скачков, только изломы, а резкие перепады строятся именно высокими частотами. Вариант с \\(\\pi/\\tau\\) — ошибка в аргументе. Спад \\(1/\\omega\\) забывает про квадрат. Нули разные, потому что аргументы разные. Интуиция: чем глаже сигнал, тем быстрее падает его спектр.", "usage": {"code": false, "without": "Инженер управляет мотором прямоугольными импульсами тока и получает гул на высоких частотах.", "with": "Он сглаживает фронты до трапеции или треугольника — спектр начинает падать как 1/ω², и гул уходит.", "benefit": "Электромагнитные помехи снижаются выбором формы импульса"}, "img": {"src": "img/dsp_fourier_transform_properties/25.svg", "alt": "Прямоугольный и треугольный импульсы одной длительности τ и пустой график спектров"}}, {"q": "Экспоненциальный импульс \\(s(t)=S_me^{-\\alpha t}\\) при \\(t\\ge0\\) и 0 при \\(t<0\\), \\(\\alpha>0\\). Его спектральная плотность:", "options": ["\\(\\dfrac{S_m}{\\alpha-j\\omega}\\)", "\\(\\dfrac{S_m}{\\alpha^2+\\omega^2}\\)", "\\(\\dfrac{S_m}{\\alpha+j\\omega}\\)", "\\(\\dfrac{\\alpha S_m}{\\alpha+j\\omega}\\)"], "correct": 2, "explain": "\\(\\int_0^\\infty S_me^{-\\alpha t}e^{-j\\omega t}dt=S_m\\int_0^\\infty e^{-(\\alpha+j\\omega)t}dt=\\frac{S_m}{\\alpha+j\\omega}\\). Проверка: \\(\\dot S(0)=S_m/\\alpha\\) — площадь под экспонентой. Знак минус у \\(j\\omega\\) — от путаницы с обратным преобразованием (так выглядел бы спектр импульса, отражённого во времени). \\(\\alpha^2+\\omega^2\\) без \\(j\\) — это \\(|\\alpha+j\\omega|^2\\), квадрат модуля, а не сам знаменатель. Множитель \\(\\alpha\\) ломает размерность: \\(\\dot S\\) должна быть в В·с. Интуиция: экспонента — отклик RC-цепочки, и её спектр — частотная характеристика фильтра первого порядка.", "usage": {"code": false, "without": "Инженер моделирует разряд конденсатора в датчике и считает спектр численно по тысяче отсчётов.", "with": "Он пишет Ṡ = S_m/(α + jω) в одну строку и сразу видит частоту среза ω = α.", "benefit": "Спектр затухающего сигнала — одной формулой"}, "img": {"src": "img/dsp_fourier_transform_properties/26.svg", "alt": "Экспоненциальный импульс Sm·e^{−αt} при t ≥ 0"}}, {"q": "Для экспоненциального импульса \\(\\dot S(\\omega)=S_m/(\\alpha+j\\omega)\\). Найдите амплитудный \\(|\\dot S(\\omega)|\\) и фазовый \\(\\varphi(\\omega)\\) спектры (amplitude and phase spectra).", "options": ["\\(|\\dot S|=\\dfrac{S_m}{\\sqrt{\\alpha^2+\\omega^2}}\\), \\(\\varphi=-\\mathrm{arctg}\\dfrac{\\omega}{\\alpha}\\)", "\\(|\\dot S|=\\dfrac{S_m}{\\alpha+\\omega}\\), \\(\\varphi=-\\mathrm{arctg}\\dfrac{\\omega}{\\alpha}\\)", "\\(|\\dot S|=\\dfrac{S_m}{\\sqrt{\\alpha^2+\\omega^2}}\\), \\(\\varphi=+\\mathrm{arctg}\\dfrac{\\omega}{\\alpha}\\)", "\\(|\\dot S|=\\dfrac{S_m}{\\alpha^2+\\omega^2}\\), \\(\\varphi=-\\mathrm{arctg}\\dfrac{\\alpha}{\\omega}\\)"], "correct": 0, "explain": "Модуль дроби — модуль числителя на модуль знаменателя: \\(|\\alpha+j\\omega|=\\sqrt{\\alpha^2+\\omega^2}\\). Фаза дроби — фаза числителя (0) минус фаза знаменателя (\\(\\mathrm{arctg}(\\omega/\\alpha)\\)), отсюда минус. \\(\\alpha+\\omega\\) — сложили вещественную и мнимую части как числа. Плюс в фазе — забыли, что знаменатель вычитает фазу. \\(\\alpha^2+\\omega^2\\) без корня — это \\(|\\dot S|^2\\) с неверным числителем; \\(\\mathrm{arctg}(\\alpha/\\omega)\\) — дополнительный угол. Интуиция: на \\(\\omega=\\alpha\\) модуль падает в \\(\\sqrt2\\) раз, а фаза равна \\(-45^\\circ\\).", "usage": {"code": false, "without": "Инженер ставит RC-фильтр на датчик и ждёт, что на частоте среза сигнал упадёт вдвое — он падает лишь в 1,41 раза.", "with": "Он считает модуль через корень из суммы квадратов и знает про −45° на частоте среза.", "benefit": "АЧХ и ФЧХ простого фильтра считаются без ошибок"}, "img": {"src": "img/dsp_fourier_transform_properties/27.svg", "alt": "Формула S(ω)=Sm/(α+jω) и пустые графики амплитудного и фазового спектров"}}, {"q": "Дельта-импульс \\(\\delta(t)\\) — предельно короткий импульс единичной площади. Его спектральная плотность:", "options": ["\\(\\dot S(\\omega)=\\delta(\\omega)\\): весь спектр сосредоточен на нулевой частоте", "\\(\\dot S(\\omega)=0\\): у импульса нулевой длительности нет спектра", "\\(\\dot S(\\omega)=2\\pi\\delta(\\omega)\\): спектр — одна линия на \\(\\omega=0\\)", "\\(\\dot S(\\omega)=1\\): все частоты присутствуют с одинаковой плотностью"], "correct": 3, "explain": "Фильтрующее свойство: \\(\\int\\delta(t)e^{-j\\omega t}dt=e^{-j\\omega\\cdot0}=1\\). Это предел принципа неопределённости: длительность \\(\\to0\\), ширина спектра \\(\\to\\infty\\). Через прямоугольник: площадь \\(S_m\\tau=1\\), а \\(\\mathrm{sinc}(\\omega\\tau/2)\\to1\\) при \\(\\tau\\to0\\). Спектр \\(\\delta(\\omega)\\) или \\(2\\pi\\delta(\\omega)\\) — это постоянная, полная противоположность. Нулевой спектр противоречит \\(\\dot S(0)=\\) площадь \\(=1\\). Интуиция: удар молотком возбуждает все частоты конструкции сразу.", "usage": {"code": false, "without": "Инженер ищет резонансы рамы робота, прогоняя синусоиду по каждой частоте по очереди — час на один замер.", "with": "Он бьёт по раме молотком: короткий удар — почти δ-импульс с плоским спектром, и отклик за секунду показывает все резонансы.", "benefit": "Частотная характеристика снимается одним ударом"}, "img": {"src": "img/dsp_fourier_transform_properties/28.svg", "alt": "Прямоугольный импульс единичной площади, сужающийся и растущий по высоте (анимация), и спектр — вопрос"}}, {"q": "Постоянный сигнал \\(s(t)=S_0\\) на всей оси времени. Его спектральная плотность при \\(\\dot S(\\omega)=\\int s\\,e^{-j\\omega t}dt\\):", "options": ["\\(S_0\\): плотность одинакова на всех частотах \\(\\omega\\)", "\\(S_0\\,\\delta(\\omega)\\): линия на \\(\\omega=0\\) с площадью \\(S_0\\)", "\\(2\\pi S_0\\,\\delta(\\omega)\\): весь спектр сосредоточен на \\(\\omega=0\\)", "\\(0\\): у постоянного сигнала нет переменных составляющих"], "correct": 2, "explain": "Проверка обратным преобразованием: \\(\\frac{1}{2\\pi}\\int2\\pi S_0\\delta(\\omega)e^{j\\omega t}d\\omega=S_0\\) ✓. Постоянная не меняется — значит, в ней только нулевая частота; это двойственно дельте: \\(\\delta(t)\\leftrightarrow1\\), \\(1\\leftrightarrow2\\pi\\delta(\\omega)\\). Плоский спектр \\(S_0\\) — у дельты, а не у постоянной. \\(S_0\\delta(\\omega)\\) — верно в герцах (\\(S_0\\delta(f)\\)), но в \\(\\omega\\) теряется \\(2\\pi\\). Ноль неверен: нулевая частота — тоже частота, и она есть. Интуиция: «длинный сигнал — узкий спектр», бесконечно длинный — бесконечно узкий.", "usage": {"code": false, "without": "Инженер видит на спектре датчика давления огромный пик на нуле и думает, что это помеха.", "with": "Он понимает, что это постоянная составляющая — атмосферное давление, — и вычитает среднее до анализа.", "benefit": "Постоянная составляющая распознаётся и не мешает анализу"}, "img": {"src": "img/dsp_fourier_transform_properties/29.svg", "alt": "Постоянный сигнал S0 на всей оси времени и пустой график спектра"}}, {"q": "Сигнал из домашки 20.09: \\(s(t)=2\\cos(2\\pi\\cdot50t)+0{,}5\\cos(2\\pi\\cdot100t)\\) В. Как выглядит его двусторонний амплитудный спектр \\(|\\dot C_n|/2\\) (two-sided amplitude spectrum)?", "options": ["Линии по 2 В на \\(\\pm50\\) Гц и по 0,5 В на \\(\\pm100\\) Гц", "Линии по 1 В на \\(\\pm50\\) Гц и по 0,25 В на \\(\\pm100\\) Гц", "Линия 1 В на \\(+50\\) Гц и линия 0,25 В на \\(+100\\) Гц", "Линии по 1 В на \\(\\pm314\\) Гц и по 0,25 В на \\(\\pm628\\) Гц"], "correct": 1, "explain": "По Эйлеру \\(A\\cos\\omega_0t=\\frac A2e^{j\\omega_0t}+\\frac A2e^{-j\\omega_0t}\\): каждая косинусоида даёт две линии вдвое ниже, на \\(+f_0\\) и \\(-f_0\\). Значит, \\(2\\to1\\) на \\(\\pm50\\) Гц, \\(0{,}5\\to0{,}25\\) на \\(\\pm100\\) Гц. Высоты 2 и 0,5 — это односторонний спектр \\(C_n\\) (one-sided), рисуемый только при \\(f\\ge0\\). Двусторонний без отрицательных частот — потеряна половина. 314 и 628 — это \\(\\omega\\) в рад/с, подписанные как герцы. Интуиция: в двустороннем спектре каждая амплитуда делится поровну между \\(+f\\) и \\(-f\\).", "usage": {"code": false, "without": "Инженер видит на двустороннем БПФ наводку 50 Гц высотой 1 В и записывает в отчёт амплитуду 1 В — на деле 2 В.", "with": "Он помнит, что в двустороннем спектре амплитуда делится между ±f, и удваивает высоту линии.", "benefit": "Амплитуды помех оцениваются верно"}, "img": {"src": "img/dsp_fourier_transform_properties/30.svg", "alt": "Сумма двух косинусов 50 и 100 Гц во времени и пустая ось двустороннего спектра"}}, {"q": "Импульс задержали на \\(\\Delta t>0\\) — сдвинули вправо по оси времени. Студент записал множитель \\(e^{+j\\omega\\Delta t}\\). Как правильно?", "options": ["\\(e^{+j\\omega\\Delta t}\\): сдвиг вправо — значит, со знаком плюс", "\\(e^{-\\omega\\Delta t}\\): задержка гасит высокие частоты", "\\(e^{-j\\omega\\Delta t}\\): запаздыванию отвечает убывающая фаза", "\\(e^{-j\\Delta t}\\): множитель не зависит от частоты \\(\\omega\\)"], "correct": 2, "explain": "Задержанный сигнал — \\(s(t-\\Delta t)\\), минус стоит уже во времени; замена \\(t'=t-\\Delta t\\) даёт \\(e^{-j\\omega\\Delta t}\\). Ловушка «вправо — значит плюс» — путаница направления оси со знаком формулы: \\(e^{+j\\omega\\Delta t}\\) — это опережение \\(s(t+\\Delta t)\\). Без \\(j\\) множитель менял бы модуль, а задержка его не меняет. Без \\(\\omega\\) это постоянный поворот фазы, а не задержка: разные частоты задерживаются на одно время, значит, их фазы сдвигаются пропорционально частоте. Интуиция: высокая частота за то же время успевает провернуться на больший угол.", "usage": {"code": false, "without": "Инженер оценивает задержку сигнала в канале датчика по наклону фазы и получает отрицательное время — сигнал «пришёл раньше, чем ушёл».", "with": "Он помнит: запаздывание даёт фазу −ωΔt, и наклон −Δt пересчитывает во время задержки с правильным знаком.", "benefit": "Задержка по фазе измеряется с правильным знаком"}, "img": {"src": "img/dsp_fourier_transform_properties/31.svg", "alt": "Импульс задерживается вправо на Δt (анимация); запись студента e^{+jωΔt}"}}, {"q": "Как соотносится сигнал \\(s(2t)\\) с \\(s(t)\\) и что при этом происходит со спектром (пункт c домашки 20.09)?", "options": ["Он вдвое длиннее; спектр вдвое уже, а \\(\\dot S(0)\\) вдвое больше", "Он вдвое короче; спектр вдвое шире, а \\(\\dot S(0)\\) вдвое меньше", "Он вдвое короче; спектр вдвое уже, а \\(\\dot S(0)\\) вдвое больше", "Он вдвое выше; спектр той же ширины, а \\(\\dot S(0)\\) вдвое больше"], "correct": 1, "explain": "В \\(s(2t)\\) значение, которое раньше было при \\(t=1\\), теперь при \\(t=0{,}5\\): события наступают вдвое раньше, сигнал сжат. Площадь упала вдвое — \\(\\dot S(0)\\) вдвое меньше; по формуле \\(\\frac12\\dot S(\\omega/2)\\) спектр растянут по частоте вдвое. «Вдвое длиннее» — частая ошибка: кажется, что «2» растягивает. «Короче, но уже» нарушает принцип неопределённости. «Вдвое выше» — это \\(2s(t)\\), масштаб по амплитуде, а не по времени. Интуиция: проиграй запись вдвое быстрее — она короче и звучит выше.", "usage": {"code": false, "without": "Инженер вдвое ускоряет развёртку сканирующего датчика и ждёт, что спектр сигнала станет уже.", "with": "Он знает, что s(2t) короче и с вдвое более широким спектром, и расширяет полосу тракта.", "benefit": "Эффект ускорения процесса на спектр предсказан верно"}, "img": {"src": "img/dsp_fourier_transform_properties/32.svg", "alt": "Треугольный импульс s(t) и пустой график s(2t) с вопросом"}}, {"q": "Пункт d) домашки 20.09: студент записал, что спектр \\(s_1(t)\\,s_2(t)\\) равен \\(\\dot S_1(\\omega)\\,\\dot S_2(\\omega)\\). Что не так?", "options": ["Произведению во времени отвечает свёртка спектров с множителем \\(1/2\\pi\\)", "Всё верно: спектр произведения равен произведению спектров", "Нужно сложить: спектр произведения равен \\(\\dot S_1(\\omega)+\\dot S_2(\\omega)\\)", "Не хватает лишь множителя: верно \\(\\dot S_1(\\omega)\\,\\dot S_2(\\omega)/2\\pi\\)"], "correct": 0, "explain": "Свойства идут парами: свёртка во времени \\(\\leftrightarrow\\) произведение спектров, произведение во времени \\(\\leftrightarrow\\) свёртка спектров \\(\\frac{1}{2\\pi}\\dot S_1*\\dot S_2\\). Студент взял не ту половину пары. Сумма спектров — это линейность для суммы сигналов. «Добавить \\(1/2\\pi\\) к произведению» — не спасает: дело не в множителе, а в операции. Проверка на простом: \\(s(t)\\cdot1\\) — спектр единицы \\(2\\pi\\delta(\\omega)\\); произведение \\(\\dot S\\cdot2\\pi\\delta\\) дало бы одну точку, а свёртка \\(\\frac{1}{2\\pi}\\dot S*2\\pi\\delta=\\dot S\\) — верно. Интуиция: перемножение во времени «смешивает» частоты, это и есть свёртка.", "usage": {"code": false, "without": "Инженер оценивает спектр сигнала, «вырезанного» прямоугольным окном, как произведение спектров и не видит утечки по соседним частотам.", "with": "Он сворачивает спектр сигнала со спектром окна и заранее видит боковые лепестки sinc вокруг каждой линии.", "benefit": "Утечка спектра при окне предсказуема"}, "img": {"src": "img/dsp_fourier_transform_properties/33.svg", "alt": "Сигналы s1, s2, их произведение и вопрос об операции над спектрами"}}, {"q": "Для гармоники \\(a_n=-0{,}5\\), \\(b_n=0\\). Формула \\(\\psi_n=-\\mathrm{arctg}(b_n/a_n)\\) «в лоб» даёт 0°. Какие амплитуда \\(C_n\\ge0\\) и начальная фаза (initial phase) \\(\\psi_n\\) в записи \\(C_n\\cos(n\\omega_1t+\\psi_n)\\) верны?", "options": ["\\(C_n=0{,}5\\), \\(\\psi_n=0^\\circ\\)", "\\(C_n=0{,}5\\), \\(\\psi_n=180^\\circ\\)", "\\(C_n=-0{,}5\\), \\(\\psi_n=0^\\circ\\)", "\\(C_n=0{,}5\\), \\(\\psi_n=-90^\\circ\\)"], "correct": 1, "explain": "Как в разделе «Осторожно с фазой» разбора 04.11: \\(\\dot C_n=a_n-jb_n=-0{,}5\\) — точка на отрицательной вещественной полуоси, её угол \\(180^\\circ\\), а модуль \\(C_n=\\sqrt{a_n^2+b_n^2}=0{,}5\\). Калькулятор не знает четверти: \\(\\mathrm{arctg}(0/(-0{,}5))=\\mathrm{arctg}(-0)=0\\), и косинус выходит перевёрнутым. \\(C_n=-0{,}5\\) даёт тот же сигнал, но амплитуда по определению неотрицательна: минус уходит в фазу. \\(-90^\\circ\\) — это случай \\(a_n=0\\), \\(b_n>0\\). Интуиция: \\(-\\cos x=\\cos(x+180^\\circ)\\).", "usage": {"code": false, "without": "Инженер считает фазу гармоник вибрации через atan и получает фазовый спектр, перевёрнутый на половине частот.", "with": "Он использует atan2 (учёт четверти) и держит амплитуды неотрицательными, а минус переносит в фазу.", "benefit": "Фазовый спектр без скачков на 180° от калькулятора"}, "img": {"src": "img/dsp_fourier_transform_properties/34.svg", "alt": "Схема обозначений a_n, b_n, C_n (значения условные) и рамка «дано»: a_n=−0,5, b_n=0"}}, {"q": "Периодический сигнал чётный: \\(s(-t)=s(t)\\) — короткий путь с доски «\\(f(x)=f(-x)\\)». Что можно не считать?", "options": ["Все \\(a_n\\): они равны нулю, и ряд состоит из одних синусов", "Постоянную \\(a_0/2\\): у чётного сигнала она всегда равна нулю", "Чётные гармоники: у чётного сигнала есть только нечётные \\(n\\)", "Все \\(b_n\\): они равны нулю, и ряд состоит из одних косинусов"], "correct": 3, "explain": "\\(b_n=\\frac2T\\int s(t)\\sin n\\omega_1t\\,dt\\): чётная \\(s\\) на нечётный синус — нечётная функция, её интеграл по симметричному периоду ноль. Остаются косинусы, и \\(\\dot C_n=a_n\\) вещественны — фазы только \\(0^\\circ\\) или \\(180^\\circ\\). Синусы остаются у нечётного сигнала, это перепутано. \\(a_0/2\\) — среднее значение, у чётного сигнала оно может быть любым (у «домика» из домашки после сдвига к центру — 2/3). Только нечётные гармоники — свойство «полуволновой симметрии» \\(s(t+T/2)=-s(t)\\), а не чётности. Интуиция: косинус сам чётный — им и строится чётный сигнал.", "usage": {"code": false, "without": "Студент честно считает 10 интегралов bₙ для чётного сигнала и получает ноль везде, потратив полчаса.", "with": "Он сдвигает начало отсчёта к центру симметрии, сразу пишет bₙ = 0 и считает только aₙ.", "benefit": "Вдвое меньше интегралов при той же точности"}, "img": {"src": "img/dsp_fourier_transform_properties/35.svg", "alt": "Чётный периодический сигнал с парой точек в t и −t (анимация) и вопрос о коэффициентах"}}, {"q": "Студент считает энергию импульса по спектру как \\(E=\\frac{1}{2\\pi}\\int_0^\\infty|\\dot S(\\omega)|^2d\\omega\\) — только по положительным частотам. Что он получит?", "options": ["Всю энергию: отрицательных частот физически нет, их вклад нулевой", "Удвоенную энергию: положительные частоты посчитаны в формуле дважды", "Половину энергии: потерян вклад отрицательных частот, нужен множитель \\(1/\\pi\\)", "Энергию, делённую на \\(2\\pi\\): множитель \\(1/2\\pi\\) надо просто убрать"], "correct": 2, "explain": "Теорема Рэлея — интеграл по всей оси: \\(E=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\infty}|\\dot S|^2d\\omega\\). Для вещественного сигнала \\(|\\dot S|^2\\) чётна, поэтому половины равны, и \\(E=\\frac{1}{\\pi}\\int_0^\\infty|\\dot S|^2d\\omega\\). Отбросив отрицательные частоты без удвоения, получишь ровно \\(E/2\\). Отрицательные частоты — математическая половина каждой косинусоиды, их вклад не ноль. Удвоения нет нигде. Убрать \\(1/2\\pi\\) — значит получить \\(\\pi E\\). Интуиция: переходя к одной стороне, всегда удваивай.", "usage": {"code": false, "without": "Инженер оценивает по одностороннему спектру энергию сигнала удара и занижает её вдвое — порог срабатывания выставлен неверно.", "with": "Он интегрирует по положительным частотам с множителем 1/π и сверяет с энергией во времени.", "benefit": "Энергия по одностороннему спектру сходится с прямым расчётом"}, "img": {"src": "img/dsp_fourier_transform_properties/36.svg", "alt": "Энергетический спектр |S(ω)|² на всей оси и стрелка интегрирования только по ω>0"}}, {"q": "Прямоугольный импульс длительностью \\(\\tau=1\\) мс. Где первый нуль его спектра — в рад/с и в герцах?", "options": ["\\(\\omega=1000\\) рад/с, \\(f\\approx159\\) Гц", "\\(\\omega\\approx6283\\) рад/с, \\(f\\approx6{,}28\\) кГц", "\\(\\omega\\approx3142\\) рад/с, \\(f=0{,}5\\) кГц", "\\(\\omega\\approx6283\\) рад/с, \\(f=1\\) кГц"], "correct": 3, "explain": "Шаг 1: нуль \\(\\mathrm{sinc}(\\omega\\tau/2)\\) при \\(\\omega\\tau/2=\\pi\\), то есть \\(\\omega=2\\pi/\\tau=2\\pi\\cdot1000\\approx6283\\) рад/с. Шаг 2: \\(f=\\omega/2\\pi=1/\\tau=1\\) кГц. Вариант 1000 рад/с — подставили \\(1/\\tau\\) как \\(\\omega\\), а потом ещё раз разделили на \\(2\\pi\\). 6,28 кГц — забыли делить на \\(2\\pi\\), переходя к герцам (mixed ω and f). 3142 рад/с — потеряли двойку в аргументе \\(\\omega\\tau/2\\). Интуиция: в герцах всё проще — первый нуль на \\(1/\\tau\\).", "usage": {"code": false, "without": "Инженер ставит фильтр сонара с срезом 6,28 кГц вместо 1 кГц, путая рад/с и Гц, и пропускает в 6 раз больше шума.", "with": "Он переводит ω в f делением на 2π и ставит срез у 1/τ.", "benefit": "Полоса фильтра в правильных единицах"}, "img": {"src": "img/dsp_fourier_transform_properties/37.svg", "alt": "Прямоугольный импульс τ=1 мс и его спектр с отметкой первого нуля"}}, {"q": "Свойство интегрирования \\(\\int_{-\\infty}^{t}s\\,dt'\\leftrightarrow\\dot S(\\omega)/(j\\omega)\\) верно без поправки только при одном условии. Каком?", "options": ["\\(\\dot S(0)=1\\): площадь импульса равна единице, как у дельты", "\\(\\dot S(0)=0\\): площадь импульса нулевая, и интеграл снова затухает", "\\(s(0)=0\\): сигнал в момент \\(t=0\\) равен нулю", "Сигнал чётный, иначе множитель \\(1/(j\\omega)\\) даёт неверную фазу"], "correct": 1, "explain": "Если площадь не ноль, интеграл импульса стремится не к нулю, а к постоянной \\(\\dot S(0)\\) — получается «ступенька», у которой есть составляющая на \\(\\omega=0\\). Тогда формула \\(\\dot S/(j\\omega)\\) уходит в бесконечность при \\(\\omega\\to0\\), и к ней добавляют \\(\\pi\\dot S(0)\\delta(\\omega)\\). При \\(\\dot S(0)=0\\) (например, импульс «+1, потом −1», как сигнал 2 из разбора 04.11) интеграл — снова импульс, поправка не нужна. Площадь 1 — как раз плохой случай. Значение \\(s(0)\\) и чётность на это не влияют. Интуиция: интеграл помнит площадь навсегда.", "usage": {"code": false, "without": "Инженер интегрирует сигнал гироскопа со смещением нуля и получает угол, который бесконечно растёт.", "with": "Он видит ненулевую площадь — значит, интеграл не затухает; он вычитает смещение до интегрирования.", "benefit": "Дрейф угла понят как следствие ненулевой площади"}, "img": {"src": "img/dsp_fourier_transform_properties/38.svg", "alt": "Блоки s(t) → интеграл → S/(jω) и график 1/|ω| с особенностью в ω=0"}}, {"q": "Прямоугольный импульс, симметричный относительно \\(t=0\\): \\(\\dot S(\\omega)=S_m\\tau\\,\\mathrm{sinc}(\\omega\\tau/2)\\) — вещественная функция. Как выглядит фазовый спектр (phase spectrum)?", "options": ["Наклонная прямая \\(-\\omega\\tau/2\\): модуль фазы растёт с частотой", "Везде ноль: у вещественной \\(\\dot S(\\omega)\\) фазы нет совсем", "Везде \\(\\pi/2\\), потому что sinc выражается через синус", "0 на главном лепестке и \\(\\pm\\pi\\) на лепестках, где sinc отрицателен"], "correct": 3, "explain": "Вещественное число имеет фазу 0, если оно положительно, и \\(\\pi\\), если отрицательно. \\(\\mathrm{sinc}(\\omega\\tau/2)>0\\) на главном лепестке \\(|\\omega|<2\\pi/\\tau\\), на следующих лепестках знак чередуется — фаза скачет между 0 и \\(\\pm\\pi\\), а амплитудный спектр — \\(|\\mathrm{sinc}|\\) — состоит из положительных «горбов». Наклон \\(-\\omega\\tau/2\\) появится, если импульс начинается в нуле, а не центрирован: это сдвиг на \\(\\tau/2\\). «Везде ноль» теряет знак отрицательных лепестков. \\(\\pi/2\\) — фаза мнимого числа, а \\(\\dot S\\) здесь вещественна. Интуиция: минус у вещественного спектра — это поворот на 180°.", "usage": {"code": false, "without": "Инженер видит скачки фазы на 180° в спектре импульса и ищет неисправность в АЦП.", "with": "Он знает, что это знак лепестков sinc, а не ошибка, и проверяет только наклон фазы между скачками.", "benefit": "Нормальные скачки фазы не принимаются за сбой"}, "img": {"src": "img/dsp_fourier_transform_properties/39.svg", "alt": "Симметричный прямоугольный импульс и пустой график фазового спектра"}}, {"q": "На амплитудных спектрах двух прямоугольных импульсов первый нуль: у A — 2000 рад/с, у B — 500 рад/с. Какой импульс короче и во сколько раз?", "options": ["Импульс B короче в 4 раза", "Импульс A короче в 2 раза", "Импульс A короче в 4 раза", "Импульс B короче в 16 раз"], "correct": 2, "explain": "Первый нуль \\(\\omega_0=2\\pi/\\tau\\), значит, \\(\\tau=2\\pi/\\omega_0\\): у A \\(\\tau_A\\approx3{,}14\\) мс, у B \\(\\tau_B\\approx12{,}57\\) мс, отношение \\(2000/500=4\\). Шире спектр — короче импульс: A. «B короче» — перевёрнута связь длительности и ширины. «В 2 раза» — будто длительность обратно пропорциональна корню из ширины спектра, а это не так. «В 16 раз» — возвели отношение в квадрат. Интуиция: длительность обратно пропорциональна ширине спектра, ровно в той же пропорции.", "usage": {"code": false, "without": "Инженер по спектру двух импульсов лидара решает, что более широкий спектр — у более длинного импульса, и выбирает худший режим.", "with": "Он помнит τ = 2π/ω₀ и выбирает импульс с более широким спектром, то есть более короткий — с лучшим разрешением.", "benefit": "Длительность импульса читается со спектра"}, "img": {"src": "img/dsp_fourier_transform_properties/40.svg", "alt": "Два амплитудных спектра: первый нуль у A на 2000 рад/с, у B на 500 рад/с"}}, {"q": "Пункт a) домашки 20.09. Треугольные импульсы высоты \\(S_m\\) с полной длительностью \\(\\tau_1=\\tau\\) и \\(\\tau_2=3\\tau\\), спектр каждого \\(\\frac{S_m\\tau_i}{2}\\mathrm{sinc}^2\\frac{\\omega\\tau_i}{4}\\). Найдите спектральную плотность \\(2s_1(t)+3s_2(t)\\).", "options": ["\\(S_m\\tau\\left[2\\,\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}+9\\,\\mathrm{sinc}^2\\dfrac{3\\omega\\tau}{4}\\right]\\)", "\\(S_m\\tau\\left[\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}+1{,}5\\,\\mathrm{sinc}^2\\dfrac{3\\omega\\tau}{4}\\right]\\)", "\\(S_m\\tau\\left[\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}+4{,}5\\,\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{12}\\right]\\)", "\\(S_m\\tau\\left[\\mathrm{sinc}^2\\dfrac{\\omega\\tau}{4}+4{,}5\\,\\mathrm{sinc}^2\\dfrac{3\\omega\\tau}{4}\\right]\\)"], "correct": 3, "explain": "Шаг 1, линейность: \\(2\\dot S_1+3\\dot S_2\\). Шаг 2: \\(\\dot S_1=\\frac{S_m\\tau}{2}\\mathrm{sinc}^2\\frac{\\omega\\tau}{4}\\), \\(\\dot S_2=\\frac{3S_m\\tau}{2}\\mathrm{sinc}^2\\frac{3\\omega\\tau}{4}\\) — длительность \\(3\\tau\\) входит и в множитель, и в аргумент. Шаг 3: \\(2\\cdot\\frac12=1\\), \\(3\\cdot\\frac32=4{,}5\\). Проверка: \\(\\dot S(0)=5{,}5S_m\\tau\\) — сумма площадей \\(2\\cdot\\frac{S_m\\tau}{2}+3\\cdot\\frac{3S_m\\tau}{2}\\). Ответ с 2 и 9 — как в домашке, без \\(\\frac12\\) (вдвое больше площади). 1,5 — тройку длительности забыли в множителе. \\(\\omega\\tau/12\\) — делили длительность вместо умножения: длинный импульс должен иметь более узкий спектр. Интуиция: длинный импульс даёт высокий и узкий пик.", "usage": {"code": false, "without": "Инженер складывает спектры двух импульсов разной длительности, забывая, что длительность входит в высоту, и недооценивает вклад длинного импульса втрое.", "with": "Он подставляет длительность и в множитель, и в аргумент, а затем сверяет Ṡ(0) с суммой площадей.", "benefit": "Спектр смеси сигналов считается без потерь множителей"}, "img": {"src": "img/dsp_fourier_transform_properties/41.svg", "alt": "Два треугольных импульса длительностью τ и 3τ и их взвешенная сумма"}}, {"q": "Пункт b) домашки 20.09. Треугольный импульс \\(\\dot S(\\omega)=\\frac{S_m\\tau}{2}\\mathrm{sinc}^2\\frac{\\omega\\tau}{4}\\) задержали на \\(\\Delta t=1{,}5\\tau\\). Найдите модуль и фазу спектра на частоте \\(\\omega=\\pi/(3\\tau)\\).", "options": ["\\(|\\dot S|\\approx0{,}489\\,S_m\\tau\\), \\(\\varphi=+90^\\circ\\)", "\\(|\\dot S|\\approx0{,}489\\,S_m\\tau\\), \\(\\varphi=-90^\\circ\\)", "\\(|\\dot S|\\approx0{,}977\\,S_m\\tau\\), \\(\\varphi=-90^\\circ\\)", "\\(|\\dot S|\\approx0{,}489\\,S_m\\tau\\), \\(\\varphi=-60^\\circ\\)"], "correct": 1, "explain": "Шаг 1: модуль от задержки не зависит: \\(\\frac{\\omega\\tau}{4}=\\frac{\\pi}{12}\\), \\(\\mathrm{sinc}\\frac{\\pi}{12}=\\frac{\\sin15^\\circ}{\\pi/12}\\approx0{,}9886\\), квадрат \\(\\approx0{,}9774\\), умножить на \\(\\frac12\\): \\(\\approx0{,}489\\,S_m\\tau\\). Шаг 2: исходная \\(\\dot S\\) вещественна и положительна (\\(\\mathrm{sinc}^2\\ge0\\)) — её фаза 0. Шаг 3: задержка добавляет \\(-\\omega\\Delta t=-\\frac{\\pi}{3\\tau}\\cdot1{,}5\\tau=-\\frac{\\pi}{2}=-90^\\circ\\). \\(+90^\\circ\\) — ошибка знака у \\(e^{-j\\omega\\Delta t}\\). 0,977 — потерян множитель \\(\\frac12\\), как в формуле домашки. \\(-60^\\circ\\) — подставили \\(\\Delta t=\\tau\\) вместо \\(1{,}5\\tau\\). Интуиция: сдвиг не трогает высоту спектра, только поворачивает фазу.", "usage": {"code": false, "without": "Инженер ищет задержку эха по изменению амплитудного спектра и не находит её.  Симметричный треугольный импульс: \\(S_m=2\\) В, длительность \\(\\Delta t=3\\) мс. Найдите его энергию (energy).", "options": ["\\(E=2\\cdot10^{-3}\\) В²·с", "\\(E=3\\cdot10^{-3}\\) В²·с", "\\(E=12\\cdot10^{-3}\\) В²·с", "\\(E=4\\cdot10^{-3}\\) В²·с"], "correct": 3, "explain": "Шаг 1: на возрастающей половине \\(s(t)=\\frac{2S_m}{\\Delta t}t\\), \\(0\\le t\\le\\Delta t/2\\). Шаг 2: \\(E_1=\\int_0^{\\Delta t/2}\\frac{4S_m^2}{\\Delta t^2}t^2dt=\\frac{S_m^2\\Delta t}{6}\\). Шаг 3: спад симметричен, \\(E=2E_1=\\frac{S_m^2\\Delta t}{3}=\\frac{4\\cdot0{,}003}{3}=4\\cdot10^{-3}\\) В²·с. \\(2\\cdot10^{-3}\\) — забыли удвоить (только одна половина). \\(3\\cdot10^{-3}\\) — посчитали площадь \\(S_m\\Delta t/2\\), а не интеграл квадрата. \\(12\\cdot10^{-3}\\) — энергия прямоугольника \\(S_m^2\\Delta t\\). Интуиция: у линейного фронта средний квадрат — треть пикового квадрата.", "usage": {"code": false, "without": "Инженер оценивает энергию треугольного импульса тока как у прямоугольника и выбирает резистор втрое мощнее нужного.", "with": "Он считает E = S_m²Δt/3 и подбирает резистор по реальной энергии.", "benefit": "Компоненты выбираются по реальной энергии импульса"}, "img": {"src": "img/dsp_fourier_transform_properties/44.svg", "alt": "Симметричный треугольный импульс 2 В длительностью 3 мс"}}, {"q": "Домашка 11.10. Периодическая пила (sawtooth) растёт линейно от \\(-S_m\\) до \\(+S_m\\) за период \\(T\\) и сбрасывается. \\(S_m=3\\) В, \\(T=20\\) мс. Найдите среднюю мощность (average power) на 1 Ом.", "options": ["\\(P=4{,}5\\) В²", "\\(P=9\\) В²", "\\(P=3\\) В²", "\\(P=0{,}06\\) В²"], "correct": 2, "explain": "Шаг 1: \\(s(t)=\\frac{2S_m}{T}t-S_m\\) на \\(0\\le t<T\\). Шаг 2: \\(P=\\frac1T\\int_0^T s^2dt=S_m^2\\left(\\frac43-2+1\\right)=\\frac{S_m^2}{3}\\). Шаг 3: \\(P=\\frac{9}{3}=3\\) В² — от \\(T\\) не зависит. 4,5 — это \\(S_m^2/2\\), мощность синусоиды, а не пилы. 9 — \\(S_m^2\\), будто сигнал всё время на пике. 0,06 — забыли разделить на \\(T\\): \\(3\\cdot0{,}02\\)   function loadState() {
    try {

      if (raw) return JSON.parse(raw);

    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: работа над ошибками

    if (!drill) {

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  function cardHtml(q, answered) {

    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";

        else cls += " dim";
