<style>
  :root {

  html, body {

  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {

    background: var(--accent); color: white; cursor: pointer; font-weight: 600;

  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }

  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {

    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;

  .modal h3 { margin-top: 0; }

  @media (prefers-color-scheme: light) {

<script>
(function () {
  const TEST_ID = "dsp_fir_phase_correctors_and_hilbert";
  const QUESTIONS = [{"q": "Что такое групповая задержка τ(ω) линейной дискретной системы?", "options": ["время между подачей импульса на входе и появлением отклика на выходе фильтра", "логарифм модуля частотной характеристики системы на данной частоте", "производная фазочастотной характеристики по частоте, взятая с обратным знаком", "отношение амплитуд выходного и входного гармонических сигналов на данной частоте"], "correct": 2, "explain": "Групповая задержка равна -dφ(ω)/dω и показывает, на сколько отсчётов сдвигается по времени узкополосный пакет вблизи частоты ω; при нелинейной фазе задержка зависит от частоты, что и вызывает фазовые искажения (Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Без понятия групповой задержки инженер видит только плоскую АЧХ фильтра и не замечает, что разные частотные составляющие сигнала энкодера приходят на выход с разным сдвигом по времени.", "with": "Зная групповую задержку, он строит её график по частоте и сразу видит, где нужен фазовый корректор перед сложением каналов.", "benefit": "Позволяет обнаружить фазовые искажения до того, как они испортят сумму сигналов."}}, {"q": "Что представляет собой фазовый корректор, добавляемый в конец каскада ЛДС-фильтров?", "options": ["звено с амплитудной характеристикой около единицы, меняющее фазовую характеристику каскада", "фильтр нижних частот, ослабляющий высокочастотные составляющие фазовых искажений", "усилитель с изменяемым коэффициентом передачи, компенсирующий потери амплитуды в фильтре", "звено с амплитудной характеристикой около нуля в полосе задерживания, выравнивающее там фазу"], "correct": 0, "explain": "Фазовый корректор строится так, чтобы модуль его частотной характеристики был близок к единице во всей полосе частот, а фаза настраивалась отдельно — этим он отличается от обычного фильтра, меняющего и амплитуду (Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Без корректора инженер меняет порядок или коэффициенты основного фильтра, чтобы поправить фазу, и заодно портит уже настроенную АЧХ.", "with": "С корректором он добавляет отдельное звено после основного фильтра, которое трогает только фазу, не пересчитывая амплитудную характеристику заново.", "benefit": "Разделяет задачи коррекции амплитуды и фазы, упрощая настройку каскада."}}, {"q": "Какой должна быть идеальная частотная характеристика H(e^jω) дискретного преобразования Гильберта при -π < ω < π?", "options": ["знак частоты без мнимого множителя: +1 на положительных частотах и -1 на отрицательных", "j умножить на знак частоты: j на положительных частотах и -j на отрицательных", "комплексная экспонента e в степени минус j омега, дающая чистую задержку без излома АЧХ", "-j умножить на знак частоты: -j на положительных частотах и +j на отрицательных"], "correct": 3, "explain": "Идеальный преобразователь Гильберта сдвигает фазу каждой гармоники на -90 градусов при положительных частотах и на +90 градусов при отрицательных, не меняя модуль, то есть H(e^jω) = -j·sgn(ω) (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Не зная эту характеристику, разработчик пытается получить квадратурный сигнал простой задержкой на четверть периода, что работает только на одной частоте.", "with": "Зная её, он проектирует FIR-фильтр, приближающий именно -j·sgn(ω), и получает сдвиг на 90 градусов сразу во всей полосе сигнала.", "benefit": "Даёт правильную частотную цель для синтеза квадратурного канала."}}, {"q": "Чему равна импульсная характеристика h[n] идеального дискретного преобразователя Гильберта?", "options": ["2 делить на пи·n для чётных n, а для нечётных n значение равно нулю", "2 делить на пи·n для нечётных n, а для чётных n значение равно нулю", "1 делить на пи·n для всех целых n, кроме случая n, равного нулю", "синус от пи·n/2, делённый на пи·n, для всех целых n без исключений"], "correct": 1, "explain": "Обратное преобразование Фурье от -j·sgn(ω) даёт h[n] = 2/(πn) при нечётных n, а при чётных n (включая n = 0) значение равно нулю, что делает идеальный преобразователь Гильберта бесконечным и не каузальным (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Без этой формулы инженер обрезает импульсную характеристику наугад и получает фильтр с непредсказуемой ошибкой фазового сдвига.", "with": "Зная формулу 2/(πn) для нечётных n, он видит, какие отсчёты вообще ненулевые, и обрезает и взвешивает именно их окном.", "benefit": "Даёт точный вид характеристики, которую приближает FIR-фильтр конечной длины."}}, {"q": "Каким типом линейно-фазового FIR-фильтра реализуют преобразователь Гильберта конечной длины?", "options": ["тип второй, с симметричной импульсной характеристикой и чётным числом отсчётов", "фильтр с произвольной несимметричной импульсной характеристикой любой длины", "тип третий или четвёртый, с антисимметричной импульсной характеристикой", "тип первый, с симметричной импульсной характеристикой и нечётным числом отсчётов"], "correct": 2, "explain": "Преобразователь Гильберта имеет нечётную частотную характеристику, поэтому его импульсная характеристика должна быть антисимметричной — это соответствует линейно-фазовым типам III и IV, тогда как типы I и II дают симметричную характеристику (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Если взять симметричную импульсную характеристику типа I, полученный фильтр приближает косинусную, а не синусную фазовую характеристику, и квадратурная пара получается неверной.", "with": "Выбирая тип III или IV с антисимметричным h[n], инженер сразу получает нужный нечётный частотный отклик, близкий к -j·sgn(ω).", "benefit": "Гарантирует правильный тип симметрии импульсной характеристики ещё до расчёта коэффициентов."}}, {"q": "Как определяется аналитический сигнал x_a[n] по вещественному сигналу x[n]?", "options": ["сигнал, равный x[n] плюс j умножить на преобразование Гильберта от x[n]", "спектр X от e в степени j омега, взятый только для положительных частот", "сумма x[n] и его копии, сдвинутой на четверть периода несущей во времени", "сигнал, равный x[n] минус j умножить на задержанную копию x[n]"], "correct": 0, "explain": "Аналитический сигнал строится как x_a[n] = x[n] + j·x_hat[n], где x_hat[n] — преобразование Гильберта x[n]; его спектр не содержит отрицательных частот, что удобно для выделения огибающей и мгновенной фазы (Proakis & Manolakis, гл. 4).", "usage": {"code": false, "without": "Без аналитического сигнала инженер оценивает амплитуду вибрации по пиковым значениям x[n], и оценка скачет от периода к периоду.", "with": "Построив x[n] + j·x_hat[n], он берёт модуль этого комплексного сигнала в каждой точке и получает гладкую огибающую вибрации.", "benefit": "Даёт единый комплексный сигнал, из которого сразу читаются огибающая и фаза."}}, {"q": "Чему равна огибающая (мгновенная амплитуда) аналитического сигнала в точке n?", "options": ["среднему значению x[n], вычисленному на скользящем окне фиксированной длины", "разности между максимумом и минимумом x[n] на интервале одного периода несущей частоты", "модулю исходного сигнала x[n] без какой-либо дополнительной обработки", "квадратному корню из суммы квадратов x[n] и преобразования Гильберта x_hat[n]"], "correct": 3, "explain": "Огибающая — это модуль аналитического сигнала, |x_a[n]| равен корню из x[n]^2 + x_hat[n]^2; в отличие от модуля самого x[n], она не обнуляется между пиками колебания и не требует усреднения по окну (Proakis & Manolakis, гл. 4).", "usage": {"code": false, "without": "Оценивая амплитуду вибрации по модулю самого x[n], инженер видит быстро колеблющуюся кривую, которая обнуляется в каждом переходе через ноль.", "with": "Вычисляя корень из суммы квадратов x[n] и x_hat[n], он получает гладкую огибающую, меняющуюся только вместе с реальной амплитудой вибрации.", "benefit": "Даёт гладкую оценку амплитуды без обнуления на переходах через ноль."}}, {"q": "Как определяется мгновенная фаза аналитического сигнала в точке n?", "options": ["накопленная сумма всех предыдущих отсчётов x[n] с начала записи сигнала", "аргумент числа x[n] плюс j·x_hat[n], то есть арктангенс их отношения", "отношение амплитуды сигнала к его групповой задержке в данной точке", "разность фаз между входным и выходным сигналами фильтра на несущей частоте"], "correct": 1, "explain": "Мгновенная фаза — это аргумент комплексного числа x_a[n] = x[n] + j·x_hat[n], то есть arctan от x_hat[n]/x[n] с учётом квадранта; её производная по времени даёт мгновенную частоту (Proakis & Manolakis, гл. 4).", "usage": {"code": false, "without": "Без мгновенной фазы инженер оценивает частоту вращения резольвера только по периоду между переходами через ноль, теряя информацию внутри периода.", "with": "Вычисляя arctan от x_hat[n]/x[n] на каждом отсчёте, он получает непрерывную оценку угла и её производную — мгновенную частоту — на каждом отсчёте.", "benefit": "Даёт оценку фазы и частоты в каждой точке, а не только между переходами через ноль."}}, {"q": "Что устраняет из спектра классической амплитудной модуляции однополосная модуляция (SSB)?", "options": ["обе боковые полосы одновременно, оставляя только несущую частоту", "шумовые составляющие за пределами полосы модулирующего сигнала", "одну из боковых полос, оставляя лишь верхнюю либо нижнюю", "несущую частоту, оставляя обе боковые полосы без изменений"], "correct": 2, "explain": "При SSB одна из двух симметричных боковых полос АМ-сигнала подавляется — обычно с помощью преобразования Гильберта и квадратурной обработки — так что передаётся только верхняя или только нижняя полоса при той же информации (Proakis & Manolakis, гл. 4).", "usage": {"code": false, "without": "Передавая обе боковые полосы, инженер занимает вдвое больше полосы частот, чем нужно для той же информации.", "with": "Подавив одну боковую полосу с помощью квадратурного модулятора на основе преобразования Гильберта, он умещает тот же сигнал в вдвое более узкую полосу.", "benefit": "Вдвое сокращает занимаемую полосу частот при той же передаваемой информации."}}, {"q": "Что представляют собой квадратурные I/Q сигналы, описывающие узкополосный сигнал?", "options": ["синфазную и квадратурную составляющие огибающей, сдвинутые на девяносто градусов", "сигнал и его первую производную по времени, взятую в той же точке отсчёта", "сигнал и его копию, задержанную ровно на один период дискретизации сигнала", "две копии сигнала, перенесённые на удвоенную несущую частоту, без изменения их фазы"], "correct": 0, "explain": "I и Q — это синфазная и квадратурная составляющие комплексной огибающей узкополосного сигнала, сдвинутые друг относительно друга по фазе на 90 градусов; вместе они полностью описывают амплитуду и фазу несущей (Proakis & Manolakis, гл. 4).", "usage": {"code": false, "without": "Работая только с одним вещественным каналом сигнала резольвера, инженер не может отличить рост амплитуды от изменения фазы.", "with": "Получив пару I и Q через квадратурное демодулирование, он раздельно вычисляет амплитуду как модуль пары и угол как её фазу.", "benefit": "Разделяет амплитудную и фазовую информацию узкополосного сигнала на два независимых канала."}}, {"q": "Почему нелинейность фазовой характеристики фильтра проявляется как разброс групповой задержки по частоте и искажает форму широкополосного импульса, даже если АЧХ фильтра идеально плоская?", "options": ["Потому что групповая задержка совпадает с фазовой скоростью сигнала и поэтому пропорционально ослабляет высокие частоты импульса на выходе", "Потому что разные частотные составляющие импульса приходят на выход с разным временным сдвигом, и после суммирования форма импульса размывается", "Потому что нелинейная фаза увеличивает уровень боковых лепестков окна, которое было использовано при проектировании данного фильтра для обработки", "Потому что коэффициенты фильтра округляются с разной точностью на разных частотах, что вносит заметные амплитудные ошибки и искажает форму сигнала"], "correct": 1, "explain": "Групповая задержка равна минус производной фазы по частоте; если она разная на разных частотах, компоненты широкополосного сигнала приходят на выход в разное время и суммируются со сдвигом, размывая форму импульса даже при идеально ровной АЧХ. Округление коэффициентов и боковые лепестки окна к этому механизму отношения не имеют (Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Инженер видит рассинхронизацию каналов датчика после фильтрации и начинает менять АЧХ фильтра, хотя амплитудная характеристика уже в норме.", "with": "Понимая, что причина в разбросе групповой задержки, инженер сразу добавляет фазовый корректор вместо переделки амплитудного фильтра.", "benefit": "Экономит время отладки и не портит уже настроенную АЧХ."}}, {"q": "Оба типа антисимметричных линейно-фазовых FIR годятся для аппроксимации преобразования Гильберта, но тип III и тип IV ведут себя по-разному вблизи частоты Найквиста. В чём принципиальное отличие?", "options": ["Тип III требует чётного числа коэффициентов и поэтому не может быть реализован в аналитическом сигнале без дополнительной задержки", "Тип IV требует нечётного числа коэффициентов и поэтому даёт нулевой фазовый сдвиг вместо требуемых минус девяносто градусов", "Тип III обязан обращаться в нуль на частоте Найквиста, поэтому вносит дополнительную ошибку аппроксимации вблизи pi, а тип IV такого ограничения не имеет", "Тип IV обязан обращаться в нуль на частоте Найквиста, поэтому вносит дополнительную ошибку аппроксимации вблизи pi, а тип III такого ограничения не имеет"], "correct": 2, "explain": "Тип III линейно-фазового FIR по построению даёт нулевой отклик на частотах ноль и pi, поэтому вблизи Найквиста аппроксимация минус j синус-функции знака получается хуже, а тип IV такого ограничения не имеет и точнее работает у верхней границы полосы. Обратное утверждение про тип IV и доводы про чётность числа коэффициентов не являются причиной ограничения (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Инженер выбирает тип III для широкополосного преобразователя Гильберта и получает большую ошибку аппроксимации у верхней границы полосы.", "with": "Зная разницу типов, он сразу берёт тип IV для широкополосного применения.", "benefit": "Меньшая ошибка аппроксимации без увеличения порядка фильтра."}}, {"q": "Импульсная характеристика идеального дискретного преобразования Гильберта на нечётных отсчётах равна 2 делить на pi n, а на всех чётных отсчётах кроме нуля точно равна нулю. Какая математическая причина обнуления именно на чётных n?", "options": ["Обратное преобразование Фурье от минус j синус-функции знака содержит множитель единица минус косинус pi n, делённый на pi n; при чётном n косинус pi n равен единице, и числитель обращается в нуль", "Чётные отсчёты обнуляются из-за окна Хэмминга, которым усекают бесконечную идеальную характеристику перед практической реализацией фильтра, чтобы ограничить его длину и снизить уровень боковых лепестков спектра", "Чётные отсчёты отбрасываются намеренно на этапе дискретизации, чтобы вдвое сократить порядок фильтра без потери точности аппроксимации идеальной непрерывной характеристики преобразования Гильберта", "Обратное преобразование Фурье от минус j синус-функции знака содержит множитель единица плюс косинус pi n, делённый на pi n; при нечётном n косинус pi n равен минус единице, и числитель обращается в нуль"], "correct": 0, "explain": "Прямое вычисление обратного преобразования Фурье от минус j синус-функции знака даёт коэффициент вида единица минус косинус pi n, делённый на pi n; при чётном n косинус pi n равен единице и числитель обнуляется, а при нечётном n косинус pi n равен минус единице, и получается 2 делить на pi n. Окно и дискретизация тут ни при чём - это свойство самой идеальной характеристики (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Инженер пытается объяснить нулевые коэффициенты Гильберт-фильтра случайностью и подозревает ошибку в своём коде.", "with": "Зная происхождение формулы, он сразу проверяет только нечётные коэффициенты и уверен, что чётные обязаны быть нулевыми.", "benefit": "Быстрая проверка корректности реализации без лишней отладки."}}, {"q": "Аналитический сигнал строится как x плюс j умножить на преобразование Гильберта от x. Почему сложение исходного сигнала с его квадратурной парой именно в таком виде даёт спектр, отличный от нуля только на положительных частотах?", "options": ["Преобразование Гильберта сдвигает фазу положительных частот на плюс девяносто градусов, а отрицательных на минус девяносто, поэтому при сложении с исходным сигналом составляющие на положительных частотах взаимно уничтожаются", "Умножение на мнимую единицу j переносит весь спектр исходного сигнала на удвоенную несущую частоту, оставляя в результате только положительную половину оси частот без каких-либо дополнительных условий", "Сложение сигнала с его копией, задержанной ровно на четверть периода несущей, физически эквивалентно фильтрации нижних частот всей системы, что и обнуляет отрицательную полуось спектра", "Преобразование Гильберта сдвигает фазу отрицательных частот на плюс девяносто градусов, а положительных на минус девяносто, поэтому при сложении с исходным сигналом составляющие на отрицательных частотах взаимно уничтожаются"], "correct": 3, "explain": "Преобразование Гильберта сдвигает фазу на минус девяносто градусов для положительных частот и на плюс девяносто для отрицательных; при сложении x плюс j умножить на Гильберта от x множитель на отрицательных частотах превращается в единица минус единица и обнуляется, а на положительных - удваивается. Вариант с перепутанными знаками частот неверен (Proakis & Manolakis, гл. 11).", "usage": {"code": false, "without": "Инженер складывает сигнал с его преобразованием Гильберта наугад со знаком минус и получает подавление не той половины спектра.", "with": "Понимая механизм сокращения, он ставит правильный знак и получает нужный односторонний спектр.", "benefit": "Верный аналитический сигнал с первой попытки."}}, {"q": "Огибающая и мгновенная частота аналитического сигнала вычисляются из одной и той же комплексной записи x плюс j умножить на преобразование Гильберта от x. Чем принципиально отличаются эти две характеристики?", "options": ["Огибающая и мгновенная частота являются двумя разными названиями одной и той же физической величины и всегда совпадают для любого узкополосного сигнала на практике", "Огибающая равна модулю аналитического сигнала и описывает амплитуду, а мгновенная частота равна производной по времени от аргумента аналитического сигнала и описывает скорость изменения фазы", "Огибающая равна аргументу аналитического сигнала и описывает его фазу, а мгновенная частота равна модулю того же аналитического сигнала и описывает амплитуду сигнала", "Огибающая вычисляется только из исходного сигнала x, а мгновенная частота вычисляется только из преобразования Гильберта, без учёта аналитического сигнала целиком"], "correct": 1, "explain": "Огибающая - это модуль комплексного аналитического сигнала, характеризующий амплитуду, а мгновенная частота - производная его фазы по времени, характеризующая скорость вращения вектора на комплексной плоскости; это разные операции над одной и той же комплексной записью. Перепутывание модуля и аргумента в дистракторе - типичная ошибка (Proakis & Manolakis, гл. 11).", "usage": {"code": false, "without": "Инженер путает огибающую с мгновенной частотой и подаёт в детектор вибрации не ту величину.", "with": "Различая модуль и производную аргумента, он берёт именно нужную характеристику для детектора.", "benefit": "Верная диагностика амплитуды или частоты вибрации без путаницы величин."}}, {"q": "При формировании однополосного сигнала методом фазовращателя несущую модулируют сразу двумя ветвями: косинусной и синусной, куда подают сигнал и его преобразование Гильберта. Почему такая схема подавляет одну из боковых полос без отдельного полосового фильтра?", "options": ["Вычитание двух модулированных ветвей вдвое увеличивает амплитуду несущей частоты, из-за чего боковая полоса маскируется и перестаёт восприниматься демодулятором приёмника", "Умножение сигнала на преобразование Гильберта от несущей смещает весь спектр в область отрицательных частот, где вторая боковая полоса физически отсутствует", "Сложение двух модулированных ветвей с правильными знаками эквивалентно построению аналитического сигнала на несущей частоте, спектр которого односторонний и не содержит второй боковой полосы", "Синусная ветвь модулятора работает только на постоянном токе, поэтому переменная составляющая второй боковой полосы в эту ветвь совсем никогда не проходит дальше входа"], "correct": 2, "explain": "Косинусная и синусная ветви с сигналом и его преобразованием Гильберта после сложения дают комплексный сигнал с односторонним спектром, перенесённый на несущую, то есть фактически однополосный сигнал без отдельной фильтрации. Объяснения через амплитуду несущей или через постоянный ток к механизму подавления боковой полосы отношения не имеют (Proakis & Manolakis, гл. 11).", "usage": {"code": false, "without": "Инженер ставит отдельный узкополосный фильтр для подавления боковой полосы, увеличивая порядок системы.", "with": "Зная механизм фазового метода, он получает подавление боковой полосы одним сложением двух ветвей.", "benefit": "Меньше вычислений и короче цепочка обработки."}}, {"q": "Комплексное демодулирование узкополосного сигнала выполняют умножением на комплексную экспоненту минус j умножить на omega0 умножить на n и последующей фильтрацией низких частот отдельно для действительной и мнимой частей. Зачем нужна именно комплексная экспонента, а не просто косинус несущей?", "options": ["Умножение на комплексную экспоненту переносит весь спектр сигнала целиком к нулевой частоте без образования зеркальной составляющей, тогда как умножение на косинус создаёт две симметричные копии спектра", "Умножение на косинус несущей частоты физически невозможно реализовать в цифровом виде, поэтому комплексная экспонента остаётся единственным доступным вариантом реализации", "Комплексная экспонента полностью устраняет шум квантования АЦП, который обязательно присутствует при умножении сигнала на вещественный косинус несущей частоты в демодуляторе", "Умножение на комплексную экспоненту требует вдвое меньше вычислений, чем умножение на вещественный косинус несущей, за счёт использования только действительной арифметики процессора"], "correct": 0, "explain": "Комплексная экспонента переносит весь спектр сигнала целиком в одну сторону по оси частот без образования зеркальной копии, тогда как умножение на вещественный косинус по свойству модуляции всегда создаёт две симметричные копии спектра. Вычислительная экономия и шум квантования АЦП тут ни при чём (Proakis & Manolakis, гл. 11).", "usage": {"code": false, "without": "Инженер демодулирует узкополосный сигнал косинусом и получает лишнюю зеркальную копию спектра, которую потом приходится отдельно отфильтровывать.", "with": "Используя комплексную экспоненту, он сразу переносит спектр без зеркальной копии.", "benefit": "Меньше последующей фильтрации и проще тракт демодуляции."}}, {"q": "В приёмнике с подавлением зеркального канала косинусную и синусную ветви строят как квадратурную зеркальную пару фильтров, а не проектируют их по отдельности. Почему совместное проектирование обязательно?", "options": ["Совместное проектирование позволяет использовать один и тот же набор коэффициентов сразу для обеих ветвей квадратурной пары, что вдвое снижает число умножителей в готовой реализации", "Раздельное проектирование обеих ветвей прямо запрещено стандартом квадратурной модуляции и почти всегда приводит к неустойчивости обеих ветвей полученного итогового фильтра приёмника", "Совместное проектирование нужно только для аналоговых фильтров старого приёмника, а в цифровой реализации обе ветви можно проектировать полностью независимо друг от друга", "Только при согласованных амплитудных и фазовых характеристиках обеих ветвей во всей рабочей полосе точный сдвиг на девяносто градусов сохраняется на каждой частоте, что и обеспечивает подавление зеркальной полосы"], "correct": 3, "explain": "Точный сдвиг на девяносто градусов между ветвями I и Q должен сохраняться на каждой частоте рабочей полосы, а это возможно только при согласованном совместном проектировании амплитудных и фазовых характеристик обеих ветвей. Раздельное проектирование формально не запрещено, но не гарантирует такого согласования (Wanhammar, гл. 6).", "usage": {"code": false, "without": "Инженер проектирует ветви I и Q по отдельности и получает расхождение фазового сдвига на краях полосы, портящее подавление зеркального канала.", "with": "Проектируя пару совместно, он получает согласованный сдвиг на девяносто градусов во всей полосе.", "benefit": "Надёжное подавление зеркальной полосы во всём рабочем диапазоне."}}, {"q": "Синусную ветвь квадратурного тракта реализуют FIR-преобразователем Гильберта порядка N, а косинусную ветвь тем же сигналом без изменений. Почему в косинусную ветвь дополнительно вводят чистую задержку на N минус один делённое на два отсчётов?", "options": ["Задержка дополнительно снижает уровень квантования коэффициентов преобразователя Гильберта, заметно уменьшая накопленную ошибку округления при вычислениях", "FIR-преобразователь Гильберта сам задерживает сигнал на половину своего порядка, и без такой же задержки в другой ветви пары I и Q окажутся сдвинуты по времени друг относительно друга", "Чистая задержка компенсирует амплитудную неравномерность преобразователя Гильберта именно в полосе низких частот, где это ослабление становится максимальным", "Задержка нужна только для устойчивости всего каскада, поскольку без неё полюсы преобразователя Гильберта якобы выходят за пределы единичной окружности"], "correct": 1, "explain": "FIR-преобразователь Гильберта порядка N вносит групповую задержку N минус один делённое на два отсчётов; чтобы вторая ветвь квадратурной пары не отставала и не опережала первую, в неё вводят такую же чистую задержку. Устойчивость и квантование коэффициентов к этой задержке отношения не имеют, поскольку линейно-фазовый FIR всегда устойчив (Oppenheim & Schafer, гл. 7).", "usage": {"code": false, "without": "Инженер забывает задержку в косинусной ветви и получает рассинхронизированные I и Q, из-за чего демодулированная фаза резольвера прыгает.", "with": "Добавив задержку N минус один делённое на два, он выравнивает обе ветви по времени.", "benefit": "Стабильная и правильная фаза на выходе демодулятора."}}, {"q": "При синтезе FIR-корректора фазы методом наименьших квадратов задают желаемую комплексную частотную характеристику, а не только желаемую АЧХ, как при обычном проектировании низкочастотного FIR. В чём практическое следствие этого отличия?", "options": ["Импульсная характеристика корректора обязана быть строго симметричной, поскольку любая асимметрия сразу нарушает условие устойчивости фильтра", "Комплексная характеристика позволяет отказаться от вычисления коэффициентов вовсе и подобрать корректор перебором готовых секций из таблиц", "Импульсная характеристика корректора в общем случае не обязана быть симметричной или антисимметричной, поскольку линейность фазы больше не является целью синтеза", "Комплексная характеристика требует перехода к IIR-реализации, поскольку FIR-фильтр не может иметь произвольную фазовую характеристику"], "correct": 2, "explain": "Когда цель синтеза — заданная комплексная частотная характеристика, а не линейная фаза, импульсная характеристика корректора в общем случае перестаёт быть симметричной или антисимметричной. Условие симметрии было следствием требования линейной фазы, а не требованием устойчивости (Wanhammar, гл. 4).", "usage": {"code": false, "without": "Инженер по привычке требует симметричную импульсную характеристику от корректора и не может подобрать решение под заданную комплексную характеристику.", "with": "Отказавшись от требования симметрии, он находит корректор, точно попадающий в заданную комплексную характеристику.", "benefit": "Более точный корректор без искусственных ограничений на форму фильтра."}}, {"q": "Нужно спроектировать FIR-преобразователь Гильберта, работающий от почти нулевой частоты до частоты, близкой к Найквисту, без обнуления коэффициента передачи на этих краях полосы. Какой линейно-фазовый тип FIR подходит?", "options": ["Тип I, симметричная импульсная характеристика нечётной длины", "Тип II, симметричная импульсная характеристика чётной длины", "Тип III, антисимметричная импульсная характеристика нечётной длины", "Тип IV, антисимметричная импульсная характеристика чётной длины"], "correct": 3, "explain": "Тип IV антисимметричен и обнуляет передачу только на нулевой частоте, поэтому пригоден вплоть до Найквиста; тип III тоже антисимметричен, но обнуляет передачу и на нуле, и на Найквисте, что не подходит для преобразователя Гильберта на всей полосе. Типы I и II симметричны и не дают нужного сдвига фазы на девяносто градусов. (Proakis, гл. 10)", "usage": {"code": false, "without": "Инженер без разбора типов FIR берёт тип III и обнаруживает провал передачи преобразователя у верхнего края рабочей полосы.", "with": "Зная связь антисимметрии и положения нулей передаточной функции, он сразу выбирает тип IV и покрывает всю полосу без провала.", "benefit": "Преобразователь Гильберта работает равномерно до самого верхнего края полосы."}}, {"q": "На выходе передатчика нужен однополосный сигнал с подавленной верхней боковой полосой, а острый фильтр на несущей частоте недоступен по вычислительным ресурсам. Какой метод синтеза выбрать?", "options": ["Выполнить обычную амплитудную модуляцию и вырезать боковую полосу идеальным фильтром", "Построить аналитический сигнал преобразованием Гильберта и сдвинуть его модуляцией", "Увеличить порядок обычного полосового FIR-фильтра до подавления боковой полосы", "Продублировать сигнал на двух частотах дискретизации и вычесть спектры"], "correct": 1, "explain": "Аналитический сигнал, составленный из исходного сигнала и его преобразования Гильберта, содержит только положительные частоты; сдвиг такого сигнала модуляцией комплексной экспонентой даёт однополосный сигнал без острого фильтра на несущей. Вариант с идеальным фильтром на несущей физически нереализуем при конечном порядке. (Proakis, гл. 11)", "usage": {"code": false, "without": "Без метода Гильберта инженер закладывает в проект нереализуемый идеальный фильтр на несущей и срывает срок.", "with": "Используя аналитический сигнал, он получает однополосный сигнал простым комплексным умножением.", "benefit": "Однополосная передача реализуется без острого фильтра на несущей частоте."}}, {"q": "В квадратурном демодуляторе резольвера прямой канал берут без изменений, а второй получают тем же сигналом после FIR-преобразователя Гильберта. При проверке огибающая пульсирует на удвоенной частоте несущей. Что нужно исправить в структуре?", "options": ["Заменить преобразователь Гильберта фильтром с вдвое большей полосой пропускания", "Понизить частоту дискретизации прямого канала перед сложением сигналов", "Добавить в прямой канал задержку, равную групповой задержке Гильберта", "Заменить сложение каналов вычитанием их модулей перед вычислением огибающей"], "correct": 2, "explain": "Аналитический сигнал требует точного совпадения по времени прямого и Гильберт-канала; FIR-преобразователь Гильберта вносит групповую задержку, равную половине его порядка, поэтому прямой канал нужно задержать на столько же отсчётов чистой линией задержки. Без этого фазовое рассогласование каналов создаёт пульсацию огибающей на удвоенной частоте сигнала. (Oppenheim & Schafer, гл. 7)", "usage": {"code": false, "without": "Не выровняв задержки каналов, инженер получает на выходе демодулятора резольвера дрожащий угол поворота вала.", "with": "Добавив линию задержки в прямой канал, он получает гладкую оценку угла без пульсаций.", "benefit": "Оценка угла резольвера становится стабильной на каждом обороте вала."}}, {"q": "Известна фазочастотная характеристика тракта с почти постоянной АЧХ на рабочей полосе. Нужно скомпенсировать фазу каскадным FIR-звеном, не меняя амплитуду. Как задать желаемую характеристику при синтезе корректора?", "options": ["Задать комплексную характеристику с фазой, обратной измеренной, и найти коэффициенты МНК", "Задать вещественную АЧХ, равную единице на всей полосе, и синтезировать фильтр окном", "Задать импульсную характеристику тракта задом наперёд и использовать без изменений", "Задать нулевую фазу на всей полосе и подобрать порядок по формуле Кайзера"], "correct": 0, "explain": "Фазовый корректор проектируют по желаемой комплексной частотной характеристике единичного модуля и фазы, обратной измеренной фазе тракта, аппроксимируя её методом наименьших квадратов; метод окон по вещественной АЧХ не учитывает фазу вовсе. Обнуление фазы игнорирует саму задачу коррекции. (Wanhammar, гл. 6)", "usage": {"code": false, "without": "Проектируя корректор по одной лишь АЧХ, инженер получает фильтр с плоской амплитудой, но с той же фазовой нелинейностью.", "with": "Задав комплексную цель с обратной фазой, он получает каскад, выравнивающий фазу без искажения амплитуды.", "benefit": "Тракт получает почти линейную фазу без изменения общей амплитудной характеристики."}}, {"q": "Нужно оценивать мгновенную частоту вибрационного сигнала с медленно меняющейся частотой на каждом отсчёте с малой задержкой. Какой способ на основе аналитического сигнала выбрать?", "options": ["Посчитать число пересечений нуля исходного сигнала за фиксированное окно отсчётов", "Взять модуль аналитического сигнала и продифференцировать полученную огибающую по времени", "Применить дискретное преобразование Фурье к квадрату исходного сигнала на окне", "Вычислить производную развёрнутой мгновенной фазы аналитического сигнала по времени"], "correct": 3, "explain": "Мгновенная частота определяется как производная по времени от развёрнутой мгновенной фазы аналитического сигнала и доступна на каждом отсчёте. Подсчёт пересечений нуля даёт лишь среднюю частоту за окно с задержкой в целое окно, а дифференцирование огибающей описывает скорость изменения амплитуды, а не частоты. (Proakis, гл. 11)", "usage": {"code": false, "without": "Считая пересечения нуля, инженер получает частоту с задержкой в целый период и грубым разрешением.", "with": "Дифференцируя развёрнутую фазу аналитического сигнала, он получает мгновенную частоту на каждом отсчёте.", "benefit": "Изменение частоты вибрации отслеживается без задержки на целый период колебания."}}, {"q": "Резольвер выдаёт синусный и косинусный сигналы несущей частоты, амплитуда которых модулирована углом поворота вала. Нужно выделить угол в реальном времени с малой задержкой. Какой метод демодуляции выбрать?", "options": ["Выпрямить оба канала диодным детектором и вычислить их разность амплитуд", "Перемножить каналы на квадратурные опорные сигналы несущей и взять арктангенс", "Применить к каждому каналу преобразование Гильберта и сложить полученные огибающие", "Проинтегрировать оба канала за период несущей и перемножить результаты интегрирования"], "correct": 1, "explain": "Синхронное квадратурное демодулирование перемножает синусный и косинусный каналы резольвера на опорные квадратурные сигналы несущей, после чего арктангенс отношения даёт угол поворота вала с минимальной задержкой. Выпрямление теряет информацию о знаке и фазе, а сложение огибающих не восстанавливает угол. (Tan & Jiang, гл. 12)", "usage": {"code": false, "without": "Выпрямляя каналы диодным детектором, инженер теряет знак угла и получает неоднозначный результат.", "with": "Перемножая каналы на квадратурные опорные сигналы и беря арктангенс, он получает однозначный угол в реальном времени.", "benefit": "Угол поворота вала определяется без задержки и без потери знака направления."}}, {"q": "Нужно непрерывно оценивать амплитуду узкополосного сигнала на каждом отсчёте, без задержки на целый период колебания. Какой подход даёт такую оценку?", "options": ["Найти максимум сигнала в скользящем окне длиной ровно в период колебания", "Усреднить абсолютное значение сигнала за несколько последних периодов колебания", "Вычислить модуль аналитического сигнала, полученного преобразованием Гильберта", "Посчитать среднеквадратичное значение сигнала за фиксированный интервал наблюдения"], "correct": 2, "explain": "Огибающая как модуль аналитического сигнала, полученного через преобразование Гильберта, вычисляется на каждом отсчёте с задержкой, равной лишь групповой задержке фильтра. Поиск максимума, усреднение модуля и среднеквадратичное значение требуют накопления данных за целый период или несколько периодов, что увеличивает задержку и сглаживает переходные всплески. (Proakis, гл. 11)", "usage": {"code": false, "without": "Усредняя сигнал за несколько периодов, инженер видит скачок амплитуды вибрации только спустя эти периоды.", "with": "Вычисляя огибающую через аналитический сигнал, он видит скачок амплитуды почти сразу после его появления.", "benefit": "Резкое изменение амплитуды вибрации обнаруживается без задержки на целый период."}}, {"q": "После синтеза FIR-корректора фазы методом МНК на комплексную частотную характеристику получившийся фильтр оказался физически нереализуем без задержки. Как обычно устраняют эту проблему?", "options": ["Вводят в целевую характеристику линейный фазовый сдвиг на нужную задержку", "Обнуляют высокочастотную часть желаемой фазовой характеристики перед аппроксимацией", "Заменяют желаемую фазу на её значение по модулю без учёта знака по всей полосе", "Уменьшают порядок фильтра до тех пор, пока задержка не станет нулевой"], "correct": 0, "explain": "Причинный FIR-фильтр реализуем только с внесённой общей задержкой, поэтому в желаемую комплексную характеристику добавляют линейный фазовый член, соответствующий целому числу отсчётов задержки, что делает цель аппроксимации реализуемой. Обнуление части фазы или снятие знака искажают саму коррекцию, а нулевая задержка для причинного корректора недостижима. (Wanhammar, гл. 6)", "usage": {"code": false, "without": "Не заложив задержку в цель, инженер получает после синтеза формально нереализуемый фильтр с нулевой задержкой.", "with": "Добавив линейный фазовый сдвиг под фиксированную задержку, он получает реализуемый причинный корректор.", "benefit": "Корректор фазы становится реализуемым причинным фильтром с известной общей задержкой."}}, {"q": "При квадратурном комплексном демодулировании узкополосного сигнала после умножения на опорные косинус и синус несущей на выходе остаётся составляющая на удвоенной частоте несущей. Что нужно добавить в тракт для получения чистых сигналов I и Q?", "options": ["Сложить каналы I и Q перед дальнейшей цифровой обработкой сигнала", "Увеличить частоту дискретизации входного сигнала перед перемножением на несущую", "Заменить опорные сигналы на их удвоенную по частоте версию несущей", "Пропустить оба перемноженных канала через одинаковые фильтры низких частот"], "correct": 3, "explain": "После перемножения на квадратурные опорные сигналы несущей спектр содержит нужную составляющую в основной полосе и паразитную составляющую на удвоенной частоте несущей; одинаковые фильтры низких частот на обоих каналах убирают эту составляющую, сохраняя фазовое соответствие I и Q. Сложение каналов или изменение частоты дискретизации не убирают эту составляющую. (Proakis, гл. 11)", "usage": {"code": false, "without": "Без фильтров низких частот на выходе демодулятора остаётся высокочастотная наводка на удвоенной несущей.", "with": "Поставив одинаковые фильтры низких частот на оба канала, инженер получает чистые сигналы I и Q в основной полосе.", "benefit": "Сигналы I и Q свободны от паразитной составляющей на удвоенной частоте несущей."}}, {"q": "Пару FIR-фильтров с одинаковой АЧХ, но со сдвигом фазы на девяносто градусов между ними, используют, чтобы разделить сигнал на составляющие с положительной и отрицательной частотой. Что произойдёт, если групповые задержки этих двух фильтров окажутся разными?", "options": ["АЧХ обоих фильтров пропорционально сузится на одинаковую относительную величину", "Разделение частот нарушится, появится просачивание из противоположной полосы", "Фильтры полностью потеряют избирательность и превратятся в обычные полосовые", "Выходной сигнал сместится по амплитуде без изменения частотного состава"], "correct": 1, "explain": "Разделение на положительные и отрицательные частоты в квадратурной паре опирается на точное соотношение фаз в девяносто градусов и совпадающую групповую задержку каналов; при рассогласовании задержек фазовое соотношение нарушается, и в каждой полосе появляется просачивание из противоположной полосы. Форма АЧХ и избирательность фильтров при этом не меняются. (Oppenheim & Schafer, гл. 7)", "usage": {"code": false, "without": "Не выровняв задержки пары фильтров, инженер получает утечку сигнала из зеркальной полосы частот.", "with": "Выровняв групповые задержки пары, он получает чистое разделение положительных и отрицательных частот.", "benefit": "Составляющие с положительной и отрицательной частотой разделяются без взаимного просачивания."}}, {"q": "После проектирования эллиптического ИИР-фильтра в тракте энкодера обнаружена сильно нелинейная ФЧХ вблизи среза, что портит оценку скорости по фазе. Каким способом это обычно исправляют, не переделывая уже готовый ИИР-фильтр?", "options": ["Добавить FIR-корректор фазы с плоской АЧХ", "Удвоить порядок фильтра для узкой полосы", "Заменить окно внутри готового ИИР-фильтра", "Повысить частоту дискретизации без смены фильтра"], "correct": 0, "explain": "FIR-корректор с амплитудой около единицы добавляют каскадом после ИИР-фильтра именно чтобы выправить ФЧХ, не трогая уже рассчитанные полюсы и нули. Повышение порядка или частоты дискретизации фазу не выравнивает. (Proakis, гл. 10)", "usage": {"code": false, "without": "Без корректора скорость, посчитанная по фазе сигнала энкодера, дрожит и запаздывает на разных частотах движения.", "with": "С FIR-корректором фаза выравнивается почти линейно и оценка скорости становится стабильной.", "benefit": "Точная оценка скорости без переделки уже отлаженного ИИР-фильтра."}}, {"q": "Инженер синтезирует FIR-корректор фазы для канала IMU методом наименьших квадратов по комплексной частотной характеристике, но точность коррекции на краях полосы недостаточна. Что стоит сделать в первую очередь, не меняя сам метод синтеза?", "options": ["Убрать целевую задержку, оставив только фазу", "Снизить порядок корректора ради экономии времени", "Заменить комплексную характеристику на амплитуду", "Увеличить длину корректора вместе с задержкой"], "correct": 3, "explain": "Точность аппроксимации произвольной ФЧХ методом МНК растёт с длиной фильтра, а разумная задержка в целевой характеристике облегчает синтез каузального корректора. Сокращение порядка или отказ от задержки только ухудшает результат. (Oppenheim, гл. 7)", "usage": {"code": false, "without": "Короткий корректор без запаса задержки даёт заметную ошибку фазы IMU именно там, где нужна точность.", "with": "Более длинный корректор с заложенной задержкой выравнивает фазу по всей рабочей полосе IMU.", "benefit": "Предсказуемая точность коррекции фазы вместо случайного промаха на краях полосы."}}, {"q": "Резольвер выдаёт синусный и косинусный сигналы положения ротора с амплитудно-модулированной несущей. Для восстановления мгновенного угла применяют комплексное демодулирование одного из каналов. Какой сигнал строится на этом шаге?", "options": ["Автокорреляционная функция сигнала за один период", "Аналитический сигнал из сигнала и Гильберт-пары", "Сумма двух косинусов удвоенной частоты несущей", "Разность огибающих синусного и косинусного каналов"], "correct": 1, "explain": "Комплексное демодулирование строит аналитический сигнал из исходного сигнала и его пары по Гильберту, чья мгновенная фаза даёт угол поворота ротора. Автокорреляция и удвоенная частота к этой задаче отношения не имеют. (Proakis, гл. 11)", "usage": {"code": false, "without": "Без аналитического сигнала фазу приходится вычислять по двум отдельным каналам с риском рассогласования.", "with": "Аналитический сигнал даёт мгновенную фазу напрямую из одного канала одним преобразованием.", "benefit": "Более простое и устойчивое извлечение угла ротора резольвера."}}, {"q": "При синтезе FIR-преобразователя Гильберта идеальную импульсную характеристику 2 на пи n для нечётных n просто обрезали прямоугольным окном до 31 отсчёта. Что произойдёт с амплитудной характеристикой корректора вблизи краёв рабочей полосы?", "options": ["Фаза перестанет сдвигаться на девяносто градусов", "Задержка корректора обнулится независимо от длины", "Появятся заметные пульсации Гиббса у краёв", "АЧХ станет идеально плоской из-за симметрии"], "correct": 2, "explain": "Резкое усечение медленно убывающей характеристики 2 на пи n прямоугольным окном даёт классическое явление Гиббса - пульсации АЧХ у краёв полосы, а не идеальную плоскость. Фазовый сдвиг в девяносто градусов и задержка от усечения не зависят. (Oppenheim, гл. 7)", "usage": {"code": false, "without": "Резко обрезанный корректор Гильберта портит амплитуду квадратурного сигнала как раз на краях рабочей полосы.", "with": "Плавное окно вместо прямоугольного снижает пульсации Гиббса и выравнивает АЧХ у краёв.", "benefit": "Предсказуемая амплитуда квадратурного канала по всей рабочей полосе."}}, {"q": "Для дифференциального токового датчика нужен FIR-преобразователь Гильберта. Проектировщик по ошибке берёт линейно-фазовый FIR типа I с симметричной импульсной характеристикой. Почему это не подходит для данной задачи?", "options": ["Тип I даёт симметрию вместо антисимметрии", "Тип I даёт отрицательную задержку сигнала", "Тип I никогда не даёт усиление выше единицы", "Тип I физически нереализуем на высоких частотах"], "correct": 0, "explain": "Преобразователь Гильберта аппроксимирует нечётную мнимую характеристику минус j на sgn от omega, поэтому импульсная характеристика должна быть антисимметричной - тип III или тип IV. Симметричный тип I даёт вещественную чётную характеристику, а не нужный сдвиг на девяносто градусов. (Proakis, гл. 8)", "usage": {"code": false, "without": "С типом I квадратурный канал токового датчика получает не тот фазовый сдвиг, что нужен для аналитического сигнала.", "with": "Тип III или IV с антисимметричной характеристикой даёт правильный сдвиг на девяносто градусов.", "benefit": "Корректно построенная квадратурная пара для оценки амплитуды тока."}}, {"q": "Для оценки амплитуды вибрации по одному вещественному сигналу токового датчика строят аналитический сигнал через преобразование Гильберта. Как из него получают мгновенную огибающую вибрации?", "options": ["Как разность максимума и минимума за период", "Как среднее сигнала и его Гильберт-пары", "Как производная фазы исходного сигнала", "Как корень суммы квадратов сигнала и пары"], "correct": 3, "explain": "Мгновенная огибающая - это модуль комплексного аналитического сигнала, то есть корень из суммы квадратов исходного сигнала и его преобразования Гильберта. Среднее двух каналов и разность экстремумов огибающую не дают, а производная фазы даёт мгновенную частоту, не амплитуду. (Proakis, гл. 11)", "usage": {"code": false, "without": "По одному вещественному каналу без огибающей амплитуду вибрации токового датчика приходится грубо оценивать по пикам.", "with": "Модуль аналитического сигнала даёт гладкую мгновенную огибающую вибрации без ожидания целого периода.", "benefit": "Более быстрая и точная оценка амплитуды вибрации по одному каналу."}}, {"q": "Радиоканал телеметрии робота ограничен по полосе, а несущая модулируется низкочастотным сигналом вибрации. Чтобы вдвое сократить занимаемую полосу по сравнению с обычной амплитудной модуляцией, применяют однополосную модуляцию на основе преобразования Гильберта. За счёт чего достигается эта экономия полосы?", "options": ["Полоса сужается ростом частоты дискретизации приёмника", "Боковая полоса гасится квадратурной парой сигналов", "Несущая частота удваивается и сужает спектр", "Сигнал делится на четыре квадратурных компонента"], "correct": 1, "explain": "Однополосная модуляция подавляет одну из боковых полос АМ-сигнала, формируя нужную боковую через квадратурную пару - сигнал и его преобразование Гильберта. Удвоение несущей, учетверение компонентов и рост частоты дискретизации полосу сигнала не сужают. (Oppenheim, гл. 12)", "usage": {"code": false, "without": "Обычная амплитудная модуляция занимает вдвое больше полосы канала телеметрии, чем реально нужно.", "with": "Однополосная модуляция через пару Гильберта передаёт тот же сигнал вибрации в половине полосы.", "benefit": "Экономия ограниченной полосы радиоканала телеметрии робота."}}, {"q": "Есть два способа получить квадратурную пару для демодуляции сигнала резольвера: через два смесителя с опорными синусом и косинусом несущей, или через FIR-преобразователь Гильберта одного вещественного сигнала. Чем принципиально отличается второй способ?", "options": ["Второй способ даёт квадратуру без всякой задержки", "Второй способ работает только при нулевой несущей", "Квадратурная ветвь получается фильтрацией того же сигнала", "Второй способ не требует полосового ограничения сигнала"], "correct": 2, "explain": "При использовании преобразования Гильберта квадратурная составляющая получается линейной фильтрацией того же вещественного сигнала, а не умножением на отдельный опорный генератор, как в схеме с двумя смесителями. Полосовая фильтрация и задержка обработки при этом никуда не исчезают. (Proakis, гл. 11)", "usage": {"code": false, "without": "Схема с двумя смесителями требует точного опорного генератора несущей резольвера, что добавляет источник ошибки.", "with": "FIR-преобразователь Гильберта строит квадратуру прямо из измеренного сигнала без отдельного генератора.", "benefit": "Меньше источников рассогласования в квадратурном демодуляторе резольвера."}}, {"q": "После комплексного демодулирования сигнала энкодера в спектре мгновенной частоты обнаружена паразитная составляющая на зеркальной частоте относительно несущей. Какая причина здесь наиболее вероятна?", "options": ["Рассогласование амплитуды или фазы ветвей I и Q", "Слишком большой порядок фильтра Гильберта в тракте", "Чётное число отсчётов в буфере преобразования Фурье", "Слишком узкая полоса входного антиалиасингового фильтра"], "correct": 0, "explain": "Паразитная зеркальная составляющая - классический признак амплитудного или фазового рассогласования квадратурных ветвей при формировании аналитического сигнала: идеальная квадратурная пара подавляет зеркальную частоту полностью. Полоса фильтра, порядок Гильберта и длина буфера БПФ к этому эффекту не приводят. (Proakis, гл. 11)", "usage": {"code": false, "without": "Незамеченное рассогласование ветвей I и Q даёт ложную зеркальную составляющую в оценке скорости энкодера.", "with": "Проверка и выравнивание амплитуды и фазы ветвей убирает зеркальную составляющую из спектра.", "benefit": "Чистая оценка мгновенной частоты энкодера без паразитной зеркальной компоненты."}}, {"q": "В квадратурном демодуляторе резольвера синфазную ветвь пропускают через FIR-преобразователь Гильберта, а квадратурную ветвь вообще не задерживают. К чему это приведёт при вычислении мгновенной фазы сигнала?", "options": ["Амплитуда сигнала перестанет зависеть от несущей", "Мгновенная фаза станет точнее из-за меньшей задержки", "Огибающая обнулится на всех частотах кроме несущей", "Возникнет систематическая ошибка фазы из-за разных задержек"], "correct": 3, "explain": "Если одна ветвь задержана фильтром Гильберта, а другая нет, групповые задержки ветвей рассогласованы, и это даёт систематическую ошибку фазы, а значит и угла поворота ротора. Огибающая и зависимость амплитуды от несущей тут ни при чём, а точность фазы только ухудшается. (Proakis, гл. 11)", "usage": {"code": false, "without": "Незадержанная ветвь Q против задержанной ветви I даёт постоянное смещение измеренного угла резольвера.", "with": "Добавление такой же задержки в ветвь Q убирает систематическую ошибку фазы.", "benefit": "Точный угол поворота ротора без постоянного смещения от рассогласования задержек."}}, {"q": "Импульсная характеристика идеального дискретного преобразователя Гильберта равна h[n] = 2/(π·n) при нечётных n, и h[n] = 0 при чётных n. Чему равно h[3], округлив до трёх знаков после запятой?", "options": ["0.106", "0.318", "0.212", "0.637"], "correct": 2, "explain": "Шаг 1: n=3 нечётное, применяем h[n]=2/(π·n). Шаг 2: h[3] = 2/(3π) = 2/9.425 = 0.212. Дистрактор 0.637 получается, если забыть разделить на n и посчитать просто 2/π. (Oppenheim & Schafer, гл. 11)", "usage": {"code": false, "without": "Без этой формулы инженер задаёт коэффициенты фильтра Гильберта на глаз и получает перекос спектра в квадратурном демодуляторе резольвера.", "with": "Зная h[n]=2/(πn), он рассчитывает точные отводы FIR-преобразователя Гильберта перед усечением окном.", "benefit": "Точные коэффициенты вместо угадывания."}}, {"q": "Идеальную импульсную характеристику преобразователя Гильберта усекли прямоугольным окном длиной 7 отсчётов, n от −3 до 3 включительно. Сколько отсчётов усечённой характеристики окажутся ненулевыми, если h[n]=0 при чётных n?", "options": ["4", "7", "3", "6"], "correct": 0, "explain": "Шаг 1: в диапазоне n=−3..3 чётные значения −2, 0, 2 дают h[n]=0 — это 3 отсчёта. Шаг 2: остаются нечётные n=−3,−1,1,3 — 4 ненулевых отсчёта из 7. Дистрактор 7 получается, если забыть про нулевые чётные отсчёты. (Oppenheim & Schafer, гл. 11)", "usage": {"code": false, "without": "Без учёта этой закономерности студент реализует все 7 умножителей FIR-корректора Гильберта, тратя ресурсы контроллера робота впустую.", "with": "Зная, что чётные отводы нулевые, он выбрасывает 3 лишних умножителя из структуры фильтра.", "benefit": "Экономия вычислений на встраиваемом контроллере."}}, {"q": "ФИР-преобразователь Гильберта имеет N=101 отвод и линейную фазу. Чему равна его групповая задержка в отсчётах, если задержка линейно-фазового FIR равна (N−1)/2?", "options": ["51.0", "25.0", "100.0", "50.0"], "correct": 3, "explain": "Шаг 1: линейно-фазовый FIR даёт групповую задержку (N−1)/2 отсчётов. Шаг 2: (101−1)/2 = 100/2 = 50.0. Дистрактор 51.0 получается при ошибочной формуле (N+1)/2 вместо (N−1)/2. (Proakis & Manolakis, гл. 10)", "usage": {"code": false, "without": "Без этой формулы инженер синхронизирует ветви IMU-фильтра наугад и получает фазовый сдвиг между осями.", "with": "Рассчитав задержку 50 отсчётов, он точно выравнивает опорный канал по времени.", "benefit": "Точная синхронизация каналов вместо догадок."}}, {"q": "Ветвь Q квадратурного демодулятора проходит через FIR-преобразователь Гильберта с N=81 отводом, ветвь I задерживают линией задержки на столько же отсчётов, сколько запаздывает ветвь Q. При частоте дискретизации fs=16000 Гц какова нужная задержка линии I в миллисекундах?", "options": ["2.531 мс", "2.500 мс", "5.000 мс", "1.250 мс"], "correct": 1, "explain": "Шаг 1: задержка FIR-преобразователя Гильберта = (81−1)/2 = 40 отсчётов. Шаг 2: в миллисекундах 40/16000·1000 = 2.500 мс. Дистрактор 5.000 мс получается, если использовать N−1=80 без деления на 2. (Oppenheim & Schafer, гл. 11)", "usage": {"code": false, "without": "Без расчёта задержки ветвь I опережает ветвь Q на несколько миллисекунд, и оценка угла резольвера плывёт.", "with": "Задержав ветвь I на 2.5 мс линией задержки, инженер получает согласованные по времени отсчёты I и Q для демодуляции.", "benefit": "Совпадение фаз I и Q вместо систематической ошибки угла."}}, {"q": "Дискретный сигнал x[n] = 5·cos(0.3n) подали на идеальный преобразователь Гильберта и получили квадратурную составляющую x̂[n] = 5·sin(0.3n). Чему равна огибающая аналитического сигнала sqrt(x[n]² + x̂[n]²) при любом n?", "options": ["2.50", "25.00", "5.00", "10.00"], "correct": 2, "explain": "Шаг 1: по свойству преобразования Гильберта аналитический сигнал для A·cos даёт квадратуру A·sin, поэтому x²+x̂² = A²·(cos²+sin²) = A². Шаг 2: sqrt(25) = 5.00 — огибающая равна амплитуде A=5 и не зависит от n. Дистрактор 25.00 получается, если забыть извлечь корень. (Oppenheim & Schafer, гл. 11)", "usage": {"code": false, "without": "Без этого свойства инженер думает, что огибающую вибрации нужно пересчитывать в каждой точке по-новому, и теряет время на лишний код.", "with": "Зная, что огибающая постоянна и равна амплитуде, он мгновенно проверяет корректность аналитического сигнала по одному значению.", "benefit": "Быстрая проверка амплитуды без перебора всех отсчётов."}}, {"q": "Сигнал x[n] = 7·cos(1.1n) подали на идеальный преобразователь Гильберта, квадратурная составляющая x̂[n] = 7·sin(1.1n). Чему равна огибающая sqrt(x[n]² + x̂[n]²) при n=4?", "options": ["7.00", "4.95", "49.00", "14.00"], "correct": 0, "explain": "Шаг 1: для любого n верно cos²(1.1n)+sin²(1.1n)=1, поэтому x²+x̂² = 7²·1 = 49. Шаг 2: sqrt(49) = 7.00 — конкретное значение n=4 не влияет на результат для чистой синусоиды. Дистрактор 4.95 возникает, если ошибочно поделить амплитуду на sqrt2, как для среднеквадратичного значения. (Proakis & Manolakis, гл. 11)", "usage": {"code": false, "without": "Без понимания инвариантности огибающей инженер пересчитывает тригонометрию для каждого отсчёта вибродатчика, хотя ответ один и тот же.", "with": "Зная, что для чистого тона огибающая равна амплитуде, он сразу проверяет калибровку токового датчика по одному отсчёту.", "benefit": "Мгновенная проверка амплитуды без лишних вычислений."}}, {"q": "Мгновенная фаза аналитического сигнала: φ[10]=1.2566 рад, φ[11]=1.4137 рад, частота дискретизации fs=1000 Гц. Оцените мгновенную частоту сигнала по формуле f = fs·Δφ/2π, Гц.", "options": ["157.1 Гц", "50.0 Гц", "12.5 Гц", "25.0 Гц"], "correct": 3, "explain": "Шаг 1: разность фаз Δφ = 1.4137 − 1.2566 = 0.1571 рад. Шаг 2: f = 1000·0.1571/2π = 157.1/6.2832 = 25.0 Гц. Дистрактор 157.1 Гц получается, если вовсе забыть делить на 2π. (Proakis & Manolakis, гл. 11)", "usage": {"code": false, "without": "Без этой формулы инженер видит колебания фазы резольвера, но не может превратить их в число оборотов в секунду.", "with": "Посчитав Δφ между соседними отсчётами, он получает мгновенную частоту вращения вала в реальном времени.", "benefit": "Частота вращения вала вместо сырой фазы."}}, {"q": "Мгновенная фаза аналитического сигнала: φ[20]=1.0000 рад, φ[21]=1.6283 рад, частота дискретизации fs=1000 Гц. Оцените мгновенную частоту сигнала по формуле f = fs·Δφ/2π, Гц.", "options": ["628.3 Гц", "100.0 Гц", "50.0 Гц", "200.0 Гц"], "correct": 1, "explain": "Шаг 1: Δφ = 1.6283 − 1.0000 = 0.6283 рад. Шаг 2: f = 1000·0.6283/2π = 628.3/6.2832 = 100.0 Гц. Дистрактор 200.0 Гц получается при делении на π вместо 2π. (Proakis & Manolakis, гл. 11)", "usage": {"code": false, "without": "Без пересчёта через 2π инженер путает мгновенную частоту вибрации с удвоенным значением и неверно диагностирует дисбаланс.", "with": "Правильно применив f=fs·Δφ/2π, он получает точную частоту вибрации подшипника для диагностики.", "benefit": "Верная частота вместо удвоенной ошибки."}}, {"q": "Линейно-фазовый FIR-корректор имеет N=41 отвод, его ФЧХ равна θ(w) = −α·w, где α = (N−1)/2. При частоте дискретизации fs=20000 Гц какова групповая задержка корректора в миллисекундах?", "options": ["2.050 мс", "2.000 мс", "1.000 мс", "0.500 мс"], "correct": 2, "explain": "Шаг 1: α = (N−1)/2 = (41−1)/2 = 20 отсчётов. Шаг 2: задержка в мс = 20/20000·1000 = 1.000 мс. Дистрактор 2.050 мс получается, если использовать N=41 отсчётов напрямую вместо (N−1)/2. (Proakis & Manolakis, гл. 10)", "usage": {"code": false, "without": "Без расчёта задержки корректора инженер закладывает в контроллер робота случайную компенсацию фазы и получает остаточный сдвиг.", "with": "Рассчитав задержку 1 мс, он точно компенсирует фазовый сдвиг корректора в цепи управления приводом.", "benefit": "Точная компенсация фазы вместо остаточного сдвига."}}, {"q": "Каскад из двух линейно-фазовых FIR-корректоров с N1=21 и N2=61 отводами. Групповая задержка каждого звена равна (N−1)/2, а задержки каскада складываются. При fs=48000 Гц какова суммарная задержка каскада в миллисекундах?", "options": ["0.833 мс", "1.667 мс", "0.417 мс", "0.854 мс"], "correct": 0, "explain": "Шаг 1: τ1=(21−1)/2=10, τ2=(61−1)/2=30 отсчётов, сумма 40 отсчётов. Шаг 2: 40/48000·1000 = 0.833 мс. Дистрактор 0.854 мс получается, если забыть вычесть единицу в каждом звене и посчитать (N1+N2)/2. (Proakis & Manolakis, гл. 10)", "usage": {"code": false, "without": "Без суммирования задержек звеньев инженер недооценивает общую задержку цепочки корректоров и рассинхронизирует канал управления.", "with": "Сложив задержки обоих звеньев, он точно закладывает суммарную задержку 0.833 мс в цикл управления.", "benefit": "Верный бюджет задержки цепочки фильтров."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
