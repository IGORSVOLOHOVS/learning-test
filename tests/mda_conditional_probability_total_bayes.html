<title>MDA 5: Условная вероятность, полная вероятность, теорема Байеса</title>
<style>
  :root {
    --bg: #0f1117;

    --text: #eef0f6;

    --accent: #5b8cff;

  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }

  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }

  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }

  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {

    text-decoration: none; display: inline-flex; align-items: center;

  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }

    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }

  }
</style>

ормулы, нельзя оценить, с какой вероятностью цепочка последовательно соединённых датчиков сработает вся целиком.", "with": "Перемножив вероятности исправной работы каждого датчика в цепочке, получаем общую надёжность последовательной системы.", "benefit": "Даёт способ оценить надёжность системы из независимых последовательных компонентов."}}, {"q": "Как найти вероятность того, что хотя бы одно из нескольких независимых событий произойдёт?", "options": ["Как единицу минус произведение вероятностей непоявления событий", "Как произведение вероятностей непоявления каждого события", "Как наибольшую из вероятностей появления отдельных событий", "Как сумму вероятностей появления всех событий по отдельности"], "correct": 0, "explain": "Вероятность хотя бы одного из независимых событий равна единице минус произведение вероятностей того, что ни одно из них не произойдёт. Забыть вычесть из единицы или не взять произведение непоявления - типичные ошибки. (lecture_3, стр. 15)", "usage": {"code": false, "without": "Не зная формулы, нельзя оценить вероятность того, что хотя бы один из двух студентов сдаст экзамен, если у каждого своя вероятность провала.", "with": "По формуле вероятность того, что хотя бы один из двух студентов сдаст экзамен, равна единица минус 0,3 умножить на 0,3 равно 0,91.", "benefit": "Даёт быстрый способ считать вероятность успеха хотя бы одной попытки из нескольких независимых."}}, {"q": "Чем принципиально отличается независимость двух событий от их несовместности?", "options": ["Несовместность двух событий всегда автоматически делает их независимыми друг от друга по самому определению теории вероятностей, что нередко ошибочно предполагают студенты", "Независимость означает, что появление одного события не меняет вероятность другого, а несовместность означает, что события не наступают одновременно", "Независимость и несовместность на самом деле обозначают одно и то же математическое свойство пары случайных событий, просто выражаются они разными терминами", "Независимость задаётся через произведение вероятностей двух событий, а несовместность задаётся через равенство вероятности каждого из этих событий нулю"], "correct": 1, "explain": "Независимость и несовместность — разные свойства пары событий: первая говорит, что одно событие не влияет на вероятность другого, вторая — что события не могут произойти вместе (lecture_3_cond_prob_2025, стр. 3 и 14).", "usage": {"code": false, "without": "Аналитик считает, что раз два признака в данных никогда не встречаются вместе, значит они независимы, и складывает их вклад в модель как независимые факторы.", "with": "Аналитик понимает, что несовместные признаки почти всегда сильно зависимы, и не использует для них наивные предположения о независимости в модели.", "benefit": "Модель не переоценивает влияние взаимоисключающих признаков."}}, {"q": "Могут ли два события с ненулевыми вероятностями быть одновременно независимыми и несовместными?", "options": ["Да, любые два несовместных события с ненулевыми вероятностями всегда оказываются независимыми по самому определению", "Да, но только если каждое из двух событий является достоверным событием всего пространства исходов", "Нет, несовместность даёт нулевую вероятность произведения, а независимость требует вероятность произведения больше нуля", "Нет, потому что независимость по самому своему определению исключает общее пересечение этих двух событий"], "correct": 2, "explain": "Из несовместности следует, что вероятность произведения событий равна нулю, а из независимости — что она равна произведению вероятностей; при ненулевых вероятностях это противоречие (lecture_3_cond_prob_2025, стр. 3 и 14).", "usage": {"code": false, "without": "Специалист по данным по ошибке считает пару взаимоисключающих категорий независимыми переменными в отчёте.", "with": "Специалист проверяет, что вероятности обеих категорий ненулевые, и делает верный вывод об их зависимости.", "benefit": "Отчёт не содержит логическое противоречие в трактовке категорий."}}, {"q": "Как определяется попарная независимость трёх событий A1, A2 и A3?", "options": ["Каждая пара событий из трёх удовлетворяет условию: вероятность произведения пары равна произведению вероятностей пары", "Сумма вероятностей всех трёх событий в точности должна равняться единице для любой такой тройки", "Каждое из трёх событий является несовместным с объединением двух остальных событий этой тройки", "Произведение всех трёх событий вместе удовлетворяет условию: вероятность тройного произведения равна произведению всех трёх вероятностей"], "correct": 0, "explain": "Попарная независимость проверяется отдельно для каждой из трёх пар событий и не требует условия на тройное произведение (Ross, A First Course in Probability, независимость нескольких событий).", "usage": {"code": false, "without": "Аналитик проверяет только пары признаков на независимость и считает всю тройку признаков независимой.", "with": "Аналитик знает, что попарная проверка не гарантирует независимость всей тройки, и проверяет тройное произведение отдельно.", "benefit": "Модель не занижает риск скрытой зависимости признаков."}}, {"q": "Что дополнительно требуется, чтобы три события были независимы в совокупности, а не только попарно?", "options": ["Дополнительно вероятность суммы всех трёх событий должна равняться сумме вероятностей каждого из них по отдельности", "Дополнительно каждая пара событий из этой тройки должна быть несовместной друг с другом", "Дополнительно вероятность каждого из трёх событий должна быть одинаковой и равной ровно одной третьей", "Дополнительно вероятность произведения всех трёх событий равна произведению вероятностей каждого из них"], "correct": 3, "explain": "Независимость в совокупности требует ещё и равенства для тройного произведения вероятностей, помимо трёх попарных равенств (Ross, A First Course in Probability, независимость нескольких событий).", "usage": {"code": false, "without": "Инженер данных считает три датчика полностью независимыми, проверив только попарные корреляции.", "with": "Инженер дополнительно проверяет совместное произведение вероятностей всех трёх датчиков перед объединением их сигналов.", "benefit": "Оценка совместного отказа системы датчиков становится точнее."}}, {"q": "Возможна ли ситуация, когда три события попарно независимы, но не являются независимыми в совокупности?", "options": ["Нет, попарная независимость и независимость в совокупности — это просто два названия одного условия", "Да, попарная независимость не гарантирует совпадение тройного произведения с произведением всех трёх вероятностей", "Нет, из попарной независимости трёх событий всегда следует их независимость в совокупности", "Да, но лишь тогда, когда все три события к тому же являются несовместными между собой"], "correct": 1, "explain": "Классический пример — два броска монеты и событие совпадения сторон: все пары независимы, но тройное произведение вероятностей не совпадает с произведением всех трёх (Ross, A First Course in Probability, независимость нескольких событий).", "usage": {"code": false, "without": "Команда A/B-теста считает три метрики независимыми в совокупности, обнаружив только попарную независимость.", "with": "Команда явно проверяет тройное произведение вероятностей, прежде чем считать метрики полностью независимыми.", "benefit": "Вывод эксперимента не опирается на ложное допущение о полной независимости."}}, {"q": "Как формулируется правило умножения вероятностей для трёх событий A1, A2 и A3 согласно лекции?", "options": ["Вероятность произведения трёх событий равна произведению вероятностей каждого из трёх событий по отдельности", "Вероятность произведения трёх событий равна сумме условной вероятности второго при первом и третьего при втором", "Вероятность произведения равна вероятности первого события, умноженной на условные вероятности второго и третьего при предыдущих", "Вероятность произведения трёх событий равна вероятности первого при третьем, умноженной на вероятность второго при третьем"], "correct": 2, "explain": "Правило умножения последовательно раскладывает совместную вероятность через условные вероятности каждого следующего события при уже наступивших предыдущих (lecture_3_cond_prob_2025, стр. 11).", "usage": {"code": false, "without": "Аналитик пытается посчитать вероятность цепочки из трёх последовательных действий пользователя простым перемножением безусловных вероятностей.", "with": "Аналитик применяет цепное правило и учитывает, как более ранние действия меняют вероятность следующих.", "benefit": "Оценка вероятности сценария пользователя становится корректной."}}, {"q": "Какое условие необходимо, чтобы цепное правило для вероятности произведения нескольких событий было корректно применимо на каждом шаге?", "options": ["Вероятность произведения предыдущих событий должна быть больше нуля на каждом шаге", "Число событий в цепочке не должно превышать трёх, иначе правило перестаёт работать", "Все события цепочки должны иметь одинаковую вероятность, иначе порядок сомножителей нарушается", "События должны быть независимыми в совокупности, иначе цепное правило к ним вообще неприменимо"], "correct": 0, "explain": "Условная вероятность на каждом шаге определена только когда вероятность произведения предыдущих событий строго больше нуля, иначе деление в её определении не имеет смысла (lecture_3_cond_prob_2025, стр. 8 и 11).", "usage": {"code": false, "without": "Аналитик механически применяет цепное правило к событиям, одно из которых на практике почти невозможно.", "with": "Аналитик сначала проверяет, что вероятность предыдущих событий не равна нулю, прежде чем использовать цепное правило.", "benefit": "Расчёт не ломается делением на ноль на скрытом шаге."}}, {"q": "Из какого соотношения непосредственно получают числитель формулы Байеса для гипотезы Hi?", "options": ["Из формулы полной вероятности, применённой отдельно к каждой гипотезе без учёта самого события A", "Из условия, что все гипотезы задачи обязательно попарно несовместны между собой по определению", "Из свойства, что условная вероятность любого события при самом себе всегда равна единице", "Из правила умножения, применённого к определению условной вероятности гипотезы при событии A"], "correct": 3, "explain": "Числитель формулы Байеса получают, подставив в определение условной вероятности гипотезы при событии A равенство из правила умножения для вероятности их произведения (lecture_3_cond_prob_2025, стр. 21).", "usage": {"code": false, "without": "Разработчик спам-фильтра пытается напрямую угадать апостериорную вероятность спама без вывода формулы через правило умножения.", "with": "Разработчик выводит числитель формулы Байеса из правила умножения и корректно связывает априорную и условную вероятности.", "benefit": "Формула спам-фильтра построена на строгом выводе, а не на догадке."}}, {"q": "Почему знаменатель формулы Байеса равен сумме произведений вероятностей гипотез на условные вероятности события A при каждой из них?", "options": ["Потому что эта сумма равна вероятности только той единственной гипотезы, которая наиболее правдоподобна", "Сумма равна вероятности A по формуле полной вероятности, ведь гипотезы образуют полную группу", "Потому что такая сумма всегда равна единице независимо от того, какое событие A рассматривается", "Потому что событие A по самому построению задачи несовместно с каждой из гипотез Hi"], "correct": 1, "explain": "Знаменатель совпадает с P(A), потому что гипотезы образуют полную группу и покрывают всё пространство Ω, а значит их сумма — это в точности формула полной вероятности для A (lecture_3_cond_prob_2025, стр. 18 и 21).", "usage": {"code": false, "without": "Аналитик подставляет в знаменатель формулы Байеса произвольную константу вместо суммы по всем гипотезам.", "with": "Аналитик считает знаменатель как сумму по формуле полной вероятности, зная, что она равна P(A).", "benefit": "Апостериорные вероятности по всем гипотезам в сумме корректно дают единицу."}}, {"q": "Что означает утверждение, что гипотезы H1, H2, ..., Hn образуют полную группу событий?", "options": ["Гипотезы независимы в совокупности, и вероятность каждой из них строго больше нуля всегда", "Гипотезы попарно независимы, но сумма их вероятностей вместе может быть меньше единицы", "Гипотезы попарно несовместны, а их сумма совпадает с достоверным событием, всем пространством исходов", "Гипотезы расположены строго по убыванию вероятности от первой гипотезы до последней по номеру"], "correct": 2, "explain": "Полная группа событий — это попарно несовместные гипотезы, сумма которых равна достоверному событию Ω, то есть охватывающие все возможные исходы (lecture_3_cond_prob_2025, стр. 18).", "usage": {"code": false, "without": "Аналитик забывает добавить гипотезу «прочее» и теряет часть исходов при построении модели.", "with": "Аналитик явно проверяет, что выбранные гипотезы попарно несовместны и в сумме дают всё пространство исходов.", "benefit": "Формула полной вероятности применяется корректно, без потерянных исходов."}}, {"q": "Завод собирает детали на трёх станках: А делает 25% деталей, В — 35%, С — оставшиеся 40%. Доля брака у станка А равна 5%, у В — 4%, у С — 2%. Нужно найти вероятность того, что случайно взятая деталь окажется бракованной, без какой-либо дополнительной информации о ней. Какую формулу здесь нужно применить?", "options": ["Формулу умножения вероятностей независимых станков", "Теорему Байеса для пересчёта вероятности станка", "Формулу сложения вероятностей у несовместных станков", "Формулу полной вероятности с гипотезами по станкам"], "correct": 3, "explain": "Событие деталь бракована зависит от станка-изготовителя, а станки образуют полную группу несовместных гипотез — значит нужна формула полной вероятности P(A)=ΣP(Hi)·P(A/Hi). Теорема Байеса нужна для обратной задачи — по браку определить станок, а не наоборот (lecture_3, стр. 18).", "usage": {"code": false, "without": "Без разбора по станкам легко просто сложить проценты брака 5+4+2 и получить неверную цифру.", "with": "Зная формулу полной вероятности, аналитик взвешивает брак каждого станка по его доле выпуска и получает корректный общий процент.", "benefit": "Даёт верную сквозную оценку качества по всей линии, а не по одному станку."}}, {"q": "На том же заводе взяли случайную деталь, и она оказалась бракованной. Нужно оценить, с какой вероятностью её изготовил именно станок В. Какая формула здесь нужна?", "options": ["Формула полной вероятности по всем станкам", "Теорема Байеса с пересчётом вероятности станка", "Классическое определение вероятности через отношение шансов", "Формула умножения вероятностей независимых событий"], "correct": 1, "explain": "Известен факт брака, и по нему пересматривается вероятность гипотезы станок В — это ровно постановка теоремы Байеса P(Hi/A). Формула полной вероятности даёт вероятность брака в целом, а не долю конкретного станка среди брака (lecture_3, стр. 21).", "usage": {"code": false, "without": "Не отличая направление вопроса, инспектор считает полную вероятность брака и ошибочно принимает её за долю станка В.", "with": "Применив теорему Байеса, инспектор корректно обновляет вероятность виновности станка В по факту обнаруженного брака.", "benefit": "Позволяет направить проверку именно на вероятного виновника брака."}}, {"q": "Для завода со станками А, В и С нужно записать систему гипотез, чтобы применить формулу полной вероятности к событию деталь бракована. Какой набор гипотез подходит?", "options": ["Три гипотезы про исправность станков — работает, сломан, в ремонте", "Две пересекающиеся гипотезы — деталь от А или В, деталь от В или С", "Три взаимоисключающие гипотезы — деталь от станка А, от В или от С", "Две гипотезы — деталь оказалась бракованной или осталась исправной"], "correct": 2, "explain": "Гипотезы должны быть взаимоисключающими и исчерпывающими: деталь сделана ровно одним из трёх станков, другого варианта нет. Вариант бракована/исправна — это само событие A, а не гипотезы о происхождении детали; пересекающиеся или посторонние наборы формулу полной вероятности не дают (lecture_3, стр. 18).", "usage": {"code": false, "without": "Взяв событие вместо гипотез, студент подставляет в формулу неверные вероятности и получает бессмысленный результат.", "with": "Выбрав ровно три непересекающихся станка как гипотезы, студент корректно раскладывает вероятность брака по формуле полной вероятности.", "benefit": "Гарантирует, что сумма вероятностей гипотез равна единице и формула работает."}}, {"q": "Есть две урны. Урну для розыгрыша выбирают наугад, а затем из выбранной урны достают один шар. Чтобы найти вероятность того, что шар окажется белым, нужно ввести гипотезы. Какой выбор гипотез корректен?", "options": ["Гипотезы: наугад выбрана первая урна или наугад выбрана вторая урна", "Гипотезы: вынутый шар оказался белым или вынутый шар оказался чёрным", "Гипотезы: из первой урны вынут белый шар, из второй урны вынут чёрный", "Гипотезы: сначала урна была выбрана, а затем шар был вынут из неё"], "correct": 0, "explain": "Случайность здесь двухступенчатая: сначала случайно выбирается урна, потом уже из неё тянут шар. Гипотезами должны быть варианты первого, независимого от цвета шара, этапа — какая урна выбрана; это взаимоисключающие и исчерпывающие события, а белый или чёрный шар — уже само искомое событие A (lecture_3, стр. 18).", "usage": {"code": false, "without": "Приняв цвет шара за гипотезу вместо выбора урны, студент не может вставить условные вероятности P(A/Hi) в формулу.", "with": "Выбрав в качестве гипотез именно то, какая урна досталась, студент раскладывает вероятность белого шара по обеим урнам корректно.", "benefit": "Позволяет применить формулу полной вероятности к любой двухэтапной случайной схеме."}}, {"q": "Тест на редкое заболевание, которым страдает 1% людей, даёт положительный результат у 95% больных и у 3% здоровых людей. Человек прошёл тест и получил положительный результат. Нужно узнать, с какой вероятностью он действительно болен. Какая формула здесь нужна?", "options": ["Формула полной вероятности положительного результата теста", "Формула умножения вероятностей независимых событий болезни и теста", "Прямое чтение чувствительности теста как ответа на вопрос", "Теорема Байеса, пересчитывающая вероятность болезни по результату теста"], "correct": 3, "explain": "Известен результат теста, и по нему нужно пересмотреть вероятность болезни как гипотезы — это постановка теоремы Байеса P(болен/тест+). Ответ 95% — это P(тест+/болен), а не искомая P(болен/тест+); их подмена и есть типичная ошибка base rate fallacy (lecture_3, стр. 21).", "usage": {"code": false, "without": "Приняв чувствительность теста 95% за ответ, врач сильно завышает вероятность болезни у пациента.", "with": "Применив теорему Байеса с учётом редкости болезни, врач получает реалистично низкую вероятность болезни при единичном положительном тесте.", "benefit": "Защищает от типичной ошибки base rate fallacy при интерпретации медицинских тестов."}}, {"q": "Первый стрелок попадает в мишень с вероятностью 0.8, второй — с вероятностью 0.7, и они стреляют независимо друг от друга. Нужно найти вероятность того, что оба попадут. Какую формулу применить?", "options": ["Формулу полной вероятности с гипотезами по стрелкам", "Формулу умножения вероятностей независимых событий", "Формулу сложения вероятностей несовместных событий", "Теорему Байеса для пересчёта вероятности попадания"], "correct": 1, "explain": "Попадание одного стрелка никак не влияет на попадание другого, а значит события независимы, и вероятность их совместного наступления равна произведению P(A·B)=P(A)P(B). Формула полной вероятности и теорема Байеса здесь не нужны, так как нет гипотез и обратной задачи (lecture_3, стр. 14).", "usage": {"code": false, "without": "Не заметив независимость, студент городит формулу полной вероятности с несуществующими гипотезами.", "with": "Распознав независимость стрелков, студент сразу перемножает вероятности и получает ответ в одну строку.", "benefit": "Экономит шаги решения там, где события заведомо не влияют друг на друга."}}, {"q": "Два студента сдают экзамен независимо друг от друга, и у каждого вероятность провала равна 0.3. Нужно найти вероятность того, что хотя бы один из них сдаст экзамен. Какой ход решения здесь верный?", "options": ["Ввести гипотезы по номеру студента и применить полную вероятность", "Применить теорему Байеса к событию провала экзамена", "Перемножить вероятности провала и вычесть результат из единицы", "Сложить вероятности провала двух студентов между собой"], "correct": 2, "explain": "События независимы, поэтому вероятность провала обоих равна произведению 0.3×0.3, а противоположное событие хотя бы один сдал равно единице минус эта вероятность. Сложение вероятностей провала годится только для несовместных событий, а не для независимых (lecture_3, стр. 15).", "usage": {"code": false, "without": "Просто сложив вероятности провала 0.3+0.3, студент завышает шанс общего провала и получает нелепую цифру для двух студентов.", "with": "Перемножив вероятности провала и взяв дополнение до единицы, студент корректно находит вероятность того, что хоть кто-то сдаст.", "benefit": "Даёт быстрый и точный расчёт для независимых событий без лишних гипотез."}}, {"q": "На заводе со станками А, В и С доля брака различается: 5%, 4% и 2% соответственно. Нужно понять, являются ли события деталь сделана станком А и деталь бракована независимыми. Как правильно рассуждать?", "options": ["События зависимы, потому что доля брака меняется от станка к станку", "События независимы, потому что станки работают отдельно друг от друга", "События несовместны, потому что деталь не может быть с двух станков сразу", "События независимы, потому что все вероятности брака меньше единицы"], "correct": 0, "explain": "Независимость проверяется равенством P(A/H)=P(A): условная вероятность брака по станку 5%, 4% и 2% отличается от общей вероятности брака 3.45%, значит станок и брак зависимы. Несовместность гипотез между собой — отдельное свойство и к независимости станка и брака отношения не имеет (lecture_3, стр. 14).", "usage": {"code": false, "without": "Спутав несовместность гипотез с независимостью, аналитик ошибочно считает станок и брак не связанными и не ищет причину роста брака.", "with": "Сравнив условную и безусловную вероятности брака, аналитик видит зависимость и указывает на станок А как источник повышенного брака.", "benefit": "Не даёт спутать два разных свойства событий — несовместность и независимость."}}, {"q": "Старый станок М1 делает 75% винтов с браком 4%, новый станок М2 — 25% винтов с браком 2%. Нужно построить дерево вероятностей для вычисления доли брака. Что должно стоять на первом уровне ветвей, а что — на втором?", "options": ["Первый уровень оба станка одновременно, второй уровень доля брака каждого", "Первый уровень бракован винт или нет, второй уровень какой станок его сделал", "Один уровень сразу с четырьмя ветвями без деления на станки", "Первый уровень какой станок сделал винт, второй уровень бракован винт или нет"], "correct": 3, "explain": "Сначала происходит независимый от исхода выбор станка — это первый, безусловный уровень дерева. Брак или его отсутствие идёт вторым уровнем, потому что его вероятность условна и зависит от станка: 4% для М1 и 2% для М2. Обратный порядок веток сделал бы условные вероятности бессмысленными (lecture_3, стр. 16-19).", "usage": {"code": false, "without": "Поставив брак на первый уровень, студент не может подписать над вторыми ветками условные вероятности брака по станкам.", "with": "Поставив станок на первый уровень, а брак вторым, студент подписывает над ветками ровно те условные вероятности 4% и 2%, что даны в задаче.", "benefit": "Дерево сразу показывает, какие вероятности перемножать вдоль каждого пути."}}, {"q": "Инженерная вакансия размещена в трёх газетах А, В и С, которые читают студенты в пропорции 2 к 3 к 1. Вероятность отклика у читателя каждой газеты своя. Для дерева вероятностей этой задачи, что представляют собой ветви первого уровня, а что — второго?", "options": ["Первый уровень откликнулся студент или нет, второй уровень какую газету он увидел", "Первый уровень какую газету увидел студент, второй уровень был ли отклик", "Единственный уровень сразу из трёх ветвей по газетам без учёта отклика", "Первый уровень все три газеты сразу, второй уровень отклики по каждой из них"], "correct": 1, "explain": "Какую газету увидел студент — независимый от его дальнейшего решения первый этап, поэтому он образует первый уровень дерева и играет роль гипотез. Откликнулся студент или нет — событие, вероятность которого условна на увиденную газету, поэтому оно идёт вторым уровнем (lecture_3, стр. 16-18).", "usage": {"code": false, "without": "Слив газету и отклик в одну ветку, студент теряет условные вероятности отклика 0.002, 0.001 и 0.005 для каждой газеты.", "with": "Разделив дерево на выбор газеты и последующий отклик, студент видит, вдоль какого пути перемножать вероятности для каждой газеты.", "benefit": "Делает видимой структуру условных вероятностей до самого расчёта."}}, {"q": "Заболевание встречается у 1% людей. Тест положителен у 90% больных и у 5% здоровых. Нужно найти вероятность болезни при положительном результате, как в примере с бракованными винтами станков M1 и M2 из лекции.", "options": ["Задать гипотезы болен и здоров, найти полную вероятность теста и применить формулу Байеса", "Сложить долю больных в популяции с точностью теста для больных и поделить результат пополам", "Взять долю положительных тестов среди здоровых людей и вычесть её из ста процентов", "Взять точность теста для больных 90% и сразу назвать её итоговой вероятностью болезни у пациента"], "correct": 0, "explain": "Верно: нужно задать гипотезы болен и здоров с их долями в популяции, найти полную вероятность положительного результата теста по обеим гипотезам и применить теорему Байеса — так же, как в примере со станками M1 и M2. Вариант с точностью теста для больных путает P положительный при болен с искомой P болен при положительный. Источник: lecture_3_cond_prob_2025.txt, стр. 21-22.", "usage": {"code": false, "without": "Без формулы Байеса аналитик принимает точность теста за итоговую вероятность болезни и завышает риск для пациента.", "with": "Зная теорему Байеса и роль полной вероятности, аналитик получает корректную оценку риска с учётом редкости болезни.", "benefit": "Оценка риска для пациента не искажается пренебрежением базовой частотой заболевания."}}, {"q": "Для того же теста на редкую болезнь распространённостью 1% и точностью 90% для больных студент заявляет: раз тест точен на 90%, значит при положительном результате вероятность болезни тоже около 90%. В чём ошибка рассуждения?", "options": ["Студент верно применил теорему Байеса, ошибся лишь в округлении итоговых процентов", "Студент забыл учесть независимость положительного результата теста от факта болезни", "Студент перепутал последовательную и параллельную схему станков при расчёте общей вероятности события", "Студент принял точность теста для больных за вероятность болезни у положительных"], "correct": 3, "explain": "Верно: это классическая ошибка base rate fallacy — точность теста для больных P положительный при болен подменяют искомой P болен при положительный, забывая про редкость болезни и 5% ложных срабатываний у здоровых. Источник: lecture_3_cond_prob_2025.txt, стр. 21-22, пример со станками M1 и M2.", "usage": {"code": false, "without": "Не различая направление условной вероятности, аналитик пугает пациента завышенным риском болезни.", "with": "Диагностируя подмену условной вероятности, аналитик пересчитывает риск через полную вероятность и получает реалистичную цифру.", "benefit": "Решение о лечении опирается на верную вероятность, а не на путаницу направлений."}}, {"q": "Почтовый сервис помечает письма как спам или не спам. Известно: доля спама среди писем 30%, слово выгодно встречается в 40% спам-писем и в 5% обычных писем. Как правильно найти вероятность того, что письмо со словом выгодно — спам?", "options": ["Взять долю спама 30% и просто прибавить к ней долю писем со словом выгодно без всякого пересчёта", "Взять гипотезы спам и не спам, найти полную вероятность слова выгодно и применить теорему Байеса", "Взять долю спам-писем со словом выгодно и умножить её на общее число писем во всём почтовом ящике", "Сравнить только доли 40% и 5% между собой и сразу назвать их разницу вероятностью того, что письмо спам"], "correct": 1, "explain": "Верно: аналогично примеру со станками нужно задать гипотезы спам и не спам, посчитать полную вероятность появления слова выгодно по обеим гипотезам и применить формулу Байеса. Источник: lecture_3_cond_prob_2025.txt, стр. 20-21, формула полной вероятности и теорема Байеса.", "usage": {"code": false, "without": "Фильтр без формулы Байеса либо пропускает спам, либо блокирует нужные письма из-за одного слова.", "with": "Применяя теорему Байеса с учётом базовой доли спама, фильтр точнее оценивает вероятность спама для письма.", "benefit": "Меньше ложных срабатываний фильтра при том же наборе триггерных слов."}}, {"q": "Разработчик настраивает спам-фильтр по правилу: если слово выгодно встречается в 40% спам-писем, блокировать любое письмо с этим словом. Он не смотрит на долю обычных писем со словом выгодно и на общую долю спама. Что произойдёт с фильтром?", "options": ["Фильтр станет точнее, потому что 40% — это уже высокая вероятность спама", "Фильтр перестанет пропускать спам, ошибок с обычными письмами не будет", "Фильтр начнёт блокировать много обычных писем, где встречается это же слово", "Фильтр автоматически подстроит долю спама под реальную статистику почтового ящика"], "correct": 2, "explain": "Верно: игнорируя P слово при не спам и долю спама среди всех писем, разработчик путает условную вероятность слова в спаме с итоговой вероятностью спама для письма — без знаменателя полной вероятности фильтр завышает число ложных блокировок обычной почты. Источник: lecture_3_cond_prob_2025.txt, стр. 21, теорема Байеса.", "usage": {"code": false, "without": "Без учёта полной вероятности фильтр блокирует письма клиентов только за одно слово выгодно.", "with": "Пересчитав вероятность через теорему Байеса с обеими гипотезами, фильтр реже блокирует обычные письма.", "benefit": "Меньше потерянной легитимной переписки при той же защите от спама."}}, {"q": "Система из трёх независимых элементов соединена последовательно, надёжность каждого элемента 0,7, как в задаче про систему из пяти элементов из семинара. К системе добавили ещё один такой же элемент последовательно. Что произойдёт с надёжностью системы?", "options": ["Надёжность уменьшится, потому что для работы системы нужны уже все четыре элемента", "Надёжность увеличится, потому что появился запасной элемент на случай отказа", "Надёжность останется равна надёжности одного элемента, то есть 0,7", "Надёжность не изменится, ведь элементы работают независимо друг от друга"], "correct": 0, "explain": "Верно: в последовательной схеме система работает, только если работают все элементы, поэтому надёжность равна произведению надёжностей и с каждым добавленным элементом падает — 0,7 в четвёртой степени меньше 0,7 в третьей степени. Источник: Seminar_ 4_list_of_problems_2024.txt, стр. 3, задачи про систему из пяти элементов.", "usage": {"code": false, "without": "Инженер добавляет элемент последовательно и не понимает, почему система стала чаще отказывать.", "with": "Зная, что последовательная схема перемножает надёжности, инженер выбирает параллельное резервирование там, где нужна отказоустойчивость.", "benefit": "Проектирование системы избегает случайного снижения надёжности."}}, {"q": "Та же система из трёх элементов теперь соединена параллельно, надёжность каждого 0,7. К системе добавили ещё один такой же элемент параллельно. Что произойдёт с надёжностью системы?", "options": ["Надёжность уменьшится, потому что выросла суммарная вероятность отказа хотя бы одного элемента", "Надёжность не изменится, потому что вероятность отказа каждого элемента остаётся прежней", "Надёжность станет в точности равна надёжности одного отдельного элемента, то есть 0,7", "Надёжность увеличится, потому что отказ требует одновременного отказа всех элементов системы"], "correct": 3, "explain": "Верно: в параллельной схеме система отказывает, только если откажут все элементы одновременно, поэтому надёжность равна единице минус произведение вероятностей отказа, и с каждым добавленным элементом растёт. Источник: Seminar_ 4_list_of_problems_2024.txt, стр. 3, задачи про систему из пяти элементов.", "usage": {"code": false, "without": "Не различая последовательную и параллельную схему, инженер не понимает, зачем дублировать элементы.", "with": "Понимая формулу единица минус произведение вероятностей отказа, инженер осознанно наращивает резервирование там, где важна безотказность.", "benefit": "Критичный узел получает нужный запас надёжности без лишних затрат."}}, {"q": "Из двух элементов с надёжностью 0,7 каждый нужно собрать систему для критичного узла, где важна максимальная безотказность. Какую схему соединения выбрать и почему?", "options": ["Последовательную, потому что надёжность элементов в этой схеме складывается, а не перемножается", "Параллельную, ведь отказ требует одновременного отказа обоих элементов сразу", "Последовательную, потому что она проще в реализации и обходится дешевле параллельной", "Параллельную, потому что она снижает суммарную стоимость обслуживания всей системы"], "correct": 1, "explain": "Верно: для последовательной схемы надёжность равна 0,7 в квадрате, то есть 0,49, а для параллельной единица минус 0,3 в квадрате, то есть 0,91, потому что отказ параллельной системы требует одновременного отказа обоих элементов. Источник: Seminar_ 4_list_of_problems_2024.txt, стр. 3.", "usage": {"code": false, "without": "Инженер без сравнения ставит элементы последовательно и получает надёжность ниже, чем у любого элемента по отдельности.", "with": "Сравнив 0,49 и 0,91, инженер выбирает параллельную схему для критичного узла.", "benefit": "Критичный узел получает почти вдвое более высокую надёжность при тех же элементах."}}, {"q": "Менеджер магазина проводит A/B-тест: группа A видит старую страницу, группа B — новую. Вместо случайного распределения он направляет в группу B только вечерних посетителей, а в группу A — дневных. Что произойдёт со сравнением P покупка при B и P покупка при A?", "options": ["Сравнение останется корректным, потому что время суток не влияет на вероятность покупки", "Разница вероятностей автоматически усреднится, и результат теста будет верным", "Разница будет искажена временем суток, а не только вариантом страницы", "Тест покажет заниженную вероятность покупки в обеих группах одновременно"], "correct": 2, "explain": "Верно: гипотезы группа A и группа B перестают быть сравнимыми, если распределение зависит от времени суток — разница между P покупка при B и P покупка при A смешивается с эффектом времени суток, а не отражает только эффект страницы. Источник: lecture_3_cond_prob_2025.txt, стр. 20-21, сравнение условных вероятностей по гипотезам.", "usage": {"code": false, "without": "Менеджер приписывает рост продаж новой странице, хотя причина — вечерний трафик.", "with": "Случайно распределяя посетителей по группам, менеджер честно сравнивает P покупка при A и P покупка при B.", "benefit": "Решение о запуске новой страницы опирается на реальный эффект дизайна, а не на посторонний фактор."}}, {"q": "По итогам A/B-теста аналитик посчитал P вариант B при условии покупка равно 70% и заявил: значит, вероятность покупки при показе варианта B тоже 70%. В чём ошибка?", "options": ["Аналитик перепутал долю купивших из группы B с вероятностью покупки в группе B", "Аналитик перепутал последовательную и параллельную схему проведения A/B-теста в магазине", "Аналитик забыл умножить полученные 70% на общее число посетителей в группе B", "Ошибки нет, потому что при независимых событиях порядок условия роли не играет"], "correct": 0, "explain": "Верно: P вариант B при покупка показывает, какая доля купивших пришла из группы B, а не вероятность покупки для показанного варианта B — это ровно путаница P A при B и P B при A. Источник: lecture_3_cond_prob_2025.txt, стр. 21, теорема Байеса.", "usage": {"code": false, "without": "Аналитик докладывает завышенную конверсию новой страницы и вводит команду в заблуждение.", "with": "Различая обе условные вероятности, аналитик считает верную конверсию отдельно для группы A и группы B.", "benefit": "Решение о раскатке новой страницы принимается по настоящей вероятности покупки, а не по подмене условия."}}, {"q": "Станок A даёт 25% продукции с браком 5%, станок B — 35% продукции с браком 4%, станок C — 40% продукции с браком 2%, как в задаче про завод из семинара. Технолог заявляет: раз доля брака у станка A самая высокая, значит именно от станка A приходит больше всего бракованных деталей. В чём ошибка?", "options": ["Ошибки нет, ведь станок A действительно даёт больше всего брака среди всех трёх станков", "Технолог перепутал долю продукции станка A с надёжностью его параллельного соединения с другими", "Технолог не учёл, что станки на заводе работают последовательно, а не параллельно", "Технолог сравнил условную долю брака станка, а не его итоговый вклад в общий брак"], "correct": 3, "explain": "Верно: чтобы найти вклад станка A в общий брак, нужно посчитать P станок A при брак через теорему Байеса с весами по доле продукции, а не просто сравнивать долю брака у разных станков — станок B при меньшей доле брака может давать больше бракованных деталей из-за большей доли продукции. Источник: Seminar_ 4_list_of_problems_2024.txt, стр. 4, задача про станки A, B, C.", "usage": {"code": false, "without": "Технолог обвиняет станок A в основном браке и тратит ресурсы на его ремонт, хотя реальный источник другой.", "with": "Посчитав P станок при брак теоремой Байеса с учётом долей продукции, технолог направляет ремонт на настоящий источник большинства брака.", "benefit": "Ресурсы на обслуживание идут на станок, который действительно даёт больше всего бракованных деталей."}}, {"q": "В группе из 200 человек 100 курящих и 100 некурящих. Среди курящих 30 человек больны, среди некурящих больны 20 человек. Из группы случайно выбирают одного человека. Найдите условную вероятность того, что выбранный человек болен, при условии что он курящий.", "options": ["0.6000", "0.1500", "0.3000", "0.2500"], "correct": 2, "explain": "Шаг 1: доля курящих в группе P курящий = 100/200 = 0.5000. Шаг 2: доля курящих больных во всей группе P курящий и болен = 30/200 = 0.1500. Шаг 3: по формуле условной вероятности P болен при курящий = P курящий и болен деленное на P курящий = 0.1500/0.5000 = 0.3000. Дистрактор 0.6000 получается, если перепутать порядок условия и посчитать P курящий при болен = 30/50 (lecture_3_cond_prob_2025.txt).", "usage": {"code": false, "without": "Аналитик без формулы условной вероятности сравнивает число больных курящих 30 человек с общим числом больных 50 и делает неверный вывод о риске.", "with": "Зная формулу условной вероятности, аналитик делит долю курящих больных на долю курящих и получает верный риск 0.3000 именно для курящих.", "benefit": "Формула условной вероятности исключает смешение P A при B и P B при A."}}, {"q": "Три станка А, Б и В выпускают соответственно 20%, 30% и 50% всей продукции цеха. Доля брака составляет 5% для станка А, 3% для станка Б и 2% для станка В. Случайно взятая деталь берётся из общего потока продукции цеха. Найдите полную вероятность того, что эта деталь окажется бракованной.", "options": ["0.0290", "0.1000", "0.0100", "0.0333"], "correct": 0, "explain": "Шаг 1: доли выпуска станков как гипотезы H1=0.2000, H2=0.3000, H3=0.5000. Шаг 2: условные вероятности брака при каждой гипотезе равны 0.0500, 0.0300, 0.0200. Шаг 3: по формуле полной вероятности P брак = 0.2000*0.0500+0.3000*0.0300+0.5000*0.0200 = 0.0100+0.0090+0.0100 = 0.0290. Дистрактор 0.0333 получается при усреднении долей брака без учёта весов станков (total_probability_Bayes.txt).", "usage": {"code": false, "without": "Технолог без формулы полной вероятности берёт долю брака только у станка В и занижает общий процент брака цеха.", "with": "С формулой полной вероятности технолог взвешивает брак каждого станка по его доле выпуска и получает верный общий процент 0.0290.", "benefit": "Формула полной вероятности учитывает вклад каждой гипотезы пропорционально её весу."}}, {"q": "Есть три урны, каждую из которых выбирают наугад с одинаковой вероятностью. В первой урне 5 белых и 5 чёрных шаров, во второй урне 3 белых и 7 чёрных, в третьей урне 8 белых и 2 чёрных. Из выбранной урны наугад вынимают один шар. Найдите вероятность того, что вынутый шар окажется белым.", "options": ["0.8000", "0.5000", "0.4000", "0.5333"], "correct": 3, "explain": "Шаг 1: вероятность выбрать каждую урну равна одной трети. Шаг 2: условные вероятности белого шара по урнам равны 0.5000, 0.3000 и 0.8000. Шаг 3: полная вероятность P белый = одна треть умножить на сумму 0.5000+0.3000+0.8000 = одна треть умножить на 1.6000 = 0.5333. Дистрактор 0.5000 получается, если взять только первую урну или наивно считать шансы белого и чёрного равными; дистрактор 0.8000 это лучшая урна, а не среднее по всем гипотезам (total_probability_Bayes.txt).", "usage": {"code": false, "without": "Студент без формулы полной вероятности берёт вероятность белого шара только для урны с наибольшей долей белых и завышает итоговый ответ.", "with": "С формулой полной вероятности студент усредняет вклад всех трёх урн и получает точный ответ 0.5333.", "benefit": "Формула полной вероятности корректно объединяет несколько взаимоисключающих гипотез в один ответ."}}, {"q": "40% входящих писем являются спамом. Спам-фильтр верно помечает спам как спам в 95% случаев, но также ошибочно помечает как спам 2% обычных писем. Письмо было помечено фильтром как спам. Найдите вероятность того, что это письмо действительно спам.", "options": ["0.9500", "0.9694", "0.3800", "0.4000"], "correct": 1, "explain": "Шаг 1: полная вероятность пометки P помечено = 0.4000*0.9500+0.6000*0.0200 = 0.3800+0.0120 = 0.3920. Шаг 2: числитель Байеса P спам и помечено = 0.3800. Шаг 3: по теореме Байеса P спам при помечено = 0.3800/0.3920 = 0.9694. Дистрактор 0.4000 это ошибка базовой частоты, когда игнорируют результат теста и берут только априорную долю спама (total_probability_Bayes.txt).", "usage": {"code": false, "without": "Без теоремы Байеса разработчик считает, что помеченное письмо это спам с той же вероятностью 40%, что и любое письмо, и не доверяет фильтру.", "with": "С теоремой Байеса разработчик показывает, что после срабатывания фильтра вероятность спама вырастает до 0.9694.", "benefit": "Теорема Байеса пересчитывает вероятность события с учётом нового наблюдения."}}, {"q": "Заболевание встречается у 1% населения. Чувствительность медицинского теста равна 99%, специфичность равна 98%. У случайно выбранного человека тест дал положительный результат. Найдите вероятность того, что этот человек действительно болен.", "options": ["0.9900", "0.9800", "0.3333", "0.0100"], "correct": 2, "explain": "Шаг 1: P болен и плюс = 0.0100*0.9900 = 0.0099. Шаг 2: P здоров и плюс = 0.9900*0.0200 = 0.0198, тогда P плюс = 0.0099+0.0198 = 0.0297. Шаг 3: по теореме Байеса P болен при плюс = 0.0099/0.0297 = 0.3333. Дистрактор 0.9900 это чувствительность теста, а не искомая апостериорная вероятность (total_probability_Bayes.txt).", "usage": {"code": false, "without": "Пациент без теоремы Байеса слышит про чувствительность 99% и считает положительный результат почти гарантией болезни.", "with": "С теоремой Байеса врач объясняет, что при редком заболевании реальная вероятность болезни после положительного теста составляет лишь 0.3333.", "benefit": "Теорема Байеса учитывает низкую распространённость заболевания, а не только точность теста."}}, {"q": "Система состоит из трёх независимо работающих элементов, соединённых параллельно: система работает, если исправен хотя бы один элемент. Надёжность каждого элемента равна 0.8. Найдите надёжность всей системы.", "options": ["0.9920", "0.5120", "0.8000", "0.0080"], "correct": 0, "explain": "Шаг 1: вероятность отказа одного элемента q = 1-0.8000 = 0.2000. Шаг 2: вероятность отказа всех трёх элементов одновременно = 0.2000 в кубе = 0.0080. Шаг 3: надёжность параллельной системы = 1-0.0080 = 0.9920. Дистрактор 0.5120 получается, если по ошибке применить формулу последовательной схемы 0.8 в кубе (lecture_3_cond_prob_2025.txt).", "usage": {"code": false, "without": "Инженер без формулы параллельной надёжности оценивает систему по надёжности одного элемента 0.8000 и занижает реальную отказоустойчивость.", "with": "С формулой параллельной надёжности инженер показывает, что резервирование поднимает надёжность системы до 0.9920.", "benefit": "Формула надёжности параллельной схемы количественно обосновывает выгоду резервирования элементов."}}, {"q": "Охранная сигнализация оснащена четырьмя независимыми датчиками движения. Вероятность того, что отдельный датчик не сработает при движении, равна 0.3. Найдите вероятность того, что сработает хотя бы один из четырёх датчиков.", "options": ["0.7000", "0.0081", "0.7599", "0.9919"], "correct": 3, "explain": "Шаг 1: вероятность того, что один датчик не сработает, равна 0.3000. Шаг 2: вероятность того, что не сработают сразу все четыре независимых датчика, равна 0.3000 в четвёртой степени = 0.0081. Шаг 3: вероятность хотя бы одного срабатывания = 1-0.0081 = 0.9919. Дистрактор 0.7599 получается, если перепутать местами вероятности срабатывания и несрабатывания датчика (lecture_3_cond_prob_2025.txt).", "usage": {"code": false, "without": "Без формулы хотя бы одного события установщик оценивает надёжность охраны по одному датчику 0.7000 и недооценивает защиту объекта.", "with": "С формулой хотя бы одного события установщик доказывает клиенту, что четыре датчика вместе дают надёжность обнаружения 0.9919.", "benefit": "Формула вероятности хотя бы одного независимого события переводит дублирование датчиков в конкретный процент защиты."}}, {"q": "Из колоды в 36 карт, где 4 туза, наугад без возвращения вынимают две карты подряд. Найдите вероятность того, что обе вынутые карты окажутся тузами.", "options": ["0.1968", "0.0095", "0.1111", "0.0123"], "correct": 1, "explain": "Шаг 1: вероятность того, что первая карта туз, равна 4/36 = 0.1111. Шаг 2: после изъятия туза в колоде остаётся 3 туза из 35 карт, вероятность второго туза равна 3/35 = 0.0857. Шаг 3: по теореме умножения вероятность двух тузов подряд = 0.1111*0.0857 = 0.0095. Дистрактор 0.0123 получается, если ошибочно вернуть первую карту в колоду перед вторым извлечением (lecture_3_cond_prob_2025.txt).", "usage": {"code": false, "without": "Игрок без теоремы умножения для зависимых событий использует вероятность с возвращением 0.0123 и переоценивает шанс собрать пару тузов.", "with": "С теоремой умножения для событий без возвращения игрок пересчитывает второй туз из уменьшенной колоды и получает точный шанс 0.0095.", "benefit": "Теорема умножения без возвращения учитывает, что состав колоды меняется после каждого извлечения."}}, {"q": "В коробке лежат 10 деталей, из них 3 бракованные. Из коробки без возвращения последовательно вынимают три детали. Найдите вероятность того, что все три вынутые детали окажутся бракованными.", "options": ["0.2917", "0.0270", "0.0083", "0.0667"], "correct": 2, "explain": "Шаг 1: вероятность первой бракованной детали равна 3/10 = 0.3000. Шаг 2: вероятность второй бракованной из оставшихся 9 деталей равна 2/9 = 0.2222, вероятность третьей из оставшихся 8 равна 1/8 = 0.1250. Шаг 3: по цепному правилу P всех трёх бракованных = 0.3000*0.2222*0.1250 = 0.0083. Дистрактор 0.0270 получается при извлечении с возвращением, когда используют 0.3 в кубе (lecture_3_cond_prob_2025.txt).", "usage": {"code": false, "without": "Контролёр без цепного правила условных вероятностей использует вероятность с возвращением 0.0270 и завышает риск подряд идущего брака.", "with": "С цепным правилом контролёр учитывает уменьшение числа бракованных деталей после каждого извлечения и получает точный риск 0.0083.", "benefit": "Цепное правило условных вероятностей корректно описывает последовательные извлечения без возвращения."}}, {"q": "Система из трёх независимых элементов соединена последовательно, поэтому система работает только тогда, когда работают все три элемента. Надёжность каждого элемента равна 0.9. Найдите надёжность всей системы.", "options": ["0.7290", "0.9990", "0.2710", "0.9000"], "correct": 0, "explain": "Шаг 1: для последовательной схемы система работает только при исправности каждого элемента одновременно. Шаг 2: события независимы, поэтому надёжность системы = 0.9000*0.9000*0.9000. Шаг 3: 0.9000 в кубе = 0.7290. Дистрактор 0.9990 получается, если по ошибке применить формулу параллельной схемы 1 минус 0.1 в кубе (lecture_3_cond_prob_2025.txt).", "usage": {"code": false, "without": "Инженер без формулы последовательной надёжности берёт надёжность одного элемента 0.9000 и переоценивает надёжность всей цепочки.", "with": "С формулой последовательной надёжности инженер показывает, что каждое дополнительное звено в цепи снижает общую надёжность до 0.7290.", "benefit": "Формула надёжности последовательной схемы объясняет, почему добавление звеньев в цепь снижает общую отказоустойчивость."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
