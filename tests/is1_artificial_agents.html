<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IS1: Искусственные агенты</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>IS1: Искусственные агенты</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../sync.js"></script>
<script>
(function () {
  const TEST_ID = "is1_artificial_agents";
  const QUESTIONS = [{"q": "Что по определению из лекции делает компьютерную систему агентом?", "options": ["Способность работать только через сетевое соединение", "Способность показывать графический интерфейс пользователю", "Способность действовать автономно от имени владельца", "Способность обучаться на размеченных примерах данных"], "correct": 2, "explain": "Агент - это компьютерная система, способная к независимому (автономному) действию от имени пользователя или владельца: она сама определяет, что нужно сделать для достижения целей, а не получает постоянные указания. Обучение, сеть и интерфейс в определении не фигурируют (Lecture4_Agents_Part1, слайд 2).", "usage": {"code": false, "without": "На вопросе «является ли этот скрипт агентом» студент ищет в нём нейросеть или окно и отвечает наугад.", "with": "Студент проверяет одно: решает ли система сама, что делать ради цели владельца, без пошаговых команд.", "benefit": "Одно точное определение вместо набора внешних признаков."}}, {"q": "Через какие компоненты агент воспринимает среду и через какие воздействует на неё?", "options": ["Воспринимает через сенсоры, воздействует через актуаторы", "Воспринимает через критика, воздействует через генератор проблем", "Воспринимает через актуаторы, воздействует через сенсоры", "Воспринимает через память, воздействует через программу"], "correct": 0, "explain": "Агент - искусственный объект, который воспринимает среду через сенсоры (perceive) и взаимодействует с ней через исполнительные механизмы - актуаторы (act). Вариант с обратным порядком меняет роли местами, а критик и генератор проблем - части обучающегося агента, а не канал связи со средой (Lecture4_Agents_Part1, слайды 3-4).", "usage": {"code": false, "without": "Описывая робота-пылесос, студент называет мотор колёс «сенсором» и путает, что входит в агента, а что выходит из него.", "with": "Студент сразу раскладывает: датчики и камера - сенсоры, моторы и щётки - актуаторы, и рисует схему агент-среда.", "benefit": "Правильная схема потоков информации и действий с первого раза."}}, {"q": "От чего, согласно терминологии лекции, зависит выбор действия агентом?", "options": ["От одного только текущего акта восприятия в данный момент", "От заранее заданной таблицы действий без учёта восприятий", "От последних двух актов восприятия, более ранние отбрасываются", "От всей последовательности актов восприятия до данного момента"], "correct": 3, "explain": "Perception - данные, получаемые сенсорами в любой момент; sequence of perception acts - полная история всего, что агент когда-либо воспринял; выбор действия зависит от всей этой последовательности до данного момента, а не только от текущего восприятия (Lecture4_Agents_Part1, слайд 7).", "usage": {"code": false, "without": "Вы проектируете агента, который смотрит только на текущее показание датчика, и он забывает, что уже проверял эту комнату.", "with": "Вы учитываете всю историю восприятий, и агент не повторяет уже сделанные действия.", "benefit": "Понимание, что история восприятий - основа выбора действия."}}, {"q": "Чем функция агента, agent function, отличается от программы агента, agent program?", "options": ["Функция - физическая архитектура агента, программа - набор его сенсоров и актуаторов", "Функция - отображение последовательности восприятий в действие, программа - её реализация", "Функция - список целей агента, программа - критерий успеха, по которому его оценивают", "Функция - конкретная реализация на языке программирования, программа - её абстрактное описание"], "correct": 1, "explain": "Agent function - отображение любой последовательности актов восприятия в некоторое действие; agent program - реализация этой функции, возвращающая рекомендуемое действие на основе воспринятой информации. Первый дистрактор меняет термины местами (Lecture4_Agents_Part1, слайд 8).", "usage": {"code": false, "without": "В ответе вы называете программу агента абстрактным отображением и теряете балл.", "with": "Вы разделяете: функция - математическое отображение восприятий в действия, программа - её реализация в коде.", "benefit": "Чёткая пара терминов function и program."}}, {"q": "В определении агента из лекции четыре элемента, по первым буквам - PEAS. Что означает буква P?", "options": ["Policy - стратегия действий", "Program - программа агента", "Performance - мера успеха", "Perception - акт восприятия"], "correct": 2, "explain": "На слайде 14 определение агента - четыре элемента в таком порядке: Performance, Environment, Actuators, Sensors. На слайде 10 та же полная спецификация дана как критерий успеха, спецификация среды, актуаторы и сенсоры, а слайд 11 связывает performance metrics с критерием успеха. Program, Perception и Policy - реальные термины лекции, но в эту четвёрку не входят (Lecture4_Agents_Part1, слайды 10, 11 и 14).", "usage": {"code": false, "without": "Вы расшифровываете P как Program и описываете код агента вместо критерия успеха.", "with": "Вы начинаете спецификацию с меры успеха, затем описываете среду, актуаторы и сенсоры.", "benefit": "Полная спецификация агента без пропусков."}}, {"q": "Какая пара свойств НЕ входит в перечень шести свойств среды из лекции?", "options": ["Известная или неизвестная", "Статическая или динамическая", "Один агент или много агентов", "Дискретная или непрерывная"], "correct": 0, "explain": "Шесть свойств среды на слайде: полностью/частично наблюдаемая, детерминированная/стохастическая, эпизодическая/последовательная, статическая/динамическая, дискретная/непрерывная, один/много агентов. Пары «известная/неизвестная» в этом перечне нет (Lecture4_Agents_Part1, слайд 16).", "usage": {"code": false, "without": "Классифицируя среду шахмат, студент выдумывает свои оси и пропускает половину обязательных характеристик.", "with": "Студент проходит по шести парам подряд и даёт полную классификацию среды за минуту.", "benefit": "Полный и одинаковый чек-лист для описания любой среды."}}, {"q": "Какие четыре типа агентов выделяет классификация агентов в лекции?", "options": ["Simple reflex, model-based reflex, utility-based, learning-based", "Model-based reflex, target-based, utility-based, probabilistic", "Simple reflex, target-based, utility-based, learning-based", "Simple reflex, model-based reflex, target-based, utility-based"], "correct": 3, "explain": "Классификация в лекции содержит четыре типа: simple reflex agents, model-based reflex agents, target-based agents, utility-based agents. Обучающийся агент, learning agent, рассматривается отдельно и в этот список не входит, а «probabilistic» как тип агента в лекции не упоминается вовсе (Lecture4_Agents_Part1, слайд 24).", "usage": {"code": false, "without": "Вы ставите learning agent в один ряд с базовыми типами и ошибаетесь в вопросе «какие четыре».", "with": "Вы называете четыре типа классификации и отдельно упоминаете обучающегося агента как самостоятельную схему.", "benefit": "Точный список типов агентов из лекции без лишних и пропущенных пунктов."}}, {"q": "Какой компонент обучающегося агента сравнивает его поведение с внешним стандартом производительности и передаёт обратную связь обучающему компоненту?", "options": ["Исполнительный компонент, выбирающий внешние действия", "Критик, наблюдающий за результатами действий агента", "Обучающий компонент, вносящий изменения в знания", "Генератор проблем, предлагающий новые пробные действия"], "correct": 1, "explain": "Обучающийся агент состоит из четырёх компонентов: performance component, critic, learning component, problem generator. На схеме именно критик получает performance standard, сопоставляет с ним наблюдаемые результаты действий и отдаёт feedback обучающему компоненту; генератор проблем лишь предлагает новые действия для исследования, а исполнительный компонент выбирает внешние действия (Lecture4_Agents_Part1, слайды 29-30).", "usage": {"code": false, "without": "Вы приписываете оценку поведения генератору проблем и путаете стрелки на схеме.", "with": "Вы знаете: критик берёт performance standard и отдаёт feedback обучающему компоненту.", "benefit": "Верная роль каждого блока обучающегося агента."}}, {"q": "Узел дерева поиска - структура из пяти компонентов. Что хранит компонент Path-Cost?", "options": ["Число потомков, порождённых при развёртывании узла", "Оценку стоимости пути от данного узла до целевого состояния", "Стоимость пути от начального состояния до данного узла", "Стоимость одного последнего шага от родительского узла"], "correct": 2, "explain": "Пять компонентов узла: State, Parent-Node, Action, Path-Cost и Depth. Path-Cost - стоимость пути от начального состояния до данного; оценка расстояния до цели - это эвристика h(n) из информированного поиска, а не поле узла (Lecture4_Agents_Part1, слайд 47).", "usage": {"code": false, "without": "Вы путаете Path-Cost с эвристикой h(n) и считаете стоимость до цели.", "with": "Вы знаете, что Path-Cost - накопленная стоимость от старта, и правильно заполняете узел.", "benefit": "Корректная структура узла из пяти компонентов."}}, {"q": "Какая стратегия НЕ входит в перечень неинформированных, слепых стратегий поиска по лекции?", "options": ["Жадный поиск по наилучшему совпадению", "Поиск в глубину с итеративным углублением", "Поиск по критерию наименьшей стоимости", "Двунаправленный поиск от старта и цели"], "correct": 0, "explain": "К неинформированным стратегиям лекция относит шесть: поиск в ширину, поиск по критерию стоимости, поиск в глубину, поиск с ограничением глубины, поиск в глубину с итеративным углублением и двунаправленный поиск. Жадный поиск по наилучшему совпадению раскрывает узел, который кажется ближайшим к цели, и использует только эвристическую функцию f(n)=h(n), поэтому относится к информированному поиску (Lecture4_Agents_Part1, слайды 51 и 65).", "usage": {"code": false, "without": "Вы относите жадный поиск к слепым, потому что он простой, и ошибаетесь в тесте.", "with": "Вы проверяете, использует ли стратегия оценочную функцию h(n); если да - она информированная.", "benefit": "Чёткая граница между слепым и информированным поиском."}}, {"q": "Какой из перечисленных факторов НЕ входит в число тех, которые по лекции определяют рациональность агента?", "options": ["Последовательность восприятий, накопленная к этому моменту", "Фактически достигнутый результат выбранного действия", "Предварительные знания агента об окружающей среде", "Метрика производительности, задающая критерий успеха"], "correct": 1, "explain": "Рациональность определяется четырьмя факторами: метрикой производительности, предварительными знаниями о среде, доступными действиями и последовательностью восприятий на данный момент. Фактический исход действия в перечень не входит: рациональность оценивается до того, как результат стал известен (Lecture4_Agents_Part1, слайд 11).", "usage": {"code": false, "without": "Инженер критикует робота-пылесос за то, что тот не убрал внезапно рассыпанный мусор, и называет его нерациональным.", "with": "Инженер проверяет метрику, знания, действия и восприятия робота и видит, что решение было верным для того, что робот знал в момент выбора.", "benefit": "Оценка агента по правильным критериям, а не по случайному исходу."}}, {"q": "Агент выбрал действие, которое по имеющимся восприятиям и встроенным знаниям должно было максимизировать метрику производительности, но из-за непредвиденного события результат оказался плохим. Как это оценивается по определению рациональности из лекции?", "options": ["Агент нерационален: рациональный агент обязан заранее предвидеть любые события среды", "Агент рационален лишь при условии, что среда была полностью наблюдаемой и статической", "Агент рационален: определение требует ожидаемой, а не фактической максимизации метрики", "Агент нерационален: определение предполагает гарантированно наилучший фактический исход"], "correct": 2, "explain": "По определению рациональный агент выбирает действие, которое ожидаемо максимизирует метрику с учётом фактов из последовательности восприятий и встроенных знаний. Требование гарантированного успеха или всеведения в определении отсутствует (Lecture4_Agents_Part1, слайд 12).", "usage": {"code": false, "without": "Команда переписывает логику торгового бота после каждой убыточной сделки, даже когда решение было верным по доступным данным.", "with": "Команда отделяет качество решения от качества исхода и меняет логику только там, где агент неверно использовал имеющуюся информацию.", "benefit": "Меньше ложных правок и стабильная стратегия агента."}}, {"q": "Какой набор из трёх свойств, согласно лекции, должен иметь рациональный агент?", "options": ["Способность собирать информацию, способность обучаться, автономность поведения", "Способность обучаться, детерминированность действий, полная наблюдаемость среды", "Полная наблюдаемость среды, детерминированность действий, автономность поведения", "Способность собирать информацию, способность обучаться, всеведение о состоянии среды"], "correct": 0, "explain": "На слайде перечислены три свойства рационального агента: способность собирать информацию, способность обучаться и автономность поведения. Полная наблюдаемость и детерминированность - это свойства среды, а не агента, а всеведение рациональности не требуется (Lecture4_Agents_Part1, слайд 13).", "usage": {"code": false, "without": "Разработчик закладывает в агента только жёстко заданные правила и ждёт, что он будет рациональным в любой обстановке.", "with": "Разработчик даёт агенту возможность запрашивать данные, учиться на опыте и действовать без постоянного вмешательства оператора.", "benefit": "Агент сохраняет рациональность при изменении условий."}}, {"q": "Чем полудинамическая среда отличается от динамической по классификации свойств среды из лекции?", "options": ["Среда меняет своё состояние, пока агент выбирает действие, но оценка его работы фиксирована", "Среда меняется только в части, недоступной сенсорам агента, пока он выбирает действие", "Среда меняет состояние лишь между эпизодами, а внутри эпизода остаётся неизменной", "Среда не меняет состояние, но показатели производительности агента меняются со временем"], "correct": 3, "explain": "Динамическая среда может изменить своё состояние, пока агент выбирает действие; статическая не меняется; полудинамическая занимает промежуточное положение: сама среда не меняется, но показатели производительности агента меняются со временем. Вариант про частичное изменение среды описывает динамическую среду с частичной наблюдаемостью, а не полудинамическую (Lecture4_Agents_Part1, слайд 19).", "usage": {"code": false, "without": "Разработчик шахматной программы с часами считает среду статической и не закладывает контроль времени на ход.", "with": "Разработчик классифицирует шахматы с часами как полудинамическую среду и учитывает, что оценка партии ухудшается с каждой потраченной секундой.", "benefit": "Правильный учёт времени в задачах, где позиция не меняется, а оценка меняется."}}, {"q": "Какие два элемента знания добавляет модельный рефлексный агент к схеме простого рефлексного агента?", "options": ["Компонент-критик и генератор проблем, отвечающий за обучение", "Знание о том, как развивается мир и как действия влияют на него", "Правило условие-действие и вопрос, что произойдёт при действии A", "Набор целей агента и функцию полезности состояний внешнего мира"], "correct": 1, "explain": "Простой рефлексный агент идёт от вопроса «как выглядит мир сейчас?» через правило условие-действие к действию. Модельный рефлексный агент добавляет внутреннее состояние и два знания: как мир развивается сам по себе и как действия агента влияют на мир. Цели и полезность появляются только у целевого и полезностного агентов, а критик и генератор проблем - у обучающегося (Lecture4_Agents_Part1, слайды 25-26).", "usage": {"code": false, "without": "Инженер строит робота-пылесоса на голых правилах и не понимает, почему тот теряет след после того, как препятствие скрылось из вида.", "with": "Инженер добавляет внутреннее состояние и модель того, как мир меняется и как на него влияют действия робота, и тот продолжает объезд по памяти.", "benefit": "Агент работает в частично наблюдаемой среде без перехода к целям."}}, {"q": "Какой вопрос присутствует в схеме полезностного агента, но отсутствует в схеме целевого агента?", "options": ["What does the world look like now?", "What action should I take now?", "How will this state benefit me?", "What happens if I perform action A?"], "correct": 2, "explain": "Полезностный агент дополнительно оценивает через блок Utility, насколько состояние выгодно ему, - вопрос «How will this state benefit me?». Вопрос «What happens if I perform action A?» есть в обеих схемах, целевой агент сверяет его ответ с блоком Goals (Lecture4_Agents_Part1, слайды 27-28).", "usage": {"code": false, "without": "Навигатор-агент считает любой маршрут до цели одинаково хорошим и предлагает первый найденный.", "with": "Агент сравнивает маршруты по функции полезности и выбирает тот, что быстрее и безопаснее.", "benefit": "Выбор лучшего из нескольких способов достичь цели."}}, {"q": "Алгоритм поиска всегда находит решение, если оно существует, но найденное решение не всегда имеет минимальную стоимость. Как характеризуется такой алгоритм по критериям оценки стратегий поиска?", "options": ["Полный, но не оптимальный алгоритм", "Оптимальный, но не полный алгоритм", "Полный и оптимальный алгоритм", "Неполный и неоптимальный алгоритм"], "correct": 0, "explain": "Completeness - гарантия найти решение, если оно есть; Optimality - нахождение решения с минимальной стоимостью. Описанный алгоритм удовлетворяет первому критерию и не удовлетворяет второму, то есть он полный, но не оптимальный (Lecture4_Agents_Part1, слайд 48).", "usage": {"code": false, "without": "Разработчик выбирает поиск в глубину для планировщика маршрутов и удивляется, что маршрут длиннее нужного.", "with": "Разработчик заранее проверяет полноту и оптимальность стратегии и берёт ту, что гарантирует минимальную стоимость.", "benefit": "Осознанный выбор алгоритма под требования задачи."}}, {"q": "Что умеет делать информированный поиск, чего не умеет неинформированный поиск?", "options": ["Отличать целевое состояние от нецелевого при проверке узла", "Гарантировать нахождение решения с минимальной стоимостью", "Генерировать преемников для каждого рассматриваемого состояния", "Определять, что одно нецелевое состояние лучше другого"], "correct": 3, "explain": "Слепой поиск использует только информацию из определения задачи: генерирует преемников и отличает целевое состояние от нецелевого. Информированный поиск дополнительно способен определить, что одно нецелевое состояние предпочтительнее другого; гарантия оптимальности при этом не обещается, жадный поиск, например, неоптимален (Lecture4_Agents_Part1, слайд 50).", "usage": {"code": false, "without": "Программист добавляет в BFS проверку цели и считает, что получил эвристический поиск.", "with": "Программист вводит функцию, которая ранжирует промежуточные состояния по близости к цели, и получает настоящий информированный поиск.", "benefit": "Меньше раскрытых узлов и быстрее найденное решение."}}, {"q": "В стратегии A* оценка узла вычисляется как f(n) = g(n) + h(n). Что обозначает слагаемое g(n)?", "options": ["Глубину узла n в дереве поиска, то есть число рёбер от корня", "Стоимость достижения узла n от начального состояния", "Стоимость одного шага от узла n к лучшему из его преемников", "Оценку стоимости перехода от узла n до целевого состояния"], "correct": 1, "explain": "В A* g(n) - стоимость достижения данного узла, h(n) - стоимость перехода от узла к цели, а f(n) минимизирует полную стоимость решения. Оценка до цели - это h(n), которую жадный поиск использует в одиночку: f(n) = h(n) (Lecture4_Agents_Part1, слайды 65, 70).", "usage": {"code": false, "without": "Студент подставляет в A* вместо g(n) число шагов и получает неоптимальные маршруты на карте с разными длинами дорог.", "with": "Студент накапливает в g(n) реальную стоимость пройденных рёбер и складывает с эвристикой, получая кратчайший путь.", "benefit": "Корректная реализация A* на взвешенных графах."}}, {"q": "Как задаётся порог остановки на очередной итерации IDA* и что сохраняет RBFS в узле, чтобы решить, стоит ли повторно раскрывать забытое поддерево?", "options": ["IDA* берёт максимальную f-оценку прошлой итерации; RBFS записывает в узел худшее f среди потомков", "IDA* берёт порог по стоимости пути g без эвристики; RBFS сохраняет в узле только текущий путь без f", "IDA* берёт минимальную f-оценку, превысившую прошлый порог; RBFS записывает в узел лучшее f потомков", "IDA* берёт предельную глубину, увеличивая её на единицу; RBFS сохраняет в узле всё поддерево целиком"], "correct": 2, "explain": "В IDA* условием остановки служит f-оценка g+h, и на каждой итерации порог равен минимальной f-оценке узла, превысившей порог предыдущей итерации. RBFS при разматывании рекурсии заменяет f-значение узлов на пути лучшим f их потомков и по нему решает, стоит ли повторно раскрывать забытое поддерево; порог по глубине - это поиск с ограничением глубины, а хранение всего дерева противоречит линейной памяти RBFS (Lecture4_Agents_Part1, слайды 72-73).", "usage": {"code": false, "without": "Инженер запускает A* на большой карте и получает переполнение памяти из-за растущей границы поиска.", "with": "Инженер переключается на IDA* или RBFS, которые держат в памяти линейный объём и всё же используют f-оценку для отсечения.", "benefit": "Оптимальный поиск в условиях жёсткого ограничения памяти."}}, {"q": "Инженер описывает агента-таксиста по схеме PEAS и выписал четыре элемента: «безопасность и время в пути», «дороги и пассажиры», «руль и педали», «камера и GPS». Какое распределение этих элементов по категориям Performance, Environment, Actuators, Sensors верно?", "options": ["P - дороги и пассажиры, E - безопасность и время, A - руль и педали, S - камера и GPS", "P - безопасность и время, E - дороги и пассажиры, A - камера и GPS, S - руль и педали", "P - камера и GPS, E - дороги и пассажиры, A - руль и педали, S - безопасность и время", "P - безопасность и время, E - дороги и пассажиры, A - руль и педали, S - камера и GPS"], "correct": 3, "explain": "По лекции полная спецификация агента состоит из критерия успеха (Performance), описания среды (Environment), актуаторов и сенсоров. Критерий успеха - это то, по чему оценивают работу, то есть безопасность и время в пути, а не сама среда. Главный дистрактор меняет местами камеру и руль: камера лишь воспринимает мир, а руль и педали на него воздействуют, поэтому камера - сенсор, а не актуатор (Lecture4_Agents_Part1, слайды 10 и 14).", "usage": {"code": false, "without": "Описывая нового робота, ты сваливаешь в одну кучу «что он видит», «чем он двигает» и «за что его хвалят», и в ТЗ появляется «сенсор: безопасность».", "with": "Раскладываешь описание на четыре полки PEAS и сразу видишь, что критерий успеха ещё не задан, а камера и руль стоят на разных полках.", "benefit": "Спецификация агента получается полной и без путаницы между восприятием и действием."}}, {"q": "Разработчик проектирует агента для игры в шахматы против соперника без часов и должен классифицировать среду по шести свойствам из лекции. Какой набор свойств он должен принять?", "options": ["Полностью наблюдаемая, детерминированная, эпизодическая, статическая, дискретная, многоагентная competitive", "Полностью наблюдаемая, детерминированная, последовательная, статическая, дискретная, многоагентная competitive", "Частично наблюдаемая, стохастическая, последовательная, полудинамическая, дискретная, многоагентная cooperative", "Полностью наблюдаемая, детерминированная, последовательная, статическая, непрерывная, одноагентная без соперника"], "correct": 1, "explain": "Лекция прямо относит шахматы к последовательным средам: выбор хода зависит от предыдущих ходов, а не от изолированного эпизода; доска видна целиком, следующее состояние однозначно задано ходом, без часов среда не меняется сама, состояния и действия дискретны, соперник делает её competitive. Главный дистрактор называет шахматы эпизодическими, что противоречит слайду 19; полудинамическая среда по тому же слайду - это когда меняются показатели работы агента, а не состояние среды, чего в условии нет (Lecture4_Agents_Part1, слайды 17, 19, 21, 22).", "usage": {"code": false, "without": "Берёшь для шахмат алгоритм, рассчитанный на эпизодическую среду, и агент оценивает каждый ход отдельно, не глядя на последствия для партии.", "with": "Классифицируешь среду как последовательную и competitive и выбираешь метод, который просчитывает цепочку ходов с учётом ответов соперника.", "benefit": "Метод решения подбирается под реальные свойства среды, а не наугад."}}, {"q": "Инженер применяет классический решатель задач, который ищет последовательность действий в пространстве состояний, для робота на складе, где люди переставляют коробки, пока робот едет. Какая предпосылка решателя нарушена и чем это грозит при исполнении плана?", "options": ["Нарушена дискретность: робот не может разбить движение на шаги, и план не строится вовсе", "Нарушена наблюдаемость: у робота нет сенсоров, и он не знает начального состояния склада", "Нарушена статичность: план исполняется вслепую, без сверки с текущим восприятием среды", "Нарушена детерминированность: сами движения робота выполняются ненадёжно и случайно"], "correct": 2, "explain": "Решатель задач предполагает статическую, наблюдаемую, дискретную и детерминированную среду и работает по схеме open loop, то есть с разомкнутым циклом: план вычисляется целиком и исполняется без обратной связи. Люди, переставляющие коробки во время движения, делают среду динамической, и план, построенный по устаревшему состоянию, ведёт робота в препятствие. Детерминированность здесь не нарушена: движения робота надёжны, меняется сама среда (Lecture4_Agents_Part1, слайды 31-32).", "usage": {"code": false, "without": "Отдаёшь роботу готовый маршрут, он едет по нему вслепую и въезжает в коробку, которую поставили после расчёта.", "with": "Понимаешь, что склад динамический, и либо пересчитываешь план по свежим восприятиям, либо выбираешь онлайн-агента вместо разомкнутого плана.", "benefit": "Не применяешь разомкнутый план там, где среда меняется под ногами."}}, {"q": "Робот-пылесос видит только ту клетку, в которой находится, но должен помнить, где уже убрал, чтобы не проходить одно место дважды. Какую минимально достаточную архитектуру агента из лекции выбрать?", "options": ["Модельный рефлексный агент с внутренним состоянием и знанием, как развивается мир", "Простой рефлексный агент с правилами условие-действие по текущему восприятию", "Обучающийся агент с критиком, генератором проблем и обучающим компонентом", "Полезностный агент с функцией полезности для оценки выгоды каждого состояния"], "correct": 0, "explain": "Среда частично наблюдаема: сенсоры не передают всю информацию, а простой рефлексный агент выбирает действие только по текущему восприятию и ничего не помнит. Модельный рефлексный агент хранит внутреннее состояние и знание о том, как развивается мир и как на него влияют действия, чего достаточно, чтобы помнить убранные клетки. Функция полезности или обучающий компонент для этой задачи избыточны (Lecture4_Agents_Part1, слайды 17, 25, 26).", "usage": {"code": false, "without": "Пишешь пылесосу набор правил «грязно - чисти, чисто - едь дальше», и он кругами возвращается на одни и те же чистые клетки.", "with": "Добавляешь внутреннюю карту убранных клеток и правило, которое смотрит на неё, а не только на текущее восприятие.", "benefit": "Выбираешь самую простую архитектуру, которая справляется с частичной наблюдаемостью."}}, {"q": "В мире 4x3 у агента несколько целей с разными весами, и ему нужно выбирать между быстрым, но рискованным путём рядом с клеткой -1 и медленным, но безопасным. Какой тип агента из лекции подходит и почему?", "options": ["Простой рефлексный агент, потому что правила условие-действие сами кодируют риски пути", "Модельный рефлексный агент, потому что модели развития мира достаточно для сравнения путей", "Целевой агент, потому что проверка достижения цели уже учитывает веса всех целей", "Полезностный агент, потому что веса целей и компромиссы требуют оценки выгоды состояния"], "correct": 3, "explain": "Целевой агент лишь проверяет, достигнута ли цель, а полезностный отвечает на вопрос «насколько это состояние выгодно мне», что и нужно, когда целей несколько и у каждой свой вес, а пути различаются риском. Проверка «цель достигнута или нет» не различает «быстро и опасно» от «медленно и надёжно» (Lecture4_Agents_Part1, слайды 27-28, 85).", "usage": {"code": false, "without": "Даёшь агенту цель «дойти до +1», и он идёт кратчайшим путём мимо клетки -1, потому что для него все пути к цели одинаковы.", "with": "Задаёшь функцию полезности, где вес цели и риск пути складываются в одну оценку, и агент сам выбирает разумный компромисс.", "benefit": "Агент сравнивает варианты по выгоде, а не просто по факту достижения цели."}}, {"q": "Инженер формулирует задачу «доехать из Arad в Bucharest» по дорожной карте Румынии как задачу поиска в пространстве состояний. Какое соответствие элементов формальной постановки верно?", "options": ["Узел - город, дуга - дорога между городами, stage cost - число пройденных городов, проверка цели - стоимость пути минимальна", "Узел - город, дуга - дорога между городами, stage cost - длина одной дороги, проверка цели - текущий город есть Bucharest", "Узел - дорога, дуга - город на ней, stage cost - длина всего маршрута, проверка цели - текущий город есть Bucharest", "Узел - город, дуга - дорога между городами, stage cost - расстояние по прямой до Bucharest, проверка цели - маршрут минимален"], "correct": 1, "explain": "По лекции пространство состояний - граф, где узел - состояние (город), дуга - действие (переезд по дороге), stage cost - стоимость перехода из состояния x в y (длина одной дороги), а проверка цели проверяет текущее состояние на целевое. Расстояние по прямой - это эвристическая оценка, а не стоимость перехода, а минимальность стоимости - свойство решения, а не проверка цели (Lecture4_Agents_Part1, слайды 34-35, 67).", "usage": {"code": false, "without": "Записываешь в стоимость перехода расстояние по прямой и удивляешься, что поиск находит «маршруты» через несуществующие дороги.", "with": "Раскладываешь задачу на узлы-города, дуги-дороги, стоимость каждой дороги и проверку «мы в Bucharest?», и любой алгоритм поиска работает на этой структуре.", "benefit": "Формулировка задачи становится корректным входом для любого алгоритма поиска."}}, {"q": "Робот должен перейти горящий мост, о прочности досок которого заранее ничего не известно, и модель среды построить нельзя. Какой режим работы агента из лекции выбрать и какова плата за него?", "options": ["Автономный агент: план строится по неизвестной модели, а восприятия используются лишь для отчёта", "Онлайн-агент: восприятия не нужны, потому что вычисления полностью заменяют наблюдение среды", "Онлайн-агент: чередование действия, обзора среды и вычисления, плата - пробы и ошибки на месте", "Автономный агент: полное решение вычисляется до входа в среду и исполняется без учёта восприятий"], "correct": 2, "explain": "Автономные агенты по лекции вычисляют полное решение до входа в реальный мир и исполняют его, не обращаясь к восприятиям, что невозможно без модели моста; онлайн-агенты чередуют действие, обзор среды и вычисление. На слайде это показано как Offline MDP против Online RL, робот на горящем мосту учится, проваливаясь, а RL в лекции определён как обучение через взаимодействие со средой методом проб и ошибок (Lecture4_Agents_Part1, слайды 54-55, определение RL - слайд 83).", "usage": {"code": false, "without": "Пытаешься заранее просчитать весь путь по мосту, данных о котором нет, и робот исполняет план, не замечая проваливающихся досок.", "with": "Переводишь робота в онлайн-режим: шаг, осмотр, пересчёт, и принимаешь, что часть знаний он получит ценой ошибок.", "benefit": "Осознанно выбираешь между offline-планом и online-обучением по наличию модели среды."}}, {"q": "Проектируется навигатор по дорожной карте с поиском по первому лучшему совпадению. Какую эвристическую функцию h(n) выбрать для оценки узла и чему она равна в самом целевом городе Bucharest?", "options": ["Расстояние по прямой h_SLD до цели, в Bucharest равно нулю", "Случайная оценка без знаний о карте, в Bucharest равна максимуму", "Длина уже пройденных дорог от старта, в Bucharest равна длине маршрута", "Число городов, оставшихся до цели, в Bucharest равно единице"], "correct": 0, "explain": "По лекции h(n) строится на априорных знаниях предметной области и оценивает расстояние до цели; для маршрута это расстояние по прямой h_SLD, и в таблице у Bucharest стоит 0, потому что до цели из самой цели ехать не нужно. Длина уже пройденных дорог - это стоимость достижения узла g(n), а не эвристика (Lecture4_Agents_Part1, слайды 59-61, 66; разделение g(n) и h(n) - слайд 70).", "usage": {"code": false, "without": "Подставляешь в оценку узла пройденный путь и поиск «по первому лучшему» тянется к старту, а не к цели.", "with": "Берёшь расстояние по прямой до цели: оно есть для любого города, нулевое в цели и направляет поиск к Bucharest.", "benefit": "Эвристика выбирается по знанию предметной области и правильно направляет поиск."}}, {"q": "Встроенное устройство с очень малой памятью должно искать маршрут по карте с эвристикой. Какой алгоритм из лекции выбрать вместо A* и какова цена такого выбора?", "options": ["Обычный A* - линейная память, цена - потеря оптимальности решения и полноты", "Жадный поиск - экономия времени, цена - экспоненциальный рост памяти", "Поиск в ширину - линейная память, цена - полный отказ от эвристики", "RBFS - линейная память, цена - повторное раскрытие забытых поддеревьев"], "correct": 3, "explain": "RBFS имитирует поведение best-first, но использует только линейную память: при превышении f-limit рекурсия разматывается к лучшей альтернативе, а забытое поддерево при необходимости раскрывается заново, как на примере с Rimnicu Vilcea и Fagaras. Обычный A* линейной памятью не обходится, а жадный поиск в лекции плох не памятью, а неоптимальностью и неполнотой (Lecture4_Agents_Part1, слайды 73-74; недостатки жадного поиска - слайд 68).", "usage": {"code": false, "without": "Прошиваешь в микроконтроллер A*, и на реальной карте открытый список не помещается в память.", "with": "Выбираешь RBFS: память линейная по глубине, а за это соглашаешься на повторное раскрытие уже виденных поддеревьев.", "benefit": "Меняешь память на время осознанно, а не обнаруживаешь нехватку памяти в поле."}}, {"q": "Два робота: один на идеальном конвейере, где каждое перемещение выполняется точно, другой на скользком полу, где действие ненадёжно. Какую форму решения MDP из лекции выбрать для каждого?", "options": ["Конвейер - политика по ожидаемой полезности, скользкий пол - политика по фактической награде каждого шага", "Конвейер - план как последовательность действий, скользкий пол - политика, задающая действие для каждого состояния", "Конвейер - политика, задающая действие для каждого состояния, скользкий пол - план как последовательность действий", "Конвейер - план как последовательность действий, скользкий пол - тоже план, но с большим числом запасных шагов"], "correct": 1, "explain": "По лекции решение MDP - это план в детерминированном процессе и политика в стохастическом: политика отображает S в A и исполняется циклом «определить состояние, выполнить π(s), повторить», поэтому она переживает срыв действия. Запасные шаги в плане не помогают: после ненадёжного действия робот может оказаться в состоянии, для которого план ничего не предусмотрел (Lecture4_Agents_Part1, слайды 100-101).", "usage": {"code": false, "without": "Выдаёшь роботу на скользком полу список из пяти шагов, он на втором шаге соскальзывает, и оставшиеся три ведут его в стену.", "with": "Для скользкого пола строишь политику «в каждом состоянии делай вот это», а план оставляешь только для конвейера.", "benefit": "Форма решения соответствует надёжности действий, и агент не ломается при первом сбое."}}, {"q": "«Умный ассистент» в офисе бездействует, пока оператор не даст прямую команду: сам не выясняет, что нужно владельцу, и по своей инициативе не опрашивает ни датчики, ни источники данных. Какой диагноз верен с точки зрения определения агента и свойств рационального агента из лекции?", "options": ["Нет автономии и сбора информации, по определению это не агент", "Нет памяти, из-за чего система не хранит историю своих восприятий", "Нет нарушений, постоянные указания владельца и есть автономное поведение", "Нет актуаторов, из-за чего система не способна воздействовать на среду"], "correct": 0, "explain": "По определению агент способен на независимое, автономное действие от имени владельца: сам выясняет, что нужно сделать, а не получает постоянные указания; среди свойств рационального агента названы способность собирать информацию, учиться и автономия поведения. Система, которая ждёт каждой команды и сама ничего не выясняет, лишена автономии и сбора информации. Актуаторы у неё есть - она ведь выполняет команды, а про память в условии ничего не сказано (Lecture4_Agents_Part1, слайды 2 и 13).", "usage": {"code": false, "without": "Команда называет «агентом» любой скрипт, реагирующий на команды, и удивляется, почему он не справляется, когда оператор молчит.", "with": "При проектировании сразу закладывают инициативу: система сама решает, какие данные о среде собрать и что делать ради цели владельца.", "benefit": "Отличаете настоящего агента от исполнителя команд и правильно ставите требования."}}, {"q": "Шахматная программа играет партию с контролем времени: пока она рассчитывает ход, позиция на доске не меняется, но время на её часах убывает. Как классифицировать такую среду по оси static/dynamic и что случится при чрезмерно долгом расчёте?", "options": ["Эпизодическая: каждый ход независим, и время на расчёт на результат не влияет", "Динамическая: ход часов и есть изменение среды, поэтому к концу расчёта выбранный ход устареет", "Статическая: позиция не меняется, поэтому агент может думать сколько угодно без потерь", "Полудинамическая: доска неизменна, но показатель качества игры со временем падает"], "correct": 3, "explain": "Semi-dynamic среда по лекции: сама среда не меняется, пока агент выбирает действие, но показатели его функционирования меняются со временем - в шахматах с часами затянувшийся расчёт ведёт к проигрышу по времени при неизменной позиции. Ход часов не меняет состояние среды (расстановку фигур), а меняет оценку качества, поэтому среда не динамическая; статической она была бы, если бы и оценка не зависела от времени. Эпизодичность - другая ось: шахматы последовательны (Lecture4_Agents_Part1, слайд 19).", "usage": {"code": false, "without": "Разработчик считает шахматы статической средой, даёт движку думать без лимита, и программа проигрывает партии по часам при отличных позициях.", "with": "Зная, что среда полудинамическая, разработчик встраивает контроль времени в выбор хода и балансирует глубину расчёта с оставшимися минутами.", "benefit": "Правильно учитываете время как фактор оценки даже в неизменной среде."}}, {"q": "Беспилотное такси движется по дороге среди других машин, часть из которых ведут люди, а часть - другие роботы. Какие три проблемы, по лекции, порождает многоагентность такой среды?", "options": ["Конкуренция, кооперация и одноагентность как три режима взаимодействия машин", "Определение типа других агентов, поддержка коммуникации и стохастичность их поведения", "Дискретизация времени, нехватка памяти и выбор функции полезности для среды", "Частичная наблюдаемость, непрерывность действий и последовательность эпизодов"], "correct": 1, "explain": "Для сред с несколькими агентами лекция выделяет три issues: type identification - определить, кто перед тобой (человек или робот), communication support - как обмениваться информацией, и stochastic behavior - поведение других агентов непредсказуемо. Конкурентная, кооперативная и одноагентная среда - это классификация сред на том же слайде, а не проблемы; наблюдаемость, непрерывность и эпизодичность относятся к другим осям свойств среды (Lecture4_Agents_Part1, слайд 22).", "usage": {"code": false, "without": "Проектируя автопилот, команда моделирует другие машины как неподвижные препятствия и не закладывает ни распознавание типа участников, ни канал связи.", "with": "Команда с самого начала решает, как классифицировать участников движения, как обмениваться сигналами и как учитывать непредсказуемость чужих манёвров.", "benefit": "Заранее закрываете три типовые проблемы многоагентной среды вместо латания по факту."}}, {"q": "Планировщик на 2D-сетке типа approximate cell decomposition выдал автомобилю маршрут с поворотом на 90 градусов на месте, который машина физически выполнить не может. В чём причина и какой граф состояний устраняет проблему по лекции?", "options": ["Разрешение сетки слишком грубое; нужно вдвое уменьшить ячейку и заново искать least-cost путь по той же сетке", "Алгоритм поиска выбран неверно; нужно заменить A* на поиск в ширину по той же самой сетке без изменения состояний", "Состояние хранит лишь x и y; нужен lattice graph с ориентацией, скоростью и заранее выполнимыми переходами", "Не хватает переменной времени; нужен time-bounded граф, где время добавлено в каждое состояние вплоть до цели"], "correct": 2, "explain": "В gridworld каждое состояние - это только пара x, y, поэтому найденный least-cost путь не учитывает кинематику и такие планы невыполнимы для многих робототехнических систем. Решение из лекции - multi-resolution lattice graph, где состояние включает x, y, orientation, velocity, а каждый переход заранее построен как выполнимый action template; более мелкая сетка проблему ориентации не решает (Lecture_4, слайды 41-43).", "usage": {"code": false, "without": "Разработчик робота-курьера месяцами уменьшает клетку сетки, а планы всё равно требуют разворотов на месте, которые колёсная база не выполняет.", "with": "Разработчик переходит на решётку с ориентацией и скоростью в состоянии и библиотекой заранее выполнимых манёвров - каждый найденный путь проезжаем.", "benefit": "Выбираете представление состояний, при котором план гарантированно выполним"}}, {"q": "Робот планирует путь среди движущихся препятствий. Что произойдёт, если оставить граф состояний без переменной времени, и как устроен компромисс time-bounded lattice graph по лекции?", "options": ["План не учтёт, где будет препятствие в момент прохода; выход - состояния со временем у старта и 2D-сетка без времени дальше", "План станет неполным и не найдёт цель; выход - добавить переменную времени во все состояния графа от самого старта до самой цели", "План останется корректным, как в статичной среде; выход не нужен, столкновения снимает перепланирование на месте", "План станет слишком дорогим по памяти; выход - убрать ориентацию и скорость, оставив в состоянии только x, y и время"], "correct": 0, "explain": "Без времени в состоянии план не знает, где окажется динамическое препятствие в момент прохода клетки. Time-bounded lattice graph объединяет high-D состояния со временем x, y, Θ, v, w, t в решётке G_L вблизи старта и low-D состояния x, y в 2D gridworld G_2D дальше к цели - время во всём графе не нужно, это и есть compact but rich-enough граф (Lecture_4, слайд 44).", "usage": {"code": false, "without": "Планировщик склада строит путь по статичной карте, и погрузчик регулярно упирается в тележку, которая приехала в клетку раньше него.", "with": "Вблизи погрузчика планирование идёт по решётке со временем и учитывает движение тележек, а дальняя часть маршрута считается по дешёвой 2D-сетке.", "benefit": "Учитываете движущиеся препятствия, не раздувая граф на весь маршрут"}}, {"q": "Навигатор на greedy best-first search с эвристикой h_SLD построил маршрут Arad - Sibiu - Fagaras - Bucharest. Почему из Sibiu выбран Fagaras, а не Rimnicu Vilcea, и на сколько километров этот маршрут длиннее оптимального Arad - Sibiu - Rimnicu Vilcea - Pitesti - Bucharest?", "options": ["Из-за большей h: 193 у Fagaras против 176; маршрут 450 против 450, оба равны, жадный поиск здесь оптимален", "Из-за меньшей h: 176 у Fagaras против 193; маршрут 418 против 450, короче на 32, жадный поиск полон и оптимален", "Из-за меньшего g на участке Sibiu - Fagaras; маршрут 450 против 418, длиннее на 99, ошибка в оценке стоимости g", "Из-за меньшей h: 176 у Fagaras против 193; маршрут 450 против 418, длиннее на 32, жадный поиск не оптимален"], "correct": 3, "explain": "Жадный поиск использует только f = h: h_SLD у Fagaras 176 меньше, чем 193 у Rimnicu Vilcea, поэтому выбран Fagaras. Путь через Fagaras стоит 140 + 99 + 211 = 450, а через Rimnicu Vilcea и Pitesti 140 + 80 + 97 + 101 = 418, разница 32 - проявилась неоптимальность жадного алгоритма, поскольку эвристика бывает неточной; g жадный поиск вообще не учитывает (Lecture_4, слайды 65-68 и 71).", "usage": {"code": false, "without": "Команда ставит жадный поиск в навигатор ради скорости и не понимает, почему клиенты жалуются на маршруты длиннее, чем у конкурентов.", "with": "Команда знает, что жадный поиск оптимальности не гарантирует, оценивает разрыв на контрольных парах городов и переходит на A*, где важна длина.", "benefit": "Осознанно выбираете между скоростью жадного поиска и оптимальностью A*"}}, {"q": "В стохастическом мире 4x3 агент вслепую исполняет план «Up, up, right, right, right», не глядя на восприятия. Действие срабатывает с вероятностью 0.8, с 0.1 отклоняется вправо и с 0.1 влево, у стены агент остаётся на месте. Что произойдёт и какой вывод делает лекция?", "options": ["Желаемый путь пройдёт с вероятностью 0.1^4 · 0.8; выход - план с более длинным горизонтом действий", "Желаемый путь пройдёт лишь с вероятностью 0.8^5 около 0.33; нужна политика, отображающая S в A, а не план", "Желаемый путь пройдёт с вероятностью 0.8, как одно действие; для надёжности план достаточно исполнить дважды подряд", "Желаемый путь пройдёт всегда, как в детерминированной среде; план остаётся полноценным решением задачи"], "correct": 1, "explain": "Вероятность пройти желаемый путь равна 0.8^5 = 0.32768, то есть примерно в двух случаях из трёх агент сойдёт с траектории и дальнейшие шаги плана теряют смысл; 0.1^4 · 0.8 = 0.00008 - это вероятность лишь одного обходного пути к цели. Поэтому в стохастическом процессе решением служит не план, а политика, отображающая каждое состояние S в действие A (Lecture_4, слайды 86-88 и 100).", "usage": {"code": false, "without": "Робот на скользком полу выполняет заранее записанную последовательность движений и после первого проскальзывания врезается в стену, продолжая план.", "with": "Роботу задают политику: в каждом состоянии он смотрит, где оказался, и выбирает действие для этого состояния, поэтому проскальзывание не ломает поведение.", "benefit": "Понимаете, когда фиксированный план бесполезен и нужна политика"}}, {"q": "Разработчик по ошибке задал в мире 4x3 «живую» награду R(s) = +0.1 за каждый нетерминальный шаг вместо -0.04. Как изменится поведение агента с оптимальной политикой?", "options": ["Агент пойдёт к +1 кратчайшим путём, рискуя попасть в -1 у стены по дороге", "Агент сохранит прежнюю политику, поскольку знак малой награды на выбор не влияет", "Агент будет избегать обоих выходов и останется в игре ради бесконечной выгоды", "Агент бросится к ближайшему выходу, даже к -1, лишь бы быстрее закончить эпизод"], "correct": 2, "explain": "При R(s) > 0 агент не хочет покидать игру: каждый шаг приносит выгоду, и он бесконечно её накапливает, избегая терминальных состояний. Бег к ближайшему выходу, включая -1, соответствует R(s) < -1.6284, а путь к +1 с риском - диапазону от -1.6284 до -0.4278; при -0.04 агент предпочитает обойти -1 (Lecture_4, слайды 93-95).", "usage": {"code": false, "without": "Тестировщик видит, что агент кружит по полю и никогда не заканчивает эпизод, и неделями ищет ошибку в алгоритме итерации.", "with": "Инженер сразу проверяет знак награды за шаг и понимает, что положительная «живая» награда делает бесконечную игру оптимальной.", "benefit": "Диагностируете странное поведение агента через функцию награды, а не через код"}}, {"q": "Студент предлагает решить систему уравнений Беллмана U(s) = R(s) + γ max_a Σ T(s,a,s')U(s') для 11 состояний мира 4x3 методом Гаусса как обычную линейную систему. Что не так и как поступает алгоритм численной итерации?", "options": ["Оператор max делает систему нелинейной; алгоритм инициализирует U значениями R и обновляет U до сходимости", "Коэффициент γ делает систему вырожденной; алгоритм полагает γ = 1 и решает систему за один проход Гаусса", "Уравнений меньше, чем переменных; алгоритм добавляет по уравнению на каждое действие и решает систему линейно", "Модель переходов T неизвестна; алгоритм сначала оценивает её по выборке эпизодов, а затем решает методом Гаусса"], "correct": 0, "explain": "Уравнений ровно n - по одному на состояние - и n переменных, но оператор max нелинеен, поэтому система нелинейна и методом Гаусса не решается. Алгоритм численной итерации инициализирует полезности значениями R, обновляет U_{i+1}(s) = R(s) + γ max_a Σ T(s,a,s')U_i(s') для каждого состояния и повторяет до сходимости; модель T в MDP известна (Lecture_4, слайды 105-107).", "usage": {"code": false, "without": "Студент пишет решатель на numpy.linalg.solve, получает ошибку или бессмысленные полезности и не понимает, где нелинейность.", "with": "Студент реализует value iteration: цикл обновлений с проверкой close-enough, который сходится к тем же U, что и уравнения Беллмана.", "benefit": "Выбираете верный численный метод для уравнений с оператором max"}}, {"q": "В сетке Q-значения инициализированы нулями, награда 0 всюду, кроме цели. После первой попытки достичь цели все Q, кроме одного, остались нулями. Это ошибка реализации?", "options": ["Нет, это норма: Q меняются только у переходов в цель, а остальные Q остаются нулями при любом числе попыток и эпизодов", "Да, ошибка инициализации: Q нужно заполнять наградами клеток, тогда таблица изменится сразу на первом шаге эпизода", "Да, ошибка в α: при верной скорости обучения все Q на пути к цели обновились бы уже за первую попытку", "Нет, так задумано: в первой попытке меняется лишь Q перехода в цель, дальше награда уходит назад на шаг за попытку"], "correct": 3, "explain": "При нулевых Q и нулевой награде везде, кроме цели, Q-значения не меняются, пока цель не достигнута: в первой попытке обновляется только переход в целевое состояние, следующая попытка изменит Q на два шага от цели, и лишь после достаточного числа попыток награда распространится на все Q - то есть нетерминальные Q не остаются нулями навсегда, а α порядок распространения не меняет: при r=0 и Q'=0 обновление даёт 0 при любой α (Lecture_4, слайды 129-130).", "usage": {"code": false, "without": "Разработчик видит почти пустую Q-таблицу после первого эпизода, решает, что обучение сломано, и переписывает формулу обновления.", "with": "Разработчик знает, что награда распространяется назад по шагу за попытку, и просто запускает достаточно эпизодов, наблюдая, как заполняется таблица.", "benefit": "Отличаете нормальную динамику Q-learning от настоящей ошибки"}}, {"q": "Агент в стохастическом мире 4x3 выполняет план «Up, Up, Right, Right, Right». Желаемое действие срабатывает с вероятностью 0.8, отклонение вправо - 0.1, влево - 0.1. К цели +1 ведут два несовместных пути: основной, где все пять действий срабатывают, и обходной, где каждое из первых четырёх действий отклоняется в нужную сторону, а пятое срабатывает. Какова полная вероятность достичь цели?", "options": ["0.32768", "0.32778", "0.32776", "0.4096"], "correct": 2, "explain": "Шаг 1: основной путь - пять успешных действий подряд, 0.8^5 = 0.32768. Шаг 2: обходной путь - четыре отклонения по 0.1 и одно успешное действие, 0.1^4 · 0.8 = 0.00008. Шаг 3: пути несовместны, вероятности складываются: 0.32768 + 0.00008 = 0.32776. Ответ 0.32768 забывает обходной путь, 0.32778 теряет множитель 0.8 на последнем шаге, 0.4096 - это 0.8^4, четыре шага вместо пяти (Lecture4_Agents_Part1, слайд 88).", "usage": {"code": false, "without": "Планировщик робота считает, что план из пяти шагов «почти наверняка» приведёт к цели, и не закладывает повторные попытки.", "with": "Зная, что даже надёжные на 80% действия дают лишь около 33% успеха за пять шагов, вы закладываете перепланирование после каждого шага.", "benefit": "Честная оценка риска длинного плана вместо иллюзии надёжности."}}, {"q": "Агент стоит в клетке (1,1) мира 4x3 - это левый нижний угол: слева и снизу стены, клетка (1,2) сверху и клетка (2,1) справа свободны. Модель движения: желаемое направление с вероятностью 0.8, отклонение вправо 0.1, влево 0.1; если в выбранном направлении стена, агент остаётся на месте. Агент выполняет Up. Какое распределение вероятностей по следующей клетке?", "options": ["в 1,2 с 0.8; в 2,1 с 0.1; остаться в 1,1 с 0.1", "в 1,2 с 0.8; в 2,1 с 0.1; в 0,1 слева с 0.1", "в 1,2 с 0.9; в 2,1 с 0.1; остаться в 1,1 с 0", "в 1,2 с 1/3; в 2,1 с 1/3; остаться в 1,1 с 1/3"], "correct": 0, "explain": "Шаг 1: для Up три исхода - вверх в (1,2) с 0.8, вправо в (2,1) с 0.1, влево с 0.1. Шаг 2: слева от (1,1) стена, клетки (0,1) не существует, поэтому исход «влево» превращается в «остаться в (1,1)» с той же вероятностью 0.1. Шаг 3: итог - (1,2): 0.8, (2,1): 0.1, (1,1): 0.1, сумма 1. Вариант с 0.9 вверх неверен: вероятность заблокированного исхода не переносится на желаемое направление, а остаётся у исхода «на месте» (Lecture4_Agents_Part1, слайды 79, 87).", "usage": {"code": false, "without": "В симуляторе робота отклонение у стены отправляет агента в несуществующую клетку, и модель переходов перестаёт суммироваться в единицу.", "with": "Вы явно прописываете исход «остаться на месте» для заблокированных направлений, и таблица T(s,a,s') остаётся корректной.", "benefit": "Корректная модель переходов у границ и препятствий."}}, {"q": "Агент сравнивает две последовательности наград: [1, 0, 0] и [0, 0, 1]. Аддитивная полезность U = r0 + r1 + r2, дисконтированная U = r0 + γ·r1 + γ²·r2 при γ = 0.5. Чему равна дисконтированная полезность [0, 0, 1] и какую последовательность предпочтёт агент с дисконтом?", "options": ["0.5, поэтому выбор [1, 0, 0]", "1, поэтому выбор безразличен", "0.125, поэтому выбор [1, 0, 0]", "0.25, поэтому выбор [1, 0, 0]"], "correct": 3, "explain": "Шаг 1: аддитивно обе последовательности дают 1, разницы нет. Шаг 2: с дисконтом [1, 0, 0] = 1 + 0 + 0 = 1, а [0, 0, 1] = 0 + 0.5·0 + 0.5²·1 = 0.25. Шаг 3: 1 > 0.25, агент предпочитает награду сейчас. Ответ 0.5 берёт γ вместо γ² - награда на третьем шаге имеет индекс 2, а не 1 (Lecture4_Agents_Part1, слайды 97-98, 103).", "usage": {"code": false, "without": "Вы задаёте награду только в конце эпизода и удивляетесь, что агент с γ = 0.5 её почти не видит и не учится.", "with": "Вы понимаете, что награда через k шагов весит γ^k, и либо поднимаете γ, либо даёте промежуточные награды.", "benefit": "Осознанный выбор γ под длину эпизода."}}, {"q": "Бесконечный горизонт с дисконтом: награда за шаг не превышает R_max = 1, γ = 0.9. Оцените сверху полезность U_h = Σ γ^i·R(S_i), заменив каждую награду на R_max. Как изменится ответ, если убрать дисконт, то есть взять γ = 1, награда на каждом шаге постоянна, а агент никогда не достигает финального состояния?", "options": ["9, а без дисконта полезность уходит в +∞", "10, а без дисконта полезность уходит в +∞", "0.9, а без дисконта полезность равна 1", "1.11, а без дисконта полезность равна 1"], "correct": 1, "explain": "Шаг 1: Σ γ^i·R_max = R_max·Σ γ^i = R_max/(1-γ) - сумма геометрической прогрессии. Шаг 2: 1/(1-0.9) = 1/0.1 = 10. Шаг 3: при γ = 1 знаменатель обращается в ноль, а сумма постоянных наград на бесконечном горизонте без финального состояния равна +∞. Ответ 9 - это γ/(1-γ): в числителе должна стоять R_max, а не γ; 1.11 - это 1/γ, а 0.9 - одна награда, умноженная на γ (Lecture4_Agents_Part1, слайд 103).", "usage": {"code": false, "without": "Вы масштабируете награды в RL-задаче наугад и получаете переполнение значений при γ, близком к 1.", "with": "Вы заранее знаете, что при R_max = 1 и γ = 0.9 значения не превысят 10, и выбираете нормировку и тип чисел осознанно.", "benefit": "Предсказуемый диапазон значений полезности до запуска обучения."}}, {"q": "Мир 2x2: R(1,1) = R(1,2) = -0.04, терминалы (2,2) = +1 и (2,1) = -1, γ = 1, U₀ = R. Модель 0.8/0.1/0.1, удар в стену - остаться на месте. Для (1,1) ожидания по действиям: Up = 0.8·(-0.04) + 0.1·(-0.04) + 0.1·(-1), Left = 0.9·(-0.04) + 0.1·(-0.04), Down = 0.9·(-0.04) + 0.1·(-1), Right = 0.8·(-1) + 0.1·(-0.04) + 0.1·(-0.04). Чему равно U₁(1,1) после первой итерации value iteration?", "options": ["-0.04, максимум даёт Left", "-0.848, максимум даёт Right", "-0.08, максимум даёт Left", "-0.176, максимум даёт Up"], "correct": 2, "explain": "Шаг 1: Up = -0.032 - 0.004 - 0.1 = -0.136; Left = -0.036 - 0.004 = -0.04; Down = -0.036 - 0.1 = -0.136; Right = -0.8 - 0.004 - 0.004 = -0.808. Шаг 2: максимум -0.04 у Left - уход в стену держит агента подальше от -1. Шаг 3: U₁(1,1) = R(1,1) + γ·max = -0.04 + (-0.04) = -0.08. Ответ -0.04 забывает прибавить R(s), а -0.176 берёт Up вместо максимума (Lecture4_Agents_Part1, слайды 107-110).", "usage": {"code": false, "without": "Вы реализуете value iteration, забываете слагаемое R(s) и получаете значения, которые сходятся не к тому.", "with": "Вы проверяете код на слайдовом примере 2x2: первая итерация должна дать ровно -0.08 для (1,1).", "benefit": "Тест с известным ответом ловит ошибку в формуле Беллмана."}}, {"q": "Мир 2x2 из лекции: R(1,1) = R(1,2) = -0.04, целевые клетки (2,2) = +1 и (2,1) = -1, γ = 1, начальные полезности U₀ = R. Для клетки (1,2) взвешенные суммы по действиям: Up = 0.9·(-0.04) + 0.1·1, Left = 0.9·(-0.04) + 0.1·(-0.04), Down = 0.8·(-0.04) + 0.1·1 + 0.1·(-0.04), Right = 0.8·1 + 0.1·(-0.04) + 0.1·(-0.04). Чему равно U₁(1,2) после первой итерации и что происходит с полезностью целевой клетки (2,2)?", "options": ["0.752, целевая клетка остаётся +1", "0.76, целевая клетка тоже обновляется", "0.792, целевая клетка остаётся +1", "0.752, целевая клетка тоже обновляется"], "correct": 0, "explain": "Шаг 1: Up = -0.036 + 0.1 = 0.064; Left = -0.04; Down = -0.032 + 0.1 - 0.004 = 0.064; Right = 0.8 - 0.004 - 0.004 = 0.792. Шаг 2: максимум 0.792 даёт Right - движение к +1. Шаг 3: U₁(1,2) = R(1,2) + γ·0.792 = -0.04 + 0.792 = 0.752; целевые клетки не пересчитываются и остаются +1 и -1: на слайде прямо сказано «Goal states remain the same». Ответ 0.792 забывает R(s), 0.76 игнорирует отклонения 0.1, а варианты с обновлением целевой клетки противоречат алгоритму (Lecture4_Agents_Part1, слайды 109-110).", "usage": {"code": false, "without": "Ваш цикл value iteration обновляет и целевые клетки, +1 постепенно «размывается», и политика ломается.", "with": "Вы исключаете целевые клетки из обновления и сверяете U₁(1,2) = 0.752 с примером из лекции.", "benefit": "Целевые состояния остаются якорями для сходимости."}}, {"q": "После сходимости value iteration в мире 2x2 из лекции известны U(1,1) = 0.5676, U(1,2) = 0.8881, U(2,2) = +1, U(2,1) = -1. Политика извлекается как π(s) = argmax_a Σ T(s,a,s')·U(s'). Для клетки (1,2): Up = 0.9·U(1,2) + 0.1·U(2,2), Left = 0.9·U(1,2) + 0.1·U(1,1), Down = 0.8·U(1,1) + 0.1·U(2,2) + 0.1·U(1,2), Right = 0.8·U(2,2) + 0.1·U(1,2) + 0.1·U(1,1). Какое действие выберет π(1,2) и с каким ожиданием?", "options": ["Down, ожидание 0.6429", "Right, ожидание 1.0", "Up, ожидание 0.8993", "Right, ожидание 0.9456"], "correct": 3, "explain": "Шаг 1: Up = 0.9·0.8881 + 0.1·1 = 0.7993 + 0.1 = 0.8993; Left = 0.7993 + 0.0568 = 0.8561. Шаг 2: Down = 0.4541 + 0.1 + 0.0888 = 0.6429; Right = 0.8·1 + 0.1·0.8881 + 0.1·0.5676 = 0.8 + 0.0888 + 0.0568 = 0.9456. Шаг 3: argmax = Right, как на слайде. Ответ 1.0 берёт U соседней клетки без взвешивания по T(s,a,s'), а Up проигрывает, потому что в 90% случаев агент упирается в стену и остаётся на месте (Lecture4_Agents_Part1, слайды 114, 116-117).", "usage": {"code": false, "without": "Вы выбираете действие по самому большому U соседней клетки и ведёте робота туда, куда он с вероятностью 0.2 не доедет.", "with": "Вы взвешиваете U всех исходов по модели переходов и выбираете действие с наибольшим ожиданием.", "benefit": "Политика учитывает ненадёжность исполнения, а не только карту ценностей."}}, {"q": "Вторая итерация value iteration в мире 2x2: после первой итерации U(1,2) = 0.752, U(1,1) = -0.08, U(2,1) = -1; R(1,1) = -0.04, γ = 1. Для действия Up из (1,1) исходы: 0.8 - в (1,2), 0.1 - в (2,1), 0.1 - остаться в (1,1). Известно, что Up даёт максимум среди четырёх действий. Чему равно U₂(1,1)?", "options": ["0.5536", "0.4536", "0.4936", "0.5616"], "correct": 1, "explain": "Шаг 1: Σ T·U = 0.8·0.752 + 0.1·(-0.08) + 0.1·(-1) = 0.6016 - 0.008 - 0.1 = 0.4936. Шаг 2: U₂(1,1) = R(1,1) + γ·0.4936 = -0.04 + 0.4936 = 0.4536. Шаг 3: сверка - на слайде вторая итерация даёт ровно 0.4536. Ответ 0.4936 забывает R(s), 0.5616 учитывает только основной исход 0.8, а 0.5536 теряет исход с -1 (Lecture4_Agents_Part1, слайды 104-105, 111).", "usage": {"code": false, "without": "Вы считаете ожидание только по «основному» исходу действия и переоцениваете клетки рядом с ямой -1.", "with": "Вы суммируете все три исхода с их вероятностями, и штраф за соседство с -1 попадает в оценку.", "benefit": "Ожидаемая полезность честно отражает риск отклонений."}}, {"q": "Q-learning с α = 1 и γ = 0.9, правило обновления Q(s,a) ← r(s,a) + γ·max_a' Q(s',a'). Агент из состояния s0 делает действие R, получает r(s0,R) = 0 и попадает в состояние s1, где текущие Q-значения трёх доступных действий равны 66, 81 и 100. Чему станет Q(s0,R)?", "options": ["100.0", "59.4", "90.0", "74.1"], "correct": 2, "explain": "Шаг 1: max{66, 81, 100} = 100. Шаг 2: γ·max = 0.9·100 = 90. Шаг 3: Q(s0,R) = r + 90 = 0 + 90 = 90, как на слайде с примером прогона. Ответ 100 забывает дисконт γ, 74.1 берёт среднее трёх Q вместо максимума, 59.4 - минимум 66 с дисконтом; Q-learning оптимистичен и смотрит на лучшее следующее действие (Lecture4_Agents_Part1, слайды 125, 127).", "usage": {"code": false, "without": "Вы обновляете Q по среднему из следующих действий и получаете заниженные, медленно сходящиеся значения.", "with": "Вы берёте максимум по следующему состоянию с дисконтом, и ценность распространяется назад к старту, как в примере 100 → 90 → 81.", "benefit": "Правильное обратное распространение награды по цепочке состояний."}}, {"q": "Q-learning со взвешенным обновлением Q(s,a) ← (1-α)·Q(s,a) + α·(r + γ·max_a' Q(s',a')), α = 0.7, γ = 1. В сетке из лекции клетка s[1][0] имеет r = 0.04, клетка s[1][1] - r = 0.1; награда начисляется за вход в клетку. Агент из s[1][0] делает действие R и переходит в s[1][1]. Старое Q(s[1][0],R) = 0, все Q(s[1][1],·) = 0. Чему станет Q(s[1][0],R)?", "options": ["0.070", "0.100", "0.030", "0.028"], "correct": 0, "explain": "Шаг 1: награда за переход - это r клетки, в которую вошёл агент: 0.1. Шаг 2: старая часть (1-α)·Q = 0.3·0 = 0, новая часть α·(r + γ·max Q) = 0.7·(0.1 + 1·0) = 0.07. Шаг 3: сумма 0 + 0.07 = 0.07, как на слайде. Ответ 0.1 забывает скорость обучения α, 0.03 умножает награду на 1-α, путая веса старого и нового значений, а 0.028 берёт награду клетки-источника 0.04 вместо клетки назначения (Lecture4_Agents_Part1, слайды 125, 135).", "usage": {"code": false, "without": "Вы записываете в Q-таблицу сырую награду целиком, и одно шумное наблюдение перезатирает всё накопленное.", "with": "Вы смешиваете старое значение и новую цель с весами 1-α и α, и таблица обновляется плавно.", "benefit": "Устойчивое обучение при шумных наградах."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
