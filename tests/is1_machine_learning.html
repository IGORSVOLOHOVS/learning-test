<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IS1: Введение в машинное обучение и оценка моделей</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>IS1: Введение в машинное обучение и оценка моделей</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "is1_machine_learning";
  const QUESTIONS = [{"q": "По таблице «Supervised vs Unsupervised Learning» какая задача соответствует непрерывному выходу при обучении без учителя?", "options": ["regression - подбор функции, предсказывающей число", "clustering - группировка объектов по схожести признаков", "dimensionality reduction - сокращение числа признаков", "classification - подбор функции, предсказывающей класс"], "correct": 2, "explain": "В таблице ячейка Continuous + Unsupervised содержит dimensionality reduction. Regression - это непрерывный выход, но с учителем, а clustering - без учителя, но для дискретного выхода (Lecture_3, слайд 36).", "usage": {"code": false, "without": "Студент видит задачу «сжать 100 непрерывных признаков без разметки» и называет её регрессией или кластеризацией.", "with": "Студент по двум признакам, непрерывность и отсутствие меток, сразу относит задачу к dimensionality reduction.", "benefit": "Быстрая классификация любой ML-задачи по типу выхода и наличию меток."}}, {"q": "Что такое машинное обучение согласно определению, которое даёт лекция?", "options": ["Способность компьютера учиться без явного программирования", "Обучение компьютера с обязательной корректировкой человеком", "Синоним искусственного интеллекта, а не подход к нему", "Набор правил, заданных экспертом вручную для компьютера"], "correct": 0, "explain": "Слайд определяет ML как «field of study that gives computers the ability to learn without being explicitly programmed», а главная цель - учиться автоматически без вмешательства человека. Вариант с обязательной корректировкой человеком противоречит этому (Quiz 2 - FALSE), а ML является лишь подходом к достижению AI, а не его синонимом (Lecture_3, слайд 6).", "usage": {"code": false, "without": "На Moodle-тесте студент ставит TRUE на «ML primary aim is to allow computer learn with human assistance» и теряет балл.", "with": "Студент помнит: ML учится сам по данным, без явного программирования и без обязательной помощи человека, и отвечает верно.", "benefit": "Точный ответ на базовые true/false вопросы о сути ML."}}, {"q": "Какой из перечисленных алгоритмов НЕ относится к supervised learning?", "options": ["similarity learning", "linear regression", "logistic regression", "K-means clustering"], "correct": 3, "explain": "K-means clustering приведён на слайде 34 среди алгоритмов unsupervised learning, так как работает с неразмеченными данными. Linear regression, logistic regression и similarity learning перечислены на слайде 22 как типичные supervised-алгоритмы (Lecture_3, слайд 22).", "usage": {"code": false, "without": "Студент относит K-means к обучению с учителем, потому что «там тоже есть обучение», и ошибается в тесте.", "with": "Студент помнит: K-means не требует меток, значит это unsupervised, а не supervised.", "benefit": "Уверенное разделение алгоритмов по наличию разметки."}}, {"q": "В каком виде машинного обучения программный агент выполняет действия в среде ради максимальной награды, балансируя exploration и exploitation?", "options": ["unsupervised learning", "reinforcement learning", "semi-supervised learning", "representation learning"], "correct": 1, "explain": "Слайд 39 определяет reinforcement learning как метод, где software agent учится действиям в среде, ведущим к максимальному reward, через exploration и exploitation. Semi-supervised learning - это смесь размеченных и неразмеченных данных, а representation learning - автоматический поиск признаков (Lecture_3, слайд 39).", "usage": {"code": false, "without": "Студент читает про агента, среду и награду и называет это unsupervised learning, потому что «меток нет».", "with": "Студент по ключевым словам agent, environment, reward сразу определяет reinforcement learning.", "benefit": "Мгновенное распознавание RL-задачи по её признакам."}}, {"q": "В каком порядке идут последние четыре шага пайплайна «The 7 Steps of Machine Learning» по ai.google?", "options": ["Training, Parameter Tuning, Evaluation, Prediction", "Evaluation, Training, Parameter Tuning, Prediction", "Training, Evaluation, Parameter Tuning, Prediction", "Training, Evaluation, Prediction, Parameter Tuning"], "correct": 2, "explain": "Слайд перечисляет 7 шагов: Gathering Data, Data Preparation, Choosing a Model, Training, Evaluation, Parameter Tuning, Prediction. Parameter Tuning идёт после Evaluation, а не до неё, и Prediction замыкает пайплайн (Lecture_3, слайд 52).", "usage": {"code": false, "without": "Студент ставит Prediction перед Parameter Tuning и на вопрос «что после Evaluation» отвечает неверно.", "with": "Студент воспроизводит цепочку: обучили, оценили, подстроили параметры, только потом предсказываем.", "benefit": "Твёрдое знание порядка шагов ML-пайплайна для теста."}}, {"q": "Какая техника НЕ входит в четвёрку распространённых техник нормализации по слайду «Normalization»?", "options": ["bucketing - разбиение числовых значений на категории", "z-score - число стандартных отклонений от среднего", "log scaling - сжатие значений при степенном распределении", "clipping - обрезка выбросов до фиксированного значения"], "correct": 0, "explain": "Четыре техники нормализации на слайде: scaling to a range, clipping, log scaling, z-score. Bucketing - отдельная операция перевода числовых данных в категориальные по порогам, слайд 53 противопоставляет её нормализации (Lecture_3, слайд 54).", "usage": {"code": false, "without": "Студент включает bucketing в список нормализации, потому что это тоже «преобразование числовых данных».", "with": "Студент разделяет: нормализация приводит к общему масштабу, а bucketing превращает число в категорию.", "benefit": "Чёткое различие двух видов преобразования числовых данных."}}, {"q": "Что представляет собой hold-out method проверки обобщающей способности модели?", "options": ["Обучение K раз на K-1 частях данных с проверкой на оставшейся части", "Удаление выбросов и пропусков из данных перед обучением модели", "Многократная выборка с возвращением для построения ансамбля моделей", "Случайное разбиение данных на два или три независимых набора"], "correct": 3, "explain": "Слайд: «Given data is randomly partitioned into two or three independent sets»; вариация random sampling лишь повторяет такое же разбиение несколько раз и усредняет accuracy. Обучение K раз на K-1 частях с проверкой на оставшейся - это k-fold cross-validation со слайда 80, а выборка с возвращением - bootstrap для ансамблей (Lecture_3, слайд 76).", "usage": {"code": false, "without": "Студент путает hold-out с k-fold и на вопрос о методе с одним разбиением описывает схему K-1 частей плюс оставшаяся.", "with": "Студент знает: hold-out - одно случайное разбиение на train/test или train/validation/test, дёшево, но чувствительно к малым и несбалансированным выборкам.", "benefit": "Правильный выбор и описание метода валидации."}}, {"q": "Как вычисляется коэффициент детерминации R^2 через SST, сумму квадратов отклонений наблюдений от их среднего, и SSE, сумму квадратов ошибок предсказания?", "options": ["Сумма SST и SSE, делённая на число n", "Разность SST и SSE, делённая на SST", "Разность SSE и SST, делённая на SSE", "Отношение SSE к SST без вычитания"], "correct": 1, "explain": "На слайде «Performance metrics» R^2 = (SST - SSE) / SST: доля дисперсии наблюдений, объяснённая моделью. Отношение SSE к SST - это доля необъяснённой дисперсии, равная 1 - R^2, а деление на n относится к MSE = SSE / n (Lecture_5, слайд 10).", "usage": {"code": false, "without": "Студент считает R^2 как SSE/SST и получает число, которое тем больше, чем хуже модель.", "with": "Студент вычисляет R^2 как долю объяснённой дисперсии и правильно интерпретирует значение близкое к 1 как хорошую подгонку.", "benefit": "Верный расчёт и трактовка главной метрики регрессии."}}, {"q": "Пациент действительно болен раком, класс 1, а модель выдала «no cancer», класс 0. В какую ячейку confusion matrix попадает этот случай?", "options": ["True Negative", "True Positive", "False Negative", "False Positive"], "correct": 2, "explain": "False Negative - actual 1, predicted 0: модель ошиблась и предсказала отрицательный класс, пример со слайда - больной раком классифицирован как no-cancer. False Positive - обратная ситуация, здоровый человек помечен как больной (Lecture_5, слайд 15).", "usage": {"code": false, "without": "Студент называет пропущенного больного False Positive, потому что «рак - это positive», и путает ячейки матрицы.", "with": "Студент разбирает: «false» - модель ошиблась, «negative» - предсказан класс 0, значит это FN.", "benefit": "Безошибочная разметка ячеек confusion matrix по actual и predicted."}}, {"q": "Какая величина отложена по оси X кривой ROC?", "options": ["False Positive Rate, доля негативов, названных позитивными", "True Positive Rate, доля позитивов, названных позитивными", "Precision, доля верных среди всех положительных предсказаний", "Threshold, порог вероятности для отнесения объекта к классу"], "correct": 0, "explain": "Слайд: «The ROC curve is plotted with TPR against the FPR where TPR is on y-axis and FPR is on the x-axis», причём FPR = 1 - Specificity, а TPR = Sensitivity. TPR лежит на оси Y, а threshold не является осью - каждое его значение задаёт лишь одну точку на кривой (Lecture_5, слайд 23).", "usage": {"code": false, "without": "Студент читает ROC-график, считая ось X порогом, и не понимает, почему точка 1,1 означает «все здоровые помечены больными».", "with": "Студент знает: X - FPR, Y - TPR, диагональ - случайный классификатор, и правильно сравнивает кривые.", "benefit": "Осмысленное чтение ROC-кривой и AUC."}}, {"q": "В задаче semi-supervised learning есть немного размеченных примеров и очень много неразмеченных. Почему слайд требует специализированные semi-supervised алгоритмы, а не обычный supervised алгоритм?", "options": ["Он переобучается на любом наборе объёмом меньше тысячи примеров", "Он не умеет извлекать пользу из большой неразмеченной части данных", "Он требует непрерывного числового выхода, а метки здесь категориальные", "Он не получает от среды сигнал вознаграждения за принятые решения"], "correct": 1, "explain": "По слайду ни supervised, ни unsupervised алгоритмы не умеют извлекать пользу из смеси размеченных и неразмеченных данных, поэтому нужны специализированные алгоритмы, которые используют оба вида данных для лучших предсказаний. Вознаграждение относится к reinforcement learning, а тип выхода тут ни при чём (Lecture_3, слайды 38 и 49).", "usage": {"code": false, "without": "Аналитик обучает классификатор на 200 размеченных фото и выбрасывает 50 000 неразмеченных, качество остаётся низким.", "with": "Он берёт semi-supervised алгоритм и подключает все 50 000 неразмеченных снимков, модель улучшается без дополнительной разметки.", "benefit": "Неразмеченные данные перестают быть балластом и повышают качество модели."}}, {"q": "Модель по своей конструкции разделяет только два класса, а в задаче классов три: apple, orange, banana. Какой приём позволяет применить такую модель к этой задаче?", "options": ["Применить bucketing к выходу модели, разбив его на три корзины по порогам", "Кластеризовать объекты k-means без меток и сопоставить кластеры трём классам", "Построить One-to-All классификаторы, по одному на каждый из классов", "Обучить linear regression на кодах 0, 1, 2 и округлять предсказанное значение"], "correct": 2, "explain": "Слайд говорит, что многие модели поддерживают multi-class классификацию by design, а для остальных нужны специальные приёмы вроде One-to-All классификаторов: на каждый класс строится свой бинарный классификатор «этот класс против всех остальных». Кластеризация относится к unsupervised learning и не использует метки, а регрессия с округлением и bucketing выхода как способ многоклассовой классификации на слайде не упоминаются (Lecture_3, слайд 32).", "usage": {"code": false, "without": "Разработчик видит, что его бинарная модель не принимает три метки, и отказывается от неё в пользу более слабой.", "with": "Он строит три One-to-All классификатора и получает многоклассовое решение на той же модели.", "benefit": "Бинарная модель решает многоклассовую задачу без замены алгоритма."}}, {"q": "В признаке есть несколько выбросов, но не настолько экстремальных, чтобы обрезать значения. Какую технику нормализации слайд рекомендует именно для этого случая?", "options": ["Z-score, дающий распределению среднее 0 и стандартное отклонение 1", "Bucketing по квантилям, чтобы выбросы попали в отдельную крайнюю корзину", "Log scaling, поскольку признак с выбросами всегда имеет степенное распределение", "Feature clipping с порогом, установленным на уровне самого крупного выброса"], "correct": 0, "explain": "Слайд прямо говорит, что z-score полезен, когда есть несколько выбросов, но не настолько экстремальных, чтобы требовался clipping. Clipping предназначен для экстремальных выбросов, а log scaling для степенного распределения, где у горстки значений много точек (Lecture_3, слайды 56-58).", "usage": {"code": false, "without": "Инженер обрезает все зарплаты выше порога и теряет реальную разницу между высокими доходами.", "with": "Он применяет z-score: выбросы остаются, но признак получает среднее 0 и std 1 и не ломает обучение.", "benefit": "Правильная нормализация сохраняет информацию о выбросах и стабилизирует модель."}}, {"q": "Чем корзины с quantile boundaries отличаются от корзин с equally spaced boundaries при бакетинге цены автомобиля на слайдах?", "options": ["Ширина всех интервалов одинакова, а число наблюдений в корзинах сильно различается", "Границы задаёт эксперт по смыслу признака, а не по распределению его значений", "Границы берутся по логарифму значения, чтобы сжать длинный хвост дорогих машин", "Границы стоят гуще там, где данных больше, и корзины наполнены примерно поровну"], "correct": 3, "explain": "На графике с quantile boundaries красные границы густо стоят в диапазоне 5000-17000, где продано много машин, и редко в хвосте, так что в каждой корзине примерно одинаковое число наблюдений. Одинаковая ширина интервалов это как раз equally spaced boundaries (Lecture_3, слайды 60-61).", "usage": {"code": false, "without": "Аналитик режет цены на равные интервалы по 5000 и получает десяток пустых корзин для дорогих машин.", "with": "Он ставит границы по квантилям, и каждая корзина содержит достаточно примеров для обучения.", "benefit": "Категориальный признак получается информативным по всему диапазону значений."}}, {"q": "Какое утверждение о сравнении hold-out метода и k-fold cross-validation соответствует слайдам?", "options": ["Hold-out на малой выборке не страдает от высокой дисперсии из-за шума в данных", "K-fold оценивает качество на новых данных лучше, но дороже вычислительно", "K-fold обучает модель один раз и потому дешевле hold-out по вычислениям", "Hold-out точнее k-fold, потому что его тестовый набор полностью независим"], "correct": 1, "explain": "По слайду cross-validation даёт лучшую оценку качества модели на новых данных по сравнению с hold-out, но вычислительно дорога при большом объёме данных. K-fold обучает модель K раз, а hold-out на малой или несбалансированной выборке даёт нерепрезентативные наборы и высокую дисперсию из-за шума (Lecture_3, слайды 76 и 80).", "usage": {"code": false, "without": "Студент один раз делит 300 строк на train и test, получает случайную оценку 91% и верит ей.", "with": "Он делает 5-fold cross-validation, усредняет пять оценок и видит реальные 84% с разбросом.", "benefit": "Оценка качества становится устойчивой, а не зависящей от одного случайного разбиения."}}, {"q": "По какому критерию в простой линейной регрессии ŷ = w0 + w1x подбирается наилучшая прямая, то есть best fitted model?", "options": ["Минимизация MAPE, то есть средней абсолютной процентной ошибки прогноза", "Минимизация SST, то есть общего разброса наблюдений вокруг их среднего", "Минимизация RSS, то есть суммы квадратов остатков между yi и прогнозом", "Минимизация числа параметров w, чтобы модель оставалась максимально простой"], "correct": 2, "explain": "Слайд определяет RSS как сумму квадратов разностей yi и ŷi и говорит, что прямая, минимизирующая RSS, и есть best fitted model, то есть та, у которой суммарная площадь квадратов остатков наименьшая. SST считается вокруг среднего наблюдений и от прямой вообще не зависит, MAPE на слайде метрик служит для оценки уже подобранной модели, а число параметров в простой регрессии фиксировано и критерием подбора не является (Lecture_5, слайды 9-10).", "usage": {"code": false, "without": "Аналитик подбирает прямую цены от площади на глаз и не может объяснить, почему она лучше соседней.", "with": "Он считает RSS для кандидатов и выбирает прямую с наименьшей суммой квадратов остатков.", "benefit": "Выбор модели опирается на измеримый критерий, а не на интуицию."}}, {"q": "Какая метрика классификации, по слайду, информирует о false negatives, то есть о том, сколько положительных случаев модель пропустила?", "options": ["Recall, доля пойманных среди всех реально положительных", "Precision, доля верных среди всех предсказанных положительных", "Specificity, доля реально отрицательных, названных отрицательными", "Accuracy, доля верных предсказаний среди всех наблюдений"], "correct": 0, "explain": "Слайд прямо говорит: recall информирует о работе классификатора относительно false negatives, то есть сколько случаев мы пропустили, а precision относительно false positives. Specificity считается среди реально отрицательных и названа полной противоположностью recall (Lecture_5, слайды 19-20).", "usage": {"code": false, "without": "Врач хвалит модель за precision 98%, не замечая, что она пропускает половину больных.", "with": "Он смотрит на recall 52% и понимает, что модель теряет почти каждого второго пациента.", "benefit": "Пропущенные положительные случаи видны сразу по правильной метрике."}}, {"q": "Почему арифметическое среднее precision и recall считается плохой сводной метрикой, и чем F1-score лучше?", "options": ["Оно всегда меньше F1 и потому систематически занижает качество хорошей модели", "Оно не учитывает true negatives, тогда как F1 включает их в свой знаменатель", "Оно годится лишь для сбалансированных классов, тогда как F1 совпадает с accuracy", "Оно прячет провал одной из метрик, тогда как F1 ближе к меньшему из двух чисел"], "correct": 3, "explain": "На слайде при precision 3% и recall 100% арифметическое среднее даёт 51%, а F1 = 2*3*100/103 = 5%: F1 как гармоническое среднее ближе к меньшему числу и поднимает флаг, если одна метрика провалена. Арифметическое среднее никогда не меньше гармонического, F1 не содержит TN и не совпадает с accuracy (Lecture_5, слайд 21).", "usage": {"code": false, "without": "Менеджер видит среднее 51% по модели, которая помечает всё как спам, и одобряет её.", "with": "Он считает F1 и получает 5%, что сразу показывает бесполезность модели.", "benefit": "Одна честная цифра вместо усреднения, маскирующего провал."}}, {"q": "Что делает сигмоида y = 1/(1 + e^(-f(x))) с выходом линейной комбинации f(x) = β0 + β1x1 + ... + βnxn в логистической регрессии?", "options": ["Округляет выход до ближайшего из двух значений 0 или 1", "Сжимает всю числовую ось в открытый интервал от 0 до 1", "Нормализует входные признаки к среднему 0 и дисперсии 1", "Растягивает ограниченный выход на всю числовую ось"], "correct": 1, "explain": "По слайду y = 1/(1 + e^(-f(x))) принадлежит интервалу (0; 1): линейная комбинация может быть любым числом, а сигмоида переводит её в значение между 0 и 1, которое трактуется как вероятность. Округления до 0/1 нет, это гладкая S-образная кривая, проходящая через 0.5 при f(x) = 0 (Lecture_5, слайды 31-32).", "usage": {"code": false, "without": "Разработчик выдаёт клиенту сырое f(x) = 3.7 как вероятность оттока и получает вопрос, что это значит.", "with": "Он пропускает f(x) через сигмоиду и сообщает вероятность 0.98, понятную бизнесу.", "benefit": "Выход модели становится вероятностью, с которой можно задавать порог решения."}}, {"q": "Какие максимальные значения принимают Gini impurity и энтропия для бинарного узла, где оба класса представлены поровну, p = 0.5?", "options": ["Gini равен 1 и энтропия равна 1", "Gini равен 0.5 и энтропия равна 0.5", "Gini равен 0.5 и энтропия равна 1", "Gini равен 1 и энтропия равна 0.5"], "correct": 2, "explain": "Для Gini I_G = 1 - Σ pi^2 при p1 = p2 = 0.5 получаем 1 - 0.25 - 0.25 = 0.5, что и есть вершина параболы на графике; энтропия H = -Σ p log2 p при 0.5/0.5 равна 1. Обе метрики равны 0 у чистого узла, но их максимумы различаются (Lecture_5, слайды 55 и 57-58).", "usage": {"code": false, "without": "Студент видит Gini 0.5 у узла и думает, что узел наполовину чистый, хотя это худший случай.", "with": "Он помнит, что 0.5 это максимум Gini, и понимает, что узел полностью смешан, как и при энтропии 1.", "benefit": "Значения критериев чистоты читаются правильно в шкале каждого из них."}}, {"q": "Ритейлер хочет разбить клиентов на группы по покупательскому поведению, готовых меток групп нет. Какой вид ML и какая задача из карты Kinds of ML здесь подходят?", "options": ["Supervised learning, задача regression", "Reinforcement learning, задача robot navigation", "Supervised learning, задача classification", "Unsupervised learning, задача clustering"], "correct": 3, "explain": "Меток групп нет, значит это unsupervised learning, а разбиение объектов на группы по сходству - задача clustering; на карте под ней стоят customer segmentation и targeted marketing. Classification и regression требуют размеченных примеров, а reinforcement learning - среды с наградой. (Lecture_3, слайд 41)", "usage": {"code": false, "without": "Аналитик пытается обучить классификатор сегментов, но меток нет, и он тратит недели на ручную разметку клиентов.", "with": "Он сразу запускает кластеризацию по поведению и получает сегменты без разметки.", "benefit": "Правильный вид ML выбран до начала работы, без лишней разметки."}}, {"q": "У банка есть обучающая выборка с известным исходом по каждому кредиту, целевой признак принимает два значения: дефолт или нет дефолта. Какие методы применимы по логике Quiz 4-6 лекции?", "options": ["Clustering methods, потому что целевых классов всего два", "Classification methods, так как выход дискретный и есть метки", "Dimensionality reduction, потому что признаков в выборке много", "Regression methods, потому что есть размеченная обучающая выборка"], "correct": 1, "explain": "Quiz 4 задаёт дискретный выход и обучающую выборку. По определениям лекции classification - функция, предсказывающая класс, где Y - дискретные метки классов; regression предсказывает число с непрерывным Y; clustering группирует данные без меток. Значит здесь classification. (Lecture_3, слайды 42, 25, 27, 35)", "usage": {"code": false, "without": "Разработчик строит регрессию на метке дефолт/нет и получает бессмысленные дробные прогнозы.", "with": "Он видит дискретный целевой признак и метки и сразу берёт классификатор.", "benefit": "Класс задачи определяется за минуту по типу выхода и наличию меток."}}, {"q": "Для линейной регрессии цены жилья в датасете есть строковая колонка «город» и числовая «площадь» с разбросом от 20 до 500. Что по Quiz 7 обязательно сделать до обучения?", "options": ["Разбить «площадь» на корзины и удалить колонку «город» из данных", "Оставить оба признака как есть, модель сама примет строки", "Перевести «город» в числовой вид через IDs и one-hot encoding", "Нормализовать «площадь» к одной шкале, а «город» оставить строкой"], "correct": 2, "explain": "Quiz 7 противопоставляет два преобразования: перевод всех нечисловых признаков в числовые и нормализацию числовых данных. Слайд Normalization говорит о нормализации лишь «may be useful», а слайд Transform Categorical Data показывает путь категорий: Categories - IDs через index lookup - one-hot encoding - feature vector. Поэтому обязательное действие - закодировать «город». (Lecture_3, слайды 66, 62, 54)", "usage": {"code": false, "without": "Обучение падает с ошибкой на строковой колонке, а разработчик первым делом нормализует площадь и не понимает, почему не помогло.", "with": "Он кодирует город через one-hot, а масштабирование площади оставляет на потом.", "benefit": "Обязательные шаги подготовки отделены от желательных."}}, {"q": "Признак «доход»: у большинства клиентов значения малы, у редких - огромны, распределение похоже на power law. Нужна линейная связь дохода с суммой покупки. С какой нормализации начать по слайдам Normalization лекции?", "options": ["Log scaling, так как распределение имеет форму power law", "Bucketing с квантилями, так как линейная связь здесь не нужна", "Clipping, так как редкие большие значения - это выбросы", "Z-score, так как выбросов мало и они не экстремальны"], "correct": 0, "explain": "Слайд Log Scaling: он помогает, когда у горстки значений много точек, а у большинства других мало - это power law distribution; тот же график ratings per movie стоит в Quiz 9. Clipping по слайду нужен для экстремальных выбросов, z-score - когда выбросов мало и они не экстремальны, а бакетинг превращает число в категории, а не выправляет форму распределения. (Lecture_3, слайды 57, 56, 58, 68)", "usage": {"code": false, "without": "Линейная модель на сырых доходах даёт плохой прогноз, аналитик перебирает трансформации наугад.", "with": "Увидев power law, он сразу применяет log scaling и получает линейную связь.", "benefit": "Трансформация выбирается по форме распределения, а не перебором."}}, {"q": "Гистограмма цен автомобилей: почти все машины дешевле 20000, выше 25000 - единичные продажи вплоть до 45000. Какой бакетинг выбрать, чтобы в каждой корзине хватало наблюдений?", "options": ["Equally spaced boundaries, чтобы все корзины были одной ширины", "Одна корзина на весь диапазон, чтобы не терять редкие продажи", "Clipping вместо бакетинга, чтобы обрезать все цены выше 25000", "Quantile boundaries, чтобы корзины были равно наполнены"], "correct": 3, "explain": "На данных Car Price равные интервалы оставляют корзины выше 25000 почти пустыми, а quantile boundaries ставят границы плотно там, где много машин, и одну широкую корзину на хвост. Одна корзина на всё уничтожит информацию, clipping не создаёт категорий. (Lecture_3, слайды 60 и 61)", "usage": {"code": false, "without": "Аналитик режет цены на 10 равных интервалов, и больше половины корзин оказываются почти пустыми.", "with": "Он берёт квантильные границы, и в каждой корзине оказывается достаточно наблюдений.", "benefit": "Корзины наполнены равномерно, модель не учится на пустых категориях."}}, {"q": "Аналитик, опираясь на опыт в логистике, добавляет в датасет признак «расстояние до склада». Как слайд Feature Engineering классифицирует этот шаг и что на нём названо примером automated feature engineering?", "options": ["Manual FE как отбор под допущения модели; пример automated FE - quantile bucketing", "Manual FE как создание признака по domain expertise; пример automated FE - embeddings", "Automated FE, так как признак числовой; пример manual FE - ручной отбор признаков", "Manual FE как отбор признаков по важности для модели; пример automated FE - z-score scaling"], "correct": 1, "explain": "На слайде Feature Engineering создание признаков на основе domain expertise - первый пункт manual feature engineering, а к automated feature engineering отнесены встроенный отбор признаков модели, dimensionality reduction и embeddings. Отбор по важности и под допущения модели - другие пункты manual FE, они про выбор, а не создание признака; z-score и quantile bucketing - это нормализация и бакетинг, отдельные шаги подготовки данных. (Lecture_3, слайды 63 и 53)", "usage": {"code": false, "without": "Команда считает, что feature engineering делает только библиотека, и упускает очевидный по опыту признак.", "with": "Она сочетает ручные признаки от эксперта с автоматическим отбором.", "benefit": "Экспертное знание и автоматика используются вместе, а не вместо друг друга."}}, {"q": "Датасет 300 строк, 4 класса, в самом малом классе 15 строк. Какую схему проверки выбрать и что контролировать при разбиении по слайдам о hold-out и cross-validation?", "options": ["Удаление малого класса из данных и обычный hold-out на остатке", "Hold-out 0.75/0.25 одним случайным разбиением без учёта долей классов", "K-fold с balanced splitting, чтобы каждый класс был в каждом наборе", "Обучение на всех 300 строках и оценка качества на тех же строках"], "correct": 2, "explain": "Hold-out на малом или несбалансированном датасете даёт нерепрезентативные наборы (слайд 76); cross-validation оценивает качество на новых данных лучше и дорога лишь при большом объёме данных, а 300 строк - это немного (слайд 80); слайд о data splitting требует balanced splitting, чтобы каждый класс был представлен и в training, и в testing set (слайд 79). Обучение и оценка на одних данных ничего не говорит об обобщении. (Lecture_3, слайды 76, 79-80)", "usage": {"code": false, "without": "Один случайный split оставляет малый класс без примеров в тесте, и метрика по нему не считается.", "with": "K-fold со стратификацией даёт устойчивую оценку по всем четырём классам.", "benefit": "Оценка качества не зависит от удачного или неудачного разбиения."}}, {"q": "Банк строит модель, где положительный класс - мошенник, и таким клиентам отказывает в кредите. Отказ честному клиенту бьёт по репутации сильнее, чем один пропущенный мошенник. С каким кейсом слайда «When to minimize what?» это схоже и какую ошибку минимизировать?", "options": ["Со spam-фильтром: минимизировать False Positives, чтобы не терять честных", "С cancer detection: минимизировать False Negatives, ловить всех мошенников", "С обоими кейсами сразу: минимизировать FP и FN в равной мере по правилу слайда", "Со случаем 95% accuracy: максимизировать accuracy как основную метрику"], "correct": 0, "explain": "Положительный класс - мошенник, значит отказ честному клиенту - это False Positive, как важное письмо, попавшее в спам; слайд говорит, что в такой ситуации минимизируют False Positives, потому что цена ложной тревоги выше цены пропуска. Cancer detection - обратный случай, где ловят всех больных ценой ложных тревог, а единого правила «поровну» слайд не даёт: всё зависит от бизнес-контекста. (Lecture_5, слайд 16)", "usage": {"code": false, "without": "Команда крутит порог, чтобы поймать всех мошенников, и банк теряет честных клиентов.", "with": "Она осознанно минимизирует FP и следит за precision.", "benefit": "Тип минимизируемой ошибки выбран из бизнес-контекста, а не по привычке."}}, {"q": "В данных 98% транзакций легальные и 2% мошеннические. Заказчик просит отчитываться одной accuracy. Что ответить по слайду об accuracy и какие метрики предложить?", "options": ["Accuracy недопустима без нормализации данных; брать RSS и R-squared", "Accuracy подходит, так как классы независимы; добавить лишь ROC-кривую", "Accuracy подходит при любом балансе классов; дополнить её метрикой MAPE", "Accuracy недопустима из-за мажоритарного класса; брать recall и F1"], "correct": 3, "explain": "Слайд прямо говорит, что accuracy НИКОГДА не должна использоваться, когда классы в большинстве принадлежат одному классу: модель «всё легально» даст 98%. Вместо неё нужны precision, recall и F1; MAPE и RSS - метрики регрессии. (Lecture_5, слайд 17)", "usage": {"code": false, "without": "Отчёт показывает 98% accuracy, а модель не ловит ни одной мошеннической транзакции.", "with": "Аналитик показывает recall и F1 по классу мошенничества и объясняет, почему accuracy молчит.", "benefit": "Метрика отражает реальную пользу модели на редком классе."}}, {"q": "Модель скоринга выдаёт вероятность от 0 до 1. Порог снижают с 0.9 до 0.1. Что произойдёт с recall и числом False Positives и как по ROC выбрать порог, если бизнес готов принять не более 10% FPR?", "options": ["Recall упадёт, FP упадут; на ROC взять точку с наибольшими FPR и TPR разом", "Recall вырастет, FP вырастут; на ROC брать точку с FPR до 0.1 и наибольшим TPR", "Recall упадёт, FP вырастут; на ROC взять точку с наименьшим TPR при любом уровне FPR", "Recall вырастет, FP не изменятся; на ROC порог всегда фиксирован на 0.5"], "correct": 1, "explain": "Чем ниже порог, тем больше объектов получают класс 1: растут и TPR, то есть recall, и число False Positives - на слайдах ROC при пороге 0 TPR = 1 и FPR = 1. Слайд говорит, что порог выбирают по тому, сколько False Positives готов принять бизнес, то есть по точке ROC с допустимым FPR и наибольшим TPR. (Lecture_5, слайд 25)", "usage": {"code": false, "without": "Разработчик оставляет порог 0.5 по умолчанию и не может объяснить бизнесу, сколько ложных срабатываний это даст.", "with": "Он показывает ROC и берёт точку при FPR 0.1 с максимальным TPR.", "benefit": "Порог связан с бизнес-ограничением на ложные срабатывания."}}, {"q": "Модель A: accuracy на training 99%, на test 68%. После упрощения модель B: training 90%, test 86%. Что происходило с моделью A и где она стояла относительно sweet spot на кривой Generalisation?", "options": ["Overfitting и high variance, модель A правее sweet spot по оси model complexity", "Underfitting и high bias, модель A стоит левее sweet spot по оси model complexity", "Underfitting и high variance, модель A стоит точно в sweet spot по оси model complexity", "Overfitting и high bias, модель A стоит левее sweet spot по оси model complexity"], "correct": 0, "explain": "Большой разрыв между training 99% и test 68% - признак overfitting: training accuracy продолжает расти с ростом сложности, а generalization accuracy уже падает, значит модель правее sweet spot; по слайду 4 overfitting = high variance. Underfitting и high bias - левая часть кривой, где низки обе accuracy, что не соответствует 99% на training (Lecture_5, слайд 2 и 4).", "usage": {"code": false, "without": "Инженер видит 99% на training, радуется и выкатывает модель в прод, где она даёт 68% и подводит клиентов.", "with": "Разрыв train/test сразу читается как overfitting: модель упрощают или регуляризуют и получают устойчивые 86% на новых данных.", "benefit": "Разрыв train/test диагностируется за секунды и модель не уходит в прод переобученной."}}, {"q": "Студент на датасете из 120 строк запускает hold-out пять раз с разными random_state и получает accuracy 0.62, 0.81, 0.70, 0.88, 0.65. В чём причина разброса по лекции и что делать?", "options": ["Нормализация искажает случайное разбиение, поэтому нужно убрать масштабирование и повторить один запуск", "Разброс случаен и безвреден, поэтому нужно отчитаться лучшим результатом 0.88 как итоговой оценкой качества", "Модель переобучена на 120 строках, поэтому нужно урезать число признаков и повторить один hold-out", "Наборы при малом датасете нерепрезентативны, шум даёт high variance, нужно усреднять повторы или k-fold"], "correct": 3, "explain": "Hold-out на малом датасете даёт нерепрезентативные наборы, и шум в данных ведёт к high variance оценки; лекция предлагает повторять hold-out и усреднять результаты или использовать k-fold, где K оценок усредняются. Взять лучший запуск 0.88 - это подгонка под удачное разбиение, а не оценка модели (Lecture_3, слайд 76 и 80).", "usage": {"code": false, "without": "Аналитик берёт удачное разбиение с 0.88, пишет его в отчёт, а на реальных данных модель даёт 0.65 и доверие к нему падает.", "with": "Видя разброс на 120 строках, он запускает 5-fold, отчитывает среднее 0.73 с разбросом и честно объясняет, что данных мало.", "benefit": "Оценка на малых данных перестаёт зависеть от везения с random_state."}}, {"q": "Менеджер просит посчитать accuracy кластеризации клиентов по confusion matrix, как для классификатора. Почему это невозможно напрямую при unsupervised learning?", "options": ["Для accuracy не хватает данных, при большем объёме выборки confusion matrix посчитается", "Без меток нет ground truth, TP и FP не определены, оценка становится частью исследования", "Для кластеров нужен recall вместо accuracy, а confusion matrix строится только по нему", "Кластеризация всегда даёт 100% точность на обучающих данных, поэтому метрика неинформативна"], "correct": 1, "explain": "При unsupervised learning данные не размечены: no labels means no ground truth for comparison, поэтому нельзя сказать, какое отнесение к кластеру верно, а какое нет, и сама оценка становится частью поиска скрытых закономерностей. Объём данных тут ни при чём - меток не появится, сколько бы строк ни добавили (Lecture_3, слайд 35).", "usage": {"code": false, "without": "Аналитик обещает менеджеру accuracy сегментации, неделю ищет способ посчитать TP для кластеров и приносит выдуманную цифру.", "with": "Он сразу объясняет, что меток нет, и предлагает оценивать сегменты по бизнес-смыслу: отклик на cross-selling по каждому кластеру.", "benefit": "Ожидания заказчика по метрикам кластеризации выставляются правильно с первого разговора."}}, {"q": "Датчик обычно даёт температуры 10-40, но при сбое изредка выдаёт 999. Аналитик применил z-score без предварительной обработки выбросов. Что произойдёт и что надо было сделать сначала?", "options": ["Значения 999 требуют log scaling, поскольку редкие крупные значения образуют power law распределение", "Значения 999 не повлияют на масштаб, так как z-score считает отклонения только для типичных точек выборки", "Значения 999 раздуют std и сожмут нормальные температуры к нулю, сначала нужен clipping выбросов", "Значения 999 z-score уберёт автоматически, ведь он приводит распределение к mean 0 и std 1 без потерь"], "correct": 2, "explain": "Z-score выражает значение в числе стандартных отклонений от среднего; экстремальные 999 резко увеличат std, и все нормальные значения 10-40 окажутся в узкой полосе около нуля. Лекция прямо разводит случаи: z-score - для немногих не слишком экстремальных выбросов, а для extreme outliers сначала feature clipping, например все температуры выше 40 приводятся к 40 (Lecture_3, слайд 56 и 58).", "usage": {"code": false, "without": "Инженер нормализует показания датчика z-score, модель видит все реальные температуры как одинаковые нули и ничего не различает.", "with": "Он сначала клипует всё выше 40 к 40, потом применяет z-score, и распределение нормальных температур сохраняет форму.", "benefit": "Редкие сбои датчика не уничтожают информативность всего признака."}}, {"q": "Команда подбирала гиперпараметры по test set, затем отчиталась accuracy на нём как финальной оценкой. Какой набор должен был использоваться для подбора и что случилось с оценкой?", "options": ["Подбирать нужно по validation set, а test перестал быть независимой финальной проверкой", "Подбирать нужно по test set, всё сделано верно, ведь именно для этого test set и выделяется", "Подбирать нужно по validation set только при k-fold, а при hold-out test set для этого и предназначен", "Подбирать нужно по training set, а оценка на test осталась объективной, раз метки были скрыты"], "correct": 0, "explain": "По схеме hold-out с тремя наборами validation set оценивает модели during the learning process и даёт chosen model, а test set используется для финальной оценки уже выбранной модели; на слайде L5 hyper-parameter tuning замкнут в цикл с validation results, а hold-out test идёт отдельно в tests results. Если test участвовал в выборе, он уже не независимая проверка на новых данных (Lecture_3, слайд 78; Lecture_5, слайд 6).", "usage": {"code": false, "without": "Команда крутит гиперпараметры, пока test не покажет 0.93, отчитывается этой цифрой, а в проде модель даёт 0.81.", "with": "Гиперпараметры подбираются по validation set, test трогают один раз в конце, и его 0.84 совпадает с продом.", "benefit": "Финальная оценка модели совпадает с тем, что увидит заказчик на новых данных."}}, {"q": "Сравниваются три классификатора: у модели A AUC 0.91, у модели B AUC 0.78, а ROC-кривая модели C лежит на диагонали. Какую модель выбрать и что означает кривая C?", "options": ["Отложить выбор, потому что AUC привязана к одному threshold и без него сравнение моделей невозможно", "Выбрать B, потому что меньшая AUC означает меньше false positives, а C идеально сбалансирована по классам", "Выбрать C, потому что кривая на диагонали означает нулевой FPR при максимальном TPR на всех порогах", "Выбрать A, потому что большая AUC означает лучший классификатор, а у C TPR равен FPR на любом пороге"], "correct": 3, "explain": "По лекции большая AUC означает лучшую кривую: если красная кривая с большей AUC построена Random Forest, а синяя - Logistic Regression, то RF справился лучше; AUC при этом измеряется at various thresholds settings, так что фиксировать порог не нужно. Диагональ на ROC - линия TPR = FPR, то есть классификатор C не отделяет классы (Lecture_5, слайд 23 и 26).", "usage": {"code": false, "without": "Инженер спорит, какой порог взять для сравнения моделей, и откладывает выбор на неделю, а модель C с диагональной кривой попадает в шорт-лист.", "with": "Он сравнивает модели по AUC без привязки к порогу, выбирает A с 0.91 и отбрасывает C как не отличающую классы.", "benefit": "Сравнение классификаторов занимает минуту и не зависит от выбранного порога."}}, {"q": "Модель диагностики рака показывает recall = 1.0, и врач считает её идеальной. Какие метрики нужно проверить, чтобы отличить хорошую модель от той, что просто помечает всех как больных?", "options": ["Проверить accuracy на training set, при recall 1.0 она уже гарантирует качество модели", "Проверить precision и specificity, при пометке всех как больных они окажутся низкими из-за FP", "Проверить recall на test set, при пометке всех как больных он упадёт ниже единицы из-за FN", "Проверить MAE и RMSE по вероятностям, при вырожденной модели ошибка вырастет до единицы"], "correct": 1, "explain": "По лекции, если всегда говорить cancer, recall будет 100%, но precision - доля предсказанных больных, которые реально больны - упадёт из-за множества FP, а specificity - доля здоровых, распознанных как здоровые - станет нулевой. Recall на test set при этом останется 1.0, потому что вырожденная модель не даёт ни одного FN; accuracy по лекции нельзя использовать при перекосе классов, а MAE и RMSE - метрики регрессии и о качестве классификатора ничего не скажут (Lecture_5, слайд 17-20).", "usage": {"code": false, "without": "Врач внедряет модель с recall 1.0, и каждый пациент отправляется на биопсию, потому что модель помечает всех.", "with": "Он смотрит precision 0.05 и specificity 0.0, понимает, что модель вырождена, и требует переобучения.", "benefit": "Вырожденный классификатор распознаётся до того, как он попадёт к пациентам."}}, {"q": "Дерево на two_moons увеличили с depth 2 до depth 9, и train error упал до нуля. Что произошло с границами решений и generalisation, и каким параметром это ограничивают?", "options": ["Границы остаются прежними, обобщение растёт, поскольку нулевой train error означает идеально обученную модель", "Границы выравниваются после нормализации, обобщение растёт, ограничивают масштаб признаков X0 и X1", "Границы дробятся на мелкие прямоугольники под отдельные точки, обобщение падает, ограничивают max depth", "Границы сливаются в две прямые, обобщение падает из-за underfitting, ограничивают number of features при split"], "correct": 2, "explain": "На слайдах two_moons при depth 2 две вертикальные и одна горизонтальная границы, а при depth 9 область изрезана мелкими прямоугольниками, изолирующими отдельные точки, - это и есть overfitting, main issue деревьев; нулевой train error здесь признак заучивания шума, а не идеальной модели, а «две прямые» - картина недообученного depth 2, а не depth 9. Рост дерева ограничивает параметр maximum depth of tree или минимум листьев на узел; нормализация деревьям не нужна - они completely invariant to scaling (Lecture_5, слайд 50-51, 70-71, 88).", "usage": {"code": false, "without": "Студент растит дерево до нулевой ошибки на train, гордо показывает 100%, а на test получает 78% и не понимает почему.", "with": "Он смотрит на изрезанные границы depth 9, ставит max depth 3 и получает 92% на test при 94% на train.", "benefit": "Глубина дерева выбирается по обобщению, а не по красивой нулевой ошибке на train."}}, {"q": "Инженер собрал bagging из 500 деревьев, но деревья почти одинаковы и качество не выше одного дерева. Что диагностируется по лекции и какое изменение вносит Random Forest?", "options": ["Деревья коррелированы, RF на каждом split берёт случайную группу m признаков из p", "Деревья обучены с возвращением, RF заменяет bootstrap на выборку без возвращения из данных", "Деревья слишком глубоки, RF обрезает каждое дерево pruning до одинаковой небольшой глубины", "Деревьев слишком мало, RF поднимает их число до нескольких тысяч, чтобы усреднение заработало"], "correct": 0, "explain": "Минус bagging по лекции - correlated trees, что limits the benefits of the wisdom of crowds; Random Forest - модификация bagging, строящая de-correlated trees: before each split select m ≤ p input variables at random. Деревья в RF растут до максимального размера без pruning, а bootstrap с возвращением сохраняется, так что эти варианты противоречат слайду (Lecture_5, слайд 81-82, 86).", "usage": {"code": false, "without": "Инженер добавляет к bagging ещё 4500 деревьев, ждёт три часа и получает те же копии одного дерева с тем же качеством.", "with": "Он переключается на Random Forest с m признаков на split, деревья становятся разными, и ансамбль обгоняет одиночное дерево.", "benefit": "Wisdom of crowds работает, потому что деревья в ансамбле действительно разные."}}, {"q": "Логистическая регрессия на данных с 800 признаками и очень сложной формой классов даёт слабый результат. Какие две причины из списка проблем традиционных методов здесь действуют и какой подход предлагает лекция?", "options": ["Слишком низкий threshold и дисбаланс классов, лекция предлагает подобрать порог по ROC и переобучить", "Слишком сильные выбросы и мало данных, лекция предлагает перейти к unsupervised clustering", "Слишком мало наблюдений и пропуски в данных, лекция предлагает собрать больше данных и дообучить ту же модель", "Слишком много предикторов и слишком сложная форма классов, лекция предлагает additive modelling и boosting"], "correct": 3, "explain": "Слайд о проблемах традиционных методов называет четыре причины: нереализуемые assumptions, слишком сложная структура и форма классов, слишком большое число предикторов, внутренние связи и выбросы; в сценарии действуют вторая и третья. Альтернатива - additive modelling, где F(x) = сумма простых f_m(x), то есть ensemble methods и boosting-алгоритмы AdaBoost, GBM, XGBoost (Lecture_5, слайд 89, 91-92, 97).", "usage": {"code": false, "without": "Аналитик месяц докручивает логистическую регрессию на 800 признаках, меняет порог и собирает данные, а качество стоит на месте.", "with": "Он узнаёт в ситуации два пункта из списка проблем традиционных методов, ставит XGBoost и за день получает рост качества.", "benefit": "Пределы линейной модели видны заранее и время не уходит на её докрутку."}}, {"q": "Модель диагностики проверили на 200 пациентах и получили confusion matrix: TP = 40, FN = 10, FP = 20, TN = 130. Вычислите accuracy, precision и recall модели.", "options": ["accuracy 0,65, precision 0,80, recall 0,67", "accuracy 0,85, precision 0,80, recall 0,67", "accuracy 0,85, precision 0,67, recall 0,80", "accuracy 0,65, precision 0,20, recall 0,87"], "correct": 2, "explain": "Шаг 1: accuracy = (TP+TN)/всего = (40+130)/200 = 0,85. Шаг 2: precision = TP/(TP+FP) = 40/60 = 0,67. Шаг 3: recall = TP/(TP+FN) = 40/50 = 0,80. Варианты с precision 0,80 и recall 0,67 меняют эти два показателя местами, 0,65 - это только TN в числителе accuracy, 0,20 - TP, делённое на всех пациентов, а 0,87 - это specificity TN/(TN+FP), а не recall (Lecture_5, слайды 17-19 и 27).", "usage": {"code": false, "without": "Студент видит в отчёте accuracy 85% и считает модель хорошей, не замечая, что каждый третий положительный диагноз ложный.", "with": "По той же матрице он считает precision 0,67 и recall 0,80 и понимает, где именно модель ошибается - в лишних тревогах, а не в пропусках.", "benefit": "Три числа вместо одного показывают характер ошибок модели."}}, {"q": "Классификатор редкого заболевания даёт precision 0,03 и recall 1,00. Вычислите арифметическое среднее этих показателей и F1-score, затем определите, к какому из двух исходных показателей ближе F1.", "options": ["среднее 0,515, F1 около 0,06, F1 ближе к precision", "среднее 0,515, F1 около 0,515, F1 совпадает со средним", "среднее 0,515, F1 около 0,97, F1 ближе к recall", "среднее 0,030, F1 около 0,03, F1 равен precision"], "correct": 0, "explain": "Шаг 1: арифметическое среднее = (0,03+1,00)/2 = 0,515. Шаг 2: F1 = 2·P·R/(P+R) = 2·0,03·1,00/1,03 ≈ 0,058, то есть около 0,06 (на слайде тот же пример с 3% и 100% округлён до 5%). Шаг 3: F1 как гармоническое среднее лежит рядом с меньшим числом, а не посередине; 0,515 - это ошибка взять арифметическое среднее, 0,03 - ошибка взять просто минимум (Lecture_5, слайд 21).", "usage": {"code": false, "without": "Разработчик усредняет precision 3% и recall 100% до 51% и докладывает о «средней» модели, хотя она помечает почти всех здоровых как больных.", "with": "Он считает F1 ≈ 0,06 и сразу видит, что модель практически бесполезна из-за провальной precision.", "benefit": "F1 не даёт одному хорошему показателю замаскировать другой провальный."}}, {"q": "При выбранном пороге модель диагностики болезни сердца дала матрицу: TP = 4, FP = 2, FN = 0, TN = 2. Вычислите TPR и FPR и укажите координаты этой точки на ROC-кривой, где по оси x отложен FPR, а по оси y - TPR.", "options": ["TPR 0,67, FPR 0,50, точка x = 0,50 и y = 0,67", "TPR 0,67, FPR 0,25, точка x = 0,25 и y = 0,67", "TPR 1,00, FPR 0,25, точка x = 0,25 и y = 1,00", "TPR 1,00, FPR 0,50, точка x = 0,50 и y = 1,00"], "correct": 3, "explain": "Шаг 1: TPR = sensitivity = TP/(TP+FN) = 4/(4+0) = 1,00. Шаг 2: FPR = 1 - specificity = FP/(FP+TN) = 2/(2+2) = 0,50. Шаг 3: на ROC по x откладывают FPR, по y - TPR, значит точка x = 0,5 и y = 1,0 - ровно та, что отмечена на слайде. Значение 0,25 получается, если делить FP на все 8 наблюдений вместо числа реально здоровых, а 0,67 - это TP/(TP+FP), то есть precision вместо TPR (Lecture_5, слайд 24).", "usage": {"code": false, "without": "Аналитик делит FP на всех пациентов, получает FPR 0,25 вместо 0,5 и ставит точку ближе к идеальному углу ROC, чем модель заслуживает.", "with": "Он считает TPR = 1 по числу реально больных и FPR = 0,5 по числу реально здоровых, ставит точку x = 0,5, y = 1 и видит, что при этом пороге пропусков нет, а ложных тревог половина.", "benefit": "Правильная точка ROC показывает реальный компромисс между пропусками и ложными тревогами."}}, {"q": "В выборке 1000 пациентов, из них 50 действительно больны раком. Модель всегда предсказывает «здоров». Заполните confusion matrix и вычислите accuracy, recall и specificity этой модели.", "options": ["accuracy 0,95, recall 1,00, specificity 0,00", "accuracy 0,95, recall 0,00, specificity 1,00", "accuracy 0,95, recall 0,95, specificity 0,95", "accuracy 0,05, recall 0,00, specificity 0,95"], "correct": 1, "explain": "Шаг 1: модель никого не называет больным, поэтому TP = 0, FN = 50, FP = 0, TN = 950. Шаг 2: accuracy = (TP+TN)/всего = 950/1000 = 0,95. Шаг 3: recall = TP/(TP+FN) = 0/50 = 0,00, а specificity = TN/(TN+FP) = 950/950 = 1,00: модель находит всех здоровых и ни одного больного, precision = 0/0 вообще не определена. Именно поэтому accuracy нельзя использовать, когда один класс в большинстве. Вариант с recall 1,00 и specificity 0,00 меняет их местами, 0,05 - это доля ошибок, а не accuracy, а «0,95 везде» - иллюзия, что одна цифра описывает все метрики (Lecture_5, слайды 16-17 и 20).", "usage": {"code": false, "without": "Команда отчитывается о 95% accuracy и выпускает модель, которая на деле не находит ни одного больного.", "with": "Инженер считает recall = 0 и specificity = 1 при тех же 95% и понимает, что метрику для несбалансированных классов нужно менять на recall или F1.", "benefit": "Проверка recall спасает от «отличной» модели, которая ничего не находит."}}, {"q": "Признак Price автомобилей лежит в диапазоне от 5000 до 45000. Примените scaling to a range по формуле x' = (x - x_min)/(x_max - x_min): чему равно x' для цены 15000 и какой сырой цене соответствует x' = 0,5?", "options": ["x' = 0,375, а x' = 0,5 соответствует 20000", "x' = 0,33, а x' = 0,5 соответствует 22500", "x' = 0,25, а x' = 0,5 соответствует 25000", "x' = 0,75, а x' = 0,5 соответствует 30000"], "correct": 2, "explain": "Шаг 1: размах = 45000 - 5000 = 40000. Шаг 2: x' = (15000 - 5000)/40000 = 10000/40000 = 0,25. Шаг 3: обратно x = x_min + 0,5·40000 = 25000. Вариант 0,375 делит 15000 на размах без вычитания минимума, вариант 0,33 делит 15000 на 45000, то есть не использует x_min ни в числителе, ни в знаменателе (Lecture_3, слайд 55).", "usage": {"code": false, "without": "Студент масштабирует цену делением на максимум, получает значения от 0,11 до 1,0, и признак не попадает в обещанный диапазон от 0 до 1.", "with": "Он вычитает минимум и делит на размах, получая ровно 0 для 5000 и ровно 1 для 45000, как на гистограмме слайда.", "benefit": "Все признаки оказываются в одном диапазоне и не перевешивают друг друга в модели."}}, {"q": "Признак имеет среднее 20000 и стандартное отклонение 8000. Примените Z-score нормализацию: какие значения z получат наблюдения 36000 и 12000?", "options": ["z = 2,0 и z = -1,0", "z = 1,8 и z = 0,6", "z = 0,8 и z = -0,4", "z = 4,5 и z = 1,5"], "correct": 0, "explain": "Шаг 1: Z-score показывает, на сколько стандартных отклонений значение отстоит от среднего, поэтому z = (x - mean)/std. Шаг 2: (36000 - 20000)/8000 = 16000/8000 = 2,0. Шаг 3: (12000 - 20000)/8000 = -8000/8000 = -1,0. Вариант 4,5 и 1,5 делит на std, не вычитая среднее, вариант 1,8 и 0,6 делит сырое значение на среднее, а 0,8 и -0,4 вычитает среднее, но делит отклонение на среднее вместо std (Lecture_3, слайд 58).", "usage": {"code": false, "without": "Аналитик «нормализует» признак, просто вычитая среднее, и после преобразования разброс остаётся 8000 вместо обещанной единицы.", "with": "Он делит отклонение на std и получает признак со средним 0 и std 1, где 36000 читается как «2 сигмы выше среднего».", "benefit": "Z-score делает выброс сразу видимым и сопоставимым между признаками."}}, {"q": "Датасет из 1000 наблюдений оценивают K-fold cross-validation с K = 5. На пяти итерациях получены accuracy 0,80, 0,84, 0,78, 0,82 и 0,86. Сколько раз обучается модель, каковы размеры train и test на каждой итерации и какова итоговая оценка качества?", "options": ["5 обучений, train 800 и test 200, итог 0,86", "4 обучения, train 800 и test 200, итог 0,86", "5 обучений, train 200 и test 800, итог 0,82", "5 обучений, train 800 и test 200, итог 0,82"], "correct": 3, "explain": "Шаг 1: данные делятся на K = 5 фолдов по 1000/5 = 200 наблюдений. Шаг 2: модель обучается K = 5 раз на K-1 = 4 фолдах, то есть на 800 наблюдениях, и проверяется на оставшихся 200. Шаг 3: пять оценок усредняются: (0,80+0,84+0,78+0,82+0,86)/5 = 4,10/5 = 0,82. Вариант с итогом 0,86 при 5 обучениях берёт лучший фолд вместо среднего, вариант с train 200 и test 800 меняет местами обучающую и тестовую части, а вариант с 4 обучениями путает число фолдов для train с числом итераций и к тому же берёт лучший фолд (Lecture_3, слайд 80).", "usage": {"code": false, "without": "Студент один раз делит данные 75/25 как в PW1, получает случайно удачные 0,86 и вписывает их в отчёт как качество модели.", "with": "Он прогоняет 5 фолдов, усредняет до 0,82 и видит разброс от 0,78 до 0,86, то есть честную оценку на новых данных.", "benefit": "Среднее по фолдам защищает от удачного или неудачного одного разбиения."}}, {"q": "Логистическая регрессия с одним признаком имеет f(x) = β0 + β1·x, где β0 = -2 и β1 = 1, а отклик y = 1/(1 + e^(-f(x))). Для наблюдения x = 4 вычислите y и определите класс при threshold 0,5 и при threshold 0,9. Считайте e^(-2) ≈ 0,135.", "options": ["y = 2,00, при пороге 0,5 класс 1, при пороге 0,9 класс 1", "y ≈ 0,88, при пороге 0,5 класс 1, при пороге 0,9 класс 0", "y ≈ 0,88, при пороге 0,5 класс 1, при пороге 0,9 класс 1", "y ≈ 0,12, при пороге 0,5 класс 0, при пороге 0,9 класс 0"], "correct": 1, "explain": "Шаг 1: f(4) = -2 + 1·4 = 2. Шаг 2: y = 1/(1 + e^(-2)) = 1/(1 + 0,135) = 1/1,135 ≈ 0,88. Шаг 3: 0,88 больше 0,5, значит класс 1, но 0,88 меньше 0,9, значит при пороге 0,9 класс 0 - предсказанный класс зависит от выбранного threshold. Вариант 0,12 берёт e^(+2) вместо e^(-2), вариант y = 2 вообще не применяет сигмоиду, хотя отклик должен лежать в интервале от 0 до 1 (Lecture_5, слайды 22, 31-32).", "usage": {"code": false, "without": "Инженер выводит f(x) = 2 как «вероятность» и не может объяснить, почему одна и та же модель в одной системе даёт класс 1, а в другой класс 0.", "with": "Он пропускает f через сигмоиду, получает 0,88 и понимает, что класс определяется порогом, который надо подобрать под задачу.", "benefit": "Понимание порога позволяет управлять балансом ложных тревог и пропусков без переобучения модели."}}, {"q": "В узле дерева 20 объектов двух классов. Split A делит их на дочерние узлы с составом 3 и 7 и с составом 9 и 1, split B - на узлы с составом 5 и 5 и с составом 0 и 10. Вычислите Gini impurity по формуле 1 - Σp², усредните по дочерним узлам и выберите разбиение по правилу CART.", "options": ["split A, так как 0,70 меньше 0,75", "split A, так как 0,30 больше 0,25", "split B, так как 0,25 меньше 0,30", "split B, так как 0,50 больше 0,42"], "correct": 2, "explain": "Шаг 1: Gini(3,7) = 1 - 0,09 - 0,49 = 0,42, Gini(9,1) = 1 - 0,81 - 0,01 = 0,18, взвешенно при равных узлах split A = (0,42+0,18)/2 = 0,30. Шаг 2: Gini(5,5) = 0,50, Gini(0,10) = 0, split B = 0,25. Шаг 3: CART минимизирует impurity, поэтому выбирается B. Вариант «0,30 больше 0,25» максимизирует impurity вместо минимизации, вариант «0,50 больше 0,42» сравнивает только первые дочерние узлы и тоже ищет максимум, а вариант 0,70 против 0,75 забывает «1 -» в формуле и считает Σp² (Lecture_5, слайды 53, 55).", "usage": {"code": false, "without": "Разработчик выбирает разбиение по первому попавшемуся дочернему узлу и получает дерево, которое хуже отделяет классы.", "with": "Он считает взвешенный Gini для каждого варианта, видит, что чистый узел 0 и 10 тянет impurity вниз, и выбирает split B.", "benefit": "Взвешенный Gini находит разбиение, дающее самые чистые узлы, как это делает CART."}}, {"q": "Датасет Play Golf: 14 наблюдений, энтропия до разбиения H(S) = 0,94. По признаку Outlook: sunny 5 наблюдений с H = 0,97, overcast 4 наблюдения с H = 0, rainy 5 наблюдений с H = 0,97. Известно также, что IG для humidity 0,15, для windy 0,05, для temperature 0,03. Вычислите Information Gain для Outlook и определите корень дерева ID3.", "options": ["IG Outlook 0,25, корнем становится Outlook", "IG Outlook 0,69, корнем становится Temperature", "IG Outlook 0,25, корнем становится Temperature", "IG Outlook 1,63, корнем становится Outlook"], "correct": 0, "explain": "Шаг 1: энтропия после разбиения H(S, outlook) = 5/14·0,97 + 4/14·0 + 5/14·0,97 = 0,69. Шаг 2: IG = H(S) - H(S, outlook) = 0,94 - 0,69 = 0,25. Шаг 3: 0,25 больше 0,15, 0,05 и 0,03, поэтому ID3 ставит в корень Outlook - признак с максимальным IG. Вариант 0,69 - это энтропия после разбиения, не вычтенная из H(S), и если её минимизировать как энтропию, корнем ошибочно окажется Temperature; вариант 1,63 складывает вместо вычитания, а вариант 0,25 с Temperature берёт признак с минимальным IG вместо максимального (Lecture_5, слайды 66-67).", "usage": {"code": false, "without": "Студент ставит в корень признак с наименьшей энтропией после разбиения, забыв вычесть её из исходной, и не может объяснить, почему дерево получилось таким.", "with": "Он считает IG = 0,94 - 0,69 = 0,25 для каждого признака, сравнивает четыре значения и обоснованно выбирает Outlook.", "benefit": "Information Gain даёт единый критерий, по которому дерево выбирает каждый следующий признак."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q.q) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
