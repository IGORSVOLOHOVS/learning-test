<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>MDA 3: Линейные пространства, ранг, разложения матриц (LU, QR, собственные значения, SVD)</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }

  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>

кономит расчёт базиса нуль-пространства."}}, {"q": "Чем отличается матрица A с nullity A равным нулю от матрицы с nullity A больше нуля", "options": ["У первой существует свободная переменная, у второй свободных переменных нет", "У первой определитель равен единице, у второй определитель равен нулю", "У первой столбцы линейно независимы, у второй — линейно зависимы", "У первой ранг меньше числа строк, у второй ранг равен числу строк"], "correct": 2, "explain": "Нулевая nullity A означает, что уравнение Ax=0 имеет только тривиальное решение, а значит столбцы A линейно независимы; при nullity A больше нуля появляются свободные переменные и линейная зависимость столбцов. (Lay 4.6).", "usage": {"code": false, "without": "Без этого различия студент не понимает, почему в одной системе решение единственно, а в похожей — целое семейство решений.", "with": "Проверяет nullity перед тем как утверждать единственность решения линейной системы.", "benefit": "Позволяет сразу отличить единственное решение от бесконечного множества."}}, {"q": "Как соотносятся rank AB и ранги сомножителей для матриц A и B согласующихся размеров", "options": ["rank AB не превышает наименьший из рангов A и B", "rank AB всегда равен сумме рангов матриц A и B", "rank AB равен произведению рангов матриц A и B", "rank AB не превышает наибольший из рангов A и B"], "correct": 0, "explain": "Композиция линейных отображений не может увеличить ранг сверх ранга любого из сомножителей, поэтому rank AB не больше min из rank A и rank B, а не их сумма или произведение. (Strang 3.2).", "usage": {"code": false, "without": "Без свойства инженер ошибочно ждёт, что произведение матриц полного ранга снова даст полный ранг.", "with": "Оценивает верхнюю границу ранга произведения ещё до вычисления самой матрицы AB.", "benefit": "Быстро предсказывает вырожденность результата умножения."}}, {"q": "Что говорит свойство rank A равно rank A^T о ранге произвольной матрицы", "options": ["Строчный ранг матрицы всегда вдвое больше столбцового ранга", "Столбцовый ранг определён только для квадратных матриц", "Строчный ранг равен рангу только для симметричных матриц", "Строчный ранг матрицы совпадает со столбцовым рангом"], "correct": 3, "explain": "Для любой матрицы, не только квадратной или симметричной, размерность строчного пространства всегда равна размерности столбцового пространства — это и есть rank A = rank A^T. (Strang 3.2).", "usage": {"code": false, "without": "Без этого факта студент отдельно ищет строчный и столбцовый ранг, хотя число одно и то же.", "with": "Вычисляет ранг через удобное представление — строки или столбцы, зная, что результат совпадёт.", "benefit": "Сокращает вычисления вдвое при определении ранга."}}, {"q": "Сколько собственных значений с учётом кратности имеет матрица A размера n×n над комплексными числами", "options": ["Ровно n минус один, поскольку старший член отбрасывается", "Ровно n, по числу корней характеристического многочлена", "Не более n, точное число задаёт след исходной матрицы", "Ровно rank A, независимо от размера и структуры матрицы"], "correct": 1, "explain": "Характеристический многочлен det(A − λI) имеет степень n, а по основной теореме алгебры у него ровно n корней с учётом кратности — это и есть собственные значения. (Lay 5.1).", "usage": {"code": false, "without": "Без этого факта студент не знает, сколько собственных значений искать, и останавливается раньше времени.", "with": "Ищет ровно n корней характеристического уравнения и знает, когда поиск завершён.", "benefit": "Гарантирует полноту найденного набора собственных значений."}}, {"q": "Как связаны след и определитель матрицы A с её собственными значениями λ1,...,λn", "options": ["След равен произведению собственных значений, определитель — их сумме", "След равен сумме собственных значений, определитель равен наибольшему из них", "След равен сумме собственных значений, определитель — их произведению", "След и определитель не связаны с собственными значениями напрямую"], "correct": 2, "explain": "Это стандартные тождества: trace A равен сумме λi, det A равен произведению λi, что следует из разложения характеристического многочлена по корням. (Strang 6.1).", "usage": {"code": false, "without": "Без тождеств приходится решать характеристическое уравнение полностью, чтобы проверить сумму собственных значений.", "with": "Проверяет найденные λ быстрой сверкой их суммы со следом и произведения с определителем.", "benefit": "Даёт быструю проверку правильности вычисленных собственных значений."}}, {"q": "При каком условии квадратная матрица A размера n×n диагонализуема", "options": ["Когда у неё есть n линейно независимых собственных векторов", "Когда все её собственные значения строго равны между собой", "Когда матрица является невырожденной, то есть обратимой", "Когда она записана как верхняя треугольная матрица"], "correct": 0, "explain": "Матрица A диагонализуема тогда и только тогда, когда существует n линейно независимых собственных векторов, образующих столбцы P; обратимость или треугольный вид сами по себе этого не гарантируют. (Lay 5.3).", "usage": {"code": false, "without": "Без критерия студент пытается диагонализовать любую обратимую матрицу и получает противоречие.", "with": "Сначала проверяет число независимых собственных векторов и только потом строит P и D.", "benefit": "Экономит время на попытках диагонализовать недиагонализуемую матрицу."}}, {"q": "Что дают столбцы P и диагональ D в разложении A равно P умножить D умножить P в минус первой степени", "options": ["Столбцы P — строки исходной матрицы, диагональ D — её сингулярные числа", "Столбцы P — ортонормированный базис, диагональ D — норма столбцов A", "Столбцы P — базис нуль-пространства, диагональ D — ранги подматриц", "Столбцы P — собственные векторы, диагональ D — их собственные значения"], "correct": 3, "explain": "В разложении A = PDP^-1 столбцы P — это собственные векторы A, а диагональные элементы D — соответствующие им собственные значения; это используют для быстрого вычисления A^k = PD^kP^-1. (Strang 6.2).", "usage": {"code": false, "without": "Без понимания структуры разложения студент пересчитывает A^k прямым перемножением матриц k раз.", "with": "Возводит в степень только диагональную D и переходит обратно через P и P^-1.", "benefit": "Резко ускоряет вычисление высоких степеней матрицы."}}, {"q": "Что утверждает спектральная теорема для вещественной симметричной матрицы A", "options": ["Все собственные значения комплексны, а собственные векторы параллельны", "Все собственные значения вещественны, а собственные векторы ортогональны", "Матрица не диагонализуема, хотя остаётся обратимой при любом ранге", "Собственные значения равны нулю, а векторы образуют нуль-пространство"], "correct": 1, "explain": "Спектральная теорема гарантирует для вещественной симметричной матрицы вещественные собственные значения и ортонормированный базис из собственных векторов, то есть ортогональную диагонализуемость A = QΛQ^T. (Lay 7.1).", "usage": {"code": false, "without": "Без теоремы студент ищет ортогональный базис собственных векторов методом проб для произвольной матрицы.", "with": "Сразу знает, что для симметричной матрицы такой ортогональный базис существует и его можно построить.", "benefit": "Гарантирует существование удобного ортогонального разложения A = QΛQ^T."}}, {"q": "Чем сингулярное разложение A равно U умножить Σ умножить V^T отличается от разложения на собственные значения", "options": ["SVD существует только для квадратных обратимых матриц, совсем как собственные значения", "SVD существует только для симметричных матриц, а сингулярные числа равны следу матрицы A", "SVD существует для любой матрицы, а сингулярные числа — корни собственных чисел A^T A", "SVD совпадает с диагонализацией всегда, когда исходная матрица не квадратная"], "correct": 2, "explain": "В отличие от собственных значений, которые определены только для квадратных матриц и не всегда дают диагонализацию, сингулярное разложение A = UΣV^T существует для любой матрицы m×n, а сингулярные числа равны корням собственных чисел A^T A. (Strang 7.2).", "usage": {"code": false, "without": "Без SVD для прямоугольной или недиагонализуемой матрицы аналитик не может получить подобное разложение вовсе.", "with": "Строит SVD для любой матрицы данных независимо от её формы и диагонализуемости.", "benefit": "Даёт универсальный инструмент разложения там, где собственные значения неприменимы."}}, {"q": "Систему Ax=b нужно решать для одной матрицы A и полусотни разных b, поступающих один за другим. Какое разложение сэкономит больше всего вычислений?", "options": ["SVD-разложение — сингулярные числа матрицы A пересчитывают заново для каждого b", "QR-разложение — ортонормированный базис столбцов A вычисляют заново для каждого b", "Диагонализация — собственные векторы матрицы A находят заново для каждого b", "LU-разложение — множители L и U находят один раз, для каждого b делают лишь подстановку"], "correct": 3, "explain": "LU-разложение A=LU считается один раз затратой порядка n^3/3 операций, а каждое новое b обрабатывается дешёвым прямым и обратным ходом, то есть подстановкой, а не полным пересчётом. QR и SVD дороже LU и оправданы, когда нужна устойчивость или МНК, а не просто повторное решение с той же матрицей (Lay 2.5).", "usage": {"code": false, "without": "Без LU для каждого нового b студент заново гоняет метод Гаусса по всей матрице, теряя время на сотнях повторов.", "with": "Зная про LU, он раскладывает A один раз и решает все системы за секунды подстановками.", "benefit": "Экономит вычисления при массовых расчётах с одной матрицей."}}, {"q": "Система Ax=b переопределена — уравнений больше, чем неизвестных, и точного решения нет. Какое разложение матрицы A лучше применить для метода наименьших квадратов?", "options": ["Диагонализация, потому что она требует квадратной и симметричной матрицы A", "QR-разложение, потому что оно обходит формирование A^T A и рост обусловленности", "LU-разложение, потому что оно быстро приводит A к треугольному виду", "SVD-разложение, потому что оно всегда даёт точное решение системы"], "correct": 1, "explain": "МНК-решение через нормальные уравнения A^T A x = A^T b возводит число обусловленности A в квадрат, что портит точность на почти коллинеарных признаках; QR-разложение A=QR сводит задачу к решению Rx=Q^T b без этого возведения (Lay 6.5).", "usage": {"code": false, "without": "Через нормальные уравнения аналитик получает МНК-оценку регрессии, которая сильно шумит на почти коллинеарных признаках.", "with": "Используя QR, он получает те же коэффициенты устойчиво даже при высокой корреляции признаков.", "benefit": "Даёт численно устойчивую МНК-оценку."}}, {"q": "Нужно сжать таблицу данных, сохранив только главные направления изменчивости, как в PCA. Какое разложение матрицы данных для этого используют?", "options": ["Разложение Грама-Шмидта, потому что оно строит ортонормированный базис строк", "Разложение Крамера, потому что оно выражает решение через определители", "Разложение SVD, потому что сингулярные числа упорядочены по убыванию значимости", "Разложение LU, потому что оно раскладывает матрицу на треугольные множители"], "correct": 2, "explain": "SVD A=UΣV^T упорядочивает сингулярные числа по убыванию, и усечение до k наибольших даёт наилучшее ранг-k приближение матрицы по теореме Эккарта-Юнга — на этом строится PCA и сжатие данных; LU и разложение Крамера не дают такого упорядоченного разложения по значимости (Lay 7.4).", "usage": {"code": false, "without": "Без SVD аналитик хранит датасет целиком и не может выделить главные компоненты изменчивости.", "with": "С SVD он оставляет несколько первых сингулярных векторов и получает сжатое представление с минимальной потерей информации.", "benefit": "Даёт математическую основу PCA и сжатия данных."}}, {"q": "В R^3 даны три вектора. Как проверить, образуют ли они базис пространства?", "options": ["Составить из них матрицу и проверить, что её определитель не равен нулю", "Проверить, что все три вектора имеют равную евклидову длину", "Убедиться, что каждый из трёх векторов ортогонален координатным осям", "Найти сумму координат каждого вектора и сравнить полученные суммы"], "correct": 0, "explain": "Три вектора в R^3 образуют базис тогда и только тогда, когда они линейно независимы, а для квадратной матрицы, составленной из них как столбцов, это равносильно ненулевому определителю; равенство длин или ортогональность осям не гарантируют ни независимости, ни того, что векторы охватывают всё пространство (Lay 4.3, 4.5).", "usage": {"code": false, "without": "Не проверив определитель, студент пытается разложить вектор по тройке, которая на деле лежит в одной плоскости, и координат просто не существует.", "with": "Проверив, что определитель матрицы из трёх векторов не нулевой, он уверенно раскладывает любой вектор R^3 по этому базису.", "benefit": "Гарантирует, что выбранные векторы действительно образуют базис."}}, {"q": "Дан линейно независимый набор векторов, который охватывает подпространство, но не ортогонален. Что делает процесс Грама-Шмидта с этим набором?", "options": ["Заменяет набор на строки ступенчатого вида после метода Гаусса", "Уменьшает число исходных векторов ровно до размерности подпространства", "Находит собственные значения матрицы, составленной из этих векторов", "Строит из них ортогональный или ортонормированный базис того же подпространства"], "correct": 3, "explain": "Процесс Грама-Шмидта последовательно вычитает проекции на уже построенные векторы, превращая линейно независимый набор в ортогональный, а после нормировки — в ортонормированный базис того же подпространства; число векторов не меняется, а собственные значения и метод Гаусса тут не при чём (Lay 6.4).", "usage": {"code": false, "without": "Работая с косоугольным базисом, аналитик считает проекции по громоздким формулам общего вида.", "with": "Построив ортонормированный базис Грама-Шмидтом, он находит проекции простым скалярным произведением.", "benefit": "Упрощает вычисление проекций и координат в подпространстве."}}, {"q": "При построении LU-разложения матрицы A на очередном шаге ведущий элемент оказался равен нулю, хотя матрица A невырождена. Как поступить?", "options": ["Перейти к вычислению собственных значений вместо разложения на множители", "Переставить строки матрицы и построить разложение PA=LU с матрицей перестановок P", "Признать, что у матрицы A разложения LU не существует ни в каком виде", "Заменить нулевой элемент на единицу и продолжить вычисления как обычно"], "correct": 1, "explain": "Нулевой ведущий элемент не означает отсутствие разложения — достаточно переставить строки, чтобы получить PA=LU с матрицей перестановок P; это стандартный приём LU с частичным выбором ведущего элемента, а произвольная замена нуля на единицу или переход к собственным значениям не решают задачу факторизации (Lay 2.5).", "usage": {"code": false, "without": "Не зная про перестановку строк, студент решает, что у невырожденной матрицы LU-разложения нет.", "with": "Применив перестановку строк, он получает PA=LU и решает систему как обычно.", "benefit": "Позволяет строить LU-разложение даже при нулевых ведущих элементах."}}, {"q": "После QR-разложения матрицы A получены множители Q и R. Что представляют собой столбцы матрицы Q?", "options": ["Строки ступенчатого вида матрицы A после метода Гаусса", "Коэффициенты разложения вектора b по базису решений системы", "Ортонормированный базис столбцового пространства матрицы A", "Собственные векторы матрицы A, упорядоченные по убыванию"], "correct": 2, "explain": "В разложении A=QR столбцы Q получены применением процесса Грама-Шмидта к столбцам A и образуют ортонормированный базис столбцового пространства A, а R — верхнетреугольная матрица коэффициентов этого разложения; собственные векторы и ступенчатый вид Гаусса — результаты других операций (Lay 6.4).", "usage": {"code": false, "without": "Не зная смысла Q, аналитик не может использовать QR для проекции вектора b на столбцовое пространство A.", "with": "Зная, что столбцы Q ортонормированы, он сразу проецирует b на пространство столбцов через Q^T b.", "benefit": "Даёт готовый ортонормированный базис для проекций и МНК."}}, {"q": "Ранг матрицы нужно определить численно, а вычисления по минорам или по ступенчатому виду дают неустойчивый результат из-за ошибок округления. Какой подход надёжнее?", "options": ["Вычислить сингулярные числа через SVD и посчитать значимо ненулевые", "Найти определитель каждой квадратной подматрицы вручную", "Сложить все собственные значения матрицы и округлить сумму", "Посчитать след матрицы и сравнить его с числом строк"], "correct": 0, "explain": "SVD раскладывает матрицу как A=UΣV^T, и число сингулярных чисел, заметно отличных от нуля, надёжно даёт ранг даже при ошибках округления — это основа рангово-раскрывающих численных методов; определители миноров и след матрицы гораздо чувствительнее к вычислительным погрешностям (Lay 7.4).", "usage": {"code": false, "without": "Считая ранг по минорам зашумлённой матрицы, аналитик то получает полный ранг, то заниженный из-за округления.", "with": "Используя сингулярные числа SVD, он уверенно отделяет значимые направления от шумовых.", "benefit": "Даёт устойчивую к округлению оценку ранга."}}, {"q": "Для МНК-регрессии по признакам, среди которых два сильно коррелируют, решение находят через нормальные уравнения A^T A x = A^T b вместо QR-разложения. Что при этом произойдёт?", "options": ["Ранг матрицы A увеличится и переменных для оценки станет больше", "Матрица A^T A перестанет быть квадратной и систему нельзя будет решить", "Решение получится точно таким же, но вычисления займут меньше времени", "Число обусловленности возрастёт в квадрате, и решение станет чувствительным к шуму"], "correct": 3, "explain": "Переход к нормальным уравнениям A^T A x = A^T b возводит число обусловленности матрицы A в квадрат, поэтому при почти коллинеарных признаках малые ошибки в данных сильно искажают оценку коэффициентов; QR-разложение решает Rx=Q^T b без этого возведения и остаётся устойчивым (Lay 6.5).", "usage": {"code": false, "without": "Через нормальные уравнения на коррелированных признаках аналитик получает коэффициенты регрессии, которые скачут при малейшем изменении выборки.", "with": "Через QR-разложение он получает устойчивые коэффициенты даже при сильной корреляции признаков.", "benefit": "Предупреждает потерю точности МНК на коррелированных данных."}}, {"q": "Матрица A симметрична, и её нужно диагонализовать для дальнейших вычислений. Какое свойство разложения A=PDP^-1 при этом гарантировано?", "options": ["Диагональные элементы матрицы D обязательно равны между собой", "Матрицу P можно выбрать ортогональной, то есть P^-1=P^T", "Матрица D обязательно будет содержать только положительные числа", "Матрицу P нельзя выбрать так, чтобы столбцы имели единичную длину"], "correct": 1, "explain": "По спектральной теореме симметричная матрица всегда диагонализуема ортогональной матрицей: её собственные векторы можно выбрать взаимно ортогональными и единичной длины, так что P^-1=P^T; собственные значения при этом могут быть любого знака и не обязаны совпадать друг с другом (Lay 7.1).", "usage": {"code": false, "without": "Диагонализуя симметричную матрицу общим методом, аналитик отдельно проверяет обратимость P, не используя её структуру.", "with": "Зная спектральную теорему, он сразу берёт P ортогональной и заменяет обращение P на транспонирование.", "benefit": "Упрощает диагонализацию симметричных матриц до транспонирования вместо обращения."}}, {"q": "Дата-аналитик готовит таблицу признаков для PCA: 10000 наблюдений, среди столбцов есть рост в сантиметрах и рост в дюймах для тех же людей. Как это отразится на результатах PCA?", "options": ["Первая компонента объединит оба столбца, число значимых компонент упадёт на единицу", "Все компоненты получат одинаковую долю объяснённой дисперсии независимо от масштаба признаков", "PCA автоматически удалит один из двух столбцов ещё до вычисления ковариационной матрицы", "Матрица ковариации признаков станет диагональной, и компоненты совпадут с исходными осями"], "correct": 0, "explain": "Рост в сантиметрах и дюймах — линейно зависимые признаки, поэтому ковариационная матрица теряет ранг на единицу: первая компонента вбирает их общее направление, а число значимых компонент уменьшается. Дублирование единиц измерения не удаляется автоматически и не делает матрицу диагональной (Lay, ch. 6; Strang, ch. 7).", "usage": {"code": false, "without": "Аналитик считает все компоненты значимыми и оставляет избыточный признак в модели, раздувая её без пользы.", "with": "Понимая связь ранга и мультиколлинеарности, аналитик убирает дублирующий признак до PCA и получает компактное представление.", "benefit": "Меньше шума и переобучения в последующих моделях."}}, {"q": "В таблице признаков для линейной регрессии столбец 'общая площадь' точно равен сумме столбцов 'жилая площадь' и 'площадь кухни'. Как это скажется на матрице X^T X при решении нормальных уравнений МНК?", "options": ["X^T X превратится в единичную матрицу, и коэффициенты регрессии совпадут с корреляциями", "X^T X останется невырожденной, но оценки коэффициентов будут смещены в сторону нуля", "X^T X станет положительно определённой с более высоким рангом, чем у исходной X", "X^T X станет вырожденной: столбцы X линейно зависимы, ранг X меньше числа признаков"], "correct": 3, "explain": "Линейная зависимость столбцов означает, что rank X меньше числа признаков, поэтому X^T X вырождена и нормальные уравнения не имеют единственного решения. Ранг произведения не может превышать ранг сомножителей (Lay, ch. 4 и 6).", "usage": {"code": false, "without": "Аналитик пытается обратить X^T X, получает ошибку или неустойчивые коэффициенты и не понимает причину.", "with": "Проверив ранг X заранее, аналитик убирает избыточный признак 'общая площадь' и решает МНК корректно.", "benefit": "Устойчивые и интерпретируемые коэффициенты регрессии."}}, {"q": "Изображение хранится как матрица 1000 на 800 пикселей. Инженер применяет SVD и оставляет только k=20 наибольших сингулярных чисел для сжатия. Что произойдёт при увеличении k с 20 до 100?", "options": ["Ранг приближения уменьшится, а объём хранимых данных вырастет пропорционально k в квадрате", "Приближение станет точнее, но потребует больше столбцов U и V, а выигрыш в сжатии упадёт", "Матрица приближения перестанет зависеть от сингулярных значений и станет диагональной", "Ошибка приближения возрастёт, потому что лишние компоненты добавляют шум исходного изображения"], "correct": 1, "explain": "Rank-k приближение через SVD с ростом k монотонно приближается к исходной матрице по норме Фробениуса, потому что добавляются следующие по величине сингулярные значения; платой служит больший объём хранимых столбцов U и V (Strang, ch. 7).", "usage": {"code": false, "without": "Инженер берёт k наугад и либо теряет детали изображения, либо не экономит место.", "with": "Понимая, что ошибка приближения равна сумме отброшенных сингулярных значений в квадрате, инженер подбирает k под нужное качество.", "benefit": "Предсказуемый компромисс между качеством сжатия и размером файла."}}, {"q": "Сервис хранит матрицу оценок пользователь-фильм размером 50000 на 3000, где заполнено меньше одного процента ячеек. Для рекомендаций строится низкоранговое приближение матрицы через SVD. Зачем нужен именно низкий ранг, а не точное восстановление всех оценок?", "options": ["Точное восстановление невозможно, поскольку SVD определена только для квадратных матриц", "Низкий ранг увеличивает число независимых столбцов матрицы и различимых пользователей", "Низкий ранг закладывает, что оценки определяются немногими скрытыми факторами вкуса", "Низкий ранг обнуляет все пропущенные оценки, что упрощает хранение матрицы"], "correct": 2, "explain": "Предположение рекомендательных систем — реальная матрица оценок близка к матрице небольшого ранга, потому что вкусы объясняются немногими скрытыми факторами; тогда SVD-приближение восстанавливает правдоподобные значения в пропущенных ячейках. SVD применима к любым прямоугольным матрицам (Strang, ch. 7).", "usage": {"code": false, "without": "Разработчик пытается восстановить каждую оценку отдельно и не может предсказать ничего для новых пар пользователь-фильм.", "with": "Заложив предположение о низком ранге, команда обучает модель на скрытых факторах и предсказывает недостающие оценки.", "benefit": "Работающие рекомендации при почти пустой матрице оценок."}}, {"q": "При решении задачи МНК для регрессии программа выдаёт ошибку: матрица X^T X необратима. Аналитик проверяет столбцы X и находит, что один признак — точная линейная комбинация двух других. Какой вывод правильный?", "options": ["Ранг X меньше числа столбцов, решение МНК не единственно, зависимый признак нужно убрать", "Ошибка вызвана нечётным числом наблюдений, и её можно исправить, добавив ещё одну строку данных", "X^T X необратима всегда, когда число наблюдений превышает число признаков, независимо от их зависимости", "Проблема в том, что МНК требует ортогональности признаков, а линейная зависимость здесь ни при чём"], "correct": 0, "explain": "Если один столбец X линейно выражается через другие, ранг X падает ниже числа столбцов, и X^T X становится вырожденной — нормальные уравнения теряют единственное решение. Дело не в чётности наблюдений и не просто в их избытке (Lay, ch. 6.5-6.6).", "usage": {"code": false, "without": "Аналитик списывает ошибку на баг библиотеки и добавляет регуляризацию наугад.", "with": "Проверив ранг X, аналитик находит и убирает избыточный признак, устраняя причину, а не симптом.", "benefit": "Правильная диагностика вместо случайных обходных путей."}}, {"q": "Матрица признаков X в задаче МНК имеет неполный ранг из-за мультиколлинеарности. Инженер выбирает между QR-разложением и SVD-разложением для нахождения решения. Какое утверждение верно?", "options": ["Оба разложения одинаково теряют смысл при неполном ранге, и единственный выход — метод Гаусса", "QR-разложение работает при неполном ранге так же надёжно, как и при полном, и всегда даёт единственное решение", "SVD неприменимо к прямоугольным матрицам, поэтому при неполном ранге остаётся только QR", "SVD выявляет неполный ранг через нулевые сингулярные значения и позволяет найти решение минимальной длины"], "correct": 3, "explain": "SVD показывает неполный ранг через сингулярные значения, близкие к нулю, и через псевдообратную матрицу даёт решение минимальной нормы среди всех решений МНК; классическое QR предполагает полный ранг столбцов и ломается при его потере (Strang, ch. 7).", "usage": {"code": false, "without": "Инженер применяет QR к вырожденной матрице и получает численно неустойчивый результат.", "with": "Зная свойства SVD, инженер переключается на псевдообратную матрицу и получает устойчивое решение минимальной длины.", "benefit": "Надёжное решение МНК даже при мультиколлинеарности."}}, {"q": "В таблицу признаков для регрессии добавили столбец, почти повторяющий уже имеющийся признак с шумом на уровне долей процента. Формально столбцы линейно независимы. Как это скажется на решении МНК?", "options": ["Ранг X упадёт на единицу, и нормальные уравнения полностью потеряют единственное решение", "Ранг X формально останется полным, но X^T X окажется почти вырожденной, а коэффициенты - неустойчивы", "Добавление почти дублирующего столбца никак не влияет на устойчивость, пока столбцы формально линейно независимы", "МНК автоматически усреднит два похожих столбца в один эквивалентный признак перед расчётом"], "correct": 1, "explain": "Формальная линейная независимость сохраняет полный ранг, но близость к линейной зависимости делает X^T X плохо обусловленной: малые ошибки в данных сильно искажают коэффициенты. Это отличает точную сингулярность ранга от практической неустойчивости (Strang, ch. 7; Lay, ch. 6).", "usage": {"code": false, "without": "Аналитик доверяет коэффициентам, которые на самом деле хаотично скачут при малых изменениях данных.", "with": "Проверив число обусловленности, аналитик замечает риск и убирает почти дублирующий признак.", "benefit": "Стабильные коэффициенты регрессии, устойчивые к шуму в данных."}}, {"q": "Для PCA собрана таблица признаков из 15 генов-маркеров, но образцов пациентов всего 10. Какое ограничение это накладывает на ранг матрицы центрированных данных и число значимых главных компонент?", "options": ["Число значимых компонент всегда равно числу признаков независимо от числа образцов", "PCA в этом случае вообще неприменим, потому что признаков больше, чем наблюдений", "Ранг центрированной матрицы не превысит 9, значимых компонент будет не больше девяти", "Ранг матрицы данных не ограничен числом образцов и может достигать всех 15 признаков"], "correct": 2, "explain": "После центрирования строки матрицы данных линейно зависимы через среднее, поэтому ранг матрицы 10 на 15 не превышает min из 9 и 15, то есть 9; PCA при этом остаётся применим, просто число ненулевых компонент ограничено числом образцов минус один (Strang, ch. 7; Lay, ch. 4).", "usage": {"code": false, "without": "Исследователь ожидает 15 значимых компонент и удивляется, почему часть из них имеет нулевую дисперсию.", "with": "Зная связь ранга с числом образцов, исследователь заранее закладывает не больше девяти компонент.", "benefit": "Реалистичные ожидания от PCA на малых выборках."}}, {"q": "При сжатии фотографии через rank-k приближение первые 5 сингулярных значений намного больше остальных 495. Какой вывод о выборе k наиболее обоснован?", "options": ["Уже небольшое k около 5 даст хорошее приближение, ведь остальные сингулярные значения почти не влияют", "Нужно брать k равным полному числу сингулярных значений, иначе изображение перестанет быть матрицей", "Выбор k не влияет на качество приближения, важен только размер исходного изображения", "Чем меньше k, тем точнее приближение, потому что отбрасываются наименее значимые пиксели напрямую"], "correct": 0, "explain": "Ошибка rank-k приближения по норме Фробениуса равна сумме квадратов отброшенных сингулярных значений; если первые 5 значений доминируют, а следующие 495 малы, уже k=5 даёт малую ошибку. Отбрасываются направления, а не пиксели напрямую (Strang, ch. 7).", "usage": {"code": false, "without": "Инженер берёт k=200 для похожего качества, тратя память впустую.", "with": "Посмотрев на убывание сингулярных значений, инженер останавливается на k=5-10 без потери качества.", "benefit": "Меньший размер файла при сохранении визуального качества."}}, {"q": "В рекомендательной системе новый пользователь оценил всего один фильм. Столбец его оценок в матрице пользователь-фильм почти полностью пуст. Как это сказывается на низкоранговом SVD-приближении для этого пользователя?", "options": ["Ранг всей матрицы падает до единицы из-за одного почти пустого столбца", "Пустой столбец повышает точность приближения, потому что уменьшает шум в данных", "SVD автоматически исключает пользователей с одной оценкой из матрицы перед разложением", "Скрытые факторы пользователя оцениваются ненадёжно, предсказания для него менее точны"], "correct": 3, "explain": "Мало данных о пользователе означает мало ограничений на его скрытые факторы в низкоранговом разложении, поэтому оценка этих факторов и последующие предсказания менее надёжны — классическая проблема холодного старта. Один почти пустой столбец не меняет ранг всей матрицы и не исключается автоматически (Strang, ch. 7).", "usage": {"code": false, "without": "Система выдаёт новому пользователю случайные рекомендации и считает их такими же надёжными, как для старых пользователей.", "with": "Зная про холодный старт, разработчики используют дополнительные признаки или предупреждают о низкой уверенности.", "benefit": "Честная оценка качества рекомендаций для новых пользователей."}}, {"q": "Дана матрица A = [4, 1; 2, 3]. Составьте характеристическое уравнение и найдите собственный вектор, отвечающий большему собственному значению.", "options": ["Направление [2, 1]", "Направление [1, -1]", "Направление [1, 1]", "Направление [1, -2]"], "correct": 2, "explain": "Шаг 1: характеристическое уравнение , "Линейно независимы, определитель равен 13", "Линейно независимы, определитель равен -1"], "correct": 3, "explain": "Шаг 1: раскладываем определитель по первой строке: 1*(5*8-3*0) - 2*(2*8-3*1) + 3*(2*0-5*1). Шаг 2: получаем 40 - 26 - 15 = -1. Шаг 3: определитель не равен нулю, значит векторы линейно независимы; ошибка в счёте миноров даёт неверные 13 или -13. (decomposition_presentation.txt; критерий линейной независимости через определитель)", "usage": {"code": false, "without": "Без проверки определителя аналитик может принять три линейно зависимых признака за независимые и получить вырожденную модель регрессии.", "with": "Проверив определитель матрицы признаков, аналитик убеждается, что три вектора данных задают полноценный трёхмерный базис.", "benefit": "Гарантия, что признаки не дублируют друг друга."}}, {"q": "Дана матрица C = [1, 2, 3; 2, 4, 6; 1, 0, 2]. Найдите ранг матрицы C и размерность её ядра, используя теорему о ранге и дефекте.", "options": ["Ранг равен 2, размерность ядра равна 2", "Ранг равен 2, размерность ядра равна 1", "Ранг равен 3, размерность ядра равна 0", "Ранг равен 1, размерность ядра равна 2"], "correct": 1, "explain": "Шаг 1: вторая строка равна удвоенной первой, значит она не добавляет ранга, а строки 1 и 3 не пропорциональны, поэтому ранг матрицы равен 2. Шаг 2: определитель всей матрицы равен нулю, что подтверждает ранг меньше 3, а минор [[1,2],[1,0]] с определителем -2 подтверждает ранг не меньше 2. Шаг 3: по теореме rank плюс nullity равно числу столбцов, 2 плюс dim ker равно 3, откуда dim ker равен 1. (capelli_rouche_theorem.txt; теорема о ранге и дефекте)", "usage": {"code": false, "without": "Не зная ранга матрицы данных, аналитик не понимает, что один из трёх признаков полностью дублирует другой, и рискует получить неустойчивую модель.", "with": "Вычислив ранг и размерность ядра, аналитик заранее видит одну лишнюю линейную зависимость в наборе признаков.", "benefit": "Раннее обнаружение избыточных признаков перед обучением модели."}}, {"q": "Вектор x = [4, 2] задан в стандартном базисе. Базис B состоит из векторов b1 = [1, 1] и b2 = [1, -1]. Найдите координаты вектора x в базисе B.", "options": ["Координаты [2, 2]", "Координаты [1, 3]", "Координаты [3, 1]", "Координаты [3, -1]"], "correct": 2, "explain": "Шаг 1: записываем x = c1*b1 + c2*b2, получаем систему c1+c2=4 и c1-c2=2. Шаг 2: складывая уравнения, находим 2c1=6, откуда c1=3. Шаг 3: подставляя обратно, c2=1, значит координаты вектора в базисе B равны [3, 1]; перестановка координат в [1, 3] — типичная ошибка порядка. (decomposition_presentation.txt; разложение вектора по базису)", "usage": {"code": false, "without": "Без пересчёта координат в новом базисе аналитик не может интерпретировать компоненты вектора данных в системе, заданной главными направлениями.", "with": "Пересчитав координаты вектора в базисе, связанном с признаками задачи, аналитик читает вклад каждой осмысленной оси напрямую.", "benefit": "Прямая интерпретация данных в удобной системе координат."}}, {"q": "Даны векторы u1 = [3, 4] и u2 = [1, 2]. Оставив v1 = u1, постройте методом Грама-Шмидта вектор v2, ортогональный v1. Какому направлению пропорционален v2?", "options": ["Направление [-4, 3]", "Направление [4, 3]", "Направление [-3, 4]", "Направление [3, -4]"], "correct": 0, "explain": "Шаг 1: проекция u2 на u1 равна отношению скалярных произведений u1 умножить на u2 к u1 умножить на u1, то есть 11/25, умноженной на [3, 4]. Шаг 2: v2 = u2 минус эта проекция даёт [-8/25, 6/25]. Шаг 3: умножив на 25/2, получаем пропорциональное направление [-4, 3]; проверка u1 умножить на v2 равна нулю подтверждает ортогональность, а остальные варианты дают ненулевое скалярное произведение с u1. (Lay, Linear Algebra and Its Applications, ch.6.4, Gram-Schmidt)", "usage": {"code": false, "without": "Без ортогонализации Грама-Шмидта аналитик работает с коррелированными базисными направлениями и завышает вклад пересекающихся признаков.", "with": "Построив ортогональный вектор методом Гр composition)", "usage": {"code": false, "without": "Без явного LU-разложения аналитик пересчитывает метод Гаусса заново для каждой новой правой части системы уравнений, теряя время.", "with": "Один раз разложив матрицу на L и U, аналитик решает множество систем с той же матрицей коэффициентов прямой и обратной подстановкой.", "benefit": "Многократное решение систем без повторного исключения переменных."}}, {"q": "Дана матрица A = [1, 1; 0, 1]. Вычислите A транспонированная умножить на A и найдите большее сингулярное число матрицы A с точностью до сотых.", "options": ["Значение 1.41", "Значение 0.62", "Значение 1.62", "Значение 2.62"], "correct": 2, "explain": "Шаг 1: A транспонированная умножить на A равна [1, 1; 1, 2]. Шаг 2: характеристическое уравнение лямбда^2-3лямбда+1=0 даёт большее собственное значение лямбда=(3+корень из 5)/2 примерно 2.62. Шаг 3: сингулярное число есть корень квадратный из этого собственного значения, примерно 1.62; вариант 2.62 — это само собственное значение без извлечения корня. (Strang, Introduction to Linear Algebra, ch.7, SVD)", "usage": {"code": false, "without": "Без вычисления сингулярных чисел аналитик не может оценить, насколько преобразование растягивает данные вдоль главного направления при сжатии методом PCA.", "with": "Найдя большее сингулярное число через A транспонированная умножить на A, аналитик оценивает максимальный коэффициент растяжения данных этим линейным преобразованием.", "benefit": "Количественная оценка главного масштаба искажения данных."}}, {"q": "Собственные значения матрицы D = [6, 2; 2, 3] равны корням уравнения лямбда^2-9лямбда+14=0. Найдите определитель D через произведение собственных значений.", "options": ["Значение 14", "Значение 5", "Значение 9", "Значение 49"], "correct": 0, "explain": "Шаг 1: раскладываем лямбда^2-9лямбда+14=0 на множители: (лямбда-7)(лямбда-2)=0, корни лямбда=7 и лямбда=2. Шаг 2: определитель матрицы равен произведению всех собственных значений, то есть 7*2. Шаг 3: получаем определитель равным 14, что совпадает с прямым расчётом 6*3-2*2=14; вариант 9 — это сумма собственных значений, а не их произведение. (Lay, Linear Algebra and Its Applications, ch.5.2, свойства определителя через собственные значения)", "usage": {"code": false, "without": "Без связи определителя с произведением собственных значений аналитик не может быстро проверить обратимость матрицы после нахождения её спектра.", "with": "Зная собственные значения матрицы, аналитик мгновенно получает определитель как их произведение, не пересчитывая матрицу заново.", "benefit": "Быстрая проверка вырожденности матрицы по уже найденному спектру."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
