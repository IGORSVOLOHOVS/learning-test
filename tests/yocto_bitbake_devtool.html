<!DOCTYPE html>

<head>

<title>Yocto, BitBake и devtool: рецепты и патчи</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
  }
</style>
</head>

(function () {
  const TEST_ID = "yocto_bitbake_devtool";
  const QUESTIONS = [{"q": "Что такое Yocto Project?", "options": ["Дистрибутив Linux с фиксированным набором пакетов для роутеров", "Компилятор языка C с поддержкой кросс-сборки под ARM и MIPS", "Формат образа файловой системы для встраиваемых устройств", "Набор инструментов для сборки собственного дистрибутива Linux"], "correct": 3, "explain": "Yocto не дистрибутив, а конструктор: он собирает дистрибутив под конкретное железо из рецептов. Готового образа «Yocto Linux» не существует, есть образ, собранный средствами Yocto.", "usage": {"code": false, "without": "Прошивку под новое железо собирают вручную и повторить сборку через год уже нельзя.", "with": "Сборка описана рецептами и метаданными, поэтому воспроизводится побитово на любой машине.", "benefit": "Одинаковый результат сборки у разработчика, на CI и у вендора."}}, {"q": "Что такое Poky?", "options": ["Эталонный дистрибутив и одновременно справочная сборочная система", "Загрузчик, передающий управление ядру на этапе включения платы", "Планировщик задач, распределяющий сборку по узлам кластера", "Менеджер пакетов, устанавливающий готовые бинарники в образ"], "correct": 0, "explain": "Poky — эталонная связка BitBake, OpenEmbedded-Core и слоя meta-poky. С него начинают, а под продукт делают свой дистрибутив на его основе.", "usage": {"code": false, "without": "Каждый проект собирает базовый набор метаданных заново и по-своему.", "with": "Poky даёт проверенную отправную точку, поверх которой кладут свои слои.", "benefit": "Не нужно писать с нуля тысячи базовых рецептов."}}, {"q": "Что такое BitBake?", "options": ["Сервис кеширования артефактов сборки на удалённом сервере команды", "Движок, читающий рецепты и выполняющий задачи сборки по графу", "Формат архива, в котором хранятся исходники пакетов дистрибутива", "Утилита прошивки образа на устройство по последовательному порту"], "correct": 1, "explain": "BitBake — исполнитель. Он разбирает рецепты, строит граф зависимостей между задачами и запускает их в правильном порядке, по возможности параллельно.", "usage": {"code": true, "without": "Порядок сборки компонентов держат в голове и в самописных скриптах.", "with": "bitbake core-image-minimal\n# движок сам поймёт, что нужно собрать и в каком порядке", "benefit": "Порядок и параллелизм считает движок, а не человек."}}, {"q": "Что такое рецепт с расширением .bb?", "options": ["Файл конфигурации ядра Linux для конкретной аппаратной платформы", "Журнал сборки, куда движок пишет вывод компилятора и линковщика", "Файл описания одного компонента: откуда взять и как собрать", "Скомпилированный бинарный пакет, готовый к установке в образ"], "correct": 2, "explain": "Рецепт описывает один программный компонент: источник, лицензию, зависимости и задачи сборки. Один рецепт обычно даёт один или несколько пакетов.", "usage": {"code": true, "without": "Инструкция по сборке компонента живёт в README и устаревает молча.", "with": "SUMMARY = \"Демон конфигурации\"\nSRC_URI = \"git://example.org/tool.git;branch=main\"\ninherit autotools", "benefit": "Инструкция исполняема, поэтому не может разойтись с реальностью."}}, {"q": "Что такое слой, каталог с именем вида meta-something?", "options": ["Ветка репозитория, в которой ведётся разработка новой прошивки", "Набор рецептов и конфигураций, подключаемый к сборке независимо", "Отдельный образ, накладываемый поверх базового при обновлении", "Раздел на диске устройства, куда монтируется корневая система"], "correct": 1, "explain": "Слой — единица переиспользования метаданных. Вендор, оператор и проект держат свои слои раздельно, а сборка комбинирует их через bblayers.conf.", "usage": {"code": true, "without": "Правки вендора смешаны с базовыми рецептами, и обновить основу невозможно.", "with": "BBLAYERS += \"/work/meta-vendor\"\nBBLAYERS += \"/work/meta-operator\"", "benefit": "Базовый слой обновляется, не задевая вендорские правки."}}, {"q": "Что задаёт переменная MACHINE в конфигурации сборки?", "options": ["Модель процессора сборочной машины для выбора оптимизаций", "Количество параллельных процессов компиляции для BitBake", "Целевую аппаратную платформу, под которую собирается образ", "Имя хоста, на котором запускается сама сборочная система"], "correct": 2, "explain": "MACHINE выбирает файл conf/machine/<имя>.conf в слое BSP: архитектуру, ядро, загрузчик и набор аппаратных фич. Она про цель, а не про хост.", "usage": {"code": true, "without": "Одни и те же рецепты собирают под другое железо правкой файлов вручную.", "with": "MACHINE = \"raspberrypi4-64\"\nbitbake core-image-minimal", "benefit": "Смена целевой платформы — это одна строка, а не переписывание сборки."}}, {"q": "Что такое DISTRO в терминах Yocto?", "options": ["Политика дистрибутива: набор фич, версий и общих настроек сборки", "Список пакетов, устанавливаемых в образ на этапе do_rootfs", "Версия ядра Linux, зафиксированная для конкретного устройства", "Каталог, в который складываются собранные образы после сборки"], "correct": 0, "explain": "DISTRO задаёт политику: systemd или sysvinit, набор DISTRO_FEATURES, предпочтительные версии. MACHINE отвечает за железо, DISTRO — за характер системы.", "usage": {"code": true, "without": "Одинаковые настройки повторяют в каждом образе и они расходятся.", "with": "DISTRO = \"rdk-broadband\"\nDISTRO_FEATURES:append = \" wifi systemd\"", "benefit": "Политика описана один раз и действует на все образы дистрибутива."}}, {"q": "Для чего служит sstate-cache?", "options": ["Держит логи прошлых сборок для последующего разбора ошибок", "Хранит результаты выполненных задач для повторного использования", "Хранит исходники, скачанные из сети, чтобы не качать их повторно", "Содержит временные файлы распаковки, удаляемые после сборки"], "correct": 1, "explain": "sstate-cache — кеш общего состояния: готовые результаты задач. Если вход задачи не изменился, BitBake берёт результат из кеша вместо повторного выполнения.", "usage": {"code": true, "without": "После очистки каталога сборки всё пересобирается с нуля часами.", "with": "bitbake core-image-minimal\n# задачи с неизменившимися входами берутся из sstate за секунды", "benefit": "Повторная сборка занимает минуты вместо часов."}}, {"q": "Чем каталог downloads отличается от sstate-cache?", "options": ["downloads нужен только при сборке из git, sstate только из архивов", "Это одно и то же хранилище под двумя историческими именами", "downloads хранит результаты задач, sstate — скачанные исходники", "downloads хранит скачанные исходники, sstate — результаты задач"], "correct": 3, "explain": "DL_DIR — сырьё: тарболлы и клоны репозиториев. SSTATE_DIR — полуфабрикат: то, что уже собрано. Их разделяют, потому что живут они по разным правилам.", "usage": {"code": true, "without": "Оба каталога чистят вместе и теряют либо сеть, либо часы сборки.", "with": "DL_DIR = \"/shared/downloads\"\nSSTATE_DIR = \"/shared/sstate-cache\"", "benefit": "Общие каталоги на команду экономят и трафик, и время."}}, {"q": "Что делает команда bitbake core-image-minimal?", "options": ["Прошивает собранный образ на подключённое по USB устройство", "Скачивает готовый образ из репозитория бинарных артефактов", "Собирает указанную цель и все её зависимости до готового образа", "Только проверяет синтаксис рецептов, ничего не собирая на диск"], "correct": 2, "explain": "BitBake строит граф от указанной цели вниз по зависимостям и выполняет недостающие задачи. Прошивка на устройство — отдельный шаг, движок этим не занимается.", "usage": {"code": true, "without": "Зависимости собирают по одной вручную и путаются в порядке.", "with": "bitbake core-image-minimal\n# соберётся образ и всё, от чего он зависит", "benefit": "Достаточно назвать цель, остальное выведет движок."}}, {"q": "Что описывает переменная SRC_URI в рецепте?", "options": ["Список пакетов, которые должны стоять в системе во время работы", "Источники: откуда скачать исходники и какие патчи к ним приложить", "Адрес репозитория, куда публикуется собранный пакет после сборки", "Каталог установки собранных файлов внутри образа устройства"], "correct": 1, "explain": "SRC_URI перечисляет всё, что нужно достать: git, tarball, локальные файлы и патчи. Порядок важен, патчи применяются в порядке перечисления.", "usage": {"code": true, "without": "Исходники кладут в рецепт руками и происхождение версии теряется.", "with": "SRC_URI = \"git://example.org/tool.git;branch=main \\\n           file://0001-fix-timeout.patch\"", "benefit": "Источник и правки к нему описаны в одном месте и воспроизводимы."}}, {"q": "Зачем в рецепте нужен LIC_FILES_CHKSUM?", "options": ["Считает контрольную сумму архива исходников при скачивании из сети", "Хранит подпись разработчика, подтверждающую авторство рецепта", "Фиксирует контрольную сумму файла лицензии, чтобы поймать её смену", "Проверяет целостность собранного пакета перед установкой в образ"], "correct": 2, "explain": "Сборка падает, если текст лицензии в апстриме изменился. Это намеренно: смена лицензии — юридическое событие, и заметить его нужно до релиза, а не после.", "usage": {"code": true, "without": "Апстрим меняет лицензию, продукт уезжает заказчику с нарушением.", "with": "LIC_FILES_CHKSUM = \"file://COPYING;md5=751419260aa954499f7abaabaa882bbe\"", "benefit": "Смена лицензии останавливает сборку и требует явного решения."}}, {"q": "В каком порядке BitBake выполняет основные задачи рецепта?", "options": ["configure, fetch, unpack, patch, install, compile", "fetch, patch, unpack, compile, install, configure", "unpack, fetch, patch, compile, configure, install", "fetch, unpack, patch, configure, compile, install"], "correct": 3, "explain": "Сначала достать, потом распаковать, потом наложить патчи, затем сконфигурировать, собрать и разложить по каталогам. Патчи всегда ложатся на распакованное дерево.", "usage": {"code": true, "without": "Правку вносят после configure и она теряется при следующей сборке.", "with": "bitbake -c listtasks tool\n# do_fetch do_unpack do_patch do_configure do_compile do_install", "benefit": "Понимая порядок, правку вставляют в нужную точку цепочки."}}, {"q": "Чем DEPENDS отличается от RDEPENDS?", "options": ["DEPENDS перечисляет патчи, RDEPENDS перечисляет исходные файлы", "DEPENDS нужен для сборки из git, RDEPENDS для сборки из архива", "DEPENDS — зависимости времени работы, RDEPENDS — времени сборки", "DEPENDS — зависимости времени сборки, RDEPENDS — времени работы"], "correct": 3, "explain": "DEPENDS даёт заголовки и библиотеки для компиляции. RDEPENDS кладёт пакет в образ, потому что без него программа не запустится. Их часто путают.", "usage": {"code": true, "without": "Пакет собирается, но на устройстве не стартует из-за нехватки библиотеки.", "with": "DEPENDS = \"openssl\"\nRDEPENDS:${PN} = \"bash\"", "benefit": "И сборка, и запуск на устройстве обеспечены явно."}}, {"q": "Что означает переменная S в рецепте?", "options": ["Каталог, в который складываются скачанные из сети архивы", "Каталог с распакованными исходниками, где выполняется сборка", "Каталог назначения, куда do_install раскладывает результат", "Каталог общего кеша состояния, разделяемый между сборками"], "correct": 1, "explain": "S указывает на дерево исходников. Если архив распаковывается в каталог с нестандартным именем, S задают явно, иначе сборка не найдёт код.", "usage": {"code": true, "without": "Сборка падает с сообщением, что нечего собирать, хотя исходники скачаны.", "with": "S = \"${WORKDIR}/git\"", "benefit": "Движок знает, где лежит код, и задачи находят свои файлы."}}, {"q": "Что означает переменная D в рецепте?", "options": ["Каталог исходников, из которого запускается компиляция проекта", "Каталог загрузок, общий для всех рецептов текущей сборки", "Каталог документации, попадающий в отдельный пакет с суффиксом doc", "Промежуточный корень, куда do_install ставит файлы будущего пакета"], "correct": 3, "explain": "D — это фиктивный корень. Файлы кладут в ${D}${bindir}, а не прямо в /usr/bin, иначе рецепт испортит систему сборки вместо образа.", "usage": {"code": true, "without": "Установка идёт в реальные каталоги хоста и ломает сборочную машину.", "with": "do_install:append: install -m 0755 tool ${D}${bindir}/tool", "benefit": "Файлы попадают в пакет, а хост остаётся нетронутым."}}, {"q": "Что делает директива inherit в рецепте?", "options": ["Объявляет, что пакет наследует лицензию родительского проекта", "Подключает класс с готовыми задачами и переменными сборки", "Указывает, от какого слоя зависит текущий рецепт при сборке", "Копирует содержимое другого рецепта в текущий целиком"], "correct": 1, "explain": "Классы в файлах с расширением bbclass несут типовую логику: autotools, cmake, systemd. Рецепт наследует их и не переписывает стандартные шаги.", "usage": {"code": true, "without": "Каждый рецепт своими руками описывает вызов configure и make.", "with": "inherit cmake\n# do_configure и do_compile берутся из класса", "benefit": "Типовая сборка описывается одной строкой."}}, {"q": "Что такое PN, PV и PR в именовании рецептов?", "options": ["Приоритет, платформа и раздел репозитория соответственно", "Путь, префикс и корень установки внутри образа соответственно", "Имя пакета, версия и ревизия рецепта соответственно", "Имя патча, версия патча и порядок применения соответственно"], "correct": 2, "explain": "Обычно их не пишут явно: BitBake выводит PN и PV из имени файла вида tool_1.2.bb. PR отвечает за пересборку пакета без смены версии апстрима.", "usage": {"code": true, "without": "Версию дублируют внутри рецепта и она расходится с именем файла.", "with": "# файл tool_1.2.bb -> PN=tool, PV=1.2", "benefit": "Имя файла и есть источник правды о версии."}}, {"q": "Зачем в рецепте пишут FILESEXTRAPATHS?", "options": ["Чтобы расширить список каталогов поиска библиотек при линковке", "Чтобы добавить каталоги поиска локальных файлов и патчей", "Чтобы указать дополнительные каталоги установки внутри образа", "Чтобы задать запасные зеркала для скачивания исходников из сети"], "correct": 1, "explain": "Без этой строки bbappend в своём слое не найдёт положенный рядом патч. Её пишут с оператором prepend, чтобы свой каталог просматривался первым.", "usage": {"code": true, "without": "Патч лежит в слое, но сборка сообщает, что файл не найден.", "with": "FILESEXTRAPATHS:prepend := \"${THISDIR}/files:\"", "benefit": "Файлы своего слоя находятся и имеют приоритет."}}, {"q": "Что обычно делает задача do_install в рецепте?", "options": ["Раскладывает собранные файлы по каталогам внутри фиктивного корня", "Записывает образ файловой системы на носитель целевой платформы", "Устанавливает зависимости сборки в окружение сборочной машины", "Ставит готовый пакет на подключённое по сети целевое устройство"], "correct": 0, "explain": "do_install не трогает ни хост, ни устройство. Она формирует дерево файлов, из которого дальше нарезаются пакеты и собирается rootfs.", "usage": {"code": true, "without": "Файлы копируют вручную и часть из них не попадает в пакет.", "with": "do_install: install -d ${D}${sysconfdir}\n         install -m 0644 tool.conf ${D}${sysconfdir}/", "benefit": "Состав пакета описан и повторяем при каждой сборке."}}, {"q": "Для чего нужен файл с расширением bbappend?", "options": ["Заменяет исходный рецепт целиком своей версией из другого слоя", "Дополняет существующий рецепт из своего слоя, не копируя его", "Описывает новый пакет, которого нет ни в одном подключённом слое", "Отключает рецепт, запрещая его сборку в текущей конфигурации"], "correct": 1, "explain": "bbappend — способ вмешаться в чужой рецепт, не форкая его. Апстрим обновляется, а ваши добавки продолжают применяться поверх новой версии.", "usage": {"code": true, "without": "Рецепт копируют в свой слой и теряют все обновления апстрима.", "with": "# meta-vendor/recipes-connectivity/hostapd/hostapd_%.bbappend\nSRC_URI += \"file://0001-vendor-tweak.patch\"", "benefit": "Правка живёт отдельно от апстрима и переживает его обновление."}}, {"q": "Как патч из слоя попадает в сборку компонента?", "options": ["Его добавляют в SRC_URI, и do_patch применяет его после распаковки", "Его указывают в DEPENDS, и движок применяет его перед компиляцией", "Его кладут в каталог files, и он применяется автоматически без записи", "Его применяют вручную командой patch после завершения сборки"], "correct": 0, "explain": "Автоматически ничего не подхватывается: файл должен быть перечислен в SRC_URI. Порядок применения — порядок перечисления, а не алфавитный.", "usage": {"code": true, "without": "Патч лежит в слое, сборка проходит, но правки в бинаре нет.", "with": "SRC_URI += \"file://0001-increase-timeout.patch\"", "benefit": "Патч применяется на каждой сборке и его нельзя забыть."}}, {"q": "Что означает знак процента в имени hostapd_%.bbappend?", "options": ["Шаблон версии: файл подойдёт к рецепту hostapd любой версии", "Требование собрать рецепт с максимальным приоритетом среди слоёв", "Указание применять дополнение только к последней версии рецепта", "Комментарий, который движок игнорирует при разборе имени файла"], "correct": 0, "explain": "Так дополнение переживает обновление версии апстрима. Обратная сторона — если рецепт изменится содержательно, молчаливое несовпадение никто не заметит.", "usage": {"code": true, "without": "После обновления версии bbappend перестаёт подходить и правка исчезает.", "with": "hostapd_%.bbappend  # подойдёт и к 2.10, и к 2.11", "benefit": "Дополнение не привязано к конкретной версии апстрима."}}, {"q": "Что показывает команда bitbake-layers show-layers?", "options": ["Список подключённых слоёв с их путями и приоритетами", "Список рецептов, которые переопределены в нескольких слоях", "Список задач, выполненных при последней сборке текущей цели", "Список пакетов, попавших в собранный образ файловой системы"], "correct": 0, "explain": "Первая команда при разборе вопроса «почему взялась не та версия». Приоритет решает, чей рецепт победит при совпадении имён.", "usage": {"code": true, "without": "Причину странного поведения ищут в рецептах, не зная состава слоёв.", "with": "bitbake-layers show-layers\nbitbake-layers show-overlayed", "benefit": "Видно, какие слои подключены и кто кого перекрывает."}}, {"q": "Зачем задают PREFERRED_VERSION для рецепта?", "options": ["Чтобы выбрать конкретную версию, когда в слоях есть несколько", "Чтобы зафиксировать версию компилятора, которым собирают пакет", "Чтобы запретить сборку всех версий рецепта кроме самой новой", "Чтобы задать версию, записываемую в метаданные готового пакета"], "correct": 0, "explain": "По умолчанию берётся наибольшая версия. Если нужна не она, выбор фиксируют явно, иначе появление нового рецепта в слое тихо сменит поведение продукта.", "usage": {"code": true, "without": "Обновление слоя подтягивает более новую версию и ломает продукт.", "with": "PREFERRED_VERSION_hostapd = \"2.10\"", "benefit": "Версия зафиксирована и не меняется сама по себе."}}, {"q": "Что делает BBFILE_PRIORITY в конфигурации слоя?", "options": ["Определяет порядок скачивания исходников для рецептов слоя", "Управляет очередью выполнения задач сборки внутри одного слоя", "Задаёт число параллельных задач, выделяемых рецептам этого слоя", "Решает, чей рецепт победит, если имя совпало в нескольких слоях"], "correct": 3, "explain": "Приоритет разрешает конфликт одинаковых имён рецептов. К bbappend это не относится: дополнения применяются все, а не выбирается одно.", "usage": {"code": true, "without": "Два слоя дают рецепт с одним именем и собирается непредсказуемый.", "with": "BBFILE_PRIORITY_meta-vendor = \"10\"", "benefit": "Конфликт имён разрешается явно заданным правилом."}}, {"q": "Что делает bitbake -c cleansstate для рецепта?", "options": ["Очищает только каталог сборки, оставляя кеш состояния нетронутым", "Удаляет скачанные исходники рецепта из общего каталога загрузок", "Сбрасывает кеш состояния и рабочий каталог, заставляя пересобрать", "Помечает рецепт как собранный, пропуская его при следующей сборке"], "correct": 2, "explain": "Нужна, когда подозреваете, что подхватился старый результат из sstate. Исходники в DL_DIR она не трогает, поэтому заново из сети ничего не качается.", "usage": {"code": true, "without": "Правка внесена, а собирается прежний бинарь из кеша состояния.", "with": "bitbake -c cleansstate hostapd\nbitbake hostapd", "benefit": "Компонент гарантированно пересобирается из исходников."}}, {"q": "Что произойдёт, если два патча в SRC_URI меняют одну и ту же строку?", "options": ["Первый патч будет пропущен, а второй применится без сообщений", "Движок объединит изменения автоматически, выбрав более новый патч", "Оба применятся, а конфликт будет разрешён при сборке пакета", "Второй патч не применится и do_patch остановит сборку с ошибкой"], "correct": 3, "explain": "Патчи накладываются последовательно и без слияния. Сборка падает на do_patch, и это правильно: молча применённая половина правок хуже остановки.", "usage": {"code": true, "without": "Изменения одной области раскиданы по двум патчам и мешают друг другу.", "with": "bitbake -c patch hostapd\n# ERROR: Command Error: patch does not apply", "benefit": "Конфликт виден сразу и чинится в исходных патчах."}}, {"q": "Где искать причину, если do_patch падает после обновления версии?", "options": ["В каталоге загрузок: архив исходников скачался не полностью", "В переменной DEPENDS: не хватает пакета для применения патча", "В контексте патча: строки сдвинулись, и патч больше не прикладывается", "В приоритете слоя: он стал ниже, чем у слоя с исходным рецептом"], "correct": 2, "explain": "Патч привязан к контексту вокруг изменяемых строк. Апстрим сдвинул код — контекст не совпал. Лечится перевыпуском патча на новом дереве.", "usage": {"code": true, "without": "После обновления апстрима сборка встаёт и патч чинят наугад.", "with": "devtool modify hostapd\n# поправить конфликт в дереве и перевыпустить патч", "benefit": "Патч перевыпускается на актуальном коде, а не правится вслепую."}}, {"q": "Зачем разделять правки на несколько маленьких патчей вместо одного?", "options": ["Только маленькие патчи можно указывать в переменной SRC_URI", "Маленькие патчи применяются заметно быстрее при сборке компонента", "Каждую правку видно отдельно и её проще отдать в апстрим", "Движок умеет применять параллельно только патчи небольшого размера"], "correct": 2, "explain": "Один патч на одну мысль — то же правило, что и для коммитов. Такой патч можно объяснить, отправить в апстрим и выбросить, когда апстрим его примет.", "usage": {"code": true, "without": "Все правки слиты в один патч и разобраться в них уже нельзя.", "with": "0001-fix-timeout.patch\n0002-add-vendor-ie.patch", "benefit": "Каждую правку можно обсуждать и снимать независимо."}}, {"q": "Что делает команда devtool modify для существующего рецепта?", "options": ["Собирает рецепт и сразу устанавливает результат на целевое устройство", "Открывает файл рецепта в редакторе для правки его переменных", "Копирует рецепт в ваш слой, чтобы дальше править его отдельно", "Разворачивает исходники в рабочее пространство под контролем git"], "correct": 3, "explain": "devtool modify достаёт исходники, применяет существующие патчи и превращает их в git-коммиты. Дальше вы правите обычный git-репозиторий, а не патчи вслепую.", "usage": {"code": true, "without": "Правку вносят редактированием файла patch на глаз и ошибаются в контексте.", "with": "devtool modify hostapd\ncd workspace/sources/hostapd", "benefit": "Правка ведётся в живом дереве кода со всей историей."}}, {"q": "Во что devtool превращает уже существующие патчи рецепта?", "options": ["В отдельные коммиты git поверх исходного дерева апстрима", "В записи журнала сборки, доступные только для чтения", "В один общий коммит, содержащий все правки сразу", "В файлы резервных копий рядом с изменёнными исходниками"], "correct": 0, "explain": "Каждый патч становится коммитом. Поэтому история в рабочем пространстве читается как обычная ветка, и новые правки добавляются новыми коммитами.", "usage": {"code": true, "without": "Существующие патчи остаются набором файлов и их связь с кодом неочевидна.", "with": "git -C workspace/sources/hostapd log --oneline\n# по коммиту на каждый патч из SRC_URI", "benefit": "Патчи видны как история и с ними работают привычными командами."}}, {"q": "Что делает devtool build для компонента в рабочем пространстве?", "options": ["Проверяет синтаксис исходников, не запуская компилятор", "Собирает весь образ целиком, включая все остальные компоненты", "Собирает только этот компонент из текущего состояния дерева", "Отправляет исходники на сборочный сервер и ждёт результата"], "correct": 2, "explain": "Быстрый цикл: правка в дереве, сборка одного компонента, проверка. Полный образ пересобирают потом, когда правка уже работает.", "usage": {"code": true, "without": "После каждой мелкой правки пересобирают весь образ и ждут часами.", "with": "devtool build hostapd", "benefit": "Цикл правка-сборка занимает минуты вместо часов."}}, {"q": "Что делает devtool deploy-target?", "options": ["Создаёт архив с бинарями для ручного копирования на устройство", "Ставит собранные файлы на живое устройство по сети без перепрошивки", "Собирает полный образ и записывает его на карту памяти устройства", "Публикует собранный пакет в репозиторий артефактов команды"], "correct": 1, "explain": "Файлы уезжают на работающее устройство по ssh, и программу можно проверить сразу. Изменения не переживут перепрошивку, это инструмент отладки.", "usage": {"code": true, "without": "Ради проверки одной правки собирают и заливают образ целиком.", "with": "devtool deploy-target hostapd root@192.168.1.1", "benefit": "Правка проверяется на живом железе за секунды."}}, {"q": "Что делает devtool finish в конце работы над компонентом?", "options": ["Оформляет новые коммиты как патчи и кладёт их в указанный слой", "Публикует изменения в апстрим-репозиторий проекта автоматически", "Собирает финальный образ и подписывает его ключом разработчика", "Удаляет рабочее пространство, отбрасывая все внесённые изменения"], "correct": 0, "explain": "Ключевой шаг: коммиты превращаются обратно в файлы патчей, а рецепт или bbappend получает строки SRC_URI. После этого рабочее пространство больше не нужно.", "usage": {"code": true, "without": "Правки остаются в рабочем пространстве и в сборку продукта не попадают.", "with": "devtool finish hostapd /work/meta-vendor", "benefit": "Правка становится частью слоя и собирается у всех."}}, {"q": "Что произойдёт с изменениями, если вызвать devtool reset вместо finish?", "options": ["Изменения автоматически сохранятся в слой перед сбросом состояния", "Изменения будут применены к рецепту, но патчи не будут созданы", "Изменения останутся в дереве, но рецепт вернётся к прежнему виду", "Компонент выйдет из рабочего пространства, а патчи созданы не будут"], "correct": 3, "explain": "reset снимает компонент с разработки и возвращает сборку к рецепту из слоя. Каталог с исходниками остаётся на диске, но в сборку из него уже ничего не идёт.", "usage": {"code": true, "without": "Работу считают завершённой после reset, а правок в продукте нет.", "with": "devtool status\ndevtool reset hostapd", "benefit": "Понятно, что сохранение изменений делает именно finish."}}, {"q": "Что показывает команда devtool status?", "options": ["Состояние сборки последнего запущенного задания и её прогресс", "Статус подключения к целевому устройству по сети управления", "Список компонентов, находящихся сейчас в рабочем пространстве", "Перечень слоёв, изменённых с момента предыдущей полной сборки"], "correct": 2, "explain": "Полезна, когда сборка ведёт себя странно: забытый в рабочем пространстве компонент перекрывает рецепт из слоя и продолжает подменять его молча.", "usage": {"code": true, "without": "Забытый компонент подменяет рецепт и причину ищут в слоях.", "with": "devtool status\n# hostapd: /work/build/workspace/sources/hostapd", "benefit": "Видно, что именно сейчас перекрывает рецепты из слоёв."}}, {"q": "Что делает devtool add для нового компонента?", "options": ["Добавляет новый слой в конфигурацию текущей сборки автоматически", "Создаёт рецепт для нового проекта, определяя систему сборки", "Добавляет готовый пакет в образ, не создавая никакого рецепта", "Регистрирует зависимость между двумя уже существующими рецептами"], "correct": 1, "explain": "devtool add смотрит на исходники и пытается угадать систему сборки и лицензию. Заготовку почти всегда надо править, но начинать с нуля не приходится.", "usage": {"code": true, "without": "Рецепт для нового компонента пишут с нуля, копируя чужой наугад.", "with": "devtool add mytool https://example.org/mytool.git", "benefit": "Появляется рабочая заготовка рецепта под правку."}}, {"q": "Где физически живут исходники компонента после devtool modify?", "options": ["В каталоге downloads рядом со скачанными архивами исходников", "В общем каталоге кеша состояния вместе с результатами задач", "Прямо в слое вендора, в каталоге рядом с файлом рецепта", "В отдельном слое workspace, в подкаталоге sources внутри сборки"], "correct": 3, "explain": "devtool создаёт временный слой workspace и подключает его к сборке с высоким приоритетом. Поэтому рецепт из вендорского слоя перестаёт действовать.", "usage": {"code": true, "without": "Ищут исходники в слое и не понимают, откуда берётся сборка.", "with": "ls build/workspace/sources/hostapd\ncat build/workspace/conf/layer.conf", "benefit": "Понятно, где лежит код и почему он перекрывает рецепт."}}, {"q": "Зачем перед devtool finish приводить в порядок историю коммитов?", "options": ["Иначе каждый черновой коммит станет отдельным файлом патча", "Иначе имена файлов патчей будут содержать недопустимые символы", "Иначе патчи будут применены в обратном по отношению к истории порядке", "Иначе finish откажется работать при наличии более одного коммита"], "correct": 0, "explain": "Один коммит превращается в один патч, включая коммиты вида «поправил опечатку». История, за которую не стыдно, даёт набор патчей, за который не стыдно.", "usage": {"code": true, "without": "В слой уезжают десять патчей, из которых восемь — черновые правки.", "with": "git rebase -i ${upstream}\ndevtool finish hostapd /work/meta-vendor", "benefit": "В слой попадает ровно столько патчей, сколько смысловых правок."}}, {"q": "Рецепт tool_1.2.bb лежит в meta-oe с приоритетом 6, а tool_1.4.bb — в meta-vendor с приоритетом 10. PREFERRED_VERSION не задан. Какая версия соберётся?", "options": ["Сборка остановится с ошибкой о конфликте двух рецептов", "Версия 1.2, потому что рецепт из meta-oe считается базовым", "Версия 1.4, потому что при выборе версии побеждает большая", "Версия 1.4, потому что приоритет слоя meta-vendor выше"], "correct": 2, "explain": "Шаг 1: приоритет решает конфликт только при совпадении версий. Шаг 2: версии разные, поэтому берётся наибольшая. Шаг 3: это 1.4, и совпадение с высоким приоритетом здесь случайно.", "usage": {"code": true, "without": "Считают, что приоритет слоя всегда определяет выбор рецепта.", "with": "# версии разные -> выигрывает большая\nPREFERRED_VERSION_tool = \"1.2\"  # если нужна именно 1.2", "benefit": "Понятно, когда работает приоритет, а когда номер версии."}}, {"q": "Вы правите hostapd через devtool modify, сделали 3 коммита, выполнили devtool build и проверили на устройстве. Затем сделали devtool reset. Что теперь в слое вендора?", "options": ["Один объединённый патч со всеми тремя правками сразу", "Ничего: reset не переносит изменения в слой, это делает finish", "Три файла патчей и обновлённые строки в переменной SRC_URI", "Только изменения рецепта, файлы патчей нужно создать вручную"], "correct": 1, "explain": "Шаг 1: коммиты живут в рабочем пространстве. Шаг 2: перенос в слой делает finish. Шаг 3: reset лишь снимает компонент с разработки, поэтому в слое пусто.", "usage": {"code": true, "without": "После reset считают работу законченной и теряют её результат.", "with": "devtool finish hostapd /work/meta-vendor  # вот это переносит\ndevtool reset hostapd  # а это просто снимает", "benefit": "Результат работы доезжает до слоя, а не пропадает."}}, {"q": "Полная сборка образа занимает 90 минут. После правки одного компонента sstate позволяет пропустить 80 процентов задач, но зависимые компоненты пересобираются. Сколько примерно займёт пересборка?", "options": ["Около 18 минут, потому что выполняется пятая часть задач", "Около 72 минуты, потому что кеш ускоряет только скачивание", "Около 90 минут, потому что кеш состояния при правке не работает", "Около 45 минут, потому что кеш экономит ровно половину времени"], "correct": 0, "explain": "Шаг 1: пропускается 80 процентов задач, выполняется 20. Шаг 2: 90 умножить на 0,2 даёт 18. Шаг 3: примерно 18 минут, а не полтора часа.", "usage": {"code": true, "without": "Каждую правку сопровождают полной сборкой, считая кеш бесполезным.", "with": "90 * 0.20 = 18 мин", "benefit": "Понятно, сколько на самом деле стоит итерация."}}, {"q": "В SRC_URI перечислены 0001-a.patch и 0002-b.patch. Оба меняют одну функцию, причём 0002 писался до того, как появился 0001. Что произойдёт при сборке?", "options": ["Движок переставит патчи по датам их создания и применит оба", "Оба применятся, потому что имена файлов задают верный порядок", "0001 применится, а 0002 упадёт: контекст уже изменён первым патчем", "Применится 0002, а 0001 будет пропущен как более поздний"], "correct": 2, "explain": "Шаг 1: порядок задаётся перечислением в SRC_URI. Шаг 2: 0001 меняет функцию первым. Шаг 3: 0002 писался под старый контекст, не находит его и падает.", "usage": {"code": true, "without": "Патчи собирают из разных веток и порядок применения не проверяют.", "with": "devtool modify tool\n# перевыпустить 0002 поверх применённого 0001", "benefit": "Патчи согласованы между собой и применяются подряд."}}, {"q": "Компонент собран и работает, но после перепрошивки устройства правка исчезла. Ранее использовалась только команда devtool deploy-target. В чём причина?", "options": ["Файлы были установлены не в те каталоги и удалены при очистке", "Патч не был подписан и был отброшен проверкой целостности образа", "Устройство при прошивке откатилось на предыдущую версию прошивки", "deploy-target кладёт файлы в память устройства, а не в образ"], "correct": 3, "explain": "Шаг 1: deploy-target ставит файлы на живую систему. Шаг 2: образ при этом не пересобирается. Шаг 3: прошивка возвращает содержимое образа, где правки нет.", "usage": {"code": true, "without": "Проверку на живом устройстве принимают за попадание правки в продукт.", "with": "devtool deploy-target tool root@device  # только проверка\ndevtool finish tool /work/meta-vendor  # а это в продукт", "benefit": "Различие между проверкой и внедрением становится явным."}}, {"q": "Рецепт задаёт SRC_URI на git с указанием ветки, но без SRCREV. Сборка сегодня и через месяц дала разные бинари. Почему?", "options": ["Версия в имени файла рецепта изменилась при обновлении слоя", "Кеш состояния устарел и был пересобран с другими настройками", "Без фиксации ревизии берётся текущая вершина указанной ветки", "Компилятор в новой версии дистрибутива изменил флаги оптимизации"], "correct": 2, "explain": "Шаг 1: ветка — это движущаяся ссылка. Шаг 2: без SRCREV берётся её текущая вершина. Шаг 3: апстрим за месяц получил коммиты, поэтому исходники другие.", "usage": {"code": true, "without": "Сборка не воспроизводится, и причину ищут в окружении, а не в рецепте.", "with": "SRCREV = \"a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0\"", "benefit": "Сборка даёт один и тот же результат в любой день."}}, {"q": "Вы добавили bbappend в свой слой, но сборка сообщает, что файл патча не найден. Рецепт и патч на месте. Что забыто?", "options": ["Не задана переменная FILESEXTRAPATHS с каталогом своего слоя", "Не выполнена команда очистки кеша состояния перед новой сборкой", "Не увеличено значение BBFILE_PRIORITY для собственного слоя", "Не указана зависимость от исходного рецепта в переменной DEPENDS"], "correct": 0, "explain": "Шаг 1: bbappend найден, иначе ошибка была бы другой. Шаг 2: значит проблема в поиске файла. Шаг 3: каталог files своего слоя не в путях поиска, его добавляет FILESEXTRAPATHS.", "usage": {"code": true, "without": "Патч лежит рядом с bbappend, но сборка его не видит.", "with": "FILESEXTRAPATHS:prepend := \"${THISDIR}/files:\"\nSRC_URI += \"file://0001-fix.patch\"", "benefit": "Файлы своего слоя находятся при сборке."}}, {"q": "После devtool modify история показывает 2 коммита от существующих патчей. Вы добавили 3 своих коммита и выполнили finish. Сколько патчей окажется в слое?", "options": ["Один: все коммиты объединяются в общий файл патча", "Пять: каждый коммит истории становится отдельным патчем", "Два: учитываются только исходные патчи рецепта", "Три: в патчи превращаются только добавленные вами коммиты"], "correct": 1, "explain": "Шаг 1: modify превратил 2 патча в 2 коммита. Шаг 2: вы добавили ещё 3, всего 5. Шаг 3: finish делает по патчу на коммит, то есть 5 файлов.", "usage": {"code": true, "without": "Ожидают три патча и удивляются пяти файлам в слое.", "with": "git log --oneline  # 5 коммитов\ndevtool finish tool /work/meta-vendor  # 5 патчей", "benefit": "Число патчей предсказуемо и равно числу коммитов."}}, {"q": "Правка внесена в исходники, devtool build прошёл, но на устройстве поведение прежнее. deploy-target выполнялся. Что проверить первым?", "options": ["Не изменилась ли версия рецепта после последнего обновления слоя", "Не устарел ли кеш состояния и не нужна ли полная пересборка образа", "Хватает ли места на устройстве для установки новых файлов пакета", "Тот ли двоичный файл заменён и перезапущен ли использующий его сервис"], "correct": 3, "explain": "Шаг 1: сборка прошла, значит код собран. Шаг 2: файлы доставлены. Шаг 3: старый процесс продолжает работать со старым кодом до перезапуска сервиса.", "usage": {"code": true, "without": "Ищут ошибку в сборке, хотя на устройстве просто не перезапущен демон.", "with": "systemctl restart hostapd\nls -l /usr/sbin/hostapd", "benefit": "Проверяется вся цепочка до работающего процесса, а не только сборка."}}, {"q": "Два разработчика собирают один и тот же коммит рецептов. У одного правка есть, у другого нет. devtool status у второго показывает этот компонент. В чём причина?", "options": ["У второго не скачались исходники и сборка взяла архив из кеша", "У второго компонент остался в рабочем пространстве и перекрывает слой", "У второго не совпадает версия дистрибутива, заданная переменной DISTRO", "У второго отключён слой вендора в конфигурации подключённых слоёв"], "correct": 1, "explain": "Шаг 1: рецепты одинаковые, значит дело не в них. Шаг 2: devtool status показывает компонент в рабочем пространстве. Шаг 3: слой workspace имеет высокий приоритет и подменяет рецепт из слоя.", "usage": {"code": true, "without": "Одинаковый коммит даёт разный результат, и причину ищут в рецептах.", "with": "devtool status\ndevtool reset hostapd", "benefit": "Забытое рабочее пространство перестаёт незаметно подменять сборку."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q.q) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
