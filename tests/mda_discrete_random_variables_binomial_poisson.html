<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDA 6: Дискретные случайные величины, биномиальное и пуассоновское распределения</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>

ходов, разрушает схему. (lecture_4, стр. 2)", "usage": {"code": false, "without": "Без проверки всех условий легко ошибочно применить формулу Бернулли там, где вероятность успеха меняется от опыта к опыту.", "with": "Проверив условия по списку, студент уверенно решает, подходит ли схема Бернулли к конкретной задаче.", "benefit": "Предотвращает применение формулы Бернулли там, где она не работает."}}, {"q": "Что показывает формула Бернулли Pn(k) = C(n,k)·p^k·q^(n−k)?", "options": ["Вероятность того что среди n независимых испытаний успех наступит не менее k раз", "Среднее число успехов среди n независимых испытаний схемы Бернулли", "Вероятность того что первый успех наступит ровно на k-м испытании", "Вероятность того что среди n независимых испытаний успех наступит ровно k раз"], "correct": 3, "explain": "Формула Бернулли даёт вероятность того, что событие А наступит ровно k раз в n независимых испытаниях с вероятностью успеха p в каждом; она не даёт вероятность номера первого успеха и не является средним значением. (lecture_4, стр. 5)", "usage": {"code": false, "without": "Без формулы пришлось бы перебирать все возможные исходы n испытаний вручную, чтобы найти вероятность ровно k успехов.", "with": "Формула сразу даёт числовой ответ через биномиальный коэффициент и степени p и q.", "benefit": "Ускоряет расчёт вероятности заданного числа успехов в серии независимых испытаний."}}, {"q": "Почему в схеме Бернулли термины успех и неудача называют условными метками?", "options": ["Это метка которая случайно меняется от испытания к испытанию внутри опыта", "Это просто обозначения нужного исхода, а не суждение о том хорош он или плох", "Это исключительно положительная по смыслу для эксперимента характеристика", "Это указание что успех всегда означает исправную деталь а неудача брак"], "correct": 1, "explain": "В лекции подчёркивается, что успех - это просто обозначение интересующего исследователя исхода, а не оценка его качества: например, бракованная деталь на производстве может считаться успехом, если именно её ищут. (lecture_4, стр. 4)", "usage": {"code": false, "without": "Без понимания условности меток студент может решить, что успех обязательно означает хороший исход, и запутаться в задаче про брак.", "with": "Понимая условность меток, студент сразу видит, что успехом объявляется искомое событие независимо от его смысла.", "benefit": "Предотвращает путаницу при переносе схемы Бернулли на задачи про дефекты и брак."}}, {"q": "При каких условиях биномиальную вероятность приближают формулой Пуассона?", "options": ["Когда число испытаний и вероятность успеха оба стремятся к бесконечности", "Когда число испытаний мало а вероятность успеха в каждом испытании велика", "Когда число испытаний велико а вероятность успеха в каждом испытании мала", "Когда число испытаний велико а вероятность успеха равна ровно половине"], "correct": 2, "explain": "Формула Пуассона применяется как предельный случай биномиального распределения, когда число испытаний n велико, а вероятность успеха p в каждом испытании мала - это называют законом редких событий. (lecture_4, стр. 12)", "usage": {"code": false, "without": "Без знания условий применимости студент может использовать формулу Пуассона там, где n мало или p велико, и получить грубую ошибку.", "with": "Зная условия, студент сначала проверяет что n велико а p мало, и только потом переходит к приближению Пуассона.", "benefit": "Гарантирует корректность приближения биномиальной вероятности пуассоновской."}}, {"q": "Что означает параметр лямбда в формуле Пуассона Pn(m) приближённо равно лямбда^m делить на m факториал умножить на e^-лямбда?", "options": ["Среднее число успехов в схеме Бернулли, равное произведению n и p", "Дисперсию числа успехов в схеме Бернулли, равную произведению n и q", "Наиболее вероятное число успехов, равное целой части произведения n и p", "Вероятность хотя бы одного успеха среди n независимых испытаний"], "correct": 0, "explain": "Лямбда - это среднее число успехов в схеме Бернулли, равное произведению n и p; в примере с левшами лямбда равна 200 умножить на 0.08 равно 16 в среднем левшей среди студентов. (lecture_4, стр. 13)", "usage": {"code": false, "without": "Без понимания смысла лямбда студент не сможет правильно подставить её значение в формулу Пуассона для новой задачи.", "with": "Понимая, что лямбда равна n умножить на p, студент сразу вычисляет её для любой похожей задачи о редких событиях.", "benefit": "Позволяет верно параметризовать распределение Пуассона в прикладных задачах."}}, {"q": "Что называют дискретной случайной величиной?", "options": ["Величину, принимающую счётное множество значений только внутри одного отдельного испытания", "Величину, принимающую любое значение из промежутка на числовой прямой с плотностью вероятности", "Величину, значение которой заранее известно и остаётся неизменным при любом повторении опыта", "Величину, принимающую конечное или счётное множество значений с определённой для каждого вероятностью"], "correct": 3, "explain": "Дискретная случайная величина принимает конечное или счётное множество значений, и каждому значению соответствует определённая вероятность; величина с непрерывным множеством значений на промежутке относится уже к непрерывным величинам. (lecture_4, стр. 17)", "usage": {"code": false, "without": "Без чёткого определения студент может по ошибке применить методы дискретных величин к непрерывной величине вроде напряжения.", "with": "Зная определение, студент сразу распознаёт, что число дефектных деталей - дискретная величина, а не непрерывная.", "benefit": "Помогает выбрать правильный аппарат анализа - дискретный или непрерывный."}}, {"q": "Что задаёт закон распределения дискретной случайной величины?", "options": ["Список возможных значений величины вместе со средним арифметическим всех наблюдений в выборке", "Список возможных значений величины вместе с вероятностью каждого, сумма которых равна единице", "Формулу только для вычисления математического ожидания и дисперсии этой случайной величины", "Список значений величины, отсортированный по убыванию вероятности их появления в опыте"], "correct": 1, "explain": "Закон распределения - это список всех возможных значений величины вместе с вероятностью каждого значения, причём сумма всех вероятностей равна единице; это не одно число вроде математического ожидания. (lecture_4, стр. 18)", "usage": {"code": false, "without": "Без закона распределения нельзя ответить на вопрос, с какой вероятностью величина примет то или иное конкретное значение.", "with": "Имея закон распределения, студент сразу читает вероятность любого отдельного значения величины.", "benefit": "Даёт полную картину поведения случайной величины, а не только её среднее."}}, {"q": "Что описывает геометрическое распределение?", "options": ["Число дефектных изделий в выборке без возвращения из партии известного состава", "Среднее число успехов при очень большом числе испытаний и малой вероятности успеха", "Число испытаний до первого появления успеха в последовательности независимых опытов", "Число успехов среди фиксированного числа независимых испытаний с постоянной вероятностью"], "correct": 2, "explain": "Геометрическое распределение описывает число испытаний, проведённых до первого появления успеха в серии независимых опытов с постоянной вероятностью p, как в примере с бросками кости до первого выпадения шести очков. (lecture_4, стр. 24-25)", "usage": {"code": false, "without": "Без этого распределения трудно оценить, сколько попыток в среднем потребуется до первого успеха.", "with": "Зная модель, студент считает вероятность того, что первый успех наступит ровно на заданной попытке.", "benefit": "Позволяет моделировать ожидание первого редкого события в серии испытаний."}}, {"q": "В какой ситуации применяют гипергеометрическое распределение?", "options": ["При выборке без возвращения из партии с известным фиксированным числом дефектных изделий", "При выборке с возвращением из партии с неизвестной вероятностью появления дефекта", "Пр ний n больше 30", "Когда np минус q является целым числом", "Когда само np является целым числом"], "correct": 3, "explain": "Наивероятнейшее число лежит в диапазоне от np-q до np+p; если np уже целое, оно единственное и совпадает с m0=np. Случай, когда целым является np-q, даёт не одно, а два наивероятнейших числа. (lecture_4_bernoul_poisson_discr_distr_tsi.txt, стр. 10)", "usage": {"code": false, "without": "Технолог проверяет вручную все вероятности P(k), чтобы найти самое частое число годных деталей в партии.", "with": "Он сразу считает np и, убедившись, что оно целое, называет m0 без перебора.", "benefit": "Поиск наивероятнейшего числа успехов сводится к одному умножению вместо полного перебора."}}, {"q": "Для партии из n=24 проверяемых изделий с вероятностью годности p=0.6 величина np минус q оказалась целым числом, равным 14. Сколько наивероятнейших чисел годных изделий существует в этом случае?", "options": ["Три числа: m0 равны 13, 14 и 15 одновременно для этой партии", "Два числа: m0 равны 14 и 15, поскольку np минус q оказалось целым", "Число m0 не определено, если np минус q оказалось целым", "Одно число: m0 равно 14, наивероятнейшее значение единственно"], "correct": 1, "explain": "Если np-q целое, то диапазон np-q <= m0 <= np+p содержит ровно две целые границы, и оба значения m0=np-q и m0=np+p являются наивероятнейшими. Для n=24, p=0.6 это m0=14 и m0=15. (lecture_4_bernoul_poisson_discr_distr_tsi.txt, стр. 11)", "usage": {"code": false, "without": "Контролёр качества называет только одно наиболее вероятное число годных изделий и упускает второе равновероятное значение.", "with": "Он проверяет, целое ли np-q, и в этом случае сразу указывает оба наивероятнейших числа.", "benefit": "Прогноз числа годных изделий не теряет второй равновероятный вариант."}}, {"q": "При каких условиях биномиальное распределение можно приближённо заменить распределением Пуассона по формуле Pn от m примерно равно лямбда в степени m, делённой на m факториал, умноженной на e в степени минус лямбда?", "options": ["Число испытаний n велико, а вероятность успеха p тоже близка к единице", "Произведение np должно неограниченно расти вместе с ростом n", "Число n велико, p мало, а произведение np остаётся конечным, равным лямбда", "Число испытаний n мало, а вероятность успеха p близка к 0.5"], "correct": 2, "explain": "Пуассоновская аппроксимация работает в законе редких событий: n стремится к бесконечности, p стремится к нулю, а их произведение лямбда=np держится конечным и умеренным. Большое p или растущее без предела np делают приближение неприменимым. (lecture_4_bernoul_poisson_discr_distr_tsi.txt, стр. 12)", "usage": {"code": false, "without": "Аналитик колл-центра считает вероятность редких сбоев по полной биномиальной формуле с огромными факториалами.", "with": "Убедившись, что n велико, а p мало, он использует формулу Пуассона с лямбда=np.", "benefit": "Расчёт вероятности редкого события упрощается без потери точности."}}, {"q": "На проверку берут ровно n=200 деталей из партии. Каждая деталь оказывается либо стандартной, либо бракованной, вероятность брака одна и та же для любой детали и не зависит от результата проверки других деталей. Какую модель нужно выбрать для числа бракованных деталей X?", "options": ["Гипергеометрическое распределение числа успехов", "Геометрическое распределение числа испытаний", "Пуассоновское распределение числа событий", "Биномиальное распределение числа успехов"], "correct": 3, "explain": "Выполнены все четыре условия схемы Бернулли: фиксированное число испытаний, два исхода, постоянная вероятность p и независимость, поэтому X подчиняется биномиальному закону Bin n, p, а не гипергеометрическому, который требует отбора без возврата. Lecture_4, Assumptions of Bernoulli Trials.", "usage": {"code": false, "without": "Без проверки условий студент машинально берёт формулу с сочетаниями для выборки без возврата и получает неверную вероятность брака.", "with": "Проверив все четыре условия схемы Бернулли, студент сразу применяет формулу Бернулли для X.", "benefit": "Правильный выбор модели с первого шага экономит время на экзамене."}}, {"q": "Фермер держит 15 коров, из них 5 дают надой выше среднего. Для проверки без возврата наугад отбирают 3 коровы; X — число высокоудойных среди отобранных. Почему для X нельзя применять биномиальный закон C n k, p^k q^n-k?", "options": ["Потому что каждый отбор допускает больше двух возможных исходов", "Потому что вероятность выбрать удойную корову меняется с каждым отбором", "Потому что результаты соседних отборов становятся ещё более независимыми", "Потому что общее число отборов не фиксировано заранее вообще"], "correct": 1, "explain": "Схема Бернулли требует постоянства вероятности успеха от испытания к испытанию, а отбор без возврата меняет состав оставшихся коров, поэтому нужна гипергеометрическая модель. Seminar_7, задача 15; lecture_4, Hypergeometric distribution.", "usage": {"code": false, "without": "Студент применяет биномиальную формулу к выборке без возврата и получает завышенную или заниженную вероятность.", "with": "Заметив отбор без возврата, студент сразу переходит к гипергеометрической формуле через сочетания.", "benefit": "Верная классификация модели убирает системную ошибку в задачах на выборку без возврата."}}, {"q": "Кость бросают до первого появления четырёх очков; Y — номер броска, на котором это происходит впервые. Какому закону подчиняется Y?", "options": ["Закону Пуассоновского распределения с параметром lambda", "Закону гипергеометрического распределения с параметром M", "Закону геометрического распределения с параметром p", "Закону биномиального распределения с параметром n"], "correct": 2, "explain": "Y считает номер испытания до первого успеха при постоянной вероятности p — это определение геометрического закона pk=q^k-1 умножить на p, k=1,2,.... Lecture_4, Geometric distribution; seminar_7, задача 14.", "usage": {"code": false, "without": "Студент пытается посчитать Y через формулу Бернулли для фиксированного числа испытаний и не может закрыть сумму вероятностей.", "with": "Распознав ожидание первого успеха, студент сразу пишет ряд q^k-1 умножить на p.", "benefit": "Экономит шаг, который иначе уводит решение в тупик."}}, {"q": "500 стеклянных изделий перевозят со склада на завод; вероятность повреждения каждого изделия при перевозке равна 0.002. Какую модель стоит выбрать для числа повреждённых изделий?", "options": ["Модель Пуассоновского приближения с lambda равным np", "Модель нормального приближения через параметры np и sqrt npq", "Модель точного гипергеометрического распределения", "Модель геометрического распределения с параметром p"], "correct": 0, "explain": "n большое, p малое — выполняется закон редких событий, поэтому Pn m приближается формулой Пуассона с lambda=np=1, а не нормальной или гипергеометрической моделью. Lecture_4, Poisson formula; seminar_5, задача 1.", "usage": {"code": false, "without": "Студент решает задачу через громоздкую точную биномиальную сумму по трём значениям m.", "with": "Заметив n большое и p малое, студент сразу берёт компактную формулу Пуассона.", "benefit": "Существенно сокращает вычисления при сохранении точности."}}, {"q": "Для числа успехов Sn в схеме Бернулли из n независимых испытаний закон распределения задаётся таблицей значений k и вероятностей pk. Какие значения принимает Sn и чему равна сумма всех pk?", "options": ["Sn принимает целые значения без верхней границы, сумма всех pk равна 1", "Sn принимает целые значения от 0 до n, сумма всех pk равна p", "Sn принимает целые значения от 1 до n, сумма всех pk равна 1", "Sn принимает целые значения от 0 до n, сумма всех pk равна 1"], "correct": 3, "explain": "По таблице биномиального закона Sn принимает значения 0,1,...,n, и сумма от k=0 до n по pk равна 1, так как события образуют полную группу. Lecture_4, Binomial distribution.", "usage": {"code": false, "without": "Студент забывает включить значение 0 успехов в таблицу и теряет часть вероятностной массы.", "with": "Помня границы 0 и n, студент сразу проверяет полноту таблицы суммой pk.", "benefit": "Исключает типичную ошибку с потерянным крайним значением."}}, {"q": "Среднее число звонков в колл-центр равно 2 в минуту, поток звонков считается простейшим. Нужно найти вероятность ровно 6 звонков за 3 минуты. Как правильно выбрать модель для числа звонков X?", "options": ["X описывается гипергеометрическим распределением с параметром N равным 3", "X описывается распределением Пуассона напрямую с lambda равным 6", "X описывается биномиальным распределением с Пуассоновским приближением", "X описывается геометрическим распределением с параметром p равным 2"], "correct": 1, "explain": "Простейший поток событий сам по себе описывается распределением Пуассона как самостоятельной моделью, а не как приближение биномиального закона; lambda равна среднему числу событий за интервал, то есть 2 умножить на 3. Lecture_4, Poisson distribution; seminar_5, задача 5.", "usage": {"code": false, "without": "Студент ищет несуществующие n и p для потока звонков и не может построить биномиальную схему.", "with": "Распознав простейший поток, студент сразу берёт lambda как среднее число событий за нужный интервал.", "benefit": "Убирает лишний и ошибочный шаг с подбором биномиальных параметров."}}, {"q": "В серии испытаний ровно два исхода, и вероятность успеха постоянна, но исход каждого следующего испытания зависит от исхода предыдущего. Можно ли описывать число успехов биномиальным законом?", "options": ["Можно, так как достаточно постоянства вероятности успеха", "Можно, если дополнительно число испытаний стремится к бесконечности", "Нельзя, так как схема Бернулли требует независимости испытаний", "Нельзя, так как схема Бернулли требует ровно двух испытаний"], "correct": 2, "explain": "Независимость испытаний — одно из четырёх условий схемы Бернулли; без неё формула C n k, p^k q^n-k неприменима, даже если p постоянна. Lecture_4, Assumptions of Bernoulli Trials.", "usage": {"code": false, "without": "Студент видит постоянную p, забывает про зависимость исходов и получает неверный биномиальный ответ.", "with": "Проверив независимость отдельно от постоянства p, студент верно отклоняет биномиальную модель.", "benefit": "Не даёт спутать частичное совпадение условий с полным выполнением схемы Бернулли."}}, {"q": "В группе 30 студентов; вероятность родиться именно в ноябре для каждого принимается равной 1/12. Нужно найти наиболее вероятное число студентов, родившихся в ноябре. Какую модель стоит применить?", "options": ["Модель точной формулы Бернулли, так как p не является малой вероятностью", "Модель геометрического распределения, так как ищем номер первого успеха", "Модель гипергеометрического распределения, так как отбор идёт без возврата", "Модель Пуассоновского приближения, так как n считается достаточно большим"], "correct": 0, "explain": "n=30 не очень велико, а p=1/12 не является малой вероятностью, поэтому условия закона редких событий не выполнены и нужна точная формула Бернулли, а не Пуассоновское приближение. Seminar_5, задача 8; lecture_4, Poisson formula.", "usage": {"code": false, "without": "Студент по привычке хватается за Пуассоновскую формулу там, где n и p не дают права на приближение.", "with": "Оценив n и p перед выбором модели, студент остаётся на точной биномиальной формуле.", "benefit": "Сохраняет точность ответа там, где приближение дало бы заметную погрешность."}}, {"q": "Вероятность выпадения герба при подбрасывании монеты постоянна и равна 0.5. Рассмотрим X — число гербов в 5 бросках, и Y — номер броска, на котором герб выпадет первый раз. Каким законам они подчиняются?", "options": ["X подчиняется геометрическому закону, а Y подчиняется биномиальному закону", "X и Y оба подчиняются биномиальному закону с разными параметрами n", "X и Y оба подчиняются Пуассоновскому закону с разными параметрами lambda", "X подчиняется биномиальному закону, а Y подчиняется геометрическому закону"], "correct": 3, "explain": "X считает число успехов при фиксированном числе испытаний — это биномиальный закон Bin n, p; Y считает номер первого успеха — это геометрический закон G p. Lecture_4, Binomial and Geometric distribution; seminar_7, задачи 10 и 14.", "usage": {"code": false, "without": "Студент путает модель подсчёта успехов с моделью ожидания первого успеха и решает обе задачи одной формулой.", "with": "Различив вопрос про количество и вопрос про номер, студент сразу применяет нужный закон к каждой величине.", "benefit": "Позволяет за секунды разложить смешанную задачу на две правильные модели."}}, {"q": "В биномиальной модели число испытаний n растёт, а вероятность успеха p убывает так, что произведение np остаётся постоянным и равным lambda. Что происходит с распределением числа успехов?", "options": ["Вероятности pk становятся одинаковыми для всех значений k при любом lambda", "Вероятности pk приближаются к формуле Пуассона с параметром lambda", "Вероятности pk приближаются к формуле геометрического распределения с параметром p", "Вероятности pk перестают суммироваться в единицу при любом числе испытаний"], "correct": 1, "explain": "Это предельный переход n стремится к бесконечности, p стремится к нулю при np=lambda постоянном, который даёт формулу Пуассона: Pn m приближённо равно lambda в степени m делить на m факториал умножить на e в степени минус lambda. Lecture_4, Poisson formula.", "usage": {"code": false, "without": "Студент считает, что при росте n биномиальная модель просто становится точнее сама по себе, и не видит связи с Пуассоном.", "with": "Зная предельный переход, студент сразу связывает большое n и малое p с формулой Пуассона.", "benefit": "Даёт понимание, откуда вообще берётся Пуассоновское приближение, а не только формулу наизусть."}}, {"q": "Партия содержит 1000 деталей, вероятность брака каждой детали равна 0.003 независимо от остальных. Нужно быстро оценить вероятность того, что в партии окажется ровно 4 бракованные детали. Какое приближённое распределение здесь уместно использовать вместо точной биномиальной формулы?", "options": ["Приближение Пуассона с лямбда, равным произведению n и p, поскольку n велико, а p мало", "Точная биномиальная формула с полным биномиальным коэффициентом для n, равного тысяче деталей", "Нормальное приближение с математическим ожиданием np и дисперсией npq для больших выборок", "Геометрическое распределение для номера первой обнаруженной бракованной детали в партии"], "correct": 0, "explain": "Условия n большое (1000) и p малое (0.003) образуют закон редких событий, поэтому среди приближённых моделей уместна модель Пуассона с лямбда равным np, то есть 3. Точная биномиальная формула даёт верный результат, но не является приближением и требует громоздких вычислений с биномиальным коэффициентом для n равного тысяче — она просто не отвечает на вопрос о приближённом распределении. Нормальное приближение здесь непригодно: npq примерно равно 3, что слишком мало для точной нормальной аппроксимации. Геометрическое распределение описывает другую величину — номер первого бракованного изделия, а не число бракованных изделий в партии (lecture_4, стр. 6, 23).", "usage": {"code": false, "without": "Без знания условий применимости Пуассона студент либо считает громоздкий биномиальный коэффициент для n равного тысяче, либо ошибочно берёт нормальное приближение.", "with": "Зная закон редких событий, студент сразу берёт лямбда равным np и быстро находит вероятность по табличной формуле Пуассона.", "benefit": "Экономит время и снижает риск вычислительной ошибки в задачах контроля качества."}}, {"q": "На заводе за смену проверяют 500 изделий, вероятность брака каждого равна 0.004 независимо друг от друга. Технолог сравнивает точную дисперсию брака D, равную npq, с приближённой дисперсией по модели Пуассона, равной лямбда. Почему эти два значения почти совпадают?", "options": ["Потому что среднее и дисперсия любой случайной величины совпадают по определению", "Потому что дисперсия дискретной величины по определению не зависит от закона распределения", "Потому что при больших n дисперсия биномиального распределения стремится к нулю", "Потому что при малом p величина q близка к единице, и npq становится почти равным np"], "correct": 3, "explain": "У биномиального распределения D равно npq. Когда p мало, q равно 1 минус p близко к единице, поэтому npq примерно равно np, то есть лямбда из модели Пуассона, для которой M равно D равно лямбда. Остальные варианты — неверные общие утверждения о дисперсии (lecture_4, стр. 6, 23).", "usage": {"code": false, "without": "Не понимая, откуда берётся совпадение, технолог решает, что дисперсия брака посчитана неверно, и тратит время на пересчёт.", "with": "Понимая связь npq и np при малом p, технолог сразу принимает приближение Пуассона как надёжную оценку разброса брака.", "benefit": "Позволяет доверять быстрой оценке риска без пересчёта точной формулы."}}, {"q": "В колл-центр в среднем поступает 6 звонков за 10 минут, поток звонков считается простейшим. Какое распределение описывает число звонков за произвольный десятиминутный интервал?", "options": ["Биномиальное распределение с числом испытаний, равным 6, и вероятностью успеха 0.5 за интервал", "Распределение Пуассона с параметром лямбда, равным среднему числу звонков за интервал, то есть 6", "Геометрическое распределение с параметром p, равным одной шестой на каждый звонок", "Нормальное распределение со средним 6 и дисперсией, равной квадратному корню из 6"], "correct": 1, "explain": "Простейший поток событий описывается распределением Пуассона, где параметр лямбда равен среднему числу событий за интервал, то есть 6. Биномиальное распределение требует фиксированного числа испытаний, геометрическое описывает номер первого успеха, а нормальное не является дискретной моделью счёта событий (lecture_4, стр. 23-24).", "usage": {"code": false, "without": "Оператор колл-центра без модели потока не может оценить вероятность перегрузки линии в конкретный интервал.", "with": "Применяя распределение Пуассона с лямбда равным 6, оператор быстро считает вероятность любого числа звонков за 10 минут.", "benefit": "Даёт обоснованный расчёт нагрузки для планирования смен."}}, {"q": "Оператор посчитал по журналу звонков за месяц выборочное среднее число звонков в час, равное 5.2, и выборочную дисперсию, равную 9.8. Какой вывод верен для применимости модели Пуассона к этому потоку?", "options": ["Модель Пуассона подтверждена, так как дисперсия у распределения Пуассона всегда больше среднего", "Модель Пуассона неприменима, так как параметр лямбда здесь обязан быть целым числом", "Модель Пуассона плохо описывает поток, так как M и D распределения Пуассона обязаны совпадать", "Модель Пуассона подтверждена, так как оба числа больше нуля и близки по порядку величины"], "correct": 2, "explain": "У распределения Пуассона M равно D равно лямбда. Выборочные оценки 5.2 и 9.8 заметно расходятся, что говорит о несоответствии модели, а не о её подтверждении. Лямбда не обязана быть целым числом, поэтому последний вариант тоже неверен (lecture_4, стр. 23).", "usage": {"code": false, "without": "Не проверив равенство среднего и дисперсии, аналитик применяет формулу Пуассона к потоку другой природы и ошибается в прогнозе нагрузки.", "with": "Сравнив выборочные M и D, аналитик вовремя замечает несоответствие и подбирает более подходящую модель потока.", "benefit": "Предотвращает системную ошибку прогноза числа звонков."}}, {"q": "Известно, что в среднем на странице книги встречается 3 опечатки, и их количество моделируют распределением Пуассона. Какая величина равна и математическому ожиданию, и дисперсии числа опечаток на странице?", "options": ["Параметр лямбда распределения, равный среднему числу опечаток на странице", "Квадратный корень из лямбда, равный стандартному отклонению числа опечаток", "Число сочетаний из трёх опечаток по одной на случайной странице", "Вероятность отсутствия опечаток на странице, равная e в минус лямбда"], "correct": 0, "explain": "Ключевое свойство распределения Пуассона — M равно D равно лямбда, здесь лямбда равно 3. Стандартное отклонение — это корень из лямбда, а не сама дисперсия; вероятность нуля опечаток и число сочетаний — другие, не связанные с M и D величины (lecture_4, стр. 23).", "usage": {"code": false, "without": "Редактор без этого свойства отдельно оценивает среднее и разброс числа опечаток по сложным формулам.", "with": "Зная, что M равно D равно лямбда, редактор сразу получает обе характеристики из одного параметра 3.", "benefit": "Упрощает статистический контроль качества вёрстки текста."}}, {"q": "Страховая компания продаёт 1000 полисов, вероятность страхового случая по каждому полису равна 0.002 независимо от остальных, число случаев моделируют распределением Пуассона. Чему равно ожидаемое число страховых случаев за год?", "options": ["Значению q, равному 0.998 благополучных полисов без случая", "Квадратному корню из 1000, приближённому числу случаев за год", "Значению вероятности p, равному 0.002 случая на каждый полис", "Значению лямбда, равному произведению 1000 и 0.002"], "correct": 3, "explain": "Параметр лямбда модели Пуассона равен np, то есть 1000 умножить на 0.002 равно 2. Значения p и q — это вероятности на один полис, а не ожидаемое число случаев по всему портфелю, а корень из n не имеет отношения к M (lecture_4, стр. 6, 23).", "usage": {"code": false, "without": "Актуарий без формулы лямбда равно np закладывает в тариф либо саму вероятность p, либо произвольное число случаев.", "with": "Посчитав лямбда равным 2, актуарий закладывает в тариф реалистичное ожидаемое число выплат за год.", "benefit": "Даёт обоснованную базу для расчёта страховой премии."}}, {"q": "Актуарий сравнивает два портфеля полисов с одинаковым ожидаемым числом страховых случаев M, но портфель А имеет дисперсию D меньше, чем портфель Б. Какой портфель несёт меньший риск разброса выплат при одинаковом среднем?", "options": ["Оба портфеля одинаково рискованны, поскольку их математические ожидания одинаковы", "Портфель А, поскольку меньшая дисперсия означает меньший разброс случаев около среднего", "Портфель Б, поскольку его среднеквадратичное отклонение точнее описывает среднее", "Портфель Б, поскольку большая дисперсия увеличивает точность прогноза выплат"], "correct": 1, "explain": "Дисперсия измеряет разброс случайной величины вокруг математического ожидания, поэтому при равном M меньшая D означает более предсказуемое число случаев, то есть меньший риск. Большая дисперсия не повышает точность прогноза, а снижает её (стандартное свойство M и D, lecture_4).", "usage": {"code": false, "without": "Без сравнения дисперсий актуарий ориентируется только на среднее и недооценивает риск портфеля с большим разбросом выплат.", "with": "Сравнив D двух портфелей при равном M, актуарий выбирает портфель А как более предсказуемый по риску.", "benefit": "Позволяет обоснованно выбирать менее рискованный портфель при одинаковой ожидаемой доходности."}}, {"q": "В лотерее разыгрывается 1 приз в 10000 рублей, 2 приза по 5000 рублей и 4 приза по 500 рублей, всего продано 1000 билетов. Какая цена билета делает игру справедливой, то есть равной ожидаемому выигрышу на билет?", "options": ["7 рублей, равные среднему числу выигрышных билетов", "1000 рублей, равные общему числу проданных билетов", "22 рубля, равные ожиданию выигрыша на один билет", "10000 рублей, равные наибольшему призу в розыгрыше"], "correct": 2, "explain": "Справедливая цена равна M(X), где X — выигрыш на билет: 1 умножить на 10000 плюс 2 умножить на 5000 плюс 4 умножить на 500, всё разделить на 1000, равно 22000 разделить на 1000, равно 22 рубля. Остальные числа — это отдельные данные задачи, а не результат вычисления M(X) (seminar_7_list_of_problems.txt, задача 1).", "usage": {"code": false, "without": "Организатор без расчёта M(X) назначает цену билета наугад и рискует либо оттолкнуть игроков, либо уйти в убыток.", "with": "Посчитав M(X) равным 22 рублям, организатор устанавливает цену, при которой игра в среднем не приносит убытка ни одной стороне.", "benefit": "Даёт объективный ориентир цены участия в лотерее или игре."}}, {"q": "В игре бросают две игральные кости. Если 6 очков выпадает на обеих костях, игрок получает 100 долларов, если 6 очков выпадает ровно на одной кости, игрок получает 10 долларов, иначе не получает ничего. Какую минимальную цену участия стоит назначить, чтобы организатор в среднем не работал в убыток?", "options": ["Цену не ниже 5.6 доллара, равную математическому ожиданию выигрыша", "Цену ровно 10 долларов, равную выигрышу при одной шестёрке", "Цену около 2.8 доллара, учтя лишь вероятность выпадения двух шестёрок", "Цену 100 долларов, равную максимально возможному выигрышу игрока"], "correct": 0, "explain": "M(X) равно 100 умножить на вероятность обеих шестёрок, равную 1 из 36, плюс 10 умножить на вероятность ровно одной шестёрки, равную 10 из 36, итого примерно 5.6 доллара. Вариант с 2.8 доллара учитывает только первое слагаемое, остальные варианты берут отдельные числа условия без расчёта M(X) (seminar_7_list_of_problems.txt, задача 5).", "usage": {"code": false, "without": "Организатор без расчёта M(X) назначает цену произвольно и рискует систематически платить игрокам больше, чем получает.", "with": "Посчитав полное математическое ожидание выигрыша, организатор назначает цену не ниже 5.6 доллара и не уходит в убыток в среднем.", "benefit": "Гарантирует безубыточность игры при массовом числе партий."}}, {"q": "Инвестор выбирает между двумя стратегиями вложений. У стратегии А математическое ожидание дохода M равно 8, а дисперсия D равна 4. У стратегии Б M тоже равно 8, а D равна 25. Какая стратегия менее рискованна при одинаковой ожидаемой доходности?", "options": ["Стратегия Б, поскольку больший корень из дисперсии повышает стабильность дохода", "Стратегия Б, поскольку большая дисперсия обычно связана с более высоким средним доходом", "Обе стратегии одинаково рискованны, поскольку их математические ожидания совпадают", "Стратегия А, поскольку меньшая дисперсия означает меньший разброс дохода вокруг среднего"], "correct": 3, "explain": "При равном M сравнение стратегий по риску идёт через D: меньшая дисперсия у стратегии А означает, что фактический доход реже сильно отклоняется от среднего значения 8. Утверждения про связь большой дисперсии со стабильностью или с более высоким доходом логически неверны (стандартное свойство M и D, lecture_4).", "usage": {"code": false, "without": "Инвестор без сравнения D ориентируется только на равное M и не видит разницы в риске двух стратегий.", "with": "Сравнив D двух стратегий с одинаковым M, инвестор выбирает менее рискованный вариант А.", "benefit": "Позволяет принимать решения с учётом риска, а не только ожидаемой доходности."}}, {"q": "Дискретная случайная величина X задана законом распределения: значения 1, 2, 3 с вероятностями 0.2, 0.5, 0.3 соответственно. Найдите математическое ожидание M(X).", "options": ["1.9000", "1.2000", "2.1000", "2.0000"], "correct": 2, "explain": "Шаг 1: проверяем сумму вероятностей — 0.2+0.5+0.3=1. Шаг 2: M(X)=Σx_i p_i=1*0.2+2*0.5+3*0.3. Шаг 3: складываем — M(X)=0.2+1.0+0.9=2.1000. Дистрактор 1.9000 получается при перепутанном соответствии значений и вероятностей (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Аналитик усредняет значения величины без учёта вероятностей и получает смещённую оценку среднего результата.", "with": "Аналитик взвешивает каждое значение его вероятностью и находит корректное математическое ожидание M(X)=2.1.", "benefit": "Точный прогноз среднего результата вместо смещённой оценки."}}, {"q": "Дискретная случайная величина X задана таблицей: значения -1, 0, 1, 2 с вероятностями 0.1, 0.3, 0.4, 0.2 соответственно. Найдите стандартное отклонение σ(X).", "options": ["0.9000", "0.7746", "1.1402", "0.5477"], "correct": 0, "explain": "Шаг 1: M(X)=-1*0.1+0*0.3+1*0.4+2*0.2=0.7. Шаг 2: M(X^2)=1*0.1+0*0.3+1*0.4+4*0.2=1.3. Шаг 3: D(X)=1.3-0.7^2=0.81, σ(X)=sqrt(0.81)=0.9000. Дистрактор 0.7746 получается, если в дисперсии забыть возвести M(X) в ква дите вероятность того, что взойдёт ровно одно семя.", "options": ["0.0102", "0.0504", "0.3025", "0.2521"], "correct": 2, "explain": "Шаг 1: применяем формулу Бернулли для n=6, k=1, p=0.3, q=0.7. Шаг 2: C(6,1)=6, p^1=0.3, q^5=0.16807. Шаг 3: перемножаем — P(1)=6*0.3*0.16807=0.3025. Дистрактор 0.0102 получается при перепутанных p и q (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Аналитик считает вероятность одного успеха как простую долю без учёта числа испытаний.", "with": "Аналитик применяет формулу Бернулли для n=6 и находит точную вероятность одного успеха.", "benefit": "Корректный учёт числа испытаний в расчёте вероятности."}}, {"q": "Монету подбрасывают 4 раза, вероятность выпадения орла в одном броске равна 0.5. Найдите вероятность того, что орёл выпадет не менее 3 раз.", "options": ["0.3125", "0.2500", "0.0625", "0.6875"], "correct": 0, "explain": "Шаг 1: P(X≥3)=P(3)+P(4) для n=4, p=0.5. Шаг 2: P(3)=C(4,3)*0.5^3*0.5=0.2500, P(4)=C(4,4)*0.5^4=0.0625. Шаг 3: складываем — P(X≥3)=0.3125. Дистрактор 0.2500 получается, если забыть добавить P(4) (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Аналитик суммирует вероятности вручную по отдельности и рискует пропустить один из случаев.", "with": "Аналитик системно складывает P(3) и P(4) по формуле Бернулли и получает точную вероятность не менее 3 успехов.", "benefit": "Полный и проверяемый расчёт совокупной вероятности."}}, {"q": "На складе проверяют партию из 200 деталей, вероятность брака для каждой детали равна 0.05 независимо от других. Найдите дисперсию D числа бракованных деталей в партии.", "options": ["10.0000", "0.5000", "3.0822", "9.5000"], "correct": 3, "explain": "Шаг 1: параметры биномиального распределения n=200, p=0.05, q=0.95. Шаг 2: применяем формулу D=npq. Шаг 3: вычисляем — D=200*0.05*0.95=9.5000. Дистрактор 10.0000 получается, если перепутать D с M=np (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Контролёр качества путает дисперсию числа брака со средним числом брака.", "with": "Контролёр применяет формулу D=npq и получает корректную меру разброса числа бракованных деталей.", "benefit": "Правильная оценка изменчивости брака для контроля качества."}}, {"q": "Вероятность прорастания семени равна 0.35. Высеяно 10 семян независимо друг от друга. Найдите наивероятнейшее число k0 проросших семян.", "options": ["4", "3", "2", "5"], "correct": 1, "explain": "Шаг 1: находим np=10*0.35=3.5, q=0.65, p=0.35. Шаг 2: применяем формулу np-q ≤ k0 ≤ np+p: 3.5-0.65=2.85, 3.5+0.35=3.85. Шаг 3: единственное целое в интервале — k0=3. Дистрактор 4 получается при обычном округлении np вместо применения формулы (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Агроном оценивает наиболее вероятное число всходов округлением среднего значения.", "with": "Агроном применяет формулу np-q ≤ k0 ≤ np+p и находит точное наивероятнейшее число всходов.", "benefit": "Точный прогноз самого вероятного исхода вместо приближения."}}, {"q": "Вероятность брака отдельной микросхемы равна 0.003, партия содержит 1000 микросхем. Считая число бракованных микросхем распределённым по закону Пуассона с λ=np, найдите вероятность того, что в партии не будет ни одной бракованной микросхемы.", "options": ["0.9970", "0.9502", "0.0498", "0.1494"], "correct": 2, "explain": "Шаг 1: находим λ=np=1000*0.003=3. Шаг 2: применяем формулу Пуассона P(k)=λ^k e^(-λ)/k! для k=0: P(0)=e^(-3). Шаг 3: вычисляем — P(0)=0.0498. Дистрактор 0.9970 получается, если по ошибке взять λ=p вместо λ=np (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Инженер оценивает риск нулевого брака в партии на глаз, без формулы Пуассона.", "with": "Инженер находит λ=np и по формуле Пуассона считает точную вероятность нулевого брака.", "benefit": "Обоснованная оценка вероятности редкого события в большой партии."}}, {"q": "Вероятность опечатки на одной странице книги равна 0.01, книга содержит 200 страниц. Считая число опечаток распределённым по закону Пуассона с λ=np, найдите вероятность того, что в книге найдётся хотя бы одна опечатка.", "options": ["0.8647", "0.1353", "0.0100", "0.2642"], "correct": 0, "explain": "Шаг 1: находим λ=np=200*0.01=2. Шаг 2: P(X≥1)=1-P(0)=1-e^(-λ). Шаг 3: вычисляем — P(X≥1)=1-0.1353=0.8647. Дистрактор 0.1353 получается, если вместо P(X≥1) найти саму P(0) (lecture_4_bernoul_poisson_discr_distr_tsi.txt).", "usage": {"code": false, "without": "Редактор оценивает риск хотя бы одной опечатки интуитивно, не считая λ.", "with": "Редактор находит λ=np и вычисляет P(X≥1)=1-e^(-λ) для точной оценки риска.", "benefit": "Точная вероятность хотя бы одного редкого события вместо догадки."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
