<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Английский для работы: фразы и сокращения</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>Английский для работы: фразы и сокращения</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncMergeBtn">🔄 Синхронизировать (свежее побеждает)</button>
    <button class="btn secondary" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../progress.js"></script>
<script src="../sync.js"></script>
<script>
(function () {
  const TEST_ID = "english_work";
  const QUESTIONS = [{"q": "Коллега пишет: «Need the build logs ASAP». Что значит ASAP?", "options": ["As soon as possible — как можно скорее", "As simple as possible — как можно проще", "After sign-off and approval — после согласования", "At standup after planning — на ближайшем стендапе"], "correct": 0, "explain": "ASAP = as soon as possible. В переписке звучит настойчиво: если срочность не настоящая, лучше назвать срок словами — by Thursday, by 3 p.m.", "usage": {"code": false, "without": "Ты читаешь ASAP как «когда будет время», откладываешь логи на завтра, а коллега весь день ждёт их, чтобы закрыть баг до релиза.", "with": "Ты понимаешь: ждут сейчас. Отвечаешь «On it, will send within an hour» и присылаешь логи до обеда.", "benefit": "Срочность считывается правильно, никто не ждёт впустую"}}, {"q": "Тимлид пишет: «Please send the report by EOD». К какому моменту нужен отчёт?", "options": ["К концу рабочей недели, то есть к вечеру пятницы", "К началу следующего рабочего дня, до утреннего созвона", "К ближайшей встрече, на которой его будут обсуждать", "К концу рабочего дня — обычно по времени того, кто просит"], "correct": 3, "explain": "EOD = end of day, конец рабочего дня. Если вы в разных часовых поясах, по умолчанию имеется в виду день отправителя; при сомнении уточни: «EOD your time or mine?».", "usage": {"code": false, "without": "Ты решаешь, что EOD — это до полуночи, и шлёшь отчёт в 23:40. Тимлид ушёл в 18:00 и отправил сводку руководству без твоих цифр.", "with": "Ты сдаёшь отчёт к 17:00 его времени, а когда пояса разные, заранее спрашиваешь, чей это вечер.", "benefit": "Срок понят одинаково обеими сторонами"}}, {"q": "В задаче написано: «ETA for the fix?». О чём спрашивают?", "options": ["Насколько точно описан баг: хватает ли данных для исправления", "Когда ожидается готовность: к какому сроку будет исправление", "Кто отвечает за исправление и кому передать задачу дальше", "Сколько часов уже потрачено на исправление на текущий момент"], "correct": 1, "explain": "ETA = estimated time of arrival, буквально «ожидаемое время прибытия». В работе это ожидаемый срок готовности. Отвечают датой или интервалом: «ETA Wednesday», «ETA 2–3 days».", "usage": {"code": false, "without": "Ты отвечаешь на «ETA?» рассказом о том, что уже сделано. Менеджер переспрашивает дважды, а срок так и не прозвучал.", "with": "Ты отвечаешь одной строкой: «ETA Wednesday EOD, assuming the vendor logs arrive tomorrow».", "benefit": "Вопрос про срок закрывается одной фразой"}}, {"q": "Письмо начинается с «FYI: the lab will be closed on Friday». Что от тебя ждут?", "options": ["Подтвердить получение письма ответом до конца пятницы", "Ничего делать не нужно — это информация к сведению", "Срочно перенести все свои тесты на другую лабораторию", "Переслать письмо всем, кто работает с этой лабораторией"], "correct": 1, "explain": "FYI = for your information, «для сведения». Это сигнал, что действия не требуется. Если действие нужно, пишут прямо: «Action required», «Please confirm».", "usage": {"code": false, "without": "На каждое FYI ты отвечаешь «Thanks, noted», и у тимлида в почте тридцать писем, которые ничего не меняют.", "with": "Ты читаешь FYI, учитываешь в планах и не отвечаешь, пока не появится вопрос.", "benefit": "Меньше лишней переписки и шума в чужой почте"}}, {"q": "В плане релиза стоит «Release date: TBD». Что это значит?", "options": ["Дата ещё не определена и будет решена позже", "Дата определена, но держится в секрете от команды", "Дата перенесена и будет объявлена на следующей неделе", "Дата совпадает с датой предыдущего релиза продукта"], "correct": 0, "explain": "TBD = to be determined (или to be decided): решение ещё не принято. Близкое TBA = to be announced: решение есть, но его пока не объявили.", "usage": {"code": false, "without": "Ты видишь TBD и сам ставишь в календарь дату «примерно через месяц», а потом планы команды расходятся с твоими.", "with": "Ты понимаешь, что даты нет, и спрашиваешь: «Who decides the date, and when?».", "benefit": "Ты не планируешь вокруг даты, которой не существует"}}, {"q": "Автоответ: «I'm OOO until Monday». Что это значит?", "options": ["Человек вне офиса и не работает до понедельника", "Человек работает из дома и отвечает с задержкой", "Человек занят на встречах и освободится к понедельнику", "Человек сменил проект и до понедельника передаёт дела"], "correct": 0, "explain": "OOO = out of office: отпуск, больничный, выходной. Ждать ответа до указанной даты не стоит; в хорошем автоответе написано, к кому идти со срочным.", "usage": {"code": false, "without": "Ты три раза пингуешь человека в OOO и злишься, что он молчит, а срочный вопрос висит до понедельника.", "with": "Ты видишь OOO, открываешь автоответ и идёшь к тому, кто его замещает.", "benefit": "Срочное не ждёт отпуска одного человека"}}, {"q": "PR называется «WIP: add MLO stats to dmcli». Что ты понимаешь по префиксу?", "options": ["PR срочный и должен попасть в текущий релиз", "PR уже одобрен и ждёт только слияния в main", "Работа ещё идёт: PR пока не готов к финальному ревью", "PR экспериментальный и после проверки будет удалён"], "correct": 2, "explain": "WIP = work in progress. Такой PR открывают, чтобы показать направление и собрать ранние замечания; вливать его нельзя. Когда работа готова, префикс снимают.", "usage": {"code": false, "without": "Ты подробно ревьюишь WIP-PR, а через час автор переписывает половину, и твои замечания уже не про тот код.", "with": "Ты смотришь только общий подход, оставляешь пару замечаний про архитектуру, а построчное ревью делаешь, когда снимут WIP.", "benefit": "Время на ревью тратится на код, который останется"}}, {"q": "Ревьюер оставил под твоим PR комментарий «LGTM». Что это значит?", "options": ["Looks good to me — по его мнению, изменение можно вливать", "Let’s get the meeting — он хочет обсудить PR на созвоне", "Logs got too messy — в PR слишком много отладочного вывода", "Looks good to merge later — вливать только после релиза"], "correct": 0, "explain": "LGTM = looks good to me. Это одобрение. Бывает условным: «LGTM with one nit» — одобрено, мелочь можно поправить по желанию.", "usage": {"code": false, "without": "Ты получаешь LGTM, но не вливаешь PR и ждёшь «официального» одобрения, а ревьюер давно считает задачу закрытой.", "with": "Ты видишь LGTM, проверяешь, что CI зелёный и нет блокирующих замечаний, и вливаешь.", "benefit": "Одобрение не теряется между людьми"}}, {"q": "Ты поправил код после ревью и хочешь, чтобы ревьюер посмотрел снова. Что написать?", "options": ["PTAL — please take a look", "TL;DR — too long; didn’t read", "IIRC — if I recall correctly", "NVM — never mind, already fixed"], "correct": 0, "explain": "PTAL = please take a look, а после правок — please take another look. Это стандартная просьба посмотреть PR или изменения в нём.", "usage": {"code": false, "without": "Ты молча пушишь правки и ждёшь, а ревьюер не знает, что пора смотреть снова, и PR висит два дня.", "with": "Ты пушишь правки и пишешь: «Addressed all comments, PTAL». Ревьюер видит уведомление и возвращается.", "benefit": "Ревью не застревает на ожидании"}}, {"q": "В чате: «AFAIK the vendor hasn’t released the new BSP yet». Насколько уверен автор?", "options": ["Полностью: он лично проверил это у поставщика сегодня утром по почте", "Никак: он передаёт чужой слух и сам в него не верит", "Уверен на будущее: поставщик BSP вообще не выпустит", "Не до конца: это его текущее знание, он может не знать свежего"], "correct": 3, "explain": "AFAIK = as far as I know, «насколько я знаю». Это оговорка: информация может быть неполной. Похожая оговорка — IIRC, «если я правильно помню».", "usage": {"code": false, "without": "Ты принимаешь AFAIK за проверенный факт и планируешь неделю без нового BSP, а он вышел вчера.", "with": "Ты слышишь оговорку и уточняешь у поставщика, прежде чем строить на этом план.", "benefit": "Оговорка не превращается в факт по дороге"}}, {"q": "«IIRC, we fixed the same crash in the 2.4 branch». Что добавляет IIRC?", "options": ["Оговорку «если я правильно помню»: стоит проверить по истории", "Ссылку на тикет в трекере, где это исправление описано подробно", "Требование срочно перенести исправление в ветку 2.4", "Утверждение, что исправление проверено на всех DUT"], "correct": 0, "explain": "IIRC = if I recall correctly. Автор говорит по памяти. Правильная реакция — проверить: git log, тикет, changelog.", "usage": {"code": false, "without": "Ты слепо ищешь исправление в 2.4, его там нет, и полдня уходит на поиски.", "with": "Ты отвечаешь: «Thanks! Let me check git log on 2.4 to confirm» — и находишь, что фикс был в 2.5.", "benefit": "Память коллеги — подсказка, а не источник"}}, {"q": "Где сокращение употреблено правильно?", "options": ["Use a stable branch, i.e. 2.4 or 2.5 or any other you like.", "Bring some tools, e.g. the only multimeter we have in the lab.", "Pick one board, i.e. for example the second or the third one.", "Use a stable branch, i.e. the one tagged by the release team."], "correct": 3, "explain": "i.e. (id est) = «то есть»: уточняет, что ИМЕННО имеется в виду, одно значение. e.g. (exempli gratia) = «например»: приводит примеры из многих. Во втором варианте после i.e. стоят примеры, в третьем после e.g. — единственный предмет, в четвёртом i.e. и for example сказаны дважды.", "usage": {"code": false, "without": "Ты пишешь «test on a board, i.e. board 2 or 3». Коллега не понимает, какую доску брать и можно ли другую.", "with": "Ты пишешь «test on a spare board, e.g. board 2 or 3», и ясно, что подойдёт любая свободная.", "benefit": "Ни один пример не читается как требование"}}, {"q": "Письмо начинается с «TL;DR: the regression comes from the new driver». Что это за часть?", "options": ["Короткий итог всего письма, а подробности ниже", "Извинение за то, что письмо получилось очень длинным", "Просьба не читать письмо, пока не придут новые логи", "Список людей, которым письмо отправлено для сведения"], "correct": 0, "explain": "TL;DR = too long; didn’t read. В рабочем письме это вынесенный наверх итог в одну-две строки. Так читатель за пять секунд понимает суть и решает, читать ли дальше.", "usage": {"code": false, "without": "Ты пишешь три абзаца о расследовании, а вывод стоит в последней строке, и менеджер его не дочитывает.", "with": "Первой строкой ты пишешь «TL;DR: the regression comes from the new driver; revert is ready», а дальше подробности.", "benefit": "Главное прочитают даже те, кто читает по диагонали"}}, {"q": "В рассылке патчей один ревьюер ответил «ACK», другой — «NACK». Что это значит?", "options": ["Первый получил письмо, а второй его ещё не получил", "Первый протестировал патч, а второй ещё не начинал", "Первый согласен с патчем, второй возражает против него", "Оба одобрили патч, но второй просит его ускорить"], "correct": 2, "explain": "ACK = acknowledged, в рассылках патчей — «согласен, одобряю» (отсюда тег Acked-by:). NACK = negative acknowledgement, возражение. Патч с NACK не вливают, пока возражение не снято.", "usage": {"code": false, "without": "Ты видишь в треде ACK и считаешь патч одобренным, не заметив NACK ниже. Мейнтейнер его не берёт, а ты не понимаешь почему.", "with": "Ты читаешь тред целиком, отвечаешь на NACK по существу и выпускаешь v2 патча.", "benefit": "Ты видишь, что именно мешает вливанию"}}, {"q": "В баг-репорте: «Reproduced on the DUT after flashing the new FW». Что такое DUT?", "options": ["Driver update tool — утилита, которой ставят драйвер", "Debug UART terminal — консоль отладки через UART", "Device under test — устройство, на котором идёт проверка", "Daily unit test — ежедневный прогон модульных тестов"], "correct": 2, "explain": "DUT = device under test, испытуемое устройство: роутер, плата, модуль. FW = firmware, прошивка. Вместе: «воспроизвёл на испытуемом устройстве после прошивки новой версии».", "usage": {"code": false, "without": "Ты читаешь DUT как имя утилиты и ищешь её в репозитории вместо того, чтобы взять плату со стенда.", "with": "Ты понимаешь, что баг на устройстве, и спрашиваешь: «Which DUT — the one in rack 2?».", "benefit": "Ты сразу ищешь в нужном месте"}}, {"q": "«RC2 is out, please test it on your setup». Что вышло?", "options": ["Вторая ревизия схемы, по которой спаяна новая плата", "Вторая ветка кода, куда больше не принимают никаких изменений", "Второй отчёт о покрытии кода по итогам прогона тестов", "Второй кандидат в релиз: сборка, которая может стать релизом"], "correct": 3, "explain": "RC = release candidate. Если в RC не найдут блокирующих багов, она и станет релизом. Поэтому тестировать её нужно на реальных сценариях: найденный сейчас баг стоит дешевле, чем после релиза.", "usage": {"code": false, "without": "Ты откладываешь RC2 «на потом», в релиз уходит сборка с багом на твоём сценарии, и чинят его уже горячим исправлением.", "with": "Ты гоняешь RC2 на своём стенде в тот же день и сообщаешь: «RC2 passes my Wi-Fi 7 scenarios except one, ticket filed».", "benefit": "Баг находится до релиза, а не после"}}, {"q": "Менеджер просит: «Please send the RCA by Friday». Что от тебя ждут?", "options": ["Короткий список шагов, чтобы воспроизвести этот баг ещё раз на стенде", "Отчёт о часах, потраченных на исправление этого бага", "Разбор корневой причины: что сломалось, почему и как не повторить", "Согласие клиента с тем, что исправление его устроило"], "correct": 2, "explain": "RCA = root cause analysis. Отвечает на три вопроса: что произошло, в чём настоящая причина (а не симптом), что сделаем, чтобы не повторилось.", "usage": {"code": false, "without": "Ты присылаешь «fixed in commit abc123», а менеджер спрашивает снова, потому что не видит ни причины, ни мер.", "with": "Ты пишешь: «What happened / Root cause / Fix / Prevention» — по абзацу на каждое.", "benefit": "Разбор закрывает вопрос, а не открывает новый"}}, {"q": "Коллега предлагает: «Let’s do a quick PoC before we commit to this approach». Что предлагают?", "options": ["Полную реализацию с тестами и документацией к ближайшему релизу", "Голосование команды о том, какой подход выбрать", "Быстрый прототип, проверяющий, что подход вообще работает", "Предварительное согласование бюджета с заказчиком"], "correct": 2, "explain": "PoC = proof of concept, «доказательство осуществимости»: минимальная проверка рискованной идеи. От MVP (minimum viable product) отличается тем, что PoC никто не будет использовать, его цель — снять риск.", "usage": {"code": false, "without": "Команда два месяца строит решение на непроверенной идее, а потом выясняется, что драйвер её не поддерживает.", "with": "За два дня делается PoC на одном DUT, и становится ясно, стоит ли продолжать.", "benefit": "Риск снимается за дни, а не за месяцы"}}, {"q": "В чате: «Ubuntu 18.04 on the build server is EOL». В чём проблема?", "options": ["Версия устарела по виду, но официальная поддержка продлится ещё три года", "Версия больше не поддерживается: обновлений безопасности не будет", "Сервер сломан, и сборки на нём сейчас не запускаются", "В файлах на сервере стоят неправильные концы строк"], "correct": 1, "explain": "EOL = end of life: производитель прекратил поддержку. В контексте текста EOL может значить end of line (символ конца строки), но про версию ОС или продукт — всегда конец жизни.", "usage": {"code": false, "without": "Сервер сборки годами живёт на EOL-версии без патчей, и однажды его используют как дыру в сеть.", "with": "Ты заводишь задачу: «Build server OS is EOL, plan migration to a supported LTS».", "benefit": "Риск виден заранее и попадает в план"}}, {"q": "Ревьюер пишет: «nit: maybe rename tmp to mld_count». Как к этому отнестись?", "options": ["Это мелочь: поправить желательно, но вливание она не блокирует", "Это главная претензия ревьюера, и без неё PR не одобрят никогда", "Это шутка ревьюера, отвечать на неё вовсе не принято", "Это просьба переписать весь модуль в другом стиле"], "correct": 0, "explain": "nit (от nitpick, «придирка») — необязательное замечание о стиле или имени. Ревьюеры помечают так мелочи, чтобы отделить их от того, что действительно мешает вливанию.", "usage": {"code": false, "without": "Ты споришь из-за каждого nit так же долго, как из-за бага, и ревью тянется неделю.", "with": "Мелочь правишь сразу или отвечаешь «Good point, will do in a follow-up», а силы тратишь на блокирующие замечания.", "benefit": "Ревью идёт быстро, а важное не тонет в мелочах"}}, {"q": "На стендапе ты говоришь: «I’m blocked on access to the lab». Что это сообщает?", "options": ["Ты отказываешься работать в лаборатории и не объясняешь причину", "Ты закрыл доступ в лабораторию для всех остальных", "Ты только что закончил всю работу в лаборатории", "Ты не можешь продолжать, пока не получишь доступ к лаборатории"], "correct": 3, "explain": "To be blocked on X — «не могу двигаться, пока нет X». Это сигнал тимлиду: блокер его работа, а не твоя, и снять его нужно быстро.", "usage": {"code": false, "without": "Ты три дня говоришь на стендапе «still working on it», хотя всё это время ждёшь доступ, и никто не знает, что тебе мешает.", "with": "Ты в первый же день говоришь «I’m blocked on lab access», и тимлид решает это за час.", "benefit": "Блокер снимают в день появления, а не через неделю"}}, {"q": "Обсуждение на общем созвоне затянулось, и кто-то говорит: «Let’s take this offline». Что предлагают?", "options": ["Отключиться от созвона и продолжить без видеосвязи", "Закончить спор прямо сейчас и больше к этому вопросу не возвращаться", "Перенести всю встречу целиком на следующую неделю", "Обсудить это отдельно, вне встречи, с теми, кого это касается"], "correct": 3, "explain": "Take it offline = «вынести из этой встречи». Остальные участники не должны ждать, пока двое договорятся. Обычно сразу назначают, кто и когда это обсудит.", "usage": {"code": false, "without": "Двое двадцать минут спорят о деталях драйвера, а восемь человек молча ждут.", "with": "Ты говоришь: «Let’s take this offline — Anna, can we sync after the call?», и встреча идёт дальше.", "benefit": "Чужое время не уходит на чужой спор"}}, {"q": "Ты не знаешь ответа на вопрос прямо сейчас. Что значит «I’ll circle back on that»?", "options": ["Ты вернёшься к вопросу позже, когда выяснишь ответ", "Ты отказываешься отвечать на вопрос без объяснений", "Ты переадресуешь вопрос другому человеку в команде", "Ты уже ответил на этот вопрос в прошлом созвоне"], "correct": 0, "explain": "Circle back = «вернуться к теме». Звучит профессионально, но это обещание: если сказал, вернись. Сильнее с датой: «I’ll circle back by tomorrow».", "usage": {"code": false, "without": "Ты говоришь «I’ll circle back» и забываешь, а коллега через неделю спрашивает снова — уже раздражённо.", "with": "Ты говоришь «I’ll circle back by Thursday», ставишь себе напоминание и отвечаешь в четверг.", "benefit": "Обещание выполняется, и тебе доверяют"}}, {"q": "Коллега пишет: «Just a heads-up: the lab network will be down tomorrow morning». Что это?", "options": ["Срочная просьба лично починить сеть в лаборатории", "Заблаговременное предупреждение о том, что будет", "Жалоба на то, что сеть в лаборатории работает плохо", "Вопрос, удобно ли тебе, если сеть отключат завтра"], "correct": 1, "explain": "Heads-up = «предупреждаю заранее». Ответа не требует, но стоит учесть в планах. Сам можешь писать так же: «Heads-up: I’ll be late for the standup».", "usage": {"code": false, "without": "Ты пропускаешь heads-up мимо глаз, назначаешь на утро прогон тестов, и он падает из-за сети.", "with": "Ты переносишь прогон на после обеда и отвечаешь «Thanks for the heads-up».", "benefit": "Предупреждение работает, ради него его и писали"}}, {"q": "Тебе непонятно, как устроен чужой скрипт сборки. Какая просьба звучит естественно?", "options": ["Could you walk with me the build script, how it works?", "Could you go me through how works the build script?", "Could you pass me over the build script how it works?", "Could you walk me through how the build script works?"], "correct": 3, "explain": "Walk someone through something = объяснить шаг за шагом. Порядок слов: walk + кто + through + что. В остальных вариантах ошибки в предлогах и порядке слов.", "usage": {"code": false, "without": "Ты стесняешься спросить и полдня читаешь скрипт сам, а потом всё равно делаешь неправильно.", "with": "Ты пишешь: «Could you walk me through the build script? 15 minutes would be enough», и за четверть часа всё ясно.", "benefit": "Чужое знание переходит к тебе за минуты"}}, {"q": "Тимлид предлагает новую задачу, а ты занят. Что значит «I have a lot on my plate right now»?", "options": ["Ты сейчас обедаешь и вернёшься к работе через час", "Ты готов взять задачу, но попросишь за неё доплату", "У тебя уже много задач, и новая вряд ли поместится", "Ты уже сделал эту задачу и ждёшь только проверки"], "correct": 2, "explain": "On one’s plate = «на тарелке», то есть в работе. Мягкий способ сказать, что загрузка полная. Лучше дополнить выбором: «Which should I drop to take this?».", "usage": {"code": false, "without": "Ты молча берёшь пятую задачу, срываешь сроки по всем пяти и выглядишь ненадёжным.", "with": "Ты говоришь: «I have a lot on my plate — if this is a priority, can the driver cleanup wait?».", "benefit": "Приоритеты решаются вслух, а не ценой сорванных сроков"}}, {"q": "«Sorry, I don’t have the bandwidth for code reviews this week». Что значит bandwidth здесь?", "options": ["Скорость сетевого соединения на рабочем месте", "Свободное время и силы, чтобы взять ещё работу", "Разрешение руководства заниматься ревью кода", "Интерес и желание смотреть чужой код вообще"], "correct": 1, "explain": "Bandwidth в разговорной речи — «ёмкость», то есть сколько ещё человек может на себя взять. Это нейтральная формулировка: никто не прочтёт её как лень.", "usage": {"code": false, "without": "Ты говоришь «I don’t want to do reviews», и это звучит как отказ работать в команде.", "with": "Ты говоришь «I don’t have the bandwidth this week — next week I can take two», и это звучит как планирование.", "benefit": "Отказ звучит как планирование, а не как нежелание"}}, {"q": "Менеджер спрашивает: «Can you give me a ballpark figure?». Что ему нужно?", "options": ["Точная цифра, за которую ты лично отвечаешь", "Грубая оценка — порядок величины, без точности", "Цифра, подтверждённая расчётом и тестами", "Цифра из прошлого проекта для сравнения"], "correct": 1, "explain": "Ballpark figure (ballpark estimate) — оценка «на глаз»: 2–3 дня, около недели. Нужна, чтобы прикинуть план, поэтому честно добавить допущение: «ballpark 3 days, assuming…».", "usage": {"code": false, "without": "Ты отказываешься называть срок, пока не изучишь всё, и менеджер планирует без тебя — по худшему сценарию.", "with": "Ты отвечаешь: «Ballpark 2–3 days. I’ll give a firm number tomorrow after looking at the logs».", "benefit": "План строится сразу, а уточнение приходит потом"}}, {"q": "В конце обсуждения ты хочешь убедиться, что все поняли одно и то же. Какая фраза подходит?", "options": ["Just to make sure we’re on the same paper: we ship RC3 on Friday?", "Just to make sure we stand on one page: we ship RC3 on Friday?", "Just to make sure we’re on the same page: we ship RC3 on Friday?", "Just to make sure we’re in the same list: we ship RC3 on Friday?"], "correct": 2, "explain": "Be on the same page = одинаково понимать ситуацию. Устойчивое выражение, менять в нём слова нельзя. Похожие фразы: «Just to clarify…», «So, to sum up…».", "usage": {"code": false, "without": "Каждый ушёл с созвона со своей датой, и в пятницу выясняется, что тестировщики ждали RC3 в понедельник.", "with": "Ты подводишь итог одной фразой с датой и ждёшь «yes» от каждого.", "benefit": "Договорённость одна на всех, а не своя у каждого"}}, {"q": "Коллега пишет: «Ping me when the build is ready». Что ты должен сделать?", "options": ["Коротко написать ему, когда сборка будет готова", "Проверить сетевую доступность его компьютера", "Позвонить ему, как только начнётся сборка", "Поставить ему встречу на время окончания сборки"], "correct": 0, "explain": "Ping someone = коротко написать или упомянуть в чате. Слово пришло из сетей (ping как проверка связи), но в работе значит «дай знать сообщением».", "usage": {"code": false, "without": "Ты ждёшь, что он сам увидит готовую сборку, а он ждёт твоего сообщения, и час уходит впустую.", "with": "Сборка готова — ты пишешь: «@Ivan build is ready: <link>».", "benefit": "Никто не ждёт сигнала, который не придёт"}}, {"q": "На созвоне связь прервалась, и ты не расслышал вопрос. Как переспросить вежливо?", "options": ["Sorry, what? I didn’t understand anything you just said there.", "Sorry, can you speak normally? Your English is hard to follow.", "Sorry, you cut out for a moment — could you repeat the last part?", "Sorry, I was not listening — can you send it all by email?"], "correct": 2, "explain": "You cut out = «тебя прервало», виновата связь, а не собеседник. Плюс просьба повторить конкретный кусок. Остальные варианты звучат грубо или признают невнимательность.", "usage": {"code": false, "without": "Ты делаешь вид, что понял, отвечаешь невпопад, и через неделю выясняется, что вопрос был о другом.", "with": "Ты говоришь «you cut out — could you repeat the last part?», слышишь вопрос и отвечаешь по делу.", "benefit": "Переспросить не стыдно, если винить связь, а не человека"}}, {"q": "Просят сделать две задачи к пятнице, а реально успеть одну. Какой ответ лучше?", "options": ["Sure, I will do both of them by Friday, no problem at all, I will just try my best somehow.", "I can finish the driver fix by Friday; the docs need until Tuesday. Which matters more?", "No, this is impossible, you always give me too many things at once.", "I don’t know yet, let’s see on Friday what is done and what is not done."], "correct": 1, "explain": "Хороший отказ — это «да» с условиями: что успею, к какому сроку остальное, и вопрос о приоритете. Ответственность за выбор возвращается тому, кто расставляет приоритеты.", "usage": {"code": false, "without": "Ты обещаешь обе задачи, в пятницу сдаёшь половину каждой, и обе бесполезны.", "with": "Ты называешь, что успеешь, и спрашиваешь о приоритете. Тимлид выбирает драйвер, и в пятницу он готов.", "benefit": "В пятницу готова одна задача, а не две недоделанные"}}, {"q": "Ты застрял и хочешь попросить помощи у старшего коллеги. Какая формулировка лучше?", "options": ["It doesn’t work and I really don’t know why, so can you just fix it all for me today please?", "Sorry to bother you, I am probably stupid, but nothing works for me at all.", "Why is your build system so complicated? Nobody can understand how it works.", "I’ve tried a clean rebuild and a different DUT; could you point me in the right direction?"], "correct": 3, "explain": "Сильная просьба о помощи показывает, что ты уже сделал, и просит направление, а не готовое решение. Point someone in the right direction = подсказать, куда копать.", "usage": {"code": false, "without": "Ты пишешь «it doesn’t work», и коллега тратит полчаса, повторяя то, что ты уже пробовал.", "with": "Ты перечисляешь, что уже проверил. Коллега сразу видит, чего не хватает, и подсказывает за пять минут.", "benefit": "Помощь приходит быстрее, а ты выглядишь самостоятельным"}}, {"q": "В ревью ты видишь, что решение коллеги сломается на big-endian платформах. Как написать замечание?", "options": ["This is just wrong. Did you even test it? Rewrite it all properly before I review it again.", "I would never write code like this, but do whatever you think is the best here.", "Have you considered big-endian targets? This cast may read the bytes in reverse there.", "LGTM, but somebody should probably check big-endian sometime later, not me."], "correct": 2, "explain": "Вопрос «Have you considered…?» указывает на проблему, не обвиняя. Плюс конкретная причина. Второй вариант грубый, третий пассивно-агрессивный, четвёртый одобряет баг.", "usage": {"code": false, "without": "Ты пишешь «This is wrong», автор обижается и защищает код вместо того, чтобы его чинить.", "with": "Ты задаёшь вопрос с причиной, автор отвечает «Good catch!» и правит за десять минут.", "benefit": "Баг исправлен, отношения целы"}}, {"q": "Ты отвечаешь на письмо через три дня. Как правильно начать?", "options": ["Sorry for my late.", "Sorry for the late reply.", "Sorry for the lateness answer.", "Sorry that I am late with answer."], "correct": 1, "explain": "Устойчивые формулы: «Sorry for the late reply», «Sorry for the delay», «Apologies for the late response». Слово late — прилагательное, после него нужно существительное: reply, response.", "usage": {"code": false, "without": "Ты пишешь «Sorry for my late», и первая строка письма звучит неграмотно, хотя дальше всё правильно.", "with": "Ты пишешь «Sorry for the late reply» и сразу переходишь к делу.", "benefit": "Первая строка не отвлекает от сути"}}, {"q": "Во время работы над задачей заказчик просит «ещё одну небольшую функцию». Что ответить?", "options": ["Sure, I will add it now, it is small, it will not change anything for us.", "No. We never do any changes that are not in the original specification.", "Maybe later, I don’t know, we will see if there is some time left over.", "Good idea — let’s log it as a separate ticket so this one can ship on time."], "correct": 3, "explain": "Расползание объёма (scope creep) лечится так: идею не отвергают, но выносят в отдельную задачу. Текущая задача сохраняет срок, новая получает оценку и приоритет.", "usage": {"code": false, "without": "Ты добавляешь «небольшую функцию», за ней вторую, и задача на три дня идёт три недели.", "with": "Ты заводишь отдельный тикет и сдаёшь исходную задачу в срок, а новая идёт в план следующего спринта.", "benefit": "Срок держится, а идея не теряется"}}, {"q": "Какое обновление на стендапе построено правильно?", "options": ["I worked a lot yesterday on many different things, it was busy, and today I will continue it.", "Yesterday I reproduced the crash. Today I’ll bisect the FW. I’m blocked on the RC3 image.", "Everything is fine, nothing special, same as usual, no news from my side today.", "Tomorrow I will maybe start the crash, yesterday I was thinking about some ideas."], "correct": 1, "explain": "Классический формат стендапа: что сделал вчера, что делаю сегодня, что мешает. Конкретные глаголы и предметы. Расплывчатые обновления никому не помогают понять, где работа.", "usage": {"code": false, "without": "Ты говоришь «same as usual», и тимлид только через неделю узнаёт, что ты ждёшь образ RC3.", "with": "Три коротких предложения — и тимлид видит прогресс, план и блокер.", "benefit": "Стендап занимает минуту и приносит пользу"}}, {"q": "Ты хочешь спросить, не устарел ли документ. Где нет ложного друга переводчика?", "options": ["Is this document still actual?", "Is this document still in actuality?", "Is this document still actualised?", "Is this document still up to date?"], "correct": 3, "explain": "Actual по-английски значит «фактический, настоящий» (the actual cause — настоящая причина), а не «актуальный». «Актуальный» — up to date, current, relevant.", "usage": {"code": false, "without": "Ты спрашиваешь «Is it still actual?», и коллега не понимает, о чём ты, или думает, что ты сомневаешься, настоящий ли документ.", "with": "Ты спрашиваешь «Is it still up to date?», и тебе сразу отвечают про свежесть.", "benefit": "Вопрос понимают с первого раза"}}, {"q": "«The vendor will eventually release a fix». Что сказал автор?", "options": ["Поставщик в конце концов выпустит исправление, но не скоро", "Поставщик, возможно, выпустит исправление, а возможно, и нет", "Поставщик выпустит исправление прямо на этой неделе", "Поставщик уже выпустил исправление, но тайком от всех"], "correct": 0, "explain": "Eventually = «в конце концов, со временем», а не «возможно» (это ложный друг от «эвентуально»). Значит: выпустит, но когда — неизвестно, и планировать на ближайшие дни нельзя.", "usage": {"code": false, "without": "Ты слышишь «возможно» и начинаешь писать свой обходной путь, хотя исправление точно будет.", "with": "Ты понимаешь, что исправление будет, но не скоро, и спрашиваешь: «Do we have a date? If not, we need a workaround for RC3».", "benefit": "План строится на правильном смысле слова"}}, {"q": "Ты уходишь в отпуск. Какой автоответ полезнее всего?", "options": ["I’m on vacation, sorry, I will not read anything, please do not write to me.", "I’m OOO. I will answer all of your messages personally when I am back, as soon as I can.", "Hello! I am away. Thank you for your message. Have a nice day and see you.", "I’m OOO until Nov 16. For anything urgent on the Wi-Fi driver, please contact Anna."], "correct": 3, "explain": "Хороший автоответ отвечает на три вопроса: до когда тебя нет, к кому идти со срочным и по какой теме. Остальные варианты оставляют человека без пути вперёд.", "usage": {"code": false, "without": "Твой автоответ пишет только «I’m away», и коллега неделю не знает, кому отдать срочный баг.", "with": "Твой автоответ называет дату и замещающего, и срочное уходит к Анне в тот же день.", "benefit": "Работа не встаёт, пока тебя нет"}}, {"q": "Сообщение в чате: «FYI: RC2 is blocked, RCA TBD, ETA EOW». Что из него следует для тебя?", "options": ["Кандидат RC2 застрял, причина пока не выяснена, ждать к концу недели; делать ничего не надо", "Кандидат RC2 выпущен, разбор причин готов, к концу дня нужно его прочитать и одобрить", "Кандидат RC2 застрял, причину уже знают, и тебя просят исправить её к концу этого дня", "Кандидат RC2 отменён совсем, разбора не будет, и релиз переносят на следующий финансовый квартал"], "correct": 0, "explain": "Шаг 1: FYI — действия от тебя не требуется. Шаг 2: RC2 is blocked — кандидат в релиз застрял; RCA TBD — разбор причины ещё не готов, причина не определена. Шаг 3: ETA EOW — ожидается к концу недели (end of week). Итог: информация к сведению, план на неделю учитывает задержку.", "usage": {"code": false, "without": "Ты видишь шесть сокращений подряд, пугаешься и пишешь в личку автору «what do you need from me?», отвлекая его от расследования.", "with": "Ты раскладываешь строку по словам, понимаешь, что от тебя ничего не ждут, и сдвигаешь свой тест RC2 на следующую неделю.", "benefit": "Шесть сокращений читаются за пять секунд"}}, {"q": "Коллега в Калифорнии (UTC−8) в понедельник пишет: «I’ll send the patch EOD». Ты в Риге (UTC+2). Когда ждать патч по твоему времени?", "options": ["Около 17:00 в понедельник — ещё до конца твоего рабочего дня", "Около 07:00 в понедельник — ещё до начала твоего рабочего дня", "Около 03:00 ночи на вторник — то есть увидишь его утром во вторник", "Около 17:00 во вторник — к концу твоего следующего рабочего дня"], "correct": 2, "explain": "Шаг 1: EOD — конец его рабочего дня, около 17:00 по его времени. Шаг 2: разница поясов: от UTC−8 до UTC+2 — 10 часов. Шаг 3: 17:00 + 10 ч = 03:00 следующего дня по Риге. Ошибки: взять 17:00 без пересчёта (понедельник 17:00) или вычесть разницу вместо сложения (07:00).", "usage": {"code": false, "without": "Ты ждёшь патч до вечера понедельника, не дожидаешься и обещаешь тестировщикам прогон в понедельник, который не случится.", "with": "Ты пересчитываешь пояса, ставишь прогон на утро вторника и пишешь коллеге: «Great, I’ll test it first thing Tuesday my time».", "benefit": "План учитывает, где сейчас ночь"}}, {"q": "Приглашение на созвон в ноябре: «Sync at 10:00 CET». CET в ноябре — UTC+1, Рига — UTC+2. Во сколько подключаться тебе?", "options": ["В 10:00 по рижскому времени", "В 09:00 по рижскому времени", "В 12:00 по рижскому времени", "В 11:00 по рижскому времени"], "correct": 3, "explain": "Шаг 1: CET в ноябре — UTC+1, Рига — UTC+2, Рига на час впереди. Шаг 2: 10:00 CET + 1 ч = 11:00 по Риге. Ошибки: не пересчитать (10:00) или сдвинуть не в ту сторону (09:00).", "usage": {"code": false, "without": "Ты подключаешься в 10:00 по Риге, сидишь час в пустой комнате, а в 11:00 уже занят другой встречей.", "with": "Ты пересчитываешь пояс, ставишь встречу в календарь на 11:00, а лучше принимаешь приглашение в календаре — он пересчитает сам.", "benefit": "Ты приходишь на встречу вовремя"}}, {"q": "Под PR три комментария: «nit: rename tmp», «This cast breaks on big-endian targets», «LGTM otherwise». Что обязательно сделать до вливания?", "options": ["Исправить проблему с big-endian; переименование — по желанию", "Только переименовать tmp: остальное ревьюер уже одобрил", "Ничего: LGTM означает, что PR можно вливать прямо сейчас", "Переписать весь PR заново с учётом всех трёх комментариев"], "correct": 0, "explain": "Шаг 1: nit — необязательная мелочь. Шаг 2: «This cast breaks…» — найден баг, это блокирующее замечание. Шаг 3: «LGTM otherwise» = «одобряю, если не считать сказанного выше». Значит, одобрение условное: без исправления big-endian вливать нельзя.", "usage": {"code": false, "without": "Ты видишь LGTM и вливаешь PR. Через неделю на big-endian платформе заказчика всё падает.", "with": "Ты исправляешь cast, заодно переименовываешь tmp и пишешь «Fixed the endianness issue, PTAL».", "benefit": "Условное одобрение не превращается в безусловное"}}, {"q": "Менеджер спрашивает: «Ballpark for the driver fix?». Ты думаешь, что 2–3 дня, но всё зависит от логов поставщика, которые обещали к среде. Какой ответ лучше?", "options": ["Exactly 2 days. I promise it will be done, whatever happens with the vendor logs.", "I can’t say anything at all until the vendor sends us the logs, sorry about that.", "Ballpark 2–3 days, assuming we get the vendor logs by Wednesday. I’ll confirm then.", "Probably one week or maybe one month, it is really hard to say anything right now."], "correct": 2, "explain": "Шаг 1: ballpark — просят грубую оценку, а не обещание. Шаг 2: оценка честна, только если названо допущение (логи к среде). Шаг 3: обещание уточнить закрывает неопределённость. Точная цифра без оговорки — ловушка, отказ отвечать бесполезен, разброс «неделя или месяц» не оценка.", "usage": {"code": false, "without": "Ты говоришь «exactly 2 days», логи приходят в пятницу, и ты срываешь срок, который сам назвал.", "with": "Ты называешь интервал и допущение, а в среду пишешь: «Logs are in, firm ETA Friday».", "benefit": "Оценка остаётся честной, даже когда мир меняется"}}, {"q": "Тебе нужны логи от инженера поставщика, с которым ты не знаком. Какое письмо сработает лучше?", "options": ["Mark, send the RT-Logger output from the DUT ASAP, we need it for the RCA right now.", "Hi Mark, could you please share the RT-Logger output from the DUT? It would help us with the RCA. Thanks!", "Hi, we have a problem. Logs please. Thanks.", "Dear Sir or Madam, I would be extremely grateful if you could possibly consider kindly sharing some logs with us."], "correct": 1, "explain": "Шаг 1: незнакомому человеку нужны приветствие и вежливая форма: could you please. Шаг 2: просьба должна быть конкретной — какие логи (RT-Logger) и откуда (DUT). Шаг 3: короткое «зачем» (для RCA) повышает шанс ответа. Второй вариант звучит как приказ, третий непонятен, четвёртый тонет в вежливости и не говорит, что нужно.", "usage": {"code": false, "without": "Ты пишешь «Logs please», инженер отвечает «Which logs?», и день уходит на переписку.", "with": "Ты пишешь одно конкретное вежливое письмо и получаешь нужный файл в тот же день.", "benefit": "Один круг переписки вместо трёх"}}, {"q": "Ты сам пишешь письмо. Где сокращения стоят уместно и понятно?", "options": ["FYI pls ACK ASAP re RC3 TBD on DUTs, IIRC WIP, ETA EOD, thx, TL;DR inside.", "FYI, RC3 passed on all DUTs. One minor issue, ticket WIFI-212; no action needed from you.", "For your information (FYI), the RC3 (release candidate 3) passed on DUTs (devices).", "I would like to inform you that the release candidate number three passed the testing."], "correct": 1, "explain": "Шаг 1: сокращения экономят время, только если адресат их знает и их немного. Шаг 2: второй вариант — шифровка из сокращений, где FYI ещё и противоречит просьбе ACK. Шаг 3: третий расшифровывает каждое слово и раздувает текст, четвёртый многословен и без деталей. Первый: одно общепринятое FYI, термины команды и ясное «действий не нужно».", "usage": {"code": false, "without": "Ты пишешь строку из десяти сокращений, и половина адресатов переспрашивает, что от них нужно.", "with": "Ты пишешь коротко, с двумя-тремя общепринятыми сокращениями, и всем всё понятно с первого раза.", "benefit": "Короткое письмо понятно всем адресатам"}}, {"q": "Автоответ коллеги: «I’m OOO till Wed. PTAL at my PR in the meantime; ping @Ivan if it’s urgent». Сегодня понедельник, в PR нашлась срочная проблема. Что делать?", "options": ["Ждать среды: автор вернётся и сам во всём разберётся", "Посмотреть PR и написать о срочной проблеме Ивану, а не автору", "Влить PR как есть: раз автор просил посмотреть, значит, он его одобрил", "Пинговать автора каждый час, пока он не ответит из отпуска"], "correct": 1, "explain": "Шаг 1: OOO till Wed — автора нет до среды. Шаг 2: PTAL — он просит посмотреть PR, пока его нет, а не влить его. Шаг 3: ping @Ivan if it’s urgent — для срочного назначен Иван. Значит: ревью оставляешь в PR, а срочное несёшь Ивану.", "usage": {"code": false, "without": "Ты пингуешь автора в отпуске, он не отвечает, срочная проблема ждёт до среды.", "with": "Ты оставляешь замечания в PR и пишешь Ивану: «Urgent issue in Alex’s PR, details in the comments».", "benefit": "Срочное идёт к тому, кто сейчас может ответить"}}, {"q": "В рассылке на твой патч: «ACK» от Ли и «NACK, this breaks the ABI for existing userspace» от мейнтейнера. Что дальше?", "options": ["Патч примут: одного ACK от Ли хватает, а NACK мейнтейнера здесь ничего не значит", "Патч примут после голосования: ACK и NACK уравновешивают друг друга", "Патч не примут, пока не решишь вопрос с ABI: ответить мейнтейнеру и прислать v2", "Патч уже отклонён навсегда, и к теме больше нельзя возвращаться"], "correct": 2, "explain": "Шаг 1: ACK — поддержка, NACK — возражение. Шаг 2: NACK мейнтейнера весит больше всего: вливает именно он. Шаг 3: возражение конкретное (ломает ABI), его можно снять — сохранить старый интерфейс или обосновать изменение, и прислать исправленную версию патча (v2). Итог: работа продолжается, а не закончена.", "usage": {"code": false, "without": "Ты считаешь голоса, решаешь, что патч прошёл, и неделю ждёшь вливания, которого не будет.", "with": "Ты отвечаешь: «Thanks, I’ll keep the old ioctl for compatibility», и присылаешь v2 с сохранённым ABI.", "benefit": "Возражение превращается в правку, а не в тупик"}}, {"q": "Сейчас утро среды. Просят сделать к пятнице EOD задачу A (2 дня) и задачу B (3 дня). Работаешь пн–пт. Какой ответ честный и верный?", "options": ["Sure, no problem at all: both A and B will be fully done and tested by Friday EOD.", "I can do A by Thursday EOD; B would need until Tuesday EOD. Which comes first?", "I can do A by Thursday EOD and B by next Monday EOD, if that works for you.", "It’s impossible, I can’t deliver anything at all by this Friday."], "correct": 1, "explain": "Шаг 1: до пятницы EOD три рабочих дня — ср, чт, пт; задачам нужно 2 + 3 = 5 дней, обе не успеть. Шаг 2: A — ср и чт, готова в четверг. Шаг 3: B — пт, пн, вт, готова во вторник EOD; «к понедельнику» — арифметическая ошибка, выходные не рабочие. Отказ от всего неверен: A успевается. Вопрос о порядке оставляет выбор приоритета за тем, кто ставит задачи.", "usage": {"code": false, "without": "Ты обещаешь обе к пятнице и в пятницу сдаёшь одну недоделанную, а вторую не начинал.", "with": "Ты считаешь дни, называешь реальные сроки и спрашиваешь о порядке. Тимлид выбирает B первой, и обе задачи сдаются в названные даты.", "benefit": "Сроки, которые ты называешь, сбываются"}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: работа над ошибками
    // не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  // Карточка вопроса: варианты, объяснение, пример. Общая для теста и для
  // «Работы над ошибками» / «Повторения», чтобы они не разошлись видом.
  function cardHtml(q, answered) {
    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» ----
  // Отдельный проход только по вопросам с неисправленной ошибкой. Счёт теста
  // (state.answers) он не трогает: исправленная ошибка пишется в state.fixed.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = LTProgress.mistakes(state);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast("Ошибок не осталось — всё исправлено");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = "Работа над ошибками · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        if (ok) { state.fixed = state.fixed || {}; state.fixed[idx] = Date.now(); saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    const left = LTProgress.mistakes(state).length;
    blockLabel.textContent = "Работа над ошибками · итог";
    html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
    html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
    if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
