<style>
  :root {
    --bg: #0f1117;

  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }

  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }

  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;

  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }

  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }

  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {

  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;

  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;

спределения, так как разброс отсутствует. (normal_distr.txt, стр. 2)", "usage": {"code": false, "without": "Без этого определения студент не понимает, зачем переходить к переменной Z при mu и sigma, отличных от нуля и единицы.", "with": "Зная, что стандартная величина имеет mu=0 и sigma=1, студент сразу связывает её с таблицей значений Z.", "benefit": "Даёт точку отсчёта для использования таблицы стандартного нормального распределения."}}, {"q": "Зачем в методике курса вводится преобразование Z равное X минус mu, делённое на sigma?", "options": ["Чтобы заменить непрерывное распределение на дискретное распределение с конечным числом исходов", "Чтобы найти дисперсию произвольной случайной величины через её математическое ожидание", "Чтобы свести нормальную величину X к стандартной величине Z и одной общей таблице", "Чтобы вычислить среднее арифметическое выборки без использования калькулятора или компьютера"], "correct": 2, "explain": "Источник поясняет: вместо повторения интегрирования для каждой пары mu и sigma задачу переводят в 'standardized deviation units' через Z=(X-mu)/sigma и далее используют одну общую таблицу. Замена на дискретное распределение противоречит сути преобразования. (normal_distr.txt, стр. 2)", "usage": {"code": false, "without": "Без стандартизации пришлось бы для каждой пары mu и sigma заново строить или искать отдельную таблицу.", "with": "Со стандартизацией студент один раз переводит X в Z и пользуется единственной готовой таблицей для любой задачи.", "benefit": "Экономит время и сводит разные задачи к одному универсальному инструменту."}}, {"q": "Какой факт про таблицу стандартного нормального распределения указан в источнике курса?", "options": ["Таблица содержит F от z лишь для положительных z, а для отрицательных применяют симметрию", "Таблица содержит F от z для всех целых z от минус трёх до плюс трёх включительно", "Таблица содержит значения плотности вероятности, а не накопленной вероятности, для каждого z", "Таблица содержит F от z л "options": ["Около 5%", "Около 68%", "Около 32%", "Около 0.3%"], "correct": 0, "explain": "Границы допуска отстоят от среднего ровно на 2σ, а по правилу трёх сигм в интервал μ плюс минус 2σ попадает около 95% значений, значит вне допуска остаётся около 5%. Частая ошибка — спутать это с интервалом μ плюс минус σ, где вне остаётся около 32% (normal_distr).", "usage": {"code": false, "without": "Инженер без этого знания меняет станок или ужесточает допуск наугад, ориентируясь только на жалобы клиентов.", "with": "Зная долю 95% для 2σ, инженер сразу оценивает ожидаемый процент брака по паспортным данным станка и решает, менять ли оборудование.", "benefit": "Позволяет заранее прогнозировать процент брака по параметрам станка."}}, {"q": "Контролёр хочет узнать долю валов диаметром более 50.3 мм при среднем 50 мм и σ равном 0.15 мм. Он взял таблицу стандартного нормального распределения и сразу посмотрел значение для X равного 50.3, не переводя его в Z. Какая ошибка здесь допущена?", "options": ["Забыли вычесть среднее, разделив только X на σ", "Забыли, что таблица применяется лишь при целых Z", "Ошибки нет, X можно смотреть по таблице напрямую", "Забыли перейти к Z, разделив X минус μ на σ"], "correct": 3, "explain": "По таблице стандартного нормального распределения ищут значения Z, а не X: нужно стандартизировать, Z равен X минус μ, делённому на σ, то есть 2, и смотреть таблицу для Z равного 2. Пропуск деления на σ — типичная ошибка при переходе к теореме Муавра-Лапласа (normal_distr).", "usage": {"code": false, "without": "Не стандартизировав, аналитик читает табличное значение для 50.3 и получает цифру, никак не связанную с реальным процентом брака.", "with": "Стандартизировав X в Z, аналитик получает верную долю деталей толще нормы и может обосновать регулировку станка.", "benefit": "Гарантирует, что табличное значение относится к нужной величине."}}, {"q": "Два цеха предлагают снизить процент бракованных деталей при том же среднем диаметре и том же допуске ОТК. Первый предлагает более точный станок с меньшим σ, второй — переобучить контролёров быстрее измерять детали. Какое изменение реально снизит долю брака?", "options": ["Ни один вариант, так как долю брака определяет только ширина допуска", "Более точный станок с меньшим σ, так как доля брака зависит от отношения ширины допуска к σ", "Обучение контролёров, так как быстрее измерять — значит меньше деталей уйдёт мимо контроля", "Оба варианта одинаково снижают долю брака, раз среднее не меняется"], "correct": 1, "explain": "Доля брака определяется тем, сколько σ укладывается в половину допуска: при меньшем σ то же поле допуска покрывает больше стандартных отклонений, и хвосты распределения вне допуска становятся тоньше. Скорость измерения на саму физическую величину диаметра не влияет (normal_distr).", "usage": {"code": false, "without": "Менеджер тратит бюджет на обучение контролёров, но процент брака остаётся прежним, потому что причина — разброс станка, а не скорость измерения.", "with": "Менеджер сравнивает σ старого и нового станка и считает, во сколько раз сузится хвост распределения, прежде чем утверждать закупку.", "benefit": "Экономит бюджет, направляя его на фактор, который действительно снижает брак."}}, {"q": "Рост взрослых мужчин в выборке распределён нормально со средним 178 см и стандартным отклонением 7 см. HR хочет подобрать границу роста так, чтобы под неё снизу попадало 90% сотрудников. Какой рост взять как границу, если Z для 90-го перцентиля равен примерно 1.28?", "options": ["Около 182 см", "Около 171 см", "Около 187 см", "Около 185 см"], "correct": 2, "explain": "90-й перцентиль получают по формуле X равно μ плюс Z умножить на σ, то есть 178 плюс 1.28 умножить на 7, около 187 см. Частая ошибка — прибавить всего одно σ, что даёт лишь около 84-го перцентиля, то есть 185 см (normal_distr).", "usage": {"code": false, "without": "HR закупает форму по интуитивному запасу в один рост выше среднего и всё равно недооценивает долю сотрудников, кому она мала.", "with": "HR считает нужный перцентиль через Z-таблицу и берёт границу, которая точно покрывает 90% сотрудников.", "benefit": "Снижает число возвратов формы неподходящего размера."}}, {"q": "В отчёте указана дисперсия веса упаковки Var X равна 25 г в квадрате. Стажёр подставил в формулу Z равно X минус μ, делённое на σ, число 25 вместо стандартного отклонения. К чему это приведёт при расчёте доли упаковок вне контрольных границ?", "options": ["Z получится занижен по модулю, доля вне границ будет занижена", "Z получится завышен по модулю, доля вне границ будет завышена", "Результат не изменится, так как σ и дисперсия дают одинаковый Z", "Расчёт станет неприменим, распределение перестанет быть нормальным"], "correct": 0, "explain": "Настоящее σ равно корню из 25, то есть 5 г. Подставив 25 вместо 5, стажёр увеличил знаменатель в 5 раз, поэтому модуль Z занижается в 5 раз, точка кажется ближе к среднему, и доля упаковок вне контрольных границ занижается. Путать σ и σ в квадрате — частая ошибка при работе с отчётами, где дана дисперсия (normal_distr).", "usage": {"code": false, "without": "Стажёр докладывает, что почти все упаковки в норме, хотя на самом деле разброс веса гораздо больше и часть упаковок выходит за границы.", "with": "Стажёр сначала извлекает корень из дисперсии, получает верное σ равное 5 г и считает Z корректно.", "benefit": "Предотвращает ложный вывод о стабильности процесса."}}, {"q": "Время отклика сервиса распределено нормально со средним 200 мс и стандартным отклонением 30 мс. SLA обещает, что 95% запросов уложатся быстрее 260 мс. Выполняется ли обещание, если Z равное 2 соответствует накопленной вероятности около 0.977?", "options": ["Да, но только потому что 260 мс равно среднему плюс одно σ", "Нет, потому что 260 мс лежит ниже среднего значения времени отклика", "Нет, фактическая доля быстрее 260 мс лишь около 84%, что ниже обещанных 95%", "Да, фактическая доля быстрее 260 мс около 97.7%, что выше обещанных 95%"], "correct": 3, "explain": "Z равен 260 минус 200, делённое на 30, то есть 2, а накопленная вероятность для Z равного 2 около 0.977, значит около 97.7% запросов укладываются быстрее 260 мс — обещание выполняется с запасом. Значение 84% соответствовало бы Z равному 1, то есть границе 230 мс, а не 260 мс (normal_distr).", "usage": {"code": false, "without": "Команда эксплуатации не проверяет расчёт и либо зря переделывает инфраструктуру, либо пропускает нарушение SLA.", "with": "Аналитик переводит границу 260 мс в Z и по таблице подтверждает, что обещание 95% выполняется с запасом.", "benefit": "Даёт объективное подтверждение выполнения SLA вместо догадок."}}, {"q": "В нагруженные часы стандартное отклонение времени отклика сервиса выросло с 30 до 50 мс, а среднее осталось 200 мс. Что произойдёт с долей запросов, укладывающихся в границу 260 мс?", "options": ["Доля не изменится, так как граница 260 мс осталась прежней", "Доля уменьшится, потому что Z для границы 260 мс станет меньше по модулю", "Доля станет равна нулю, так как нормальное распределение перестанет действовать", "Доля увеличится, потому что Z для границы 260 мс станет больше по модулю"], "correct": 1, "explain": "При том же среднем увеличение σ делает распределение более растянутым: Z для границы 260 мс падает с 2 до 1.2, чему соответствует накопленная вероятность около 0.885 вместо 0.977 — доля успешных запросов внутри SLA снижается. Нормальное распределение продолжает действовать, меняется лишь его разброс (normal_distr).", "usage": {"code": false, "without": "Команда видит рост среднего времени и не замечает, что разброс тоже вырос, и недооценивает нарушение SLA.", "with": "Аналитик пересчитывает Z с новым σ и показывает, что доля запросов внутри SLA упала даже при неизменном среднем.", "benefit": "Выявляет скрытую причину нарушения SLA — рост разброса, а не среднего."}}, {"q": "Опрос 400 жителей города показал долю поддержки инициативы p равную 0.5. Стандартная ошибка выборочной доли SE примерно равна 0.025. Какова примерная граница 95% доверительного интервала для истинной доли при Z равном 1.96?", "options": ["Плюс минус около 1.96 процентных пункта", "Плюс минус около 9.8 процентных пункта", "Плюс минус около 4.9 процентных пункта", "Плюс минус около 2.5 процентных пункта"], "correct": 2, "explain": "Граница доверительного интервала равна Z умножить на SE, то есть 1.96 умножить на 0.025, около 0.049, то есть около 4.9 процентных пункта в каждую сторону. Частая ошибка — взять только SE без умножения на Z или, наоборот, оставить голое значение Z без SE (normal_distr).", "usage": {"code": false, "without": "Журналист публикует долю поддержки без интервала, и читатель считает разницу в 3 пункта значимой, хотя она внутри погрешности.", "with": "Аналитик указывает интервал от 45.1 до 54.9%, и редакция понимает, что различие в 3 пункта не выходит за пределы погрешности.", "benefit": "Предотвращает выводы о значимой разнице, которая на деле лежит в пределах случайной ошибки."}}, {"q": "Социолог увеличил выборку опроса с 400 до 1600 человек, ожидая, что ширина 95% доверительного интервала уменьшится ровно в 4 раза, поскольку выборка выросла в 4 раза. Прав ли он?", "options": ["Нет, ширина сократится примерно в два раза, ведь стандартная ошибка обратно пропорциональна корню из n", "Да, ширина сократится ровно в четыре раза, ведь стандартная ошибка обратно пропорциональна размеру выборки n", "Нет, ширина совсем не изменится, ведь стандартная ошибка никак не зависит от размера выборки n", "Да, но это верно лишь в частном случае, когда доля поддержки p равна ровно значению 0.5"], "correct": 0, "explain": "SE равна корню из p умножить на 1 минус p, делённому на n, то есть обратно пропорциональна корню из n, а не самому n. Рост n в 4 раза уменьшает корень из n лишь в 2 раза, значит и ширина интервала сократится примерно вдвое, а не вчетверо (normal_distr).", "usage": {"code": false, "without": "Заказчик исследования планирует бюджет, ожидая вчетверо более точный результат, и разочаровывается, увидев лишь двукратное улучшение.", "with": "Социолог заранее объясняет заказчику, что учетверение выборки даёт лишь двукратный выигрыш в точности, и предлагает более экономный размер выборки.", "benefit": "Помогает спланировать бюджет опроса исходя из реального выигрыша в точности."}}, {"q": "Вес новорождённых в роддоме распределён нормально со средним 3.3 кг и стандартным отклонением 0.4 кг. Какая примерно доля новорождённых весит от 2.9 до 3.7 кг?", "options": ["Около 99.7%", "Около 95%", "Около 50%", "Около 68%"], "correct": 3, "explain": "Границы 2.9 и 3.7 кг отстоят от среднего 3.3 кг ровно на одно σ равное 0.4 кг, а по правилу трёх сигм в интервал μ плюс минус σ попадает около 68% значений. Долю 95% дал бы интервал μ плюс минус 2σ, то есть от 2.5 до 4.1 кг (normal_distr).", "usage": {"code": false, "without": "Врач сравнивает вес конкретного ребёнка с интервалом наугад и не может сказать, насколько это типичный случай.", "with": "Врач знает, что диапазон от 2.9 до 3.7 кг типичен для 68% новорождённых, и сразу видит, укладывается ли ребёнок в норму.", "benefit": "Даёт быстрый ориентир для оценки типичности показателя без таблиц под рукой."}}, {"q": "Наработка датчика X (тыс. часов) распределена X ~ N(50, 100), то есть μ=50, σ=10. Здесь Φ(z)=P(Z≤z) — функция стандартного нормального распределения, как в normal_distr.txt: Φ(1.0)=0.8413, Φ(1.5)=0.9332. Стандартизуйте границы 40 и 65 и найдите P(40<X<65).", "options": ["P приблизительно равна 0.9081", "P приблизительно равна 0.8413", "P приблизительно равна 0.7745", "P приблизительно равна 0.0919"], "correct": 2, "explain": "Шаг 1: z1=(40-50)/10=-1.0, z2=(65-50)/10=1.5. Шаг 2: P=Φ(1.5)-Φ(-1.0)=Φ(1.5)-[1-Φ(1.0)]=0.9332-0.1587. Шаг 3: P=0.7745. Частая ошибка — вычесть Φ(1.0) без перехода к 1-Φ(1.0), получая 0.0919 (normal_distr.txt, разд. III-IV).", "usage": {"code": false, "without": "Без стандартизации аналитик вынужден заново интегрировать плотность нормального распределения под каждую пару μ, σ.", "with": "Переходя к Z=(X-μ)/σ, он сводит любую нормальную величину к одной таблице и быстро оценивает долю партии датчиков с наработкой в нужном диапазоне.", "benefit": "Быстрая оценка вероятности интервала без численного интегрирования."}}, {"q": "Вес упаковки X (г) распределён X ~ N(100, 64), то есть μ=100, σ=8. Φ(z)=P(Z≤z): Φ(2.0)=0.9772, Φ(2.25)=0.9878. Стандартизуйте границы 84 и 118 и найдите P(84<X<118).", "options": ["P равна примерно 0.9650", "P равна примерно 0.9878", "P равна примерно 0.0106", "P равна примерно 0.0228"], "correct": 0, "explain": "Шаг 1: z1=(84-100)/8=-2.0, z2=(118-100)/8=2.25. Шаг 2: P=Φ(2.25)-Φ(-2.0)=Φ(2.25)-[1-Φ(2.0)]=0.9878-0.0228. Шаг 3: P=0.9650. Ошибка — вычесть Φ(2.0) из Φ(2.25) напрямую, получая 0.0106 (normal_distr.txt, разд. III-IV).", "usage": {"code": false, "without": "Технолог линии не может быстро понять, какая доля упаковок укладывается в допуск веса.", "with": "Стандартизация границ допуска через z=(x-μ)/σ даёт долю партии в норме за одно табличное сравнение.", "benefit": "Контроль качества без ручных измерений каждой упаковки."}}, {"q": "Время отклика сервера X (мс) распределено X ~ N(30, 16), то есть μ=30, σ=4. Φ(z)=P(Z≤z): Φ(1.6)=0.9452. Стандартизуйте границу 36.4 и найдите P(X>36.4).", "options": ["P составляет около 0.1096", "P составляет около 0.9452", "P составляет около 0.4452", "P составляет около 0.0548"], "correct": 3, "explain": "Шаг 1: z=(36.4-30)/4=1.6. Шаг 2: P(X>36.4)=1-Φ(1.6)=1-0.9452. Шаг 3: P=0.0548. Ошибка — забыть вычесть из 1 и оставить Φ(1.6) как ответ, получая 0.9452 (normal_distr.txt, разд. III-IV).", "usage": {"code": false, "without": "Инженер SRE не может оценить долю запросов, превышающих порог отклика.", "with": "Стандартизация порога 36.4 мс в z-оценку даёт долю медленных запросов напрямую по значению Φ.", "benefit": "Быстрая оценка доли превышений SLA без сбора гистограммы."}}, {"q": "Ошибка измерения датчика X распределена X ~ N(40, 9), то есть μ=40, σ=3. Φ(z)=P(Z≤z): Φ(1.5)=0.9332. Найдите P(|X-40|<4.5), используя δ=4.5 и правило P(|X-μ|<δ)=2Φ(δ/σ)-1.", "options": ["Вероятность равна 0.1336", "Вероятность равна 0.8664", "Вероятность равна 0.9332", "Вероятность равна 0.4666"], "correct": 1, "explain": "Шаг 1: z=δ/σ=4.5/3=1.5. Шаг 2: P=2Φ(1.5)-1=2*0.9332-1. Шаг 3: P=0.8664. Ошибка — забыть удвоение и вычитание единицы, оставив просто Φ(1.5)=0.9332 (normal_distr.txt, разд. III, правило 4).", "usage": {"code": false, "without": "Метролог не может оценить долю измерений, укладывающихся в допуск ±δ вокруг истинного значения.", "with": "Формула 2Φ(δ/σ)-1 сразу даёт долю измерений в симметричном допуске без интегрирования плотности.", "benefit": "Быстрая проверка соответствия прибора заявленной точности."}}, {"q": "Диаметр детали X распределён X ~ N(70, 25), то есть μ=70, σ=5. Φ(z)=P(Z≤z): Φ(3.0)=0.9987. Интервал 55..85 отстоит от μ ровно на 3σ в обе стороны. Найдите P(55<X<85), используя правило трёх сигм P(|X-μ|<3σ)=2Φ(3)-1.", "options": ["Вероятность равна 0.4987", "Вероятность равна 0.0026", "Вероятность равна 0.9974", "Вероятность равна 0.9987"], "correct": 2, "explain": "Шаг 1: (85-70)/5=3 и (70-55)/5=3, значит интервал это μ±3σ. Шаг 2: P=2Φ(3.0)-1=2*0.9987-1. Шаг 3: P=0.9974, что согласуется с классическим правилом трёх сигм 99.73 процента. Ошибка — оставить просто Φ(3.0)=0.9987 без удвоения (normal_distr.txt, разд. I).", "usage": {"code": false, "without": "Контролёр партии деталей не знает, какую долю бракует интервал допуска ±3σ.", "with": "Правило трёх сигм сразу даёт долю деталей внутри допуска без пересчёта интеграла плотности.", "benefit": "Стандартный ориентир 99.73 процента для приёмки партии по допуску."}}, {"q": "Баллы теста X распределены X ~ N(50, 16), то есть μ=50, σ=4. Φ(z)=P(Z≤z): Φ(2.0)=0.9772. Найдите границу x0 такую, что P(X<x0)=0.9772.", "options": ["x0 равен 58", "x0 равен 66", "x0 равен 54", "x0 равен 42"], "correct": 0, "explain": "Шаг 1: по значению Φ(2.0)=0.9772 находим z=2.0. Шаг 2: x0=μ+zσ=50+2.0*4. Шаг 3: x0=58. Ошибка — взять z=1.0 вместо 2.0 и получить 54 (normal_distr.txt, разд. III-IV).", "usage": {"code": false, "without": "Приёмная комиссия не может назначить проходной балл, соответствующий заданной доле студентов.", "with": "Обратный переход от вероятности к z, а от z к x, сразу даёт нужный проходной балл.", "benefit": "Назначение порога по заданной доле без перебора вариантов."}}, {"q": "Время загрузки страницы X распределено нормально со средним μ и σ=10 мс. Φ(z)=P(Z≤z): Φ(1.96)=0.9750. Найдите δ такое, что P(|X-μ|<δ)=0.9500, используя Φ(δ/σ)=(1+0.9500)/2.", "options": ["δ равна 17.5", "δ равна 9.75", "δ равна 39.2", "δ равна 19.6"], "correct": 3, "explain": "Шаг 1: Φ(z)=(1+0.95)/2=0.975, откуда z=1.96 по данному значению Φ(1.96)=0.9750. Шаг 2: δ=z*σ=1.96*10. Шаг 3: δ=19.6. Ошибка — принять значение Φ за z и получить δ=9.75 (normal_distr.txt, разд. III, правило 4B).", "usage": {"code": false, "without": "A/B-аналитик не может задать симметричный интервал вокруг среднего под заданный уровень доверия.", "with": "Обратный переход от вероятности к z=1.96 сразу даёт полуширину доверительного интервала.", "benefit": "Построение интервала под нужную вероятность без подбора вслепую."}}, {"q": "Схема Бернулли, n=100, p=0.5, q=0.5. По теореме Муавра-Лапласа X приближённо N(np, npq). Φ(z)=P(Z≤z): Φ(2.0)=0.9772, Φ(3.0)=0.9987. Найдите np, sqrt(npq) и P(40<X<65).", "options": ["P равна 0.8400", "P равна 0.9759", "P равна 0.9987", "P равна 0.0215"], "correct": 1, "explain": "Шаг 1: np=100*0.5=50, npq=100*0.5*0.5=25, sqrt(npq)=5. Шаг 2: z1=(40-50)/5=-2.0, z2=(65-50)/5=3.0, P=Φ(3.0)-[1-Φ(2.0)]=0.9987-0.0228. Шаг 3: P=0.9759. Ошибка — вычесть Φ(2.0) напрямую из Φ(3.0), получая 0.0215 (normal_distr.txt, разд. V).", "usage": {"code": false, "without": "Аналитик колл-центра не может быстро оценить долю дней с числом обращений в заданном диапазоне при n=100 испытаниях.", "with": "Нормальное приближение через np и sqrt(npq) заменяет громоздкую биномиальную сумму одной z-оценкой.", "benefit": "Мгновенная оценка вероятности диапазона без суммирования 100 слагаемых."}}, {"q": "Схема Бернулли, n=400, p=0.2, q=0.8. Φ(z)=P(Z≤z): Φ(2.0)=0.9772. Найдите np, sqrt(npq) и P(X>96) по теореме Муавра-Лапласа.", "options": ["P равна 0.4772", "P равна 0.0456", "P равна 0.0228", "P равна 0.9772"], "correct": 2, "explain": "Шаг 1: np=400*0.2=80, npq=400*0.2*0.8=64, sqrt(npq)=8. Шаг 2: z=(96-80)/8=2.0. Шаг 3: P(X>96)=1-Φ(2.0)=1-0.9772=0.0228. Ошибка — оставить Φ(2.0)=0.9772 без вычитания из 1 (normal_distr.txt, разд. V).", "usage": {"code": false, "without": "Отдел контроля брака не может оценить риск превышения порога дефектов при n=400 изделиях.", "with": "Замена биномиального хвоста нормальным приближением даёт долю партий с числом брака выше порога за один шаг.", "benefit": "Быстрая оценка риска превышения без биномиальных таблиц для n=400."}}, {"q": "Схема Бернулли, n=400, p=0.5, q=0.5. Φ(z)=P(Z≤z): Φ(2.0)=0.9772, Φ(2.5)=0.9938. Найдите np, sqrt(npq) и P(180<X<225) по теореме Муавра-Лапласа.", "options": ["P равна 0.9710", "P равна 0.0166", "P равна 0.0290", "P равна 0.9938"], "correct": 0, "explain": "Шаг 1: np=400*0.5=200, npq=400*0.5*0.5=100, sqrt(npq)=10. Шаг 2: z1=(180-200)/10=-2.0, z2=(225-200)/10=2.5, P=Φ(2.5)-[1-Φ(2.0)]=0.9938-0.0228. Шаг 3: P=0.9710. Ошибка — оставить Φ(2.5)=0.9938 без учёта нижней границы (normal_distr.txt, разд. V).", "usage": {"code": false, "without": "Соцопрос с n=400 респондентами не позволяет оценить, попадёт ли число сторонников в целевой коридор.", "with": "Нормальное приближение переводит биномиальный подсчёт голосов в одну z-оценку диапазона.", "benefit": "Оценка вероятности коридора результатов без построения полного биномиального распределения."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
