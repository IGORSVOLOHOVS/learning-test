<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RCF 5: PID-регулирование, настройка, каскад и feedforward</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>RCF 5: PID-регулирование, настройка, каскад и feedforward</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "rcf_pid_control_tuning_advanced_structures";
  const QUESTIONS = [{"q": "Какую структуру ПИД-регулятора задаёт запись C(s) = Kp + Ki/s + Kd·s, использованная в лабораторной работе по настройке привода сустава?", "options": ["Последовательную структуру с общим коэффициентом усиления перед всей суммой", "Каскадную структуру с отдельными регуляторами для внутреннего и внешнего контура", "Параллельную структуру с тремя независимыми коэффициентами Kp, Ki и Kd", "Стандартную ISA-форму с постоянными времени интегрирования Ti и дифференцирования Td"], "correct": 2, "explain": "Запись Kp + Ki/s + Kd·s складывает три члена независимо — это параллельная форма ПИД, применённая в лабе для регулятора сустава. Стандартная ISA-форма вместо Ki и Kd использует постоянные времени Ti и Td (labT5-lab.txt, Step 2).", "usage": {"code": false, "without": "Инженер путает параллельные коэффициенты с постоянными времени ISA-формы и неверно переносит настройки в другую библиотеку регулятора.", "with": "Зная параллельную форму, инженер сразу пересчитывает Ki=Kp/Ti и Kd=Kp·Td при переходе на ISA-запись.", "benefit": "Корректный перенос коэффициентов ПИД между формами записи."}}, {"q": "Какой эффект даёт пропорциональная составляющая ПИД-регулятора в контуре сустава под постоянной нагрузкой?", "options": ["Ускоряет реакцию на текущую ошибку, но оставляет часть ошибки под нагрузкой", "Компенсирует нагрузку заранее, ещё до появления самой ошибки", "Устраняет статическую ошибку, накапливая её значение во времени", "Демпфирует колебания, откликаясь на скорость изменения ошибки"], "correct": 0, "explain": "Пропорциональный член реагирует на текущую ошибку и ускоряет отклик, но при постоянной нагрузке всегда оставляет остаточную ошибку, потому что управляющий сигнал держится только на ненулевой ошибке. Устранение этой ошибки — задача интегратора (labT5-lab.txt, Step 5).", "usage": {"code": false, "without": "Инженер повышает только Kp, ожидая нулевой ошибки под нагрузкой, и сустав годами держит видимый перекос.", "with": "Понимая роль P-члена, инженер сразу добавляет интегратор для нулевой статической ошибки под нагрузкой.", "benefit": "Верный выбор члена регулятора для устранения статической ошибки."}}, {"q": "Почему статическая ошибка сустава под постоянной нагрузкой устраняется именно интегральной составляющей ПИД?", "options": ["Пропорциональный член создаёт сигнал, растущий пропорционально времени действия нагрузки", "Прямая связь заранее задаёт сигнал управления по известной модели нагрузки", "Дифференциальный член реагирует на нагрузку в момент её появления", "Интегратор копит ошибку во времени и держит сигнал, пока ошибка не станет нулём"], "correct": 3, "explain": "При постоянной нагрузке производная ошибки на установившемся режиме равна нулю, поэтому D-член не помогает, а P-член может держать сигнал только при ненулевой ошибке. Только накопленный интегратором сигнал способен держать нужное усилие при нулевой ошибке (labT5-lab.txt, Step 5).", "usage": {"code": false, "without": "Инженер убирает интегратор для простоты и получает сустав, который навсегда провисает под собственным весом.", "with": "Зная механизм интегратора, инженер сохраняет его в контуре именно там, где присутствует постоянная нагрузка.", "benefit": "Нулевая статическая ошибка под постоянной нагрузкой."}}, {"q": "В чём состоит основная функция дифференциальной составляющей ПИД-регулятора и её главный недостаток?", "options": ["Заранее компенсирует известное возмущение ещё до появления самой ошибки", "Реагирует на скорость изменения ошибки, снижая колебания, но усиливает шум датчика", "Накапливает ошибку во времени и устраняет статическую ошибку под нагрузкой", "Усиливает текущую ошибку пропорционально и ускоряет реакцию контура на команду"], "correct": 1, "explain": "Дифференциальный член пропорционален скорости изменения ошибки и гасит колебания, но идеальная производная бесконечно усиливает высокочастотный шум датчика, поэтому её редко применяют без фильтра. Остальные варианты описывают роли I, P и прямой связи, а не D (labT5-lab.txt, Step 4-5).", "usage": {"code": false, "without": "Инженер включает чистую производную без фильтра, и привод дёргается от шума энкодера на каждом шаге.", "with": "Понимая природу D-члена, инженер сразу закладывает фильтр низких частот на производную.", "benefit": "Демпфирование без усиления шума датчика."}}, {"q": "Какие два параметра заменяют коэффициенты Ki и Kd параллельной формы в стандартной ISA-записи ПИД-регулятора?", "options": ["Постоянная времени объекта тау и коэффициент передачи двигателя Km", "Коэффициент обратной связи H и коэффициент прямой связи по заданию", "Интегральное время Ti и дифференциальное время Td при общем множителе Kp", "Критическое усиление Ku и критический период Tu из незатухающих колебаний"], "correct": 2, "explain": "В ISA-форме регулятор записывают как Kp, умноженный на сумму единицы, обратного интегрального времени Ti и дифференциального времени Td — это те же Ki и Kd, но выраженные через постоянные времени и общий множитель Kp (Ogata, гл. 8).", "usage": {"code": false, "without": "Инженер путает параметры ISA-формы с параметрами метода Циглера-Николса и вводит в контроллер не те числа.", "with": "Зная связь Ki=Kp/Ti и Kd=Kp·Td, инженер корректно настраивает контроллер в любой форме записи.", "benefit": "Безошибочный перевод параметров между формами записи ПИД."}}, {"q": "Что делает механизм anti-windup в ПИД-регуляторе привода с ограниченной мощностью?", "options": ["Останавливает накопление интегральной составляющей, пока сигнал управления насыщен", "Переключает контур с ПИД на чисто пропорциональный при перегрузке", "Ограничивает рост пропорциональной составляющей при большой ошибке слежения", "Снижает частоту дискретизации регулятора в момент насыщения привода"], "correct": 0, "explain": "Anti-windup не даёт интегратору продолжать копить ошибку, пока выход регулятора уже уперся в ограничение привода, иначе после снятия ограничения контур долго и с перерегулированием возвращается к цели. Остальные варианты описывают несуществующие или иные механизмы (Astrom & Murray, гл. 11).", "usage": {"code": false, "without": "Без anti-windup интегратор копит огромную ошибку во время насыщения, и привод потом резко проскакивает цель.", "with": "С anti-windup интегратор останавливается на границе насыщения и контур возвращается к цели без лишнего броска.", "benefit": "Отсутствие выброса после снятия ограничения привода."}}, {"q": "Зачем дифференциальную составляющую ПИД на практике реализуют через фильтр низких частот, а не как идеальную производную?", "options": ["Фильтр устраняет статическую ошибку, которую производная сама не убирает", "Идеальная производная делает контур неустойчивым при любом значении коэффициента Kd", "Фильтр заменяет интегральную составляющую в контурах с высокой частотой дискретизации", "Идеальная производная бесконечно усиливает шум датчика, а фильтр это ограничивает"], "correct": 3, "explain": "Идеальный дифференциатор имеет амплитудно-частотную характеристику, растущую с частотой без предела, поэтому высокочастотный шум датчика проходит на выход усиленным; фильтр низких частот ограничивает эту полосу. Остальные утверждения путают роль D-члена с ролями I-члена или искажают влияние Kd на устойчивость (Franklin, Powell, Emami-Naeini, гл. 10).", "usage": {"code": false, "without": "Инженер ставит идеальную производную без фильтра, и выход регулятора трясётся от шума энкодера.", "with": "С фильтром на производной сигнал управления остаётся гладким при том же демпфировании.", "benefit": "Подавление усиления шума при сохранении демпфирующего действия D-члена."}}, {"q": "На каких двух параметрах основан метод настройки Циглера-Николса по кривой разгона разомкнутого объекта?", "options": ["Запас по фазе PM и частота среза замкнутого контура по логарифмическим характеристикам", "Запаздывание L и постоянная времени T переходной характеристики разомкнутого объекта", "Критическое усиление Ku и период незатухающих колебаний Tu замкнутого контура", "Перерегулирование Mp и время регулирования ts переходного процесса замкнутой системы"], "correct": 1, "explain": "Метод Циглера-Николса по кривой разгона снимает переходную характеристику разомкнутого объекта на ступенчатое воздействие и определяет по ней запаздывание L и постоянную времени T, из которых по таблице находят коэффициенты ПИД. Метод по критическому усилению использует Ku и Tu замкнутого контура, а не разомкнутого (Ogata, гл. 8).", "usage": {"code": false, "without": "Инженер без модели объекта пробует коэффициенты ПИД наугад и тратит часы на подбор.", "with": "Сняв одну кривую разгона, инженер за пару минут получает L и T и стартовые коэффициенты ПИД по таблице.", "benefit": "Быстрая начальная настройка ПИД без построения полной модели объекта."}}, {"q": "Как определяют критическое усиление Ku и критический период Tu в методе Циглера-Николса по предельному циклу?", "options": ["Измеряют запас по амплитуде и запас по фазе на диаграмме Боде разомкнутого контура", "Подбирают коэффициенты вручную, наблюдая перерегулирование на экране осциллографа", "Повышают только пропорциональный коэффициент до появления незатухающих колебаний на выходе", "Снимают кривую разгона объекта по ступенчатому входу на разомкнутом контуре"], "correct": 2, "explain": "В методе по предельному циклу интегральную и дифференциальную составляющие отключают, а пропорциональный коэффициент увеличивают, пока в замкнутом контуре не возникнут устойчивые незатухающие колебания — их усиление и период и есть Ku и Tu. Кривая разгона относится к другому методу Циглера-Николса (Nise, гл. 9).", "usage": {"code": false, "without": "Инженер без чёткой процедуры доводит контур до колебаний и не понимает, какие числа из них взять.", "with": "Зная процедуру, инженер фиксирует именно усиление и период на грани устойчивости и подставляет их в таблицу коэффициентов.", "benefit": "Воспроизводимое определение Ku и Tu для настройки ПИД."}}, {"q": "Как распределены роли между внутренним и внешним контуром в каскадном управлении приводом сустава?", "options": ["Внутренний контур тока или скорости быстрее внешнего контура положения", "Внутренний контур скорости полностью заменяет обратную связь по положению", "Внешний контур положения работает быстрее внутреннего контура тока", "Оба контура настраиваются одним общим регулятором на одной полосе пропускания"], "correct": 0, "explain": "В каскадной схеме внутренний контур — обычно тока или скорости — должен отрабатывать задание значительно быстрее внешнего контура положения, иначе внешний контур не сможет опираться на него как на быстрый исполнительный элемент. Остальные варианты меняют роли контуров местами или убирают контур положения (Siciliano et al., гл. 8).", "usage": {"code": false, "without": "Инженер настраивает оба контура на одну и ту же полосу пропускания, и каскад теряет устойчивость.", "with": "Сделав внутренний контур в разы быстрее внешнего, инженер получает предсказуемый и устойчивый каскад.", "benefit": "Устойчивое разделение динамики между контурами каскада."}}, {"q": "Стандартная ISA-форма ПИД-регулятора задаёт коэффициенты через Kp, интегральное время Ti и дифференциальное время Td вместо параллельных Ki и Kd. Как Ti и Td выражаются через Kp, Ki и Kd?", "options": ["Ti равно Kd делить на Kp, а Td равно Kp делить на Ki", "Ti равно Kp делить на Ki, а Td равно Kd делить на Kp", "Ti равно Ki делить на Kp, а Td равно Kp делить на Kd", "Ti равно Kp умножить на Ki, а Td равно Kp умножить на Kd"], "correct": 1, "explain": "В ISA-форме Kp умножается на сумму единицы, единицы делить на Ti·s и Td·s; раскрыв скобки, получаем Ki = Kp/Ti и Kd = Kp·Td, откуда Ti = Kp/Ki и Td = Kd/Kp. Вариант с перевёрнутыми дробями путает, какая величина в числителе. (Ogata, гл. 8)", "usage": {"code": false, "without": "Без формул пересчёта инженер, посчитавший Kp, Ki, Kd по учебнику, не сможет ввести их в промышленный регулятор, параметры которого заданы как Kp, Ti, Td, и получит другую настройку контура.", "with": "Зная Ti = Kp/Ki и Td = Kd/Kp, он пересчитывает параметры за секунду и вводит в панель регулятора именно тот закон управления, что рассчитал.", "benefit": "Устраняет ошибку настройки при переносе расчёта в промышленный ПИД-блок."}}, {"q": "В ISA-форме ПИД-регулятора Ti называют интегральным временем, а Td — дифференциальным временем. Что физически означают эти два параметра?", "options": ["Ti — постоянная времени датчика обратной связи регулятора, а Td — постоянная времени исполнительного привода", "Ti — период дискретизации цифрового регулятора, а Td — время вычисления одного шага алгоритма", "Ti — время сравнения вкладов интеграла и пропорции, а Td — время упреждения дифференциального канала", "Ti — время нарастания переходного процесса контура, а Td — время установления сигнала по уровню два процента"], "correct": 2, "explain": "Ti равно времени, за которое интегральная составляющая при постоянной ошибке накопит вклад, равный пропорциональной составляющей, а Td равно времени, на которое дифференциальный член опережает изменение сигнала ошибки; ни то, ни другое не связано с датчиком или дискретизацией. (Astrom & Murray, гл. 10)", "usage": {"code": false, "without": "Без понимания физического смысла Ti и Td инженер подбирает их наугад перебором, не понимая, почему увеличение Ti замедляет реакцию на постоянную ошибку.", "with": "Понимая Ti как время сравнения вкладов, а Td как время упреждения, он осознанно уменьшает Ti для более быстрой компенсации нагрузки на суставе манипулятора.", "benefit": "Даёт осмысленное направление подбора параметров вместо перебора вслепую."}}, {"q": "Если в ПИД-регуляторе уменьшить интегральное время Ti, оставив Kp и Td без изменений, как это скажется на полюсах замкнутого контура?", "options": ["Интегральный коэффициент Ki растёт, полюса смещаются к мнимой оси, колебательность и время установления растут", "Пропорциональный коэффициент Kp растёт, полюса смещаются на вещественную ось, перерегулирование исчезает полностью", "Дифференциальный коэффициент Kd растёт, полюса смещаются дальше от начала координат, шум сильнее подавляется", "Интегральный коэффициент Ki падает, полюса смещаются в левую полуплоскость, контур становится более демпфированным"], "correct": 0, "explain": "Уменьшение Ti при том же Kp увеличивает Ki равно Kp делить на Ti, а увеличение интегрального усиления в характеристическом уравнении обычно сдвигает пару комплексных полюсов ближе к мнимой оси, увеличивая колебательность; Kp и Kd в этом изменении не участвуют. (labT5-lab.txt, шаг 3 — closed-loop poles; Ogata, гл. 8)", "usage": {"code": false, "without": "Не зная этой связи, инженер уменьшает Ti, чтобы быстрее убрать статическую ошибку сустава под нагрузкой, и получает неожиданный рост колебаний угла.", "with": "Зная, что меньшее Ti сдвигает полюса ближе к мнимой оси, он одновременно немного увеличивает Kd, чтобы удержать демпфирование.", "benefit": "Позволяет предсказывать побочный эффект настройки интеграла до эксперимента на реальном суставе."}}, {"q": "Как увеличение дифференциального времени Td, при неизменных Kp и Ti, обычно влияет на полюса замкнутого контура ПИД-регулятора?", "options": ["Пропорциональный коэффициент Kp растёт, полюса остаются на месте, меняется только статический коэффициент передачи", "Дифференциальный коэффициент Kd растёт, полюса смещаются ближе к мнимой оси, контур становится более колебательным", "Интегральный коэффициент Ki растёт, полюса смещаются дальше от начала координат, установившаяся ошибка увеличивается", "Дифференциальный коэффициент Kd растёт, контур получает опережающее звено, полюса смещаются в левую полуплоскость"], "correct": 3, "explain": "Рост Td при том же Kp увеличивает Kd равно Kp умножить на Td, вводя в контур опережающее звено, которое обычно увеличивает демпфирование и сдвигает полюса влево, а не вправо к мнимой оси; Kp и Ti при этом не меняются. (labT5-lab.txt, шаг 3 — closed-loop poles; Franklin-Powell-Emami-Naeini, гл. 4)", "usage": {"code": false, "without": "Без этого знания инженер боится увеличивать Td, полагая, что любое изменение усиления раскачивает контур сустава сильнее.", "with": "Понимая, что рост Td обычно двигает полюса в левую полуплоскость, он осознанно добавляет дифференциальную составляющую, чтобы погасить перерегулирование.", "benefit": "Обосновывает выбор Td как инструмента демпфирования, а не источника нестабильности."}}, {"q": "Что именно вызывает интегральное насыщение windup в ПИД-регуляторе, когда привод ограничен по мощности?", "options": ["Дискретизация регулятора округляет значения ошибки, из-за чего интегральная сумма накапливает погрешность округления", "Насыщенный привод получает сигнал меньше расчётного, а интегратор продолжает копить ошибку как без ограничения", "Пропорциональный член достигает предела привода раньше интегрального, и дифференциальный канал перестаёт реагировать на шум", "Фильтр производной вносит фазовое запаздывание, из-за которого интегратор теряет синхронизацию с реальной ошибкой"], "correct": 1, "explain": "Насыщение привода разрывает связь между расчётным и реально выданным управляющим сигналом, а интегратор об этом не знает и продолжает накапливать ошибку так, будто ограничения нет, из-за чего после смены знака ошибки контур долго выходит из перерегулирования; фильтр производной и дискретизация тут ни при чём. (Astrom & Murray, гл. 11)", "usage": {"code": false, "without": "Не зная механизма windup, инженер видит долгий выброс угла сустава после насыщения привода и списывает это на плохо подобранный Kp.", "with": "Понимая, что интегратор копит ошибку вслепую во время насыщения, он сразу подозревает windup и проверяет реальный сигнал на приводе.", "benefit": "Сокращает время диагностики затяжного перерегулирования после насыщения привода."}}, {"q": "Чем метод anti-windup с обратным пересчётом back-calculation принципиально отличается от простого ограничения clamp интегратора?", "options": ["Back-calculation переключает регулятор на чисто пропорциональный закон, а clamp заменяет интегратор фильтром низких частот", "Back-calculation увеличивает частоту дискретизации регулятора, а clamp уменьшает коэффициент Kd до снятия насыщения", "Back-calculation вычитает разницу насыщенного и расчётного сигналов из интеграла, а clamp замораживает накопление на пределе", "Back-calculation увеличивает Ti на время насыщения привода, а clamp временно обнуляет коэффициент Kp до выхода из насыщения"], "correct": 2, "explain": "Back-calculation активно стягивает интегральную сумму обратно, используя разницу между тем, что регулятор рассчитал, и тем, что реально выдал насыщенный привод, тогда как clamp пассивно замораживает интегратор на пределе; ни Ti, ни Kp, ни Kd, ни частота дискретизации при этом не меняются. (Astrom & Murray, гл. 11)", "usage": {"code": false, "without": "Без разбора отличий инженер реализует clamp и удивляется, что контур всё равно медленно выходит из насыщения после резкого шага.", "with": "Зная, что back-calculation активно стягивает интеграл через сигнал рассогласования привода, он выбирает именно этот метод для быстрого выхода из насыщения.", "benefit": "Даёт критерий выбора между двумя anti-windup методами вместо случайного выбора."}}, {"q": "Зачем в реальном ПИД-регуляторе дифференциальный канал почти всегда дополняют фильтром низких частот?", "options": ["Идеальный дифференциатор имеет коэффициент передачи, растущий с частотой, и усиливает высокочастотный шум измерения", "Идеальный дифференциатор делает характеристическое уравнение контура неустойчивым уже при малых значениях Kd", "Идеальный дифференциатор вносит запаздывание по фазе на низких частотах, из-за чего контур теряет запас устойчивости", "Идеальный дифференциатор увеличивает установившуюся ошибку контура, смещая постоянную составляющую сигнала"], "correct": 0, "explain": "Передаточная функция идеального дифференциатора Kd·s растёт по модулю пропорционально частоте без верхней границы, поэтому любой высокочастотный шум датчика усиливается сильнее полезного сигнала; на фазу на низких частотах, на установившуюся ошибку и на устойчивость при малых Kd это напрямую не влияет. (Ogata, гл. 8)", "usage": {"code": false, "without": "Без фильтра производной сигнал управления сустава дрожит от шума энкодера, и привод отрабатывает этот шум как настоящее движение.", "with": "Добавив фильтр к дифференциальному каналу, инженер ограничивает усиление на высоких частотах и получает гладкий сигнал управления.", "benefit": "Устраняет паразитную дрожь привода от усиленного шума измерения."}}, {"q": "В фильтрованном дифференциальном звене вида Kd·s делить на единицу плюс s делить на N, что задаёт параметр N и как его выбор влияет на регулятор?", "options": ["N задаёт интегральное время Ti, и большое N ослабляет интегральную составляющую, увеличивая установившуюся ошибку", "N задаёт коэффициент передачи привода, и большое N увеличивает максимальный момент дифференциального канала", "N задаёт период дискретизации регулятора, и большое N уменьшает шаг расчёта, ускоряя реакцию на ошибку", "N задаёт частоту среза фильтра производной, большое N усиливает шум, малое N подавляет шум ценой запаздывания"], "correct": 3, "explain": "N — коэффициент фильтра, определяющий частоту среза дифференциального звена: при большом N фильтр почти не ограничивает высокие частоты и канал ведёт себя как идеальный дифференциатор, усиливая шум, а при малом N шум подавляется ценой дополнительного фазового запаздывания; к дискретизации, Ti и приводу N отношения не имеет. (Astrom & Murray, гл. 10)", "usage": {"code": false, "without": "Без понимания роли N инженер либо оставляет дифференциальный канал без фильтра и борется с дрожью привода, либо ставит фильтр наугад и теряет полезную реакцию на быстрые изменения ошибки.", "with": "Понимая компромисс, он подбирает N так, чтобы подавить шум энкодера, но сохранить достаточно быструю реакцию на изменение угла сустава.", "benefit": "Даёт осознанный параметр для баланса между шумоподавлением и быстродействием дифференциального канала."}}, {"q": "На чём основан первый метод Циглера-Николса подбора коэффициентов ПИД по кривой разгона объекта?", "options": ["На переходной характеристике уже настроенного замкнутого контура, из которой уточняют перерегулирование", "На разомкнутой S-образной реакции объекта на скачок, из которой снимают время запаздывания L и постоянную времени T", "На замкнутом контуре, доведённом до устойчивых незатухающих колебаний, из которых снимают критический коэффициент и период", "На частотной характеристике объекта, из которой снимают запас по фазе и запас по амплитуде для расчёта коэффициентов"], "correct": 1, "explain": "Первый метод Циглера-Николса работает с разомкнутым объектом: по S-образному отклику на ступенчатое воздействие снимают время запаздывания L и постоянную времени T, а коэффициенты Kp, Ti, Td берут из таблицы по этим двум числам; замкнутый контур с колебаниями относится ко второму методу. (Ogata, гл. 8)", "usage": {"code": false, "without": "Без знания метода инженер настраивает новый привод перебором вручную, тратя часы на пробы и ошибки.", "with": "Сняв кривую разгона привода на скачок и измерив L и T, он за одну таблицу получает стартовые Kp, Ti, Td.", "benefit": "Сокращает первичную настройку ПИД с часов ручного перебора до одной измеренной кривой."}}, {"q": "Второй метод Циглера-Николса доводит контур до границы устойчивости чисто пропорциональным регулятором. Что снимают в этой точке и как считают коэффициенты ПИД?", "options": ["Снимают запас устойчивости по амплитуде и по фазе, а Kp, Ti и Td подбирают так, чтобы оба запаса стали нулевыми", "Снимают установившуюся ошибку и время регулирования контура, а Kp, Ti и Td увеличивают пропорционально этой ошибке", "Снимают критический коэффициент Ku и период колебаний Pu, а Kp, Ti и Td берут из таблицы как доли Ku и Pu", "Снимают время запаздывания L и постоянную времени T объекта, а Kp, Ti и Td берут из таблицы как доли L и T"], "correct": 2, "explain": "На границе устойчивости чисто пропорционального регулятора фиксируют критический коэффициент Ku, при котором начинаются незатухающие колебания, и их период Pu, а затем по табличным формулам, например Kp равно 0.6Ku, Ti равно Pu делить на 2, Td равно Pu делить на 8 для ПИД, получают коэффициенты; L и T относятся к первому методу. (Ogata, гл. 8; Nise, гл. 9)", "usage": {"code": false, "without": "Не зная метода, инженер боится довести контур до колебаний и настраивает регулятор консервативно, теряя быстродействие.", "with": "Контролируемо доведя контур до границы устойчивости, он измеряет Ku и Pu и по таблице сразу получает рабочую настройку ПИД.", "benefit": "Даёт воспроизводимую процедуру настройки без разомкнутого испытания объекта."}}, {"q": "Робот-манипулятор должен удерживать заданный угол сустава с нулевой установившейся ошибкой под постоянной гравитационной нагрузкой, при этом умеренное перерегулирование допустимо и требований к дополнительному демпфированию нет. Какая минимальная структура регулятора закроет это требование?", "options": ["PD-регулятор с фильтром в канале производной", "ПИД-регулятор с ограничением интегратора", "P-регулятор с повышенным коэффициентом усиления", "PI-регулятор без дифференциальной составляющей"], "correct": 3, "explain": "Постоянная нагрузка создаёт установившуюся ошибку, которую устраняет только интегральная составляющая; раз перерегулирование допустимо и требований к демпфированию нет, дифференциальная часть не нужна, поэтому минимальная структура — PI. (labT5-lab.txt, сравнение P-only и PID под постоянной нагрузкой)", "usage": {"code": false, "without": "Не разобравшись, какой член убирает ошибку, инженер сразу ставит полный ПИД там, где D лишь усиливает шум без пользы.", "with": "Зная, что нулевую ошибку даёт именно I, инженер выбирает PI и экономит время настройки, снижая чувствительность к шуму.", "benefit": "Меньше лишних параметров и шума в контуре при том же качестве по требованию."}}, {"q": "Сустав с малой инерцией должен быстро выходить на новое положение и не перерегулировать, постоянная нагрузка на него практически отсутствует, но энкодер даёт заметный шум измерения. Какую структуру регулятора логично выбрать в первую очередь?", "options": ["P-регулятор с повышенным коэффициентом усиления", "PD-регулятор с фильтром в канале производной", "ПИД-регулятор с ограничением интегратора", "PI-регулятор без дифференциальной составляющей"], "correct": 1, "explain": "Без постоянной нагрузки интегральная часть не нужна, а требование к демпфированию перерегулирования решает дифференциальная составляющая; фильтр в канале производной нужен именно из-за шума энкодера. (Ogata, Modern Control Engineering, гл. 8, роль P и D)", "usage": {"code": false, "without": "Без учёта шума инженер ставит чистый PD и получает дёрганый момент двигателя из-за усиленного шума производной.", "with": "Понимая источник проблемы, инженер сразу закладывает фильтр производной вместе с PD и получает гладкое быстрое движение.", "benefit": "Меньше итераций настройки и меньше износа привода от шумного момента."}}, {"q": "Сустав манипулятора должен быстро выходить на угол, почти не перерегулировать и держать нулевую ошибку под нагрузкой, которая меняется в течение рабочего цикла. Какая структура регулятора нужна, чтобы закрыть все три требования сразу?", "options": ["P-регулятор с повышенным коэффициентом усиления", "PD-регулятор с фильтром в канале производной", "ПИД-регулятор с ограничением интегратора", "PI-регулятор без дифференциальной составляющей"], "correct": 2, "explain": "Быстрый отклик и низкое перерегулирование требуют дифференциальной составляющей, а нулевая ошибка под переменной нагрузкой — интегральной; вместе это даёт полный ПИД, а интегратор стоит ограничить от намотки. (labT5-lab.txt, Part 2 — проектирование полного PID под нагрузку)", "usage": {"code": false, "without": "Без полного ПИД инженер жертвует либо скоростью, либо точностью под нагрузкой и потом гадает, почему сустав плывёт.", "with": "Заранее понимая, что нужны все три требования, инженер сразу закладывает ПИД с ограничением интегратора и не переделывает контур позже.", "benefit": "Один правильный выбор структуры вместо нескольких циклов переделки."}}, {"q": "Испытывать реальный сустав на границе устойчивости запрещено правилами безопасности лаборатории, но подать ступеньку на разомкнутый привод и записать кривую разгона можно. Какой метод настройки PID соответствует этим доступным данным?", "options": ["Метод Циглер-Николса по кривой разгона разомкнутого объекта", "Размещение полюсов замкнутого контура по точной модели", "Релейная автонастройка коэффициентов на замкнутом контуре", "Метод Циглер-Николса по критическому коэффициенту усиления"], "correct": 0, "explain": "Метод по критическому коэффициенту и релейная автонастройка требуют доводить замкнутый контур до колебаний, что запрещено; при доступной только открытой кривой разгона подходит метод Циглер-Николса по параметрам этой кривой. (Ogata, Modern Control Engineering, гл. 8, методы Циглер-Николса)", "usage": {"code": false, "without": "Не разобравшись в ограничении, инженер выбирает метод по критическому усилению и рискует довести привод до опасных колебаний.", "with": "Зная, какие данные разрешено собирать, инженер сразу выбирает метод по кривой разгона и укладывается в требования безопасности.", "benefit": "Настройка без риска для оборудования и без нарушения регламента лаборатории."}}, {"q": "Передаточная функция сустава уже точно получена аналитически по параметрам двигателя, редуктора и нагрузки, как в предыдущей лабораторной работе. Какой подход к расчёту коэффициентов PID предпочтительнее эмпирических таблиц Циглер-Николса?", "options": ["Метод Циглер-Николса по критическому коэффициенту усиления", "Метод Циглер-Николса по кривой разгона разомкнутого объекта", "Релейная автонастройка коэффициентов на замкнутом контуре", "Размещение полюсов замкнутого контура по точной модели"], "correct": 3, "explain": "Эмпирические методы Циглер-Николса и релейная автонастройка нужны именно тогда, когда точной модели нет; при известной передаточной функции коэффициенты PID выгоднее получить размещением полюсов замкнутого контура в желаемые точки. (labT5-lab.txt, Part 2 — проектирование PID методом размещения полюсов)", "usage": {"code": false, "without": "Не используя известную модель, инженер тратит время на экспериментальную раскачку контура, хотя все параметры объекта уже посчитаны.", "with": "Используя готовую передаточную функцию, инженер сразу размещает полюса в нужных точках и проверяет результат расчётом.", "benefit": "Меньше экспериментов на реальном оборудовании и предсказуемый результат настройки."}}, {"q": "В каскадной схеме привода сустава внутренний контур тока или скорости и внешний контур положения работают вместе. Какое требование к динамике внутреннего контура нужно выполнить, чтобы каскад работал правильно?", "options": ["Внутренний контур должен работать только на постоянном токе", "Внутренний контур должен быть заметно быстрее внешнего контура", "Внутренний контур должен быть заметно медленнее внешнего контура", "Оба контура должны иметь совершенно одинаковую полосу пропускания"], "correct": 1, "explain": "Каскад работает корректно, только если внутренний контур успевает отработать свою задачу намного быстрее, чем меняется задание от внешнего контура, иначе внешний контур видит внутренний как медленное искажённое звено. (Siciliano et al., Robotics, гл. 8, каскадное управление приводом)", "usage": {"code": false, "without": "Настроив контуры с близкой полосой пропускания, инженер получает взаимные колебания и не может разогнать внешний контур.", "with": "Заложив внутренний контур в разы быстрее внешнего, инженер получает предсказуемый каскад без взаимных колебаний.", "benefit": "Устойчивый и быстрый внешний контур положения без переделки после первого включения."}}, {"q": "Зачем в приводе сустава контур тока или скорости делают внутренним, а контур положения — внешним, а не наоборот?", "options": ["Внутренний контур убирает саму необходимость измерять положение", "Контур положения не способен физически измерять ток привода", "Внутренний контур держит ток в пределах и гасит возмущения раньше", "Внешний контур точнее внутреннего контура по самому построению"], "correct": 2, "explain": "Внутренний контур тока или скорости работает быстрее всего и напрямую держит ток или скорость в физических пределах привода, гася возмущения и нелинейности раньше, чем они попадут во внешний контур положения. (Siciliano et al., Robotics, гл. 8, структура каскадного привода)", "usage": {"code": false, "without": "Поставив контур положения самым внутренним, инженер теряет прямой доступ к ограничению тока и рискует повредить привод при перегрузке.", "with": "Сделав контур тока внутренним, инженер напрямую держит ток в безопасных пределах независимо от внешнего контура.", "benefit": "Защита привода от перегрузки на самом быстром и самом близком к железу уровне."}}, {"q": "Сустав должен точно отслеживать быстро меняющуюся траекторию, но дальнейшее повышение коэффициентов обратной связи недопустимо: оно приближает контур к границе устойчивости. Что добавить в контур, чтобы уменьшить отставание от траектории, не трогая запасы устойчивости?", "options": ["Прямую связь по скорости и ускорению заданной траектории", "Более высокую частоту дискретизации того же регулятора", "Дифференциальную составляющую с более высоким коэффициентом", "Второй интегратор в обратной связи для того же сигнала ошибки"], "correct": 0, "explain": "Прямая связь по заданию считается по желаемой траектории и подаётся мимо контура обратной связи, поэтому уменьшает ошибку слежения, не меняя коэффициенты и, значит, не трогая полюсы и запасы устойчивости замкнутого контура. (Astrom and Murray, Feedback Systems, гл. 10, feedforward по заданию)", "usage": {"code": false, "without": "Пытаясь угнаться за траекторией только обратной связью, инженер поднимает коэффициенты и подводит контур к границе устойчивости.", "with": "Добавив прямую связь по скорости и ускорению траектории, инженер убирает отставание, оставляя коэффициенты обратной связи прежними.", "benefit": "Точное слежение за траекторией без риска для устойчивости контура."}}, {"q": "Сустав манипулятора держит груз в фиксированной позе, и момент от силы тяжести в этой позе заранее известен и хорошо считается по модели руки. Как использовать это знание, чтобы разгрузить интегральную составляющую регулятора?", "options": ["Увеличить коэффициент интегральной составляющей в несколько раз", "Отключить интегральную составляющую совсем на время удержания позы", "Увеличить коэффициент дифференциальной составляющей для той же позы", "Подать расчётный момент тяжести прямой связью на регулятор"], "correct": 3, "explain": "Если возмущение известно заранее, его компенсируют прямой связью, добавляя расчётный момент силы тяжести к выходу регулятора; тогда интегральной составляющей почти нечего накапливать и риск её намотки снижается. (Siciliano et al., Robotics, гл. 8, компенсация силы тяжести)", "usage": {"code": false, "without": "Без компенсации силы тяжести интегратору приходится долго накапливать сигнал, пока просадка угла не исчезнет.", "with": "Подав известный момент силы тяжести напрямую, инженер снимает основную нагрузку с интегратора и получает быстрое удержание позы.", "benefit": "Быстрое устранение статической просадки без риска намотки интегратора."}}, {"q": "В контуре сустава интегральная составляющая продолжает расти, пока привод уже упёрся в свой предел момента и физически не может выдать больше. Что нужно сделать с регулятором, чтобы это не приводило к затяжному перерегулированию после снятия ограничения?", "options": ["Снизить частоту опроса датчика положения при насыщении", "Добавить схему anti-windup, останавливающую интегратор при насыщении", "Увеличить коэффициент интегральной составляющей регулятора", "Убрать дифференциальную составляющую регулятора при насыщении"], "correct": 1, "explain": "Пока выход регулятора превышает физический предел привода, интегратор продолжает накапливать ошибку впустую; anti-windup, например back-calculation, останавливает или уменьшает это накопление, пока привод в насыщении, убирая затяжной выброс после выхода из него. (Astrom and Murray, Feedback Systems, гл. 10, anti-windup)", "usage": {"code": false, "without": "Без anti-windup сустав ещё долго перерегулирует после того, как привод вышел из насыщения, потому что интегратор успел накопить лишнее.", "with": "С anti-windup интегратор перестаёт расти, пока привод насыщен, и сустав возвращается к заданному углу без лишнего выброса.", "benefit": "Предсказуемое поведение сустава сразу после снятия ограничения привода."}}, {"q": "После скачка задания сустав быстро приходит к цели, но переходная характеристика показывает заметные колебания вокруг уставки перед тем как успокоиться, статической ошибки нет. Какое изменение регулятора вероятнее всего погасит эти колебания, не увеличивая сильно время выхода на уставку?", "options": ["Увеличить дифференциальную составляющую, чтобы гасить колебания", "Уменьшить пропорциональную составляющую, чтобы снизить общее усиление контура", "Увеличить пропорциональную составляющую, чтобы ускорить реакцию контура", "Увеличить интегральную составляющую, чтобы быстрее убрать оставшуюся ошибку"], "correct": 0, "explain": "Колебания при уже нулевой статической ошибке указывают на недостаточное демпфирование, а не на нехватку усиления или интегратора; рост дифференциальной составляющей гасит быстрые изменения ошибки и снижает перерегулирование, тогда как рост P или I только усилит колебательность (Ogata, гл. 8).", "usage": {"code": false, "without": "Без этого диагностического шага инженер наугад крутит все три коэффициента и рискует одновременно испортить статическую точность и раскачать контур ещё сильнее.", "with": "Понимая, что колебания без ошибки лечит именно D, инженер меняет один коэффициент и быстро проверяет результат на новой переходной характеристике.", "benefit": "Быстрая и точная донастройка регулятора без побочных эффектов."}}, {"q": "После скачка задания сустав быстро выходит на новое положение без колебаний, но под собственным весом звена останавливается чуть ниже команды, и дальше эта ошибка не уменьшается сколько бы регулятор ни работал. Какой член регулятора нужно ввести или увеличить, чтобы устранить именно эту остаточную ошибку?", "options": ["Дифференциальную составляющую, так как она реагирует на постоянную нагрузку", "Пропорциональную составляющую, так как она отвечает за скорость реакции", "Фильтр производной, так как он подавляет высокочастотный шум датчика", "Интегральную составляющую, так как она одна накапливает постоянную ошибку"], "correct": 3, "explain": "Постоянная нагрузка вроде момента от силы тяжести создаёт постоянную ошибку, которую компенсирует только накапливающийся интегральный член; D реагирует лишь на изменение ошибки и на установившемся участке равен нулю, поэтому не убирает статический сдвиг (labT5-lab.txt, Step 5).", "usage": {"code": false, "without": "Инженер добавляет дифференциальную составляющую, слышал что она подтягивает точность, и сустав продолжает провисать под нагрузкой.", "with": "Зная, что за установившуюся ошибку от постоянного момента отвечает только I, инженер сразу вводит интегратор и ошибка исчезает.", "benefit": "Правильный выбор члена регулятора с первой попытки вместо перебора."}}, {"q": "Переходная характеристика сустава после скачка задания подходит к уставке медленно и монотонно, без единого намёка на колебания, и в итоге останавливается точно на заданном угле. Время выхода на уставку намного больше желаемого. Какой член регулятора стоит увеличить в первую очередь, чтобы ускорить отклик?", "options": ["Время выборки регулятора, чтобы реже пересчитывать управляющий сигнал", "Пропорциональную составляющую, чтобы поднять общее усиление контура", "Интегральную составляющую, чтобы окончательно убрать статическую ошибку", "Дифференциальную составляющую, чтобы сильнее демпфировать переходный процесс"], "correct": 1, "explain": "Отклик без колебаний и без статической ошибки, но слишком медленный, указывает на невысокое усиление контура; увеличение пропорциональной составляющей поднимает быстродействие, тогда как интегральная и дифференциальная составляющие уже делают свою работу и их усиление лишь добавит риск колебаний или дополнительно замедлит систему (Ogata, гл. 8).", "usage": {"code": false, "without": "Инженер сразу добавляет дифференциальную составляющую, думая что она ускорит отклик, и сустав становится ещё медленнее.", "with": "Понимая, что медленный без колебаний отклик лечится усилением P, инженер поднимает именно его, и сустав быстрее выходит на уставку.", "benefit": "Быстродействие растёт без риска новых колебаний."}}, {"q": "Привод сустава ограничен максимальным моментом. После большого скачка задания контур выходит на предел привода, а после того как ошибка меняет знак, сустав ещё долго проскакивает уставку с большим перерегулированием, прежде чем вернуться и успокоиться. Какой эффект это описывает?", "options": ["Алиасинг сигнала ошибки из-за слишком низкой частоты дискретизации", "Механический резонанс редуктора сустава на его собственной частоте", "Интегральный windup — интегратор копится, пока привод в насыщении", "Температурный дрейф нуля датчика положения после долгой работы"], "correct": 2, "explain": "Когда привод насыщен, реальный момент перестаёт расти вместе с выходом регулятора, а интегральная составляющая тем не менее продолжает копить ошибку; после смены знака ошибки эта накопленная сумма разряжается не сразу, отсюда большой заброс за уставку — классический integrator windup (Ogata, гл. 8).", "usage": {"code": false, "without": "Инженер видит большой заброс после насыщения привода и начинает уменьшать все три коэффициента, ухудшая быстродействие во всём остальном диапазоне.", "with": "Опознав windup по характерной форме отклика, инженер добавляет ограничение интегратора именно на время насыщения, не трогая остальную настройку.", "benefit": "Заброс после насыщения устраняется без потери быстродействия в норме."}}, {"q": "Контур сустава страдает от интегрального windup при насыщении привода. Какое изменение регулятора устраняет именно эту проблему, не отказываясь от интегральной составляющей вовсе?", "options": ["Остановить накопление интегратора, пока выход регулятора находится в насыщении", "Заменить датчик положения сустава на энкодер более высокого разрешения", "Увеличить дифференциальную составляющую, чтобы компенсировать задержку привода", "Снизить частоту дискретизации регулятора, чтобы реже пересчитывать интеграл"], "correct": 0, "explain": "Anti-windup останавливает или обратно пересчитывает накопление интегратора именно тогда, когда привод не может отработать требуемый сигнал, поэтому ошибка не копится впустую и контур быстро возвращается в линейный режим после насыщения (Astrom & Murray, гл. 10).", "usage": {"code": false, "without": "Без anti-windup инженер либо терпит большие забросы, либо убирает интегратор и получает статическую ошибку под нагрузкой.", "with": "С anti-windup остаётся точность интегратора в норме и нет лишнего заброса после насыщения.", "benefit": "Контур одновременно точен в установившемся режиме и предсказуем при ограничениях привода."}}, {"q": "Сустав робота приводится сильно редуцированным двигателем и должен точно держать положение, несмотря на резкие изменения нагрузки на выходном валу. Почему для такого привода обычно выбирают каскадную структуру с внутренним контуром тока или скорости и внешним контуром положения, а не один PID сразу по положению?", "options": ["Каскадная структура убирает необходимость в интегральной составляющей у внешнего контура", "Каскадная структура снижает требования к точности внешнего датчика положения", "Регулятор положения физически невозможно реализовать на редукторном приводе", "Внутренний контур быстро гасит возмущения момента до того как они сдвинут положение"], "correct": 3, "explain": "Быстрый внутренний контур тока или скорости отрабатывает возмущения момента и нелинейности привода в масштабе времени, недоступном медленному внешнему контуру положения, поэтому внешнему контуру остаётся справляться только со сглаженной, уже скорректированной динамикой (Siciliano, гл. 8).", "usage": {"code": false, "without": "Один PID по положению на сильно редуцированном приводе либо слишком медленный против возмущений момента, либо неустойчив на высоком усилении.", "with": "Каскад с быстрым внутренним контуром тока гасит возмущения момента, а внешний контур положения остаётся простым и устойчивым.", "benefit": "Сустав держит положение точно и устойчиво даже при резких изменениях нагрузки."}}, {"q": "При настройке каскадного регулятора сустава инженер настроил внешний контур положения на такую же полосу пропускания, что и внутренний контур скорости. К чему это скорее всего приведёт?", "options": ["Привод будет расходовать заметно меньше энергии на удержание позиции", "Контуры начнут раскачивать друг друга вместо чёткого разделения по скорости", "Контур станет точнее, так как оба контура реагируют с одинаковой скоростью", "У контура появится дополнительная статическая ошибка по положению"], "correct": 1, "explain": "Каскад работает корректно, когда внутренний контур намного быстрее внешнего, так что для внешнего контура внутренний выглядит почти мгновенным звеном; при равных полосах эта развязка по времени исчезает, и контуры начинают взаимно возмущать друг друга вплоть до колебаний (Franklin, Powell, Emami-Naeini, гл. 10).", "usage": {"code": false, "without": "Инженер настраивает оба контура на одну полосу, получает необъяснимые колебания и начинает менять коэффициенты вслепую.", "with": "Зная правило разноса полос, инженер сразу делает внутренний контур в разы быстрее внешнего, и колебания пропадают.", "benefit": "Каскад работает предсказуемо с первой настройки."}}, {"q": "Сустав манипулятора держит горизонтальное положение против постоянного момента силы тяжести. Регулятор уже включает интегральную составляющую, которая полностью убирает статическую ошибку, но инженер всё равно добавляет прямую связь по модели гравитационного момента до контура обратной связи. Зачем это делать, если I и так убирает ошибку?", "options": ["Прямая связь снижает требуемую разрядность цифро-аналогового преобразователя", "Прямая связь полностью заменяет контур обратной связи, и интегратор становится не нужен", "Прямая связь берёт нагрузку на себя, оставляя интегратору лишь небольшую невязку модели", "Прямая связь снижает требуемую частоту опроса датчика положения сустава"], "correct": 2, "explain": "Компенсация известной по модели гравитационной нагрузки напрямую в сигнале управления снимает с интегратора основную часть работы, оставляя ему лишь неточности модели; это ускоряет выход на режим и снижает риск насыщения привода и windup, тогда как один I справляется медленнее и целиком зависит от накопления ошибки (Siciliano, гл. 8).", "usage": {"code": false, "without": "Инженер полагается только на интегратор, и сустав медленно ползёт к нужному углу под нагрузкой, рискуя насытить привод при резких движениях.", "with": "Добавив прямую связь по гравитации, инженер разгружает интегратор, и сустав быстро и точно держит угол даже при смене нагрузки.", "benefit": "Быстрая, точная и менее склонная к насыщению стабилизация сустава под нагрузкой."}}, {"q": "Инженер добавил прямую связь по расчётной гравитационной нагрузке сустава, но реальная масса захваченного инструмента заметно отличается от заложенной в модель. Что произойдёт в замкнутом контуре с обратной связью, включающей интегральную составляющую?", "options": ["Останется небольшая ошибка, которую уберёт интегральная составляющая", "Датчик положения начнёт выдавать заведомо неверные показания угла", "Контур станет заметно неустойчивым из-за противоречия прямой и обратной связи", "Сустав перестанет реагировать на любое новое задание положения"], "correct": 0, "explain": "Прямая связь по модели снимает основную, известную часть нагрузки, а любая оставшаяся из-за неточности модели невязка воспринимается контуром обратной связи как обычное возмущение и убирается интегральной составляющей так же, как убиралась вся нагрузка без прямой связи, только быстрее и с меньшим забросом (Siciliano, гл. 8).", "usage": {"code": false, "without": "Инженер боится ошибки модели и отказывается от прямой связи вовсе, теряя весь выигрыш в быстродействии.", "with": "Понимая, что обратная связь подчистит остаточную ошибку модели, инженер спокойно использует приближённую модель гравитации.", "benefit": "Прямая связь применяется без риска, даже если модель нагрузки не идеальна."}}, {"q": "Для сустава есть точная модель двигателя и редуктора, полученная из паспортных данных и проверенная экспериментом. Для другого, старого привода без документации модель неизвестна и получить её экспериментально сложно. Какой подход к настройке PID разумно применить к каждому из них?", "options": ["Для обоих приводов подойдут только экспериментальные правила Циглера-Николса, модель не нужна", "Для сустава с моделью — правила Циглера-Николса, для привода без модели — расчёт по полюсам", "Для обоих приводов — расчёт по полюсам, отсутствие модели заменяют оценкой на глаз", "Для сустава с моделью — расчёт по полюсам, а без модели — правила Циглера-Николса"], "correct": 3, "explain": "Когда модель объекта известна и проверена, расчёт коэффициентов через размещение полюсов даёт предсказуемый и проверяемый результат; когда модели нет и получить её трудно, экспериментальные правила Циглера-Николса настраивают регулятор прямо по отклику реального объекта без необходимости в передаточной функции (labT5-lab.txt, стр. 979-981).", "usage": {"code": false, "without": "Инженер пытается разместить полюса для привода, модель которого никто не измерял, и получает регулятор, рассчитанный для несуществующего объекта.", "with": "Понимая, когда какой метод уместен, инженер применяет расчёт по полюсам там, где есть модель, и Циглера-Николса там, где её нет.", "benefit": "Каждый привод настраивается методом, для которого хватает исходных данных."}}, {"q": "Методом continuous cycling для объекта сняли ultimate gain Ku=12 и ultimate period Tu=3 с. По правилу Циглера-Николса для полного ПИД-регулятора Kp=0.6·Ku. Чему равен Kp?", "options": ["Kp = 5.4", "Kp = 8.4", "Kp = 7.2", "Kp = 6.0"], "correct": 2, "explain": "Шаг 1: для строки ПИД в таблице Циглера-Николса коэффициент при Ku равен 0.6, а не 0.5 как для P-режима и не 0.45 как для PI-режима. Шаг 2: Kp=0.6·12=7.2. Дистракторы 6.0 и 5.4 получаются при использовании коэффициентов другого режима, 8.4 - при ошибочном коэффициенте 0.7. Источник: labT5-lab.txt, Ogata гл. 10.", "usage": {"code": false, "without": "Инженер берёт первый попавшийся коэффициент из памяти и настраивает контур на P-режим вместо полного ПИД, получая вялую реакцию сустава манипулятора.", "with": "Он verно выбирает строку таблицы под нужный тип регулятора и сразу получает рабочий Kp для дальнейшей настройки Ti и Td.", "benefit": "Настройка ПИД с первой попытки без лишних циклов автонастройки."}}, {"q": "Для Ku=8 и Tu=4 с по Циглеру-Николсу получили Kp=0.6·8=4.8 и Ti=0.5·4=2 с. Интегральный коэффициент считается как Ki=Kp/Ti. Чему равен Ki?", "options": ["Ki = 2.4", "Ki = 1.2", "Ki = 0.42", "Ki = 9.6"], "correct": 0, "explain": "Шаг 1: Ti=0.5·Tu=0.5·4=2 с. Шаг 2: Ki=Kp/Ti=4.8/2=2.4. Дистрактор 9.6 - от перемножения Kp·Ti вместо деления, 1.2 - от подстановки Tu вместо Ti, 0.42 - от перевёрнутой дроби Ti/Kp. Источник: labT5-lab.txt, Ogata гл. 10.", "usage": {"code": false, "without": "Перепутав деление и умножение, техник закладывает в привод интегральный коэффициент на порядок больше нужного и контур начинает раскачиваться.", "with": "Формула Ki=Kp/Ti применяется напрямую после расчёта Ti, и итоговый коэффициент сразу попадает в рабочий диапазон.", "benefit": "Стабильный контур без ручного подбора Ki методом проб."}}, {"q": "Для Ku=15 и Tu=2.4 с получили Kp=0.6·15=9 и Td=0.125·2.4=0.3 с. Дифференциальный коэффициент считается как Kd=Kp·Td. Чему равен Kd?", "options": ["Kd = 30.0", "Kd = 5.4", "Kd = 21.6", "Kd = 2.7"], "correct": 3, "explain": "Шаг 1: Td=0.125·Tu=0.125·2.4=0.3 с. Шаг 2: Kd=Kp·Td=9·0.3=2.7. Дистрактор 5.4 - от коэффициента 0.25 вместо 0.125 при расчёте Td, 21.6 - от подстановки Tu вместо Td, 30.0 - от деления Kp на Td вместо умножения. Источник: labT5-lab.txt, Ogata гл. 10.", "usage": {"code": false, "without": "Спутав деление с умножением, разработчик занижает демпфирующее действие D-звена и привод продолжает колебаться после остановки.", "with": "Kd вычисляется прямым произведением Kp и Td, и дифференциальное звено сразу гасит выброс скорости.", "benefit": "Меньше перерегулирование сустава без повторных экспериментов на стенде."}}, {"q": "Кривая разгона объекта дала запаздывание L=0.5 с и постоянную времени T=4 с. По методу Циглера-Николса для полного ПИД Kp=1.2·T/L. Чему равен Kp?", "options": ["Kp = 0.15", "Kp = 9.6", "Kp = 8.0", "Kp = 7.2"], "correct": 1, "explain": "Шаг 1: T/L=4/0.5=8. Шаг 2: Kp=1.2·8=9.6. Дистрактор 8.0 - результат без коэффициента 1.2, 7.2 - от коэффициента PI-режима 0.9 вместо 1.2, 0.15 - от перевёрнутого отношения L/T. Источник: labT5-lab.txt, Ogata гл. 10.", "usage": {"code": false, "without": "Забыв множитель 1.2, инженер занижает Kp и мобильный робот медленно доезжает до заданной точки с большой статической ошибкой.", "with": "Полная формула 1.2·T/L применяется сразу по данным кривой разгона без повторного эксперимента.", "benefit": "Требуемая скорость отработки задания достигается с первой настройки."}}, {"q": "Для L=0.8 с и T=6 с получили Kp=1.2·6/0.8=9 и Ti=2·L=1.6 с. Чему равен Ki=Kp/Ti?", "options": ["Ki = 0.18", "Ki = 11.25", "Ki = 5.63", "Ki = 14.4"], "correct": 2, "explain": "Шаг 1: Ti=2·0.8=1.6 с. Шаг 2: Ki=9/1.6=5.63. Дистрактор 14.4 - от умножения Kp на Ti вместо деления, 0.18 - от перевёрнутой дроби Ti/Kp, 11.25 - от подстановки L вместо Ti. Источник: labT5-lab.txt, Ogata гл. 10.", "usage": {"code": false, "without": "При перевёрнутой формуле интегральное действие получается почти нулевым и накопленная ошибка энкодера так и не устраняется.", "with": "Ki считается прямым делением Kp на верно найденный Ti, и статическая ошибка гриппера исчезает за пару секунд.", "benefit": "Точное позиционирование без остаточного смещения."}}, {"q": "Объект G(s) = 2/(s+4) охвачен единичной обратной связью через П-регулятор с Kp=8. Статическая ошибка на единичный ступенчатый сигнал равна e_ss=1/(1+Kp·G(0)), где G(0) - значение объекта на нулевой частоте. Чему равна e_ss?", "options": ["e_ss = 0.20", "e_ss = 0.06", "e_ss = 0.25", "e_ss = 0.11"], "correct": 0, "explain": "Шаг 1: G(0)=2/4=0.5. Шаг 2: Kp·G(0)=8·0.5=4. Шаг 3: e_ss=1/(1+4)=0.20. Дистрактор 0.11 получается при использовании e_ss=1/(1+Kp) без учёта G(0), 0.06 - при ошибочном G(0)=2, 0.25 - при пропуске единицы в знаменателе. Источник: Ogata, гл. 5.", "usage": {"code": false, "without": "Забыв учесть G(0) объекта, инженер считает ошибку заниженной и не закладывает интегральное звено там, где оно нужно.", "with": "Полная формула с G(0) сразу показывает реальную статическую ошибку П-регулятора и необходимость перехода на ПИ.", "benefit": "Верный выбор структуры регулятора до этапа стендовых испытаний."}}, {"q": "Тот же объект G(s) = 2/(s+4) регулируется ПИ-регулятором с Kp=8 и Ki=3 в контуре с единичной обратной связью, замкнутый контур устойчив. Чему равна установившаяся ошибка на единичный ступенчатый сигнал?", "options": ["e_ss = 0.06", "e_ss = 0.20", "e_ss = 0.11", "e_ss = 0.00"], "correct": 3, "explain": "Шаг 1: контур с ПИ содержит полюс в нуле, то есть становится системой типа 1 по отношению к ступенчатому входу. Шаг 2: для устойчивой системы типа 1 e_ss=0 независимо от значений Kp и Ki. Дистракторы 0.20, 0.11 и 0.06 переносят ненулевую ошибку П-режима, забывая эффект интегратора. Источник: Ogata, гл. 5.", "usage": {"code": false, "without": "Считая, что ошибка П-режима из прошлой задачи сохраняется, инженер зря добавляет феедфорвард там, где интегратор уже всё скомпенсировал.", "with": "Понимание, что интегратор обнуляет статическую ошибку на ступенчатый сигнал, экономит лишнюю компенсацию.", "benefit": "Более простая и предсказуемая схема регулятора без избыточных звеньев."}}, {"q": "Объект 1/(s(s+a)) с a=6 находится в контуре с единичной обратной связью и П-регулятором Kp=9. Характеристическое уравнение s^2+a·s+Kp=0 принимает вид s^2+6s+9=0. Каковы полюса замкнутой системы?", "options": ["s = -1.5, -4.5", "s = -3.0, -3.0", "s = -3.0 ± j3.0", "s = -6.0, 0.0"], "correct": 1, "explain": "Шаг 1: дискриминант D=a^2-4Kp=36-36=0. Шаг 2: при нулевом дискриминанте корни вещественные и совпадают: s=-a/2=-3.0 дважды - система критически демпфирована. Дистрактор с ±j3.0 предполагает ошибочно отрицательный дискриминант, -6.0 и 0.0 получаются при игнорировании слагаемого Kp, -1.5 и -4.5 - при неверном разложении на множители. Источник: Ogata, гл. 4-5.", "usage": {"code": false, "without": "Приняв систему за колебательную, инженер закладывает лишний запас по перерегулированию там, где отклик и так апериодический.", "with": "Проверка дискриминанта сразу показывает критическое демпфирование и позволяет упростить последующий анализ переходного процесса.", "benefit": "Точный прогноз формы переходного процесса без моделирования."}}, {"q": "Объект 1/(s(s+a)) с a=8 регулируется П-регулятором в контуре с единичной обратной связью, требуемый коэффициент демпфирования зета=0.5. По формуле Kp=a^2/4·зета^2 чему равен требуемый Kp?", "options": ["Kp = 16.0", "Kp = 32.0", "Kp = 64.0", "Kp = 128.0"], "correct": 2, "explain": "Шаг 1: a^2=64, 4·зета^2=4·0.25=1. Шаг 2: Kp=64/1=64.0. Дистрактор 32.0 получается при пропуске квадрата у зета, 128.0 - при знаменателе 2·зета^2 вместо 4·зета^2, 16.0 - при подстановке зета=1 вместо заданного 0.5. Источник: Ogata, гл. 4-5.", "usage": {"code": false, "without": "Забыв квадрат зета в формуле, инженер закладывает вдвое заниженный Kp и сустав реагирует на команды медленнее расчётного.", "with": "Прямая подстановка a и зета в формулу сразу даёт нужный Kp под заданное демпфирование без итераций на стенде.", "benefit": "Требуемый переходный процесс достигается с первой настройки регулятора."}}, {"q": "Звено манипулятора несёт точечную массу m=2 кг на плече l=0.5 м, угол от горизонтали тета=60 градусов, g=9.8 м/с². По формуле feedforward-момента гравитации тау=m·g·l·cos тета чему равен требуемый момент?", "options": ["тау = 4.9 Н·м", "тау = 5.0 Н·м", "тау = 9.8 Н·м", "тау = 8.5 Н·м"], "correct": 0, "explain": "Шаг 1: m·g=2·9.8=19.6. Шаг 2: 19.6·l=19.6·0.5=9.8. Шаг 3: 9.8·cos60=9.8·0.5=4.9 Н·м. Дистрактор 9.8 получается при пропуске множителя cos тета, 8.5 - при подстановке sin вместо cos, 5.0 - при округлении g до 10. Источник: Siciliano, гл. 7.", "usage": {"code": false, "without": "Без cos тета в формуле feedforward занижает или завышает момент при разных углах, и сустав проседает под собственным весом груза.", "with": "Момент гравитации пересчитывается по текущему углу перед каждым шагом, и ПИД-регулятору остаётся компенсировать только динамическую ошибку.", "benefit": "Меньшая нагрузка на интегральное звено и более плавное движение звена."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
