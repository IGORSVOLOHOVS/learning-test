<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RCF 6: Цифровое управление: дискретизация, z-область, частота выборки</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>RCF 6: Цифровое управление: дискретизация, z-область, частота выборки</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../sync.js"></script>
<script>
(function () {

  const QUESTIONS = [{"q": "Какую функцию выполняет аналого-цифровой преобразователь на входе цифрового регулятора?", "options": ["Удерживает выход регулятора постоянным между двумя соседними тактами дискретизации", "Вычисляет разностное уравнение регулятора по прошлым отсчётам ошибки", "Превращает непрерывный сигнал датчика в цифровые отсчёты через равные интервалы времени", "Превращает цифровой код регулятора в ступенчатый непрерывный сигнал для привода"], "correct": 2, "explain": "Верно 0: АЦП дискретизирует непрерывный сигнал датчика по времени и уровню на входе цифрового регулятора. Вариант 1 описывает ЦАП, вариант 2 — ZOH, вариант 3 — работу самого регулятора. (Franklin-Powell, гл. 8)", "usage": {"code": false, "without": "Без понимания роли АЦП инженер может считать, что регулятор работает с тем же непрерывным сигналом, что и датчик, и не учтёт эффект квантования по времени.", "with": "Зная функцию АЦП, инженер закладывает частоту опроса датчика с запасом ещё на этапе выбора микроконтроллера.", "benefit": "Корректный выбор частоты дискретизации без последующей переделки платы."}}, {"q": "Какую функцию выполняет цифро-аналоговый преобразователь на выходе цифрового регулятора?", "options": ["Превращает цифровой код управления в непрерывный электрический сигнал", "Вычисляет z-преобразование выходной последовательности регулятора", "Ограничивает частоту сигнала перед его дискретизацией во избежание алиасинга", "Дискретизирует сигнал датчика по времени перед подачей в регулятор"], "correct": 0, "explain": "Верно 1: ЦАП переводит цифровой сигнал регулятора в аналоговую форму, которую понимает привод объекта. Вариант 0 описывает АЦП, вариант 2 — математическую операцию, а не аппаратный блок, вариант 3 — работу антиалиасингового фильтра. (Ogata, гл. 13)", "usage": {"code": false, "without": "Без ЦАП цифровой код регулятора остаётся числом и не может напрямую подать напряжение на обмотку двигателя.", "with": "Понимая роль ЦАП, инженер закладывает в схему после него сглаживающий фильтр, а не подключает привод напрямую к шине данных.", "benefit": "Привод получает пригодный для работы аналоговый сигнал."}}, {"q": "Что делает экстраполятор нулевого порядка ZOH между двумя соседними отсчётами регулятора?", "options": ["Усредняет несколько последних отсчётов регулятора для сглаживания шума", "Линейно интерполирует сигнал между текущим и предыдущим отсчётом", "Обнуляет сигнал сразу после прихода нового отсчёта регулятора", "Удерживает значение последнего отсчёта постоянным до прихода следующего"], "correct": 3, "explain": "Верно 2: ZOH держит выход регулятора равным последнему цифровому отсчёту вплоть до следующего такта, формируя ступенчатый сигнал. Вариант 0 описывает экстраполятор первого порядка, варианты 1 и 3 не соответствуют определению ZOH. (Franklin-Powell, гл. 8)", "usage": {"code": false, "without": "Без понимания ZOH инженер ожидает на выходе ЦАП плавный сигнал и не понимает, откуда берётся ступенчатая форма напряжения на осциллографе.", "with": "Зная про ZOH, инженер закладывает в анализ дополнительный фазовый сдвиг от удержания при расчёте запасов устойчивости.", "benefit": "Верная оценка запаса по фазе с учётом реального сигнала на приводе."}}, {"q": "Что называют периодом дискретизации T в цифровой системе управления?", "options": ["Суммарное время работы цифрового регулятора между двумя перезапусками", "Интервал времени между двумя соседними моментами взятия отсчёта сигнала", "Время задержки сигнала в тракте АЦП и ЦАП вместе взятых", "Время, за которое переходный процесс объекта затухает до пяти процентов"], "correct": 1, "explain": "Верно 2: период дискретизации T — это фиксированный интервал между соседними отсчётами, обратный частоте дискретизации fs равно 1 делить на T. Остальные варианты описывают другие временные характеристики системы. (Ogata, гл. 13)", "usage": {"code": false, "without": "Без чёткого определения T инженер путает время квантования сигнала со временем переходного процесса объекта и неверно оценивает запас по частоте.", "with": "Зная определение T, инженер сразу связывает выбор частоты опроса датчика с полосой пропускания замкнутой системы.", "benefit": "Обоснованный выбор частоты дискретизации под конкретный объект."}}, {"q": "Что представляет собой z-преобразование дискретной последовательности отсчётов?", "options": ["Метод фильтрации высокочастотного шума из дискретизированного сигнала", "Алгоритм интерполяции пропущенных отсчётов между двумя измерениями", "Дискретный аналог преобразования Лапласа, дающий функцию переменной z", "Способ округления вещественных отсчётов сигнала до ближайшего целого числа"], "correct": 2, "explain": "Верно 0: z-преобразование — дискретный аналог преобразования Лапласа, оно переводит последовательность отсчётов x[k] в функцию X(z) комплексной переменной z, что удобно для анализа дискретных систем. Остальные варианты описывают операции цифровой обработки сигналов, не связанные с этим определением. (Ogata, гл. 13)", "usage": {"code": false, "without": "Без понятия z-преобразования инженер не может перенести привычный аппарат передаточных функций на цифровой регулятор и анализирует его только по шагам во временной области.", "with": "Владея z-преобразованием, инженер записывает передаточную функцию цифрового регулятора в переменной z и использует те же приёмы анализа, что и для непрерывных систем.", "benefit": "Перенос методов анализа передаточных функций на дискретные регуляторы."}}, {"q": "Как связаны переменная z z-преобразования и переменная s преобразования Лапласа при периоде дискретизации T?", "options": ["Соотношением z равно экспоненте в степени s умножить на T", "Соотношением z равно s, умноженному на квадрат периода T", "Соотношением z равно логарифму от s, делённого на период T", "Соотношением z равно s, делённому на период дискретизации T"], "correct": 0, "explain": "Верно 1: фундаментальное соотношение дискретизации связывает плоскости z и s как z равно e в степени sT, где T — период дискретизации. Остальные вариа , раздел о цифровой реализации регуляторов)", "usage": {"code": false, "without": "Без учёта этого следствия контур, идеально устойчивый на бумаге, начинает раскачиваться сразу после прошивки контроллера низкой частотой дискретизации.", "with": "Зная о потере запаса по фазе, инженер сразу закладывает более высокую частоту дискретизации и проверяет запас перед прошивкой контроллера.", "benefit": "Контур остаётся устойчивым и после перехода на цифровую реализацию."}}, {"q": "Частоту дискретизации контура скорости подняли намного выше значения, продиктованного шумом датчика и разрядностью вычислителя контроллера. Какая проблема вероятнее всего появится на практике?", "options": ["Снижение разрешения инкрементального энкодера из-за смены редуктора", "Появление статической ошибки по положению без смены типа системы", "Рост шума оценки скорости из-за дифференцирования почти одинаковых отсчётов", "Сужение полосы пропускания замкнутого контура без иных изменений"], "correct": 2, "explain": "При слишком высокой частоте дискретизации соседние отсчёты положения почти не отличаются, и вычисление скорости как разности отсчётов резко усиливает шум датчика, а вычислительная нагрузка растёт без выигрыша в качестве регулирования. Разрешение энкодера, тип системы и полоса пропускания от частоты дискретизации не зависят. (Siciliano et al., раздел об обработке сигналов энкодера)", "usage": {"code": false, "without": "Без понимания этого эффекта инженер гонится за максимальной частотой дискретизации и получает контур, дёргающийся из-за зашумлённой оценки скорости.", "with": "Зная о шуме дифференцирования, инженер выбирает частоту дискретизации умеренно выше полосы контура и дополнительно сглаживает оценку скорости.", "benefit": "Оценка скорости остаётся гладкой, а управляющее воздействие - плавным."}}, {"q": "При переводе аналогового ПИД-регулятора в цифровую форму методом Тастина частота среза контура смещается из-за деформации частотной оси, известной как warping. Как обычно устраняют эту проблему на практике?", "options": ["Вводят предыскажение частоты в билинейном преобразовании под частоту среза", "Заменяют интегральную часть регулятора чисто пропорциональной составляющей", "Отключают дифференциальную часть и переходят на чистый ПИ-закон управления", "Увеличивают коэффициент передачи датчика в контуре обратной связи регулятора"], "correct": 0, "explain": "Деформация частотной оси при билинейном преобразовании Тастина устраняется предыскажением, prewarping, когда критическую частоту заранее пересчитывают так, чтобы после преобразования она совпала с нужной частотой среза. Отключение составляющих ПИД или изменение усиления датчика проблему деформации оси не решают. (Franklin-Powell-Emami-Naeini, глава о цифровой реализации регуляторов)", "usage": {"code": false, "without": "Без предыскажения частота среза цифрового регулятора после преобразования Тастина оказывается смещена, и реальный запас по фазе не совпадает с расчётным.", "with": "С предыскажением инженер пересчитывает критическую частоту перед преобразованием и получает цифровой регулятор с ожидаемым запасом по фазе.", "benefit": "Частотные характеристики цифрового регулятора совпадают с расчётом аналогового прототипа."}}, {"q": "Разработчик переводит устойчивый непрерывный регулятор в цифровую форму и хочет гарантированно сохранить устойчивость дискретной реализации при разумном шаге дискретизации. Какой метод предпочтителен по сравнению с прямой разностью Эйлера?", "options": ["Метод удвоения периода дискретизации без пересчёта коэффициентов", "Метод округления коэффициентов регулятора до целых значений", "Метод прямой разности без изменений, он проще в реализации", "Метод ZOH-эквивалента, сохраняющий отображение полюсов s в z"], "correct": 3, "explain": "ZOH-эквивалент и связанные с ним методы, например преобразование Тастина, отображают устойчивые полюсы левой полуплоскости внутрь единичной окружности через связь z равно экспонента sT, тогда как прямая разность Эйлера может вывести полюс за пределы окружности при не слишком малом шаге. Округление коэффициентов и удвоение периода устойчивость не гарантируют. (Ogata, глава о дискретных системах управления)", "usage": {"code": false, "without": "Без выбора надёжного метода дискретизации регулятор, устойчивый в непрерывном виде, может стать неустойчивым в цифровой реализации при обычном шаге.", "with": "С методом ZOH-эквивалента инженер переносит устойчивость аналогового прототипа в цифровую реализацию без дополнительных проверок.", "benefit": "Дискретный регулятор наследует устойчивость непрерывного прототипа."}}, {"q": "Регулятор нужно реализовать разностным уравнением, устойчивым к выбору шага дискретизации, даже если шаг окажется больше желаемого. Какой метод аппроксимации производной предпочесть?", "options": ["Прямую разность вперёд, простую в программировании контроллера", "Обратную разность назад, устойчивую при любом шаге дискретизации", "Центральную разность, не использующую предыдущие отсчёты сигнала", "Произвольное усреднение двух последних отсчётов входного сигнала"], "correct": 1, "explain": "Обратная разность, backward difference, при любом положительном шаге дискретизации отображает устойчивую непрерывную систему в устойчивую дискретную, поскольку соответствующее отображение переводит всю левую полуплоскость внутрь единичной окружности. Прямая разность вперёд может нарушить устойчивость при слишком большом шаге. (Astrom & Murray, раздел об аппроксимации производной)", "usage": {"code": false, "without": "Без выбора устойчивого метода аппроксимации регулятор на медленном контроллере с крупным шагом может потерять устойчивость там, где расчёт этого не предсказывал.", "with": "С обратной разностью инженер получает запас надёжности даже при случайном увеличении шага дискретизации из-за загрузки процессора.", "benefit": "Реализация регулятора остаётся устойчивой при колебаниях фактического шага дискретизации."}}, {"q": "Проектировщик выбирает, куда поставить антиалиасинговый фильтр в цифровом контуре, использующем аналоговый датчик скорости. Какое решение соответствует общепринятой практике?", "options": ["Фильтр ставится после регулятора и перед цифро-аналоговым преобразователем сигнала", "Фильтр не нужен, если частота дискретизации выбрана достаточно высокой", "Аналоговый ФНЧ ставится перед АЦП с частотой среза ниже частоты Найквиста", "Цифровой ФНЧ ставится после АЦП и заменяет собой аналоговый фильтр"], "correct": 2, "explain": "Антиалиасинговый фильтр должен быть аналоговым и стоять перед АЦП, поскольку задача - подавить составляющие сигнала выше частоты Найквиста ещё до дискретизации; цифровой фильтр после АЦП уже не может убрать наложившиеся частоты. Высокая частота дискретизации снижает риск, но не отменяет необходимость фильтра при широкополосной помехе. (Franklin-Powell-Emami-Naeini, глава о цифровом управлении)", "usage": {"code": false, "without": "Без аналогового фильтра перед АЦП высокочастотная вибрация редуктора накладывается на полезный сигнал ещё до того, как цифровой фильтр успевает вмешаться.", "with": "С аналоговым фильтром перед АЦП высокочастотные помехи срезаются до дискретизации, и цифровая обработка получает чистый сигнал.", "benefit": "Наложение спектров устраняется до того, как оно попадает в цифровые данные."}}, {"q": "В контуре без антиалиасингового фильтра высокочастотная вибрация редуктора с частотой выше половины частоты дискретизации попадает в измерительный сигнал. Что произойдёт при дальнейшей цифровой обработке?", "options": ["Вибрация отразится в низкочастотную полосу и исказит полезный сигнал", "Вибрация сама сдвинет полюсы регулятора внутрь единичной окружности", "Вибрация повысит разрешение энкодера за счёт передискретизации сигнала", "Вибрация будет точно подавлена самим процессом дискретизации без потерь"], "correct": 0, "explain": "Составляющая сигнала выше половины частоты дискретизации при отсутствии антиалиасингового фильтра накладывается на низкочастотную часть спектра и становится неотличима от полезного сигнала, искажая измерение скорости. Дискретизация сама по себе ничего не подавляет и не влияет на полюсы регулятора или разрешение датчика. (Ogata, глава о дискретных системах управления)", "usage": {"code": false, "without": "Без фильтра вибрация редуктора маскируется под полезное изменение скорости, и регулятор реагирует на помеху как на реальное отклонение.", "with": "Зная об эффекте наложения, инженер ставит фильтр заранее и не тратит время на поиск мнимой низкочастотной помехи.", "benefit": "Измеренный сигнал скорости отражает реальное движение, а не наложенную помеху."}}, {"q": "Цифровой ПИД-регулятор сустава робота периодически насыщается, потому что привод не может отработать требуемый момент. Инженер выбирает между позиционной и скоростной формой реализации закона управления. Какое соображение говорит в пользу скоростной формы?", "options": ["Скоростная форма полностью исключает необходимость ограничения выхода регулятора", "Скоростная форма всегда точнее вычисляет статическую ошибку по положению", "Скоростная форма не требует хранения предыдущих значений сигнала ошибки", "Скоростная форма выдаёт приращение управляющего сигнала, что упрощает анти-виндап"], "correct": 3, "explain": "Скоростная форма ПИД вычисляет приращение управляющего воздействия, поэтому при насыщении привода достаточно просто не добавлять очередное приращение, что естественно реализует анти-виндап и даёт плавное переключение режимов. Ограничение выхода всё равно нужно, статическая ошибка от формы реализации не зависит, а скоростная форма как раз требует хранения предыдущих отсчётов ошибки. (Ogata, глава о цифровой реализации ПИД-регулятора)", "usage": {"code": false, "without": "Без выбора скоростной формы интегратор позиционного регулятора продолжает накапливаться во время насыщения привода, и после снятия ограничения контур резко перерегулирует.", "with": "Со скоростной формой инженер просто останавливает накопление приращения при насыщении и получает плавный выход из ограничения.", "benefit": "Контур выходит из насыщения без выброса, вызванного накопленным интегралом."}}, {"q": "Позиционная форма цифрового ПИД-регулятора реализована без явного анти-виндап механизма, а привод сустава робота длительное время работает в насыщении из-за большой внешней нагрузки. Что произойдёт с интегральной составляющей регулятора?", "options": ["Интегральная составляющая перестанет влиять на выход регулятора совсем", "Интегральная составляющая продолжит расти и вызовет выброс после снятия нагрузки", "Интегральная составляющая начнёт компенсировать только пропорциональный член регулятора", "Интегральная составляющая автоматически обнулится при первом же насыщении"], "correct": 1, "explain": "Без анти-виндап интегратор продолжает накапливать ошибку, пока привод физически не может её отработать, и когда насыщение снимается, накопленный интеграл вызывает значительное перерегулирование, известное как интегральный виндап. Интегратор не обнуляется и не перестаёт работать сам по себе. (Nise, глава о ПИД-регулировании и насыщении исполнительных механизмов)", "usage": {"code": false, "without": "Без анти-виндап после длительной перегрузки сустав резко дёргается вперёд, отрабатывая накопленную за время насыщения интегральную ошибку.", "with": "Зная об этом эффекте, инженер сразу закладывает ограничение интегратора или скоростную форму ещё на этапе проектирования регулятора.", "benefit": "Контур не выдаёт резкий выброс после выхода привода из насыщения."}}, {"q": "Контур управления сустава манипулятора работал устойчиво на контроллере с частотой дискретизации 1000 Гц. Тот же ПИД-регулятор без изменения коэффициентов перенесли на контроллер с частотой дискретизации 50 Гц, и контур стал колебательным. Какая причина наиболее вероятна?", "options": ["Снижение частоты дискретизации увеличило фазовое запаздывание и снизило запас по фазе контура", "Снижение частоты дискретизации увеличило коэффициент усиления датчика энкодера и вызвало перерегулирование сустава", "Снижение частоты дискретизации уменьшило механическую инерцию нагрузки привода и сдвинуло его резонансную частоту", "Снижение частоты дискретизации повысило статическую ошибку контура и замаскировало её видимыми колебаниями"], "correct": 0, "explain": "Экстраполятор нулевого порядка и время вычисления регулятора вносят фазовое запаздывание порядка omega умножить на T пополам; при увеличении периода T это запаздывание растёт и съедает запас по фазе на частоте среза, из-за чего контур с прежними коэффициентами ПИД приближается к границе устойчивости и начинает колебаться. Остальные варианты описывают эффекты, которые частота дискретизации регулятора вызвать не может. (Franklin-Powell-Emami-Naeini, гл. 8)", "usage": {"code": false, "without": "Без этого знания инженер будет вслепую подбирать коэффициенты ПИД или винить механику сустава, не трогая частоту выборки.", "with": "Зная о росте фазового запаздывания при снижении частоты дискретизации, инженер либо повышает частоту выборки, либо перестраивает регулятор под новый период.", "benefit": "Экономит недели проб и ошибок при переносе кода регулятора на более простой контроллер."}}, {"q": "Инженер снижает частоту дискретизации контура скорости мобильного робота с 500 Гц до 20 Гц, чтобы разгрузить процессор. Полоса пропускания замкнутого контура скорости составляет 5 Гц. Что произойдёт с контуром при такой частоте выборки?", "options": ["Контур станет точнее, так как редкая выборка снижает шум квантования датчика скорости", "Контур перестанет реагировать на возмущения, так как интегратор перестанет накапливать ошибку", "Контур сохранит запас устойчивости, так как выборка всё ещё выше полосы пропускания контура", "Контур потеряет запас устойчивости, так как выборка лишь вчетверо выше полосы пропускания"], "correct": 3, "explain": "Частота дискретизации контура управления должна быть в 10-30 раз выше полосы пропускания замкнутой системы, чтобы дискретный регулятор вёл себя близко к непрерывному; при 20 Гц против полосы 5 Гц запас всего четырёхкратный, чего почти всегда недостаточно и что снижает запас по фазе вплоть до колебаний. (Franklin-Powell-Emami-Naeini, гл. 8)", "usage": {"code": false, "without": "Без правила про 10-30-кратный запас инженер посчитает четырёхкратный запас достаточным и получит контур на грани устойчивости.", "with": "Зная правило, инженер закладывает частоту выборки с запасом уже на этапе выбора процессора и АЦП.", "benefit": "Предотвращает переделку электроники после того, как контур уже собран и колеблется."}}, {"q": "Контроллер тока привода сустава измеряет ток АЦП синхронно с частотой ШИМ 20 килогерц, беря ровно одну выборку за период ШИМ. В сигнале обратной связи по току появилась паразитная составляющая в несколько герц, хотя реальный ток почти постоянен. Что является причиной?", "options": ["Дрейф нуля усилителя датчика тока из-за постепенного теплового нагрева силового ключа", "Алиасинг пульсации тока от ШИМ, проявляющийся как ложный низкочастотный сигнал", "Механический резонанс редуктора, модулирующий ток двигателя с низкой частотой", "Насыщение усилителя датчика тока, вносящее заметные низкочастотные гармоники в сигнал"], "correct": 1, "explain": "Выборка ровно раз за период ШИМ означает частоту дискретизации, равную частоте помехи; любой сдвиг фазы между периодами ШИМ и АЦП превращает быстро меняющуюся пульсацию тока в кажущийся медленный сигнал — классический алиасинг, а не свойство самого тока или механики. (Nise, гл. 13)", "usage": {"code": false, "without": "Инженер начнёт чинить фильтр датчика или винить привод, хотя проблема в самой стратегии выборки.", "with": "Зная про алиасинг от ШИМ, инженер смещает момент выборки в паузу ШИМ или ставит антиалиасинговый фильтр перед АЦП.", "benefit": "Устраняет ложную низкочастотную помеху без переделки силовой части."}}, {"q": "Для контура тока сустава с частотой ШИМ 20 килогерц и частотой дискретизации регулятора 5 килогерц нужно исключить алиасинг пульсации тока от ШИМ в измеренном сигнале. Какое решение корректно с точки зрения теоремы отсчётов?", "options": ["Уменьшить коэффициент пропорционального звена регулятора тока, чтобы снизить чувствительность к помехе", "Увеличить частоту ШИМ ещё сильнее, чтобы пульсация тока стала быстрее самой выборки", "Поставить перед АЦП фильтр нижних частот со срезом заметно ниже половины частоты дискретизации", "Увеличить разрядность АЦП, чтобы точнее измерять быстрые изменения тока внутри каждого периода ШИМ"], "correct": 2, "explain": "Чтобы избежать алиасинга, спектр сигнала перед АЦП нужно ограничить фильтром нижних частот с частотой среза ниже частоты Найквиста регулятора — половины частоты дискретизации; тогда пульсация ШИМ не попадёт в полезную полосу как ложный низкочастотный сигнал. Разрядность АЦП, коэффициент регулятора и дальнейшее повышение частоты ШИМ сам механизм алиасинга не устраняют. (Franklin-Powell-Emami-Naeini, гл. 8)", "usage": {"code": false, "without": "Без антиалиасингового фильтра любое повышение частоты ШИМ или разрядности АЦП не спасёт от ложной низкочастотной помехи.", "with": "С фильтром, рассчитанным под частоту Найквиста регулятора, пульсация ШИМ обрезается ещё до АЦП.", "benefit": "Позволяет держать частоту дискретизации регулятора низкой, не жертвуя чистотой сигнала тока."}}, {"q": "После повышения частоты дискретизации контура положения сустава с 200 Гц до 5 килогерц выходной сигнал дифференциальной составляющей ПИД стал крайне зашумлённым, хотя энкодер и механика не менялись. Почему?", "options": ["Уменьшение периода дискретизации увеличило вклад шума квантования в разностную оценку скорости", "Уменьшение периода дискретизации сместило полюс апериодического звена привода к границе устойчивости", "Уменьшение периода дискретизации снизило коэффициент передачи пропорционального звена регулятора", "Уменьшение периода дискретизации повысило физическое разрешение самого энкодера в отсчётах на оборот"], "correct": 0, "explain": "Дискретная оценка скорости через разность соседних отсчётов положения делится на период дискретизации T; при уменьшении T тот же шаг квантования энкодера даёт кажущуюся скорость на порядок больше, поэтому дифференциальная составляющая ПИД становится шумной, хотя сам энкодер не изменился. (Ogata, гл. 13)", "usage": {"code": false, "without": "Инженер станет менять энкодер на более точный, хотя дело в способе вычисления скорости, а не в разрешении датчика.", "with": "Понимая природу шума, инженер фильтрует разностную оценку или переходит на измерение периода импульсов энкодера.", "benefit": "Убирает дёргание привода без замены датчика."}}, {"q": "Дифференциальная составляющая ПИД контура сустава при частоте дискретизации 5 килогерц оказалась настолько зашумлённой, что дёргает привод. Частоту дискретизации снижать нельзя из-за требований по фазовому запасу. Какое решение уместно?", "options": ["Округлить показания энкодера до меньшего числа разрядов перед вычислением ошибки", "Убрать интегральную составляющую регулятора, чтобы снизить общий уровень шума в сигнале", "Повысить коэффициент пропорционального звена, чтобы дифференциальная часть стала менее заметной", "Добавить фильтр нижних частот на канал дифференцирования перед вычислением производной"], "correct": 3, "explain": "Стандартный приём — фильтр нижних частот на дифференциальном канале, который срезает высокочастотный шум квантования, не трогая частоту дискретизации регулятора и его фазовый запас. Остальные меры либо ухудшают точность или запас устойчивости, либо не устраняют источник шума. (Franklin-Powell-Emami-Naeini, гл. 8)", "usage": {"code": false, "without": "Без фильтра на D-канале инженер вынужден жертвовать либо точностью, либо плавностью привода.", "with": "С фильтром на дифференциальном канале шум срезается локально, не затрагивая остальной регулятор.", "benefit": "Сохраняет и высокую частоту дискретизации, и плавность управляющего сигнала."}}, {"q": "На контроллере сустава период выполнения цикла ПИД-регулятора не строго постоянен: из-за загрузки процессора он колеблется в пределах плюс-минус 20 процентов от номинальных 2 миллисекунд. Как это скажется на работе цифрового регулятора, рассчитанного для точного периода T?", "options": ["Экстраполятор нулевого порядка перестанет удерживать сигнал между тактами и начнёт линейно его интерполировать", "Интегральная и дифференциальная части вычисляются с неточными интервалами и действуют как случайное возмущение", "Регулятор перестанет реагировать на ошибку, поскольку дискретный интегратор обнулится при первом отклонении периода", "Передаточная функция объекта в непрерывном времени изменится, и полюсы привода сместятся в правую полуплоскость"], "correct": 1, "explain": "Джиттер периода означает, что реальные интервалы между отсчётами отличаются от номинального T, заложенного в коэффициенты разностных уравнений интегральной и дифференциальной частей; ошибка вычисления этих частей ведёт себя как небольшое случайное возмущение в контуре, а не меняет физику объекта, работу ZOH или обнуляет интегратор. (Franklin-Powell-Emami-Naeini, гл. 8)", "usage": {"code": false, "without": "Инженер будет искать источник дрейфа в механике или датчике, не подозревая операционную систему контроллера.", "with": "Зная про эффект джиттера, инженер выносит цикл регулятора в задачу с жёстким приоритетом реального времени.", "benefit": "Устраняет плавающую нестабильность, не объяснимую ни моделью объекта, ни настройками ПИД."}}, {"q": "Аналоговый корректирующий фильтр контура рассчитан по частотным характеристикам с заданным запасом по фазе на конкретной частоте среза. Регулятор нужно перевести в цифровую форму так, чтобы частотная характеристика вблизи этой частоты сохранилась как можно точнее. Какой метод дискретизации предпочтителен?", "options": ["Метод прямой разности, который проще всего реализовать в коде микроконтроллера", "Согласование полюсов и нулей фильтра без учёта его общего коэффициента усиления", "Тастин с предыскажением частоты среза для совпадения характеристик в нужной точке", "ZOH-эквивалент, точно воспроизводящий реакцию объекта на ступенчатый входной сигнал"], "correct": 2, "explain": "Тастин с предыскажением частоты специально предназначен для сохранения формы частотной характеристики регулятора в окрестности заданной частоты, что критично, когда фильтр рассчитан по критерию запаса по фазе. ZOH-эквивалент лучше подходит для моделей самого объекта, а не для перевода уже готового частотного компенсатора. (Franklin-Powell-Emami-Naeini, гл. 8)", "usage": {"code": false, "without": "Без предыскажения частоты цифровая версия фильтра сдвигает частоту среза и меняет реальный запас по фазе.", "with": "С предыскажением частоты дискретный фильтр ведёт себя на нужной частоте так же, как рассчитанный аналоговый.", "benefit": "Сохраняет запас устойчивости, заложенный на этапе непрерывного проектирования."}}, {"q": "Для симуляции контура нужна дискретная модель механической части сустава с известной непрерывной передаточной функцией, которая в узлах дискретизации должна давать точно такую же реакцию на ступенчатый сигнал управления, как и непрерывный объект. Какой метод дискретизации для этого предназначен?", "options": ["ZOH-эквивалент объекта, построенный в предположении, что вход постоянен между отсчётами", "Метод обратной разности, ориентированный прежде всего на простоту реализации на медленном процессоре", "Согласование полюсов и нулей, ориентированное на сохранение относительного расположения корней", "Тастин с предыскажением частоты, ориентированный на сохранение частотной характеристики фильтра"], "correct": 0, "explain": "ZOH-эквивалент строится исходя из того, что управляющий сигнал держится постоянным между тактами — именно так работает реальный цифро-аналоговый преобразователь — и поэтому даёт дискретную модель, чья реакция на ступеньку в узлах дискретизации в точности совпадает с непрерывным объектом. Тастин и согласование полюсов и нулей решают другие задачи приближения. (Ogata, гл. 13)", "usage": {"code": false, "without": "При симуляции через Тастин или согласование полюсов инженер получит модель, чья реакция на ступеньку заметно разойдётся с реальным объектом между тактами.", "with": "С ZOH-эквивалентом дискретная симуляция в узлах дискретизации совпадает с реальным объектом без дополнительных поправок.", "benefit": "Экономит время на отладку модели, которая иначе выглядела бы неточной без видимой причины."}}, {"q": "Непрерывный регулятор сустава был устойчив по анализу корневого годографа. Инженер перевёл его в цифровую форму методом прямой разности с относительно большим периодом дискретизации, и цифровая реализация оказалась неустойчивой при тех же коэффициентах. Чем это объясняется?", "options": ["Метод прямой разности требует обязательного увеличения коэффициента усиления при переходе в цифровую форму", "Метод прямой разности всегда полностью сохраняет устойчивость непрерывной системы независимо от периода дискретизации", "Метод прямой разности заметно меняет порядок передаточной функции, добавляя лишний полюс в начале координат", "Метод прямой разности может выносить устойчивые полюсы за пределы единичной окружности при большом периоде"], "correct": 3, "explain": "Отображение s в z для метода прямой разности — z равно 1 плюс sT — не совпадает с истинным z равно e в степени sT и при достаточно большом T переносит часть устойчивых полюсов левой полуплоскости за пределы единичной окружности z-плоскости, то есть в область неустойчивости дискретной системы. Остальные варианты не описывают реальное свойство этого метода. (Ogata, гл. 13)", "usage": {"code": false, "without": "Инженер будет искать ошибку в коэффициентах ПИД, хотя причина в самом методе дискретизации.", "with": "Зная про искажение отображения полюсов методом прямой разности, инженер переходит на Тастин или ZOH-эквивалент либо уменьшает период.", "benefit": "Возвращает устойчивость без пересчёта самого регулятора."}}, {"q": "Полоса пропускания замкнутого контура по уровню минус 3 дБ равна fbw = 5 Гц. Практическое правило требует частоты выборки в 10-30 раз выше полосы пропускания; инженер берёт коэффициент 20. Чему равен период дискретизации T?", "options": ["20 мс", "200 мс", "10 мс", "100 мс"], "correct": 2, "explain": "Шаг 1: частота выборки fs = 20 × fbw = 20 × 5 = 100 Гц. Шаг 2: период дискретизации T = 1/fs = 1/100 = 0.01 с = 10 мс. Ответ 200 мс получается, если частоту выборки перепутать с полосой пропускания и взять T = 1/fbw; ответ 100 мс - если забыть перевести герцы в период и оставить значение fs без инверсии. (Franklin-Powell-Emami-Naeini, гл. выбор частоты дискретизации)", "usage": {"code": false, "without": "Без правила 10-30× инженер выбирает T наугад, и контур либо теряет запас устойчивости при слишком редкой выборке, либо перегружает процессор избыточными вычислениями.", "with": "Зная полосу пропускания, инженер сразу считает нужный период дискретизации и закладывает его в таймер прерываний контроллера.", "benefit": "Экономит время отладки и гарантирует запас по фазе для регулятора."}}, {"q": "Полюс непрерывной системы находится в точке s = -50 1/с. Регулятор дискретизируют с периодом T = 0.01 с. Чему равен соответствующий полюс в z-области и устойчива ли дискретная система?", "options": ["z ≈ 0.607, система устойчива", "z ≈ 0.500, система устойчива", "z ≈ 1.649, система неустойчива", "z ≈ -0.500, система неустойчива"], "correct": 0, "explain": "Шаг 1: показатель степени sT = -50 × 0.01 = -0.5. Шаг 2: z = e в степени sT = e в степени -0.5 ≈ 0.607. Шаг 3: модуль 0.607 меньше единицы, полюс внутри единичной окружности - система устойчива. Ответ 1.649 получается при потере знака минус в показателе, а 0.500 - при линейной замене z ≈ 1+sT вместо точной экспоненты. (Ogata, гл. z-преобразование)", "usage": {"code": false, "without": "Не пересчитав полюс через z=e в степени sT, инженер может решить, что устойчивый аналоговый регулятор остаётся устойчивым в любой цифровой реализации, и пропустить проверку.", "with": "Пересчитав полюс в z-плоскость, инженер видит его точное положение внутри единичной окружности и подтверждает устойчивость перед прошивкой контроллера.", "benefit": "Позволяет проверить устойчивость цифровой реализации до запуска на реальном приводе."}}, {"q": "Полюс непрерывной системы находится в точке s = -10 + j30 1/с, период дискретизации T = 0.02 с. Чему равен модуль соответствующего полюса в z-области?", "options": ["модуль полюса z приблизительно равен 1.221, система неустойчива", "модуль полюса z приблизительно равен 0.531, система устойчива", "модуль полюса z приблизительно равен 0.200, система устойчива", "модуль полюса z приблизительно равен 0.819, система устойчива"], "correct": 3, "explain": "Шаг 1: модуль z-полюса зависит только от вещественной части s: Re(sT) = -10 × 0.02 = -0.2. Шаг 2: модуль z = e в степени Re(sT) = e в степени -0.2 ≈ 0.819. Шаг 3: значение меньше единицы - система устойчива, мнимая часть на модуль не влияет. Ответ 0.531 получается, если ошибочно подставить полный модуль s вместо его вещественной части. (Ogata, гл. z-преобразование)", "usage": {"code": false, "without": "Инженер, забыв, что модуль z-полюса зависит только от вещественной части s, может неверно оценить запас устойчивости колебательного звена.", "with": "Зная, что модуль зависит только от Re(s), инженер быстро проверяет устойчивость даже для полюсов с большой мнимой частью.", "benefit": "Ускоряет проверку устойчивости колебательных мод без построения полной карты полюсов."}}, {"q": "Звено G(s) = a/(s+a) с a = 5 1/с дискретизируют методом обратной разности при периоде T = 0.1 с, заменяя s на (1 − z в степени -1)/T. Чему равен полюс полученной дискретной передаточной функции G(z)?", "options": ["полюс z равен 0.333", "полюс z равен 0.667", "полюс z равен 2.000", "полюс z равен 0.500"], "correct": 1, "explain": "Шаг 1: подставляем s = (1−z в степени -1)/T в G(s) и приводим к виду с одним полюсом. Шаг 2: полюс дискретной функции равен zp = 1/(1+aT). Шаг 3: aT = 5 × 0.1 = 0.5, zp = 1/1.5 ≈ 0.667. Ответ 0.500 соответствует формуле полюса для метода прямой разности zp=1−aT, а не обратной; ответ 0.333 получается, если перепутать полюс с коэффициентом усиления aT/(1+aT). (Franklin-Powell-Emami-Naeini, гл. методы дискретизации регулятора)", "usage": {"code": false, "without": "Перепутав формулу обратной разности с прямой, инженер получит другое положение полюса и неверно предскажет поведение цифрового фильтра.", "with": "Выведя полюс по правильной формуле обратной разности, инженер точно знает динамику дискретного звена перед прошивкой.", "benefit": "Гарантирует, что цифровая реализация повторяет поведение аналогового прототипа с известной точностью."}}, {"q": "То же звено G(s) = a/(s+a) с a = 5 1/с дискретизируют методом Тастина билинейное преобразование при периоде T = 0.2 с, заменяя s на (2/T)(z−1)/(z+1). Чему равен полюс полученной дискретной передаточной функции G(z)?", "options": ["полюс z равен -0.333", "полюс z равен 0.500", "полюс z равен 0.333", "полюс z равен 0.000"], "correct": 2, "explain": "Шаг 1: 2/T = 2/0.2 = 10. Шаг 2: подставляем s=(2/T)(z−1)/(z+1) в G(s) и приводим к общему знаменателю, получая zp = (2/T − a)/(2/T + a). Шаг 3: zp = (10−5)/(10+5) = 5/15 ≈ 0.333. Ответ 0.500 получается, если по ошибке применить формулу обратной разности вместо Тастина; ответ -0.333 - при перестановке знаков в числителе и знаменателе. (Franklin-Powell-Emami-Naeini, гл. билинейное преобразование)", "usage": {"code": false, "without": "Смешав формулы Тастина и обратной разности, инженер получит другой полюс G(z) и рассчитает неверный переходный процесс регулятора.", "with": "Применив верную подстановку Тастина, инженер получает полюс, который точнее сохраняет частотные свойства аналогового прототипа.", "benefit": "Снижает искажение частотной характеристики регулятора при переходе к цифровой реализации."}}, {"q": "При дискретизации методом Тастина частотная ось искажается warping. Чтобы частота среза цифрового фильтра точно совпала с желаемой ω = 10 рад/с при T = 0.1 с, аналоговый прототип проектируют на предискажённой частоте ωpre = (2 тирует, что прошитый алгоритм точно соответствует рассчитанной передаточной функции."}}, {"q": "Частота среза непрерывного контура ωc = 40 рад/с, период дискретизации T = 0.02 с. Экстраполятор нулевого порядка ZOH вносит на этой частоте дополнительное фазовое запаздывание, приближённо равное ωT/2 радиан. Чему равно это запаздывание в градусах?", "options": ["11.5°", "22.9°", "72.0°", "45.8°"], "correct": 1, "explain": "Шаг 1: ωT/2 = 40 × 0.02/2 = 0.4 рад. Шаг 2: перевод в градусы: 0.4 × 180/π ≈ 22.9°. Ответ 45.8° получается, если забыть делить на 2 и использовать полное ωT; ответ 72.0° - при переводе радиан в градусы умножением только на 180 без деления на π. (Franklin-Powell-Emami-Naeini, гл. влияние ZOH на фазу)", "usage": {"code": false, "without": "Не учтя фазовое запаздывание ZOH, инженер закладывает в цифровой регулятор запас по фазе, которого на самом деле не будет.", "with": "Посчитав запаздывание ωT/2, инженер закладывает его в бюджет фазы ещё на этапе выбора частоты выборки.", "benefit": "Предотвращает неожиданную потерю запаса устойчивости после перехода на цифровую реализацию."}}, {"q": "Аналоговый регулятор спроектирован с запасом по фазе 50° на частоте среза ωc = 15 рад/с. Регулятор реализуют цифровым способом с периодом дискретизации T = 0.01 с; экстраполятор ZOH добавляет фазовое запаздывание ωcT/2. Каков новый запас по фазе после дискретизации?", "options": ["41.4°", "54.3°", "45.7°", "50.0°"], "correct": 2, "explain": "Шаг 1: дополнительное запаздывание ωcT/2 = 15 × 0.01/2 = 0.075 рад ≈ 4.3°. Шаг 2: новый запас по фазе = 50° − 4.3° ≈ 45.7°. Ответ 54.3° получается при сложении вместо вычитания запаздывания; ответ 41.4° - если использовать полное ωcT вместо ωcT/2. (Franklin-Powell-Emami-Naeini, гл. влияние ZOH на фазу)", "usage": {"code": false, "without": "Игнорируя потерю фазы от ZOH, инженер запускает на реальном приводе регулятор с меньшим запасом устойчивости, чем показывало моделирование.", "with": "Вычтя фазовое запаздывание ZOH из расчётного запаса, инженер заранее видит реальный запас устойчивости цифровой системы.", "benefit": "Позволяет скорректировать частоту выборки или структуру регулятора до испытаний на оборудовании."}}, {"q": "ПИД-регулятор с коэффициентами Kp = 4, Ki = 2 1/с, Kd = 0.5 с реализуют в скоростной форме при периоде дискретизации T = 0.1 с: Δu[n] = q0 e[n] + q1 e[n-1] + q2 e[n-2], где q0 = Kp + KiT + Kd/T. Чему равен коэффициент q0?", "options": ["q0 = 9.20", "q0 = 4.20", "q0 = 9.00", "q0 = 4.25"], "correct": 0, "explain": "Шаг 1: KiT = 2 × 0.1 = 0.2. Шаг 2: Kd/T = 0.5/0.1 = 5. Шаг 3: q0 = Kp + KiT + Kd/T = 4 + 0.2 + 5 = 9.2. Ответ 4.20 получается, если забыть слагаемое Kd/T; ответ 9.00 - если забыть слагаемое KiT. (labT5-lab.txt, реализация ПИД в скоростной форме)", "usage": {"code": false, "without": "Пропустив одно из слагаемых формулы q0, программист получит регулятор с заниженным быстродействием или запаздыванием реакции на ошибку.", "with": "Посчитав все три слагаемых q0, программист сразу вписывает верный коэффициент в код скоростной формы ПИД на контроллере.", "benefit": "Обеспечивает совпадение поведения дискретного ПИД с расчётными непрерывными коэффициентами Kp, Ki, Kd."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
