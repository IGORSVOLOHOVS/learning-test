.", "benefit": "Верный выбор критерия под тип исходных данных страхует от ложного вывода об устойчивости."}}, {"q": "На построенных ЛАЧХ и ЛФЧХ разомкнутого контура частота среза по амплитуде, где ЛАЧХ пересекает 0 дБ, лежит ниже частоты, на которой фаза достигает минус 180 градусов, а на самой частоте среза фаза равна минус 130 градусов. Как это читается для замкнутого контура", "options": ["Система устойчива, запас по фазе положителен и равен примерно 130 градусов", "Система неустойчива, запас по фазе отрицателен, фаза уже прошла минус 180 градусов", "Система устойчива, запас по фазе положителен и равен примерно 50 градусов", "Система на границе устойчивости, запас по фазе равен нулю на этой частоте"], "correct": 2, "explain": "Запас по фазе считается как 180 плюс фаза на частоте среза по амплитуде, то есть 180 минус 130 равно 50 градусов; положительный запас означает устойчивый замкнутый контур с разумным демпфированием (Nise, гл. 10).", "usage": {"code": false, "without": "Студент видит фазу минус 130 градусов и по ошибке решает, что контур почти неустойчив, и без нужды снижает усиление регулятора.", "with": "Правильно посчитав запас по фазе в 50 градусов, он видит, что контур устойчив и имеет хороший запас.", "benefit": "Верное чтение запаса по фазе с графика Боде экономит ненужную перенастройку регулятора."}}, {"q": "Разомкнутый контур устойчив, то есть все его полюсы лежат в левой полуплоскости. Построенный годограф Найквиста при изменении частоты от минус до плюс бесконечности не охватывает точку минус 1 плюс j0. Что это означает для замкнутого контура", "options": ["Замкнутая система устойчива, при устойчивом разомкнутом контуре отсутствие охвата точки минус 1 достаточно", "Замкнутая система неустойчива, охват точки минус 1 обязателен для устойчивости замкнутого контура", "Устойчивость нельзя определить без отдельного построения корневого годографа", "Замкнутая система устойчива только при дополнительной проверке критерием Рауса-Гурвица"], "correct": 0, "explain": "Критерий Найквиста для устойчивого разомкнутого контура сводится к простому правилу: замкнутый контур устойчив тогда и только тогда, когда годограф не охватывает точку минус 1, и других проверок для этого вывода не требуется (Ogata, гл. 8).", "usage": {"code": false, "without": "Инженер после построения годографа Найквиста дополнительно тратит время на таблицу Рауса, хотя вопрос об устойчивости уже закрыт.", "with": "Он делает вывод об устойчивости сразу по отсутствию охвата точки минус 1 и переходит к следующему шагу проектирования.", "benefit": "Экономия шага анализа за счёт правильного применения самого критерия Найквиста без дублирования."}}, {"q": "На корневом годографе разомкнутого контура с тремя полюсами в левой полуплоскости и без нулей две ветви при росте коэффициента усиления K сходят с действительной оси, движутся к асимптотам и при некотором конечном K пересекают мнимую ось. Что это означает для контура", "options": ["Контур неустойчив при любом K, поскольку ветви уходят в правую полуплоскость сразу от K, равного нулю", "Пересечение мнимой оси означает, что контур уже неустойчив при K, равном нулю", "Контур остаётся устойчивым при любом сколь угодно большом K, поскольку полюсы разомкнутого контура устойчивы", "Существует конечное критическое значение K, после которого замкнутый контур становится неустойчивым"], "correct": 3, "explain": "Точка пересечения ветвей корневого годографа с мнимой осью задаёт критическое значение K: при меньших значениях полюсы замкнутого контура лежат в левой полуплоскости, а при больших переходят в правую, то есть контур становится неустойчивым (Ogata, гл. 6).", "usage": {"code": false, "without": "Инженер по инерции повышает усиление контура сустава для скорости отклика и не замечает приближения к границе устойчивости на годографе.", "with": "Он видит точку пересечения ветвей с мнимой осью и ограничивает K заведомо ниже критического значения.", "benefit": "Чтение корневого годографа заранее предотвращает выбор усиления, при котором сустав начнёт колебаться."}}, {"q": "К устойчивому контуру с достаточным запасом по фазе добавили ещё один полюс разомкнутого контура на более высокой частоте, например из-за фильтра в цепи датчика, не меняя коэффициент усиления K. Как это скажется на запасе по фазе и на корневом годографе", "options": ["Асимптоты корневого годографа исчезнут, а запас по фазе станет бесконечным", "Запас по фазе снизится, а асимптоты корневого годографа сместятся ближе к мнимой оси", "Запас по фазе вырастет, а асимптоты корневого годографа сместятся дальше от мнимой оси", "Запас по фазе не изменится, поскольку дополнительный полюс влияет только на амплитуду"], "correct": 1, "explain": "Дополнительный полюс вносит дополнительный фазовый сдвиг на высоких частотах, снижая запас по фазе, и одновременно смещает асимптоты корневого годографа ближе к мнимой оси, ухудшая запас устойчивости по обеим картинам одновременно (Nise, гл. 8).", "usage": {"code": false, "without": "Разработчик добавляет фильтр в цепь энкодера, не пересчитывая запас по фазе, и получает неожиданные колебания сустава.", "with": "Он заранее оценивает, что новый полюс снизит запас по фазе, и подбирает K с запасом на эту деградацию.", "benefit": "Учёт влияния дополнительного полюса на этапе проектирования избавляет от полевой доводки контроллера."}}, {"q": "К тому же контуру вместо полюса добавили ноль передаточной функции в левой полуплоскости на сопоставимой частоте, не меняя коэффициент усиления K. Как это скажется на запасе по фазе", "options": ["Запас по фазе снизится, поскольку любой дополнительный элемент ухудшает устойчивость", "Запас по фазе не изменится, ноль влияет только на низкочастотную асимптоту ЛАЧХ", "Запас по фазе вырастет, ноль добавляет опережающую фазу на высоких частотах", "Запас по фазе станет отрицательным, ноль всегда сдвигает фазу на минус 90 градусов"], "correct": 2, "explain": "Ноль в левой полуплоскости вносит положительный, опережающий фазовый сдвиг, который частично компенсирует отставание фазы от полюсов и увеличивает запас по фазе, действуя противоположно дополнительному полюсу (Ogata, гл. 7).", "usage": {"code": false, "without": "Инженер боится добавлять корректирующее звено с нулём, ожидая ухудшения устойчивости по аналогии с полюсом.", "with": "Понимая, что ноль в левой полуплоскости добавляет опережающую фазу, он сознательно вводит его для повышения запаса.", "benefit": "Различение эффекта полюса и нуля позволяет осознанно использовать коррекцию для улучшения устойчивости."}}, {"q": "В контур с положительным запасом по фазе добавили чистое транспортное запаздывание, например из-за сетевой передачи данных с датчика, не меняя ни коэффициенты, ни порядок характеристического полинома. Почему критерий Рауса-Гурвица не заметит эту угрозу устойчивости", "options": ["Задержка добавляет фазовый сдвиг без изменения амплитуды и не описывается конечным полиномом", "Критерий Рауса-Гурвица не работает для контуров с обратной связью, а только для разомкнутых", "Задержка не влияет на устойчивость, поэтому критерию нечего замечать", "Задержка меняет коэффициенты характеристического уравнения так, что таблица Рауса это скрывает"], "correct": 0, "explain": "Чистое запаздывание даёт множитель вида экспоненты от частоты, который меняет только фазу и не раскладывается в конечный полином, поэтому критерий Рауса-Гурвица, работающий с коэффициентами полинома, эту угрозу устойчивости в принципе не видит (labT3-lab.txt, Step 5).", "usage": {"code": false, "without": "Команда полагается на положительный вердикт Рауса-Гурвица и не проверяет запас по фазе после добавления сетевой задержки датчика.", "with": "Зная, что задержка невидима для Рауса-Гурвица, инженер дополнительно проверяет запас по фазе с учётом задержки на частотном графике.", "benefit": "Понимание слепой зоны алгебраического критерия предотвращает пропуск реальной причины неустойчивости в сетевом контуре."}}, {"q": "По ЛАЧХ и ЛФЧХ разомкнутого контура нужно подобрать коэффициент усиления K так, чтобы запас по фазе замкнутой системы составил ровно 45 градусов. Как это сделать по графику", "options": ["Подобрать K по таблице Рауса-Гурвица так, чтобы крайний коэффициент характеристического уравнения обратился в ноль", "Увеличивать K до тех пор, пока частота среза по амплитуде не сравняется с частотой среза по фазе", "Найти частоту, где ЛАЧХ пересекает 0 дБ при исходном K, и подобрать K так, чтобы фаза там стала ровно минус 180 градусов", "Найти частоту, где фаза равна минус 135 градусов, и подобрать K так, чтобы на этой частоте ЛАЧХ проходила через 0 дБ"], "correct": 3, "explain": "Запас по фазе 45 градусов означает, что на частоте среза по амплитуде фаза должна быть минус 135 градусов; поэтому сначала находят частоту с такой фазой на ЛФЧХ, а затем подбирают K, сдвигая ЛАЧХ по вертикали, чтобы именно на этой частоте она проходила через 0 дБ (Nise, гл. 10).", "usage": {"code": false, "without": "Инженер подбирает K методом проб и ошибок, многократно перестраивая графики Боде вручную.", "with": "Он сразу находит нужную частоту по фазе и вычисляет K из требуемого сдвига ЛАЧХ за один проход.", "benefit": "Прямой расчёт K по заданному запасу по фазе экономит время итеративной настройки."}}, {"q": "Нужно выбрать K так, чтобы переходная характеристика замкнутого контура имела перерегулирование около 16 процентов, что соответствует коэффициенту затухания zeta около 0.5. Какой инструмент анализа удобнее всего использовать для такого выбора K", "options": ["Критерий Боде, K выбирается там, где запас по амплитуде равен ровно 6 дБ", "Корневой годограф, K выбирается в точке пересечения ветвей с лучом постоянного zeta из начала координат", "Критерий Рауса-Гурвица, K выбирается на границе, где в таблице появляется нулевая строка", "Критерий Найквиста, K выбирается по числу оборотов годографа вокруг точки минус 1"], "correct": 1, "explain": "Требование к перерегулированию задаётся напрямую через zeta, а на корневом годографе линии постоянного zeta проводятся лучами из начал са устойчивости при переходе на сетевой канал управления."}}, {"q": "Контур сустава на бумаге имел запас по фазе 45 градусов, но после перехода на беспроводной канал связи с переменной задержкой сустав начал колебаться при резких командах. Что объясняет это расхождение?", "options": ["Беспроводной канал изменил порядок характеристического уравнения", "Беспроводной канал устранил интегральную составляющую регулятора", "Задержка канала расходует заложенный запас по фазе", "Беспроводной канал увеличил статическую ошибку регулятора"], "correct": 2, "explain": "Расчётный запас по фазе предполагает конкретную задержку в контуре; более длительная и непостоянная задержка беспроводного канала вносит дополнительный фазовый сдвиг на частоте среза и фактически расходует часть запаса, приближая систему к границе устойчивости, тогда как порядок системы и вид ошибки от канала связи не зависят. (Ogata, гл. 8, запас по фазе и запаздывание)", "usage": {"code": false, "without": "Без учёта реальной задержки канала инженер верит бумажному расчёту и удивляется колебаниям в поле.", "with": "Заложив в расчёт худшую задержку канала связи, инженер выбирает запас по фазе с достаточным резервом.", "benefit": "Устойчивая работа сустава при переходе с проводного канала на беспроводной."}}, {"q": "После замены жёсткого редуктора сустава на облегчённый, но более гибкий, на измеренной ЛАЧХ разомкнутого контура появился резонансный пик рядом с частотой среза. Как это скажется на устойчивости замкнутого контура?", "options": ["Резонансный пик снижает запасы устойчивости", "Резонансный пик увеличит запас по фазе", "Резонансный пик снизит порядок характеристического уравнения", "Резонансный пик устранит необходимость в обратной связи"], "correct": 0, "explain": "Резонансный пик вблизи частоты среза добавляет положительный горб в ЛАЧХ и локально ускоряет спад фазы, из-за чего запас по фазе и усиления на реальной частоте среза уменьшаются, а не растут, и обратная связь при этом остаётся необходимой. (Ogata, гл. 8, резонансный пик и запасы устойчивости)", "usage": {"code": false, "without": "Без учёта резонанса инженер судит об устойчивости по старым расчётам для жёсткого редуктора и ошибается.", "with": "Увидев пик на измеренной ЛАЧХ, инженер снижает усиление или ставит режекторный фильтр до испытаний.", "benefit": "Предотвращение автоколебаний сустава после смены механики без потери массы."}}, {"q": "Гибкость редуктора добавляет в передаточную функцию разомкнутого контура сустава пару комплексных полюсов вблизи мнимой оси. Как изменится корневой годограф по сравнению с жёстким редуктором?", "options": ["Число ветвей годографа уменьшается на единицу", "Асимптоты годографа смещаются в правую полуплоскость", "Ветви новых полюсов уходят глубже влево", "Ветви новых полюсов подходят к оси"], "correct": 3, "explain": "Полюсы, добавленные гибкостью редуктора, лежат близко к мнимой оси, поэтому ветви годографа, выходящие из них, достигают мнимой оси при меньшем коэффициенте усиления, чем у жёсткой передачи — критическое K для устойчивости снижается, а число ветвей и положение асимптот от гибкости не зависят. (Nise, гл. 8, влияние расположения полюсов на корневой годограф)", "usage": {"code": false, "without": "Без пересчёта годографа инженер оставляет прежнее рабочее K и получает автоколебания на новом редукторе.", "with": "Построив годограф с новыми полюсами, инженер заранее находит более низкое безопасное K.", "benefit": "Сохранение устойчивости привода при смене механической части без новых испытаний методом проб."}}, {"q": "Измеренная ЛАЧХ и ЛФЧХ разомкнутого контура сустава показывают частоту среза 20 радиан в секунду и фазу минус 170 градусов на этой частоте. Какой вывод правильно диагностирует состояние контура?", "options": ["Частота среза не связана с запасом по фазе", "Запас по фазе равен примерно 10 градусам", "Запас по фазе составляет около 170 градусов", "Контур уже неустойчив в разомкнутом состоянии"], "correct": 1, "explain": "Запас по фазе определяется как акое K нужно выбрать для регулятора, работающего с любым грузом?", "options": ["Критическое K для наибольшей инерции с запасом", "Среднее значение критического K по всему диапазону нагрузок", "Критическое K, рассчитанное для минимальной инерции нагрузки", "Максимальное из всех критических K по диапазону нагрузок"], "correct": 0, "explain": "Поскольку критическое K уменьшается с ростом инерции, худший случай по устойчивости — максимальная нагрузка; выбранное рабочее K должно быть ниже критического значения именно для этого случая, с дополнительным запасом, а не средним, минимальным или максимальным по всему диапазону значением. (Ogata, гл. 6, диапазон K для устойчивости)", "usage": {"code": false, "without": "Без проверки худшего случая инженер настраивает K по лёгкому грузу и ловит автоколебания с тяжёлым.", "with": "Проверив критическое K для максимальной инерции, инженер выбирает рабочее значение, безопасное во всём диапазоне нагрузок.", "benefit": "Один контур, надёжно работающий и с пустым, и с полным захватом груза."}}, {"q": "Для контура сустава с переменной нагрузкой построили корневые годографы отдельно для минимальной и максимальной инерции. При максимальной инерции ветви пересекают мнимую ось при меньшем K, чем при минимальной. Как правильно выбрать рабочее K?", "options": ["Взять K, подходящее только для минимальной инерции", "Взять K выше большего из двух значений пересечения", "Взять K между двумя значениями пересечения мнимой оси", "Взять K ниже меньшего значения пересечения"], "correct": 3, "explain": "Меньшее значение K пересечения мнимой оси соответствует худшему случаю — максимальной инерции; чтобы контур оставался устойчивым во всём диапазоне нагрузок, рабочее K нужно выбирать ниже именно этого меньшего значения, а не между значениями, выше большего или только под минимальную нагрузку. (Nise, гл. 8, корневой годограф при изменении параметров нагрузки)", "usage": {"code": false, "without": "Без сравнения обоих годографов инженер выбирает K, устойчивое только для одной нагрузки, и рискует другой.", "with": "Сравнив точки пересечения мнимой оси для обеих нагрузок, инженер выбирает единое безопасное K заранее.", "benefit": "Гарантия устойчивости сустава при любой массе захватываемого объекта."}}, {"q": "Характеристическое уравнение замкнутой системы: s³ + 2s² + 3s + 10 = 0. Постройте таблицу Рауса и определите число корней в правой полуплоскости.", "options": ["3 корня в правой полуплоскости", "0 корней в правой полуплоскости", "2 корня в правой полуплоскости", "1 корень в правой полуплоскости"], "correct": 2, "explain": "Шаг 1: по формуле Рауса элемент строки s¹ равен (2·3−1·10)/2 = −2. Шаг 2: первый столбец таблицы 1, 2, −2, 10 меняет знак дважды: с 2 на −2 и с −2 на 10. Шаг 3: число смен знака равно числу корней в правой полуплоскости — их 2, система неустойчива. (Ogata, гл. 5)", "usage": {"code": false, "without": "Инженер видит таблицу без явных ошибок и одобряет усиление сустава, не пересчитав знаки в первом столбце.", "with": "Перед пуском контроллер считает смены знака в столбце и блокирует запуск при обнаружении корней справа.", "benefit": "Не даёт неустойчивому усилению уйти на реальный привод."}}, {"q": "Характеристическое уравнение замкнутой системы: s⁴ + 4s³ + 3s² + 2s + 1 = 0. Постройте таблицу Рауса и определите число корней в правой полуплоскости.", "options": ["0 корней в правой полуплоскости", "4 корня в правой полуплоскости", "2 корня в правой полуплоскости", "1 корень в правой полуплоскости"], "correct": 0, "explain": "Шаг 1: строка s² даёт b1=(4·3−1·2)/4=2.5 и b2=(4·1−0)/4=1. Шаг 2: строка s¹ даёт c1=(2.5·2−4·1)/2.5=0.4, строка s⁰ равна 1. Шаг 3: первый столбец 1, 4, 2.5, 0.4, 1 — все положительны, смен знака нет, все корни в левой полуплоскости. (Ogata, гл. 5)", "usage": {"code": false, "without": "Разработчик мобильного робота принимает полином четвёртого порядка на веру и пропускает проверку устойчивости контура рыскания.", "with": "Скрипт автоматически строит таблицу Рауса для передаточн ся при K=5·4=20, вспомогательный полином 5s²+20=0. Шаг 3: отсюда s²=−4, частота ω=2 рад/с — граница устойчивости при K=20. (Ogata, гл. 5)", "usage": {"code": false, "without": "Оператор увеличивает K контура манипулятора, пока не услышит гул на границе устойчивости.", "with": "Заранее посчитанные K_крит и частота колебаний подсказывают, где остановиться с запасом.", "benefit": "Убирает угадывание критического усиления на живом стенде."}}, {"q": "На частоте фазового пересечения ω_pc модуль разомкнутой передаточной функции |G(jω_pc)H(jω_pc)| = 0.4. Чему равен запас по амплитуде GM в децибелах?", "options": ["GM ≈ 7.96 дБ", "GM ≈ -7.96 дБ", "GM ≈ 3.98 дБ", "GM ≈ 2.50 дБ"], "correct": 0, "explain": "Шаг 1: на частоте фазового пересечения запас по амплитуде GM=1/|G(jω_pc)|=1/0.4=2.5. Шаг 2: перевод в децибелы GM=20·log10(2.5). Шаг 3: 20·log10(2.5)≈7.96 дБ. (Ogata, гл. 8)", "usage": {"code": false, "without": "Отчёт по IMU-контуру называет систему устойчивой, не переводя измеренный модуль в децибелы запаса.", "with": "Формула 20·log10 сразу даёт GM в дБ и позволяет сравнить его с требованием стандарта.", "benefit": "Делает запас по амплитуде сравнимым с техническим заданием."}}, {"q": "На частоте среза ω_gc, где |G(jω_gc)H(jω_gc)| = 1, фаза разомкнутой системы равна −160°. Чему равен запас по фазе PM?", "options": ["PM = 340°", "PM = 160°", "PM = -20°", "PM = 20°"], "correct": 3, "explain": "Шаг 1: на частоте среза |G(jω_gc)|=1, фаза равна −160°. Шаг 2: запас по фазе PM=180°+фаза=180°+(−160°). Шаг 3: PM=20° — система устойчива, но запас невелик. (Ogata, гл. 8)", "usage": {"code": false, "without": "Инженер видит отрицательную фазу на срезе и ошибочно решает, что контур уже неустойчив.", "with": "Расчёт PM=180°+фаза показывает небольшой, но положительный запас перед доработкой регулятора.", "benefit": "Не выбраковывает рабочий контур раньше времени."}}, {"q": "Звено чистого запаздывания e^{-sτ} с τ = 20 мс на частоте ω = 25 рад/с. Чему равен фазовый сдвиг, вносимый запаздыванием?", "options": ["фаза ≈ +28.65°", "фаза ≈ -28.65°", "фаза ≈ -0.50°", "фаза ≈ -57.30°"], "correct": 1, "explain": "Шаг 1: звено запаздывания вносит фазу φ=−ωτ в радианах: φ=−25·0.02=−0.5 рад. Шаг 2: перевод в градусы φ=−0.5·180/π. Шаг 3: φ≈−28.65° — чистое отставание по фазе без изменения амплитуды. (Ogata, гл. 8)", "usage": {"code": false, "without": "Команда игнорирует задержку сети между датчиком и контроллером колена робота, считая её нулевой.", "with": "Фаза −ωτ на рабочей частоте закладывается в бюджет запаса по фазе на этапе проектирования.", "benefit": "Не даёт связи датчика незаметно съесть запас устойчивости."}}, {"q": "Разомкнутая система K/[(s+1)(s+3)(s+5)]. Найдите центр асимптот корневого годографа и их углы.", "options": ["центр -3, углы 0°, 120°, 240°", "центр -9, углы 60°, 180°, 300°", "центр -3, углы 60°, 180°, 300°", "центр -3, углы 90°, 180°, 270°"], "correct": 2, "explain": "Шаг 1: у системы K/[(s+1)(s+3)(s+5)] три полюса и ноль нулей, число асимптот n−m=3. Шаг 2: центр асимптот = (−1−3−5)/3=−3. Шаг 3: углы асимптот (2q+1)·180°/3 при q=0,1,2 дают 60°, 180°, 300°. (Ogata, гл. 6)", "usage": {"code": false, "without": "Проектировщик рисует корневой годограф на глаз и промахивается с направлением ветвей на бесконечности.", "with": "Формулы центра и углов асимптот сразу задают каркас годографа для контура привода.", "benefit": "Ускоряет ручную прорисовку годографа без итераций в MATLAB."}}, {"q": "Разомкнутая система K/[s(s+4)]. На отрезке действительной оси между полюсами найдите точку отрыва корневого годографа.", "options": ["точка отрыва s = -2", "точка отрыва s = -3", "точка отрыва s = -4", "точка отрыва s = -1"], "correct": 0, "explain": "Шаг 1: для K/[s(s+4)] характеристическое уравнение даёт K=−s(s+4)=−s²−4s. Шаг 2: точка отрыва находится из dK/ds=0, то есть −2s−4=0. Шаг 3: отсюда s=−2 — середина отрезка между полюсами 0 и −4. (Ogata, гл. 6)", "usage": {"code": false, "without": "Студент считает, что ветви годографа расходятся прямо от полюса, не находя точку отрыва.", "with": "Условие dK/ds=0 находит точную точку отрыва между двумя полюсами на оси.", "benefit": "Даёт точное место, где корни покидают действительную ось."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
