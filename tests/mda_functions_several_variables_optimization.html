<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDA 9: Функции нескольких переменных, частные производные, оптимизация</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>

"q": "Какое условие определяет стационарную точку (x0, y0) функции f(x, y)?", "options": ["Одновременно fx и fy равны нулю", "Значение f в этой точке равно нулю", "Только fx в этой точке равно нулю", "Только fy в этой точке равно нулю"], "correct": 0, "explain": "Точка является стационарной, если оба частных производных первого порядка равны нулю одновременно: fx=0 и fy=0; выполнение только одного из условий не гарантирует горизонтальность касательной плоскости. (HELM 18.3)", "usage": {"code": false, "without": "Проверив только одну из частных производных, студент ошибочно принимает точку за стационарную.", "with": "Проверив обе частные производные, аналитик верно находит точки, где касательная плоскость к поверхности горизонтальна.", "benefit": "Стационарные точки находятся без ложных срабатываний по одной переменной."}}, {"q": "Равенство смешанных производных f_xy = f_yx у функции двух переменных гарантированно выполняется, если", "options": ["функция дифференцируема хотя бы один раз по каждой переменной", "обе смешанные производные непрерывны в окрестности точки", "область определения функции ограничена и замкнута", "обе первые частные производные равны нулю в этой точке"], "correct": 1, "explain": "Теорема Клеро-Юнга: если f_xy и f_yx непрерывны в окрестности точки, они равны в этой точке. Однократная дифференцируемость или ограниченность области для этого не нужны. (HELM 18)", "usage": {"code": false, "without": "Аналитик считает, что f_xy и f_yx всегда совпадают, и пропускает проверку производных при построении модели поверхности отклика.", "with": "Он проверяет непрерывность смешанных производных перед тем, как утверждать их равенство, и не допускает ошибки в модели.", "benefit": "Корректная проверка условий теоремы Клеро-Юнга."}}, {"q": "Что показывает направление вектора градиента функции нескольких переменных в данной точке?", "options": ["направление, перпендикулярное касательной плоскости к графику", "направление вдоль оси, по которой производная наиболь lculus)", "usage": {"code": false, "without": "Специалист по оптимизации ищет направление быстрейшего роста метрики методом проб и перебирает случайные векторы.", "with": "Он знает, что направление градиента сразу даёт направление наибольшего роста, и использует его напрямую.", "benefit": "Экономия времени за счёт прямого выбора оптимального направления."}}, {"q": "Что означает условие D меньше нуля в критерии второй производной для стационарной точки, где D = f_xx f_yy минус f_xy в квадрате?", "options": ["тест не даёт ответа, нужен другой метод", "точка является седловой точкой графика", "точка является точкой локального минимума", "точка является точкой локального максимума"], "correct": 1, "explain": "При D меньше нуля стационарная точка - седловая: функция растёт в одном направлении и убывает в другом. (HELM 18)", "usage": {"code": false, "without": "Аналитик принимает стационарную точку модели за минимум, не проверив знак D, и делает неверный вывод об оптимуме.", "with": "Он вычисляет D, видит отрицательное значение и понимает, что перед ним седловая точка, а не экстремум.", "benefit": "Верная классификация стационарной точки перед выводами."}}, {"q": "Стационарная точка функции имеет D больше нуля и f_xx больше нуля. Что это означает?", "options": ["точка локального максимума", "седловая точка графика функции", "точка локального минимума", "точка перегиба поверхности"], "correct": 2, "explain": "При D больше нуля экстремум существует, а знак f_xx определяет его тип: f_xx больше нуля даёт локальный минимум, f_xx меньше нуля - локальный максимум. (HELM 18)", "usage": {"code": false, "without": "Дата-сайентист видит D больше нуля и не знает, минимум перед ним или максимум, и указывает тип наугад.", "with": "Он дополнительно смотрит на знак f_xx и уверенно определяет, что это локальный минимум.", "benefit": "Однозначное определение типа экстремума по двум условиям."}}, {"q": "Как связан определитель матрицы Гессе функции двух переменных со значением D в критерии ain": "На каждой итерации точка смещается против направления градиента на расстояние, пропорциональное шагу обучения; само направление задаёт градиент, а не шаг. (Stewart, Calculus)", "usage": {"code": false, "without": "Начинающий дата-сайентист путает шаг обучения с направлением движения и настраивает не тот параметр.", "with": "Он понимает, что шаг обучения задаёт величину сдвига против градиента, и подбирает именно её.", "benefit": "Правильная настройка скорости обучения модели."}}, {"q": "Что обычно происходит при слишком большом шаге обучения в градиентном спуске?", "options": ["функция потерь становится выпуклой на всей области", "алгоритм гарантированно находит глобальный минимум быстрее", "алгоритм начинает расходиться или колебаться около минимума", "градиент функции потерь становится равным нулю сразу"], "correct": 2, "explain": "Слишком большой шаг заставляет метод перескакивать через минимум, из-за чего значения функции потерь колеблются или расходятся вместо сходимости. (Stewart, Calculus)", "usage": {"code": false, "without": "Команда ставит слишком большой шаг обучения и не понимает, почему функция потерь скачет вместо снижения.", "with": "Они уменьшают шаг обучения, зная, что большой шаг вызывает расхождение или колебания около минимума.", "benefit": "Устойчивая сходимость обучения модели."}}, {"q": "В стационарной точке функции двух переменных получили D больше нуля и f_xx меньше нуля. Как правильно классифицировать эту точку?", "options": ["Точка — локальный минимум, так как f_yy положительна", "Точка — седловая, так как знаки f_xx и f_yy разные", "Точка — точка перегиба, знак D не определяет тип", "Точка — локальный максимум, так как f_xx отрицательна"], "correct": 3, "explain": "D>0 гарантирует, что f_xx и f_yy имеют одинаковый знак; так как f_xx<0, обе вторые производные отрицательны, и точка — локальный максимум. Вариант с седловой точкой описывает случай D<0, а не D>0. (HELM 18, критерий D=fxxfyy-fxy^2)", "usage": {"code": false, "without": "Без критерия D аналитик перебирает точки вслепую или строит график, что медленно для функций нескольких переменных.", "with": "Зная знаки D и f_xx, можно за один шаг определить тип точки без построения графика.", "benefit": "Экономит время при анализе стационарных точек функции потерь."}}, {"q": "При проверке стационарной точки получили D меньше нуля, а про знак f_xx ничего не известно. Что можно сказать о типе точки?", "options": ["Точка — локальный минимум, если f_xx положительна", "Точка — седловая, независимо от знака f_xx", "Тип точки нельзя определить без знака f_xx", "Точка — локальный максимум, если f_xx отрицательна"], "correct": 1, "explain": "Знак f_xx важен только при D>0; при D<0 поверхность обязательно изгибается вверх в одном направлении и вниз в другом при любом знаке f_xx, поэтому точка седловая. Первые два варианта переносят логику случая D>0 на случай D<0. (HELM 18, критерий D=fxxfyy-fxy^2)", "usage": {"code": false, "without": "Не зная, что знак f_xx неважен при D<0, аналитик тратит время на лишнюю проверку f_xx.", "with": "Сразу видно, что при отрицательном D тип точки определён однозначно.", "benefit": "Ускоряет классификацию критических точек функции ошибки модели."}}, {"q": "Вычисления дали D равно нулю в стационарной точке функции двух переменных. Какой вывод из критерия второй производной здесь корректен?", "options": ["Точка гарантированно является локальным максимумом", "Точка гарантированно является седловой точкой", "Критерий не даёт ответа, нужен отдельный анализ", "Точка гарантированно является локальным минимумом"], "correct": 2, "explain": "Случай D=0 вырожденный: критерий второй производной не различает тип точки, и нужен дополнительный анализ, например по определению или через сечения функции. Остальные варианты приписывают критерию однозначный вывод, которого в этом случае нет. (HELM 18, критерий D=fxxfyy-fxy^2)", "usage": {"code": false, "without": "Аналитик может принять пограничный случай за явный минимум или максимум и сделать неверный вывод о модели.", "with": "Понимание вырожденного случая заставляет проверить точку дополнительными методами перед выводом.", "benefit": "Предотвращает ложные выводы об экстремуме на границе применимости критерия."}}, {"q": "Требуется найти экстремум функции прибыли двух переменных без каких-либо ограничений на переменные. Какой метод подходит для решения этой задачи?", "options": ["Безусловная оптимизация через стационарные точки", "Метод множителей Лагранжа с одним ограничением", "Метод множителей Лагранжа с двумя ограничениями", "Метод Гаусса для системы линейных уравнений"], "correct": 0, "explain": "Раз ограничений на переменные нет, ищутся обычные стационарные точки через f_x=0 и f_y=0 с классификацией по критерию второй производной — это безусловная оптимизация. Метод Лагранжа нужен только при ограничении-равенстве, которого здесь нет. (Stewart, Calculus, экстремумы функций нескольких переменных)", "usage": {"code": false, "without": "Без разделения задач по наличию ограничений аналитик может без нужды усложнить задачу лишним множителем Лагранжа.", "with": "Понимание отсутствия ограничения сразу указывает на прямой поиск стационарных точек.", "benefit": "Упрощает решение задачи максимизации прибыли без лишних переменных."}}, {"q": "Нужно найти максимум функции объёма при заданном ограничении в виде уравнения связи между переменными. Какой метод здесь уместен?", "options": ["Поиск обычных стационарных точек без учёта связи", "Критерий второй производной без учёта ограничения", "Метод Гаусса для приведения системы к треугольному виду", "Метод множителей Лагранжа для условной оптимизации"], "correct": 3, "explain": "Уравнение связи между переменными делает задачу условной оптимизацией, для которой стандартный инструмент — множители Лагранжа: составляется функция Лагранжа и решается система с учётом ограничения. Игнорирование связи, как в остальных вариантах, даёт экстремум не той задачи. (Stewart, Calculus, метод множителей Лагранжа)", "usage": {"code": false, "without": "Без учёта ограничения решение может нарушать условие связи и быть физически невозможным.", "with": "Множители Лагранжа встраивают ограничение прямо в систему уравнений на экстремум.", "benefit": "Даёт корректный максимум объёма при выполнении заданного ограничения."}}, {"q": "В точке поверхности градиент функции указывает в некотором направлении на плоскости. Что это направление означает геометрически?", "options": ["Направление вдоль ближайшей линии уровня", "Направление наискорейшего возрастания функции", "Направление наискорейшего убывания функции", "Направление, вдоль которого функция не меняется"], "correct": 1, "explain": "Градиент по определению указывает в сторону наибольшего роста функции в данной точке, а его длина равна максимальной скорости этого роста; направление наискорейшего убывания даёт антиградиент. Вдоль линии уровня функция постоянна, поэтому первые два варианта описывают не градиент. (Stewart, Calculus, градиент и линии уровня)", "usage": {"code": false, "without": "Не зная смысла градиента, аналитик может двигаться вдоль линии уровня и не приближаться к экстремуму функции потерь.", "with": "Знание направления градиента позволяет сразу выбрать направление шага к максимуму или минимуму.", "benefit": "Даёт верное направление движения в градиентных методах оптимизации."}}, {"q": "На карте линий уровня функции двух переменных в одной области линии расположены очень часто, а в другой — редко. Что это говорит о поведении функции?", "options": ["Частота линий уровня не связана со скоростью изменения", "В области с частыми линиями градиент близок к нулю", "В области с частыми линиями функция меняется быстро", "В области с редкими линиями функция терпит разрыв"], "correct": 2, "explain": "Расстояние между соседними линиями уровня обратно связано со скоростью изменения функции: чем гуще линии, тем больше по модулю градиент и тем быстрее меняется функция. Редкие линии означают медленное изменение, а не разрыв функции. (Stewart, Calculus, линии уровня)", "usage": {"code": false, "without": "Не читая густоту линий уровня, аналитик пропускает области резкого роста функции потерь на графике.", "with": "По густоте линий сразу видно, где функция меняется быстрее всего.", "benefit": "Помогает быстро находить крутые участки поверхности по одной картинке."}}, {"q": "При обучении модели выбрали слишком большой шаг градиентного спуска. Что скорее всего произойдёт с процессом сходимости?", "options": ["Шаги начнут перескакивать минимум и процесс может разойтись", "Сходимость к минимуму замедлится, но останется устойчивой", "Алгоритм сразу найдёт точный минимум за один шаг", "Направление градиента станет вычисляться неверно"], "correct": 0, "explain": "Слишком большой шаг заставляет каждое обновление переносить точку далеко за минимум, значение функции может расти от итерации к итерации, и процесс расходится или колеблется вместо сходимости. Само вычисление градиента при этом остаётся верным. (Stewart, Calculus, метод градиентного спуска)", "usage": {"code": false, "without": "Слишком большой шаг без объяснения выглядит как случайный сбой обучения модели.", "with": "Понимание роли шага позволяет сразу уменьшить его при расхождении функции потерь.", "benefit": "Позволяет быстро диагностировать расходящееся обучение модели."}}, {"q": "Для того же алгоритма выбрали, наоборот, слишком маленький шаг градиентного спуска. Как это скажется на процессе обучения?", "options": ["Процесс гарантированно разойдётся на первых шагах", "Минимум будет найден сразу за один шаг без итераций", "Направление градиента начнёт вычисляться неверно", "Процесс сойдётся устойчиво, но за много итераций"], "correct": 3, "explain": "Маленький шаг делает каждое обновление точки небольшим, поэтому траектория движется к минимуму устойчиво, но для этого нужно много итераций — компромисс между скоростью и стабильностью. Расхождение и однократное нахождение минимума характерны не для маленьких шагов, а направление градиента при этом вычисляется верно. (Stewart, Calculus, метод градиентного спуска)", "usage": {"code": false, "without": "Слишком долгое обучение модели без объяснения выглядит как зависший процесс.", "with": "Понимание эффекта маленького шага объясняет, почему обучение идёт устойчиво, но долго.", "benefit": "Помогает обоснованно подобрать шаг между скоростью и устойчивостью обучения."}}, {"q": "Измерили стороны прямоугольника с небольшой погрешностью и нужно оценить, как эта погрешность повлияет на вычисленную площадь. Какой инструмент здесь уместен?", "options": ["Критерий второй производной для площади как функции сторон", "Полный дифференциал площади как функции двух сторон", "Метод множителей Лагранжа с ограничением на периметр", "Точное вычисление площади для всех значений сторон"], "correct": 1, "explain": "Малое изменение функции двух переменных из-за малых погрешностей аргументов оценивается через полный дифференциал df=f_x dx+f_y dy, что для площади даёт линейное приближение погрешности без перебора всех значений. Критерий второй производной и Лагранж решают другие задачи. (Stewart, Calculus, полный дифференциал)", "usage": {"code": false, "without": "Без дифференциала для оценки погрешности пришлось бы пересчитывать площадь для всех крайних значений сторон.", "with": "Дифференциал сразу даёт линейную оценку погрешности по известным погрешностям измерений.", "benefit": "Быстро оценивает точность вычисленной величины по точности измерений."}}, {"q": "Аналитик подбирает прямую y = a + bx к точкам выборки методом наименьших квадратов, перебирая a и b. Какую величину он делает минимальной?", "options": ["Сумма квадратов отклонений точек от подобранной прямой", "Сумма модулей отклонений точек от подобранной прямой", "Сумма квадратов расстояний между соседними точками выборки", "Сумма произведений координат x и y всех точек выборки"], "correct": 0, "explain": "МНК определяет функцию потерь как сумму квадратов отклонений S(a,b) = Σ(y_i − a − bx_i)^2 и ищет её минимум по a и b; сумма модулей отклонений задаёт другую, негладкую задачу. (Stewart, Calculus, 14.7)", "usage": {"code": false, "without": "Аналитик путает МНК с минимизацией расстояний между соседними точками и подбирает прямую наугад.", "with": "Понимая, что МНК минимизирует сумму квадратов отклонений, аналитик ставит регрессию как корректную задачу оптимизации по a и b.", "benefit": "Правильная постановка задачи наименьших квадратов."}}, {"q": "В МНК функцию потерь S(a,b) = Σ(y_i − a − bx_i)^2 рассматривают как функцию двух переменных a и b. Какое условие определяет её точку минимума, то есть оптимальные коэффициенты прямой?", "options": ["Равенство нулю смешанной второй производной S по a и b", "Равенство единице обеих первых частных производных S по a и по b", "Равенство нулю самого значения функции S в этой точке", "Равенство нулю обеих первых частных производных S по a и по b"], "correct": 3, "explain": "Минимум гладкой функции двух переменных ищут среди стационарных точек, где обе первые частные производные обращаются в нуль; для S это даёт систему нормальных уравнений МНК. (Stewart, Calculus, 14.7)", "usage": {"code": false, "without": "Аналитик ищет минимум функции потерь S(a,b) перебором значений вслепую, не зная, что именно проверять.", "with": "Зная про равенство нулю обеих частных производных, аналитик сразу решает систему нормальных уравнений МНК.", "benefit": "Быстрый и точный способ найти оптимальные коэффициенты регрессии."}}, {"q": "При обучении линейной регрессии градиентным спуском на каждом шаге из коэффициентов вычитают произведение шага обучения на градиент функции потерь. Почему вычитают, а не прибавляют градиент?", "options": ["Направление по градиенту сокращает функцию потерь быстрее", "Направление против градиента ведёт к убыванию функции потерь", "Направление по градиенту ведёт к убыванию функции потерь", "Направление против градиента находит минимум за одну итерацию"], "correct": 1, "explain": "Градиент указывает направление наискорейшего роста функции, поэтому шаг в противоположную сторону кратчайшим образом уменьшает функцию потерь; движение по градиенту, напротив, увеличивало бы потери. (Stewart, Calculus, 14.6)", "usage": {"code": false, "without": "Разработчик по ошибке прибавляет градиент к весам, и функция потерь модели растёт с каждой итерацией.", "with": "Вычитая градиент из весов, разработчик добивается устойчивого убывания функции потерь при обучении.", "benefit": "Корректное направление шага в градиентном спуске."}}, {"q": "Градиентный спуск подбирает параметры модели, минимизируя функцию потерь L(w). По какому признаку на практике считают, что спуск достиг окрестности стационарной точки и его можно остановить?", "options": ["Значение функции потерь становится равным нулю на этом шаге", "Число выполненных итераций становится равным числу параметров модели", "Норма градиента функции потерь становится близкой к нулю", "Норма градиента функции потерь становится близкой к шагу обучения"], "correct": 2, "explain": "Стационарная точка гладкой функции характеризуется нулевым градиентом, поэтому на практике спуск останавливают, когда норма градиента становится достаточно малой; равенство нулю самой функции потерь с условием минимума не связано. (Stewart, Calculus, 14.7)", "usage": {"code": false, "without": "Инженер останавливает обучение модели по числу итераций наугад, не зная, сошёлся ли спуск.", "with": "Отслеживая норму градиента функции потерь, инженер останавливает спуск ровно у стационарной точки.", "benefit": "Обоснованный критерий остановки градиентного спуска."}}, {"q": "При обучении модели градиентным спуском в некоторой точке обе частные производные функции потерь обратились в нуль, но точка оказалась седловой, а не минимумом. Что вероятнее всего произойдёт со спуском вблизи неё?", "options": ["Спуск резко замедлится или временно застрянет рядом с точкой", "Спуск мгновенно достигнет глобального минимума функции потерь", "Спуск начнёт расходиться и значения весов уйдут в бесконечность", "Спуск автоматически перейдёт к следующей локальной точке минимума"], "correct": 0, "explain": "Вблизи седловой точки градиент мал по модулю, поэтому шаги градиентного спуска становятся крошечными и обучение стагнирует, хотя это не минимум; расхождение или переход к другому минимуму без специальных приёмов не происходят. (HELM 18.3; Stewart, Calculus, 14.7)", "usage": {"code": false, "without": "Команда решает, что модель сломалась, увидев, что обучение резко замедлилось около нулевого градиента.", "with": "Зная про седловые точки, команда распознаёт замедление спуска и применяет приёмы вроде момента для выхода из зоны.", "benefit": "Верная диагностика замедления обучения около седловой точки."}}, {"q": "Для стационарной точки функции прибыли f(x,y) вычислили D = f_xx f_yy − f_xy^2 и получили отрицательное значение. Как следует классифицировать эту точку?", "options": ["Точка остаётся полностью неклассифицируемой по этому критерию", "Точка является локальным максимумом функции прибыли", "Точка является локальным минимумом функции прибыли", "Точка является седловой, а не максимумом или минимумом"], "correct": 3, "explain": "По критерию второй производной отрицательный D = f_xx f_yy − f_xy^2 всегда указывает на седловую точку независимо от знака f_xx; для максимума или минимума требуется D больше нуля. (HELM 18.3)", "usage": {"code": false, "without": "Аналитик по знаку одной только второй производной f_xx делает вывод о типе стационарной точки прибыли и ошибается.", "with": "Вычислив D = f_xx f_yy − f_xy^2 и получив отрицательное значение, аналитик сразу распознаёт седловую точку.", "benefit": "Верная классификация стационарной точки функции двух переменных."}}, {"q": "Фирма производит два товара в количествах x и y, прибыль задаётся функцией P(x,y). Чтобы найти объёмы выпуска, максимизирующие прибыль без учёта ограничений, с чего нужно начать поиск?", "options": ["С решения системы P_x = 1 и P_y = 1 для поиска стационарных точек", "С решения P_x = 0 и P_y = 0 для поиска стационарных точек", "С решения уравнения P = 0 для поиска точек безубыточности", "С проверки того, что объёмы x и y совпадают в оптимальной точке"], "correct": 1, "explain": "Точки локального экстремума гладкой функции двух переменных ищут среди стационарных точек, где обе первые частные производные равны нулю; равенство P нулю даёт точки безубыточности, а не оптимум. (HELM 18.3; Stewart, Calculus, 14.7)", "usage": {"code": false, "without": "Менеджер меняет объёмы выпуска x и y наугад, пытаясь нащупать максимум прибыли перебором.", "with": "Менеджер составляет систему P_x = 0 и P_y = 0 и находит кандидатов на оптимальный объём выпуска аналитически.", "benefit": "Целенаправленный поиск точки максимума прибыли."}}, {"q": "В стационарной точке функции прибыли P(x,y) получили D = P_xx P_yy − P_xy^2 больше нуля и P_xx меньше нуля. Что это означает для найденного объёма выпуска?", "options": ["Это седловая точка прибыли фирмы", "Это точка, тип которой пока не определён", "Это локальный максимум прибыли фирмы", "Это локальный минимум прибыли фирмы"], "correct": 2, "explain": "При D больше нуля точка не седловая; знак P_xx определяет тип экстремума: отрицательный P_xx даёт локальный максимум, положительный — локальный минимум, что здесь и получено. (HELM 18.3)", "usage": {"code": false, "without": "Менеджер принимает найденную стационарную точку прибыли за максимум, не проверив её тип.", "with": "Проверив D больше нуля и P_xx меньше нуля, менеджер убеждается, что это действительно локальный максимум.", "benefit": "Надёжное подтверждение того, что найденная точка — максимум прибыли."}}, {"q": "Фирма выбирает объёмы двух ресурсов x и y, максимизируя выпуск f(x,y) при бюджетном ограничении g(x,y) = px x + py y = B. По методу множителей Лагранжа, какое условие должно выполняться в точке оптимума?", "options": ["Градиент f пропорционален градиенту g с множителем λ", "Градиент f равен нулевому вектору вне зависимости от g", "Градиент g пропорционален бюджету B с множителем λ", "Значения функций f и g совпадают в точке оптимума"], "correct": 0, "explain": "Метод Лагранжа требует, чтобы в точке условного экстремума градиент целевой функции был пропорционален градиенту ограничения, grad f = λ grad g, вместе с самим ограничением g = B; обнуление градиента f без учёта g подходит только для безусловной задачи. (Stewart, Calculus, 14.8)", "usage": {"code": false, "without": "Фирма распределяет бюджет между ресурсами x и y интуитивно, без учёта формы функции выпуска f.", "with": "Применяя условие grad f = λ grad g, фирма находит распределение ресурсов, оптимальное при заданном бюджете B.", "benefit": "Корректное решение задачи условной оптимизации с бюджетным ограничением."}}, {"q": "При обучении модели градиентным спуском значения функции потерь после каждой итерации не убывают, а колеблются со всё большей амплитудой и в итоге уходят в бесконечность. Данные и код корректны. Какая наиболее вероятная причина?", "options": ["Начальная точка спуска случайно совпала со стационарной точкой", "Шаг обучения выбран слишком маленьким для этой функции потерь", "Функция потерь не имеет ни одной стационарной точки", "Шаг обучения выбран слишком большим для функции потерь"], "correct": 3, "explain": "Слишком большой шаг обучения заставляет спуск перепрыгивать через минимум и с каждым шагом уходить всё дальше, что даёт расходящиеся колебания значений потерь; маленький шаг, напротив, замедляет, но не разгоняет расхождение. (Stewart, Calculus, 14.7)", "usage": {"code": false, "without": "Инженер видит расходящиеся колебания функции потерь и списывает это на плохие данные, не трогая шаг обучения.", "with": "Распознав расходимость как следствие слишком большого шага, инженер уменьшает шаг обучения и добивается сходимости.", "benefit": "Верная диагностика причины расходящегося градиентного спуска."}}, {"q": "Дано f(x,y)=3x²y−2xy³. Найдите частную производную f_x в точке x=1, y=2.", "options": ["f_x = 4", "f_x = 28", "f_x = -4", "f_x = 12"], "correct": 2, "explain": "Шаг 1: f_x=6xy−2y³ по правилу дифференцирования каждого слагаемого по x при фиксированном y. Шаг 2: подставляем x=1, y=2: 6·1·2−2·2³=12−16. Шаг 3: получаем f_x=−4; вариант 12 — потеряно второе слагаемое, вариант 28 — потерян знак минус. Stewart, Calculus, гл. 14.", "usage": {"code": false, "without": "Аналитик путает частную производную по x с производной по y и получает неверный знак прироста метрики.", "with": "Аналитик верно берёт частную производную, фиксируя остальные переменные, и получает точный локальный наклон функции по нужной оси.", "benefit": "Точная частная производная — основа корректного градиента для оптимизации модели."}}, {"q": "Дано f(x,y)=x²+y². Найдите модуль градиента в точке x=3, y=4.", "options": ["|∇f| = 10", "|∇f| = 100", "|∇f| = 14", "|∇f| = 5"], "correct": 0, "explain": "Шаг 1: градиент ∇f=(2x, 2y) в точке равен (6, 8). Шаг 2: модуль равен корню из 6²+8²=36+64=100. Шаг 3: корень из 100 равен 10; вариант 5 получается, если забыть умножить производную на 2, вариант 100 — если не извлечь корень. Stewart, Calculus, гл. 14.", "usage": {"code": false, "without": "Аналитик путает модуль градиента с суммой квадратов его компонент и завышает оценку скорости роста метрики в 10 раз.", "with": "Аналитик корректно извлекает корень из суммы квадратов и получает истинную скорость наискорейшего роста функции в точке.", "benefit": "Верный модуль градиента задаёт реальный масштаб шага при оптимизации."}}, {"q": "Дано f(x,y)=3x²+4y². В точке x=1, y=1 найдите производную по направлению единичного вектора u с компонентами 0.8 и 0.6.", "options": ["D_u f = 10.0", "D_u f = 14.0", "D_u f = 8.8", "D_u f = 9.6"], "correct": 3, "explain": "Шаг 1: частные производные f_x=6x=6 и f_y=8y=8 в точке. Шаг 2: производная по направлению равна скалярному произведению градиента на единичный вектор: 6·0.8+8·0.6=4.8+4.8. Шаг 3: сумма даёт 9.6; вариант 10.0 получается при перепутанных местами компонентах вектора направления. HELM Workbook 18.", "usage": {"code": false, "without": "Аналитик берёт направление изменения признаков наугад и не может сказать, растёт ли метрика вдоль конкретного сценария.", "with": "Аналитик считает производную по направлению и точно знает скорость изменения функции вдоль выбранного единичного вектора.", "benefit": "Производная по направлению переводит градиент в ответ на конкретный сценарий изменения признаков."}}, {"q": "Дано f(x,y)=x²+y²−2x+4y. Найдите тип стационарной точки через D=f_xx·f_yy−f_xy².", "options": ["точка перегиба", "минимум функции", "максимум функции", "седловая точка"], "correct": 1, "explain": "Шаг 1: из f_x=2x−2=0 и f_y=2y+4=0 находим стационарную точку x=1, y=−2. Шаг 2: вторые производные f_xx=2, f_yy=2, f_xy=0 дают D=2·2−0=4. Шаг 3: D>0 и f_xx>0 — минимум функции; седловая точка была бы при D меньше нуля. Stewart, Calculus, гл. 14.", "usage": {"code": false, "without": "Аналитик находит точку с f_x=f_y=0 и сразу считает её оптимумом модели, не проверив тип критерием второй производной.", "with": "Аналитик проверяет знак D и знак f_xx и корректно подтверждает, что найденная точка — минимум функции потерь.", "benefit": "Критерий D защищает от принятия седловой точки за настоящий минимум."}}, {"q": "Дано f(x,y)=x³−3xy+y³. В стационарной точке x=0, y=0 определите тип через D=f_xx·f_yy−f_xy².", "options": ["точка перегиба", "минимум функции", "седловая точка", "максимум функции"], "correct": 2, "explain": "Шаг 1: вторые производные f_xx=6x, f_yy=6y, f_xy=−3 в точке 0, 0 равны 0, 0 и −3. Шаг 2: D=0·0−(−3)²=−9. Шаг 3: D<0 означает седловую точку независимо от знака f_xx; вторая стационарная точка этой функции, x=1, y=1, оказывается минимумом функции. HELM Workbook 18.", "usage": {"code": false, "without": "Аналитик видит f_x=f_y=0 в точке 0, 0 и ошибочно отчитывается о найденном минимуме функции потерь.", "with": "Аналитик считает D, видит отрицательное значение и верно классифицирует точку как седловую, требующую другого метода оптимизации.", "benefit": "Различение седловой точки и экстремума экономит время на неверной оптимизации."}}, {"q": "Дано f(x,y)=x²−y²+4. Найдите значение функции в её седловой точке.", "options": ["f=4", "f=5", "f=8", "f=0"], "correct": 0, "explain": "Шаг 1: из f_x=2x=0 и f_y=−2y=0 стационарная точка x=0, y=0. Шаг 2: D=f_xx·f_yy−f_xy²=2·(−2)−0=−4 меньше нуля, значит точка седловая. Шаг 3: значение функции в ней f=0²−0²+4=4; вариант f=0 получается, если забыть постоянное слагаемое. Stewart, Calculus, гл. 14.", "usage": {"code": false, "without": "Аналитик путает седловую точку с локальным экстремумом и приводит неверное опорное значение метрики в отчёте.", "with": "Аналитик сначала классифицирует точку через D, затем аккуратно подставляет координаты и получает верное опорное значение.", "benefit": "Значение в седловой точке — надёжный ориентир для сравнения моделей, если тип точки подтверждён заранее."}}, {"q": "Найдите уравнение касательной плоскости к поверхности z=x²+y² в точке x=1, y=2, z=5.", "options": ["z = 4x + 2y − 5", "z = 2x + 4y + 3", "z = 2x + 4y + 5", "z = 2x + 4y − 5"], "correct": 3, "explain": "Шаг 1: частные производные f_x=2x=2 и f_y=2y=4 в точке. Шаг 2: касательная плоскость записывается как z=f+f_x·(x−1)+f_y·(y−2), то есть 5+2(x−1)+4(y−2). Шаг 3: после раскрытия скобок получаем z=2x+4y−5; вариант с коэффициентами 4 и 2 получается при перепутанных местами производных. Stewart, Calculus, гл. 14.", "usage": {"code": false, "without": "Аналитик аппроксимирует поверхность неверной плоскостью и получает искажённый линейный прогноз рядом с рабочей точкой.", "with": "Аналитик строит касательную плоскость по частным производным и получает точную линейную аппроксимацию модели рядом с точкой.", "benefit": "Касательная плоскость даёт быстрый линейный прогноз без пересчёта полной нелинейной функции."}}, {"q": "Дано f(x,y)=x²y в точке x=2, y=3. Оцените приближённую погрешность df при dx=0.1 и dy=−0.05 через полный дифференциал.", "options": ["df = 1.2", "df = 1.0", "df = -0.2", "df = 1.4"], "correct": 1, "explain": "Шаг 1: частные производные f_x=2xy=12 и f_y=x²=4 в точке. Шаг 2: полный дифференциал df=f_x·dx+f_y·dy=12·0.1+4·(−0.05)=1.2−0.2. Шаг 3: итог df=1.0; вариант 1.4 получается, если потерять знак минус у dy. Stewart, Calculus, гл. 14.", "usage": {"code": false, "without": "Аналитик считает погрешность выходной метрики линейно только от одной входной переменной и недооценивает вклад второй.", "with": "Аналитик применяет полный дифференциал и получает суммарную оценку погрешности сразу от всех входных переменных.", "benefit": "Полный дифференциал переводит погрешности измерений в единую оценку ошибки результата."}}, {"q": "Дано f(x,y)=x²+y², точка x=3, y=4, шаг градиентного спуска альфа=0.1. Найдите координаты точки после одного шага.", "options": ["x=3.6, y=4.8", "x=-3.0, y=-4.0", "x=2.4, y=3.2", "x=2.7, y=3.6"], "correct": 2, "explain": "Шаг 1: градиент ∇f=(2x, 2y) в точке равен (6, 8). Шаг 2: новая точка равна старой минус альфа умножить на градиент: (3−0.1·6, 4−0.1·8). Шаг 3: получаем x=2.4, y=3.2; вариант x=3.6, y=4.8 получается при сложении вместо вычитания, то есть при шаге вверх по функции. Курс MDA, тема Optimization.", "usage": {"code": false, "without": "Аналитик двигает параметры в сторону координат точки вместо направления градиента, и шаг спуска уводит модель в случайную сторону.", "with": "Аналитик вычисляет градиент, умножает на шаг обучения и корректно двигает параметры в сторону убывания функции потерь.", "benefit": "Один верно посчитанный шаг градиентного спуска подтверждает, что цикл обучения действительно уменьшает ошибку."}}, {"q": "Методом множителей Лагранжа найдите максимум f=xy при ограничении x+y=10.", "options": ["25 в точке x=5, y=5", "0 в точке x=10, y=0", "10 в точке x=5, y=5", "100 в точке x=10, y=10"], "correct": 0, "explain": "Шаг 1: составляем условия f_x=y=лямбда и f_y=x=лямбда, откуда x=y. Шаг 2: подставляем x=y в ограничение x+y=10 и получаем x=y=5. Шаг 3: значение функции f=5·5=25; вариант 100 получается, если забыть разделить сумму 10 пополам и взять x=y=10. Stewart, Calculus, 14.8.", "usage": {"code": false, "without": "Аналитик перебирает граничные значения x+y=10 вручную и рискует пропустить настоящий максимум произведения показателей.", "with": "Аналитик решает систему через множитель Лагранжа и сразу получает точку и значение условного максимума.", "benefit": "Метод Лагранжа находит условный экстремум без перебора, что критично при многих ограничениях."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
