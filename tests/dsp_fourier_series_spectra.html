<title>DSP 3: Ряд Фурье и спектры периодических сигналов</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<style>
  .katex { font-size: 1.08em; }
  .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; }
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .qimg { margin: 0 0 12px; }
  .qimg a { display: block; max-width: 560px; }
  .qimg img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); }
  .qimg figcaption { margin-top: 4px; font-size: .72rem; color: var(--muted); }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>

<script>
(function () {
  const TEST_ID = "dsp_fourier_series_spectra";
  const QUESTIONS = [{"q": "Что такое тригонометрический ряд Фурье (trigonometric Fourier series) периодического сигнала \\(s(t)\\) с периодом \\(T\\)?", "options": ["Сумма постоянной составляющей и гармоник с частотами \\(n\\omega_1\\), кратными \\(\\omega_1=2\\pi/T\\)", "Сумма синусоид любых частот, подобранных так, чтобы точнее всего повторить \\(s(t)\\)", "Сумма значений \\(s(t)\\) в моменты \\(t=nT\\), умноженных на синусоиды той же частоты", "Разложение \\(s(t)\\) по степеням \\(t\\) около точки \\(t=0\\), как в ряде Тейлора"], "correct": 0, "explain": "Периодический сигнал повторяется через \\(T\\), поэтому в нём могут быть только колебания, которые укладываются в период целое число раз: частоты \\(\\omega_1, 2\\omega_1, 3\\omega_1,\\dots\\) Отсюда \\[s(t)=\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}\\left(a_n\\cos n\\omega_1 t+b_n\\sin n\\omega_1 t\\right).\\] «Любые частоты» — это уже интеграл Фурье для непериодического (одиночного) сигнала. «Значения в моменты \\(nT\\)» путают ряд с дискретизацией: в моменты \\(nT\\) периодический сигнал вообще одинаков. Ряд Тейлора раскладывает по степеням \\(t\\), а не по колебаниям. Интуиция: ряд — рецепт коктейля, какие «ноты» \\(n\\omega_1\\) и сколько каждой.", "usage": {"code": false, "without": "Вибрация колеса робота снята осциллографом: на экране сложная кривая, непонятно, откуда она берётся.", "with": "Раскладываешь запись в ряд: видна 1-я гармоника на частоте оборота колеса и сильная 3-я — от трёх спиц крепления.", "benefit": "Каждая гармоника указывает на свой источник вибрации"}}, {"q": "Период сигнала \\(T\\). Что такое \\(\\omega_1\\) в записи ряда Фурье и в чём она измеряется?", "options": ["Частота первой гармоники \\(\\omega_1=1/T\\), измеряется в герцах", "Угловая частота \\(\\omega_1=\\pi/T\\): половина оборота за период, рад/с", "Угловая частота первой гармоники \\(\\omega_1=2\\pi/T\\), в радианах в секунду", "Шаг по времени между отсчётами \\(\\omega_1=T/2\\pi\\), в секундах"], "correct": 2, "explain": "\\(\\omega_1=\\frac{2\\pi}{T}\\) — основная угловая частота (fundamental angular frequency): за период первая гармоника делает ровно один оборот, то есть \\(2\\pi\\) радиан. В герцах та же частота \\(f_1=1/T\\) — обороты в секунду; путать \\(\\omega\\) и \\(f\\) значит ошибиться в \\(2\\pi\\approx6{,}28\\) раза. \\(\\pi/T\\) — пол-оборота за период, это была бы частота сигнала с периодом \\(2T\\). \\(T/2\\pi\\) — вообще время, а не частота.", "usage": {"code": false, "without": "Ты подставляешь в формулу частоту ШИМ 20 кГц как \\(\\omega_1\\) и получаешь гармоники в 6,28 раза ниже настоящих.", "with": "Ты пишешь \\(\\omega_1=2\\pi\\cdot 20000\\approx1{,}26\\cdot10^5\\) рад/с, а в герцах шаг линий — 20 кГц.", "benefit": "Частоты на графике совпадают с тем, что показывает анализатор"}}, {"q": "Что физически означает слагаемое \\(a_0/2\\) в ряде Фурье?", "options": ["Среднее значение сигнала за период — постоянную составляющую", "Половину наибольшего значения сигнала за период", "Амплитуду первой гармоники, делённую пополам", "Значение сигнала в момент \\(t=0\\), делённое на два"], "correct": 0, "explain": "\\(\\frac{a_0}{2}=\\frac1T\\int_0^T s(t)\\,dt\\) — площадь под графиком за период, делённая на \\(T\\) (DC component, mean value). Интуиция: «расплавили» ступеньки и разлили ровным слоем по всему периоду. Это не половина максимума: у сигнала 1 с доски 04.11 максимум 2, а среднее \\(2/3\\). С первой гармоникой и значением в \\(t=0\\) среднее никак не связано. Двойка в знаменателе — потому что \\(a_0\\) считают той же формулой, что \\(a_n\\), с множителем \\(2/T\\).", "usage": {"code": false, "without": "Датчик тока мотора показывает пульсирующий сигнал, и ты берёшь за «ток» его пиковое значение — регулятор завышает нагрузку.", "with": "Ты берёшь \\(a_0/2\\) — среднее за период ШИМ — это и есть ток, который создаёт момент.", "benefit": "Постоянная составляющая отделяется от пульсаций"}}, {"q": "Что изображает амплитудный спектр (amplitude spectrum) периодического сигнала?", "options": ["Значения сигнала \\(s(t)\\) в моменты \\(t=nT\\): линии над осью времени", "Сплошную кривую \\(|s(t)|\\), перенесённую с оси времени на ось частот", "Начальные фазы \\(\\psi_n\\) гармоник: вертикальные линии над \\(n\\omega_1\\)", "Амплитуды \\(A_n\\) гармоник: вертикальные линии над частотами \\(n\\omega_1\\)"], "correct": 3, "explain": "Амплитудный спектр — это «рецепт»: над каждой частотой \\(n\\omega_1\\) столбик высотой \\(A_n\\ge0\\) (и над нулём — постоянная составляющая \\(a_0/2\\)). Начальные фазы \\(\\psi_n\\) рисуют на отдельном графике — фазовом спектре (phase spectrum). Значения \\(s(t)\\) по времени — это сам сигнал, а не спектр. Модуль сигнала на оси частот — бессмыслица: частотная ось требует разложения на гармоники.", "usage": {"code": false, "without": "Ты смотришь на сигнал энкодера по времени и не видишь, что к нему подмешана наводка 50 Гц.", "with": "На амплитудном спектре над 50 Гц стоит отдельная линия, и её высота говорит, сколько наводки.", "benefit": "Составляющие, слитые во времени, разделяются по частоте"}}, {"q": "Что такое начальная фаза (initial phase) \\(\\psi_n\\) гармоники \\(A_n\\cos(n\\omega_1 t+\\psi_n)\\)?", "options": ["Угол гармоники в момент \\(t=0\\): насколько она сдвинута относительно косинуса", "Угол, на который гармоника поворачивается за один период \\(T\\) сигнала", "Время задержки гармоники относительно начала периода, в секундах", "Угол между гармониками с номерами \\(n\\) и \\(n+1\\) в один и тот же момент"], "correct": 0, "explain": "При \\(t=0\\) аргумент косинуса равен \\(\\psi_n\\) — это «снимок стрелки» гармоники в начальный момент. \\(\\psi_n=0\\) — чистый косинус, \\(-90^\\circ\\) — синус, \\(180^\\circ\\) — перевёрнутый косинус. За период \\(n\\)-я гармоника поворачивается на \\(2\\pi n\\), а не на \\(\\psi_n\\). Задержка во времени — это \\(t_0=-\\psi_n/(n\\omega_1)\\), секунды, а фаза — угол. Угол между соседними гармониками ни к чему не привязан: у них разные частоты.", "usage": {"code": false, "without": "Ты складываешь первую и третью гармоники датчика по амплитудам и получаешь пик, которого в сигнале нет.", "with": "Ты учитываешь начальные фазы: третья гармоника в противофазе у вершины и сплющивает пик.", "benefit": "Форма сигнала восстанавливается верно, а не только его «громкость»"}}, {"q": "Почему спектр периодического сигнала линейчатый (line spectrum), а не сплошной?", "options": ["Его рисуют линиями для удобства, а на деле спектр между \\(n\\omega_1\\) сплошной", "В периодическом сигнале есть только частоты, кратные \\(\\omega_1\\); между ними пусто", "Линии — это отсчёты сплошного спектра с шагом, который выбирает сам расчётчик", "Любой сигнал на конечном интервале имеет линии с шагом \\(1/T\\) радиан в секунду"], "correct": 1, "explain": "Колебание с частотой, не кратной \\(\\omega_1=2\\pi/T\\), не повторялось бы через \\(T\\) — значит, в периодическом сигнале его нет. Остаются частоты \\(0,\\omega_1,2\\omega_1,\\dots\\), и спектр — линии с шагом \\(\\omega_1\\). Это не условность рисунка и не выбор расчётчика: шаг задаёт период сигнала. Последний вариант путает единицы: шаг \\(1/T\\) — в герцах, в радианах в секунду он \\(2\\pi/T\\); к тому же одиночный сигнал имеет сплошной спектр.", "usage": {"code": false, "without": "Ты ищешь в спектре ШИМ-сигнала 20 кГц помеху на 27 кГц и думаешь, что это гармоника ШИМ.", "with": "Ты знаешь: гармоники ШИМ стоят только на 20, 40, 60 кГц, а 27 кГц — посторонний источник.", "benefit": "Сразу видно, какие линии принадлежат периодическому сигналу, а какие нет"}}, {"q": "Сигнал имеет период \\(T\\). Какой наименьший период у его 3-й гармоники?", "options": ["\\(T/3\\): частота \\(3\\omega_1\\) втрое выше, поэтому колебание втрое короче", "\\(3T\\): номер гармоники умножает период сигнала в три раза", "\\(T\\): у всех гармоник наименьший период такой же, как у сигнала", "\\(T/6\\): частота \\(3\\omega_1\\) и ещё половина — полупериод колебания"], "correct": 0, "explain": "3-я гармоника — \\(\\cos 3\\omega_1 t\\), её период \\(\\frac{2\\pi}{3\\omega_1}=\\frac{T}{3}\\). За время \\(T\\) она укладывается ровно 3 раза — поэтому \\(T\\) тоже её период, но не наименьший. \\(3T\\) получается, если номер умножить на период, а не на частоту. \\(T/6\\) — половина периода гармоники, а не период.", "usage": {"code": false, "without": "Ты ищешь на осциллограмме третью гармонику мотора с периодом \\(3T\\) и не находишь её.", "with": "Ты ждёшь колебание с периодом \\(T/3\\) — три волны на один оборот — и видишь его сразу.", "benefit": "Связь номера гармоники с её периодом читается без расчёта"}}, {"q": "Что такое средняя мощность (average power) периодического сигнала \\(s(t)\\) в теории сигналов?", "options": ["\\(P=\\frac1T\\int_0^T s(t)\\,dt\\) — среднее значение сигнала за период, на 1 Ом", "\\(P=\\frac1T\\int_0^T s^2(t)\\,dt\\) — средний квадрат за период, мощность на 1 Ом", "\\(P=\\int_{-\\infty}^{\\infty} s^2(t)\\,dt\\) — квадрат сигнала по всей оси времени", "\\(P=\\max s^2(t)\\) — квадрат пика, то есть мгновенная мощность в максимуме"], "correct": 1, "explain": "Средняя мощность — средний квадрат: \\(P=\\frac1T\\int_0^T s^2\\,dt\\); если \\(s\\) — напряжение, это мощность на резисторе 1 Ом, единица — \\(\\text{В}^2\\). Среднее значение — это \\(a_0/2\\), не мощность: у сигнала 2 с доски среднее 0, а мощность \\(1/2\\). Интеграл по всей оси — энергия (energy), как у одиночных импульсов из домашки 11.10; у периодического сигнала она бесконечна. Пиковое значение мощности завышает среднюю: у пилы \\(P=S_m^2/3\\), а пик \\(S_m^2\\).", "usage": {"code": false, "without": "Ты оцениваешь нагрев шунта по среднему току ШИМ и получаешь заниженную мощность.", "with": "Ты считаешь средний квадрат за период — именно он греет резистор.", "benefit": "Нагрев и мощность оцениваются правильно"}}, {"q": "В экспоненциальном ряде (exponential Fourier series) появляются отрицательные частоты \\(-n\\omega_1\\). Что они значат?", "options": ["Косинус — пара векторов, крутящихся навстречу; \\(-n\\omega_1\\) — второй вектор пары", "Это гармоники, которые сигнал излучает в обратную сторону; их отфильтровывают", "Это погрешность округления: их отбрасывают, а остальной спектр удваивают", "Это гармоники с отрицательной амплитудой, то есть с фазой \\(180^\\circ\\)"], "correct": 0, "explain": "\\(\\cos x=\\frac{e^{jx}+e^{-jx}}{2}\\): вектор \\(e^{jx}\\) крутится против часовой стрелки, \\(e^{-jx}\\) — по часовой. Мнимые части гасят друг друга, вещественные складываются в косинус. Поэтому каждая гармоника \\(A_n\\cos(n\\omega_1t+\\psi_n)\\) в экспоненциальной форме — две линии, при \\(+n\\omega_1\\) и при \\(-n\\omega_1\\), по \\(A_n/2\\). Это не физические волны «в обратную сторону» и не ошибка округления. Отрицательная амплитуда тут ни при чём: знак уходит в фазу, а не в частоту.", "usage": {"code": false, "without": "Ты видишь в выводе FFT линии на «отрицательных» частотах и ищешь у датчика вторую, неизвестную помеху.", "with": "Ты знаешь: это пара к положительной линии; реальная гармоника — их сумма, \\(2\\cdot A_n/2\\).", "benefit": "Двусторонний спектр читается без ложных тревог"}}, {"q": "Чем двусторонний спектр (two-sided spectrum) отличается от одностороннего (one-sided)?", "options": ["Гармоника удваивается: две линии по \\(A_n\\) при \\(\\pm n\\omega_1\\), среднее тоже удвоено", "Гармоника \\(A_n\\) делится на две линии по \\(A_n/2\\) при \\(\\pm n\\omega_1\\); среднее не делится", "Линии те же, \\(A_n\\), и фаза при \\(-n\\omega_1\\) такая же, как при \\(+n\\omega_1\\)", "Гармоника делится пополам при \\(\\pm n\\omega_1\\), и среднее \\(a_0/2\\) тоже делится на две"], "correct": 1, "explain": "\\[A_n\\cos(n\\omega_1t+\\psi_n)=\\frac{A_n}{2}e^{j\\psi_n}e^{jn\\omega_1t}+\\frac{A_n}{2}e^{-j\\psi_n}e^{-jn\\omega_1t}.\\] Высота каждой линии \\(A_n/2\\), фазы \\(+\\psi_n\\) и \\(-\\psi_n\\) — противоположные. Постоянная составляющая стоит на нулевой частоте одна, у неё нет пары, поэтому её не делят. Удвоение — обратная ошибка; одинаковая фаза на \\(\\pm n\\omega_1\\) дала бы не косинус, а комплексный сигнал.", "usage": {"code": false, "without": "Ты сравниваешь спектр из MATLAB fft (двусторонний) с расчётом в тетради и видишь, что все линии вдвое ниже — ищешь ошибку в формуле.", "with": "Ты складываешь пары линий \\(\\pm n\\omega_1\\): получается ровно \\(A_n\\) из тетради, а среднее совпадает сразу.", "benefit": "Две формы спектра сверяются без путаницы"}}, {"q": "Ряд записан как \\(s(t)=\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}(a_n\\cos n\\omega_1 t+b_n\\sin n\\omega_1 t)\\). По какой формуле считается \\(a_n\\)?", "options": ["\\(a_n=\\frac{1}{T}\\int_0^T s(t)\\cos n\\omega_1 t\\,dt\\)", "\\(a_n=\\frac{2}{T}\\int_0^T s(t)\\sin n\\omega_1 t\\,dt\\)", "\\(a_n=\\frac{2}{T}\\int_0^T s(t)\\cos n\\omega_1 t\\,dt\\)", "\\(a_n=\\frac{2}{T}\\int_0^T s(t)\\cos \\omega_1 t\\,dt\\)"], "correct": 2, "explain": "Сигнал умножают на «пробную волну» \\(\\cos n\\omega_1t\\) и усредняют: все остальные гармоники дают ноль, остаётся \\(a_n\\cdot\\overline{\\cos^2}=a_n/2\\). Чтобы получить \\(a_n\\), а не половину, множитель \\(\\frac2T\\), а не \\(\\frac1T\\) — с \\(\\frac1T\\) ответ выйдет вдвое меньше. С синусом получается \\(b_n\\), а не \\(a_n\\). Без \\(n\\) под косинусом формула всегда давала бы первую гармонику.", "usage": {"code": false, "without": "Ты считаешь гармоники тока мотора с множителем \\(1/T\\) и докладываешь, что пульсации вдвое меньше, чем есть.", "with": "С множителем \\(2/T\\) амплитуды совпадают с тем, что показывает анализатор спектра.", "benefit": "Коэффициенты получаются в правильном масштабе"}}, {"q": "Почему постоянную составляющую пишут как \\(a_0/2\\), а не просто \\(a_0\\)?", "options": ["Постоянная составляющая делится поровну между \\(+0\\) и \\(-0\\) в двустороннем спектре", "Двойка компенсирует то, что интеграл берут лишь по половине периода, \\(T/2\\)", "\\(a_0\\) считают той же формулой, что \\(a_n\\), с множителем \\(2/T\\); среднее — его половина", "Так обозначают половину размаха: \\(a_0\\) — расстояние от минимума до максимума"], "correct": 2, "explain": "Если подставить \\(n=0\\) в \\(a_n=\\frac2T\\int_0^T s\\cos n\\omega_1t\\,dt\\), выйдет \\(a_0=\\frac2T\\int_0^T s\\,dt\\) — удвоенное среднее. Чтобы одна формула работала для всех \\(n\\), пишут \\(a_0\\), а в ряд ставят \\(a_0/2=\\frac1T\\int_0^T s\\,dt\\). Никакого «\\(-0\\)» нет: нулевая частота одна. Интеграл берут по всему периоду. С размахом сигнала \\(a_0\\) не связан.", "usage": {"code": false, "without": "Ты подставляешь в ряд \\(a_0\\) вместо \\(a_0/2\\), и смещение АЦП в модели выходит вдвое больше настоящего.", "with": "Ты помнишь, что в ряд идёт половина \\(a_0\\), и модель совпадает с замером среднего.", "benefit": "Постоянная составляющая не удваивается по ошибке"}}, {"q": "Ряд в амплитудно-фазовой форме: \\(s(t)=\\frac{a_0}{2}+\\sum A_n\\cos(n\\omega_1 t+\\psi_n)\\). Как \\(A_n\\) и \\(\\psi_n\\) связаны с \\(a_n\\), \\(b_n\\)?", "options": ["\\(A_n=\\sqrt{a_n^2+b_n^2}\\), \\(a_n=A_n\\cos\\psi_n\\), \\(b_n=-A_n\\sin\\psi_n\\)", "\\(A_n=\\sqrt{a_n^2+b_n^2}\\), \\(a_n=A_n\\cos\\psi_n\\), \\(b_n=A_n\\sin\\psi_n\\)", "\\(A_n=a_n+b_n\\), \\(a_n=A_n\\cos\\psi_n\\), \\(b_n=-A_n\\sin\\psi_n\\)", "\\(A_n=\\sqrt{a_n^2+b_n^2}/2\\), \\(a_n=A_n\\sin\\psi_n\\), \\(b_n=A_n\\cos\\psi_n\\)"], "correct": 0, "explain": "Раскрываем: \\(A_n\\cos(x+\\psi_n)=A_n\\cos\\psi_n\\cos x-A_n\\sin\\psi_n\\sin x\\). Сравниваем с \\(a_n\\cos x+b_n\\sin x\\): \\(a_n=A_n\\cos\\psi_n\\), \\(b_n=-A_n\\sin\\psi_n\\), и \\(A_n=\\sqrt{a_n^2+b_n^2}\\). Знак «плюс» у \\(b_n\\) — частая ошибка: он верен для записи \\(\\cos(x-\\psi_n)\\), а не для доски. Амплитуды не складываются: \\(a_n\\) и \\(b_n\\) — катеты, \\(A_n\\) — гипотенуза. Деление на 2 относится к двустороннему спектру, а не к \\(A_n\\).", "usage": {"code": false, "without": "Ты берёшь фазу гармоники вибрации с неверным знаком, и компенсирующий сигнал усиливает вибрацию вместо гашения.", "with": "С \\(b_n=-A_n\\sin\\psi_n\\) фаза выходит верной, и противофазная компенсация гасит гармонику.", "benefit": "Фаза гармоники получается с правильным знаком"}}, {"q": "На доске экспоненциальный ряд записан так: \\(s(t)=\\sum_{n=-\\infty}^{\\infty}\\frac{\\dot C_n}{2}e^{jn\\omega_1 t}\\), где \\(\\frac{\\dot C_n}{2}=\\frac1T\\int_0^T s(t)e^{-jn\\omega_1 t}dt\\). Чему равно \\(\\dot C_n\\) в этих обозначениях?", "options": ["\\(\\dot C_n=a_n+jb_n\\), а значит, \\(|\\dot C_n|=A_n\\)", "\\(\\dot C_n=(a_n-jb_n)/2\\), а значит, \\(|\\dot C_n|=A_n/2\\)", "\\(\\dot C_n=b_n-ja_n\\), а значит, \\(|\\dot C_n|=A_n\\)", "\\(\\dot C_n=a_n-jb_n\\), а значит, \\(|\\dot C_n|=A_n\\)"], "correct": 3, "explain": "\\(e^{-jx}=\\cos x-j\\sin x\\), поэтому \\(\\dot C_n=\\frac2T\\int_0^T s\\cos n\\omega_1t\\,dt-j\\frac2T\\int_0^T s\\sin n\\omega_1t\\,dt=a_n-jb_n\\), \\(|\\dot C_n|=A_n\\), \\(\\arg\\dot C_n=\\psi_n\\). Плюс перед \\(jb_n\\) появляется, если забыть минус в \\(e^{-jx}\\). Вариант с делением на 2 — это \\(\\dot C_n/2\\), высота линии двустороннего спектра. Осторожно: у Баскакова коэффициентом при экспоненте называют само \\(\\dot C_n\\), и там \\(|\\dot C_n|=A_n/2\\); линии те же, меняется только имя. В этом вопросе соглашение доски.", "usage": {"code": false, "without": "Ты берёшь формулу из учебника, а ответ сверяешь с доской — и все коэффициенты «не сходятся» в два раза.", "with": "Ты сначала смотришь, что стоит при экспоненте — \\(\\dot C_n\\) или \\(\\dot C_n/2\\), — и множитель 2 больше не теряется.", "benefit": "Соглашение о множителе 2 видно до начала расчёта"}}, {"q": "Сигнал \\(s(t)\\) вещественный. Как связаны \\(\\dot C_{-n}\\) и \\(\\dot C_n\\) и что из этого следует для двустороннего спектра?", "options": ["\\(\\dot C_{-n}=\\dot C_n\\): и амплитудный, и фазовый спектры чётные", "\\(\\dot C_{-n}=-\\dot C_n\\): амплитудный спектр нечётный, фазовый — чётный", "\\(\\dot C_{-n}=\\dot C_n^*\\): амплитудный спектр нечётный, фазовый — чётный", "\\(\\dot C_{-n}=\\dot C_n^*\\): амплитудный спектр чётный, фазовый — нечётный"], "correct": 3, "explain": "В формуле \\(\\frac{\\dot C_n}{2}=\\frac1T\\int s\\,e^{-jn\\omega_1t}dt\\) замена \\(n\\to-n\\) меняет знак у \\(j\\), а \\(s\\) вещественный — получается сопряжённое (\\(^*\\)): \\(\\dot C_{-n}=a_n+jb_n\\). Модуль у сопряжённых одинаков — амплитудный спектр симметричен; угол противоположен — фазовый спектр антисимметричен. Равенство \\(\\dot C_{-n}=\\dot C_n\\) верно лишь для чётного сигнала. У модуля не бывает «нечётного» спектра: он не может быть отрицательным.", "usage": {"code": false, "without": "Ты рисуешь фазовый спектр ДЗ симметрично и получаешь «сигнал» с мнимой частью, которого быть не может.", "with": "Ты зеркалишь фазы со сменой знака, и проверка \\(\\dot C_n e^{jx}/2+\\dot C_n^* e^{-jx}/2\\) даёт вещественный косинус.", "benefit": "Половину двустороннего спектра не нужно считать заново"}}, {"q": "Как найти среднюю мощность (average power) периодического сигнала по его одностороннему спектру — равенство Парсеваля?", "options": ["\\(P=\\left(\\frac{a_0}{2}\\right)^2+\\sum_{n=1}^{\\infty}A_n^2\\)", "\\(P=\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}\\frac{A_n^2}{2}\\)", "\\(P=\\left(\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}A_n\\right)^2\\)", "\\(P=\\left(\\frac{a_0}{2}\\right)^2+\\sum_{n=1}^{\\infty}\\frac{A_n^2}{2}\\)"], "correct": 3, "explain": "Гармоники ортогональны: среднее от произведения разных гармоник за период равно нулю, поэтому мощности складываются. Средний квадрат косинуса амплитуды \\(A_n\\) — \\(A_n^2/2\\) (как \\(S_m^2/2\\) у синусоиды), а постоянная составляющая входит целиком, в квадрате. Ошибки: забыть \\(/2\\) у гармоник; не возвести в квадрат среднее (получится не мощность, а смесь единиц); сложить амплитуды и только потом возвести в квадрат — так считают пик, а не среднюю мощность. В двусторонней форме то же: \\(P=\\sum_{n=-\\infty}^{\\infty}\\left|\\frac{\\dot C_n}{2}\\right|^2\\).", "usage": {"code": false, "without": "Ты оцениваешь мощность пульсаций тока по сумме амплитуд гармоник и закладываешь фильтр вдвое мощнее нужного.", "with": "Ты складываешь \\(A_n^2/2\\) по гармоникам и получаешь ту же мощность, что и по осциллограмме.", "benefit": "Мощность считается по спектру, без интеграла от сигнала"}}, {"q": "Сигнал чётный (even): \\(s(-t)=s(t)\\) — как «f(x) = f(−x)» справа на доске. Что можно сказать о его ряде, не считая интегралов?", "options": ["Все \\(a_n=0\\): остаются только синусы, а \\(\\dot C_n\\) чисто мнимые", "Все чётные гармоники равны нулю, остаются \\(n=1,3,5,\\dots\\)", "Все \\(b_n=0\\): остаются только косинусы, а \\(\\dot C_n\\) вещественные", "Постоянная составляющая \\(a_0/2\\) обязательно равна нулю"], "correct": 2, "explain": "\\(\\sin n\\omega_1t\\) — нечётная функция; произведение чётного сигнала на нечётную функцию нечётно, и его интеграл по симметричному периоду \\([-T/2,T/2]\\) равен нулю. Значит \\(b_n=0\\), \\(\\dot C_n=a_n\\) — вещественное, фазы только \\(0^\\circ\\) или \\(180^\\circ\\). Синусы остаются у нечётного сигнала, а не у чётного. Пропадание чётных гармоник — свойство полуволновой симметрии, другого. Среднее у чётного сигнала может быть любым: у прямоугольных импульсов оно \\(S_m\\tau/T\\).", "usage": {"code": false, "without": "Ты честно считаешь восемь интегралов \\(b_n\\) для симметричного импульса датчика — все выходят нулями, но час потрачен.", "with": "Ты замечаешь чётность, сразу пишешь \\(b_n=0\\) и считаешь только \\(a_n\\).", "benefit": "Половина работы отпадает до начала расчёта"}}, {"q": "Сигнал нечётный (odd): \\(s(-t)=-s(t)\\). Что следует для его коэффициентов?", "options": ["\\(a_0=0\\) и все \\(a_n=0\\): только синусы, начальные фазы \\(\\pm90^\\circ\\)", "Все \\(b_n=0\\): только косинусы, начальные фазы \\(0^\\circ\\) или \\(180^\\circ\\)", "Только нечётные гармоники, а постоянная составляющая может быть любой", "\\(a_0=0\\), а \\(a_n\\) и \\(b_n\\) любые: симметрия их не трогает"], "correct": 0, "explain": "Нечётный сигнал, умноженный на чётный \\(\\cos n\\omega_1t\\), даёт нечётную функцию — её интеграл по симметричному периоду ноль, поэтому \\(a_n=0\\), в том числе \\(a_0=0\\) (площади слева и справа гасятся). Остаётся \\(\\dot C_n=-jb_n\\) — чисто мнимое, угол \\(-90^\\circ\\) при \\(b_n>0\\) и \\(+90^\\circ\\) при \\(b_n<0\\). Только косинусы — это чётный сигнал. «Только нечётные гармоники» — полуволновая симметрия. Симметрия как раз и обнуляет половину коэффициентов.", "usage": {"code": false, "without": "Ты ищешь постоянную составляющую в сигнале гироскопа, качающегося симметрично вокруг нуля, и тратишь время.", "with": "Ты видишь нечётность относительно середины качания: \\(a_0=0\\) и все \\(a_n=0\\), остаются синусы.", "benefit": "Нулевые коэффициенты видны без интегрирования"}}, {"q": "Сигнал обладает полуволновой симметрией (half-wave symmetry): \\(s(t+T/2)=-s(t)\\). Какие гармоники в нём есть?", "options": ["Только нечётные, \\(n=1,3,5,\\dots\\), а постоянная составляющая равна нулю", "Только чётные, \\(n=2,4,6,\\dots\\), а постоянная составляющая любая", "Только косинусы, то есть все \\(b_n=0\\), при любых номерах \\(n\\)", "Все гармоники, но знаки \\(a_n\\) и \\(b_n\\) чередуются через одну"], "correct": 0, "explain": "Сдвиг на \\(T/2\\) умножает \\(n\\)-ю гармонику на \\(\\cos(n\\pi)=(-1)^n\\). Условие \\(s(t+T/2)=-s(t)\\) требует множителя \\(-1\\) — это возможно только при нечётных \\(n\\); среднее тоже должно смениться на противоположное, значит оно ноль. Пример — меандр. Чётные гармоники остаются у сигнала, который повторяется через \\(T/2\\) без переворота. О косинусах или синусах полуволновая симметрия ничего не говорит — это вопрос чётности, а не полуволны.", "usage": {"code": false, "without": "Ты закладываешь фильтр на 2-ю гармонику инвертора, которой у него нет, и не подавляешь 3-ю.", "with": "Ты видишь: вторая половина периода — перевёрнутая первая; значит, есть только нечётные гармоники, и фильтр ставишь на 3-ю.", "benefit": "Пустые гармоники известны заранее"}}, {"q": "Сигнал задержали на \\(t_0\\): \\(s_2(t)=s(t-t_0)\\). Что стало с его амплитудным и фазовым спектрами?", "options": ["Амплитуды \\(A_n\\) прежние, а ко всем фазам добавилось одно и то же \\(-\\omega_1 t_0\\)", "Амплитуды \\(A_n\\) прежние, а к фазе \\(n\\)-й гармоники добавилось \\(-n\\omega_1 t_0\\)", "Амплитуды умножились на \\(e^{-j\\omega_1 t_0}\\), а фазы гармоник остались прежними", "Амплитуды \\(A_n\\) прежние, а фаза \\(n\\)-й гармоники сдвинулась на \\(+n\\omega_1 t_0\\)"], "correct": 1, "explain": "\\(A_n\\cos(n\\omega_1(t-t_0)+\\psi_n)=A_n\\cos(n\\omega_1t+\\psi_n-n\\omega_1t_0)\\). Длина стрелки не меняется, угол поворачивается на \\(-n\\omega_1t_0\\): чем выше гармоника, тем больше поворот, потому что та же задержка — больше её периодов. Одинаковый сдвиг всех фаз исказил бы форму сигнала. Множитель \\(e^{-j\\omega_1 t_0}\\) по модулю равен 1 и меняет угол, а не амплитуду. Задержка даёт минус: сигнал «опаздывает». На доске сдвиг на \\(T/4\\) дал \\(-\\pi n/2\\).", "usage": {"code": false, "without": "Ты сравниваешь спектры двух одинаковых датчиков с разной задержкой кабеля и решаешь, что один из них неисправен: фазы разные.", "with": "Ты видишь, что амплитуды совпадают, а разница фаз растёт как \\(n\\omega_1t_0\\) — это просто задержка, и по наклону её можно измерить.", "benefit": "Задержка отличается от неисправности по спектру"}}, {"q": "Периодические прямоугольные импульсы: высота \\(S_m\\), длительность \\(\\tau\\), период \\(T\\), импульс симметричен относительно \\(t=0\\); \\(\\operatorname{sinc}x=\\sin x/x\\). Чему равны коэффициенты?", "options": ["\\(\\frac{a_0}{2}=\\frac{S_m\\tau}{T}\\), \\(a_n=\\frac{S_m\\tau}{T}\\operatorname{sinc}\\frac{n\\omega_1\\tau}{2}\\), \\(b_n=0\\)", "\\(\\frac{a_0}{2}=\\frac{S_m\\tau}{T}\\), \\(a_n=\\frac{2S_m\\tau}{T}\\operatorname{sinc}\\frac{n\\omega_1\\tau}{2}\\), \\(b_n=0\\)", "\\(\\frac{a_0}{2}=\\frac{S_m\\tau}{2T}\\), \\(a_n=\\frac{2S_m\\tau}{T}\\operatorname{sinc}\\,n\\omega_1\\tau\\), \\(b_n=0\\)", "\\(\\frac{a_0}{2}=\\frac{S_m\\tau}{T}\\), \\(a_n=0\\), \\(b_n=\\frac{2S_m\\tau}{T}\\operatorname{sinc}\\frac{n\\omega_1\\tau}{2}\\)"], "correct": 1, "explain": "Среднее — площадь импульса \\(S_m\\tau\\), делённая на \\(T\\). Дальше \\[a_n=\\frac2T\\int_{-\\tau/2}^{\\tau/2}S_m\\cos n\\omega_1t\\,dt=\\frac{4S_m}{n\\omega_1T}\\sin\\frac{n\\omega_1\\tau}{2}=\\frac{2S_m\\tau}{T}\\operatorname{sinc}\\frac{n\\omega_1\\tau}{2}.\\] Импульс чётный, поэтому \\(b_n=0\\), а синусов нет. Типичные ошибки: потерять множитель 2 из \\(2/T\\); взять аргумент \\(n\\omega_1\\tau\\) вместо половины — пределы интеграла \\(\\pm\\tau/2\\), отсюда и \\(/2\\); перепутать косинусы с синусами.", "usage": {"code": false, "without": "Ты моделируешь ультразвуковой дальномер, посылающий пачки импульсов, и не знаешь, какие частоты попадут в усилитель.", "with": "Формула \\(a_n=\\frac{2S_m\\tau}{T}\\operatorname{sinc}\\frac{n\\omega_1\\tau}{2}\\) сразу даёт высоту каждой линии и показывает, где они обнуляются.", "benefit": "Спектр импульсной последовательности известен без численного расчёта"}}, {"q": "Для такой последовательности скважность \\(q=T/\\tau=4\\) (duty cycle \\(\\tau/T=25\\%\\)). Какие гармоники пропадают?", "options": ["\\(n=2,4,6,\\dots\\): у прямоугольных импульсов пропадают все чётные гармоники", "\\(n=4,8,12,\\dots\\): там огибающая \\(\\operatorname{sinc}\\) проходит через ноль", "\\(n=1,5,9,\\dots\\): пропадает каждая четвёртая, начиная с первой", "Никакие: у \\(\\operatorname{sinc}\\) нет нулей, линии лишь убывают"], "correct": 1, "explain": "\\(a_n\\propto\\sin\\frac{n\\omega_1\\tau}{2}=\\sin\\frac{\\pi n}{q}\\) — ноль, когда \\(\\frac{\\pi n}{q}=k\\pi\\), то есть \\(n=kq=4,8,12,\\dots\\) По частоте это \\(\\omega=2\\pi k/\\tau\\) — нули огибающей задаёт длительность импульса, а не период. Все чётные пропадают только при \\(q=2\\) (меандр). \\(n=1\\) не может пропасть: \\(\\sin(\\pi/4)\\ne0\\). У \\(\\operatorname{sinc}x\\) нули есть при \\(x=k\\pi\\), \\(k\\ne0\\).", "usage": {"code": false, "without": "Ты выбираешь скважность ШИМ 25 % и удивляешься, почему 4-я гармоника на спектре вдруг пропала, — уды и фазы гармоник смещение не трогает — оно не колеблется.", "usage": {"code": false, "without": "Ты видишь на спектре датчика выросшую нулевую линию и ищешь вибрацию, которой нет.", "with": "Ты знаешь: смещение АЦП живёт только в \\(a_0/2\\); гармоники не изменились — вибрации нет.", "benefit": "Калибровочное смещение не путается с колебаниями"}}, {"q": "В учебнике ряд записан через синусы: \\(\\sum A_n\\sin(n\\omega_1 t+\\varphi_n)\\), а на доске — через косинусы: \\(\\sum A_n\\cos(n\\omega_1 t+\\psi_n)\\). Как связаны фазы?", "options": ["\\(\\varphi_n=\\psi_n\\): фаза гармоники не зависит от формы записи ряда", "\\(\\varphi_n=\\psi_n-90^\\circ\\): синус опережает косинус на четверть периода", "\\(\\varphi_n=\\psi_n+90^\\circ\\): синус — это косинус, опоздавший на четверть периода", "\\(\\varphi_n=-\\psi_n\\): переход к синусам меняет знак у каждой фазы"], "correct": 2, "explain": "\\(\\sin(x+\\varphi)=\\cos(x+\\varphi-90^\\circ)\\). Чтобы это было \\(\\cos(x+\\psi)\\), нужно \\(\\psi=\\varphi-90^\\circ\\), то есть \\(\\varphi=\\psi+90^\\circ\\). Амплитуды в обеих записях одинаковые, а фазы различаются на \\(90^\\circ\\) — поэтому прежде чем сверять ответ с учебником или чужой домашкой, посмотри, синус там или косинус. Синус отстаёт от косинуса, а не опережает. Знак фаз переход не меняет.", "usage": {"code": false, "without": "Ты сверяешь свою фазовую таблицу с решением из интернета и думаешь, что все фазы у тебя неверные.", "with": "Ты видишь, что там ряд по синусам, прибавляешь \\(90^\\circ\\) — и всё совпадает.", "benefit": "Ответы в разных записях сравниваются правильно"}}, {"q": "Для второй гармоники получено \\(a_2=-3\\) В, \\(b_2=4\\) В. Найдите амплитуду \\(A_2\\) и начальную фазу \\(\\psi_2\\) в записи \\(A_2\\cos(2\\omega_1t+\\psi_2)\\).", "options": ["\\(A_2=5\\) В, \\(\\psi_2\\approx53{,}1^\\circ\\)", "\\(A_2=5\\) В, \\(\\psi_2\\approx+126{,}9^\\circ\\)", "\\(A_2=7\\) В, \\(\\psi_2\\approx-126{,}9^\\circ\\)", "\\(A_2=5\\) В, \\(\\psi_2\\approx-126{, 0,18 В — 9 % от скачка в 2 В — и ставишь порог выше; ложных срабатываний нет.", "benefit": "Пороги учитывают неизбежный выброс"}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: работа над ошибками
    // не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  // Карточка вопроса: варианты, объяснение, пример. Общая для теста и для
  // «Работы над ошибками» / «Повторения», чтобы они не разошлись видом.
  function cardHtml(q, answered) {
    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += imageHtml(q.img);
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» ----
  // Отдельный проход только по вопросам с неисправленной ошибкой. Счёт теста
  // (state.answers) он не трогает: исправленная ошибка пишется в state.fixed.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = LTProgress.mistakes(state);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast("Ошибок не осталось — всё исправлено");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = "Работа над ошибками · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        if (ok) { state.fixed = state.fixed || {}; state.fixed[idx] = Date.now(); saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    const left = LTProgress.mistakes(state).length;
    blockLabel.textContent = "Работа над ошибками · итог";
    html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
    html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
    if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  // Картинка к вопросу (поле img из content/<slug>.json, путь от корня сайта).
  // Касание открывает её целиком: на телефоне так её можно увеличить.
  function imageHtml(img) {
    if (!img || !img.src) return "";
    const src = "../" + escapeAttr(img.src);
    let html = '<figure class="qimg"><a href="' + src + '" target="_blank" rel="noopener">';
    html += '<img src="' + src + '" alt="' + escapeAttr(img.alt) + '" loading="lazy"></a>';
    if (img.credit) html += '<figcaption>' + escapeHtml(img.credit) + '</figcaption>';
    return html + '</figure>';
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ")
      .replace(/\\[()\[\]]/g, " ").replace(/\\([a-zA-Z]+)/g, "$1").replace(/\s+/g, " ").trim();
  }

  // Формулы в тексте: \( ... \) в строке, \[ ... \] отдельной строкой (KaTeX,
  // файлы в vendor/katex). Знак $ разделителем не служит: в тестах по
  // ассемблеру и shell он означает константу и переменную. Код в <pre> и
  // <code> не трогается. Без KaTeX текст остаётся как есть.
  function typeset(el) {
    if (!el || typeof renderMathInElement !== "function") return;
    renderMathInElement(el, {
      delimiters: [
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false
    });
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
