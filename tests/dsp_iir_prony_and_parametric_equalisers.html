<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSP 6: IIR-аппроксимация: метод Прони, параметрические эквалайзеры, реализация</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>

(function () {

  const QUESTIONS = [{"q": "Что такое метод Prony при аппроксимации заданной импульсной характеристики фильтром?", "options": ["Алгоритм оценки временной задержки сигналов по пику взаимной корреляции", "Итерационный алгоритм подбора окна в методе частотной выборки для синтеза FIR-фильтра", "Метод построения модели ЛДС по импульсной характеристике через предсказание и МНК", "Правило выбора порядка фильтра Баттерворта по допускам пульсаций в полосах"], "correct": 2, "explain": "Метод Prony строит полюсно-нулевую модель, представляя измеренную импульсную характеристику суммой затухающих экспонент: полюсы находятся из уравнений линейного предсказания, а числитель — методом наименьших квадратов. Первый дистрактор относится к синтезу FIR, а не к моделированию по ИХ (Proakis & Manolakis, тема Prony).", "usage": {"code": false, "without": "Инженер пытается подобрать порядок IIR-фильтра под измеренную импульсную характеристику вибродатчика вручную, перебирая полюсы наугад.", "with": "Он применяет метод Prony и сразу получает коэффициенты числителя и знаменателя модели.", "benefit": "Модель канала строится по данным за одну процедуру вместо перебора."}}, {"q": "В методе Prony коэффициенты знаменателя модели находят через линейное предсказание. Что именно это даёт?", "options": ["Коэффициенты знаменателя модели, то есть полюсы, задающие показатели затухающих экспонент", "Коэффициенты числителя модели, минимизирующие ошибку на начальном участке характеристики", "Ширину окна Кайзера, обеспечивающую заданное подавление боковых лепестков", "Ослабление в дБ на границе полосы задерживания для эллиптического прототипа"], "correct": 0, "explain": "Уравнения линейного предсказания в методе Prony дают именно коэффициенты знаменателя — полюсы модели, которые определяют показатели затухающих экспонент; числитель находится отдельно, уже после этого, методом наименьших квадратов (Proakis & Manolakis, тема Prony).", "usage": {"code": false, "without": "При моделировании отклика токового датчика знаменатель и числитель пытаются подобрать одновременно одной большой системой уравнений.", "with": "Сначала линейным предсказанием находят полюсы, затем отдельно МНК — числитель.", "benefit": "Разделение задачи на два линейных шага упрощает вычисления."}}, {"q": "Чем метод Padé отличается от общего метода Prony при подгонке модели под импульсную характеристику?", "options": ["Числитель находится усреднением по сегментам записи, а знаменатель методом Шенкса", "Модель строится сразу в частотной области через билинейное преобразование прототипа", "Порядок модели полностью определяется формулой Кайзера по допускам пульсаций", "Число неизвестных равно числу отсчётов, поэтому система решается точно, без МНК"], "correct": 3, "explain": "Метод Padé — частный случай метода Prony, в котором число неизвестных коэффициентов ровно равно числу используемых отсчётов импульсной характеристики, поэтому система линейных уравнений решается точно и МНК не нужен, в отличие от общего метода Prony с избыточными данными (Proakis & Manolakis, тема Prony/Padé).", "usage": {"code": false, "without": "Для короткой измеренной характеристики энкодера всё равно запускают МНК-подгонку по избыточным данным.", "with": "При малом числе доступных отсчётов применяют метод Padé и решают точную систему уравнений.", "benefit": "Экономия вычислений при малой длине записи."}}, {"q": "В чём состоит модификация Шенкса метода Prony?", "options": ["Порядок модели снижается отбрасыванием полюсов с наименьшей добротностью Q", "Числитель уточняется повторным МНК после того, как знаменатель найден методом Prony", "Импульсная характеристика сначала сглаживается лаговым окном перед подгонкой", "Знаменатель модели заново пересчитывается по всей длине записи методом наименьших квадратов"], "correct": 1, "explain": "Метод Шенкса — это уточнение: после того как методом Prony найден знаменатель, числитель пересчитывается заново методом наименьших квадратов по всей доступной длине записи, что снижает ошибку аппроксимации по сравнению с исходной оценкой числителя (Proakis & Manolakis, тема Prony).", "usage": {"code": false, "without": "Модель IMU-канала после метода Prony заметно расходится с измерениями на хвосте характеристики, и это оставляют как есть.", "with": "Числитель пересчитывают методом Шенкса, используя уже найденный знаменатель.", "benefit": "Более точная модель без пересчёта полюсов заново."}}, {"q": "Что представляет собой peaking-секция параметрического эквалайзера?", "options": ["Гребенчатый фильтр, подавляющий все гармоники входного сигнала кратно основной частоте", "FIR-звено с линейной фазой, которое ослабляет одну гармонику без изменения остальных", "Биквад второго порядка с центральной частотой, добротностью Q и усилением в дБ вокруг неё", "All-pass звено первого порядка, выравнивающее групповую задержку соседних секций"], "correct": 2, "explain": "Peaking-секция — это биквад второго порядка, у которого задаются три параметра: центральная частота, добротность Q, определяющая ширину полосы вокруг неё, и усиление в дБ на этой частоте; вне полосы АЧХ возвращается к единичному уровню (Wanhammar & Saramaki, тема параметрических эквалайзеров).", "usage": {"code": false, "without": "Резонанс на одной частоте вибрационного сигнала пытаются подавить длинным FIR-фильтром с большим порядком.", "with": "Ставят одну peaking-секцию с нужной центральной частотой и Q.", "benefit": "Точечная коррекция АЧХ одной короткой секцией второго порядка."}}, {"q": "Чем shelving-фильтр параметрического эквалайзера отличается от peaking-секции?", "options": ["Он меняет усиление ступенькой ниже или выше частоты среза, а не вокруг одной точки", "Он вообще не содержит полюсов и реализуется только в виде FIR-звена без обратной связи", "Он изменяет только фазу сигнала, оставляя амплитудную характеристику плоской", "Он подавляет ровно одну частоту до нуля независимо от заданного усиления"], "correct": 0, "explain": "Shelving-фильтр задаёт усиление в виде плавной ступеньки: ниже частоты среза enheim & Schafer)", "usage": {"code": false, "without": "Не зная о предельных циклах, инженер не может объяснить остаточный шум на выходе при тишине на входе.", "with": "Он распознаёт предельный цикл и применяет масштабирование или другую структуру для его подавления.", "benefit": "Чистый выход без паразитных колебаний в режиме тишины."}}, {"q": "При аппроксимации импульсной характеристики резонансного звена методом Прони выбранный порядок модели оказался ниже фактического числа мод сигнала. К какому эффекту это приведёт при подгонке коэффициентов?", "options": ["Метод Шенкса самостоятельно скорректирует порядок модели без вмешательства инженера", "Модель точно повторит импульсную характеристику, увеличив лишь число умножений на отсчёт", "Система линейных уравнений для предсказания потеряет решение, и вычисления придётся прервать", "Часть экспоненциальных мод останется вне знаменателя модели, и ошибка аппроксимации на них возрастёт"], "correct": 3, "explain": "Заниженный порядок модели Прони не оставляет места в знаменателе для всех экспоненциальных мод сигнала, поэтому слабые моды теряются и ошибка аппроксимации на них возрастает; система линейных уравнений при этом остаётся разрешимой, просто даёт смещённую оценку полюсов (Proakis & Manolakis, гл. 8).", "usage": {"code": false, "without": "Без учёта этого инженер выбирает порядок модели наугад и получает эквалайзер, который не воспроизводит часть резонансов кабины.", "with": "Зная эффект, инженер сверяет число мод в спектре с порядком модели и повышает его, если остаточная ошибка сосредоточена на конкретных модах.", "benefit": "Модель Прони точно воспроизводит все значимые резонансы объекта."}}, {"q": "Метод Прони по МНК подобрал полюсы модели, но амплитудно-частотная характеристика получившейся передаточной функции плохо совпадает с исходной в области резонансных пиков. Какой следующий шаг уместен для проектировщика?", "options": ["Перейти от каскадной формы к параллельной, не меняя коэффициентов фильтра", "Пересчитать коэффициенты числителя методом Шенкса, зафиксировав уже найденные полюсы", "Повторить линейное предсказание с тем же порядком, оставив числитель без изменений", "Заменить билинейное преобразование на инвариант импульсной характеристики"], "correct": 1, "explain": "Метод Шенкса фиксирует полюсы, найденные линейным предсказанием, и повторно решает МНК-задачу только для коэффициентов числителя, что уменьшает ошибку в области резонансных пиков без изменения порядка модели (Proakis & Manolakis, гл. 8).", "usage": {"code": false, "without": "Без коррекции числителя амплитуда резонансных пиков модели остаётся заниженной или завышенной относительно измерения.", "with": "После пересчёта числителя методом Шенкса амплитуда пиков модели совпадает с измеренной АЧХ.", "benefit": "Точная амплитуда резонансов без изменения найденных полюсов."}}, {"q": "Инженер реализует метод Прони для отсчётов измеренной импульсной характеристики. В каком порядке нужно применить линейное предсказание и метод наименьших квадратов, чтобы получить коэффициенты передаточной функции?", "options": ["Сначала знаменатель подбирается перебором устойчивых полюсов, затем числитель линейным предсказанием", "Порядок не важен: числитель и знаменатель можно находить в любой последовательности независимо", "Сначала линейное предсказание даёт знаменатель по хвосту характеристики, затем МНК находит числитель", "Сначала МНК находит и числитель, и знаменатель совместно из одной системы уравнений"], "correct": 2, "explain": "Классическая схема метода Прони сначала находит знаменатель линейным предсказанием по хвостовым отсчётам импульсной характеристики, где влияние числителя конечного порядка уже отсутствует, а затем подставляет полюсы в систему для нахождения числителя методом наименьших квадратов (Proakis & Manolakis, гл. 8).", "usage": {"code": false, "without": "Перепутанный порядок шагов даёт систему уравнений, которая не соответствует модели сигнала, и коэффициенты получаются бессмысленными.", "with": "Соблюдая порядок знаменатель затем числитель, инженер получает корректную передаточную функцию с первой попытки.", "benefit": "Правильная последовательность шагов экономит время подгонки модели."}}, {"q": "Параметрический эквалайзер должен поднять один узкий резонанс кабины на 6 дБ, не задев соседние полосы, отстоящие всего на пол-октавы. Как правильно скорректировать добротность Q секции второго порядка?", "options": ["Увеличить Q, чтобы сузить полосу подъёма вокруг центральной частоты", "Заменить peaking-секцию shelving-фильтром с той же центральной частотой", "Оставить Q прежним и компенсировать ширину полосы увеличением порядка каскада", "Уменьшить Q, расширив полосу подъёма и захватив соседние частоты"], "correct": 0, "explain": "Добротность Q обратно пропорциональна ширине полосы peaking-секции вокруг центральной частоты: повышение Q сужает область подъёма и не затрагивает соседние полосы, отстоящие на пол-октавы (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "При низкой Q подъём одного резонанса задевает соседние частоты и портит общий тембр.", "with": "Повысив Q, инженер поднимает только целевой резонанс, не трогая соседние полосы.", "benefit": "Точечная коррекция одного резонанса без побочных эффектов."}}, {"q": "Нужно поднять уровень всех частот ниже 200 Гц на 4 дБ для компенсации спада АЧХ микрофона, без выделения одной конкретной частоты. Какую секцию параметрического эквалайзера стоит выбрать?", "options": ["Peaking-секцию с центральной частотой 200 Гц и низкой добротностью", "Каскад из двух peaking-секций с разными центральными частотами выше 200 Гц", "Notch-секцию с центральной частотой 200 Гц и высокой добротностью", "Low-shelving секцию с частотой перегиба, установленной на 200 Гц"], "correct": 3, "explain": "Low-shelving секция с частотой перегиба, установленной на 200 Гц, поднимает или понижает все частоты ниже этой частоты на одинаковую величину, что подходит для широкополосной коррекции спада АЧХ, тогда как peaking и notch секции выделяют одну конкретную частоту (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "Применение peaking-секции вместо shelving поднимает только узкую область у 200 Гц, а остальной низкочастотный диапазон остаётся заниженным.", "with": "Low-shelving секция ровно поднимает весь низкочастотный диапазон до частоты перегиба.", "benefit": "Равномерная коррекция широкой полосы одной секцией."}}, {"q": "Проектируется notch-фильтр на частоте, близкой к половине частоты дискретизации, через билинейное преобразование аналогового прототипа. Что произойдёт, если не выполнить предыскажение частоты перед преобразованием?", "options": ["Билинейное преобразование откажется выполняться для частот выше половины дискретизации", "Центральная частота подавления сместится из-за нелинейного сжатия шкалы вблизи Найквиста", "Порядок получившегося цифрового фильтра автоматически увеличится вдвое", "Фильтр потеряет устойчивость, и полюсы окажутся за пределами единичной окружности"], "correct": 1, "explain": "Билинейное преобразование нелинейно сжимает частотную шкалу, и это сжатие усиливается вблизи половины частоты дискретизации, поэтому без предыскажения центральная частота notch-фильтра в цифровой области сместится относительно заданной аналоговой частоты (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "Без предыскажения провал АЧХ оказывается не на нужной частоте, и приходится подбирать параметры заново.", "with": "Предыскажение частоты перед преобразованием ставит провал ровно на заданную частоту.", "benefit": "Точное совпадение цифровой характеристики с заданной аналоговой."}}, {"q": "Встраиваемый контроллер эквалайзера ограничен числом ячеек памяти под линии задержки, а переполнение внутренних сумм для этого сигнала не критично. Какую структуру секции второго порядка стоит выбрать, чтобы уменьшить число элементов задержки?", "options": ["Каскад из прямых форм I вместо одной канонической секции", "Параллельную форму с раздельными состояниями для каждой моды", "Каноническую прямую форму II с общей линией задержки для входа и выхода", "Прямую форму I, хранящую отдельные линии задержки для входа и для выхода"], "correct": 2, "explain": "Каноническая прямая форма II хранит одну общую линию задержки для входной и выходной ветвей секции второго порядка, тогда как прямая форма I требует отдельных линий задержки для входа и выхода, то есть вдвое больше ячеек памяти (Oppenheim & Schafer, гл. 6).", "usage": {"code": false, "without": "При ограниченной памяти контроллера реализация на прямой форме I может не поместиться в доступные ячейки задержки.", "with": "Переход на каноническую форму II вдвое сокращает число ячеек задержки без изменения коэффициентов.", "benefit": "Экономия памяти при той же передаточной функции."}}, {"q": "Синтезирован IIR-фильтр восьмого порядка для параметрического эквалайзера с несколькими узкополосными секциями. При реализации в фиксированной точке коэффициенты одной прямой формы восьмого порядка сильно чувствительны к округлению. Какая структура реализации снизит эту чувствительность?", "options": ["Каскад биквадных секций второго порядка с раздельным квантованием коэффициентов", "Параллельная форма реализации без разложения фильтра на секции второго порядка", "Транспонированная прямая форма I того же восьмого порядка без изменения коэффициентов", "Прямая форма II восьмого порядка с переставленными коэффициентами по возрастанию"], "correct": 0, "explain": "Каскад биквадных секций делит коэффициенты фильтра высокого порядка на независимые группы второго порядка, и ошибка квантования каждой группы влияет только на свою пару полюсов, что снижает общую чувствительность по сравнению с одной прямой формой восьмого порядка (Wanhammar & Saramaki, гл. по каскадным реализациям).", "usage": {"code": false, "without": "Прямая форма восьмого порядка при квантовании коэффициентов может сместить полюсы за пределы единичной окружности.", "with": "Разбиение на биквады сохраняет устойчивость каждой секции при том же числе бит на коэффициент.", "benefit": "Робастность к квантованию без изменения передаточной функции."}}, {"q": "В каскаде из четырёх биквадных секций один полюс расположен очень близко к единичной окружности, что даёт большой пик АЧХ этой секции. Как правильно расположить эту секцию и её пару полюс-нуль в каскаде, чтобы избежать переполнения в промежуточных суммах?", "options": ["Разместить секцию с острым пиком первой в каскаде без пересмотра пар полюс-нуль", "Спарить острый полюс с нулём на противоположном конце частотной оси, не меняя порядок секций", "Убрать пару полюс-нуль в отдельную параллельную ветвь, исключив её из каскада", "Спарить острый полюс с ближайшим нулём и разместить секцию, чтобы её пик не совпадал с соседним"], "correct": 3, "explain": "Стандартная практика - спаривать острый полюс с ближайшим по частоте нулём и располагать секции в каскаде так, чтобы их локальные пики АЧХ не накладывались друг на друга, что ограничивает рост уровня сигнала в промежуточных суммах (Wanhammar & Saramaki, гл. по каскадным реализациям).", "usage": {"code": false, "without": "Случайный порядок секций и пар полюс-нуль может дать точку каскада, где уровень сигнала многократно превышает вход, вызывая переполнение.", "with": "Продуманная пара полюс-нуль и порядок секций держат промежуточный уровень сигнала под контролем.", "benefit": "Меньше запаса по разрядности требуется для того же динамического диапазона."}}, {"q": "Узкополосный резонатор второго порядка реализован в фиксированной точке, где произведения округляются до ближайшего значения. При нулевом входе выход не затухает до нуля, а колеблется на малом уровне. Какое изменение стратегии квантования гарантированно устраняет эту паразитную генерацию?", "options": ["Увеличение числа секций каскада для перераспределения энергии колебаний", "Переход от округления к усечению по модулю в сторону нуля", "Увеличение шага квантования произведений для огрубления арифметики", "Переход к округлению до ближайшего чётного значения, а не вверх"], "correct": 1, "explain": "По классическому результату Джексона усечение по модулю в сторону нуля гарантированно исключает предельные циклы от округления произведений в рекурсивных секциях второго порядка, тогда как обычное округление до ближайшего значения такой гарантии не даёт (Oppenheim & Schafer, гл. 6).", "usage": {"code": false, "without": "При округлении до ближайшего значения узкополосный резонатор может колебаться на малом уровне бесконечно долго после окончания входного сигнала.", "with": "Усечение по модулю в сторону нуля гасит выход резонатора до истинного нуля после окончания входа.", "benefit": "Отсутствие паразитной генерации на нулевом входе."}}, {"q": "Инженер снял импульсную характеристику силового канала датчика тока двигателя по 200 отсчётам и аппроксимирует её методом Прони суммой из трёх затухающих экспонент, взяв знаменатель второго порядка. Модель точно повторяет первые отсчёты, но её хвост расходится с измеренным сигналом. В чём вероятная причина?", "options": ["Порядок знаменателя занижен, и линейное предсказание не выявило все моды затухания сигнала.", "Импульсная характеристика датчика тока содержит единственный ноль, что метод Прони принципиально не обрабатывает.", "Число измеренных отсчётов оказалось чётным, из-за чего система уравнений Прони теряет решение.", "Билинейное преобразование при оцифровке сдвинуло полюсы модели ближе к единичной окружности."], "correct": 0, "explain": "Порядок знаменателя должен быть не меньше числа реальных мод затухания сигнала: заниженный порядок означает, что линейное предсказание аппроксимирует лишь часть полюсов, и ошибка накапливается к хвосту записи. Чётность числа отсчётов и билинейное преобразование на решение системы Прони не влияют. Proakis & Manolakis, гл. 11.", "usage": {"code": false, "without": "Без проверки порядка модели инженер сдаёт передаточную функцию, которая красиво стартует и уводит прогноз тока уже через десяток отсчётов.", "with": "Проверив число мод в сигнале, инженер сразу берёт знаменатель нужного порядка и получает модель, совпадающую с измерением на всей записи.", "benefit": "Модель тока двигателя остаётся достоверной на всём горизонте прогноза, а не только в начале."}}, {"q": "По измеренной импульсной характеристике резонанса IMU нужно подобрать модель, которая точно воспроизводит только первые несколько отсчётов сигнала, а совпадение на остальной части записи не требуется. Какой классический метод аппроксимации импульсной характеристики подходит для этой цели?", "options": ["Метод Шенкса, поскольку он сначала находит полюсы методом Прони, а затем нули по всей записи.", "Метод наименьших квадратов по входу и выходу, поскольку он требует одновременной записи возбуждения.", "Метод Прони, поскольку он минимизирует суммарную квадратичную ошибку по всей длине записи.", "Метод Паде, поскольку он подбирает коэффициенты по точному совпадению начальных отсчётов ряда."], "correct": 3, "explain": "Метод Паде строит модель так, чтобы её разложение в ряд точно совпало с первыми отсчётами заданной последовательности, жертвуя точностью на остальной части записи; метод Прони и метод наименьших квадратов, напротив, минимизируют ошибку по всей длине сигнала. Proakis & Manolakis, гл. 11.", "usage": {"code": false, "without": "Инженер без разбора берёт метод Прони там, где нужно только точное совпадение первых отсчётов, и тратит время на модель, оптимизированную не под ту цель.", "with": "Зная разницу целей методов, инженер сразу выбирает метод Паде и получает нужное совпадение начала характеристики без лишних итераций.", "benefit": "Модель резонанса IMU строится тем методом, который реально решает поставленную задачу."}}, {"q": "Импульсная характеристика энкодера получена с заметным измерительным шумом на поздних отсчётах записи, но инженер всё равно использует всю запись для метода наименьших квадратов при вычислении числителя в методе Прони. Что произойдёт с полученной моделью с наибольшей вероятностью?", "options": ["Метод Прони откажется сходиться и не выдаст никакого решения для коэффициентов числителя.", "Числитель модели подгонится под шумовые отсчёты, и АЧХ получит паразитные пики и провалы.", "Полюсы модели гарантированно выйдут за пределы единичной окружности и модель станет неустойчивой.", "Порядок знаменателя автоматически увеличится, чтобы скомпенсировать влияние шума на записи."], "correct": 1, "explain": "Число уравнений в методе наименьших квадратов для числителя намного больше числа неизвестных, поэтому решение не срывается, а лишь минимизирует ошибку, включая шумовые выбросы, что и создаёт паразитные пики и провалы в частотной характеристике модели. Устойчивость знаменателя от шума в числителе напрямую не зависит. Proakis & Manolakis, гл. 11.", "usage": {"code": false, "without": "Инженер молча скармливает МНК всю зашумлённую запись и получает модель с паразитными пиками, которые потом принимают за реальные резонансы датчика.", "with": "Заранее отбросив зашумлённый хвост записи перед расчётом числителя, инженер получает чистую АЧХ модели без ложных пиков.", "benefit": "Модель энкодера отражает реальную динамику, а не шум измерения."}}, {"q": "Импульсная характеристика датчика тока по физике колебательного контура должна содержать ровно две затухающие экспоненциальные моды, но инженер выбрал в методе Прони знаменатель шестого порядка, чтобы модель точнее легла на зашумлённые данные. Чем это грозит на практике?", "options": ["Модель автоматически понизит порядок числителя, чтобы сохранить баланс между полюсами и нулями.", "Модель потеряет устойчивость знаменателя, и все полюсы гарантированно окажутся вне единичной окружности.", "Модель захватит лишние полюсы от шума, и её АЧХ станет чувствительной к малым изменениям данных.", "Модель окажется недоопределённой, и система уравнений Прони перестанет иметь единственное решение вовсе."], "correct": 2, "explain": "Когда порядок знаменателя выбран заведомо выше числа реальных физических мод, лишние степени свободы модели начинают описывать шум записи как дополнительные полюсы, из-за чего коэффициенты и частотная характеристика становятся чувствительны к малейшим изменениям данных — классическое переобучение. Порядок числителя и устойчивость знаменателя при этом сами по себе не меняются. Proakis & Manolakis, гл. 11.", "usage": {"code": false, "without": "Инженер берёт заведомо избыточный порядок знаменателя ради точной подгонки под данные и получает модель, разваливающуюся при малейшем повторном измерении.", "with": "Ограничив порядок числом реальных физических мод, инженер получает устойчивую и повторяемую модель тока.", "benefit": "Модель датчика тока остаётся надёжной при повторных измерениях, а не только на одной записи."}}, {"q": "В канале резольвера обнаружена узкая помеха на фиксированной частоте, отстоящей всего на несколько герц от полезного сигнала возбуждения. Инженер ставит peaking-фильтр с большим отрицательным усилением, но выбирает низкую добротность Q. Что произойдёт с полезным сигналом?", "options": ["Полоса подавления станет широкой, и часть энергии полезного сигнала будет ослаблена заодно.", "Центральная частота фильтра сама сместится ближе к частоте полезного сигнала возбуждения.", "Усиление на центральной частоте перестанет зависеть от заданного значения в децибелах.", "Полоса подавления станет настолько узкой, что помеха вообще не ослабится фильтром."], "correct": 0, "explain": "Ширина полосы подавления peaking-фильтра обратно пропорциональна добротности Q: низкая Q даёт широкую полосу, которая захватывает и часть полезного сигнала рядом с помехой. Центральная частота и калибровка усиления в децибелах от выбора Q не зависят. Wanhammar & Saramaki, гл. 4.", "usage": {"code": false, "without": "Инженер ставит фильтр с низкой добротностью на узкую помеху и потом удивляется, почему полезный сигнал возбуждения резольвера просел вместе с помехой.", "with": "Подобрав добротность под ширину реальной помехи, инженер подавляет только её, не трогая полезный сигнал рядом.", "benefit": "Канал резольвера теряет помеху, но сохраняет амплитуду полезного сигнала."}}, {"q": "В сигнале акселерометра IMU видно медленное нарастание уровня в области близких к нулю частот, вызванное температурным дрейфом, а не отдельным резонансом. Инженер компенсирует это peaking-фильтром с узкой добротностью Q на самой низкой частоте. Почему такой выбор структуры фильтра неудачен?", "options": ["Peaking-секция не позволяет задавать усиление в децибелах, только в линейных единицах амплитуды.", "Peaking-секция всегда нестабильна на низких частотах из-за близости полюса к точке z равной единице.", "Peaking-секция требует обязательного билинейного преобразования, которое shelving-фильтру не нужен.", "Peaking-секция поднимает лишь узкую полосу у центральной частоты, а не весь низкочастотный участок."], "correct": 3, "explain": "Peaking-секция по конструкции поднимает или ослабляет узкую полосу вокруг заданной центральной частоты и не годится для широкого низкочастотного дрейфа — для этого нужен low-shelving фильтр, поднимающий всю область ниже частоты среза. Устойчивость, необходимость билинейного преобразования и единицы усиления тут ни при чём. Wanhammar & Saramaki, гл. 4.", "usage": {"code": false, "without": "Инженер безуспешно крутит добротность peaking-фильтра, пытаясь убрать низкочастотный дрейф акселерометра, и так и не получает ровную характеристику.", "with": "Поставив вместо peaking low-shelving фильтр, инженер одним звеном убирает весь дрейф ниже частоты среза.", "benefit": "Сигнал IMU очищается от низкочастотного дрейфа правильной структурой фильтра, а не подбором параметров не того звена."}}, {"q": "Инженер проектирует peaking-эквалайзер для подавления резонанса на частоте 8 килогерц при частоте дискретизации 16 килогерц, рассчитывая аналоговый прототип и переводя его в цифровой вид билинейным преобразованием без предыскажения частоты. Что произойдёт с реальной центральной частотой фильтра?", "options": ["Фильтр потеряет устойчивость целиком, поскольку резонанс расположен ровно на частоте Найквиста для дискретизации.", "Центральная частота цифрового фильтра сместится ниже восьми килогерц из-за нелинейного сжатия шкалы частот.", "Центральная частота останется точно на восьми килогерц, так как преобразование линейно по частоте.", "Добротность Q фильтра увеличится ровно вдвое, а центральная частота при этом не изменится."], "correct": 1, "explain": "Билинейное преобразование нелинейно сжимает аналоговую частотную ось, поэтому без предыскажения частоты рассчитанная на прототипе частота 8 килогерц после перехода в цифровую область оказывается ниже заданной, особенно заметно вблизи частоты Найквиста. Само по себе отсутствие предыскажения не делает фильтр неустойчивым и не меняет добротность Q. Proakis & Manolakis, гл. 8.", "usage": {"code": false, "without": "Инженер закладывает в проект эквалайзер, у которого реальная центральная частота на плате оказывается ниже расчётной, и резонанс подавляется не полностью.", "with": "Применив предыскажение частоты перед билинейным преобразованием, инженер получает цифровой фильтр с центральной частотой точно на восьми килогерцах.", "benefit": "Резонанс подавляется на той частоте, для которой фильтр реально проектировался."}}, {"q": "В сигнале инкрементального энкодера обнаружены три отдельные гармонические помехи на кратных частотах вращения вала, каждую из которых нужно подавить notch-фильтром своей центральной частоты и своей добротности Q. Как правильно реализовать такой эквалайзер в одном цифровом тракте?", "options": ["Соединить три биквадные секции параллельно и просуммировать их выходы перед дальнейшей обработкой.", "Реализовать один peaking-фильтр с отрицательным усилением на средней из трёх частот помех.", "Соединить три биквадные notch-секции последовательно, каждая со своими коэффициентами.", "Реализовать одну notch-секцию шестого порядка с общей добротностью Q для всех помех."], "correct": 2, "explain": "Независимые notch-помехи на разных частотах и с разной добротностью естественно реализуются каскадом отдельных биквадных секций, каждая из которых настроена под свою частоту и Q; единая секция шестого порядка с общим Q не задаст разную ширину подавления для каждой помехи, а параллельное суммирование или один peaking-фильтр не подавят все три частоты по отдельности. Wanhammar & Saramaki, гл. 4.", "usage": {"code": false, "without": "Инженер пытается закрыть все три гармонические помехи одной секцией фильтра и оставляет часть из них практически без подавления.", "with": "Собрав каскад из трёх отдельных notch-секций под каждую помеху, инженер подавляет все три частоты независимо друг от друга.", "benefit": "Каждая гармоника вращения вала подавляется своим звеном с нужной шириной полосы."}}, {"q": "Peaking-эквалайзер для канала датчика тока реализован в фиксированной точке на микроконтроллере в прямой форме II, и после подачи короткого импульса и обнуления входа выход не затухает до нуля, а колеблется небольшой постоянной амплитудой. Чем вызвано такое поведение?", "options": ["Округление произведений в обратных связях создаёт предельный цикл около полюсов фильтра.", "Числитель передаточной функции получил лишний ноль при переводе в фиксированную точку.", "Билинейное преобразование при синтезе фильтра было выполнено без предыскажения частоты.", "Коэффициенты фильтра были рассчитаны для другой частоты дискретизации, чем реально используется."], "correct": 0, "explain": "В прямой форме II произведения в цепи обратной связи округляются на каждом шаге, и при нулевом входе эти округления могут поддерживать устойчивые низкоамплитудные колебания вблизи полюсов фильтра — классический предельный цикл квантования. Ошибка в частоте дискретизации или в предыскажении дала бы неверную АЧХ, а не незатухающие колебания при нулевом входе. Proakis & Manolakis, гл. 7.", "usage": {"code": false, "without": "Инженер видит на осциллографе мелкие незатухающие колебания после импульса и списывает их на помеху в проводке, вместо реальной причины в самом фильтре.", "with": "Опознав предельный цикл квантования, инженер меняет структуру или разрядность накопителя и получает действительно нулевой выход в покое.", "benefit": "Канал датчика тока выдаёт настоящий ноль в покое, а не остаточные колебания квантования."}}, {"q": "Узкополосный peaking-эквалайзер восьмого порядка для канала резольвера, реализованный одной прямой формой с восемью коэффициентами знаменателя, после квантования коэффициентов в формат Q15 теряет устойчивость. Какое изменение структуры реализации решает эту проблему лучше всего?", "options": ["Заменить прямую форму первого рода на прямую форму второго рода с теми же коэффициентами.", "Оставить прямую форму, но увеличить разрядность накопителя суммирования без изменения коэффициентов.", "Перейти к параллельной реализации, суммируя выходы восьми отдельных фильтров первого порядка.", "Разбить фильтр на каскад биквадов второго порядка, распределив полюсы и нули парами по секциям."], "correct": 3, "explain": "Разбиение фильтра высокого порядка на каскад биквадов с попарно объединёнными близкими полюсами и нулями резко снижает чувствительность коэффициентов к квантованию по сравнению с одной прямой формой, где малая погрешность одного коэффициента сдвигает сразу все полюсы. Увеличение разрядности накопителя или смена формы реализации без изменения топологии эту чувствительность не устраняют. Proakis & Manolakis, гл. 7.", "usage": {"code": false, "without": "Инженер реализует узкополосный фильтр одной прямой формой восьмого порядка и получает на плате самовозбуждающуюся после квантования систему.", "with": "Разбив фильтр на каскад биквадов с парным объединением близких полюсов и нулей, инженер получает устойчивую реализацию даже в Q15.", "benefit": "Эквалайзер резольвера остаётся устойчивым после перехода в фиксированную точку."}}, {"q": "Биквадратное звено задано передаточной функцией H(z) = 1 / (1 - 1.2 z^-1 + 0.81 z^-2). Дискриминант знаменателя отрицателен, поэтому полюсы комплексно сопряжённые. Найдите радиус полюсов и определите устойчивость звена.", "options": ["Радиус полюсов равен 0.9, фильтр неустойчив, так как совпадает с коэффициентом a1", "Радиус полюсов равен 1.2, фильтр неустойчив, так как радиус больше единицы", "Радиус полюсов равен 0.9, фильтр устойчив, так как радиус меньше единицы", "Радиус полюсов равен 0.81, фильтр устойчив, так как радиус меньше единицы"], "correct": 2, "explain": "Дискриминант a1^2-4a2 = 1.44-3.24 отрицателен, значит полюсы комплексно сопряжённые с радиусом r = sqrt(a2) = sqrt(0.81) = 0.9. Так как r меньше единицы, фильтр устойчив; ошибочный вариант путает радиус с самим коэффициентом a2, забывая извлечь корень. (Proakis & Manolakis, гл. 9)", "usage": {"code": false, "without": "Без расчёта радиуса полюсов инженер может выпустить в прошивку резонансный биквад, полюс которого случайно оказался за пределами единичной окружности, и фильтр начнёт генерировать нарастающие колебания.", "with": "Проверив, что радиус полюсов равен 0.9, инженер убеждается, что звено устойчиво и может смело ставить его в каскад эквалайзера.", "benefit": "Экономит время на отладке нестабильного фильтра уже после прошивки платы."}}, {"q": "Биквадратное звено задано передаточной функцией H(z) = 1 / (1 - 1.4 z^-1 + 1.05 z^-2). Дискриминант знаменателя отрицателен, полюсы комплексно сопряжённые. Найдите радиус полюсов и определите устойчивость звена.", "options": ["Радиус полюсов приближённо равен 1.025, фильтр неустойчив, так как радиус больше единицы", "Радиус полюсов приближённо равен 0.975, фильтр устойчив, так как радиус меньше единицы", "Радиус полюсов приближённо равен 1.025, фильтр устойчив, так как коэффициент a1 отрицателен", "Радиус полюсов равен ровно 1.05, фильтр устойчив, так как радиус остаётся меньше двух"], "correct": 0, "explain": "Радиус комплексно сопряжённых полюсов равен sqrt(a2) = sqrt(1.05) ≈ 1.025, что больше единицы, поэтому фильтр неустойчив независимо от знака a1; частая ошибка — делать вывод об устойчивости по знаку коэффициента a1, а не по величине радиуса. (Proakis & Manolakis, гл. 9)", "usage": {"code": false, "without": "Без проверки радиуса разработчик может принять неустойчивый биквад за рабочий только потому, что коэффициент a1 отрицательный, и получить на выходе неограниченно растущий сигнал.", "with": "Рассчитав радиус полюсов 1.025, инженер сразу видит, что звено нужно пересчитать перед реализацией на плате.", "benefit": "Позволяет отсеять неустойчивую структуру ещё на этапе проектирования, до прошивки."}}, {"q": "Коэффициент биквада a1 = -0.6234 требуется представить в формате Q1.7 с одним знаковым и семью дробными битами. Найдите шаг квантования и квантованное значение коэффициента при округлении до ближайшего уровня.", "options": ["Шаг квантования 0.0078, квантованный коэффициент -0.6328", "Шаг квантования 0.0156, квантованный коэффициент -0.625", "Шаг квантования 0.0078, квантованный коэффициент -0.6172", "Шаг квантования 0.0078, квантованный коэффициент -0.625"], "correct": 3, "explain": "Шаг квантования формата Q1.7 равен 2^-7 = 0.0078125. Значение -0.6234, делённое на шаг, даёт -79.795, что округляется до ближайшего целого -80, то есть квантованный коэффициент -80/128 = -0.625; ошибочный вариант получается усечением в сторону нуля вместо округления до ближайшего уровня. (Wanhammar & Saramaki)", "usage": {"code": false, "without": "Без расчёта шага квантования разработчик фиксированной точки может произвольно округлить коэффициент и получить смещённую частоту эквалайзера в готовом устройстве.", "with": "Зная шаг 0.0078 и правило округления до ближайшего уровня, инженер получает предсказуемое квантованное значение -0.625 для прошивки.", "benefit": "Гарантирует, что квантованный фильтр ведёт себя так же, как рассчитанный в float."}}, {"q": "Коэффициент биквада a2 = 0.8365 требуется представить в формате Q1.7 при округлении до ближайшего уровня квантования. Определите шаг квантования и квантованное значение коэффициента.", "options": ["Шаг квантования 0.0039, квантованный коэффициент 0.8359", "Шаг квантования 0.0078, квантованный коэффициент 0.8359", "Шаг квантования 0.0078, квантованный коэффициент 0.8281", "Шаг квантования 0.0078, квантованный коэффициент 0.8438"], "correct": 1, "explain": "Шаг квантования Q1.7 равен 1/128 ≈ 0.0078. Умножив 0.8365 на 128, получаем 107.072, что округляется до 107 и даёт квантованное значение 107/128 ≈ 0.8359; ошибочные варианты соответствуют округлению до соседнего уровня 106 или 108. (Wanhammar & Saramaki)", "usage": {"code": false, "without": "Без аккуратного округления в Q1.7 коэффициент a2 может съехать на соседний уровень квантования и сместить полюс биквада ближе к границе устойчивости.", "with": "Посчитав квантованное значение 0.8359, инженер закладывает в прошивку именно тот коэффициент, который предполагался на этапе синтеза.", "benefit": "Снижает риск случайного смещения полюсов при переходе к фиксированной точке."}}, {"q": "Peaking-эквалайзер настроен на центральную частоту f0 = 1000 Гц с добротностью Q = 2.5. Определите полосу пропускания BW по уровню -3 дБ относительно пика по формуле BW = f0 / Q.", "options": ["Полоса BW равна 160 Гц", "Полоса BW равна 250 Гц", "Полоса BW равна 400 Гц", "Полоса BW равна 2500 Гц"], "correct": 2, "explain": "Полоса пропускания peaking-эквалайзера по уровню -3 дБ определяется как BW = f0/Q = 1000/2.5 = 400 Гц; ошибочный вариант получается перестановкой сомножителей, то есть умножением f0 на Q вместо деления. (Tan & Jiang)", "usage": {"code": false, "without": "Не посчитав полосу BW, звукоинженер может настроить слишком узкий или слишком широкий пик эквалайзера, не понимая, как Q влияет на звучание.", "with": "Зная, что BW = 400 Гц при Q = 2.5, инженер сразу представляет ширину подъёма АЧХ вокруг центральной частоты.", "benefit": "Позволяет подбирать Q осознанно, а не подбором на слух."}}, {"q": "Peaking-фильтр имеет центральную частоту f0 = 2000 Гц и полосу пропускания по уровню -3 дБ BW = 250 Гц. Найдите добротность Q эквалайзера по формуле Q = f0 / BW.", "options": ["Добротность Q равна 8", "Добротность Q равна 1750", "Добротность Q равна 0.125", "Добротность Q равна 80"], "correct": 0, "explain": "Добротность связана с центральной частотой и полосой формулой Q = f0/BW = 2000/250 = 8; ошибочный вариант получается инвертированием отношения, то есть делением BW на f0 вместо f0 на BW. (Tan & Jiang)", "usage": {"code": false, "without": "Без формулы Q = f0/BW разработчик пресета эквалайзера не сможет перевести требование по ширине полосы в параметр Q, который принимает алгоритм биквада.", "with": "Рассчитав Q = 8 для нужной полосы 250 Гц, инженер сразу задаёт корректный параметр в коэффициентах биквада.", "benefit": "Ускоряет перевод акустического технического задания в параметры фильтра."}}, {"q": "Секция peaking-эквалайзера задаёт усиление на центральной частоте 12 дБ. Найдите соответствующий линейный коэффициент усиления по амплитуде A по формуле A = 10 в степени дБ/20.", "options": ["Линейный коэффициент усиления A приближённо равен 0.6", "Линейный коэффициент усиления A приближённо равен 1.2", "Линейный коэффициент усиления A приближённо равен 15.85", "Линейный коэффициент усиления A приближённо равен 3.98"], "correct": 3, "explain": "Перевод усиления из децибел в линейный масштаб по амплитуде выполняется по формуле A = 10^(дБ/20) = 10^0.6 ≈ 3.98; ошибочный вариант 15.85 получается при подстановке в формулу мощности 10^(дБ/10) вместо формулы амплитуды. (Tan & Jiang)", "usage": {"code": false, "without": "Не переведя децибелы в линейный масштаб, разработчик может неверно смасштабировать сигнал в коде эквалайзера и получить искажённый или слишком тихий подъём частоты.", "with": "Зная, что 12 дБ соответствует коэффициенту около 3.98, инженер корректно закладывает числовое усиление в формулу биквада.", "benefit": "Исключает грубую ошибку масштаба между настройками в дБ и внутренними коэффициентами фильтра."}}, {"q": "На выходе секции эквалайзера амплитуда сигнала составляет половину входной, то есть линейный коэффициент передачи A = 0.5. Выразите это ослабление в децибелах по формуле дБ = 20 log10 A.", "options": ["Ослабление составляет -12.04 дБ", "Ослабление составляет -6.02 дБ", "Ослабление составляет -3.01 дБ", "Ослабление составляет 10 дБ"], "correct": 1, "explain": "Перевод линейного коэффициента передачи в децибелы выполняется по формуле дБ = 20 log10 A = 20 log10 0.5 ≈ -6.02; ошибочный вариант -3.01 получается при использовании формулы мощности 10 log10 A вместо формулы амплитуды. (Tan & Jiang)", "usage": {"code": false, "without": "Без перевода линейного коэффициента в децибелы инженер не сможет сравнить измеренное ослабление сигнала с требованиями технического задания, заданными в дБ.", "with": "Получив -6.02 дБ для ослабления вдвое, инженер сразу сопоставляет измерение с допуском спецификации.", "benefit": "Позволяет говорить с заказчиком и датчиком на одном языке единиц."}}, {"q": "Частота дискретизации fs = 8000 Гц, шаг дискретизации T = 1/fs. Цифровой фильтр должен иметь особую точку на частоте fd = 1000 Гц. Найдите предыскажённую аналоговую частоту fa по формуле ωa = 2/T · tan(π fd/fs), выразив результат в герцах.", "options": ["Предыскажённая частота fa приближённо равна 159 Гц", "Предыскажённая частота fa приближённо равна 6627 Гц", "Предыскажённая частота fa приближённо равна 1055 Гц", "Предыскажённая частота fa приближённо равна 1000 Гц"], "correct": 2, "explain": "Предыскажение частоты компенсирует нелинейность билинейного преобразования: ωa = 2/T · tan(π fd/fs) = 16000 · tan(π/8) ≈ 16000 · 0.4142 ≈ 6627 рад/с, что соответствует fa = ωa/2π ≈ 1055 Гц; ошибочный вариант 6627 Гц получается при забытом переводе из рад/с обратно в герцы. (Oppenheim & Schafer, гл. 7)", "usage": {"code": false, "without": "Без предыскажения частоты билинейное преобразование сдвинет реальную частоту среза цифрового фильтра относительно задуманной, особенно ближе к частоте Найквиста.", "with": "Рассчитав предыскажённую частоту 1055 Гц, инженер проектирует аналоговый прототип так, что после билинейного преобразования срез попадёт точно на нужные 1000 Гц.", "benefit": "Даёт цифровому эквалайзеру именно ту частоту, которая указана в техническом задании."}}, {"q": "Импульсная характеристика содержит отсчёты h[0] = 8, h[1] = 6, h[2] = 4.5. Методом Прони для одной вещественной экспоненты h[n] = A p в степени n оцените полюс p по отношению соседних отсчётов и найдите амплитуду A, используя третий отсчёт для проверки постоянства отношения.", "options": ["Полюс p равен 0.75, амплитуда A равна 8", "Полюс p равен 0.5625, амплитуда A равна 8", "Полюс p равен 0.75, амплитуда A равна 6", "Полюс p равен 1.33, амплитуда A равна 8"], "correct": 0, "explain": "Для одной вещественной экспоненты h[n] = A p^n полюс находится из отношения соседних отсчётов p = h[1]/h[0] = 6/8 = 0.75, что подтверждается третьим отсчётом h[2]/h[1] = 4.5/6 = 0.75, а амплитуда A = h[0] = 8; ошибочный вариант получается инвертированием отношения соседних отсчётов. (Proakis & Manolakis, гл. 4)", "usage": {"code": false, "without": "Без метода Прони инженер, измеривший затухающий отклик датчика, не сможет быстро оценить постоянную времени экспоненты по нескольким отсчётам.", "with": "Найдя полюс p = 0.75 и амплитуду A = 8 по трём отсчётам, инженер сразу получает модель затухания токового датчика для дальнейшей компенсации.", "benefit": "Позволяет получить параметры модели без развёрнутой процедуры МНК, когда экспонента одна."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
