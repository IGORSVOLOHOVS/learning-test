<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>dmcli и TR-181: radio, SSID, BSSID</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
  }
</style>
</head>

<script>
(function () {
  const TEST_ID = "dmcli_rdkb";
  const QUESTIONS = [{"q": "Что такое dmcli в RDK-B?", "options": ["Демон, управляющий радиомодулем и его настройками", "Библиотека разбора конфигурационных файлов точки доступа", "Служба синхронизации настроек устройства с облаком оператора", "Утилита командной строки для чтения и правки модели данных"], "correct": 3, "explain": "dmcli — тонкий клиент к шине сообщений. Он ничего не настраивает сам: он читает и пишет параметры модели данных, а исполняют их уже соответствующие компоненты.", "usage": {"code": true, "without": "Настройки правят в конфигах компонентов, и они расходятся с моделью.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Enable", "benefit": "Единая точка доступа ко всем настройкам устройства."}}, {"q": "Что означает TR-181 применительно к пути Device.WiFi.Radio.1.Enable?", "options": ["Стандарт радиоинтерфейса, описывающий работу в диапазоне 5 ГГц", "Стандартизованная модель данных, задающая имена и типы параметров", "Формат файла конфигурации, в котором хранятся такие параметры", "Протокол обмена сообщениями между компонентами внутри устройства"], "correct": 1, "explain": "TR-181 описывает дерево объектов и параметров устройства. Благодаря ему один и тот же путь означает одно и то же на роутерах разных вендоров.", "usage": {"code": true, "without": "У каждого вендора свои имена настроек и общий инструмент невозможен.", "with": "Device.WiFi.Radio.1.Enable\nDevice.WiFi.SSID.1.SSID", "benefit": "Оператор пишет автоматизацию один раз на весь парк."}}, {"q": "Что делает команда dmcli eRT getv Device.WiFi.Radio.1.Enable?", "options": ["Подписывается на изменения параметра и ждёт события", "Читает текущее значение параметра и печатает его тип и значение", "Включает первый радиомодуль устройства и сохраняет настройку", "Проверяет существование параметра, не читая его значения"], "correct": 1, "explain": "getv это чтение. Оно печатает имя, тип и значение. Изменение делается через setv, и путать их опасно: getv безвреден, setv меняет поведение устройства.", "usage": {"code": true, "without": "Текущее состояние узнают перезагрузкой и наблюдением.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Enable\n# Type: bool, Value: true", "benefit": "Состояние читается точно и без побочных эффектов."}}, {"q": "Почему в команде setv обязательно указывать тип значения?", "options": ["Тип нужен только для строк, остальные значения выводятся сами", "Тип задаёт приоритет записи среди конкурирующих компонентов", "Модель данных типизирована и запись без типа будет отвергнута", "Тип определяет, в какой файл конфигурации попадёт значение"], "correct": 2, "explain": "Каждый параметр в модели имеет объявленный тип. Указание типа — это проверка, что вы пишете именно то, что параметр ожидает, а не строку в булево поле.", "usage": {"code": true, "without": "Значение записывается не в том виде и компонент его игнорирует.", "with": "dmcli eRT setv Device.WiFi.SSID.1.SSID string HomeNet\ndmcli eRT setv Device.WiFi.Radio.1.Enable bool true", "benefit": "Ошибка типа ловится сразу, а не проявляется поведением."}}, {"q": "Что делает dmcli eRT getv Device.WiFi. с точкой на конце?", "options": ["Удаляет все значения поддерева, возвращая их к умолчанию", "Обходит поддерево и печатает все параметры внутри него", "Проверяет, существует ли поддерево WiFi в модели данных", "Читает только сам объект WiFi без вложенных в него параметров"], "correct": 1, "explain": "Точка на конце означает объект, а не параметр, и чтение объекта разворачивается в обход всего поддерева. На большом поддереве вывод получается очень длинным.", "usage": {"code": true, "without": "Имя нужного параметра ищут в документации вместо самого устройства.", "with": "dmcli eRT getv Device.WiFi. | grep -i ssid", "benefit": "Реальные имена параметров видны прямо на устройстве."}}, {"q": "Чем отличается объект от параметра в модели данных?", "options": ["Объект это узел дерева с потомками, параметр это лист со значением", "Объект задаёт тип данных, а параметр задаёт права доступа к нему", "Объект и параметр это синонимы, различие только историческое", "Объект хранит значение, а параметр только группирует объекты"], "correct": 0, "explain": "Путь, заканчивающийся точкой, указывает на объект. Путь без точки указывает на параметр. От этого зависит и синтаксис команды, и то, что вы получите в ответ.", "usage": {"code": true, "without": "Пытаются прочитать значение у объекта и получают неожиданный вывод.", "with": "Device.WiFi.Radio.1.       # объект\nDevice.WiFi.Radio.1.Enable  # параметр", "benefit": "Синтаксис команды подбирается верно с первого раза."}}, {"q": "Что означает число в пути Device.WiFi.Radio.1?", "options": ["Номер экземпляра в таблице объектов, а не физический номер порта", "Приоритет обработки объекта относительно остальных экземпляров", "Версию описания объекта в текущей ревизии модели данных", "Номер диапазона частот, где единица всегда означает 2,4 ГГц"], "correct": 0, "explain": "Это индекс строки в таблице. Соответствие индекса конкретному радиомодулю задаёт вендор, и оно не гарантировано одинаковым на разных платформах.", "usage": {"code": true, "without": "Индекс считают номером диапазона и настраивают чужой радиомодуль.", "with": "dmcli eRT getv Device.WiFi.Radio.1.OperatingFrequencyBand", "benefit": "Соответствие индекса диапазону проверяется, а не угадывается."}}, {"q": "Как убедиться, какой диапазон обслуживает Device.WiFi.Radio.2?", "options": ["Посчитать экземпляры: второй по счёту всегда работает на 5 ГГц", "Проверить порядок появления интерфейсов в выводе системы", "Прочитать параметр рабочего диапазона у этого экземпляра", "Посмотреть на номер канала, он однозначно задаёт диапазон"], "correct": 2, "explain": "Единственный надёжный способ — спросить у самого устройства. Порядок индексов и число радиомодулей различаются между платформами.", "usage": {"code": true, "without": "Скрипт настраивает 5 ГГц там, где под этим индексом 6 ГГц.", "with": "dmcli eRT getv Device.WiFi.Radio.2.OperatingFrequencyBand", "benefit": "Скрипт переносится между платформами без сюрпризов."}}, {"q": "Что произойдёт при setv в параметр, помеченный как доступный только для чтения?", "options": ["Команда создаст новый экземпляр объекта с этим значением", "Значение запишется в модель, но компонент его проигнорирует", "Команда завершится ошибкой и значение изменено не будет", "Значение запишется, но будет сброшено при следующей перезагрузке"], "correct": 2, "explain": "Такие параметры отражают состояние, а не настройку: BSSID, статус, счётчики. Менять надо ту настройку, из которой состояние вычисляется.", "usage": {"code": true, "without": "Пытаются задать состояние напрямую и не понимают отказа.", "with": "dmcli eRT setv Device.WiFi.SSID.1.Status string Up\n# CosaDmlSetParamValue failed", "benefit": "Понятно, что менять надо причину, а не следствие."}}, {"q": "Зачем в модели данных нужны параметры-счётчики вроде числа экземпляров таблицы?", "options": ["Чтобы ускорить обход поддерева за счёт пропуска пустых строк", "Чтобы синхронизировать нумерацию объектов между компонентами", "Чтобы узнать число существующих экземпляров без обхода дерева", "Чтобы задать максимальное число объектов, которое можно создать"], "correct": 2, "explain": "Одно чтение вместо обхода всего поддерева. На устройстве с десятками интерфейсов это заметная разница по времени.", "usage": {"code": true, "without": "Чтобы посчитать точки доступа, обходят всё дерево целиком.", "with": "dmcli eRT getv Device.WiFi.SSIDNumberOfEntries", "benefit": "Число объектов получается одним быстрым запросом."}}, {"q": "Что представляет собой объект Device.WiFi.Radio?", "options": ["Правило фильтрации трафика между беспроводным и проводным сегментом", "Запись о подключённом клиенте с его адресом и уровнем сигнала", "Физический радиомодуль с частотой, каналом и шириной полосы", "Одну беспроводную сеть с именем и паролем для подключения"], "correct": 2, "explain": "Radio — это железо: диапазон, канал, ширина, мощность. Имя сети живёт уровнем выше, и на одном радиомодуле их может быть много.", "usage": {"code": true, "without": "Настройки железа и настройки сети смешивают в одном месте.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Channel", "benefit": "Настройка железа отделена от настройки сетей поверх него."}}, {"q": "За что отвечает параметр Channel у радиомодуля?", "options": ["Задаёт число одновременных каналов передачи данных клиенту", "Определяет приоритет трафика при конкуренции за эфир", "Задаёт номер рабочего канала в пределах текущего диапазона", "Ограничивает количество клиентов, подключаемых к радиомодулю"], "correct": 2, "explain": "Номер канала задаёт центральную частоту. Вместе с шириной полосы он определяет, какой участок спектра занимает точка доступа.", "usage": {"code": true, "without": "Соседние точки работают на одном канале и мешают друг другу.", "with": "dmcli eRT setv Device.WiFi.Radio.1.Channel uint 6", "benefit": "Канал выбран осознанно, а не оставлен по умолчанию."}}, {"q": "Что означает значение 0 в параметре Channel у радиомодуля?", "options": ["Радиомодуль работает во всех каналах диапазона поочерёдно", "Настройка канала унаследована от другого радиомодуля", "Радиомодуль выключен и не занимает эфир вовсе", "Канал выбирается устройством автоматически при запуске"], "correct": 3, "explain": "Ноль означает автовыбор. Удобно дома и неудобно при разборе жалоб: канал может смениться сам, и вчерашняя картина не воспроизводится сегодня.", "usage": {"code": true, "without": "Канал меняется сам и жалобу на связь невозможно воспроизвести.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Channel\ndmcli eRT setv Device.WiFi.Radio.1.Channel uint 36", "benefit": "Канал зафиксирован и поведение повторяемо."}}, {"q": "Что задаёт параметр OperatingChannelBandwidth?", "options": ["Суммарную пропускную способность всех сетей на радиомодуле", "Максимальную скорость передачи данных для подключённых клиентов", "Ширину диапазона частот, разрешённую регулятором в стране", "Ширину занимаемой полосы, например 20, 80 или 320 мегагерц"], "correct": 3, "explain": "Ширина полосы прямо влияет на скорость и на устойчивость. Широкая полоса даёт больше скорости, но чаще натыкается на помехи и хуже добивает.", "usage": {"code": true, "without": "Ставят максимальную ширину везде и получают нестабильную связь.", "with": "dmcli eRT setv Device.WiFi.Radio.1.OperatingChannelBandwidth string 80MHz", "benefit": "Ширина подобрана под условия, а не выставлена наугад."}}, {"q": "Почему для диапазона 2,4 ГГц редко выбирают ширину 40 МГц?", "options": ["Регуляторы запрещают такую ширину в этом диапазоне повсеместно", "Оборудование этого диапазона физически не поддерживает такую ширину", "Диапазон узкий, и широкая полоса перекрывает соседние сети", "Скорость в этом диапазоне ограничена и от ширины не зависит"], "correct": 2, "explain": "В диапазоне помещается всего три непересекающихся канала по 20 МГц. Полоса 40 МГц съедает две трети доступного спектра и мешает соседям, включая вас самих.", "usage": {"code": true, "without": "Широкая полоса в тесном диапазоне снижает скорость у всех вокруг.", "with": "dmcli eRT setv Device.WiFi.Radio.1.OperatingChannelBandwidth string 20MHz", "benefit": "Соседние сети перестают мешать друг другу."}}, {"q": "Что делает параметр Enable у радиомодуля в отличие от Status?", "options": ["Enable отражает текущее состояние, Status задаёт желаемое", "Enable задаёт желаемое состояние, Status отражает фактическое", "Enable управляет питанием модуля, Status управляет его каналом", "Enable и Status дублируют друг друга для обратной совместимости"], "correct": 1, "explain": "Enable — это то, чего вы хотите. Status — то, что получилось. Расхождение между ними и есть сигнал о проблеме, поэтому смотреть надо оба.", "usage": {"code": true, "without": "Видят включённый Enable и считают, что радио работает.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Enable\ndmcli eRT getv Device.WiFi.Radio.1.Status", "benefit": "Расхождение желаемого и фактического становится заметным."}}, {"q": "Что означает параметр AutoChannelEnable в значении true?", "options": ["Клиенты автоматически переключаются между каналами при движении", "Радиомодуль использует все каналы диапазона одновременно", "Канал меняется по расписанию, заданному оператором связи", "Радиомодуль сам выбирает канал, оценивая загруженность эфира"], "correct": 3, "explain": "Устройство сканирует эфир и выбирает наименее занятый канал. Обратная сторона — при каждом пересчёте клиенты на короткое время теряют связь.", "usage": {"code": true, "without": "Канал выбирают вручную и он устаревает при смене обстановки.", "with": "dmcli eRT setv Device.WiFi.Radio.1.AutoChannelEnable bool true", "benefit": "Канал подстраивается под реальную загруженность эфира."}}, {"q": "Что показывает параметр TransmitPower у радиомодуля?", "options": ["Мощность в процентах от максимально разрешённой для платформы", "Уровень принимаемого сигнала от самого дальнего клиента", "Абсолютную мощность передатчика в милливаттах на антенне", "Суммарную мощность, потребляемую радиомодулем от источника"], "correct": 0, "explain": "Значение задаётся в процентах именно потому, что абсолютный потолок зависит от страны и диапазона. Снижение мощности иногда полезно: оно уменьшает зону, где клиент цепляется, но не может нормально работать.", "usage": {"code": true, "without": "Мощность выкручивают на максимум и получают клиентов на пределе связи.", "with": "dmcli eRT setv Device.WiFi.Radio.1.TransmitPower int 75", "benefit": "Зона покрытия соответствует зоне уверенной работы."}}, {"q": "Зачем радиомодулю параметр RegulatoryDomain?", "options": ["Он задаёт часовой пояс для расписания работы сети", "Он выбирает язык интерфейса управления устройством", "Он определяет разрешённые каналы и предельную мощность", "Он выбирает набор поддерживаемых стандартов связи"], "correct": 2, "explain": "Регуляторная зона ограничивает и каналы, и мощность. Поэтому канал, спокойно работающий в одной стране, в другой может оказаться недоступным.", "usage": {"code": true, "without": "Устройство настраивают на канал, запрещённый в стране установки.", "with": "dmcli eRT getv Device.WiFi.Radio.1.RegulatoryDomain", "benefit": "Настройки не выходят за рамки местных правил."}}, {"q": "Что показывает параметр PossibleChannels у радиомодуля?", "options": ["Каналы, доступные с учётом диапазона и регуляторной зоны", "Каналы, использованные радиомодулем с момента включения", "Каналы, поддерживаемые клиентами, подключёнными к сети", "Каналы, которые сейчас заняты соседними точками доступа"], "correct": 0, "explain": "Это список того, из чего вообще можно выбирать на данной платформе в данной стране. Попытка выйти за него закончится отказом при записи канала.", "usage": {"code": true, "without": "Канал задают наугад и получают отказ без понятной причины.", "with": "dmcli eRT getv Device.WiFi.Radio.1.PossibleChannels", "benefit": "Канал выбирается из заведомо допустимого списка."}}, {"q": "Что представляет собой объект Device.WiFi.SSID в модели данных?", "options": ["Физический радиомодуль с настройками канала и мощности", "Настройки безопасности и правила доступа для беспроводной сети", "Логический интерфейс сети с именем и собственным адресом", "Запись о клиенте, подключённом к беспроводной сети устройства"], "correct": 2, "explain": "SSID — это уровень интерфейса: имя сети и её BSSID. Он ссылается вниз на радиомодуль и служит опорой для объекта точки доступа сверху.", "usage": {"code": true, "without": "Имя сети ищут в настройках радиомодуля и не находят.", "with": "dmcli eRT getv Device.WiFi.SSID.1.SSID\ndmcli eRT getv Device.WiFi.SSID.1.BSSID", "benefit": "Понятно, на каком уровне живёт имя сети."}}, {"q": "Чем BSSID отличается от SSID?", "options": ["BSSID это имя сети для пользователя, SSID это её внутренний номер", "BSSID задаётся администратором, а SSID выдаётся производителем", "BSSID это адрес интерфейса точки доступа, SSID это имя сети", "BSSID и SSID это одно и то же, различаются только регистром букв"], "correct": 2, "explain": "SSID видит человек, BSSID видит протокол. На одном радиомодуле несколько сетей имеют разные имена и разные BSSID, обычно отличающиеся младшими битами.", "usage": {"code": true, "without": "В логах ищут имя сети, хотя там фигурируют только адреса.", "with": "dmcli eRT getv Device.WiFi.SSID.1.SSID   # HomeNet\ndmcli eRT getv Device.WiFi.SSID.1.BSSID  # 00:11:22:33:44:01", "benefit": "Записи в логах сопоставляются с понятными именами сетей."}}, {"q": "Почему параметр BSSID обычно доступен только для чтения?", "options": ["Изменение адреса запрещено стандартом беспроводной связи", "Адрес назначается драйвером при поднятии интерфейса", "Адрес назначается контроллером сети оператора при регистрации", "Адрес зашит в микросхему и не может быть изменён программно"], "correct": 1, "explain": "Драйвер выдаёт адреса интерфейсам, обычно производя их из базового адреса устройства. Менять надо настройки, из которых адрес получается, а не сам адрес.", "usage": {"code": true, "without": "Пытаются задать адрес интерфейса напрямую и получают отказ.", "with": "dmcli eRT getv Device.WiFi.SSID.2.BSSID", "benefit": "Адрес читается как факт, а не задаётся как настройка."}}, {"q": "Что описывает объект Device.WiFi.AccessPoint?", "options": ["Список каналов, на которых работает радиомодуль устройства", "Таблицу маршрутизации между беспроводным и проводным сегментом", "Физические параметры антенны и её направленность", "Настройки точки доступа: безопасность, изоляция, список клиентов"], "correct": 3, "explain": "AccessPoint отвечает за поведение сети: тип шифрования, скрытие имени, изоляция клиентов. Имя сети при этом лежит в связанном объекте SSID.", "usage": {"code": true, "without": "Настройки шифрования ищут там же, где имя сети.", "with": "dmcli eRT getv Device.WiFi.AccessPoint.1.Security.ModeEnabled", "benefit": "Каждая настройка ищется на своём уровне модели."}}, {"q": "Как объект AccessPoint связан с объектом SSID?", "options": ["Через параметр-ссылку, указывающий на нужный экземпляр SSID", "Через общий родительский объект, объединяющий их автоматически", "Через совпадение индексов: первый AP всегда связан с первым SSID", "Связи нет, эти объекты настраиваются полностью независимо"], "correct": 0, "explain": "Ссылка задаётся явно параметром SSIDReference. Совпадение индексов встречается часто, но полагаться на него нельзя: это соглашение платформы, а не правило модели.", "usage": {"code": true, "without": "Скрипт считает индексы совпадающими и правит чужую сеть.", "with": "dmcli eRT getv Device.WiFi.AccessPoint.1.SSIDReference", "benefit": "Связь между объектами читается, а не предполагается."}}, {"q": "Что задаёт параметр Security.ModeEnabled у точки доступа?", "options": ["Уровень шифрования канала между устройством и провайдером", "Режим работы встроенного межсетевого экрана устройства", "Режим защиты сети, например WPA2-Personal или WPA3-Personal", "Политику доступа клиентов по списку разрешённых адресов"], "correct": 2, "explain": "Этот параметр определяет, как клиент доказывает право войти. WPA3 обязателен для 6 ГГц, поэтому на новом диапазоне старые режимы просто недоступны.", "usage": {"code": true, "without": "Сеть поднимают открытой и обнаруживают это по чужому трафику.", "with": "dmcli eRT setv Device.WiFi.AccessPoint.1.Security.ModeEnabled string WPA3-Personal", "benefit": "Режим защиты задан явно и проверяем."}}, {"q": "Что делает параметр SSIDAdvertisementEnabled в значении false?", "options": ["Запрещает подключение новых клиентов, оставляя текущих", "Отключает сеть полностью, клиенты подключиться не смогут", "Убирает имя сети из маяков, и она не видна в списке сетей", "Скрывает список подключённых клиентов от других устройств"], "correct": 2, "explain": "Сеть продолжает работать, но имя не рассылается. Защитой это не является: имя всплывает при подключении клиента, и его несложно подсмотреть.", "usage": {"code": true, "without": "Скрытие имени принимают за меру защиты и на этом успокаиваются.", "with": "dmcli eRT setv Device.WiFi.AccessPoint.1.SSIDAdvertisementEnabled bool false", "benefit": "Понятно, что это удобство, а не защита."}}, {"q": "Что делает параметр IsolationEnable у точки доступа?", "options": ["Отключает передачу служебных кадров между точками доступа", "Отделяет беспроводной сегмент от проводного на уровне маршрутов", "Изолирует радиомодуль от соседних каналов для снижения помех", "Запрещает клиентам этой сети обмениваться трафиком между собой"], "correct": 3, "explain": "Типовая настройка гостевой сети: телефон гостя видит интернет, но не видит ваш сетевой диск. Внутрисетевой обмен между клиентами блокируется.", "usage": {"code": true, "without": "Гости получают доступ к домашним устройствам вместе с интернетом.", "with": "dmcli eRT setv Device.WiFi.AccessPoint.3.IsolationEnable bool true", "benefit": "Гостевая сеть перестаёт видеть домашние устройства."}}, {"q": "Что содержит таблица AssociatedDevice у точки доступа?", "options": ["Список подключённых сейчас клиентов с их адресами и сигналом", "Список соседних точек доступа, обнаруженных при сканировании", "Список сетей, доступных для подключения с этого устройства", "Список ранее подключавшихся клиентов за всю историю работы"], "correct": 0, "explain": "Первое место, куда смотрят по жалобе на связь: подключён ли клиент вообще, и с каким уровнем сигнала. Отключившиеся клиенты из таблицы пропадают.", "usage": {"code": true, "without": "О состоянии клиента судят по его собственным словам.", "with": "dmcli eRT getv Device.WiFi.AccessPoint.1.AssociatedDeviceNumberOfEntries", "benefit": "Видно фактическое состояние подключений на устройстве."}}, {"q": "Сколько объектов SSID может ссылаться на один радиомодуль?", "options": ["Столько, сколько клиентов одновременно подключено к сети", "Ровно один, иначе возникнет конфликт настроек канала", "Не более двух: основная сеть и гостевая сеть устройства", "Несколько, каждый со своим именем и своим адресом интерфейса"], "correct": 3, "explain": "Это и есть основа гостевых сетей: на одном радиомодуле поднимается несколько виртуальных точек. Все они делят один канал и один эфир, поэтому и полосу тоже делят.", "usage": {"code": true, "without": "Ради гостевой сети ставят второе устройство рядом.", "with": "dmcli eRT getv Device.WiFi.SSID.1.LowerLayers\ndmcli eRT getv Device.WiFi.SSID.3.LowerLayers", "benefit": "Несколько сетей работают на одном радиомодуле."}}, {"q": "Что произойдёт сразу после успешного setv в параметр имени сети?", "options": ["Значение запишется, но применится только после перезагрузки", "Значение попадёт в модель, а компонент применит его к железу", "Значение проверится на корректность, но записано пока не будет", "Значение сохранится в файл и вступит в силу по расписанию"], "correct": 1, "explain": "Модель — это не файл конфигурации, а интерфейс к работающим компонентам. Запись обычно вызывает применение, поэтому смена имени сети отключает подключённых клиентов немедленно.", "usage": {"code": true, "without": "Настройку меняют днём и отключают всех клиентов разом.", "with": "dmcli eRT setv Device.WiFi.SSID.1.SSID string NewName", "benefit": "Момент применения предсказуем и планируется заранее."}}, {"q": "Почему изменение имени сети отключает подключённых клиентов?", "options": ["Интерфейс перезапускается, и текущие подключения разрываются", "Смена имени сбрасывает ключи шифрования у всех клиентов сети", "Клиенты сами отключаются, обнаружив несовпадение имени в списке", "Устройство запрещает подключения на время применения настройки"], "correct": 0, "explain": "Смена имени требует перезапуска виртуального интерфейса. Клиенты переподключаются сами, но перерыв заметен, а сохранённое на клиенте имя сети уже не совпадает.", "usage": {"code": true, "without": "Имя меняют в рабочее время и получают шквал жалоб.", "with": "dmcli eRT setv Device.WiFi.SSID.1.SSID string NewName\n# короткий обрыв у всех клиентов", "benefit": "Смена имени планируется на окно обслуживания."}}, {"q": "Как проверить, что настройка действительно применилась к железу?", "options": ["Перезагрузить устройство и убедиться, что значение сохранилось", "Прочитать тот же параметр обратно и сравнить со значением", "Прочитать связанный параметр состояния и проверить его", "Посмотреть код возврата команды записи, он это гарантирует"], "correct": 2, "explain": "Чтение записанного параметра лишь подтверждает, что значение легло в модель. Применилось оно или нет, показывает состояние: Status, фактический канал, наличие интерфейса.", "usage": {"code": true, "without": "Успешную запись принимают за успешное применение.", "with": "dmcli eRT setv Device.WiFi.Radio.1.Channel uint 36\ndmcli eRT getv Device.WiFi.Radio.1.Status", "benefit": "Проверяется результат, а не факт записи."}}, {"q": "Что означает пустой вывод getv для существующего по документации параметра?", "options": ["Значение слишком длинное и не помещается в буфер вывода", "Параметр доступен только для записи и читать его нельзя", "Параметр существует, но его значение равно пустой строке", "Компонент, отвечающий за это поддерево, не отвечает или не запущен"], "correct": 3, "explain": "Модель собирается из компонентов. Если компонент упал или ещё не поднялся, его ветка отвечает пусто или ошибкой, хотя в документации она есть.", "usage": {"code": true, "without": "Отсутствие ответа принимают за отсутствие параметра.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Status\nsystemctl status wifiagent", "benefit": "Проверяется живость компонента, а не только путь."}}, {"q": "Зачем перед правкой параметра полезно прочитать его текущее значение?", "options": ["Чтобы модель разрешила запись после предварительного чтения", "Чтобы значение попало в кеш и запись прошла быстрее", "Чтобы зафиксировать параметр от изменений другими компонентами", "Чтобы узнать тип параметра и не ошибиться при записи"], "correct": 3, "explain": "Вывод getv показывает объявленный тип. Это избавляет от угадывания между int и uint и заодно даёт значение, к которому можно вернуться.", "usage": {"code": true, "without": "Тип угадывают и запись отклоняется без внятной причины.", "with": "dmcli eRT getv Device.WiFi.Radio.1.Channel\n# Type: uint, Value: 36", "benefit": "Тип и старое значение известны до правки."}}, {"q": "Что стоит проверить, если клиент видит сеть, но не может подключиться?", "options": ["Номер канала радиомодуля и его соответствие регуляторной зоне", "Уровень мощности передатчика и ширину занимаемой полосы", "Режим защиты сети и его поддержку на стороне клиента", "Число уже подключённых клиентов и суммарную загрузку сети"], "correct": 2, "explain": "Сеть видна, значит радио работает и маяки идут. Дальше отваливается аутентификация: старый клиент не умеет WPA3, либо на 6 ГГц не поддерживает обязательный режим.", "usage": {"code": true, "without": "Чинят радио, хотя проблема в несовместимости режима защиты.", "with": "dmcli eRT getv Device.WiFi.AccessPoint.1.Security.ModeEnabled", "benefit": "Разбор идёт от того, что уже подтверждено работой."}}, {"q": "Почему опасно менять настройки скриптом без чтения индексов?", "options": ["Скрипт будет работать медленнее из-за пропуска кеширования", "Модель запрещает запись без предварительного обхода дерева", "Соответствие индексов и сетей различается между платформами", "Индексы меняются при каждой перезагрузке в случайном порядке"], "correct": 2, "explain": "Один и тот же индекс на разных моделях означает разные сети. Скрипт, написанный на одной платформе, на другой молча настроит не ту сеть, и это заметят пользователи.", "usage": {"code": true, "without": "Массовая настройка парка попадает не в те сети на части моделей.", "with": "dmcli eRT getv Device.WiFi.SSID. | grep -E 'SSID|BSSID'", "benefit": "Скрипт находит нужную сеть по имени, а не по номеру."}}, {"q": "Как безопаснее найти нужную сеть в скрипте автоматизации?", "options": ["Всегда брать первый экземпляр, он соответствует основной сети", "Обойти таблицу и выбрать экземпляр по совпадению имени сети", "Использовать фиксированный индекс, проверенный на одной модели", "Определять индекс по числу экземпляров в таблице объектов"], "correct": 1, "explain": "Имя сети задаёт оператор, и оно одинаково на всём парке. Индекс задаёт платформа, и он разный. Искать надо по тому, чем вы управляете сами.", "usage": {"code": true, "without": "Скрипт привязан к индексу и ломается на другой модели.", "with": "for i in 1 2 3 4; do dmcli eRT getv Device.WiFi.SSID.$i.SSID; done", "benefit": "Скрипт работает на всех моделях парка одинаково."}}, {"q": "Что показывает расхождение Enable в значении true и Status в значении Down?", "options": ["Настройка задана, но интерфейс поднять не удалось", "Настройка не сохранилась и была отброшена при записи", "Интерфейс отключён администратором через другой параметр", "Интерфейс работает, а параметр состояния просто устарел"], "correct": 0, "explain": "Именно ради таких случаев два параметра и разделены. Причина обычно ниже: радиомодуль выключен, канал недопустим в регуляторной зоне, или драйвер не поднялся.", "usage": {"code": true, "without": "Видят включённую настройку и считают, что сеть работает.", "with": "dmcli eRT getv Device.WiFi.SSID.1.Enable\ndmcli eRT getv Device.WiFi.SSID.1.Status\ndmcli eRT getv Device.WiFi.Radio.1.Status", "benefit": "Разбор идёт вниз по слоям до настоящей причины."}}, {"q": "Зачем оператору нужна одинаковая модель данных на разных моделях устройств?", "options": ["Чтобы одна и та же автоматизация работала на всём парке", "Чтобы ускорить применение настроек за счёт общего кеша", "Чтобы уменьшить размер прошивки за счёт общего кода модели", "Чтобы устройства могли обмениваться настройками напрямую"], "correct": 0, "explain": "В этом и смысл стандартизованной модели. Написанный один раз сценарий поддержки работает на устройствах разных вендоров, потому что имена параметров совпадают.", "usage": {"code": true, "without": "Под каждую модель роутера пишут свой сценарий поддержки.", "with": "dmcli eRT getv Device.WiFi.SSID.1.SSID  # одинаково у всех вендоров", "benefit": "Один сценарий обслуживает весь разнородный парк."}}, {"q": "Радиомодуль 1 обслуживает 2,4 ГГц, радиомодуль 2 обслуживает 5 ГГц. На каждом поднято по 3 сети. Сколько объектов SSID в модели?", "options": ["Три, по числу сетей, общих для обоих радиомодулей", "Два, по одному объекту на каждый физический радиомодуль", "Шесть, по одному объекту на каждую сеть каждого радиомодуля", "Девять, по числу сочетаний радиомодулей и поднятых сетей"], "correct": 2, "explain": "Шаг 1: объект SSID соответствует одной сети на одном радиомодуле. Шаг 2: на каждом радиомодуле их три. Шаг 3: 2 умножить на 3 даёт 6 объектов.", "usage": {"code": true, "without": "Число интерфейсов считают по числу радиомодулей и недосчитываются.", "with": "dmcli eRT getv Device.WiFi.SSIDNumberOfEntries  # 6", "benefit": "Ожидаемое число сходится с фактическим."}}, {"q": "Вы записали канал 36 в радиомодуль 2,4 ГГц. Команда вернула ошибку. Почему?", "options": ["Канал 36 занят соседней точкой доступа и потому отклонён", "Для смены канала требуется сначала выключить радиомодуль", "Канал 36 относится к диапазону 5 ГГц и здесь недопустим", "Тип значения указан неверно и запись была отвергнута моделью"], "correct": 2, "explain": "Шаг 1: в 2,4 ГГц номера каналов идут примерно с 1 по 13. Шаг 2: 36 в этот набор не входит, он из 5 ГГц. Шаг 3: значение вне допустимого списка отвергается.", "usage": {"code": true, "without": "Номер канала копируют из примера для другого диапазона.", "with": "dmcli eRT getv Device.WiFi.Radio.1.PossibleChannels", "benefit": "Канал выбирается из списка, разрешённого для диапазона."}}, {"q": "BSSID основной сети равен 00:11:22:33:44:00. Гостевая сеть на том же радиомодуле. Какой BSSID у неё вероятнее всего?", "options": ["Совершенно другой адрес, не связанный с адресом основной сети", "Адрес того же вида, отличающийся младшими битами последнего байта", "Такой же адрес: сети на одном радиомодуле делят один BSSID", "Адрес с изменённым первым байтом, задающим тип интерфейса"], "correct": 1, "explain": "Шаг 1: у каждой виртуальной точки свой BSSID. Шаг 2: драйвер производит их из базового адреса. Шаг 3: обычно меняются младшие биты, то есть адрес будет вида 00:11:22:33:44:01.", "usage": {"code": true, "without": "В логах не могут связать соседние адреса с одним устройством.", "with": "dmcli eRT getv Device.WiFi.SSID.1.BSSID\ndmcli eRT getv Device.WiFi.SSID.2.BSSID", "benefit": "Записи логов сопоставляются с одним физическим устройством."}}, {"q": "Скрипт задаёт имя сети по индексу 1. На модели A это основная сеть, на модели B индекс 1 отдан гостевой. Что произойдёт при массовом применении?", "options": ["На обеих моделях результат будет одинаковым благодаря стандарту", "На модели B скрипт вернёт ошибку и ничего не изменит", "На модели B скрипт переименует обе сети одновременно", "На модели B переименуется гостевая сеть вместо основной"], "correct": 3, "explain": "Шаг 1: индекс это номер строки таблицы, а не роль сети. Шаг 2: на модели B под этим номером другая сеть. Шаг 3: скрипт молча переименует не ту сеть, ошибки не будет.", "usage": {"code": true, "without": "Массовая правка портит гостевые сети на части парка.", "with": "dmcli eRT getv Device.WiFi.SSID.1.SSID  # сверить перед записью", "benefit": "Перед записью проверяется, та ли это сеть."}}, {"q": "Enable у SSID.1 равен true, Status равен Down. Radio.1.Status равен Up. Где искать причину?", "options": ["В сетевых настройках хоста, к которому подключено устройство", "В самом интерфейсе или его настройках, радио при этом работает", "В регуляторной зоне: выбранный канал запрещён в этой стране", "В радиомодуле: он выключен и не может поднять интерфейс"], "correct": 1, "explain": "Шаг 1: радиомодуль поднят, значит нижний слой в порядке. Шаг 2: интерфейс SSID при этом лежит. Шаг 3: причина на уровне самого интерфейса, а не радио под ним.", "usage": {"code": true, "without": "Начинают с радиомодуля, хотя он уже подтверждённо работает.", "with": "dmcli eRT getv Device.WiFi.SSID.1.\ndmcli eRT getv Device.WiFi.AccessPoint.1.", "benefit": "Разбор начинается с того слоя, где сломалось."}}, {"q": "На радиомодуле 4 сети, полоса 80 МГц даёт суммарно 400 Мбит в секунду. Три сети простаивают, четвёртая загружена. Какую скорость увидит клиент?", "options": ["Около 300 Мбит: одна четверть теряется на служебный трафик", "Около 100 Мбит: полоса делится поровну между всеми сетями", "Около 400 Мбит: простаивающие сети эфир почти не занимают", "Около 50 Мбит: каждая виртуальная сеть удваивает накладные расходы"], "correct": 2, "explain": "Шаг 1: полоса делится не поровну, а по факту использования эфира. Шаг 2: простаивающие сети шлют только маяки. Шаг 3: активной сети достаётся почти всё, минус небольшие накладные расходы.", "usage": {"code": true, "without": "Гостевые сети выключают ради скорости, хотя они простаивают.", "with": "# маяки 4 сетей отнимают проценты, а не три четверти", "benefit": "Решение о числе сетей принимается по реальным данным."}}, {"q": "Вы включили автовыбор канала. Через неделю жалоба на обрывы связи каждый день примерно в одно время. Что проверить?", "options": ["Не меняется ли канал при пересчёте и не совпадает ли это со временем", "Не сбрасываются ли настройки безопасности при перезагрузке", "Не превышена ли максимальная мощность передатчика в этой зоне", "Не переполнена ли таблица подключённых клиентов на точке доступа"], "correct": 0, "explain": "Шаг 1: обрывы регулярны по времени, значит есть периодический процесс. Шаг 2: автовыбор пересчитывает канал по расписанию. Шаг 3: смена канала кратко разрывает связь у всех клиентов.", "usage": {"code": true, "without": "Ищут внешнюю помеху, хотя канал меняет само устройство.", "with": "dmcli eRT setv Device.WiFi.Radio.1.AutoChannelEnable bool false\ndmcli eRT setv Device.WiFi.Radio.1.Channel uint 36", "benefit": "Канал зафиксирован и ежедневные обрывы прекращаются."}}, {"q": "Нужно поднять гостевую сеть, изолированную от домашних устройств, на том же радиомодуле. Какой минимальный набор действий?", "options": ["Включить скрытие имени сети и ограничить мощность передатчика", "Задать имя нового SSID, включить его и включить изоляцию клиентов", "Сменить канал радиомодуля и поднять на нём вторую сеть", "Создать второй радиомодуль и перенести на него гостевую сеть"], "correct": 1, "explain": "Шаг 1: второй радиомодуль не нужен, виртуальных точек на одном может быть несколько. Шаг 2: нужны имя и включение интерфейса. Шаг 3: изоляция закрывает гостям доступ к домашним устройствам.", "usage": {"code": true, "without": "Ради гостевой сети покупают и настраивают второе устройство.", "with": "dmcli eRT setv Device.WiFi.SSID.3.SSID string Guest\ndmcli eRT setv Device.WiFi.SSID.3.Enable bool true\ndmcli eRT setv Device.WiFi.AccessPoint.3.IsolationEnable bool true", "benefit": "Гостевая сеть поднимается на имеющемся железе."}}, {"q": "Чтение Device.WiFi.Radio.1.Status возвращает пустоту, а Device.DeviceInfo читается нормально. О чём это говорит?", "options": ["Путь указан неверно и такого параметра в модели не существует", "Устройство перегружено и не успевает отвечать на запросы вовремя", "Компонент, обслуживающий ветку WiFi, не работает или упал", "Параметр доступен только для записи и потому не читается"], "correct": 2, "explain": "Шаг 1: другая ветка читается, значит сама шина и dmcli работают. Шаг 2: пустой ответ приходит именно от ветки WiFi. Шаг 3: значит не отвечает компонент, который её обслуживает.", "usage": {"code": true, "without": "Перезагружают устройство целиком вместо перезапуска компонента.", "with": "systemctl status wifiagent\nsystemctl restart wifiagent", "benefit": "Чинится конкретный компонент, а не всё устройство."}}, {"q": "Оператор меняет режим защиты на WPA3-Personal на всём парке. Часть клиентов перестала подключаться, сеть при этом видна. Что произошло?", "options": ["Мощность передатчика снизилась и клиенты потеряли покрытие", "Устройства сменили канал при применении настройки безопасности", "Старые клиенты не поддерживают WPA3 и не проходят проверку", "Имя сети изменилось вместе с режимом и клиенты его не нашли"], "correct": 2, "explain": "Шаг 1: сеть видна, значит радио и маяки в порядке. Шаг 2: отваливается именно вход. Шаг 3: клиенты старше нескольких лет WPA3 не умеют, им нужен переходный режим.", "usage": {"code": true, "without": "Переход на новый режим разом отключает часть абонентов.", "with": "dmcli eRT setv Device.WiFi.AccessPoint.1.Security.ModeEnabled string WPA3-Personal-Transition", "benefit": "Новые клиенты получают WPA3, старые продолжают работать."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q.q) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
