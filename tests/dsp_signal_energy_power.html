<style>
  .katex { font-size: 1.08em; }

  :root {

  html, body {

  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }

  .qimg img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); }

  .explain {

  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }

  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);

    text-decoration: none; display: inline-flex; align-items: center;

  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);

    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }

    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;

    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }

<script>
(function () {
  const TEST_ID = "dsp_signal_energy_power";
  const QUESTIONS = [{"q": "Какой сигнал называют детерминированным (deterministic signal)?", "options": ["Сигнал, значение которого в любой момент заранее задано формулой или графиком", "Сигнал, который повторяет свою форму через равные промежутки времени", "Сигнал, который существует только в отдельные моменты времени — отсчёты", "Сигнал, который принимает только два значения: ноль и единицу"], "correct": 0, "explain": "Детерминированный сигнал известен точно в любой момент: например, \\(s(t)=S_m\\cos(\\omega_1 t+\\psi)\\). Противоположность — случайный сигнал (random signal): шум датчика, речь; про него известны лишь статистические свойства. Повторяемость формы — другой признак, периодичность (periodic): одиночный импульс детерминирован, но не периодичен. Существование только в отсчётах — признак дискретного сигнала (discrete-time), два значения — двоичного. Эти признаки независимы друг от друга. Интуиция: детерминированный — тот, который можно «предсказать по формуле».", "usage": {"code": false, "without": "Шум энкодера колеса пытаются описать формулой и «предсказать» его следующее значение — фильтр подгоняется под случайность и работает хуже.", "with": "Опорную синусоиду генератора считают детерминированной и вычитают точно, а шум энкодера описывают статистикой — дисперсией и спектром.", "benefit": "Ясно, что можно описать формулой, а что — только статистикой"}}, {"q": "Сигнал называют периодическим (periodic signal) с периодом \\(T\\), если…", "options": ["\\(s(t)=-s(t+T)\\) при любом \\(t\\), а \\(T\\) — наименьшее такое положительное число", "\\(s(t)=s(-t)\\) при любом \\(t\\), а \\(T\\) — длительность участка, где сигнал не ноль", "\\(s(t)=s(t+T)\\) при любом \\(t\\), а \\(T\\) — наименьшее такое положительное число", "\\(s(t)=s(t+T)\\) хотя бы при одном \\(t\\), а \\(T\\) — время между двумя максимумами"], "correct": 2, "explain": "Периодический сигнал повторяется целиком: равенство \\(s(t)=s(t+T)\\) должно выполняться при всех \\(t\\), а период — наименьший такой сдвиг. Отсюда круговая частота (angular frequency) \\(\\omega_1=2\\pi/T\\). Равенство \\(s(t)=-s(t+T)\\) — «повтор с переворотом»; такой сигнал периодичен, но с периодом \\(2T\\). Равенство \\(s(t)=s(-t)\\) — чётность, симметрия относительно нуля, а не повторение. Совпадение значений в одной точке бывает у любого колебания, даже затухающего, — этого мало. Интуиция: сдвинул график на \\(T\\) — и он лёг сам на себя.", "usage": {"code": false, "without": "Вибрацию двигателя робота считают периодической «на глаз» по двум похожим пикам и берут период неверно — частота в отчёте ошибочна вдвое.", "with": "Период ищут как наименьший сдвиг, при котором вся запись совпадает сама с собой, и получают верную частоту вращения.", "benefit": "Период и частота определяются однозначно"}}, {"q": "Чем дискретный сигнал (discrete-time signal) отличается от цифрового (digital signal)?", "options": ["Дискретный задан только в отсчётах времени, а цифровой ещё и квантован по уровню", "Дискретный квантован по уровню, а цифровой задан только в отсчётах времени", "Ничем: это два названия одного и того же сигнала в разных учебниках", "Дискретный — случайный, а цифровой — детерминированный по определению"], "correct": 0, "explain": "Аналоговый сигнал непрерывен и по времени, и по значению. Дискретный (discrete-time) берётся только в моменты \\(t=nT_s\\), но значение отсчёта может быть любым вещественным числом. Цифровой (digital) — дискретный сигнал, у которого значения ещё и округлены до конечного набора уровней (квантование, quantization), чтобы их можно было записать двоичным кодом. Первый дистрактор переставляет признаки местами; второй их смешивает; третий путает дискретность с детерминированностью — это независимые признаки. Интуиция: дискретизация режет ось времени, квантование — ось значений.", "usage": {"code": false, "without": "Ошибку АЦП датчика тока списывают на «дискретизацию», хотя виноват грубый шаг квантования 8-битного преобразователя.", "with": "Разделяют две ошибки: частота выборки отвечает за полосу, разрядность АЦП — за шум квантования, и чинят то, что нужно.", "benefit": "Понятно, что улучшать: частоту выборки или разрядность"}}, {"q": "Сигнал \\(s(t)\\) — напряжение в вольтах. Что физически означает его энергия (energy) \\(E=\\int_{-\\infty}^{\\infty}s^2(t)\\,dt\\)?", "options": ["Площадь под графиком сигнала за всё время с учётом знака; единица — В·с", "Наибольшее мгновенное значение квадрата сигнала; единица измерения — В²", "Среднее значение сигнала за всё время его существования; единица — В", "Энергию, которую сигнал выделил бы на резисторе 1 Ом за всё время; единица — В²·с"], "correct": 3, "explain": "Мгновенная мощность на резисторе \\(R\\) равна \\(u^2/R\\). В теории сигналов берут \\(R=1\\) Ом, и тогда \\(s^2(t)\\) — мгновенная мощность, а её интеграл по времени — энергия, в В²·с. Площадь с учётом знака — это \\(\\int s\\,dt\\) без квадрата: у синусоиды она нулевая, хотя энергия есть. Пик квадрата — одна точка, а энергия набирается за всё время. Среднее значение — постоянная составляющая, совсем другая величина. Интуиция: квадрат делает любой знак «нагревом», интеграл суммирует нагрев за всё время.", "usage": {"code": false, "without": "Энергию импульса тока в обмотке двигателя считают как площадь под графиком тока — знакопеременный импульс «ничего не стоит», а мотор греется.", "with": "Считают \\(\\int i^2\\,dt\\) и умножают на сопротивление обмотки: получают реальные джоули нагрева за импульс.", "benefit": "Тепловой расчёт привода опирается на настоящую энергию"}}, {"q": "Что такое средняя мощность (average power) периодического сигнала \\(P=\\frac{1}{T}\\int_0^T s^2(t)\\,dt\\)?", "options": ["Среднее значение квадрата сигнала за период: энергия периода, делённая на \\(T\\)", "Квадрат среднего значения сигнала за период, то есть постоянная составляющая в квадрате", "Энергия сигнала за один период без деления на длительность периода \\(T\\)", "Наибольшее значение квадрата сигнала на периоде, делённое на два"], "correct": 0, "explain": "Сначала возводим в квадрат, потом усредняем: \\(P=\\frac1T\\int_0^T s^2(t)\\,dt\\) — энергия одного периода, разделённая на его длительность, то есть энергия в единицу времени. Квадрат среднего — обратный порядок действий; у синусоиды среднее ноль, а мощность \\(S_m^2/2\\). Энергия периода без деления на \\(T\\) имеет единицу В²·с, а не В², и зависит от длины периода. «Пик пополам» верно только для гармонического сигнала, не для любого. Интуиция: мощность — «сколько энергии в секунду» сигнал приносит в среднем.", "usage": {"code": false, "without": "Мощность вибрации подвески считают по среднему значению акселерометра — оно около нуля, и вибрацию объявляют слабой.", "with": "Усредняют квадрат ускорения за период колебаний и видят реальную мощность вибрации.", "benefit": "Колебания вокруг нуля не теряются в оценке"}}, {"q": "Какой сигнал называют сигналом с конечной энергией (energy signal)?", "options": ["Сигнал, у которого \\(E\\) бесконечна, а средняя мощность конечна и не равна нулю", "Сигнал, у которого \\(E\\) конечна, а средняя мощность за бесконечное время равна нулю", "Сигнал, у которого и \\(E\\), и средняя мощность конечны и обе не равны нулю", "Сигнал с ограниченной амплитудой — независимо от того, сколько он длится"], "correct": 1, "explain": "Energy signal — сигнал с \\(0<E<\\infty\\); таковы одиночные импульсы. Его средняя мощность \\(\\lim\\frac{E}{T_{\\text{набл}}}\\) равна нулю. Описание «\\(E\\) бесконечна, мощность конечна» — это сигнал мощности (power signal): периодические сигналы, синусоида на всей оси. Оба значения сразу ненулевыми и конечными быть не могут: конечная энергия даёт нулевую мощность. Ограниченность амплитуды ничего не решает: \\(\\cos\\omega_1 t\\) ограничен, но его энергия бесконечна. Интуиция: импульс «кончается» — его меряют энергией; периодический «не кончается» — мощностью.", "usage": {"code": false, "without": "Для ультразвукового эха дальномера считают среднюю мощность за минуту записи — получают почти ноль и решают, что эха нет.", "with": "Эхо — одиночный импульс, его меряют энергией: её сравнивают с энергией шума в том же окне и надёжно находят отражение.", "benefit": "Каждый сигнал меряют подходящей величиной"}}, {"q": "Какой из сигналов — сигнал мощности (power signal), а не сигнал энергии?", "options": ["\\(S_m\\cos\\omega_1 t\\), заданный на всей оси времени", "Одиночный прямоугольный импульс высотой \\(S_m\\) и длительностью \\(\\tau\\)", "\\(S_m e^{-\\alpha t}\\) при \\(t\\ge0\\) и ноль при \\(t<0\\), где \\(\\alpha>0\\)", "Одиночный треугольный импульс высотой \\(S_m\\) и длительностью \\(\\tau\\)"], "correct": 0, "explain": "Гармоника на всей оси повторяется бесконечно: каждый период добавляет энергию \\(S_m^2T/2\\), полная энергия бесконечна, а средняя мощность конечна, \\(S_m^2/2\\). Прямоугольный и треугольный импульсы конечной длительности имеют конечную энергию: \\(S_m^2\\tau\\) и \\(S_m^2\\tau/3\\). Затухающая экспонента длится бесконечно, но убывает так быстро, что энергия конечна: \\(S_m^2/(2\\alpha)\\). Интуиция: «бесконечный по длительности» ещё не значит «сигнал мощности» — важно, затухает ли он.", "usage": {"code": false, "without": "Затухающий отклик датчика удара считают сигналом мощности, усредняют по длинному окну и получают величину, зависящую от длины окна.", "with": "Отклик затухает — его характеризуют энергией, и результат не зависит от того, сколько тишины попало в запись.", "benefit": "Число не зависит от случайной длины записи"}}, {"q": "Что показывает действующее значение (RMS, root mean square) \\(S_{\\text{rms}}=\\sqrt{P}\\) периодического сигнала?", "options": ["Среднее арифметическое модуля сигнала за период — среднее выпрямленное", "Постоянное напряжение, которое на том же резисторе выделяет ту же мощность", "Половину размаха сигнала, то есть расстояния от минимума до максимума", "Пиковое значение, делённое на \\(\\sqrt2\\), — для сигнала любой формы"], "correct": 1, "explain": "RMS — корень из среднего квадрата: \\(S_{\\text{rms}}=\\sqrt{\\frac1T\\int_0^T s^2dt}\\). Постоянное напряжение \\(U\\) выделяет мощность \\(U^2\\), поэтому \\(U=\\sqrt P\\) греет резистор так же, как наш сигнал. Среднее выпрямленное \\(\\frac1T\\int|s|dt\\) — другая величина: у синусоиды \\(2S_m/\\pi\\approx0{,}637S_m\\), а RMS \\(\\approx0{,}707S_m\\). Половина размаха — амплитуда, а не RMS. Деление пика на \\(\\sqrt2\\) верно только для гармоники: у пилы \\(S_m/\\sqrt3\\), у меандра \\(S_m\\). Интуиция: RMS — «тепловой эквивалент» сигнала.", "usage": {"code": false, "without": "Ток ШИМ-привода оценивают как пик/√2 «по привычке» и выбирают провод, который перегревается.", "with": "Считают RMS по форме тока — для импульсного тока он другой — и подбирают сечение провода и предохранитель по нему.", "benefit": "Нагрев проводов и обмоток рассчитан по форме сигнала"}}, {"q": "Почему у сигнала с конечной энергией средняя мощность равна нулю?", "options": ["Конечную энергию делят на интервал усреднения, растущий до бесконечности", "Такой сигнал обязательно принимает и положительные, и отрицательные значения", "Его среднее значение равно нулю, а мощность — это квадрат среднего значения", "Энергия и мощность — одно и то же, они различаются лишь единицами измерения"], "correct": 0, "explain": "Средняя мощность — предел \\(\\frac{1}{T_{\\text{н}}}\\int_{-T_{\\text{н}}/2}^{T_{\\text{н}}/2}s^2dt\\) при \\(T_{\\text{н}}\\to\\infty\\). Числитель стремится к конечному \\(E\\), знаменатель растёт без предела — дробь стремится к нулю. Знак сигнала не важен: прямоугольный импульс всюду неотрицателен, а мощность всё равно ноль. Мощность — не квадрат среднего, а среднее квадрата. Энергия и мощность различаются по сути: энергия — сколько всего, мощность — сколько в единицу времени. Интуиция: одна вспышка на бесконечном интервале — в среднем темнота.", "usage": {"code": false, "without": "Одиночный импульс помехи сравнивают с периодическим сигналом по средней мощности за час — помеху считают безвредной.", "with": "Импульс сравнивают по энергии с энергией сигнала в том же коротком окне и видят, что на время импульса он сильнее сигнала.", "benefit": "Короткие помехи не прячутся за длинным усреднением"}}, {"q": "Сигнал \\(s(t)=t\\) задан на всей оси времени и растёт без конца. К какому классу он относится?", "options": ["К сигналам энергии: он непериодический, поэтому энергия конечна", "Ни к сигналам энергии, ни к сигналам мощности: обе величины бесконечны", "К сигналам мощности: мощность конечна у любого непрерывного сигнала", "К периодическим сигналам с бесконечно большим периодом \\(T\\)"], "correct": 1, "explain": "\\(\\int_{-T_{\\text{н}}/2}^{T_{\\text{н}}/2}t^2dt=T_{\\text{н}}^3/12\\) — энергия бесконечна; после деления на \\(T_{\\text{н}}\\) остаётся \\(T_{\\text{н}}^2/12\\) — и мощность бесконечна. Значит, сигнал не попадает ни в один класс. «Непериодический — значит энергия конечна» неверно: важно, затухает ли сигнал. Непрерывность тоже не гарантирует конечной мощности. «Периода бесконечной длины» не бывает: \\(s(t)=t\\) не повторяется. Интуиция: классы energy/power — не вся вселенная сигналов; неограниченно растущие в них не входят.", "usage": {"code": false, "without": "Дрейф гироскопа, растущий линейно, усредняют «как мощность» по всё более длинным записям — оценка растёт и никогда не сходится.", "with": "Растущий дрейф сначала вычитают — оценивают наклон, — а мощность считают уже по остатку, который не растёт.", "benefit": "Оценки шума датчика сходятся, а не растут с длиной записи"}}, {"q": "Амплитуду импульса увеличили в 3 раза, форму и длительность не меняли. Как изменилась его энергия?", "options": ["Выросла в 3 раза", "Выросла в 6 раз", "Выросла в 9 раз", "Не изменилась"], "correct": 2, "explain": "\\(E=\\int s^2dt\\), поэтому для \\(k\\,s(t)\\) получаем \\(\\int k^2s^2dt=k^2E\\). При \\(k=3\\) энергия растёт в \\(9\\) раз. «В 3 раза» — забыли, что в формуле стоит квадрат. «В 6 раз» — умножили на \\(2k\\), перепутав квадрат с удвоением. «Не изменилась» — решили, что форма определяет энергию, а амплитуда нет. Интуиция: напряжение втрое больше — ток через резистор втрое больше — тепла в девять раз больше.", "usage": {"code": false, "without": "Усиление датчика подняли втрое и ждут, что энергия сигнала в канале вырастет втрое — порог детектора выставлен неверно.", "with": "Помнят про квадрат: энергия выросла в 9 раз, и порог энергетического детектора поднимают в 9 раз, а не в 3.", "benefit": "Пороги детекторов пересчитываются правильно"}}, {"q": "Импульс \\(s(t)\\) сжали во времени вдвое: получили \\(s(2t)\\) — та же форма и амплитуда, длительность вдвое меньше. Как изменилась энергия?", "options": ["Уменьшилась в 4 раза", "Не изменилась", "Уменьшилась в 2 раза", "Увеличилась в 2 раза"], "correct": 2, "explain": "Замена \\(u=2t\\): \\(\\int s^2(2t)\\,dt=\\frac12\\int s^2(u)\\,du=E/2\\). В общем случае \\(s(at)\\) имеет энергию \\(E/a\\). «В 4 раза» — возвели в квадрат коэффициент сжатия, хотя квадрат относится к амплитуде, а не ко времени. «Не изменилась» — амплитуда та же, но время действия вдвое короче. «Увеличилась» — перепутали сжатие с растяжением. Интуиция: та же высота, вдвое короче — вдвое меньше тепла.", "usage": {"code": false, "without": "Импульс зондирования лидара укоротили вдвое ради разрешения, а дальность упала — не учли, что энергия импульса тоже упала вдвое.", "with": "Заранее считают: короче вдвое — энергии вдвое меньше; для той же дальности поднимают амплитуду в \\(\\sqrt2\\) раз.", "benefit": "Компромисс разрешение — дальность виден до испытаний"}}, {"q": "Какие два преобразования НЕ меняют энергию импульса?", "options": ["Сдвиг во времени \\(s(t-\\Delta t)\\) и смена знака \\(-s(t)\\)", "Сдвиг во времени \\(s(t-\\Delta t)\\) и сжатие \\(s(2t)\\)", "Смена знака \\(-s(t)\\) и удвоение амплитуды \\(2s(t)\\)", "Растяжение \\(s(t/2)\\) и добавка постоянной \\(s(t)+1\\)"], "correct": 0, "explain": "Сдвиг (time shift) переносит импульс, не меняя значений: интеграл по всей оси тот же. Смена знака исчезает при возведении в квадрат: \\((-s)^2=s^2\\). Сжатие \\(s(2t)\\) уменьшает энергию вдвое, растяжение \\(s(t/2)\\) увеличивает вдвое. Удвоение амплитуды даёт \\(4E\\). Постоянная добавка к импульсу делает энергию бесконечной: единица на всей оси. Интуиция: энергия «не видит», когда импульс пришёл и каким знаком.", "usage": {"code": false, "without": "Энергию эха ультразвука ищут только в окне «ожидаемого» прихода и с ожидаемым знаком — эхо с другой задержкой и в противофазе теряется.", "with": "Помнят, что энергия не зависит от задержки и знака: детектор энергии ловит эхо при любой дальности и при отражении с переворотом фазы.", "benefit": "Энергетический детектор устойчив к задержке и инверсии"}}, {"q": "Почему среднюю мощность периодического сигнала можно считать по одному периоду, начиная с любого момента \\(t_0\\) до \\(t_0+T\\)?", "options": ["За пределами первого периода сигнал по определению считается равным нулю", "Интеграл квадрата сигнала по одному периоду всегда равен нулю", "Ради удобства: результат приближённый и слегка зависит от выбора \\(t_0\\)", "Каждый период несёт одну и ту же энергию, и любой отрезок длины \\(T\\) её содержит"], "correct": 3, "explain": "Из \\(s(t)=s(t+T)\\) следует, что квадрат сигнала тоже периодичен. Отрезок \\([t_0,t_0+T]\\) состоит из «хвоста» одного периода и «начала» следующего — вместе это ровно один полный период. Поэтому \\(\\frac1T\\int_{t_0}^{t_0+T}s^2dt\\) одинаков при любом \\(t_0\\) и совпадает с усреднением по \\(N\\) периодам. Периодический сигнал не обнуляется за первым периодом. Интеграл квадрата не бывает нулевым, если сигнал не нулевой. Результат точный, а не приближённый. Интуиция: в периодическом сигнале все периоды одинаковы — хватит одного.", "usage": {"code": false, "without": "Мощность пульсаций тока считают по записи, обрезанной на случайном месте, — результат «плавает» от запуска к запуску.", "with": "Окно берут ровно в целое число периодов ШИМ, начиная с любого момента, — оценка мощности стабильна.", "benefit": "Измерение повторяется от раза к разу"}}, {"q": "Чему равна средняя мощность гармонического сигнала \\(s(t)=S_m\\cos(\\omega_1 t+\\psi)\\)?", "options": ["\\(S_m^2/2\\) — только при начальной фазе \\(\\psi=0\\)", "\\(S_m^2/\\sqrt2\\) — при любых \\(\\omega_1\\) и \\(\\psi\\)", "\\(S_m^2\\omega_1/2\\pi\\) — растёт с частотой", "\\(S_m^2/2\\) — при любых \\(\\omega_1\\) и \\(\\psi\\)"], "correct": 3, "explain": "\\(\\cos^2x=\\frac{1+\\cos2x}{2}\\); среднее \\(\\cos2x\\) за период ноль, поэтому \\(P=\\frac{S_m^2}{2}\\). Начальная фаза (initial phase) \\(\\psi\\) только сдвигает график во времени — на мощность не влияет. \\(S_m^2/\\sqrt2\\) — смешали мощность с RMS \\(S_m/\\sqrt2\\). Частота тоже не влияет: среднее по периоду не зависит от того, как быстро сигнал колеблется. Интуиция: квадрат синусоиды колеблется между \\(0\\) и \\(S_m^2\\), его среднее — ровно посередине.", "usage": {"code": false, "without": "Мощность гармонической помехи сети пересчитывают для каждой фазы отдельно и путаются в результатах.", "with": "Знают: \\(P=S_m^2/2\\) при любой фазе и частоте — мощность помехи 50 Гц находят по одной амплитуде на осциллографе.", "benefit": "Мощность гармоники — по амплитуде, в одну строку"}}, {"q": "Периодический сигнал задан тригонометрическим рядом Фурье (trigonometric Fourier series) \\(s(t)=\\frac{a_0}{2}+\\sum_{n\\ge1}A_n\\cos(n\\omega_1t+\\psi_n)\\). Чему равна его средняя мощность?", "options": ["\\(\\left(\\frac{a_0}{2}\\right)^2+\\sum A_n^2\\)", "\\(\\frac{a_0}{2}+\\frac12\\sum A_n\\)", "\\(\\left(\\frac{a_0}{2}+\\sum A_n\\right)^2\\)", "\\(\\left(\\frac{a_0}{2}\\right)^2+\\frac12\\sum A_n^2\\)"], "correct": 3, "explain": "Это равенство Парсеваля для ряда (Parseval's theorem). Гармоники разных частот ортогональны: среднее их попарных произведений ноль, поэтому мощности складываются. Постоянная составляющая \\(a_0/2\\) даёт мощность \\((a_0/2)^2\\), каждая гармоника с амплитудой \\(A_n\\) — \\(A_n^2/2\\). Без \\(\\frac12\\) — забыли, что мощность гармоники равна половине квадрата амплитуды. Без квадратов — сложили амплитуды, а не мощности. Квадрат суммы — так было бы, если бы все составляющие были одинаковой формы и синфазны. Интуиция: мощность сигнала — сумма мощностей его спектральных линий.", "usage": {"code": false, "without": "Мощность пульсаций выходного напряжения преобразователя считают по осциллограмме вручную и спорят о результате.", "with": "Берут амплитудный спектр (amplitude spectrum) с анализатора и складывают \\(A_n^2/2\\) по линиям — видят, какие гармоники несут основную мощность.", "benefit": "Видно, какую гармонику фильтровать в первую очередь"}}, {"q": "Периодический сигнал со средней мощностью \\(P\\) и периодом \\(T\\) наблюдали ровно \\(N\\) периодов. Какая энергия выделилась за это время?", "options": ["\\(E_N=NP/T\\)", "\\(E_N=PT\\)", "\\(E_N=NPT\\)", "\\(E_N=NP\\)"], "correct": 2, "explain": "Мощность — энергия в единицу времени, а время наблюдения \\(NT\\). Поэтому \\(E_N=P\\cdot NT\\); при \\(N\\to\\infty\\) энергия растёт без предела — потому периодический сигнал и называют сигналом мощности. \\(NP/T\\) — разделили на время вместо умножения, единица выходит В²/с. \\(PT\\) — энергия одного периода, \\(N\\) потерян. \\(NP\\) — вообще без времени, единица В², а не В²·с. Интуиция: мощность × время = энергия, как в счёте за электричество.", "usage": {"code": false, "without": "Заряд, нужный аккумулятору робота на смену, оценивают по мощности двигателя без учёта числа рабочих циклов.", "with": "Считают энергию как мощность цикла × длительность цикла × число циклов за смену и выбирают ёмкость с запасом.", "benefit": "Ёмкость батареи выбирается расчётом"}}, {"q": "Равенство Парсеваля (Parseval's theorem) для одиночного сигнала со спектральной плотностью (spectral density) \\(\\dot S(\\omega)=\\int_{-\\infty}^{\\infty}s(t)e^{-j\\omega t}dt\\) записывается так:", "options": ["\\(E=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\infty}|\\dot S(\\omega)|^2d\\omega\\)", "\\(E=\\int_{-\\infty}^{\\infty}|\\dot S(\\omega)|^2d\\omega\\)", "\\(E=2\\pi\\int_{-\\infty}^{\\infty}|\\dot S(\\omega)|^2d\\omega\\)", "\\(E=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\infty}\\dot S(\\omega)\\,d\\omega\\)"], "correct": 0, "explain": "Энергию можно считать во времени, \\(\\int s^2dt\\), или по спектру, \\(\\frac{1}{2\\pi}\\int|\\dot S(\\omega)|^2d\\omega\\). Множитель \\(\\frac1{2\\pi}\\) тот же, что в обратном преобразовании \\(s(t)=\\frac1{2\\pi}\\int\\dot S(\\omega)e^{j\\omega t}d\\omega\\), и появляется из-за интегрирования по \\(\\omega\\), а не по \\(f\\): \\(d\\omega=2\\pi\\,df\\). Без \\(\\frac1{2\\pi}\\) или с \\(2\\pi\\) — ошибка в этом множителе. Интеграл самого \\(\\dot S\\) без модуля в квадрате даёт \\(s(0)\\) — значение сигнала в нуле, а не энергию. Интуиция: энергия «одна и та же», как её ни раскладывай — по времени или по частотам.", "usage": {"code": false, "without": "Энергию шума в полосе датчика считают по интегралу спектра без \\(1/2\\pi\\) и завышают её в шесть с лишним раз.", "with": "Применяют Парсеваль с правильным множителем и получают ту же энергию, что и по временной записи, — расчёт сходится.", "benefit": "Расчёты во времени и по спектру проверяют друг друга"}}, {"q": "Что показывает функция \\(W(\\omega)=|\\dot S(\\omega)|^2\\) — энергетический спектр (energy spectral density) сигнала?", "options": ["Как энергия сигнала распределена по частотам; фазовый спектр на неё не влияет", "Как энергия сигнала распределена во времени: видно, когда начался импульс", "Фазовый спектр (phase spectrum) сигнала, возведённый в квадрат для удобства", "Мгновенную мощность сигнала на каждой частоте в каждый момент времени"], "correct": 0, "explain": "По Парсевалю \\(E=\\frac1{2\\pi}\\int W(\\omega)\\,d\\omega\\): кусок \\(W(\\omega)\\,d\\omega/2\\pi\\) — энергия в узкой полосе около \\(\\omega\\). Модуль в квадрате отбрасывает фазу, поэтому сдвинутый во времени импульс имеет тот же \\(W(\\omega)\\): спектр \\(\\dot S(\\omega)e^{-j\\omega\\Delta t}\\) по модулю не меняется. Отсюда и неверность первого варианта: момент начала по \\(W\\) не узнать. Фазовый спектр — это \\(\\arg\\dot S(\\omega)\\), а не квадрат модуля. «Мгновенной мощности на частоте» \\(W\\) не даёт — это частотно-временной анализ, другая тема. Интуиция: \\(W(\\omega)\\) — «сколько энергии лежит на каждой частоте».", "usage": {"code": false, "without": "Полосу фильтра для датчика выбирают «на глаз» и срезают часть полезной энергии сигнала.", "with": "Смотрят энергетический спектр полезного сигнала и ставят срез там, где под кривой осталась малая доля энергии.", "benefit": "Полоса фильтра выбирается по доле энергии"}}, {"q": "Чему равно действующее значение (RMS) гармонического сигнала с амплитудой \\(S_m\\)?", "options": ["\\(S_m/2=0{,}5\\,S_m\\)", "\\(S_m/\\sqrt2\\approx0{,}707\\,S_m\\)", "\\(2S_m/\\pi\\approx0{,}637\\,S_m\\)", "\\(S_m/\\sqrt3\\approx0{,}577\\,S_m\\)"], "correct": 1, "explain": "Мощность гармоники \\(P=S_m^2/2\\), а \\(S_{\\text{rms}}=\\sqrt P=S_m/\\sqrt2\\). Поэтому в сети «230 В» — это RMS, а пик \\(230\\sqrt2\\approx325\\) В. \\(S_m/2\\) — поделили амплитуду на 2, перепутав RMS с мощностью «пополам» \\(S_m^2/2\\). \\(2S_m/\\pi\\) — среднее выпрямленное \\(\\frac1T\\int|s|\\,dt\\), не RMS. \\(S_m/\\sqrt3\\) — RMS пилообразного сигнала, а не гармонического. Интуиция: синусоида «греет» как постоянное напряжение примерно 0,7 от своего пика.", "usage": {"code": false, "without": "Драйвер мотора выбирают по пиковому току синусоидальной фазы, считая его действующим, — драйвер оказывается избыточно дорогим.", "with": "Пересчитывают пик в RMS делением на \\(\\sqrt2\\) и выбирают драйвер по действующему току.", "benefit": "Компоненты подбираются по правильному току"}}, {"q": "Чему равна энергия прямоугольного импульса (rectangular pulse) высотой \\(S_m\\) и длительностью \\(\\tau\\)?", "options": ["\\(S_m\\tau\\)", "\\(S_m^2\\tau\\)", "\\(S_m^2\\tau/2\\)", "\\(S_m^2/\\tau\\)"], "correct": 1, "explain": "Внутри импульса \\(s(t)=S_m\\), квадрат постоянен: \\(E=\\int_0^{\\tau}S_m^2dt=S_m^2\\tau\\). В ДЗ от 11.10 длительность обозначена \\(\\Delta t\\): \\(E=S_m^2\\Delta t\\). Это наибольшая энергия среди всех импульсов той же высоты и длительности — эталон для остальных. \\(S_m\\tau\\) — площадь импульса, а не энергия: квадрат забыт. \\(S_m^2\\tau/2\\) — множитель от гармоники, тут его нет. \\(S_m^2/\\tau\\) — разделили на время вместо умножения. Интуиция: постоянная «нагрузка» \\(S_m^2\\) в течение \\(\\tau\\).", "usage": {"code": false, "without": "Энергию строба ИК-подсветки камеры робота считают как «ток × время» и неверно оценивают нагрев светодиодов.", "with": "Считают \\(I^2R\\tau\\) для прямоугольного импульса тока и получают реальное тепло за вспышку.", "benefit": "Тепловой режим подсветки рассчитан заранее"}}, {"q": "Чему равна энергия симметричного треугольного импульса (triangular pulse) высотой \\(S_m\\) и полной длительностью \\(\\tau\\)?", "options": ["\\(\\frac{S_m^2\\tau}{6}\\)", "\\(\\frac{S_m^2\\tau}{3}\\)", "\\(\\frac{S_m^2\\tau}{2}\\)", "\\(\\frac{S_m^2\\tau}{4}\\)"], "correct": 1, "explain": "На нарастающей половине \\(s(t)=\\frac{2S_m}{\\tau}t\\), \\(0\\le t\\le\\tau/2\\). Её энергия \\(\\int_0^{\\tau/2}\\frac{4S_m^2}{\\tau^2}t^2dt=\\frac{4S_m^2}{\\tau^2}\\cdot\\frac{\\tau^3}{24}=\\frac{S_m^2\\tau}{6}\\). Спадающая половина симметрична и даёт столько же: \\(E=2\\cdot\\frac{S_m^2\\tau}{6}=\\frac{S_m^2\\tau}{3}\\) — как в ДЗ от 11.10. \\(S_m^2\\tau/6\\) — посчитали одну половину и забыли удвоить. \\(S_m^2\\tau/2\\) — перенесли «площадь треугольника пополам» на квадрат сигнала. \\(S_m^2\\tau/4\\) — возвели в квадрат среднее значение \\(S_m/2\\). Интуиция: средний квадрат линейного участка — треть квадрата пика.", "usage": {"code": false, "without": "Энергию треугольного импульса тока при мягком пуске двигателя оценивают как половину прямоугольного и завышают нагрев в полтора раза.", "with": "Берут \\(S_m^2\\tau/3\\) и получают реальную энергию, поэтому выбирают более лёгкий радиатор без потери надёжности.", "benefit": "Оценка нагрева не завышена и не занижена"}}, {"q": "Импульс линейно нарастает от 0 до \\(S_m\\) за всё время \\(\\tau\\) и обрывается (ramp pulse). Как его энергия соотносится с энергией симметричного треугольного импульса той же высоты и длительности?", "options": ["Вдвое больше: \\(2S_m^2\\tau/3\\)", "Вдвое меньше: \\(S_m^2\\tau/6\\)", "Равна ей: у обоих \\(S_m^2\\tau/3\\)", "Больше на четверть: \\(5S_m^2\\tau/12\\)"], "correct": 2, "explain": "Для нарастающего импульса \\(s(t)=\\frac{S_m}{\\tau}t\\): \\(E=\\frac{S_m^2}{\\tau^2}\\int_0^{\\tau}t^2dt=\\frac{S_m^2\\tau}{3}\\). У треугольника тоже \\(S_m^2\\tau/3\\) — ДЗ от 11.10 отмечает это прямо. Причина: оба импульса состоят из линейных участков от 0 до \\(S_m\\) общей длительностью \\(\\tau\\), а средний квадрат линейного участка — \\(S_m^2/3\\) независимо от его длины. «Вдвое больше» и «вдвое меньше» — ощущение, что одна наклонная сторона вместо двух меняет энергию вдвое. Интуиция: важно, сколько времени сигнал проводит на каждом уровне, а не в каком порядке.", "usage": {"code": false, "without": "Две формы разгонного импульса для шагового двигателя сравнивают на стенде, хотя по нагреву они одинаковы.", "with": "Сразу видят, что пилообразный и треугольный разгон одинаково греют обмотку, и выбирают форму по другим критериям — шуму и рывку.", "benefit": "Эксперимент не тратится на заранее известный ответ"}}, {"q": "Чему равна энергия импульса в форме полуволны синуса (half-sine pulse) \\(s(t)=S_m\\sin\\frac{\\pi t}{\\tau}\\), \\(0\\le t\\le\\tau\\)?", "options": ["\\(\\frac{S_m^2\\tau}{2}\\)", "\\(\\frac{S_m^2\\tau}{\\pi}\\)", "\\(\\frac{2S_m^2\\tau}{\\pi}\\)", "\\(\\frac{S_m^2\\tau}{3}\\)"], "correct": 0, "explain": "\\(\\sin^2x=\\frac{1-\\cos2x}{2}\\): \\(E=\\frac{S_m^2}{2}\\int_0^{\\tau}\\left(1-\\cos\\frac{2\\pi t}{\\tau}\\right)dt=\\frac{S_m^2\\tau}{2}\\) — косинус за целый период \\(2\\pi t/\\tau\\) от 0 до \\(2\\pi\\) интегрируется в ноль. Так и в ДЗ от 11.10. \\(2S_m^2\\tau/\\pi\\) — смешали с площадью полуволны \\(2S_m\\tau/\\pi\\), домножив на \\(S_m\\). \\(S_m^2\\tau/\\pi\\) — потеряли множитель при интегрировании. \\(S_m^2\\tau/3\\) — результат для линейных участков, у синуса он другой. Интуиция: средний квадрат синусоиды — половина квадрата пика, даже на полупериоде.", "usage": {"code": false, "without": "Энергию импульса тока в катушке резонансного драйвера считают «как треугольник» и ошибаются в полтора раза.", "with": "Узнают полуволну синуса и берут \\(S_m^2\\tau/2\\) — расчёт потерь драйвера совпадает с измерением.", "benefit": "Потери драйвера предсказаны верно"}}, {"q": "Чему равна энергия экспоненциального импульса (exponential pulse) \\(s(t)=S_me^{-\\alpha t}\\) при \\(t\\ge0\\), \\(\\alpha>0\\), и нуля при \\(t<0\\)?", "options": ["\\(\\frac{S_m^2}{2\\alpha}\\)", "\\(\\frac{S_m^2}{\\alpha}\\)", "\\(\\frac{S_m}{2\\alpha}\\)", "\\(\\frac{S_m^2}{\\alpha^2}\\)"], "correct": 0, "explain": "\\(s^2(t)=S_m^2e^{-2\\alpha t}\\) — при возведении в квадрат показатель удваивается. \\(E=S_m^2\\int_0^{\\infty}e^{-2\\alpha t}dt=\\frac{S_m^2}{2\\alpha}\\). \\(S_m^2/\\alpha\\) — квадрат амплитуды взяли, а показатель удвоить забыли. \\(S_m/(2\\alpha)\\) — забыли возвести в квадрат амплитуду. \\(S_m^2/\\alpha^2\\) — проинтегрировали неверно: интеграл экспоненты \\(e^{-at}\\) равен \\(1/a\\), а не \\(1/a^2\\). Интуиция: импульс бесконечный, но затухает — энергия конечна и тем меньше, чем быстрее затухание.", "usage": {"code": false, "without": "Энергию разряда конденсатора через двигатель считают по постоянной времени напряжения, без удвоения показателя, и вдвое завышают.", "with": "Помнят, что квадрат экспоненты затухает вдвое быстрее, и получают верную энергию \\(S_m^2/(2\\alpha)\\) на 1 Ом.", "benefit": "Энергия разряда и нагрев посчитаны верно"}}, {"q": "Трапецеидальный импульс высотой \\(S_m\\): линейный фронт длительностью \\(\\tau_1\\), плоская вершина \\(\\tau_0\\), линейный спад \\(\\tau_1\\). Чему равна его энергия?", "options": ["\\(S_m^2(\\tau_0+\\tau_1)\\)", "\\(S_m^2\\left(\\tau_0+\\frac{\\tau_1}{3}\\right)\\)", "\\(S_m^2\\left(\\tau_0+\\frac{2\\tau_1}{3}\\right)\\)", "\\(S_m^2(\\tau_0+2\\tau_1)\\)"], "correct": 2, "explain": "Делим на участки. Вершина — прямоугольник: \\(S_m^2\\tau_0\\). Фронт — линейный участок от 0 до \\(S_m\\): \\(S_m^2\\tau_1/3\\); спад — столько же. Итого \\(S_m^2\\left(\\tau_0+\\frac{2\\tau_1}{3}\\right)\\). \\(S_m^2(\\tau_0+\\tau_1)\\) — посчитали фронты как «половину прямоугольника» каждый: \\(\\frac12+\\frac12=1\\), это рассуждение о площади, а не об энергии. \\(\\tau_0+\\tau_1/3\\) — учли только один фронт. \\(\\tau_0+2\\tau_1\\) — посчитали всю трапецию прямоугольником высотой \\(S_m\\). Интуиция: каждый наклонный участок весит треть своего прямоугольника.", "usage": {"code": false, "without": "Энергию трапецеидального импульса тока в обмотке шагового двигателя считают как прямоугольник полной длины и завышают нагрев.", "with": "Раскладывают импульс на вершину и два фронта, каждому фронту дают треть, и получают верную энергию.", "benefit": "Любой кусочно-линейный импульс считается по частям"}}, {"q": "Периодический пилообразный сигнал (sawtooth) за период \\(T\\) линейно растёт от \\(-S_m\\) до \\(+S_m\\) и скачком возвращается. Чему равна его средняя мощность?", "options": ["\\(S_m^2/3\\)", "\\(S_m^2/2\\)", "\\(S_m^2/4\\)", "\\(S_m^2T/3\\)"], "correct": 0, "explain": "На периоде \\(s(t)=\\frac{2S_m}{T}t-S_m\\) — как в ДЗ от 11.10, коэффициенты из \\(s(0)=-S_m\\), \\(s(T)=S_m\\). \\(P=\\frac1T\\int_0^T\\left(\\frac{2S_m}{T}t-S_m\\right)^2dt=S_m^2\\left(\\frac43-2+1\\right)=\\frac{S_m^2}{3}\\). От \\(T\\) результат не зависит. \\(S_m^2/2\\) — формула гармонического сигнала, у пилы другая форма. \\(S_m^2/4\\) — квадрат «средней высоты» \\(S_m/2\\). \\(S_m^2T/3\\) — забыли разделить на \\(T\\), это энергия периода. Интуиция: линейный участок проводит равное время на каждом уровне, средний квадрат — треть пика в квадрате.", "usage": {"code": false, "without": "Мощность пилообразной развёртки сканирующего зеркала лидара берут как у синусоиды и недооценивают нагрузку на драйвер.", "with": "Берут \\(S_m^2/3\\) для пилы — это на треть меньше, чем \\(S_m^2/2\\), — и подбирают драйвер по верной мощности.", "benefit": "Драйвер развёртки подобран по форме сигнала"}}, {"q": "Меандр (square wave): половину периода \\(+S_m\\), половину \\(-S_m\\). Чему равна его средняя мощность?", "options": ["\\(S_m^2/2\\)", "\\(0\\)", "\\(2S_m^2\\)", "\\(S_m^2\\)"], "correct": 3, "explain": "\\(s^2(t)=S_m^2\\) в любой момент — знак исчезает при возведении в квадрат, поэтому \\(P=S_m^2\\), а \\(S_{\\text{rms}}=S_m\\). \\(S_m^2/2\\) — формула гармонического сигнала перенесена на меандр. \\(0\\) — усреднили сам сигнал, а не квадрат: среднее меандра действительно ноль, но мощность нет. \\(2S_m^2\\) — сложили мощности двух половин, забыв разделить на период. Интуиция: меандр всё время «на полной», только меняет полярность.", "usage": {"code": false, "without": "Мощность H-моста с разнополярным меандром считают как ноль «по среднему» и не ставят радиатор.", "with": "Помнят: квадрат меандра постоянен, \\(P=S_m^2\\), — радиатор подбирают под полную мощность.", "benefit": "Ключи моста не перегреваются"}}, {"q": "Последовательность прямоугольных импульсов (pulse train): высота \\(S_m\\), длительность \\(\\tau\\), период \\(T\\), в паузах ноль. Чему равна средняя мощность?", "options": ["\\(S_m^2T/\\tau\\)", "\\((S_m\\tau/T)^2\\)", "\\(S_m^2\\tau/T\\)", "\\(S_m^2\\tau\\)"], "correct": 2, "explain": "За период энергия выделяется только во время импульса: \\(S_m^2\\tau\\); делим на \\(T\\) — \\(P=S_m^2\\frac{\\tau}{T}\\). Отношение \\(D=\\tau/T\\) — коэффициент заполнения (duty cycle); обратная величина \\(q=T/\\tau\\) — скважность, тогда \\(P=S_m^2/q\\). \\(S_m^2T/\\tau\\) — перевернули отношение: мощность не может превышать \\(S_m^2\\). \\((S_m\\tau/T)^2\\) — квадрат среднего значения, это мощность только постоянной составляющей. \\(S_m^2\\tau\\) — энергия одного импульса, забыли разделить на \\(T\\). Интуиция: мощность импульсов — пиковая, умноженная на долю времени, когда они «включены».", "usage": {"code": false, "without": "Мощность ШИМ-сигнала светодиода считают по квадрату среднего напряжения и недооценивают нагрев резистора.", "with": "Берут \\(S_m^2D\\) — пиковую мощность, умноженную на заполнение, — и подбирают резистор с нужной мощностью рассеяния.", "benefit": "Мощность ШИМ считается в одну строку"}}, {"q": "Ступенчатый импульс: уровень \\(S_m\\) в течение \\(\\tau\\), сразу после — уровень \\(S_m/2\\) ещё \\(\\tau\\), затем ноль. Чему равна энергия?", "options": ["\\(\\frac32S_m^2\\tau\\)", "\\(\\frac54S_m^2\\tau\\)", "\\(\\frac94S_m^2\\tau\\)", "\\(2S_m^2\\tau\\)"], "correct": 1, "explain": "Энергия складывается по непересекающимся участкам: \\(S_m^2\\tau+\\left(\\frac{S_m}{2}\\right)^2\\tau=S_m^2\\tau\\left(1+\\frac14\\right)=\\frac54S_m^2\\tau\\). \\(\\frac32\\) — решили, что уровень вдвое ниже даёт вдвое меньше энергии, а не вчетверо: \\(S_m^2\\tau+\\frac{S_m^2}{2}\\tau\\). \\(\\frac94\\) — возвели в квадрат сумму высот \\(\\left(S_m+\\frac{S_m}{2}\\right)^2\\tau\\), смешав два разных момента времени. \\(2S_m^2\\tau\\) — взяли высоту \\(S_m\\) на всей длительности \\(2\\tau\\). Интуиция: половина высоты — четверть мощности.", "usage": {"code": false, "without": "Энергию двухступенчатого импульса электромагнита — форсировка и удержание — считают по средней высоте и ошибаются в нагреве.", "with": "Каждой ступени дают её \\(U^2\\tau\\) и складывают: видно, что удержание половинным током греет вчетверо меньше форсировки.", "benefit": "Профиль тока подбирают под допустимый нагрев"}}, {"q": "Пила, которая за период растёт от \\(0\\) до \\(S_m\\) — однополярная, не от \\(-S_m\\) до \\(S_m\\). Чему равна её средняя мощность?", "options": ["\\(S_m^2/12\\)", "\\(S_m^2/6\\)", "\\(S_m^2/3\\)", "\\(S_m^2/4\\)"], "correct": 2, "explain": "\\(s(t)=\\frac{S_m}{T}t\\): \\(P=\\frac1T\\int_0^T\\frac{S_m^2}{T^2}t^2dt=\\frac{S_m^2}{3}\\) — столько же, сколько у двуполярной пилы с пиком \\(S_m\\). Подвох: кажется, что размах вдвое меньше и мощность вчетверо меньше, но важен пик, а не размах. Разложение: постоянная составляющая \\(S_m/2\\) несёт \\(S_m^2/4\\), переменная часть — пила с пиком \\(S_m/2\\) — несёт \\(\\frac{(S_m/2)^2}{3}=\\frac{S_m^2}{12}\\), сумма \\(\\frac{S_m^2}{3}\\). Вариант \\(S_m^2/12\\) — только переменная часть, \\(S_m^2/4\\) — только постоянная. \\(S_m^2/6\\) — разделили «вдвое» без расчёта. Интуиция: значения от 0 до \\(S_m\\) так же «тяжелы», как от \\(-S_m\\) до \\(S_m\\), — квадрат знак не различает.", "usage": {"code": false, "without": "Однополярную развёртку ЦАП считают «вдвое меньше по мощности» двуполярной и недогружают расчёт выходного каскада.", "with": "Знают, что мощность определяется пиком и формой, и отдельно видят, сколько уходит в постоянную составляющую.", "benefit": "Мощность разделена на постоянную и переменную части"}}, {"q": "У пилообразного сигнала из ДЗ — от \\(-S_m\\) до \\(+S_m\\) за период — период увеличили с \\(T\\) до \\(2T\\), размах прежний. Как изменилась средняя мощность?", "options": ["Удвоилась: интеграл по вдвое более длинному периоду вдвое больше", "Не изменилась: \\(P=S_m^2/3\\) от \\(T\\) не зависит", "Уменьшилась вдвое: в формуле стоит множитель \\(1/T\\)", "Выросла вчетверо: \\(T\\) входит в \\(s(t)\\) в квадрате"], "correct": 1, "explain": "Интеграл квадрата за период действительно удваивается — \\(\\int_0^{2T}s^2dt\\) вдвое больше, — но и делим мы на \\(2T\\). Отношение прежнее: \\(P=S_m^2/3\\). ДЗ от 11.10 проверяет это прямо: растяжение по времени не меняет набора значений, которые сигнал принимает. Первый дистрактор видит только числитель, второй — только знаменатель. Третий подставил \\(T\\) в \\(s(t)\\) и забыл, что он сокращается после интегрирования. Интуиция: мощность — среднее, а среднее не зависит от того, как долго длится период.", "usage": {"code": false, "without": "При смене частоты пилообразной развёртки ждут изменения мощности и перенастраивают защиту драйвера без нужды.", "with": "Знают, что мощность пилы от периода не зависит, — меняют частоту развёртки без пересчёта тепла.", "benefit": "Лишние перенастройки не нужны"}}, {"q": "Студент считает мощность \\(s(t)=S_m\\sin\\omega_1t\\) так: \\(\\frac1T\\int_0^T s(t)\\,dt=0\\), значит \\(P=0\\). Где ошибка?", "options": ["Усреднять надо квадрат: \\(\\frac1T\\int_0^T s^2(t)\\,dt=S_m^2/2\\)", "Ошибки нет: у синусоиды и среднее, и мощность равны нулю", "Нужен модуль: \\(\\frac1T\\int_0^T|s(t)|\\,dt=2S_m/\\pi\\) — это и есть мощность", "Интегрировать надо по полупериоду, тогда получится \\(S_m^2\\)"], "correct": 0, "explain": "Студент посчитал среднее значение (постоянную составляющую), а не мощность. Мощность — среднее квадрата: \\(P=\\frac1T\\int_0^T S_m^2\\sin^2\\omega_1t\\,dt=\\frac{S_m^2}{2}\\). «Ошибки нет» — противоречит физике: синусоида на резисторе греет его. Модуль даёт среднее выпрямленное \\(2S_m/\\pi\\), единица В, а не В², — это не мощность. Полупериод ничего не меняет: среднее \\(\\sin^2\\) на полупериоде тоже \\(\\frac12\\), получится \\(S_m^2/2\\), а не \\(S_m^2\\). Интуиция: сначала квадрат, потом среднее — иначе плюсы и минусы съедают друг друга.", "usage": {"code": false, "without": "Мощность переменной вибрации считают по среднему ускорению — около нуля — и решают, что крепления не нагружены.", "with": "Считают средний квадрат и видят настоящую мощность вибрации, которая разрушает крепления.", "benefit": "Колебания вокруг нуля оцениваются честно"}}, {"q": "Сигнал \\(s(t)=3\\cos\\omega_1t+4\\cos\\omega_1t\\) В — одна частота, одна фаза. Чему равна его средняя мощность?", "options": ["12,5 В²", "24,5 В²", "49 В²", "3,5 В²"], "correct": 1, "explain": "Это одна гармоника: \\(s(t)=7\\cos\\omega_1t\\), \\(P=\\frac{7^2}{2}=24{,}5\\) В². Мощности складываются только для ортогональных составляющих — разных частот (или одной частоты со сдвигом на \\(90^\\circ\\): \\(3\\cos\\omega_1t+4\\sin\\omega_1t\\) имеет амплитуду 5 и \\(P=12{,}5\\)). \\(12{,}5\\) — сложили мощности \\(\\frac92+\\frac{16}{2}\\) синфазных составляющих. \\(49\\) — забыли делить на 2. \\(3{,}5\\) — сложили амплитуды без квадрата. Интуиция: синфазные волны складываются амплитудами, а мощность — квадрат амплитуды.", "usage": {"code": false, "without": "Две синфазные наводки 50 Гц от разных кабелей складывают по мощности и вдвое недооценивают помеху в канале датчика.", "with": "Проверяют фазы: синфазные наводки складывают амплитудами — помеха оказывается почти вдвое сильнее, и экранирование усиливают.", "benefit": "Помеха оценена с учётом фаз"}}, {"q": "В ДЗ от 20.09 спектральная плотность треугольного импульса высотой \\(S_m\\), занимающего отрезок от \\(-\\tau/2\\) до \\(\\tau/2\\), записана как \\(S_m\\tau\\,\\mathrm{sinc}^2(\\omega\\tau/4)\\), где \\(\\mathrm{sinc}\\,x=\\sin x/x\\). Проверка: \\(\\dot S(0)=\\int s(t)\\,dt\\). Каким должно быть \\(\\dot S(0)\\) и что отсюда следует?", "options": ["\\(S_m\\tau\\): запись в ДЗ верна без поправок", "\\(S_m^2\\tau/3\\): это энергия, и запись верна", "\\(0\\): на нулевой частоте спектр всегда ноль", "\\(S_m\\tau/2\\): в записи ДЗ потерян множитель 1/2"], "correct": 3, "explain": "При \\(\\omega=0\\) множитель \\(e^{-j\\omega t}=1\\), поэтому \\(\\dot S(0)=\\int s\\,dt\\) — площадь импульса. Площадь треугольника высотой \\(S_m\\) и основанием \\(\\tau\\) равна \\(S_m\\tau/2\\). Значит, верно \\(\\dot S(\\omega)=\\frac{S_m\\tau}{2}\\mathrm{sinc}^2\\frac{\\omega\\tau}{4}\\) — так у Баскакова для полной длительности \\(\\tau\\). В записи ДЗ потерян множитель \\(\\frac12\\); форма \\(\\mathrm{sinc}^2(\\omega\\tau/4)\\) и нули при \\(\\omega=4\\pi k/\\tau\\) верны. Площадь \\(S_m\\tau\\) была бы у прямоугольника. \\(S_m^2\\tau/3\\) — энергия, она связана со спектром через Парсеваль, а не через \\(\\dot S(0)\\). Ноль на нулевой частоте — только у сигналов с нулевой площадью. Интуиция: \\(\\dot S(0)\\) — «сколько сигнала всего» — проверка любой формулы спектра за секунду.", "usage": {"code": false, "without": "Формулу спектра импульса датчика из чужих заметок берут без проверки — амплитуды на спектре вдвое больше реальных.", "with": "Проверяют \\(\\dot S(0)\\) по площади импульса и ловят потерянный множитель до того, как он попал в расчёт фильтра.", "benefit": "Любая формула спектра проверяется за секунду"}}, {"q": "Два одинаковых прямоугольных импульса высотой \\(S_m\\) и длительностью \\(\\tau\\), энергия каждого \\(E_1=S_m^2\\tau\\). Какова энергия их суммы, если они а) не перекрываются во времени, б) полностью совпадают?", "options": ["а) \\(2E_1\\), б) \\(2E_1\\)", "а) \\(E_1\\), б) \\(2E_1\\)", "а) \\(2E_1\\), б) \\(4E_1\\)", "а) \\(4E_1\\), б) \\(4E_1\\)"], "correct": 2, "explain": "\\(E_{1+2}=\\int(s_1+s_2)^2dt=E_1+E_2+2\\int s_1s_2\\,dt\\). Без перекрытия произведение \\(s_1s_2\\) всюду ноль — энергии складываются: \\(2E_1\\). При полном совпадении сумма — один импульс высотой \\(2S_m\\): \\((2S_m)^2\\tau=4E_1\\); перекрёстный член \\(2E_1\\) добавился к \\(E_1+E_2\\). «Всегда \\(2E_1\\)» — забыли перекрёстный член. «Всегда \\(4E_1\\)» — забыли, что без перекрытия высота не удваивается. Интуиция: энергия аддитивна только для сигналов, которые «не мешают» друг другу.", "usage": {"code": false, "without": "Энергию двух эхо ультразвука, пришедших одновременно, складывают как энергии и недооценивают пик на входе АЦП.", "with": "Учитывают перекрытие: совпавшие эхо дают вчетверо больше энергии одного — заранее проверяют запас АЦП.", "benefit": "Перегрузка канала предсказывается"}}, {"q": "Длительность прямоугольного импульса \\(\\tau\\) уменьшили вдвое при той же амплитуде; его спектральная плотность \\(\\dot S(\\omega)=S_m\\tau\\,\\mathrm{sinc}(\\omega\\tau/2)\\). Что произошло?", "options": ["Первый ноль спектра ушёл вдвое ниже по частоте, энергия уменьшилась вдвое", "Первый ноль спектра остался на месте, а энергия уменьшилась вчетверо", "Первый ноль спектра ушёл вдвое выше по частоте, энергия не изменилась", "Первый ноль спектра ушёл вдвое выше по частоте, энергия уменьшилась вдвое"], "correct": 3, "explain": "Первый ноль — где \\(\\omega\\tau/2=\\pi\\), то есть \\(\\omega=2\\pi/\\tau\\): при \\(\\tau/2\\) он переезжает на \\(4\\pi/\\tau\\), вдвое выше. Энергия \\(S_m^2\\tau\\) пропорциональна \\(\\tau\\) — уменьшилась вдвое. Это и есть «узкий импульс — широкий спектр» из ДЗ от 20.09. Ноль «ниже» — обратная связь длительности и ширины спектра. «На месте и вчетверо» — неверно и про ширину, и про энергию: квадрат стоит у амплитуды, а не у длительности. «Энергия не изменилась» — спектр стал шире, но и ниже: \\(\\dot S(0)=S_m\\tau\\) уменьшился вдвое. Интуиция: импульс короче — энергия размазана по более широкой полосе, и её меньше.", "usage": {"code": false, "without": "Укорачивают импульс зондирования ради точности по дальности, а полосу приёмника оставляют прежней — сигнал режется и теряется.", "with": "Сразу расширяют полосу приёмника вдвое и учитывают, что энергия импульса упала вдвое, поднимая амплитуду.", "benefit": "Приёмник согласован с новым импульсом"}}, {"q": "В сигнале \\(s(t)=2\\cos(2\\pi\\cdot50t)+0{,}5\\cos(2\\pi\\cdot100t)\\) В из ДЗ от 20.09 амплитуды гармоник относятся как 4:1. Во сколько раз мощность составляющей 50 Гц больше мощности составляющей 100 Гц?", "options": ["В 4 раза", "В 16 раз", "В 2 раза", "В 8 раз"], "correct": 1, "explain": "Мощность гармоники \\(A_n^2/2\\): \\(\\frac{2^2}{2}=2\\) В² и \\(\\frac{0{,}5^2}{2}=0{,}125\\) В²; отношение \\(16\\) — квадрат отношения амплитуд. «В 4 раза» — сравнили амплитуды, а не мощности: так читают амплитудный спектр (amplitude spectrum) вместо спектра мощности. «В 2 раза» — увидели, что частота вдвое выше, — но частота на мощность не влияет. «В 8 раз» — \\(4^2/2\\): поделили на 2 только одну из мощностей. Интуиция: в мощности всё «в квадрате» — отношение 4:1 по амплитуде даёт 16:1 по мощности, то есть 12 дБ.", "usage": {"code": false, "without": "Гармонику 100 Гц на спектре вибрации считают «вчетверо слабее» и тратят силы на её подавление.", "with": "Переводят амплитуды в мощности: 100 Гц несёт около 6% мощности, — и сосредотачиваются на 50 Гц.", "benefit": "Подавляется то, что действительно вносит мощность"}}, {"q": "Студент проверил энергию прямоугольного импульса через спектр \\(\\dot S(\\omega)=S_m\\tau\\,\\mathrm{sinc}(\\omega\\tau/2)\\) и получил \\(\\int_{-\\infty}^{\\infty}|\\dot S(\\omega)|^2d\\omega=2\\pi S_m^2\\tau\\), а не \\(S_m^2\\tau\\). В чём дело?", "options": ["Спектр неверен: этот интеграл и так равен \\(S_m^2\\tau\\)", "Энергии во времени и по частоте не обязаны совпадать", "Нужно было брать \\(|\\dot S(\\omega)|\\) без квадрата", "По \\(\\omega\\) интеграл делят на \\(2\\pi\\); по \\(f\\) в герцах — не делят"], "correct": 3, "explain": "Интеграл посчитан верно: \\(\\int|\\dot S|^2d\\omega=2\\pi S_m^2\\tau\\). Парсеваль по круговой частоте содержит \\(\\frac1{2\\pi}\\): \\(E=\\frac1{2\\pi}\\int|\\dot S(\\omega)|^2d\\omega=S_m^2\\tau\\). По частоте в герцах \\(d\\omega=2\\pi\\,df\\), и тогда \\(E=\\int|\\dot S(2\\pi f)|^2df\\) — без множителя. Спектр верен: \\(\\dot S(0)=S_m\\tau\\) — площадь прямоугольника. Энергии обязаны совпадать — в этом суть равенства Парсеваля. Без квадрата получится не энергия, а другая величина с другими единицами. Интуиция: смешали \\(\\omega\\) и \\(f\\) — получили лишние \\(2\\pi\\).", "usage": {"code": false, "without": "Энергию сигнала по спектру с анализатора, где ось в герцах, считают с лишним \\(1/2\\pi\\) и занижают её в 6,3 раза.", "with": "Смотрят, по какой переменной ось — \\(\\omega\\) или \\(f\\), — и ставят множитель \\(1/2\\pi\\) только для \\(\\omega\\).", "benefit": "Числа из спектра и из осциллограммы совпадают"}}, {"q": "Сигнал \\(s(t)=3+4\\cos\\omega_1t\\) В. Чему равно его действующее значение (RMS)?", "options": ["\\(3+4/\\sqrt2\\approx5{,}83\\) В", "\\(\\sqrt{3^2+4^2}=5\\) В", "\\(\\sqrt{17}\\approx4{,}12\\) В", "\\(\\sqrt{13}\\approx3{,}61\\) В"], "correct": 2, "explain": "Сначала мощность: постоянная составляющая даёт \\(3^2=9\\), гармоника \\(\\frac{4^2} ): \\(\\dot C_0=2\\) В, \\(|\\dot C_{\\pm1}|=3\\) В, \\(|\\dot C_{\\pm2}|=1\\) В, остальные ноль. Найдите среднюю мощность.", "options": ["14 В²", "44 В²", "10 В²", "24 В²"], "correct": 3, "explain": "Шаг 1: Парсеваль для экспоненциального ряда — сумма \\(|\\dot C_n|^2\\) по всем \\(n\\), положительным и отрицательным: \\(P=\\sum_{n=-\\infty}^{\\infty}|\\dot C_n|^2\\). Шаг 2: \\(P=2^2+2\\cdot3^2+2\\cdot1^2=4+18+2=24\\) В². Проверка через тригонометрическую форму: \\(A_n=2|\\dot C_n|\\), то есть \\(A_1=6\\), \\(A_2=2\\); \\(P=4+\\frac{36}{2}+\\frac{4}{2}=24\\). \\(14\\) — только \\(n\\ge0\\), отрицательные частоты забыты. \\(44\\) — перешли к \\(A_n\\), но не поделили на 2: \\(4+36+4\\). \\(10\\) — сложили модули без квадратов: \\(2+3+3+1+1\\).", "usage": {"code": false, "without": "Мощность по выходу БПФ считают только по положительным частотам и занижают мощность вибрации почти вдвое.", "with": "Складывают \\(|\\dot C_n|^2\\) по обеим половинам спектра или удваивают ненулевые — мощность совпадает с расчётом во времени.", "benefit": "Мощность по БПФ и по осциллограмме совпадает"}}, {"q": "Спектральная плотность импульса \\(\\dot S(\\omega)=S_m\\tau\\,\\mathrm{sinc}(\\omega\\tau/2)\\), \\(S_m=2\\) В, \\(\\tau=3\\) мс. Найдите энергию импульса, не интегрируя спектр.", "options": ["75,4 В²·мс", "12 В²·мс", "6 В²·мс", "36 В²·мс"], "correct": 1, "explain": "Шаг 1: узнаём пару: \\(S_m\\tau\\,\\mathrm{sinc}(\\omega\\tau/2)\\) — спектр прямоугольного импульса высотой \\(S_m\\) и длительностью \\(\\tau\\): \\(\\dot S(0)=S_m\\tau\\) — его площадь, первый ноль при \\(\\omega=2\\pi/\\tau\\). Шаг 2: энергия во времени: \\(E=S_m^2\\tau=4\\cdot3=12\\) В²·мс; по Парсевалю \\(\\frac1{2\\pi}\\int|\\dot S|^2d\\omega\\) даёт то же. \\(75{,}4=2\\pi\\cdot12\\) — Парсеваль без \\(\\frac1{2\\pi}\\). \\(6\\) — приняли \\(\\dot S(0)=S_m\\tau\\), площадь, за энергию. \\(36\\) — взяли \\(|\\dot S(0)|^2=(S_m\\tau)^2\\) — это значение энергетического спектра в нуле, а не энергия.", "usage": {"co   const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: работа над ошибками
    // не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  // Карточка вопроса: варианты, объяснение, пример. Общая для теста и для
  // «Работы над ошибками» / «Повторения», чтобы они не разошлись видом.
  function cardHtml(q, answered) {
    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += imageHtml(q.img);
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» ----
  // Отдельный проход только по вопросам с неисправленной ошибкой. Счёт теста
  // (state.answers) он не трогает: исправленная ошибка пишется в state.fixed.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = LTProgress.mistakes(state);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast("Ошибок не осталось — всё исправлено");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = "Работа над ошибками · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        if (ok) { state.fixed = state.fixed || {}; state.fixed[idx] = Date.now(); saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    const left = LTProgress.mistakes(state).length;
    blockLabel.textContent = "Работа над ошибками · итог";
    html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
    html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
    if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  // Картинка к вопросу (поле img из content/<slug>.json, путь от корня сайта).
  // Касание открывает её целиком: на телефоне так её можно увеличить.
  function imageHtml(img) {
    if (!img || !img.src) return "";
    const src = "../" + escapeAttr(img.src);
    let html = '<figure class="qimg"><a href="' + src + '" target="_blank" rel="noopener">';
    html += '<img src="' + src + '" alt="' + escapeAttr(img.alt) + '" loading="lazy"></a>';
    if (img.credit) html += '<figcaption>' + escapeHtml(img.credit) + '</figcaption>';
    return html + '</figure>';
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ")
      .replace(/\\[()\[\]]/g, " ").replace(/\\([a-zA-Z]+)/g, "$1").replace(/\s+/g, " ").trim();
  }

  // Формулы в тексте: \( ... \) в строке, \[ ... \] отдельной строкой (KaTeX,
  // файлы в vendor/katex). Знак $ разделителем не служит: в тестах по
  // ассемблеру и shell он означает константу и переменную. Код в <pre> и
  // <code> не трогается. Без KaTeX текст остаётся как есть.
  function typeset(el) {
    if (!el || typeof renderMathInElement !== "function") return;
    renderMathInElement(el, {
      delimiters: [
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false
    });
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
