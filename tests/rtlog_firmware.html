<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RT-Logger и логи прошивки: сбор и декодирование</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>RT-Logger и логи прошивки: сбор и декодирование</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../sync.js"></script>
<script>
(function () {
  const TEST_ID = "rtlog_firmware";
  const QUESTIONS = [{"q": "Что такое лог прошивки Wi-Fi-чипа?", "options": ["Сообщения кода, который выполняется на самом чипе, а не на хосте", "Сообщения демона hostapd о подключении и отключении клиентов сети", "Записи загрузчика о том, какой образ прошивки был залит в устройство", "Сообщения драйвера iwlwav, записанные ядром хоста в кольцо dmesg"], "correct": 0, "explain": "Прошивка живёт своей жизнью на отдельном процессоре чипа, и её лог — единственное окно в эту жизнь. Всё, что печатает драйвер или hostapd, относится уже к хосту и показывает лишь внешнюю сторону событий.", "usage": {"code": true, "without": "О внутренних решениях чипа судят по косвенным признакам в логах хоста.", "with": "Поток RT-Logger читают отдельно от dmesg и логов hostapd.", "benefit": "Видно, что решила сама прошивка, а не что заметил драйвер."}}, {"q": "Чем поток RT-Logger отличается от вывода dmesg на устройстве?", "options": ["Он приходит из прошивки чипа, а dmesg показывает кольцо сообщений ядра", "Он собирает сообщения всех служб системы, а dmesg только сообщения драйвера", "Он содержит те же сообщения, но с отметками времени большей точности", "Он пишется на диск устройства, а dmesg существует только в оперативной памяти"], "correct": 0, "explain": "Это два разных источника с разных процессоров, а не два вида одного журнала. Драйвер видит только то, что чип решил ему сообщить, поэтому dmesg не заменяет лог прошивки при разборе поведения радиотракта.", "usage": {"code": true, "without": "Ищут причину в dmesg и не находят: чип о ней хосту не рассказывал.", "with": "dmesg -T | grep iwlwav   # это про драйвер, лог прошивки собирают отдельно", "benefit": "Каждый источник используется по назначению, а не вместо другого."}}, {"q": "Почему записи лога прошивки передаются в двоичном виде, а не готовым текстом?", "options": ["Двоичные записи не требуют отметок времени и потому короче текстовых", "Текстовые строки не проходят по шине между чипом и хостом целиком", "Двоичный вид закрывает содержимое лога от чтения посторонними людьми", "Сборка строки стоит тактов и полосы, а запаса у прошивки почти нет"], "correct": 3, "explain": "Форматирование строки в горячем пути — это работа процессора и лишние байты в буфере, причём в самый нагруженный момент. Дешевле отправить номер сообщения с параметрами, а собрать строку уже на хосте, где ресурсов много.", "usage": {"code": true, "without": "Подробный текстовый лог сам по себе роняет пропускную способность чипа.", "with": "Прошивка шлёт идентификатор и параметры, строку собирает декодер на хосте.", "benefit": "Логирование почти не мешает работе радиотракта."}}, {"q": "Зачем логгеру прошивки нужен словарь декодирования?", "options": ["Он задаёт уровни серьёзности, доступные для включения в этой сборке", "Он содержит список адресов клиентов, чьи события попадают в журнал", "Он хранит порядок, в котором записи попадают в кольцевой буфер прошивки", "Он сопоставляет идентификатор записи строке формата и типам параметров"], "correct": 3, "explain": "В самой записи текста нет, есть только номер сообщения и значения. Словарь собирается вместе с прошивкой и хранит соответствие номера строке формата, поэтому без него поток остаётся набором чисел.", "usage": {"code": true, "without": "На руках сырой файл, из которого без словаря не извлечь ни строки.", "with": "Словарь берут из той же сборки прошивки, что залита в устройство.", "benefit": "Поток превращается в читаемый журнал, а не в набор чисел."}}, {"q": "Чем опасен словарь от другой версии прошивки?", "options": ["Вывод может выглядеть правдоподобно, но строки и значения будут чужими", "Записи выведутся в шестнадцатеричном виде, зато без потери данных", "Вывод останется верным, словарь влияет лишь на порядок строк в журнале", "Декодер откажется работать и не выведет ни одной строки журнала"], "correct": 0, "explain": "Номера сообщений между сборками смещаются, поэтому запись подставится к чужой строке формата. Хуже всего, что такой лог читается гладко и уводит разбор в сторону, а не падает с явной ошибкой.", "usage": {"code": true, "without": "Часами разбирают события, которых на устройстве вообще не было.", "with": "Версию прошивки на устройстве сверяют с версией словаря до декодирования.", "benefit": "Разбор идёт по настоящим событиям, а не по чужим строкам."}}, {"q": "Что содержит одна запись потока RT-Logger?", "options": ["Только номер модуля и уровень серьёзности без каких-либо иных данных", "Полный снимок регистров чипа на момент возникновения этого события", "Идентификатор сообщения, отметку времени и значения его параметров", "Готовую текстовую строку вместе с именем файла и номером строки кода"], "correct": 2, "explain": "Это минимальный набор, из которого хост восстановит строку: что произошло, когда и с какими значениями. Всё остальное, включая сам текст, лежит в словаре и в записи не повторяется.", "usage": {"code": true, "without": "Ожидают увидеть в файле текст и удивляются набору байтов.", "with": "xxd -l 32 rtlog.bin   # видно идентификатор, время и параметры", "benefit": "Понятно, что именно декодер собирает в строку."}}, {"q": "Что происходит при переполнении кольцевого буфера прошивки?", "options": ["Прошивка приостанавливает работу и ждёт, пока хост заберёт накопленное", "Часть записей теряется, а логгер отмечает разрыв счётчиком потерянных", "Записи начинают сжиматься сильнее, чтобы в буфер поместилось больше", "Буфер расширяется за счёт памяти хоста, поэтому потерь не происходит"], "correct": 1, "explain": "Логирование не имеет права тормозить радиотракт, поэтому при нехватке места жертвуют записями, а не работой. Счётчик потерь при этом растёт, и именно он честно говорит, что в журнале дыра.", "usage": {"code": true, "without": "В журнале пропуск, который принимают за отсутствие событий.", "with": "Перед разбором смотрят счётчик потерь за интересующий отрезок.", "benefit": "Пропуск в логе виден как потеря, а не как тишина."}}, {"q": "Зачем в логгере прошивки уровни серьёзности и маски модулей?", "options": ["Чтобы декодер знал, в каком порядке подставлять параметры в строку", "Чтобы разложить записи по разным файлам на стороне сборщика логов", "Чтобы отсеивать лишние записи в источнике, до попадания их в буфер", "Чтобы раскрасить вывод и упростить чтение длинных журналов глазами"], "correct": 2, "explain": "Фильтр работает раньше буфера, поэтому отсеянная запись не тратит ни памяти, ни полосы. Фильтрация после сбора этих затрат уже не вернёт: место в кольце израсходовано, а часть записей потеряна.", "usage": {"code": true, "without": "Кольцо забито отладочным потоком, и нужное событие вытеснено.", "with": "Оставляют только нужные модули и уровень не подробнее необходимого.", "benefit": "В журнал попадает то, ради чего его вообще включали."}}, {"q": "Что означает слово «реального времени» в названии такого логгера?", "options": ["Логгер работает только тогда, когда чип не занят передачей данных в эфир", "Записи уходят потребителю по ходу работы, а не выгружаются после сбоя", "Отметки времени берутся из системных часов хоста в момент события", "Логгер гарантирует доставку каждой записи в строго заданный срок"], "correct": 1, "explain": "Смысл в непрерывном потоке: события видно, пока устройство работает, а не только в дампе после падения. Это и позволяет ловить редкие явления, которые не оставляют следов к моменту сбоя.", "usage": {"code": true, "without": "О причинах судят по посмертному дампу, где предыстории уже нет.", "with": "Поток пишут постоянно, а на сбое просто останавливают запись.", "benefit": "Видна предыстория события, а не только его финал."}}, {"q": "Где формируется отметка времени в записи потока RT-Logger?", "options": ["В прошивке, по её собственному счётчику тактов на момент события", "В ядре хоста, по монотонным часам системы с точностью до микросекунды", "На сборщике логов, при приёме сетевого пакета с записями внутри", "На хосте, в момент вычитывания записи драйвером из общего буфера"], "correct": 0, "explain": "Время ставится там же, где произошло событие, иначе задержки на пути исказили бы порядок. Отсюда и главная сложность: это счётчик чипа, и с часами хоста он никак не связан.", "usage": {"code": true, "without": "Время из лога прошивки сравнивают с часами хоста и получают чушь.", "with": "Время прошивки пересчитывают в часы хоста через опорную точку.", "benefit": "События двух источников выстраиваются в одну ленту."}}, {"q": "Как записи лога попадают из прошивки чипа на хост?", "options": ["Записи приходят вместе с кадрами эфира и извлекаются из их заголовков", "Драйвер опрашивает регистры чипа и собирает текст сообщений по частям", "Прошивка кладёт их в общий буфер, а драйвер вычитывает и отдаёт дальше", "Прошивка сама открывает сокет и отправляет их сборщику по сети"], "correct": 2, "explain": "Обмен идёт через память, к которой имеют доступ обе стороны: прошивка пишет, драйвер забирает. Сеть появляется дальше, уже на хосте, когда собранный поток отправляют на внешний сборщик.", "usage": {"code": true, "without": "Ищут сетевой обмен там, где данные ходят через общую память.", "with": "Сначала проверяют, что драйвер вычитывает поток, и лишь потом сеть.", "benefit": "Поиск причины идёт по настоящему пути данных."}}, {"q": "Почему поток логов на внешний сборщик обычно идёт поверх UDP, а не TCP?", "options": ["UDP доставляет пакеты быстрее, потому что не считает контрольные суммы", "TCP запрещён на устройствах с ограниченной памятью и слабым процессором", "UDP не тормозит источник повторами, платой за это будут потери записей", "TCP не умеет передавать двоичные данные без предварительного кодирования"], "correct": 2, "explain": "Повтор и окно перегрузки означают ожидание, а ждать логгер не может: пока источник тормозит, буфер переполняется. Потерянный по дороге пакет для журнала дешевле, чем остановка потока.", "usage": {"code": true, "without": "Поток на сборщик тормозит, и записи теряются уже в буфере чипа.", "with": "tcpdump -n -i br-lan 'udp and dst host 10.0.0.10'   # поток к сборщику", "benefit": "Источник работает ровно, а потери видно в дампе."}}, {"q": "Почему отметки времени прошивки не совпадают с системными часами хоста?", "options": ["Часовой пояс устройства не применяется к записям, приходящим из чипа", "Это два независимых источника: счётчик чипа не связан с часами системы", "Хост округляет время до миллисекунд, а прошивка считает микросекунды", "Прошивка ставит время в момент отправки, а хост в момент возникновения"], "correct": 1, "explain": "Счётчик чипа считает такты от его собственного старта и ничего не знает о календаре. Поэтому сравнивать эти числа с часами хоста напрямую бессмысленно, их сначала приводят к общей шкале.", "usage": {"code": true, "without": "Событие ищут по времени из лога прошивки и не находят его в логах хоста.", "with": "Два времени связывают опорной парой отметок, снятых в один момент.", "benefit": "События из разных источников ложатся на одну ленту времени."}}, {"q": "Что нужно, чтобы перевести время прошивки в часы хоста?", "options": ["Только частота счётчика: остальное декодер восстановит по журналу", "Опорная пара отметок и частота счётчика, дальше обычный пересчёт", "Одинаковый часовой пояс на хосте и на сборщике, куда идёт поток", "Служба синхронизации времени, настроенная на устройстве и на чипе"], "correct": 1, "explain": "Пересчёт держится на двух вещах: во сколько тиков укладывается секунда и какой момент хоста соответствует известному тику. Без опорной точки известен только ход времени, но не его начало.", "usage": {"code": true, "without": "Записи двух источников сопоставляют на глаз и путают порядок событий.", "with": "Фиксируют момент хоста и тик прошивки одновременно, дальше считают.", "benefit": "Порядок событий восстанавливается точно, а не приблизительно."}}, {"q": "Как понять, что часть записей потока потерялась?", "options": ["По ошибкам декодирования, которые декодер выведет вместо строк", "По времени последней записи: оно отстанет от текущего времени хоста", "По разрыву сквозной нумерации и по счётчику отброшенных записей", "Потерю записей увидеть нельзя, поток не содержит таких признаков"], "correct": 2, "explain": "Логгер нумерует записи и считает отброшенные именно для этого: тишина в журнале должна отличаться от дыры в нём. Ошибок декодирования при потере не будет, ведь уцелевшие записи разбираются как обычно.", "usage": {"code": true, "without": "Пропуск в журнале принимают за отсутствие событий и делают ложный вывод.", "with": "Перед разбором смотрят счётчик потерь на интересующем отрезке.", "benefit": "Отличают тишину в устройстве от дыры в журнале."}}, {"q": "Что происходит с потоком логов при аварийной остановке прошивки?", "options": ["Поток продолжает идти, потому что логгер работает независимо от прошивки", "Поток переключается на драйвер, который дописывает журнал за прошивку", "Поток сохраняется целиком, так как буфер выгружается на диск при сбое", "Поток обрывается, и последние события разбирают уже из аварийного дампа"], "correct": 3, "explain": "Логгер — часть прошивки, поэтому вместе с ней он и умолкает. Самые ценные последние записи остаются в буфере чипа, и достать их можно только из аварийного дампа, снятого драйвером.", "usage": {"code": true, "without": "Журнал обрывается на полуслове, и причину падения ищут в пустоте.", "with": "dmesg -T | grep -i -E 'firmware|assert|crash'   # факт падения на стороне хоста", "benefit": "Понятно, что искать причину надо в дампе, а не в потоке."}}, {"q": "Почему после перезагрузки чипа время в логе начинается заново?", "options": ["Драйвер заново нумерует записи, чтобы отделить их от предыдущих", "Счётчик тактов обнуляется вместе с чипом при его перезапуске", "Сборщик логов сбрасывает время при потере сетевого соединения", "Логгер обнуляет отметки при каждом открытии нового файла журнала"], "correct": 1, "explain": "Отсчёт ведётся от старта чипа, поэтому каждый его перезапуск начинает шкалу с нуля. Значит, и опорную точку для пересчёта в часы хоста нужно брать заново после каждой перезагрузки.", "usage": {"code": true, "without": "Записи двух сессий чипа сваливают в одну ленту и получают кашу.", "with": "Журнал режут по перезагрузкам чипа и пересчитывают время для каждой.", "benefit": "Внутри одной сессии время сравнимо и порядок верен."}}, {"q": "Замедлит ли прошивку медленный потребитель логов на стороне хоста?", "options": ["Да, скорость эфира снижается пропорционально глубине очереди записей", "Нет, потому что буфер логов автоматически растёт при нехватке места", "Да, прошивка ждёт освобождения буфера и приостанавливает обработку", "Нет, прошивка не ждёт: она продолжает работу и теряет лишние записи"], "correct": 3, "explain": "Радиотракт не имеет права стоять из-за журнала, поэтому обратного давления здесь нет. Медленный потребитель оборачивается не задержкой, а дырой в журнале, что и показывает счётчик потерь.", "usage": {"code": true, "without": "Ждут, что все записи дойдут, и не проверяют счётчик потерь вовсе.", "with": "Потребителя делают быстрым: запись в файл, а разбор уже потом.", "benefit": "Журнал полный, а работа чипа не страдает."}}, {"q": "Чем запись логов в файл на устройстве отличается от потока на внешний сборщик?", "options": ["Файл переживает перезагрузку чипа, а поток обрывается на каждой из них", "Файл ограничен местом и ротацией, а поток ограничен полосой сети", "Файл содержит уже декодированные строки, а поток только сырые записи", "Файл пишется без потерь всегда, а поток теряет записи при любой нагрузке"], "correct": 1, "explain": "Это выбор между двумя разными ограничениями: на устройстве упираются в размер раздела и ротацию, в сети — в полосу и потери пакетов. Обе схемы пишут одинаково сырой поток, декодирование в любом случае идёт позже.", "usage": {"code": true, "without": "Пишут на устройство и обнаруживают, что нужный час уже затёрт.", "with": "df -h /rdklogs && ls -l /rdklogs/logs/ | tail", "benefit": "Глубину истории выбирают осознанно, а не по факту потери."}}, {"q": "Как соотносятся между собой лог прошивки, сообщения драйвера и журнал hostapd?", "options": ["Это три копии одних событий, из которых достаточно взять любую одну", "Это уровни одного журнала, где каждый следующий подробнее предыдущего", "Это три независимых источника, записи которых надо соотносить по времени", "Это один поток, просто разбитый на три файла для удобства чтения"], "correct": 2, "explain": "Каждый источник видит свой слой: прошивка — решения радиотракта, драйвер — обмен с чипом, hostapd — состояние соединений. Общей шкалы времени у них нет, поэтому ленту событий собирают вручную по опорным точкам.", "usage": {"code": true, "without": "Верят одному источнику и не замечают, что два других говорят другое.", "with": "Событие проверяют во всех трёх журналах и сверяют по времени.", "benefit": "Картина сходится, а противоречия видно сразу."}}, {"q": "Что представляет собой каталог /rdklogs/logs на устройстве RDK-B?", "options": ["Кольцевой буфер ядра, выгруженный на диск при каждой перезагрузке", "Журналы служб устройства, среди которых есть и относящиеся к Wi-Fi", "Каталог, куда прошивка чипа напрямую пишет свой двоичный поток", "Временный каталог, который очищается при каждом запуске системы"], "correct": 1, "explain": "Это хостовые журналы служб, а не окно в прошивку. Поток логгера туда может попасть только через программу на хосте, которая его вычитывает и складывает в файл.", "usage": {"code": true, "without": "Ищут лог прошивки среди файлов служб и делают вывод, что его нет.", "with": "ls -lt /rdklogs/logs/ | head", "benefit": "Сразу видно, какие журналы вообще пишутся и насколько они свежие."}}, {"q": "Чем ограничен вывод dmesg на устройстве?", "options": ["Размер кольца фиксирован, и старые сообщения затираются новыми", "Хранится ровно тысяча последних строк независимо от их длины", "Показываются только сообщения, поступившие после последнего входа", "Вывод обрезается по уровню, ниже которого сообщения не сохраняются"], "correct": 0, "explain": "Кольцо ядра невелико, а на нагруженном устройстве оно проматывается за минуты. Поэтому увиденное там надо забирать сразу: к моменту разбора нужные строки уже вытеснены.", "usage": {"code": true, "without": "Возвращаются к устройству через час, а интересных строк уже нет.", "with": "dmesg -T > /tmp/dmesg-$(date +%s).txt", "benefit": "Снимок сохранён до того, как кольцо провернулось."}}, {"q": "Что даёт запись сообщений в системный журнал по сравнению с кольцом ядра?", "options": ["Сообщения переживают перезагрузку, если журнал лежит на носителе", "Сообщения приходят раньше, потому что журнал не буферизует их вовсе", "Сообщения дополняются данными прошивки, недоступными в кольце ядра", "Сообщения разбираются по уровням автоматически и не требуют фильтров"], "correct": 0, "explain": "Кольцо живёт в памяти и обнуляется при перезапуске, а журнал на диске переживает его. Для сбоев с перезагрузкой это решает: без файла на носителе от предыдущей загрузки не останется ничего.", "usage": {"code": true, "without": "Устройство ушло в перезагрузку и унесло с собой все следы причины.", "with": "grep -i -E 'crash|reboot|panic' /rdklogs/logs/*.txt", "benefit": "Есть что читать даже после того, как устройство перезапустилось."}}, {"q": "Чем ротация журналов опасна при разборе редкого сбоя?", "options": ["Ротация меняет порядок строк, и события перестают идти по времени", "Ротация сбрасывает уровень подробности до значения по умолчанию", "Нужный отрезок затирается раньше, чем о сбое успевают сообщить", "После ротации журнал теряет отметки времени у части своих записей"], "correct": 2, "explain": "Между сбоем и жалобой пользователя обычно проходят часы, а ротация считает только объём. Отсюда правило: глубину истории считают заранее, исходя из скорости потока, а не из числа файлов.", "usage": {"code": true, "without": "Пользователь сообщает о ночном обрыве, а журнал начинается с утра.", "with": "ls -l --time-style=+%H:%M /rdklogs/logs/ | head   # глубина истории", "benefit": "Видно, до какого момента вообще есть смысл искать."}}, {"q": "Как убедиться, что поток логов реально уходит с устройства на сборщик?", "options": ["Открыть файл журнала на устройстве и проверить, что он не пустой", "Проверить, что процесс логгера запущен и не сообщает об ошибках", "Поймать его дампом по адресу и порту сборщика прямо на устройстве", "Сравнить время последней записи с системным временем на сборщике"], "correct": 2, "explain": "Запущенный процесс и непустой файл ничего не говорят о том, что пакеты покинули устройство. Дамп на исходящем интерфейсе отвечает на этот вопрос прямо, и заодно показывает адрес получателя.", "usage": {"code": true, "without": "Считают, что поток идёт, потому что процесс жив, и теряют часы.", "with": "tcpdump -n -i br-lan 'udp and dst host 10.0.0.10' -c 10", "benefit": "Факт отправки подтверждён, а не предположен."}}, {"q": "Почему поиск по сырому файлу потока обычными текстовыми средствами почти бесполезен?", "options": ["Файл сжат целиком, и поиск возможен только после распаковки архива", "Строки в файле зашифрованы и открываются только ключом сборки прошивки", "Поиск мешает записи, поэтому логгер закрывает файл на время чтения", "Текста в записях нет, строки появляются только после декодирования"], "correct": 3, "explain": "В файле лежат номера сообщений и значения, а сами строки живут в словаре. Совпадения, которые всё же находит поиск, случайны и к содержимому записей отношения не имеют.", "usage": {"code": true, "without": "grep 'disassoc' rtlog.bin   # тишина, хотя события были", "with": "Сначала декодируют поток словарём, поиск ведут уже по тексту.", "benefit": "Ищут по настоящим строкам, а не по случайным байтам."}}, {"q": "Как найти в логе прошивки события, относящиеся к одному конкретному клиенту?", "options": ["Включить логгер в момент, когда в сети остаётся только этот клиент", "Отфильтровать декодированный вывод по адресу этого клиента", "Отфильтровать сырой поток по байтам адреса до его декодирования", "Сопоставить события по времени с журналом hostapd и взять их оттуда"], "correct": 1, "explain": "Адрес в записи хранится значением параметра, поэтому в тексте он появляется только после подстановки. Фильтр по сырым байтам ненадёжен: то же число встретится в других полях и в отметках времени.", "usage": {"code": true, "without": "Листают весь журнал целиком в поисках упоминаний одного устройства.", "with": "decoded.txt | grep -i '00:1a:2b:3c:4d:5e'", "benefit": "Остаются только события нужного клиента."}}, {"q": "Чем грозит включение самого подробного уровня логирования на нагруженном устройстве?", "options": ["Декодер перестанет успевать и начнёт пропускать строки при разборе", "Записи начнут дублироваться, и журнал вырастет вдвое без новых данных", "Потерями в буфере и просадкой, вплоть до изменения поведения чипа", "Часть модулей отключит логирование сама, чтобы уложиться в буфер"], "correct": 2, "explain": "Подробный уровень нагружает те же такты и ту же память, которыми живёт радиотракт. В худшем случае проблема просто перестаёт воспроизводиться под наблюдением, и разбор заходит в тупик.", "usage": {"code": true, "without": "Включают всё подряд, и редкий сбой исчезает вместе с включением логов.", "with": "Оставляют подробным один модуль, остальные держат на уровне ошибок.", "benefit": "Поведение устройства почти не меняется, а нужное видно."}}, {"q": "Что обязательно приложить к сырому логу прошивки, отправляя его на разбор?", "options": ["Снимок памяти чипа и таблицу адресов моста на момент сбоя", "Словарь той же сборки, версии прошивки и драйвера, журналы хоста", "Дамп эфира за тот же период и полный список подключённых клиентов", "Настройки радио и полную выгрузку модели данных с устройства"], "correct": 1, "explain": "Без словаря той же сборки поток вообще не превратится в текст, а без версий невозможно проверить, тот ли это словарь. Журналы хоста нужны, чтобы связать события прошивки с тем, что видел драйвер.", "usage": {"code": true, "without": "Лог уходит в поддержку и возвращается с просьбой прислать словарь.", "with": "Собирают архив: сырой лог, словарь сборки, версии, журналы хоста.", "benefit": "Разбор начинается сразу, а не через неделю переписки."}}, {"q": "Как проверить, что словарь подходит к прошивке, не декодируя весь поток?", "options": ["Декодировать первые записи и посмотреть, читаются ли они как текст", "Сверить версию прошивки на устройстве с версией сборки словаря", "Сравнить размер словаря с размером образа прошивки на устройстве", "Открыть словарь и убедиться, что в нём есть знакомые строки формата"], "correct": 1, "explain": "Версия — единственный признак, который проверяется до разбора и не зависит от везения. Пробное декодирование обманчиво: при близких сборках первые записи могут выглядеть правдоподобно и при чужом словаре.", "usage": {"code": true, "without": "Разбирают журнал часами и лишь потом понимают, что словарь чужой.", "with": "Версию прошивки с устройства сверяют с версией сборки словаря.", "benefit": "Ошибка ловится за минуту, а не после ложных выводов."}}, {"q": "Журнал декодировался без ошибок и читается связно, но описанных в нём событий на устройстве заведомо не было. Что проверять первым?", "options": ["Не потерялась ли часть записей при переполнении кольцевого буфера", "Не от другой ли сборки прошивки взят словарь для декодирования", "Не попал ли в файл поток от соседнего устройства с тем же адресом", "Не сбились ли отметки времени после последней перезагрузки чипа"], "correct": 1, "explain": "Гладкий, но неправдоподобный текст — характерный признак чужого словаря: номера подставились к чужим строкам формата. Потери дали бы дыру, а не ложные события, поэтому версия словаря проверяется раньше всего.", "usage": {"code": true, "without": "Заводят задачу на несуществующее поведение прошивки.", "with": "Версию прошивки на устройстве сверяют с версией сборки словаря.", "benefit": "Ложный след отсекается до того, как в него вложат неделю."}}, {"q": "В журнале пропуск примерно на полминуты, а счётчик потерянных записей за это время заметно вырос. Что это означает?", "options": ["Прошивка была занята и в этот период ничего не записывала в журнал", "Декодер пропустил записи, потому что не нашёл их в текущем словаре", "Сборщик потерял сетевые пакеты, и записи придётся запросить повторно", "Кольцо переполнилось, и записи этого отрезка потеряны безвозвратно"], "correct": 3, "explain": "Именно для такой ситуации счётчик и существует: он отличает дыру от тишины. Запросить потерянное невозможно, логгер не хранит копию, поэтому отрезок придётся воспроизводить заново с более узким фильтром.", "usage": {"code": true, "without": "Пропуск читают как отсутствие событий и строят на этом версию.", "with": "Сужают набор модулей и повторяют сценарий, чтобы кольцо не переполнялось.", "benefit": "Второй заход даёт полный журнал вместо дыры."}}, {"q": "Процесс логгера на устройстве запущен и не жалуется, но сборщик не принял ни одного пакета. Как быстро локализовать разрыв?", "options": ["Увеличить уровень подробности, чтобы записей стало заведомо больше", "Снять дамп на устройстве и посмотреть, уходят ли пакеты к сборщику", "Перезапустить логгер и подождать, не появится ли поток сам собой", "Проверить на сборщике свободное место и права на каталог приёма"], "correct": 1, "explain": "Вопрос в том, по какую сторону сети пропадает поток, и дамп на исходящем интерфейсе отвечает на него сразу. Если пакеты уходят, дальше разбирают маршрут и приём, а если нет, причина осталась на устройстве.", "usage": {"code": true, "without": "Перебирают настройки сборщика, хотя пакеты и не покидали устройство.", "with": "tcpdump -n -i br-lan 'udp and dst host 10.0.0.10' -c 5", "benefit": "Половина возможных причин отсекается одной командой."}}, {"q": "Событие в журнале hostapd помечено временем 12:00:03, а в логе прошивки соседних отметок нет вообще. В чём причина?", "options": ["Отметки прошивки идут в тактах от её старта и с часами хоста не связаны", "Прошивка не логирует события, о которых сообщает демон управления сетью", "Прошивка пишет время в другом часовом поясе, отличном от пояса хоста", "hostapd округляет время до секунд, а прошивка ведёт счёт микросекундами"], "correct": 0, "explain": "Это разные шкалы, а не разное время: у прошивки счётчик тактов, у хоста календарь. Пока не построена опорная пара отметок, искать в логе прошивки по времени хоста бессмысленно.", "usage": {"code": true, "without": "Ищут в журнале прошивки время из журнала хоста и не находят ничего.", "with": "Снимают опорную пару и пересчитывают время события в тики.", "benefit": "Событие находится в нужном окне, а не перебором."}}, {"q": "Устройство перезагрузилось ночью, и наутро в журнале только записи после загрузки. Как готовиться к следующему разу?", "options": ["Увеличить размер кольцевого буфера в прошивке до максимального", "Снимать журнал вручную каждый час и складывать копии на устройстве", "Перевести логгер на самый подробный уровень, чтобы событий было больше", "Писать поток в файл на носителе и следить за глубиной его ротации"], "correct": 3, "explain": "Всё, что живёт в памяти, перезагрузка уносит с собой, поэтому нужен носитель. Дальше вопрос уже к ротации: глубина истории должна перекрывать время между сбоем и разбором.", "usage": {"code": true, "without": "Каждый ночной сбой уносит с собой единственный источник данных.", "with": "Поток пишут в файл с ротацией, рассчитанной на несколько часов.", "benefit": "Утром есть что читать за момент сбоя."}}, {"q": "Клиент отваливается примерно раз в сутки, воспроизвести по требованию не выходит. Как настроить сбор логов?", "options": ["Включить все модули подробно и писать поток до появления сбоя", "Собирать журнал только в часы, когда сбой случался ранее всего чаще", "Оставить узкий набор модулей и писать по кругу с запасом по времени", "Снимать короткие журналы вручную несколько раз в течение суток"], "correct": 2, "explain": "Задача — пережить сутки, не потеряв момент сбоя и не задавив устройство потоком. Узкий фильтр снижает скорость записи, а кольцо с запасом гарантирует, что нужный отрезок ещё не затёрт к утру.", "usage": {"code": true, "without": "Подробный лог забивает диск за час, и к моменту сбоя писать уже некуда.", "with": "Оставляют нужные модули и считают глубину кольца под сутки.", "benefit": "Редкое событие попадает в журнал с первого раза."}}, {"q": "Поток логов оборвался на середине, устройство при этом продолжает работать и раздавать сеть. Что произошло вероятнее всего?", "options": ["Сборщик закрыл приём, и логгер прекратил отправку до его возвращения", "Кольцевой буфер переполнился и логгер отключил себя до перезагрузки", "Прошивка чипа упала и перезапустилась, унеся последние записи в дамп", "Уровень логирования сбросился на значение по умолчанию при нагрузке"], "correct": 2, "explain": "Логгер — часть прошивки, поэтому её падение обрывает поток мгновенно, тогда как хост и сеть продолжают жить. Последние записи остаются в буфере чипа, и добраться до них можно только через аварийный дамп.", "usage": {"code": true, "without": "Обрыв журнала считают сбоем сети и чинят не то.", "with": "dmesg -T | grep -i -E 'firmware|assert|restart'", "benefit": "Факт перезапуска прошивки подтверждается со стороны хоста."}}, {"q": "Раздел с журналами на устройстве заполняется за пару часов, и запись останавливается. Что делать в первую очередь?", "options": ["Отключить ротацию, чтобы старые файлы не занимали место копиями", "Снизить подробность и сузить набор модулей, оставив нужные события", "Перенести журналы в оперативную память, чтобы разгрузить раздел", "Увеличить размер файлов ротации, сохранив их прежнее количество"], "correct": 1, "explain": "Место кончается из-за скорости потока, а не из-за настроек хранения. Отключение ротации только ускорит переполнение, а память вместо диска добавит ещё и потерю всего журнала при перезагрузке.", "usage": {"code": true, "without": "df показывает ноль свободного места, и запись встаёт в самый нужный момент.", "with": "df -h /rdklogs && du -sh /rdklogs/logs/*", "benefit": "Видно, что именно ест место, до того как запись остановится."}}, {"q": "Пока включён подробный уровень логирования, проблема не воспроизводится, а без него возвращается. Как действовать?", "options": ["Считать проблему решённой, раз при наблюдении она не проявляется", "Оставить подробный уровень навсегда как обходной путь для клиента", "Повторять запуск с подробным уровнем, пока сбой всё же не случится", "Сузить наблюдение до одного модуля, чтобы влияние стало меньше"], "correct": 3, "explain": "Подробный лог отнимает такты и память у того же кода, поэтому меняет тайминги и маскирует гонки. Выход — сделать наблюдение как можно дешевле: один модуль, уровень пожёстче, и смотреть на счётчик потерь.", "usage": {"code": true, "without": "Гонку прячут логированием и объявляют её невоспроизводимой.", "with": "Подробным делают один модуль, остальные держат на уровне ошибок.", "benefit": "Сбой продолжает воспроизводиться и попадает в журнал."}}, {"q": "Драйвер сообщает об успешной операции, а лог прошивки за тот же момент говорит об отказе. Какому источнику верить?", "options": ["Любому из них: расхождение всегда означает ошибку декодирования", "Прошивке: она ближе к событию, а драйвер видит лишь ответ на команду", "Ни одному: при расхождении данные считаются испорченными полностью", "Драйверу: он работает на хосте и видит итог операции целиком"], "correct": 1, "explain": "Драйвер знает ровно то, что чип успел ему ответить, и успех команды не равен успеху действия в эфире. Само расхождение при этом ценно: оно и указывает на слой, где теряется правда о событии.", "usage": {"code": true, "without": "Верят ответу драйвера и закрывают задачу как невоспроизводимую.", "with": "Событие сверяют в логе прошивки и в дампе эфира за тот же момент.", "benefit": "Расхождение становится подсказкой, а не поводом закрыть задачу."}}, {"q": "Прошивка отдаёт двадцать тысяч записей в секунду по двадцать четыре байта. Логгер складывает по пятьдесят записей в пакет UDP и шлёт по сети. Какую полосу займёт поток?", "options": ["Около четырёх целых мегабита в секунду вместе со всеми заголовками", "Около трёх целых восьми десятых мегабита: столько весят сами записи", "Около девяти целых шести десятых мегабита в секунду на этом потоке", "Около половины мегабита в секунду при такой частоте отправки пакетов"], "correct": 0, "explain": "Шаг 1: двадцать тысяч записей по двадцать четыре байта дают четыреста восемьдесят килобайт в секунду, это три целых восемь десятых мегабита. Шаг 2: по пятьдесят записей в пакете выходит четыреста пакетов в секунду, а каждый добавляет восемь байт UDP, двадцать байт IP и восемнадцать байт кадра. Шаг 3: сорок шесть байт на пакет дают ещё около восемнадцати килобайт в секунду, итого примерно четыре мегабита.", "usage": {"code": true, "without": "Полосу считают по объёму записей и удивляются лишнему трафику.", "with": "tcpdump -n -i br-lan 'udp and dst host 10.0.0.10' -w /dev/null", "benefit": "Нагрузка на сеть известна до включения потока, а не после."}}, {"q": "Кольцевой буфер прошивки занимает шестьдесят четыре килобайта, запись весит тридцать два байта, поток равен десяти тысячам записей в секунду. Сколько истории хранит буфер?", "options": ["Около двух сотых секунды, дальше начинается затирание старых записей", "Около шести секунд, чего хватает на разбор большинства коротких сбоев", "Около двух секунд, если хост не успевает вычитывать поток вовремя", "Около двух десятых секунды, после чего старые записи затираются"], "correct": 3, "explain": "Шаг 1: делим шестьдесят четыре килобайта на тридцать два байта и получаем две тысячи сорок восемь записей. Шаг 2: делим их на десять тысяч записей в секунду. Шаг 3: выходит около двух десятых секунды, поэтому буфер здесь не хранилище, а лишь запас на время до вычитывания хостом.", "usage": {"code": true, "without": "Надеются найти в буфере предысторию сбоя и находят доли секунды.", "with": "Поток вычитывают непрерывно и сразу пишут в файл на носителе.", "benefit": "История живёт в файле, а не в крошечном кольце чипа."}}, {"q": "Запись п Поток занимает около четырёх мегабит в секунду, а в бюджете на служебный трафик остался один мегабит. Как уложиться, не трогая размер записи?", "options": ["Снизить поток до пяти тысяч записей в секунду, отсеяв лишние модули", "Складывать по сто записей в пакет, оставив частоту записей прежней", "Снизить поток примерно до десяти тысяч записей в секунду и сжать пакеты", "Перейти на TCP, потому что он использует полосу канала экономнее UDP"], "correct": 0, "explain": "Шаг 1: уложиться в один мегабит из четырёх означает сократить поток вчетверо. Шаг 2: размер записи менять нельзя, значит режем их количество: двадцать тысяч в секунду превращаются в пять тысяч. Шаг 3: добиться этого можно только фильтром в источнике, потому что укрупнение пакетов экономит лишь заголовки, а их доля здесь мала.", "usage": {"code": true, "without": "Поток логов ест полосу, которая нужна пользовательскому трафику.", "with": "Оставляют только те модули, которые относятся к разбираемому сбою.", "benefit": "Журнал влезает в бюджет и не мешает работе сети."}}, {"q": "Словарь собран для сборки, где было тысяча сообщений, а прошивка на устройстве новее и шлёт идентификаторы вплоть до тысячи двухсот. Как будет выглядеть декодирование?", "options": ["Все записи выведутся числами, поскольку версия словаря не совпала", "Записи сверх тысячи не найдутся, а остальные могут попасть к чужим строкам", "Декодер остановится на первом же неизвестном идентификаторе записи", "Все записи разберутся верно, ведь старые идентификаторы не меняются"], "correct": 1, "explain": "Шаг 1: идентификаторов свыше тысячи в словаре просто нет, поэтому такие записи останутся нераспознанными. Шаг 2: остальные номера в словаре есть, но между сборками они могли сместиться на другие строки. Шаг 3: значит часть журнала окажется пустой, а часть — правдоподобной, но неверной, что опаснее явной ошибки.", "usage": {"code": true, "without": "Половину журнала читают как истину, хотя строки подставлены чужие.", "with": "Словарь берут строго из той сборки, что залита в устройство.", "benefit": "Читаемый журнал соответствует тому, что происходило на самом деле."}}, {"q": "На устройстве за десять секунд захвачено четыре тысячи пакетов, идущих на сборщик логов. Сходится ли это с расчётом для двадцати тысяч записей в секунду по пятьдесят записей в пакете?", "options": ["Да, четыреста пакетов в секунду — ровно столько и ожидалось", "Нет, ожидалось вчетверо больше пакетов при такой частоте записей", "Нет, ожидалось около сорока пакетов в секунду вместо четырёхсот", "Да, но лишь при условии, что часть пакетов потерялась по дороге"], "correct": 0, "explain": "Шаг 1: четыре тысячи пакетов за десять секунд дают четыреста пакетов в секунду. Шаг 2: двадцать тысяч записей по пятьдесят штук в пакете дают те же четыреста пакетов. Шаг 3: числа сошлись, значит поток уходит целиком и терять записи по дороге пока негде.", "usage": {"code": true, "without": "Верят, что поток идёт полностью, ни разу это не проверив.", "with": "tcpdump -n -i br-lan 'udp and dst host 10.0.0.10' -c 4000", "benefit": "Расчёт подтверждён замером, а не принят на веру."}}, {"q": "Клиент отключился в 12:00:03.500 по журналу hostapd. Опорная точка та же: тик 1 000 000 000 соответствует 12:00:00.000, счётчик идёт на сорока мегагерцах. Где искать событие в логе прошивки?", "options": ["Около тика 1 350 000 000, окно плюс-минус двести тысяч тиков", "Около тика 1 003 500 000, окно плюс-минус пятьдесят тысяч тиков", "Около тика 1 140 000 000, окно плюс-минус два миллиона тиков", "Около тика 140 000 000, окно плюс-минус два миллиона тиков"], "correct": 2, "explain": "Шаг 1: от опорной точки прошло три с половиной секунды, что при сорока мегагерцах даёт сто сорок миллионов тиков. Шаг 2: прибавляем их к опорному тику и получаем 1 140 000 000. Шаг 3: запас в пятьдесят миллисекунд на разницу шкал — это два миллиона тиков в каждую сторону.", "usage": {"code": true, "without": "Ищут событие по всему журналу и тратят на это часы.", "with": "Время хоста переводят в тики и открывают журнал в нужном окне.", "benefit": "Событие находится в узком окне, а не перебором всего файла."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q.q) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
