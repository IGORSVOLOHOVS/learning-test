<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Английский для работы 2: просьбы и новые сокращения</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<style>
  .katex { font-size: 1.08em; }
  .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; }
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .qimg { margin: 0 0 12px; }
  .qimg a { display: block; max-width: 560px; }
  .qimg img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); }
  .qimg figcaption { margin-top: 4px; font-size: .72rem; color: var(--muted); }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>Английский для работы 2: просьбы и новые сокращения</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>

  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncMergeBtn">🔄 Синхронизировать (свежее побеждает)</button>
    <button class="btn secondary" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "english_work_2";
  const QUESTIONS = [{"q": "Коллега пишет: «BTW, the meeting moved to room 3B». Что значит BTW?", "options": ["Before the weekend — сделать до выходных", "Back to work — возвращаемся к делу", "Be there when — будь там к началу", "By the way — кстати, попутное замечание"], "correct": 3, "explain": "BTW = by the way, «кстати». Вводит побочную, но полезную новость; ответа обычно не ждут. Пишут и строчными: btw.", "usage": {"code": false, "without": "Ты читаешь BTW как срок «до выходных» и ищешь, что нужно сдать, хотя тебе просто сказали, что переговорка другая.", "with": "Ты видишь попутную новость и идёшь сразу в 3B.", "benefit": "Побочная новость не теряется и не пугает"}}, {"q": "Тимлид пишет: «LMK if you need access to the repo». Что от тебя ждут?", "options": ["Срочно подтвердить, что доступ к репозиторию у тебя уже есть", "Заполнить заявку на доступ и приложить её к ответному письму", "Отписаться в чате, что сообщение прочитано, и ждать доступа", "Написать, если доступ понадобится; если нет — можно не отвечать"], "correct": 3, "explain": "LMK = let me know, «дай знать». Это открытое предложение: обратись, когда будет нужно. Ответить «Thanks, will do» вежливо, но не обязательно.", "usage": {"code": false, "without": "Ты молча ждёшь, что доступ выдадут сами, и через два дня всё ещё не можешь открыть репозиторий.", "with": "Когда доступ нужен, ты пишешь: «Hi, I need access to the repo now, could you add me?» — и через час работаешь.", "benefit": "Помощь, которую предложили, ты действительно получаешь"}}, {"q": "Под твоим предложением коллега пишет: «I’d split it into two modules. WDYT?» Что он спрашивает?", "options": ["What did you try? — просит перечислить, что ты уже пробовал", "When do you test? — спрашивает, когда ты начнёшь тестировать", "Who decides, you or the team? — спрашивает, за кем решение", "What do you think? — просит твоё мнение о своей идее"], "correct": 3, "explain": "WDYT = what do you think, «как думаешь?». Ответ — твоё мнение с причиной: «Makes sense — the parser and the UI change at different speeds» или «I’d keep one module for now, because…».", "usage": {"code": false, "without": "Ты отвечаешь «OK» и не говоришь, что разделение сломает твой план; через неделю это всплывает на ревью.", "with": "Ты отвечаешь: «Good idea, but let’s split after the release — less risk». Решение принимается сразу.", "benefit": "Тебя спросили — и твоё мнение действительно учтено"}}, {"q": "В обсуждении бага: «FWIW, the old version handled this case fine». Как понимать FWIW?", "options": ["For work in writing — автор просит изложить всё письменно", "For what it’s worth — «если поможет»: наблюдение без нажима", "Final warning — автор предупреждает, что это блокирует релиз", "From what I wrote — автор ссылается на своё прошлое письмо"], "correct": 1, "explain": "FWIW = for what it’s worth, «к сведению, если это чего-то стоит». Смягчает реплику: человек делится фактом или мнением и не настаивает. Здесь это ценная подсказка: стоит сравнить старую и новую версии.", "usage": {"code": false, "without": "Ты принимаешь FWIW за строгое требование и бросаешь всё, чтобы откатиться на старую версию.", "with": "Ты понимаешь, что это подсказка, и сравниваешь старую и новую версии — разница находится за полчаса.", "benefit": "Мягкая подсказка не превращается ни в приказ, ни в шум"}}, {"q": "Письмо от отдела кадров: «Hiring for the team is frozen until FY27». Что такое FY?", "options": ["For your info — пометка «к сведению»", "Fiscal year — финансовый год компании", "Final year — последний год проекта", "Follow-up — следующая встреча по теме"], "correct": 1, "explain": "FY = fiscal year, финансовый год; FY27 — финансовый 2027-й. У многих компаний он не совпадает с календарным: начинается, например, 1 апреля или 1 июля, а номер одни считают по году начала, другие — по году конца. Не путать с FYI — for your information: у той на конце I. Похожие буквы, разный смысл.", "usage": {"code": false, "without": "Ты читаешь FY27 как «FYI, пункт 27», решаешь, что это просто к сведению, и ждёшь нового коллегу в январе.", "with": "Ты спрашиваешь: «When does FY27 start for us?» — и узнаёшь, с какого месяца найм откроется снова.", "benefit": "Две похожие аббревиатуры не сливаются в одну"}}, {"q": "Менеджер пишет: «Anna is the POC for the supplier». Что значит POC здесь?", "options": ["Proof of concept — Анна делает прототип для поставщика", "Point of contact — через Анну идёт всё общение с поставщиком", "Purchase order copy — у Анны лежит копия заказа поставщику", "Project owner’s coordinator — Анна помогает владельцу проекта"], "correct": 1, "explain": "POC бывает двух видов. Proof of concept — проверка идеи прототипом. Point of contact — контактное лицо. Решает контекст: «the POC for X», «who’s the POC?» — о человеке. Здесь речь о человеке и поставщике, значит, это контактное лицо.", "usage": {"code": false, "without": "Ты пишешь поставщику напрямую в обход Анны, и он получает от компании два разных ответа на один вопрос.", "with": "Ты пишешь Анне: «I have a question for the supplier, could you pass it on?» — ответ один и согласованный.", "benefit": "Одни и те же буквы прочитаны по смыслу, а не по привычке"}}, {"q": "В приглашении: «Venue: Riga office. Time: 10:00, TBC». Что значит TBC?", "options": ["Время предварительное, его ещё подтвердят", "Время окончательное, его уже не изменят", "Время указано по Гринвичу, нужен пересчёт", "Встреча отменена, новое время сообщат"], "correct": 0, "explain": "TBC = to be confirmed, «будет подтверждено»: обычно вариант уже есть, но не окончательный. TBD = to be determined/decided: варианта ещё нет. В британской переписке TBC пишут и там, где варианта нет совсем: «Speaker: TBC». «10:00, TBC» — ставь в календарь условно и жди подтверждения.", "usage": {"code": false, "without": "Ты переносишь на 10:00 другую встречу, а время потом меняют на 14:00, и ты теряешь оба слота.", "with": "Ты ставишь 10:00 как предварительное и ничего не двигаешь, пока не придёт «Confirmed: 10:00».", "benefit": "Предварительное не принимается за окончательное"}}, {"q": "Повестка встречи: «1. Q3 results 2. Hiring plan 3. AOB». Что значит пункт 3?", "options": ["Any other business — в конце можно поднять любой свой вопрос", "Action on budget — в конце встречи решают вопрос бюджета", "Approval of board — согласование решений с советом директоров", "Agenda of the boss — пункты, которые добавил руководитель"], "correct": 0, "explain": "AOB = any other business, «разное». Последний пункт повестки: ведущий спрашивает «Any other business?», и любой может поднять вопрос вне списка. Хороший момент, чтобы коротко спросить своё.", "usage": {"code": false, "without": "Ты молчишь всю встречу, а свой вопрос пишешь всем отдельным письмом, и ответа ждёшь неделю.", "with": "На AOB ты говоришь: «One quick thing: who should I ask about test bench access?» — и получаешь ответ сразу.", "benefit": "Свой вопрос решается на встрече, а не после неё"}}, {"q": "Письмо коллеге заканчивается: «Could you send me the spec? TIA». Что значит TIA?", "options": ["Time is approaching — срок поджимает", "Thanks in advance — заранее спасибо", "Take it anyway — пришли в любом виде", "Today if available — сегодня, если готово"], "correct": 1, "explain": "TIA = thanks in advance, «заранее спасибо». В чате с коллегой нормально. В просьбе к незнакомому человеку или руководителю звучит немного так, будто согласие уже получено, — там лучше полными словами: «Thanks a lot!» или «I’d really appreciate it».", "usage": {"code": false, "without": "Ты читаешь TIA как «срок поджимает» и дёргаешь коллегу через час, хотя срока не было.", "with": "Ты видишь простое «заранее спасибо» и отправляешь спецификацию, когда до неё доходят руки.", "benefit": "Вежливость не принимается за давление"}}, {"q": "Руководитель: «We’ll set up a KT session with Mark before he leaves the team». Что это будет?", "options": ["Knowledge transfer — Марк передаст тебе знания о своей части работы", "Kick-off talk — первая встреча по новому проекту, его ведёт Марк", "Key targets — встреча, на которой Марк назовёт цели квартала", "Keep track — Марк будет отслеживать твой прогресс по задачам"], "correct": 0, "explain": "KT = knowledge transfer, передача знаний: уходящий человек показывает, как устроена его часть, где что лежит и какие есть подводные камни. Готовь вопросы заранее и записывай: второго KT обычно не бывает.", "usage": {"code": false, "without": "Ты приходишь без вопросов, слушаешь час, а через неделю после ухода Марка не знаешь, где лежат ключи к тестовому стенду.", "with": "Ты приносишь список: «Where are the credentials? What breaks most often? Who do I ask when you’re gone?»", "benefit": "Знания уходящего человека остаются в команде"}}, {"q": "Статус коллеги в Teams: «WFH today». Что это значит?", "options": ["Сегодня в отпуске и на сообщения не отвечает", "Сегодня на больничном, писать только по срочному", "Сегодня работает из дома: на связи, но не в офисе", "Сегодня в другом филиале, в другом часовом поясе"], "correct": 2, "explain": "WFH = working from home, работает из дома. Он на связи в чате и на созвонах, но лично к нему подойти не получится.", "usage": {"code": false, "without": "Ты ждёшь его у стола, чтобы показать стенд, и теряешь полдня.", "with": "Ты пишешь: «Can we do a quick call instead?» — и показываешь стенд по камере.", "benefit": "Работа не ждёт личной встречи"}}, {"q": "Коллега пишет: «I’ll be on PTO next week». Что это значит?", "options": ["Part-time office — он будет в офисе только по полдня", "Project transfer order — его переводят на другой проект", "Paid time off — оплачиваемый отпуск, работать он не будет", "Post-trip onboarding — после поездки введёт тебя в курс дела"], "correct": 2, "explain": "PTO = paid time off, оплачиваемое время отдыха: отпуск или отгул. На сообщения в это время он не отвечает. Всё, что нужно от него, проси до отпуска или ищи того, кто его заменяет.", "usage": {"code": false, "without": "Ты откладываешь вопрос на следующую неделю, а он в отпуске, и задача стоит две недели.", "with": "Ты сразу спрашиваешь: «Before you go: who covers for you next week?»", "benefit": "Отпуск коллеги не останавливает твою работу"}}, {"q": "Руководитель предлагает: «Let’s have a 1:1 on Thursday». Что это за встреча?", "options": ["Встреча на один час ровно в час дня", "Встреча один на один: только ты и он", "Встреча, где каждый голосует один раз", "Встреча с одним пунктом и одним решением"], "correct": 1, "explain": "1:1 читается one-on-one: личная встреча руководителя и сотрудника, часто регулярная, раз в неделю или две. Говорят о задачах, трудностях, планах и развитии. Свою повестку лучше принести самому.", "usage": {"code": false, "without": "Ты приходишь на 1:1 без вопросов, полчаса уходит на «всё нормально», а проблема с доступами остаётся.", "with": "Ты приносишь три пункта: что сделано, где застрял, что хочешь изучить дальше.", "benefit": "Личное время с руководителем работает на тебя"}}, {"q": "В общем канале тебе пишут: «DM me the details, not here». Что сделать?", "options": ["Написать ему лично, а не в общий канал", "Записать детали в документ и дать на него ссылку", "Рассказать детали на ежедневной встрече команды", "Отправить детали менеджеру, а не ему самому"], "correct": 0, "explain": "DM = direct message, личное сообщение. Так просят, когда подробности не нужны всем или они личные, например пароль, оценка, жалоба.", "usage": {"code": false, "without": "Ты продолжаешь писать в общий канал, и сорок человек читают подробности, которые их не касаются.", "with": "Ты пишешь ему в личку, а в канал коротко: «Moved to DM».", "benefit": "Общий канал не засоряется, личное остаётся личным"}}, {"q": "Сообщение в канале: «ICYMI: the new VPN guide is in the wiki». Что значит ICYMI?", "options": ["I can’t make it — я не приду, начинайте без меня", "If changed, you must install — после смены поставь заново", "In case you missed it — на случай, если ты это пропустил", "I couldn’t yet manage it — у меня пока нет прав на вики"], "correct": 2, "explain": "ICYMI = in case you missed it, «если вдруг пропустил». Так повторяют важную новость, которая уже звучала. Стоит открыть ссылку: раз повторяют, значит, это нужно многим.", "usage": {"code": false, "without": "Ты решаешь, что это уже обсуждали без тебя, не открываешь руководство, а завтра не можешь подключиться к сети.", "with": "Ты открываешь вики и настраиваешь VPN, пока он ещё не понадобился.", "benefit": "Важное доходит со второго раза"}}, {"q": "В письме о работах на сервере: «NB: the server restarts at 02:00». Что значит NB?", "options": ["Не обязательно — эту строку можно пропустить", "Обрати особое внимание — это важное замечание", "Новый бэкап — сервер сделает резервную копию", "Не блокирует — работу можно не прерывать"], "correct": 1, "explain": "NB = nota bene, латынь: «заметь хорошо». Выделяет то, что легко пропустить, но важно. Здесь: если у тебя ночью идёт долгий прогон, в 02:00 он оборвётся.", "usage": {"code": false, "without": "Ты запускаешь ночной прогон на шесть часов, а утром видишь, что он оборвался в два ночи.", "with": "Ты переносишь прогон на утро или запускаешь его на другом сервере.", "benefit": "Пометка о важном работает как предупреждение, а не как шум"}}, {"q": "На созвоне коллега пишет в чат: «IMO we should postpone the release». Что это?", "options": ["In mandatory order — обязательное распоряжение, его выполняют", "Immediately, my order — приказ отложить релиз прямо сейчас", "In my opinion — его личное мнение, которое можно обсудить", "I’m moving on — он выходит из обсуждения релиза"], "correct": 2, "explain": "IMO = in my opinion, «по-моему». IMHO = in my humble opinion, «по моему скромному мнению» — формально мягче, на деле часто то же, что IMO. Это позиция, а не решение: с ней можно согласиться или спорить с аргументами.", "usage": {"code": false, "without": "Ты принимаешь IMO за решение и отменяешь подготовку к релизу, хотя руководитель ещё ничего не решил.", "with": "Ты отвечаешь: «I see your point, but the tests are green. What’s the main risk?» — и обсуждение идёт по существу.", "benefit": "Мнение обсуждается, а решение принимает тот, кто за него отвечает"}}, {"q": "Коллега признаётся: «TBH, I haven’t read the spec yet». Что значит TBH?", "options": ["To be handled — задачу возьмут в работу позже", "Time-boxed hour — на чтение спецификации отведён час", "To be held — спецификацию придержали до релиза", "To be honest — «честно говоря», откровенное признание"], "correct": 3, "explain": "TBH = to be honest, «честно говоря». Предупреждает, что дальше прямая, возможно неудобная правда. Сам можешь использовать, чтобы мягко сказать неприятное: «TBH, I don’t think we’ll make it by Friday».", "usage": {"code": false, "without": "Ты не понимаешь признания и продолжаешь обсуждать детали спецификации, которую коллега не читал.", "with": "Ты говоришь: «No worries — section 3 is the key part, it’s two pages». Разговор идёт дальше.", "benefit": "Прямота понимается и используется самому"}}, {"q": "Коллега пишет: «I’ll cc my manager on this email». Что это значит?", "options": ["Менеджер получит письмо вместо тебя и ответит сам", "Менеджер получит скрытую копию, и об этом никто не узнает", "Менеджер получит копию письма и будет видеть переписку", "Менеджер должен подписать письмо перед отправкой"], "correct": 2, "explain": "cc = carbon copy, копия: адресат в cc видит письмо, и все остальные видят, что он его получил. bcc = blind carbon copy, скрытая копия: другие получатели о ней не знают. Человек в cc обычно «в курсе», а отвечать должен тот, кто в To.", "usage": {"code": false, "without": "Ты пишешь в ответе что-то резкое, считая переписку личной, а её читает и менеджер коллеги.", "with": "Ты видишь менеджера в cc и пишешь так, как пишут при руководителе: по делу, со сроками.", "benefit": "Ты знаешь, кто читает переписку"}}, {"q": "Коллега пишет в чат: «AFK 15 min, brb». Что это значит?", "options": ["Закончил работу на сегодня, вернётся завтра утром", "Отошёл от компьютера на 15 минут, скоро вернётся", "Перезагружает компьютер, сообщения могут пропасть", "Занят на созвоне 15 минут, просит не беспокоить"], "correct": 1, "explain": "AFK = away from keyboard, «отошёл от клавиатуры». brb = be right back, «скоро вернусь». Писать ему можно, ответит минут через пятнадцать.", "usage": {"code": false, "without": "Ты решаешь, что он ушёл до завтра, и отдаёшь его вопрос другому человеку, а он через 15 минут спрашивает, где ответ.", "with": "Ты пишешь вопрос сейчас, и он отвечает, как только вернётся.", "benefit": "Короткий перерыв не превращается в потерянный день"}}, {"q": "Тебе нужен доступ к общей папке от сотрудницы другого отдела, вы не знакомы. Какая просьба звучит естественно и вежливо?", "options": ["Hi Laura, could you please give me access to the shared folder? Thanks a lot!", "Hi Laura, give me access to the shared folder, please. I need it right now.", "Laura, I want access to the shared folder. When will it be possible for me?", "Hello dear Laura, please be so kind to give me the access to folder."], "correct": 0, "explain": "Формула вежливой просьбы: приветствие + Could you (please)… + спасибо. Повелительное «give me» даже с please звучит как приказ, «I want» — как требование, а «be so kind to… the access» — калька с русского с тремя ошибками: нужно be so kind as to, access без the и the перед folder.", "usage": {"code": false, "without": "Ты пишешь «Give me access, please. I need it now», и незнакомая коллега откладывает просьбу до конца недели.", "with": "Ты пишешь «Hi Laura, could you please give me access…? Thanks a lot!» и получаешь доступ через час.", "benefit": "Незнакомый человек охотно помогает"}}, {"q": "Коллега спрашивает тебя: «Would you mind reviewing my PR?» Как ответить, если ты согласен?", "options": ["Yes, I would — send me the link.", "Yes, I mind — send me the link.", "Not at all — send me the link.", "I’m not mind — send me the link."], "correct": 2, "explain": "Would you mind…? буквально «ты не будешь возражать…?». Поэтому согласие — это «нет»: Not at all, No problem, или просто Sure, Happy to. Go ahead отвечает на другой вопрос — Would you mind if I…?, когда разрешаешь сделать что-то самому спросившему. «Yes, I would» значит «да, буду возражать» — отказ. «I’m not mind» — ошибка: mind — глагол, нужно I don’t mind.", "usage": {"code": false, "without": "Ты отвечаешь «Yes, I would!», желая сказать «да, конечно», и коллега идёт искать другого ревьюера.", "with": "Ты отвечаешь «Not at all, send me the link» — и тебя понимают однозначно.", "benefit": "Согласие не звучит как отказ"}}, {"q": "Коллега пишет: «I was wondering if you could help me with the test setup». Что это?", "options": ["Рассказ о прошлом: раньше он думал, сможешь ли ты помочь", "Сомнение в тебе: он не уверен, что ты справишься вообще", "Вежливая просьба о помощи — нынешняя, а не рассказ о прошлом", "Отмена просьбы: помощь была нужна, но он уже разобрался"], "correct": 2, "explain": "I was wondering if you could… — одна из самых вежливых форм просьбы. Прошедшее время здесь не про прошлое, а для мягкости: дистанция делает просьбу менее навязчивой. Похоже работают I wanted to ask… и Would it be possible to…?", "usage": {"code": false, "without": "Ты отвечаешь «Oh, and did you find out?», решив, что он рассказывает о прошлом, и он остаётся без помощи.", "with": "Ты отвечаешь: «Sure, I’m free after 2 — shall we do it then?»", "benefit": "Мягкая просьба слышна как просьба"}}, {"q": "Коллега пишет: «When you get a chance, could you look at my notes?» Насколько это срочно?", "options": ["Срочно: прямо сейчас, отложив текущую задачу", "Только если тебе выпадет шанс попасть на встречу", "Строго до конца сегодняшнего рабочего дня", "Не срочно: когда появится свободная минута"], "correct": 3, "explain": "When you get a chance = «когда будет возможность». Не срочно, но и не «никогда»: хорошо сделать в ближайший день-два. Ещё мягче: No rush, но… или …at some point. Срочно звучит иначе: as soon as possible, today, by 3 pm.", "usage": {"code": false, "without": "Ты бросаешь срочную задачу, чтобы прочитать заметки, и срываешь свой срок.", "with": "Ты дочитываешь заметки завтра утром и пишешь: «Looked at your notes — two small comments».", "benefit": "Срочность считывается правильно, свои сроки не горят"}}, {"q": "Письмо от заказчика: «Please send the signed contract at your earliest convenience». Как это понимать?", "options": ["«Когда будет удобно» — хоть через месяц", "«В удобный обоим день» — сначала согласуйте дату", "«Если удобно» — можно и вовсе не присылать", "Вежливое «как можно скорее»: тянуть не стоит"], "correct": 3, "explain": "At your earliest convenience — формальная, вежливая версия ASAP: «при первой возможности». Слово convenience сбивает: смысл не «когда тебе удобно», а «в первый же удобный момент». В деловой почте это просьба сделать при первой возможности, не откладывая.", "usage": {"code": false, "without": "Ты решаешь, что срока нет, отправляешь договор через две недели, а заказчик уже напоминал дважды.", "with": "Ты отправляешь договор в тот же день и коротко пишешь: «Please find the signed contract attached».", "benefit": "Вежливая настойчивость понята как настойчивость"}}, {"q": "Коллега употребил незнакомый термин «golden sample». Где просьба объяснить построена правильно?", "options": ["Sorry, what do you mean by “golden sample”?", "Sorry, what does mean “golden sample”?", "Explain me please what is “golden sample”.", "Sorry, how do you call “golden sample”?"], "correct": 0, "explain": "Правильно: What do you mean by X? или What does X mean? В вопросе нужен вспомогательный глагол: «what does mean» — ошибка. Explain me — частая калька: explain to me или просто explain. How do you call — тоже калька, по-английски What do you call…? и спрашивает о названии, а не о значении.", "usage": {"code": false, "without": "Ты спрашиваешь «What does mean golden sample?», тебя понимают, но в протоколе встречи это выглядит неуклюже.", "with": "Ты спрашиваешь «What do you mean by golden sample?» и получаешь объяснение: эталонный образец для сравнения.", "benefit": "Вопрос звучит естественно и не отвлекает от сути"}}, {"q": "Руководитель: «Please keep me in the loop on the supplier issue». Что от тебя хотят?", "options": ["Решать вопрос по кругу, пока не получится, и ничего ему не сообщать", "Звать его на каждую встречу и не начинать без него", "Держать его в курсе: добавлять в переписку и сообщать новости", "Не беспокоить его, пока вопрос не решится полностью"], "correct": 2, "explain": "Keep me in the loop = «держи меня в курсе»: копия писем, короткие обновления. Loop in Anna = добавить Анну в переписку. Out of the loop = не в курсе.", "usage": {"code": false, "without": "Ты решаешь вопрос сам и докладываешь через две недели; руководитель за это время узнаёт о проблеме от поставщика.", "with": "Ты ставишь его в cc и раз в пару дней пишешь: «Update: supplier confirmed the new date».", "benefit": "Руководитель ничего не узнаёт со стороны"}}, {"q": "Коллега пишет: «Can you hop on a quick call?» Что он предлагает?", "options": ["Перезвонить ему на мобильный вечером после работы", "Записать короткое голосовое сообщение вместо длинного письма", "Назначить созвон в календаре на следующую неделю", "Подключиться к короткому созвону сейчас или очень скоро"], "correct": 3, "explain": "Hop on a call = «подключиться к созвону», быстро и без подготовки. Quick — минут на 5–15. Если сейчас не можешь: «In 10 minutes?» или «Can it wait till 3?».", "usage": {"code": false, "without": "Ты отвечаешь «Sure, next week?», а у коллеги вопрос на пять минут, который блокирует его прямо сейчас.", "with": "Ты отвечаешь «Sure, give me 2 minutes» и подключаешься.", "benefit": "Короткий вопрос решается за пять минут, а не за неделю"}}, {"q": "Коллега пишет: «Could I pick your brain about the calibration?» Чего он хочет?", "options": ["Расспросить тебя и получить совет по калибровке", "Проверить твои знания по калибровке, как на экзамене", "Чтобы ты сам сделал за него всю калибровку", "Поспорить с тобой о калибровке на общей встрече"], "correct": 0, "explain": "Pick someone’s brain = «посоветоваться», расспросить того, кто разбирается. Звучит дружелюбно и неформально. Сам можешь так просить у опытных коллег: «Could I pick your brain for 10 minutes about the test bench?»", "usage": {"code": false, "without": "Ты решаешь, что тебя хотят проверить, нервничаешь и отвечаешь коротко и сухо.", "with": "Ты говоришь: «Sure, happy to help — what’s the problem?» и делишься опытом.", "benefit": "Обмен опытом идёт легко"}}, {"q": "Отчёт нужен в пятницу, а ты успеешь только к понедельнику. Как вежливо попросить перенести срок?", "options": ["Please give me more time because I am very busy right now with many other different tasks.", "Is it possible to delay the deadline on Monday? Because tests are not ready, sorry.", "Maybe I will send it on Monday, is it OK or no? Tests take more time than I thought.", "Would it be possible to move the deadline to Monday? I need one more day for the tests."], "correct": 3, "explain": "Хорошая просьба о переносе: мягкое Would it be possible… + новая конкретная дата + короткая причина. В «Please give me more time…» нет новой даты, а причина расплывчатая. В «delay the deadline on Monday» ошибка: нужно move it to Monday, а on Monday значит «в понедельник». «Is it OK or no?» — калька, по-английски Is that OK? или Would that work?", "usage": {"code": false, "without": "Ты молчишь до пятницы, а в пятницу пишешь «Sorry, not ready». Руководитель узнаёт о сдвиге последним.", "with": "Ты пишешь в среду: «Would it be possible to move it to Monday?» — и руководитель успевает перестроить план.", "benefit": "Перенос согласован заранее, а не случается сам"}}, {"q": "Три дня назад ты попросил коллегу прислать логи, ответа нет. Как напомнить, не звуча грубо?", "options": ["Hi Tom, why are you ignoring my request? I still have no logs from you at all.", "Hi Tom, just following up on my request from Monday — any update on the logs?", "Hi Tom, I am waiting your answer already three days, please answer me today.", "Hi Tom, sorry to disturb you again, but maybe you have forgotten about me?"], "correct": 1, "explain": "Just following up on… — стандартное нейтральное напоминание: без упрёка, с конкретикой. Также: Just checking in on…, Gentle reminder about…, Any update on…? «Why are you ignoring» обвиняет, «waiting your answer» — ошибка: waiting for, и звучит нетерпеливо; «maybe you have forgotten about me» — пассивная агрессия.", "usage": {"code": false, "without": "Ты пишешь «Why are you ignoring me?», Том обижается, логи приходят, но отношения испорчены.", "with": "Ты пишешь «Just following up on the logs», и Том отвечает: «Sorry, sending now!»", "benefit": "Напоминание работает и не портит отношения"}}, {"q": "Коллега просит сегодня помочь подготовить демо к пятнице, а ты сегодня занят срочной задачей. Какой ответ лучше?", "options": ["Sure, I’ll drop the urgent fix and help you with the demo right now, no problem.", "I’m afraid I can’t today — I’m on an urgent fix. Could tomorrow morning work?", "No. I’m busy with my own work today, so please ask somebody else instead.", "Maybe I will try later, but I can’t promise you anything about it."], "correct": 1, "explain": "Вежливый отказ: смягчение I’m afraid… + короткая причина + альтернатива. Согласиться, бросив срочную задачу, — сорвать её. Голое «No. I’m busy» звучит резко. Расплывчатое «maybe I will try» хуже честного отказа: человек не может планировать.", "usage": {"code": false, "without": "Ты отвечаешь «Maybe later», коллега ждёт до вечера и остаётся без помощи и без запасного плана.", "with": "Ты отвечаешь «Can’t today, tomorrow at 9?», коллега соглашается или ищет другого сразу.", "benefit": "Отказ честный и всё равно полезный"}}, {"q": "Руководитель спрашивает о задаче, и ты отвечаешь: «I’ll keep you posted». Что ты пообещал?", "options": ["Прислать итог один раз, когда всё полностью закончено", "Сообщать новости по мере того, как они появляются", "Писать ему только о проблемах, а об успехах молчать", "Отправить ему все документы по задаче обычной почтой"], "correct": 1, "explain": "Keep you posted = «буду держать в курсе»: сообщать о важном по ходу дела. Обещание нужно выполнять: короткое «Update: …» при каждом заметном изменении. Синонимы: I’ll keep you updated, I’ll let you know.", "usage": {"code": false, "without": "Ты пообещал держать в курсе и пропал на неделю; руководитель сам выясняет, что задача застряла.", "with": "Через два дня ты пишешь: «Update: the supplier confirmed, testing starts Thursday».", "benefit": "Обещание держать в курсе действительно держится"}}, {"q": "Тимлид: «Please update the ticket before the sync». Ты отвечаешь: «On it». Что ты сказал?", "options": ["Уже берусь за это", "Я на этом тикете не работаю", "Тикет уже на встрече, обсудим там", "Сделаю, если останется время"], "correct": 0, "explain": "On it = «уже занимаюсь». Похожие короткие ответы: Will do — «сделаю», Noted — «принял к сведению», Got it — «понял», Sounds good — «хорошо, договорились». On it обещает начать прямо сейчас — так что начни.", "usage": {"code": false, "without": "Ты отвечаешь «Noted», имея в виду «сделаю», тимлид не уверен, что ты возьмёшься, и делает сам.", "with": "Ты отвечаешь «On it» и через десять минут тикет обновлён.", "benefit": "Короткий ответ значит ровно то, что ты имел в виду"}}, {"q": "Встреча в 14:00. Коллега пишет: «Can we push the sync to 3 pm?» Что он просит?", "options": ["Ускорить встречу, чтобы закончить к 15:00", "Перенести встречу на час раньше, на 13:00", "Отменить встречу, если до 15:00 нет повестки", "Перенести встречу на 15:00, то есть на час позже"], "correct": 3, "explain": "Push (back) a meeting = перенести на более позднее время. Bring forward / move up = перенести на более раннее. Push to 3 pm — на 15:00. Reschedule — нейтрально «перенести». Cancel — отменить.", "usage": {"code": false, "without": "Ты слышишь «push» как «ускорить», приходишь в 13:00 и сидишь в пустой переговорке.", "with": "Ты отвечаешь «3 pm works for me» и двигаешь встречу в календаре.", "benefit": "Все приходят в одно и то же время"}}, {"q": "Менеджер в конце созвона: «Let’s touch base on Friday». Что он предлагает?", "options": ["Вернуться в пятницу на базу, в главный офис", "Начать в пятницу всё сначала, с самой основы", "Коротко свериться в пятницу, как идут дела", "Закрыть проект в пятницу окончательно"], "correct": 2, "explain": "Touch base = «свериться, коротко связаться»: быстрый разговор о статусе. Не подробная встреча, а «как дела, нужна ли помощь». Подготовь две-три строки: что сделано, что дальше, что мешает.", "usage": {"code": false, "without": "Ты готовишь к пятнице часовую презентацию, а менеджеру нужно пять минут и одна цифра.", "with": "Ты приходишь с тремя строками статуса, разговор занимает пять минут.", "benefit": "Подготовка соразмерна встрече"}}, {"q": "После ошибки в релизе тимлид пишет: «Going forward, please attach test results to every PR». Как это понимать?", "options": ["Только для следующего PR, дальше по-старому", "Перешли результаты тестов дальше, менеджеру", "Если продвинешься в работе, приложи итоги", "С этого момента так нужно делать всегда"], "correct": 3, "explain": "Going forward = «впредь, с этого момента». Так вводят новое правило. Похожее: from now on, moving forward. Не путать с forward an email — «переслать письмо».", "usage": {"code": false, "without": "Ты приложил результаты к одному PR и забыл, а через неделю ревьюер возвращает тебе три PR подряд.", "with": "Ты добавляешь результаты в шаблон своего PR, и они прикладываются каждый раз сами.", "benefit": "Новое правило выполняется, а не вспоминается"}}, {"q": "Первый созвон с новой командой, тебя просят представиться. Какой вариант правильный и естественный?", "options": ["Hi everyone, I’m Igor. I work in this team since today, and I will do the test tools.", "Hi everyone, I’m Igor. I’ve just joined the team, and I’ll be working on the test tools.", "Hi all, my name is Igor. I am a new worker here, and I will be engaged in the test tools.", "Hello, I’m Igor. I’ve just joined to the team, and I’ll be working on the test tools."], "correct": 1, "explain": "I’ve just joined the team — present perfect: событие только что, важно сейчас. Join без to: join the team. «I work… since today» — ошибка: с since нужен present perfect, а «do the test tools» неестественно. «A new worker» и «engaged in» — кальки, по-английски a new team member, I’ll be working on. Хорошо добавить, чем можешь помочь, и кого ты будешь спрашивать.", "usage": {"code": false, "without": "Ты говоришь «I work here since today», тебя понимают, но первая фраза звучит как ошибка, и ты сбиваешься.", "with": "Ты говоришь «I’ve just joined the team, I’ll be working on X. Happy to help with Y» и спокойно продолжаешь.", "benefit": "Первое впечатление о тебе — уверенный человек"}}, {"q": "Ты предлагаешь обсудить бюджет завтра. Где фраза построена правильно?", "options": ["Let’s discuss the budget tomorrow.", "Let’s discuss about the budget tomorrow.", "Let’s discuss on the budget tomorrow.", "Let’s make discussion of budget tomorrow."], "correct": 0, "explain": "Discuss — без предлога: discuss the budget. Частая ошибка из-за «обсудить о». С предлогом — существительное: a discussion about the budget или talk about the budget. «Make discussion» — калька, по-английски have a discussion.", "usage": {"code": false, "without": "Ты пишешь «discuss about» в каждом письме, и это первое, что замечают носители.", "with": "Ты пишешь «Let’s discuss the budget» или «Let’s talk about the budget» — и речь идёт о бюджете, а не о грамматике.", "benefit": "Частая ошибка исчезает из твоих писем"}}, {"q": "Коллега пишет тебе в личку: «Got a sec?» Что ему нужно?", "options": ["Спрашивает, дошло ли до тебя его последнее письмо по задаче", "Спрашивает, сколько секунд в среднем длится тест", "Спрашивает, есть ли у тебя минутка: хочет что-то спросить", "Просит тебя засечь время на сегодняшней встрече"], "correct": 2, "explain": "Got a sec? = Have you got a second? — «есть минутка?». Неформальное начало просьбы. Ответы: Sure, what’s up? Или: Give me 10 minutes. Похожее: Do you have a minute? Got a moment?", "usage": {"code": false, "without": "Ты отвечаешь «Yes, I got it», решив, что речь о письме, и коллега ждёт, пока ты поймёшь.", "with": "Ты отвечаешь «Sure, what’s up?» и выясняешь, что нужна помощь со стендом.", "benefit": "Короткий вопрос понятен с первого раза"}}, {"q": "Сегодня среда. Письмо: «ICYMI: Anna is on PTO next week. Tom is the POC for the supplier until she’s back. Please send her anything that needs her sign-off before COB Fri». Тебе нужна подпись Анны под актом. Что делать?", "options": ["Попросить Анну подписать до конца пятницы: потом она в отпуске", "Подождать следующей недели и попросить подпись у Анны", "Попросить подписать Тома: всю следующую неделю он заменяет Анну во всём", "Ничего не делать: письмо просто к сведению, действий не ждут"], "correct": 0, "explain": "Шаг 1: PTO next week — на следующей неделе Анны не будет. Шаг 2: Tom is the POC for the supplier — Том заменяет её только в общении с поставщиком, а не в подписях. Шаг 3: send her anything that needs her sign-off before COB Fri — всё, что требует её подписи, отправить ей до конца рабочего дня пятницы. COB = close of business, то же, что EOD. ICYMI — «если пропустил», а не «действий не нужно».", "usage": {"code": false, "without": "Ты ждёшь понедельника, Анна в отпуске, Том подписывать не вправе, акт лежит две недели.", "with": "В среду ты пишешь Анне: «Could you sign off the acceptance form by end of day Friday? I see you’re on PTO next week».", "benefit": "Подпись получена до отпуска"}}, {"q": "Ты по отдельности спросил двух коллег: «Would you mind sending me the calibration file?» Ann: «Not at all, sending now». Ben: «Actually, I would — it’s confidential, ask Kate». Что получилось?", "options": ["Оба ответа — отказы: «not at all» значит «ни в коем случае»", "Оба согласились: «I would» значит «я бы с радостью прислал»", "Анна отказала, а Бен согласен, но сначала просит спросить Кейт", "Анна согласилась и шлёт файл, а Бен отказал и предложил Кейт"], "correct": 3, "explain": "Шаг 1: Would you mind…? = «ты не против…?». Шаг 2: Not at all = «нисколько не против» — согласие, и sending now это подтверждает. Шаг 3: Actually, I would = «вообще-то против» — отказ, и причина (confidential) с адресом (ask Kate) это подтверждают. Итог: Анна шлёт, у Бена — нет.", "usage": {"code": false, "without": "Ты читаешь «Not at all» как отказ и пишешь Кейт, хотя файл уже идёт от Анны.", "with": "Ты благодаришь Анну: «Got it, thanks!» — и Кейт тревожить не нужно.", "benefit": "Ответы на «Would you mind» читаются без ошибок"}}, {"q": "Встреча стоит на 4 pm CET. Коллега пишет: «Can we push it by an hour?» Ты в Риге: в ноябре Рига — UTC+2, CET — UTC+1. Во сколько теперь встреча по твоему времени?", "options": ["В 17:00 по рижскому времени", "В 18:00 по рижскому времени", "В 16:00 по рижскому времени", "В 15:00 по рижскому времени"], "correct": 1, "explain": "Шаг 1: 4 pm CET = 16:00 UTC+1 = 17:00 по Риге, Рига на час впереди. Шаг 2: push by an hour = на час позже. Шаг 3: 17:00 + 1 = 18:00 по Риге. Ошибки: 17:00 — забыть перенос или забыть пояс; 16:00 — прочитать push как «раньше» после пересчёта; 15:00 — пересчитать пояс в обратную сторону и забыть про перенос.", "usage": {"code": false, "without": "Ты приходишь в 17:00, потому что сдвинул время, но забыл про пояс, и час сидишь один.", "with": "Ты пересчитываешь пояс, потом сдвигаешь на час и отвечаешь: «Works for me — 6 pm my time».", "benefit": "Ты на встрече вовремя"}}, {"q": "Утром у тебя три просьбы. A: «When you get a chance, could you review my doc?» B: «Please send the invoice at your earliest convenience». C: «No rush, but could you update the wiki at some point?» В каком порядке их делать?", "options": ["Сначала A, потом C, потом B", "Сначала C, потом B, потом A", "Сначала B, потом A, потом C", "Сначала C, потом A, потом B"], "correct": 2, "explain": "Шаг 1: at your earliest convenience — вежливое «как можно скорее», значит B первой. Шаг 2: when you get a chance — «когда будет возможность», не срочно, но в ближайшее время. Шаг 3: no rush… at some point — прямо сказано «не к спеху», значит C последней. Ловушка — слово convenience: оно звучит как «когда удобно», и B уезжает в конец.", "usage": {"code": false, "without": "Ты оставляешь счёт на конец недели, а бухгалтерия уже дважды напомнила.", "with": "Ты отправляешь счёт до обеда, после обеда смотришь документ, вики — в пятницу.", "benefit": "Срочное сделано первым, хотя звучало вежливо"}}, {"q": "Нужен доступ к тестовому стенду от инженера другой команды, вы не знакомы. Стенд нужен к четвергу, демо в пятницу. Какое сообщение лучше?", "options": ["Hi Jonas, I’m Igor, I’m new on Anna’s team. Could you give me access to the test bench by Thursday? We have a demo on Friday. Thanks!", "Hi Jonas, could you give me access to the test bench at some point? No rush at all, whenever you have some time. Thanks a lot!", "Jonas, I need access to the test bench by Thursday ASAP, the demo is on Friday and it can’t wait. Please do it today.", "Hello Jonas! I am Igor. Is it maybe somehow possible to get some kind of access for the demo, if it’s not a problem?"], "correct": 0, "explain": "Шаг 1: незнакомому человеку — приветствие и кто ты. Шаг 2: конкретная просьба с вежливым Could you… и сроком by Thursday. Шаг 3: короткая причина — demo on Friday. В варианте с «no rush» нет срока, и это прямо неправда: срок есть. Вариант с «ASAP… Please do it today» звучит как приказ. Вариант с «maybe somehow» не говорит, к чему доступ и когда.", "usage": {"code": false, "without": "Ты пишешь «access at some point, no rush», Йонас откладывает, и в четверг стенда нет.", "with": "Ты пишешь, кто ты, что нужно, к какому дню и зачем — и в среду доступ есть.", "benefit": "Просьба понятна с первого прочтения и выполнена в срок"}}, {"q": "Коллега пишет: «Can we touch base tmrw? I’m WFH, so let’s use Teams. NB: I’m AFK 12–1». Ты хочешь предложить время. Что ответить?", "options": ["Sure — how about 12:30 in the office?", "Sure — how about 12:30 on Teams?", "Sure — how about 2 pm in the office?", "Sure — how about 2 pm on Teams?"], "correct": 3, "explain": "Шаг 1: tmrw = tomorrow, WFH — он работает из дома, так что не в офисе, а в Teams. Шаг 2: AFK 12–1 — с 12 до 13 его не будет у компьютера, значит 12:30 не подходит. Шаг 3: остаётся время вне перерыва и в Teams — 2 pm on Teams. В остальных вариантах нарушено одно или оба условия.", "usage": {"code": false, "without": "Ты предлагаешь 12:30 в офисе, он не отвечает — он дома и на обеде.", "with": "Ты предлагаешь 2 pm в Teams, он сразу соглашается.", "benefit": "Встреча назначается с первого сообщения"}}, {"q": "Тебе пришло письмо: в To — ты, в cc — твой менеджер и рассылка на 20 человек. Тебе нужно лишь ответить отправителю: «Thanks, got it». Как ответить?", "options": ["Reply all — пусть все в cc увидят, что ты получил", "Reply — только отправителю: остальным это не нужно", "Forward — переслать всем двадцати в скрытой копии", "Reply менеджеру: раз он в cc, главный адресат он"], "correct": 1, "explain": "Шаг 1: кто должен знать? «Got it» нужно только отправителю. Шаг 2: cc — тем, кто «в курсе», им твоё подтверждение не нужно. Шаг 3: Reply all на 20 человек — лишнее письмо каждому, а в больших рассылках так начинаются цепочки reply-all. Reply all нужен, когда ответ важен всем.", "usage": {"code": false, "without": "Ты жмёшь Reply all, двадцать человек получают «Thanks, got it», а кто-то отвечает всем «Please remove me from this thread».", "with": "Ты отвечаешь только отправителю, остальные спокойно работают.", "benefit": "Почта коллег не засоряется"}}, {"q": "Итоги встречи: «Action items: Igor — update the test plan, EOW. Anna — supplier call, TBC. AOB: none». Что из этого следует для тебя?", "options": ["Вы с Анной вместе обновляете план тестов, и сдать его нужно сегодня до вечера", "Ты подтверждаешь Анне звонок поставщику, а план тестов она обновит сама", "Ты обновляешь план тестов к концу недели; звонок Анны пока не подтверждён", "Твой план тестов ещё не подтверждён, а звонок Анны уже назначен"], "correct": 2, "explain": "Шаг 1: action items — кто что делает после встречи; у тебя — update the test plan. Шаг 2: EOW = end of week, конец недели, а не дня. Шаг 3: Anna — supplier call, TBC — задача Анны, и она ещё не подтверждена. AOB: none — разного не было.", "usage": {"code": false, "without": "Ты решаешь, что EOW — это сегодня, бросаешь всё и сдаёшь план сырым к вечеру.", "with": "Ты ставишь себе задачу на пятницу и сдаёшь план, проверенный, в срок.", "benefit": "Каждый делает своё и к своему сроку"}}, {"q": "В пятницу, 20 ноября, коллега пишет: «I’m on PTO for two weeks from Monday, back on Dec 7. Ivan is covering for me». Тебе нужно его ревью до 1 декабря. Что делать?", "options": ["Попросить ревью сегодня, а если не успеет — договориться с Иваном", "Подождать: он вернётся 7 декабря, это раньше твоего срока", "Написать ему в отпуск: PTO значит, что он работает и на связи из дома", "Попросить Ивана сделать ревью уже после возвращения коллеги"], "correct": 0, "explain": "Шаг 1: отпуск с понедельника 23 ноября на две недели, возвращение 7 декабря — это позже 1 декабря. Шаг 2: последний рабочий день до отпуска — сегодня, пятница. Шаг 3: Ivan is covering for me — на время отпуска его подменяет Иван. Значит: попросить ревью сегодня или сразу идти к Ивану. После 7 декабря ревью уже не поможет: срок пройдёт.", "usage": {"code": false, "without": "Ты ждёшь возвращения коллеги, а 1 декабря срок сорван, ревью нет.", "with": "В пятницу ты пишешь: «Could you review it today? If not, I’ll ask Ivan». Ревью есть до срока.", "benefit": "Отпуск коллеги не срывает твой срок"}}, {"q": "Коллега в Лондоне (UTC+0 в ноябре), ты в Риге (UTC+2). Тебе нужны замеры к 15:00 по Риге: в 15:30 сдаёшь отчёт. Как попросить, назвав срок по его времени?", "options": ["Could you send the measurements by 1 pm your time? I need them for a report.", "Could you send the measurements by 3 pm your time? I need them for a report.", "Could you send the measurements by 5 pm your time? I need them for a report.", "Could you send the measurements by 2 pm your time? I need them for a report."], "correct": 0, "explain": "Шаг 1: Лондон на два часа позади Риги: UTC+0 против UTC+2. Шаг 2: 15:00 по Риге = 13:00 в Лондоне. Шаг 3: в его время это 1 pm. Ошибки: 3 pm — забыть пересчёт, 5 pm — сдвинуть в обратную сторону, 2 pm — посчитать разницу в час, как с CET. Срок «your time» снимает путаницу — человеку не надо считать.", "usage": {"code": false, "without": "Ты пишешь «by 3 pm», он присылает в 15:00 по Лондону — это 17:00 у тебя, отчёт уже ушёл без данных.", "with": "Ты пишешь «by 1 pm your time», замеры приходят к 15:00 по Риге.", "benefit": "Срок понят одинаково, хотя часы у вас разные"}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: работа над ошибками
    // не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  // Карточка вопроса: варианты, объяснение, пример. Общая для теста и для
  // «Работы над ошибками» / «Повторения», чтобы они не разошлись видом.
  function cardHtml(q, answered) {
    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += imageHtml(q.img);
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» ----
  // Отдельный проход только по вопросам с неисправленной ошибкой. Счёт теста
  // (state.answers) он не трогает: исправленная ошибка пишется в state.fixed.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = LTProgress.mistakes(state);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast("Ошибок не осталось — всё исправлено");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = "Работа над ошибками · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        if (ok) { state.fixed = state.fixed || {}; state.fixed[idx] = Date.now(); saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    const left = LTProgress.mistakes(state).length;
    blockLabel.textContent = "Работа над ошибками · итог";
    html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
    html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
    if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  // Картинка к вопросу (поле img из content/<slug>.json, путь от корня сайта).
  // Касание открывает её целиком: на телефоне так её можно увеличить.
  function imageHtml(img) {
    if (!img || !img.src) return "";
    const src = "../" + escapeAttr(img.src);
    let html = '<figure class="qimg"><a href="' + src + '" target="_blank" rel="noopener">';
    html += '<img src="' + src + '" alt="' + escapeAttr(img.alt) + '" loading="lazy"></a>';
    if (img.credit) html += '<figcaption>' + escapeHtml(img.credit) + '</figcaption>';
    return html + '</figure>';
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ")
      .replace(/\\[()\[\]]/g, " ").replace(/\\([a-zA-Z]+)/g, "$1").replace(/\s+/g, " ").trim();
  }

  // Формулы в тексте: \( ... \) в строке, \[ ... \] отдельной строкой (KaTeX,
  // файлы в vendor/katex). Знак $ разделителем не служит: в тестах по
  // ассемблеру и shell он означает константу и переменную. Код в <pre> и
  // <code> не трогается. Без KaTeX текст остаётся как есть.
  function typeset(el) {
    if (!el || typeof renderMathInElement !== "function") return;
    renderMathInElement(el, {
      delimiters: [
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false
    });
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
