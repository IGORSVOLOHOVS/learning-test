<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSP 2: Обобщённый корреляционный метод: задержки и сглаживание характеристик</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>DSP 2: Обобщённый корреляционный метод: задержки и сглаживание характеристик</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "dsp_generalised_correlation_method";
  const QUESTIONS = [{"q": "Автокорреляционная функция Rxx[m] дискретного сигнала x[n] строится как сумма произведений x[n] и x[n+m] по всем n. Что именно она показывает?", "options": ["Скорость убывания амплитуды сигнала с ростом номера отсчёта n", "Степень сходства сигнала с посторонним шумовым процессом той же длины", "Степень сходства сигнала с его собственной копией, сдвинутой на m отсчётов", "Суммарную энергию сигнала, накопленную только при нулевом сдвиге m"], "correct": 2, "explain": "Автокорреляция сравнивает форму сигнала x[n] с формой его же копии, сдвинутой на m отсчётов, и её значение растёт там, где сдвинутая копия похожа на оригинал; при m=0 она равна энергии сигнала, но это лишь частный случай общего определения. Сравнение с посторонним шумом и скорость убывания амплитуды к автокорреляции отношения не имеют (Proakis & Manolakis, гл. 2).", "usage": {"code": false, "without": "Студент путает автокорреляцию с обычной суммой квадратов отсчётов и не понимает, зачем в формуле сдвиг m.", "with": "Он видит в Rxx[m] меру самоподобия сигнала на каждом сдвиге и правильно читает график корреляции.", "benefit": "Верное понимание автокорреляции как основы для оценки задержки и спектра."}}, {"q": "Взаимная корреляционная функция Rxy[m] строится как сумма произведений x[n] и y[n+m] по всем n, где x и y — два разных сигнала. Что она показывает?", "options": ["Степень сходства двух разных сигналов при относительном сдвиге m между ними", "Степень сходства сигнала x самого с собой при сдвиге m отсчётов", "Суммарную мощность обоих сигналов, накопленную независимо от сдвига m", "Разность фаз двух сигналов на несущей частоте без учёта их формы"], "correct": 0, "explain": "Rxy[m] сравнивает форму x[n] с формой y[n], сдвинутой на m отсчётов, и её пик показывает сдвиг, при котором сигналы наиболее похожи; этим она отличается от автокорреляции, где оба ряда — один и тот же сигнал. Суммарная мощность и разность фаз на одной частоте — другие величины, не связанные напрямую с Rxy (Oppenheim & Schafer, гл. 2).", "usage": {"code": false, "without": "Инженер путает автокорреляцию и взаимную корреляцию и пытается найти задержку между датчиками по Rxx одного канала.", "with": "Он строит именно Rxy между двумя каналами и находит сдвиг по её пику.", "benefit": "Верный выбор функции корреляции для сравнения двух разных сигналов."}}, {"q": "Для автокорреляции сигнала известно неравенство |Rxx[m]| ≤ Rxx[0] при любом лаге m. Что это означает?", "options": ["Автокорреляция линейно убывает с ростом m и обращается в нуль при больших сдвигах", "Автокорреляция на отрицательных лагах всегда превышает её значение на положительных", "Автокорреляция периодического сигнала равна нулю при любом ненулевом сдвиге m", "Автокорреляция при нулевом сдвиге не меньше её значения на любом другом лаге"], "correct": 3, "explain": "Неравенство |Rxx[m]| ≤ Rxx[0] означает, что значение автокорреляции при нулевом сдвиге — самое большое из всех, то есть сигнал никогда не бывает более похож на свою сдвинутую копию, чем сам на себя без сдвига. Линейное убывание к нулю, асимметрия по знаку лага и обнуление при периодическом сигнале — частные случаи, не следующие из общего неравенства (Proakis & Manolakis, гл. 2).", "usage": {"code": false, "without": "Студент видит боковой максимум Rxx выше значения при m=0 и не понимает, что это признак ошибки в расчёте.", "with": "Он знает, что Rxx[0] обязана быть наибольшей, и сразу замечает ошибку в своём коде корреляции.", "benefit": "Быстрая проверка правильности расчёта автокорреляции по одному неравенству."}}, {"q": "По конечной выборке из N отсчётов автокорреляцию оценивают либо с делителем N, либо с делителем N−|m|. Первую оценку называют смещённой. Что означает термин «смещённая» в этом контексте?", "options": ["Оценка определена только для положительных лагов m и не годится для отрицательных", "Оценка в среднем отличается от истинного значения Rxx[m] на каждом лаге m", "Оценка вычисляется по сдвинутой относительно начала записи выборке отсчётов", "Оценка требует предварительного вычитания среднего значения сигнала перед делением"], "correct": 1, "explain": "Смещённая оценка с делителем N в среднем даёт не Rxx[m], а Rxx[m]·(1−|m|/N), то есть её математическое ожидание систематически отличается от истинной корреляции — это и есть смещение в статистическом смысле. Термин не связан ни со знаком лага, ни со сдвигом самой выборки во времени, ни с вычитанием среднего (Proakis & Manolakis, гл. 14).", "usage": {"code": false, "without": "Студент слышит «смещённая оценка» и думает, что речь о сдвиге сигнала во времени, а не о статистике оценки.", "with": "Он понимает смещение как систематическое отклонение среднего значения оценки от истинной корреляции.", "benefit": "Верное понимание термина не даёт спутать статистическое смещение со сдвигом сигнала."}}, {"q": "Корреляционная теорема связывает взаимный спектр Sxy(ω) с определённой операцией во временной области. Как определяется Sxy(ω)?", "options": ["Как отношение преобразования Фурье выхода к преобразованию Фурье входа системы", "Как свёртка преобразований Фурье автокорреляций Rxx[m] и Ryy[m]", "Как преобразование Фурье от взаимной корреляционной функции Rxy[m]", "Как произведение преобразований Фурье сигналов x[n] и y[n] без сопряжения"], "correct": 2, "explain": "По корреляционной теореме взаимный спектр — это преобразование Фурье взаимной корреляционной функции, Sxy(ω) = Σ Rxy[m]·e^{−jωm}, и его можно также выразить как X*(ω)·Y(ω) с сопряжением одного из спектров. Простое произведение без сопряжения отвечает свёртке, а не корреляции, а отношение Y/X — это оценка частотной характеристики, другая величина (Proakis & Manolakis, гл. 4).", "usage": {"code": false, "without": "Инженер ищет взаимный спектр как произведение X·Y без сопряжения и получает неверный знак фазы задержки.", "with": "Он вспоминает, что Sxy — это ДПФ от Rxy, и берёт X*·Y с правильным сопряжением.", "benefit": "Верное определение взаимного спектра как основа для оценки задержки по фазе."}}, {"q": "Для линейной дискретной системы с импульсной характеристикой h[n] взаимная корреляция входа и выхода связана с автокорреляцией входа соотношением Rxy[m] = h[m] * Rxx[m]. Как эта формула обычно используется на практике?", "options": ["Для оценки импульсной характеристики канала по измеренным входу и выходу", "Для определения периода дискретизации, при котором система остаётся линейной", "Для расчёта энергии выходного сигнала по известной энергии входного сигнала", "Для проверки устойчивости системы по знаку автокорреляции входа на нулевом лаге"], "correct": 0, "explain": "Формула Rxy = h*Rxx выражает взаимную корреляцию как свёртку импульсной характеристики с автокорреляцией входа, поэтому, зная Rxy и Rxx по измерениям, можно найти h[n] — в этом состоит практическая идентификация канала. Энергия выхода, устойчивость и период дискретизации из этого соотношения напрямую не определяются (Proakis & Manolakis, гл. 12).", "usage": {"code": false, "without": "Инженер не знает этой связи и пытается определить импульсную характеристику канала на глаз по осциллограмме.", "with": "Он измеряет Rxy и Rxx и получает h[n] по известному соотношению.", "benefit": "Основа метода идентификации ЛДС по корреляциям входа и выхода."}}, {"q": "Белый шум как тестовый сигнал отличают по форме его автокорреляционной функции. Как выглядит Rxx[m] для идеального дискретного белого шума?", "options": ["Синусоида той же частоты, что и доминирующая составляющая в спектре шума", "Постоянная величина, одинаковая на всех лагах m от минус до плюс бесконечности", "Треугольная функция, линейно убывающая от максимума при m=0 до нуля на краях записи", "Дельта-функция, ненулевая только при m=0 и равная нулю на всех остальных лагах"], "correct": 3, "explain": "У идеального белого шума отсчёты некоррелированы между собой, поэтому автокорреляция равна σ²·δ[m] — ненулевое значение только при нулевом лаге; именно это делает белый шум удобным тестовым сигналом для оценки импульсной характеристики. Треугольная, синусоидальная и постоянная формы отвечают другим, не белым, процессам (Oppenheim & Schafer, гл. 2).", "usage": {"code": false, "without": "Студент подаёт на вход канала произвольный шум, не проверив его спектр, и получает смазанную оценку импульсной характеристики.", "with": "Он проверяет, что Rxx его тестового шума близка к дельта-функции, и уверенно применяет формулу Rxy = h*Rxx.", "benefit": "Понимание, что делает шум «белым» и пригодным для прямой оценки h[n]."}}, {"q": "Обобщённый корреляционный метод Кнаппа-Картера оценивает задержку между двумя каналами не по обычной взаимной корреляции, а по взвешенной. В чём общая идея метода?", "options": ["Задержку оценивают только по фазе автоспектра одного канала, без второго сигнала", "Взаимный спектр умножают на весовую функцию и лишь потом переходят во временную область", "Взаимную корреляцию заменяют автокорреляцией одного из каналов перед поиском пика", "Оба канала предварительно фильтруют одним и тем же полосовым фильтром без учёта весовых функций"], "correct": 1, "explain": "В методе Кнаппа-Картера сначала вычисляют взаимный спектр Sxy(ω), умножают его на весовую функцию ψ(ω) — конкретный выбор ψ даёт PHAT, SCOT или ML-вес — и только затем берут обратное преобразование Фурье, получая обобщённую взаимную корреляцию с более острым пиком. Замена на автокорреляцию или использование только одного канала не соответствует определению метода (Knapp & Carter, 1976).", "usage": {"code": false, "without": "Инженер использует обычную взаимную корреляцию и получает широкий, размытый пик задержки.", "with": "Он применяет обобщённый корреляционный метод с подходящим весом и получает узкий, чёткий пик.", "benefit": "Общая схема метода как основа для выбора конкретного веса под задачу."}}, {"q": "Простейший способ оценить задержку D между двумя каналами — найти положение пика взаимной корреляции Rxy[m]. На чём основан этот способ?", "options": ["Пик взаимной корреляции указывает не на задержку, а на отношение сигнал/шум в канале при записи", "Положение пика взаимной корреляции зависит только от длины записи N, а не от задержки", "Пик взаимной корреляции приходится именно на сдвиг, равный истинной задержке между сигналами", "Взаимная корреляция всегда максимальна ровно при нулевом сдвиге m, независимо от задержки"], "correct": 2, "explain": "Если y[n] — задержанная копия x[n], то x и сдвинутая на m копия y максимально похожи именно при m, равном истинной задержке D, и в этой точке Rxy[m] достигает максимума. Пик не обязан находиться при нулевом сдвиге, не характеризует SNR напрямую и зависит от свойств сигналов и задержки, а не только от длины записи (Proakis & Manolakis, гл. 2).", "usage": {"code": false, "without": "Студент ищет задержку между IMU и энкодером, глядя на значение Rxy при m=0, и получает неверный результат.", "with": "Он ищет именно положение максимума Rxy по всем m и получает верную оценку задержки.", "benefit": "Правильное чтение графика взаимной корреляции для оценки задержки."}}, {"q": "В методе Уэлча запись сигнала делят на несколько сегментов, для каждого считают периодограмму и затем усредняют полученные оценки спектра. Зачем нужно это усреднение?", "options": ["Чтобы снизить дисперсию оценки спектра ценой худшего разрешения по частоте", "Чтобы избавиться от эффекта наложения спектров при частоте дискретизации fs", "Чтобы увеличить разрешение по частоте по сравнению с одной периодограммой всей записи", "Чтобы устранить необходимость применять к сегментам весовое окно перед ДПФ"], "correct": 0, "explain": "Периодограмма отдельного сегмента — очень шумная оценка спектра, а усреднение нескольких примерно независимых сегментов снижает эту дисперсию; расплатой служит худшее разрешение, поскольку каждый сегмент короче всей записи. Разрешение при этом не растёт, окно к сегментам обычно всё же применяют, а наложение спектров устраняется выбором частоты дискретизации, а не усреднением (Proakis & Manolakis, гл. 14).", "usage": {"code": false, "without": "Инженер строит одну периодограмму по всей записи и получает изрезанную, ненадёжную кривую спектра.", "with": "Он делит запись на сегменты методом Уэлча и получает гладкую усреднённую оценку спектра.", "benefit": "Понимание цели усреднения как инструмента снижения дисперсии оценки."}}, {"q": "Автокорреляцию по N отсчётам можно оценить, деля сумму произведений x[n]·x[n+m] на N либо на N−|m|. Первая оценка смещённая, вторая несмещённая. Почему при спектральном оценивании обычно предпочитают смещённую?", "options": ["Смещённая оценка сходится к истинной корреляции быстрее на любом лаге, поскольку её смещение убывает пропорционально квадрату длины записи", "Смещённая оценка неотрицательно определена, её преобразование Фурье не даёт отрицательного спектра, а дисперсия не растёт на больших лагах", "Несмещённая оценка определена лишь для лагов до половины длины записи, тогда как смещённая покрывает все лаги вплоть до N−1 включительно", "Несмещённая оценка требует предварительно вычесть среднее значение сигнала, тогда как смещённая корректно работает и без центрирования записи"], "correct": 1, "explain": "Смещённая оценка равна истинной r[m], умноженной на треугольное окно 1−|m|/N с неотрицательным спектром, поэтому периодограмма всегда ≥ 0; у несмещённой делитель N−|m| на больших лагах стремится к нулю, и дисперсия там резко растёт. Смещение первой убывает как |m|/N, а не квадратично, обе оценки определены для |m| ≤ N−1 и обе требуют центрирования (Proakis, гл. 14.1).", "usage": {"code": false, "without": "Инженер берёт несмещённую оценку корреляции, строит по ней спектр канала и получает отрицательную мощность на части частот, не понимая, где ошибка.", "with": "Он выбирает смещённую оценку или ограничивает число лагов, спектр остаётся неотрицательным, а хвост корреляции не зашумлён.", "benefit": "Корректный неотрицательный спектр без артефактов на больших лагах."}}, {"q": "Корреляционная теорема: взаимной корреляции соответствует взаимный спектр Sxy = X*·Y, а свёртке — простое произведение X·Y. Откуда во взаимном спектре берётся комплексное сопряжение?", "options": ["Корреляция нормируется на энергию первого сигнала, и сопряжение его спектра как раз и обеспечивает нужное деление на квадрат модуля |X|²", "Корреляция требует усреднения по ансамблю реализаций, и сопряжение спектра заменяет собой операцию взятия математического ожидания", "Корреляция равна свёртке одного сигнала с обращённым во времени другим, а обращение времени вещественной последовательности сопрягает её спектр", "Корреляция определена только для вещественных последовательностей, и сопряжение нужно, чтобы произведение спектров осталось чисто вещественным"], "correct": 2, "explain": "r_xy[m] = Σ x[n]·y[n+m] есть свёртка y[m] с x[−m]; для вещественной x спектр последовательности x[−m] равен X*(ω), отсюда Sxy = X*·Y. Произведение X*·Y комплексно и несёт фазу, то есть задержку между каналами, поэтому вариант про вещественность результата неверен (Proakis, гл. 4.4).", "usage": {"code": false, "without": "Студент перемножает два спектра без сопряжения, получает сумму фаз вместо разности и ошибается в знаке задержки между каналами.", "with": "Он сопрягает спектр опорного канала, и фаза взаимного спектра равна −ωD с правильным знаком.", "benefit": "Верная фаза взаимного спектра и правильный знак задержки."}}, {"q": "Для ЛДС взаимная корреляция входа и выхода равна свёртке импульсной характеристики с автокорреляцией входа: Rxy = h * Rxx. Почему при белом шуме на входе эта формула сразу даёт h[m] без деконволюции?", "options": ["Потому что автокорреляция белого шума равна σ²·δ[m], а свёртка с дельта-последовательностью воспроизводит h[m] с множителем σ²", "Потому что белый шум имеет нулевое среднее, и слагаемые свёртки с ненулевым лагом взаимно уничтожаются при усреднении по записи", "Потому что выход системы при белом шуме на входе совпадает с её импульсной характеристикой с точностью до постоянного масштаба", "Потому что спектр белого шума плоский, и деление взаимного спектра на него меняет только фазу оценки, но не её модуль"], "correct": 0, "explain": "Свёртка h с σ²·δ[m] даёт σ²·h[m], поэтому Rxy[m]/σ² — готовая оценка импульсной характеристики. Сам выход при шумовом входе — случайный процесс, а не h[m]; нулевое среднее шума к форме свёртки отношения не имеет, а деление на плоский спектр меняет лишь масштаб (Proakis, гл. 12.2).", "usage": {"code": false, "without": "Инженер подаёт на привод синус, снимает взаимную корреляцию входа и выхода и удивляется, что она не похожа на импульсную характеристику.", "with": "Он подаёт широкополосный шум или MLS, и взаимная корреляция даёт h[m] напрямую, без деления спектров.", "benefit": "Импульсная характеристика канала одной корреляцией без деконволюции."}}, {"q": "В обобщённом корреляционном методе Кнаппа-Картера взаимный спектр умножают на весовую функцию ψ(ω) и только потом переходят во временную область. Что делает с оценкой задержки взвешивание PHAT с ψ = 1/|Sxy|?", "options": ["Делит взаимный спектр на произведение автоспектров обоих каналов, приводя их к одинаковой энергии перед вычислением взаимной корреляции", "Усредняет взаимный спектр по соседним частотным отсчётам, снижая дисперсию положения пика за счёт ухудшения разрешения по частоте", "Подавляет частоты с низкой когерентностью между каналами, чтобы полосы с преобладанием шума не участвовали в формировании корреляционного пика задержки", "Выравнивает модуль взаимного спектра до единицы и оставляет только фазу, поэтому пик сужается к дельта-импульсу независимо от спектра сигнала"], "correct": 3, "explain": "После PHAT остаётся e^{−jωD}, обратное преобразование которого — идеальный дельта-импульс в точке D, поэтому пик не размывается спектром сигнала и не становится периодическим. Все частоты входят с равным весом, поэтому в шумовых полосах PHAT уступает ML-взвешиванию; деление на √(Sxx·Syy) — это SCOT, а не PHAT (Knapp & Carter 1976).", "usage": {"code": false, "without": "В реверберирующем цехе пик обычной взаимной корреляции между двумя микрофонами широкий и двоится, оценка задержки плавает.", "with": "Инженер включает PHAT-взвешивание, пик становится острым, задержка читается однозначно.", "benefit": "Острый однозначный пик задержки независимо от спектра сигнала."}}, {"q": "Весовая функция максимального правдоподобия в методе Кнаппа-Картера имеет вид ψ_ML = γ²/(|Sxy|·(1−γ²)), где γ² — когерентность каналов. Чем она принципиально отличается от PHAT?", "options": ["Она сглаживает взаимный спектр лаговым окном по частоте, чтобы уменьшить дисперсию фазы перед обратным преобразованием Фурье", "Она дополнительно взвешивает каждую частоту по когерентности, усиливая полосы с высоким отношением сигнал/шум и подавляя шумовые", "Она отказывается от нормировки модуля взаимного спектра и сохраняет исходные амплитуды всех спектральных составляющих сигнала", "Она заменяет фазу взаимного спектра фазой автоспектра опорного канала, устраняя влияние задержки на форму корреляционного пика"], "correct": 1, "explain": "ψ_ML содержит тот же множитель 1/|Sxy|, что и PHAT, но умножает его на γ²/(1−γ²): при γ² → 1 вес растёт, при γ² → 0 частота практически исключается. PHAT весит все частоты одинаково, поэтому в полосах с низким SNR даёт большую дисперсию оценки (Knapp & Carter 1976).", "usage": {"code": false, "without": "Инженер применяет PHAT к сигналу датчика, у которого половина полосы забита шумом привода, и оценка задержки скачет от записи к записи.", "with": "Он берёт ML-веса по измеренной когерентности, шумовые полосы обнуляются, разброс оценки падает.", "benefit": "Минимальная дисперсия оценки задержки при частотно-зависимом шуме."}}, {"q": "Задержку D между двумя каналами можно найти по положению пика взаимной корреляции либо по наклону фазы взаимного спектра arg Sxy(ω) ≈ −ωD. В чём ключевое различие этих двух оценок?", "options": ["Оценка по пику требует предварительного отбеливания обоих каналов, а оценка по наклону фазы работает с исходными неотбелёнными сигналами", "Оценка по пику даёт задержку только с точностью до знака, тогда как оценка по наклону фазы определяет ещё и направление сдвига одного канала относительно другого", "Оценка по наклону фазы даёт дробную задержку без интерполяции, но страдает от заворота фазы на 2π и шума в полосах с низкой когерентностью", "Оценка по наклону фазы применима только к периодическим сигналам, а оценка по пику требует от сигнала лишь конечной энергии на записи"], "correct": 2, "explain": "Наклон линейной регрессии фазы по частоте — это задержка в долях отсчёта, но фазу нужно развернуть, а точки с низкой γ² исключить; положение отсчёта пика корреляции даёт целое число отсчётов, зато однозначно и без разворота фазы. Знак задержки виден в обоих методах: пик лежит справа или слева от нуля (Proakis, гл. 4.4).", "usage": {"code": false, "without": "Студент ищет задержку по пику и получает ровно 3 отсчёта, хотя реальная задержка 3,4, и выравнивание каналов IMU остаётся неточным.", "with": "Он строит фазу взаимного спектра, разворачивает её и по наклону получает 3,4 отсчёта.", "benefit": "Дробная задержка для точного выравнивания каналов по времени."}}, {"q": "Два датчика принимают один и тот же широкополосный сигнал в аддитивном белом шуме. От чего зависит дисперсия оценки задержки по пику взаимной корреляции согласно границе Крамера-Рао?", "options": ["Убывает с ростом длины записи, отношения сигнал/шум и эффективной ширины полосы сигнала, то есть остроты корреляционного пика", "Убывает только с ростом отношения сигнал/шум, а длина записи и полоса сигнала влияют лишь на смещение оценки задержки", "Зависит от частоты дискретизации и не меняется при удлинении записи, если полоса сигнала остаётся фиксированной", "Растёт с длиной записи, так как при накоплении отсчётов в сумму попадает всё больше произведений шумовых выборок обоих каналов"], "correct": 0, "explain": "При высоком SNR граница Крамера-Рао даёт var(D̂) ∝ 1/(T·SNR·β²), где T — длительность записи, β — среднеквадратичная ширина полосы: длинная запись усредняет шум, широкая полоса делает пик острым. Длина записи снижает именно дисперсию, а не смещение, а частота дискретизации сама по себе в границу не входит (Knapp & Carter 1976).", "usage": {"code": false, "without": "Инженер пытается точнее выровнять каналы, поднимая частоту дискретизации, но разброс оценки задержки не уменьшается.", "with": "Он удлиняет запись и расширяет полосу тестового сигнала, разброс оценки падает в разы.", "benefit": "Понимание, какие параметры реально уменьшают ошибку задержки."}}, {"q": "Почему в методе Welch запись делят на перекрывающиеся сегменты и усредняют их периодограммы, вместо того чтобы вычислить одну периодограмму по всей записи?", "options": ["Потому что одна длинная периодограмма имеет слишком узкий главный лепесток и потому не различает близко расположенные спектральные линии", "Потому что ДПФ всей записи требует длины, равной степени двойки, а сегментация со сдвигом позволяет обойти это ограничение", "Потому что перекрытие сегментов удлиняет эффективную запись и поднимает разрешение по частоте выше предела fs/N для всей записи", "Потому что дисперсия периодограммы не убывает с ростом N, а усреднение K сегментов снижает её примерно в K раз ценой разрешения"], "correct": 3, "explain": "Периодограмма — несостоятельная оценка: её дисперсия стремится к S²(ω) и не уменьшается при удлинении записи; усреднение K почти независимых сегментов делит дисперсию примерно на K, но сегмент длиной N/K даёт разрешение около K·fs/N. Перекрытие лишь возвращает часть данных, ослабленных окном, и разрешения не повышает (Proakis, гл. 14.2).", "usage": {"code": false, "without": "Инженер снимает АЧХ канала по одной периодограмме длинной записи и получает зубчатую кривую с разбросом ±5 дБ.", "with": "Он усредняет 32 сегмента с окном Hann и перекрытием 50 %, кривая становится гладкой при достаточном разрешении.", "benefit": "Гладкая АЧХ с контролируемым компромиссом дисперсия/разрешение."}}, {"q": "В методе Блэкмана-Тьюки оценку автокорреляции умножают на лаговое окно w[m] длиной 2M+1 при M ≪ N и затем берут преобразование Фурье. Каков механизм сглаживания спектра в этом методе?", "options": ["Окно вычитает из корреляции её среднее значение по лагам, устраняя постоянную составляющую спектра и связанную с ней утечку", "Умножение корреляции на окно равно свёртке периодограммы со спектром окна, то есть усреднению по соседним частотам шириной порядка 1/M", "Обнуление корреляции на больших лагах убирает шумовую составляющую, поскольку шум коррелирован только на лагах, превышающих M отсчётов записи", "Окно дополняет корреляцию нулями до длины записи N, что при преобразовании Фурье интерполирует спектр между соседними отсчётами"], "correct": 1, "explain": "Произведение во времени — свёртка по частоте: спектр оценки равен периодограмме, свёрнутой с W(ω), и каждое значение усредняется по полосе шириной около 2π/M, что снижает дисперсию примерно в M/N раз ценой разрешения. Окно должно иметь неотрицательный спектр, например Бартлетта, иначе сглаженная оценка может стать отрицательной (Proakis, гл. 14.2).", "usage": {"code": false, "without": "Инженер берёт полную корреляцию до лага N−1, и спектр получается таким же шумным, как обычная периодограмма.", "with": "Он оставляет M = N/10 лагов под окном Бартлетта, спектр гладкий и неотрицательный.", "benefit": "Управляемое сглаживание спектра одним параметром M."}}, {"q": "Окна Hann и Hamming одной длины N имеют одинаковую ширину главного лепестка, примерно 8π/N. В чём различие их спектров, влияющее на выбор окна для сглаживания частотной характеристики?", "options": ["У Hamming боковые лепестки спадают быстрее, примерно на 18 дБ на октаву, тогда как у Hann первый боковой лепесток ниже, около −41 дБ против −31 дБ", "У Hann главный лепесток заметно уже по уровню половинной мощности, тогда как у Hamming существенно ниже утечка на удалённых от пика частотах", "У Hamming первый боковой лепесток ниже, около −41 дБ против −31 дБ, но дальние лепестки спадают медленнее, 6 дБ на октаву против 18", "У Hann окно не обращается в нуль на краях сегмента, а у Hamming обращается, поэтому Hamming сильнее подавляет разрыв на границах сегмента"], "correct": 2, "explain": "Hamming подобран так, чтобы погасить первый боковой лепесток до −41 дБ, но его края не нулевые, поэтому дальние лепестки убывают лишь на 6 дБ/окт; Hann с нулевыми краями имеет первый лепесток −31 дБ и спад 18 дБ/окт. Hamming лучше против близкой сильной помехи, Hann — для широкого динамического диапазона на удалении (Oppenheim & Schafer, гл. 7.5).", "usage": {"code": false, "without": "Студент ставит Hamming, чтобы увидеть слабый резонанс далеко от сильной линии привода, и его прячет медленно спадающая утечка.", "with": "Он переключается на Hann, дальняя утечка падает на 18 дБ/окт, резонанс становится виден.", "benefit": "Осознанный выбор окна под близкую или далёкую помеху."}}, {"q": "Вы записали N = 2000 отсчётов шума канала энкодера и хотите оценить автокорреляцию Rxx[m] до лага m = 500, чтобы затем получить спектр через FFT. Какую оценку по конечной выборке выбрать и почему?", "options": ["Несмещённую с делителем N: смещение на любом лаге равно нулю, а дисперсия минимальна среди всех оценок", "Смещённую с делителем N − |m|: смещение растёт с лагом, зато дисперсия при m, близком к N, падает до нуля", "Несмещённую с делителем N − |m|: её среднее точно равно Rxx[m], а спектр по ней всегда неотрицателен", "Смещённую с делителем N: дисперсия на больших лагах остаётся ограниченной, а спектр по ней неотрицателен"], "correct": 3, "explain": "Оценка с делителем N эквивалентна умножению истинной Rxx[m] на треугольное окно Bartlett, поэтому её преобразование Фурье неотрицательно, а дисперсия при |m|, близком к N, не растёт; несмещённая оценка с делителем N − |m| в среднем точна, но на больших лагах делит на малое число, её дисперсия взрывается, и спектр по ней может уходить в отрицательные значения (Proakis, гл. 14; Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Студент берёт несмещённую оценку, считает по ней спектр и получает отрицательную мощность на части частот, не понимая, откуда она.", "with": "Он выбирает делитель N, знает, что платит небольшим смещением на больших лагах, и получает корректный неотрицательный спектр.", "benefit": "Правильный выбор оценщика корреляции избавляет от физически бессмысленных спектров."}}, {"q": "Импульсную характеристику канала токового датчика оценивают как h[m] ≈ Rxy[m]/σx², подавая на вход белый шум. Из соображений безопасности привода тестовый шум пропустили через низкочастотный фильтр. Что произойдёт с оценкой и как её исправить?", "options": ["Оценка обнулится на всех лагах, кроме нулевого, так как фильтр разрушает корреляцию входа с выходом; исправляется ростом N", "Оценка станет свёрткой h с автокорреляцией окрашенного шума и размажется по времени; исправляется делением Sxy на Sxx", "Оценка останется точной, так как деление на σx² компенсирует любую форму спектра тестового сигнала; исправлять нечего", "Оценка сдвинется на задержку низкочастотного фильтра при прежней форме; исправляется сдвигом Rxy на эту задержку"], "correct": 1, "explain": "По корреляционной теореме Rxy = h * Rxx, и равенство Rxy ≈ σx² h верно только для белого входа с Rxx ≈ σx² δ[m]; у окрашенного шума Rxx широкая, оценка размывается, поэтому переходят к H = Sxy/Sxx, где деление на спектр входа снимает его окраску. Сдвиг формы не меняет, а обнуления корреляции фильтр не вызывает (Proakis, гл. 2; Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Инженер сглаживает тестовый шум ради привода, получает растянутую h[n] и решает, что канал медленнее, чем на самом деле.", "with": "Он помнит, что Rxy = h * Rxx, и либо оставляет шум белым, либо делит взаимный спектр на спектр входа.", "benefit": "Знание корреляционной теоремы позволяет идентифицировать канал любым, а не только белым, тестовым сигналом."}}, {"q": "Два вибродатчика на раме манипулятора принимают широкополосный удар при высоком SNR, но конструкция даёт сильные отражения, и пик обычной взаимной корреляции широкий и с двойниками. Какой вес обобщённого корреляционного метода выбрать для оценки задержки и почему?", "options": ["SCOT: нормировка на корень из произведения автоспектров давит отражения сильнее всех, так как отражения не входят в автоспектры", "ML: вес по когерентности исключает влияние отражений, так как отражённые компоненты некогерентны с прямым сигналом", "PHAT: вес 1/|Gxy| выравнивает модуль взаимного спектра, оставляет только фазу, и пик сжимается к дельта-функции", "Без веса: обычная взаимная корреляция даёт самый узкий пик при широкополосном сигнале, отражения на него не влияют"], "correct": 2, "explain": "У PHAT вес ψ = 1/|Gxy|, поэтому взвешенный взаимный спектр имеет единичный модуль и фазу −ωD, а его обратное преобразование при высоком SNR стремится к δ[m − D]: пик становится острым, а отражения видны как отдельные меньшие пики. SCOT и ML не отбеливают спектр полностью, а отражения когерентны с прямым сигналом, поскольку являются его задержанными копиями (Knapp & Carter, 1976; Proakis, гл. 14).", "usage": {"code": false, "without": "Инженер ищет максимум обычной Rxy, видит широкий горб с двумя вершинами от прямого и отражённого пути и берёт неверную задержку.", "with": "Он применяет PHAT, получает острый пик на истинной задержке и отделяет отражения по меньшей амплитуде.", "benefit": "PHAT превращает размытую корреляцию в почти дельта-функцию там, где SNR высок."}}, {"q": "Те же датчики теперь работают при слабом сигнале: в полосе 0–200 Hz когерентность каналов около 0,9, а выше 1 kHz близка к нулю из-за шума. Инженер применил PHAT и получил хаотичный набор пиков. В чём ошибка и какой вес выбрать?", "options": ["Ошибка в весе: PHAT уравнивает шумовые полосы с сигнальными; вес ML растёт с когерентностью как γ²/[1 − γ²] и гасит шумовые полосы", "Ошибки нет: PHAT оптимален при любом SNR, а хаотичные пики означают, что задержка больше длины записи; нужно удлинить запись", "Ошибка в окне: PHAT требует прямоугольного окна на сегментах, а вес следует заменить на SCOT, который не зависит от когерентности", "Ошибка в нормировке: PHAT нужно применять к автоспектрам, а не к взаимному; вес следует заменить на 1/Gxx, поднимающий сильные частоты"], "correct": 0, "explain": "PHAT делит взаимный спектр на его модуль во всех полосах, поэтому полосы выше 1 kHz, где есть только шум и фаза случайна, получают тот же вес, что и полезные 0–200 Hz, и пик тонет. Вес ML, он же Hannan–Thomson, равен γ²/[|Gxy|·[1 − γ²]] и почти обнуляет полосы с низкой когерентностью, давая оценку задержки с минимальной дисперсией (Knapp & Carter, 1976).", "usage": {"code": false, "without": "Инженер копирует PHAT из статьи про акустику, при слабом сигнале получает случайные пики и решает, что метод не работает.", "with": "Он смотрит на когерентность, видит, где есть сигнал, и берёт вес ML, который сам учитывает SNR по частотам.", "benefit": "Выбор веса по когерентности делает оценку задержки устойчивой при низком SNR."}}, {"q": "При идентификации фильтра канала IMU по взаимной корреляции пик Rxy[m] оказался на m = 12, а не около нуля: выборки y приходят через шину с постоянной задержкой. Вы собираетесь подгонять к оценке h[n] модель низкого порядка. Что нужно сделать и что будет, если этого не сделать?", "options": ["Сдвинуть x на 12 отсчётов вперёд по пику Rxx: максимум автокорреляции входа и показывает транспортную задержку канала", "Разделить Sxy на 12 во всей полосе: постоянная задержка входит во взаимный спектр как множитель, равный числу отсчётов задержки", "Оставить как есть: чистая задержка не меняет ни |H|, ни групповую задержку, поэтому на подгонку модели низкого порядка она не влияет", "Сдвинуть y на 12 отсчётов назад по пику Rxy и потом оценивать h: иначе модель тратит 12 лишних коэффициентов на задержку"], "correct": 3, "explain": "Задержка D даёт множитель e^{−jωD} во взаимном спектре: |H| не меняется, но групповая задержка растёт на D, а h[n] начинается с D нулей, которые модель низкого порядка описать не может; пик Rxy стоит на m = D, и после сдвига y на D остаётся только динамика канала. Максимум Rxx любого сигнала всегда на m = 0, поэтому по нему задержку не найти (Proakis, гл. 2; Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Студент подгоняет модель 4-го порядка к h[n], которая начинается с дюжины нулей, и получает бессмысленные коэффициенты.", "with": "Он снимает задержку по пику взаимной корреляции, выравнивает каналы по времени и подгоняет короткую модель.", "benefit": "Устранение задержки перед идентификацией резко снижает порядок модели."}}, {"q": "Каналы энкодера и токового датчика нужно выровнять по времени с точностью лучше одного отсчёта. Пик взаимной корреляции стоит на m = 3, но вы подозреваете дробную задержку около 3,3 отсчёта. Какой способ даёт дробную оценку?", "options": ["Поиск максимума автокорреляции выхода Ryy: его смещение относительно нулевого лага равно дробной части задержки канала", "Линейная подгонка развёрнутой фазы взаимного спектра в полосе высокой когерентности: наклон равен −D и может быть дробным", "Поиск максимума Rxy без интерполяции на удвоенной длине записи: дробная часть проявляется сама, когда N превышает две тысячи отсчётов", "Чтение фазы взаимного спектра на одной частоте вблизи Nyquist: там фаза наиболее чувствительна к D и определена однозначно"], "correct": 1, "explain": "Для чистой задержки arg Sxy = −ωD, поэтому наклон развёрнутой фазы по частоте даёт D любой дробности; максимум Rxy привязан к сетке отсчётов независимо от N, фаза на одной частоте определена лишь с точностью до 2π, а максимум Ryy всегда в нуле. Другой рабочий приём — параболическая интерполяция пика Rxy по трём соседним отсчётам (Proakis, гл. 2 и 14; Oppenheim & Schafer, гл. 5).", "usage": {"code": false, "without": "Инженер округляет задержку до целого и получает систематическую рассинхронизацию каналов на треть отсчёта.", "with": "Он оценивает наклон фазы взаимного спектра и компенсирует дробную задержку фильтром дробной задержки.", "benefit": "Фаза взаимного спектра даёт задержку точнее сетки дискретизации."}}, {"q": "Пик взаимной корреляции сигнала IMU и опорного канала едва выделяется над шумовым фоном корреляционной функции. Сигнал занимает полосу до 200 Hz, fs = 2 kHz. Что из перечисленного заметно поднимет пик над фоном?", "options": ["Поднять fs до 8 kHz при той же полосе сигнала: пик станет в четыре раза уже, и шумовой фон под ним уменьшится", "Наложить окно Hann на y перед корреляцией: окно подавляет шум и снижает фон корреляционной функции", "Увеличить длину записи N вчетверо: фон от шума падает примерно как 1/√N, а высота пика сохраняется", "Нормировать x и y к единичной дисперсии: пик поднимается, а шумовой фон при этом не меняется"], "correct": 2, "explain": "Шумовой фон оценки Rxy складывается из N случайных слагаемых с нулевым средним, и его размах относительно пика падает как 1/√N, поэтому удлинение записи прямо повышает контраст; ширина пика задана полосой сигнала, а не fs, окно взвешивает и сигнал, и шум одинаково, а нормировка масштабирует пик и фон в одной пропорции (Proakis, гл. 14).", "usage": {"code": false, "without": "Студент повышает частоту дискретизации в надежде на чёткий пик, а получает тот же размытый фон при вчетверо большем объёме данных.", "with": "Он удлиняет запись или усредняет несколько записей, зная, что именно число независимых отсчётов давит фон.", "benefit": "Понимание, что контраст пика растёт с N, экономит время и память."}}, {"q": "Запись входа и выхода канала силомоментного датчика: N = 16384 отсчётов, fs = 8 kHz. Нужно оценить частотную характеристику методом Welch с окном Hann и перекрытием 50%, разрешив два резонанса, отстоящих на 20 Hz. Какая длина сегмента L разумна и что она даёт?", "options": ["L = 1024: шаг сетки 7,8 Hz разрешает резонансы, а усреднение идёт примерно по 31 сегменту", "L = 256: шаг сетки 31 Hz разрешает резонансы, а усреднение по 127 сегментам сильно снижает дисперсию", "L = 16384: один сегмент даёт шаг сетки 0,5 Hz, а дисперсия оценки падает благодаря большой длине записи", "L = 4096: шаг сетки 1,95 Hz разрешает резонансы, а усреднение идёт примерно по 31 сегменту"], "correct": 0, "explain": "Шаг сетки fs/L при L = 1024 равен 7,8 Hz, и даже с главным лепестком Hann шириной около двух bins резонансы в 20 Hz разделяются, а число сегментов при 50% перекрытии K = [N − L]/[L/2] + 1 = 31 снижает дисперсию примерно в K раз с поправкой на корреляцию соседних сегментов. L = 256 даёт шаг 31 Hz и сливает резонансы, L = 4096 оставляет лишь 7 сегментов, а один сегмент не уменьшает дисперсию периодограммы вообще, сколько бы ни было N (Proakis, гл. 14; Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Инженер берёт весь файл одним FFT, видит два пика в дрожащем спектре и не может сказать, резонансы это или шум.", "with": "Он делит запись на сегменты по 1024, усредняет 31 периодограмму и получает гладкую кривую с ясно разделёнными пиками.", "benefit": "Правильная длина сегмента даёт нужное разрешение при минимальной дисперсии."}}, {"q": "На частотной характеристике канала тока редуктора рядом с сильным резонансом ожидается слабая составляющая на 50 dB ниже, всего в нескольких bins от него. Какое окно взять для сегментов и какова цена выбора?", "options": ["Hann: первый боковой лепесток около −41 dB и спад 6 dB на октаву, чего с запасом хватает для 50 dB", "Hamming: боковые лепестки ниже −57 dB при главном лепестке шириной всего около 8π/M, как у Hann", "Rectangular: самый узкий главный лепесток около 4π/M, а боковые лепестки лежат ниже −57 dB на любом удалении", "Blackman: боковые лепестки ниже −57 dB, ценой становится главный лепесток шириной около 12π/M"], "correct": 3, "explain": "Слабая составляющая видна лишь там, где утечка от сильного резонанса ниже её уровня: у Rectangular первый боковой лепесток −13 dB, у Hann −31 dB со спадом 18 dB на октаву, у Hamming −41 dB, и только Blackman с −57 dB опускает утечку ниже −50 dB на расстоянии нескольких bins; расплата — главный лепесток 12π/M против 8π/M у Hann и Hamming, то есть худшее разрешение (Oppenheim & Schafer, гл. 7, табл. 7.2; Proakis, гл. 10).", "usage": {"code": false, "without": "Инженер берёт Hamming по привычке, утечка резонанса на уровне −41 dB перекрывает слабый пик, и он делает вывод, что составляющей нет.", "with": "Он выбирает Blackman, принимает более широкий главный лепесток и видит слабый пик на своём месте.", "benefit": "Окно подбирается под требуемый динамический диапазон, а не по привычке."}}, {"q": "Спектр шума энкодера оценивают по Blackman–Tukey: считают Rxx[m] по записи N = 4096, накладывают лаговое окно длиной M и берут FFT. Взяв M = N − 1 и прямоугольное лаговое окно, инженер получил сильно изрезанный спектр. Что изменить и какой ценой?", "options": ["Уменьшить M до порядка N/10 без окна: усечение корреляции само гарантирует неотрицательный спектр и снижает дисперсию", "Уменьшить M до порядка N/10 и взять лаговое окно Bartlett: дисперсия падает порядка N/M раз, разрешение около fs/M", "Удвоить N при прежнем M = N − 1: дисперсия периодограммы падает вдвое, а разрешение по частоте остаётся прежним", "Оставить M = N − 1 и заменить окно на Hann: всю изрезанность даёт утечка через боковые лепестки лагового окна"], "correct": 1, "explain": "При M = N − 1 с прямоугольным окном оценка Blackman–Tukey совпадает с периодограммой, дисперсия которой не убывает с ростом N; укорочение лагового окна до M много меньше N усредняет спектр по полосе около fs/M и снижает дисперсию порядка N/M раз, а окно Bartlett гарантирует неотрицательность, чего прямоугольное усечение не даёт. Замена окна при M = N − 1 дисперсию не трогает (Proakis, гл. 14; Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Студент берёт все лаги и получает шумную щётку, где резонансы неотличимы от случайных всплесков.", "with": "Он ограничивает лаги до N/10, накладывает Bartlett и получает гладкий неотрицательный спектр с достаточным разрешением.", "benefit": "Лаговое окно — прямой регулятор компромисса смещение/дисперсия."}}, {"q": "При идентификации канала энкодер-IMU известно, что сигнал энкодера x[n] должен опережать опорный сигнал y[n] на неизвестную положительную задержку D около 15 отсчётов, то есть y[n] приблизительно равно x[n-D]. Инженер посчитал Ryx[m] = сумма y[n]*x[n+m] и нашёл пик на m = -15, после чего решил, что энкодер отстаёт от опорного сигнала. В чём его ошибка?", "options": ["Он переставил сигналы местами: Ryx[m] равен Rxy[-m], поэтому пик Ryx на m = -15 соответствует пику Rxy на m = +15, задержка по-прежнему +15 отсчётов", "Пик действительно лежит на отрицательном лаге, поэтому вывод об отставании энкодера от опорного сигнала верен и его не нужно пересматривать", "Взаимная корреляция определена только для положительных лагов, а отрицательный результат означает ошибку вычислений, не связанную со знаком задержки", "Ryx и Rxy отличаются нормировкой на дисперсию сигналов, а не сдвигом лага, поэтому пик на -15 говорит о заниженной оценке задержки"], "correct": 0, "explain": "Rxy[m] = сумма x[n]y[n+m] и Ryx[m] = сумма y[n]x[n+m] связаны как Ryx[m] = Rxy[-m]: перестановка сигналов местами зеркально отражает ось лагов, а не меняет физическую задержку. Пик Ryx на m = -15 значит, что пик Rxy лежит на m = +15, то есть энкодер по-прежнему опережает опорный сигнал на 15 отсчётов, как и ожидалось (Proakis & Manolakis, гл. 2 и 14).", "usage": {"code": false, "without": "Инженер меняет знак задержки в отчёте и позже неверно компенсирует канал в обратную сторону.", "with": "Он сверяет, какой сигнал стоит первым в формуле корреляции, и правильно восстанавливает знак задержки.", "benefit": "Знание связи Rxy и Ryx спасает от зеркальной ошибки знака в оценке задержки."}}, {"q": "Между двумя каналами тока редуктора ожидается задержка около 380 отсчётов, запись содержит N = 1024 отсчёта. Взаимную корреляцию считают с постоянным делителем N и ищут пик среди лагов до m = 400. На синтетической проверке с известной задержкой 380 пик на этом лаге оказывается заметно ниже соседних пиков, полученных для меньших модельных задержек. Чем это объяснить?", "options": ["Взаимная корреляция всегда ограничена сверху автокорреляцией при нулевом лаге, поэтому пик у большого лага неизбежно ниже соседних", "Постоянный делитель N смещает оценку лишь на нулевом лаге, а занижение на 380 отсчётах вызвано округлением при быстрой свёртке", "Уровень шума в канале заметно нарастает к концу записи, из-за чего высота пика падает; нужна вдвое более длинная запись", "Оценка с делителем N взвешена треугольным окном по лагу, поэтому пик у границы диапазона систематически занижен"], "correct": 3, "explain": "Оценка с постоянным делителем N равна истинной корреляции, умноженной на треугольное окно Бартлетта 1 минус модуль m на N, поэтому её значения систематически занижены вблизи границы диапазона лагов независимо от реального шума. Оценка с делителем N минус модуль лага убирает этот систематический наклон, хотя и повышает дисперсию на больших лагах (Proakis & Manolakis, гл. 14).", "usage": {"code": false, "without": "Инженер видит слабый пик у большой задержки и бракует канал как некоррелированный.", "with": "Он пересчитывает пик с несмещённым делителем и видит его настоящую высоту без искусственного занижения.", "benefit": "Понимание треугольного смещения спасает исправный канал от ложной браковки."}}, {"q": "Контроллер робота должен каждые 50 мс пересчитывать задержку между каналом резольвера и опорным каналом по окну N = 2048 отсчётов на процессоре с ограниченной производительностью. Прямое суммирование по определению взаимной корреляции требует порядка N в квадрате операций на одно окно. Как ускорить вычисление, не меняя физического смысла оценки?", "options": ["Заменить прямое суммирование свёрткой импульсной характеристики с белым шумом, что даёт тот же результат при произвольном входном сигнале", "Заменить прямое суммирование произведением спектров X со звёздочкой и Y с последующим обратным БПФ, опираясь на корреляционную теорему", "Заменить прямое суммирование прямым вычислением когерентности, поскольку она уже содержит положение пика взаимной корреляции", "Заменить прямое суммирование автокорреляцией одного лишь опорного канала, которая целиком определяет взаимный спектр обоих каналов"], "correct": 1, "explain": "Корреляционная теорема даёт Sxy = X со звёздочкой умножить на Y в частотной области, а обратное БПФ восстанавливает Rxy[m]; это снижает стоимость с порядка N в квадрате до порядка N log N без изменения смысла оценки. Автокорреляция одного канала не определяет взаимный спектр двух разных сигналов, а когерентность сама вычисляется из уже готовых Sxy, Sxx, Syy, а не наоборот (Oppenheim & Schafer, гл. 8-10).", "usage": {"code": false, "without": "Контроллер не успевает пересчитать задержку за отведённые 50 мс и пропускает циклы управления.", "with": "Он считает взаимный спектр через БПФ и укладывается в цикл управления с запасом по времени.", "benefit": "Быстрая корреляция через БПФ делает оценку задержки пригодной для реального времени."}}, {"q": "Для идентификации импульсной характеристики канала IMU по формуле Rxy = h свёрнуть с Rxx в качестве тестового сигнала выбрали гармонический свип с несколькими узкими провалами в спектре вместо белого шума. Как это скажется на оценке h[n]?", "options": ["Оценка h станет точнее, поскольку свип концентрирует энергию на отдельных частотах и снижает дисперсию оценки сразу на всех лагах", "Rxx останется дельта-функцией по определению, а исказится только значение Rxy на нулевом лаге, что легко устранить масштабированием", "Rxx перестаёт напоминать дельта-функцию и получает провалы на тех же частотах, поэтому оценка h искажается именно там, где Sxx мало", "Оценка h вообще не изменится, поскольку равенство Rxy = h свёрнуть с Rxx верно для любого стационарного сигнала вне зависимости от формы его спектра"], "correct": 2, "explain": "В частотной области Sxy равно H умножить на Sxx, откуда H равно Sxy делить на Sxx; там, где спектр возбуждения Sxx близок к нулю, деление становится плохо обусловленным и оценка H, а значит и h, искажается или взрывается шумом. Белый шум держит Sxx примерно постоянным на всех частотах и избегает этой проблемы, что и есть требование persistency of excitation (Proakis & Manolakis, гл. 14).", "usage": {"code": false, "without": "Инженер выбирает удобный для генератора свип и получает провалы в оценённой АЧХ без видимой причины.", "with": "Он проверяет спектр тестового сигнала на отсутствие нулей и получает ровную оценку по всей полосе.", "benefit": "Проверка спектра возбуждения перед записью экономит целый цикл переидентификации."}}, {"q": "Для идентификации канала энкодера нужен тестовый сигнал с автокорреляцией, близкой к дельта-функции, и при этом одинаковый в каждом лабораторном прогоне для сравнения результатов. Между генератором аналогового теплового шума и периодической MLS-последовательностью той же полосы выбрали MLS. Чем оправдан этот выбор для данной задачи?", "options": ["MLS даёт детерминированную, повторяемую реализацию с почти дельта-образной автокорреляцией внутри периода сигнала", "MLS всегда точнее приближает дельта-функцию по автокорреляции, чем любой аналоговый шум, независимо от длины реализации и полосы", "MLS сама по себе гарантирует линейность канала энкодера и снимает необходимость проверять когерентность после записи данных", "MLS полностью убирает влияние длины выборки на дисперсию оценки автокорреляции, чего никак не может обеспечить генератор шума"], "correct": 0, "explain": "Периодическая MLS-последовательность детерминирована и точно воспроизводится от прогона к прогону, а её автокорреляция внутри периода почти идеально дельта-образна, что удобно для сравнения и синхронного усреднения повторов. Это свойство повторяемости, а не превосходство по форме автокорреляции над любым шумом или снятие проверки когерентности и влияния длины выборки (Wanhammar & Saramaki, гл. по идентификации систем).", "usage": {"code": false, "without": "Каждый лабораторный прогон использует новую случайную реализацию шума и результаты плохо сравнимы между собой.", "with": "Один и тот же сигнал MLS повторяется от прогона к прогону, и результаты становятся напрямую сопоставимы.", "benefit": "Повторяемость тестового сигнала превращает разрозненные прогоны в сравнимый эксперимент."}}, {"q": "На корпусе манипулятора удар доходит до двух акселерометров не только напрямую, но и переотражённым от соседнего кронштейна с чуть большей задержкой, из-за чего обычная взаимная корреляция даёт два близких по высоте пика и путает основной путь с переотражённым. Какой вес обобщённого корреляционного метода стоит выбрать, чтобы выделить пик прямого пути?", "options": ["Обычную взаимную корреляцию без веса, поскольку любое частотное взвешивание одинаково исказит и прямой, и переотражённый пики", "Вес максимального правдоподобия при высокой когерентности, рассчитанный именно на подавление второго пути при сильном сигнале", "SCOT, поскольку он усиливает именно те частоты, где взаимная мощность наибольшая, а там и сосредоточен вклад переотражённого пути", "PHAT, поскольку он нормирует каждую составляющую по амплитуде и оставляет только фазу, обостряя главный пик"], "correct": 3, "explain": "Вес PHAT равен единице делить на модуль Sxy, то есть отбрасывает амплитудную информацию и оставляет только фазу взаимного спектра, что даёт узкий острый пик и хорошо подавляет вторичные пики от переотражений, характерных для многолучевых условий. SCOT и ML-вес построены для другой задачи - оптимальной дисперсии оценки при известном шуме одного пути, а не для разрешения нескольких путей (Knapp & Carter, 1976).", "usage": {"code": false, "without": "Алгоритм иногда захватывает пик переотражённого пути и выдаёт задержку с ошибкой на десятки отсчётов.", "with": "После перехода на PHAT алгоритм устойчиво находит пик прямого пути даже при заметном переотражении.", "benefit": "Правильный выбор веса PHAT избавляет от случайных скачков оценки задержки на многолучевом корпусе."}}, {"q": "Для оценки задержки между каналом резольвера и опорным синусоидальным сигналом частотой 400 Гц решили использовать наклон фазы взаимного спектра вместо поиска пика взаимной корреляции; получили оценку задержки 3.2 мс. Почему такой способ здесь ненадёжен?", "options": ["Метод по наклону фазы применим только к сигналам с нулевым средним значением, а синусоида этому условию не удовлетворяет", "Сигнал узкополосный, фаза взаимного спектра известна лишь по модулю 2*пи, и задержку нельзя отделить от кратной периоду добавки", "Оценка по фазе взаимного спектра требует чётного числа отсчётов на периоде сигнала, что не гарантировано на частоте 400 Гц", "Узкополосный сигнал в принципе не порождает взаимного спектра между каналами, поэтому фазу вычислить совершенно невозможно никаким способом"], "correct": 1, "explain": "Для чисто узкополосного сигнала фаза измеряется на одной частоте и известна только по модулю 2*пи, поэтому истинная задержка неотличима от неё же плюс любое целое число периодов сигнала; наклон фазы по многим частотам широкополосного сигнала снимает эту неоднозначность, а поиск пика во временной области даёт однозначный ответ в пределах окна анализа (Knapp & Carter, 1976; Proakis & Manolakis, гл. 14).", "usage": {"code": false, "without": "Инженер принимает первую же оценку по фазе, не замечая, что она могла разойтись с истиной на целый период.", "with": "Он проверяет оценку по фазе широкополосным тестовым сигналом или пиком корреляции и убирает неоднозначность.", "benefit": "Понимание неоднозначности фазы на узкой полосе экономит время на поиск мнимой ошибки калибровки."}}, {"q": "После грубого поиска максимума взаимной корреляции между сигналом IMU и опорным каналом оказалось, что значения на соседних лагах m = 27 и m = 28 почти равны, а истинная задержка, по-видимому, дробная. Как уточнить оценку задержки, не повышая частоту дискретизации записи?", "options": ["Увеличить длину записи N вдвое, что само по себе переводит любую дробную задержку в целое число отсчётов на новой сетке", "Заменить взаимную корреляцию на автокорреляцию опорного канала, у которой пик по определению приходится строго на целый отсчёт", "Аппроксимировать вершину Rxy параболой по нескольким отсчётам вокруг максимума и взять вершину параболы как дробную оценку задержки", "Округлить задержку до ближайшего целого отсчёта, поскольку взаимная корреляция принципиально не различает дробные задержки между отсчётами"], "correct": 2, "explain": "Параболическая интерполяция по трём-пяти отсчётам вокруг дискретного максимума Rxy восстанавливает положение истинного, непрерывного по времени пика между отсчётами сетки, что и даёт дробную оценку задержки без передискретизации записи; удлинение записи N не меняет шаг сетки лагов, а переход на автокорреляцию опорного канала вовсе не несёт информации о задержке между каналами (Knapp & Carter, 1976).", "usage": {"code": false, "without": "Инженер округляет задержку до целого отсчёта и вносит систематическую ошибку выравнивания каналов.", "with": "Он интерполирует вершину пика параболой и получает субдискретную оценку задержки без лишних измерений.", "benefit": "Параболическая интерполяция пика убирает ошибку округления без пересъёмки данных на большей частоте."}}, {"q": "При сглаживании частотной характеристики канала тока редуктора методом Уэлча запись N = 8192 разбили на 32 коротких перекрывающихся сегмента ради гладкой оценки с малой дисперсией. После этого узкий резонансный пик шириной около 2 Гц, хорошо заметный на сырой периодограмме, пропал со сглаженной оценки. Как это объяснить и что изменить?", "options": ["Короткие сегменты дают частотное разрешение шире резонанса, поэтому пик размазался; нужно удлинить сегменты, уменьшив их число", "Метод Уэлча в принципе никогда не сохраняет узкие резонансы независимо от длины сегментов, поэтому нужен переход на метод Блэкмана-Тьюки", "Перекрытие сегментов сгладило резонанс само по себе, поэтому решением будет убрать перекрытие вовсе, не меняя длину сегментов", "Резонанс пропал из-за усреднения по времени, а не по частоте, поэтому нужно увеличить общую длину записи при той же длине сегмента"], "correct": 0, "explain": "Частотное разрешение метода Уэлча определяется длиной одного сегмента, а не общей длиной записи; при 32 сегментах из 8192 отсчётов сегменты короткие, их разрешение по частоте оказывается шире 2 Гц и узкий резонанс усредняется вместе с соседними частотами. Решение - взять меньше, но более длинных сегментов, приняв рост дисперсии оценки как цену за разрешение (Proakis & Manolakis, гл. 14).", "usage": {"code": false, "without": "Инженер решает, что резонанс в канале отсутствует, хотя тот просто размылся коротким окном анализа.", "with": "Он удлиняет сегменты, жертвуя гладкостью оценки, и видит тот же резонанс, что и на сырой периодограмме.", "benefit": "Учёт связи длины сегмента и разрешения спасает реальный резонанс от исчезновения в отчёте."}}, {"q": "Для той же задачи предлагают вместо метода Уэлча использовать метод Блэкмана-Тьюки: посчитать Rxx по всей записи N = 8192 и наложить лаговое окно длиной 2M плюс 1. Чтобы одновременно разрешить резонанс шириной 2 Гц и подавить шум на дальних лагах, как выбрать M?", "options": ["Взять M минимально возможным, равным единице, чтобы окно совпало с прямоугольным и никак не сузило ширину резонанса", "Величина M вовсе не влияет на разрешение по частоте, а определяет лишь общий уровень мощности оценённого спектра", "Взять M равным N, чтобы лаговое окно вовсе не отбрасывало никакой информации об автокорреляции всей записи целиком", "Взять M достаточно большим для разрешения уже 2 Гц, но заметно меньше N ради подавления шума на дальних лагах"], "correct": 3, "explain": "В методе Блэкмана-Тьюки ширина лагового окна 2M плюс 1 задаёт частотное разрешение порядка 1 делить на M: M должно быть достаточно большим для разрешения резонанса в 2 Гц, но заметно меньше N, чтобы отбросить самые дальние, самые шумные лаги автокорреляции и снизить дисперсию оценки. Крайние значения M равное N или M равное единице срывают либо подавление шума, либо само разрешение резонанса (Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Инженер берёт лаговое окно наугад и получает то шумный, то слишком сглаженный спектр без резонанса.", "with": "Он подбирает M по требуемому разрешению 2 Гц и получает одновременно узкий резонанс и подавленный шум.", "benefit": "Осознанный выбор M превращает метод Блэкмана-Тьюки в управляемый компромисс разрешения и шума."}}, {"q": "На корпусе робота стоят два акселерометра, оцифровка синхронная при fs = 10 кГц. Взаимная корреляция Rxy[m] = Σ x[n]·y[n+m] имеет чёткий максимум при m = 37, то есть сигнал y запаздывает относительно x на 37 отсчётов. Расстояние между датчиками вдоль пути волны 1,85 м. Оцените задержку τ и скорость распространения волны v.", "options": ["τ = 0,37 мс, v = 5000 м/с", "τ = 37 мс, v = 50 м/с", "τ = 3,7 мс, v = 500 м/с", "τ = 3,7 мс, v = 5000 м/с"], "correct": 2, "explain": "Шаг 1: задержка τ = m/fs = 37/10000 = 3,7 мс. Шаг 2: скорость v = d/τ = 1,85/0,0037 = 500 м/с. Вариант 0,37 мс и 5000 м/с получается при ошибке в порядке fs, 37 мс и 50 м/с - если принять шаг дискретизации за 1 мс, а 3,7 мс и 5000 м/с - арифметическая ошибка при делении. При таком определении Rxy пик на положительном m означает запаздывание y относительно x (Proakis, гл. 2, разд. 2.6).", "usage": {"code": false, "without": "Инженер видит пик корреляции на 37-м отсчёте и записывает «задержка 37», не переводя в секунды, а скорость волны получает с ошибкой в тысячу раз.", "with": "Он делит номер сдвига на fs, получает 3,7 мс и сразу проверяет скорость по расстоянию между датчиками - 500 м/с выглядит правдоподобно для волны в конструкции.", "benefit": "Правильный перевод пика корреляции в физическую задержку и скорость."}}, {"q": "Взаимный спектр Sxy(f) = X*(f)·Y(f) двух каналов измерен при fs = 8 кГц. Его фаза в рабочей полосе линейна: φ(100 Гц) = -0,4π рад, φ(300 Гц) = -1,2π рад. Найдите задержку τ канала y относительно x и её значение D в отсчётах.", "options": ["τ = 2 мс, D = 16 отсчётов", "τ = 4 мс, D = 32 отсчёта", "τ = 1 мс, D = 8 отсчётов", "τ = 2 мс, D = 32 отсчёта"], "correct": 0, "explain": "Шаг 1: наклон фазы dφ/df = (-1,2π + 0,4π)/(300 - 100) = -0,8π/200 = -0,004π рад/Гц. Шаг 2: для чистой задержки φ(f) = -2π·f·τ, откуда τ = 0,004π/(2π) = 0,002 с = 2 мс. Шаг 3: D = τ·fs = 0,002·8000 = 16 отсчётов. Ответ 4 мс и 32 отсчёта возникает, если забыть двойку в 2π, 1 мс и 8 отсчётов - если поделить на 4π, а 2 мс и 32 отсчёта - если умножить на удвоенную fs (Proakis, гл. 2, разд. 2.6; Knapp & Carter, 1976).", "usage": {"code": false, "without": "Студент берёт фазу в одной точке, делит на частоту без 2π и получает задержку, вдвое большую реальной, а сдвиг каналов «исправляет» не туда.", "with": "Он оценивает наклон фазы по двум частотам, делит на -2π и переводит в отсчёты через fs - оценка совпадает с пиком взаимной корреляции.", "benefit": "Оценка задержки по фазе взаимного спектра без ошибки в 2π."}}, {"q": "Линейную дискретную систему возбуждают белым шумом с дисперсией σx² = 4, так что Rxx[m] = 4·δ[m]. Оценённая взаимная корреляция входа и выхода Rxy[m] = Σ x[n]·y[n+m] даёт Rxy[0] = 2, Rxy[1] = -1, Rxy[2] = 0,5, при остальных m практически ноль. Через соотношение Rxy = h * Rxx найдите h[n] и коэффициент передачи системы на нулевой частоте H(e^j0).", "options": ["h = [0,5; -0,25; 0,125], H = 0,875", "h = [2,0; -1,0; 0,50], H = 1,50", "h = [1,0; -0,50; 0,25], H = 0,75", "h = [0,5; -0,25; 0,125], H = 0,375"], "correct": 3, "explain": "Шаг 1: для белого входа Rxy[m] = Σ h[k]·Rxx[m-k] = σx²·h[m], поэтому h[m] = Rxy[m]/σx² = [2; -1; 0,5]/4 = [0,5; -0,25; 0,125]. Шаг 2: H(e^j0) = Σ h[n] = 0,5 - 0,25 + 0,125 = 0,375. Вариант 1,5 - это сумма Rxy без деления на σx², 0,75 - деление на σx вместо σx², а 0,875 - сумма модулей вместо знаковой суммы (Oppenheim & Schafer, гл. 2, разд. 2.10; Proakis, гл. 2, разд. 2.6).", "usage": {"code": false, "without": "Снятую взаимную корреляцию принимают за импульсную характеристику как есть, и усиление системы получается завышенным в σx² раз.", "with": "Инженер нормирует Rxy на дисперсию белого тестового шума и получает h[n], а сумма отсчётов сразу даёт коэффициент передачи на постоянном токе.", "benefit": "Идентификация h[n] белым шумом с корректной нормировкой."}}, {"q": "Запись длиной N = 8192 отсчётов при fs = 4096 Гц обрабатывают методом Бартлетта: делят на неперекрывающиеся сегменты, считают периодограмму каждого и усредняют. Требуется шаг частотной сетки Δf = fs/L ровно 8 Гц. Найдите длину сегмента L, число сегментов K и во сколько раз уменьшится СКО оценки спектра по сравнению с одной периодограммой такой же длины L.", "options": ["L = 512, K = 16, СКО меньше в 16 раз", "L = 512, K = 16, СКО меньше в 4 раза", "L = 1024, K = 8, СКО меньше в 2,8 раза", "L = 256, K = 32, СКО меньше в 5,7 раза"], "correct": 1, "explain": "Шаг 1: L = fs/Δf = 4096/8 = 512 отсчётов. Шаг 2: K = N/L = 8192/512 = 16 сегментов. Шаг 3: дисперсия периодограммы не падает с ростом длины, а усреднение K независимых периодограмм делит её на K, поэтому СКО падает в √16 = 4 раза. «В 16 раз» - путаница дисперсии и СКО; L = 1024 и L = 256 дают шаг сетки 4 и 16 Гц, а не требуемые 8 Гц (Proakis, гл. 14, разд. 14.2; Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Аналитик берёт одну периодограмму всей записи и получает спектр с разбросом порядка самого значения спектра, хотя данных много.", "with": "Он режет запись на 16 сегментов по 512 отсчётов, усредняет периодограммы и получает СКО в 4 раза меньше при нужной сетке 8 Гц.", "benefit": "Осознанный выбор длины сегмента: разрешение против дисперсии."}}, {"q": "Метод Уэлча: запись N = 4096 отсчётов при fs = 2048 Гц режут на сегменты длиной L = 512 с перекрытием 50 %, в расчёт идут только сегменты, целиком уместившиеся в записи, без дополнения нулями; к каждому применяют окно Hann и усредняют периодограммы. Сколько сегментов K получится и каков шаг частотной сетки Δf?", "options": ["K = 16, Δf = 4 Гц", "K = 15, Δf = 0,5 Гц", "K = 15, Δf = 4 Гц", "K = 8, Δf = 4 Гц"], "correct": 2, "explain": "Шаг 1: шаг сдвига сегмента S = L·(1 - 0,5) = 256 отсчётов. Шаг 2: K = (N - L)/S + 1 = (4096 - 512)/256 + 1 = 14 + 1 = 15; то же даёт формула Оппенгейма-Шафера для перекрытия 50 %: K = 2N/L - 1 = 16 - 1 = 15. Шаг 3: Δf = fs/L = 2048/512 = 4 Гц - сетка задаётся длиной сегмента, а не всей записи, поэтому 0,5 Гц неверно. K = 8 - без перекрытия; K = 16 - если поделить N на шаг сдвига и забыть, что шестнадцатый сегмент начинался бы с отсчёта 3840 и заканчивался на 4352, то есть выходил бы за конец записи (Oppenheim & Schafer, гл. 10, разд. 10.6; Proakis, гл. 14, разд. 14.2).", "usage": {"code": false, "without": "Студент делит N на L и заявляет 8 сегментов, теряя половину усреднения, которое даёт перекрытие, и получает более шумный спектр.", "with": "Он считает K по формуле с шагом сдвига и последним целым сегментом и получает 15 периодограмм при том же шаге сетки 4 Гц.", "benefit": "Правильный подсчёт сегментов Уэлча при перекрытии."}}, {"q": "На частоте f0 усреднённые по сегментам оценки дали Sxx = 8, Syy = 5, |Sxy| = 4 в одинаковых единицах. Найдите функцию когерентности γ²xy(f0) и определите, какая часть мощности выхода Syy на этой частоте не объясняется линейной связью с входом, то есть приходится на шум и нелинейности.", "options": ["γ² = 0,40, необъяснённая часть 3,0", "γ² = 0,63, необъяснённая часть 1,85", "γ² = 0,80, необъяснённая часть 1,0", "γ² = 0,50, необъяснённая часть 2,5"], "correct": 0, "explain": "Шаг 1: γ² = |Sxy|²/(Sxx·Syy) = 16/(8·5) = 0,40. Шаг 2: когерентная часть выхода γ²·Syy = 0,4·5 = 2,0, некогерентная Syy·(1 - γ²) = 3,0. Значение 0,63 - это |Sxy|/√(Sxx·Syy) без возведения в квадрат, 0,5 и 0,8 - отношения |Sxy| к одному из автоспектров; во всех случаях теряется смысл γ² как доли мощности выхода, линейно порождённой входом (Proakis, гл. 14; Bendat & Piersol, гл. 6).", "usage": {"code": false, "without": "Инженер видит |Sxy| = 4 и решает, что связь «сильная», не понимая, какая доля выхода реально вызвана входом, и доверяет оценке H на этой частоте.", "with": "Он считает γ² = 0,4 и видит, что 60 % мощности выхода здесь шум или нелинейность, а значит оценка H = Sxy/Sxx на этой частоте ненадёжна.", "benefit": "Когерентность как числовой контроль качества идентификации."}}, {"q": "По записи из N = 100 отсчётов оценивают автокорреляцию. Для сдвига m = 20 сумма Σ x[n]·x[n+20] по всем n от 0 до 79 равна 16. Найдите смещённую оценку r_b[20] с делителем N, несмещённую r_u[20] с делителем N - m и их отношение r_u/r_b.", "options": ["r_b = 0,20; r_u = 0,16; отношение 0,80", "r_b = 0,16; r_u = 0,80; отношение 5,00", "r_b = 0,16; r_u = 0,16; отношение 1,00", "r_b = 0,16; r_u = 0,20; отношение 1,25"], "correct": 3, "explain": "Шаг 1: r_b[20] = 16/N = 16/100 = 0,16. Шаг 2: r_u[20] = 16/(N - m) = 16/80 = 0,20. Шаг 3: r_u/r_b = N/(N - m) = 1,25 - смещённая оценка занижает большие сдвиги треугольным множителем (N - |m|)/N, зато имеет меньшую дисперсию и гарантирует неотрицательную оценку спектра. Перестановка 0,20/0,16 путает делители, 0,80 - деление на m вместо N - m (Proakis, гл. 14, разд. 14.1; Oppenheim & Schafer, гл. 10).", "usage": {"code": false, "without": "Студент использует несмещённую оценку на больших сдвигах, получает шумные значения и отрицательные участки спектра, не понимая причины.", "with": "Он знает, что смещённая оценка занижает сдвиг m = 20 в 1,25 раза, но даёт гладкий и неотрицательный спектр, и выбирает оценку под задачу.", "benefit": "Осознанный выбор смещённой или несмещённой оценки корреляции."}}, {"q": "В обобщённом корреляционном методе GCC-PHAT перед обратным преобразованием взаимный спектр умножают на вес ψ(f) = 1/|Sxy(f)|. В одном частотном бине измерено Sxy = 3 - 4j. Найдите значение взвешенного взаимного спектра в этом бине и его фазу.", "options": ["3,0 - 4,0j, фаза -53°", "0,6 - 0,8j, фаза -53°", "0,6 + 0,8j, фаза +53°", "0,12 - 0,16j, фаза -53°"], "correct": 1, "explain": "Шаг 1: |Sxy| = √(3² + 4²) = 5. Шаг 2: ψ·Sxy = (3 - 4j)/5 = 0,6 - 0,8j, модуль ровно 1, фаза atan2(-0,8; 0,6) = -53,1°. PHAT «выбеливает» спектр: остаётся только фаза, и пик обобщённой корреляции сужается до δ-подобного даже для узкополосных сигналов. Деление на |Sxy|² = 25 даёт 0,12 - 0,16j - это деление на квадрат модуля, а не на модуль; 3 - 4j - пропущенное взвешивание; сопряжённое значение меняет знак задержки (Knapp & Carter, 1976; Proakis, гл. 14).", "usage": {"code": false, "without": "Инженер строит обычную взаимную корреляцию узкополосных сигналов, пик размыт, и задержка определяется с ошибкой в несколько отсчётов.", "with": "Он нормирует каждый бин взаимного спектра на его модуль, оставляя только фазу, и пик GCC-PHAT становится острым и однозначным.", "benefit": "Точная задержка узкополосных и реверберирующих сигналов через PHAT."}}, {"q": "Взаимная корреляция двух сигналов, оцифрованных при fs = 50 кГц, имеет максимум на целом сдвиге D = 24, а соседние значения R[23] = 0,6, R[24] = 1,0, R[25] = 0,8. Уточните задержку параболической интерполяцией по трём точкам: δ = (R[D+1] - R[D-1]) / (2·(2R[D] - R[D-1] - R[D+1])), и переведите результат D + δ в микросекунды.", "options": ["D + δ = 23,83 отсчёта, τ ≈ 477 мкс", "D + δ = 24,50 отсчёта, τ ≈ 490 мкс", "D + δ = 24,17 отсчёта, τ ≈ 483 мкс", "D + δ = 24,33 отсчёта, τ ≈ 487 мкс"], "correct": 2, "explain": "Шаг 1: δ = (0,8 - 0,6)/(2·(2·1,0 - 0,6 - 0,8)) = 0,2/(2·0,6) = 0,2/1,2 ≈ 0,167. Шаг 2: уточнённая задержка D + δ = 24,167 отсчёта - пик сдвинут к большему соседу R[25]. Шаг 3: τ = 24,167/50000 ≈ 483 мкс. Вариант 24,33 - потерянная двойка в знаменателе, 23,83 - перепутанный знак разности, 24,50 - неверный знаменатель 2·(R[D] - R[D+1]). Интерполяция даёт разрешение задержки лучше одного отсчёта 1/fs = 20 мкс (Knapp & Carter, 1976; Proakis, гл. 2, разд. 2.6).", "usage": {"code": false, "without": "Задержку берут ровно 24 отсчёта, и ошибка до половины отсчёта, то есть до 10 мкс, уходит в расчёт направления на источник вибрации.", "with": "Он интерполирует пик параболой по трём точкам и получает 24,17 отсчёта - разрешение задержки лучше шага дискретизации.", "benefit": "Субдискретное уточнение задержки без повышения fs."}}, {"q": "Два канала оцифрованы при fs = 8 кГц; по пику взаимной корреляции найдено, что y отстаёт от x на D = 12 отсчётов. До устранения задержки хотят оценить фазу взаимного спектра. Найдите задержку τ в мс и наименьшую частоту, на которой фаза чистой задержки -2π·f·τ достигает -π и начинает заворачиваться, то есть выше которой фазовая оценка без предварительного выравнивания каналов становится неоднозначной.", "options": ["τ = 1,5 мс, f = 333 Гц", "τ = 1,5 мс, f = 167 Гц", "τ = 12 мс, f = 42 Гц", "τ = 1,5 мс, f = 667 Гц"], "correct": 0, "explain": "Шаг 1: τ = D/fs = 12/8000 = 1,5 мс. Шаг 2: фаза -2π·f·τ = -π при f = 1/(2τ) = 1/0,003 ≈ 333 Гц, то есть уже на 1/24 от fs фаза достигает -π и дальше отображается с переносом на 2π. Поэтому обобщённый корреляционный метод сначала убирает грубую задержку сдвигом y на D отсчётов, а затем по остаточному малому наклону фазы уточняет дробную часть. Ответ 667 Гц отвечает фазе -2π, 167 Гц - фазе -π/2, а 12 мс - подмене отсчётов миллисекундами (Proakis, гл. 2, разд. 2.6; Knapp & Carter, 1976).", "usage": {"code": false, "without": "Студент пытается оценить задержку по наклону фазы всего спектра, фаза заворачивается уже с 333 Гц, и линейная регрессия по фазе даёт бессмыслицу.", "with": "Он сначала сдвигает y на 12 отсчётов по пику корреляции, а по оставшемуся малому наклону фазы уточняет дробную часть задержки.", "benefit": "Двухэтапное устранение задержки: грубый сдвиг, затем фаза."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
