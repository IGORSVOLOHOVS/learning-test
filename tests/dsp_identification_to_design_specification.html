<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSP 4: От идентификации ЛДС к техническому заданию на синтез</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

ировать корректор.", "benefit": "Синтез корректора ведётся на заведомо устойчивой модели канала."}}, {"q": "Как уровень шума измерений и бедность спектра тестового сигнала влияют на МНК-оценку коэффициентов ARX-модели канала?", "options": ["Чем ниже отношение сигнал-шум и беднее спектр возбуждения, тем меньше становится порядок итоговой ARX-модели", "Чем ниже отношение сигнал-шум и беднее спектр возбуждения, тем ниже дисперсия и смещение оценённых коэффициентов", "Чем ниже отношение сигнал-шум и беднее спектр возбуждения, тем выше дисперсия и смещение оценённых коэффициентов", "Чем ниже отношение сигнал-шум и беднее спектр возбуждения, тем точнее определяется порядок модели по критерию AIC"], "correct": 2, "explain": "Слабый сигнал на фоне шума и бедный по спектру тестовый сигнал ухудшают обусловленность регрессионной матрицы, из-за чего дисперсия и смещение МНК-оценки растут; это прямо противоположно варианту про снижение дисперсии. Ни выбор порядка по AIC, ни сам порядок модели от уровня шума напрямую не улучшаются (Proakis & Manolakis, гл. 12).", "usage": {"code": false, "without": "Инженер идентифицирует канал IMU по короткой записи с узкополосным тестовым сигналом и получает коэффициенты с большим разбросом от записи к записи.", "with": "Выбрав широкополосный тестовый сигнал и достаточное отношение сигнал-шум, инженер получает стабильную оценку модели IMU-канала, повторяемую между записями.", "benefit": "Оценка коэффициентов не скачет от записи к записи."}}, {"q": "Спецификация фильтра задаёт допуск пульсаций полосы пропускания как Rp в децибелах, а исходная линейная пульсация dp известна в линейных единицах амплитуды. Как эти величины связаны?", "options": ["Rp получается как минус 20 log10 от единицы минус dp, малая линейная пульсация даёт малое Rp в дБ", "Rp получается как 20 log10 от единицы плюс dp, то есть Rp в дБ всегда больше шести дБ", "Rp получается как 20 log10 от dp, то есть пульсация в дБ растёт линейно с линейной пульсацией", "Rp получается как минус 10 log10 от ds, то есть полоса пропускания задаётся через затухание полосы задерживания"], "correct": 0, "explain": "Пульсация полосы пропускания в линейных единицах 1 минус dp переводится в децибелы как Rp = минус 20 log10 от единицы минус dp, поэтому малому dp соответствует малое Rp. Формула через ds описывает полосу задерживания, а не пропускания, и не может подменять Rp (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "Инженер получает от заказчика Rp в дБ, а в расчёте использует линейную пульсацию как есть, и порядок фильтра оказывается занижен.", "with": "Пересчитав Rp в линейную пульсацию по формуле, инженер подставляет верное значение в оценку порядка и получает фильтр, реально укладывающийся в маску.", "benefit": "Порядок фильтра рассчитывается по реальному допуску, а не по перепутанным единицам."}}, {"q": "Зачем в спецификации цифрового фильтра границы полос задают в нормированной частоте, а не в герцах?", "options": ["Потому что нормированная частота освобождает от необходимости задавать ширину переходной полосы", "Потому что нормированная частота требуется только для IIR-фильтров, а FIR проектируют в герцах", "Потому что нормированная частота сама по себе обеспечивает линейность фазы итогового фильтра", "Потому что нормированная частота делает спецификацию и формулы синтеза независимыми от частоты дискретизации"], "correct": 3, "explain": "Частота, нормированная на частоту дискретизации, приводит спецификацию и формулы синтеза к диапазону от нуля до пи независимо от конкретного fs, поэтому один и тот же расчёт порядка применим к любой частоте дискретизации. Она не отменяет переходную полосу, не привязана только к IIR и сама по себе фазу не линеаризует (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "Инженер расписывает спецификацию фильтра энкодера в герцах и должен пересчитывать формулы синтеза заново при каждой смене частоты дискретизации платы.", "with": "Задав границы полос в нормированной частоте, инженер использует одну и ту же процедуру синтеза для платы с любой частотой дискретизации.", "benefit": "Расчёт порядка фильтра не привязан к конкретной частоте дискретизации."}}, {"q": "По какому главному признаку из технического задания на фильтр обычно делают выбор между FIR и IIR реализацией?", "options": ["Если задание требует произвольного числителя и знаменателя передаточной функции, выбирают FIR, потому что IIR допускает лишь числитель", "Если задание требует строго линейную фазу и предсказуемую задержку, выбирают FIR, а IIR даёт меньший порядок при той же маске", "Если задание требует минимальный порядок при любой маске, всегда выбирают FIR, потому что IIR не аппроксимирует резкие переходы", "Если задание не содержит требований к устойчивости, выбирают IIR, потому что только IIR-фильтры бывают неустойчивы"], "correct": 1, "explain": "Требование строго линейной фазы и постоянной групповой задержки почти всегда отдаёт выбор FIR, тогда как IIR при той же амплитудной маске обычно даёт заметно меньший порядок за счёт полюсов. Остальные варианты переворачивают эти свойства или приписывают FIR передаточную функцию со знаменателем, которой у FIR нет (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "Инженер проектирует IIR-корректор фазы для канала резольвера там, где заданию нужна именно линейная фаза, и получает фазовые искажения.", "with": "Увидев в задании требование линейной фазы, инженер сразу выбирает FIR и не тратит время на IIR-варианты, которые всё равно не подойдут.", "benefit": "Выбор структуры фильтра делается по заданию, а не методом проб."}}, {"q": "От каких величин зависит оценка порядка FIR-фильтра по формуле Кайзера?", "options": ["От числа полюсов прототипа Баттерворта, делённого на коэффициент передискретизации сигнала", "От ширины переходной полосы одной, поскольку затухание полосы задерживания в формулу Кайзера не входит", "От затухания полосы задерживания в дБ и от ширины переходной полосы, нормированной на частоту дискретизации", "От добротности Q и центральной частоты биквадной секции, аппроксимирующей заданную амплитудную маску"], "correct": 2, "explain": "Формула Кайзера оценивает порядок FIR по требуемому затуханию полосы задерживания в дБ и по нормированной ширине переходной полосы, оба параметра входят в неё одновременно. Добротность биквада и порядок прототипа Баттерворта относятся к IIR-синтезу, а не к формуле Кайзера (Proakis & Manolakis, гл. 10).", "usage": {"code": false, "without": "Инженер закладывает порядок FIR-фильтра на глаз и либо перерасходует память платы, либо не дотягивает до затухания в задании.", "with": "Подставив требуемое затухание и ширину переходной полосы в формулу Кайзера, инженер сразу получает нужный порядок FIR без перебора вариантов.", "benefit": "Порядок фильтра рассчитывается заранее, без подбора по месту."}}, {"q": "Идентификация канала токового датчика показывает, что помеха коррелирована во времени, а её спектр заметно отличается от спектра полюсов самого объекта. Какую структуру параметрической модели разумно выбрать вместо простой ARX, чтобы не смешивать динамику помехи с динамикой объекта?", "options": ["Модель all-pass с амплитудой равной единице на всех частотах", "Модель ARX с одним и тем же знаменателем для сигнала и шума", "Модель чистого FIR совсем без авторегрессионной части и памяти", "Модель ARMA с отдельным полиномом для окраски шумовой составляющей"], "correct": 3, "explain": "ARMA вводит отдельный полином для шума, поэтому его динамика не обязана совпадать с полюсами объекта; в ARX шум неявно фильтруется тем же знаменателем, что и даёт смещённую оценку при окрашенной помехе. (Proakis, гл. 12)", "usage": {"code": false, "without": "Без разделения динамики инженер натягивает ARX на коррелированную помеху и получает смещённые полюса объекта.", "with": "Зная про ARMA, он выделяет для шума отдельный полином и получает несмещённую модель объекта.", "benefit": "Корректная структура модели избавляет от систематической ошибки идентификации."}}, {"q": "При оценке коэффициентов разностного уравнения методом наименьших квадратов вход канала энкодера чистый, а на выходе присутствует коррелированная помеха, статистически независимая от входа. Что произойдёт с оценкой полюсов объекта, если использовать обычный МНК без поправок?", "options": ["Оценка полюсов станет комплексно-сопряжённой парой на единичной окружности", "Оценка полюсов сместится в сторону динамики самой помехи", "Оценка полюсов останется несмещённой независимо от коррелированности помехи", "Оценка полюсов совпадёт с истинными полюсами объекта без шума"], "correct": 1, "explain": "Обычный МНК в ARX-структуре предполагает белый шум ошибки уравнения; при коррелированной помехе оценка полюсов смещается, частично отражая динамику самой помехи, а не только объекта. (Proakis, гл. 12)", "usage": {"code": false, "without": "Инженер доверяет смещённой оценке и закладывает в фильтр несуществующий резонанс помехи.", "with": "Зная про смещение, он проверяет остатки на белизну и при необходимости меняет структуру модели.", "benefit": "Понимание источника смещения предотвращает перенос шумовой динамики в модель объекта."}}, {"q": "При подборе порядка ARX-модели канала IMU увеличение порядка с четырёх до восьми почти не снижает ошибку на новых данных, хотя ошибка на обучающей выборке падает заметно. Как правильно поступить с порядком модели в такой ситуации?", "options": ["Выбрать порядок восемь, поскольку обучающая ошибка ниже, а значит модель точнее", "Отказаться от параметрической модели и использовать только импульсную характеристику", "Оставить более низкий порядок, дающий сопоставимую ошибку на новых данных", "Увеличить порядок ещё сильнее, чтобы обучающая ошибка стремилась к нулю"], "correct": 2, "explain": "Падение ошибки только на обучающих данных при росте порядка — признак переобучения; критерии типа AIC штрафуют лишние параметры, поэтому выбирают модель наименьшей сложности при сопоставимом качестве на новых данных. (Proakis, гл. 12)", "usage": {"code": false, "without": "Инженер берёт порядок восемь и получает модель, которая шумит на новых записях.", "with": "Он сравнивает ошибку на отложенных данных и оставляет более простой порядок.", "benefit": "Выбор порядка по критерию обобщения защищает модель от переобучения."}}, {"q": "После идентификации ARX-модели канала резольвера остатки между измеренным и предсказанным выходом оказались заметно коррелированы во времени, а не похожи на белый шум. О чём это говорит и что стоит сделать дальше?", "options": ["Модель не объяснила часть динамики, порядок или структуру стоит пересмотреть", "Проблема только в единицах измерения выходного сигнала, модель менять не нужно", "Остатки коррелированы из-за округления при выводе результата на экран", "Модель идеальна, коррелированные остатки — обычное свойство любой хорошей идентификации"], "correct": 0, "explain": "Белизна остатков — стандартный тест адекватности модели: если в остатках осталась структура, часть динамики объекта не описана, и нужно увеличить порядок или сменить структуру модели. (Proakis, гл. 12)", "usage": {"code": false, "without": "Инженер принимает модель с коррелированными остатками и теряет часть динамики канала.", "with": "Проверив автокорреляцию остатков, он видит проблему и пересматривает порядок модели.", "benefit": "Тест белизны остатков ловит недообученную модель до того, как она попадёт в изделие."}}, {"q": "Идентифицированная по измерениям модель канала токового датчика дала полюс с модулем 1.03. Какой вывод и какое действие корректны перед использованием этой модели для инверсии или синтеза корректора?", "options": ["Модель устойчива, полюс чуть больше единицы не имеет значения", "Модель обязательно минимально-фазовая, раз полюс близок к окружности", "Полюс нужно просто отбросить, а остальные коэффициенты оставить без изменений", "Модель неустойчива, полюс нужно скорректировать или пересмотреть идентификацию"], "correct": 3, "explain": "Полюс с модулем больше единицы означает неустойчивую идентифицированную модель; такие результаты обычно списывают на шум оценки и корректируют, отражая полюс внутрь окружности или снижая порядок, прежде чем строить обратную систему. (Proakis, гл. 12)", "usage": {"code": false, "without": "Инженер использует неустойчивую модель и получает расходящуюся инверсию фильтра.", "with": "Проверив модуль полюсов, он видит неустойчивость и корректирует модель перед синтезом.", "benefit": "Проверка полюсов идентифицированной модели предотвращает построение неустойчивого корректора."}}, {"q": "Тестовый сигнал для идентификации канала энкодера имеет узкий спектр, сосредоточенный на одной частоте. Как это скажется на параметрической оценке ARX-модели на остальных частотах и что стоит изменить в возбуждении?", "options": ["Оценка станет точнее именно вне полосы сигнала благодаря экстраполяции модели", "Оценка станет ненадёжной вне полосы сигнала, возбуждение нужно расширить по спектру", "Оценка останется одинаково надёжной на всех частотах независимо от спектра входа", "Оценка автоматически усреднит недостающие частоты по соседним измеренным точкам"], "correct": 1, "explain": "При недостаточном возбуждении вне узкой полосы информационное содержание входа мало, и параметры модели на этих частотах оцениваются с большой дисперсией; для надёжной идентификации на всей полосе нужен сигнал с богатым спектром, например псевдослучайная последовательность. (Proakis, гл. 12)", "usage": {"code": false, "without": "Инженер идентифицирует модель по узкополосному сигналу и потом удивляется её ошибкам вне полосы теста.", "with": "Заранее оценив спектр возбуждения, он выбирает псевдослучайный сигнал и получает надёжную модель на всей полосе.", "benefit": "Достаточное по спектру возбуждение делает параметрическую оценку надёжной там, где она реально нужна."}}, {"q": "В техническом задании пульсация полосы пропускания задана как 0.5 дБ, а инженер по ошибке подставил в формулу порядка это число напрямую как линейный допуск дельта p. Как это исказит расчёт порядка фильтра?", "options": ["Порядок станет отрицательным, поэтому формула Кайзера вообще перестанет работать", "Порядок будет завышен, поскольку линейный допуск в разах больше значения в децибелах", "Порядок будет занижен, поскольку линейный допуск в разах меньше значения в децибелах", "Порядок не изменится, децибелы и линейный допуск совпадают по величине"], "correct": 2, "explain": "0.5 дБ соответствует линейному допуску около 0.057, что заметно меньше числа 0.5; подставив 0.5 как дельту напрямую, инженер завышает допустимую пульсацию и тем самым занижает требуемый порядок фильтра. (exam_guide.txt, Mock task Part A)", "usage": {"code": false, "without": "Инженер закладывает в формулу децибелы вместо линейного допуска и получает фильтр с недостаточным порядком.", "with": "Переведя дБ в линейный допуск перед расчётом, он получает верный порядок под спецификацию.", "benefit": "Правильный перевод единиц допуска спасает от заниженного порядка и неисполненной спецификации."}}, {"q": "Заказчик просит сузить переходную полосу фильтра для полосового датчика вибрации, оставив неизменными допуски пульсаций полосы пропускания и задерживания. Как это требование скажется на порядке FIR-фильтра по методу окон?", "options": ["Порядок вырастет, узкая переходная полоса требует более длинной импульсной характеристики", "Порядок станет нецелым и потребует округления вниз без потери точности", "Порядок снизится, узкая переходная полоса упрощает форму импульсной характеристики", "Порядок не изменится, переходная полоса не входит в формулу порядка"], "correct": 0, "explain": "В формуле Кайзера порядок FIR обратно пропорционален ширине переходной полосы; при неизменных допусках пульсаций сужение переходной полосы требует более длинного фильтра. (exam_guide.txt, Mock task Part A)", "usage": {"code": false, "without": "Инженер сужает переходную полосу и не пересчитывает порядок, получая фильтр, который не дотягивает до спецификации.", "with": "Пересчитав порядок по формуле Кайзера, он закладывает достаточную длину под новое требование.", "benefit": "Понимание связи порядка и переходной полосы не даёт занизить длину фильтра."}}, {"q": "Частота дискретизации канала тока 4 кГц, а полоса задерживания начинается с 1.2 кГц. При вводе спецификации в функцию проектирования фильтра инженер указал частоту среза как 1200 без деления на частоту Найквиста. К чему это приведёт?", "options": ["Функция автоматически поймёт герцы и рассчитает фильтр правильно без нормировки", "Функция округлит частоту до ближайшей нормированной и ошибки не возникнет", "Функция проигнорирует лишний масштаб и просто увеличит порядок фильтра", "Функция получит частоту вне допустимого нормированного диапазона и построит ошибочный фильтр"], "correct": 3, "explain": "Большинство функций синтеза фильтров ожидают частоту, нормированную к частоте Найквиста, в диапазоне от нуля до единицы; подставив герцы без деления на fs/2, инженер выходит за этот диапазон и получает ошибку или бессмысленный фильтр. (exam_guide.txt, Mock task Part A)", "usage": {"code": false, "without": "Инженер вводит герцы напрямую и получает фильтр с частотой среза совсем не там, где нужно.", "with": "Разделив частоту среза на частоту Найквиста, он передаёт функции корректно нормированное значение.", "benefit": "Правильная нормировка частоты избавляет от грубой ошибки на входе синтеза фильтра."}}, {"q": "Спецификация корректора для квадратурного канала резольвера требует строго линейной фазы в полосе пропускания, а вычислительные ресурсы платы не критичны. Какой тип фильтра стоит выбрать и почему?", "options": ["IIR, поскольку каскад биквадов автоматически выравнивает групповую задержку", "FIR, поскольку симметричная импульсная характеристика гарантирует линейную фазу", "IIR, поскольку меньший порядок всегда даёт более линейную фазу", "FIR, поскольку он всегда устойчив вне зависимости от коэффициентов"], "correct": 1, "explain": "FIR с симметричной или антисимметричной импульсной характеристикой даёт точно линейную фазу по построению, тогда как типовой IIR такой линейности не обеспечивает без отдельного all-pass корректора; при отсутствии жёстких ограничений на порядок это делает FIR естественным выбором. (exam_guide.txt, Design an FIR by window method)", "usage": {"code": false, "without": "Инженер берёт IIR ради меньшего порядка и потом борется с нелинейной фазой отдельным корректором.", "with": "Заранее выбрав симметричный FIR, он получает линейную фазу без дополнительных ступеней коррекции.", "benefit": "Выбор FIR под требование линейной фазы убирает лишний этап коррекции из цепочки."}}, {"q": "Инженер идентифицирует ARX-модель канала измерения скорости по сигналу энкодера мобильного робота. Он повышает порядок модели, пока ошибка предсказания на обучающей выборке не станет почти нулевой, и на этом останавливается. Чем рискован такой выбор порядка?", "options": ["Модель подстроится под шум измерений энкодера, и её точность на новых данных ухудшится", "Оценки коэффициентов станут менее чувствительны к шуму благодаря избыточному числу параметров", "Порядок модели перестанет влиять на форму импульсной характеристики идентифицированного канала", "Модель потеряет устойчивость, и её полюсы гарантированно окажутся вне единичной окружности"], "correct": 0, "explain": "Минимизация ошибки только на обучающих данных при избыточном порядке — классический признак переобучения: модель захватывает шум как часть динамики канала и хуже работает на новых записях. Устойчивость не теряется автоматически, а лишние параметры обычно повышают, а не снижают чувствительность к шуму (общепринятый факт теории идентификации, ср. Proakis, гл. об оценивании параметров).", "usage": {"code": false, "without": "Не зная о переобучении, инженер закладывает в контроллер модель, точную только на записанных ранее данных, и она плывёт при смене режима движения робота.", "with": "Зная о переобучении, инженер сравнивает ошибку на обучающей и отдельной проверочной выборке и берёт минимальный порядок, при котором обе малы.", "benefit": "Контроллер получает модель канала, которая устойчиво работает и на новых режимах движения."}}, {"q": "При оценке коэффициентов разностного уравнения канала резольвера методом наименьших квадратов входной сигнал возбуждения на большей части записи оказался слабым и почти постоянным. Как это скажется на оценке модели?", "options": ["Оценки коэффициентов станут точнее, поскольку постоянный участок сигнала снижает влияние шума", "Порядок идентифицированной модели автоматически понизится до минимально необходимого", "Полюсы и нули идентифицированной модели переместятся строго на единичную окружность", "Матрица регрессии станет плохо обусловленной, и коэффициенты получат большой разброс"], "correct": 3, "explain": "Слабое почти постоянное возбуждение не обеспечивает нужной для МНК персистентности: матрица регрессии приближается к вырожденной, и оценки коэффициентов получают большой разброс, даже если средняя ошибка предсказания невелика. Само по себе постоянство сигнала не подавляет шум и не меняет порядок или расположение полюсов (стандартный факт теории оценивания, ср. Proakis, гл. об адаптивном оценивании).", "usage": {"code": false, "without": "Не проверив возбуждение, инженер доверяет коэффициентам модели резольвера, которые на самом деле определены почти произвольно из-за плохо обусловленной регрессии.", "with": "Зная о требовании к возбуждению, инженер добавляет в тестовый сигнал достаточное разнообразие частот перед сбором данных для МНК.", "benefit": "Идентифицированная модель канала резольвера получает надёжные, воспроизводимые коэффициенты."}}, {"q": "После идентификации модели канала IMU инженер строит автокорреляцию остатков предсказания и видит выраженный пик на ненулевом лаге вместо шума, близкого к белому. О чём это говорит?", "options": ["Идентифицированные полюсы модели в этом случае обязательно лежат вне единичной окружности", "Порядок или структура модели недостаточны, и в остатках осталась неучтённая динамика канала", "Модель идеально описывает канал, а замеченный пик - обычный статистический артефакт вычислений", "Использованный для идентификации тестовый сигнал был белым шумом, что и должно давать такой пик"], "correct": 1, "explain": "Белизна остатков — стандартный критерий адекватности модели: не белый остаток с пиком на ненулевом лаге показывает, что часть динамики канала не объяснена выбранной структурой или порядком модели. Ни выбор тестового сигнала, ни расположение полюсов сами по себе такого пика не объясняют (общепринятый критерий валидации, ср. Proakis, гл. об оценивании параметров).", "usage": {"code": false, "without": "Без проверки остатков инженер принимает модель канала IMU как окончательную, хотя она не учитывает часть реальной динамики сенсора.", "with": "Проверив автокорреляцию остатков, инженер видит невыявленную динамику и повышает порядок или меняет структуру модели.", "benefit": "Модель канала IMU точнее описывает реальный сенсор, а не только шумную выборку."}}, {"q": "После идентификации ARMA-модели канала токового датчика один из полюсов оказался на расстоянии 1.02 от начала координат на z-плоскости. Что это означает для использования модели?", "options": ["Модель устойчива, поскольку расстояние 1.02 меньше расстояния до ближайшего нуля", "Модель линейна по фазе, так как идентифицированный полюс расположен вне единичной окружности", "Идентифицированная модель канала неустойчива и не годится как прямая модель датчика", "Модель обязательно минимально-фазовая, потому что полюс лежит рядом с единичной окружностью"], "correct": 2, "explain": "Полюс за пределами единичной окружности делает идентифицированную дискретную модель неустойчивой независимо от расположения нулей, поэтому такую модель нельзя напрямую использовать как модель датчика — её отбраковывают или переоценивают с ограничением. Тип фазы определяется расположением нулей и симметрией импульсной характеристики, а не самой близостью полюса к окружности (стандартный факт теории ЛДС, ср. exam_guide.txt, вопросы про полюсы и устойчивость).", "usage": {"code": false, "without": "Не проверив радиус полюса, инженер встраивает в цепочку обработки модель токового датчика, которая расходится при моделировании отклика.", "with": "Проверив |z|=1.02>1, инженер отбраковывает модель и переоценивает канал с ограничением на радиус полюсов.", "benefit": "В систему попадает только заведомо устойчивая модель канала токового датчика."}}, {"q": "Для сглаживания сигнала энкодера в контуре управления роботом с жёстким требованием на минимальную задержку сравнивают эквиритмичный FIR порядка около 37 и IIR-прототип порядка 6 с той же переходной полосой. Какой вывод корректен?", "options": ["IIR даёт заметно меньший порядок и нагрузку, но нуждается в отдельной коррекции фазы", "Порядок FIR и IIR должен совпадать, если переходная полоса задана одинаковой", "IIR обеспечивает точную линейную фазу без каких-либо дополнительных корректоров", "FIR всегда быстрее IIR в реальном времени независимо от порядка, поэтому выбор очевиден"], "correct": 0, "explain": "При одинаковой переходной полосе и подавлении IIR часто достигает спецификации при значительно меньшем порядке, что снижает число умножений на отсчёт и задержку, но не даёт точной линейной фазы — при необходимости строгой фазы добавляют all-pass корректор. FIR не «всегда быстрее», и порядки FIR и IIR для одной спецификации обычно разные (exam_guide.txt, ответ на вопрос про выбор FIR/IIR).", "usage": {"code": false, "without": "Не сравнив порядки, инженер берёт FIR порядка 37 в контуре с жёсткой задержкой и получает лишнюю вычислительную нагрузку и задержку.", "with": "Сравнив порядки, инженер берёт IIR порядка 6 и добавляет лёгкий all-pass корректор фазы, где это важно.", "benefit": "Контур управления получает нужное подавление шума при заметно меньшей задержке и нагрузке."}}, {"q": "В журнале проекта фильтрации скорости энкодера записано: окно Хэмминга обеспечивает подавление около 53 дБ, а по спецификации требуется не менее 60 дБ подавления в полосе задерживания. Какое решение соответствует стандартной практике выбора окна?", "options": ["Оставить окно Хэмминга и просто удвоить число отсчётов импульсной характеристики", "Заменить окно на прямоугольное, поскольку оно даёт максимальное подавление боковых лепестков", "Снизить требование по подавлению до 53 дБ, подстроив спецификацию под окно Хэмминга", "Перейти на окно Кайзера и подобрать параметр бета под требуемое подавление 60 дБ"], "correct": 3, "explain": "Окно Хэмминга имеет фиксированный предел подавления боковых лепестков около 53 дБ независимо от длины фильтра, поэтому увеличение порядка задачу не решает; окно Кайзера параметром бета позволяет подобрать нужный уровень подавления. Прямоугольное окно даёт наихудшее, а не наилучшее подавление боковых лепестков (project.txt, запись журнала о переходе с Хэмминга на Кайзера).", "usage": {"code": false, "without": "Не зная о пределе окна Хэмминга, инженер наращивает порядок фильтра, так и не добираясь до требуемых 60 дБ подавления.", "with": "Зная о пределе окна, инженер сразу переходит на Кайзера и подбирает бета под спецификацию по формуле kaiserord.", "benefit": "Фильтр скорости энкодера достигает требуемого подавления без лишнего наращивания порядка."}}, {"q": "Спецификация фильтра для канала резольвера задаёт пульсации в полосе пропускания как 0.5 дБ, а формула оценки порядка Ремеза принимает на входе линейные допуски δp и δs. Что нужно сделать перед подстановкой в формулу?", "options": ["Перевести требование сразу в частоту среза фильтра, полностью минуя понятие пульсаций в полосах", "Пересчитать допуск 0.5 дБ в соответствующую линейную величину δp, а не подставлять число дБ напрямую", "Подставить число 0.5 напрямую как δp, поскольку дБ и линейные единицы совпадают для малых значений", "Заменить допуск в полосе пропускания на допуск в полосе задерживания, они считаются взаимозаменяемыми"], "correct": 1, "explain": "Формулы оценки порядка используют линейные допуски δp и δs, тогда как спецификация в дБ описывает логарифмическое отношение амплитуд, поэтому 0.5 дБ сначала пересчитывают в линейный допуск и только потом подставляют. дБ и линейная величина не совпадают даже при малых значениях, а допуски полосы пропускания и задерживания — разные величины (общепринятый факт синтеза FIR, ср. exam_guide.txt, вопрос про спецификацию фильтра).", "usage": {"code": false, "without": "Подставив 0.5 напрямую вместо δp, инженер получает неверную оценку порядка фильтра резольвера и фильтр не проходит проверку по маске.", "with": "Пересчитав 0.5 дБ в линейный допуск, инженер получает корректную оценку порядка перед синтезом фильтра Ремеза.", "benefit": "Синтезированный фильтр канала резольвера с первого раза укладывается в заданную маску."}}, {"q": "Для фильтра, обрабатывающего сигнал вибрации IMU, сужают переходную полосу вдвое, не меняя требования по пульсациям в полосах пропускания и задерживания. Как это скажется на порядке FIR-фильтра и вычислительной нагрузке?", "options": ["Порядок фильтра уменьшится, поскольку более узкая полоса требует меньше коэффициентов", "Порядок фильтра не изменится, так как он зависит только от требований по пульсациям", "Порядок фильтра примерно удвоится, и вырастет число умножений на каждый отсчёт", "Порядок фильтра станет нулевым, если переходная полоса стремится к нулю на практике"], "correct": 2, "explain": "Оценки порядка FIR обратно пропорциональны ширине переходной полосы при фиксированных пульсациях, поэтому сужение полосы вдвое примерно удваивает необходимый порядок и число операций на отсчёт. Порядок зависит не только от пульсаций, и сужение полосы никогда не снижает требуемый порядок (exam_guide.txt, обсуждение зависимости порядка от переходной полосы и MAC-нагрузки).", "usage": {"code": false, "without": "Не оценив зависимость от полосы, инженер сужает переходную полосу фильтра IMU и получает неожиданную перегрузку по вычислениям на встраиваемом контроллере.", "with": "Заранее оценив рост порядка, инженер закладывает запас по вычислительным ресурсам ещё на этапе спецификации.", "benefit": "Фильтр вибрации IMU укладывается в бюджет вычислений контроллера без сюрпризов на этапе реализации."}}, {"q": "В проекте по очистке сигнала скорости энкодера резкий фильтр нижних частот выглядит отлично по амплитудной характеристике, но контур управления начинает раскачиваться. В логе отмечено, что фильтр вносит 30 миллисекунд групповой задержки. В чём причина раскачивания контура?", "options": ["Большая групповая задержка фильтра запаздывает в обратной связи контура и снижает запас по фазе", "Резкий фильтр нижних частот всегда увеличивает уровень шума на выходе контура управления", "Групповая задержка влияет только на форму сигнала и никак не связана с устойчивостью обратной связи", "Раскачивание вызвано исключительно квантованием коэффициентов фильтра до fixed-point формата"], "correct": 0, "explain": "Любая задержка в тракте обратной связи, включая групповую задержку фильтра, действует как дополнительное запаздывание в контуре и уменьшает запас по фазе, что и вызывает раскачивание; резкий переход сам по себе даёт большую задержку, а квантование здесь не упоминается и не при чём. Задержка напрямую влияет на устойчивость обратной связи, а не только на форму сигнала (project.txt, пример про резкий ФНЧ и 30 мс задержки).", "usage": {"code": false, "without": "Не связав раскачивание с задержкой, инженер бесконечно подбирает коэффициенты регулятора, не устраняя первопричину в фильтре.", "with": "Опознав причину в групповой задержке, инженер выбирает менее резкий фильтр или корректирует фазу, восстанавливая запас устойчивости.", "benefit": "Контур управления роботом перестаёт раскачиваться при сохранении подавления шума энкодера."}}, {"q": "Для фильтрации сигнала токового датчика реализован IIR высокого порядка как единая прямая форма, коэффициенты которой квантуются в формат Q1.7. После квантования полюс сместился ближе к единичной окружности, и фильтр стал заметно чувствительнее к малейшим изменениям коэффициентов. Какое структурное решение стандартно снижает эту чувствительность?", "options": ["Увеличить порядок фильтра ещё сильнее, сохранив прежнюю прямую форму реализации целиком", "Перейти на формат с меньшим числом дробных разрядов, чем Q1.7, оставив те же коэффициенты", "Заменить IIR-фильтр на FIR такой же длины, полностью сохранив структуру реализации", "Реализовать фильтр как каскад биквадов второго порядка вместо прямой формы высокого порядка"], "correct": 3, "explain": "Прямая форма высокого порядка концентрирует чувствительность всех полюсов в небольшом наборе коэффициентов, поэтому даже малая ошибка квантования сильно смещает полюса; каскад секций второго порядка локализует каждую пару полюсов и нулей в своих коэффициентах, снижая чувствительность и риск потери устойчивости. Увеличение порядка или уменьшение числа дробных разрядов только ухудшает ситуацию (exam_guide.txt, вопрос про Q1.7 и каскадные секции).", "usage": {"code": false, "without": "Оставив прямую форму высокого порядка, инженер получает фильтр токового датчика, который теряет устойчивость после квантования коэффициентов.", "with": "Перейдя на каскад биквадов, инженер локализует ошибку квантования в каждой секции отдельно и сохраняет устойчивость.", "benefit": "Фильтр токового датчика на встраиваемом контроллере остаётся устойчивым после квантования коэффициентов."}}, {"q": "При параметрической идентификации модель y[n] = a1·y[n-1] + b0·x[n] оценивают по трём отсчётам: вход x[0]=x[1]=x[2]=1, выход y[-1]=0, y[0]=1, y[1]=1.5, y[2]=1.75. Найдите МНК-оценку коэффициента a1.", "options": ["a1 = 0.67", "a1 = 0.83", "a1 = 0.50", "a1 = 0.33"], "correct": 2, "explain": "Шаг 1: регрессор φ[n]=[y[n-1], x[n]], нормальные уравнения Φ^T Φ θ = Φ^T y по точкам n=0,1,2. Шаг 2: Φ^T Φ = [[3.25,2.5],[2.5,3]], Φ^T y = [4.125, 4.25]. Шаг 3: определитель 3.5, a1=(3·4.125−2.5·4.25)/3.5=0.5, b0=(3.25·4.25−2.5·4.125)/3.5=1.0, модель воспроизводит данные точно. Проверка при постоянном входе: Δy[2]/Δy[1]=0.25/0.5=0.5. Дистрактор 0.3   const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  const syncModal = document.getElementById("syncModal");

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
