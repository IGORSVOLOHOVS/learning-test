<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRC 2: Writing our Results и C·M·E·L·R</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<style>
  .katex { font-size: 1.08em; }
  .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; }
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .qimg { margin: 0 0 12px; }
  .qimg a { display: block; max-width: 560px; }
  .qimg img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); }
  .qimg figcaption { margin-top: 4px; font-size: .72rem; color: var(--muted); }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>

    <button class="btn" id="syncMergeBtn">🔄 Синхронизировать (свежее побеждает)</button>
    <button class="btn secondary" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "trc_writing_results_cmelr";
  const QUESTIONS = [{"q": "Каждую статью корпуса читают через пять линз C·M·E·L·R (five lenses). Что означают буквы?", "options": ["Context, Model, Experiment, Literature, Results — контекст, модель, эксперимент, литература, результаты", "Claim, Measurement, Error, Latency, Robustness — заявка, измерение, ошибка, задержка, устойчивость", "Claim, Method, Evidence, Limits, Reproducibility — заявка, метод, доказательства, пределы, воспроизводимость", "Concept, Method, Evaluation, Lessons, Review — идея, метод, оценка, выводы, обзор работ"], "correct": 2, "explain": "Каждая линза — вопрос к статье. C: что авторы говорят, что их работа делает. M: на чём запускали, с какими данными, с чем сравнивали. E: какое число это показывает и при каких условиях. L: что не работает или не проверялось. R: можно ли получить код и данные. Дистракторы путают линзы с частями статьи (Literature, Results) или с метриками (Latency, Error): линза — это вопрос, а не показатель.", "usage": {"code": false, "without": "Ты читаешь статью про датчик дуги для WAAM и пишешь в заметке: «хорошая система, быстрая». Через месяц не помнишь, на чём мерили и есть ли код.", "with": "Пять строк: C — что обещают, M — сварочный стенд и сравнение, E — 12 ms на кадр (Table 3, p. 6), L — только одна проволока, R — кода нет.", "benefit": "Одна заметка отвечает на все вопросы, которые потом задаст раздел результатов"}, "img": {"src": "img/trc_writing_results_cmelr/01.svg", "alt": "Статья и пять линз C, M, E, L, R, у каждой знак вопроса"}}, {"q": "Последняя графа заметки в Homework 1 — Claim earned. Что в ней пишут?", "options": ["Дословную цитату из аннотации, где авторы сами формулируют свой главный результат статьи", "Одно предложение: что сделано, насколько хорошо, при каких условиях и где измерено", "Оценку от 1 до 10: насколько читатель верит заявке авторов после чтения", "Список всех чисел из таблиц результатов, с номерами страниц и рисунков"], "correct": 1, "explain": "Claim earned — это заявка, урезанная до того, что доказано, и именно с ним потом цитируют. Пример гайда для Kuhne2025a: «Halved latency on a CM4, at 20 FPS, in a 4 m by 4 m room, no flight». Цитата из аннотации — это линза C, реклама, а не заработанное; балл ничего не говорит об условиях; список чисел — это линза E без вывода.", "usage": {"code": false, "without": "В отчёте по практике ты пишешь «алгоритм сокращает задержку вдвое», как в аннотации, и руководитель спрашивает: на какой плате, при какой частоте?", "with": "Ты пишешь: «вдвое меньше задержка на Raspberry Pi CM4 при 20 FPS, в комнате 4 на 4 м, без полёта» — и вопрос не возникает.", "benefit": "Предложение для ссылки готово ещё на этапе чтения"}, "img": {"src": "img/trc_writing_results_cmelr/02.svg", "alt": "Карточка заметки: строки C, M, E, L, R и последняя графа Claim earned со знаком вопроса"}}, {"q": "Чем абзац раздела результатов обзора (results paragraph) отличается от заметки по одной статье?", "options": ["Абзац пересказывает статьи по очереди, по одной на предложение, в порядке их номеров в корпусе", "Абзац начинается с того, что исследования показывают вместе, а каждое — как доказательство", "Абзац переносит заметки C·M·E·L·R целиком и дословно, только ключи заменяет на ссылки журнала", "Абзац подробно описывает одну лучшую статью темы, а остальные упоминает в конце"], "correct": 1, "explain": "Ключевая фраза лекции: «A note says what one paper did. A results paragraph says what the papers show together, and proves it with each one.» Черновик пишется по заметкам, статья за статьёй, и потому звучит как заметки. Раздел результатов пишется наоборот: сначала общая мысль, потом исследования как её доказательства. Пересказ по очереди и перенос заметок — ровно та ошибка, которую лекция учит исправлять.", "usage": {"code": false, "without": "Ты пишешь обзор датчиков для робота-сварщика: «Статья 1 сделала…, статья 2 сделала…». Читатель дочитывает и не понимает, что из этого следует.", "with": "Ты начинаешь с «Лишь три из 20 работ испытывали датчик на реальной дуге», а дальше каждая работа подтверждает или нарушает эту картину.", "benefit": "Абзац говорит что-то о поле, а не о списке статей"}, "img": {"src": "img/trc_writing_results_cmelr/03.svg", "alt": "Рядом: заметка по одной статье со строками C M E L R и абзац раздела результатов"}}, {"q": "Маршрут нашего обзора — семь шагов от поиска до статьи. Какие из них составляют Homework 2 (раздел вашей темы)?", "options": ["Шаги 1 и 2: поиск, отбор и таблица извлечения данных (charting table) по всем 56 исследованиям", "Шаги 3 и 4: заметки C·M·E·L·R по парам и их сравнение, из которого вышли шесть тем обзора", "Шаг 7: соединить шесть разделов в одну статью и отправить её в Transport and Telecommunication", "Шаги 5 и 6: написать результаты своей темы и проверить их — пересчёт, переписывание, ссылки"], "correct": 3, "explain": "Первые четыре шага позади: поиск и отбор (56 исследований из 1,872 записей), таблица извлечения (charting table), ваши заметки C·M·E·L·R и сравнение заметок в парах, которое дало темы. Письмо — это шаги 5 и 6: результаты по теме и их проверка (recount, rewrite, check). Шаг 7 — сборка шести разделов в одну статью и подача в журнал.", "usage": {"code": false, "without": "Ты садишься писать раздел, не зная, что заметки уже сверены парой, и заново перечитываешь все статьи с нуля.", "with": "Ты знаешь, что заметки и темы — готовый материал, и тратишь время на то, что от тебя ждут: текст и его проверку.", "benefit": "Понятно, какая работа твоя, а какая уже сделана"}, "img": {"src": "img/trc_writing_results_cmelr/04.svg", "alt": "Цепочка из семи шагов от поиска до статьи и вопрос, какие из них Homework 2"}}, {"q": "Что такое таблица трассировки (trace table, TC-CMELR-TRACE-TABLE.xlsx)?", "options": ["Сводная таблица характеристик всех исследований, которая выйдет вместе со статьёй как Table S1", "Журнал разногласий двух читателей пары: Agree, Partly или Disagree по каждой линзе каждой статьи", "Список 56 статей корпуса с DOI, ключами цитирования и номерами пар A, B и C для чтения", "Для каждой заметки эталонной таблицы — страница, раздел и фраза из PDF для поиска через Ctrl+F"], "correct": 3, "explain": "Эталонная таблица говорила, ЧТО записано по каждой статье, трассировка — ГДЕ это лежит: 406 строк, около семи на статью, у каждой страница, раздел, синяя фраза для Ctrl+F, предложение со страницы и оранжевая графа «Watch out». Таблица характеристик — это charting table (Table S1); журнал Agree/Partly/Disagree — лист Compare из Homework 1; список статей — reading list корпуса.", "usage": {"code": false, "without": "Ты ссылаешься на число из своей заметки, а партнёр спрашивает, где оно в статье. Ты листаешь 35 страниц PDF и не находишь.", "with": "Ты открываешь строку трассировки, вставляешь фразу в Ctrl+F и через минуту стоишь на нужной строке страницы.", "benefit": "Каждую заметку можно проверить по странице за пять минут"}, "img": {"src": "img/trc_writing_results_cmelr/05.svg", "alt": "Электронная таблица TC-CMELR-TRACE-TABLE.xlsx: строки заметок и столбцы со знаками вопроса"}}, {"q": "Обычный порядок научной статьи называют IMRaD. Что это?", "options": ["Introduction, Model, Review and Data — введение, модель, обзор литературы и данные", "Idea, Measurement, Results and Development — идея, измерение, результаты и развитие", "Introduction, Methods, Results and Discussion — введение, методы, результаты и обсуждение", "Introduction, Materials, Related work and Design — введение, материалы, обзор работ, проект"], "correct": 2, "explain": "IMRaD — соглашение о порядке частей, и именно поэтому на него можно опираться: у 7-страничного доклада Temburu2020 и 35-страничной статьи Liu2025a один скелет. Инженерные статьи обычно добавляют обзор работ (related work) после введения и часто сливают обсуждение с результатами или заключением. Быстрый проход по этой карте — first pass по Keshav (2007): заголовок, аннотация, введение, заголовки разделов, выводы, 5–10 минут.", "usage": {"code": false, "without": "Ты читаешь статью про калибровку руки робота с первой строки и застреваешь на второй странице в выкладках метода.", "with": "Ты сначала смотришь заголовки разделов и сразу идёшь в Experiments за числами, а в Conclusion — за ограничениями.", "benefit": "35 страниц превращаются в восемь мест, куда стоит смотреть"}, "img": {"src": "img/trc_writing_results_cmelr/06.svg", "alt": "Страница статьи из четырёх блоков с буквами I, M, R, D"}}, {"q": "По какому чек-листу отчётности строится наш scoping review?", "options": ["PRISMA-ScR: 22 пункта, из них два (12 и 16, критическая оценка источников) необязательны", "PRISMA 2020 для систематических обзоров: все пункты обязательны, включая оценку риска смещения", "Только IMRaD журнала: введение, методы, результаты, обсуждение, без чек-листа пунктов", "CONSORT для клинических испытаний (рандомизированных): с обязательной слепой оценкой"], "correct": 0, "explain": "Scoping review следует PRISMA-ScR (Tricco et al., 2018): 22 пункта, необязательны 12 и 16 — критическая оценка источников. Каждая часть статьи отвечает на свои пункты: Results — пункты 14–18, Discussion — 19–21, финансирование и декларации — 22. Структура задана, от нас — содержание. PRISMA 2020 — для систематических обзоров, CONSORT — для клинических испытаний, а IMRaD — порядок частей, а не чек-лист.", "usage": {"code": false, "without": "Ты пишешь раздел результатов, как тебе удобно, а соавтор присылает методы в другом порядке, и статья не стыкуется.", "with": "Все пишут по одним пунктам PRISMA-ScR, и шесть разделов собираются в одну статью без переделки.", "benefit": "Структура статьи решена заранее, спорить приходится только о содержании"}, "img": {"src": "img/trc_writing_results_cmelr/07.svg", "alt": "Стопка работ обзора и чек-лист отчётности с неизвестным названием"}}, {"q": "Чем отличаются две формы ссылки — parenthetical и narrative?", "options": ["Parenthetical — для статей в журналах, а narrative — для докладов на конференциях (proceedings)", "В parenthetical подлежащее — находка, источник в скобках; в narrative подлежащее — сами авторы", "Parenthetical — со страницей в скобках, narrative — без страницы, только с годом", "Parenthetical — для одного исследования, narrative — для группы из нескольких работ"], "correct": 1, "explain": "Решает вопрос: что важнее — находка или исследование? «...cut the latency from 148 to 75 ms (Kühne et al., 2025a)» — parenthetical, речь о находке. «Kühne et al. (2025a) timed both pipelines on the same board...» — narrative, речь о том, как авторы мерили. Большинство предложений обзора — parenthetical, потому что обзор — о находках. Narrative нужен, когда сопоставляешь исследования, передаёшь заявку, которую авторы не показали, или их собственное ограничение. Тип издания и страница форму не определяют.", "usage": {"code": false, "without": "В отчёте все ссылки идут как «Иванов и др. показали…», и текст читается как перечень фамилий, а не результатов.", "with": "Находки идут с источником в скобках, а фамилии в подлежащем остаются там, где важно, кто именно это сделал.", "benefit": "Форма ссылки показывает читателю, о чём предложение"}, "img": {"src": "img/trc_writing_results_cmelr/08.svg", "alt": "Статья-источник и две формы ссылки parenthetical и narrative в виде строк текста со знаками вопроса"}}, {"q": "Журнал Transport and Telecommunication, для которого мы пишем общую статью, о прямых цитатах (direct quotes) говорит:", "options": ["Цитат нет: только пересказ своими словами, с источником", "Цитаты можно, если указана страница и они короче 40 слов", "Цитаты можно только в разделе Discussion, в кавычках", "Цитаты обязательны при каждом числе, чтобы его проверить"], "correct": 0, "explain": "Правило журнала: no quotations, paraphrase only, with the source cited. Поэтому точные слова авторов со страницей живут в ваших заметках — это доказательство для партнёра, — а в статье каждое предложение ваше, со ссылкой. Порог в 40 слов — правило APA для блочных цитат, к нашему журналу оно не относится.", "usage": {"code": false, "without": "Ты вставляешь в отчёт фразу из даташита датчика в кавычках, а журнал возвращает рукопись: цитаты не принимаются.", "with": "Цитата остаётся в заметке со страницей, а в тексте — твоё предложение с тем же смыслом и ссылкой.", "benefit": "Рукопись не возвращают за форму, а заметки остаются проверяемыми"}, "img": {"src": "img/trc_writing_results_cmelr/09.svg", "alt": "Обложка журнала Transport and Telecommunication и облачко с прямой цитатой и вопросом"}}, {"q": "Куда в статье обзора идёт заметка M (метод: плата, данные, условия теста)?", "options": ["В обсуждение (Discussion), где спорят, хорош ли метод каждой из статей и почему он выбран", "Во введение, где объясняют по шагам, как работает каждый метод корпуса", "В результаты, в таблицу характеристик исследований: плата, данные, условия теста", "В раздел Methods нашего обзора, рядом с поисковой строкой и датами поиска"], "correct": 2, "explain": "Move 1, Place: каждая линза идёт в своё место. C — в результаты (что каждое исследование хотело сделать) и в обсуждение (где заявки обгоняют доказательства). M — в таблицу характеристик исследований. E — в результаты: скорость, мощность, точность и как их мерили. L — в результаты (что редко сообщают) и в обсуждение (пробелы). R — в результаты (сколько исследований открывают код) и в обсуждение (рекомендации). Заметка о методе описывает, а не спорит, поэтому в обсуждение не идёт. Наш раздел Methods — о том, как МЫ делали обзор, а не о методах статей.", "usage": {"code": false, "without": "Ты вставляешь «Raspberry Pi CM4, VINS-Mono, комната с motion capture» в каждый абзац текста, и абзацы раздуваются.", "with": "Плата, данные и условия стоят одной строкой в таблице, а текст говорит о закономерностях и ссылается на неё.", "benefit": "Описание методов не съедает место, отведённое под выводы"}, "img": {"src": "img/trc_writing_results_cmelr/10.svg", "alt": "Заметка с буквами C M E L R, выделена M, пунктирная стрелка к четырём разделам статьи, место не указано"}}, {"q": "Статья двух авторов, Xu и de Croon, 2025. Как сослаться по правилам журнала?", "options": ["(Xu & de Croon, 2025) в скобках, Xu & de Croon (2025) в тексте предложения", "(Xu and de Croon, 2025) в скобках, Xu and de Croon (2025) в предложении", "(Xu et al., 2025) в скобках, Xu et al. (2025) в предложении", "(Xu2025e) в скобках, Xu2025e (2025) в тексте предложения"], "correct": 1, "explain": "Два автора — оба, через «and»; журнал никогда не пишет «&». et al. — только с трёх авторов. Ключ Xu2025e — имя файла в нашей библиотеке, в тексте ключей не бывает. Ошибка «Xu et al. (2025)» для двух авторов прямо названа в списке типовых ошибок гайда.", "usage": {"code": false, "without": "В отчёте ты пишешь «(Smith & Lee, 2024)» по привычке из APA, а журнал требует «and» и возвращает правку по всем ссылкам.", "with": "Ты сразу пишешь «(Smith and Lee, 2024)» по шаблону журнала, и редактор ссылок не трогает.", "benefit": "Ссылки с первого раза в форме журнала"}, "img": {"src": "img/trc_writing_results_cmelr/11.svg", "alt": "Карточка статьи двух авторов Xu и de Croon, 2025 и пустая ссылка в скобках"}}, {"q": "У статьи пять авторов: Temburu, Datar, Singh, Malviya, Patkar (2020). Как её цитировать с первого упоминания?", "options": ["(Temburu, Datar, Singh, Malviya and Patkar, 2020) — все пять в первый раз, потом et al.", "(Temburu et al., 2020) — первый автор и et al. курсивом, уже с первой ссылки", "(Temburu and Datar, 2020) — первые два автора, остальные три опускаются", "(Temburu et al., 2020, p. 6) — первый автор, et al. и страница с числом"], "correct": 1, "explain": "Правило шаблона журнала: три автора и больше — первый автор и et al., курсивом, с первой же ссылки, как в шаблоне (Zhai et al., 2023). Все имена при первой ссылке — старое правило APA 6 для 3–5 авторов, у нас его нет. Два автора — только для статей с двумя авторами. Страницы в тексте не ставим: они нужны лишь для цитат, а цитат журнал не берёт.", "usage": {"code": false, "without": "Ты при первой ссылке выписываешь всех пятерых авторов, и предложение становится длиннее, чем мысль в нём.", "with": "Ты пишешь (Temburu et al., 2020) с первого раза, и предложение остаётся коротким.", "benefit": "Ссылка не заслоняет утверждение"}, "img": {"src": "img/trc_writing_results_cmelr/12.svg", "alt": "Карточка работы с пятью авторами Temburu, Datar, Singh, Malviya, Patkar, 2020 и пустая ссылка"}}, {"q": "Одно утверждение опирается на два исследования: Temburu et al. (2020) и Kühne et al. (2025a). Как оформить скобку?", "options": ["(Temburu et al., 2020; Kühne et al., 2025a) — по году, от более старой работы к новой", "(Temburu et al., 2020, Kühne et al., 2025a) — по году, через обычную запятую", "(Kühne et al., 2025a; Temburu et al., 2020) — по алфавиту, через точку с запятой", "(Kühne et al., 2025a) (Temburu et al., 2020) — две отдельные скобки подряд"], "correct": 2, "explain": "Общее правило всех author-date стилей: несколько исследований в одной скобке — по алфавиту первого автора, через точку с запятой. K раньше T, поэтому Kühne первым, хотя статья новее. Разбивать ссылки нужно, только когда разные части предложения держатся на разных исследованиях: «...did not run on a Jetson TX2 (Jeon et al., 2021), and ... gave no pose (Manore et al., 2021)».", "usage": {"code": false, "without": "Ты ставишь ссылки в порядке, в каком читал статьи, и в каждом абзаце порядок разный.", "with": "Скобка всегда по алфавиту, и читатель сразу видит, сколько и каких работ держат утверждение.", "benefit": "Одинаковый порядок во всей статье, без ручных решений"}, "img": {"src": "img/trc_writing_results_cmelr/13.svg", "alt": "Предложение со скобкой-ссылкой и две работы под ним: Temburu et al. 2020 и Kühne et al. 2025a"}}, {"q": "Когда в тексте нашей статьи ставят номер страницы источника?", "options": ["Никогда: страница нужна лишь для цитат, а их журнал не берёт; страницы — в заметках", "Всегда, когда в предложении есть число, чтобы читатель нашёл нужную таблицу или рисунок", "Только для статей длиннее 20 страниц, где иначе нужную таблицу не найти", "Только в narrative-форме, сразу после года: Kühne et al. (2025a, p. 8)"], "correct": 0, "explain": "По общим правилам author-date страница обязательна для прямой цитаты, а для пересказа — по желанию. Наш журнал цитат не берёт, поэтому в тексте страниц нет; в заметках они есть, по ним любой проверит значение. Модель в careful run как раз нарушила это (check 6): поставила «(p. 7)» в текст.", "usage": {"code": false, "without": "Твой текст пестрит «(p. 7)», «(pp. 15, 17)», и редактор журнала просит всё это убрать.", "with": "В тексте — только автор и год, а страницы лежат в заметках и таблице трассировки для проверки.", "benefit": "Текст в форме журнала, а проверяемость не теряется"}, "img": {"src": "img/trc_writing_results_cmelr/14.svg", "alt": "Страницы источника и предложение статьи со ссылкой, где место номера страницы отмечено вопросом"}}, {"q": "Авторы сами называют ограничение своей работы. Какой глагол ставить после их имён?", "options": ["acknowledged или noted: авторы сами назвали предел", "admitted — честнее всего: авторы признались в слабости", "claimed или argued — это лишь их мнение о своей работе", "proved — их собственные данные доказали это ограничение"], "correct": 0, "explain": "Лестница глаголов (verb ladder), вопрос 2: «Is it a limit the authors name themselves?» — acknowledged, noted. Пример: «Gou et al. (2023) acknowledged that their system only just reached 30 Hz...». «Admitted» в списке запрещённых: звучит как признание вины. «Claimed» — для заявки, которую данные не несут. «Proved» запрещён: один тест ничего не доказывает в общем.", "usage": {"code": false, "without": "Ты пишешь «авторы признали, что датчик не работает выше 400 °C», и рецензент статьи-источника читает это как обвинение.", "with": "Ты пишешь «авторы отмечают, что датчик проверен только до 400 °C» — факт без оценки.", "benefit": "Глагол передаёт факт, а не тон"}, "img": {"src": "img/trc_writing_results_cmelr/15.svg", "alt": "Раздел Limitations статьи и предложение Xu et al. с пустым местом для глагола"}}, {"q": "В narrative-ссылке глагол stated или claimed уместен, когда…", "options": ["авторы измерили результат на своей плате, и он сходится с их заявкой в аннотации статьи", "речь об идее на будущее, которую авторы предложили, но пока не проверяли", "ты просто пересказываешь содержание статьи и никак его не оцениваешь", "статья это говорит, но её же данные показывают меньше — и надо сказать почему"], "correct": 3, "explain": "Лестница: 1 — просто передаёшь содержание → described, presented, reported; 2 — свой предел авторов → acknowledged, noted; 3 — непроверенная идея → suggested, proposed; 4 — данные держат заявку → measured, found, showed, а если нет → stated, claimed, argued, и причина в том же или следующем предложении. Сомневающийся глагол без причины читается как обвинение. Пример: «Wu et al. (2026) stated that their system ran in real time at 10 Hz, but their runtime table gives an average of 114.2 ms per frame».", "usage": {"code": false, "without": "Ты пишешь «авторы утверждают, что система работает в реальном времени» и не объясняешь, почему сомневаешься. Это выглядит как придирка.", "with": "Ты пишешь «утверждают… но по их же таблице 114.2 ms на кадр — около 9 кадров в секунду»: сомнение доказано.", "benefit": "Глагол честно передаёт, насколько заявка заработана"}, "img": {"src": "img/trc_writing_results_cmelr/16.svg", "alt": "Статья с аннотацией и разделом данных и предложение Xu et al. с глаголом stated или claimed"}}, {"q": "Когда по гайду курса можно писать confirmed?", "options": ["Когда у авторов есть своя таблица, подтверждающая их заявку из аннотации", "Когда авторы сами повторили результат на второй плате того же семейства", "Когда оба читателя пары согласились, что заметка по статье верна", "Только когда второе, независимое исследование получило тот же результат"], "correct": 3, "explain": "В списке глаголов, которых избегают: «proved» (один тест ничего не доказывает в общем), «admitted» (звучит как признание вины), «confirmed» — только если второе независимое исследование нашло то же, и «clearly», «obviously» (тон вместо доказательства). Своя таблица авторов — это «found» или «showed» с условиями. Повтор у тех же авторов не независим. Согласие пары — про качество заметки, а не про результат статьи.", "usage": {"code": false, "without": "Ты пишешь «эксперимент подтвердил точность датчика», хотя это единственный опыт одной лаборатории.", "with": "Ты пишешь «авторы показали точность 0.1 мм на своём стенде», а «подтвердили» оставляешь для второй независимой работы.", "benefit": "Читатель не путает один результат с проверенным знанием"}, "img": {"src": "img/trc_writing_results_cmelr/17.svg", "alt": "Карточка заявки статьи и пунктирный штамп confirmed со знаком вопроса"}}, {"q": "Какое предложение соблюдает все четыре правила о числах в тексте?", "options": ["18 of the 56 studies reported power, but only two measured it on the board.", "Eighteen studies reported power, but only two of those studies measured it on the board.", "Eighteen of the 56 studies reported power, but only 2 measured it on the board.", "Eighteen of the 56 studies reported power, but only two measured it on the board."], "correct": 3, "explain": "Четыре правила: (1) предложение начинают с числа словами — «Eighteen»; (2) внутри предложения меньше 10 — словами, 10 и больше — цифрами: «two», «18 studies»; (3) перед единицей всегда цифры — «2 W», «4 m»; (4) у подсчёта всегда база — «of the 56». Каждый дистрактор нарушает одно правило: цифры в начале, нет базы, «2» вместо «two».", "usage": {"code": false, "without": "Ты пишешь «Only 18 studies reported power», и читатель не знает: 18 из 20 или из 500?", "with": "Ты пишешь «Eighteen of the 56 studies», и читатель сразу видит масштаб.", "benefit": "Число в тексте сразу понятно и выглядит одинаково по всей статье"}, "img": {"src": "img/trc_writing_results_cmelr/18.svg", "alt": "Каркас предложения про исследования и мощность, под ним числа 18, 56 и 2 с подписями"}}, {"q": "Ты приводишь примеры закономерности, а всего таких исследований 11 из 18. Как оформить ссылку?", "options": ["(e.g., Gou et al., 2023; Liu et al., 2025; Xu and de Croon, 2025) — с e.g.: названы не все", "(Gou et al., 2023; Liu et al., 2025; Xu and de Croon, 2025) — без e.g., раз примеры верные", "Все 11 в одной скобке по алфавиту, чтобы список был полным и проверяемым", "(Gou et al., 2023 etc.) — одно исследование и etc. вместо остальных десяти"], "correct": 0, "explain": "«e.g.,» говорит, что названы примеры, а не весь список. Без него читатель решит, что таких работ три. Больше четырёх в скобке не ставят: для длинного списка — подсчёт и отсылка к таблице, «Eleven of the 18 studies ... (Table S1)». Обратный случай: «Four studies judge real time by the slowest frame (Burkhardt et al., 2026; Liu et al., 2025; Xiao et al., 2026; Xu and de Croon, 2025)» — это все четыре, поэтому без e.g.", "usage": {"code": false, "without": "Ты ставишь три ссылки без «e.g.», и рецензент считает, что ты пропустил остальные восемь работ.", "with": "Ты пишешь «e.g.,» и рядом подсчёт «11 of the 18 (Table S1)» — ясно и что работ больше, и где они все.", "benefit": "Читатель знает, пример это или полный список"}, "img": {"src": "img/trc_writing_results_cmelr/19.svg", "alt": "18 кружков, 11 из них синие, три обведены как примеры, внизу пустая ссылка"}}, {"q": "Предложение «Eighteen of the 56 studies stated what they meant by real time». На что оно ссылается?", "options": ["На все 18 исследований в одной скобке, по алфавиту первого автора, через точку с запятой", "На статью, где определение дано подробнее всего (e.g., Xiao et al., 2026)", "На нашу таблицу извлечения (Table S1), без авторов: подсчёт — наша находка", "Ни на что: число 18 и так понятно читателю, источник ему не нужен"], "correct": 2, "explain": "Подсчёт по корпусу — находка самого обзора. Он держится на нашей charting table, а не на одной статье, поэтому авторов не цитируют, а указывают на таблицу: она выйдет на OSF с DOI и в статье называется Table S1. Восемнадцать ссылок в скобке нарушат правило «не больше четырёх». Ссылка на одну статью приписала бы ей наш подсчёт.", "usage": {"code": false, "without": "Ты пишешь «большинство работ мерят задержку на ПК» без источника, и читатель не может проверить, откуда это.", "with": "Ты пишешь «14 of the 20 studies (Table S1)», и каждый может открыть таблицу и пересчитать.", "benefit": "Подсчёт можно проверить, и он не приписан чужой статье"}, "img": {"src": "img/trc_writing_results_cmelr/20.svg", "alt": "Предложение и сетка из 56 точек, 18 выделены; ниже пустое поле для источника ссылки"}}, {"q": "Где в статье в первую очередь искать заявку C (claim)?", "options": ["В таблицах результатов: заявка — это самое большое число в статье", "В обзоре литературы (related work), где система сравнивается с чужими системами", "В аннотации, а затем в списке вкладов (contributions) в конце введения", "В списке литературы: по нему видно, на чём построена заявка"], "correct": 2, "explain": "По трассировке: предложение-заявка нашлось в аннотации у 54 из 56 статей (96%), а 40 статей ещё и перечисляют вклады в первых страницах, обычно в конце введения. Третье место — первые строки заключения. Сигнальные слова: this paper presents, we propose, our contributions, achieves, outperforms. В таблицах — доказательства E, в related work — чужие работы.", "usage": {"code": false, "without": "Ты ищешь, что обещает статья про управление манипулятором, и листаешь таблицы с RMSE, не понимая, какое число главное.", "with": "Ты читаешь аннотацию и список «Our contributions are…» в конце введения — заявка найдена за две минуты.", "benefit": "Заявка находится быстро и там, где её написали сами авторы"}, "img": {"src": "img/trc_writing_results_cmelr/21.svg", "alt": "Структура статьи: аннотация, введение, обзор, метод, эксперименты, заключение, список литературы; лупа сканирует сверху вниз"}}, {"q": "Где в нашем корпусе чаще всего нашлись измеренные значения E?", "options": ["В аннотации — 96%, потому что авторы выносят туда все свои числа", "В обсуждении и ограничениях (Discussion, Limitations) — почти половина всех чисел", "Во введении — там числа даны раньше всего и подробнее, чем в таблицах", "В экспериментах и результатах — 74 из 114; ещё 16 — в описании метода"], "correct": 3, "explain": "Скрипт where_lenses.py по трассировке: из 114 измеренных значений 74 (65%) — в экспериментах и результатах, 16 (14%) — в описании метода или системы (авторы иногда дают скорость модуля, когда его описывают), по 3 — в заключении и во введении. 96% — это доля заявок C в аннотации, а не чисел. Сигнальные слова E: Table, Fig., ms, FPS, Hz, RMSE, ATE, W, mJ.", "usage": {"code": false, "without": "Ты берёшь «до 50 FPS» из аннотации как результат, а в таблицах такого числа нет.", "with": "Ты ищешь число в таблицах раздела Results, с подписью платы и того, что мерили.", "benefit": "В заметку попадает измерение, а не реклама"}, "img": {"src": "img/trc_writing_results_cmelr/22.svg", "alt": "Структура статьи с разделами от аннотации до списка литературы, лупа ищет измеренные значения E"}}, {"q": "В Temburu2020 нет раздела Limitations. Где искать ограничение L?", "options": ["Нигде: раз нет раздела Limitations, в заметке L пишем «not stated» и идём дальше", "Во введении, где авторы перечисляют, чего не умеют чужие системы (related work)", "В результатах, сразу после слабого результата: ошибка вращения даёт дрейф", "В списке литературы, среди работ, которые критикуют эту статью и её метод"], "correct": 2, "explain": "Ограничения разбросаны: из 53 найденных 20 — в результатах, 12 — в заключении как future work, и только 9 — в отдельном разделе Discussion или Limitations. В коротких докладах предел часто стоит рядом со слабым результатом: у Temburu2020 сразу после графика точности — накопление смещения из-за ошибки вращения. Отсюда правило: читай предложение после каждого результата. «Not stated» без поиска — ложная пустота; чужие слабости во введении — не предел этой статьи.", "usage": {"code": false, "without": "Ты не находишь раздел Limitations в статье про лазерный дальномер и пишешь «ограничений нет».", "with": "Ты читаешь фразу после каждого графика и находишь: «точность падает на блестящих поверхностях».", "benefit": "В заметке L — реальный предел, а не пропуск"}, "img": {"src": "img/trc_writing_results_cmelr/23.svg", "alt": "Структура Temburu2020 без раздела Limitations (пунктир), лупа ищет ограничение L"}}, {"q": "Cai2024, с. 4: «We will make the code … public available upon acceptance». Ссылки нет. Что пишем в R и в статье?", "options": ["R: код открыт; в статье: The code of TrinitySLAM is publicly available to everyone (Cai et al., 2024).", "R: not stated; в статье об их коде не пишем ничего, раз ссылки в статье нет", "R: код на GitHub, судя по ссылке в списке литературы (reference [41]) статьи", "R: код обещан после принятия, ссылки нет; в статье: Cai et al. (2024) promise to release their code"], "correct": 3, "explain": "Обещание — не выпуск (a promise is not a release). Правильная фраза гайда: «Cai et al. (2024) promise to release their code after acceptance; the published paper gives no link». «Publicly available» превращает обещание в факт. «Not stated» неверно: авторы прямо высказались. GitHub в Cai2024 встречается только в списке литературы — это ссылка [41] на UltimateSLAM других авторов. В корпусе у 31 из 56 статей нет ссылки ни на код, ни на данные.", "usage": {"code": false, "without": "Ты пишешь «код открыт», ссылаясь на «будет выложен после публикации», а читатель ищет репозиторий и не находит.", "with": "Ты пишешь «код обещан после принятия, ссылки нет» — ровно то, что на странице.", "benefit": "Подсчёт открытых работ в обзоре не завышен"}, "img": {"src": "img/trc_writing_results_cmelr/24.svg", "alt": "Цитата со страницы 4 про код после принятия статьи, ссылки нет; два поля с вопросом: заметка R и предложение в статье"}}, {"q": "Prutyanov2025 даёт 1.2 FPS на Jetson Orin Nano дважды: с. 2 (II. Related Works, «our previous study [14]») и с. 4 (V. Discussion: производительность «has not increased»). Какое предложение верно?", "options": ["Prutyanov et al. (2025) measured 1.2 frames per second on a Jetson Orin Nano with frames sampled at 1 Hz in flight.", "Prutyanov et al. (2025) did not measure the speed again; they state it is unchanged from their earlier study.", "Prutyanov et al. (2025) reported 1.2 frames per second on a Jetson Orin Nano, suitable for real time.", "The system runs at 1.2 frames per second on a Jetson Orin Nano (Prutyanov et al., 2025)."], "correct": 1, "explain": "Перенесённое число (carried-over number): напечатано в этой статье, но измерено в прошлой. На с. 2 — related work о прежнем исследовании [14], на с. 4 — «не выросла», и третьего места, с таблицей результатов, нет. «Measured» и «runs at (Prutyanov et al., 2025)» приписывают статье чужой замер. «Reported» — именно та ошибка, которую сделала модель в careful run: она писала по заметке, где не было «carried over». Правило: смотри заголовок раздела над числом и ищи число ещё раз — если в результатах его нет, статья его не мерила.", "usage": {"code": false, "without": "Ты пишешь «система работает 1.2 FPS», и подсчёт работ, мерявших скорость на борту, растёт на одну, которой не было.", "with": "Ты пишешь «скорость не мерили заново, взяли из прежней работы», и подсчёт остаётся честным.", "benefit": "В обзоре нет замеров, которых никто не делал"}, "img": {"src": "img/trc_writing_results_cmelr/25.svg", "alt": "Две страницы статьи Prutyanov2025: с. 2 в обзоре работ про прежнее исследование и с. 4 в обсуждении про то, что скорость не выросла"}}, {"q": "Аннотация Kuhne2025a: «up to 50 FPS instead of 20 FPS». В Table III (с. 6) прогоны при 20 FPS и один при 10 FPS. Какое предложение верно?", "options": ["Kühne et al. (2025a) state that their design allows up to 50 frames per second, but no reported run exceeded 20.", "On-chip optical flow lets VINS-Mono run at 50 frames per second on a Raspberry Pi (Kühne et al., 2025a).", "Kühne et al. (2025a) found that their system runs at up to 50 frames per second on a Raspberry Pi CM4.", "Kühne et al. (2025a) proved that VINS-Mono can run 2.5 times faster, at 50 instead of 20 frames per second on a CM4."], "correct": 0, "explain": "«50 FPS» встречается в статье ровно один раз — в аннотации. Это заявка о том, что ускорение делает возможным, и она остаётся в C с пометкой «не проверено». Поэтому авторы — подлежащее (narrative), глагол — state, и сразу причина: прогонов быстрее 20 нет. Parenthetical-форма цитирует обещание как результат, «found» и «proved» приписывают ему доказательство. А вот 49.4% снижения задержки (148.11 → 74.86 ms, с. 8) измерены — это E.", "usage": {"code": false, "without": "Ты пишешь в отчёте, что контроллер «работает до 1 kHz», как в аннотации, а в испытаниях было только 250 Hz.", "with": "Ты пишешь «авторы заявляют до 1 kHz, но испытания проведены только на 250 Hz».", "benefit": "Обещание и измерение не смешиваются"}, "img": {"src": "img/trc_writing_results_cmelr/26.svg", "alt": "Аннотация с заявкой 50 вместо 20 кадров в секунду и таблица III с прогонами 20, 20 и 10 FPS"}}, {"q": "Аннотация Kumar2024: выше 60 FPS «on NVIDIA's low-powered 10W Jetson-NX». Мощность в статье не измеряли. Какое предложение верно?", "options": ["Jetson-SLAM runs at over 60 FPS while drawing only 10 W on board (Kumar et al., 2024).", "Kumar et al. (2024) reported over 60 FPS on a Jetson Xavier NX, which they describe as a 10 W device.", "Kumar et al. (2024) measured 10 W on the Jetson Xavier NX board while it ran SLAM at over 60 FPS.", "Kumar et al. (2024) showed that 60 FPS stereo SLAM needs no more than 10 W on a small Jetson board."], "correct": 1, "explain": "10 W — паспортное значение платы (rating, datasheet), его никто в статье не мерил. «Describe ... as a 10 W device» передаёт это точно; полная фраза гайда добавляет «they did not measure power». Остальные варианты читаются как измеренная мощность. В корпусе мощность приводят 18 из 56 исследований, но прибором на плате мерили только два; у Kumar2024 — паспорт.", "usage": {"code": false, "without": "Ты пишешь «плата потребляет 10 W» по даташиту, а на сварочном стенде с камерой и мотором она тянет 14 W.", "with": "Ты пишешь «плата с паспортной мощностью 10 W; потребление не измерялось».", "benefit": "Читатель не принимает паспорт за измерение"}, "img": {"src": "img/trc_writing_results_cmelr/27.svg", "alt": "Цитата из аннотации про 60 FPS и 10 W на Jetson-NX, плата и перечёркнутый ваттметр: мощность в статье не измеряли"}}, {"q": "Liu2022f пишет, что больше 12 кадров в секунду — это реальное время, и ссылается на свою [7], Bian et al. (2018). Bian ты не читал. Как сослаться?", "options": ["(Bian et al., 2018, cited in Liu et al., 2022); в списке литературы — только Liu", "(Bian et al., 2018); в список литературы — Bian et al. (2018), ведь это число из её работы", "(Liu et al., 2022); в список литературы — обе работы, Liu и Bian, для полноты", "(Bian et al., 2018; Liu et al., 2022); в список литературы — обе работы сразу"], "correct": 0, "explain": "Правило «only sources you read» (check 7). Лучше всего — найти и прочитать Bian et al. (2018) и цитировать напрямую. Если нельзя — цитировать через прочитанную статью: «cited in» (шаблон журнала формы для этого не даёт, «cited in» — обычная author-date форма). В список литературы идёт только то, что ты читал, — Liu et al. (2022). «(Bian et al., 2018)» без прочтения выдаёт чужое прочтение за своё.", "usage": {"code": false, "without": "Ты ссылаешься на стандарт по сварке, который видел только в чужой статье, а в нём на деле другое число.", "with": "Ты пишешь «по данным X, цит. по Y» — или находишь стандарт и читаешь его сам.", "benefit": "Ты отвечаешь только за то, что читал"}, "img": {"src": "img/trc_writing_results_cmelr/28.svg", "alt": "Ты читаешь Liu et al. 2022, она ссылается на непрочитанную работу Bian et al. 2018 с порогом реального времени 12 кадров в секунду"}}, {"q": "В библиотеке два доклада Li 2024: ключ Li2024a — INFOCOM, 6 авторов (…, Shangguan, Yang); ключ Li2024b — журнал, 8 авторов (…, Shangguan, Ma, Ding, Yang). Как цитировать INFOCOM-доклад?", "options": ["Li et al. (2024b): буквы — по списку литературы, где на шестом имени Ma раньше Yang", "Li et al. (2024a): буква берётся из ключа, а ключ в библиотеке Zotero уникален", "Li et al. (2024a): доклад на конференции вышел раньше журнальной статьи, значит, он первый", "Li2024a (2024): ключ однозначен и короче, чем полная ссылка по шаблону"], "correct": 0, "explain": "Одни авторы, один год → буквы a, b по порядку списка литературы, а он сортируется по фамилиям всех авторов. Пять первых совпадают, на шестом Ma раньше Yang, поэтому журнальная статья (ключ Li2024b) — 2024a, а INFOCOM (ключ Li2024a) — 2024b. Так же Kuhne2025 становится Kühne et al. (2025b). Буквы из ключа не брать никогда; ключи в тексте не пишут. И ещё: обе статьи Li — одно исследование, его цитируют вместе (Li et al., 2024a, 2024b) и считают один раз.", "usage": {"code": false, "without": "Ты копируешь букву из имени файла, и в статье «Li et al. (2024a)» указывает не на тот доклад.", "with": "Ты берёшь буквы из отсортированного списка литературы (скрипт grouped_cite.py) и проверяешь их по фамилиям.", "benefit": "Каждая ссылка ведёт на ту статью, которую ты имел в виду"}, "img": {"src": "img/trc_writing_results_cmelr/29.svg", "alt": "Две карточки докладов: Li2024a с INFOCOM и шестью авторами и Li2024b из журнала с восемью авторами, списки последних имён; внизу ссылка с вопросом о букве"}}, {"q": "Temburu2020 пишет, что Jetson Nano использовали «to emulate onflight computing». Что это значит для заметки M?", "options": ["Система испытана в полёте, а Jetson Nano эмулировал наземную станцию по радиоканалу", "Код запускали в симуляторе полёта (Gazebo) вместо настоящей платы Jetson Nano", "Испытания на стенде: Jetson Nano лишь заменял бортовой компьютер, и дрон не летал", "Jetson Nano стоял на дроне, а эмулировалась только камера, по записанным кадрам"], "correct": 2, "explain": "Emulate — «стоять вместо». Настольный i7 с GPU 1050 Ti заменял наземную станцию, а Jetson Nano — бортовой компьютер (с. 6). Ничто не летало, и заметка M должна это сказать; «tested on a drone» — ошибка, и страница это показывает. Похожая ловушка у Prutyanov2025: «flight simulation» — не симулятор и не полёт, а записанные кадры, которые подают по одному.", "usage": {"code": false, "without": "Ты пишешь «алгоритм проверен на роботе», хотя его гоняли на ноутбуке по записанному rosbag.", "with": "Ты пишешь «проверен по записи на ноутбуке, вместо бортового компьютера; на роботе не запускали».", "benefit": "Читатель знает, насколько результат близок к реальной работе"}, "img": {"src": "img/trc_writing_results_cmelr/30.svg", "alt": "Дрон и плата Jetson Nano, между ними пунктирная связь со знаком вопроса и цитата to emulate onflight computing"}}, {"q": "Ctrl+F по «however» в Cai2024 даёт 12 совпадений. Что это говорит об ограничениях статьи?", "options": ["В статье 12 ограничений: по одному на каждое совпадение слова however в тексте", "Лишь где начать читать: первые совпадения — о чужих системах, свои пределы — в 8.2", "В разделе Limitations у статьи ровно 12 пунктов, их и переносим в заметку", "Ограничений нет: however — слово обзора литературы, а не пределов собственной работы"], "correct": 1, "explain": "Сигнальные слова указывают, но не доказывают (signal words point; they do not prove). В Cai2024 первые «however» — в аннотации, введении и background, где авторы пишут, чего не умеют ДРУГИЕ системы. Свои пределы — в разделе 8.2 Limitations and Future Work на с. 19, туда указывает и «limitation» (7 раз). Правило: посчитай слова, потом читай там, куда указывают счёты.", "usage": {"code": false, "without": "Ты грепаешь лог робота по «error», находишь 300 строк и пишешь «300 ошибок», а 280 из них — штатные повторы.", "with": "Ты используешь grep как указатель, открываешь места и читаешь, что там на самом деле.", "benefit": "Счёт слов не подменяет чтение"}, "img": {"src": "img/trc_writing_results_cmelr/31.svg", "alt": "Страница статьи Cai2024 с двенадцатью жёлтыми отметками слова however и строка поиска Ctrl+F со счётчиком 12"}}, {"q": "В обзоре литературы Liu2025a (с. 5) — таблица сравнения: строки чужих систем и строка «Ours» с 75 FPS и 10 W. Как с ней обращаться?", "options": ["Вся таблица — доказательство E этой статьи: она на её странице и составлена её авторами", "Строки других систем можно цитировать как (Liu et al., 2025): таблица ведь опубликована у них", "Чужие строки — числа других работ в пересказе; у «Ours» 75 FPS — замер детектора, 10 W не мерили", "Строка «Ours» — измерения всей системы в полёте, её можно брать в E без всякой дополнительной проверки"], "correct": 2, "explain": "Два правила из гайда. Строка о другом исследовании — число того исследования в пересказе этой статьи: иди к первоисточнику или пиши «as reported by». Строку «Ours» тоже проверяй: 75 FPS измерены для детектора объектов (с. 10), а 10 W не измерены нигде — find_number.py находит «10 W» только на с. 5, в этой таблице. Таблица в related work похожа на доказательство, но доказывает она чужое.", "usage": {"code": false, "without": "Ты берёшь сравнительную таблицу из статьи конкурента и цитируешь чужие числа как её результаты.", "with": "Ты идёшь в исходные статьи за каждым чужим числом, а у строки «наш метод» ищешь, где именно его мерили.", "benefit": "Каждое число в обзоре принадлежит тому, кто его измерил"}, "img": {"src": "img/trc_writing_results_cmelr/32.svg", "alt": "Таблица сравнения в обзоре литературы: три строки чужих систем с многоточиями и строка Ours с 75 FPS и 10 W"}}, {"q": "Gou2023, с. 17: «the efficiency of our system just meets the 'real-time' requirement, i.e., a frame rate of 30 Hz …, which makes it impossible to simultaneously perform … path planning». Какое предложение — пересказ (paraphrase)?", "options": ["The system just meets the real-time requirement of a 30 Hz frame rate for its image processing (Gou et al., 2023).", "Gou et al. (2023) state: “the efficiency of our system just meets the ‘real-time’ requirement”, i.e. 30 Hz.", "Gou et al. (2023) acknowledged that their system only just reached 30 Hz, leaving no time to plan paths on board.", "Gou et al. (2023) admitted that their system just meets the real-time requirement of a 30 Hz frame rate on board."], "correct": 2, "explain": "«The system just meets the real-time requirement…» — patchwriting: слова авторов, слегка переставленные; без кавычек это считается копированием, даже со ссылкой. Вариант с «state: “…”» — прямая цитата, а журнал их не берёт. Вариант с «admitted» — снова patchwriting и к тому же глагол из списка запрещённых. Пересказ — своё предложение с тем же смыслом и той же ссылкой; глагол «acknowledged» — по лестнице: авторы сами называют предел.", "usage": {"code": false, "without": "Ты переставляешь пару слов в абзаце из статьи про WAAM и ставишь ссылку, а антиплагиат помечает абзац как совпадение.", "with": "Ты закрываешь статью и пишешь мысль своими словами, а потом сверяешь смысл и ставишь ссылку.", "benefit": "Текст твой, а смысл источника сохранён"}, "img": {"src": "img/trc_writing_results_cmelr/33.svg", "alt": "Цитата со страницы 17 про 30 Hz и невозможность планирования пути, стрелка вниз к полю пересказа с вопросом"}}, {"q": "Абзац: «Liu et al. (2025) proposed a SLAM system… Prutyanov et al. (2025) presented… Xiao et al. (2026) developed… Gou et al. (2023) proposed…». Каждое предложение верно. Что не так?", "options": ["Мало ссылок: в конце абзаца нужна общая скобка со всеми четырьмя работами сразу", "Нет главной мысли: это список пересказов, и не видно, зачем эти работы вместе", "Не хватает страниц: после каждой ссылки нужен номер страницы источника", "Глаголы слишком сильные: proposed и developed надо заменить на claimed"], "correct": 1, "explain": "«Every sentence true, the paragraph wrong»: один пересказ на предложение, каждое с фамилий, и никакой мысли. Шаг 2 лекции: сначала мысль одним предложением — «“Real time” does not mean one thing in our corpus», — и каждое следующее предложение служит ей; платы, точность и полёты этих работ уходят в другие абзацы. Общая скобка в конце — отдельная ошибка (check 2), страниц в тексте не бывает, а proposed и developed здесь вполне нейтральны.", "usage": {"code": false, "without": "Твой раздел о датчиках сварочного шва — шесть абзацев «статья такая-то сделала то-то», и руководитель спрашивает: «И что?»", "with": "Каждый абзац начинается с вывода, например «Ни одна работа не проверяла датчик на алюминии», а статьи идут как доказательства.", "benefit": "У каждого абзаца есть мысль, которую можно оспорить или проверить"}, "img": {"src": "img/trc_writing_results_cmelr/34.svg", "alt": "Абзац из четырёх строк, каждая начинается с имени авторов и года и продолжается серой полосой текста"}}, {"q": "Абзац кончается скобкой (Cai et al., 2024; Gou et al., 2023; Jeon et al., 2021; Kumar et al., 2024; Xiao et al., 2026). Чем это плохо?", "options": ["Нарушен порядок: Xiao должен идти первым, как самая новая из пяти работ, а Jeon — последним", "В скобке больше четырёх имён: надо оставить первые четыре, а пятое убрать", "Ничем: общая скобка в конце экономит место в 10 страницах журнала (лимит)", "Не видно, какой источник держит какое предложение; ссылка нужна сразу после утверждения"], "correct": 3, "explain": "Check 2 — no pile of citations at the end. Ссылка стоит сразу после информации, которую поддерживает, а не в конце абзаца: «A paragraph that ends with five citations leaves the reader guessing which source supports which sentence». Длинные списки — в Table S1 с подсчётом. Алфавит в скобке как раз соблюдён. Выбросить пятую работу — значит оставить утверждение без опоры, а не исправить форму.", "usage": {"code": false, "without": "Ты ставишь в конце отчёта по калибровке «[1–7]», и рецензент не может понять, откуда взята погрешность 0.2 мм.", "with": "Ты ставишь ссылку сразу после каждой цифры, и каждую можно проверить.", "benefit": "Каждое утверждение проверяется по своему источнику"}, "img": {"src": "img/trc_writing_results_cmelr/35.svg", "alt": "Абзац из строк текста и в конце общая скобка с пятью именами Cai, Gou, Jeon, Kumar, Xiao"}}, {"q": "Пересчёт (recount): в черновике 3 из 4 предложений начинаются с фамилии, в переписанном абзаце — 3 из 6. Какой вывод?", "options": ["Переписанный абзац так же плох: фамилий почти столько же, надо переписать его ещё раз", "Переписанный абзац хуже: предложений с фамилией в нём столько же, а самих предложений больше", "Счёт — указатель, а не оценка: в переписанном мысль идёт первой, narrative там нарочно", "Пересчёт бесполезен, раз он даёт похожие числа у плохого и у хорошего абзаца"], "correct": 2, "explain": "Три счёта клиники: предложения с фамилии (check 3), куча ссылок в конце (check 2), числа без условий (check 4). «A count points to where to look. It does not grade the paragraph.» Разница не в числе: у переписанного абзаца первое предложение — мысль, а три narrative-фразы стоят там, где важно, что сделало одно исследование. Отказаться от счёта тоже неверно: он быстро показывает, куда смотреть.", "usage": {"code": false, "without": "Ты гонишь линтер по прошивке и правишь каждое предупреждение, ломая места, где так сделано нарочно.", "with": "Ты смотришь, куда указывает линтер, и решаешь по коду, ошибка это или намеренная конструкция.", "benefit": "Метрика направляет внимание, а решение остаётся за тобой"}, "img": {"src": "img/trc_writing_results_cmelr/36.svg", "alt": "Два абзаца из полос: черновик с четырьмя предложениями, три из них начинаются с фамилии, и переписанный с шестью, из них три с фамилии"}}, {"q": "Черновик: «Cai et al. (2024) will publish their code». На с. 4: код будет открыт upon acceptance, ссылки нет. Что это за ошибка по классификации партнёрской проверки?", "options": ["Число из других условий: надо дописать плату, частоту кадров и что мерили", "Куча ссылок в конце: ставить каждое исследование после его утверждения", "Неверная буква: её нужно взять из порядка в списке литературы", "Утверждение больше страницы: писать то, что авторы заявили, и не больше"], "correct": 3, "explain": "Отметка «does not hold» обычно одного из трёх видов: число из других условий (дать условия со страницы); утверждение больше статьи (урезать до того, что показано, или ослабить глагол); нет ни в заметках, ни на странице (перечитать, а если нет — убрать). «Will publish» — мы этого не знаем; страница говорит только «будет открыт после принятия» и ссылки не даёт. Проверяющий ставит отметку и страницу, а правит автор.", "usage": {"code": false, "without": "Ты пишешь в отчёте «поставщик выпустит драйвер в марте», хотя он только сказал «планируем».", "with": "Ты пишешь «поставщик заявил, что планирует драйвер на март», ровно как в письме.", "benefit": "В тексте нет обещаний, которых никто не давал"}, "img": {"src": "img/trc_writing_results_cmelr/37.svg", "alt": "Фраза из черновика Cai et al. 2024 will publish their code над цитатой со страницы 4 про открытие кода после принятия без ссылки, внизу вопрос о типе ошибки"}}, {"q": "Jeon2021a, с. 4 (V.A): на Jetson TX2 VINS-Fusion и VINS-Fusion-imu «do not run owing to insufficient memory», поэтому взяли GPU-версию. Чьё это ограничение?", "options": ["Самих авторов: их собственная система не уместилась в память платы Jetson TX2 на дроне", "Платы вообще: Jetson TX2 непригоден ни для какой визуально-инерциальной одометрии", "Ничьё: GPU-версия заработала, так что в заметку L писать здесь нечего", "Двух сравниваемых методов на одной плате: Jeon2021a — бенчмарк чужих алгоритмов"], "correct": 3, "explain": "Jeon2021a сравнивает девять чужих вариантов VO и VIO на трёх платах Jetson, своей системы у статьи нет. Поэтому «authors' limitation» — ошибка: это предел двух методов на TX2. Обобщать на всю плату нельзя: другие методы на ней работали. Ещё одна деталь метода этой статьи: все платы стояли на максимальной частоте CPU, то есть на максимальной мощности, так что их тайминги могут быть быстрее, чем плата даст в полётном бюджете мощности.", "usage": {"code": false, "without": "Ты пишешь «наш контроллер не тянет MPC», хотя не тянула конкретная сторонняя библиотека на конкретной плате.", "with": "Ты пишешь «библиотека X не запустилась на плате Y из-за памяти; библиотека Z работает».", "benefit": "Ограничение приписано тому, у кого оно на самом деле"}, "img": {"src": "img/trc_writing_results_cmelr/38.svg", "alt": "Плата Jetson TX2 и два метода VINS-Fusion с красным крестом и подписью не хватает памяти, внизу рабочая GPU-версия"}}, {"q": "Модель (careful run) написала «Prutyanov et al. (2025) reported 1.2 frames per second…». Почему она ошиблась и где это чинить?", "options": ["Модель плохо пишет по-английски: надо было попросить её написать абзац по-русски", "В данной ей заметке не было «перенесено из прошлой работы»; чинить заметку по странице", "Модель взяла число из обзора литературы статьи: надо было запретить ей читать страницу 2", "Ошибки нет: число в статье напечатано, значит, глагол reported здесь подходит"], "correct": 1, "explain": "Модели дали пять заметок, а не статьи, и заметка о Prutyanov2025 говорила «1.2 frames per second on a Jetson Orin Nano» без «carried over». «Garbage in, fluent out»: модель превращает заметку в гладкий текст вместе с ошибкой. Ловят это выше — трассировка и четыре вопроса партнёрской проверки. Ещё два промаха того же прогона: страницы в тексте (check 6) и одно исследование на предложение без группировки и подсчёта (check 3).", "usage": {"code": false, "without": "Ты генерируешь отчёт об испытаниях по таблице, где один датчик записан не с той единицей, и отчёт гладко повторяет ошибку.", "with": "Ты сначала сверяешь таблицу с протоколом стенда, а уже потом пишешь отчёт.", "benefit": "Ошибка ловится в данных, а не в готовом тексте"}, "img": {"src": "img/trc_writing_results_cmelr/39.svg", "alt": "Конвейер из трёх блоков: заметка, модель, абзац; оранжевая точка движется слева направо, под ним вопрос, где ошибка"}}, {"q": "Что требует задание Revised theme section (срок 3 декабря 2026, 18:15)?", "options": ["800–1,000 слов с таблицей исследований темы, заметка о ревизии в три строки, строка про ИИ", "2,000–2,500 слов: результаты, пробел и вопрос исследования по теме, с прямыми цитатами авторов", "Только таблицу исследований темы в Excel и список литературы в стиле журнала", "800–1,000 слов, написанных ИИ по заметкам и проверенных партнёром по страницам PDF"], "correct": 0, "explain": "Один .docx в шаблоне журнала: весь раздел темы (800–1,000 слов, с таблицей исследований, в стиле ссылок журнала, без прямых цитат); заметка о ревизии в три строки — три счёта на 19 ноября и в финале (предложения с фамилии; абзацы с кучей ссылок в конце; числа без платы, частоты и того, что мерили) и что изменила проверка партнёра; одна строка про ИИ. ИИ может проверить язык, но не писать синтез. 2,000–2,500 слов — это отчёт (60%), а не этот раздел.", "usage": {"code": false, "without": "Ты сдаёшь раздел без заметки о ревизии, и не видно, что изменилось после клиники 19 ноября.", "with": "Ты прикладываешь три счёта «было/стало» и что поправил партнёр — работа над текстом видна в цифрах.", "benefit": "Видно, что ревизия была и что именно она дала"}, "img": {"src": "img/trc_writing_results_cmelr/40.svg", "alt": "Календарный листок 3 декабря 2026 18:15 и лист задания с четырьмя пунктами со знаками вопроса"}}, {"q": "Wu2026, с. 8: в тексте — «real time (10 Hz frame rate)» на Jetson Orin NX; в Table VII, строка Total Tracking, в среднем 114.2 ms на кадр. Поддерживает ли таблица заявку и какой глагол ставить?", "options": ["Да: \\(114.2/10 \\approx 11.4\\) Hz > 10 Hz; Wu et al. (2026) found that the system runs in real time", "Да: при 10 Hz на кадр есть \\(1000\\) ms, 114.2 ms укладываются; Wu et al. (2026) showed real-time operation", "Нет: \\(1000/114.2 \\approx 8.8\\) Hz; Wu et al. (2026) admitted that their system is not real time on the board", "Нет: \\(1000/114.2 \\approx 8.8\\) Hz < 10 Hz; Wu et al. (2026) stated 10 Hz, but their table gives about 9 per second"], "correct": 3, "explain": "Шаг 1: частота — величина, обратная времени кадра: \\( f = 1000 / t_{\\text{ms}} \\); для 10 Hz нужно не больше \\(1000/10 = 100\\) ms на кадр. Шаг 2: \\(1000/114.2 \\approx 8.76\\) Hz — меньше 10; сама таблица печатает «(9 fps)», и даже лучшая из трёх траекторий (104.0 ms) даёт 9.6 Hz. Шаг 3: заявка есть, доказательств нет → stated с причиной в том же предложении. Ошибки дистракторов: деление «наоборот», 10 Hz спутано с 1 с на кадр, и «admitted» — запрещённый глагол, к тому же авторы ничего не признавали.", "usage": {"code": false, "without": "Ты пишешь «контур управления работает на 100 Hz», а профилировщик показывает 12 ms на итерацию — 83 Hz.", "with": "Ты пересчитываешь 1000/12 ≈ 83 Hz и пишешь «заявлено 100 Hz, измерено около 83».", "benefit": "Заявка о реальном времени сверена с таймингом за одну строку арифметики"}, "img": {"src": "img/trc_writing_results_cmelr/41.svg", "alt": "Строка из текста про 10 Hz на Jetson Orin NX и таблица VII со строкой Total Tracking 114.2 ms на кадр; внизу вопрос о поддержке"}}, {"q": "Li2024a (ключ!), Table IV, с. 8: Zynq MPSoC — 4.6 W при 42 fps, напечатано 108 mJ на кадр; как получена мощность, статья не говорит. Откуда мДж и как сослаться?", "options": ["\\(4.6/42 \\approx 0.110\\) J ≈ 110 mJ, близко к 108; Li et al. (2024b) reported 108 mJ per frame", "\\(4.6 \\cdot 42 = 193.2\\), с 108 не сходится; Li et al. (2024b) reported 108 mJ per frame", "\\(4.6/42 \\approx 0.110\\) J ≈ 110 mJ, близко к 108; Li et al. (2024a) reported 108 mJ per frame", "\\(4.6/42 \\approx 0.110\\) J ≈ 110 mJ, близко к 108; Li et al. (2024b) measured it with a meter"], "correct": 0, "explain": "Шаг 1: энергия на кадр = мощность / частота кадров: \\( E = P/f = 4.6\\ \\text{W} / 42\\ \\text{s}^{-1} \\approx 0.1095\\ \\text{J} = 109.5\\ \\text{mJ}\\) — близко к напечатанным 108 (1 W при 1 fps = 1000 mJ на кадр). Шаг 2: ключ Li2024a — это Li et al. (2024b): буквы по списку литературы, не по ключу. Шаг 3: откуда взята мощность, статья не говорит → reported, а не measured. Ошибки: умножение вместо деления, буква из ключа, глагол сильнее доказательства.", "usage": {"code": false, "without": "Ты сравниваешь две платы для робота по «мДж на кадр» из разных статей, не проверив, как каждая получила мощность.", "with": "Ты пересчитываешь P/f, видишь, что числа сходятся, и пишешь «reported», раз способ замера не указан.", "benefit": "Число проверено арифметикой, а глагол — страницей"}, "img": {"src": "img/trc_writing_results_cmelr/42.svg", "alt": "Строка таблицы IV: Zynq MPSoC, 4.6 W, 42 fps, 108 mJ на кадр; внизу вопросы откуда мДж и как сослаться"}}, {"q": "Cai2024 (с. 15) пишет, что TrinitySLAM тратит «1.2 times less energy», чем базовый вариант на MPSoC; цифры — 17.7 против 38.4 mJ на кадр. Что писать в статье?", "options": ["\\(38.4/17.7 \\approx 2.2\\): база тратит больше чем вдвое; дать оба числа, а фразу авторов — через stated", "«1.2 times less» верно как \\((38.4-17.7)/17.7 \\approx 1.2\\); писать фразу авторов с глаголом showed", "\\(38.4-17.7 = 20.7\\) mJ — это и есть «в 1.2 раза»; глагол measured, числа в тексте приводить не нужно", "\\(38.4/17.7 \\approx 2.2\\): статья ошиблась, значит, Cai et al. admitted an error in their figures"], "correct": 0, "explain": "Шаг 1: отношение \\(38.4/17.7 \\approx 2.17\\) — базовый вариант тратит примерно в 2.2 раза больше. Шаг 2: «1.2 times less» подходит лишь как \\((38.4-17.7)/17.7 \\approx 1.17\\), то есть «на 117% больше» у базы, — фраза двусмысленна. Шаг 3: значит, приводим два числа, а не фразу: «Cai et al. (2024) stated that TrinitySLAM uses 1.2 times less energy...; their figures, 17.7 against 38.4 mJ per frame, mean that the baseline uses about 2.2 times as much». Ошибки: повторить двусмысленную фразу с showed; разность в мДж вместо отношения; «admitted» — из запрещённых.", "usage": {"code": false, "without": "В отчёте ты пишешь «новый регулятор в 1.5 раза экономнее», и половина читателей понимает «на 50%», а половина — «на 33%».", "with": "Ты пишешь «0.8 против 1.2 J на шов» — два числа, двусмысленности нет.", "benefit": "Сравнение читается одинаково у всех"}, "img": {"src": "img/trc_writing_results_cmelr/43.svg", "alt": "Цитата 1.2 times less energy и две карточки: TrinitySLAM 17.7 mJ на кадр и базовый вариант 38.4 mJ на кадр, внизу вопрос"}}, {"q": "Kuhne2025a, Table VI, с. 8 (мощность всей платы, замер): VIO с исходным конвейером — 4.42 W, с оптическим потоком на сенсоре — 3.79 W. На сколько меньше и какой глагол?", "options": ["На 630 mW, \\(\\approx 17\\%\\) от 3.79 W; measured — замер платы держит заявку", "На 630 mW, \\(\\approx 14\\%\\) от 4.42 W; measured — замер платы держит заявку", "На 63 mW, \\(\\approx 1.4\\%\\) от 4.42 W; stated — разница мала, а заявка громкая", "На 630 mW, \\(\\approx 14\\%\\) от 4.42 W; proved — снижение мощности доказано"], "correct": 1, "explain": "Шаг 1: разность \\(4.42 - 3.79 = 0.63\\) W = 630 mW. Шаг 2: доля от исходного: \\(0.63/4.42 \\approx 0.1425\\), около 14% (решение курса: 14.25%; на странице — 14.24%). Шаг 3: Table VI — замер мощности всей платы, доказательства держат заявку при её условиях → measured или found. Ошибки: процент от нового значения вместо исходного (\\(0.63/3.79 \\approx 17\\%\\)), сдвиг запятой (63 mW) и «proved» — один тест ничего не доказывает в общем.", "usage": {"code": false, "without": "Ты пишешь «новая прошивка снизила потребление на 17%», поделив разницу на новое значение, и коллега получает 14%.", "with": "Ты всегда делишь на исходное значение и пишешь, что мерили и чем.", "benefit": "Процент воспроизводится у любого, кто проверит"}, "img": {"src": "img/trc_writing_results_cmelr/44.svg", "alt": "Таблица замера мощности платы: исходный конвейер 4.42 W и оптический поток на сенсоре 3.79 W; внизу вопрос на сколько меньше и какой глагол"}}, {"q": "По таблице извлечения: мощность (power) приводят 18 из 56 исследований, прибором на плате её измерили два — Cai2024 и Kuhne2025a. Какое предложение верно по всем правилам?", "options": ["Power was reported by 18 of the 56 studies (32%), but only two measured it on the board (Cai et al., 2024; Kühne et al., 2025a).", "Power was reported by 18 of the 56 studies (32%), but only 2 measured it on the board (Kühne et al., 2025a; Cai et al., 2024).", "Power was reported by 18 studies (36%), but only two measured it on the board (Cai et al., 2024; Kühne et al., 2025a).", "Power was reported by 18 of the 56 studies (32%), but only two measured it on the board with a meter (Cai2024; Kuhne2025a)."], "correct": 0, "explain": "Шаг 1: база и доля: \\(18/56 \\approx 0.321\\) → 32%; 36% — это 18 из 50, а без «of the 56» база вообще пропадает. Шаг 2: меньше 10 — словами («two»), а маленький подсчёт называет свои исследования в одной скобке. Шаг 3: скобка по алфавиту (C раньше K), в форме журнала, без ключей; Kuhne2025a — это Kühne et al. (2025a). Каждый дистрактор ломает один шаг. Этот подсчёт — наш, он держится на charting table; остальные 16 работ дают паспорт, оценку вендора, чужую цифру или не говорят, откуда число.", "usage": {"code": false, "without": "Ты пишешь «мощность мерили немногие», и читатель не знает, сколько это и кто именно.", "with": "Ты пишешь «18 из 56, из них прибором — двое: такие-то», и каждый может проверить по таблице.", "benefit": "Подсчёт полный: база, доля и имена"}, "img": {"src": "img/trc_writing_results_cmelr/45.svg", "alt": "Воронка из трёх блоков: 56 исследований, 18 приводят мощность, 2 измерили прибором на плате; внизу вопрос про предложение"}}, {"q": "Энергию на кадр приводят три статьи корпуса: Cai2024, Li2024a и Li2024b (два отчёта одного исследования). Гайд решил считать по исследованиям. Сколько их, из какой базы, и как сослаться?", "options": ["Три из 56 исследований: (Cai et al., 2024; Li et al., 2024a; Li et al., 2024b)", "Два из 56 исследований: (Cai et al., 2024; Li et al., 2024b) — без повтора", "Три из 55 исследований: (Li et al., 2024a, 2024b; Cai et al., 2024)", "Два из 55 исследований: (Cai et al., 2024; Li et al., 2024a, 2024b)"], "correct": 3, "explain": "Шаг 1: Li2024a и Li2024b — одна система edgeSLAM2, тот же дрон и та же задержка 23.7 ms: одно исследование в двух отчётах, считаем один раз → 2 исследования. Шаг 2: база по исследованиям: 56 статей − 1 повтор = 55 (гайд: «56 papers of 55 studies»; счёты лекции пока по 56 статьям, пересчёт по 55 — после ваших правок). Шаг 3: цитируют оба отчёта в одной записи: (Li et al., 2024a, 2024b), а скобка — по алфавиту, Cai первым. Ошибки: два отчёта посчитаны как два исследования, один отчёт выброшен, нарушен алфавит.", "usage": {"code": false, "without": "Ты считаешь две статьи об одном стенде WAAM как два независимых подтверждения и завышаешь «доказательную базу».", "with": "Ты видишь, что это один эксперимент в двух публикациях, считаешь его один раз и цитируешь обе.", "benefit": "Подсчёт не раздувается из-за повторных публикаций"}, "img": {"src": "img/trc_writing_results_cmelr/46.svg", "alt": "Три отчёта Cai2024, Li2024a и Li2024b; два Li объединены скобкой как одно исследование; внизу вопросы о числе и ссылке"}}, {"q": "Xiao2026: реальное время = каждое обновление back-end укладывается в цикл контура 15 Hz; худший случай для выбранной конфигурации — 58.32 ms. Выполнен ли их критерий и с каким запасом?", "options": ["Нет: цикл \\(15/1000\\) s = 15 ms, а худший случай больше цикла почти в 3.9 раза", "Да: цикл \\(1000/15 \\approx 66.7\\) ms, запас \\(\\approx 8.3\\) ms — по худшему случаю, а не по среднему", "Неизвестно: цикл \\(1000/15 \\approx 66.7\\) ms, но 58.32 ms — худший случай, а среднее не дано", "Да: цикл \\(1000/15 \\approx 66.7\\) ms, но критерий — по среднему, худший случай тут не важен"], "correct": 1, "explain": "Шаг 1: период цикла \\(T = 1000/15 \\approx 66.67\\) ms. Шаг 2: запас \\(66.67 - 58.32 \\approx 8.35\\) ms. Шаг 3: критерий Xiao — по худшему случаю (slowest update), а если укладывается худший, укладываются и все остальные; среднее для этого критерия не нужно. Xiao2026 — одно из четырёх исследований корпуса, которые судят о реальном времени по самому медленному обновлению, а не по типичному. Ошибки: \\(15/1000\\) вместо \\(1000/15\\); думать, что без среднего вывода нет; путать критерий с средним.", "usage": {"code": false, "without": "Ты проверяешь цикл регулятора тока сварки по среднему времени итерации, а раз в секунду итерация не укладывается в период.", "with": "Ты меряешь худший случай за тысячи циклов и сравниваешь с периодом — с запасом в миллисекундах.", "benefit": "Гарантия реального времени держится на худшем случае"}, "img": {"src": "img/trc_writing_results_cmelr/47.svg", "alt": "Три цикла контура 15 Hz без масштаба, движущаяся отметка времени, ниже блок back-end update с худшим случаем 58.32 ms и вопрос о критерии"}}, {"q": "Temburu2020, Table II (с. 6), Jetson Nano: весь конвейер — 44.56 ms с GPU и 239.51 ms только на CPU; 64.11 FPS в Table I — настольный i7 с GPU 1050 Ti. Ничто не летало. Какое предложение верно?", "options": ["Temburu et al. (2020) ran their visual odometry at 64 frames per second on a drone with a Jetson Nano on board.", "On a Jetson Nano standing in for the flight computer, Temburu et al. (2020) reported 22.44 FPS with the GPU and 4.17 without it.", "On a Jetson Nano standing in for the flight computer, Temburu et al. (2020) reported 4.17 FPS with the GPU and 22.44 without it.", "On board a flying drone, Temburu et al. (2020) measured 22.44 FPS with the GPU and 4.17 FPS without it on a Jetson Nano."], "correct": 1, "explain": "Шаг 1: \\(1000/44.56 \\approx 22.44\\) FPS с GPU и \\(1000/239.51 \\approx 4.175\\) FPS только на CPU (в таблице напечатано 4.17) — больше время, меньше частота. Шаг 2: 64.11 FPS — из Table I, настольный компьютер вместо наземной станции, а не плата. Шаг 3: «to emulate onflight computing» — стенд, полёта нет. Это ровно партнёрская проверка из лекции: исходная фраза «...64 frames per second on a drone» получает «does not hold» — число из других условий. Ошибки дистракторов: чужая плата, перепутанные GPU и CPU, выдуманный полёт.", "usage": {"code": false, "without": "Ты пишешь в отчёте частоту обработки, измеренную на рабочем ноутбуке, как частоту на бортовом Raspberry Pi.", "with": "Ты пересчитываешь время кадра на нужной плате в частоту и пишешь, что это стенд, а не робот.", "benefit": "Число в тексте взято именно из тех условий, о которых предложение"}, "img": {"src": "img/trc_writing_results_cmelr/48.svg", "alt": "Две карточки: Jetson Nano из таблицы II с 44.56 ms и 239.51 ms и настольный i7 из таблицы I с 64.11 FPS; перечёркнутый дрон, ничто не летало"}}, {"q": "Партнёр проверяет пять ссылок по страницам. (1) Power was measured on the board by only two studies (Cai; Kühne 2025a). (2) Li et al. (2024b) reported 108 mJ per frame on a Zynq MPSoC. (3) Kumar et al. (2024) measured 10 W on the Jetson NX. (4) Kühne et al. (2025a) found that on-sensor optical flow cut power by 630 mW. (5) Kühne et al. (2025b) measured 64 to 68 mW on the GAP9. Какой набор отметок верен?", "options": ["holds, holds, does not hold, holds, does not hold", "holds, does not hold, does not hold, holds, does not hold", "holds, holds, does not hold, holds, holds", "holds, holds, holds, holds, does not hold"], "correct": 0, "explain": "Это упражнение E6 лекции. (1) holds: Cai2024 (с. 13) и Kuhne2025a (Table VI, с. 8) мерили плату; добавить базу «of the 56». (2) holds: ключ Li2024a — это и есть 2024b, а «reported» подходит, раз способ замера не указан. (3) does not hold: 10 W — паспорт (с. 1, 5) → «describe ... as a 10 W device». (4) holds: с. 8, 630 mW (14.24%) меньше; добавить плату Raspberry Pi CM4. (5) does not hold: с. 7, «Studies have shown» и ссылки [34], [35] — число чужое → «gave ... a figure taken from earlier studies». Дистракторы: путают букву Li с ключом, пропускают заимствованное число или паспортную мощность.", "usage": {"code": false, "without": "Ты проверяешь отчёт коллеги «на глаз» и пропускаешь, что одно число из даташита, а другое — из чужой статьи.", "with": "Ты проходишь каждую ссылку по четырём вопросам — найти, утверждение, число, глагол — и ставишь отметку со страницей.", "benefit": "Каждая ссылка проверена, а не в целом «вроде верно»"}, "img": {"src": "img/trc_writing_results_cmelr/49.svg", "alt": "Пять строк-утверждений о мощности и энергии, у каждой справа пустое поле для отметки holds или does not hold"}}, {"q": "Заметки: Liu2025 — 38 FPS, «real time», потому что быстрее камеры 30 Hz; Prutyanov2025 — 1.2 FPS, «suitable for real time», кадры раз в секунду. Какое контрастное предложение и вывод верны?", "options": ["Real time is achieved at 1.2 to 38 FPS (Liu et al., 2025; Prutyanov et al., 2025): rates about 30 times apart", "Liu et al. (2025) count 38 FPS as real time, while Prutyanov et al. (2025) accept 1.2: two rules, rates about 3 times apart", "Liu et al. (2025) count 38 FPS as real time, while Prutyanov et al. (2025) accept 1.2: one rule, rates about 30 times apart", "Liu et al. (2025) proved real time at 38 FPS, whereas Prutyanov et al. (2025) admitted 1.2: rates about 37 times apart"], "correct": 2, "explain": "Шаг 1: правило у обоих одно — быстрее, чем приходят кадры (38 > 30 Hz; 1.2 > 1 Hz). Шаг 2: отношение \\(38/1.2 \\approx 31.7\\), то есть примерно в 30 раз; «37» — это разность \\(38-1.2\\), а не отношение. Шаг 3: когда исследования одним словом называют разное, нужна контрастная фраза в narrative-форме с whereas / while — читатель должен видеть, кто какую частоту назвал. Общая скобка прячет, кто что сказал, а «proved» и «admitted» — из запрещённых. И помни: 1.2 у Prutyanov перенесено из прежней работы, поэтому фраза говорит, что они это ПРИНИМАЮТ, а не измерили.", "usage": {"code": false, "without": "Ты пишешь «все системы работают в реальном времени», хотя у одной это 1 kHz, а у другой 10 Hz.", "with": "Ты пишешь «одна считает реальным временем 1 kHz, другая — 10 Hz: правило одно, частоты в 100 раз разные».", "benefit": "Одинаковые слова больше не прячут разные требования"}, "img": {"src": "img/trc_writing_results_cmelr/50.svg", "alt": "Две карточки заметок: Liu2025 с 38 FPS и камерой 30 Hz и Prutyanov2025 с 1.2 FPS и кадрами раз в секунду; внизу вопрос о контрасте"}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
