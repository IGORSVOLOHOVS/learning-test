<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RMO: Моделирование роботов: DH, якобиан, динамика, траектории, валидация</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>RMO: Моделирование роботов: DH, якобиан, динамика, траектории, валидация</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>

  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncMergeBtn">🔄 Синхронизировать (свежее побеждает)</button>
    <button class="btn secondary" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script>
(function () {
  const TEST_ID = "robotics_modelling_kinematics_dynamics_trajectories";
  const QUESTIONS = [{"q": "Матрица 3x3 претендует на роль матрицы поворота в модели манипулятора. Какие две проверки необходимы и достаточны, чтобы она принадлежала SO(3)?", "options": ["Ортогональность RᵗR = I и det R = ±1, знак выбирают по правилу правой руки", "Все элементы по модулю не превышают единицы, а определитель отличен от нуля", "Сумма элементов каждой строки равна единице, а след матрицы равен нулю", "Ортогональность RᵗR = I и положительный определитель det R = +1"], "correct": 3, "explain": "Ортонормальность столбцов даёт RᵗR = I, откуда det R = ±1; ветвь −1 — это отражение, левосторонний зеркальный мир, который не создаёт ни одно сочленение. Слово special в SO(3) означает именно отбор ветви +1. Самый соблазнительный дистрактор — det R = ±1 со ссылкой на правило правой руки: правило правой руки описывает разметку осей, а не выбирает знак определителя, его фиксирует определение группы. Лекция 1, раздел SO(3).", "usage": {"code": false, "without": "В отчёте опубликована матрица с det R = 0,97 без проверок, и рецензент считает модель дрейфующей, не читая остальные разделы.", "with": "Две строки печати дают det R = 1,000000 и max|RᵗR − I| = 2e-16, и матрица принимается как поворот.", "benefit": "Две цифры закрывают вопрос о корректности ориентации."}}, {"q": "Что физически означают столбцы матрицы ⁰₁R, связывающей базовый фрейм 0 и фрейм звена 1?", "options": ["Оси фрейма 0, выраженные в базисе фрейма 1", "Проекции начала координат фрейма 1 на оси базового фрейма 0", "Оси фрейма 1, выраженные в базисе фрейма 0", "Углы Эйлера фрейма 1 относительно фрейма 0, записанные по столбцам"], "correct": 2, "explain": "Каждый элемент — скалярное произведение оси подвижного фрейма на ось опорного, поэтому столбцы ⁰₁R это оси фрейма 1, записанные в базисе фрейма 0. Самая частая ошибка — поменять фреймы местами: оси фрейма 0 в базисе фрейма 1 дают транспонированную матрицу ¹₀R = ⁰₁Rᵗ, и весь дальнейший FK молча считается в обратную сторону. Проекции начала координат это вектор положения, он живёт в четвёртом столбце 4x4, а не в блоке поворота. Лекция 1, три прочтения R.", "usage": {"code": false, "without": "Инженер подставляет ⁰₁R там, где нужна ¹₀R, и облако точек камеры уезжает в зеркальное положение относительно детали.", "with": "Он читает столбцы как оси подвижного фрейма, замечает несоответствие и ставит транспонирование до запуска захвата.", "benefit": "Направление преобразования проверяется до первого движения робота."}}, {"q": "Как устроена однородная матрица преобразования 4x4, которой курс описывает позу звена?", "options": ["Блок 3x3 — поворот, нижняя строка 1x3 — положение начала фрейма, правый столбец 0 0 0 1", "Блок 3x3 — моменты инерции звена, столбец 3x1 — положение начала фрейма, нижняя строка 0 0 0 1", "Блок 3x3 — поворот, столбец 3x1 — линейная скорость фрейма, нижняя строка 1 1 1 0", "Блок 3x3 — поворот, столбец 3x1 — положение начала фрейма, нижняя строка 0 0 0 1"], "correct": 3, "explain": "⁰T₁ собирается как блок поворота 3x3, четвёртый столбец с положением начала фрейма 1 в координатах фрейма 0 и служебная строка 0 0 0 1. Последняя строка нужна ровно для того, чтобы произведение двух таких матриц снова было матрицей того же вида, иначе правило композиции ⁰T₂ = ⁰T₁·¹T₂ не работало бы. Вариант с положением в нижней строке это транспонированная запись: она встречается в графике и в части софта, но с ней композиция цепочки идёт в обратном порядке, и FK получается неверным. Лекция 4, SE(3).", "usage": {"code": false, "without": "Инженер берёт позу из библиотеки, где трансляция лежит в нижней строке, перемножает её со своими матрицами и получает позу, которая не воспроизводится в симуляторе.", "with": "Он приводит обе матрицы к одному соглашению, и произведение цепочки совпадает с fkine toolbox до 1e-9 м.", "benefit": "Цепочка преобразований перемножается в одном и том же соглашении."}}, {"q": "Какой набор из четырёх параметров задаёт одну строку таблицы DH?", "options": ["Три угла Эйлера звена и расстояние между осями соседних сочленений", "θ, d, a, α: угол сочленения, смещение по его оси, длина звена и угол скрутки", "θ, d, a, α, причём у вращательного сочленения переменны θ и d, а a и α постоянны", "θ, d, m, I: угол и смещение сочленения, масса звена и его момент инерции"], "correct": 1, "explain": "Строка DH это ровно четыре числа: θ — поворот вокруг оси сочленения, d — смещение вдоль неё, a — общий перпендикуляр между осями соседних сочленений, α — угол скрутки между ними. У вращательного сочленения переменна только θ, остальные три фиксированы геометрией звена; поэтому вариант с двумя переменными параметрами неверен, d становится переменной лишь у поступательного сочленения. Масса и момент инерции в таблицу DH не входят — они появятся только в динамической модели. Лекция 2, построение кинематической цепи.", "usage": {"code": false, "without": "Студент заносит в таблицу DH массы звеньев, получает пять столбцов и не может подставить таблицу в DHRobot.", "with": "Он разделяет кинематические параметры θ, d, a, α и инерционные параметры звена, и модель собирается с первого запуска.", "benefit": "Таблица DH остаётся чисто кинематической и переносимой между инструментами."}}, {"q": "Как по таблице DH получают прямую задачу кинематики манипулятора с n сочленениями?", "options": ["Перемножают только блоки поворота, а положение инструмента суммируют по длинам звеньев", "Складывают однородные преобразования звеньев: ⁰Tₙ = A₁ + A₂ + ... + Aₙ", "Перемножают однородные преобразования звеньев по порядку: ⁰Tₙ = A₁·A₂·...·Aₙ", "Перемножают однородные преобразования звеньев в обратном порядке: ⁰Tₙ = Aₙ·...·A₂·A₁"], "correct": 2, "explain": "Каждая строка таблицы даёт матрицу Aᵢ, переводящую фрейм звена i−1 во фрейм звена i, и FK это их произведение в порядке от базы к инструменту. Обратный порядок перемножения не эквивалентен прямому, потому что произведение матриц не коммутативно: он соответствует цепочке, собранной от инструмента к базе, и даёт другую позу. Отдельное суммирование длин звеньев верно только для плоской вытянутой конфигурации и ломается при любом угле скрутки. Лекция 2.", "usage": {"code": false, "without": "Инженер перемножает матрицы в обратном порядке и получает позу, которая расходится с симулятором уже в первой тестовой конфигурации на десятки сантиметров.", "with": "Он собирает ⁰Tₙ = A₁·A₂·...·Aₙ и сверяет домашнюю позу с fkine: расхождение ниже 1e-6 м.", "benefit": "Порядок перемножения фиксирован и проверяем одной конфигурацией."}}, {"q": "Что отображает геометрический якобиан J(q) манипулятора?", "options": ["Вектор координат сочленений q в положение и ориентацию инструмента", "Вектор скоростей сочленений q̇ в линейную и угловую скорость инструмента", "Вектор ускорений сочленений q̈ в линейное ускорение инструмента", "Вектор моментов сочленений τ в силу и момент, приложенные к инструменту"], "correct": 1, "explain": "Якобиан это линейное отображение скоростей: v и ω инструмента получаются как J(q)·q̇, причём сам J зависит от текущей конфигурации. Отображение координат сочленений в позу это прямая задача кинематики, а не якобиан, и именно эта подмена самая частая. Ускорения через J не выражаются одним членом — там появляется ещё J̇·q̇, а связь моментов и силы идёт через транспонированный якобиан. Лекция 3.", "usage": {"code": false, "without": "Инженер ждёт от J(q) позу инструмента, подставляет углы вместо скоростей и получает бессмысленные метры в строках угловой части.", "with": "Он подставляет q̇ и читает v и ω, а позу берёт из FK: обе проверки совпадают с jacob0 и fkine.", "benefit": "Скорости и позы считаются своими инструментами без подмены."}}, {"q": "В стандартной форме M(q)q̈ + C(q,q̇)q̇ + g(q) = τ что описывает член C(q,q̇)q̇?", "options": ["Кориолисовы и центробежные моменты, рождённые самими скоростями сочленений", "Вязкое трение в редукторах, пропорциональное скорости сочленений", "Инерционную связь между сочленениями при заданных ускорениях", "Моменты от веса звеньев, зависящие от текущей конфигурации манипулятора"], "correct": 0, "explain": "C·q̇ собирает моменты, которые рождаются скоростями: произведения двух разных скоростей дают кориолисовы члены, квадрат одной скорости — центробежные; при q̇ = 0 весь член обращается в нуль. Вязкое трение тоже пропорционально скорости и потому очень похоже, но это внешняя диссипативная добавка, которой в модели жёстких звеньев нет: её вносят отдельным членом F·q̇, и смешение её с C занижает требуемый момент на разгоне. Инерционная связь это M, вес звеньев это g. Лекция 4.", "usage": {"code": false, "without": "Инженер объявляет член C вязким трением, выбрасывает его как малый и недооценивает момент на быстром развороте первого сочленения.", "with": "Он оставляет C как скоростной член модели, а трение добавляет отдельно, и расчётный момент совпадает с rne в пределах 1%.", "benefit": "Моменты от скоростей не исчезают из расчёта привода."}}, {"q": "Сколько и каких граничных условий фиксирует кубический полином θ(t) = a₀ + a₁t + a₂t² + a₃t³ при перемещении сустава из точки в точку?", "options": ["Четыре: положение, скорость и ускорение в начале и положение в конце", "Четыре: положение и скорость в начале и положение и скорость в конце", "Два: положение в начале и в конце, а скорости находят из условия минимума энергии", "Шесть: положение, скорость и ускорение на обоих концах участка"], "correct": 1, "explain": "Четыре коэффициента требуют ровно четырёх условий, и для перемещения из покоя в покой это положение и скорость на каждом из двух концов. Шесть условий, то есть ещё и ускорения на концах, закрывает квинтический полином с шестью коэффициентами — это соседняя и очень похожая конструкция, но кубическому их просто некуда поместить, поэтому его ускорение на старте скачком уходит от нуля. Лекция 5, планирование в пространстве сочленений.", "usage": {"code": false, "without": "Студент пытается задать кубическому профилю нулевое ускорение на концах, система из шести уравнений оказывается несовместной, и он объявляет задачу неразрешимой.", "with": "Он считает степени свободы полинома, видит четыре условия и берёт квинтический профиль там, где нужны ускорения на концах.", "benefit": "Выбор степени полинома следует из числа граничных условий."}}, {"q": "Почему аналитический результат без независимой проверки оценивается в проекте почти нулём, как бы элегантен он ни был?", "options": ["Ручной вывод принципиально менее точен, чем численный расчёт в toolbox, поэтому расхождение в миллиметры для него нормально", "Отчёт без симуляции не проходит формальное требование к объёму в 12-18 страниц", "Расхождение с симуляцией в 4 мм — это ненайденная ошибка модели, а не погрешность округления", "Симуляция заменяет вывод формул, поэтому сам вывод в отчёте можно не приводить"], "correct": 2, "explain": "Валидация это не украшение, а единственный способ отличить верную модель от правдоподобной: расхождение в миллиметры означает ошибку в соглашении, в знаке α или в единицах, и проект требует её диагностировать. Соблазнительный вариант про меньшую точность ручного вывода путает причину со следствием: аналитика и toolbox считают одно и то же с машинной точностью, поэтому ненулевой остаток это именно баг, а не шум. Проект, этап 7.", "usage": {"code": false, "without": "Красиво выведенный FK попадает в отчёт без сверки, и на защите выясняется, что в третьей строке таблицы DH перепутан знак α.", "with": "Остатки по пяти конфигурациям сведены в таблицу, расхождение 4 мм найдено и объяснено до сдачи отчёта.", "benefit": "Ошибка модели находится автором, а не панелью."}}, {"q": "Чем рабочая зона с полной подвижностью отличается от достижимой рабочей зоны?", "options": ["Она совпадает с достижимой у любого манипулятора с шестью степенями свободы", "Она включает точки, достижимые хотя бы одной конфигурацией, в том числе на границе", "В ней инструмент достижим при любой ориентации, а не хотя бы при одной", "Она шире достижимой, так как учитывает перемещение манипулятора на подвижной платформе"], "correct": 2, "explain": "Достижимая зона это точки, куда инструмент попадает хотя бы в одной конфигурации; зона полной подвижности это её подмножество, где к точке можно подойти с произвольной ориентацией. Самый близкий дистрактор как раз и описывает достижимую зону — разница в словах хотя бы одной и любой, и именно она решает, годится ли точка для операции с заданным подходом инструмента. На границе достижимой зоны ветви IK сливаются и ориентация остаётся единственной, поэтому совпадения двух зон не бывает даже у шестиосевого манипулятора. Лекция 2.", "usage": {"code": false, "without": "Ячейку проектируют по достижимой зоне, и на монтаже выясняется, что в угловой точке инструмент подходит к детали только вдоль одного направления.", "with": "Границы считают по зоне полной подвижности, и подход под нужным углом гарантирован во всех точках задачи.", "benefit": "Компоновка ячейки учитывает ориентацию, а не только дотягивание."}}, {"q": "Что такое gimbal lock у трёхпараметрических представлений ориентации вроде ZYZ или roll-pitch-yaw?", "options": ["При нулевом среднем угле матрица поворота теряет ортогональность, и det R обращается в нуль", "При переходе через ±180° углы меняют знак, но представление остаётся однозначным и устойчивым", "При среднем угле ±90° две оси совпадают, одна степень свободы теряется, а производные расходятся", "При больших скоростях сочленений численное интегрирование углов теряет точность из-за шага"], "correct": 2, "explain": "Три параметра не могут покрыть SO(3) без особенностей: когда средний угол выходит на ±90°, первая и третья оси вращения совпадают, их вклад становится неразличимым, и обратный переход от матрицы к углам даёт бесконечную чувствительность. Это свойство самого представления, а не численной схемы, поэтому вариант про шаг интегрирования мимо: уменьшение шага особенность не убирает. Полная матрица и кватернион от gimbal lock свободны. Лекция 1 и Q1b пробного экзамена.", "usage": {"code": false, "without": "Камера сообщает позу в roll-pitch-yaw, деталь встаёт почти вертикально, и два из трёх углов начинают скакать между кадрами.", "with": "Поза хранится матрицей или кватернионом, углы остаются только в отчёте для человека, и скачков в конвейере нет.", "benefit": "Особенность представления не доходит до контура управления."}}, {"q": "Камера на фланце измеряет позу детали ᶜTᵈ; известны hand-eye преобразование ᵉTᶜ и прямая кинематика ⁰Tᵉ. Как получить позу детали в базовом фрейме?", "options": ["⁰Tᵈ = ᶜTᵈ · ᵉTᶜ · ⁰Tᵉ, цепочку читают от детали к базе", "⁰Tᵈ = ⁰Tᵉ · ᵉTᶜᵗ · ᶜTᵈ, обратное hand-eye компенсирует монтаж камеры", "⁰Tᵈ = ⁰Tᵉ · ᵉTᶜ · ᶜTᵈ, и порядок множителей менять нельзя", "⁰Tᵈ = ⁰Tᵉ + ᵉTᶜ + ᶜTᵈ, однородные преобразования складываются покомпонентно"], "correct": 2, "explain": "Цепочка идёт от базы к фланцу, от фланца к камере и от камеры к детали, поэтому множители стоят именно в этом порядке. Произведение матриц не коммутативно: каждый следующий множитель действует в системе, которую задал предыдущий, и перестановка даёт другую позу, а не ту же в другой записи. Обратное hand-eye нужно для перехода из фланца в камеру, то есть в противоположную сторону, и его подстановка разворачивает монтажное смещение камеры. Q1a пробного экзамена.", "usage": {"code": false, "without": "Пара множителей переставлена, захват уезжает на величину вылета камеры, и ошибку списывают на калибровку.", "with": "Цепочка собрана от базы к детали, захват попадает в деталь, и калибровку проверять не приходится.", "benefit": "Ошибка порядка множителей исключается до испытаний."}}, {"q": "Чем standard DH отличается от modified DH и почему конвенцию обязательно объявлять в отчёте?", "options": ["Фрейм звена ставится на дальний конец у одной конвенции и на ближний у другой, поэтому таблицы не взаимозаменяемы", "Standard использует четыре параметра, а modified пять, включая смещение инструмента, поэтому таблицы приводятся друг к другу отбрасыванием лишнего столбца", "Modified задаёт углы в радианах, а standard в градусах, отсюда расхождение в FK", "Конвенции различаются только знаком угла скрутки α, и прямая кинематика от этого не меняется"], "correct": 0, "explain": "Обе конвенции используют четыре параметра, но по-разному привязывают фрейм к звену и по-разному упорядочивают элементарные преобразования внутри Aᵢ. Из-за этого одна и та же таблица, прочитанная в другой конвенции, даёт другую позу, и статьи, которые свободно смешивают Spong и Craig, это главный источник молчаливо неверного FK. Разница только в знаке α это ложное упрощение: тогда таблицы были бы взаимозаменяемы с точностью до знака, чего нет. Проект, этап 1.", "usage": {"code": false, "without": "Таблица DH скопирована из статьи без указания конвенции, FK расходится с симулятором на всех конфигурациях, и причину ищут в якобиане.", "with": "Конвенция объявлена и проверена на домашней позе, расхождение сразу ниже 1e-6 м.", "benefit": "Источник расхождения FK исключается в первом же разделе."}}, {"q": "Что даёт декомпозиция по Пиперу у шестиосевого манипулятора со сферической кистью?", "options": ["Число решений IK сокращается до одного, и выбор ветви перестаёт быть вопросом", "Якобиан становится блочно-диагональным, и сингулярности кисти исчезают", "Задача IK распадается на позиционную для первых трёх осей и ориентационную для кисти", "Динамическая модель распадается на три независимых одномерных уравнения движения"], "correct": 2, "explain": "У сферической кисти три последние оси пересекаются в одной точке, поэтому центр кисти вычисляется прямо из целевой позы, первые три сочленения решаются как позиционная задача, а кисть добирает ориентацию. Это и есть замкнутая форма IK. Исчезновения сингулярностей декомпозиция не даёт: совпадение осей 4 и 6 это как раз учебная сингулярность кисти, она остаётся. Кратность решений тоже остаётся, их до восьми. Лекция 2 и опция A проектного задания.", "usage": {"code": false, "without": "IK шестиосевого манипулятора решают численно от случайного начального приближения, и решатель уходит в соседнюю ветвь при каждом перезапуске.", "with": "Центр кисти считается аналитически, ветви перечислены явно, и каждая проверяется обратной подстановкой в FK.", "benefit": "Решение IK становится повторяемым и перечислимым."}}, {"q": "Что означает кратность решений IK вида elbow-up и elbow-down, wrist flip для шестиосевого манипулятора со сферической кистью?", "options": ["Разным позам инструмента отвечает один и тот же набор углов из-за избыточности манипулятора", "Одной позе инструмента отвечают до восьми наборов углов, и ветвь выбирает инженер", "Одной позе отвечают до восьми наборов углов, из которых физически достижим ровно один", "Число решений равно числу степеней свободы, то есть шести для такого манипулятора"], "correct": 1, "explain": "Два варианта разворота плеча, два положения локтя и два положения кисти дают до восьми решений для одной и той же позы инструмента, и выбор между ними делает инженер по пределам сочленений, столкновениям и непрерывности траектории. Соблазнительный вариант про единственное достижимое решение неверен: обычно достижимы несколько ветвей сразу, именно поэтому выбор приходится обосновывать, а не вычислять. Шесть решений по числу осей — произвольная ассоциация, кратность задаётся геометрией, а не числом сочленений. Q4 пробного экзамена.", "usage": {"code": false, "without": "Планировщик берёт первое решение IK, на середине траектории ветвь меняется, и кисть делает полный разворот на 180°.", "with": "Ветвь фиксируется явно и проверяется на всей траектории, разворота кисти в цикле не возникает.", "benefit": "Движение остаётся непрерывным на всём пути."}}, {"q": "Чем геометрический якобиан отличается от аналитического?", "options": ["Геометрический считают численно конечными разностями, аналитический выводят символьно, и расхождение между ними равно ошибке усечения шага", "Нижний блок геометрического даёт вектор угловой скорости ω, аналитического — производные выбранных углов ориентации", "Геометрический справедлив только в базовом фрейме, аналитический в любом фрейме инструмента", "Геометрический описывает только линейную скорость, аналитический добавляет угловую"], "correct": 1, "explain": "Оба якобиана имеют размер 6xn и оба выводятся символьно; различие в том, чем описана вращательная часть. Геометрический даёт настоящий вектор угловой скорости, аналитический — производные параметров выбранного представления ориентации, поэтому он наследует и его особенности, включая gimbal lock. Слово аналитический провоцирует думать про символьный вывод в противоположность численному — это и есть главная ловушка вопроса: способ вычисления тут вообще не при чём. Лекция 3, модуль 3 экзаменационного чеклиста.", "usage": {"code": false, "without": "Аналитический якобиан используют у позы с углом тангажа около 90°, и требуемые скорости сочленений уходят в бесконечность на ровном участке траектории.", "with": "Для управления берут геометрический якобиан, и особенность представления в контур не попадает.", "benefit": "Контур скорости не наследует особенности углов Эйлера."}}, {"q": "Какие моменты сочленений уравновешивают внешнюю силу и момент F, приложенные к инструменту?", "options": ["τ = Jᵗ F, транспонированный якобиан переносит силу с инструмента в моменты сочленений", "τ = Jᵗ F только вне сингулярностей, а в сингулярной конфигурации соотношение становится неприменимым", "τ = J F, тот же якобиан, что и для скоростей, переносит силу в моменты", "τ = J⁻¹ F, так как сила и скорость связаны обратной зависимостью"], "correct": 0, "explain": "Равенство виртуальных работ τᵗδq = Fᵗδx вместе с δx = J δq даёт τ = Jᵗ F — это и есть силомоментная двойственность. Самый тонкий дистрактор добавляет условие вне сингулярностей: именно наоборот, τ = Jᵗ F верно во всех конфигурациях, включая сингулярные, потому что транспонирование определено всегда; ломается там обратная задача, где нужен J⁻¹. Лекция 3 и Q5c пробного экзамена.", "usage": {"code": false, "without": "В сингулярной конфигурации инженер отказывается считать статику через якобиан и оц ти."}}, {"q": "Конфигурация манипулятора даёт det J = 0. Что это значит инженерно?", "options": ["Инструмент теряет мгновенную подвижность вдоль одного направления, а скорости сочленений рядом с такой позой расходятся", "Конфигурация физически недостижима и должна быть отброшена при планировании траектории, так как решения IK в ней не существует", "Манипулятор теряет статическую жёсткость и не может удерживать нагрузку ни в каком направлении", "Падает точность численного решения FK, тогда как IK в этой точке остаётся корректной"], "correct": 0, "explain": "Падение ранга якобиана означает, что в пространстве скоростей инструмента исчезает одно направление: получить движение вдоль него нельзя ни при каких скоростях сочленений, а вблизи такой конфигурации обратный якобиан плохо обусловлен, и требуемые скорости растут как 1/det. Вариант про потерю жёсткости звучит убедительно, но физически противоположен: именно в запертом направлении конструкция максимально жёсткая, она там не движется. Сингулярная конфигурация достижима и часто лежит прямо на границе рабочей зоны. Q5b пробного экзамена.", "usage": {"code": false, "without": "Траектория проходит через вытянутую конфигурацию, и привод второго сочленения уходит в ограничение по скорости на ровном участке.", "with": "Сингулярность найдена из det J = 0 заранее, и путь обводится в обход с запасом по обусловленности.", "benefit": "Срывы по скорости у границы зоны исключаются на этапе планирования."}}, {"q": "Как в члене C(q,q̇)q̇ двухзвенного планарного манипулятора отличить центробежные слагаемые от кориолисовых?", "options": ["Центробежные входят в матрицу M, а кориолисовы остаются в C и зависят от ускорений", "Центробежные зависят от конфигурации, а кориолисовы только от скоростей и от углов не зависят", "Центробежные пропорциональны произведению двух разных скоростей, кориолисовы — квадрату одной", "Центробежные пропорциональны квадрату одной скорости, кориолисовы — произведению двух разных"], "correct": 3, "explain": "Признак чисто формальный и потому надёжный: q̇ᵢ² это центробежный член, q̇ᵢq̇ⱼ при i ≠ j — кориолисов. Перестановка этих признаков, то есть второй вариант, это самая частая ошибка на экзамене. Оба типа при этом зависят и от конфигурации тоже, через коэффициенты, поэтому третий вариант неверен; а в M входят только множители при ускорениях. Лекция 4 и Q6b пробного экзамена.", "usage": {"code": false, "without": "В отчёте членом C объявлены все слагаемые со скоростями без разбора, и на защите не удаётся объяснить, почему момент растёт при вращении только первого сочленения.", "with": "Слагаемые с q̇₁² опознаны как центробежные, с q̇₁q̇₂ как кориолисовы, и физика каждого объяснена отдельно.", "benefit": "Физический смысл каждого члена защищается перед панелью."}}, {"q": "Какие допущения несёт динамическая модель манипулятора, записанная как M q̈ + C q̇ + g = τ?", "options": ["Звенья жёсткие, трение учтено кулоновской моделью, а зазор в редукторах внесён отдельным членом, поэтому калибровка модели не нужна", "Звенья упругие, трение учтено линейно, а инерционные параметры определяются по данным", "Допущений нет: стандартная форма описывает манипулятор точно, если M, C и g выведены верно", "Звенья абсолютно жёсткие, трение и зазор в редукторах не учтены, инерционные параметры считаются известными"], "correct": 3, "explain": "Стандартная форма это модель идеального жёсткого манипулятора: упругость звеньев и валов, кулоновское и вязкое трение, зазор и податливость редуктора в неё не входят, а моменты инерции и положения центров масс берутся из URDF или паспорта как точные. Самый опасный вариант — утверждение, что допущений нет: именно он закрывает разделу валидации возможность объяснить остаточное расхождение, которое курс требует диагностировать и описать. Лекция 4 и раздел ограничений проекта.", "usage": {"code": false, "without": "Остаток по моменту держится на 6%, и защитить это нечем, потому что в отчёте заявлено, что модель точна.", "with": "Допущения перечислены заранее, и остаток в 6% связывается с неучтённым трением в редукторе первого сочленения.", "benefit": "Расхождение получает объяснение вместо оправдания."}}, {"q": "Как устроен профиль LSPB для перемещения сустава из точки в точку?", "options": ["Разгон с постоянным ускорением, участок постоянной скорости, торможение таким же ускорением", "Разгон по кубическому полиному, участок постоянной скорости, торможение по кубическому полиному", "Постоянная скорость на всём участке, а скачки скорости на старте и стопе гасит сам привод", "Разгон с постоянным рывком, участок постоянного ускорения, торможение с постоянным рывком"], "correct": 0, "explain": "LSPB это линейный участок с параболическими сопряжениями: на разгоне и торможении ускорение постоянно, поэтому по положению получается парабола, а в середине скорость держится постоянной. Вариант с кубическими сопряжениями описывает реальную соседнюю схему со сглаженным рывком, но это уже не LSPB, и расчёт времени разгона по V/a для него не работает. Вариант с постоянной скоростью на всём участке требует бесконечного ускорения на старте. Лекция 5.", "usage": {"code": false, "without": "Время разгона считают по формуле LSPB, а профиль собран с кубическими сопряжениями, и расчётный такт расходится с измеренным на десятые доли секунды.", "with": "Профиль и формулы согласованы, время разгона 0,75 с подтверждается записью скорости привода.", "benefit": "Расчёт такта совпадает с измерением на стенде."}}, {"q": "Траектория собрана из кубических участков через промежуточные точки. Что нужно задать в промежуточной точке, чтобы движение не дёргалось?", "options": ["Нулевое ускорение в каждой промежуточной точке, положение и скорость стыкуются сами", "Только положение: кубические участки стыкуются по скорости уже по построению", "Скорость в точке, общую для соседних участков, иначе в ней будет разрыв скорости", "Нулевую скорость в каждой промежуточной точке, иначе участки не стыкуются по положению"], "correct": 2, "explain": "Каждый кубический участок задаётся своими граничными условиями, и если соседние участки назначат в общей точке разные скорости, профиль скорости разорвётся, а ускорение в этот момент уйдёт в бесконечность. Поэтому в промежуточной точке скорость выбирают один раз и передают обоим участкам. Нулевая скорость в каждой точке тоже стыкует профиль, но превращает проход через точку в полную остановку и съедает такт; к тому же обоснование в этом дистракторе ложное — по положению участки стыкуются при любой скорости. Лекция 5.", "usage": {"code": false, "without": "Через четыре промежуточные точки заданы только положения, манипулятор дёргается в каждой из них, и причину ищут в настройках привода.", "with": "Скорости в промежуточных точках назначены согласованно, и запись показывает непрерывный профиль скорости.", "benefit": "Проход через точку остаётся непрерывным и быстрым."}}, {"q": "Что нужно, чтобы проверить траекторию не только на пределы скорости, но и на пределы моментов приводов?", "options": ["Динамическая модель: моменты получают, подставив q, q̇ и q̈ траектории в M q̈ + C q̇ + g", "Таблица DH: по длинам звеньев сразу получают плечо силы и предельный момент", "Якобиан: он переводит заданную декартову скорость в требуемые моменты сочленений", "Профиль рывка: пиковый рывок пропорционален пиковому моменту с коэффициентом редукции"], "correct": 0, "explain": "Пределы скорости проверяются кинематически, а момент это динамическая величина: его даёт подстановка всей траектории, включая ускорения, в уравнения движения. Якобиан переводит в моменты силу, а не скорость, поэтому с его помощью оценивается только статическое удержание нагрузки — это самый близкий и самый частый неверный ответ. Рывок с моментом напрямую не связан: он ограничивает скорость изменения момента, а не его величину. Лекция 5 и этап 6 проекта.", "usage": {"code": false, "without": "Траектория проходит по скорости и срывает привод по моменту на разгоне первого сочленения под полной нагрузкой.", "with": "Моменты вдоль траектории посчитаны динамической моделью, пик сопоставлен с паспортом привода, и время движения увеличено на 0,3 с.", "benefit": "Выполнимость проверяется по обоим пределам до стенда."}}, {"q": "Семиосевой кобот вроде Franka Emika Panda: что даёт нуль-пространство якобиана при решении IK?", "options": ["Единственное решение IK, выбранное из бесконечного множества по минимуму нормы моментов", "Набор конфигураций, в которых поза инструмента недостижима, их исключают при планировании", "Подпространство декартовых направлений, вдоль которых инструмент не может двигаться ни при каких скоростях", "Самодвижение, не меняющее позу инструмента, которым уходят от сингулярности или предела сустава"], "correct": 3, "explain": "У семиосевого манипулятора скоростей сочленений больше, чем компонент скорости инструмента, поэтому существуют ненулевые q̇ с J q̇ = 0: манипулятор переконфигурируется, а инструмент стоит. Этим и пользуются для вторичных целей — уйти от предела сустава, от препятствия, от плохо обусловленной позы. Соблазнительный дистрактор описывает подпространство декартовых направлений, недоступных инструменту: это запертое направление в сингулярности, то есть соседнее понятие из того же раздела, но живёт оно в пространстве задачи, а не в пространстве сочленений. Опция B проектного задания.", "usage": {"code": false, "without": "Семиосевой кобот решают как шестиосевой, фиксируя лишний угол, и в середине цикла упираются в предел седьмого сустава.", "with": "Избыточность разрешена через нуль-пространство со вторичной целью, и предел сустава не достигается на всём цикле.", "benefit": "Лишняя степень свободы работает, а не мешает."}}, {"q": "Чем в разделе валидации проверяют аналитически выведенный якобиан J(q)?", "options": ["Конечно-разностной производной FK по каждому углу, расхождение по столбцам ниже 1e-4", "Прогоном траектории в симуляторе и сравнением времени цикла с расчётным", "Сравнением det J с нулём в нескольких случайных конфигурациях", "Повторным выводом тех же формул вручную, расхождение по столбцам ниже 1e-6"], "correct": 0, "explain": "Столбец якобиана это производная позы по одному углу, поэтому численная производная FK даёт независимую оценку: FK уже проверен отдельно, а метод вычисления другой, и ошибка вывода не воспроизводится. Повторный ручной вывод тех же формул независимой проверкой не является — он воспроизводит ту же ошибку и ту же невнимательность, и это самая распространённая подмена в отчётах. Проверка det J говорит о сингулярности, а не о правильности столбцов. Этап 7 проекта.", "usage": {"code": false, "without": "Якобиан проверяют повторным выводом, оба раза пропускают множитель в третьем столбце, и ошибка доживает до раздела статики.", "with": "Конечные разности FK дают расхождение 3e-5 по всем столбцам, и якобиан можно использовать дальше.", "benefit": "Ошибка вывода не переносится в статику и планирование."}}, {"q": "После тысяч перемножений матрица поворота в симуляции даёт det R = 0,9993. Что делают по методике курса?", "options": ["Проецируют матрицу на ближайший поворот через SVD: R = UVᵗ, при отрицательном определителе меняют знак третьего столбца U", "Нормируют каждый столбец на его длину, этого достаточно для возврата в SO(3)", "Принимают дрейф как погрешность float и идут дальше: отличие от единицы в четвёртом знаке лежит ниже допуска таблицы валидации", "Делят все элементы матрицы на det R, после чего определитель становится единичным"], "correct": 0, "explain": "Правильный ремонт это ортогональная проекция: разложить дрейфующую матрицу по SVD и собрать R = UVᵗ, что даёт ближайший в смысле Фробениуса элемент SO(3). Нормировка столбцов выглядит почти так же и чинит их длины, но ортогональность между столбцами не восстанавливает, поэтому RᵗR всё равно остаётся отличной от I. Деление на определитель вообще не помогает: у матрицы 3x3 определитель при этом делится на куб числа. Лекция 1, worked example 2.", "usage": {"code": false, "without": "Дрейф накапливается, тело в симуляции медленно растягивается, и расхождение по позе растёт от такта к такту.", "with": "После ремонта через SVD det R снова равен 1,000000, а max|RᵗR − I| возвращается к 2e-16.", "benefit": "Длинный прогон симуляции не уводит модель из SO(3)."}}, {"q": "Какой порядок остатка в таблице валидации курс считает нормой для позы FK и для столбцов якобиана и почему допуски разные?", "options": ["Оба остатка ниже 1e-2: дальше точность ограничена моделью звеньев", "Поза FK ниже 1e-3 м, столбцы якобиана ниже 1e-6", "Поза FK ниже 1e-6 м, столбцы якобиана ниже 1e-4", "Поза FK ниже 1e-6 м, столбцы якобиана ниже 1e-9"], "correct": 2, "explain": "Поза FK считается перемножением одних и тех же матриц двумя реализациями, то есть совпадать должна почти до машинной точности, отсюда 1e-6 м. Якобиан же сверяется с конечной разностью, у которой есть собственная ошибка усечения порядка шага, поэтому требовать от неё 1e-9 бессмысленно, и допуск сознательно мягче — 1e-4 по столбцу. Вариант с жёстким допуском на якобиан и мягким на FK меняет логику местами: он требует невозможного от численной производной и прощает настоящую ошибку модели. Таблица валидации проекта.", "usage": {"code": false, "without": "Инженер требует 1e-9 от конечно-разностной проверки якобиана, не получает его и неделю ищет ошибку в верном выводе.", "with": "Допуски расставлены по природе проверки, и 3e-5 по столбцу принимается как совпадение.", "benefit": "Время уходит на настоящие расхождения, а не на шум метода."}}, {"q": "В конвейере камера-контроллер нужно выбрать представление ориентации. Какой выбор обоснован по методике курса?", "options": ["Полная матрица везде, включая отчётность: девять чисел читаются человеком не хуже трёх углов", "Полная матрица или кватернион, потому что у них нет особенностей представления, а углы Эйлера оставляют для отчётности", "Углы ZYZ: они совпадают с конвенцией DH, что избавляет от пересчёта на стыке камеры и FK и снимает особенность представления", "Углы roll-pitch-yaw: три числа вместо девяти, а особенность встречается лишь при редких позах"], "correct": 1, "explain": "В конвейере восприятия и управления критична устойчивость: полная матрица и кватернион покрывают SO(3) без особенностей, и производные остаются ограниченными, поэтому поза передаётся в этом виде, а углы Эйлера оставляют там, где их читает человек. Вариант про редкие позы для RPY как раз и проваливается: вертикальный подход инструмента, при котором тангаж около 90°, в задачах захвата не редкость, а штатный режим. Соотнесения углов ZYZ с конвенцией DH не существует. Q1b пробного экзамена.", "usage": {"code": false, "without": "Поза детали передаётся тремя углами, деталь встаёт вертикально, и контур ориентации начинает дрожать на штатном захвате.", "with": "Поза передаётся матрицей, в отчёт выводятся углы, и дрожания в вертикальном подходе нет.", "benefit": "Устойчивость конвейера и читаемость отчёта разведены."}}, {"q": "Для проекта выбран пятиосевой манипулятор. Что обязательно заявить в отчёте?", "options": ["Что якобиан пятиосевого манипулятора квадратный, поэтому сингулярности находят через det J", "Что IK пятиосевого манипулятора всегда имеет замкнутую форму, поэтому численная схема не нужна", "Какую степень свободы задачи приносят в жертву и почему это допустимо для выбранной операции", "Что пятиосевой манипулятор достигает любой позы, если задача плоская, и ограничений нет"], "correct": 2, "explain": "Произвольная поза в пространстве требует шести степеней свободы, у пятиосевого манипулятора их пять, поэтому одну компоненту задачи приходится отпустить — обычно поворот инструмента вокруг оси подхода — и это решение нужно назвать и обосновать операцией. Дистрактор про квадратный якобиан звучит технично и ошибочен дважды: якобиан получается 6x5, и сингулярности у него ищут по падению ранга или по наименьшему сингулярному числу, а определителя у неквадратной матрицы нет. Опция C проектного задания.", "usage": {"code": false, "without": "Пятиосевой манипулятор моделируют как полноценный шестиосевой, IK не сходится на части поз, и причину приписывают решателю.", "with": "В отчёте заявлено, что отпущен поворот вокруг оси подхода, и IK сходится на всём наборе рабочих поз.", "benefit": "Ограничение конструкции становится осознанным допущением."}}, {"q": "Для регулятора computed torque, считающего τ каждую миллисекунду, какую формулировку динамики выбирают и почему?", "options": ["Лагранжа: замкнутые M(q), C(q,q̇) и g(q) считаются быстрее рекурсии при любом числе звеньев", "Ньютона-Эйлера: только она учитывает гравитацию, тогда как лагранжева её опускает", "Любую: обе дают одинаковые уравнения, поэтому вычислительная стоимость такта от выбора не зависит", "Ньютона-Эйлера: рекурсия порядка O(n) выдаёт τ напрямую, без символьных M, C и g"], "correct": 3, "explain": "Обе формулировки дают одни и те же уравнения движения, но стоят разного: рекурсия Ньютона-Эйлера линейна по числу звеньев и считает нужный момент сразу, а замкнутые M, C и g растут в объёме и для шестиосевого манипулятора разворачиваются в тысячи слагаемых. Поэтому в реальном времени берут рекурсию, а лагранжеву форму оставляют для анализа и синтеза регулятора. Вариант любая верен в первой половине и ломается во второй: одинаковые уравнения не означают одинаковую стоимость вычисления. Q6c пробного экзамена.", "usage": {"code": false, "without": "Символьные M, C и g подставлены в такт 1 мс, вычисление не укладывается в период, и регулятор срывается в насыщение.", "with": "Рекурсия Ньютона-Эйлера укладывается в такт, а лагранжева форма используется для анализа устойчивости.", "benefit": "Каждая формулировка применяется там, где она дешевле."}}, {"q": "Какие свойства матрицы инерции M(q) используют при проверке выведенной динамической модели?", "options": ["Она диагональна, поэтому сочленения динамически независимы, а её элементы зависят от q", "Она симметрична и положительно определена при любой конфигурации, а её элементы зависят от q", "Она симметрична и положительно определена, но её элементы от конфигурации не зависят", "Она положительно определена лишь вне сингулярностей якобиана, где её определитель обращается в нуль"], "correct": 1, "explain": "Кинетическая энергия ½q̇ᵗMq̇ положительна при любой ненулевой скорости, поэтому M симметрична и положительно определена во всех конфигурациях; внедиагональные элементы это как раз инерционная связь между сочленениями, а зависимость от q отражает изменение геометрии. Самый коварный дистрактор связывает M с сингулярностями якобиана: это разные объекты, det M нигде не обращается в нуль, а в сингулярной позе теряет ранг именно J. Диагональной M бывает лишь в исключительных компоновках. Лекция 4.", "usage": {"code": false, "without": "Выведенная M оказывается несимметричной, ошибку списывают на громоздкость выкладок, и динамическая модель уходит в отчёт неверной.", "with": "Проверка симметрии и положительной определённости в десяти случайных конфигурациях ловит пропущенный член сразу после вывода.", "benefit": "Ошибка вывода M отлавливается двумя дешёвыми проверками."}}, {"q": "Траектория укладывается в пределы по скорости и по моменту, но хрупкий груз раскачивается на старте и стопе. Что меняют?", "options": ["Увеличивают время движения вдвое: других способов снизить рывок у кубического профиля нет", "Поднимают предел момента привода, тогда рывок перестаёт влиять на груз", "Переходят с кубического профиля на квинтический, чтобы ускорение на концах стало нулевым", "Переходят с кубического профиля на LSPB, чтобы ускорение на концах стало нулевым"], "correct": 2, "explain": "У кубического профиля ускорение на концах скачком отличается от нуля, то есть рывок там формально бесконечен, и раскачивание груза — прямое следствие. Квинтический профиль добавляет условия на ускорение и снимает скачок. LSPB эту проблему не решает, а переносит: у него скачки ускорения стоят на границах участков сопряжения, поэтому замена кубического на LSPB ради нулевого ускорения на концах — именно та правдоподобная подмена, которую надо отбраковать. Увеличение времени уменьшает величину скачка, но не убирает его. Q7c пробного экзамена.", "usage": {"code": false, "without": "Груз на хрупком захвате раскачивается, и время цикла увеличивают вдвое, теряя такт и не убирая скачок ускорения.", "with": "Квинтический профиль с нулевым ускорением на концах снимает раскачивание при росте времени всего на 0,3 с.", "benefit": "Такт сохраняется, а груз перестаёт раскачиваться."}}, {"q": "Линия требует минимального времени такта при фиксированном пределе скорости привода. Какой профиль даёт лучший такт?", "options": ["LSPB: участок постоянной скорости держит привод у предела почти всё время движения", "Любой из трёх: при одном и том же пределе скорости минимальное время определяется только путём", "Кубический: у него самая низкая пиковая скорость при заданном времени движения", "Квинтический: его пиковая скорость выше, значит при том же пределе он в среднем быстрее"], "correct": 0, "explain": "При ограничении V_max минимальное время равно пути, пройденному на пределе, плюс потери на разгон и торможение: LSPB держит скорость на пределе весь крейсерский участок, кубическому нужно t_f = 1,5Δθ/V_max, квинтическому 1,875Δθ/V_max. Дистрактор про квинтический профиль переворачивает логику: более высокий пик при заданном времени означает, что предел достигается раньше и времени требуется больше, а не меньше. Кубический действительно мягче квинтического, но проигрывает LSPB. Лекция 5.", "usage": {"code": false, "without": "Линию такт-тайм считают по кубическому профилю, привод большую часть движения работает вполсилы, и такт выходит на 25% длиннее возможного.", "with": "LSPB с крейсерской скоростью на пределе привода сокращает такт при том же оборудовании.", "benefit": "Паспортная скорость привода используется, а не остаётся в запасе."}}, {"q": "Как проверяют каждую ветвь решения IK перед тем, как включить её в отчёт?", "options": ["Проверяют, что найденные углы лежат в пределах сочленений и не вызывают столкновений", "Считают det J в найденной конфигурации: ненулевой определитель подтверждает корректность ветви", "Подставляют найденные углы обратно в FK и сравнивают полученную позу с заданной, остаток ниже 1e-6", "Сравнивают углы ветви с углами, которые выдаёт toolbox, расхождение ниже 1e-6 радиан"], "correct": 2, "explain": "Круговая проверка FK от IK это единственный тест, который не зависит от того, какую из ветвей вы выбрали: если поза воспроизводится, ветвь корректна. Сравнение углов с toolbox выглядит строже, но ломается именно здесь: решатель вправе вернуть другую, тоже верную ветвь, и ненулевая разница углов не будет ошибкой. Пределы сочленений и столкновения проверять нужно, но это про применимость ветви, а не про её верность. Этап 3 проекта.", "usage": {"code": false, "without": "Углы сравнивают с toolbox, тот возвращает конфигурацию elbow-down вместо elbow-up, и верное решение объявляют ошибочным.", "with": "Круговая подстановка даёт остаток 4e-8 по позе для всех восьми ветвей, и дальше ветви отбираются по пределам сочленений.", "benefit": "Верность решения и его применимость проверяются раздельно."}}, {"q": "На защите просят оценить, где идеализированная модель манипулятора разойдётся с реальным роботом. Какой ответ соответствует верхней полосе рубрики?", "options": ["Сказать, что остатки валидации ниже допуска, значит с реальным роботом модель расходиться не будет", "Сослаться на то, что инерционные параметры взяты из URDF производителя и потому достоверны", "Признать модель идеализированной и отказаться от количественных утверждений о реальном роботе", "Назвать жёсткие звенья, отсутствие трения и зазора и указать, какой именно остаток в таблице это объясняет"], "correct": 3, "explain": "Рубрика требует связки: назвать допущение и показать, в каком измеренном числе оно проявляется, например объяснить шестипроцентный остаток по моменту неучтённым трением в редукторе. Последний вариант выглядит академично осторожным и именно поэтому слабый: полный отказ от количественных утверждений снимает с модели всякую инженерную ценность, а панель оценивает не скромность, а разбор. Ссылка на URDF подменяет аргумент источником. Модуль 6 и LO7.", "usage": {"code": false, "without": "Вопрос о расхождении с реальным роботом закрывают фразой, что остатки в допуске, и теряют баллы за критическую интерпретацию.", "with": "Инженер называет три допущения и привязывает к каждому строку таблицы остатков, включая 6% по гравитационному моменту.", "benefit": "Ограничения модели защищаются числами из собственной таблицы."}}, {"q": "Остаток по гравитационному моменту упорно держится на 6% и не падает ниже допуска в 1%. Как с этим поступают по требованиям проекта?", "options": ["Диагностируют причину, например массу или положение центра масс звена, и описывают найденное в отчёте", "Исключают гравитационную проверку из таблицы, оставив FK, IK и якобиан", "Повышают допуск в таблице валидации до 10%, чтобы проверка формально прошла", "Оставляют расхождение без комментария: 6% укладываются в типичную точность динамических моделей"], "correct": 0, "explain": "Остаток, который отказывается уменьшаться, по правилам проекта считается находкой, а не провалом: его нужно локализовать и описать, и корректно разобранное расхождение оценивается выше подозрительно идеальной таблицы без проверок. Самый соблазнительный вариант — сослаться на типичную точность динамических моделей: цифра звучит правдоподобно, но она не выведена из вашей модели, а взята из воздуха, и именно такие ссылки панель вскрывает первым вопросом. Подгонка допуска это прямое ослабление проверки. Этап 7 проекта.", "usage": {"code": false, "without": "Шестипроцентный остаток закрывают расширением допуска, и на защите выясняется, что в модели занижена масса второго звена.", "with": "Остаток локализован до центра масс второго звена, причина описана, и раздел валидации оценивается выше.", "benefit": "Расхождение превращается в результат вместо дефекта."}}, {"q": "Какая независимая проверка динамической модели не требует второго инструмента и опирается только на физику?", "options": ["Свободное падение звена без моментов: полная энергия в симуляции должна дрейфовать менее 1%", "Повторный символьный вывод M, C и g в другой системе компьютерной алгебры", "Сравнение моментов с gravload из toolbox при нулевых скоростях и ускорениях", "Прогон траектории с пределами привода и проверка, что моменты не превышают предел ни в одной точке участка"], "correct": 0, "explain": "Закон сохранения энергии внутренний для модели: если отпустить звено без внешних моментов, сумма кинетической и потенциальной энергии обязана оставаться постоянной, и дрейф выше процента означает ошибку в M или g либо слишком грубый интегратор. Сравнение с gravload тоже корректная проверка, но она требует ровно того второго инструмента, который вопрос исключает, и это главная ловушка. Проверка пределов привода вообще проверяет траекторию, а не модель. Таблица валидации проекта.", "usage": {"code": false, "without": "Toolbox для сверки недоступен, и динамическую модель отправляют в отчёт без единой независимой проверки.", "with": "Прогон свободного падения даёт дрейф энергии 0,4%, и модель признаётся пригодной до появления второго инструмента.", "benefit": "Динамика проверяется без внешних зависимостей."}}, {"q": "Планарный манипулятор 2R, L₁ = 0,5 м, L₂ = 0,4 м, θ₁ = 30°, θ₂ = 60°. Найдите положение инструмента и его ориентацию φ.", "options": ["x = 0,650 м, y = 0,433 м, φ = 90°", "x = 0,633 м, y = 0,596 м, φ = 90°", "x = 0,433 м, y = 0,650 м, φ = 60°", "x = 0,433 м, y = 0,650 м, φ = 90°"], "correct": 3, "explain": "Шаг 1: FK плоского 2R это x = L₁cosθ₁ + L₂cos(θ₁+θ₂), y = L₁sinθ₁ + L₂sin(θ₁+θ₂), φ = θ₁ + θ₂. Шаг 2: θ₁+θ₂ = 90°, поэтому cos90° = 0 и sin90° = 1. Шаг 3: x = 0,5·0,866 + 0,4·0 = 0,433 м, y = 0,5·0,5 + 0,4·1 = 0,650 м, φ = 90°. Главная ошибка это вариант 0,633 и 0,596: он получается, если во втором слагаемом взять cosθ₂ и sinθ₂ вместо суммы углов, то есть забыть, что второе сочленение отсчитывается от первого звена, а не от базы. Вариант с φ = 60° берёт за ориентацию только θ₂. Q3 пробного экзамена.", "usage": {"code": false, "without": "Угол второго сочленения подставлен от базы, захват приходит в точку 0,633 и 0,596 и промахивается по детали на 20 см.", "with": "Сумма углов учтена, расчётная точка 0,433 и 0,650 совпадает с fkine, и захват садится на деталь.", "benefit": "Промах в двадцать сантиметров исключается арифметикой на бумаге."}}, {"q": "Тот же манипулятор 2R с L₁ = 0,5 м и L₂ = 0,4 м. Цель x = 0,6 м, y = 0,3 м. Сколько решений IK и чему равен |θ₂|?", "options": ["Два решения, |θ₂| = 5,7°", "Четыре решения, |θ₂| = 84,3°", "Одно решение, |θ₂| = 84,3°", "Два решения, |θ₂| = 84,3°"], "correct": 3, "explain": "Шаг 1: r² = 0,6² + 0,3² = 0,45, значит r = 0,671 м, и условие достижимости |L₁−L₂| = 0,1 ≤ r ≤ L₁+L₂ = 0,9 выполнено. Шаг 2: cosθ₂ = (r² − L₁² − L₂²)/(2L₁L₂) = (0,45 − 0,25 − 0,16)/0,4 = 0,1. Шаг 3: θ₂ = ±arccos0,1 = ±84,3°, то есть две ветви, elbow-up и elbow-down. Дистрактор 5,7° получается у того, кто берёт arcsin вместо arccos; вариант с одним решением теряет знак ±, а четыре решения это кратность шестиосевого манипулятора со сферической кистью, а не плоского 2R. Q4 пробного экзамена.", "usage": {"code": false, "without": "Знак ± потерян, планировщик всегда берёт elbow-down, и локоть упирается в оснастку на половине поз.", "with": "Обе ветви вычислены, выбрана elbow-up, и локоть проходит выше оснастки.", "benefit": "Выбор ветви становится решением инженера, а не случайностью решателя."}}, {"q": "Для манипулятора 2R с L₁ = 0,5 м и L₂ = 0,4 м det J = L₁L₂sinθ₂. Сравните θ₂ = 60° и θ₂ = 5°: во сколько раз вырастут скорости сочленений, нужные для одной и той же декартовой скорости?", "options": ["Примерно в 12 раз: определитель падает с 0,200 до 0,017", "Примерно в 10 раз: определитель падает с 0,173 до 0,017", "Примерно в 3 раза: скорости растут как корень из отношения определителей", "Скорости не изменятся: det J влияет только на статические моменты, а не на скорости"], "correct": 1, "explain": "Шаг 1: det J при θ₂ = 60° равен 0,5·0,4·sin60° = 0,2·0,866 = 0,173. Шаг 2: при θ₂ = 5° это 0,2·0,0872 = 0,0174. Шаг 3: обратный якобиан содержит делитель det J, поэтому требуемые скорости сочленений растут обратно пропорционально ему: 0,173/0,0174 ≈ 10. Дистрактор с 12 получается, если при 60° забыть синус и взять просто L₁L₂ = 0,2. Утверждение, что det J касается только статики, путает роли: транспонированный якобиан работает в статике всегда, а расходится именно обратный. Q5b пробного экзамена.", "usage": {"code": false, "without": "Траекторию ведут через почти вытянутую конфигурацию, и привод уходит в ограничение по скорости на ровном с виду участке.", "with": "Десятикратный рост скоростей посчитан заранее, и путь обходит зону θ₂ меньше 15°.", "benefit": "Ограничение по скорости не срабатывает в середине цикла."}}, {"q": "Манипулятор 2R, L₁ = 0,5 м, L₂ = 0,4 м, θ₁ = 30°, θ₂ = 60°. Инструмент удерживает силу 10 Н вдоль оси +x. Чему равны моменты сочленений по модулю?", "options": ["|τ₁| = 4,3 Н·м, |τ₂| = 0 Н·м", "|τ₁| = 2,5 Н·м, |τ₂| = 4,0 Н·м", "|τ₁| = 6,5 Н·м, |τ₂| = 4,0 Н·м", "|τ₁| = 6,5 Н·м, |τ₂| = 4,3 Н·м"], "correct": 2, "explain": "Шаг 1: первая строка якобиана это J₁₁ = −L₁sinθ₁ − L₂sin(θ₁+θ₂) = −0,25 − 0,4 = −0,65 и J₁₂ = −L₂sin(θ₁+θ₂) = −0,4. Шаг 2: τ = Jᵗ F с F = [10, 0]ᵗ, то есть берётся первый столбец транспонированной матрицы, он же первая строка J. Шаг 3: τ₁ = −0,65·10 = −6,5 Н·м, τ₂ = −0,4·10 = −4,0 Н·м, по модулю 6,5 и 4,0. Дистрактор 6,5 и 4,3 получается при умножении на J вместо Jᵗ: туда попадает элемент второй строки J₂₁ = 0,433. Вариант 4,3 и 0 выходит у того, кто подставил косинусы вместо синусов. Q5c пробного экзамена.", "usage": {"code": false, "without": "Моменты удержания посчитаны через J вместо Jᵗ, второе сочленение подобрано по 4,3 Н·м и уходит в насыщение под нагрузкой.", "with": "Правильная подстановка даёт 6,5 и 4,0 Н·м, и приводы выбираются с запасом от верных цифр.", "benefit": "Привод выбирается по верному моменту удержания."}}, {"q": "Однозвенный манипулятор: точечная масса m = 2 кг на длине L = 0,4 м, звено горизонтально, требуется угловое ускорение 3 рад/с². Уравнение движения mL²θ̈ + mgL cosθ = τ, g = 9,81 м/с². Какой момент нужен приводу?", "options": ["τ = 0,96 Н·м", "τ = 8,81 Н·м", "τ = 7,85 Н·м", "τ = 10,25 Н·м"], "correct": 1, "explain": "Шаг 1: момент инерции mL² = 2·0,16 = 0,32 кг·м², инерционный член 0,32·3 = 0,96 Н·м. Шаг 2: звено горизонтально, cos0 = 1, гравитационный член mgL = 2·9,81·0,4 = 7,85 Н·м. Шаг 3: τ = 0,96 + 7,85 = 8,81 Н·м. Дистрактор 7,85 это самый частый ответ: он учитывает только удержание и забывает, что звено надо ещё и разогнать. Вариант 10,25 получается при подстановке mL вместо mL² в инерционный член. Q6a пробного экзамена.", "usage": {"code": false, "without": "Привод выбирают по моменту удержания 7,85 Н·м, и на разгоне он упирается в предел, не выдавая заданное ускорение.", "with": "Полный момент 8,81 Н·м посчитан до закупки, и привод выбран с запасом над суммой обоих членов.", "benefit": "Привод разгоняет звено, а не только держит его."}}, {"q": "То же звено с m = 2 кг и L = 0,4 м отпускают без момента из горизонтального положения. Какую угловую скорость в нижней точке даёт проверка по сохранению энергии? g = 9,81 м/с².", "options": ["ω = 2,80 рад/с", "ω = 7,00 рад/с", "ω = 49,05 рад/с", "ω = 4,95 рад/с"], "correct": 1, "explain": "Шаг 1: потенциальная энергия mgL переходит в кинетическую ½mL²ω², масса сокращается. Шаг 2: отсюда ω = √(2g/L) = √(2·9,81/0,4) = √49,05. Шаг 3: ω = 7,00 рад/с, и именно эту цифру должна воспроизвести симуляция с дрейфом энергии ниже 1%. Дистрактор 2,80 это линейная скорость √(2gL) = 2,80 м/с, выданная за угловую — самая частая подмена; 4,95 получается при потере двойки под корнем, 49,05 при забытом корне. Таблица валидации проекта.", "usage": {"code": false, "without": "Симуляция свободного падения даёт в нижней точке 6,2 рад/с, расхождение списывают на интегратор и идут дальше.", "with": "Аналитические 7,00 рад/с посчитаны заранее, расхождение в 11% признано ошибкой модели и локализовано в члене g.", "benefit": "Проверка по энергии ловит ошибку динамики без второго инструмента."}}, {"q": "Сустав идёт из 0° в 90° за 2 с, покой на обоих концах, профиль кубический. Предел скорости привода 50 °/с. Выполнима ли траектория и каково минимальное время движения?", "options": ["Нет: пик 67,5 °/с, минимальное время 2,7 с", "Нет: пик 67,5 °/с, минимальное время 1,8 с", "Да: пик 45 °/с, запас до предела около 10%", "Нет: пик 135 °/с, минимальное время 5,4 с"], "correct": 0, "explain": "Шаг 1: у кубического профиля из покоя в покой пик скорости достигается в середине и равен 3Δθ/(2t_f) = 3·90/(2·2) = 67,5 °/с. Шаг 2: 67,5 больше 50, значит траектория невыполнима. Шаг 3: из 3Δθ/(2t_f) ≤ 50 следует t_f ≥ 3·90/(2·50) = 2,7 с. Самый опасный дистрактор это 45 °/с: столько даёт Δθ/t_f, то есть средняя скорость, и с ней траектория кажется выполнимой с запасом, хотя привод срывается на середине. Ответ 1,8 с получается из того же среднего Δθ/V_max. Q7a и Q7b пробного экзамена.", "usage": {"code": false, "without": "Выполнимость проверяют по средней скорости 45 °/с, и привод уходит в ограничение ровно в середине каждого хода.", "with": "Пик 67,5 °/с посчитан, время увеличено до 2,7 с, и привод остаётся в пределах паспорта.", "benefit": "Такт назначается по пиковой, а не по средней скорости."}}, {"q": "Перемещение 60° за 1,5 с, покой на концах. Пик скорости кубического профиля 3Δθ/(2t_f), квинтического 15Δθ/(8t_f). Предел привода 70 °/с. Какой профиль проходит?", "options": ["Оба не проходят: кубический 90 °/с, квинтический 75 °/с", "Оба проходят: кубический 60 °/с, квинтический 56 °/с", "Проходят оба: предел относится к декартовой скорости, а не к скорости сустава", "Кубический проходит с 60 °/с, квинтический даёт 75 °/с и не проходит"], "correct": 3, "explain": "Шаг 1: кубический пик 3·60/(2·1,5) = 180/3 = 60 °/с, это ниже 70. Шаг 2: квинтический пик 15·60/(8·1,5) = 900/12 = 75 °/с, это выше 70. Шаг 3: проходит только кубический, а плавность квинтического профиля стоит здесь 25% прироста пиковой скорости. Дистрактор с 56 °/с у квинтического переворачивает сравнение: интуиция подсказывает, что более плавный профиль медленнее, а он именно быстрее в пике. Вариант 90 °/с получается при потере двойки в знаменателе кубической формулы. Лекция 5.", "usage": {"code": false, "without": "Ради плавности груза профиль меняют на квинтический, и привод срывается по скорости на том же перемещении.", "with": "Оба пика посчитаны до смены профиля, и переход на квинтический сопровождается ростом времени до 1,65 с.", "benefit": "Смена профиля не ломает пределы привода."}}, {"q": "LSPB для перемещения 90° за 3 с с крейсерской скоростью 40 °/с. Чему равны время разгона и ускорение на участке разгона?", "options": ["t_b = 1,5 с, ускорение 26,7 °/с²", "t_b = 0,75 с, ускорение 53,3 °/с²", "t_b = 0,75 с, ускорение 40 °/с²", "t_b = 0,375 с, ускорение 106,7 °/с²"], "correct": 1, "explain": "Шаг 1: допустимость скорости проверяется неравенством Δθ/t_f < V < 2Δθ/t_f, то есть 30 < 40 < 60 °/с, и V = 40 годится. Шаг 2: время разгона t_b = (V·t_f − Δθ)/V = (40·3 − 90)/40 = 30/40 = 0,75 с. Шаг 3: на участке разгона ускорение постоянно и равно V/t_b = 40/0,75 = 53,3 °/с². Дистрактор 1,5 с и 26,7 °/с² предполагает t_b = t_f/2, то есть профиль без крейсерского участка — это треугольный профиль, а не LSPB; 40 °/с² получается при неявной подстановке t_b = 1 с. Лекция 5.", "usage": {"code": false, "without": "Время разгона берут как половину хода, расчётное ускорение выходит 26,7 °/с², и привод не успевает выйти на крейсерскую скорость.", "with": "t_b = 0,75 с и a = 53,3 °/с² согласованы с профилем, и измеренная запись скорости совпадает с расчётом.", "benefit": "Профиль, рассчитанный на бумаге, воспроизводится приводом."}}, {"q": "Таблица валидации: во всех пяти тестовых конфигурациях ориентация FK совпадает с toolbox до 1e-9 рад, а положение расходится ровно на 0,082 м по оси z инструмента. Какой диагноз следует из этих чисел?", "options": ["Перепутаны standard и modified DH: фрейм звена стоит не на том конце", "Пропущено преобразование инструмента: постоянный сдвиг 0,082 м по его оси z", "Накопился численный дрейф матриц поворота, нужна ре-ортонормализация через SVD", "Углы заданы в градусах вместо радиан в последней строке таблицы DH"], "correct": 1, "explain": "Шаг 1: ориентация совпадает до 1e-9 во всех конфигурациях, значит все повороты и углы скрутки заданы верно. Шаг 2: остаток по положению не меняется с конфигурацией, значит это не кинематическая ошибка, а постоянный сдвиг. Шаг 3: сдвиг направлен по оси z инструмента и равен вылету TCP, то есть в цепочку не включено преобразование инструмента. Перепутанная конвенция DH, самый популярный ответ на такой симптом, дала бы остаток, меняющийся от конфигурации к конфигурации, и испортила бы ориентацию; градусы вместо радиан и дрейф поворотов проявились бы прежде всего в ориентации. Этап 7 проекта.", "usage": {"code": false, "without": "Постоянный остаток 0,082 м объясняют перепутанной конвенцией DH и неделю переписывают верную таблицу.", "with": "Постоянство остатка и чистая ориентация сразу указывают на пропущенный фрейм инструмента, и остаток уходит в 1e-9.", "benefit": "Диагноз следует из структуры остатков, а не из перебора гипотез."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    const now = Date.now();
    state.updatedAt = now;   // по нему синхронизация решает, какая копия свежее
    if (!state.doneAt && LTProgress.isDone(state)) state.doneAt = now;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Для «Продолжить» на главной — только обычный проход: повторение пройденного
    // теста не «продолжение». Не "learntest_": такие ключи sync.js шлёт в Drive.
    if (!drill) {
      try { localStorage.setItem("ltindex_last", JSON.stringify({ slug: TEST_ID, at: now })); } catch (e) {}
    }
    scheduleUpload();
  }

  // Тихая отправка в Drive через несколько секунд после ответа — только пока
  // Google-токен жив (его выдаёт любая синхронизация по кнопке, ~на час).
  let uploadTimer = null;
  function scheduleUpload() {
    if (!window.LTSync || !LTSync.hasToken()) return;
    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);
  }
  function flushUpload() {
    if (uploadTimer === null) return;
    clearTimeout(uploadTimer);
    uploadTimer = null;
    LTSync.uploadOne(STORAGE_KEY);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushUpload();
  });

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let SHUFFLED = buildShuffledQuestions();
