<style>

  .modal-overlay {

  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }

 без колебаний — это классическое апериодическое звено первого порядка, аналог инерционной задержки привода. Колебательное звено имеет пару комплексных полюсов и знаменатель второй степени, чего здесь нет. Ogata, гл. 4-5.", "usage": {"code": false, "without": "Без умения различать типы звеньев инженер путает инерционную задержку привода с резонансным звеном и неверно предсказывает форму переходного процесса.", "with": "Опознав апериодическое звено первого порядка, инженер сразу знает постоянную времени и время установления \\(4T\\) для настройки контура.", "benefit": "Быстрая и верная оценка динамики звена по виду передаточной функции."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/21.svg", "alt": "Ось робота: двигатель с валом и передаточная функция звена K/(Ts+1) между напряжением u и углом"}}, {"q": "При подаче единичного скачка на вход звена его выход растёт линейно и неограниченно во времени, не выходя на постоянный уровень. Какому типу звена соответствует такой переходный процесс?", "options": ["Форсирующее звено", "Интегрирующее звено", "Апериодическое звено", "Колебательное звено"], "correct": 1, "explain": "Интеграл единичного скачка — это линейно растущая рампа: выход звена \\(1/s\\) не стабилизируется, а нарастает пропорционально времени, что и наблюдается в описанном отклике. Апериодическое и колебательное звенья выходят на установившееся значение, форсирующее звено даёт скачок в начальный момент и далее следует за входом. labT2-lab.txt, Step 3.", "usage": {"code": false, "without": "Не распознав интегрирующее звено, инженер ждёт, что выход стабилизируется, и пропускает нарастающую ошибку позиционирования.", "with": "Опознав интегрирующее звено по неограниченно растущей реакции на скачок, инженер сразу учитывает, что канал астатический и не будет иметь установившейся ошибки по положению.", "benefit": "Верный прогноз, выйдет ли переходный процесс на постоянный уровень."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/22 нных полюсах, то есть при 0 меньше \\(\\zeta\\) меньше 1 — это недодемпфированный отклик. При \\(\\zeta\\) больше либо равном единице полюса вещественные и колебаний с перерегулированием не бывает, а при \\(\\zeta\\) равном нулю колебания вообще не затухают. Ogata, гл. 5; Nise, гл. 4.", "usage": {"code": false, "without": "Не связав вид переходного процесса с диапазоном \\(\\zeta\\), инженер не может предсказать перерегулирование по параметрам звена и наоборот.", "with": "Увидев затухающие колебания вокруг установившегося значения, инженер сразу знает, что 0 меньше \\(\\zeta\\) меньше 1, и может оценить перерегулирование по формуле.", "benefit": "Быстрая оценка диапазона \\(\\zeta\\) по форме кривой без решения характеристического уравнения."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/24.svg", "alt": "Переходная характеристика звена второго порядка: выход проскакивает установившееся значение и колеблется вокруг него"}}, {"q": "Два звена второго порядка с одинаковой собственной частотой \\(\\omega_n\\) испытаны единичным скачком. У звена А перерегулирование составляет 60%, у звена Б — 10%. У какого из звеньев коэффициент затухания \\(\\zeta\\) меньше?", "options": ["У звена Б \\(\\zeta\\) меньше", "У сравнения нет смысла", "У обоих звеньев \\(\\zeta\\) равны", "У звена А \\(\\zeta\\) меньше"], "correct": 3, "explain": "Чем меньше \\(\\zeta\\), тем больше перерегулирование по формуле \\(M_p = e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\) умножить на 100%. Перерегулирование 60% соответствует существенно меньшему \\(\\zeta\\), чем 10%, поэтому у звена А коэффициент затухания меньше. labT2-lab.txt, формула перерегулирования.", "usage": {"code": false, "without": "Не зная обратной зависимости перерегулирования от \\(\\zeta\\), инженер не может ранжировать несколько кандидатных настроек привода по демпфированию.", "with": "Сравнив перерегулирования 60% и 10%, инженер сразу ранжирует звенья по \\(\\zeta\\) без пересчёта полюсов.", "benefit": "Быстрое сравнение люсов оправдано, когда остальные полюса расположены минимум в 5-10 раз дальше от мнимой оси, чем доминирующая пара: их вклад в переходный процесс затухает настолько быстрее, что становится пренебрежимо мал уже к моменту, когда доминирующая пара только начинает определять форму отклика. Полюс в минус 3 слишком близок к паре с вещественной частью минус 2 и исказит время установления и перерегулирование. Ogata, гл. 5; Nise, гл. 4.", "usage": {"code": false, "without": "Без правила про доминирующие полюса инженер либо всегда решает полное уравнение высокого порядка, либо ошибочно упрощает контур с близким третьим полюсом.", "with": "Проверив, что дополнительный полюс в минус 20 в десять раз дальше доминирующей пары, инженер уверенно применяет формулы \\(\\zeta\\) и \\(\\omega_n\\) второго порядка ко всей оси.", "benefit": "Обоснованное решение, когда упрощение до второго порядка не искажает переходный процесс."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/27.svg", "alt": "Плоскость корней: пара комплексных полюсов с вещественной частью −2 и скользящий вопросительный полюс на вещественной оси"}}, {"q": "Ось робота состоит из электродвигателя с передаточной функцией \\(W_1(s)\\), редуктора с постоянным коэффициентом передачи \\(W_2\\) и датчика с передаточной функцией \\(W_3(s)\\), включённых последовательно друг за другом без обратной связи. Как получить передаточную функцию всей оси?", "options": ["Перемножить передаточные функции", "Усреднить передаточные функции", "Сложить передаточные функции", "Проинтегрировать передаточные функции"], "correct": 0, "explain": "Для звеньев, включённых последовательно друг за другом, эквивалентная передаточная функция равна произведению передаточных функций отдельных звеньев: сигнал проходит через \\(W_1\\), затем через \\(W_2\\), затем через \\(W_3\\), и на выходе получается их произведение. Сложение соответствует параллельному соединению, а не последовательной цепочке. session-01.txt, структурные схемы.", "usage": {"code": false, "without": "Не зная правила для последовательного соединения, инженер собирает модель оси сложением звеньев и получает передаточную функцию с неверной размерностью и порядком.", "with": "Зная, что последовательные звенья перемножаются, инженер за один шаг получает передаточную функцию всей оси из паспортных данных двигателя, редуктора и датчика.", "benefit": "Правильная сборка модели многозвенной оси робота из готовых передаточных функций."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/28.svg", "alt": "Последовательная цепочка двигатель, редуктор, датчик с передаточными функциями W1, W2, W3 и неизвестной общей W"}}, {"q": "Вокруг разомкнутой цепи двигатель-редуктор с передаточной функцией \\(G(s)\\) замыкают отрицательную обратную связь через датчик с коэффициентом передачи \\(H\\). Какая передаточная функция получится у замкнутого контура оси от задания до выхода?", "options": ["\\(G\\) умножить на \\(H\\) делить на 1 плюс \\(G\\)", "1 делить на 1 плюс \\(G\\) умножить на \\(H\\)", "\\(H\\) делить на 1 плюс \\(G\\) умножить на \\(H\\)", "\\(G\\) делить на 1 плюс \\(G\\) умножить на \\(H\\)"], "correct": 3, "explain": "Классическая формула замкнутого контура с отрицательной обратной связью — это передаточная функция прямого канала, делённая на единицу плюс произведение передаточных функций прямого канала и цепи обратной связи, то есть \\(\\frac{G}{1+GH}\\). Числитель \\(H\\) вместо \\(G\\) или деление на 1 плюс \\(G\\) без учёта датчика дают неверную размерность. session-01.txt, формула замкнутой системы \\(\\frac{G}{1+GH}\\).", "usage": {"code": false, "without": "Без формулы замкнутого контура инженер не может пересчитать, как коэффициент передачи датчика в цепи обратной связи меняет реакцию оси на задание.", "with": "Подставив \\(G\\) и \\(H\\) в формулу \\(\\frac{G}{1+GH}\\), инженер сразу получает передаточную функцию всей оси с обратной связью по энкодеру.", "benefit": "Верный расчёт замкнутого контура оси при добавлении датчика в цепь обратной связи."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/29.svg", "alt": "Контур с отрицательной обратной связью: прямая цепь G, датчик H в обратной связи, вход r и выход y"}}, {"q": "На логарифмической амплитудной частотной характеристике разомкнутого контура низкочастотный участок идёт на уровне 20 дБ, а затем плавно спадает. На какой частоте следует читать полосу пропускания контура по этому графику?", "options": ["На частоте резонансного пика ЛАЧХ", "На частоте, где уровень падает на 3 дБ", "На частоте, где фаза минус 180 градусов", "На частоте, где ЛАЧХ пересекает 0 дБ"], "correct": 1, "explain": "Полоса пропускания по определению — это диапазон частот от нуля до частоты, на которой амплитудная характеристика опускается на 3 дБ ниже своего низкочастотного значения, здесь это уровень 20 минус 3 равно 17 дБ. Частота среза по 0 дБ и частота, где фаза равна минус 180 градусов, относятся к запасам устойчивости, а резонансный пик — это отдельная точка выброса ЛАЧХ, а не граница полосы. labT2-lab.txt, резонансный пик и полоса пропускания.", "usage": {"code": false, "without": "Спутав частоту среза по 0 дБ с полосой пропускания, инженер завышает быстродействие контура, которое реально ограничено уровнем минус 3 дБ.", "with": "Найдя на ЛАЧХ точку минус 3 дБ от низкочастотного уровня, инженер верно оценивает, до какой частоты контур успевает отрабатывать задание.", "benefit": "Точное чтение полосы пропускания с графика Боде вместо приблизительной оценки на глаз."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/30.svg", "alt": "Схема ЛАЧХ разомкнутого контура: плато на 20 дБ, затем плавный спад; линии 0 и 20 дБ"}}, {"q": "Сустав манипулятора с упругой муфтой после ступенчатого воздействия перерегулирует и несколько раз колеблется перед установившимся значением. Какое типовое звено лучше всего описывает такую динамику?", "options": ["Колебательное звено второго порядка с коэффициентом демпфирования меньше единицы", "Интегрирующее звено с накоплением угла поворота вала во времени", "Форсирующее звено с усилением высокочастотных составляющих сигнала", "Апериодическое звено первого порядка с малой постоянной времени"], "correct": 0, "explain": "Затухающие колебания вокруг установившегося значения с перерегулированием - фирменный признак колебательного звена второго порядка при \\(\\zeta\\) меньше единицы; апериодическое, интегрирующее и форсирующее звенья такого затухающего колебательного процесса не дают (Ogata, гл. 5).", "usage": {"code": false, "without": "Инженер спишет колебания сустава на шум датчика и займётся фильтрацией сигнала вместо работы с механикой или регулятором.", "with": "Распознав колебательное звено второго порядка, инженер сразу переходит к анализу \\(\\zeta\\) и \\(\\omega_n\\) - демпфирования и жёсткости передачи.", "benefit": "Верная классификация звена экономит недели поиска ложной причины колебаний."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/31.svg", "alt": "Двигатель, упругая муфта и звено руки; справа график колебательного отклика сустава на ступеньку"}}, {"q": "Диагностика подтвердила, что сустав ведёт себя как колебательное звено второго порядка с \\(\\zeta\\) примерно 0.2, из-за чего перерегулирование превышает 50%. Какое изменение конструкции или регулятора снижает колебательность быстрее всего?", "options": ["Увеличение коэффициента усиления пропорционального регулятора", "Уменьшение разрешения энкодера обратной связи", "Добавление чистого запаздывания перед приводом", "Увеличение эффективного демпфирования в контуре сустава"], "correct": 3, "explain": "Перерегулирование колебательного звена определяется величиной \\(\\zeta\\): рост эффективного демпфирования увеличивает \\(\\zeta\\) и подавляет колебания, тогда как рост усиления P обычно снижает \\(\\zeta\\), а запаздывание и грубый энкодер только ухудшают переходный процесс (Nise, гл. 8).", "usage": {"code": false, "without": "Команда поднимает коэффициент усиления регулятора, надеясь на быстродействие, и получает ещё более сильные колебания сустава.", "with": "Понимая роль \\(\\zeta\\), инженер добавляет демпфирование в передачу или в закон управления и получает предсказуемо более гладкий отклик.", "benefit": "Работа с демпфированием, а не с усилением, устраняет колебания без побочных эффектов."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/32.svg", "alt": "Отклик сустава на скачок с выбросом выше 50 % и подпись ζ ≈ 0.2"}}, {"q": "При уточнении модели сустава инженер добавляет к жёсткой передаточной функции ещё одно звено, учитывающее упругость зубьев редуктора и малый люфт между валом двигателя и нагрузкой. Каким типовым звеном обычно моделируют эту гибкость?", "options": ["Дополнительным пропорциональным звеном с единичным коэффициентом", "Дополнительным колебательным звеном второго порядка", "Дополнительным чистым запаздыванием без изменения фазы", "Дополнительным интегрирующим звеном разомкнутого контура"], "correct": 1, "explain": "Упругость передачи между двумя массами - двигателем и нагрузкой - классически описывается вторым дополнительным колебательным звеном со своей резонансной частотой; чистое запаздывание, интегратор и единичное усиление этой физики не отражают (Siciliano, Robotics, разд. о гибких передачах).", "usage": {"code": false, "without": "Модель считает редуктор абсолютно жёстким, и симуляция не предсказывает реальную вибрацию сустава на роботе.", "with": "Добавив второе колебательное звено гибкости, инженер заранее видит резонанс в модели и закладывает его в проектирование регулятора.", "benefit": "Учёт гибкости редуктора на этапе моделирования предотвращает вибрации уже на реальном роботе."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/33.svg", "alt": "Двигатель, зубчатый редуктор с зацеплением двух шестерён и нагрузка; подписаны упругость зубьев и люфт"}}, {"q": "После включения в контур дополнительного колебательного звена гибкости редуктора запас по фазе разомкнутой системы заметно уменьшился на частотах вблизи новой резонансной частоты. Чем это объясняется?", "options": ["Резонансный пик уменьшает общий коэффициент усиления разомкнутого контура", "Резонансный пик устраняет полюс в начале координат разомкнутого контура", "Резонансный пик добавляет быстрый набор фазового отставания около своей частоты", "Резонансный пик снижает порядок астатизма исходной системы"], "correct": 2, "explain": "Вблизи резонансной частоты колебательное звено быстро набирает до минус 180 градусов фазового отставания, что и срезает запас по фазе; оно не меняет усиление на постоянном токе, не убирает интегрирующий полюс и не меняет порядок астатизма (Franklin, Powell, Emami-Naeini, гл. 6).", "usage": {"code": false, "without": "Запас по фазе считают только по жёсткой модели и на реальном роботе неожиданно получают колебания или неустойчивость.", "with": "Заранее учитывая быстрый набор фазы у резонансного звена, инженер сдвигает частоту среза регулятора подальше от резонанса.", "benefit": "Учёт фазы гибкого звена на этапе проектирования спасает от неустойчивости на готовом суставе."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/34.svg", "alt": "Диаграмма Боде разомкнутого контура: запас по фазе на частоте среза и отмеченная частота резонанса гибкого звена"}}, {"q": "Датчик положения сустава преобразует сигнал не мгновенно: сначала он сглаживает его с постоянной времени \\(T\\), а затем ещё добавляет фиксированную задержку на передачу данных по шине. Как правильнее всего представить такой датчик в модели контура?", "options": ["Последовательным соединением апериодического звена и чистого запаздывания", "Параллельным соединением двух пропорциональных звеньев", "Одним интегрирующим звеном с удвоенным коэффициентом усиления", "Одним колебательным звеном второго порядка с малым \\(\\zeta\\)"], "correct": 0, "explain": "Сглаживание с постоянной времени - это апериодическое звено первого порядка, а фиксированная задержка передачи - отдельное звено чистого запаздывания; при последовательном соединении их фазы складываются, что и определяет поведение реального датчика (Ogata, гл. 8).", "usage": {"code": false, "without": "Датчик моделируют одним пропорциональным звеном, и модель контура не учитывает реальное фазовое отставание сенсора.", "with": "Представив датчик как апериодическое звено с запаздыванием, инженер получает реалистичный запас по фазе всего контура.", "benefit": "Точная модель датчика убирает разрыв между расчётной и измеренной устойчивостью контура."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/35.svg", "alt": "Цепочка сустав, датчик, шина данных, регулятор и график: показание датчика сглажено и опаздывает относительно угла"}}, {"q": "В модели датчика апериодическое звено и звено чистого запаздывания дают разный вклад в фазовое отставание с ростом частоты. Как эти вклады ведут себя на высоких частотах?", "options": ["Апериодическое звено растёт неограниченно, а запаздывание стремится к минус 90 градусам", "Оба звена стремятся к одному и тому же пределу минус 180 градусов", "Оба звена сохраняют нулевое фазовое отставание на любой частоте", "Апериодическое звено стремится к минус 90 градусам, а запаздывание растёт неограниченно"], "correct": 3, "explain": "Фаза апериодического звена первого порядка асимптотически приближается к минус 90 градусам, а фаза чистого запаздывания равна \\(-\\omega\\tau\\) в радианах и растёт линейно без ограничения - это прямо показано в labT2-lab.txt на примере интегратора и звена задержки (Nise, гл. 10).", "usage": {"code": false, "without": "На высоких частотах инженер ждёт, что фаза датчика выйдет на постоянный уровень, и недооценивает опасность запаздывания.", "with": "Зная, что фаза запаздывания растёт без предела, инженер сознательно ограничивает полосу контура заранее.", "benefit": "Понимание разных пределов фазы спасает от недооценённого запаса по фазе на высоких частотах."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/36.svg", "alt": "Ось фазы в зависимости от частоты: две кривые от нуля, обе справа заканчиваются вопросами"}}, {"q": "К валу сустава робота с упругой передачей прикрепили дополнительный груз, заметно увеличив момент инерции нагрузки, а жёсткость и демпфирование передачи не изменились. Что произойдёт с собственной частотой колебательного звена \\(\\omega_n\\)?", "options": ["Собственная частота \\(\\omega_n\\) станет отрицательной", "Собственная частота \\(\\omega_n\\) уменьшится", "Собственная частота \\(\\omega_n\\) увеличится", "Собственная частота \\(\\omega_n\\) не изменится"], "correct": 1, "explain": "Для двухмассовой модели упругой передачи \\(\\omega_n\\) равна корню из отношения жёсткости к инерции; рост инерции при неизменной жёсткости снижает \\(\\omega_n\\) и замедляет колебания сустава (Ogata, гл. 3; labT2-lab.txt, модель второго порядка).", "usage": {"code": false, "without": "После смены полезной нагрузки регулятор, настроенный под старую \\(\\omega_n\\), начинает работать медленнее ожидаемого без объяснения причины.", "with": "Зная зависимость \\(\\omega_n\\) от инерции, инженер заранее пересчитывает динамику под новый груз и подстраивает регулятор.", "benefit": "Учёт зависимости \\(\\omega_n\\) от инерции нагрузки избавляет от сюрпризов при смене груза робота."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/37.svg", "alt": "Две колебательные системы: масса на пружине с демпфером, справа масса больше, k и c те же"}}, {"q": "В том же сценарии увеличения инерции нагрузки коэффициент демпфирования \\(\\zeta\\) зависит от отношения демпфирующего коэффициента к корню из произведения жёсткости и инерции. Как изменятся \\(\\zeta\\) и перерегулирование?", "options": ["\\(\\zeta\\) увеличится, перерегулирование уменьшится", "\\(\\zeta\\) уменьшится, перерегулирование тоже уменьшится", "\\(\\zeta\\) уменьшится, перерегулирование увеличится", "\\(\\zeta\\) и перерегулирование останутся прежними"], "correct": 2, "explain": "При росте инерции знаменатель формулы \\(\\zeta\\) растёт быстрее неизменного демпфирующего коэффициента, поэтому \\(\\zeta\\) падает, а перерегулирование связано с \\(\\zeta\\) обратной зависимостью - оно растёт (Nise, гл. 8).", "usage": {"code": false, "without": "После увеличения полезной нагрузки сустав неожиданно начинает сильнее перерегулировать, и это принимают за поломку датчика.", "with": "Пересчитав \\(\\zeta\\) под новую инерцию, инженер заранее ожидает рост перерегулирования и компенсирует его регулятором.", "benefit": "Прогноз изменения \\(\\zeta\\) избавляет от ложной диагностики при смене нагрузки."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/38.svg", "alt": "Те же две системы с утяжелённой нагрузкой; подписано ζ ~ c/√(kJ), неизвестны ζ и перерегулирование"}}, {"q": "На экспериментальной ЛАЧХ разомкнутого контура сустава виден участок с наклоном минус 40 дБ на декаду и выраженным резонансным пиком перед этим спадом. О каком типовом звене это говорит?", "options": ["О колебательном звене второго порядка с малым демпфированием", "Об интегрирующем звене без дополнительных полюсов", "О форсирующем звене с одним нулём передаточной функции", "Об апериодическом звене первого порядка с большой постоянной времени"], "correct": 0, "explain": "Наклон минус 40 дБ на декаду соответствует паре полюсов, а резонансный пик перед спадом возникает только при \\(\\zeta\\) меньше 0.707 - это фирменная асимптотическая ЛАЧХ колебательного звена; одиночное апериодическое звено даёт лишь минус 20 дБ на декаду без пика (Ogata, гл. 8).", "usage": {"code": false, "without": "По наклону минус 40 дБ на декаду ошибочно предполагают два независимых апериодических звена и не замечают резонанс.", "with": "Увидев резонансный пик перед спадом, инженер сразу опознаёт колебательное звено и оценивает его \\(\\zeta\\) по высоте пика.", "benefit": "Верное чтение ЛАЧХ находит скрытый резонанс раньше, чем он проявится на реальном роботе."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/39.svg", "alt": "Экспериментальная ЛАЧХ разомкнутого контура: точки с резонансным пиком и дальнейшим спадом −40 дБ/дек"}}, {"q": "На ЛАЧХ колебательного звена сустава резонансный пик наблюдается на частоте заметно ниже собственной частоты \\(\\omega_n\\), хотя логично было бы ожидать пик именно на \\(\\omega_n\\). Чем объясняется такое смещение?", "options": ["Резонансная частота всегда в точности совпадает с частотой \\(\\omega_n\\)", "Резонансная частота определяется исключительно постоянной времени датчика сустава", "Резонансная частота равна \\(\\omega_n\\), делённому на коэффициент усиления разомкнутого контура", "Резонансная частота равна \\(\\omega_n\\), умноженному на корень из 1 минус 2 зета в квадрате"], "correct": 3, "explain": "Формула \\(\\omega_r = \\omega_n\\sqrt{1-2\\zeta^2}\\) даёт частоту строго ниже \\(\\omega_n\\) при любом ненулевом \\(\\zeta\\) и вовсе не существует при \\(\\zeta\\) от 0.707 и выше - это прямо разобрано как типовая ловушка в labT2-lab.txt, часть 2.", "usage": {"code": false, "without": "Инженер настраивает подавление резонанса ровно на \\(\\omega_n\\) и промахивается мимо реального пика на более низкой частоте.", "with": "Зная формулу \\(\\omega_r\\), инженер точно находит частоту пика и правильно ставит режекторный фильтр или ограничивает полосу.", "benefit": "Понимание сдвига резонансной частоты предотвращает промах при подавлении вибрации сустава."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/40.svg", "alt": "ЛАЧХ колебательного звена: пик расположен левее вертикали собственной частоты ωn"}}, {"q": "Звено второго порядка сустава манипулятора описано передаточной функцией \\(W(s) = \\frac{225}{s^2 + 18s + 225}\\). Приведите знаменатель к стандартному виду \\(s^2 + 2\\zeta\\omega_n s + \\omega_n^2\\), найдите \\(\\omega_n\\) и \\(\\zeta\\), и определите характер переходного процесса.", "options": ["\\(\\omega_n = 4.24\\) рад/с, \\(\\zeta = 2.12\\), звено апериодическое", "\\(\\omega_n = 225\\) рад/с, \\(\\zeta = 0.04\\), звено колебательное", "\\(\\omega_n = 15\\) рад/с, \\(\\zeta = 0.6\\), звено колебательное", "\\(\\omega_n = 15\\) рад/с, \\(\\zeta = 1.2\\), звено апериодическое"], "correct": 2, "explain": "Шаг 1: свободный член дает \\(\\omega_n^2 = 225\\), значит \\(\\omega_n = 15\\) рад/с. Шаг 2: коэффициент при s дает \\(2\\zeta\\omega_n = 18\\), значит \\(\\zeta = 18/30 = 0.6\\). Шаг 3: так как \\(0 < \\zeta < 1\\), полюсы комплексные и звено колебательное. Главная ошибка дистрактора — забыть множитель 2 при делении на \\(\\omega_n\\). Ogata, гл. 5.", "usage": {"code": false, "without": "Инженер настраивает контур сустава по интуиции и получает либо вялый, либо звенящий отклик привода, не понимая, откуда берется дребезг.", "with": "Зная \\(\\omega_n\\) и \\(\\zeta\\) из передаточной функции, инженер сразу видит, что звено колебательное, и закладывает демпфирование до сборки редуктора.", "benefit": "Позволяет предсказать характер отклика привода до физических испытаний."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/41.svg", "alt": "Передаточная функция 225/(s²+18s+225) рядом со стандартным видом знаменателя; неизвестны ωn, ζ и тип процесса"}}, {"q": "Доминирующие полюсы контура стабилизации мобильного робота дают \\(\\zeta = 0.5\\) и \\(\\omega_n = 10\\) рад/с. Посчитайте перерегулирование \\(M_p = e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}} \\cdot 100\\) в процентах.", "options": ["Перерегулирование \\(M_p\\) составляет примерно 16.30 %", "Перерегулирование \\(M_p\\) составляет примерно 20.79 %", "Перерегулирование \\(M_p\\) составляет примерно 24.54 %", "Перерегулирование \\(M_p\\) составляет примерно 613.39 %"], "correct": 0, "explain": "Шаг 1: \\(1 - \\zeta^2 = 0.75\\), корень = 0.866. Шаг 2: \\(\\pi\\zeta = 1.5708\\), отношение \\(1.5708/0.866 = 1.814\\). Шаг 3: \\(e^{-1.814} = 0.163\\), умножаем на 100 = 16.30 %. Дистрактор 613.39% получается при потере знака минус в показателе экспоненты. Ogata, гл. 5.", "usage": {"code": false, "without": "Разработчик гриппера выбирает коэффициент усиления регулятора наугад и узнает о недопустимом перерегулировании только на стенде, ломая деталь.", "with": "Зная формулу через \\(\\zeta\\), разработчик заранее считает Mp и подбирает демпфирование так, чтобы захват не проскакивал заданную точку.", "benefit": "Экономит цикл физических испытаний на подбор перерегулирования."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/42.svg", "alt": "Схема перерегулирования Mp на отклике колебательного звена и рамка «дано» с ζ и ωn"}}, {"q": "Колебательное звено второго порядка гибкого сочленения имеет \\(\\zeta = 0.25\\) и \\(\\omega_n = 8\\) рад/с, как в guided lab Topic 2. Посчитайте время регулирования по критерию 2% как \\(t_s = \\frac{4}{\\zeta\\omega_n}\\).", "options": ["Время регулирования \\(t_s\\) составляет примерно 8.00 с", "Время регулирования \\(t_s\\) составляет примерно 0.48 с", "Время регулирования \\(t_s\\) составляет примерно 1.50 с", "Время регулирования \\(t_s\\) составляет примерно 2.00 с"], "correct": 3, "explain": "Шаг 1: \\(\\zeta\\omega_n = 0.25 \\cdot 8 = 2\\). Шаг 2: \\(t_s = 4/2 = 2.00\\) с. Дистрактор 0.48 с получен делением 4 на сумму \\(\\zeta+\\omega_n\\) вместо произведения; дистрактор 8.00 с — от перемножения \\(4\\zeta\\omega_n\\) вместо деления. Совпадает с эталонным расчетом labT2-lab.txt, Part 2.", "usage": {"code": false, "without": "Инженер не знает, сколько ждать после команды позиционирования, и запускает следующий шаг программы робота раньше, чем сочленение успокоилось.", "with": "Зная \\(t_s\\) из \\(\\zeta\\) и \\(\\omega_n\\), инженер закладывает точную паузу перед следующей командой траектории.", "benefit": "Исключает команды поверх незатухших колебаний привода."}, "img": {"src": "img/rcf_time_response_standard_links_frequency/43.svg", "alt": "Схема времени регулирования ts с коридором ±2 % и рамка «дано» с ζ и ωn"}}, {"q": "Апериодическое звено первого порядка датчика тока задано как \\(W(s) = \\frac{8}{2s + 1}\\)   let uploadTimer = null;

    clearTimeout(uploadTimer);
    uploadTimer = setTimeout(flushUpload, 4000);

    if (uploadTimer === null) return;

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

    html += '</div>';

    if (q.usage) {

      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    const open = LTProgress.mistakes(state).length;
    if (open) html += '<div class="nav"><button class="btn" id="mistakesBtn">🔁 Работа над ошибками (' + open + ')</button></div>';
    html += '<div class="nav"><button class="btn' + (open ? ' secondary' : '') + '" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);

    if (open) document.getElementById("mistakesBtn").addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  // ---- «Работа над ошибками» ----
  // Отдельный проход только по вопросам с неисправленной ошибкой. Счёт теста
  // (state.answers) он не трогает: исправленная ошибка пишется в state.fixed.
  let drill = null;   // {kind, queue: [индексы], pos, answer: {sel, correct} | null, right}

  function startDrill(kind) {
    const queue = LTProgress.mistakes(state);
    if (!queue.length) {
      drill = null;
      history.replaceState(null, "", location.pathname);
      render();
      toast("Ошибок не осталось — всё исправлено");
      return;
    }
    drill = { kind: kind, queue: queue, pos: 0, answer: null, right: 0 };
    SHUFFLED = buildShuffledQuestions();
    window.scrollTo(0, 0);
    renderDrill();
  }

  function leaveDrill() {
    drill = null;
    history.replaceState(null, "", location.pathname);
    render();
  }

  function renderDrill() {
    if (drill.pos >= drill.queue.length) { renderDrillResult(); return; }
    resultArea.style.display = "none";
    quizArea.style.display = "block";
    const idx = drill.queue[drill.pos];
    const q = SHUFFLED[idx];
    const answered = drill.answer ? { selectedText: q.options[drill.answer.sel], correct: drill.answer.correct } : null;
    progressFill.style.width = Math.round((drill.pos / drill.queue.length) * 100) + "%";
    progressText.textContent = (drill.pos + 1) + " / " + drill.queue.length;
    blockLabel.textContent = "Работа над ошибками · вопрос " + (idx + 1);

    let html = cardHtml(q, answered);
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="drillExitBtn">Выйти</button>';
    html += '<button class="btn" id="drillNextBtn"' + (answered ? '' : ' disabled') + '>' + (drill.pos === drill.queue.length - 1 ? 'Итог' : 'Далее') + '</button>';
    html += '</div>';
    quizArea.innerHTML = html;
    typeset(quizArea);

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (drill.answer) return;
        const sel = parseInt(btn.dataset.i, 10);
        const ok = sel === q.correct;
        drill.answer = { sel: sel, correct: ok };
        if (ok) drill.right++;
        if (ok) { state.fixed = state.fixed || {}; state.fixed[idx] = Date.now(); saveState(); }
        renderDrill();
      });
    });
    document.getElementById("drillExitBtn").addEventListener("click", leaveDrill);
    document.getElementById("drillNextBtn").addEventListener("click", () => {
      drill.pos++;
      drill.answer = null;
      window.scrollTo(0, 0);
      renderDrill();
    });
  }

  function renderDrillResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    const total = drill.queue.length;
    let html = '<div class="card result">';
    html += '<div class="score">' + drill.right + ' / ' + total + '</div>';
    const left = LTProgress.mistakes(state).length;
    blockLabel.textContent = "Работа над ошибками · итог";
    html += '<div style="color:var(--muted); margin-top:6px;">исправлено за этот заход</div>';
    html += '<div style="margin-top:14px;">' + (left ? ('Осталось ошибок: ' + left) : 'Все ошибки этого теста исправлены') + '</div></div>';
    if (left) html += '<div class="nav"><button class="btn" id="drillAgainBtn">🔁 Ещё раз (' + left + ')</button></div>';
    html += '<div class="nav"><button class="btn secondary" id="drillDoneBtn">К тесту</button></div>';
    resultArea.innerHTML = html;
    typeset(resultArea);
    const again = document.getElementById("drillAgainBtn");
    if (again) again.addEventListener("click", () => startDrill("mistakes"));
    document.getElementById("drillDoneBtn").addEventListener("click", leaveDrill);
  }

  // Картинка к вопросу (поле img из content/<slug>.json, путь от корня сайта).
  // Касание открывает её целиком: на телефоне так её можно увеличить.
  function imageHtml(img) {
    if (!img || !img.src) return "";
    const src = "../" + escapeAttr(img.src);
    let html = '<figure class="qimg"><a href="' + src + '" target="_blank" rel="noopener">';
    html += '<img src="' + src + '" alt="' + escapeAttr(img.alt) + '" loading="lazy"></a>';
    if (img.credit) html += '<figcaption>' + escapeHtml(img.credit) + '</figcaption>';
    return html + '</figure>';
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, "&quot;");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ")
      .replace(/\\[()\[\]]/g, " ").replace(/\\([a-zA-Z]+)/g, "$1").replace(/\s+/g, " ").trim();
  }

  // Формулы в тексте: \( ... \) в строке, \[ ... \] отдельной строкой (KaTeX,
  // файлы в vendor/katex). Знак $ разделителем не служит: в тестах по
  // ассемблеру и shell он означает константу и переменную. Код в <pre> и
  // <code> не трогается. Без KaTeX текст остаётся как есть.
  function typeset(el) {
    if (!el || typeof renderMathInElement !== "function") return;
    renderMathInElement(el, {
      delimiters: [
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true }
      ],
      throwOnError: false
    });
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "mistakes") startDrill(mode);
  else render();

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) {
    uploadBtn.disabled = busy; downloadBtn.disabled = busy;
    document.getElementById("syncMergeBtn").disabled = busy;
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  document.getElementById("syncMergeBtn").addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Синхронизация…";
    LTSync.syncAll({
      interactive: true,
      onDone: (s) => {
        setBusy(false);
        if (!drill) { state = loadState(); render(); }
        toast("Получено " + s.pulled + ", отправлено " + s.pushed + (s.failed ? ", ошибок " + s.failed : ""));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
