<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shell best practices: POSIX sh, BitBake, ревью</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>Shell best practices: POSIX sh, BitBake, ревью</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../sync.js"></script>
<script>
(function () {
  const TEST_ID = "shell_best_practices";
  const QUESTIONS = [{"q": "Что не так с этим фрагментом?\n```\ncd \"$build\"\nrm -rf ./*\n```", "options": ["Если cd не сработал, rm выполнится в текущем каталоге, каким бы он ни был", "Маска ./* не раскроется, потому что перед ней обязана стоять точка с запятой", "Переменная build в кавычках не раскрывается, поэтому cd уйдёт в домашний каталог", "rm нельзя запускать сразу после cd: нужна пауза на синхронизацию каталога"], "correct": 0, "explain": "SC2164: каждый cd либо охраняется через || exit 1 и || return 1, либо живёт внутри ( cd … && … ). Иначе неудачный переход оставляет скрипт в чужом каталоге, и следующая команда сносит не то. Раздел A чек-листа, пункт про cd.", "usage": {"code": true, "without": "cd \"$build\"\nrm -rf ./*", "with": "cd \"$build\" || exit 1\nrm -rf ./*\n# или: ( cd \"$build\" && make )", "benefit": "Неудачный переход останавливает скрипт, а не чистит чужой каталог."}}, {"q": "Автор хотел if-then-else и написал так. В чём ловушка?\n```\ngen > \"$tmp\" && mv \"$tmp\" \"$out\" || echo failed >&2\n```", "options": ["Перенаправление >&2 внутри такой цепочки съедает статус всей конструкции", "Цепочка вычисляется справа налево, поэтому echo выполнится всегда первым", "mv выполнится даже при падении gen, потому что && проверяет только запуск", "echo сработает и тогда, когда упадёт mv, а итоговый статус будет нулевым"], "correct": 3, "explain": "SC2015: A && B || C — не if-then-else, ветка C срабатывает и при падении B. Здесь итоговый статус — это ноль от echo, поэтому вызывающий увидит успех. Раздел A: «A && B || C is never if-then-else».", "usage": {"code": true, "without": "gen > \"$tmp\" && mv \"$tmp\" \"$out\" || echo failed >&2", "with": "if gen > \"$tmp\" && mv -f -- \"$tmp\" \"$out\"; then\n  :\nelse\n  echo failed >&2\n  exit 1\nfi", "benefit": "Ошибка видна и наружу уходит ненулевой статус."}}, {"q": "Скрипт падает на файле с пробелом в имени. Что исправить?\n```\ncp $src $dst\n[ -n $tmp ]\n```", "options": ["Заменить [ ] на [[ ]], где разбиения по словам не происходит вовсе", "Взять переменные в одинарные кавычки, они надёжнее двойных при пробелах", "Взять $src, $dst и $tmp в двойные кавычки — иначе идёт разбиение по IFS", "Добавить -- перед аргументами: разбиение по пробелам это не остановит"], "correct": 2, "explain": "SC2086: каждый $var и $(cmd) в двойных кавычках, если разбиение не является осознанным намерением. В одинарных кавычках переменная вообще не раскроется, а [[ ]] — башизм и в dash не работает. Раздел C, первый пункт.", "usage": {"code": true, "without": "cp $src $dst\n[ -n $tmp ]", "with": "cp -- \"$src\" \"$dst\"\n[ -n \"$tmp\" ]\nset -- $flags   # shellcheck disable=SC2086  # намеренное разбиение", "benefit": "Имена с пробелами проходят целиком, а dash не спотыкается на пустом аргументе."}}, {"q": "Почему такая строка считается ошибкой, а не просто неаккуратностью?\n```\nprintf \"Merged: $n files\\n\"\n```", "options": ["Данные попали в строку формата: процент из переменной станет спецификатором", "printf выведет строку без подстановки: переменные в формате не раскрываются", "printf без -- не принимает строки, начинающиеся с дефиса, и завершится с ошибкой", "printf в dash требует, чтобы формат заканчивался явным переводом строки"], "correct": 0, "explain": "SC2059: строка формата у printf — литерал, данные идут аргументами. Иначе процент или обратный слэш из данных меняет смысл формата, а на нехватке аргументов вывод поедет. Раздел C: «printf format is a literal; data goes in the arguments».", "usage": {"code": true, "without": "printf \"Merged: $n files\\n\"", "with": "printf 'Merged: %s files\\n' \"$n\"", "benefit": "Данные не могут переопределить формат вывода."}}, {"q": "shellcheck ругается на эту строку. Почему проверка статуса тут не работает?\n```\nlocal tmp=$(mktemp)\n```", "options": ["local вычисляет правую часть до входа в функцию, поэтому значение теряется при возврате", "mktemp внутри local выполняется в подоболочке, и переменная останется пустой", "local нельзя использовать вместе с подстановкой команды: dash завершится с ошибкой разбора", "Статус берётся от local, а не от mktemp, поэтому падение mktemp остаётся незамеченным"], "correct": 3, "explain": "SC2155: local, export и readonly возвращают свой собственный статус, маскируя статус подстановки команды. Поэтому присваивание и объявление разносят на две строки, а статус проверяют на присваивании. Раздел A.", "usage": {"code": true, "without": "local tmp=$(mktemp)", "with": "tmp=$(mktemp -- \"$dir/.out.XXXXXX\") || return 1\nlocal tmp", "benefit": "Падение mktemp останавливает функцию, а не идёт дальше с пустым путём."}}, {"q": "Задача упала, а скрипт этого не заметил. Где потерялся статус?\n```\ngen | sort > \"$tmp\" && mv \"$tmp\" \"$out\"\n```", "options": ["Статус конвейера теряется из-за && — его нужно заменить на точку с запятой", "sort всегда возвращает ноль, поэтому проверять конвейеры вообще бессмысленно", "В sh считается статус только последней команды конвейера, а падение gen теряется", "Перенаправление в конвейере обнуляет статус обеих сторон конвейера"], "correct": 2, "explain": "В sh статус конвейера — это статус последней команды, а set -o pipefail здесь недоступен. Поэтому конвейер разбивают на шаги и проверяют производителя отдельно. Раздел A: «No pipeline hides a producer's failure — sh has no pipefail; split it».", "usage": {"code": true, "without": "gen | sort > \"$tmp\" && mv \"$tmp\" \"$out\"", "with": "gen > \"$tmp.raw\" || exit 1\nLC_ALL=C sort \"$tmp.raw\" > \"$tmp\" || exit 1\nmv -f -- \"$tmp\" \"$out\" || exit 1", "benefit": "Падение производителя видно сразу, а не через испорченный результат."}}, {"q": "Ревьюер назвал это анти-паттерном. Чем заменить?\n```\nfor f in $(ls *.scd); do process \"$f\"; done\nn=$(ls *.scd | wc -l)\n```", "options": ["Добавить кавычки вокруг $(ls *.scd) — тогда имена с пробелами не развалятся", "Обойти маску напрямую с охраной от несовпадения, а счёт вести через find", "Задать IFS=$'\\n' перед циклом, и разбор вывода ls станет безопасным", "Заменить ls на echo: он выводит те же имена, но не портит разбиение по словам"], "correct": 1, "explain": "SC2012 и SC2045: вывод ls нельзя разбирать, имена с пробелами и переводами строк ломают цикл и счёт. Маска идёт напрямую с охраной [ -e \"$f\" ] || continue, счёт — через find. Раздел C, пункт про ls; это же было находкой ревьюера №5.", "usage": {"code": true, "without": "for f in $(ls *.scd); do process \"$f\"; done\nn=$(ls *.scd | wc -l)", "with": "for f in ./*.scd; do\n  [ -e \"$f\" ] || continue    # unmatched glob stays literal\n  process \"$f\"\ndone\nn=$(find \"$dir\" -maxdepth 1 -name '*.scd' | wc -l)", "benefit": "Любые имена файлов проходят целиком, а счёт не зависит от форматирования ls."}}, {"q": "Счётчик всегда печатает 0. Почему?\n```\nn=0\ncmd | while IFS= read -r l; do n=$((n+1)); done\necho \"$n\"\n```", "options": ["Арифметика $((n+1)) в sh не поддерживается, значение молча остаётся прежним", "echo выполняется раньше цикла, потому что конвейер запускается в фоне", "read без -d не завершает цикл, поэтому присваивание внутри никогда не выполняется", "Правая часть конвейера идёт в подоболочке, и её переменные до внешней не доходят"], "correct": 3, "explain": "SC2030 и SC2031: каждая часть конвейера запускается в отдельной подоболочке, поэтому присваивания в while наружу не выходят. Цикл кормят перенаправлением из файла или heredoc. Раздел C: «Variables set inside a piped while are not used afterwards».", "usage": {"code": true, "without": "cmd | while IFS= read -r l; do n=$((n+1)); done\necho \"$n\"", "with": "cmd > \"$tmp\" || exit 1\nn=0\nwhile IFS= read -r l; do n=$((n+1)); done < \"$tmp\"\necho \"$n\"", "benefit": "Значение, посчитанное в цикле, доступно после него."}}, {"q": "Как правильно сообщать об ошибке в скрипте?\n```\necho \"cannot open $file\"\nexit 1\n```", "options": ["Правильнее печатать сообщение после exit, чтобы оно не попало в вывод при успехе", "exit 1 здесь лишний: достаточно напечатать сообщение, вызывающий разберётся по тексту", "Сообщение нужно дублировать в системный журнал, иначе оно потеряется при перенаправлении", "Сообщение идёт в stdout и смешивается с выводом — нужен stderr через помощник"], "correct": 3, "explain": "Ошибки идут в stderr с префиксом имени скрипта, через один помощник, и скрипт завершается ненулевым статусом. Иначе сообщение попадает в данные, которые читает следующий по конвейеру. Раздел E, первый пункт, по Google Shell Style Guide.", "usage": {"code": true, "without": "echo \"cannot open $file\"\nexit 1", "with": "die() { printf '%s: %s\\n' \"${0##*/}\" \"$*\" >&2; exit 1; }\ndie \"cannot open $file\"", "benefit": "Диагностика отделена от вывода, а статус говорит об ошибке."}}, {"q": "Два фрагмента выглядят одинаково надёжно. Почему чек-лист требует второй?\n```\n# 1:  set -e; cat -- \"$dir\"/*.scd > \"$tmp\"; mv \"$tmp\" \"$out\"\n# 2:  cat -- \"$dir\"/*.scd > \"$tmp\" || { rm -f -- \"$tmp\"; return 1; }\n```", "options": ["set -e работает только в интерактивной оболочке, поэтому в скрипте он бесполезен", "set -e — страховка, а не проверка: он молчит в if и ||, и не убирает мусор", "Второй вариант быстрее: явная проверка не требует от оболочки отслеживать статусы", "set -e отключает подстановку команд, из-за чего маска *.scd перестанет раскрываться"], "correct": 1, "explain": "Раздел A, первый пункт: каждая команда, чьё падение важно, несёт || exit 1, || return 1 или if, а set -e остаётся страховкой. У errexit слишком много исключений — он выключен в условиях if, в && и ||, в функциях, вызванных оттуда, — и он ничего не убирает за собой.", "usage": {"code": true, "without": "set -e\ncat -- \"$dir\"/*.scd > \"$tmp\"\nmv \"$tmp\" \"$out\"", "with": "cat -- \"$dir\"/*.scd > \"$tmp\" || { rm -f -- \"$tmp\"; return 1; }\nmv -f -- \"$tmp\" \"$out\" || return 1", "benefit": "Ошибка ловится там, где случилась, и мусор не остаётся."}}, {"q": "Ревьюер предложил два варианта временного файла. Оба «уникальны» — почему годится только один?\n```\ntmp= p\" \"$out\"", "with": "gen > \"$tmp\" || {\n  rm -f -- \"$tmp\"\n  # старый $out оставляем намеренно\n  echo \"gen failed, $out unchanged\" >&2\n  return 1\n}\nmv -f -- \"$tmp\" \"$out\" || return 1", "benefit": "Ни мусора, ни тихой подмены результата вчерашним файлом."}}, {"q": "Две проверки выглядят равнозначно. Почему вторая безопаснее?\n```\n[ \"$a\" -ne \"$n\" ] || [ \"$b\" -ne \"$n\" ] && fail\n[ \"$a\" = \"$n\" ] && [ \"$b\" = \"$n\" ] || fail\n```", "options": ["Оператор -ne запрещён в POSIX-совместимом test и поддерживается только в bash", "Числовое сравнение медленнее строкового, и на больших значениях -ne даёт переполнение", "Пустое значение роняет -ne, и цепочка через || проваливается мимо проверки", "Строковое сравнение сравнивает и тип, поэтому проверка становится строже по определению"], "correct": 2, "explain": "Проверка делается fail-closed: условие успеха — цепочка && со строковым =, так что пустой или нечисловой счётчик попадает в ветку отказа. Цепочка || из -ne проваливается на «[: Illegal number» и публикует непроверенный результат. Раздел B, пункт про fail-closed validation.", "usage": {"code": true, "without": "[ \"$merged\" -ne \"$expected\" ] || [ \"$recs\" -ne \"$expected\" ] && bbfatal \"bad\"", "with": "if [ \"$merged\" = \"$expected\" ] && [ \"$recs\" = \"$expected\" ]; then\n  :\nelse\n  bbfatal \"merge incomplete: $merged of $expected\"\nfi", "benefit": "Любое неожиданное значение уходит в отказ, а не в публикацию."}}, {"q": "Скрипт с шапкой #!/bin/sh работает на рабочей станции и падает на сборочном хосте. Что в нём лишнее?\n```\nfunction f { local a=(x y); [[ $1 == y* ]] && s+=1; }\nread -r a b <<< \"$line\"\nx=${x//a/b}\n```", "options": ["Это башизмы: dash не знает function, массивов, [[ ]], <<< и подстановки с заменой", "Переменную s нужно заранее объявить через declare, иначе += создаст массив", "В dash обязателен export для каждой переменной, иначе она видна только внутри функции", "Функции в POSIX-скрипте объявляют только посл in": "SC3040: dash 0.5.12, который стоит на сборочных хостах Debian и Ubuntu, прерывается на неизвестном ключе — скрипт умирает на первой строке. Вместо этого конвейер разбивают и проверяют производителя, а pipefail оставляют как необязательное улучшение через проверку в подоболочке. Раздел D.", "usage": {"code": true, "without": "#!/bin/sh\nset -eu -o pipefail", "with": "#!/bin/sh\nset -eu\n# обязательные проверки: разбить конвейер и проверить производителя\n(set -o pipefail 2>/dev/null) && set -o pipefail   # только как улучшение", "benefit": "Скрипт запускается на хосте, а проверки не зависят от расширения оболочки."}}, {"q": "Арифметика в обычном скрипте и в теле BitBake-задачи пишется по-разному. Почему?\n```\n# script.sh:            n=$(( KB * 1024 ))\n# do_install:append():  n=$(expr ${RTLOG_KB} \\* 1024)\n```", "options": ["$(( )) вычисляется при разборе рецепта, поэтому результат устарел бы к моменту запуска", "В BitBake переменные метаданных нечисловые, поэтому арифметика оболочки к ним неприменима", "expr точнее считает большие числа, а $(( )) в dash ограничен шестнадцатью битами", "Разборщик BitBake не пропускает $(( )) в теле задачи, поэтому там остаётся expr"], "correct": 3, "explain": "Раздел D, последний пункт, и раздел G про разборщик: $(( )) — нормальная POSIX-арифметика в обычном скрипте, но в теле BitBake-задачи она даёт ошибку разбора, поэтому в этом дереве там пишут expr. Это единственное место, где expr предпочтительнее.", "usage": {"code": true, "without": "do_install:append() {\n    n=$(( ${RTLOG_KB} * 1024 ))\n}", "with": "do_install:append() {\n    n=$(expr ${RTLOG_KB} \\* 1024)   # shellcheck disable=SC2003  # BitBake parser rejects $(( ))\n}", "benefit": "Рецепт разбирается, а причина нестандартной записи остаётся на строке."}}, {"q": "Ревьюер написал на эту строку «why we need this? add a comment». Строка верна — чего он хочет?\n```\nfor f in \"$dir\"/*.scd; do\n    [ -f \"$f\" ] || continue\n```", "options": ["Развёрнутого абзаца над циклом с описанием формата файлов и потребителя вывода", "Ссылки на номер тикета в комментарии, чтобы охрану можно было потом убрать", "Замены охраны на проверку количества файлов до цикла, комментарий тогда не нужен", "Причину охраны на самой строке: без совпадений маска остаётся буквальной строкой"], "correct": 3, "explain": "Раздел E и правило terse-script-comments: внутри функции комментарии по 2–3 слова и только там, где код верен, но выглядит лишним. Охрана, выглядящая избыточной, — ровно тот случай: «# unmatched glob stays literal». Абзац-обзор нужен над функцией, а не на этой строке.", "usage": {"code": true, "without": "for f in \"$dir\"/*.scd; do\n    [ -f \"$f\" ] || continue", "with": "for f in \"$dir\"/*.scd; do\n    [ -f \"$f\" ] || continue    # unmatched glob stays literal", "benefit": "Следующий читатель не приходит с тем же вопросом в тред PR."}}, {"q": "Задача падает на первой же строке, хотя отладочной сборки просто нет. Почему?\n```\ndo_deploy() {\n    grep -q wifiTCMDbg ${B}/toolbox\n    install -m 0644 ${B}/rtlog.bin ${DEPLOYDIR}/\n}\n```", "options": ["grep без -F считает строку регулярным выражением и падает на неизвестном символе", "set -e дописан BitBake в начало тела, и grep без совпадений роняет задачу", "grep -q закрывает стандартный ввод, и следующая команда не получает данных", "install не найдёт каталог назначения, пока grep не создаст его своим обращением"], "correct": 1, "explain": "Раздел G, первый пункт: BitBake дописывает set -e в начало каждого run.do_X — это видно в lib/bb/build.py, функция shell_trap_code(). Поэтому голые grep -q, diff и [ -f ] && … как отдельные команды убивают задачу, и их оборачивают в if.", "usage": {"code": true, "without": "grep -q wifiTCMDbg ${B}/toolbox\n[ -f ${WORKDIR}/extra ] && install -m 0644 ${WORKDIR}/extra ${DEPLOYDIR}/", "with": "if grep -q wifiTCMDbg ${B}/toolbox; then bbnote \"debug build\"; fi\nif [ -f ${WORKDIR}/extra ]; then install -m 0644 ${WORKDIR}/extra ${DEPLOYDIR}/; fi\ndiff old new || true          # падение разрешено намеренно", "benefit": "Задача падает только там, где это действительно ошибка."}}, {"q": "Сборка зелёная, артефакта в образе нет. Что в этом коде даёт такой результат?\n```\nif [ \"$merged\" -ne \"$expected\" ]; then\n    bbwarn \"merge incomplete\"\n    return\nfi\n```", "options": ["return без аргумента возвращает ноль, и задача помечается успешной при неудачном слиянии", "return внутри if прерывает разбор рецепта, и остаток задачи просто не попадает в run-файл", "bbwarn пишет только в лог задачи, поэтому предупреждение не доходит до сборочного вывода", "Сравнение -ne здесь всегда ложно, из-за чего ветка с предупреждением не выполняется"], "correct": 0, "explain": "Раздел G, второй пункт, и приоритет ревьюера №2 «Silent success on merge failure»: bberror и bbwarn с последующим return, set +e или || true на критичном шаге оставляют задачу со штампом успеха. Ошибка, которая важна, — это bbfatal.", "usage": {"code": true, "without": "bbwarn \"merge incomplete\"\nreturn", "with": "rm -f -- \"$tmp\"\nbbfatal \"merge incomplete: $merged of $expected\"", "benefit": "Сборка краснеет там, где результат неверен, а не через неделю на плате."}}, {"q": "Одна из двух строк в теле BitBake-задачи запрещена, вторая разрешена. Какая и почему?\n```\ntrap 'rm -f \"$tmp\"' EXIT\ntrap 'rm -f \"$tmp\"; exit 1' HUP INT TERM\n```", "options": ["Обе разрешены, если EXIT-обработчик заканчивается вызовом bbfatal вместо exit", "Запрещена вторая: сигналы приходят раньше, чем BitBake успевает создать временный файл", "Запрещена первая: BitBake ставит свой обработчик EXIT, подмена ломает диагностику", "Обе запрещены: любой trap в теле задачи перекрывает обработчик BitBake и ломает отчёт"], "correct": 2, "explain": "Раздел G: BitBake владеет ловушкой EXIT — это bb_sh_exit_handler; её замена теряет строку «exit code N», а цепочка rm и обработчика даёт обработчику $? от rm и рапортует провал как успех. На HUP, INT и TERM BitBake не ставит ничего, поэтому вторая строка уместна и закрывает случай Ctrl-C.", "usage": {"code": true, "without": "trap 'rm -f \"$tmp\"' EXIT", "with": "trap 'rm -f \"$tmp\"; exit 1' HUP INT TERM\ngen > \"$tmp\" || { rm -f \"$tmp\"; bbfatal \"gen failed\"; }", "benefit": "Диагностика BitBake цела, а прерванная задача не оставляет мусора."}}, {"q": "Строку защитили от падения при нуле совпадений. Почему проверяющий всё равно требует доработки?\n```\nmerged=$(grep -c '^- --- ' \"$tmp\" || true)\n[ \"$merged\" -gt 0 ] || bbfatal \"nothing merged\"\n```", "options": ["grep -c при нуле совпадений печатает пустую строку, и -gt сравнит её как единицу", "|| true действует только на последнюю команду конвейера, а grep остаётся незащищённым", "|| true глотает и код 2, ошибку чтения, поэтому нужна проверка значения", "Подстановка команды в BitBake выполняется при разборе, поэтому значение всегда пустое"], "correct": 2, "explain": "Раздел G: x=$(grep -c …) при нуле совпадений возвращает 1 и под set -e убивает задачу, но || true заодно глотает код 2 — сбой чтения файла. Поэтому || true всегда идёт в паре с fail-closed проверкой полученного значения. Здесь такая проверка есть — и именно она делает связку корректной.", "usage": {"code": true, "without": "merged=$(grep -c '^- --- ' \"$tmp\")", "with": "merged=$(grep -c '^- --- ' \"$tmp\" || true)\nif [ \"$merged\" = \"$expected\" ]; then :; else bbfatal \"merge incomplete\"; fi", "benefit": "Ноль совпадений не роняет задачу, а ошибка чтения не проходит мимо проверки."}}, {"q": "Файлы уезжают не туда, хотя переменная в рецепте задана. В чём ошибка?\n```\nFW_DIR = \"${WORKDIR}/fw\"\ndo_install() {\n    install \"$FW_DIR\"/*.bin ${D}${prefix}/\n}\n```", "options": ["FW_DIR задан до do_install, поэтому на момент запуска задачи значение ещё не вычислено", "${NAME} раскрывает BitBake, $NAME читает оболочка: без export значение пусто", "install требует ключ -D для создания каталогов, без него путь назначения игнорируется", "Кавычки вокруг $FW_DIR мешают раскрытию маски, поэтому *.bin передаётся буквально"], "correct": 1, "explain": "Раздел G: ${NAME} раскрывает BitBake при сборке тела задачи, а $NAME читает оболочка во время выполнения — и неэкспортированные метаданные там пусты. Вдобавок ${prefix} здесь придёт из bitbake.conf как /usr, поэтому локальные имена не должны повторять имена метаданных.", "usage": {"code": true, "without": "install \"$FW_DIR\"/*.bin ${D}${prefix}/", "with": "inst_prefix=/opt/wave\ninstall -m 0644 ${FW_DIR}/*.bin ${D}$inst_prefix/\n# проверить собранное тело: bitbake-getvar -r <recipe> do_install", "benefit": "Пути в задаче те же, что в рецепте, а локальные имена не конфликтуют с метаданными."}}, {"q": "check_fw внутри вызывает bbfatal, но задача продолжает работать. Почему?\n```\nbbnote \"fw: $(check_fw ${WORKDIR}/fw.bin)\"\ninstall -m 0644 ${WORKDIR}/fw.bin ${DEPLOYDIR}/\n```", "options": ["bbnote перехватывает ошибки своего аргумента и понижает их до уровня замечания", "Подстановка команды запускает помощника в подоболочке, и bbfatal завершает только её", "bbfatal действует только в задачах, объявленных через addtask, а в помощниках молчит", "bbfatal требует, чтобы сообщение было в двойных кавычках, иначе он ничего не делает"], "correct": 1, "explain": "Раздел G: bbfatal работает в собственной оболочке задачи — внутри $( ), ( ), конвейера или помощника, проверяемого в if, он завершает только подоболочку. Вызывающая строка при этом возвращает ноль от bbnote, и задача идёт дальше как ни в чём не бывало.", "usage": {"code": true, "without": "bbnote \"fw: $(check_fw ${WORKDIR}/fw.bin)\"", "with": "check_fw ${WORKDIR}/fw.bin\nbbnote \"fw checked: ${WORKDIR}/fw.bin\"", "benefit": "Падение помощника действительно останавливает задачу."}}, {"q": "Задача не выполняется вообще, хотя рецепт собирается. Какой якорь нужен?\n```\ndo_merge_scd[depends] += \"wave-drv:do_deploy\"\naddtask merge_scd after do_image_complete\n```", "options": ["Оба якоря: after do_image_complete и before do_build, иначе пути от do_build нет", "Только after do_rootfs: после do_image_complete образ уже закрыт для изменений", "Достаточно заменить after на before, тогда задача попадёт в цепочку сборки образа", "Нужно добавить флаг nostamp, без него задача считается выполненной и пропускается"], "correct": 0, "explain": "Раздел G и раздел 2 правил ревьюера: «after X» в одиночку недостижим из do_build — от него к задаче не ведёт ни одно ребро, и bitbake до неё не доходит. Послеобразный шаг якорится «after do_image_complete before do_build»; do_deploy — исключение, за него ручается base.bbclass через recrdeptask.", "usage": {"code": true, "without": "addtask merge_scd after do_image_complete", "with": "addtask merge_scd after do_image_complete before do_build\n# доказательство: bitbake -g <image> && grep merge_scd task-depends.dot", "benefit": "Задача действительно выполняется при обычной сборке образа."}}, {"q": "Права и владельцы в образе оказались хостовыми. Какая строка виновата?\n```\ndo_install() {\n    cp -a ${S}/etc ${D}/\n}\n```", "options": ["cp -a не переносит расширенные атрибуты, из-за чего права выставляются нулевыми", "cp -a переносит владельца и права сборочного пользователя в образ под pseudo", "cp -a копирует символические ссылки как обычные файлы и удваивает размер образа", "cp -a не создаёт каталог назначения, поэтому файлы ложатся одним файлом ${D}"], "correct": 1, "explain": "Раздел G: в ${D} и ${IMAGE_ROOTFS} файлы кладут через install или cp --no-preserve=ownership, но не cp -a и не cp -r. Под pseudo сохранённый владелец хоста попадает в пакет, и в образе оказываются чужие права.", "usage": {"code": true, "without": "cp -a ${S}/etc ${D}/", "with": "install -d ${D}${sysconfdir}\ninstall -m 0644 ${S}/etc/*.conf ${D}${sysconfdir}/\ncp -r --no-preserve=ownership ${WORKDIR}/tools/. ${D}${bindir}/", "benefit": "Права и владельцы в пакете предсказуемы и не зависят от сборочной машины."}}, {"q": "Проверка прошла чисто, а на плате скрипт падает. Что не так с запуском линтера?\n```\nshellcheck -s bash board.sh\n```", "options": ["shellcheck нельзя запускать на скриптах платы, для них есть только checkbashisms", "Диалект bash прячет находки SC3xxx, то есть ровно башизмы, которых нет на плате", "Нужен ключ -x, без него линтер вообще не разбирает тело файла до конца", "Без -S error линтер показывает только стилевые замечания и пропускает ошибки"], "correct": 1, "explain": "Раздел F: линтер запускают под целевым диалектом — -s sh как самый строгий, -s dash для сборочного хоста и BitBake, -s busybox для платы, плюс -x для подключаемых файлов. Под -s bash весь класс SC3xxx исчезает из вывода, и файл выглядит чистым.", "usage": {"code": true, "without": "shellcheck -s bash board.sh", "with": "shellcheck -s sh -x -o deprecate-which,check-extra-masked-returns,check-set-e-suppressed board.sh\nshellcheck -s dash board.sh\nshellcheck -s busybox board.sh", "benefit": "Башизмы находятся до того, как их найдёт плата."}}, {"q": "Автор пишет в PR «проверено под dash». Почему этого недостаточно?\n```\ndash -n script.sh && echo portable\n```", "options": ["Проверка под dash избыточна: то же самое уже показал shellcheck с ключом -s sh", "Ключ -n проверяет синтаксис и пропускает башизмы, падающие при выполнении", "dash -n всегда возвращает ноль, поэтому условие после && ничего не проверяет", "Ключ -n читает только первую функцию файла, остальное остаётся непроверенным"], "correct": 1, "explain": "Раздел F, последний пункт: dash -n принимает [[ ]], ${v:1:2}, &>, (( )), let, source, echo -e, pipefail и == — всё это падает только при выполнении. Поэтому скрипт именно запускают под dash и под BusyBox, а не просто разбирают.", "usage": {"code": true, "without": "dash -n script.sh && echo portable", "with": "dash script.sh <safe args>\nbusybox sh script.sh <safe args>\nsh -c 'v=abc; echo ${v:1:1}'   # проба платы: b = ASH_BASH_COMPAT", "benefit": "Ошибки времени выполнения находятся на хосте, а не на устройстве."}}, {"q": "Что должно остаться в bbappend образа после ревью?\n```\n# rdk-generic-broadband-image.bbappend\nIMAGE_INSTALL:append = \" wave-rtlog\"\ndo_rtlog_scd_merge() { ... 40 строк ... }\naddtask rtlog_scd_merge after do_image_complete before do_build\n```", "options": ["Только IMAGE_INSTALL и одна строка require: код уезжает в отдельный файл рядом", "Всё как есть: задача обязана лежать в bbappend образа, иначе она не попадёт в сборку", "Только задача: IMAGE_INSTALL в bbappend образа считается дублированием и убирается", "IMAGE_INSTALL и addtask, а тело функции выносится в отдельный bbclass и наследуется"], "correct": 0, "explain": "Раздел 1 правил ревьюера: «Better to keep images bbappends small for easier maintenance + if happens that we need to use another build target we will include just one line instead of duplication». Любая функция или задача уезжает в соседний файл и подключается через require.", "usage": {"code": true, "without": "# bbappend образа с сорока строками задачи внутри", "with": "# rdk-generic-broadband-image.bbappend\nIMAGE_INSTALL:append = \" wave-rtlog\"\nrequire rtlog-scd-merge.inc", "benefit": "Второй образ подключает тот же код одной строкой, без копирования."}}, {"q": "Код надо вынести из bbappend. Что выбрать: require .inc или inherit .bbclass?", "options": ["bbclass: наследование быстрее разбирается и не требует указывать путь к файлу", "inc — когда файл меньше пятидесяти строк; больше — уже bbclass, таков порог", "inc — когда включаем блок кода; bbclass — когда наследуем поведение много рецептов", "bbclass всегда, потому что require из bbappend не резолвится и падает при разборе"], "correct": 2, "explain": "Раздел 1: «because we want to include some code in compact way not inherit some behavior. technically bbclass also works but I think include will be more suitable here». Класс — для поведения, которое наследуют многие рецепты; один образ с одним блоком кода — это include рядом с bbappend.", "usage": {"code": true, "without": "inherit rtlog_scd_merge", "with": "require rtlog-scd-merge.inc\n# если голое имя не резолвится из bbappend:\nrequire ${THISDIR}/rtlog-scd-merge.inc", "benefit": "Читатель видит включённый код, а не унаследованное поведение неизвестно откуда."}}, {"q": "Новый файл создан в 2026 году, баннер скопирован у соседа. Что поправить?\n```\n## Copyright 2020-2026 MaxLinear, Inc.\n## Copyright 2019-2020 Intel Corporation.\n## SPDX-License-Identifier: MIT\n```", "options": ["Заменить диапазон на год создания файла, а строку Intel решить осознанно", "Убрать SPDX: он нужен только в рецептах, которые объявляют собственную лицензию", "Ничего: баннер соседа копируется дословно, включая годы и сторонние строки", "Оставить диапазон, но добавить в него текущий год и убрать строку про лицензию"], "correct": 0, "explain": "Раздел 1 и третий круг ревью: предложено «## Copyright 2026 MaxLinear, Inc.» вместо «2020-2026» — файл не имеет истории, которую заявляет диапазон. Строка «Copyright 2019-2020 Intel Corporation.» приехала вместе с блоком, и по ней нужно решение до пуша, а не слепое наследование.", "usage": {"code": true, "without": "## Copyright 2020-2026 MaxLinear, Inc.", "with": "## Copyright 2026 MaxLinear, Inc.\n## SPDX-License-Identifier: MIT\n#\n# RT-Logger scd merge for WAVE images.", "benefit": "Баннер отражает происхождение файла, а не соседа по каталогу."}}, {"q": "Ревьюер снял «before do_build» у do_deploy и потребовал его у своей задачи. Противоречия здесь нет — почему?", "options": ["do_deploy наследуется из deploy.bbclass, а наследованные задачи не участвуют в графе сборки", "before do_build вообще устарел и заменён на addtask с флагом noexec в новых релизах", "do_deploy запускается раньше do_build по алфавиту имён задач, поэтому якорь ему не нужен", "Для do_deploy зависимость уже есть в base.bbclass, а для своей задачи такой нет"], "correct": 3, "explain": "Раздел 2: «The Yocto base class already includes do_deploy as a dependency of do_build, so addtask deploy after do_compile is sufficient» — в base.bbclass есть do_build[recrdeptask] += \"do_deploy\". Для do_rtlog_scd_merge такого нет, поэтому «after X» без «before do_build» оставляет задачу сиротой.", "usage": {"code": true, "without": "addtask deploy after do_compile before do_build   # избыточно\naddtask rtlog_scd_merge after do_image_complete   # сирота", "with": "addtask deploy after do_compile\naddtask rtlog_scd_merge after do_image_complete before do_build", "benefit": "Каждая задача достижима, и лишних якорей в рецепте нет."}}, {"q": "Чем доказать в PR, что задача действительно выполняется?\n```\nbitbake -g <image> >/dev/null 2>&1\ngrep -c '\"<image>.do_build\" -> \"<image>.do_X\"' task-depends.dot\n```", "options": ["Ключом -g выводится только список рецептов, поэтому для задач нужен bitbake-getvar", "Наличием штампа задачи в tmp/stamps: он появляется даже у недостижимых задач", "Строкой в логе сборки: если задача написана верно, bitbake упомянет её при разборе", "Ребром графа задач: ноль означает сироту, до которой сборка не доходит"], "correct": 3, "explain": "Раздел 2: достижимость доказывают графом, а не словами — bitbake -g строит task-depends.dot, и ребро от do_build к вашей задаче либо есть, либо его нет. Раздел 6 требует прикладывать доказательство к PR, а не пересказывать его.", "usage": {"code": true, "without": "«Задача добавлена, всё работает» — в описании PR без доказательства", "with": "bitbake -g <image> >/dev/null 2>&1\ngrep 'do_rtlog_scd_merge' task-depends.dot   # ребро от do_build в PR", "benefit": "Ревьюер видит факт, а не утверждение."}}, {"q": "Куда вешать зависимость на do_deploy трёх поставщиков?\n```\ndo_image_complete[depends] += \"wave-drv:do_deploy wav-spal:do_deploy\"\n```", "options": ["На do_image_complete: только он гарантированно выполняется после всех поставщиков", "На саму задачу, которой нужны эти файлы, и собрать список из одной переменной", "На рецепт целиком через DEPENDS: флаги задач для межрецептных связей не годятся", "На do_rootfs, потому что именно он собирает содержимое из выводов поставщиков"], "correct": 1, "explain": "Раздел 2: «I think this is not required when we start to use deploy bbclass» — зависимости идут на ту задачу, которой нужны файлы, а не на do_image_complete. Список поставщиков выводится из одной переменной, чтобы у него был единственный источник правды.", "usage": {"code": true, "without": "do_image_complete[depends] += \"wave-drv:do_deploy wav-spal:do_deploy\"", "with": "RTLOG_SCD_PROVIDERS ?= \"wave-drv wav-spal wave-fw\"\ndo_rtlog_scd_merge[depends] += \"${@' '.join('%s:do_deploy' % p for p in d.getVar('RTLOG_SCD_PROVIDERS').split())}\"", "benefit": "Список поставщиков правится в одном месте и не расходится с зависимостями."}}, {"q": "Ревьюер написал «move from the end here». Как должен выглядеть порядок строк в .inc?", "options": ["Функция, затем addtask, затем [depends] — объявление читается после реализации", "Переменные, [depends], addtask, пустая строка, обзорный комментарий, функция", "addtask в самом конце файла, чтобы он видел уже объявленную функцию задачи", "[depends] и addtask в отдельном bbappend, а в .inc остаётся только тело функции"], "correct": 1, "explain": "Раздел 2, третий круг ревью: «first you already have second you can move from the end and rename» — строка [depends] уже есть, addtask переносится с конца файла под неё. Объявление задачи и её зависимости читаются вместе, и после закрывающей скобки функции ничего не остаётся.", "usage": {"code": true, "without": "do_rtlog_scd_merge() {\n    ...\n}\n\naddtask rtlog_scd_merge after do_image_complete before do_build", "with": "do_rtlog_scd_merge[depends] += \"...\"\naddtask rtlog_scd_merge after do_image_complete before do_build\n\n# обзор процедуры слияния\ndo_rtlog_scd_merge() {\n    ...\n}", "benefit": "Читатель видит, когда задача запускается, до того как начнёт читать её тело."}}, {"q": "Первый вопрос ревьюера: «is it part of rootfs or something else which will be on site?». Что он проверяет?", "options": ["Не нужно ли положить артефакт в оба места сразу — и в rootfs, и рядом с образом", "Нужно ли вообще подключать образ: если артефакт не идёт в rootfs, хватит отдельного рецепта", "Хватит ли места в образе: артефакты вне rootfs всё равно увеличивают его размер", "Подписан ли артефакт: всё, что уезжает на объект, проходит через IMAGE_POSTPROCESS_COMMAND"], "correct": 1, "explain": "Раздел 3: ответ на этот вопрос решает раздел 1. Если артефакту нужен только do_deploy поставщиков, это отдельный небольшой рецепт с inherit deploy, и образ вообще не трогается. Одну фразу об этом кладут в описание PR до того, как ревьюер спросит.", "usage": {"code": false, "without": "PR молчит о назначении артефакта, и первый круг ревью уходит на выяснение.", "with": "В теле PR: «all.scdm не входит в rootfs, он ложится в DEPLOY_DIR_IMAGE рядом с образом для плагина WiresharkMXL».", "benefit": "Круг ревью тратится на код, а не на выяснение постановки."}}, {"q": "Задача сливает *.scd из DEPLOY_DIR_IMAGE. Почему LC_ALL=C не закрывает вопрос?", "options": ["LC_ALL=C влияет только на вывод сообщений, а порядок файлов задаёт файловая система", "LC_ALL=C даёт устойчивый порядок, но не устойчивый состав входа: каталог общий, а не ваш", "LC_ALL=C нужен только при сортировке кириллицы, для имён из латиницы он избыточен", "LC_ALL=C нельзя применять в задачах BitBake: переменная сбрасывается перед запуском тела"], "correct": 1, "explain": "Раздел 3: «Setting LC_ALL=C makes the wildcard order deterministic, but it does not make the input set deterministic». В общий каталог пишут прошлые сборки, удалённые поставщики и чужие рецепты, поэтому вход берут из явного манифеста: отсутствие перечисленного файла — отказ, лишний файл — bbwarn.", "usage": {"code": true, "without": "cat -- \"$dir\"/*.scd > \"$tmp\"", "with": "for f in ${RTLOG_SCD_FILES}; do\n  [ -f \"$dir/$f\" ] || bbfatal \"missing $dir/$f\"\n  cat -- \"$dir/$f\" >> \"$tmp\" || bbfatal \"cat failed on $f\"\ndone", "benefit": "Результат зависит от манифеста, а не от истории сборок."}}, {"q": "На что распространяется прогон sh-code-review перед отправкой PR?", "options": ["На каждое shell-тело в рецепте, классе и include и на каждый скрипт платы", "Только на скрипты платы: тела задач BitBake проверяются линтером рецептов отдельно", "На тела задач в рецептах, а скрипты платы проверяются только при изменении шапки", "Только на новые файлы: изменённые строки в существующих скриптах проверяет ревьюер"], "correct": 0, "explain": "Раздел 4: sh-code-review запускается на каждой shell-функции в рецепте, классе или include и на каждом скрипте платы. Там же раздел 8: AI-ревью прогоняют сами, до человека — «Did you try AI code review on that?» ревьюер спросит в любом случае.", "usage": {"code": false, "without": "Ревьюер сам прогоняет AI-ревью и возвращает двенадцать находок одним списком.", "with": "Перед пушем: sh-code-review по каждому телу, затем rdkb-arch-review по структуре.", "benefit": "Механические находки не тратят круг ревью живого человека."}}, {"q": "Изменение трогает три места: Makefile драйвера, скрипт в wav-spal и .inc в meta-wave. Что из этого оформляется нумерованным патчем?", "options": ["Только .inc: файлы слоя всегда патчатся, а исходники правятся напрямую", "Всё три: любое изменение в вендорском дереве идёт нумерованными патчами", "Ничего: нумерованные патчи заменяет devtool finish, он сам разложит правки", "Правки исходников подтягиваемых компонентов; файлы слоя — обычные коммиты"], "correct": 3, "explain": "Шаг 1: смотрим на владение, а не на тип файла — раздел 5 правил ревьюера. Шаг 2: .inc и bbappend принадлежат слою, значит это обычные коммиты. Шаг 3: исходники подтягиваемого компонента слою не принадлежат, поэтому правки к ним живут нумерованными патчами в files/; devtool finish стек патчей разрушает.", "usage": {"code": true, "without": "devtool finish wave-drv meta-wave   # стек патчей разъехался", "with": "# files/0001-....patch — правка исходников\n# .inc и bbappend — обычный коммит в слое", "benefit": "Историю правок компонента видно патчами, а слой живёт своей историей."}}, {"q": "Какой заголовок PR пройдёт ревью?", "options": ["`[RDKB] merge deployed scd databases into all.scdm (WLANRTSYS-103680)`", "`WLANRTSYS-103680: RTLOG — merge deployed scd databases into all.scdm`", "`WLANRTSYS-103680 [RDKB] [RTLOG] merge deployed scd databases into all.scdm`", "`WLANRTSYS-103680 [RDKB] merged deployed scd databases into all.scdm and fixed the addtask anchor`"], "correct": 2, "explain": "Шаг 1: раздел 6 задаёт форму — WLANRTSYS-NNNNN, затем обе скобки, затем короткое повелительное описание. Шаг 2: проверяем обе скобки: вариант без второй и вариант с двоеточием вместо скобок отпадают. Шаг 3: считаем длину — заголовок должен уложиться в семьдесят символов вместе со скобками, поэтому длинное перечисление не подходит.", "usage": {"code": true, "without": "Fix scd merge", "with": "WLANRTSYS-103680 [RDKB] [RTLOG] merge deployed scd databases into all.scdm", "benefit": "Тикет, область и суть видны в списке PR без открытия."}}, {"q": "Тело PR из трёх строк. Что здесь нарушено?\n```\nIssue: WLANRTSYS-103680\nSystem Impact: all.scdm is now merged from the deployed .scd files\nResolution: the task merges the deployed .scd files into all.scdm\n```", "options": ["System Impact и Resolution — одна и та же фраза, пересказанная дважды", "Issue должен идти последним, после описания изменения и его последствий", "Не хватает строки с именем ветки и хешем коммита, без них PR не принимают", "В System Impact нельзя упоминать имя артефакта, там пишут только номер тикета"], "correct": 0, "explain": "Шаг 1: раздел 6 требует, чтобы System Impact и Resolution не были одним предложением в двух формулировках. Шаг 2: System Impact — что увидит человек или тест по-другому; Resolution — механизм изменения одной фразой. Шаг 3: если изменение затрагивает несколько репозиториев, это отдельный PR на репозиторий, и соседние называются в System Impact.", "usage": {"code": true, "without": "System Impact: all.scdm is now merged\nResolution: the task merges the files into all.scdm", "with": "System Impact: WiresharkMXL decodes rtlog from a single all.scdm next to the image; companion PR in wav-spal\nResolution: a post-image task concatenates the deployed .scd files with a per-file marker", "benefit": "Видно и наблюдаемый эффект, и механизм — без пересказа одного другим."}}, {"q": "PR описывает рефакторинг: код переехал из bbappend в .inc, поведение не менялось. Чем это доказывают?", "options": ["Приложенными md5 артефакта до и после — у чистого переноса они совпадают", "Фразой «pure move, no functional change» в теле PR, этого достаточно для рефакторинга", "Скриншотом diff, где видно, что строки функции не изменились при переносе", "Зелёной сборкой: если образ собрался, перенос кода заведомо ничего не изменил"], "correct": 0, "explain": "Шаг 1: раздел 6 — доказательства прикладывают, а не пересказывают. Шаг 2: для чистого переноса доказательство — побайтовое совпадение результата, то есть md5 артефакта до и после. Шаг 3: по разделу 8 рефакторинг и изменение поведения живут в разных коммитах, и именно рефакторинг несёт это доказательство.", "usage": {"code": true, "without": "«Просто перенёс код, поведение не изменилось»", "with": "md5sum $D/all.scdm   # до переноса\nmd5sum $D/all.scdm   # после переноса, значение то же", "benefit": "Ревьюер проверяет факт за секунду и не перечитывает сорок строк."}}, {"q": "Задача уже корректна, но ревьюер просит «overview of this merge procedure, which format, what we do». Что он хочет увидеть над функцией?", "options": ["Построчный разбор алгоритма, чтобы код можно было читать не открывая функцию", "Ссылку на тикет и имя ревьюера, чтобы вопросы шли не в код, а в тред PR", "Две-три строки по существу: остальное относится к описанию тикета, а не к коду", "Формат входа, что процедура с ним делает и кто потребляет результат"], "correct": 3, "explain": "Шаг 1: правило коротких комментариев действует внутри функции — два-три слова и только там, где строка выглядит лишней. Шаг 2: над нетривиальной задачей ревьюер требует исключения: абзац-обзор. Шаг 3: в нём три вещи по порядку — что на входе и в каком формате, что процедура делает, кто читает результат; без формата ревьюер не может судить о разборе.", "usage": {"code": true, "without": "# Merge deployed .scd into all.scdm\ndo_rtlog_scd_merge() {", "with": "# Merge deployed .scd into one all.scdm for WiresharkMXL rtlog support.\n#\n# Each provider deploys its own .scd: plain text, one record per line, the\n# first letter is the record type. This task concatenates them with a marker\n# per file and drops the D records: the ELF is not shipped. The plugin reads\n# all.scdm from the directory the collector names in MXL_PATHS.\ndo_rtlog_scd_merge() {", "benefit": "Ревьюер судит о разборе формата, а не только о синтаксисе оболочки."}}, {"q": "Ревьюер вернул строку с просьбой добавить в неё $out. Зачем?\n```\nbbnote \"rtlog: all.scdm merged from $n database(s)\"\n```", "options": ["Полный путь копируется прямо из log.do_<task>, а имя заставляет искать файл руками", "Переменная $n без $out остаётся неопределённой, и сообщение выводится с пустым числом", "bbnote без переменной пути выводится только при уровне отладки выше первого", "Без $out сообщение не попадёт в лог задачи, а только в общий вывод сборки"], "correct": 0, "explain": "Шаг 1: раздел 7 — сообщение об артефакте называет его полным путём. Шаг 2: ревьюер читает log.do_<task> и копирует путь оттуда, чтобы открыть файл. Шаг 3: голое имя заставляет его идти искать, где именно этот all.scdm лежит, поэтому в сообщение подставляют переменную с полным путём.", "usage": {"code": true, "without": "bbnote \"rtlog: all.scdm merged from $n database(s)\"", "with": "bbnote \"rtlog: $out merged from $n database(s)\"", "benefit": "Путь к артефакту копируется из лога одним движением."}}, {"q": "Перед пометкой PR готовым в ветке три коммита. Какая последовательность верна?", "options": ["Бэкап-ветка, сброс --soft до merge-base, один коммит, сверка деревьев, push", "Сбросить ветку жёстко до merge-base, заново скопировать файлы и закоммитить их", "Сделать rebase -i с fixup, затем обычный push: force при squash не требуется", "Оставить три коммита: squash делает ревьюер при слиянии PR одной кнопкой"], "correct": 0, "explain": "Шаг 1: требование раздела 8 — «squash the commits - so it's one commit per PR», по одному коммиту над origin/wlan_master в каждом репозитории. Шаг 2: переписывание безопасно только с бэкап-веткой и проверкой, что дерево не изменилось: git diff --stat backup HEAD пуст. Шаг 3: пуш идёт с --force-with-lease, который откажет, если удалённая ветка сдвинулась после вашего fetch.", "usage": {"code": true, "without": "git push --force origin <branch>", "with": "git branch -f backup/<ticket>-pre-squash HEAD\ngit reset --soft \"$(git merge-base origin/wlan_master HEAD)\"\ngit commit -s -F ~/msg.txt\ngit diff --stat backup/<ticket>-pre-squash HEAD   # пусто\ngit push --force-with-lease origin <branch>", "benefit": "История чистая, дерево доказано тем же, а чужие правки не затёрты."}}, {"q": "Отвечая на шесть замечаний ревьюера, вы нашли ещё три своих улучшения: манифест вместо маски, awk вместо sed, ловушка на сигналы. Куда их девать?", "options": ["В тот же PR, но отдельными строками в описании, коммит при этом остаётся один", "В отдельный коммит или отдельный PR, чтобы список ревьюера совпадал с диффом", "В этот же коммит: чем больше исправлено за круг, тем меньше кругов останется", "Выбросить: улучшения, о которых ревьюер не просил, в дерево не попадают"], "correct": 1, "explain": "Шаг 1: раздел 8 — круг, отвечающий на ревью, содержит ровно правки ревьюера. Шаг 2: подмешанное усиление становится тем, что будет разбирать следующий круг, и список «Done» ревьюера перестаёт совпадать с диффом. Шаг 3: поэтому найденное самостоятельно уезжает в свой коммит или свой PR — так и было сделано на WLANRTSYS-103680, где в PR ушла минимальная версия .inc с маской.", "usage": {"code": false, "without": "В круг ответа на ревью подмешаны манифест, awk и ловушка — ревьюер разбирает их вместо своих правок.", "with": "Коммит 1: ровно правки ревьюера. Коммит или PR 2: манифест, awk, ловушка — с собственным обоснованием.", "benefit": "Ревьюер закрывает свои пункты, а усиление обсуждается отдельно."}}, {"q": "Ревьюер требует тест с кэшами. Что именно удаляют между двумя сборками?", "options": ["tmp, sstate-cache и downloads — иначе вторая сборка не будет честно чистой", "Только sstate-cache: он и отвечает за восстановление результатов задач", "Только tmp; sstate-cache, downloads и cache остаются на месте", "Ничего не удаляют, достаточно запустить сборку с ключом принудительной пересборки"], "correct": 2, "explain": "Шаг 1: цитата раздела 9 — «make a build then remove tmp folder (only tmp) and build once again». Шаг 2: смысл в том, чтобы sstate остался: вторая сборка поднимет do_deploy поставщиков из кэша через do_deploy_setscene, и ваша задача отработает против восстановленных файлов. Шаг 3: это ровно тот случай, который ловит свежий checkout на машине CI.", "usage": {"code": true, "without": "rm -rf tmp sstate-cache downloads   # проверили не тот сценарий", "with": "bitbake <image> && md5sum $D/all.scdm | tee ~/artifact.run1\nrm -rf $B/tmp\nbitbake <image> && md5sum $D/all.scdm | tee ~/artifact.run2\ndiff ~/artifact.run1 ~/artifact.run2 && echo \"md5 identical\"", "benefit": "Поведение с кэшами проверено до того, как на нём споткнётся CI."}}, {"q": "После второй сборки артефакт на месте и md5 совпал, но в log.do_rtlog_scd_merge есть строка WARNING. Что это значит?", "options": ["Тест пройден частично: достаточно упомянуть предупреждение в описании PR", "Тест провален: предупреждение в логе задачи считается отказом, даже если файл верен", "Тест пройден: главное — совпадение md5, предупреждения носят справочный характер", "Тест недостоверен: предупреждения в логах задач появляются при восстановлении из sstate всегда"], "correct": 1, "explain": "Шаг 1: раздел 10 — «don't rely only on output - also check logs of your task - that everything was as expected». Шаг 2: критерий прохождения включает отсутствие WARNING про задачу в обоих логах сборки, а не только совпадение md5. Шаг 3: наличие артефакта при предупреждении в логе — это провал теста, и лог прикладывают к PR рядом с md5.", "usage": {"code": true, "without": "Смотрят только на файл в deploy и считают задачу проверенной.", "with": "cp \"$(find $B/tmp/work -name 'log.do_rtlog_scd_merge' | head -1)\" ~/task.run2.log\ndiff ~/task.run1.log ~/task.run2.log", "benefit": "Скрытая деградация ловится до PR, а не на чужой сборке."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
