<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RCF 1: Основы ТАУ, моделирование (Лаплас), структурные схемы</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>RCF 1: Основы ТАУ, моделирование (Лаплас), структурные схемы</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

о измеряется датчиком", "Команда формируется из возмущения, а заданное значение игнорируется", "Команда вычисляется из измеренного угла, а задание подаётся на выход", "Команда вычисляется только из заданного значения, без измерения выхода"], "correct": 3, "explain": "Разомкнутое управление вычисляет команду только из reference и никогда не сверяется с реальным выходом, поэтому не может компенсировать возмущение или дрейф объекта. Session 1, слайды, Part 2.", "usage": {"code": false, "without": "Без понимания разомкнутой схемы легко ожидать от неё компенсации провисания сустава под нагрузкой, которой она дать не может.", "with": "Зная, что разомкнутое управление слепо к выходу, инженер сразу закладывает обратную связь там, где важна точность.", "benefit": "Разомкнутая схема проста и никогда не идёт вразнос, но не борется с возмущением."}}, {"q": "Что отличает замкнутое управление с отрицательной обратной связью от разомкнутого?", "options": ["Оно измеряет только возмущение и подаёт его прямо на объект", "Оно измеряет выход, формирует ошибку и постоянно корректирует команду", "Оно вычисляет команду один раз и больше не меняет её", "Оно игнорирует заданное значение и следует только за возмущением"], "correct": 1, "explain": "Замкнутое управление сравнивает измеренный выход с заданием, формирует ошибку e = r минус y и непрерывно подстраивает команду, что и позволяет бороться с возмущениями и дрейфом объекта. Session 1, слайды, Part 2.", "usage": {"code": false, "without": "Без обратной связи проседание батареи или нагрев мотора незаметно уводят сустав от цели.", "with": "С обратной связью контур сам подстраивает команду и держит угол даже при дрейфе параметров.", "benefit": "Постоянная коррекция по ошибке — источник точности и устойчивости к возмущениям замкнутого контура."}}, {"q": "Что на структурной схеме контура обозначается как сумматор или summing junction?", "options": ["Точка, где сигнал ответвляется, оставаясь неизменным на линии", "Блок, который умножает ошибку на коэффициент регулятора Kc", "Элемент, который складывает или вычитает сигналы и формирует ошибку", "Датчик, который преобразует угол сустава в электрический сигнал"], "correct": 2, "explain": "Сумматор на схеме — кружок со знаками, который складывает или вычитает входные сигналы, например образует e = r минус y. Первый вариант описывает pick-off point, второй — регулятор, четвёртый — датчик. Session 1, лекция §03.", "usage": {"code": false, "without": "Спутав сумматор с точкой ответвления, легко нарисовать контур без сравнения задания и выхода.", "with": "Узнавая сумматор на любой схеме, инженер быстро находит, где именно образуется ошибка контура.", "benefit": "Сумматор — единственное место схемы, где реально сравниваются задание и измерение."}}, {"q": "Что на структурной схеме контура обозначается точкой на линии и называется pick-off point?", "options": ["Точка на линии, где сигнал ответвляется, оставаясь неизменным", "Кружок со знаками, который складывает и вычитает сигналы", "Блок, который переводит ошибку в команду с коэффициентом Kc", "Датчик обратной связи, преобразующий угол в электрический сигнал"], "correct": 0, "explain": "Pick-off point — точка на схеме, где сигнал считывается дальше без изменения и без потребления, в отличие от сумматора, который складывает сигналы. Session 1, лекция §03.", "usage": {"code": false, "without": "Не отличая pick-off point от сумматора, легко решить, что ответвлённый сигнал где-то складывается или меняется.", "with": "Зная, что pick-off point не меняет сигнал, инженер уверенно проводит одну и ту же переменную в две ветки схемы.", "benefit": "Pick-off point позволяет один сигнал использовать сразу в нескольких местах контура без искажения."}}, {"q": "Какое свойство преобразования Лапласа обосновывает то, что реакцию линейной системы на сумму двух входных сигналов можно найти как сумму реакций на каждый сигнал по отдельности?", "options": ["Теорема о дифференцировании", "Линейность преобразования", "Теорема о конечном значении", "Теорема о начальном значении"], "correct": 1, "explain": "Линейность L{a·f+b·g}=a·F(s)+b·G(s) позволяет раскладывать сложный сигнал на простые слагаемые и складывать готовые реакции системы — это и есть принцип суперпозиции для линейных систем (Ogata, гл. 2).", "usage": {"code": false, "without": "Без линейности пришлось бы заново решать дифференциальное уравнение целиком для каждого нового составного входного сигнала.", "with": "Зная линейность, инженер раскладывает сложный сигнал на простые части и складывает уже известные реакции системы.", "benefit": "Ускоряет анализ сложных входных сигналов."}}, {"q": "Что добавляется при использовании теоремы о дифференцировании оригинала для перехода от df/dt к изображению, если начальное значение сигнала не равно нулю?", "options": ["Деление на квадрат оператора s", "Прибавление конечного значения", "Вычитание начального значения", "Умножение на постоянную времени"], "correct": 2, "explain": "По теореме о дифференцировании оригинала L{df/dt}=sF(s)-f(0): множитель s учитывает саму производную, а вычитаемое начальное значение f(0) — ненулевые начальные условия, без которых цепи с накопителями энергии нельзя было бы свести к алгебре (Ogata, гл. 2).", "usage": {"code": false, "without": "Без вычитания начального значения инженер получил бы неверный переходный процесс для механизма, стартующего не из состояния покоя.", "with": "Зная поправку на начальное значение, инженер корректно моделирует пуск двигателя из ненулевой начальной скорости.", "benefit": "Точный учёт начальных условий при переходных процессах."}}, {"q": "Теорема о начальном значении утверждает, что начальное значение оригинала f при t, стремящемся к нулю справа, равно пределу sF от s. При каком стремлении s этот предел берётся?", "options": ["Предел при s, стремящемся к бесконечности", "Предел при s, стремящемся к нулю сверху", "Предел при s, стремящемся к минус единице", "Предел при s, стремящемся к мнимой единице"], "correct": 0, "explain": "Теорема о начальном значении: f(0+)=lim s→∞ sF(s), при условии что этот предел существует; теорема удобна для быстрой проверки начального скачка сигнала без обратного преобразования Лапласа (Ogata, гл. 2).", "usage": {"code": false, "without": "Без теоремы пришлось бы находить оригинал f от t целиком, чтобы узнать его значение сразу после включения.", "with": "Зная теорему, инженер быстро проверяет начальный скачок тока в цепи прямо по изображению F от s, не находя оригинал.", "benefit": "Быстрая проверка начального значения сигнала по его изображению."}}, {"q": "В лабораторной работе замкнутый контур сустава при постоянном ступенчатом задании выходит на установившееся значение выхода, равное единице. Какая теорема преобразования Лапласа даёт это значение прямо из T от s, без решения переходного процесса во времени?", "options": ["Теорема свёртки сигналов", "Теорема запаздывания оригинала", "Теорема о начальном значении", "Теорема о конечном значении"], "correct": 3, "explain": "Теорема о конечном значении: f(∞)=lim s→0 sF(s), применима, когда все полюсы sF(s) лежат в левой полуплоскости; в лабораторной T(0)=1 подтверждает нулевую установившуюся ошибку по положению (Lab T1, Шаг 5).", "usage": {"code": false, "without": "Без теоремы пришлось бы прогонять симуляцию во времени до нескольких секунд, чтобы узнать установившееся значение выхода.", "with": "Зная теорему, инженер сразу подставляет s=0 в T от s и получает установившееся значение аналитически.", "benefit": "Мгновенная проверка установившейся ошибки без симуляции."}}, {"q": "В модели сустава G от s равно Km, делённое на s и на сумму тау s плюс единица, шаг «eliminating the armature current» перед выводом этой передаточной функции физически означает какое упрощение?", "options": ["Пренебрежение моментом инерции ротора двигателя", "Пренебрежение электрической постоянной времени якоря", "Пренебрежение механической постоянной времени нагрузки", "Пренебрежение сухим трением в зубьях редуктора"], "correct": 1, "explain": "Полная модель ДПТ включает электрическую цепь якоря и механическое уравнение нагрузки; исключение тока якоря — это отбрасывание быстрой электрической динамики, что сводит связку двигатель-нагрузка к апериодическому звену первого порядка по скорости с постоянной тау, а добавленный интегратор 1/s переводит скорость в угол (Lab T1, физическая модель).", "usage": {"code": false, "without": "Без этого упрощения пришлось бы решать электрическое и механическое уравнения совместно для каждого расчёта.", "with": "Зная, какое звено отброшено, инженер понимает границы применимости упрощённой модели привода.", "benefit": "Понимание допущений при выборе упрощённой модели привода."}}, {"q": "Редуктор с передаточным отношением N соединяет двигатель и нагрузку с моментом инерции нагрузки Jн. Как изменяется момент инерции нагрузки, приведённый к валу двигателя?", "options": ["Уменьшается в N раз линейно", "Не меняется при приведении к валу", "Уменьшается в N в квадрате раз", "Увеличивается в N в квадрате раз"], "correct": 2, "explain": "При приведении к валу двигателя момент инерции нагрузки делится на квадрат передаточного отношения редуктора, Jприв=Jн/N²; поэтому редуктор не только усиливает момент, но и заметно снижает ощущаемую двигателем инерцию нагрузки (Ogata, гл. 4; Siciliano, робототехника).", "usage": {"code": false, "without": "Без этого знания инженер выберет двигатель с завышенным моментом инерции ротора для тяжёлой нагрузки на прямом приводе.", "with": "Зная закон N в квадрате, инженер подбирает передаточное отношение так, чтобы нагрузка почти не ощущалась двигателем.", "benefit": "Правильный подбор передаточного отношения редуктора под нагрузку."}}, {"q": "Что по определению представляет собой передаточная функция линейной стационарной системы?", "options": ["Отношение изображений выхода и входа по Лапласу", "Отношение амплитуд гармоник на входе и выходе", "Отношение постоянных времени входа и выхода", "Отношение мгновенных значений сигналов во времени"], "correct": 0, "explain": "Передаточная функция T от s определяется как Y от s, делённое на X от s, изображений по Лапласу выхода и входа, при нулевых начальных условиях; это отношение полностью описывает линейную стационарную систему в операторной форме (Ogata, гл. 3).", "usage": {"code": false, "without": "Без этого определения нельзя было бы свести дифференциальное уравнение звена к простой алгебраической дроби.", "with": "Зная определение, инженер записывает звено сразу как дробь многочленов от s и комбинирует звенья алгебраически.", "benefit": "Алгебраическое описание динамики звена вместо дифференциального уравнения."}}, {"q": "Чем полюсы передаточной функции принципиально отличаются от её нулей?", "options": ["Полюсы существуют только у неустойчивых систем, нули — у всех", "Полюсы — корни числителя, нули — корни знаменателя", "Полюсы задают статический коэффициент усиления, нули — нет", "Полюсы — корни знаменателя, нули — корни числителя"], "correct": 3, "explain": "Полюсы передаточной функции — это корни её знаменателя, они же корни характеристического уравнения контура, и определяют устойчивость и характер переходного процесса; нули — корни числителя, они формируют форму отклика, но не входят в характеристическое уравнение (Ogata, гл. 3).", "usage": {"code": false, "without": "Без различения инженер мог бы спутать корень числителя с полюсом и сделать неверный вывод об устойчивости.", "with": "Зная различие, инженер сразу проверяет устойчивость по корням знаменателя, не отвлекаясь на нули.", "benefit": "Верная привязка устойчивости именно к полюсам передаточной функции."}}, {"q": "В модели сустава G от s равно Km, делённое на s и на сумму тау s плюс единица, полюс в нуле физически означает, что при отсутствии обратной связи сустав будет делать что?", "options": ["Возвращаться экспоненциально в исходное положение", "Дрейфовать без удерживающего момента привода", "Мгновенно останавливаться в заданной точке", "Колебаться незатухающе вокруг заданной точки"], "correct": 1, "explain": "Полюс в s=0 в модели Km/(s(τs+1)) — это чистый интегратор скорость-угол: без удерживающего момента и обратной связи сустав просто дрейфует, накапливая угол; второй полюс в s=-1/τ — это электромеханическое запаздывание самого двигателя (Lab T1, Шаг 2).", "usage": {"code": false, "without": "Без понимания этого полюса инженер не объяснит, почему разомкнутый сустав сползает под собственным весом.", "with": "Зная физический смысл полюса в нуле, инженер сразу понимает необходимость обратной связи для удержания позиции.", "benefit": "Понимание, почему разомкнутый привод без обратной связи не держит позицию."}}, {"q": "В алгебре структурных схем операции последовательного и параллельного соединения звеньев сводятся к каким действиям над их передаточными функциями?", "options": ["Последовательное — деление, параллельное — вычитание", "Последовательное — вычитание, параллельное — деление", "Последовательное — умножение, параллельное — сложение", "Последовательное — сложение, параллельное — умножение"], "correct": 2, "explain": "При последовательном соединении сигнал проходит через оба блока подряд, поэтому передаточные функции перемножаются; при параллельном соединении выходы двух ветвей складываются в одном сумматоре, поэтому передаточные функции складываются (Lab T1, Шаг 1).", "usage": {"code": false, "without": "Без этого правила инженер решал бы систему дифференциальных уравнений для каждой новой комбинации звеньев заново.", "with": "Зная правило, инженер сводит цепочку блоков к одной дроби двумя короткими операциями с массивами коэффициентов.", "benefit": "Быстрое сведение сложной схемы к одной передаточной функции."}}, {"q": "Промышленный робот-манипулятор на конвейере подаёт на привод сустава заранее рассчитанное по таблице напряжение и никогда не сравнивает его с фактическим углом, измеренным энкодером. По оси обратной связи как классифицировать этот контур?", "options": ["Следящая система, так как желаемый угол сустава меняется от детали к детали", "Непрерывная система, так как контроллер работает с аналоговым напряжением", "Линейная система, так как коэффициент передачи привода не зависит от угла", "Разомкнутое управление, так как выход контура никогда не сравнивается с заданием"], "correct": 3, "explain": "Признак оси обратной связи — сравнивается ли выход с заданием. Здесь напряжение берётся только из таблицы, выход не измеряется, значит контур разомкнутый; остальные варианты отвечают на другие оси классификации, а не на заданный вопрос. (Session 1, раздел «Open loop vs closed loop»)", "usage": {"code": false, "without": "Инженер решает, что раз есть таблица пересчёта углов, система уже достаточно умна и датчик ей не нужен.", "with": "Зная критерий сравнения выхода с заданием, инженер сразу видит, что просадка от нагрузки останется неисправленной.", "benefit": "Позволяет верно предсказать, что контур не скорректирует ошибку от нагрузки."}}, {"q": "Контроллер силы захвата гриппера робота непрерывно измеряет ток обмотки, вычитает его из заданного тока удержания и по этой разности подстраивает напряжение на приводе. По оси обратной связи как классифицировать этот контур?", "options": ["Регулятор, так как заданный ток удержания в этой задаче не меняется во времени", "Замкнутое управление, так как формируется ошибка между измеренным и заданным током", "Программное управление, так как ток удержания задаётся оператором заранее", "Дискретная система, так как ток измеряется датчиком с определённой частотой опроса"], "correct": 1, "explain": "Ось обратной связи спрашивает, измеряется ли выход и формируется ли ошибка; здесь ток измеряется и вычитается из задания, значит контур замкнутый. Остальные варианты верно описывают другие оси, но не отвечают на вопрос о наличии обратной связи. (Session 1, раздел «Open loop vs closed loop»)", "usage": {"code": false, "without": "Инженер путает наличие датчика тока с типом задающего воздействия и делает неверный вывод об устойчивости к дрейфу.", "with": "Понимая, что ошибка вычисляется из измеренного тока, инженер знает, что контур будет держать силу захвата при просадке батареи.", "benefit": "Даёт верный прогноз, что контур автоматически компенсирует отклонения тока."}}, {"q": "Контур поддержания температуры силового модуля привода сустава держит её на одном значении независимо от нагрузки. Контур того же робота, отвечающий за угол сустава при сварке шва, непрерывно отрабатывает меняющуюся во времени траекторию угла. Как классифицировать эти два контура по оси задающего воздействия?", "options": ["Оба контура — регуляторы, так как оба используют отрицательную обратную связь по датчику", "Температурный контур — следящая система, а контур угла — регулятор, так как температура важнее траектории", "Температурный контур — регулятор с постоянным заданием, а контур угла — следящая система с меняющимся заданием", "Оба контура — программные системы, так как оба выполняются по одной запрограммированной последовательности"], "correct": 2, "explain": "Ось задающего воздействия делит контуры на регулятор с постоянной уставкой и следящую систему с меняющимся заданием; наличие обратной связи здесь не относится к делу — оно у обоих контуров одинаковое. (Session 1, раздел «Classifying robot control systems»)", "usage": {"code": false, "without": "Инженер считает оба контура одинаковыми по назначению и настраивает их по одной методике.", "with": "Различая регулятор и следящую систему, инженер подбирает разные критерии качества для температуры и для траектории.", "benefit": "Помогает выбрать подходящий критерий качества под тип задающего воздействия."}}, {"q": "Модель привода сустава учитывает насыщение крутящего момента двигателя при больших токах и люфт в зубьях редуктора. Как это отражается на классификации контура по оси линейность/нелинейность при анализе вблизи рабочей точки?", "options": ["Контур нелинеен из-за насыщения и люфта, но анализируют линейное приближение у рабочей точки", "Контур становится дискретным, так как насыщение момента возможно только в цифровом контроллере", "Контур становится нестационарным, но остаётся линейным, так как его параметры меняются во времени", "Контур остаётся строго линейным, потому что редуктор лишь меняет коэффициент передачи сигнала"], "correct": 0, "explain": "Насыщение момента и люфт редуктора — типичные нелинейности, поэтому контур строго нелинеен; на практике для анализа вблизи рабочей точки строят линейное приближение. Остальные варианты путают эту ось со стационарностью или дискретностью. (Session 1, раздел «Classifying robot control systems»)", "usage": {"code": false, "without": "Инженер применяет к суставу только линейные формулы и не понимает, почему поведение при больших нагрузках расходится с расчётом.", "with": "Зная про нелинейности, инженер держит рабочую точку в диапазоне, где линейное приближение остаётся достоверным.", "benefit": "Предотвращает ошибочный расчёт динамики за пределами линейного участка."}}, {"q": "После того как гриппер робота захватывает тяжёлую деталь, эффективная инерция сустава и коэффициент усиления привода скачкообразно меняются на время удержания груза. Как это отражается на классификации контура по оси стационарности?", "options": ["Контур становится дискретным, так как масса детали известна только в моменты захвата", "Контур становится нелинейным, но сохраняет неизменные во времени параметры на всём цикле", "Контур остаётся регулятором, так как заданный угол сустава на интервале удержания не меняется", "Контур становится нестационарным на время удержания, так как параметры меняются во времени"], "correct": 3, "explain": "Ось стационарности спрашивает, зависят ли параметры модели от времени; скачок инерции и усиления при захвате делает контур нестационарным на этом интервале. Остальные варианты отвечают на вопросы про дискретность, нелинейность или тип задания. (Session 1, раздел «Classifying robot control systems»)", "usage": {"code": false, "without": "Инженер настраивает регулятор один раз под пустой гриппер и получает разное качество после вилом обратной связи, а C прибавить отдельным параллельным слагаемым", "Объединить C, G и H одновременно правилом параллельного соединения, сложив три передаточные функции", "Сначала применить правило обратной связи к C и H, а затем умножить результат на G", "Сначала объединить C и G последовательным соединением, затем свернуть с H правилом обратной связи"], "correct": 3, "explain": "Регулятор и объект стоят последовательно в прямом канале, поэтому их сначала объединяют правилом series, а затем весь прямой канал сворачивают с датчиком H правилом feedback. Остальной порядок операций не соответствует реальной топологии схемы. (labT1-lab.txt, series/feedback reducers)", "usage": {"code": false, "without": "Инженер сворачивает G и H раньше C и получает передаточную функцию с неверно расположенным регулятором.", "with": "Соблюдая порядок series, затем feedback, инженер получает правильную замкнутую передаточную функцию контура.", "benefit": "Гарантирует верный результат приведения схемы за две операции."}}, {"q": "При сведении структурной схемы сустава к одной передаточной функции инженер по ошибке записал знаменатель замкнутого контура как 1 минус GH вместо 1 плюс GH. К какому эффекту это приведёт при отрицательной обратной связи?", "options": ["Передаточная функция потеряет полюс в нуле, но останется физически верной", "Модель опишет не отрицательную, а положительную обратную связь и может стать неустойчивой", "Результат не изменится, так как знак в знаменателе не влияет на полюсы системы", "Модель останется корректной, потому что минус компенсируется отрицательным знаком датчика H"], "correct": 1, "explain": "Знаменатель 1 плюс GH получается именно для отрицательной обратной связи; знак минус в знаменателе соответствует положительной обратной связи, которая может дать полюс в правой полуплоскости и неустойчивость. (labT1-lab.txt, LLM output про закрытый контур)", "usage": {"code": false, "without": "Инженер принимает готовую формулу от ассистента на веру и сертифициру т часть момента, ведь трение в зубчатой передаче полностью компенсирует любую нагрузку", "Возмущение от гравитации проходит на выход без ослабления, ведь контроллер не измеряет реальный угол и не может его скорректировать"], "correct": 3, "explain": "Без обратной связи возмущение gravity проходит к выходу с коэффициентом 1, тогда как замкнутый контур ослабляет его в 1 плюс L раз, поэтому открытый контур сохраняет всю ошибку от нагрузки. Session 1, раздел Open loop vs closed loop.", "usage": {"code": false, "without": "Без этого понимания инженер будет искать проблему в редукторе или энкодере вместо отсутствующей обратной связи.", "with": "Понимая механизм, инженер сразу добавляет измерение угла в контур вместо подбора нового напряжения.", "benefit": "Экономит время диагностики просадки под нагрузкой."}}, {"q": "Гриппер на конце сустава манипулятора захватывает тяжёлую деталь, и эффективная инерция нагрузки на валу сустава резко возрастает. Замкнутый контур с пропорциональным регулятором уже настроен и работает. Что из перечисленного точнее всего описывает влияние этого изменения на контур?", "options": ["Контур автоматически пересчитывает передаточную функцию сустава, поэтому изменение инерции не влияет на поведение вовсе", "Модель объекта управления перестаёт точно совпадать с реальным суставом, но обратная связь продолжает подавлять возникающее рассогласование", "Задающее воздействие смещается, поэтому контроллер начинает удерживать сустав в новой целевой точке", "Датчик угла теряет точность измерения, поэтому ошибка появляется именно из-за энкодера, а не из-за инерции"], "correct": 1, "explain": "Захват груза меняет реальный plant, то есть модель отклоняется от эффективной инерции; именно такие изменения feedback прощает лучше открытого контура, подавляя возникшее рассогласование, а не устраняя саму причину. Session 1, раздел про model error и gain drift.", "usage": {"code": false, "without": "Без понимания дрейфа модели инженер может решить, что после захвата детали нужно вручную перенастраивать регулятор при каждом изменении груза.", "with": "Зная, что feedback терпит такие изменения модели, инженер закладывает запас устойчивости вместо ручной перенастройки под каждый груз.", "benefit": "Меньше ручной настройки контура под конкретный захватываемый объект."}}, {"q": "Сустав, подводящий гриппер к ячейке в pick-and-place операции, настроен с малым демпфированием: переходная характеристика показывает заметный overshoot, и гриппер иногда задевает стенку ячейки. Что стоит изменить в первую очередь, чтобы устранить эту проблему?", "options": ["Увеличить коэффициент передачи датчика, ведь именно он задаёт амплитуду overshoot на выходе", "Уменьшить задающее воздействие, ведь меньший заданный угол снижает риск удара о стенку", "Увеличить демпфирование контура, ведь именно оно определяет величину overshoot переходного процесса", "Увеличить инерцию звена, ведь более тяжёлое звено гасит любые колебания системы"], "correct": 2, "explain": "Overshoot переходной характеристики второго порядка определяется коэффициентом демпфирования zeta; повышая демпфирование ценой некоторой скорости, overshoot можно убрать без изменения задания. Session 1, раздел про overshoot и settling time.", "usage": {"code": false, "without": "Без этого знания инженер может пытаться убрать удар о стенку, меняя задание или датчик, не трогая настоящую причину.", "with": "Понимая связь overshoot с демпфированием, инженер сразу правит коэффициенты регулятора.", "benefit": "Прямое устранение причины удара гриппера о стенку вместо обходных мер."}}, {"q": "Из-за нагрева двигателя и износа редуктора коэффициент передачи объекта управления сустава со временем дрейфует на плюс 50 процентов от номинала. Как это отразится на выходном угле разомкнутого и замкнутого контура при одинаковой поданной команде?", "options": ["Выход разомкнутого контура сместится примерно на 50 процентов, а выход замкнутого контура почти не изменится благодаря большому петлевому усилению", "Выход замкнутого контура сместится примерно на 50 процентов, а разомкнутый контур останется точным благодаря простоте схемы", "Ни один из контуров не изменит выход, ведь редуктор компенсирует любой дрейф коэффициента передачи двигателя", "Оба контура сместятся примерно на 50 процентов, ведь дрейф коэффициента передачи не зависит от наличия обратной связи"], "correct": 0, "explain": "Открытый контур напрямую передаёт изменение коэффициента объекта управления на выход, тогда как замкнутый контур делит чувствительность к дрейфу plant на 1 плюс L, поэтому итоговое отклонение оказывается на порядок меньше. Session 1, раздел про model error и sensitivity.", "usage": {"code": false, "without": "Без этого понимания легко ошибочно понадеяться на открытый контур в приводе, который со временем изнашивается.", "with": "Зная разницу в чувствительности, инженер закладывает обратную связь именно там, где ожидается дрейф параметров со временем.", "benefit": "Устойчивость к старению редуктора и нагреву двигателя без переналадки."}}, {"q": "Мобильный робот держит постоянную скорость движения по маршруту, используя энкодер колеса и контроллер скорости привода. На затяжном подъёме нагрузка на привод возрастает. Как правильно классифицировать эту систему и назвать основное возмущение?", "options": ["Это система слежения за траекторией, а возмущением служит показание энкодера колеса", "Это программное управление по заранее заданной программе, а возмущением служит команда оператора на скорость", "Это система регулирования с постоянным заданием, а возмущением служит сам энкодер, искажающий измерение скорости", "Это система регулирования с постоянным заданием, а возмущением служит уклон дороги, меняющий требуемый момент"], "correct": 3, "explain": "Постоянная скорость — это regulator-задача с фиксированным reference, а уклон дороги, меняющий требуемый момент привода, и есть классическое возмущение disturbance. Session 1, раздел про mobile-robot wheel-speed cruise loop.", "usage": {"code": false, "without": "Без верной классификации инженер может искать возмущение там, где на самом деле находится датчик.", "with": "Верно определив ось классификации, инженер знает, что нужно рассчитывать запас по моменту именно на подъёмах.", "benefit": "Точный подбор требований к приводу под реальный профиль трассы."}}, {"q": "Мобильный робот держит скорость колеса, подавая на привод фиксированное напряжение без обратной связи по энкодеру. На подъёме до 8 градусов скорость проседает примерно на 20 процентов от заданной. Почему открытый контур допускает такую просадку скорости?", "options": ["Энкодер колеса перестаёт работать на уклоне, поэтому контроллер получает неверные данные о скорости", "Дополнительный момент от уклона действует как возмущение на выходе, а без измерения скорости контроллер не может скорректировать напряжение", "Задающее воздействие автоматически уменьшается контроллером при обнаружении подъёма", "Привод физически не способен развивать нужный момент независимо от схемы управления"], "correct": 1, "explain": "Уклон добавляет момент нагрузки, который действует как disturbance на выходе plant; без обратной связи по скорости колеса контроллер не видит этой просадки и не может её компенсировать. Session 1, раздел про disturbance rejection, пример мобильного робота на подъёме.", "usage": {"code": false, "without": "Без этого понимания инженер может винить сам привод в недостатке момента, хотя проблема в отсутствии обратной связи.", "with": "Понимая причину, инженер добавляет обратную связь по энкодеру колеса вместо замены привода на более мощный.", "benefit": "Устраняет просадку скорости на подъёме без лишних затрат на более мощный привод."}}, {"q": "При выводе передаточной функции замкнутого контура сустава с отрицательной обратной связью нейросеть выдала цепочку из четырёх строк, из которых ровно одна содержит уверенно поданную ошибку в знаке. Как эта ошибка будет обнаружена наверняка, а не на глаз?", "options": ["Проверить, что все четыре строки вывода написаны одинаковым шрифтом и одинаковым стилем формул", "Спросить ту же нейросеть, уверена ли она в своём выводе, и принять её итоговый ответ", "Пересчитать полюсы получившейся передаточной функции численно и сравнить их с ожидаемым знаком действительной части", "Сравнить длину итоговой формулы с длиной формулы объекта управления без обратной связи"], "correct": 2, "explain": "Флипнутый знак в сумматоре ошибки превращает устойчивый контур в неустойчивый, и это надёжно видно только по численно пересчитанным полюсам, а не по виду формулы. Lab T1, раздел LLM output closed-loop transfer function.", "usage": {"code": false, "without": "Без численной проверки полюсов уверенно оформленная ошибка знака проходит незамеченной прямо в код контроллера.", "with": "Пересчитывая полюсы после каждого символьного вывода, инженер ловит флип знака прежде, чем он окажется в реальном приводе.", "benefit": "Исключает риск сертифицировать неустойчивый контур как безопасный."}}, {"q": "При записи модели сустава как полинома numpy.roots вернул для разомкнутого контура полюсы минус 2 и 0. Один студент проигнорировал полюс в нуле, посчитав его вычислительной погрешностью округления. Чем опасна такая интерпретация?", "options": ["Полюс в нуле — это интегратор положения, и его игнорирование скрывает, что сустав без обратной связи будет непрерывно дрейфовать, а не просто медленно затухать", "Полюс в нуле всегда является ошибкой округления numpy, и его действительно можно смело отбрасывать", "Полюс в нуле означает, что сустав абсолютно устойчив и обратная связь ему вообще не требуется", "Полюс в нуле относится только к датчику угла и не влияет на поведение самого сустава"], "correct": 0, "explain": "Полюс на нуле в модели сустава — это интегратор положения: без удерживающего момента сустав именно дрейфует, а не просто медленно затухает, поэтому его нельзя списывать на погрешность округления. Lab T1, раздел Step 2 open-loop poles.", "usage": {"code": false, "without": "Списав нулевой полюс на округление, инженер не заметит, что сустав без обратной связи будет непрерывно уходить от заданного угла.", "with": "Опознав интегратор положения, инженер сразу понимает, зачем контуру обязательно нужна обратная связь по углу.", "benefit": "Предотвращает ложный вывод об устойчивости сустава без обратной связи."}}, {"q": "В контуре сустава коррекция приходит с задержкой из-за запаздывания датчика, а инженер поднимает коэффициент усиления регулятора, чтобы быстрее подавлять возмущения. Что произойдёт с поведением сустава при слишком большом усилении в этих условиях?", "options": ["Задержка датчика исчезнет сама собой, ведь большее усиление компенсирует любое запаздывание измерения", "Ошибка слежения гарантированно упадёт до нуля, ведь усиление регулятора определяет только точность, а не устойчивость", "Сустав станет вести себя строго как разомкнутый контур, полностью игнорируя измерения датчика", "Контроллер начнёт перекорректировать с опозданием, и сустав перейдёт от плавного слежения к раскачивающимся колебаниям"], "correct": 3, "explain": "При запаздывании измерения слишком большое усиление приводит к тому, что коррекция приходит с опозданием и перекорректирует уже устаревшую ошибку, раскачивая контур; открытый контур на такое не способен, потому что вообще не реагирует на себя. Session 1, раздел про delay и oscillation.", "usage": {"code": false, "without": "Не зная этой границы, инженер поднимает усиление в попытке ускорить контур и получает раскачивающийся сустав вместо более быстрого.", "with": "Зная риск запаздывания, инженер ищет баланс усиления и задержки прежде, чем гнаться за скоростью реакции.", "benefit": "Предотвращает превращение сустава в колеблющуюся систему при погоне за быстродействием."}}, {"q": "Дана функция f(t)=5·e^{-3t} при t больше либо равно нулю. Найдите её изображение по Лапласу F(s), используя свойство линейности и табличную пару для затухающей экспоненты e^{-at}.", "options": ["5/[s-3]", "15/[s+3]", "5/[s+3]", "3/[s+5]"], "correct": 2, "explain": I(s). Шаг 2: делим числитель и знаменатель на J=2: Ω(s)/I(s)=(K/J)/(s+b/J)=5/(s+2). Шаг 3: проверка подстановкой K/J=5, b/J=2 подтверждает результат; частая ошибка — забыть разделить на J только числитель (10/(s+2)) либо только свободный член (5/(s+4)). (labT1-lab.txt, звено момент-скорость).", "usage": {"code": false, "without": "Без вывода этой передаточной функции нельзя предсказать, как скорость вала реагирует на ток якоря при управлении суставом.", "with": "Зная Ω(s)/I(s)=K/(Js+b), сразу подбирают усиление контроллера тока под нужную динамику привода.", "benefit": "Даёт готовую модель привода для последующего замыкания контура скорости."}}, {"q": "Звено момент-скорость привода имеет передаточную функцию Ω(s)/I(s)=5/(s+2). Найдите полюс этой передаточной функции и её постоянную времени.", "options": ["полюс s=-2.00, постоянная времени 2.00 с", "полюс s=-2.00, постоянная времени 0.50 с", "полюс s=-5.00, постоянная времени 0.20 с", "полюс s=+2.00, постоянная времени 0.50 с"], "correct": 1, "explain": "Шаг 1: полюс — корень знаменателя s+2=0, то есть s=-2. Шаг 2: приводим знаменатель к виду τs+1, деля s+2 на 2, получаем 0.5s+1. Шаг 3: отсюда τ=0.5 с — время достижения 63 процентов установившегося значения; частые ошибки — перепутать знак полюса или забыть взять обратную величину для τ. (Ogata, гл. 4, апериодическое звено первого порядка).", "usage": {"code": false, "without": "Не зная связи полюса и постоянной времени, нельзя оценить, за сколько секунд привод сустава выйдет на новую скорость.", "with": "Через τ=1/|полюс| сразу оценивают время реакции звена без построения полного переходного процесса.", "benefit": "Быстро прикидывает быстродействие привода на этапе выбора двигателя."}}, {"q": "Момент инерции нагрузки на выходном валу редуктора равен 0.5 кг·м², передаточное число редуктора N=10 (скорость двигателя в 10 раз выше скорости нагрузки). Найдите момент инерции нагрузки, приведённый к валу двигателя.", "options": ["0.050 кг·м²", "50.000 кг·м²", "0.005 кг·м²", "5.000 кг·м²"], "correct": 2, "explain": "Шаг 1: при приведении инерции нагрузки к валу двигателя её значение делят на квадрат передаточного числа: J_прив=J_нагр/N². Шаг 2: подставляем J_нагр=0.5 кг·м² и N=10, считаем N²=100. Шаг 3: J_прив=0.5/100=0.005 кг·м²; частые ошибки — разделить только на N без квадрата (0.05) или, наоборот, умножить вместо деления (50.000 или 5.000). (Session 1, приведение инерции нагрузки через редуктор J/N²).", "usage": {"code": false, "without": "Без приведения инерции через N² инженер завышает нагрузку на двигатель в разы и выбирает привод намного мощнее нужного.", "with": "Приведённая инерция J/N² показывает, что редуктор резко облегчает разгон нагрузки, видимой двигателем.", "benefit": "Позволяет корректно подобрать двигатель по моменту инерции для сустава с редуктором."}}, {"q": "Другой привод описан уравнением J·dω/dt + b·ω = K·i, где J=4 кг·м², b=2 Н·м·с, K=6 Н·м/А. Найдите полюс передаточной функции Ω(s)/I(s) и постоянную времени звена.", "options": ["полюс s=-0.50, постоянная времени 2.00 с", "полюс s=-2.00, постоянная времени 0.50 с", "полюс s=-0.50, постоянная времени 0.50 с", "полюс s=-1.00, постоянная времени 1.00 с"], "correct": 0, "explain": "Шаг 1: делим уравнение на J: Ω(s)/I(s)=(K/J)/(s+b/J), при J=4,b=2,K=6 получаем b/J=0.5, то есть полюс s=-0.5. Шаг 2: приводим знаменатель к виду τs+1, деля s+0.5 на 0.5, получаем τ=1/0.5=2 с. Шаг 3: проверка τ=J/b=4/2=2 с совпадает; частая ошибка — перепутать местами значения полюса и постоянной времени. (labT1-lab.txt, связь полюса апериодического звена с τ=J/b).", "usage": {"code": false, "without": "Без пересчёта полюса в постоянную времени сложно на глаз оценить, догонит ли привод команду скорости за отведённое время цикла.", "with": "Постоянная времени τ=J/b сразу даёт оценку в секундах, за сколько скорость вала выйдет на 63 процента от целевой.", "benefit": "Помогает быстро сравнивать быстродействие разных приводов по одному числу."}}, {"q": "Прямой путь контура положения образо а имеет передаточную функцию T(s)=20/(s+12). На вход подаётся ступенька величиной 5. Используя теорему о конечном значении, найдите установившееся значение выхода.", "options": ["y на бесконечности ≈ 1.67", "y на бесконечности ≈ 5.00", "y на бесконечности ≈ 8.33", "y на бесконечности ≈ 100.00"], "correct": 2, "explain": "Шаг 1: теорема о конечном значении: предел y(t) при t к бесконечности равен пределу s·Y(s) при s к нулю. Шаг 2: при ступеньке величиной 5 изображение R(s)=5/s, тогда s·T(s)·R(s)=s·[20/(s+12)]·[5/s]=100/(s+12). Шаг 3: подставляем s=0, получаем 100/12 приблизительно 8.33; частые ошибки — забыть величину ступеньки и взять просто T(0) (1.67) или забыть разделить на 12 (100.00). (Ogata, гл. 2, теорема о конечном значении).", "usage": {"code": false, "without": "Без теоремы о конечном значении пришлось бы моделировать весь переходный процесс, чтобы узнать, куда придёт скорость сустава.", "with": "Теорема о конечном значении сразу по T(s) и величине команды даёт установившуюся скорость без интегрирования во времени.", "benefit": "Быстро проверяет, устранена ли статическая ошибка контура при заданном входе."}}, {"q": "Три звена соединены последовательно: G1(s)=2/(s+1), G2(s)=3, G3(s)=1/(s+4). Найдите эквивалентную передаточную функцию цепочки G(s)=G1·G2·G3 в виде одной дроби с раскрытым знаменателем.", "options": ["6/[s²+5s+4]", "6/[s²+4s+4]", "6/[s²+5s+3]", "12/[s²+5s+4]"], "correct": 0, "explain": "Шаг 1: для последовательного соединения эквивалентная передаточная функция равна произведению G1·G2·G3. Шаг 2: числители перемножаем 2·3·1=6, знаменатели перемножаем (s+1)(s+4). Шаг 3: раскрываем скобки (s+1)(s+4)=s²+5s+4, итог G(s)=6/(s²+5s+4); частые ошибки — ошибиться в коэффициенте при s (s²+4s+4 или s²+5s+3) или в числителе (12/(s²+5s+4)). (Session 1, правило последовательного соединения звеньев).", "usage": {"code": false, "without": "Без сведения цепочки блоков к одной ПФ инженер моделирует каждый блок отдельно и складывает погрешности вручную.", "with": "Свернув три последовательных блока в одну передаточную функцию, сразу видно порядок системы и её полюсы.", "benefit": "Упрощает анализ устойчивости и расчёт переходного процесса всей цепочки сразу."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
