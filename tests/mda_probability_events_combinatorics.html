<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDA 4: Вероятность: события, классическое определение, комбинаторика</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .question pre.qcode { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #0f1117; border: 1px solid var(--border); overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; color: #d7dbe8; }
  .opt code.optcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88rem; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
    .question pre.qcode { background: #eceef7; color: #23262f; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>MDA 4: Вероятность: события, классическое определение, комбинаторика</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

(function () {

  const QUESTIONS = [{"q": "Какое свойство обязательно присуще случайному эксперименту по определению из лекции?", "options": ["Результат случайного опыта известен заранее, а множество исходов определяется только после его окончания", "Случайный эксперимент по определению нельзя провести повторно в одинаковых условиях", "Множество возможных исходов зафиксировано заранее, а сам результат опыта непредсказуем до его проведения", "Множество возможных исходов каждый раз меняется при новом повторении одного и того же эксперимента"], "correct": 2, "explain": "По лекции случайный эксперимент можно повторять в одинаковых условиях, множество всех исходов известно заранее, а конкретный исход нельзя предсказать до опыта; вариант с известным заранее результатом меняет местами известное и неизвестное. (lecture_1, стр. 8)", "usage": {"code": false, "without": "Без этого знания студент путает случайный эксперимент с любым измерением и не понимает, зачем вообще нужна теория вероятностей.", "with": "Зная определение, аналитик правильно отделяет воспроизводимые случайные опыты от разовых событий при построении модели данных.", "benefit": "Корректная постановка случайного эксперимента как основа всех дальнейших расчётов вероятностей."}}, {"q": "Как называется множество всех возможных элементарных исходов случайного эксперимента и чем оно принято обозначаться?", "options": ["Пространство элементарных исходов, которое принято обозначать заглавной греческой буквой омега", "Случайное событие, которое по сложившейся традиции принято обозначать заглавной латинской буквой A", "Полная группа событий, которая принято обозначать набором заглавных букв B с индексами", "Противоположное событие, которое принято обозначать буквой A с чертой сверху, например буквой Ā"], "correct": 0, "explain": "Множество всех возможных элементарных исходов называется пространством элементарных исходов и обозначается Ω; событие, в отличие от него, это лишь подмножество этого пространства. (lecture_1, стр. 14)", "usage": {"code": false, "without": "Без понятия пространства элементарных исходов невозможно корректно посчитать вероятность методом классического определения.", "with": "Явно выписав Ω, аналитик точно знает знаменатель формулы вероятности и не путает события с исходами.", "benefit": "Правильный знаменатель m делить на n при расчёте вероятностей."}}, {"q": "Чем элементарный исход принципиально отличается от составного события?", "options": ["Элементарный исход состоит из двух точек пространства, а составное событие — ровно из одной точки", "Элементарный исход существует только в геометрической вероятности, а составное событие — только в классической", "Элементарный исход и составное событие — это два разных названия одного и того же математического понятия в теории вероятностей", "Элементарный исход — это одна точка выборочного пространства, а составное событие объединяет несколько таких точек"], "correct": 3, "explain": "Элементарный исход — неделимая точка выборочного пространства, а составное событие объединяет несколько элементарных исходов, как показано на примерах C, F, G в лекции. (lecture_1, стр. 13)", "usage": {"code": false, "without": "Без различения элементарного и составного события студент не понимает, как событие вообще строится из исходов.", "with": "Понимая разницу, аналитик легко описывает сложные события как объединение простых исходов для подсчёта их числа.", "benefit": "Верное построение множества исходов, благоприятствующих сложному событию."}}, {"q": "Как соотносятся достоверное и невозможное события с пространством элементарных исходов Ω?", "options": ["Невозможное событие совпадает со всем пространством исходов, а достоверное является пустым множеством", "Достоверное событие совпадает со всем пространством исходов, а невозможное является пустым множеством", "Элементарное событие совпадает со всем пространством исходов, а составное является пустым множеством", "Совместное событие совпадает со всем пространством исходов, а несовместное является пустым множеством"], "correct": 1, "explain": "Достоверное событие совпадает со всем пространством Ω и наступает всегда, а невозможное событие равно пустому множеству и никогда не реализуется. (lecture_1, стр. 17)", "usage": {"code": false, "without": "Не различая достоверное и невозможное события, легко присвоить вероятность 1 событию, которое на самом деле может не произойти.", "with": "Зная определения, аналитик сразу проверяет граничные случаи модели: вероятность 0 и 1 как крайние значения шкалы.", "benefit": "Правильная интерпретация крайних значений вероятности при проверке модели."}}, {"q": "Что означает произведение событий A и B, записываемое как A·B?", "options": ["Ненаступление ни события A, ни события B в результате одного и того же опыта", "Наступление события A при условии, что событие B уже заведомо произошло ранее", "Одновременное наступление и события A, и события B в результате одного и того же опыта", "Наступление хотя бы одного из событий A или B в результате одного и того же опыта"], "correct": 2, "explain": "Произведение A·B — это пересечение множеств исходов, то есть одновременное наступление обоих событий; наступление хотя бы одного из них описывает сумму событий, а не произведение. (lecture_1, стр. 20)", "usage": {"code": false, "without": "Путая сумму и произведение событий, легко перепутать формулу вероятности хотя бы одного события с формулой вероятности обоих сразу.", "with": "Различая операции, аналитик верно выбирает между сложением и умножением вероятностей при построении сложного события.", "benefit": "Корректный выбор формулы при комбинировании нескольких событий."}}, {"q": "Что означает утверждение, что события A и B являются несовместными?", "options": ["Пересечение событий A и B пусто, и оба события не могут произойти одновременно", "Вероятности событий A и B в этом случае всегда оказываются в точности равны", "Объединение событий A и B совпадает со всем пространством элементарных исходов эксперимента", "Наступление события A всегда влечёт за собой обязательное наступление события B"], "correct": 0, "explain": "Несовместные события по определению не могут произойти одновременно, что формально означает пустое пересечение их множеств исходов A·B равно пустому множеству. (lecture_1, стр. 21)", "usage": {"code": false, "without": "Не зная признака несовместности, студент применяет формулу сложения вероятностей там, где нужно вычитать пересечение.", "with": "Проверив пустоту пересечения, аналитик применяет упрощённую формулу сложения только тогда, когда это действительно допустимо.", "benefit": "Правильный выбор между простой и полной формулой вероятности суммы событий."}}, {"q": "Что представляет собой противоположное событие Ā по отношению к событию A?", "options": ["Событие, вероятность которого всегда в точности равна вероятности самого события A", "Событие, которое совпадает с пересечением события A и пустого множества исходов", "Событие, которое наступает одновременно с событием A и не может наступить отдельно", "Событие, которое наступает ровно тогда, когда событие A не наступает в опыте"], "correct": 3, "explain": "Противоположное событие Ā наступает ровно тогда, когда исходное событие A не наступает, и вместе они образуют всё пространство исходов. (lecture_1, стр. 23)", "usage": {"code": false, "without": "Без понятия противоположного события сложно быстро оценить вероятность через более простое дополнение задачи.", "with": "Используя дополнение, аналитик считает сложную вероятность как единицу минус вероятность простого противоположного события.", "benefit": "Быстрый расчёт вероятности через её дополнение до единицы."}}, {"q": "Каким условиям должны удовлетворять события, образующие полную группу несовместных событий?", "options": ["Сумма вероятностей произвольных двух событий группы всегда в точности равна единице", "Сумма всех событий группы равна достоверному событию, а любые два из них несовместны", "Каждое событие группы является подмножеством любого другого события этой же группы", "Произведение всех событий группы равно достоверному событию всего пространства исходов"], "correct": 1, "explain": "Полная группа несовместных событий должна в сумме давать достоверное событие Ω, при этом любая пара событий группы несовместна между собой. (lecture_1, стр. 26)", "usage": {"code": false, "without": "Не проверив условия полной группы, легко ошибочно применить сумму вероятностей там, где события частично пересекаются.", "with": "Убедившись, что события образуют полную группу, аналитик уверенно использует их как основу для формулы полной вероятности.", "benefit": "Надёжная основа для дальнейшего применения формулы полной вероятности."}}, {"q": "Как вычисляется вероятность события A по классическому определению при конечном и равновозможном пространстве исходов?", "options": ["Произведение числа благоприятных исходов на общее число элементарных исходов эксперимента", "Отношение числа опытов, в которых событие не наступило, к общему числу опытов", "Отношение числа исходов, благоприятствующих событию, к общему числу элементарных исходов", "Разность между общим числом элементарных исходов и числом благоприятных для события исходов"], "correct": 2, "explain": "Классическое определение вероятности задаёт P(A) как отношение числа благоприятных исходов m к общему числу равновозможных элементарных исходов n. (lecture_1, стр. 30)", "usage": {"code": false, "without": "Без классической формулы студент считает вероятность на глаз, что даёт разные ответы у разных людей на одну и ту же задачу.", "with": "Применяя m делить на n, аналитик получает воспроизводимую числовую оценку вероятности для задач с равновозможными исходами.", "benefit": "Единая проверяемая формула расчёта вероятности в задачах с конечным числом исходов."}}, {"q": "Чему равно число перестановок n различных элементов, если каждый элемент используется ровно один раз?", "options": ["Числом перестановок, которое равно произведению всех натуральных чисел от 1 до n", "Числом сочетаний, которое равно n факториал, делённому на произведение k факториал и разности n минус k факториал", "Числом перестановок с повторениями, которое по определению равно k в степени n для n элементов", "Числом размещений, которое равно n в степени k для выбранных из общего множества k элементов"], "correct": 0, "explain": "Число перестановок n различных элементов равно n факториал, то есть произведению всех натуральных чисел от 1 до n; это отличается от размещений и сочетаний, где выбирается лишь часть элементов. (Probability.txt, стр. 1)", "usage": {"code": false, "without": "Без формулы перестановок студент вручную перебирает все расстановки элементов, что быстро становится невозможным при их росте.", "with": "Зная, что число перестановок равно n факториал, аналитик мгновенно оценивает число вариантов расстановки выборки без перебора.", "benefit": "Быстрый точный подсчёт числа возможных порядков элементов."}}, {"q": "Как принцип включения-исключения выражает мощность объединения двух событий A и B через мощности этих событий и их пересечения?", "options": ["Мощность объединения A и B равна разности мощностей A и B без учёта пересечения", "Мощность объединения A и B равна сумме мощностей A и B минус мощность их пересечения", "Мощность объединения A и B равна сумме мощностей A и B плюс мощность их пересечения", "Мощность объединения A и B равна произведению мощностей A и B минус мощность их пересечения"], "correct": 1, "explain": "Формула включения-исключения вычитает мощность пересечения, чтобы не посчитать дважды элементы, входящие и в A, и в B; сложение без вычитания завышает результат. Источник: lecture_1, стр. 25.", "usage": {"code": false, "without": "Без формулы студент дважды считает общих клиентов двух рассылок и завышает охват аудитории.", "with": "Зная формулу, он вычитает пересечение и получает точный суммарный охват.", "benefit": "Точный подсчёт объединённых множеств без задвоения."}}, {"q": "Какая формула включения-исключения верна для мощности объединения трёх событий A, B и C?", "options": ["Мощность объединения трёх событий равна сумме их мощностей, плюс суммы мощностей попарных пересечений, минус мощность тройного пересечения", "Мощность объединения трёх событий равна сумме их мощностей, плюс суммы мощностей попарных пересечений, плюс мощность тройного пересечения", "Мощность объединения трёх событий равна сумме их мощностей, минус суммы мощностей попарных пересечений, плюс мощность тройного пересечения", "Мощность объединения трёх событий равна сумме их мощностей, минус суммы мощностей попарных пересечений, минус мощность тройного пересечения"], "correct": 2, "explain": "Для трёх событий из суммы мощностей вычитают все попарные пересечения, а тройное пересечение возвращают со знаком плюс, иначе оно окажется учтено неверно. Источник: lecture_1, стр. 25.", "usage": {"code": false, "without": "Аналитик складывает три сегмента пользователей и получает завышенную оценку уникальной аудитории.", "with": "Применив полную формулу с тройным пересечением, он получает верное число уникальных пользователей.", "benefit": "Верная оценка объединения трёх пересекающихся множеств."}}, {"q": "Во что упрощается принцип включения-исключения для мощности объединения, если события A1, ..., An образуют полную группу попарно несовместных событий MECE?", "options": ["Мощность объединения равна сумме мощностей всех событий и равна мощности пространства элементарных исходов", "Мощность объединения равна наибольшей из мощностей отдельных событий и равна мощности пространства элементарных исходов", "Мощность объединения равна произведению мощностей всех событий и равна мощности пространства элементарных исходов", "Мощность объединения равна разности суммы мощностей событий и их пересечений и равна мощности пространства элементарных исходов"], "correct": 0, "explain": "Для попарно несовместных событий все пересечения пусты, поэтому вычитаемые члены формулы включения-исключения обнуляются и остаётся сумма мощностей, равная мощности всего пространства. Источник: lecture_1, стр. 26.", "usage": {"code": false, "without": "Не зная упрощения для MECE, студент продолжает вычитать несуществующие пересечения и путается в вычислениях.", "with": "Зная, что события несовместны, он сразу складывает мощности без лишних вычитаний.", "benefit": "Быстрый и безошибочный подсчёт для взаимоисключающих исходов."}}, {"q": "Какие три аксиомы Колмогорова задают функцию вероятности P на пространстве элементарных исходов Ω?", "options": ["Первая аксиома: вероятность любого события неотрицательна; вторая аксиома: вероятность всего пространства элементарных исходов равна нулю; третья аксиома: вероятность объединения несовместных событий равна сумме их вероятностей", "Первая аксиома: вероятность любого события не превышает единицы; вторая аксиома: вероятность всего пространства элементарных исходов равна единице; третья аксиома: вероятность объединения несовместных событий равна сумме их вероятностей", "Первая аксиома: вероятность любого события неотрицательна; вторая аксиома: вероятность всего пространства элементарных исходов равна единице; третья аксиома: вероятность объединения несовместных событий равна произведению их вероятностей", "Первая аксиома: вероятность любого события неотрицательна; вторая аксиома: вероятность всего пространства элементарных исходов равна единице; третья аксиома: вероятность объединения несовместных событий равна сумме их вероятностей"], "correct": 3, "explain": "Аксиомы Колмогорова требуют неотрицательности вероятности, нормировки на всё пространство исходов значением единица и аддитивности для несовместных событий; замена любого условия, например нормировки на ноль или суммы на произведение, разрушает согласованность теории. Источник: lecture_1, стр. 35; Ross, гл. 2.", "usage": {"code": false, "without": "Не помня точные условия, студент путает нормировку и складывает вероятности несовместных событий через умножение.", "with": "Помня три условия, он сразу проверяет, задаёт ли функция корректную вероятностную меру.", "benefit": "Надёжная проверка корректности произвольной вероятностной модели."}}, {"q": "Какая формула для вероятности противоположного события следует из аксиом нормировки и аддитивности?", "options": ["Вероятность противоположного события равна сумме единицы и вероятности события A", "Вероятность противоположного события равна единице минус вероятность события A", "Вероятность противоположного события равна разности вероятности события A и единицы", "Вероятность противоположного события равна той же вероятности, что и у события A"], "correct": 1, "explain": "Событие A и противоположное ему событие несовместны и в сумме образуют всё пространство исходов, поэтому по аксиомам аддитивности и нормировки их вероятности в сумме дают единицу, откуда вероятность противоположного события равна единице минус вероятность A. Источник: Ross, гл. 2.", "usage": {"code": false, "without": "Не зная следствия, студент отдельно и долго вычисляет вероятность дополнения через полный перебор исходов.", "with": "Зная формулу, он мгновенно получает вероятность дополнения из уже известной вероятности события.", "benefit": "Быстрый пересчёт вероятности через дополнение без повторных вычислений."}}, {"q": "В чём принципиальное отличие сочетаний C от размещений A при выборе k элементов из n?", "options": ["В сочетаниях число выбираемых элементов больше n, а в размещениях не превышает n", "В сочетаниях учитывается порядок элементов, а в размещениях порядок не учитывается", "В сочетаниях порядок выбранных элементов не важен, а в размещениях порядок важен", "В сочетаниях элементы могут повторяться, а в размещениях повторение запрещено"], "correct": 2, "explain": "Определяющий признак различия сочетаний и размещений — учёт порядка выбора: в сочетании набор из элементов a и b считается тем же результатом, что и набор из b и a, а в размещении разным; наличие повторений и объём выборки к этому различию отношения не имеют. Источник: combinatorics_gromova_tsi_2024, стр. 4.", "usage": {"code": false, "without": "Не различая понятия, студент считает число команд по формуле размещений и завышает результат в разы.", "with": "Понимая, что порядок в команде не важен, он верно применяет формулу сочетаний.", "benefit": "Правильный выбор формулы для задач без учёта порядка."}}, {"q": "Как размещение A из n по k элементов выражается через сочетание C из n по k и перестановку из k элементов?", "options": ["Размещение из n по k равно сочетанию из n по k, умноженному на k факториал", "Размещение из n по k равно сочетанию из n по k, умноженному на n факториал", "Размещение из n по k равно сочетанию из n по k, делённому на k факториал", "Размещение из n по k равно сочетанию из n по k, сложенному с k факториалом"], "correct": 0, "explain": "Сочетание не различает порядок внутри выбранной группы из k элементов, поэтому, чтобы получить упорядоченное размещение, каждое сочетание домножают на число перестановок этих k элементов, то есть на k факториал, а не на n факториал и не делят на него. Источник: combinatorics_gromova_tsi_2024, стр. 17.", "usage": {"code": false, "without": "Не зная связи формул, студент выводит размещение заново через принцип умножения каждый раз.", "with": "Помня, что размещение равно сочетанию, умноженному на k факториал, он быстро переходит от одной формулы к другой.", "benefit": "Экономия времени при переходе между родственными комбинаторными формулами."}}, {"q": "Сколько различных перестановок можно составить из n элементов, если среди них есть неразличимые элементы, образующие группы по n1, n2, ..., nk штук?", "options": ["n факториал разделить на сумму n1 факториал, n2 факториал и так далее до nk факториал", "n факториал умножить на произведение n1 факториал, n2 факториал и так далее до nk факториал", "n факториал разделить на произведение n1, n2 и так далее до nk без факториалов", "n факториал разделить на произведение n1 факториал, n2 факториал и так далее до nk факториал"], "correct": 3, "explain": "Перестановки внутри каждой группы неразличимых элементов дают одинаковые результаты, поэтому общее число n факториал делят на произведение факториалов размеров всех групп, как в примере со словом MISSISSIPPI; деление на сумму или на числа без факториалов даёт неверный результат. Источник: combinatorics_gromova_tsi_2024, стр. 6.", "usage": {"code": false, "without": "Не зная формулы, студент считает все n факториал перестановок слова и получает завышенное число уникальных вариантов.", "with": "Разделив на произведение факториалов повторов, он получает верное число различимых перестановок.", "benefit": "Верный подсчёт перестановок при наличии повторяющихся элементов."}}, {"q": "Как вычисляется число сочетаний с повторениями из n типов элементов по k, обозначаемое C с чертой из n по k?", "options": ["C с чертой из n по k равно числу n, возведённому в степень k", "C с чертой из n по k равно сочетанию из n плюс k минус один по k", "C с чертой из n по k равно сочетанию из n минус k плюс один по k", "C с чертой из n по k равно сочетанию из n по k, умноженному на k факториал"], "correct": 1, "explain": "Сочетания с повторениями сводят к обычным сочетаниям через замену параметров: берут сочетание из n плюс k минус один по k, что учитывает возможность повторного выбора одного и того же типа; формула n в степени k описывает другую ситуацию — упорядоченную выборку с возвращением. Источник: combinatorics_gromova_tsi_2024, стр. 16.", "usage": {"code": false, "without": "Не зная формулы, студент путает сочетания с повторениями с упорядоченной выборкой и считает n в степени k.", "with": "Применив сочетание из n плюс k минус один по k, он получает верное число вариантов набора донатов с повторами.", "benefit": "Верный подсчёт неупорядоченных выборок с повторением типов."}}, {"q": "В какой ситуации уместно применять сочетания с повторениями, а не обычные сочетания без повторений?", "options": ["Сочетания с повторениями применяют, когда каждый тип выбирают не более одного раза и порядок выбора неважен", "Сочетания с повторениями применяют, когда один тип можно выбрать несколько раз и порядок выбора важен", "Сочетания с повторениями применяют, когда один тип можно выбрать несколько раз и порядок выбора неважен", "Сочетания с повторениями применяют, когда каждый тип выбирают только один раз и порядок выбора важен"], "correct": 2, "explain": "Сочетания с повторениями описывают неупорядоченный выбор, в котором один и тот же тип элемента разрешено брать несколько раз, как в примере с выбором нескольких пончиков одного вида; если важен порядок выбора, речь идёт уже о размещениях с повторениями, а не о сочетаниях. Источник: combinatorics_gromova_tsi_2024, стр. 11, 16.", "usage": {"code": false, "without": "Не различая ситуации, студент применяет обычные сочетания там, где повтор типа возможен, и занижает число вариантов.", "with": "Опознав повторяемый неупорядоченный выбор, он применяет формулу сочетаний с повторениями и получает верный ответ.", "benefit": "Точный выбор формулы для выборок с допустимым повтором типа."}}, {"q": "Из 10 финалистов конкурса выбирают обладателей золотой, серебряной и бронзовой медали; один финалист не может получить две медали. Какой инструмент комбинаторики подходит для подсчёта числа распределений медалей?", "options": ["Сочетания без повторений, поскольку порядок вручения медалей роли не играет", "Размещения с повторениями, поскольку один финалист может получить все медали", "Перестановки без повторений, поскольку распределяются сразу все десять финалистов", "Размещения без повторений, поскольку медали различны, а повтор награды исключён"], "correct": 3, "explain": "Медали различны, а один финалист награждается не более одного раза без возврата - это размещения без повторений A(n,k)=n!/(n-k)!. Сочетания игнорируют порядок и подошли бы только для одинаковых наград. (combinatorics_gromova_tsi_2024.txt, Partial permutations)", "usage": {"code": false, "without": "Аналитик посчитает варианты как сочетания и занизит реальное число способов распределить именно разные награды", "with": "Аналитик сразу видит, что роли различаются и повтор запрещён, и применяет размещения без повторений", "benefit": "верно оценивает число способов распределить различающиеся роли без повторного назначения"}}, {"q": "Совет фонда из 5 равноправных членов выбирают из 12 кандидатов; все места одинаковы, а порядок выбора роли не играет. Как посчитать число возможных составов совета?", "options": ["Размещения без повторений, поскольку порядок включения кандидатов имеет значение", "Сочетания без повторений, поскольку члены совета равноправны и не различаются", "Размещения с повторениями, поскольку кандидат может войти в совет дважды", "Перестановки с повторениями, поскольку среди кандидатов встречаются однофамильцы"], "correct": 1, "explain": "Все места в совете одинаковы, а кандидат выбирается один раз без возврата - это сочетания без повторений C(n,k). Размещения учитывали бы порядок мест, которого здесь нет. (combinatorics_gromova_tsi_2024.txt, Combinations)", "usage": {"code": false, "without": "Аналитик применит формулу размещений и завысит число составов совета в разы за счёт лишнего учёта порядка", "with": "Аналитик замечает равноправие мест и сразу применяет сочетания без повторений", "benefit": "не завышает число равноправных составов за счёт мнимого учёта порядка"}}, {"q": "Код сейфа состоит из 4 цифр от 0 до 9; одна и та же цифра может стоять на разных позициях, а порядок цифр отличает разные коды. Какая формула даёт число возможных кодов?", "options": ["Сочетания без повторений, поскольку набор цифр внутри кода не повторяется", "Размещения без повторений, поскольку каждая цифра сейфа используется только раз", "Размещения с повторениями, поскольку порядок цифр важен, а повтор разрешён", "Сочетания с повторениями, поскольку итоговый набор цифр порядка не имеет"], "correct": 2, "explain": "Порядок цифр различает коды, а повтор цифры на позициях разрешён - это размещения с повторениями, число вариантов n^k=10^4. Формулы без повторений занизили бы число кодов. (combinatorics_gromova_tsi_2024.txt, Partial permutations with repetition)", "usage": {"code": false, "without": "Специалист по безопасности применит формулу без повторений и сильно занизит реальную стойкость кода к перебору", "with": "Специалист верно учитывает разрешённый повтор цифр и порядок и получает точное число комбинаций", "benefit": "точно оценивает пространство перебора кода с разрешённым повтором символов"}}, {"q": "Кодовый замок задаёт трёхзначный шифр из цифр набора от 1 до 20; повторение цифры в шифре запрещено, а порядок цифр имеет значение. Какая формула подходит для подсчёта числа шифров?", "options": ["Размещения без повторений, поскольку порядок важен, а повтор цифры запрещён", "Сочетания без повторений, поскольку порядок цифр в шифре не учитывается", "Сочетания с повторениями, поскольку цифра может встречаться в шифре дважды", "Размещения с повторениями, поскольку одна цифра может занимать несколько позиций"], "correct": 0, "explain": "Порядок важен и повтор запрещён условием задачи - это размещения без повторений A(n,k)=n!/(n-k)!, здесь A(20,3). Варианты с повторениями противоречат запрету на повтор цифры. (seminar_1_problems_en_2024_tsi.txt, Topic 1, задача 10)", "usage": {"code": false, "without": "Студент спутает шифр с сочетанием и не отличит 123 от 321 как два разных шифра", "with": "Студент видит запрет повтора и важность порядка и сразу берёт размещения без повторений", "benefit": "точно считает число различимых шифров при запрете повтора символов"}}, {"q": "Коктейль из 3 шариков мороженого собирают из 5 вкусов; вкус разрешено повторять, а порядок шариков в стаканчике заказ не меняет. Как посчитать число разных заказов?", "options": ["Размещения без повторений, поскольку каждый вкус берут только один раз", "Сочетания без повторений, поскольку набор вкусов повторов не содержит", "Размещения с повторениями, поскольку порядок шариков определяет разные заказы", "Сочетания с повторениями, поскольку вкус повторяется, а порядок не важен"], "correct": 3, "explain": "Порядок шариков не важен, а вкус разрешено повторять - это сочетания с повторениями, число вариантов C(n+k-1,k). Размещения учитывали бы порядок, который тут заказ не меняет. (Combinations with and without repetitions.txt)", "usage": {"code": false, "without": "Менеджер кафе посчитает заказы как размещения и завысит реальное число различных коктейлей", "with": "Менеджер верно применяет сочетания с повторениями и получает точное меню вариантов", "benefit": "не завышает число различных заказов при разрешённом повторе и неважном порядке"}}, {"q": "Из урны со 100 занумерованными шарами наугад вынимают один шар; число исходов конечно, и все шары равновозможны. Какой подход к вычислению вероятности здесь применим?", "options": ["Статистическая вероятность, поскольку вероятность оценивают по частоте в опытах", "Классическое определение вероятности, поскольку исходов конечное число и они равновозможны", "Определение вероятности через меру, поскольку пространство исходов здесь непрерывно", "Геометрическая вероятность, поскольку исход задаётся положением точки на прямой"], "correct": 1, "explain": "Конечное число равновозможных исходов - это ровно условие классического определения вероятности P=m/n. Геометрическая вероятность нужна для непрерывного пространства исходов, чего здесь нет. (seminar_1_problems_en_2024_tsi.txt, Topic 1, задача 4; lecture_1_basic_probability_gromova_2024_tsi.txt)", "usage": {"code": false, "without": "Студент попробует измерять условную площадь вместо простого подсчёта благоприятных шаров", "with": "Студент видит конечность и равновозможность исходов и сразу применяет P=m/n", "benefit": "выбирает простейший точный метод расчёта для конечного числа равновозможных исходов"}}, {"q": "Точку бросают наугад внутрь круга радиуса R и ищут вероятность её попадания в круг радиуса r; число возможных положений точки бесконечно. Какой подход к расчёту вероятности здесь нужен?", "options": ["Статистическая вероятность, поскольку исход зависит от частоты попаданий в опытах", "Сочетания без повторений, поскольку число положений точки конечно и различимо", "Геометрическая вероятность, поскольку исходов бесконечно много, а считают отношение площадей", "Классическое определение вероятности, поскольку все положения точки можно перечислить"], "correct": 2, "explain": "Исходов несчётно много, а вероятность считается как отношение площади благоприятной области к площади всей области - это геометрическая вероятность P=S_малая/S_большая. Классическое определение требует конечного числа исходов. (seminar_1_problems_en_2024_tsi.txt, Topic 1, задача 11; lecture_1_basic_probability_gromova_2024_tsi.txt, Geometric probability)", "usage": {"code": false, "without": "Студент попробует перечислять положения точки поштучно там, где их бесконечно много", "with": "Студент сразу переходит к отношению площадей и корректно решает задачу", "benefit": "корректно считает вероятность в задачах с непрерывным пространством исходов"}}, {"q": "Событие C - выпадение орла, событие D - выпадение решки при одном броске монеты; C и D одновременно произойти не могут. Как найти вероятность того, что произойдёт C или D?", "options": ["Сложить вероятности событий напрямую, поскольку события несовместны и не пересекаются", "Перемножить вероятности событий, поскольку они относятся к одному броску", "Вычесть вероятность пересечения из единицы, поскольку события между собой связаны", "Сложить вероятности и вычесть их пересечение, поскольку события могут пересекаться"], "correct": 0, "explain": "Для несовместных событий вероятность суммы равна сумме вероятностей: P(C∪D)=P(C)+P(D), так как пересечение пустое. Формула с вычитанием пересечения нужна только для совместных событий. (Probability.txt, Mutually exclusive events)", "usage": {"code": false, "without": "Студент лишний раз вычтет несуществующее пересечение и занизит вероятность несовместных событий", "with": "Студент видит несовместность событий и сразу складывает вероятности без поправок", "benefit": "не усложняет расчёт там, где события заведомо несовместны"}}, {"q": "Из колоды в 52 карты тянут одну карту и ищут вероятность того, что карта красная или дама; красные дамы существуют, то есть события пересекаются. Как правильно найти вероятность объединения событий?", "options": ["Перемножить вероятности событий, поскольку признаки карты независимы друг от друга", "Взять большую из двух вероятностей, поскольку одно событие включает другое", "Сложить вероятности событий напрямую, поскольку это два разных признака карты", "Сложить вероятности и вычесть вероятность пересечения, поскольку события пересекаются"], "correct": 3, "explain": "События пересекаются, ведь красные дамы существуют, поэтому нужна формула включения-исключения P(A∪B)=P(A)+P(B)-P(A∩B), иначе красные дамы будут учтены дважды. Простое сложение годится только для несовместных событий. (seminar_1_problems_en_2024_tsi.txt, Topic 3, задача 2; Probability.txt, Probability of the sum of events)", "usage": {"code": false, "without": "Студент посчитает красных дам дважды и завысит итоговую вероятность объединения событий", "with": "Студент вычитает пересечение и получает точную вероятность без двойного учёта", "benefit": "избегает двойного учёта общих исходов при пересекающихся событиях"}}, {"q": "События A и B независимы: A - брак детали первого станка, B - брак детали второго станка. Нужна вероятность того, что обе детали окажутся бракованными одновременно. Как её вычислить?", "options": ["Сложить вероятности и вычесть вероятность пересечения, поскольку станки работают независимо", "Перемножить вероятности событий, поскольку события независимы и должны произойти вместе", "Вычесть одну вероятность из другой, поскольку станки выпускают разные детали", "Сложить вероятности событий, поскольку интересует совместное наступление обоих событий"], "correct": 1, "explain": "Для независимых событий, которые должны наступить одновременно, вероятность произведения равна произведению вероятностей: P(A∩B)=P(A)*P(B). Формулы суммы относятся к событию A или B, а не к их совместному наступлению. (Probability.txt, Independent events; Problems on the Probability of the Sum of Events.txt)", "usage": {"code": false, "without": "Инженер перепутает и с или и сложит вероятности вместо их перемножения", "with": "Инженер видит независимость и совместное наступление событий и сразу перемножает вероятности", "benefit": "не путает вероятность совместного наступления событий с вероятностью хотя бы одного из них"}}, {"q": "Отдел контроля качества случайным образом достаёт выборку деталей из партии для проверки на брак, не возвращая детали обратно. Почему для подсчёта числа возможных выборок с заданным числом бракованных деталей нужно использовать сочетания, а не размещения?", "options": ["Порядок извлечения деталей из партии не влияет на состав выборки", "Размещения годятся только для выборок с возвращением деталей", "Сочетания всегда дают меньшее число исходов, чем размещения", "Размещения применимы только когда число бракованных деталей равно нулю"], "correct": 0, "explain": "Выборка для контроля качества — неупорядоченный набор: две выборки одного состава, но с разным порядком извлечения, считаются одной и той же, а это и есть определение сочетания. Размещение учитывает порядок и завысило бы счёт, поэтому вариант про возвращение деталей не объясняет разницу (combinatorics_examples.txt).", "usage": {"code": false, "without": "Не различая сочетания и размещения, аналитик умножит число выборок на лишний множитель за счёт порядка и завысит оценку доли брака в партии.", "with": "Зная, что выборка контроля качества — сочетание, аналитик применяет гипергеометрическую модель и получает точную оценку доли брака.", "benefit": "Точная оценка риска брака без завышения из-за лишнего учёта порядка."}}, {"q": "Из партии в 15 деталей, среди которых 5 бракованных, наугад выбирают 3 детали. Студент считал число выборок хотя бы с одной бракованной деталью и сложил число выборок с 1, 2 и 3 бракованными деталями, а затем добавил ещё и число выборок вообще без бракованных. В чём ошибка студента?", "options": ["Итоговая сумма не поделена на факториал размера выборки", "Неверно определено общее число деталей в партии", "Перепутаны сочетания с размещениями в каждом слагаемом", "Лишний раз добавлен случай без единой бракованной детали"], "correct": 3, "explain": "Событие «хотя бы одна бракованная деталь» объединяет случаи с 1, 2 и 3 бракованными, но не случай без брака вовсе; добавив его, студент завысил счёт — это ошибка двойного счёта при объединении несовместных случаев, а не путаница сочетаний с размещениями (Problems on the Probability of the Sum of Events.txt).", "usage": {"code": false, "without": "Не заметив лишнее слагаемое, аналитик завысит вероятность обнаружить брак в выборке и сделает неверный вывод о партии.", "with": "Правильно объединяя только несовместные случаи с браком, аналитик получает точную вероятность для решения о партии.", "benefit": "Верная вероятность события без завышения из-за лишнего слагаемого."}}, {"q": "В лотерее нужно угадать 6 чисел из 49 без учёта порядка их выпадения. Какой комбинаторный объект описывает число различных лотерейных билетов?", "options": ["Перестановки из 49 по 6", "Сочетания из 49 по 6", "Разбиения из 49 по 6", "Размещения из 49 по 6"], "correct": 1, "explain": "Порядок выпадения чисел в лотерее не важен, поэтому билеты — сочетания из 49 элементов по 6; размещения учитывали бы порядок и завысили бы число билетов в 6 факториал раз (combinatorics_examples.txt).", "usage": {"code": false, "without": "Посчитав билеты как размещения, аналитик занизит вероятность выигрыша, разделив на завышенное число исходов.", "with": "Верно определив билеты как сочетания, аналитик точно считает вероятность выигрыша в лотерее.", "benefit": "Точный расчёт вероятности выигрыша без завышения знаменателя."}}, {"q": "Пароль состоит из 4 символов: сначала 2 заглавные латинские буквы, затем 2 цифры; повторы символов в пределах пароля разрешены. Сколько различных паролей можно составить?", "options": ["26 умножить на 26 прибавить 10 умножить на 10", "26 прибавить 26 умножить на 10 прибавить 10", "26 умножить на 26 умножить на 10 умножить на 10", "26 умножить на 25 умножить на 10 умножить на 9"], "correct": 2, "explain": "Символы могут повторяться, поэтому на каждой из 4 позиций число вариантов не уменьшается: 26 на 26 для букв и 10 на 10 для цифр по правилу произведения. Первый вариант отвечает паролю без повторений символов, что противоречит условию (combinatorics_examples.txt, пример с автомобильными номерами).", "usage": {"code": false, "without": "Не зная правило произведения с повторением, разработчик занизит число возможных паролей и переоценит стойкость системы к перебору.", "with": "Применив правило произведения, разработчик точно оценивает пространство паролей и время полного перебора.", "benefit": "Верная оценка стойкости пароля к перебору."}}, {"q": "Пароль состоит из 4 различных цифр от 0 до 9, порядок цифр важен, повторы запрещены. Какой комбинаторный объект задаёт число таких паролей?", "options": ["Размещения из 10 по 4", "Сочетания из 10 по 4", "Перестановки из 10 по 4", "Разбиения из 10 по 4"], "correct": 0, "explain": "Порядок цифр важен, а повторы запрещены — это точное определение размещения без повторений; сочетания не учитывали бы порядок и дали бы меньшее число паролей (combinatorics_examples.txt).", "usage": {"code": false, "without": "Посчитав пароли как сочетания, аналитик занизит реальное число вариантов и недооценит время перебора.", "with": "Определив пароли как размещения, аналитик получает верное число вариантов и корректно оценивает стойкость к перебору.", "benefit": "Точная оценка числа паролей с учётом порядка цифр."}}, {"q": "За круглым столом рассаживают 6 человек. Аналитик сравнивает подсчёт для рассадки в ряд и для рассадки по кругу. Почему число рассадок по кругу меньше, чем 6 факториал?", "options": ["В круговой рассадке соседние места нельзя менять местами друг с другом", "Круговая рассадка всегда учитывает направление по часовой стрелке отдельно", "За круглым столом можно посадить меньше людей, чем при рассадке в ряд", "Рассадки, отличающиеся только поворотом круга, считаются одной и той же"], "correct": 3, "explain": "Поворот всех гостей по кругу на одну позицию даёт ту же самую рассадку, поэтому одно место фиксируют, и остаётся n минус 1 факториал вариантов вместо n факториал; число людей за столом при этом не меняется (combinatorics_examples.txt, круговые перестановки).", "usage": {"code": false, "without": "Не зная про фиксацию одного места, аналитик завысит число различных рассадок в 6 раз для стола на 6 человек.", "with": "Фиксируя одно место, аналитик правильно считает круговые рассадки для планирования мероприятий.", "benefit": "Верное число рассадок за круглым столом без завышения из-за поворотов."}}, {"q": "На скамейке рассаживают 5 мальчиков и 4 девочек так, чтобы мальчики и девочки чередовались. Какое действие приведёт к завышению числа рассадок?", "options": ["Начать чередование с мальчика, поскольку мальчиков на одного больше", "Умножить результат ещё раз на число способов занять крайние места", "Проверить, что крайние места на скамейке заняты мальчиками, а не девочками", "Отдельно переставить пять мальчиков и четыре девочек и перемножить результаты"], "correct": 1, "explain": "При чередовании с перевесом в одного мальчика крайние места однозначно определены условием и уже учтены в перестановках 5 факториал и 4 факториал; умножение ещё раз на число способов занять края повторно считает один и тот же расклад — типичная ошибка двойного счёта (combinatorics_examples.txt, рассадка мальчиков и девочек на скамье).", "usage": {"code": false, "without": "Добавив лишний множитель, аналитик завысит число рассадок и сделает неверный вывод о числе вариантов рассаживания.", "with": "Не добавляя лишний множитель, аналитик получает верное число рассадок для чередующейся группы.", "benefit": "Точный подсчёт рассадок без повторного учёта уже определённых мест."}}, {"q": "Из полной колоды в 52 карты сдают 5 карт. Нужно найти число раздач, где все 5 карт одной масти. Студент умножил число мастей на число размещений из 13 по 5. Что здесь неверно?", "options": ["В колоде всего 13 карт, а не 52, поэтому расчёт масти лишний", "Пять карт одной масти вообще невозможно набрать из одной масти", "Порядок карт в раздаче не важен, поэтому нужны сочетания, а не размещения", "Число мастей нужно не умножать, а складывать с числом карт в масти"], "correct": 2, "explain": "Раздача карт — неупорядоченный набор, поэтому карты одной масти считают сочетаниями из 13 по 5, а не размещениями; размещения завысили бы счёт в 5 факториал раз для каждой масти (combinatorics_examples.txt, раздача покерных рук).", "usage": {"code": false, "without": "Используя размещения вместо сочетаний, аналитик завысит вероятность редкой раздачи в 5 факториал раз.", "with": "Применив сочетания, аналитик точно считает число раздач одной масти и корректную вероятность такой раздачи.", "benefit": "Верная вероятность редкой карточной комбинации без завышения счёта."}}, {"q": "Игральную кость бросают 3 раза подряд и каждый раз фиксируют выпавшее число очков. Сколько различных упорядоченных исходов возможно?", "options": ["число 6 в третьей степени", "число 3 в шестой степени", "число сочетаний из 6 по 3", "6 умножить на 5 умножить на 4"], "correct": 0, "explain": "Каждый из трёх бросков независимо даёт 6 исходов с повторением и с учётом порядка, поэтому по правилу произведения получаем 6 в третьей степени; последний вариант отвечает броскам без повторения значений, что не так для кости (combinatorics_examples.txt, повторение события).", "usage": {"code": false, "without": "Не учтя повторение значений, аналитик занизит число исходов серии бросков и исказит расчёт вероятностей.", "with": "Применив правило произведения с повторением, аналитик верно считает пространство исходов серии бросков.", "benefit": "Верное число исходов при повторных независимых бросках кости."}}, {"q": "Нужно найти число способов выбрать карту, которая является тузом или пикой, из колоды 52 карты. Студент сложил число тузов и число пик, получив 4 плюс 13 равно 17. В чём ошибка?", "options": ["В колоде двенадцать пик, а не тринадцать", "Складывать количества событий здесь нельзя вовсе", "В колоде на самом деле пять тузов, а не четыре", "Туз пик учтён дважды, и его нужно вычесть один раз"], "correct": 3, "explain": "Туз пик входит и в число тузов, и в число пик, поэтому простое сложение считает его дважды; по принципу включения-исключения нужно вычесть пересечение один раз: 4 плюс 13 минус 1 равно 16 (Problems on the Probability of the Sum of Events.txt, принцип включения-исключения).", "usage": {"code": false, "without": "Складывая события напрямую без поправки на пересечение, аналитик завысит вероятность объединения событий.", "with": "Вычитая пересечение один раз, аналитик получает точную вероятность объединения совместных событий.", "benefit": "Верная вероятность объединения событий без двойного учёта пересечения."}}, {"q": "В ряд нужно расставить 5 разноцветных карточек: красную, синюю, зелёную, жёлтую и белую. Сколько существует способов их расположить?", "options": ["3125 способов", "60 способов", "120 способов", "720 способов"], "correct": 2, "explain": "Шаг 1: все 5 карточек разные, порядок важен — это перестановки. Шаг 2: число перестановок = 5! = 5*4*3*2*1. Шаг 3: результат = 120 способов. Дистракторы: 60 способов = 5*4*3 — расчёт остановлен раньше времени; 720 способов = 6! — взят лишний множитель 6, которого нет среди карточек; 3125 способов = 5^5 — использована формула с повторением. (combinatorics_gromova_tsi_2024.txt)", "usage": {"code": false, "without": "Не зная формулу перестановок, координатор мероприятия перебирает варианты расстановки карточек вручную и теряет время.", "with": "Применяя n!, координатор мгновенно получает точное число вариантов расположения элементов в ряд.", "benefit": "Быстрый и точный подсчёт числа упорядочений."}}, {"q": "На соревновании участвует 9 команд. Сколько существует способов распределить золото, серебро и бронзу, если каждая команда может занять только одно место?", "options": ["504 способа", "84 способа", "729 способов", "3024 способа"], "correct": 0, "explain": "Шаг 1: медали разные, порядок важен, повторов нет — это размещения A(9,3). Шаг 2: A(9,3)=9*8*7. Шаг 3: результат = 504 способа. Дистракторы: 84 способа = C(9,3) — не учтён порядок; 729 способов = 9^3 — учтено повторение команд; 3024 способа = A(9,4) — взято лишнее четвёртое место. (combinatorics_gromova_tsi_2024.txt)", "usage": {"code": false, "without": "Организатор турнира без формулы размещений путает число способов вручения медалей с числом способов выбрать призёров без учёта места.", "with": "Используя A(n,k), организатор точно считает число способов распределить три разные награды между командами.", "benefit": "Верное планирование церемонии награждения без пересчёта вручную."}}, {"q": "Из группы 12 студентов нужно выбрать 4 человека для доклада; порядок выбора не важен. Сколько существует способов сделать такой выбор?", "options": ["11880 способов", "20736 способов", "220 способов", "495 способов"], "correct": 3, "explain": "Шаг 1: порядок неважен — это сочетания C(12,4). Шаг 2: C(12,4)=12*11*10*9/4!. Шаг 3: =11880/24=495 способов. Дистракторы: 11880 способов = A(12,4) — забыли поделить на 4!; 20736 способов = 12^4 — учтено повторение; 220 способов = C(12,3) — взято неверное число выбираемых. (combinatorics_gromova_tsi_2024.txt)", "usage": {"code": false, "without": "Не отличая сочетания от размещений, куратор группы завышает число возможных составов докладчиков.", "with": "Применяя C(n,k), куратор корректно определяет число способов набрать группу докладчиков без учёта порядка.", "benefit": "Точный подсчёт числа возможных составов группы."}}, {"q": "В партии из 20 деталей 5 бракованных. Наугад выбирают 3 детали. Найдите вероятность того, что среди них ровно 2 бракованные.", "options": ["0.0088", "0.1316", "0.1548", "0.7895"], "correct": 1, "explain": "Шаг 1: гипергеометрическая схема, N=20 деталей, K=5 бракованных, n=3 в выборке, нужно m=2 бракованных. Шаг 2: P=C(5,2)*C(15,1)/C(20,3). Шаг 3: =10*15/1140=150/1140=0.1316. Дистракторы: 0.0088 — взят только числитель C(5,2) без C(15,1); 0.1548 — использован C(19,3) вместо C(20,3); 0.7895 — использован C(20,2) вместо C(20,3). (seminar_1_problems_en_2024_tsi.txt, задача про партию деталей)", "usage": {"code": false, "without": "Без гипергеометрической схемы инженер контроля качества не может оценить риск пропустить бракованные детали в выборке.", "with": "Через сочетания C(K,m)*C(N-K,n-m)/C(N,n) инженер точно оценивает вероятность конкретного числа бракованных деталей в пробе.", "benefit": "Обоснованное решение о приёмке партии деталей."}}, {"q": "На складе 25 деталей, из них 4 бракованные. Случайным образом отбирают 5 деталей. Найдите вероятность того, что среди них ровно 1 бракованная.", "options": ["0.1127", "0.3648", "0.4506", "0.5633"], "correct": 2, "explain": "Шаг 1: N=25, K=4 бракованных, n=5 в выборке, нужно m=1 бракованная. Шаг 2: P=C(4,1)*C(21,4)/C(25,5). Шаг 3: =4*5985/53130=23940/53130=0.4506. Дистракторы: 0.1127 — пропущен множитель C(4,1); 0.3648 — использован пул 20 деталей вместо 21; 0.5633 — использован C(24,5) вместо C(25,5). (seminar_1_problems_en_2024_tsi.txt)", "usage": {"code": false, "without": "Не применяя формулу гипергеометрического распределения, менеджер склада недооценивает вероятность попадания бракованной детали в выборку.", "with": "Расчёт через сочетания даёт менеджеру точную вероятность конкретного числа бракованных деталей в отобранной партии.", "benefit": "Точная оценка риска при выборочном контроле."}}, {"q": "События A и B совместны: P(A)=0.7, P(B)=0.4, P(A и B)=0.25. Найдите вероятность того, что произойдёт хотя бы одно из событий A или B.", "options": ["0.85", "1.15", "0.60", "0.25"], "correct": 0, "explain": "Шаг 1: A и B совместны, значит нужна формула включения-исключения P(A или B)=P(A)+P(B)-P(A и B). Шаг 2: подставляем 0.7+0.4-0.25. Шаг 3: результат=0.85. Дистракторы: 1.15 — забыли вычесть пересечение; 0.60 — пересечение вычтено дважды; 0.25 — указана только вероятность пересечения, а не объединения. (Problems on the Probability of the Sum of Events.txt)", "usage": {"code": false, "without": "Считая события несовместными по ошибке, аналитик складывает вероятности A и B напрямую и завышает результат.", "with": "Применяя формулу включения-исключения для совместных событий, аналитик получает верную вероятность объединения.", "benefit": "Корректная оценка вероятности хотя бы одного из двух связанных событий."}}, {"q": "В группе 40 туристов 18 говорят по-английски, 15 говорят по-немецки, из них 6 говорят на обоих языках. Найдите вероятность того, что случайно выбранный турист говорит хотя бы на одном из этих языков.", "options": ["0.825", "0.525", "0.150", "0.675"], "correct": 3, "explain": "Шаг 1: событие «говорит по-английски» и событие «говорит по-немецки» совместны, есть билингвы, нужна формула включения-исключения. Шаг 2: количество = 18+15-6=27 из 40. Шаг 3: P=27/40=0.675. Дистракторы: 0.825 — без вычитания пересечения; 0.525 — пересечение вычтено дважды; 0.150 — указана только доля билингвов. (Problems on the Probability of the Sum of Events.txt)", "usage": {"code": false, "without": "Без учёта пересечения групп HR-аналитик переоценивает долю сотрудников со знанием хотя бы одного языка.", "with": "Вычитая пересечение по формуле включения-исключения, аналитик получает точную долю сотрудников хотя бы с одним языком.", "benefit": "Точная оценка языкового покрытия команды."}}, {"q": "Бросают две симметричные игральные кости. Найдите вероятность того, что сумма выпавших очков равна 8.", "options": ["0.1667", "0.1389", "0.1111", "0.0278"], "correct": 1, "explain": "Шаг 1: всего равновозможных исходов 6*6=36. Шаг 2: сумма 8 получается парами 2+6, 3+5, 4+4, 5+3, 6+2 — это 5 исходов. Шаг 3: P=5/36=0.1389. Дистракторы: 0.1667=6/36 — добавлен лишний исход; 0.1111=4/36 — пропущена пара 4+4; 0.0278=1/36 — учтён только один исход 4+4 вместо всех пяти. (seminar_1_problems_en_2024_tsi.txt, задача про две кости)", "usage": {"code": false, "without": "Не перечислив все комбинации граней костей, игрок в настольную игру неверно оценивает шанс нужной суммы очков.", "with": "Перечислив все 36 равновозможных исходов, игрок точно вычисляет вероятность конкретной суммы.", "benefit": "Верная оценка шансов в игре с двумя костями."}}, {"q": "Из колоды 52 карт наугад вынимают одну карту. Найдите вероятность того, что это красная карта или туз.", "options": ["0.5769", "0.6154", "0.5385", "0.0385"], "correct": 2, "explain": "Шаг 1: событие «красная карта» и событие «туз» совместны — есть 2 красных туза. Шаг 2: благоприятных = 26+4-2=28. Шаг 3: P=28/52=0.5385. Дистракторы: 0.5769 — без вычитания пересечения; 0.6154 — пересечение прибавлено вместо вычитания; 0.0385 — указана только вероятность пересечения. (seminar_1_problems_en_2024_tsi.txt, задача про карты)", "usage": {"code": false, "without": "Не учитывая пересечение мастей и достоинств карт, игрок переоценивает вероятность вытянуть нужную карту.", "with": "Применяя включение-исключение для карточных событий, игрок получает точную вероятность объединения условий.", "benefit": "Точный расчёт шансов в карточной игре."}}, {"q": "Монету подбрасывают 5 раз. Найдите вероятность того, что хотя бы один раз выпадет орёл.", "options": ["0.9688", "0.9375", "0.0313", "0.5000"], "correct": 0, "explain": "Шаг 1: удобнее считать через противоположное событие — все 5 раз выпадает решка, орёл не выпал ни разу. Шаг 2: P(ни разу орёл)=0.5^5=0.03125. Шаг 3: P(хотя бы один)=1-0.03125=0.9688. Дистракторы: 0.9375 — использован показатель степени 4 вместо 5; 0.0313 — это вероятность противоположного события, а не искомого; 0.5000 — вероятность орла в одном отдельном броске. (lecture_1_basic_probability_gromova_2024_tsi.txt)", "usage": {"code": false, "without": "Пытаясь напрямую перечислить все способы получить хотя бы один орёл, студент путается в разборе случаев.", "with": "Через противоположное событие студент быстро находит вероятность хотя бы одного успеха за несколько бросков.", "benefit": "Быстрый расчёт вероятности хотя бы одного наступления события."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
