<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Git и патчи: format-patch, am, rebase</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #eef0f6;
    --muted: #8b8fa3;
    --accent: #5b8cff;
    --good: #2fbf71;
    --bad: #ef5350;
    --border: #2a2e3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  header { padding: 14px 0 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  .progressbar { height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progressbar > div { height: 100%; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .block-label { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: .75rem; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 10px; }
  .question { font-size: 1.08rem; margin: 0 0 10px; white-space: pre-wrap; }
  .qsearch { margin: 0 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: #232838; color: var(--text);
    border: 2px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(0.995); }
  .opt.correct { border-color: var(--good); background: rgba(47,191,113,0.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,83,80,0.15); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .opt.dim { opacity: .5; }
  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #171a24; border-left: 3px solid var(--accent);
    font-size: .92rem; color: #c7cadb; display: none;
  }
  .explain.show { display: block; }
  .usage { margin-top: 12px; display: none; flex-direction: column; gap: 10px; }
  .usage.show { display: flex; }
  .usage .u-part { padding: 10px 12px; border-radius: 10px; background: #171a24; border-left: 3px solid var(--border); }
  .usage .u-without { border-left-color: var(--bad); }
  .usage .u-with { border-left-color: var(--good); }
  .usage .u-label { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; color: var(--muted); }
  .usage .u-without .u-label { color: var(--bad); }
  .usage .u-with .u-label { color: var(--good); }
  .usage .u-text { font-size: .9rem; color: #c7cadb; white-space: pre-wrap; }
  .usage pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0f1117; overflow-x: auto; white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .84rem; line-height: 1.45; color: #d7dbe8; }
  .usage .u-benefit { padding: 9px 12px; border-radius: 10px; background: rgba(47,191,113,0.14); font-size: .9rem; color: var(--text); }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.btn {
    flex: 1; padding: 14px; font-size: 1rem; border-radius: 12px; border: none;
    background: var(--accent); color: white; cursor: pointer; font-weight: 600;
  }
  button.btn.secondary { background: #232838; color: var(--text); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .result { text-align: center; padding: 20px 0; }
  .result .score { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .blockscores { margin-top: 20px; text-align: left; }
  .blockscores .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: .9rem; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 380px; width: 100%; }
  .modal h3 { margin-top: 0; }
  .modal .btn { margin-top: 10px; }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f9; --card: #ffffff; --text: #1b1d27; --muted: #6b6f80;
      --border: #e3e5ee;
    }
    .opt { background: #f7f8fc; }
    .explain { background: #f0f2fa; color: #3a3d4d; }
    .usage .u-part { background: #f0f2fa; }
    .usage .u-text { color: #3a3d4d; }
    .usage pre { background: #eceef7; color: #23262f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="../index.html">&larr; Все тесты</a>
      <div style="display:flex; gap:8px;">
        
        <button class="iconbtn" id="syncBtn">☁️ Синхронизировать</button>
      </div>
    </div>
    <h1>Git и патчи: format-patch, am, rebase</h1>
    <div class="progressbar"><div id="progressFill" style="width:0%"></div></div>
    <div class="meta">
      <span id="blockLabel"></span>
      <span id="progressText">0 / 50</span>
    </div>
  </header>

  <div id="quizArea"></div>

  <div id="resultArea" style="display:none"></div>

  <div style="margin-top:24px; text-align:center;">
    <button class="btn secondary" id="resetBtn">Сбросить прогресс и начать заново</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>Синхронизация всех тестов с Google Drive</h3>
    <p id="syncStatus" style="color:var(--muted); font-size:.9rem;">Один вход — синхронизируются сразу все тесты.</p>
    <button class="btn" id="syncUploadBtn">⬆️ Отправить весь прогресс в Drive</button>
    <button class="btn secondary" id="syncDownloadBtn">⬇️ Загрузить весь прогресс из Drive</button>
    <button class="btn secondary" id="syncCloseBtn">Закрыть</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../sync.js"></script>
<script>
(function () {
  const TEST_ID = "git_patches";
  const QUESTIONS = [{"q": "Что такое коммит в git?", "options": ["Снимок состояния дерева с ссылкой на предыдущий снимок", "Копия изменённых файлов, сохранённая в отдельном каталоге", "Список изменённых строк относительно предыдущей версии", "Запись в журнале о факте изменения файла в репозитории"], "correct": 0, "explain": "Внутри git хранит снимки, а не разницу. Разница вычисляется при показе, и именно она превращается в патч, когда коммит нужно передать наружу.", "usage": {"code": true, "without": "Историю правок ведут копиями каталога с датами в имени.", "with": "git commit -m 'increase scan timeout'", "benefit": "Любое состояние восстанавливается точно и мгновенно."}}, {"q": "Что делает git add перед коммитом?", "options": ["Сохраняет изменения в истории репозитория немедленно", "Помечает изменения как готовые войти в следующий коммит", "Создаёт резервную копию файла перед его изменением", "Отправляет изменения в удалённый репозиторий проекта"], "correct": 1, "explain": "Промежуточная область позволяет собрать коммит из части правок. Именно она даёт возможность разложить кашу в дереве на несколько осмысленных коммитов.", "usage": {"code": true, "without": "В один коммит сваливают всё, что накопилось в дереве.", "with": "git add -p src/ap/hostapd.c   # выбрать куски по одному", "benefit": "Коммит содержит одну мысль, а не всё сразу."}}, {"q": "Чем git diff отличается от git diff --staged?", "options": ["Первый показывает все правки, второй только правки в текущем файле", "Первый показывает неподготовленные правки, второй подготовленные", "Первый работает с текстом, второй с двоичными файлами тоже", "Первый показывает разницу с удалённым репозиторием, второй с локальным"], "correct": 1, "explain": "Два разных вопроса: что я ещё не добавил и что уже попадёт в коммит. Путаница между ними — обычная причина коммитов с половиной правок.", "usage": {"code": true, "without": "Коммитят половину правки и обнаруживают это на другой машине.", "with": "git diff          # что не добавлено\ngit diff --staged # что войдёт в коммит", "benefit": "Перед коммитом видно ровно то, что в него попадёт."}}, {"q": "Что показывает git log --oneline?", "options": ["Только коммиты текущего пользователя за последние сутки", "Полный текст каждого коммита с указанием изменённых файлов", "По одной строке на коммит: сокращённый хеш и заголовок", "Список файлов, изменённых в последнем коммите ветки"], "correct": 2, "explain": "Основной способ окинуть историю взглядом. При работе с патчами именно этот список превращается в набор файлов, поэтому важно, чтобы заголовки читались.", "usage": {"code": true, "without": "Историю смотрят полным выводом и тонут в подробностях.", "with": "git log --oneline -10", "benefit": "Структура истории видна с одного экрана."}}, {"q": "Что означает HEAD в git?", "options": ["Первый коммит в истории репозитория, от которого всё началось", "Указатель на текущую позицию, обычно на вершину ветки", "Ветка по умолчанию, создаваемая при инициализации репозитория", "Последний коммит, отправленный в удалённый репозиторий"], "correct": 1, "explain": "От HEAD отсчитываются относительные ссылки вида HEAD~1. Они постоянно нужны при переоформлении истории перед выпуском патчей.", "usage": {"code": true, "without": "Ссылаются на коммиты хешами и путаются при их смене.", "with": "git show HEAD~1\ngit rebase -i HEAD~3", "benefit": "На коммиты ссылаются коротко и без запоминания хешей."}}, {"q": "Что делает git status в рабочем каталоге?", "options": ["Показывает список веток и их связь с удалённым репозиторием", "Показывает историю последних операций над репозиторием", "Показывает изменённые, подготовленные и неотслеживаемые файлы", "Проверяет целостность объектов в базе данных репозитория"], "correct": 2, "explain": "Первая команда при любом сомнении. Она же подскажет, что делать дальше, если вы застряли посреди слияния или переноса коммитов.", "usage": {"code": true, "without": "Действуют вслепую и делают коммит не в том состоянии.", "with": "git status --short", "benefit": "Состояние дерева понятно до выполнения действий."}}, {"q": "Зачем нужен файл gitignore в репозитории?", "options": ["Чтобы задать список файлов, требующих обязательного коммита", "Чтобы неотслеживаемые артефакты не попадали в коммиты", "Чтобы запретить другим участникам менять указанные файлы", "Чтобы ускорить работу команд за счёт пропуска больших файлов"], "correct": 1, "explain": "Результаты сборки, ключи и локальные настройки в историю не нужны. Особенно ключи: попавший в историю секрет удаляется только переписыванием истории.", "usage": {"code": true, "without": "Ключ уезжает в общий репозиторий вместе с обычной правкой.", "with": "*.o\nbuild/\n.env", "benefit": "Мусор и секреты не попадают в историю случайно."}}, {"q": "Что произойдёт при git commit без указания сообщения и без ключа?", "options": ["Сообщение будет составлено из списка изменённых файлов", "Команда завершится ошибкой и ничего не создаст", "Откроется редактор для ввода сообщения коммита", "Коммит создастся с пустым сообщением автоматически"], "correct": 2, "explain": "Открывается редактор, заданный настройкой. Если выйти, не сохранив текст, коммит будет отменён, и это защищает от коммитов без описания.", "usage": {"code": true, "without": "В автоматическом окружении команда виснет в ожидании редактора.", "with": "git commit -m 'краткое описание'", "benefit": "В скриптах команда не подвисает на редакторе."}}, {"q": "Почему заголовок коммита принято делать коротким?", "options": ["Длинные заголовки замедляют работу команд просмотра истории", "Git обрезает заголовок при превышении установленной длины", "Короткий заголовок помещается в строку списка и в имя патча", "Так требует формат хранения объектов в базе репозитория"], "correct": 2, "explain": "Из заголовка получается имя файла патча. Длинный заголовок даёт нечитаемое имя, а в списке истории превращается в обрезанную строку.", "usage": {"code": true, "without": "Имена файлов патчей нечитаемы и не помогают ориентироваться.", "with": "git commit -m 'wifi: increase scan timeout to 5s'\n# -> 0001-wifi-increase-scan-timeout-to-5s.patch", "benefit": "Имя патча само объясняет, что внутри."}}, {"q": "Что такое ветка в git?", "options": ["Копия репозитория, созданная для параллельной работы", "Подвижный указатель на коммит, перемещающийся при новых коммитах", "Отдельный каталог с копией файлов проекта на диске", "Помеченная версия проекта, зафиксированная для выпуска"], "correct": 1, "explain": "Ветка почти ничего не стоит, это просто имя для коммита. Поэтому ветку под каждую правку заводят свободно, и это основа работы с патчами.", "usage": {"code": true, "without": "Правки ведут в одной ветке и не могут разделить их при выпуске.", "with": "git switch -c fix/scan-timeout", "benefit": "Каждая правка живёт отдельно и выпускается независимо."}}, {"q": "Что делает команда git format-patch?", "options": ["Создаёт по файлу патча на каждый коммит в указанном диапазоне", "Форматирует историю, приводя сообщения коммитов к единому виду", "Преобразует патчи обратно в коммиты в текущей ветке", "Проверяет патчи на применимость к текущему состоянию дерева"], "correct": 0, "explain": "Именно эта команда стоит за файлами вида 0001-something.patch. Каждый файл содержит не только разницу, но и автора, дату и сообщение коммита.", "usage": {"code": true, "without": "Патч делают через diff и теряют авторство с описанием.", "with": "git format-patch -3\n# 0001-...patch 0002-...patch 0003-...patch", "benefit": "Патч несёт с собой всю информацию о правке."}}, {"q": "Чем патч из format-patch отличается от вывода git diff?", "options": ["Он включает полные копии изменённых файлов до и после правки", "Он применяется быстрее за счёт заранее вычисленных смещений", "Он содержит только разницу, но в более компактном формате", "Он содержит автора, дату и сообщение коммита помимо разницы"], "correct": 3, "explain": "Разница отвечает на вопрос «что изменилось», патч из format-patch ещё и на вопросы «кто» и «зачем». При переносе правки между деревьями это важнее самой разницы.", "usage": {"code": true, "without": "В историю приезжает правка без автора и без объяснения.", "with": "git format-patch -1   # с автором и сообщением\ngit diff > x.patch   # только разница", "benefit": "История сохраняет авторство и причину правки."}}, {"q": "Что делает команда git am?", "options": ["Применяет патч и создаёт коммит с исходным автором и сообщением", "Показывает список патчей, ожидающих применения к дереву", "Отменяет ранее применённый патч, возвращая прежнее состояние", "Применяет патч к дереву, не создавая коммита в истории"], "correct": 0, "explain": "Обратная операция к format-patch. Коммит воссоздаётся целиком, включая автора, поэтому история в чужом дереве выглядит так же, как в вашем.", "usage": {"code": true, "without": "Патч применяют вручную и авторство теряется по дороге.", "with": "git am 0001-increase-scan-timeout.patch", "benefit": "Коммит восстанавливается вместе с авторством."}}, {"q": "Чем git apply отличается от git am?", "options": ["apply работает с бинарными файлами, а am только с текстовыми", "apply применяет несколько патчей сразу, а am строго по одному", "apply меняет дерево без создания коммита, а am создаёт коммит", "apply требует чистого дерева, а am может работать с правками"], "correct": 2, "explain": "Выбор зависит от цели: посмотреть и доработать правку удобнее через apply, перенести чужую работу как есть — через am.", "usage": {"code": true, "without": "Применяют патч и получают лишний коммит там, где он не нужен.", "with": "git apply 0001-fix.patch   # только дерево\ngit am 0001-fix.patch      # дерево и коммит", "benefit": "Выбирается ровно тот эффект, который нужен."}}, {"q": "Что делает ключ --check у команды git apply?", "options": ["Проверяет контрольную сумму файла патча перед применением", "Проверяет соответствие стиля кода правилам проекта", "Проверяет патч на применимость, ничего не изменяя в дереве", "Проверяет, что все файлы патча существуют учили замечания к двум. Как показать рецензенту только изменения второй версии?", "options": ["Отправить только два исправленных патча отдельным письмом", "Приложить текстовое описание внесённых изменений к набору", "Отправить полный набор заново с пометкой о версии в теме", "Показать разницу между первой и второй версией набора"], "correct": 3, "explain": "Шаг 1: полный набор заставит вычитывать всё заново. Шаг 2: два патча отдельно потеряют связь с остальными. Шаг 3: сравнение версий набора показывает ровно дельту.", "usage": {"code": true, "without": "Рецензент вычитывает четыре патча ради двух правок.", "with": "git range-diff main..v1 main..v2", "benefit": "Повторная проверка занимает минуты вместо часа."}}, {"q": "В слое 6 патчей. После обновления апстрима 2 из них не применяются, а ещё 1 применяется вхолостую. Что с последним?", "options": ["Его надо перевыпустить, как и два непримененных патча", "Патч повреждён и не содержит изменений внутри себя", "Патч применяется к файлу, отсутствующему в новой версии", "Апстрим уже содержит эту правку, патч пора удалить"], "correct": 3, "explain": "Шаг 1: патч применяется без ошибки. Шаг 2: но ничего не меняет, значит код уже в нужном виде. Шаг 3: апстрим принял эту правку, и патч стал лишним.", "usage": {"code": true, "without": "Устаревшие патчи копятся годами и мешают обновлениям.", "with": "git apply --check 0003-fix.patch\ngit apply --stat 0003-fix.patch  # 0 изменений", "benefit": "Набор патчей сокращается при каждом обновлении."}}, {"q": "Коллега прислал файл, сделанный через git diff. После применения в истории появился коммит с вашим именем. Почему?", "options": ["Команда применения всегда указывает автором применившего", "Настройки репозитория подменяют автора при любом применении", "Авторство потерялось при передаче файла по электронной почте", "Патч из diff не содержит автора, и коммит создали вы сами"], "correct": 3, "explain": "Шаг 1: diff содержит только разницу. Шаг 2: автор и сообщение в нём отсутствуют. Шаг 3: коммит пришлось создавать вам, поэтому автором стали вы.", "usage": {"code": true, "without": "Авторство чужой работы теряется при переносе правок.", "with": "# просить коллегу присылать format-patch\ngit format-patch -1", "benefit": "Авторство сохраняется при переносе между деревьями."}}, {"q": "Нужно срочно переключиться на другую ветку, но в дереве есть незаконченная правка. Коммитить её рано. Что сделать?", "options": ["Закоммитить правку и потом отменить коммит после возврата", "Скопировать изменённые файлы в сторону и восстановить позже", "Убрать правку во временное хранилище и вернуть после переключения", "Переключиться принудительно, правка сохранится автоматически"], "correct": 2, "explain": "Шаг 1: коммитить полуготовое означает мусор в истории. Шаг 2: копирование файлов руками легко сделать неполно. Шаг 3: временное хранилище убирает правку и возвращает её одной командой.", "usage": {"code": true, "without": "Полуготовая правка попадает в историю как обычный коммит.", "with": "git stash\ngit switch release\ngit switch -\ngit stash pop", "benefit": "Переключение не требует мусорных коммитов."}}, {"q": "Правка сделана в 3 коммита и отправлена в апстрим. Через месяц апстрим принял только первый. Что делать с остальными в своём слое?", "options": ["Оставить два непринятых как патчи, первый удалить при обновлении", "Объединить два оставшихся в один патч и отправить заново", "Удалить все три патча: правка считается переданной проекту", "Оставить все три патча до принятия всей серии целиком"], "correct": 0, "explain": "Шаг 1: принятый коммит появится в апстриме при обновлении версии. Шаг 2: держать его патчем значит получить конфликт. Шаг 3: два непринятых остаются патчами до их принятия.", "usage": {"code": true, "without": "Принятая апстримом правка остаётся патчем и ломает обновление.", "with": "# после обновления: убрать 0001, оставить 0002 и 0003", "benefit": "Слой содержит только то, чего в апстриме ещё нет."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + escapeHtml(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(q.q) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
