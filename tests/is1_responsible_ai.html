<script>
(function () {
  const TEST_ID = "is1_responsible_ai";
  const QUESTIONS = [{"q": "В стандартном data science & machine learning journey из лекции какая стадия следует сразу за Model training и как она описана на схеме?", "options": ["Data preparation - очистка данных и извлечение признаков", "Data visualization - графическое представление полученных insights", "Model evaluation - определение accuracy и performance модели", "Model deployment - интеграция аналитического решения в приложение"], "correct": 2, "explain": "На схеме journey за Model training сразу идёт Model evaluation - determination of model accuracy and performance. Только после неё следуют Data visualization как graphical representation of the insights и Production - Model deployment как интеграция решения в приложение. Data preparation стоит гораздо раньше - до выбора метода и обучения модели (RAI, слайд 3).", "usage": {"code": false, "without": "На защите проекта студент говорит, что точность модели «проверяется на этапе визуализации», и в отчёте путает порядок стадий.", "with": "Он называет Model evaluation отдельной стадией сразу после обучения и описывает её как измерение accuracy и performance, а визуализацию и деплой ставит после неё.", "benefit": "Верная структура DS-проекта в отчёте и на тесте."}}, {"q": "Что такое Data Centric AI и как, по диаграмме на слайде лекции, распределяются усилия между Data Preparation и Modelling?", "options": ["Фокус на данных вместо кода; 80% усилий на Data Preparation, 20% на Modelling", "Фокус на коде вместо данных; 80% усилий на Modelling, 20% на Data Preparation", "Фокус на данных вместо кода; 50% усилий на Data Preparation, 50% на Modelling", "Фокус на архитектуре модели; 20% усилий на Data Preparation, 80% на Modelling"], "correct": 0, "explain": "Слайд определяет Data Centric AI как способ программирования AI-систем с фокусом на данных вместо кода (shift in focus от Model-Centric к Data-Centric), а круговая диаграмма отдаёт 80% усилий Data Preparation и 20% Modelling. Вариант с 80% на Modelling переворачивает диаграмму (RAI, слайд 5).", "usage": {"code": false, "without": "Команда закладывает в план проекта неделю на данные и месяц на подбор архитектуры, а потом тонет в грязных данных.", "with": "План строится по принципу Data Centric AI: основное время уходит на подготовку и качество данных, моделирование - меньшая часть.", "benefit": "Реалистичный план и меньше сюрпризов с данными."}}, {"q": "Как в лекции, построенной по курсу Datacamp, определяется Responsible AI?", "options": ["Закон Европейского союза, который делит AI-системы на четыре уровня риска и запрещает social scoring", "Набор алгоритмов для автоматического устранения bias в обучающих данных и в предсказаниях готовой модели", "Требование технической надёжности модели: точность, устойчивость и воспроизводимость результатов на тестах", "Практика проектирования, разработки и внедрения AI с учётом его этических и социальных последствий"], "correct": 3, "explain": "По слайду RAI - the practice of designing, developing, and deploying AI with an awareness of its ethical implications and societal impacts; это не только технология, но и ценности и принципы её использования. Четыре уровня риска и запрет social scoring - это EU AI Act со слайда 33, а не определение RAI (RAI, слайд 21).", "usage": {"code": false, "without": "На вопрос «что такое Responsible AI» студент отвечает про библиотеку для устранения bias и получает ноль баллов.", "with": "Он формулирует RAI как практику, охватывающую весь цикл от проектирования до внедрения с учётом этики и влияния на общество.", "benefit": "Чёткое определение базового термина курса."}}, {"q": "На guidelines какой организации, по лекции, в основном базируются принципы Responsible AI?", "options": ["GPAI - партнёрство 29 стран, предлагающее сеть экспертов и guidelines по AI", "OECD - межправительственная организация 38 стран с OECD.AI policy observatory", "UNESCO - агентство ООН с глобальными рекомендациями по этичному AI", "NIST - институт стандартов США, разработавший AI Risk Management Framework"], "correct": 1, "explain": "Слайд с принципами RAI прямо говорит: they are largely based on the guidelines set forth by the OECD - межправительственной организации с 38 странами-членами, основанной в 1961 году и ведущей OECD.AI policy observatory. GPAI, UNESCO и NIST упоминаются позже лишь как примеры voluntary guidelines, а не как основа принципов лекции (RAI, слайд 24).", "usage": {"code": false, "without": "В отчёте по RAI студент ссылается на «принципы UNESCO» и не может назвать первоисточник, когда преподаватель спрашивает.", "with": "Он ссылается на OECD AI principles и знает, что это организация 38 стран с собственным policy observatory, а GPAI, UNESCO и NIST - лишь другие примеры voluntary guidelines.", "benefit": "Правильная ссылка на первоисточник принципов RAI."}}, {"q": "К какому из шести принципов RAI по OECD относится пояснение «in the end, we simply cannot blame the AI»?", "options": ["Privacy and data governance - AI уважает privacy и безопасно обращается с данными", "Transparency and explainability - пользователи понимают, как и почему принято решение", "Accountability - за AI-системы и их результаты должна быть ясная ответственность", "Robustness and safety - AI должен работать безопасно при любых условиях"], "correct": 2, "explain": "Фраза «we simply cannot blame the AI» на слайде завершает принцип Accountability: за AI-системы и их результаты должна быть clear accountability, то есть отвечают люди. Transparency and explainability - о том, чтобы пользователи понимали, как принимаются решения (RAI, слайд 24).", "usage": {"code": false, "without": "На разборе инцидента с ошибочным решением модели команда разводит руками: «так решил алгоритм», и виноватых нет.", "with": "Команда заранее назначает ответственных за результаты системы, потому что по принципу Accountability винить AI нельзя.", "benefit": "Ясная зона ответственности за решения AI."}}, {"q": "Какое соответствие «пример AI-системы - уровень риска по EU AI Act» верно согласно лекции?", "options": ["Chatbots - Limited risk", "Spam filters - High risk", "Video games - Limited risk", "Social scoring - High risk"], "correct": 0, "explain": "Чат-боты - пример Limited risk: нужны specific transparency obligations, пользователь должен знать, что общается с AI. Spam filters и video games - Minimal risk со свободным использованием, а government social scoring - Unacceptable risk и запрещён (RAI, слайд 33).", "usage": {"code": false, "without": "Разработчик выпускает чат-бота поддержки без пометки, что это AI, и нарушает требование прозрачности EU AI Act.", "with": "Он относит бота к Limited risk и добавляет явное уведомление, что пользователь общается с AI.", "benefit": "Соблюдение EU AI Act без лишних затрат."}}, {"q": "Что означает аббревиатура CT на схеме MLOps stages of the CI/CD automated ML pipeline?", "options": ["Continuous testing, автоматический прогон тестов", "Continuous tuning, автоподбор гиперпараметров", "Continuous transfer, перенос модели в продакшн", "Continuous training, непрерывное обучение модели"], "correct": 3, "explain": "Легенда слайда расшифровывает: CI continuous integration, CD continuous delivery, CT continuous training, PL pipeline. Тесты входят в CI как build, test & package pipeline components, а не в CT (RAI, слайд 15).", "usage": {"code": false, "without": "Инженер читает «Model CT» как этап тестирования и не закладывает автоматическое переобучение при concept drift.", "with": "Он понимает CT как continuous training и настраивает триггеры переобучения по новым данным и деградации качества.", "benefit": "Пайплайн, который сам обновляет модель, а не только проверяет её."}}, {"q": "С чего, согласно определению AI governance в лекции, начинается управление AI в организации?", "options": ["С назначения в штат Chief AI Governance Officer", "С обеспечения того, что бизнес выигрывает от AI", "С выбора алгоритма и архитектуры модели под задачу", "С сертификации AI-системы по стандарту ISO"], "correct": 1, "explain": "По слайду AI governance is all about making sure the business benefits from developing or deploying an AI, затем проверка применимых rules and regulations, затем ethical guidelines and frameworks и, наконец, качественная реализация с поддержкой организации и учётом внешних stakeholders. Выбор алгоритма в определение governance не входит (RAI, слайд 46).", "usage": {"code": false, "without": "Компания начинает governance с покупки сертификата и найма менеджера, а AI-проект так и не приносит бизнесу пользы.", "with": "Команда сначала проверяет, что AI даёт бизнесу выгоду, затем разбирает регуляции и этические рамки, потом внедряет.", "benefit": "Governance в правильном порядке шагов."}}, {"q": "Как в лекции описан Trustworthy AI в тройке Ethical, Trustworthy и Responsible AI?", "options": ["Объясняет пользователю, как и почему принято каждое решение", "Работает в рамках моральных принципов и приносит пользу без вреда", "Надёжен и принимает решения предсказуемо и последовательно", "Объединяет этичность и надёжность и добавляет accountability"], "correct": 2, "explain": "По слайду Trustworthy AI is reliable and makes decisions in a predictable and consistent manner. Рамки моральных принципов - это Ethical AI, а объединение обоих плюс accountability - Responsible AI (RAI, слайд 57).", "usage": {"code": false, "without": "В отчёте студент называет модель «trustworthy», потому что она этична, и не упоминает стабильность решений.", "with": "Он разделяет термины: Ethical - мораль, Trustworthy - надёжность и предсказуемость, Responsible - оба плюс ответственность.", "benefit": "Точное использование трёх ключевых терминов курса."}}, {"q": "Что в лекции обозначает pitfall под названием bluewashing, он же ethics washing?", "options": ["Компания выдаёт свои AI-продукты за этичные без реальных действий", "Сотрудники используют AI-инструменты без явного одобрения и надзора организации", "Организация выбирает самое дешёвое AI-решение без due diligence по этике", "Организация не замечает этическую проблему из-за implicit bias или культурных норм"], "correct": 0, "explain": "Bluewashing - компания portraying its products or services as ethically sound or responsible, когда они не соответствуют стандартам: façade of ethical commitment without substantive action. Использование AI без одобрения организации - это Shadow AI, выбор без due diligence - AI shopping, незамеченная проблема из-за implicit bias - ethical blind spots (RAI, слайд 64).", "usage": {"code": false, "without": "Аналитик видит на сайте вендора слоган «Ethical AI inside» и принимает его за доказательство соответствия RAI.", "with": "Он распознаёт признаки bluewashing и запрашивает реальные артефакты: оценки bias, документацию, процессы аудита.", "benefit": "Умение отличать маркетинг от реальной практики RAI."}}, {"q": "В лекции Responsible AI и AI Ethics сопоставлены по набору характеристик. Какая из характеристик относится к RAI, а не к AI Ethics?", "options": ["Фокус на людях и обществе", "Упор на метрики и фреймворки", "Более широкий охват проблем", "Философские вопросы и дилеммы"], "correct": 1, "explain": "RAI описан как практическая сторона: focus on implementing ethical considerations, putting theory into action, reliance on metrics and frameworks. Философские вопросы, этические дилеммы, фокус на людях и обществе и более широкий охват - это характеристики AI Ethics (RAI_for students_v2, слайд 25).", "usage": {"code": false, "without": "На защите проекта студент называет RAI «философией про мораль» и не может объяснить, чем его работа по метрикам fairness отличается от этики.", "with": "Он разводит понятия: этика ставит вопросы, RAI внедряет ответы через метрики и фреймворки, и его отчёт по fairness-метрикам ложится именно в RAI.", "benefit": "Точный ответ на вопрос о различии RAI и AI Ethics в тесте и на защите."}}, {"q": "По EU AI Act какое требование предъявляется к high-risk системам, но не к limited-risk системам вроде чатботов?", "options": ["Свободное использование без каких-либо обязательств", "Полный запрет на использование такой системы в ЕС", "Строгий compliance до вывода системы на рынок", "Обязанность сообщать пользователю, что он общается с AI"], "correct": 2, "explain": "High-risk системы в критичных секторах вроде education, law enforcement, employment подлежат strict compliance requirements before they can be put on the market. Обязанность прозрачности, чтобы пользователь знал об общении с AI, относится к limited risk, полный запрет - к unacceptable risk, а свободное использование - к minimal risk (RAI_for students_v2, слайд 33).", "usage": {"code": false, "without": "Команда выпускает систему отбора резюме, добавив только пометку «вы общаетесь с AI», и получает претензию регулятора за отсутствие compliance-процедур.", "with": "Команда заранее относит систему отбора персонала к high-risk и проходит требования соответствия до релиза, а пометку об AI оставляет для чатбота поддержки.", "benefit": "Правильный уровень обязательств выбирается ещё на стадии проектирования."}}, {"q": "В схеме MLOps с автоматизированным ML pipeline для continuous training перечислены триггеры запуска пайплайна. Какое событие среди них НЕ названо?", "options": ["Коммит нового кода в репозиторий", "Существенный сдвиг распределения данных", "Появление новых данных для обучения", "Деградация качества работы модели"], "correct": 0, "explain": "Схема перечисляет пять триггеров automated pipeline: on demand, on a schedule, on availability of new training data, on model performance degradation, on significant changes in the data distributions, то есть concept drift. Коммит кода в source repository запускает CI-этап build, test and package pipeline components на следующем слайде, а не сам пайплайн continuous training (RAI_for students_v2, слайд 13).", "usage": {"code": false, "without": "Инженер настраивает переобучение модели только по расписанию раз в месяц и три недели живёт с моделью, которая уже деградировала после сдвига данных.", "with": "Он подключает триггеры по деградации метрик и по concept drift, и пайплайн сам переобучает модель, когда данные изменились.", "benefit": "Модель обновляется по реальным событиям, а не по календарю."}}, {"q": "Какой из документов на слайде «Global Overview of AI Regulations» описан как расширяющий GDPR с упором на digital transparency and accountability?", "options": ["AI Bill of Rights от Белого дома", "Bletchley Declaration из UK", "AI Act с его risk-based approach", "Digital Service Act, он же DSA"], "correct": 3, "explain": "DSA на слайде описан именно так: expands GDPR focusing on digital transparency and accountability. AI Act - это risk-based approach с extensive requirements для разработчиков и деплоеров high-risk AI, AI Bill of Rights опубликован White House и стоит в блоке America, а Bletchley Declaration - post-Brexit стратегия UK, а не документ ЕС (RAI_for students_v2, слайд 32).", "usage": {"code": false, "without": "На вопрос заказчика «какие европейские правила про прозрачность платформ» аналитик уверенно называет AI Act и промахивается мимо DSA.", "with": "Аналитик разводит три акта: GDPR про приватность, DSA про прозрачность и подотчётность цифровых сервисов, AI Act про риск-уровни AI-систем.", "benefit": "Быстрая ориентация в том, какой регламент ЕС к чему относится."}}, {"q": "Лекция делит AI frameworks на voluntary guidelines, standards и certifications. Чем certification отличается от двух других типов?", "options": ["Certification задаёт universal norms, standard является внутренней самооценкой", "Certification подтверждается третьей стороной, guideline не имеет legal enforcement", "Certification является внутренней самооценкой, standard подтверждается третьей стороной", "Certification имеет legal enforcement, guideline задаёт universal norms качества"], "correct": 1, "explain": "Certifications - это third-party validations того, что система соответствует стандартам или этическим guidelines; voluntary guidelines служат compasses, guiding responsible AI without legal enforcement, а standards задают universal norms for quality and consistency. Внутренней самооценкой не назван ни один из типов, отсутствие legal enforcement источник явно приписывает guidelines, а universal norms относит к standards, а не к guidelines (RAI_for students_v2, слайды 35-38).", "usage": {"code": false, "without": "Менеджер пишет в тендере, что продукт «сертифицирован по принципам OECD», хотя OECD - это добровольные принципы, и получает замечание от юристов.", "with": "Он различает: принципы OECD - guideline, ISO/IEC 42001 - standard, а сертификат от третьей стороны - certification, и формулирует заявку корректно.", "benefit": "Правильные слова в документах и в ответе на тест о типах фреймворков."}}, {"q": "Какое описание стандарта ISO/IEC 42001 верно по лекции?", "options": ["Набор best practices этичного использования AI без процессов управления", "Набор рекомендаций по развёртыванию AI с упором прежде всего на приватность данных", "Стандарт о том, как управлять AI-системами в организации и улучшать их", "Руководство по разработке AI-технологий с упором на спецификации оборудования"], "correct": 2, "explain": "На слайде 37 ISO/IEC 42001 specifies the requirements and provides guidance for establishing, implementing, maintaining and continually improving an AI, а квиз на слайде 39 формулирует то же как how to manage and improve AI systems within organizations. Варианты про hardware specifications, отсутствие management processes и фокус на data privacy - это дистракторы из того же квиза (RAI_for students_v2, слайды 37, 39).", "usage": {"code": false, "without": "На собеседовании кандидата спрашивают про ISO/IEC 42001, и он отвечает «что-то про защиту данных», путая его с GDPR.", "with": "Кандидат объясняет: 42001 - стандарт системы менеджмента AI, а presumption of conformity с AI Act будут давать европейские стандарты CEN/CENELEC.", "benefit": "Уверенный ответ на вопрос квиза о стандартах AI."}}, {"q": "Какая из непрерывных практик Responsible AI, по лекции, требует качественных суждений вроде user experience и societal impact, выходящих за рамки количественных метрик?", "options": ["Evaluating, оценка эффективности и этичности AI по заданным критериям", "Auditing, формальная проверка соответствия законам и политикам", "Accountability, закрепление ответственных за устранение недостатков", "Monitoring, постоянное наблюдение за работой AI в реальных сценариях"], "correct": 0, "explain": "Evaluating - это оценка эффективности и этичной работы AI-системы по установленным критериям: влияние на стейкхолдеров, проверка fairness и bias, соответствие ценностям организации. Слайд подчёркивает, что такая оценка требует качественных суждений, например о user experience и societal impact, выходящих за рамки количественных метрик. Monitoring - постоянное наблюдение за тем, что система работает как задумано, auditing - более формальная, часто сторонняя проверка соответствия законам и политикам, а accountability - закрепление того, кто отвечает за исправление найденных недостатков (RAI_for students_v2, слайды 66-68).", "usage": {"code": false, "without": "Команда отчитывается о «полной оценке» модели одними графиками accuracy и не замечает, что пользователи из уязвимой группы систематически получают отказы.", "with": "Команда дополняет метрики качественной оценкой опыта пользователей и влияния на стейкхолдеров, как того требует evaluating.", "benefit": "Оценка модели покрывает и цифры, и реальные последствия для людей."}}, {"q": "На шаге 7 «Implement governance tools» из 8-Step Journey to RAI внедрение AI governance показано в виде пирамиды. Что лежит в её основании и кто разработал диагностический инструмент AI Readiness Quotient, AI-RQ, для проверки готовности организации?", "options": ["Procedures for compliance в основании, AI-RQ от Wharton", "Foundational principles в основании, AI-RQ от NIST", "Guidelines and policies в основании, AI-RQ от OECD", "Foundational principles в основании, AI-RQ от Wharton"], "correct": 3, "explain": "Пирамида строится снизу вверх: в основании foundational principles, отражающие core values организации, над ними middle-tier guidelines and policies, выведенные из этих принципов, и на вершине top-level procedures for compliance. Слайд добавляет, что для проверки готовности организация может использовать AI Readiness Quotient, AI-RQ, диагностический инструмент, разработанный Wharton. Datacamp лишь источник курса, а NIST и OECD упоминаются в лекции в связи с фреймворками оценки рисков (RAI_for students_v2, слайд 54).", "usage": {"code": false, "without": "Компания начинает внедрение governance с написания процедур соответствия, не сформулировав принципов, и процедуры противоречат друг другу.", "with": "Компания сначала фиксирует принципы, на них строит политики, затем процедуры, и проверяет готовность через AI-RQ.", "benefit": "Governance выстраивается в правильном порядке от основания к вершине."}}, {"q": "К какой категории в «Spectrum of AI risks» лекция относит hallucinations и data poisoning?", "options": ["Business risks репутационного характера", "Security and operational risks системы", "Business risks финансового характера", "Privacy risks для персональных данных"], "correct": 1, "explain": "Слайд группирует hallucinations, data poisoning and corruption и data leakage and breaches под security and operational risks, добавляя, что они несут enormous reputational and legal consequences. Privacy risks и business risks с подтипами reputational и financial выделены как отдельные категории спектра (RAI_for students_v2, слайд 29).", "usage": {"code": false, "without": "Инженер списывает выдуманные ответы чатбота на «репутационную мелочь» и не включает их в реестр операционных рисков.", "with": "Он относит hallucinations к security and operational risks и закладывает тесты на них до релиза.", "benefit": "Риски классифицируются так же, как в лекции и в тесте."}}, {"q": "На слайде «Risks at each stage of AI Development» какая стадия описана как conceptualizing the solution, identifying key requirements и определение того, как AI впишется в существующие workflows или создаст новые?", "options": ["Deployment, с интеграцией модели в production", "Monitoring, со слежением за метриками модели в production", "Design, с целями и архитектурой данных", "Development, со сборкой, обучением и тестированием модели"], "correct": 2, "explain": "Это описание стоит в блоке под колонкой Design, где перечислены define objectives, business value, planning the data architecture, figuring out budget impact и checking support from stakeholders. Development - это build, train, test; Deployment - model integration into production environment, performance monitoring, model update or refining; отдельной стадии Monitoring на слайде нет. Блок Risks с overfitting/underfitting на слайде растянут сразу под колонками Development и Deployment, поэтому привязывать его к одной стадии нельзя (RAI_for students_v2, слайд 28).", "usage": {"code": false, "without": "Студент относит формулировку целей и планирование архитектуры данных к этапу разработки модели и путает стадии в отчёте.", "with": "Он привязывает conceptualizing the solution и планирование данных к Design, а build, train, test к Development.", "benefit": "Стадии AI-разработки раскладываются так, как на слайде лекции."}}, {"q": "Компания в ЕС внедряет AI-систему для автоматического отбора резюме кандидатов при найме. К какому уровню риска по EU AI Act относится такая система и что это влечёт?", "options": ["Limited risk - достаточно предупредить кандидата об участии AI", "Minimal risk - свободное использование без каких-либо обязательств", "Unacceptable risk - полный запрет применения таких систем", "High risk - строгие требования соответствия до вывода на рынок"], "correct": 3, "explain": "Employment входит в перечень critical sectors, и такие системы отнесены к high risk: они подлежат strict compliance requirements до выхода на рынок. Limited risk с обязанностью прозрачности - это уровень чат-ботов, а не систем найма (RAI, слайд 33).", "usage": {"code": false, "without": "Компания считает скрининг резюме «обычной автоматизацией», выпускает продукт без проверки соответствия и получает претензии регулятора.", "with": "Ты сразу относишь систему найма к high risk и планируешь требования соответствия ещё до запуска.", "benefit": "Правильно оцениваешь регуляторную нагрузку проекта на старте."}}, {"q": "Стартап выпускает в ЕС генеративную модель общего назначения, не привязанную к конкретному применению. Какие минимальные требования EU AI Act к ней применимы?", "options": ["Никаких - все модели общего назначения попадают в minimal risk", "Transparency, включая watermarking и соблюдение copyright", "Полный запрет выпуска как практики уровня unacceptable risk", "Только DPIA по GDPR, как при любой обработке личных данных"], "correct": 1, "explain": "AI Act содержит minimum standards для всех foundation models, называемых General-Purpose AI, по transparency, включая watermarking и adherence to copyright. Это не minimal risk без требований и не запрет: запрещены лишь практики уровня unacceptable risk вроде social scoring (RAI, слайд 33).", "usage": {"code": false, "without": "Стартап выпускает генеративную модель в ЕС без маркировки контента и учёта авторских прав, полагая, что регулируются только конкретные применения.", "with": "Ты закладываешь watermarking и соблюдение copyright в требования к модели как минимальную планку AI Act.", "benefit": "Модель общего назначения выходит на рынок ЕС без сюрпризов по transparency."}}, {"q": "Три задачи: модель должна работать офлайн на смартфоне без сети; ночью пересчитывать скоринг всей клиентской базы; отвечать веб-приложению в реальном времени. Какое сопоставление с вариантами model serving из MLOps-схемы верно?", "options": ["Embedded model on device; microservices with REST API; batch prediction system", "Microservices with REST API; embedded model on device; batch prediction system", "Embedded model on device; batch prediction system; microservices with REST API", "Batch prediction system; microservices with REST API; embedded model on device"], "correct": 2, "explain": "По MLOps-схеме три варианта serving: embedded model для edge/mobile устройства работает без сети, batch prediction system подходит для ночного пересчёта всей базы, а microservices with a REST API отдают online predictions приложению в реальном времени. Остальные варианты перепутывают режимы (RAI, слайд 12).", "usage": {"code": false, "without": "Ты поднимаешь REST-микросервис для мобильного приложения, и оно перестаёт работать без сети.", "with": "Ты подбираешь serving под сценарий: embedded на устройстве, batch для ночного пересчёта, REST API для online-ответов.", "benefit": "Архитектура развёртывания соответствует реальному режиму использования модели."}}, {"q": "Performance monitoring в продакшене показал, что распределение входных данных сильно изменилось по сравнению с обучающими, то есть произошёл concept drift. Что должно произойти в зрелой MLOps-системе с автоматизацией CT?", "options": ["Trigger запускает автоматизированный пайплайн, который переобучает модель", "Data scientist вручную перезапускает ноутбук с экспериментом и обновляет модель", "CI пересобирает и тестирует код компонентов пайплайна без переобучения", "Serving переключается с online-предсказаний на batch prediction system"], "correct": 0, "explain": "На схеме ML pipeline automation for CT одним из триггеров является significant changes in the data distributions, то есть concept drift: performance monitoring запускает trigger, и автоматизированный пайплайн проходит validation, preparation, training, evaluation и кладёт модель в model registry. Ручной перезапуск ноутбука - это manual process, от которого CT как раз уходит (RAI, слайд 13).", "usage": {"code": false, "without": "После дрейфа данных модель месяцами деградирует, пока кто-то вручную не заметит и не переобучит её.", "with": "Мониторинг сам запускает пайплайн переобучения при дрейфе, и модель обновляется без участия человека.", "benefit": "Качество модели в продакшене поддерживается автоматически."}}, {"q": "Модель показывает 99% точности на обучающих данных, и клиент просит сдать проект. Какая best practice из рекомендаций лекции здесь под угрозой и что нужно сделать?", "options": ["Data quality - ещё раз очистить обучающую выборку от пропусков и дубликатов", "Transparent methodology - усложнить модель и задокументировать выбор алгоритма", "Visualizations - добавить графики, чтобы результат стал убедительнее для клиента", "Validation and testing - проверить модель на unseen data подходящими метриками"], "correct": 3, "explain": "Best practice Validation and Testing требует rigorously test с appropriate metrics и убедиться, что модель performs well on unseen data - 99% на обучающей выборке об обобщающей способности ничего не говорит. Усложнение модели, графики для клиента или повторная чистка train-выборки эту проверку не заменяют (RAI, слайд 7).", "usage": {"code": false, "without": "Сдаёшь модель с 99% на train, а в продакшене она проваливается на новых данных.", "with": "Перед сдачей проверяешь модель на отложенных данных подходящими метриками и показываешь честный результат.", "benefit": "Клиент получает модель, которая работает на реальных данных, а не только на обучающих."}}, {"q": "Проект в ЕС обрабатывает персональные данные пациентов с помощью AI. Какой инструмент из слайда об AI Certification служит формой сертификации того, что система соблюдает privacy и нормы защиты данных?", "options": ["Responsible AI Institute - программа сертификации AI-систем", "DPIA - Data Protection Impact Assessment, требуемый GDPR", "AIGP - сертификация специалистов по AI governance через IAPP", "CEN/CENELEC - европейские стандарты для презумпции соответствия"], "correct": 1, "explain": "На слайде AI Certification сказано, что DPIA, required under GDPR, служит формой сертификации того, что AI-приложение respects user privacy and data protection norms. Программа Responsible AI Institute сертифицирует AI-системы в целом без привязки к privacy, AIGP через IAPP - это сертификация специалистов по AI governance, а не системы, а CEN/CENELEC - стандарты со слайда 37, дающие презумпцию соответствия AI Act, а не сертификация (RAI, слайд 38).", "usage": {"code": false, "without": "Ищешь для медицинского AI-проекта абстрактную «сертификацию по privacy» и не знаешь, с чего начать.", "with": "Проводишь DPIA по GDPR как признанную форму подтверждения соблюдения privacy.", "benefit": "Есть конкретный инструмент для подтверждения защиты персональных данных."}}, {"q": "Компания хочет создать внутренний орган, который будет рассматривать спорные AI-проекты и направлять этичную разработку. К какому механизму шага 4 «Leverage internal support mechanisms» это относится и какие корпоративные примеры приводит лекция?", "options": ["Индикатор BCorp, пример - AI Champions и Ethics Board в Telefonica", "Public consultation, пример - AETHER Committee в Meta и Google", "Ethics Board, пример - AI Ethics Board в IBM и Oversight Board в Meta", "Multi-stakeholder approach, пример - AETHER Oversight Board в Microsoft"], "correct": 2, "explain": "Шаг 4 опирается на internal support через Codes of Conduct, Ethics Boards и AI Squads, которые guide and review ethical AI development; примеры на слайде - IBM's AI Ethics Board, Meta's Oversight Board, Telefonica's AI Champions и Microsoft's AETHER Committee. Multi-stakeholder approach - это шаг 5, BCorp - шаг 6, public consultation - категория self-regulation, а не механизм шага 4; к тому же дистракторы приписывают органы не тем компаниям (RAI, слайд 51).", "usage": {"code": false, "without": "Компания собирает внешний совет, хотя нужен внутренний механизм ревью проектов, и путает, чей Oversight Board.", "with": "Создаёшь внутренний Ethics Board по образцу IBM или Meta и ссылаешься на верные примеры.", "benefit": "Внутренний орган ревью AI-проектов строится на проверенных корпоративных образцах."}}, {"q": "Организации нужно оценить не только риски, но и положительное и отрицательное воздействие AI-системы на разных stakeholders и окружающую среду. Какой инструмент из лекции предназначен именно для такого impact assessment?", "options": ["HRIA от Danish Institute for Human Rights или Oxfam", "Инструмент самооценки AI-систем от французского CNIL", "OECD AI Risk Evaluation Framework глобального уровня", "NIST AI RMF вместе с динамичным AI RMF Playbook"], "correct": 0, "explain": "Risk assessment предвидит только negative impact, а impact assessment - positive and negative. Среди примеров impact assessment - Human Rights Impact Assessment от Danish Institute for Human Rights и Oxfam, AIIA нидерландского правительства и Microsoft RAI Impact Assessment. NIST AI RMF, инструмент самооценки CNIL и OECD AI Risk Evaluation Framework перечислены как примеры risk assessment (RAI, слайды 61-63).", "usage": {"code": false, "without": "Берёшь NIST AI RMF для оценки воздействия на stakeholders и получаешь только список рисков без положительных эффектов.", "with": "Выбираешь HRIA или AIIA, когда нужно оценить полный спектр воздействия на stakeholders.", "benefit": "Инструмент оценки соответствует задаче: воздействие, а не только риски."}}, {"q": "Модель кредитного скоринга не использует расу или национальность, но учитывает почтовый индекс клиента. Какой из примеров вреда AI, перечисленных в лекции, здесь проявляется и какой принцип RAI под угрозой?", "options": ["Риск для sustainability - лишние признаки повышают энергозатраты модели", "Риска нет - защищённые признаки исключены, принцип fairness соблюдён", "Риск для robustness and safety - модель нестабильна на новых данных", "Исключение людей по postal code - под угрозой принцип fairness"], "correct": 3, "explain": "Слайд 23 среди примеров вреда AI прямо называет: AI can exclude people based on their postal code or age, и добавляет, что AI systems can inadvertently perpetuate biases. Формальное исключение расы не спасает: решение по индексу всё равно дискриминирует группы, а это принцип fairness and non-discrimination со слайда 24. Robustness and safety и sustainability - другие принципы, к сценарию не относящиеся (RAI, слайды 23-24).", "usage": {"code": false, "without": "Убираешь расу из признаков, оставляешь индекс и уверенно заявляешь, что модель недискриминационна.", "with": "Проверяешь, не исключает ли модель людей по индексу или возрасту, и сравниваешь исходы по группам.", "benefit": "Скрытая дискриминация по косвенным признакам обнаруживается до релиза."}}, {"q": "Отраслевые ассоциации и государственный регулятор совместно вырабатывают стандарты для AI и механизмы контроля их соблюдения. Какая модель из категорий self-regulation описана?", "options": ["AI Ethics advisory council - эксперты разных областей дают рекомендации", "Co-regulation - industry и government вместе задают стандарты и enforcement", "Participatory governance - широкий круг stakeholders участвует в решениях", "Self-assessment and reporting - компании сами оценивают системы по стандартам"], "correct": 1, "explain": "Co-regulation на слайде определена как модель, где industry and government collaborate on setting standards and enforcement mechanisms. Participatory governance - это вовлечение широкого круга stakeholders в принятие решений, а не совместная работа отрасли с государством (RAI, слайд 43).", "usage": {"code": false, "without": "Называешь совместную работу отрасли и регулятора «самооценкой» и не понимаешь, откуда у стандарта механизм enforcement.", "with": "Распознаёшь co-regulation и знаешь, что стандарт и контроль задаются совместно.", "benefit": "Точно классифицируешь модель governance в кейсе или на экзамене."}}, {"q": "Три кейса из лекции: 1) налоговая служба Нидерландов самообучающимся алгоритмом искала мошенничество с детскими пособиями и на основании одних лишь подозрений наказывала малоимущие семьи; 2) по прогнозу к 2027 году AI-индустрия будет потреблять столько же энергии, сколько страна размером с Нидерланды; 3) британская система Oasys, устроенная как «чёрный ящик», два десятилетия влияла на решения в уголовном правосудии, не давая людям доступа к своим данным. Какой принцип Responsible AI нарушен в каждом случае?", "options": ["1 - fairness, 2 - sustainability, 3 - transparency", "1 - transparency, 2 - robustness, 3 - fairness", "1 - fairness, 2 - sustainability, 3 - robustness", "1 - privacy, 2 - sustainability, 3 - fairness"], "correct": 0, "explain": "Налоговый алгоритм наказывал именно малоимущих по одним подозрениям - это дискриминация, нарушение fairness; энергопотребление масштаба целой страны - sustainability; «чёрный ящик» Oasys без доступа людей к своим данным - transparency. Oasys нарушает прозрачность, а не fairness или robustness: суть кейса - закрытость системы и данных, а не доказанная дискриминация или ненадёжность. (RAI_for students_v2, слайд 26)", "usage": {"code": false, "without": "Аналитик видит в новостях кейс с AI, говорит «ну это неэтично» и не может назвать, какой именно принцип пострадал, поэтому обсуждение не превращается в план действий.", "with": "Он раскладывает кейс по принципам: «здесь fairness, здесь transparency» - и сразу ясно, какую проверку добавить в свой проект: аудит на дискриминацию или доступ затронутых людей к данным.", "benefit": "Абстрактная «неэтичность» превращается в конкретный проверяемый принцип."}}, {"q": "Конкурент серией специально составленных сообщений заставил чат-бот интернет-магазина рекомендовать покупателям товар конкурента вместо собственного. К какому типу рисков из лекции относится этот кейс?", "options": ["Privacy risk - раскрытие личных данных клиентов", "Business risk - репутационный ущерб компании", "Legal risk - нарушение действующего законодательства", "Operational risk - нарушение штатной работы системы"], "correct": 3, "explain": "На слайде с примерами рисков манипуляция чат-ботом со стороны конкурента приведена именно как operational risk - нарушена штатная работа системы. Репутационный ущерб может быть следствием, но лекция классифицирует кейс по источнику риска, а к business risks относит увольнения с негативной оглаской и падение удовлетворённости клиентов; privacy risks - это деанонимизация данных и пропущенный троян. (RAI_for students_v2, слайд 30)", "usage": {"code": false, "without": "Инцидент с ботом попадает в отчёт как «репутационная проблема», его отдают PR-отделу, а уязвимость в самой системе так и остаётся незакрытой.", "with": "Инцидент классифицируют как operational risk, и его получает команда, отвечающая за устойчивость модели к манипуляциям, а не только пресс-служба.", "benefit": "Правильный тип риска - правильный владелец и правильная мера."}}, {"q": "Отдел маркетинга самостоятельно подключил генеративный AI-сервис для написания текстов, не уведомив ИТ, юристов и службу безопасности. Какой pitfall из лекции описывает эту ситуацию?", "options": ["Ethical blind spot - неосознанное закрепление стереотипов", "Shadow AI - применение без одобрения и надзора компании", "AI shopping - покупка модной технологии без due diligence", "Bluewashing - декларация этичности без реальных действий"], "correct": 1, "explain": "Shadow AI - это AI-системы, разрабатываемые или используемые внутри организации без явного одобрения и надзора, что даёт риски безопасности и несоблюдения этических стандартов. AI shopping ближе по духу, но означает выбор решений «на вид лучших или дешёвых» без проверки их пригодности, а не обход процедур согласования. (RAI_for students_v2, слайды 64-65)", "usage": {"code": false, "without": "Комплаенс-офицер узнаёт о самодельном AI-инструменте отдела, только когда клиентские данные уже ушли во внешний сервис, и не понимает, как это квалифицировать.", "with": "Он распознаёт shadow AI и применяет меру из лекции: governance решает, какое использование генеративного AI разрешить, а какое ограничить, и заводит реестр инструментов.", "benefit": "Название проблемы сразу тянет за собой готовую меру контроля."}}, {"q": "В программе red and blue teaming лекция перечисляет пять активностей: simulate attacks on AI systems, identify weaknesses in AI algorithms, challenge AI decision-making processes, strengthen AI system defenses, ensure AI systems comply with ethical guidelines. Какие из них относятся к blue team?", "options": ["Identify weaknesses и ensure compliance", "Simulate attacks и identify weaknesses", "Strengthen defenses и ensure compliance", "Challenge decision-making и strengthen defenses"], "correct": 2, "explain": "Blue team отвечает на оценку red team: усиливает защиту системы по найденным уязвимостям и следит за соответствием этическим нормам и стандартам. Все три «атакующие» активности - симуляция атак, поиск слабых мест и challenge процессов принятия решений - это red team. (RAI_for students_v2, слайды 69, 71)", "usage": {"code": false, "without": "Менеджер формирует «команду безопасности AI» из одних атакующих: они находят десять уязвимостей, а отчёт ложится в стол, потому что закрывать их некому.", "with": "Он разделяет роли: red team ищет и атакует, blue team по каждой находке усиливает защиту и проверяет соответствие стандартам - цикл замыкается и повторяется непрерывно.", "benefit": "Найденная уязвимость превращается в закрытую, а не в строчку отчёта."}}, {"q": "Система распознавания лиц, используемая полицией, даёт заметно больше ложных срабатываний на представителях определённых групп населения. Какая мера, по лекции, помогает организации защититься от такой дискриминации со стороны AI?", "options": ["Формирование кросс-функциональных разнообразных команд", "Дообучение модели на большем объёме исходных данных", "Повышение порога уверенности модели при идентификации", "Сертификация системы по стандарту безопасности ISO 27001"], "correct": 0, "explain": "Слайд про DE&I прямо называет ложные срабатывания при идентификации преступников примером того, как AI закрепляет дискриминацию, и указывает, что cross-functional diverse teams помогают от неё защититься, а заодно повышают финансовую отдачу и инновационность. Больше тех же данных лишь закрепит перекос, порог уверенности и сертификация по информационной безопасности перекос в данных не устраняют. (RAI_for students_v2, слайды 56, 58)", "usage": {"code": false, "without": "Команда из пяти похожих друг на друга инженеров тестирует распознавание лиц на себе, довольна результатом и узнаёт о проблеме из новостей после ложного ареста.", "with": "В команду с самого начала входят люди с разным опытом и происхождением, и вопрос «а на ком мы это не проверяли?» звучит на первом же ревью.", "benefit": "Слепые зоны команды выявляются до релиза, а не после скандала."}}, {"q": "Модель показала 95% точности на тестовой выборке, а с первых же дней работы в production даёт около 60%. На какой стадии жизненного цикла AI, по лекции, заложен этот риск и в чём его типичная причина?", "options": ["Design - отсутствие поддержки внешних stakeholders проекта", "Deployment - сбой при интеграции модели в production-среду", "Design - неверная оценка влияния проекта на бюджет компании", "Development - переобучение и нерепрезентативные данные"], "correct": 3, "explain": "Слайд о рисках по стадиям относит переобучение/недообучение и «данные, из-за которых модель хорошо проходит тесты, но проваливается в реальных сценариях» к стадии Development, а best practice из раздела валидации требует убедиться, что модель работает на unseen data. Сбой интеграции дал бы ошибку или отказ системы, а не исправно работающую модель с низкой точностью; бюджет и поддержка stakeholders - активности стадии Design, не связанные с качеством предсказаний. (RAI_for students_v2, слайды 7, 28)", "usage": {"code": false, "without": "Команда винит DevOps за «сломанный деплой», неделю перепроверяет инфраструктуру, а модель всё так же ошибается, потому что переобучена на нерепрезентативных данных.", "with": "Инженер сразу проверяет гипотезу development-стадии: сравнивает распределение production-данных с обучающими и гоняет модель на отложенных unseen data - причина находится за час.", "benefit": "Диагностика начинается с правильной стадии и экономит дни поисков."}}, {"q": "Муниципалитет планирует внедрить AI-систему социального рейтинга граждан, а полиция - real-time биометрическую идентификацию в общественных местах. Как эти проекты квалифицирует EU AI Act?", "options": ["High risk - допуск обоих после строгих compliance-требований", "Unacceptable risk - запрет, у биометрии лишь узкие исключения", "Limited risk - достаточно уведомления граждан о применении AI", "Minimal risk - свободное применение без каких-либо обязательств"], "correct": 1, "explain": "Government social scoring и real-time biometric identification в общественных местах для правоохранительных целей - примеры unacceptable risk: практик с явной угрозой безопасности, средствам к существованию и правам, которые запрещаются; для биометрии Act оставляет лишь strictly defined circumstances. High risk - это допуск после compliance, а здесь допуска нет вовсе. (RAI_for students_v2, слайд 33)", "usage": {"code": false, "without": "Городской ИТ-отдел полгода готовит документацию на «high-risk систему» социального рейтинга и на юридической проверке узнаёт, что проект в ЕС в принципе запрещён.", "with": "Аналитик на первом совещании относит идею к unacceptable risk, и ресурсы не тратятся на заведомо запрещённый продукт.", "benefit": "Запрещённые идеи отсекаются до старта, а не после."}}, {"q": "Внешний аудит нашёл в кредитной модели признак, дискриминирующий часть клиентов, но в компании никто не может сказать, кто должен это исправлять, и дефект висит месяцами. Какой элемент Responsible AI, по лекции, здесь отсутствует?", "options": ["Red teaming - симуляция атак для поиска уязвимостей", "Transparency - раскрытие логики модели затронутым клиентам", "Accountability - ясная схема ответственных за исправление", "Monitoring - непрерывное отслеживание метрик модели в проде"], "correct": 2, "explain": "AI auditing, по лекции, не только находит уязвимости, но и подчёркивает accountability: при обнаружении дефекта должна быть ясная рамка, определяющая, кто отвечает за его устранение, и ответственные должны быть held accountable. Аудит уже сделан; monitoring и red teaming лишь ещё раз выявили бы дефект, а не назначили исполнителя. (RAI_for students_v2, слайд 68)", "usage": {"code": false, "without": "Аудиторский отчёт с найденной дискриминацией пересылают по трём отделам, каждый считает, что это «не его модель», и через год регулятор выписывает штраф.", "with": "В governance-документе заранее записано, кто владелец каждой модели и кто в какой срок закрывает находки аудита, и дефект уходит в работу в день получения отчёта.", "benefit": "Каждая находка аудита имеет имя ответственного и срок."}}, {"q": "Компания написала AI playbook в 2022 году и с тех пор его не трогала, хотя за это время вступил в силу EU AI Act и в отделах появились новые генеративные инструменты. Какое положение шага 2 «Build an AI Playbook» нарушено?", "options": ["Playbook должен пересматриваться, а не быть статичным документом", "Playbook должен согласовывать AI с бизнес-целями и этикой", "Playbook должен встраивать AI в существующие governance-рамки", "Playbook должен строить доверие к AI у клиентов и регуляторов"], "correct": 0, "explain": "Шаг 2 описывает playbook как план интеграции AI в существующие governance-рамки с согласованием AI с бизнес-целями и этикой, обеспечением regulatory compliance и построением доверия - и прямо предупреждает: «this is not a static document». В сценарии нарушено именно это: документ 2022 года не пересматривался, хотя изменились и регуляторика, и классы инструментов. Остальные три варианта - тоже положения шага 2, но об их нарушении в условии ничего не сказано. (RAI_for students_v2, слайды 48-49)", "usage": {"code": false, "without": "Юрист компании уверен, что «у нас есть AI playbook», а на проверке выясняется, что в нём нет ни слова о категориях риска AI Act и о генеративных моделях, которыми уже пользуются все отделы.", "with": "В playbook заложен цикл пересмотра: при каждом новом регуляторном акте или новом классе инструментов документ обновляется, и compliance не отстаёт от практики.", "benefit": "Playbook отражает сегодняшнюю реальность, а не год своего написания."}}, {"q": "Государственный орган ищет методику оценки влияния AI-системы на права человека, демократию и верховенство закона, а параллельно хочет распределить роли и ответственность за AI внутри ведомства. Какие voluntary guidelines из лекции подходят под эти две задачи?", "options": ["OECD AI Principles для оценки, Alan Turing workbooks для ролей", "Asilomar AI principles для оценки, FTC consumer guidelines для ролей", "GPAI network для оценки, UNESCO recommendations для ролей", "HUDERIA для оценки, NIST AI Risk Management Framework для ролей"], "correct": 3, "explain": "HUDERIA от Committee on AI Совета Европы - это именно Human rights, Democracy and Rule of law impact assessment, а NIST AI RMF в лекции описан как guideline для распределения ролей, ответственности и полномочий. Asilomar - один из самых ранних наборов принципов, а FTC сосредоточена на защите потребителей и безопасности продуктов. (RAI_for students_v2, слайд 36)", "usage": {"code": false, "without": "Чиновник берёт первый попавшийся набор принципов, получает красивую декларацию и ни одной методики, как оценить эффект конкретной системы на права граждан.", "with": "Он знает карту guidelines: для оценки воздействия на права и демократию берёт HUDERIA, для ролей и ответственности - NIST AI RMF, и помнит, что «no one size fits all».", "benefit": "Под каждую задачу governance подбирается свой инструмент, а не общий лозунг."}}, {"q": "Бюджет DS-проекта - 200 человеко-часов. Команда запланировала 90 ч на подготовку данных и 110 ч на моделирование. Рассчитайте норму по принципу Data Centric AI из лекции и определите, как скорректировать план.", "options": ["Норма 100 ч данные и 100 ч моделирование, перенести 10 ч в подготовку данных", "Норма 40 ч данные и 160 ч моделирование, перенести 50 ч в моделирование", "Норма 160 ч данные и 40 ч моделирование, перенести 70 ч в подготовку данных", "Норма 180 ч данные и 20 ч моделирование, перенести 90 ч в подготовку данных"], "correct": 2, "explain": "Шаг 1: Data Centric AI отводит 80% усилий на Data Preparation и 20% на Modelling, значит норма 200 × 0,8 = 160 ч на данные и 200 × 0,2 = 40 ч на моделирование. Шаг 2: отклонение плана: 160 − 90 = 70 ч не хватает данным, 110 − 40 = 70 ч переоценено моделирование. Шаг 3: перенести 70 ч из моделирования в подготовку данных; вариант 40/160 - перепутанные доли, характерные для model-centric мышления (RAI, слайд 5).", "usage": {"code": false, "without": "Тимлид делит бюджет пополам между данными и моделью; к концу проекта модель отлично затюнена, но обучена на грязных данных и не работает в проде.", "with": "Тимлид с самого начала закладывает 80% часов на подготовку данных и защищает эту цифру перед заказчиком со ссылкой на Data Centric AI.", "benefit": "План проекта сразу отражает, где реально рождается качество модели."}}, {"q": "Компания аудитирует пять AI-систем: спам-фильтр почты, чат-бот поддержки клиентов, автоматическую оценку экзаменов в вузе, скрининг резюме кандидатов и государственный social scoring. По уровням риска EU AI Act подсчитайте: сколько систем требуют strict compliance до вывода на рынок, сколько запрещены, сколько требуют только transparency и сколько используются свободно.", "options": ["2 strict compliance, 1 запрещена, 1 transparency, 1 свободно", "3 strict compliance, 0 запрещено, 1 transparency, 1 свободно", "3 strict compliance, 1 запрещена, 0 transparency, 1 свободно", "1 strict compliance, 1 запрещена, 1 transparency, 2 свободно"], "correct": 0, "explain": "Шаг 1: спам-фильтр - minimal risk, чат-бот - limited risk, оценка экзаменов - high risk как education, скрининг кандидатов - high risk как employment, social scoring - unacceptable risk. Шаг 2: strict compliance до рынка нужен только high risk, то есть 2 системам. Шаг 3: запрещена 1 система, transparency нужна 1 чат-боту, свободно используется 1 спам-фильтр; вариант с 3 high и 0 запрещённых ошибочно относит social scoring к high risk, хотя Act его запрещает (RAI, слайд 33).", "usage": {"code": false, "without": "Продакт запускает AI-скоринг кандидатов как обычную фичу и узнаёт о требованиях compliance только после жалобы регулятора.", "with": "Продакт перед стартом раскладывает системы по уровням AI Act и закладывает время на strict compliance для education и employment.", "benefit": "Регуляторные требования попадают в план до релиза, а не после штрафа."}}, {"q": "Система работает на уровне ML pipeline automation for CT. Performance monitoring зафиксировал падение точности модели, и одновременно в feature store поступил новый батч размеченных данных. Определите, какие триггеры сработали, с какой стадии стартует автоматический пайплайн и куда попадает его результат.", "options": ["Триггеры on schedule и concept drift, старт с data analysis, итог в source repository для code review команды", "Триггеры performance degradation и new training data, старт с model training, итог в model registry и затем CD: model serving", "Триггеры on demand и new training data, старт с model evaluation, итог в ML metadata store для трекинга", "Триггеры performance degradation и new training data, старт с data extraction, итог в model registry и CD: model serving"], "correct": 3, "explain": "Шаг 1: из пяти триггеров слайда сработали on model performance degradation и on availability of new training data; on demand, on schedule и concept drift в условии не фигурируют. Шаг 2: автоматический пайплайн стартует с data extraction - batch fetching из feature store, затем data validation, data preparation, model training, model evaluation и model validation; data analysis - ручной шаг экспериментальной части. Шаг 3: trained model попадает в model registry, откуда CD: model serving разворачивает prediction service, а performance monitoring замыкает цикл на trigger; source repository хранит код, ML metadata store - метаданные запусков, а не модель (RAI, слайд 13).", "usage": {"code": false, "without": "Инженер после падения метрик вручную перезапускает обучение, минуя извлечение и валидацию данных, и деплоит модель, обученную на битом батче.", "with": "Инженер знает, что триггер degradation запустит полный CT-пайплайн от data extraction и валидации данных до model validation, и просто проверяет model registry на новую версию.", "benefit": "Переобучение идёт по проверенному маршруту без ручных обходов."}}, {"q": "В организации 300 сотрудников, политики использования generative AI пока нет. По данным исследований из лекции оцените: сколько сотрудников хотят больше узнать об использовании AI в профессии, сколько уже пользовались generative AI, на каком шаге 8-Step Journey закрывается пробел в AI literacy и какой pitfall грозит организации.", "options": ["60 хотят учиться, около 147 пользовались, AI literacy на шаге 4, грозит Shadow AI", "240 хотят учиться, около 147 пользовались, AI literacy на шаге 4, грозит Shadow AI", "240 хотят учиться, около 49 пользовались, AI literacy на шаге 2, грозит Shadow AI", "240 хотят учиться, около 147 пользовались, AI literacy на шаге 4, грозит AI shopping"], "correct": 1, "explain": "Шаг 1: по лекции 4 из 5 людей хотят больше узнать об использовании AI в профессии, 300 × 4/5 = 240; вариант 60 - это оставшаяся пятая часть. Шаг 2: по исследованию Salesforce около 49% людей пользовались generative AI, 300 × 0,49 ≈ 147 человек, а не 49 - проценты перепутаны с числом. Шаг 3: инвестиции в AI literacy через обучение относятся к шагу 4 - leverage internal support mechanisms, а не к шагу 2 build an AI Playbook. Шаг 4: использование AI без явного одобрения и надзора организации - это Shadow AI; AI shopping - выбор решений без due diligence по этике и пригодности (RAI, слайды 51 и 64).", "usage": {"code": false, "without": "HR считает, что генеративным AI пользуются единицы, и откладывает политику; тем временем половина сотрудников сливает данные клиентов в публичные чат-боты.", "with": "HR по цифрам лекции оценивает масштаб: около 150 сотрудников уже пользовались generative AI, и запускает AI literacy и правила использования как часть шага 4.", "benefit": "Масштаб Shadow AI оценивается заранее, а не после утечки."}}, {"q": "Четыре инициативы из плана RAI перечислены вразнобой: внедрить пирамиду governance-инструментов и проверить готовность через AI-RQ; стать BCorp; создать Ethics Board; провести консультации с policymakers и community members. Сопоставьте каждую с шагом 8-Step Journey, расставьте их в порядке шагов и назовите шаг, который идёт после них.", "options": ["Консультации с policymakers, Ethics Board, BCorp, пирамида инструментов; далее build an AI Playbook", "Ethics Board, BCorp, консультации с policymakers, пирамида инструментов; далее identify key stakeholders", "Ethics Board, консультации с policymakers, BCorp, пирамида инструментов; далее monitor, audit and evaluate", "BCorp, Ethics Board, консультации с policymakers, пирамида инструментов; далее monitor, audit and evaluate"], "correct": 2, "explain": "Шаг 1: Ethics Board - internal support mechanisms, шаг 4; policymakers и community members - multi-stakeholder approach для external stakeholders, шаг 5; BCorp - additional responsible behavior indicators, шаг 6; пирамида и AI-RQ - implement governance tools, шаг 7. Шаг 2: порядок 4 → 5 → 6 → 7. Шаг 3: после шага 7 идёт шаг 8 - monitor, audit, and evaluate AI governance; вариант с policymakers первыми путает шаг 5 с шагом 3, где стейкхолдеров в целом идентифицируют и вовлекают, а build an AI Playbook - это шаг 2, он не может идти после шага 7 (RAI, слайды 47, 51-55).", "usage": {"code": false, "without": "Компания получает BCorp-статус до того, как у неё появился хоть один внутренний Ethics Board, и внешние консультации остаются формальностью.", "with": "Руководитель строит roadmap по 8 шагам: сначала внутренние механизмы, потом внешние стейкхолдеры, потом индикаторы и инструменты, и закладывает аудит в конце.", "benefit": "Инициативы RAI идут в логичной последовательности, а не по принципу «что проще показать»."}}, {"q": "Компания внедрила систему управления AI по ISO/IEC 42001 и хочет оценить как положительные, так и отрицательные эффекты своей AI-системы для местного сообщества. Определите тип оценки, guidance-документ, согласованный с 42001, и пример готового инструмента этого типа из лекции.", "options": ["Impact assessment, ISO/IEC 42005, шаблон Microsoft Responsible AI Impact Assessment", "Risk assessment, NIST AI RMF с Playbook, self-assessment tool французского CNIL", "Impact assessment, ISO/IEC 42001 как собственная методика, OECD AI Risk Evaluation Framework", "Risk assessment, ISO/IEC 42005, AI Impact Assessment голландского правительства"], "correct": 0, "explain": "Шаг 1: risk assessment смотрит только на negative impact, а impact assessment - на positive и negative, значит нужен impact assessment. Шаг 2: в поддержку ISO/IEC 42001 разработан ISO/IEC 42005 с guidance по impact assessments; сам 42001 - стандарт на систему управления AI, а не методика оценки. Шаг 3: примеры impact-инструментов - Microsoft Responsible AI Impact Assessment Template, AIIA Нидерландов, HRIA; NIST AI RMF и CNIL - инструменты risk assessment (RAI, слайды 61-63).", "usage": {"code": false, "without": "Аналитик берёт NIST AI RMF, чтобы показать сообществу пользу проекта, и получает документ только о рисках, без единого положительного эффекта.", "with": "Аналитик выбирает impact assessment по ISO/IEC 42005 и заполняет шаблон Microsoft, где отдельно фиксируются выгоды и вред для стейкхолдеров.", "benefit": "Инструмент оценки подобран под вопрос, а не под первое знакомое название."}}, {"q": "За квартал в компании произошли четыре события: a - дашборд показал рост ошибок модели для одной группы пользователей; b - команда сравнила fairness-метрики и результаты опроса пользователей с установленными критериями; c - внешняя фирма проверила соответствие системы GDPR и внутренним политикам; d - по итогам проверки назначен ответственный за исправление. Определите практику для каждого события и укажите, какая из них в лекции описана как often third-party, а какая требует qualitative judgments.", "options": ["a monitoring, b evaluating, c monitoring, d auditing; third-party это monitoring, qualitative это evaluating", "a monitoring, b auditing, c evaluating, d accountability; third-party это evaluating, qualitative это auditing", "a evaluating, b monitoring, c auditing, d accountability; third-party это auditing, qualitative это monitoring", "a monitoring, b evaluating, c auditing, d accountability; third-party это auditing, qualitative это evaluating"], "correct": 3, "explain": "Шаг 1: ongoing observation в real-world - monitoring; оценка против established criteria с fairness и опросом - evaluating; formal review на compliance с legal requirements и policies - auditing; определение ответственного за исправление - accountability. Шаг 2: often third-party в лекции - именно auditing. Шаг 3: qualitative judgments вроде user experience требует evaluating; вариант, где b - auditing, путает внутреннюю оценку по критериям с формальной внешней проверкой (RAI, слайды 66-68).", "usage": {"code": false, "without": "Команда называет внутренний опрос пользователей «аудитом» и отчитывается перед регулятором, который ждёт формальную третью сторону.", "with": "Команда разводит практики: мониторинг на дашборде, evaluating по критериям внутри, аудит внешней фирмой, и по итогам аудита назначает ответственного.", "benefit": "Отчётность по RAI выстроена так, как её ожидают регулятор и руководство."}}, {"q": "Даны шесть элементов: AIGP от IAPP, рекомендации UNESCO по этичному AI, NIST AI RMF, guidelines FTC, стандарты CEN/CENELEC и методология HUDERIA Совета Европы. Распределите их по географии - Global, United States, Europe - как на слайде примеров, а HUDERIA по организации, которая её выпустила, и по типу фреймворка из лекции: voluntary guidelines, standards, certifications. Выберите строку с верными счётчиками.", "options": ["Global 3, США 1, Европа 2; guidelines 4, standards 1, certifications 1", "Global 2, США 2, Европа 2; guidelines 4, standards 1, certifications 1", "Global 2, США 2, Европа 2; guidelines 5, standards 0, certifications 1", "Global 1, США 3, Европа 2; guidelines 5, standards 1, certifications 0"], "correct": 1, "explain": "Шаг 1: на слайде примеров Global - AIGP и UNESCO; United States - NIST AI RMF и FTC; Europe - CEN/CENELEC; HUDERIA на этом слайде нет, но она выпущена Council of Europe, значит Europe, итого 2/2/2. Шаг 2: CEN/CENELEC - standards, AIGP - certification через IAPP, а UNESCO, FTC, NIST AI RMF и HUDERIA перечислены среди voluntary guidelines, итого 4/1/1. Вариант 3/1/2 ошибочно относит NIST к global, хотя это национальный уровень США (RAI, слайды 36-38, 40).", "usage": {"code": false, "without": "Консультант обещает европейскому клиенту «сертификацию по NIST AI RMF», хотя это американские добровольные guidelines без сертификата.", "with": "Консультант раскладывает фреймворки по типу и географии и предлагает клиенту CEN/CENELEC как стандарт, а AIGP как сертификацию специалистов.", "benefit": "Клиент получает подходящий по региону и типу инструмент, а не громкое имя."}}, {"q": "Чат-бот банка сообщил клиенту о несуществующей комиссии, клиент подал жалобу, история попала в прессу. По классификации рисков из лекции определите категорию первичного явления, вторичные риски, рекомендуемые меры и уровень риска чат-бота по EU AI Act.", "options": ["Security and operational risk; далее reputational и financial; меры thorough testing, compliance и дообучение модели; уровень high", "Business risk; далее privacy и legal; меры ethical standards, compliance и watermarking модели; уровень unacceptable", "Security and operational risk; далее reputational и legal; меры thorough testing, ethical standards, compliance; уровень limited", "Privacy risk; далее financial и reputational; меры переобучение модели на свежих данных и мониторинг; уровень limited"], "correct": 2, "explain": "Шаг 1: выдуманная комиссия - hallucination, которую лекция относит к security and operational risks. Шаг 2: такие сбои несут enormous reputational and legal consequences, то есть вторичные риски - reputational и legal, а не privacy. Шаг 3: слайд называет меры thorough testing, ethical standards и compliance; чат-бот по AI Act - limited risk с обязанностью transparency, а не high risk, который относится к критическим секторам вроде education (RAI, слайды 29, 30, 33).", "usage": {"code": false, "without": "Команда после инцидента просто дообучает модель и считает вопрос закрытым, а юридический и репутационный шлейф разбирается уже без неё.", "with": "Команда классифицирует инцидент как operational risk, запускает thorough testing и compliance-проверку и убеждается, что пользователь предупреждён о работе с AI.", "benefit": "Инцидент разбирается по всей цепочке рисков, а не как чисто технический баг."}}, {"q": "Описание процесса в компании: data scientist вручную запускает ноутбук и экспортирует обученную модель, DevOps-инженер вручную деплоит её как REST API; мониторинга производительности нет. Определите уровень зрелости MLOps по лекции, что нужно добавить для перехода к continuous training и что отличает следующий за ним уровень.", "options": ["Уровень manual process; добавить automated pipeline с триггерами и performance monitoring; далее CI/CD компонентов пайплайна", "Уровень ML pipeline automation for CT, так как есть model registry; добавить feature store; далее orchestrated experiment", "Уровень manual process; добавить REST API для online predictions и model registry; далее автоматическое переобучение модели по расписанию", "Уровень CI/CD and automated ML pipeline; добавить performance monitoring и feature store; далее ручные experiment steps"], "correct": 0, "explain": "Шаг 1: ручные experiment steps и ручной деплой без automated pipeline - это manual process; model registry и REST API есть уже на этом уровне, поэтому они не признак CT. Шаг 2: для ML pipeline automation for CT нужны automated pipeline, триггеры вроде new data и performance degradation и performance monitoring, замыкающий цикл. Шаг 3: следующий уровень добавляет CI: build, test and package pipeline components и CD: pipeline deployment, то есть CI/CD самого пайплайна, а не просто переобучение (RAI, слайды 12-15).", "usage": {"code": false, "without": "Архитектор докладывает, что у компании «уже есть MLOps», потому что модель лежит в реестре и деплоится как API, а переобучение запускается вручную раз в квартал.", "with": "Архитектор честно ставит уровень manual process и планирует automated pipeline с триггерами и мониторингом, затем CI/CD компонентов.", "benefit": "Roadmap MLOps строится от реального уровня зрелости, а не от названий компонентов."}}];
  const STORAGE_KEY = "learntest_" + TEST_ID;
  const BLOCK_NAMES = [
    "Теоретический фундамент",
    "Углублённая теория",
    "Анализ и проектирование",
    "Синтез и кейсы",
    "Практика и расчёты"
  ];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { current: 0, answers: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Fisher-Yates shuffle (returns a new array, does not mutate input)
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Builds a fresh, randomized copy of QUESTIONS: each question's options are
  // shuffled and its correct-answer index remapped to match. Every other field
  // (q, explain, usage, ...) is carried over untouched. Regenerated on every
  // page load and on every "reset progress" click (never persisted), so the
  // position of the correct answer can't be memorized across attempts.
  function buildShuffledQuestions() {
    return QUESTIONS.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return Object.assign({}, q, {
        options: order.map(i => q.options[i]),
        correct: order.indexOf(q.correct)
      });
    });
  }

  let state = loadState();
  let SHUFFLED = buildShuffledQuestions();

  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  const blockLabel = document.getElementById("blockLabel");

  function blockOf(idx) { return Math.floor(idx / 10); }

  function render() {
    if (state.current >= QUESTIONS.length) {
      renderResult();
      return;
    }
    resultArea.style.display = "none";
    quizArea.style.display = "block";

    const idx = state.current;
    const q = SHUFFLED[idx];
    const answered = state.answers[idx];

    progressFill.style.width = Math.round((idx / QUESTIONS.length) * 100) + "%";
    progressText.textContent = (idx + 1) + " / " + QUESTIONS.length;
    blockLabel.textContent = "Блок " + (blockOf(idx) + 1) + ": " + BLOCK_NAMES[blockOf(idx)];

    let html = '<div class="card">';
    html += '<div class="question">' + renderQuestion(q.q) + '</div>';
    html += '<div class="qsearch"><a class="iconbtn" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(questionSearchText(q.q)) + '">🔍 Найти в Google</a></div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      let cls = "opt";
      if (answered) {
        cls += " disabled";
        if (i === q.correct) cls += " correct";
        else if (opt === answered.selectedText && !answered.correct) cls += " wrong";
        else cls += " dim";
      }
      html += '<button class="' + cls + '" data-i="' + i + '">' + renderOption(opt) + '</button>';
    });
    html += '</div>';
    html += '<div class="explain' + (answered ? ' show' : '') + '" id="explainBox">' + escapeHtml(q.explain || "") + '</div>';
    if (q.usage) {
      const u = q.usage;
      const wrap = (s) => u.code ? ('<pre>' + escapeHtml(s || "") + '</pre>') : ('<div class="u-text">' + escapeHtml(s || "") + '</div>');
      html += '<div class="usage' + (answered ? ' show' : '') + '">';
      html += '<div class="u-part u-without"><div class="u-label">Без этого</div>' + wrap(u.without) + '</div>';
      html += '<div class="u-part u-with"><div class="u-label">С этим</div>' + wrap(u.with) + '</div>';
      if (u.benefit) html += '<div class="u-benefit">✅ Выгода: ' + escapeHtml(u.benefit) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="nav">';
    html += '<button class="btn secondary" id="prevBtn"' + (idx === 0 ? ' disabled' : '') + '>Назад</button>';
    html += '<button class="btn" id="nextBtn"' + (answered ? '' : ' disabled') + '>' + (idx === QUESTIONS.length - 1 ? 'Завершить' : 'Далее') + '</button>';
    html += '</div>';

    quizArea.innerHTML = html;

    quizArea.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.answers[idx]) return;
        const sel = parseInt(btn.dataset.i, 10);
        state.answers[idx] = { selectedText: q.options[sel], correct: sel === q.correct };
        saveState();
        render();
      });
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      state.current = Math.max(0, idx - 1);
      saveState();
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.current = idx + 1;
      saveState();
      render();
    });
  }

  function renderResult() {
    quizArea.style.display = "none";
    resultArea.style.display = "block";
    progressFill.style.width = "100%";
    progressText.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    blockLabel.textContent = "Тест завершён";

    let correct = 0;
    const blockStats = [0, 0, 0, 0, 0];
    const blockTotals = [0, 0, 0, 0, 0];
    QUESTIONS.forEach((q, i) => {
      const b = blockOf(i);
      blockTotals[b]++;
      if (state.answers[i] && state.answers[i].correct) {
        correct++;
        blockStats[b]++;
      }
    });

    let html = '<div class="card result">';
    html += '<div class="score">' + correct + ' / ' + QUESTIONS.length + '</div>';
    html += '<div style="color:var(--muted); margin-top:6px;">правильных ответов</div>';
    html += '<div class="blockscores">';
    BLOCK_NAMES.forEach((name, i) => {
      html += '<div class="row"><span>' + (i + 1) + '. ' + name + '</span><span>' + blockStats[i] + ' / ' + blockTotals[i] + '</span></div>';
    });
    html += '</div></div>';
    html += '<div class="nav"><button class="btn" id="reviewBtn">Пересмотреть ответы</button></div>';
    resultArea.innerHTML = html;

    document.getElementById("reviewBtn").addEventListener("click", () => {
      state.current = 0;
      render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // Текст вопроса может нести фрагменты кода в тройных кавычках: они идут в
  // <pre> моноширинным шрифтом, остальное — как обычный текст. Вопрос без
  // тройных кавычек рендерится ровно как раньше.
  function renderQuestion(text) {
    const parts = String(text == null ? "" : text).split("```");
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += '<pre class="qcode">' + escapeHtml(parts[i].replace(/^\n/, "").replace(/\n$/, "")) + '</pre>';
      else if (parts[i]) out += escapeHtml(parts[i]);
    }
    return out;
  }

  // Поиск в Google — по тексту вопроса без фрагментов кода.
  function questionSearchText(text) {
    const parts = String(text == null ? "" : text).split("```");
    return parts.filter(function (_, i) { return i % 2 === 0; }).join(" ").replace(/\s+/g, " ").trim();
  }

  // Вариант ответа целиком в обратных кавычках — это код, моноширинно.
  function renderOption(opt) {
    const s = String(opt == null ? "" : opt);
    if (s.length > 2 && s.charAt(0) === "`" && s.charAt(s.length - 1) === "`") {
      return '<code class="optcode">' + escapeHtml(s.slice(1, -1)) + '</code>';
    }
    return escapeHtml(s);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс этого теста?")) {
      state = { current: 0, answers: {} };
      SHUFFLED = buildShuffledQuestions();
      saveState();
      render();
    }
  });

  render();

  // ---- Синхронизация всех тестов (Google Drive), общий модуль sync.js ----
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  const syncModal = document.getElementById("syncModal");
  const syncStatus = document.getElementById("syncStatus");
  const uploadBtn = document.getElementById("syncUploadBtn");
  const downloadBtn = document.getElementById("syncDownloadBtn");

  function setBusy(busy) { uploadBtn.disabled = busy; downloadBtn.disabled = busy; }

  document.getElementById("syncBtn").addEventListener("click", () => {
    if (!window.LTSync || !LTSync.configured()) {
      toast("Синхронизация не настроена: укажите GOOGLE_CLIENT_ID в config.js");
      return;
    }
    syncStatus.textContent = LTSync.hasToken()
      ? "Google уже подключён — вход не потребуется."
      : "Один вход — синхронизируются сразу все тесты.";
    syncModal.classList.add("show");
  });
  document.getElementById("syncCloseBtn").addEventListener("click", () => syncModal.classList.remove("show"));

  uploadBtn.addEventListener("click", () => {
    setBusy(true);
    syncStatus.textContent = "Отправка…";
    LTSync.uploadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Отправка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        toast(failed ? ("Отправлено " + ok + ", ошибок: " + failed) : ("Отправлено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });

  downloadBtn.addEventListener("click", () => {
    if (!confirm("Заменить локальный прогресс всех тестов данными из Drive?")) return;
    setBusy(true);
    syncStatus.textContent = "Загрузка…";
    LTSync.downloadAll({
      onProgress: (d, t) => { syncStatus.textContent = "Загрузка… " + d + "/" + t; },
      onDone: (ok, failed) => {
        setBusy(false);
        state = loadState();
        render();
        toast(failed ? ("Загружено " + ok + ", ошибок: " + failed) : ("Загружено тестов: " + ok));
        syncModal.classList.remove("show");
      },
      onError: (msg) => { setBusy(false); toast(msg); syncStatus.textContent = msg; }
    });
  });
})();
</script>
</body>
</html>
